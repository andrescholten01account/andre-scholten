"Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een onderwijzing van David, voor de koorleider, op de Neginoth.","2":"O God! neem mijn gebed ter ore, en verberg U niet voor mijn smeking.","3":"Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier;","4":"Om het geroep van de vijand, vanwege de beangstiging van de goddeloze; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.","5":"Mijn hart doet mij pijn in mijn binnenste, en verschrikkingen van de dood zijn op mij gevallen.","6":"Vrees en beving komen over mij, en gruwen overdekt mij;","7":"Zodat ik zeg: Och, kreeg ik maar vleugels als een duif! ik zou wegvliegen, waar ik blijven mocht.","8":"Zie, ik zou ver wegzwerven, ik zou overnachten in de woestijn. Sela.","9":"Ik zou mij haasten om te ontkomen, aan de drijvende wind, aan de storm.","10":"Verslind hen, Heere! verdeel hun tong; want ik zie geweld en twist in de stad.","11":"Dag en nacht gaan zij er omheen op haar muren; en ongerechtigheid en overlast is binnen in haar.","12":"Enkel verderf is binnen in haar; en list en bedrog wijkt niet van haar straat.","13":"Want het is geen vijand die mij hoont, anders zou ik het hebben gedragen; het is mijn hater niet die zich tegen mij groot maakt, anders zou ik mij voor hem verborgen hebben.","14":"Maar u bent het, o mens, als van mijn eigen stand, mijn leidsman en mijn bekende!","15":"Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.","16":"Laat de dood hen overvallen als een schuldeiser, laat hen levend in het dodenrijk neerdalen; want boosheden zijn in hun woning, in hun binnenste.","17":"Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.","18":"'s Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen.","19":"Hij heeft mijn ziel in vrede verlost van de strijd tegen mij; want met velen zijn zij tegen mij geweest.","20":"God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.","21":"Hij slaat zijn handen aan hen die vrede met Hem hadden; hij ontheiligt Zijn verbond.","22":"Zijn mond is gladder dan boter, maar zijn hart is oorlog; zijn woorden zijn zachter dan olie, maar ze zijn blote zwaarden.","23":"Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.","24":"Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen."},"SV":{"1":"Een onderwijzing van David, voor den opperzangmeester, op de Neginoth.","2":"O God! neem mijn gebed ter oren, en verberg U niet voor mijn smeking.","3":"Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier;","4":"Om den roep des vijands, vanwege de beangstiging des goddelozen; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.","5":"Mijn hart smart in het binnenste van mij, en verschrikkingen des doods zijn op mij gevallen.","6":"Vrees en beving komt mij aan, en gruwen overdekt mij;","7":"Zodat ik zeg: Och, dat mij iemand vleugelen, als ener duive, gave! ik zou henenvliegen, waar ik blijven mocht.","8":"Ziet, ik zou ver wegzwerven, ik zou vernachten in de woestijn. Sela.","9":"Ik zou haasten, dat ik ontkwame, van den drijvenden wind, van den storm.","10":"Verslind hen, Heere! deel hun tong; want ik zie wrevel en twist in de stad.","11":"Dag en nacht omringen zij haar op haar muren; en ongerechtigheid en overlast is binnen in haar.","12":"Enkel verderving is binnen in haar; en list en bedrog wijkt niet van haar straat.","13":"Want het is geen vijand, *die* mij hoont, anders zou ik het hebben gedragen; het is mijn hater niet, *die* zich tegen mij groot maakt, anders zou ik mij voor hem verborgen hebben.","14":"Maar gij zijt het, o mens, als van mijn waardigheid, mijn leidsman en mijn bekende!","15":"Wij, die te zamen in zoetigheid heimelijk raadpleegden; wij wandelden in gezelschap ten huize Gods.","16":"Dat hun de dood als een schuldeiser overvalle , dat zij als levend ter helle nederdalen; want boosheden zijn in hun woning, in het binnenste van hen.","17":"Mij aangaande, ik zal tot God roepen, en de HEERE zal mij verlossen.","18":"Des avonds, en des morgens, en des middags zal ik klagen en getier maken; en Hij zal mijn stem horen.","19":"Hij heeft mijn ziel in vrede verlost van den strijd tegen mij; want met menigte zijn zij tegen mij geweest.","20":"God zal horen, en zal hen plagen, als die van ouds zit, Sela; dewijl bij hen gans geen verandering is, en zij God niet vrezen.","21":"Hij slaat zijn handen aan degenen, die vrede met Hem hadden; hij ontheiligt Zijn verbond.","22":"Zijn mond is gladder dan boter, maar zijn hart is krijg; zijn woorden zijn zachter dan olie, maar dezelve zijn blote zwaarden.","23":"Werp uw zorg op den HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten, dat de rechtvaardige wankele.","24":"Maar Gij, o God! zult die doen nederdalen in den put des verderfs; de mannen des bloeds en bedrogs zullen hun dagen niet ter helft brengen; ik, daarentegen, zal op U vertrouwen."},"KJV":{"1":"[[To the chief Musician on Neginoth, Maschil, *A Psalm* of David.]] Give ear to my prayer, O God; and hide not thyself from my supplication.","2":"[[To the chief Musician on Neginoth, Maschil, *A Psalm* of David.]] Give ear to my prayer, O God; and hide not thyself from my supplication.","3":"Attend unto me, and hear me: I mourn in my complaint, and make a noise;","4":"Because of the voice of the enemy, because of the oppression of the wicked: for they cast iniquity upon me, and in wrath they hate","5":"My heart is sore pained within me: and the terrors of death are fallen","6":"Fearfulness and trembling are come upon me, and horror hath overwhelmed","7":"And I said, Oh that I had wings like a dove! *for then* would I fly away, and be at rest.","8":"Lo, *then* would I wander far off, *and* remain in the wilderness. Selah.","9":"I would hasten my escape from the windy storm *and* tempest.","10":"Destroy, O Lord, *and* divide their tongues: for I have seen violence and strife in the city.","11":"Day and night they go about it upon the walls thereof: mischief also and sorrow *are* in the midst","12":"Wickedness *is* in the midst thereof: deceit and guile depart not from her streets.","13":"For *it was* not an enemy *that* reproached me; then I could have borne *it*: neither *was it* he that hated me *that* did magnify *himself* against me; then I would have hid","14":"But *it was* thou, a man mine equal, my guide, and mine acquaintance.","15":"We took sweet counsel together, *and* walked unto the house of God in company.","16":"Let death seize upon them, *and* let them go down quick into hell: for wickedness *is* in their dwellings, *and* among","17":"As for me, I will call upon God; and the LORD shall save","18":"Evening, and morning, and at noon, will I pray, and cry aloud: and he shall hear my voice.","19":"He hath delivered my soul in peace from the battle *that was* against me: for there were many","20":"God shall hear, and afflict them, even he that abideth of old. Selah. Because they have no changes, therefore they fear not God.","21":"He hath put forth his hands against such as be at peace with him: he hath broken his covenant.","22":"*The words* of his mouth were smoother than butter, but war *was* in his heart: his words were softer than oil, yet *were* they drawn swords.","23":"Cast thy burden upon the LORD, and he shall sustain thee: he shall never suffer the righteous to be moved.","24":"But thou, O God, shalt bring them down into the pit of destruction: bloody and deceitful men shall not live out half their days; but I will trust"}},"tsk":{"2":[{"kopje":"neem","refs":["Ps 5:2","Ps 17:1","Ps 64:2","Ps 80:2","Ps 84:9","1 Petr 3:12"]},{"kopje":"verberg","refs":["Ps 28:1","Ps 80:5","Ps 143:7","Klaagl 3:8"]}],"3":[{"kopje":"ik bedrijf misbaar","refs":["Ps 13:2","Ps 13:3","Ps 32:3","Ps 38:7","Ps 43:2","Ps 102:10","Ps 102:11","Jes 38:14"]}],"4":[{"kopje":"beangstiging","refs":["Ps 12:6","Ps 54:5","Ps 73:8","Klaagl 3:34-36"]},{"kopje":"want zij","refs":["Ps 27:12","Ps 35:11","2 Sam 15:3","2 Sam 16:7","2 Sam 16:8","2 Sam 19:19","Matt 26:59"]}],"5":[{"kopje":"Mijn","refs":["Ps 6:4","Ps 69:21","Ps 88:4","Ps 102:4-6","Matt 26:37","Matt 26:38","Mark 14:33","Mark 14:34","Joh 12:27","2 Kor 1:8-10"]},{"kopje":"verschrikkingen","refs":["Ps 18:5","Ps 18:6","Ps 116:3","Jes 38:10-13","Hebr 5:7"]}],"6":[{"kopje":"Vrees","refs":["Ps 119:120","2 Sam 15:14","Job 6:4","Job 23:15","Job 23:16"]},{"kopje":"gruwen","refs":["Ps 42:7","Ps 61:3","Ps 88:16","Ps 88:17","Luk 22:44"]}],"9":[{"kopje":"de storm","refs":["Ps 18:5","Jes 17:12","Jes 17:13","Matt 7:25-27"]}],"10":[{"kopje":"verdeel","refs":["Gen 11:7-9","2 Sam 15:31","2 Sam 17:1-14","Joh 7:45-53","Hand 23:6-10"]},{"kopje":"ik zie","refs":["Jer 6:7","Jer 23:14","Matt 23:37","Matt 23:38"]}],"11":[{"kopje":"Dag","refs":["Ps 59:7","Ps 59:15","Ps 59:16","1 Sam 19:11","2 Sam 17:1","2 Sam 17:2","Hos 7:6","Micha 2:1","Micha 2:2","Joh 18:3","Joh 18:28","Hand 9:24"]},{"kopje":"overlast","refs":["2 Sam 16:21","2 Sam 1 pan> upon me, and in <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> they hate","5":"My <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is sore <span class=\"wl wl-kjv\" data-code=\"H2342\">pained</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">within</span> me: and the <span class=\"wl wl-kjv\" data-code=\"H367\">terrors</span> of <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> are fallen","6":"<span class=\"wl wl-kjv\" data-code=\"H3374\">Fearfulness</span> and <span class=\"wl wl-kjv\" data-code=\"H7461\">trembling</span> are <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon me, and <span class=\"wl wl-kjv\" data-code=\"H6427\">horror</span> hath overwhelmed","7":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Oh <span class=\"wl wl-kjv\" data-code=\"H5414\">that</span> I had <span class=\"wl wl-kjv\" data-code=\"H83\">wings</span> like a <span class=\"wl wl-kjv\" data-code=\"H3123\">dove!</span> for then would I fly <span class=\"wl wl-kjv\" data-code=\"H5774\">away,</span> and be at rest.","8":"Lo, then would I <span class=\"wl wl-kjv\" data-code=\"H5074\">wander</span> far <span class=\"wl wl-kjv\" data-code=\"H7368\">off,</span> and <span class=\"wl wl-kjv\" data-code=\"H3885\">remain</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness.</span> Selah.","9":"I would <span class=\"wl wl-kjv\" data-code=\"H2363\">hasten</span> my <span class=\"wl wl-kjv\" data-code=\"H4655\">escape</span> from the <span class=\"wl wl-kjv\" data-code=\"H7307\">windy</span> <span class=\"wl wl-kjv\" data-code=\"H5584\">storm</span> and tempest.","10":"<span class=\"wl wl-kjv\" data-code=\"H1104\">Destroy,</span> O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> and <span class=\"wl wl-kjv\" data-code=\"H6385\">divide</span> their <span class=\"wl wl-kjv\" data-code=\"H3956\">tongues:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> and <span class=\"wl wl-kjv\" data-code=\"H7379\">strife</span> in the city.","11":"<span class=\"wl wl-kjv\" data-code=\"H3119\">Day</span> and <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> they go <span class=\"wl wl-kjv\" data-code=\"H5437\">about</span> it upon the <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> thereof: <span class=\"wl wl-kjv\" data-code=\"H205\">mischief</span> also and <span class=\"wl wl-kjv\" data-code=\"H5999\">sorrow</span> are in the midst","12":"<span class=\"wl wl-kjv\" data-code=\"H1942\">Wickedness</span> is in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> thereof: <span class=\"wl wl-kjv\" data-code=\"H8496\">deceit</span> and <span class=\"wl wl-kjv\" data-code=\"H4820\">guile</span> <span class=\"wl wl-kjv\" data-code=\"H4185\">depart</span> not from her streets.","13":"For it was not an <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> that <span class=\"wl wl-kjv\" data-code=\"H2778\">reproached</span> me; then I could have <span class=\"wl wl-kjv\" data-code=\"H5375\">borne</span> it: neither was it he that <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> me that did <span class=\"wl wl-kjv\" data-code=\"H1431\">magnify</span> himself against me; then I would have hid","14":"But it was thou, a <span class=\"wl wl-kjv\" data-code=\"H582\">man</span> mine <span class=\"wl wl-kjv\" data-code=\"H6187\">equal,</span> my <span class=\"wl wl-kjv\" data-code=\"H441\">guide,</span> and mine acquaintance.","15":"We took <span class=\"wl wl-kjv\" data-code=\"H4985\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H5475\">counsel</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in company.","16":"Let <span class=\"wl wl-kjv\" data-code=\" "onderwijzing","tekst":"Als op den voorgaanden psalm."}],"2":[{"catchword":"onderwijzing","tekst":"Als op den voorgaanden psalm."}],"3":[{"catchword":"klacht","tekst":"Of, gepeins, gebed; hij wil zeggen dat de overdenking van al zijne zwarigheden en gevaren hem onrustig en kermende maakt in het bidden."},{"catchword":"getier","tekst":"Of, rumoer, gerucht."}],"4":[{"catchword":"roep","tekst":"Bebr. stem; dat is, den roep, din mijne vijanden laten gaan, dat zij mij van alle kanten willen omsingelen en in het verdrf brengen. Verg. 2Sa 17:11-14 , 2Sa 17:21 , 2Sa 17:24 ."},{"catchword":"des goddelozen;","tekst":"Dat is, die de goddeloze mij aandoet."},{"catchword":"ongerechtigheid","tekst":"Of, valsheid, ongelijk, onrecht; dat is, zij bezwaren mij met leugens, strooiende van mij allerlei boze stukken, waarmede ik mij dit lijden op den hals gehaald en verdiend heb."}],"5":[{"catchword":"smart","tekst":"Dat is, lijdt smart als van een barende vrouw."},{"catchword":"doods","tekst":"Dat is, dodelijke."}],"7":[{"catchword":"Och","tekst":"Hebr. wie zal mij geven, enz., algemene manier van wensen bij de Hebreën, gelijk boven Psa 14:7 , en Psa 53:7 . Zie Deu 5:29 ."},{"catchword":"vleugelen","tekst":"Hebr. een vleugel, of veder; dat is, vleugelen."},{"catchword":"duive","tekst":"Een zwak en vreesachtig dier, dat zich in de woestijnen en holen zoekt te verbergen, zie Jer 48:28 ."},{"catchword":"waar","tekst":"Hebr. en zou blijven, of wonen; waar slechts veilig kon zijn, wil hij zeggen."}],"8":[{"catchword":"ver","tekst":"Hebr. mij verre afmaken, zwerven; dat is, ver van hier vluchten, heen zwervende, waar hij dan ook zou mogen wezen. Zie gelijke samenvoeging van twee woorden Psa 45:5 ."},{"catchword":"vernachten","tekst":"Of, herbergen, mij onthouden, enz."},{"catchword":"Sela","tekst":"Zie Psa 3:3 ."}],"9":[{"catchword":"Ik zou","tekst":"Hebr. Ik zou de ontkoming haasten voor mij, of mij de ontkoming haasten."},{"catchword":"drijvenden","tekst":"Hebr. wind der drijving, of des storms, des aanvals; dat is, deze vervolging, die mij haastelijk overvalt of dreigt weg te rapen, gelijk een stormwind alles nederwerpt of met zich wegrukt. Verg. 2Sa 15:14 , en 2Sa 17:21 ."}],"10":[{"catchword":"tong;","tekst":"Dat is, hunne spraak. Dit verslinden en verdelen der spraak schijnt te zien op de oordelen Gods, die Hij gevoerd heeft over de bouwers van den toren van Babel, en het rot van Korach; Gen 11:7-8 ; Num 16:32 ."},{"catchword":"wrevel","tekst":"Of, geweld."},{"catchword":"stad","tekst":"Jeruzalem, gelijk sommigen verstaan, duidende den psalm op Absaloms vervolging, wanneer [David in haast gevlucht zijnde] Absalom daar binnen kwam, gruwelijk ten hove huishoudende en raad nemende, hoe men zijnen vader best zou overvallen en verdelgen, waarin de raadslieden niet wel overeenkwamen doordien God hunne tongen verdeelde, 2Sa 17:14 , volgens Davids gebed, hier en 2Sa 15:31 . Anderen verstaan het van Gibea Sauls, waar Saul hofhield, [verg. Psa 59:7 ] , of niet juist van ene stad, maar in het algemeen van de ongebonden goddeloosheid, die overal, zelfs in de steden [waar de beste orde behoorde te zijn] in zwang ging."}],"11":[{"catchword":"omringen","tekst":"Te weten, wrevel en twist omringen de stad; of zij [de bozen] gaan haar [de stad] romdom; dat is, lopende overal om alle kwaad te bedrijven, of mij te achterhalen."}],"12":[{"catchword":"Enkel","tekst":"Hebr. verdervingen; dat is, enkel schenderij, allerlei schade, jammer, verdrukking."}],"13":[{"catchword":"vijand,","tekst":"Versta, geen openbaar vijand, want [wil hij zeggen] was hij mij openbaar vijandig geweest, zo zou het mij zo vreemd niet voorkomen en zo ondragelijk niet vallen."},{"catchword":"groot maakt,","tekst":"Zie Psa 35:26 ."},{"catchword":"verborgen","tekst":"Dat is, mij voor hem hebben kunnen wachten, hem ontgaan, ontwijken."}],"14":[{"catchword":"waardigheid,","tekst":"Hebr. naar mijne schatting, of waarde; dat is, mijns gelijken, geacht of geschat als ik, of dien ik achtte als mijzelven /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
