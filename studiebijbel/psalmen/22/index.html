","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm van David, voor de koorleider, op Aijeleth hasschachar.[1]","2":"Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, *van* de woorden van mijn brullen?","3":"Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte.","4":"Doch U bent heilig, wonende *onder* de lofzangen van Israël.","5":"Op U hebben onze vaders vertrouwd; zij hebben vertrouwd, en U hebt hen uitgeholpen.","6":"Tot U hebben zij geroepen, en zijn uitgered; op U hebben zij vertrouwd, en zijn niet beschaamd geworden.","7":"Maar ik ben een worm en geen man, een smaad van mensen, en veracht van het volk.","8":"Allen die mij zien, bespotten mij; zij steken de lip uit, zij schudden het hoofd en zeggen:","9":"Hij heeft *het* op de HEERE gewenteld, dat Hij hem *nu* uithelpt, dat Hij hem redt, omdat Hij lust aan hem heeft!","10":"U bent het immers,[2] die mij uit de buik hebt uitgetogen; die mij hebt doen vertrouwen, aan de borsten van mijn moeder.","11":"Op U ben ik geworpen vanaf de baarmoeder; vanaf de buik van mijn moeder aan bent U mijn God.","12":"Wees dan niet ver van mij, want benauwdheid is nabij; want er is geen helper.","13":"Veel stieren hebben mij omsingeld, sterke *stieren* van Basan hebben mij omringd.","14":"Zij hebben hun mond tegen mij opgesperd, *als* een verscheurende en brullende leeuw.","15":"Ik ben uitgestort als water, en al mijn beenderen hebben zich vaneen gescheiden; mijn hart is als was, het is gesmolten in het midden van mijn ingewand.","16":"Mijn kracht is verdroogd als een potscherf, en mijn tong kleeft aan mijn gehemelte; en U legt mij in het stof van de dood.","17":"Want honden hebben mij omsingeld; een vergadering van boosdoeners heeft mij omgeven; zij hebben mijn handen en mijn voeten doorgraven.","18":"Al mijn beenderen zou ik kunnen tellen; zij schouwen het aan, zij zien op mij.","19":"Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.","20":"Maar U, HEERE! Wees niet ver; mijn Sterkte! Haast U tot mijn hulp.","21":"Red mijn ziel van het zwaard, mijn eenzame van het geweld van de hond.","22":"Verlos mij uit de muil van de leeuw; en verhoor mij van de hoornen van de eenhoorns.","23":"Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.","24":"U die de HEERE vreest, prijs Hem; al u nageslacht van Jakob, vereer Hem; en ontzie u voor Hem, al u nageslacht van Israël!","25":"Want Hij heeft niet veracht, noch verfoeid de verdrukking van de verdrukte, noch Zijn aangezicht voor hem verborgen; maar Hij heeft gehoord, toen hij tot Hem riep.","26":"Van U zal mijn lof zijn in een grote gemeente; ik zal mijn geloften betalen in de tegenwoordigheid van hen die Hem vrezen.","27":"De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.","28":"Alle einden van de aarde zullen het gedenken, en zich tot de HEERE bekeren; en alle geslachten van de heidenen zullen voor Uw aangezicht aanbidden.","29":"Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen.","30":"Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.","31":"Het nageslacht zal Hem dienen; het zal aan de Heere toegeschreven worden tot in geslachten.","32":"Zij zullen aankomen, en Zijn gerechtigheid verkondigen aan het volk dat geboren wordt, omdat Hij het gedaan heeft."},"SV":{"1":"Een psalm van David, voor den opperzangmeester, op Aijeleth hasschachar.","2":"Mijn God, mijn God! waarom hebt Gij mij verlaten, verre zijnde van mijn verlossing, *van* de woorden mijns brullens?","3":"Mijn God! Ik roep des daags, maar Gij antwoordt niet; en des nachts, en ik heb geen stilte.","4":"Doch Gij zijt heilig, wonende *onder* de lofzangen Israëls.","5":"Op U hebben onze vaders vertrouwd; zij hebben vertrouwd, en Gij hebt hen uitgeholpen.","6":"Tot U hebben zij geroepen, en zijn uitgered; op U hebben zij vertrouwd, en zijn niet beschaamd geworden.","7":"Maar ik ben een worm en geen man, een smaad van mensen, en veracht van het volk.","8":"Allen, die mij zien, bespotten mij; zij steken de lip uit, zij schudden het hoofd, *zeggende*:","9":"Hij heeft *het* op den HEERE gewenteld, dat Hij hem *nu* uithelpe, dat Hij hem redde, dewijl Hij lust aan hem heeft!","10":"Gij zijt het immers, die mij uit den buik hebt uitgetogen; die mij hebt doen vertrouwen, zijnde aan mijner moeders borsten.","11":"Op U ben ik geworpen van de baarmoeder af; van den buik mijner moeder aan zijt Gij mijn God.","12":"Zo wees niet verre van mij, want benauwdheid is nabij; want er is geen helper.","13":"Vele varren hebben mij omsingeld, sterke *stieren* van Basan hebben mij omringd.","14":"Zij hebben hun mond tegen mij opgesperd, *als* een verscheurende en brullende leeuw.","15":"Ik ben uitgestort als water, en al mijn beenderen hebben zich vaneen gescheiden; mijn hart is als was, het is gesmolten in het midden mijns ingewands.","16":"Mijn kracht is verdroogd als een potscherf, en mijn tong kleeft aan mijn gehemelte; en Gij legt mij in het stof des doods.","17":"Want honden hebben mij omsingeld; een vergadering van boosdoeners heeft mij omgeven; zij hebben mijn handen en mijn voeten doorgraven .","18":"Al mijn beenderen zou ik kunnen tellen; zij schouwen het aan, zij zien op mij.","19":"Zij delen mijn klederen onder zich, en werpen het lot over mijn gewaad.","20":"Maar Gij, HEERE! wees niet verre; mijn Sterkte! haast U tot mijn hulp.","21":"Red mijn ziel van het zwaard, mijn eenzame van het geweld des honds.","22":"Verlos mij uit des leeuwen muil; en verhoor mij van de hoornen der eenhoornen.","23":"Zo zal ik Uw Naam mijn broederen vertellen; in het midden der gemeente zal ik U prijzen.","24":"Gij, die den HEERE vreest! prijst Hem; al gij zaad van Jakob! vereert Hem; en ontziet u voor Hem, al gij zaad van Israël!","25":"Want Hij heeft niet veracht, noch verfoeid de verdrukking des verdrukten, noch Zijn aangezicht voor hem verborgen; maar Hij heeft gehoord, als die tot Hem riep.","26":"Van U zal mijn lof zijn in een grote gemeente; ik zal mijn geloften betalen in tegenwoordigheid dergenen, die Hem vrezen.","27":"De zachtmoedigen zullen eten en verzadigd worden; zij zullen den HEERE prijzen, die Hem zoeken; ulieder hart zal in eeuwigheid leven.","28":"Alle einden der aarde zullen het gedenken, en zich tot den HEERE bekeren; en alle geslachten der heidenen zullen voor Uw aangezicht aanbidden.","29":"Want het koninkrijk is des HEEREN, en Hij heerst onder de heidenen.","30":"Alle vetten op aarde zullen eten, en aanbidden; allen, die in het stof nederdalen, zullen voor Zijn aangezicht nederbukken; en die zijn ziel bij het leven niet kan houden.","31":"Het zaad zal Hem dienen; het zal den Heere aangeschreven worden tot in geslachten.","32":"Zij zullen aankomen, en Zijn gerechtigheid verkondigen den volke, dat geboren wordt, omdat Hij het gedaan heeft."},"KJV":{"1":"[[To the chief Musician upon Aijeleth Shahar, A Psalm of David.]] My God, my God, why hast thou forsaken me? *why art thou so* far from helping me, *and from* the words of my roaring?","2":"[[To the chief Musician upon Aijeleth Shahar, A Psalm of David.]] My God, my God, why hast thou forsaken me? *why art thou so* far from helping me, *and from* the words of my roaring?","3":"O my God, I cry in the daytime, but thou hearest not; and in the night season, and am not silent.","4":"But thou *art* holy, *O thou* that inhabitest the praises of Israel.","5":"Our fathers trusted in thee: they trusted, and thou didst deliver","6":"They cried unto thee, and were delivered: they trusted in thee, and were not confounded.","7":"But I *am* a worm, and no man; a reproach of men, and despised of the people.","8":"All they that see me laugh me to scorn: they shoot out the lip, they shake the head,","9":"He trusted on the LORD *that* he would deliver him: let him deliver him, seeing he delighted","10":"But thou *art* he that took me out of the womb: thou didst make me hope *when I was* upon my mother's breasts.","11":"I was cast upon thee from the womb: thou *art* my God from my mother's belly.","12":"Be not far from me; for trouble *is* near; for *there is* none to help.","13":"Many bulls have compassed me: strong *bulls* of Bashan have beset me round.","14":"They gaped upon me *with* their mouths, *as* a ravening and a roaring lion.","15":"I am poured out like water, and all my bones are out of joint: my heart is like wax; it is melted in the midst of my bowels.","16":"My strength is dried up like a potsherd; and my tongue cleaveth to my jaws; and thou hast brought me into the dust of death.","17":"For dogs have compassed me: the assembly of the wicked have inclosed me: they pierced my hands and my feet.","18":"I may tell all my bones: they look *and* stare","19":"They part my garments among them, and cast lots upon my vesture.","20":"But be not thou far from me, O LORD: O my strength, haste thee to help","21":"Deliver my soul from the sword; my darling from the power of the dog.","22":"Save me from the lion's mouth: for thou hast heard me from the horns of the unicorns.","23":"I will declare thy name unto my brethren: in the midst of the congregation will I praise","24":"Ye that fear the LORD, praise him; all ye the seed of Jacob, glorify him; and fear him, all ye the seed of Israel.","25":"For he hath not despised nor abhorred the affliction of the afflicted; neither hath he hid his face from him; but when he cried unto him, he heard.","26":"My praise *shall be* of thee in the great congregation: I will pay my vows before them that fear","27":"The meek shall eat and be satisfied: they shall praise the LORD that seek him: your heart shall live for ever.","28":"All the ends of the world shall remember and turn unto the LORD: and all the kindreds of the nations shall worship before","29":"For the kingdom *is* the LORD'S: and he *is* the governor among the nations.","30":"All *they that be* fat upon earth shall eat and worship: all they that go down to the dust shall bow before him: and none can keep alive his own soul.","31":"A seed shall serve him; it shall be accounted to the Lord for a generation.","32":"They shall come, and shall declare his righteousness unto a people that shall be born, that he hath done"}},"tsk":{"2":[{"kopje":"mijn God","refs":["Ps 31:15-17","Ps 43:1-5","Matt 27:46","Mark 15:34","Luk 24:44"]},{"kopje":"waarom hebt","refs":["Ps 26:9","Ps 37:28","Ps 71:11","1 Sam 12:22","Hebr 13:5"]},{"kopje":"ver","refs":["Ps 22:12","Ps 16:1"]},{"kopje":"verlossing","refs":["Jes 46:13"]},{"kopje":"woorden","refs":["Ps 32:3","Ps 32:4","Ps 38:9","Job 3:24","Jes 59:11","Luk 22:44","Hebr 5:7"]}],"3":[{"kopje":"ik roep","refs":["Ps 42:4","Ps 55:17","Ps 55:18","Ps 88:2","Luk 18:7","1 Tess 3:10","2 Tim 1:3"]},{"kopje":"maar","refs":["Ps 80:5","Klaagl 3:8","Klaagl 3:44"]},{"kopje":"'s nachts","refs":["Luk 6:12","Luk 18:7","Luk 22:41-46"]},{"kopje":"heb geen stilte","refs":["Matt 26:44"]}],"4":[{"kopje":"Doch","refs":["Ps 145:17","Jes 6:3","Openb 4:8"]},{"kopje":"wonende","refs":["Ps 50:23","Ps 65:2","Deut 10:21"]}],"6":[{"kopje":"geroepen","refs":["Ps 99:6","Ps 9 \"wl wl-kjv\" data-code=\"H7837\">Shahar,</span> A <span class=\"wl wl-kjv\" data-code=\"H4210\">Psalm</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.]]</span> My <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> my <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> why hast thou <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> me? why art thou so <span class=\"wl wl-kjv\" data-code=\"H7350\">far</span> from <span class=\"wl wl-kjv\" data-code=\"H3444\">helping</span> me, and from the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of my roaring?","3":"O my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> I <span class=\"wl wl-kjv\" data-code=\"H7121\">cry</span> in the <span class=\"wl wl-kjv\" data-code=\"H3119\">daytime,</span> but thou <span class=\"wl wl-kjv\" data-code=\"H6030\">hearest</span> not; and in the night <span class=\"wl wl-kjv\" data-code=\"H3915\">season,</span> and am not silent.","4":"But thou art <span class=\"wl wl-kjv\" data-code=\"H6918\">holy,</span> O thou that <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitest</span> the <span class=\"wl wl-kjv\" data-code=\"H8416\">praises</span> of Israel.","5":"Our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> <span class=\"wl wl-kjv\" data-code=\"H982\">trusted</span> in thee: they <span class=\"wl wl-kjv\" data-code=\"H982\">trusted,</span> and thou didst deliver","6":"They <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> unto thee, and were <span class=\"wl wl-kjv\" data-code=\"H4422\">delivered:</span> they <span class=\"wl wl-kjv\" data-code=\"H982\">trusted</span> in thee, and were not confounded.","7":"But I am a <span class=\"wl wl-kjv\" data-code=\"H8438\">worm,</span> and no <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> of the people.","8":"All they that <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> me laugh me to <span class=\"wl wl-kjv\" data-code=\"H3932\">scorn:</span> they shoot <span class=\"wl wl-kjv\" data-code=\"H6358\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H8193\">lip,</span> they <span class=\"wl wl-kjv\" data-code=\"H5128\">shake</span> the head,","9":"He <span class=\"wl wl-kjv\" data-code=\"H1556\">trusted</span> on the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that he would <span class=\"wl wl-kjv\" data-code=\"H6403\">deliver</span> him: let him <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> him, seeing he delighted","10":"But thou art he that <span class=\"wl wl-kjv\" data-code=\"H1518\">took</span> me out of the <span class=\"wl wl-kjv\" data-code=\"H990\">womb:</span> thou didst make me <span class=\"wl wl-kjv\" data-code=\"H982\">hope</span> when I was upon my <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> breasts.","11":"I was <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> upon thee from the <span class=\"wl wl-kjv\" data-code=\"H7358\">womb:</span> thou art my <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> from my <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> belly.","12":"Be not <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from me; for <span class=\"wl wl-kjv\" data-code=\"H6869\">trouble</span> is <span class=\"wl wl-kjv\" data-code=\"H7138\">near;</span> for there is none to help.","13":"<span class=\"wl wl-kjv\" data-code=\"H7227\">Many</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bulls</span> have <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> me: <span class=\"wl wl-kjv\" data-code=\"H47\">strong</span> bulls of <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan</span> have beset me round.","14":"They <span class=\"wl wl-kjv\" data-code=\"H6475\">gaped</span> upon me with their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouths,</span> as a <span class=\"wl wl-kjv\" data-code=\"H2963\">ravening</span> and a <span class=\"wl wl-kjv\" data-code=\"H7580\">roaring</span> lion.","15":"I am poured <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> like <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and all my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> are out of <span class=\"wl wl-kjv\" data-code=\"H6504\">joint:</span> my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is like <span class=\"wl wl-kjv\" data-code=\"H1749\">wax;</span> it is <span class=\"wl wl-kjv\" data-code=\"H4549\">melted</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of my bowels.","16":"My <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> is dried <span class=\"wl wl-kjv\" data-code=\"H3001\">up</span> like a <span class=\"wl wl-kjv\" data-code=\"H2789\">potsherd;</span> and my <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">cleaveth</span> to my <span class=\"wl wl-kjv\" data-code=\"H4455\">jaws;</span> and thou hast <span class=\"wl wl-kjv\" data-code=\"H8239\">brought</span> me into the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> of death.","17":"For <span class=\"wl wl-kjv\" data-code=\"H3611\">dogs</span> have <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> me: the <span class=\"wl wl-kjv\" data-code=\"H5712\">assembly</span> of the <span class=\"wl wl-kjv\" data-code=\"H7489\">wicked</span> have <span class=\"wl wl-kjv\" data-code=\"H5362\">inclosed</span> me: they <span class=\"wl wl-kjv\" data-code=\"H3738\">pierced</span> my <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> and my feet.","18":"I may <span class=\"wl wl-kjv\" data-code=\"H5608\">tell</span> all my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones:</span> they <span class=\"wl wl-kjv\" data-code=\"H5027\">look</span> and stare","19":"They <span class=\"wl wl-kjv\" data-code=\"H2505\">part</span> my <span class=\"wl wl-kjv\" data-code=\"H899\">garments</span> among them, and <span class=\"wl wl-kjv\" data-code=\"H5307\">cast</span> <span class=\"wl wl-kjv\" data-code=\"H1486\">lots</span> upon my vesture.","20":"But be not thou <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from me, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> O my <span class=\"wl wl-kjv\" data-code=\"H360\">strength,</span> <span class=\"wl wl-kjv\" data-code=\"H2363\">haste</span> thee to help","21":"<span class=\"wl wl-kjv\" data-code=\"H5337\">Deliver</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> from the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> my <span class=\"wl wl-kjv\" data-code=\"H3173\">darling</span> from the <span class=\"wl wl-kjv\" data-code=\"H3027\">power</span> of the dog.","22":"<span class=\"wl wl-kjv\" data-code=\"H3467\">Save</span> me from the <span class=\"wl wl-kjv\" data-code=\"H738\">lion's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> for thou hast <span class=\"wl wl-kjv\" data-code=\"H6030\">heard</span> me from the <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> of the unicorns.","23":"I will <span class=\"wl wl-kjv\" data-code=\"H5608\">declare</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> unto my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren:</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> will I praise","24":"Ye that <span class=\"wl wl-kjv\" data-code=\"H3373\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> him; all ye the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">glori an> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> before","29":"For the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S:</span> and he is the <span class=\"wl wl-kjv\" data-code=\"H4910\">governor</span> among the nations.","30":"All they that be <span class=\"wl wl-kjv\" data-code=\"H1879\">fat</span> upon <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worship:</span> all they that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> shall <span class=\"wl wl-kjv\" data-code=\"H3766\">bow</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him: and none can keep <span class=\"wl wl-kjv\" data-code=\"H2421\">alive</span> his own soul.","31":"A <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him; it shall be <span class=\"wl wl-kjv\" data-code=\"H5608\">accounted</span> to the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> for a generation.","32":"They shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> his <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> unto a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that shall be <span class=\"wl wl-kjv\" data-code=\"H3205\">born,</span> that he hath done"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
