h":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm van David, voor de koorleider, op Muth-labben.","2":"Ik zal de HEERE loven met mijn hele hart; ik zal al Uw wonderen vertellen.","3":"In U zal ik mij verblijden, en van vreugde opspringen; ik zal Uw Naam zingen, o Allerhoogste!","4":"Omdat mijn vijanden achterwaarts gekeerd, gevallen en vergaan zijn van Uw aangezicht.","5":"Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.","6":"Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.","7":"O vijand! zijn de verwoestingen voleind in eeuwigheid, en hebt u de steden uitgeroeid? Hun gedachtenis is met hen vergaan.","8":"Maar de HEERE zal in eeuwigheid zitten; Hij heeft Zijn troon bereid ten gerichte.","9":"En Hij Zelf zal de wereld richten in gerechtigheid, en de volken oordelen in rechtmatigheden.","10":"En de HEERE zal een Hoog Vertrek zijn voor de verdrukte, een Hoog Vertrek in tijden van benauwdheid.","11":"En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.","12":"Zingt psalmen voor de HEERE, Die te Sion woont; verkondigt onder de volken Zijn daden.","13":"Want Hij zoekt de bloedstortingen, Hij gedenkt daarvan; Hij vergeet het geroep van de ellendigen niet.","14":"Wees mij genadig, HEERE, zie mijn ellende aan, die mijn haters mij aandoen, Gij, Die mij verhoogt uit de poorten van de dood;","15":"Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.","16":"De heidenen zijn gezonken in de groeve, die zij gemaakt hadden; hun voet is gevangen in het net, dat zij verborgen hadden.","17":"De HEERE is bekend geworden; Hij heeft recht gedaan; de goddeloze is verstrikt in het werk van zijn handen! Higgajon, Sela.","18":"De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.","19":"Want de nooddruftige zal niet voor altoos vergeten worden, noch de verwachting van de ellendigen in eeuwigheid verloren zijn.","20":"Sta op, HEERE, laat de mens zich niet versterken; laat de heidenen voor Uw aangezicht geoordeeld worden.","21":"O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela."},"SV":{"1":"Een psalm van David, voor den opperzangmeester, op Muth-labben.","2":"Ik zal den HEERE loven met mijn ganse hart; ik zal al Uw wonderen vertellen.","3":"In U zal ik mij verblijden, en van vreugde opspringen; ik zal Uw Naam psalmzingen, o Allerhoogste!","4":"Omdat mijn vijanden achterwaarts gekeerd, gevallen en vergaan zijn van Uw aangezicht.","5":"Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op den troon, o Rechter, der gerechtigheid.","6":"Gij hebt de heidenen gescholden, den goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.","7":"O vijand! zijn de verwoestingen voleind in eeuwigheid, en hebt gij de steden uitgeroeid? Hunlieder gedachtenis is *met* hen vergaan.","8":"Maar de HEERE zal in eeuwigheid zitten; Hij heeft Zijn troon bereid ten gerichte.","9":"En Hij Zelf zal de wereld richten in gerechtigheid, en de volken oordelen in rechtmatigheden.","10":"En de HEERE zal een Hoog Vertrek zijn voor den verdrukte, een Hoog Vertrek in tijden van benauwdheid.","11":"En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.","12":"Psalmzingt den HEERE, Die te Sion woont; verkondigt onder de volken Zijn daden.","13":"Want Hij zoekt de bloedstortingen, Hij gedenkt derzelve; Hij vergeet het geroep der ellendigen niet.","14":"Wees mij genadig, HEERE, zie mijn ellende aan, van mijne haters *mij aangedaan*, Gij, Die mij verhoogt uit de poorten des doods;","15":"Opdat ik Uw gansen lof in de poorten der dochter van Sion vertelle, dat ik mij verheuge in Uw heil.","16":"De heidenen zijn gezonken in de groeve, *die* zij gemaakt hadden; hunlieder voet is gevangen in het net, dat zij verborgen hadden.","17":"De HEERE is bekend geworden; Hij heeft recht gedaan; de goddeloze is verstrikt in het werk zijner handen! Higgajon, Sela.","18":"De goddelozen zullen terugkeren, naar de hel toe, alle godvergetende heidenen.","19":"Want de nooddruftige zal niet voor altoos vergeten worden, *noch* de verwachting der ellendigen in eeuwigheid verloren zijn.","20":"Sta op, HEERE, laat de mens zich niet versterken; laat de heidenen voor Uw aangezicht geoordeeld worden.","21":"O HEERE! jaag hun vreze aan; laat de heidenen weten, *dat* zij mensen zijn. Sela."},"KJV":{"1":"[[To the chief Musician upon Muthlabben, A Psalm of David.]] I will praise *thee*, O LORD, with my whole heart; I will shew forth all thy marvellous works.","2":"[[To the chief Musician upon Muthlabben, A Psalm of David.]] I will praise *thee*, O LORD, with my whole heart; I will shew forth all thy marvellous works.","3":"I will be glad and rejoice in thee: I will sing praise to thy name, O thou most High.","4":"When mine enemies are turned back, they shall fall and perish at thy presence.","5":"For thou hast maintained my right and my cause; thou satest in the throne judging right.","6":"Thou hast rebuked the heathen, thou hast destroyed the wicked, thou hast put out their name for ever and ever.","7":"O thou enemy, destructions are come to a perpetual end: and thou hast destroyed cities; their memorial is perished with them.","8":"But the LORD shall endure for ever: he hath prepared his throne for judgment.","9":"And he shall judge the world in righteousness, he shall minister judgment to the people in uprightness.","10":"The LORD also will be a refuge for the oppressed, a refuge in times of trouble.","11":"And they that know thy name will put their trust in thee: for thou, LORD, hast not forsaken them that seek","12":"Sing praises to the LORD, which dwelleth in Zion: declare among the people his doings.","13":"When he maketh inquisition for blood, he remembereth them: he forgetteth not the cry of the humble.","14":"Have mercy upon me, O LORD; consider my trouble *which I suffer* of them that hate me, thou that liftest me up from the gates of death:","15":"That I may shew forth all thy praise in the gates of the daughter of Zion: I will rejoice in thy salvation.","16":"The heathen are sunk down in the pit *that* they made: in the net which they hid is their own foot taken.","17":"The LORD is known *by* the judgment *which* he executeth: the wicked is snared in the work of his own hands. Higgaion. Selah.","18":"The wicked shall be turned into hell, *and* all the nations that forget God.","19":"For the needy shall not alway be forgotten: the expectation of the poor shall *not* perish for ever.","20":"Arise, O LORD; let not man prevail: let the heathen be judged in thy sight.","21":"Put them in fear, O LORD: *that* the nations may know themselves *to be but* men. Selah."}},"tsk":{"2":[{"kopje":"loven","refs":["Ps 7:18","Ps 34:2-5","Ps 103:1","Ps 103:2","Ps 145:1-3","Ps 146:1","Ps 146:2","1 Kron 29:10-13","Jes 12:1","Hebr 13:15","Openb 5:9-14"]},{"kopje":"met mijn","refs":["Ps 86:12","Ps 111:1","Ps 138:1","Luk 10:27"]},{"kopje":"vertellen","refs":["Ps 9:15","Ps 51:17","Ps 106:2","1 Kron 16:12","1 Kron 16:24","Jes 43:21","Jes 60:6","Openb 15:3"]}],"3":[{"kopje":"zal ik mij v ing_kjv":{"1":"[[To the chief <span class=\"wl wl-kjv\" data-code=\"H5329\">Musician</span> upon <span class=\"wl wl-kjv\" data-code=\"H4192\">Muthlabben,</span> A <span class=\"wl wl-kjv\" data-code=\"H4210\">Psalm</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.]]</span> I will <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> with my whole <span class=\"wl wl-kjv\" data-code=\"H3820\">heart;</span> I will shew <span class=\"wl wl-kjv\" data-code=\"H5608\">forth</span> all thy marvellous works.","2":"[[To the chief <span class=\"wl wl-kjv\" data-code=\"H5329\">Musician</span> upon <span class=\"wl wl-kjv\" data-code=\"H4192\">Muthlabben,</span> A <span class=\"wl wl-kjv\" data-code=\"H4210\">Psalm</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.]]</span> I will <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> with my whole <span class=\"wl wl-kjv\" data-code=\"H3820\">heart;</span> I will shew <span class=\"wl wl-kjv\" data-code=\"H5608\">forth</span> all thy marvellous works.","3":"I will be <span class=\"wl wl-kjv\" data-code=\"H8055\">glad</span> and <span class=\"wl wl-kjv\" data-code=\"H5970\">rejoice</span> in thee: I will sing <span class=\"wl wl-kjv\" data-code=\"H2167\">praise</span> to thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> O thou most High.","4":"When mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> are <span class=\"wl wl-kjv\" data-code=\"H7725\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H268\">back,</span> they shall <span class=\"wl wl-kjv\" data-code=\"H3782\">fall</span> and <span class=\"wl wl-kjv\" data-code=\"H6\">perish</span> at thy presence.","5":"For thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">maintained</span> my <span class=\"wl wl-kjv\" data-code=\"H4941\">right</span> and my <span class=\"wl wl-kjv\" data-code=\"H1779\">cause;</span> thou <span class=\"wl wl-kjv\" data-code=\"H3427\">satest</span> in the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judging</span> right.","6":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H1605\">rebuked</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H6\">destroyed</span> the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> thou hast put <span class=\"wl wl-kjv\" data-code=\"H4229\">out</span> their <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> and ever.","7":"O thou <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> <span class=\"wl wl-kjv\" data-code=\"H2723\">destructions</span> are come to a <span class=\"wl wl-kjv\" data-code=\"H5331\">perpetual</span> <span class=\"wl wl-kjv\" data-code=\"H8552\">end:</span> and thou hast <span class=\"wl wl-kjv\" data-code=\"H5428\">destroyed</span> <span class=\"wl wl-kjv\" data-code=\"H6145\">cities;</span> their <span class=\"wl wl-kjv\" data-code=\"H2143\">memorial</span> is <span class=\"wl wl-kjv\" data-code=\"H6\">perished</span> with them.","8":"But the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H3427\">endure</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> he hath <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> for judgment.","9":"And he shall <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> in <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness,</span> he shall minister <span class=\"wl wl-kjv\" data-code=\"H1777\">judgment</span> to the <span class=\"wl wl-kjv\" data-code=\"H3816\">people</span> in uprightness.","10":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> also will be a <span class=\"wl wl-kjv\" data-code=\"H4869\">refuge</span> for the <span class=\"wl wl-kjv\" data-code=\"H1790\">oppressed,</span> a <span class=\"wl wl-kjv\" data-code=\"H4869\">refuge</span> in <span class=\"wl wl-kjv\" data-code=\"H6256\">times</span> of trouble.","11":"And they that <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> will put their <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> in thee: for thou, <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> hast not <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> them that seek","12":"Sing <span class=\"wl wl-kjv\" data-code=\"H2167\">praises</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion:</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> his doings.","13":"When he maketh <span class=\"wl wl-kjv\" data-code=\"H1875\">inquisition</span> for <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> he <span class=\"wl wl-kjv\" data-code=\"H2142\">remembereth</span> them: he <span class=\"wl wl-kjv\" data-code=\"H7911\">forgetteth</span> not the <span class=\"wl wl-kjv\" data-code=\"H6818\">cry</span> of the <span class=\"wl wl-kjv\" data-code=\"H6035\">humble.</span>","14":"Have <span class=\"wl wl-kjv\" data-code=\"H2603\">mercy</span> upon me, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">consider</span> my <span class=\"wl wl-kjv\" data-code=\"H6040\">trouble</span> which I suffer of them that <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> me, thou that liftest me <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
