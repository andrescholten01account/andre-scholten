","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een onderwijzing[1], voor de koorleider[2], onder de kinderen van Korach.","2":"Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God!","3":"Mijn ziel dorst naar God, naar de levende God; wanneer zal ik binnengaan en voor het aangezicht van God verschijnen?","4":"Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?","5":"Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.","6":"Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.","7":"O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.","8":"De afgrond roept tot de afgrond, bij het gedruis van uw watergoten; al uw baren en uw golven zijn over mij heen gegaan.","9":"Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.","10":"Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?","11":"Met een doodsteek in mijn beenderen honen mij mijn tegenstanders, als zij de hele dag tegen mij zeggen: Waar is uw God?","12":"Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke verlossing van mijn aangezicht, en mijn God."},"SV":{"1":"Een onderwijzing, voor den opperzangmeester, onder de kinderen van Korach.","2":"Gelijk een hert schreeuwt naar de waterstromen, alzo schreeuwt mijn ziel tot U, o God!","3":"Mijn ziel dorst naar God, naar den levenden God; wanneer zal ik ingaan, en voor Gods aangezicht verschijnen?","4":"Mijn tranen zijn mij tot spijs dag en nacht; omdat zij den gansen dag tot mij zeggen: Waar is uw God?","5":"Ik gedenk daaraan, en stort mijn ziel uit in mij, omdat ik placht heen te gaan onder de schare, *en* met hen te treden naar Gods huis, met een stem van vreugdegezang en lof, *onder* de feesthoudende menigte.","6":"Wat buigt gij u neder, o mijn ziel! en zijt onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen Zijns aangezichts.","7":"O mijn God! mijn ziel buigt zich neder in mij, daarom gedenk ik Uwer uit het land van de Jordaan, en Hermon, uit het klein gebergte.","8":"De afgrond roept tot den afgrond, bij het gedruis Uwer watergoten; al Uw baren en Uw golven zijn over mij heengegaan.","9":"*Maar* de HEERE zal des daags Zijn goedertierenheid gebieden, en des nachts zal Zijn lied bij mij zijn; het gebed tot den God mijns levens.","10":"Ik zal zeggen tot God: Mijn Steenrots! waarom vergeet Gij mij? Waarom ga ik in het zwart, vanwege des vijands onderdrukking?","11":"Met een doodsteek in mijn beenderen honen mij mijn wederpartijders, als zij den gansen dag tot mij zeggen: Waar is uw God?","12":"Wat buigt gij u neder, o mijn ziel! en wat zijt gij onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de menigvuldige Verlossing mijns aangezichts, en mijn God."},"KJV":{"1":"[[To the chief Musician, Maschil, for the sons of Korah.]] As the hart panteth after the water brooks, so panteth my soul after thee, O God.","2":"[[To the chief Musician, Maschil, for the sons of Korah.]] As the hart panteth after the water brooks, so panteth my soul after thee, O God.","3":"My soul thirsteth for God, for the living God: when shall I come and appear before God?","4":"My tears have been my meat day and night, while they continually say unto me, Where *is* thy God?","5":"When I remember these *things*, I pour out my soul in me: for I had gone with the multitude, I went with them to the house of God, with the voice of joy and praise, with a multitude that kept holyday.","6":"Why art thou cast down, O my soul? and *why* art thou disquieted in me? hope thou in God: for I shall yet praise him *for* the help of his countenance.","7":"O my God, my soul is cast down within me: therefore will I remember thee from the land of Jordan, and of the Hermonites, from the hill Mizar.","8":"Deep calleth unto deep at the noise of thy waterspouts: all thy waves and thy billows are gone","9":"*Yet* the LORD will command his lovingkindness in the daytime, and in the night his song *shall be* with me, *and* my prayer unto the God of my life.","10":"I will say unto God my rock, Why hast thou forgotten me? why go I mourning because of the oppression of the enemy?","11":"*As* with a sword in my bones, mine enemies reproach me; while they say daily unto me, Where *is* thy God?","12":"Why art thou cast down, O my soul? and why art thou disquieted within me? hope thou in God: for I shall yet praise him, *who is* the health of my countenance, and my God."}},"tsk":{"2":[{"kopje":"-","refs":["Ps 44:2","Ps 45:2","Ps 46:2","Ps 47:2","Ps 48:2","Ps 49:2","Ps 84:2","Ps 85:2","Num 16:1","Num 16:32","Num 26:11","1 Kron 6:33-37","1 Kron 25:1-5"]},{"kopje":"zo schreeuwt","refs":["Ps 63:2","Ps 63:3","Ps 84:3","Ps 143:6","Ps 143:7","Jes 26:8","Jes 26:9"]}],"3":[{"kopje":"dorst" wl-kjv\" data-code=\"H559\">say</span> unto me, Where is thy God?","5":"When I <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> these things, I pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> in me: for I had <span class=\"wl wl-kjv\" data-code=\"H5674\">gone</span> with the <span class=\"wl wl-kjv\" data-code=\"H5519\">multitude,</span> I <span class=\"wl wl-kjv\" data-code=\"H1718\">went</span> with them to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> with the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H7440\">joy</span> and <span class=\"wl wl-kjv\" data-code=\"H8426\">praise,</span> with a <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> that kept holyday.","6":"Why art thou cast <span class=\"wl wl-kjv\" data-code=\"H7817\">down,</span> O my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul?</span> and why art thou <span class=\"wl wl-kjv\" data-code=\"H1993\">disquieted</span> in me? <span class=\"wl wl-kjv\" data-code=\"H3176\">hope</span> thou in <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> for I shall yet <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> him for the <span class=\"wl wl-kjv\" data-code=\"H3444\">help</span> of his countenance.","7":"O my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> is cast <span class=\"wl wl-kjv\" data-code=\"H7817\">down</span> within me: therefore will I <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> thee from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H2769\">Hermonites,</span> from the <span class=\"wl wl-kjv\" data-code=\"H2022\">hill</span> Mizar.","8":"<span class=\"wl wl-kjv\" data-code=\"H8415\">Deep</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">calleth</span> unto <span class=\"wl wl-kjv\" data-code=\"H8415\">deep</span> at the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6794\">waterspouts:</span> all thy <span class=\"wl wl-kjv\" data-code=\"H4867\">waves</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1530\">billows</span> are gone","9":"Yet the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> his <span class=\"wl wl-kjv\" data-code=\"H2617\">lovingkindness</span> in the <span class=\"wl wl-kjv\" data-code=\"H3119\">daytime,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> his <span class=\"wl wl-kjv\" data-code=\"H7892\">song</span> shall be with me, and my <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> unto the <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> of my life.","10":"I will <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> my <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> Why hast thou <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> me? why <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> I <span class=\"wl wl-kjv\" data-code=\"H6937\">mourning</span> because of the <span class=\"wl wl-kjv\" data-code=\"H3906\">oppression</span> of the enemy?","11":"As with a <span class=\"wl wl-kjv\" data-code=\"H7524\">sword</span> in my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones,</span> mine <span class=\"wl wl-kjv\" data-code=\"H6887\">enemies</span> <span class=\"wl wl-kjv\" data-code=\"H2778\">reproach</span> me; while they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> unto me, Where is thy God?","12":"Why art thou cast <span class=\"wl wl-kjv\" data-code=\"H7817\">down,</span> O my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul?</span> and why art thou <span class=\"wl wl-kjv\" data-code=\"H1993\">disquieted</span> within me? <span class=\"wl wl-kjv\" data-code=\"H3176\">hope</span> thou in <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> for I shall yet <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> him, who is the <span class=\"wl wl-kjv\" data-code=\"H3444\">health</span> of my <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance,</span> and my God."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"onderwijzing","tekst":"Zie Psa 32:1 . Anders, ene onderwijzing der kinderen van Korach, voor den opperzangmeester; en zo in enige volgende psalmen."},{"catchword":"opperzangmeester","tekst":"Zie Psa 4:1 . Dit moet men alzo verstaan, dat de profeet dezen psalm ten tijde van zijn vluchten voor Saul [naar het meeste gevoelen] gemaakt hebbende, naderhand, als hij koning en de ark in Zion was, gegeven heeft om in Gods huis gezongen te worden."},{"catchword":"kinderen","tekst":"Dat is, nakomelingen van Korach, wiens oproer en ondergang beschreven wordt, Num 16 . Deze Korach was een kindskind van Kahath, zoon van Levi. Wie nu onder de Kahathieten opperzangmeester bij Davids tijd in Gods huis geweest is, zie daarvan 1Ch 6:33 ."},{"catchword":"hert","tekst":"Of, hinde; omdat het bijvoegde woord in het Hebr. in het vrouwelijk geslacht gesteld is, hoewel de Hebreën anderzins ook een eigen woord hebben, dat hinde, betekent."},{"catchword":"schreeuwt","tekst":"Het Hebr. woord wordt alleenlijk gevonden hier en in Joe 1:20 , alwaar het den beesten des velds in het algemeen wordt toegeëigend om uit te drukken hun geschreeuw of geroep, dat elk beest op zijne wijze maakt wanneer zij groten dorst hebben en naar water verlangen, uit welke oorzaak de dorst ook mag veroorzaakt wezen, hetzij door gebrek aan water in het algemeen, of door grote hitte wanneer zij gejaagd zijn, enz., gelijk David in zijn ballingschap wel terecht, als het wild, van Saul is omgejaagd, waarin hem nochtans meest verdroot dat hij van den openbaren reinen godsdienst beroofd was, gelijk in het volgende verklaard wordt."}],"2":[{"catchword":"onderwijzing","tekst":"Zie Psa 32:1 . Anders, ene onderwijzing der kinderen van Korach, voor den opperzangmeester; en zo in enige volgende psalmen."},{"catchword":"opperzangmeester","tekst":"Zie Psa 4:1 . Dit moet men alzo verstaan, dat de profeet dezen psalm ten tijde van zijn vluchten voor Saul [naar het meeste gevoelen] gemaakt hebbende, naderhand, als hij koning en de ark in Zion was, gegeven heeft om in Gods huis gezongen te worden."},{"catchword":"kinderen","tekst":"Dat is, nakomelingen van Korach, wiens oproer en ondergang beschreven wordt, Num 16 . Deze Korach was een kindskind van Kahath, zoon van Levi. Wie nu onder de Kahathieten opperzangmeester bij Davids tijd in Gods huis geweest is, zie daarvan 1Ch 6:33 ."},{"catchword":"hert","tekst":"Of, hinde; omdat het bijvoegde woord in het Hebr. in het vrouwelijk geslacht gesteld is, hoewel de Hebreën anderzins ook een eigen woord hebben, dat hinde, betekent."},{"catchword":"schreeuwt","tekst":"Het Hebr. woord wordt alleenlijk gevonden hier en in Joe 1:20 , alwaar het den beesten des velds in het algemeen wordt toegeëigend om uit te drukken hun geschreeuw of geroep, dat elk beest op zijne wijze maakt wanneer zij groten dorst hebben en naar water verlangen, uit welke oorzaak de dorst ook mag veroorzaakt wezen, hetzij door gebrek aan water in het algemeen, of door grote hitte wanneer zij gejaagd zijn, enz., gelijk David in zijn ballingschap wel terecht, als het wild, van Saul is omgejaagd, waarin hem nochtans meest verdroot dat hij van den openbaren reinen godsdienst beroofd was, gelijk in het volgende verklaard wordt."}],"3":[{"catchword":"dorst","tekst":"Dat is, verlangt uitermate zeer. Verg. Psa 63:2 . Isa 55:1 . Joh 7:37 . Rev 22:17 ."},{"catchword":"ingaan","tekst":"In het huis des Heeren, waar de openbare godsdienst verricht wordt, en waar de ark des verbonds is, waarop God woont; 2Sa 6:2 ."}],"4":[{"catchword":"spijze","tekst":"Hebr. brood; dat is, ik voed en verzadig mij met tranen, gelijk een ander met spijs. Verg. Psa 80:6 ."},{"catchword":"Waar","tekst":"Dat is, waar is nu de hulp van uwen God, op wien gij u verlaten hebt? alzo onder, vs.11. enz."}],"5":[{"catchword":"in mij","tekst":"Of, bij mijzelven; dat is, ik verga, bezwijk, mijne krachten begeven mij, mijn hart smelt weg, breekt mij [gelijk men zegt] van verdriet. Verg. Job 30:16 . Lam 2:12 . Anders wordt door de uitstorting des harten ook verstaan de uitting van alle gedachten en begeerte door het gebed, gelijk 1Sa 1:15 . Psa 62:9 ."},{"catchword":"te treden","tekst":"Of, zediglijk, statiglijk, zachtjes treden. Het Hebr. woord wordt alleenlijk hier en in Isa 38:15 . gevonden, betekenende, naar het meeste gevoelen, hetgeen hier gesteld is. Anders wakker heen te treden."}],"6":[{"catchword":"buigt","tekst":"Of, zijt nedergebogen. Hier beschrijft David zijn geestelijken strijd, dien hij in zijn kruis gehad heeft."},{"catchword":"voor de","tekst":"Of, ik zal Hem nog loven, zijn aangezicht, [dat is, zijn genadige tegenwoordigheid] [is] een gewisse, of menigvuldige behoudenis."},{"catchword":"aangezichts","tekst":"Dat is, die van zijn genadige tegenwoordigheid zullen voortkomen, die Hij volgens zijn woord aan mij bewijzen zal."}],"7":[{"catchword":"Jordaan","tekst":"Sommigen verstaan dat David hier ziet op drie landpalen van Kanaän, willende zeggen, waarheen hij ook zou mogen gejagen worden, dat hij niettemin God overal gedenkt en tot Hem toevlucht neemt, hetzij in het oosten van Kanaän, waar de Jordaan is, hetzij in het noorden, waar de bergen Libanon en Hermon zijn, hetzij in het zuiden, waar Juda met kleine bergen, als de noordelijke zijde, besloten is. Ondertussen kan dit ook een reden zijn van zijn verslagenheid, dat hij inplaats van den godsdienst bij te wonene, [gelijk hij tevoren gewoon was te doen] aldus moet omzwerven in de uiterste palen van Israël. Waarom sommigen dit overzetten: omdat ik Uwer gedenke."},{"catchword":"Hermon","tekst":"Dat is, de bergen Hermons, of der Hermonieten; dat is, die aan dat gebergte wonen. Zie van Hermon Deu 3:8 ."},{"catchword":"klein","tekst":"Anders, uit het gebergte Mitsar, houdende dit voor een eigen naam van zeker gebergte."}],"8":[{"catchword":"De afgrond","tekst":"Of, afgrond aan afgrond roept; dat is, de ene afgrond volgt op den anderen; het ene gevaar is niet over, of het andere komt er op. De profeet wil zeggen dat hem God zoveel lijden toezendt, dat hij als een, die bij groot onweder in een onstuimige en verbolgen zee vaart, waar het niet anders schijnt dan alsof hij slag op slag van de hoogte in den afgrond zal nederzinken. Verg. Psa 107:24-26 . enz."},{"catchword":"gedruis","tekst":"Hebr. eigenlijk stem; maar het Hebr. woord wordt van allerlei geluid gebruikt."},{"catchword":"watergoten","tekst":"Versta, geweldigen regen, die van den wind gedreven zijnde, zulks een gedruis en bruisen maakt als sterk lopende wateren, die door kanalen of sluizen van de hoogte in de laagte nederstorten."}],"9":[{"catchword":"Maar","tekst":"Alsof hij zeide: Dit is het alleen; dat mij dag en nacht behoudt; zonder dat ware ik een verloren man."},{"catchword":"gebieden","tekst":"Zie van deze manier van spreken Lev 25:21 . en verg. Psa 44:5 ."},{"catchword":"zijn lied","tekst":"Dat is, van Hem, die mij altoos oorzaak geeft om Hem te danken en te bidden. Verg. Job 35:10 . Isa 30:29 ."},{"catchword":"mijns","tekst":"Dat is, die mij wonderbaarlijk bij het leven houdt en in alle gevaren bewaart."}],"10":[{"catchword":"Mijn","tekst":"Dat is, bij God, die mijn steenrots [dat is, toevlucht en bescherming] is, zal ik deze vrijheid gebruiken, dat ik Hem aldus klagelijk aanspreek."},{"catchword":"vergeet","tekst":"Uit de voorgaande woorden van geloof blijkt dat dit geen woorden van ongeloof zijn, maar dezen zin hebben: dewijl ik geloof dat Gij mijn sterkte zijt, waarom zoudt Gij mij dan vergeten? dat is, uwe hulp opschorten alsof Gij mij hadt vergeten. Verg. Psa 43:2 . Gen 8:1 ."},{"catchword":"in het zwart","tekst":"Zie Psa 35:14 ."}],"11":[{"catchword":"doodsteek","tekst":"Of, zwaard, moordpriem. Hebr. doding, en voorts [omdat zij instrumenten zijn, waarmede iemand gedood wordt] een zwaard, moordpriem, enz. Hij wil zeggen dat hem zulks zo wee doet, alsof zij hem met een zwaard of moordpriem doorstaken of in zijn hart staken. Want de beenderen worden alzo voor het lichaam, het binneste en de vastigheid, sterkte, vermogen en gezondheid des mensen genomen. Zie Job 7:15 . Psa 35:10 ."}],"12":[{"catchword":"menigvuldige","tekst":"Hebr. verlossing. Boven vs.6, heeft hij gezegd dat zijn heil, zijne verlossing of behoudenis van Gods aangezicht kwam, of in zijn lieflijk aanschijn bestond; hier zegt hij nu dat God de behoudenis van zijn [van des profeten] aangezicht is; dat is, waarop hij ziet, of, die hem dagelijks voor ogen komt. Hij schijnt te willen zeggen dat hem God alzo steeds verlost en behoudt, dat het ogenschijnlijk is, dat hij het klaarlijk voor zijn ogen ziet, buiten dat zou hij telkens verloren zijn."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"An Instruction: See Pslam.32.on ver.1.] For the chief Song-master [see Psalm 4.on verse 1. This we must so understand, that the Prophet having made this Psalm whilest he was banished and flying before Saul (as most conceive) he delivered the same afterwards when he came to be King, and the Ark was brought to Zion, to be solemnly sung in the house of God. [Among the children of Korah] i.e. the posterity of Korah, whose insurrection and destruction is described, Num.16. This Korah was a grandchild of Kahat the son of Levi: but who was this chief song-master, or chief musitia to the house of God in Davids time, thereof see 1 Chron.16.on ver.33. Note, this first verse is read by some, An instruction of the children of Korah, for t /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
