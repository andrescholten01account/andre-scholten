<style>

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }

  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }

  .vtekst em, .pcel em { font-style: italic; color: #555; }

  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }

ederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.","2":"Wie zal de machtige daden van de HEERE uitspreken, al Zijn lof verkondigen?","3":"Gelukkig zijn zij die het recht onderhouden, die te allen tijde gerechtigheid doen.","4":"Gedenk mij, HEERE, naar het welbehagen *tot* Uw volk, bezoek mij met Uw heil;","5":"opdat ik het goede van Uw uitverkorenen aanschouwt; opdat ik mij verblijd met de blijdschap van Uw volk; opdat ik mij beroemt met Uw erfdeel.","6":"Wij hebben gezondigd, alsook onze vaderen, wij hebben verkeerd gedaan; wij hebben goddeloos gehandeld.","7":"Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn de veelheid van Uw goedertierenheid niet gedachtig geweest; maar zij waren opstandig aan de zee, bij de Schelfzee.","8":"Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.","9":"En Hij bestrafte de Schelfzee, zodat zij verdroogde, en Hij deed hen wandelen door de afgronden, als *door* een woestijn.","10":"En Hij verloste hen uit de hand van de hater, en Hij bevrijdde hen van de hand van de vijand.","11":"En de wateren overdekten hun tegenstanders; niet één van hen bleef over.","12":"Toen geloofden zij Zijn woorden; zij zongen Zijn lof.","13":"*Maar* zij vergaten al snel Zijn werken, zij wachtten niet op Zijn raad.","14":"Maar zij werden belust met begeerte in de woestijn, en zij verzochten God in de wildernis.","15":"Toen gaf Hij hun hun verlangen; maar Hij zond aan hun zielen een magerheid.","16":"En zij benijdden Mozes in het leger, *en* Aäron, de heilige van de HEERE.","17":"De aarde deed zich open, en verslond Dathan, en overdekte de groep van Abiram.","18":"En een vuur brandde onder hun groep, een vlam stak de goddelozen in brand.","19":"Zij maakten een kalf bij Horeb, en zij bogen zich voor een gegoten beeld.","20":"En zij veranderden hun Eer in de gedaante van een os, die gras eet.","21":"Zij vergaten God, hun Heiland, Die grote dingen gedaan had in Egypte;","22":"wonderdaden in het land van Cham; ontzagwekkende dingen aan de Schelfzee.","23":"Daarom zei Hij dat Hij hen zou verdelgen, ware het niet dat Mozes, Zijn uitverkorene, in de scheur voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, zodat Hij hen niet verdierf.","24":"Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.","25":"Maar zij morden in hun tenten; naar de stem van de HEERE luisterden zij niet.","26":"Daarom hief Hij tegen hen Zijn hand op, *zwerend*, dat Hij hen neervellen zou in de woestijn;","27":"en dat Hij hun nageslacht zou neervellen onder de heidenen, en hen verstrooien zou door de landen.","28":"Ook hebben zij zich gekoppeld aan Baäl-peor, en zij hebben de offers van de doden gegeten.","29":"En zij hebben *de Heere* tot toorn verwekt met hun daden, zodat de plaag een inbreuk onder hen deed.","30":"Toen stond Pinehas op, en hij voerde het oordeel uit, en de plaag werd opgehouden.","31":"En het is hem gerekend tot gerechtigheid, van geslacht tot geslacht tot in eeuwigheid.","32":"Zij maakten *Hem* ook zeer toornig aan het twistwater, en het ging Mozes kwalijk om hunnentwil.","33":"Want zij verbitterden zijn geest, zodat hij *iets* onbedacht uitsprak met zijn lippen.","34":"Zij hebben die volken niet verdelgd, die de HEERE hun gezegd had;","35":"maar zij vermengden zich met de heidenen, en leerden daarvan de werken.","36":"En zij dienden hun afgoden, en die werden hun tot een strik.","37":"Daarenboven hebben zij hun zonen en hun dochters aan de duivelen geofferd.","38":"En zij hebben onschuldig bloed vergoten, het bloed van hun zonen en hun dochters, die zij aan de afgoden van Kanaän hebben opgeofferd; zodat het land door deze bloedschuld ontheiligd is geworden.","39":"En zij verontreinigden zich door hun werken, en zij hebben gehoereerd door hun daden.","40":"Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en Hij heeft een gruwel gehad aan Zijn erfdeel.","41":"En Hij gaf hen in de hand van de heidenen, en hun haters heersten over hen.","42":"En hun vijanden hebben hen verdrukt, en zij zijn vernederd onder hun hand.","43":"Hij heeft hen dikwijls gered; maar zij verbitterden *Hem* door hun raad, en werden uitgeteerd door hun ongerechtigheid.","44":"Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde.","45":"En Hij dacht tot hun voordeel aan Zijn verbond, en het berouwde Hem naar de veelheid van Zijn blijken van goedertierenheid.","46":"Daarom gaf Hij hun barmhartigheid voor het aangezicht van allen die hen gevangen hadden.","47":"Verlos ons, HEERE, onze God! en verzamel ons uit de heidenen, opdat wij de Naam van Uw heiligheid loven, ons beroemend in Uw lof.","48":"Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid; en al het volk zegt: Amen, Halleluja!"},"SV":{"1":"Hallelujah! Looft den HEERE, want Hij is goed, want Zijn goedertierenheid is in der eeuwigheid.","2":"Wie zal de mogendheden des HEEREN uitspreken, al Zijn lof verkondigen?","3":"Welgelukzalig zijn zij, die het recht onderhouden, die te aller tijd gerechtigheid doet.","4":"Gedenk mijner, o HEERE! naar het welbehagen *tot* Uw volk, bezoek mij met Uw heil;","5":"Opdat ik aanschouwe het goede Uwer uitverkorenen; opdat ik mij verblijde met de blijdschap Uws volks; opdat ik mij beroeme met Uw erfdeel.","6":"Wij hebben gezondigd, mitsgaders onze vaderen, wij hebben verkeerdelijk gedaan; wij hebben goddelooslijk gehandeld.","7":"Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn der menigte Uwer goedertierenheid niet gedachtig geweest; maar zij waren wederspannig aan de zee, bij de Schelfzee.","8":"Doch Hij verloste hen om Zijns Naams wil, opdat Hij Zijn mogendheid bekend maakte.","9":"En Hij schold de Schelfzee, zodat zij verdroogde, en Hij deed hen wandelen door de afgronden, als *door* een woestijn.","10":"En Hij verloste hen uit de hand des haters, en Hij bevrijdde hen van de hand des vijands.","11":"En de wateren overdekten hun wederpartijders; niet een van hen bleef over.","12":"Toen geloofden zij aan Zijn woorden; zij zongen Zijn lof.","13":"*Doch* zij vergaten haast Zijn werken, zij verbeidden naar Zijn raad niet.","14":"Maar zij werden belust met lust in de woestijn, en zij verzochten God in de wildernis.","15":"Toen gaf Hij hun hun begeerte; maar Hij zond aan hun zielen een magerheid.","16":"En zij benijdden Mozes in het leger, *en* Aäron, den heilige des HEEREN.","17":"De aarde deed zich open, en verslond Dathan, en overdekte de vergadering van Abiram.","18":"En een vuur brandde onder hun vergadering, een vlam stak de goddelozen aan brand.","19":"Zij maakten een kalf bij Horeb, en zij bogen zich voor een gegoten beeld.","20":"En zij veranderden hun Eer in de gedaante van een os, die gras eet.","21":"Zij vergaten God, hun Heiland, Die grote dingen gedaan had in Egypte;","22":"Wonderdaden in het land van Cham; vreselijke dingen aan de Schelfzee.","23":"Dies Hij zeide, dat Hij hen verdelgen zou, ten ware Mozes, Zijn uitverkorene, in de scheure voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, dat Hij hen niet verdierf.","24":"Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.","25":"Maar zij murmureerden in hun tenten; naar de stem des HEEREN hoorden zij niet.","26":"Dies hief Hij tegen hen Zijn hand op, *zwerende*, dat Hij hen nedervellen zou in de woestijn;","27":"En dat Hij hun zaad zou nedervellen onder de heidenen, en hen verstrooien zou door de landen.","28":"Ook hebben zij zich gekoppeld aan Baäl-peor, en zij hebben de offeranden der doden gegeten.","29":"En zij hebben *den* *Heere* tot toorn verwekt met hun daden, zodat de plaag een inbreuk onder hen deed.","30":"Toen stond Pinehas op, en hij oefende gericht, en de plaag werd opgehouden.","31":"En het is hem gerekend tot gerechtigheid, van geslacht tot geslacht tot in eeuwigheid.","32":"Zij maakten *Hem* ook zeer toornig aan het twistwater, en het ging Mozes kwalijk om hunnentwil.","33":"Want zij verbitterden zijn geest, zodat hij *wat* onbedachtelijk voortbracht met zijn lippen.","34":"Zij hebben die volken niet verdelgd, die de HEERE hun gezegd had;","35":"Maar zij vermengden zich met de heidenen, en leerden derzelver werken.","36":"En zij dienden hun afgoden, en zij werden hun tot een strik.","37":"Daarenboven hebben zij hun zonen en hun dochteren den duivelen geofferd.","38":"En zij hebben onschuldig bloed vergoten, het bloed hunner zonen en hunner dochteren, die zij den afgoden van Kanaän hebben opgeofferd; zodat het land door deze bloedschulden is ontheiligd geworden.","39":"En zij ontreinigden zich door hun werken, en zij hebben gehoereerd door hun daden.","40":"Dies is de toorn des HEEREN ontstoken tegen Zijn volk, en Hij heeft een gruwel gehad aan Zijn erfdeel.","41":"En Hij gaf hen in de hand der heidenen, en hun haters heersten over hen.","42":"En hun vijanden hebben hen verdrukt, en zij zijn vernederd geworden onder hun hand.","43":"Hij heeft hen menigmaal gered; maar zij verbitterden *Hem* door hun raad, en werden uitgeteerd door hun ongerechtigheid.","44":"Nochtans zag Hij hun benauwdheid aan, als Hij hun geschrei hoorde.","45":"En Hij dacht tot hun beste aan Zijn verbond, en het berouwde Hem naar de veelheid Zijner goedertierenheden.","46":"Dies gaf Hij hun barmhartigheid voor het aangezicht van allen, die hen gevangen hadden.","47":"Verlos ons, HEERE, onze God! en verzamel ons uit de heidenen, opdat wij den Naam Uwer heiligheid loven, ons beroemende in Uw lof.","48":"Geloofd zij de HEERE, de God Israëls, van eeuwigheid en tot in eeuwigheid; en al het volk zegge: Amen, Hallelujah!"},"KJV":{"1":"Praise ye the LORD. O give thanks unto the LORD; for *he is* good: for his mercy *endureth* for ever.","2":"Who can utter the mighty acts of the LORD? *who* can shew forth all his praise?","3":"Blessed *are* they that keep judgment, *and* he that doeth righteousness at all times.","4":"Remember me, O LORD, with the favour *that thou bearest unto* thy people: O visit me with thy salvation;","5":"That I may see the good of thy chosen, that I may rejoice in the gladness of thy nation, that I may glory with thine inheritance.","6":"We have sinned with our fathers, we have committed iniquity, we have done wickedly.","7":"Our fathers understood not thy wonders in Egypt; they remembered not the multitude of thy mercies; but provoked *him* at the sea, *even* at the Red sea.","8":"Nevertheless he saved them for his name's sake, that he might make his mighty power to be known.","9":"He rebuked the Red sea also, and it was dried up: so he led them through the depths, as through the wilderness.","10":"And he saved them from the hand of him that hated *them*, and redeemed them from the hand of the enemy.","11":"And the waters covered their enemies: there was not one of them left.","12":"Then believed they his words; they sang his praise.","13":"They soon forgat his works; they waited not for his counsel:","14":"But lusted exceedingly in the wilderness, and tempted God in the desert.","15":"And he gave them their request; but sent leanness into their soul.","16":"They envied Moses also in the camp, *and* Aaron the saint of the LORD.","17":"The earth opened and swallowed up Dathan, and covered the company of Abiram.","18":"And a fire was kindled in their company; the flame burned up the wicked.","19":"They made a calf in Horeb, and worshipped the molten image.","20":"Thus they changed their glory into the similitude of an ox that eateth grass.","21":"They forgat God their saviour, which had done great things in Egypt;","22":"Wondrous works in the land of Ham, *and* terrible things by the Red sea.","23":"Therefore he said that he would destroy them, had not Moses his chosen stood before him in the breach, to turn away his wrath, lest he should destroy","24":"Yea, they despised the pleasant land, they believed not his word:","25":"But murmured in their tents, *and* hearkened not unto the voice of the LORD.","26":"Therefore he lifted up his hand against them, to overthrow them in the wilderness:","27":"To overthrow their seed also among the nations, and to scatter them in the lands.","28":"They joined themselves also unto Baalpeor, and ate the sacrifices of the dead.","29":"Thus they provoked *him* to anger with their inventions: and the plague brake in","30":"Then stood up Phinehas, and executed judgment: and *so* the plague was stayed.","31":"And that was counted unto him for righteousness unto all generations for evermore.","32":"They angered *him* also at the waters of strife, so that it went ill with Moses","33":"Because they provoked his spirit, so that he spake unadvisedly with his lips.","34":"They did not destroy the nations, concerning whom the LORD commanded","35":"But were mingled among the heathen, and learned their works.","36":"And they served their idols: which were a snare","37":"Yea, they sacrificed their sons and their daughters unto devils,","38":"And shed innocent blood, *even* the blood of their sons and of their daughters, whom they sacrificed unto the idols of Canaan: and the land was polluted with blood.","39":"Thus were they defiled with their own works, and went a whoring with their own inventions.","40":"Therefore was the wrath of the LORD kindled against his people, insomuch that he abhorred his own inheritance.","41":"And he gave them into the hand of the heathen; and they that hated them ruled","42":"Their enemies also oppressed them, and they were brought into subjection under their hand.","43":"Many times did he deliver them; but they provoked *him* with their counsel, and were brought low for their iniquity.","44":"Nevertheless he regarded their affliction, when he heard their cry:","45":"And he remembered for them his covenant, and repented according to the multitude of his mercies.","46":"He made them also to be pitied of all those that carried them captives.","47":"Save us, O LORD our God, and gather us from among the heathen, to give thanks unto thy holy name, *and* to triumph in thy praise.","48":"Blessed *be* the LORD God of Israel from everlasting to everlasting: and let all the people say, Amen. Praise ye the LORD."}},"tsk":{"1":[{"kopje":"Halleluja","refs":["Ps 105:45"]},{"kopje":"Loof","refs":["Ps 100:4","Ps 100:5","Ps 107:1","Ps 118:1","Ps 136:1","1 Kron 16:34","Ezra 3:11","Jer 33:11","1 Tess 5:18"]},{"kopje":"want Hij","refs":["Ps 103:17","Ps 119:68","Matt 19:17","Rom 5:20","Rom 5:21"]}],"2":[{"kopje":"uitspreken","refs":["Ps 40:6","Ps 139:17","Ps 139:18","Ps 145:3-12","Job 5:9","Job 26:14","Rom 11:33","Ef 1:19","Ef 3:18"]},{"kopje":"al Zijn lof","refs":["Neh 9:5"]}],"3":[{"kopje":"Gelukkig","refs":["Ps 1:1-3","Ps 84:12","Ps 84:13","Ps 119:1-3","Mark 3:35","Luk 6:47-49","Luk 11:28","Joh 13:17","Joh 15:14","Jak 1:25","Openb 7:15","Openb 22:14"]},{"kopje":"onderhouden","refs":["Ps 119:106","Jes 56:1","Jes 56:2","Jer 22:15","Jer 22:16","Luk 11:42","Joh 14:21-23"]},{"kopje":"doen","refs":["Ps 15:2","Ps 119:44","Jes 64:5","Ezech 18:21","Ezech 18:22","Luk 1:74","Luk 1:75","Hand 24:16","Rom 2:7","Gal 6:9","Openb 22:14"]},{"kopje":"te allen tijde","refs":["Ps 119:20","Ps 119:112","Deut 5:19","Deut 11:1"]}],"4":[{"kopje":"Gedenk","refs":["Ps 25:7","Ps 119:132","Neh 5:19","Neh 13:14","Neh n Baäl-Peor en met de hoererij, die zij met de Moabietische vrouwen bedreven."},{"catchword":"een inbreuk","tekst":"Dodende vier en twintig duizend mannen, Num 25:9 , hetzij door een engel of anderzins. Immers zijn zij zeer spoedig omgekomen."}],"30":[{"catchword":"hij oefende","tekst":"Dat is, Hij deed uitspraak en straf over de misdaad, waarvan Num 25:8-9 , enz. geschreven staat."}],"31":[{"catchword":"tot gerechtigheid","tekst":"Dat is, tot een wettelijke, goede en loffelijke daad, door ingeving van den Heilige Geest, alhoewel buiten zijn gewoon beroep gedaan, God hem zulks genadiglijk beloonde, Num 25:11 , enz. waardoor hij ook getuigenis verkreeg dat hij een kind Gods was."}],"32":[{"catchword":"Hem","tekst":"Te weten, God."},{"catchword":"het ging","tekst":"Alzo dat hem van God gezegd werd dat hij in het land Kanaän niet komen zou, Num 20:12 . Zie Deu 1:37 ."}],"33":[{"catchword":"wat","tekst":"Te weten, enige woorden, die hij niet had behoren te spreken, want hij bewees enige ongeduldigheid met mistrouwen vermengd, en hij heiligde den Heere niet voor de Israëlieten, gelijk hij schuldig was te doen. Zie Num 20:10 , Num 20:12 ."}],"34":[{"catchword":"die volken","tekst":"Te weten, de heidenen, die het land Kanaän bewoonden, gelijk er staat Jdg 1:21 , Jdg 1:27 , Jdg 1:29-31 , Jdg 1:33 ; hetwelk nochtans God de Heere hun bevolen had; Exo 23:32-33 ; Num 33:52 ; Deu 7:2 ."},{"catchword":"gezegd had;","tekst":"Dat is, bevolen."}],"35":[{"catchword":"zij vermengden","tekst":"Dat is, zij trouwden dier heidense dochters."}],"36":[{"catchword":"hun afgoden,","tekst":"Zie 1Sa 31:9 , en 2Sa 5:21 ."},{"catchword":"die werden hun","tekst":"Dat is, die hen ten verderve gereikt hebben, gelijk God hun voorzegd had; Exo 23:33 ; Deu 7:16 ; Jdg 2:3 . Het is ene manier van spreken, genomen van de vogelvangers, die de vogels met hunne strikken en netten gevangen hebbende, doden."}],"37":[{"catchword":"den duivelen","tekst":"Zie de aantekening bij Deu 32:17 ."}],"38":[{"catchword":"het land door","tekst":"Te weten, het land Kanaän."},{"catchword":"bloedschulden","tekst":"Hebr. bloeden; gelijk Psa 51:16 . Zie de aantekening bij Gen 4:10 ."}],"39":[{"catchword":"gehoereerd","tekst":"Versta hier geestelijke hoererij, dat is afgoderij. Zie de aantekening bij Lev 17:7 ."}],"40":[{"catchword":"zijn erfdeel","tekst":"Zie de aantekening bij vs.5."}],"41":[{"catchword":"Hij gaf hen in","tekst":"Gelijk te zien is in het Boek der richteren doorgaans."}],"42":[{"catchword":"hun vijanden","tekst":"Te weten, de vijanden, die rondom hen woonden, gelijk hun voorzegd was;"}],"43":[{"catchword":"gered; maar","tekst":"Te weten, uit de hand hunner vijanden door Ehud, Barak, Gideon, Jetha, Simson, enz.; Jdg 3 en Jdg 4"},{"catchword":"door hun raad,","tekst":"De zin is, dat zij telkens weder aangingen met zondigen en met moedwilligheid tegen den Heere te bedrijven; Num 15:39 ."}],"45":[{"catchword":"Hij dacht tot","tekst":"Hebr. Hij dacht hun aan zijn verbond; zie Gen 8:1 ; Deu 30:1 , enz."},{"catchword":"het berouwde","tekst":"Te weten, van de straf hun toegezonden; dat is, Hij nam een anderen koers dan Hij tevoren genomen had, en Hij nam hun de straf af. Zie Gen 6:6 ."}],"46":[{"catchword":"Dies gaf Hij","tekst":"Hebr. En Hij gaf hun tot ontfermingen. Zie 1Ki 8:50 ."}],"47":[{"catchword":"uit de heidenen,","tekst":"Onder welke vele Israëlieten verspreid waren en woonden, ook velen gevangenen zaten."},{"catchword":"den naam uwer","tekst":"Dat is, uw heiligen naam."},{"catchword":"ons beroemende","tekst":"Dat is, ons verheugende over uwe genade, vanwege welke Gij geroemd en geprezen wordt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Halelu-Jah, [See the Annot. Psalm 104.on v.35. There be nine Psalms, which begins with Halelu-Jah, viz. Psa 106:111,112,113. 135.146. 148.149. and 150.] Praise the LORD for he is good, for his kindness is in Eternity."}],"2":[{"catchword":null,"tekst":"Who shall utter the mightinesses of the LORD? [i.e. his mighty works and deeds, such as are rehearsed, v.8.9. and elsewhere; so you have praise here immediately following, for praise worthy acts] declare all his praise? [Heb. Make hear, or cause to be heard. See Psalm 26.on verse 7.]"}],"3":[{"catchword":null,"tekst":"Right happy they are, which entertain the right: [i.e. which do maintain and observe that which is done right and well. See Gen.18.on v.19.] which doth righteousness at all times."}],"4":[{"catchword":null,"tekst":"Remember me, O LORD, [He prayeth here, that he may be comprehended in the grace and favour which the Lord beareth to his Church] according to the good pleasure (to) thy people, [Heb. In the good pleasure of thy people i.e. that which thou hast or takest in thy people.] visit me [i.e. help and deliver me; as Psa 8:5. Luke 68,69. See the Annot. Gen 21.v.1.] with thy salvation. [i.e. with thy gracious help and deliverance.]"}],"5":[{"catchword":null,"tekst":"That I may behold the good of thy chosen: [Hebr. See in or into the good as Psa 27:4. and 34.13. See the Annot. Psalm 22.on ver.18.] that I may rejoice with the rejoicing of thy people: [i.e. with such gladness and rejoicing, as thy people sheweth, when thou shewest them any temporal or spiritual mercy] that I may glory, [viz. With the people which thou hast accepted of for thine inheritance, Psa 28:9.]"}],"6":[{"catchword":null,"tekst":"We have sinned, together with our Fathers, we have done perversely, we have dealt wickedly."}],"7":[{"catchword":null,"tekst":"Our fathers in Egypt have not heeded thy wonders, [viz. Which thou didst in Egypt: or, which they had understood by their forefathers that God had wrought from the beginning] they were not mindful of the multitude [or greatness] of thy kindnesses: but they were rebellious at the sea, [viz. Before the LORD divided the red sea, for them to pass through. See Exo 14:12,11.] by the red Sea. [or it rush sea. This Sea is called the red Sea. Heb 11:29.]"}],"8":[{"catchword":null,"tekst":"Yet he delivered them for his Names sake to make known his mightiness."}],"9":[{"catchword":null,"tekst":"And he rebuked the red sea, so that it dried up: [So that the flowing of the waters thereof ceased. See the like powerfulness of God, Psa 18:16. Isa 50:2. Nah.1.4. Mat 8:26.] and he made them to walk through the Abysses (deeps,) [By these Abysses, understand the bottom of the Sea, which they entered and passed thorough, between the two heaps of waters which stood up an end over against one another, like walls: Exo 14:22. and 15.5.] as through a Desert: [his meaning is, that the bottom of the Sea, between both the waters standing up an end, was so hard between both the waters standing up an end, was so hard and dry, as if it had been some dry Desert.]"}],"10":[{"catchword":null,"tekst":"And he delivered them out of the hand of the hater; [viz. Pharaohs and his hosts, which pursued the Israelites. Exo 14:23.] and he freed them from the hand of the enemy."}],"11":[{"catchword":null,"tekst":"And the waters covered their adversaries; not one of them remained over."}],"12":[{"catchword":null,"tekst":"Then they believed on his words: they sang his praise."}],"13":[{"catchword":null,"tekst":"(Yet) they soon forgat [Heb. They hastened, they forgat: See Psalm 45.on v.5.] his works: [which the Lord had done in and at the red Sea] they abode not according to his counsel, [They would not wait with patience according to Gods Council, but murmured against him, Exo 15:24. and 17.2. Psalm.78.41.]"}],"14":[{"catchword":null,"tekst":"But they were a lusting with lust in the Desert, and they tempted God in the wilderness, [To see whether he would be able to give them flesh to eat in the wilderness.]"}],"15":[{"catchword":null,"tekst":"Then he gave them their desire: [i.e. that which they had desired or prayed for, viz. Flesh to eat, Num 11:31.] but he sent leanness (or consumption) unto their souls. [i.e. to their persons, to themselves: properly to their bodies. So soul is put for person. Psalm 105.v.18. His meaning is; They ate indeed, but it proved no nourishment, they were not fat of it, they thrived not by it, but grew lean, so long till at last they were wasted and consumed.]"}],"16":[{"catchword":null,"tekst":"And they envied Moses in the Leaguer: and Aaron [So that they rose up against them and held, and reproach them as ambitious and insolent men] the holy (one) of the LORD. [whom God had set apart and hallowed for his service, to be high Priest, Exo 29:44. Levit.8.12. and Num 16:5,7.]"}],"17":[{"catchword":null,"tekst":"The earth opened herself and swallowed Dathan, and covered the assembly of Abiram: [i.e. the people that adhered to him.]"}],"18":[{"catchword":null,"tekst":"And a fire burnt among their Congregation, [viz. Against the Congregation of Korah and his complices] a flame kindled the wicked."}],"19":[{"catchword":null,"tekst":"They made a Calf by Horeb [This is the name of amount in the Desert, otherwise called the mountain of God, Exo 3:1. and 1 King.19.8. and likewise Sinai Psa 68:9. See the Annot Deut.1.on v.2.] and they bowed before a molten image."}],"20":[{"catchword":null,"tekst":"And they changed their honour [i.e. their God who was their true honour, and their inestimable treasure, as Jer 2:11. Rom 1:23. who did wonderfully reveal himself unto them, had taken them for to be his people, and made a Covenant with them] into the shape of an Ox [i.e. of a calf] that eateth grass."}],"21":[{"catchword":null,"tekst":"They forgat God their Saviour, who had done great things in Egypt."}],"22":[{"catchword":null,"tekst":"Marvels in the land of Cham: [i.e. in Egypt, as Psa 78:51. and 105.23.] fearful things at the red-sea."}],"23":[{"catchword":null,"tekst":"Therefore he said, that he would destroy them, but that Moseh his chosen stood in the rent [or gap, leak, breach, which their sins had opened for God, being become their enemy by reason of their sins, to get in upon them for their destruction, a kind of speech taken from warlike men, who by gaps and breaches in the earnest and zealous prayer of Moseh stopped or made up the breach, Exo 32:11,12,13,14.] before his face, to turn away his fierceness, that he destroyed them not."}],"24":[{"catchword":null,"tekst":"They likewise disclaimed the desired land: [Heb. The land of desire: i.e. the land of Canaan, which was a goodly desirable Country, flowing with milk and honey; which their forefathers also had much longed for. See Deut.8.7. and 11.10,11,12. Jer.3.v.19. Eze 20:6.] they believed not his word, [his promise of bringing them thither, and protecting them there; but through unbelief, would rather turn back again to Egypt.]"}],"25":[{"catchword":null,"tekst":"But they murmured in their Tents: they hearkened not after the voice of the LORD: [He sheweth how loath and unwilling they were to advance for the land of promise, Deut.1.32.]"}],"26":[{"catchword":null,"tekst":"Therefore lifted he his hand up against them (swearing) that he would fell them down in the desert. [See Gen.14.on v.22. but how and what God sware against this people: See more particularly, Deut.2.14. Num 14:21,25. Psalm.95.11.]"}],"27":[{"catchword":null,"tekst":"And that he would fell down their seed among the heathen, and scatter them thorough the Countries. [This is not expressed in the Oath, which God made, Num 14:28. but you have it, Levit.26.33. and Deut.28.36.]"}],"28":[{"catchword":null,"tekst":"Also they coupled themselves to Baal Peor, [Thus the idol of the Moabites was called, Num 25:3,5. See the Annot. Jud.2.v.11.] and they did eat the sacrifices of the dead. [i.e. the sacrifices which were offered to the dead, viz. To the idols, Num 25:2. which are but dead things, having no sence nor motion, Psa 115:5. 1 Cor.12.3. on the contrary the true God is said to be the living God, Jer 10:5. and 1 Thess.1.9.]"}],"29":[{"catchword":null,"tekst":"And they Provoked (the LORD) to wrath, with their deeds, [viz. With their worshipping of Baal-Peor, and with the whoredom which they commited with the Moabitish women] so that the plague made a breach among them. [slaying 24000.men, Num 25:9. whether by an Angel, or otherwise; sure it is, they were destroyed very suddenly.]"}],"30":[{"catchword":null,"tekst":"Then stood up Phineas, and he exercised judgement, [He executed justice, and inflicted punishment upon the misdeed, whereof we read, Num 25:7,8, etc.] and the plague was ceased."}],"31":[{"catchword":null,"tekst":"And it is imputed to him for righteousness, [i.e. for a lawful good and praise worthy act performed by inspiration of the holy Spirit, though besides his ordinary calling, God graciously rewarding him for it. Num 25:11. etc. Whereby he received testimony likewise that he was a child of God] from generation to generation into Eternity."}],"32":[{"catchword":null,"tekst":"They made (him) [God namely] likewise very angry at the strife-water, and it went ill with Moseh for their sake. [it being told him by God, that he should not enter into the Land of Canaan. Number 20.21. See Deut.1.37.]"}],"33":[{"catchword":null,"tekst":"For they exasperated his spirit: so that he uttered (somewhat) unadvisedly with his lips. [viz. Some words which he ought not to have spoken; for he shewed some impatience mingled with diffidence, and he did not sanctify the LORD before the Israelites, so as he was bound to do. See Numb 20.10,12.]"}],"34":[{"catchword":null,"tekst":"They did not destroy those people, which the LORD had told [i.e. commanded] them. [those heathen people, namely, which inhabited the Land of Canaan, as we read, Judg.1.21,27,29,30,31,33. For all that God had given them strict charge concerning it, Exo 23:32,33. Num 33:52. Deut.7.2.]"}],"35":[{"catchword":null,"tekst":"But they mingled themselves with the heathen, [i.e. they married the daughters of the heathen] and learned their works."}],"36":[{"catchword":null,"tekst":"And they served their idols, [See 1 Sam.31.on v.9. and 2 Sam.5.on v.21.] and they became a snare unto them. [i.e. they proved their ruine and destruction, as God had foretold them. Exo 23:33. Deut.7.16. Jud 2:3. A manner of speaking borrowed from the fowlers, who having taken the birds in their nets or gins, kill them afterwards.]"}],"37":[{"catchword":null,"tekst":"Over and above this, they sacrificed their sons and their daughters to the Devils. [See the Annot. Deut.32.on verse 17.]"}],"38":[{"catchword":null,"tekst":"And they shed innocent blood, the blood of their sons an their daughters, whom they sacrifieced unto the Idols of Canaan; so that the land (of Canaan namely) was profaned through these bloodguiltinesses. [Heb. Bloods in the plural; as Psa 51:16. See the Annot. Gen.4.on verse 10.]"}],"39":[{"catchword":null,"tekst":"And they polluted themselves by their works, and they whored by their actions. [Understand here their commiting of spiritual whoredom, that is, idolatry See the Annot.. Levit.17.on v.7.]"}],"40":[{"catchword":null,"tekst":"Therefore the anger of the LORD was kindled against his people; and he abhorred his inheritance. [See the Annot.above v.5.]"}],"41":[{"catchword":null,"tekst":"And he gave them into the hand of the heathen; and their haters domineered over them, [As is to be seen in the book of Judges, all along.]"}],"42":[{"catchword":null,"tekst":"And their enemies oppression them: [These namely, which dwelt round about them, according as it was foretold them, Lev.26.17. See the fulfilling Jud 3:8.14. and 4.2. and 6.1. and ch.10.v.7,8,9. And 13.1.] and they were brought low under their hand."}],"43":[{"catchword":null,"tekst":"He rescued them many times, [viz. Out of the hands of their enemies, by Ehud, Barak, Gideon, Jephtah, Sampson, etc. Jud.3. and 4. And 7.11. and 15. Nehem.9.28.30.] but they provoked (him) by their counsel, and were consumed through their iniquity. [the meaning is, ever and a none they relapsed into their course of sinning, and wilfully prevaricating against the LORD, Num 15:39.]"}],"44":[{"catchword":null,"tekst":"Nevertheless, he regarded their distress, when he beard their cry."}],"45":[{"catchword":null,"tekst":"And he was mindful of his Covenant for their good, [Heb. He remembered them his Covenant: See Gen.8.on v.1. Deut.30.1. etc.] and it repented him, according to the multitude of his kindnesses. [viz. That he had brought such judgements upon them; that is to say: He took another course, instead of the former, and took away the punishment from them. See Gen.6.on v.6.]"}],"46":[{"catchword":null,"tekst":"Therefore he gave them compassion, [Heb. He gave them to compassions, See 1 King.8.on v.50.] before the face of all that held them captives."}],"47":[{"catchword":null,"tekst":"Save us LORD our God and gather us out of the heathen, [Among whom the Israelites were scattered, inhabiting, or being captives.] that we my praise the Name of thy holiness [i.e. thine holy Name] glorying in thy praise, [i.e. rejoicing in thy mercy, for which thou art praised and glorified.]"}],"48":[{"catchword":null,"tekst":"Praised be the LORD the God of Israel from eternity, and into eternity, and all the people say, Amen, Halelu-Jah."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
