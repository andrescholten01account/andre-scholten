ederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm van David, voor de koorleider[1]. HEERE! U doorgrondt en kent mij.","2":"U weet mijn zitten en mijn opstaan; U verstaat van verre mijn gedachten.","3":"U omringt mijn gaan en mijn liggen; en U bent al mijn wegen gewend.","4":"Als er nog geen woord op mijn tong is, zie, HEERE! U weet het alles.","5":"U bezet mij van achteren en van voren, en U legt Uw hand op mij.","6":"De kennis is mij te wonderbaar, ze is hoog, ik kan er niet bij.","7":"Waar zou ik heengaan voor Uw Geest, en waar zou ik heenvlieden voor Uw aangezicht?","8":"Als ik opvaar naar de hemel, U bent daar; of maak ik mijn bed in het rijk van de dood, zie, U bent *daar*.","9":"Nam ik vleugels van de dageraad, woonde ik aan het uiterste van de zee;","10":"ook daar zou Uw hand mij leiden, en Uw rechterhand zou mij vasthouden.","11":"Als ik zei: De duisternis zal mij zeker bedekken; dan is de nacht een licht om mij *heen*.","12":"Ook verduistert de duisternis voor U niet; maar de nacht licht als de dag; de duisternis is als het licht.","13":"Want U bezit mijn nieren; U hebt mij in de buik van mijn moeder bedekt.","14":"Ik loof U, omdat ik op een heel ontzagwekkende wijze wonderbaarlijk gemaakt ben; wonderlijk zijn Uw werken! Ook weet mijn ziel het zeer goed.","15":"Mijn gebeente was voor U niet verborgen, toen ik in het verborgene gemaakt ben, *en* als een borduursel gemaakt ben, in de laagste delen van de aarde.","16":"Uw ogen hebben mijn ongevormde klomp gezien; en al deze dingen waren in Uw boek geschreven, de dagen dat zij gevormd zouden worden, toen nog geen van die er was.","17":"Daarom, hoe kostbaar zijn mij, o God, Uw gedachten! Hoe machtig veel zijn hun sommen!","18":"Zou ik ze tellen? Ze zijn meer dan het zand; word ik wakker, dan ben ik nog bij U.","19":"O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!","20":"Zij die schandelijk over U spreken, *en* Uw vijanden zinloos verheffen.","21":"Zou ik niet haten, HEERE, wie U haten? En verdriet hebben over wie tegen U opstaan?","22":"Ik haat hen met volkomen haat, tot vijanden zijn zij mij.","23":"Doorgrond mij, o God! En ken mijn hart; beproef mij, en ken mijn gedachten.","24":"En zie, of er bij mij een schadelijke weg is; en leid mij op de eeuwige weg."},"SV":{"1":"Een psalm van David, voor den opperzangmeester. HEERE! Gij doorgrondt en kent mij.","2":"Gij weet mijn zitten en mijn opstaan; Gij verstaat van verre mijn gedachten.","3":"Gij omringt mijn gaan en mijn liggen; en Gij zijt al mijn wegen gewend.","4":"Als er nog geen woord op mijn tong is, zie, HEERE! Gij weet het alles.","5":"Gij bezet mij van achteren en van voren, en Gij zet Uw hand op mij.","6":"De kennis is mij te wonderbaar, zij is hoog, ik kan er niet bij.","7":"Waar zou ik heengaan voor Uw Geest en waar zou ik heenvlieden voor Uw aangezicht?","8":"Zo ik opvoer ten hemel, Gij zijt daar; of bedde ik mij in de hel, zie, Gij zijt *daar*.","9":"Nam ik vleugelen des dageraads, woonde ik aan het uiterste der zee;","10":"Ook daar zou Uw hand mij geleiden, en Uw rechterhand zou mij houden.","11":"Indien ik zeide: De duisternis zal mij immers bedekken; dan is de nacht een licht om mij.","12":"Ook verduistert de duisternis voor U niet; maar de nacht licht als de dag; de duisternis is als het licht.","13":"Want Gij bezit mijn nieren; Gij hebt mij in mijner moeders buik bedekt.","14":"Ik loof U, omdat ik op een heel vreselijke wijze wonderbaarlijk gemaakt ben; wonderlijk zijn Uw werken! ook weet het mijn ziel zeer wel.","15":"Mijn gebeente was voor U niet verholen, als ik in het verborgene gemaakt ben, *en* als een borduursel gewrocht ben, in de nederste delen der aarde.","16":"Uw ogen hebben mijn ongevormden klomp gezien; en al deze dingen waren in Uw boek geschreven, de dagen als zij geformeerd zouden worden, toen nog geen van die was.","17":"Daarom, hoe kostelijk zijn mij, o God, Uw gedachten! hoe machtig veel zijn haar sommen!","18":"Zoude ik ze tellen? Harer is meer, dan des zands; word ik wakker, zo ben ik nog bij U.","19":"O God! dat Gij den goddeloze ombracht! en gij, mannen des bloeds, wijkt van mij!","20":"Die van U schandelijk spreken, *en* Uw vijanden ijdellijk verheffen.","21":"Zou ik niet haten, HEERE! die U haten? en verdriet hebben in degenen, die tegen U opstaan?","22":"Ik haat hen met volkomen haat, tot vijanden zijn zij mij.","23":"Doorgrond mij, o God! en ken mijn hart; beproef mij, en ken mijn gedachten.","24":"En zie, of bij mij een schadelijke weg zij; en leid mij op den eeuwigen weg."},"KJV":{"1":"[[To the chief Musician, A Psalm of David.]] O LORD, thou hast searched me, and known","2":"Thou knowest my downsitting and mine uprising, thou understandest my thought afar off.","3":"Thou compassest my path and my lying down, and art acquainted *with* all my ways.","4":"For *there is* not a word in my tongue, *but*, lo, O LORD, thou knowest","5":"Thou hast beset me behind and before, and laid thine hand","6":"*Such* knowledge *is* too wonderful for me; it is high, I cannot","7":"Whither shall I go from thy spirit? or whither shall I flee from thy presence?","8":"If I ascend up into heaven, thou *art* there: if I make my bed in hell,","9":"*If* I take the wings of the morning, *and* dwell in the uttermost parts of the sea;","10":"Even there shall thy hand lead me, and thy right hand shall hold","11":"If I say, Surely the darkness shall cover me; even the night shall be light about me.","12":"Yea, the darkness hideth not from thee; but the night shineth as the day: the darkness and the light","13":"For thou hast possessed my reins: thou hast covered me in my mother's womb.","14":"I will praise thee; for I am fearfully *and* wonderfully made: marvellous *are* thy works; and *that* my soul knoweth right well.","15":"My substance was not hid from thee, when I was made in secret, *and* curiously wrought in the lowest parts of the earth.","16":"Thine eyes did see my substance, yet being unperfect; and in thy book all *my members* were written, *which* in continuance were fashioned, when *as yet there was* none","17":"How precious also are thy thoughts unto me, O God! how great is the sum","18":"*If* I should count them, they are more in number than the sand: when I awake, I am still","19":"Surely thou wilt slay the wicked, O God: depart from me therefore, ye bloody men.","20":"For they speak against thee wickedly, *and* thine enemies take *thy name* in vain.","21":"Do not I hate them, O LORD, that hate thee? and am not I grieved with those that rise up","22":"I hate them with perfect hatred: I count them mine enemies.","23":"Search me, O God, and know my heart: try me, and know my thoughts:","24":"And see if *there be any* wicked way in me, and lead me in the way everlasting."}},"tsk":{"1":[{"kopje":"U doorgrondt","refs":["Ps 139:23","Ps 11:4","Ps 11:5","Ps 17:3","Ps 44:22","1 Kon 8:39","1 Kron 28:9","Jer 12:3","Jer 17:9","Jer 17:10","Joh 21:17","Hebr 4:13","Openb 2:18","Openb 2:23"]}],"2":[{"kopje":"weet","refs":["Ps 56:9","Gen 16:13","2 Kon 6:12","2 Kon 19:27","Spr 15:3","Jes 37:28","Zach 4:10"]},{"kopje":"verstaat","refs":["Ps 94:11","Matt 9:4","Luk 9:47","Joh 2:24","Joh 2:25","1 Kor 4:5"]},{"kopje":"van verre","refs":["Ezech 38:10","Ezech 38:11","Ezech 3 de=\"H1870\">way</span> everlasting."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"voor den opperzangmeester","tekst":"Zie Psa 4:1 ."}],"2":[{"catchword":"Gij weet mijn zitten","tekst":"De zin is: Al wat ik doe, hetzij ik stilzit, òf opsta, òf ga, Gij weet en ziet het al."},{"catchword":"Gij verstaat van","tekst":"Alsof hij zeide: Als de gedachten nog verre van mij zijn, eer ik ze zelf bedenk, zo weet Gij ze."}],"3":[{"catchword":"omringt mijn gaan","tekst":"Anders: Gij want, dat is, Gij beproeft en onderzoekt het op het nauwst, gelijk Job 31:4 ."},{"catchword":"Gij zijt al mijn","tekst":"Dat is, Gij hebt kennis van al mijn doen en laten; Gij hebt het door gewoonte bevonden. Het is ene gelijkenis, genomen van de mensen, die door de ervarenheid en gewoonte kennis van een ding krijgen."}],"4":[{"catchword":"Als er nog","tekst":"Dat is, eer ik spreek, zo weet Gij al wat ik zal zeggen, want Gij zijt een kenner des harten."}],"5":[{"catchword":"Gij zet Uw hand","tekst":"Dat is, Gij houdt uwe hand op mij, dat ik U niet ontlope; of opdat ik versta dat ik geheel aan uwe voorzienigheid hang."}],"6":[{"catchword":"De kennis is mij","tekst":"Te weten, die kennis, met welke Gij alles weet."},{"catchword":"ik kan er niet","tekst":"Te weten, om die te bereiken of te begrijpen."}],"7":[{"catchword":"Waar zou ik heengaan","tekst":"Dewijl God overal is, zo kan men Hem niet ontvluchten, of ontvlieden."}],"8":[{"catchword":"in de hel,","tekst":"Zie de aantekening bij Job 26:6 ."}],"9":[{"catchword":"vleugelen","tekst":"Aldus worden de stralen der opgaande zon genaamd, omdat zij snellijk de gehele lucht als doorvliegen. De profeet wil zeggen: Indien ik in een ogenblik vloog tot de allerverst gelegen plaatsen, gelijk de opgaande zon doet."},{"catchword":"aan het uiterste","tekst":"Dat is, aan het uiterste einde der wereld; gelijk Psa 65:6 , en Psa 72:8 ; Isa 24:14 ."}],"10":[{"catchword":"Ook daar zou Uw","tekst":"Daar zou ik ook aan uwe goddelijke bestiering en regering ond rmde substantie, klonter, of embryo. Zie Job 10:10 ."},{"catchword":"al deze dingen","tekst":"Te weten, al mijne leden in dat kluwen en embryo begrepen."},{"catchword":"waren in Uw boek","tekst":"Dat is, Gij gaaft goede achting op alles wat tot mijne schepping diende; of Gij hebt zowel geweten wat mij wedervaren zou, alsof het voor uwe ogen in een boek geschreven stond; te weten, in het boek van de gedachtenissen uwer voorzienige regering."},{"catchword":"toen nog geen van","tekst":"De psalmist wil zeggen dat God al de delen van zijn lichaam geweten heeft, niet alleen toen zij zijn geformeerd geworden, maar van eeuwigheid. Hij roept de dingen die niet zijn alsof zij waren, zegt de apostel, Rom 4:17 ."}],"17":[{"catchword":"hoe kostelijk","tekst":"Dat is, hoe onbegrijpelijk is mij uw voorzienige zorg en regering, waardoor Gij alle dingen in uw eeuwigen raad verordineerd en besloten hebt hoe zij geschieden zullen; Psa 40:6 ; Job 26:14 ."},{"catchword":"haar sommen","tekst":"Hebr. hare hoofden. Zie de aantekening bij Num 1:2"}],"18":[{"catchword":"word ik wakker,","tekst":"Dat is, wanneer ik des morgens ontwaak en uwe werken doorgaans betracht, zo kom ik evenwel niet ten einde, maar blijf altijd bezig met de overlegging derzelfve. Ik ben en blijf met mijne gedachten steeds bij U."}],"19":[{"catchword":"gij, mannen des","tekst":"Heb [ mannen der bloeden ]; dat is, die het bloed der onschuldigen zeer wredelijk vergieten. Zie Psa 5:7 ."}],"20":[{"catchword":"van U","tekst":"Anders, tegen U, te weten: O God, en van of tegen allen, die U beminnen."},{"catchword":"schandelijk","tekst":"Of, lasterlijk, arglistiglijk."},{"catchword":"Uw vijanden","tekst":"De zin is: Zij doen niet alleen zelf kwaad, maar zij verheffen en brengen ook tot staat andere booswichten."}],"21":[{"catchword":"verdriet hebben","tekst":"Of, walg hebben, of een afkeer hebben, of gruwelen."}],"22":[{"catchword":"met volkomen haat,","tekst":"Hebr. met volmaaktheid des haats."},{"catchword":"tot vijanden","t er.27. [thou hast covered me in my mothers belly. [viz. With skin and flesh, or, with the helmer, as we call it, or hood, or bladder which the child lies wrapped about withal in the womb, that is to say, from or since the very time of my conception.]"}],"14":[{"catchword":null,"tekst":"I love thee for that I am made wonderfully, after a very fearful manner; Wonderful are thy works, [Oth. (through) thy wonderfull works] my soul likewise knows it very well."}],"15":[{"catchword":null,"tekst":"My bones were not concealed before thee, when I was made in secret, (and) was wrought like an embroidery [i.e. most artificially: namely, with sinews, veins, arteries, muscles and other parts of the body; even as an Enbroiderer sitteth and joineth many parcels, stuff and wyer-work of various colours, very artificially and curiously together, until there cometh forth some goodly pourtraiture, or other dainty workmanship] in the lowermost parts of the earth, [Thus he called the womb, where in the fruit is formed and fashioned: or, the first Original of men, Gen 2:7. or he assimulates the womb to a grave, wherein man before his birth, lies in a manner buried. Or, by the lowermost parts of the earth, one may understand, that he was formed upon the earth, which is the nethermost part of the world. Compare Eph 4:9.]"}],"16":[{"catchword":null,"tekst":"Thine eyes have seen my unformed clod, [i.e. when I was first planted in my mothers womb, and when the seed, out of which I proceeded, was like clue of yarn, wound up together.oth. my unformed substance, mass, or Embrio. See Job 10:10.] and all these things [to wit, all the parts and members comprehended in that clue and Embio of mine] were written in thy book, [i.e. thou gavest good heed to every thing that conduced to my creating, or bringing forth, or, thou knowest so well what should befall me, as if it were written in a book before thee, namely, in the book of Remembrances of thy provident government] (on) the days when they should Psalmist implies here, that God knew all the parts of his body, not onely when they were a forming, but even from eternity. He calleth the things that are not, as if they were, saith the Apostle Rom.4.v.17.]"}],"17":[{"catchword":null,"tekst":"Therefore how precious O God, are thy thoughts unto me! [i.e. how incomprehensible is thy provident Care and Government unto me? Whereby thou hast ordained and decreed all things in thine eternal Counsel, how they shall come to pass Psa 40:6. Job 26:14.] how mighty many are their summers? [Heb. Their heads. See Numb.1. the Annot.on v.2.]"}],"18":[{"catchword":null,"tekst":"Should I tell them? There is more of them then of the sand: awaking, I am yet with thee. [i.e. When I awake in the morning, and consider of thy works throughout, I can get to no end, but still am taken up with meditating on them. I am and abide still with my thoughts on thee.]"}],"19":[{"catchword":null,"tekst":"O God, that thou wouldest destroy the wicked! And ye men of blood, [Heb. Viri sanguinum (blood in the plural.) i.e. which are so fierce and greedy to shed innocent blood; See Psa 5:7.] turn away from me:"}],"20":[{"catchword":null,"tekst":"Which speak basely [Or blasphemously, craftily] of thee: [others, against thee. To wit, against thee, O God; and also of and against all those that love thee] (and) vainly exalt thine enemies. [this sence is; they do not only evil themselves, but exalt and advance likewise other wicked men and evil doers.]"}],"21":[{"catchword":null,"tekst":"Should I not hate, O LORD, those that hate thee? And be vexed with [Or, loath, abominate, abhor] those that rise up against thee?"}],"22":[{"catchword":null,"tekst":"I hate them with a perfect hatred, [Hebr. With perfection of hatred] to me they are enemies. [I hold and account them mine enemies.]"}],"23":[{"catchword":null,"tekst":"Search me thoroughly, O God, and know my heart: try me, and know my thoughts."}],"24":[{"catchword":null,"tekst":"And see whether with me there be a (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
