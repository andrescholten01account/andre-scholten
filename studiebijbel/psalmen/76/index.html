oor den opperzangmeester, op de Neginoth.","2":"God is bekend in Juda; Zijn Naam is groot in Israël.","3":"En in Salem is Zijn hut, en Zijn woning in Sion.","4":"Aldaar heeft Hij verbroken de vurige pijlen van den boog, het schild, en het zwaard, en den krijg. Sela.","5":"Gij zijt doorluchtiger *en* heerlijker dan de roofbergen.","6":"De stouthartigen zijn beroofd geworden; zij hebben hun slaap gesluimerd; en geen van de dappere mannen hebben hun handen gevonden.","7":"Van Uw schelden, o God van Jakob! is samen wagen en paard in slaap gezonken.","8":"Gij, vreselijk zijt Gij; en wie zal voor Uw aangezicht bestaan, van den tijd Uws toorns af?","9":"Gij deedt een oordeel horen uit den hemel; de aarde vreesde en werd stil,","10":"Als God opstond ten oordeel, om alle zachtmoedigen der aarde te verlossen. Sela.","11":"Want de grimmigheid des mensen zal U loffelijk maken; het overblijfsel der grimmigheden zult Gij opbinden.","12":"Doet geloften en betaalt ze den HEERE, uw God, gij allen, die rondom Hem zijt! Laat hen Dien, Die te vrezen is, geschenken brengen;","13":"Die den geest der vorsten als druiven afsnijdt; Die den koningen der aarde vreselijk is."},"KJV":{"1":"[[To the chief Musician on Neginoth, A Psalm *or* Song of Asaph.]] In Judah *is* God known: his name *is* great in Israel.","2":"[[To the chief Musician on Neginoth, A Psalm *or* Song of Asaph.]] In Judah *is* God known: his name *is* great in Israel.","3":"In Salem also is his tabernacle, and his dwelling place in Zion.","4":"There brake he the arrows of the bow, the shield, and the sword, and the battle. Selah.","5":"Thou *art* more glorious *and* excellent than the mountains of prey.","6":"The stouthearted are spoiled, they have slept their sleep: and none of the men of might have found their hands.","7":"At thy rebuke, O God of Jacob, both the chariot and horse are cast into a dead sleep.","8":"Thou, *even* thou, *art* to be feared: and who may stand in thy sight when once thou art angry?","9":"Thou didst cause judgment to be heard from heaven; the earth feared, and was still,","10":"When God arose to judgment, to save all the meek of the earth. Selah.","11":"Surely the wrath of man shall praise thee: the remainder of wrath shalt thou restrain.","12":"Vow, and pay unto the LORD your God: let all that be round about him bring presents unto him that ought to be feared.","13":"He shall cut off the spirit of princes: *he is* terrible to the kings of the earth."}},"tsk":{"2":[{"kopje":"In Juda","refs":["Ps 48:2-4","Ps 147:19","Ps 147:20","Deut 4:7","Deut 4:8","Deut 4:34-36","Hand 17:23","Rom 2:17-29","Rom 3:1","Rom 3:2"]},{"kopje":"Zijn","refs":["Ps 98:2","Ps 98:3","Ps 148:13","Ps 148:14","1 Kron 29:10-12","2 Kron 2:5","2 Kron 2:6","Dan 3:29","Dan 4:1","Dan 4:2"]}],"3":[{"kopje":"Salem","refs":["Gen 14:18","Hebr 7:1","Hebr 7:2"]},{"kopje":"woning","refs":["Ps 132:13","Ps 132:14","2 Kron 6:6","Jes 12:6"]}],"4":[{"kopje":"Daar","refs":["Ps 46:10","2 Kron 14:12","2 Kron 14:13","2 Kron 20:25","2 Kron 32:21","Jes 37:35","Jes 37:36","Ezech 39:3","Ezech 39:4","Ezech 39:9","Ezech 39:10"]}],"5":[{"kopje":"bergen","refs":["Jer 4:7","Ezech 19:1-4","Ezech 19:6","Ezech 38:12","Ezech 38:13","Dan 7:4-8","Dan 7:17-28"]}],"6":[{"kopje":"stouthartigen","refs":["Job 40:5-7","Jes 46:12","Dan 4:37","Luk 1:51","Luk 1:52"]},{"kopje":"zij","refs":["Ps 13:4","Jes 37:36","Jer 51:39","Nahum 3:18"]},{"kopje":"en","refs":["Jes 31:8","Ezech 30:21-25"]}],"7":[{"kopje":"Van Uw","refs":["Ps 18:16","Ps 80:17","Ps 104:7","Ex 15:1","Ex 15:21"]},{"kopje":"samen","refs":["Ex 14:27","Ex 14:28","Ex 15:4-6","Ex 15:10","2 Sam 10:18","Jes 37:36","Ezech 39:20","Nahum 1:6","Nahum 2:13","Nahum 3:18","Zach 12:4"]},{"kopje":"gezonken","refs":["1 Sam 26:12","Jer 51:39","Jer 51:57"]}],"8":[{"kopje":"U","refs":["Ps 89:8","Jer 10:7-10","Matt 10:28","Openb 14:7","Openb 15:4"]},{"kopje":"wie","refs":["Ps 90:11","Nahum 1:6","1 Kor 10:22","Openb 6:16","Openb 6:17"]},{"kopje":"vanaf het moment","refs":["Ps 2:12"]}],"9":[{"kopj jn zowel elkander als Gods volk tezamen, gelijk wilde dieren, te roven. Anders: Gij zijt doorluchtig en heerlijk van, of vanwege de roofbergen; dat is, Gij hebt ere ingelegd en uw heerlijke macht betoond op de bergen; vanwaar de vijanden [gelijk wilde beesten] ons meenden te roven en te verscheuren, daar hebt Gij hen verdaan en hen ons tot een roof gegeven, gelijk in het volgende verklaard wordt."}],"6":[{"catchword":"stouthartigen","tekst":"Hebr. sterken van hart."},{"catchword":"slaap","tekst":"Dat is, den langen slaap, den dood. Verg. Jer 51:39 , Jer 51:57 ; Psa 13:4 . Dit wordt bij sommigen geduid op de verslagenen van den engel ten tijde van Hizkia; 2Ki 19:35 ."},{"catchword":"geen van","tekst":"Hebr. alle mannen der dapperheid hebben hunne handen niet gevonden; dat is, zij zijn als handeloos geweest, hebben tegenweer kunnen bieden."}],"7":[{"catchword":"schelden,","tekst":"Zie Psa 9:6 ."},{"catchword":"wagen","tekst":"Dat is, beiden, grote en gemene krijgslieden, die op wagens en paarden reden, waarop zij gewoon waren te strijden; zie Jdg 4:3 , Jdg 4:13 , Jdg 4:15 ; 2Sa 10:18 ; 1Ki 22:31 , 1Ki 22:34 ."}],"8":[{"catchword":"van den","tekst":"Hebr. van alsdan, of van toen uws toorns? dat is, van dien tijd af, of wanneer Gij toornig zijt, of uw toorn begint in het werk te stellen."}],"9":[{"catchword":"deedt","tekst":"Dat is, als Gij een vonnis liet horen, enz. zo vreesde, enz. Of, Gij laat horen, en zo in het volgende."},{"catchword":"hemel;","tekst":"Verg. 2Ki 19:32-35 ; Jdg 5:20 ; 2Sa 22:7-8 , enz."},{"catchword":"de aarde","tekst":"Of, het land; alzo in vs.10."}],"10":[{"catchword":"zachtmoedigen","tekst":"Zie Psa 10:17 ."}],"11":[{"catchword":"loffelijk","tekst":"Dat is, zal U tot lof en eer gedijen. De zin is: Hoe de vijanden met meerder hittigheid tegen U en uw volk ontstoken zijn en woeden, hoe meer eer Gij zult inleggen in het beschermen van uw volk en het dempen der vijanden."},{"catchword":"opbinden","tekst":"Of, aangorden. Dit kan men alzo verstaan, dat God de overgebleven grimmige vijanden ook zal bedwingen, gelijk men iemand met een gordel of band bindt en dwingt. Of, Hij zal zijn volk, dat van des vijands grimmigheid verlost en overgebleven is, met macht en moed aangorden om de vijanden tegen te staan. Beide heeft een goeden zin; men kan het ook verstaan van God, dat Hij het overige zijner grimmigheid zal aangorden, om zijne vijanden voorts te vernielen."}],"12":[{"catchword":"geloften","tekst":"Gelijk de vromen in zwarigheid, en daaruit verlost zijnde, plegen te doen. Zie Gen 28:20 , enz; Psa 66:13-15 ; Jon 1:16 . Verg. ook boven Psa 61:6 ."},{"catchword":"rondom","tekst":"Dat is, Gods volk, dat zich aan en bij Hem houdt; gelijk de stammen rondom den tabernakel gelegerd waren, Num 2:2 , enz., en de priesters en Levieten als rondom God stonden om Hem te dienen; idem de vier en twintig oudsten rondom Gods troon; Rev 4:4 ."},{"catchword":"die te","tekst":"Hebr. eigenlijk, der vrees; dat is, dien men hogelijk schuldig is te vrezen, te weten, den God van Israël. Verg. Gen 31:53 ."},{"catchword":"geschenken","tekst":"Verg. 2Ch 32:21 , 2Ch 32:23 ."}],"13":[{"catchword":"vorsten","tekst":"Of, voorgangers, leidslieden."},{"catchword":"afsnijdt","tekst":"Of, afplukt, afleest; dat is, [volgens de betekenis van het Hebreeuwse woord] die den groten het leven, en ook verstand en moed, zo haast en licht ontneemt, gelijk men druiven in den wijnoogst afleest. Zie dezelfde gelijkenis Jdg 20:45 , met de aantekeningen, en Rev 14:18-20 , en verg. in het bijzonder 2Ch 32:21 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A Psalm, or Hymn of Asaph [See Psalm 48.on verse 1.] for the chief song-master: See Psa.4.on v.1.] on Neginoth. (76:2) God is known in Juda: his Name is great in Israel."}],"2":[{"catchword":null,"tekst":"A Psalm, or Hymn of Asaph [See Psalm 48.on verse 1.] for the chief song-master: See Psa.4.on v.1.] on Neginoth. (76:2) God is known in Juda: his Name is great in Israel."}],"3":[{"catchword":null,"tekst":"(3) And in Salem [i.e. Jerusalem, as Gen 14:18. Compare Psa 48:2,3,4,9. And see Hebr.7.1.] is his Tent: [i.e. his Tabernacle, or Temple; hereby it appeareth plainly, that Salem and Jerusalem is one and the same] and his habitation in Zion."}],"4":[{"catchword":null,"tekst":"(4) There hath he broken: [Compare Psa 46:10.] the fiery arrows of the bow: [Heb. The fierce coals, or sparks of the bow, i.e. the fiery, or sparkling glistering arrows, or the glistering bow (of steel) as some take it] the shield, and the sword, and the war, Sela! [see Psalm 3.on verse 3.]"}],"5":[{"catchword":null,"tekst":"(5) Thou art more illustratrious (and) more glorious, then the mountains of prey; [Hereby do some understand the mighty Kings and Kingdoms (compared sometimes in scripture to mountains) with whom it is usual, to prey both one upon another, and upon the people of God, even like the wild beasts, following and worrying their prey. Oth. Thou art illustrious and glorious from, or (by reason of) the mountains of prey: i.e. thou hast got thy self great honour, and shewed thy power upon the mountains; from whence the enemies, like so many wild beasts, made account to prey upon and devour us; there hast thou consumed them, and made them a prey to us, as is declared in the sequel.]"}],"6":[{"catchword":null,"tekst":"(6) The stout-hearted are spoiled: [Heb. The strong of heart] they have stumbered their sleep: [i.e. the long and lasting sleep of death, their deadly sleep. Compare Jer 51:39,57. Psa 13:4. this is applied by some to those destroyed by the Angel in the days of Hiskia. 2 King.19.35.] and none of the valiant men have found their hands. [Heb. All men of valour have not found their hands; i.e. they were as if they had no hands; they were not able to make the least resistance, or defence.]"}],"7":[{"catchword":null,"tekst":"(7) For thy rebuke, [Psalm 9.on v.6.] O God of Jacob, both chariot and horse are sunk asleep. [i.e. both the great and the common souldier, which were wont to ride on chariots and horses, were dismayed all together: see Jud 4:3,13,15. 2 Sam.10.on verse 18. 1 King.22.31,34.]"}],"8":[{"catchword":null,"tekst":"(8) Thou, thou art fearful: and who shall stand before thy face, from the time wrath? [Hebr. From then, or thence of thy wrath? i.e. from that very time; or when thou art wroth: or beginnest to exercise and let forth thine anger.]"}],"9":[{"catchword":null,"tekst":"(9) Thou madest a judgement heard out of heaven; [Compare 2 King.19.32,33,34,35. Jud 5:20. 2 Sam.2.7,8. Etc.] the earth [or the land; and so in the next verse] feared and was still: [i.e. when thou madest thy judgement to be heard, etc. Then the earth feared, etc. Or, thou makest a judgement to be heard, etc. And so in the sequel.]"}],"10":[{"catchword":null,"tekst":"(10) When God arose to judgement, for to deliver all the meek of the earth. [See Psalm 10.on v.17.] Sela! [see Psal.3.on v.3.]"}],"11":[{"catchword":null,"tekst":"(11) For the fierceness of man shall make thee praise-worthy: [i.e. shall serve to get thee praise and honour. The sence is, the more eager and furious the enemies are against tee and thy people, the more honour and glory shalt thou get in protecting thy people and quelling the enemy.] thou shalt bind up the remnant of fiercenesses; [or fird, etc. This may be understood, that God shall likewise subdue the remaining fierce enemies, even as one girds or binds and ties a body, from stirring at pleasure: or else: He shall gird the remainder of his people, those that are left over and delivered from the fierceness of the enemy) with strength and courage to withstand their enemies. Both meanings are good: though it may likewise be understood of God himself, that he shall gird his fierceness about him, for the utter destruction of his enemies.]"}],"12":[{"catchword":null,"tekst":"(12) Make vows, [As the godly use to do it times of trouble, and being delivered out of the same. See Gen 28:20. &c. Psa 66:13,14,15. Jer 1:16. Compare also above Psal.61.on v.6.] and pay them to the LORD your God, all ye that are round about him. [i.e. all Gods people, that adhere unto and depend on him, even as the Tribes encamped round about the Tabernacle, Num 2:2, &c. And the Priests and Levites were placed round about God to serve him, and again the Elders round about God to serve him, and again the Elders round about the Throne of God, Revel.4.4.] Let them bring gifts [Compare 2 Chron.32.21,23.] to him that is to be feared. [Heb. Properly, to him of fear, that is of whom every one ought to stand in fear, to wit, the God of Israel; Compare Gen 31:53.]"}],"13":[{"catchword":null,"tekst":"(13) That cutteth off the spirit of Princes, [Or, foregoers, leaders, (cutteth off) or plucketh off, gathereth] us grapes [the meaning is (according to the Emphasis of the Hebrew phrase) that God doth as suddenly and easily take away the life, understanding and courage of the great ones, as grapes are pluck and gathered in the Vintage. See the same comparison, Jud 20:45. with the Annotations: and Rev.14.v.18,19, 20. And compare in particular, 2 Chron.32.21.] that is dreadfull to the kings of the earth."}]}}};

function refUrl(ref) {

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

document.addEventListener('click', e => {

    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
