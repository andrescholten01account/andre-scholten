","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een onderwijzing, voor de koorleider[1], onder de kinderen van Korach.","2":"O God! Wij hebben het met onze oren gehoord, onze vaders hebben het ons verteld: Wat een werk hebt U gedaan in hun dagen, in de dagen van vroeger.","3":"U hebt de heidenvolken met Uw hand uit de bezitting verdreven, maar hen geplant; U hebt de volken geplaagd, hen daarentegen doen voortschieten.","4":"Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.","5":"U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.","6":"Door U zullen wij onze tegenstanders met hoorns stoten; in Uw Naam zullen wij vertrappen die tegen ons opstaan.","7":"Want ik vertrouw niet op mijn boog, en mijn zwaard zal mij niet verlossen.","8":"Maar U verlost ons van onze tegenstanders, en U maakt onze haters beschaamd.","9":"In God roemen wij de hele dag, en Uw Naam zullen wij loven tot in eeuwigheid. Sela.","10":"Maar *nu* hebt U ons verstoten en te schande gemaakt, omdat U met onze legers niet uittrekt.","11":"U doet ons achterwaarts keren van de tegenstander; en onze haters beroven *ons* voor zichzelf.","12":"U geeft ons over als schapen ten voedsel, en U verstrooit ons onder de heidenvolken.","13":"U verkoopt Uw volk voor niets; en U verhoogt hun prijs niet.","14":"U stelt ons tot smaad voor onze naburen, tot spot en schimp voor hen die rondom ons zijn.","15":"U stelt ons tot een spreekwoord onder de heidenvolken, tot een hoofdschudden onder de volken.","16":"Mijn schande is de hele dag voor mij, en de schaamte van mijn aangezicht bedekt mij;","17":"Om de stem van hem die hoont en lastert, vanwege de vijand en de wraakgierige.","18":"Dit alles is ons overkomen, toch hebben wij U niet vergeten, en niet vals gehandeld tegen Uw verbond.","19":"Ons hart is niet achterwaarts gekeerd, en onze gang niet geweken van Uw pad.","20":"Hoewel U ons verpletterd hebt in een plaats van de draken, en ons met een doodsschaduw bedekt hebt.","21":"Als wij de Naam van onze God hadden vergeten, en onze handen tot een vreemde god uitgebreid,","22":"Zou God dat niet onderzoeken? Want Hij kent de verborgenheden van het hart.","23":"Maar om Uwentwil worden wij de hele dag gedood; wij worden geacht als slachtschapen.","24":"Waak op, waarom zou U slapen, Heere! Ontwaak, verstoot niet tot in eeuwigheid.","25":"Waarom zou U Uw aangezicht verbergen, onze ellende en onze onderdrukking vergeten?","26":"Want onze ziel is in het stof neergebogen; onze buik kleeft aan de aarde.","27":"Sta op, ons ter hulp, en verlos ons om Uw goedertierenheid."},"SV":{"1":"Een onderwijzing, voor den opperzangmeester, onder de kinderen van Korach.","2":"O God! wij hebben het met onze oren gehoord, onze vaders hebben het ons verteld: Gij hebt een werk gewrocht in hun dagen, in de dagen van ouds.","3":"Gij hebt de heidenen met Uw hand uit de bezitting verdreven, maar henlieden geplant; Gij hebt de volken geplaagd, henlieden daarentegen doen voortschieten.","4":"Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht Uws aangezichts, omdat Gij een welbehagen in hen hadt.","5":"Gij Zelf zijt mijn Koning, o God! gebied de verlossingen Jakobs.","6":"Door U zullen wij onze wederpartijders met hoornen stoten; in Uw Naam zullen wij vertreden, die tegen ons opstaan.","7":"Want ik vertrouw niet op mijn boog, en mijn zwaard zal mij niet verlossen.","8":"Maar Gij verlost ons van onze wederpartijders, en Gij maakt onze haters beschaamd.","9":"In God roemen wij den gansen dag, en Uw Naam zullen wij loven in eeuwigheid. Sela.","10":"Maar *nu* hebt Gij ons verstoten en te schande gemaakt, dewijl Gij met onze krijgsheiren niet uittrekt.","11":"Gij doet ons achterwaarts keren van den wederpartijder; en onze haters beroven *ons* voor zich.","12":"Gij geeft ons over als schapen ter spijze, en Gij verstrooit ons onder de heidenen.","13":"Gij verkoopt Uw volk om geen waardij; en Gij verhoogt hun prijs niet.","14":"Gij stelt ons onze naburen tot smaad, tot spot en schimp dengenen, die rondom ons zijn.","15":"Gij stelt ons tot een spreekwoord onder de heidenen, tot een hoofdschudding onder de volken.","16":"Mijn schande is den gansen dag voor mij, en de schaamte mijns aangezichts bedekt mij;","17":"Om de stem des honers en des lasteraars, vanwege den vijand en den wraakgierige.","18":"Dit alles is ons overkomen, nochtans hebben wij U niet vergeten, noch valselijk gehandeld tegen Uw verbond.","19":"Ons hart is niet achterwaarts gekeerd, noch onze gang geweken van Uw pad.","20":"Hoewel Gij ons verpletterd hebt in een plaats der draken, en ons met een doodsschaduw bedekt hebt.","21":"Zo wij den Naam onzes Gods hadden vergeten, en onze handen tot een vreemden God uitgebreid,","22":"Zou God zulks niet onderzoeken? Want Hij weet de verborgenheden des harten.","23":"Maar om Uwentwil worden wij den gansen dag gedood; wij worden geacht als slachtschapen.","24":"Waak op, waarom zoudt Gij slapen, Heere! Ontwaak, verstoot niet in eeuwigheid.","25":"Waarom zoudt Gij Uw aangezicht verbergen, onze ellende en onze onderdrukking vergeten?","26":"Want onze ziel is in het stof nedergebogen; onze buik kleeft aan de aarde.","27":"Sta op, ons ter hulp, en verlos ons om Uwer goedertierenheid wil."},"KJV":{"1":"[[To the chief Musician for the sons of Korah, Maschil.]] We have heard with our ears, O God, our fathers have told us, *what* work thou didst in their days, in the times of old.","2":"[[To the chief Musician for the sons of Korah, Maschil.]] We have heard with our ears, O God, our fathers have told us, *what* work thou didst in their days, in the times of old.","3":"*How* thou didst drive out the heathen with thy hand, and plantedst them; *how* thou didst afflict the people, and cast them out.","4":"For they got not the land in possession by their own sword, neither did their own arm save them: but thy right hand, and thine arm, and the light of thy countenance, because thou hadst a favour","5":"Thou art my King, O God: command deliverances for Jacob.","6":"Through thee will we push down our enemies: through thy name will we tread them under that rise up","7":"For I will not trust in my bow, neither shall my sword save","8":"But thou hast saved us from our enemies, and hast put them to shame that hated","9":"In God we boast all the day long, and praise thy name for ever. Selah.","10":"But thou hast cast off, and put us to shame; and goest not forth with our armies.","11":"Thou makest us to turn back from the enemy: and they which hate us spoil","12":"Thou hast given us like sheep *appointed* for meat; and hast scattered us among the heathen.","13":"Thou sellest thy people for nought, and dost not increase *thy wealth* by their price.","14":"Thou makest us a reproach to our neighbours, a scorn and a derision to them that are round about","15":"Thou makest us a byword among the heathen, a shaking of the head among the people.","16":"My confusion *is* continually before me, and the shame of my face hath covered","17":"For the voice of him that reproacheth and blasphemeth; by reason of the enemy and avenger.","18":"All this is come upon us; yet have we not forgotten thee, neither have we dealt falsely in thy covenant.","19":"Our heart is not turned back, neither have our steps declined from thy way;","20":"Though thou hast sore broken us in the place of dragons, and covered us with the shadow of death.","21":"If we have forgotten the name of our God, or stretched out our hands to a strange god;","22":"Shall not God search this out? for he knoweth the secrets of the heart.","23":"Yea, for thy sake are we killed all the day long; we are counted as sheep for the slaughter.","24":"Awake, why sleepest thou, O Lord? arise, cast *us* not off for ever.","25":"Wherefore hidest thou thy face, *and* forgettest our affliction and our oppression?","26":"For our soul is bowed down to the dust: our belly cleaveth unto the earth.","27":"Arise for our help, and redeem us for thy mercies'"}},"tsk":{"2":[{"kopje":"gehoord","refs":["Ps 22:32","Ps 71:18","Ps 78:3-6","Ps 105:1","Ps 105:2","Ex 12:24-27","Ex 13:14","Ex 13:15","Jes 38:19","Joël 1:3"]},{"kopje":"in de dagen","refs":["Num 21:14-16","Num 21:27-30","Job 8:8","Job 8:9","Job 15:17-19"]}],"3":[{"kopje":"verdreven","refs":["Ps 78:55","Ps 80:9","Ps 105:44","Ps 135:10-12","Ps 136:17-22","Ex 15:17","Ex 15:19","Ex 34:11","Deut 7:1","Joz 10:42","Joz 11:23","Joz 21:43","Neh 9:22-27"]},{"kopje":"geplaagd","refs":["Ps 89:10","Ezech 17:6","Jer 17:8","Ex 23:28","Num 13:32","Joz 10:11","Joz 24:12","1 Sam 5:6","1 Sam 5:7"]}],"4":[{"kopje":"Want","refs":["Deut 4:37","Deut 4:38","Deut 8:17","Deut 8:18","Joz 24:12","Zach 4:6","2 Kor 4:7"]},{"kopje":"Uw rechterhand","refs":["Ps 17:7","Ps 20:7","Ps 74:11","Ex 15:16","Jes 63:12"]},{"kopje":"licht","refs":["Ps 42:6","Ps 42:12","Ps 80:17"]},{"kopje":"omdat","refs":["Num 14:8","Deut 7:7","Deut 7:8","1 Sam 12:22","Mal 1:2","Mal 1:3","Rom 9:10-15"]}],"5":[{"kopje":"mijn Koning","refs":["Ps 74:12","Ps 89:19","Ps 149:2","Jes 33:22"]},{"kopje":"Gebied","refs":["Ps 42:9","Mark 1:25","Mark 1:26","Mark 1:31 pan> <span class=\"wl wl-kjv\" data-code=\"H3444\">deliverances</span> for Jacob.","6":"Through thee will we push <span class=\"wl wl-kjv\" data-code=\"H5055\">down</span> our <span class=\"wl wl-kjv\" data-code=\"H6862\">enemies:</span> through thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> will we tread them <span class=\"wl wl-kjv\" data-code=\"H947\">under</span> that rise up","7":"For I will not <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> in my <span class=\"wl wl-kjv\" data-code=\"H7198\">bow,</span> neither shall my <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> save","8":"But thou hast <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> us from our <span class=\"wl wl-kjv\" data-code=\"H6862\">enemies,</span> and hast put them to <span class=\"wl wl-kjv\" data-code=\"H954\">shame</span> that hated","9":"In <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> we <span class=\"wl wl-kjv\" data-code=\"H1984\">boast</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> long, and <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span> Selah.","10":"<span class=\"wl wl-kjv\" data-code=\"H637\">But</span> thou hast cast <span class=\"wl wl-kjv\" data-code=\"H2186\">off,</span> and put us to <span class=\"wl wl-kjv\" data-code=\"H3637\">shame;</span> and goest not <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> with our armies.","11":"Thou makest us to <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> <span class=\"wl wl-kjv\" data-code=\"H268\">back</span> from the <span class=\"wl wl-kjv\" data-code=\"H6862\">enemy:</span> and they which <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> us spoil","12":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> us like <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> appointed for <span class=\"wl wl-kjv\" data-code=\"H3978\">meat;</span> and hast <span class=\"wl wl-kjv\" data-code=\"H2219\">scattered</span> us among the heathen.","13":"Thou <span class=\"wl wl-kjv\" data-code=\"H4376\">sellest</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> for <span class=\"wl wl-kjv\" data-code=\"H1952\">nought,</span> and dost not <span class=\"wl wl-kjv\" data-code=\"H7235\">increase</span> thy wealth by their price.","14":"Thou <span class=\"wl wl-kjv\" data-code=\"H7760\">makest</span> us a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> to our <span class=\"wl wl-kjv\" data-code=\"H7934\">neighbours,</span> a <span class=\"wl wl-kjv\" data-code=\"H3933\">scorn</span> and a <span class=\"wl wl-kjv\" data-code=\"H7047\">derision</span> to them that are round about","15":"Thou <span class=\"wl wl-kjv\" data-code=\"H7760\">makest</span> us a <span class=\"wl wl-kjv\" data-code=\"H4912\">byword</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> a <span class=\"wl wl-kjv\" data-code=\"H4493\">shaking</span> of the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> among the people.","16":"My <span class=\"wl wl-kjv\" data-code=\"H3639\">confusion</span> is <span class=\"wl wl-kjv\" data-code=\"H3117\">continually</span> before me, and the <span class=\"wl wl-kjv\" data-code=\"H1322\">shame</span> of my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> hath covered","17":"For the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of him that <span class=\"wl wl-kjv\" data-code=\"H2778\">reproacheth</span> and <span class=\"wl wl-kjv\" data-code=\"H1442\">blasphemeth;</span> by <span class=\"wl wl-kjv\" data-code=\"H6440\">reason</span> of the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> and avenger.","18":"All this is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon us; yet have we not <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> thee, neither have we dealt <span class=\"wl wl-kjv\" data-code=\"H8266\">falsely</span> in thy covenant.","19":"Our <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is not <span class=\"wl wl-kjv\" data-code=\"H5472\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H268\">back,</span> neither have our <span class=\"wl wl-kjv\" data-code=\"H838\">steps</span> <span class=\"wl wl-kjv\" data-code=\"H5186\">declined</span> from thy way;","20":"Though thou hast sore <span class=\"wl wl-kjv\" data-code=\"H1794\">broken</span> us in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of <span class=\"wl wl-kjv\" data-code=\"H8577\">dragons,</span> and <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> us with the shadow of death.","21":"If we have <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> or stretched <span class=\"wl wl-kjv\" data-code=\"H6566\">out</span> our <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> to a <span class=\"wl wl-kjv\" data-code=\"H2114\">strange</span> god;","22":"Shall not <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> search this <span class=\"wl wl-kjv\" data-code=\"H2713\">out?</span> for he <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> the <span class=\"wl wl-kjv\" data-code=\"H8587\">secrets</span> of the heart.","23":"Yea, for thy sake are we <span class=\"wl wl-kjv\" data-code=\"H2026\">killed</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> long; we are <span class=\"wl wl-kjv\" data-code=\"H2803\">counted</span> as <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> for the slaughter.","24":"<span class=\"wl wl-kjv\" data-code=\"H5782\">Awake,</span> why <span class=\"wl wl-kjv\" data-code=\"H3462\">sleepest</span> thou, O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord?</span> <span class=\"wl wl-kjv\" data-code=\"H6974\">arise,</span> cast us not <span class=\"wl wl-kjv\" data-code=\"H2186\">off</span> for ever.","25":"Wherefore <span class=\"wl wl-kjv\" data-code=\"H5641\">hidest</span> thou thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and <span class=\"wl wl-kjv\" data-code=\"H7911\">forgettest</span> our <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction</span> and our oppression?","26":"For our <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> is bowed <span class=\"wl wl-kjv\" data-code=\"H7743\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust:</span> our <span class=\"wl wl-kjv\" data-code=\"H990\">belly</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">cleaveth</span> unto the earth.","27":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise</span> for our <span class=\"wl wl-kjv\" data-code=\"H5833\">help,</span> and <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem</span> us for thy mercies'"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"onderwijzing","tekst":"Zie van deze titel Psa 42:1 ."},{"catchword":"vaders","tekst":"Dat is, voorvaders, de een voor, de ander na."},{"catchword":"dagen","tekst":"Hebr. dagen der oudheid."}],"2":[{"catchword":"onderwijzing","tekst":"Zie van deze titel Psa 42:1 ."},{"catchword":"vaders","tekst":"Dat is, voorvaders, de een voor, de ander na."},{"catchword":"dagen","tekst":"Hebr. dagen der oudheid."}],"3":[{"catchword":"henlieden","tekst":"Te weten, onze voorvaders."},{"catchword":"geplaagd","tekst":"Hebr. kwaad gedaan; dat is, in het verderf gebracht, allerlei plagen aangedaan."},{"catchword":"voortschieten","tekst":"Als een wijnstok wijd en zijd uit gebreid. Zie Psa 80:9-10 enz."}],"4":[{"catchword":"heil","tekst":"Of, overwinning. Zie 2Sa 8:6 ."},{"catchword":"licht","tekst":"Dat is, uw genadige tegenwoordigheid, gunst en bijstand. Verg. Psa 43:3 , en Num 6:25-26 ."}],"5":[{"catchword":"mijn Koning","tekst":"Aldus spreekt de profeet hier, en in het volgende, in den naam van de kerk."},{"catchword":"gebied","tekst":"Gelijk Psa 42:9 . Zie Lev 25:21 ."},{"catchword":"Jakobs","tekst":"Dat is, Jakobs nakomelingen, uw volk Israël."}],"6":[{"catchword":"hoornen","tekst":"Een gelijkenis, genomen van de gehoornde beesten. Zie Deu 33:17 ."}],"9":[{"catchword":"Sela","tekst":"Zie Psa 3:3 ."}],"11":[{"catchword":"achterwaarts","tekst":"Dat is, doet ons vluchten voor onze vijanden. Of, hebt ons achterwaarts doen keren, en zo in het volgende."},{"catchword":"voor zich","tekst":"Zij roven ons goed en have tot hun voordeel, makende zich rijk van het onze, dat zij geroofd hebben."}],"12":[{"catchword":"schapen","tekst":"Hebr. schapen der spijze; dat is, die men slacht en opeet. Verg. vs.23."}],"13":[{"catchword":"om geen","tekst":"Hebr. om geen goed, of rijkdom; of voor hetgeen geen rijkdom is, geen goed verstrekt; dat is, als omniet; zij worden wel als een verkochte waar aan den vijand overgeleverd, maar zonder prijs."},{"catchword":"verhoogt","tekst":"Hebr. vermeerderd, vergroot, niet in hunne prijzen, of schattingen. De manier van spreken schijnt genomen te zijn van de gewoonte, die men houdt in verkopen, daar men gemeenlijk den geboden prijs verhoogt als de waar van enige waarde is. Maar de profeet wil zeggen dat Gods volk alzo verkocht wordt, alsof het de moeite niet waard ware meer te eisen of te doen bieden dan de koper ten eerste voorstelde; dat is te zeggen dat zij van zeer klein waarde geacht zijn, ja snoder dan gemene slaven, die men zo op het eerste bod nog niet verkoopt, welker prijs nog wel verhoogd wordt. Verg. Deu 28:68 . Anders, Gij doet geen voordeel, of, Gij vermeerderd, [dat is, Gij verrijkt,] U niet van hun prijs, Gij bekomt geen voordeel, of gewin van hun prijs, omdat de vijand hen als voor niet wegneemt, dat het eigenlijk geen koop kan heten."}],"15":[{"catchword":"hoofdschudding","tekst":"Zie 1Ki 9:8 ; 2Ki 19:21 ."}],"18":[{"catchword":"wij U","tekst":"Dit is te verstaan van de vromen en verstandigen on der het volk, die alhier klagen dat zij dit niet lijden als boosdoeners en affalligen van God, maar integendeel omdat zij God en zijn woord vastelijk aanhangen, gelijk zij, betuigen, vs.23."}],"19":[{"catchword":"pad","tekst":"Dat is, de geboden, waarin Gij ons bevolen hebt te wandelen."}],"20":[{"catchword":"draken","tekst":"Hierdoor kan men verstaan de heidense tirannene. Hebr. des draaks. Anders, der walvissen; dat is, als in de zee, dat is in de allergrootste noden, uiterste gevaren."},{"catchword":"doodsschaduw","tekst":"Zie Psa 25:4 ."}],"21":[{"catchword":"uitgebreid","tekst":"Om dien te aanbidden. Verg. Exo 9:29 ; 1Ki 8:22 ; Psa 143:6 ."}],"23":[{"catchword":"om","tekst":"Omdat wij van U niet willen afwijken, maar in uw verbond volharden."}],"24":[{"catchword":"Waak op","tekst":"Menselijk van God gesproken, gelijk elders dikwijls, wanneer God zijne hulp intrekt; anderszins slaapt en sluimert Hij niet; Psa 121:4 ."}],"26":[{"catchword":"stof","tekst":"Wij zijn ten uiterste vernederd, verdrukt, veracht, moedeloos en verslagen. Verg. Psa 113:7 , en Psa 119:25 ; idem Lam 3:29 ."}],"27":[{"catchword":"ter hulpe","tekst":"Anders: ons tot een volkomen hulp; om uit te drukken dat het Hebr. woord hier een letter meer heeft dan gewoonlijk. Verg. Psa 3:3 , en onder Psa 63:8 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"An Instruction, [See of this title Psa.42.on v.1.] for the chief song-master, among the children of Korah. (44:2) O God we have heard it with our ears, our Fathers have told it us, [i.e. our progenitors, fore-fathers] thou hast wrought a work in their days, in the days of old. [Heb. Days of oldness.]"}],"2":[{"catchword":null,"tekst":"An Instruction, [See of this title Psa.42.on v.1.] for the chief song-master, among the children of Korah. (44:2) O God we have heard it with our ears, our Fathers have told it us, [i.e. our progenitors, fore-fathers] thou hast wrought a work in their days, in the days of old. [Heb. Days of oldness.]"}],"3":[{"catchword":null,"tekst":"(3) Thou hast driven away the heathens out of the possession, but planted them; [Our forefathers] thou hast plagued the nations [Heb. Done evil to, i.e. destroyed them, brought all manner of plagues upon them] and contrarily made them to propagate. [Like unto a vine, spread abroad at Large. See Psa 80:9,10,&c.]"}],"4":[{"catchword":null,"tekst":"(4) For they have not inherited the Land by their sword, and their arm hath given them no salvation, [Or conquest, victory. See 2 Sam.8.on v.6.] but thy right hand and thine arm, and the light of thy face, [or countenance i.e. thy gracious presence, favour and assistance. Comp.Psa.43.on v.3. and Numb.6.on v.25,26.] because thou hadst a well-pleasing in them."}],"5":[{"catchword":null,"tekst":"(5) Thou thy self art my King, O God; [Thus the Prophet speaketh here, and in the sequel, in the name and behalf of the Church] command the salvations [Psa 42:9. see Lev.25.on verse 21.] of Jacob, (i.e. of Jacobs posterity, thy people Israel.]"}],"6":[{"catchword":null,"tekst":"(6) Through thee shall we push our Enemies with horns: [A similitude taken from horned beasts, see Duet.33.on verse 17.] in thy name shall we trample those that rise up against us."}],"7":[{"catchword":null,"tekst":"(7) For I do not trust in my Bow, and my sword shall not save me."}],"8":[{"catchword":null,"tekst":"(8) But thou savest us from our Adversaries, and thou makest our haters ashamed."}],"9":[{"catchword":null,"tekst":"(9) In God we glory all the day, and we will praise thy name in eternity, Sela! [See Psa.3.on verse 3.]"}],"10":[{"catchword":null,"tekst":"(10) But (now) hast thou rejected and ashamed us; because thou marchest not forth with our host."}],"11":[{"catchword":null,"tekst":"(11) Thou makest us to turn backwards from our adversaries, [i.e. to fly before our Enemies, or hast made us to turn backwards, and so in sequel] and our haters rob us, for them(selves.) [i.e. they spoil us of our goods for their profit, enriching themselves with our propriety which they have robbed us of.]"}],"12":[{"catchword":null,"tekst":"(12) Thou givest us up like sheep for food, [Heb. Sheep of food, i.e. such as are slain and fed on, compare verse 23.] and thou scatterest us among the Heathen."}],"13":[{"catchword":null,"tekst":"(13) Thou sellest thy people for no value, [Heb. For no good, or richs, or for that which is no riches, yields no good.i.e. as for nothing, they are indeed delivered over as sold wares, but without a price] and thou doest not raise (or, enhaunce) their price. [Heb. Dost not multiply, or magnify in their price; or, set them to strive for the price. The manner of speaking seems to be taken from a custom they had in selling, where usually the bidden price is raised, if the ware be of any value: but the Prophet doth imply, that Gods people is sold away, as if it were not worth the pains of asking more, or making the buyer to bid more then he offered at first; that is to say, they were very little esteemed, yea far less then the very slaves, who are not sold off straight for the first bidding, whose price is at least kept up a while, if not raised higher, compare Deut.28.68. Oth. Thou makest no profit; or thou dost not multiply (i.e. enrich thy self) of their price: thou gettest no advantage, or gain of (or by) their price; the Enemy taking and carrying them away as for nothing, that the sale makes no return at all.]"}],"14":[{"catchword":null,"tekst":"(14) Thou settest us (for) a reproach to our neighbours, for a scorn and a mocking to those that are round about us."}],"15":[{"catchword":null,"tekst":"(15) Thou settest us (for) a By word (or Proverb) among the Heathen; for a shaking of the head among the Nations. [See 1 King.9.on verse 8. And 2 King.19.on verse 21.]"}],"16":[{"catchword":null,"tekst":"(16) My blemish is before me all the day, and the shame of my face covereth me."}],"17":[{"catchword":null,"tekst":"(17) For the voice of the Revile and of the Slanderer, because of the enemy and the revengeful."}],"18":[{"catchword":null,"tekst":"(18) All this is come upon us, nevertheless have we not forgotten thee, [This is to be understood of the faithful and constant ones among the people, who lament here, that they do not suffer as evil doers and forsakers of God; but contrarily, that they adhere stedfastly to God and his word, as they yet further testify, below verse 23.] nor dealt falsly against thy Covenant."}],"19":[{"catchword":null,"tekst":"(19) Our heart is not turned back, nor our walk receded from thy path. [i.e. from the Commandements wherein thou hast commanded us to walk.]"}],"20":[{"catchword":null,"tekst":"(20) Howbeit, thou hast shivered us in a place of Dragons, [Hereby may be understood the Heathenish Tyrants, Heb.of the Dragon, Otherw. Of the Whales.i.e. as into a Sea; that is, into the greatest extremity, and utmost dangers and jeopardy.] and covered us with a shadow of death. [see Psal.23.on verse 4.]"}],"21":[{"catchword":null,"tekst":"(21) Had we forgotten the name of our God; and spread our hands abroad unto a strange God, [To adore and worship the same, comp.Exo 9:29. 1 King.8.22. Psa 143:6.]"}],"22":[{"catchword":null,"tekst":"(22) Should not God search the same? For he knoweth the hiddennesses of the heart."}],"23":[{"catchword":null,"tekst":"(23) (But) for thy sake are we put to death all the day; [Because we will not forsake thee, but stand to live and dye in thy Covenant.] we are counted as slaughter-sheep."}],"24":[{"catchword":null,"tekst":"(24) Awake, why shouldest thou sleep LORD? [Spoken of God after the manner of men, as elsewhere frequently, when God withdraws, or delays his help; otherwise he neither sleepeth nor slumbereth, Psa 121:4.] awake and reject not in eternity."}],"25":[{"catchword":null,"tekst":"(25) Why shouldest thou hide thy face? Forget our misery and our oppression."}],"26":[{"catchword":null,"tekst":"(26) For our soul is bowed down into the dust: our belly cleaveth to the Earth. [i.e. we are brought extream low, and oppressed, scorned, distressed and dismayed without measure. Compare Psa 113:7. and 119.25. Item Lam 3:29.]"}],"27":[{"catchword":null,"tekst":"(27) Arise for our help, [Oth. A compleat help for us, to express, that the Hebrew word here used, Hath a letter more then ordinary added in the end. Compare Psa.3.on v.3. and below Psa 63:8.] and redeem us for thy kindness sake."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
