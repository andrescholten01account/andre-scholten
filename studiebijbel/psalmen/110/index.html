"disp": "1 Kor 4:5", "href": "../../1-korinthe/4/#v5", "ref": "1 Kor 4:5", "svLabel": null}, {"disp": "2 Kor 5:10", "href": "../../2-korinthe/5/#v10", "ref": "2 Kor 5:10", "svLabel": null}, {"disp": "2 Tim 4:1", "href": "../../2-timotheus/4/#v1", "ref": "2 Tim 4:1", "svLabel": null}, {"disp": "2 Tim 4:8", "href": "../../2-timotheus/4/#v8", "ref": "2 Tim 4:8", "svLabel": null}, {"disp": "Jak 5:9", "href": "../../jakobus/5/#v9", "ref": "Jak 5:9", "svLabel": null}, {"disp": "Openb 2:23", "href": "../../openbaring/2/#v23", "ref": "Openb 2:23", "svLabel": null}], "kinderen": []}]}]}]}, "7": {"torrey": [{"topic": "Brooks", "href": "../../torrey/b/#t-brooks", "kinderen": [{"label": "Illustrative", "href": "../../torrey/b/?hl=Ps.110.7#i2176", "refs": [], "kinderen": [{"label": "(Drinking of, by the way,) of help in distress", "href": "../../torrey/b/?hl=Ps.110.7#i2180", "refs": [{"disp": "Ps 110:7", "href": "../../psalmen/110/#v7", "ref": "Ps 110:7", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ps 132:18": "Ik zal zijn vijanden met schaamte bekleden; maar op hem zal zijn kroon bloeien.", "Zach 14:16": "En het zal gebeuren, dat allen die overgebleven zijn van alle heidenen die tegen Jeruzalem gekomen zullen zijn, van jaar tot jaar zullen optrekken om de Koning, de HEERE van de heerscharen, te aanbidden, en om het feest van de loofhutten te vieren.", "Matt 22:39": "En het tweede, hieraan gelijk, is: U zult uw naaste liefhebben als uzelf.", "Ex 13:12": "dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn.", "Hebr 7:28": "Want de wet stelt tot hogepriesters mensen aan, die zwakheid hebben; maar het woord van de eedzwering, dat na de wet gekomen is, stelt de Zoon aan, Die in eeuwigheid volmaakt gemaakt is.", "Jer 51:45": "Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.", "Matt 5:33": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Rom 11:10": "Dat hun ogen verduisterd worden, om niet te zien; en verkrom hun rug alle tijd.", "Ps 93:1-5": "De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen. Van toen af is Uw troon bevestigd, U bent van eeuwigheid af. De rivieren verheffen, o HEERE! de rivieren verheffen hun bruisen; de rivieren verheffen hun golfslag.", "Luk 4:11": "En dat zij U op de handen zullen dragen, opdat U uw voet niet ooit aan een steen stoot.", "Hand 13:34": "En dat Hij Hem uit de doden heeft opgewekt, zodat Hij niet meer tot verderving zal terugkeren, heeft Hij zo gezegd: Ik zal u de weldaden van David geven, die betrouwbaar zijn;", "Hab 2:5-13": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken. Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk! Zullen niet onvoorziens opstaan die u zullen bijten, en ontwaken die u zullen doen beven, en zult u hun niet tot buit worden?", "Ezech 37:24": "En Mijn Knecht David zal Koning over hen zijn; en zij zullen allen samen één Herder hebben; en zij zullen in Mijn rechten wandelen, en Mijn inzettingen bewaren en die doen.", "Luk 19:46": "en zei tegen hen: Er is geschreven: Mijn huis is een huis van het gebed; maar u hebt er een rovershol van gemaakt.", "Openb 17:14": "Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Joh 15:15": "Ik noem u niet meer dienstknechten; want de dienstknecht weet niet wat zijn heer doet; maar Ik heb u vrienden genoemd; want alles wat Ik van Mijn Vader gehoord heb, dat heb Ik u bekendgemaakt.", "Hand 2:41": "Zij dan die zijn woord graag aannamen, werden gedoopt; en er werden op die dag ongeveer drieduizend zielen aan hen toegevoegd.", "Luk 9:1": "Jezus riep Zijn twaalf discipelen samen en gaf hun kracht en macht over alle duivelen, en om ziekten te genezen.", "Rom 15:10": "En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk!", "Gen 1:1-14": "In het begin schiep God de hemel en de aarde. De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren. En God zei: Laat er licht zijn! En er was licht.", "Luk 1:72-74": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken; en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven dat wij, verlost uit de hand van onze vijanden, Hem zonder vrees zouden dienen,", "Spr 25:21": "Als hij die u haat, honger heeft, geef hem brood te eten; en als hij dorstig is, geef hem water te drinken;", "Matt 18:3": "en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan.", "Jes 32:15-17": "Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden. En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "Rom 3:18": "Er is geen vreze van God voor hun ogen.", "Num 21:6": "Toen zond de HEERE vurige slangen onder het volk, die het volk beten; en er stierf veel volk van Israël.", "Rom 6:3-23": "Of weet u niet dat allen die wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn? Wij zijn dan met Hem begraven door de doop in de dood, opdat, zoals Christus uit de doden opgewekt is tot de heerlijkheid van de Vader, zo ook wij in nieuwheid van leven zouden wandelen. Want als wij met Hem één geworden zijn in de gelijkmaking van Zijn dood, dan zullen wij het ook zijn in de gelijkmaking van Zijn opstanding;", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Ps 94:21": "Zij rotten samen tegen de ziel van de rechtvaardige, en zij veroordelen onschuldig bloed.", "Matt 23:39": "Want Ik zeg u: U zult Mij van nu af aan niet zien, totdat u zeggen zult: Gezegend is Hij Die komt in de Naam van de Heere!", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "Luk 4:34": "En zei: Laat ons met rust, wat hebben wij met U te maken, Jezus van Nazareth? Bent U gekomen om ons te vernietigen? Ik weet wie U bent, namelijk de Heilige van God.", "Ps 102:10": "Want ik eet as als brood, en vermeng mijn drank met tranen.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "Openb 5:14": "En de vier dieren zeiden: Amen. En de vierentwintig oudsten vielen neer en aanbaden Hem Die leeft tot in alle eeuwigheid.", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Mark 3:27": "Niemand kan het huis van een sterke man binnengaan en zijn bezittingen roven, als hij niet eerst de sterke man vastbindt; en dan pas zal hij zijn huis beroven.", "Openb 17:12-14": "En de tien horens die u gezien hebt, zijn tien koningen, die het koninkrijk nog niet ontvangen hebben, maar die als koningen macht ontvangen voor één uur, samen met het beest. Dezen hebben één en dezelfde gezindheid, en zullen hun kracht en macht aan het beest overgeven. Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Amos 3:10": "Want zij weten niet te doen wat recht is, spreekt de HEERE; zij die in hun paleizen schatten vergaren door geweld en verwoesting.", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Jes 62:12": "En zij zullen hen noemen het heilige volk, de verlosten van de HEERE; en u zult genoemd worden de gezochte, de stad, die niet verlaten is.", "Ef 3:15": "uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt,", "Ps 118:23": "Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen.", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Klaagl 2:1": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.", "Mark 12:31": "En het tweede, hieraan gelijk, is dit: U zult uw naaste liefhebben als uzelf. Er is geen ander gebod groter dan deze.", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Jer 43:7": "en zij trokken naar Egypteland, want zij waren aan de stem van de HEERE niet gehoorzaam; en zij kwamen tot Tachpanhes.", "Openb 14:14": "En ik zag, en zie, een witte wolk, en op de wolk zat Iemand, gelijk aan de Zoon des mensen, met op Zijn hoofd een gouden kroon; en in Zijn hand een scherpe sikkel.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "Jer 30:24": "De gloed van de toorn van de HEERE zal zich niet afwenden, totdat Hij het gedaan heeft, en totdat Hij tot stand gebracht heeft de gedachten van Zijn hart; in het laatste van de dagen zult u daarop letten.", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Ef 4:8-10": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven. Nu dit: Hij is opgevaren; wat betekent dit anders dan dat Hij ook eerst neergedaald is in de laagste delen van de aarde? Die neergedaald is, is Dezelfde ook, Die opgevaren is ver boven alle hemelen, opdat Hij alle dingen zou vervullen.", "Jak 5:19": "Broeders, als iemand onder u van de waarheid is afgedwaald, en iemand hem bekeert,", "Gen 2:24": "Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.", "Joh 5:21-23": "Want zoals de Vader de doden opwekt en levend maakt, zo maakt ook de Zoon levend wie Hij wil. Want ook de Vader oordeelt niemand, maar heeft heel het oordeel aan de Zoon gegeven, opdat allen de Zoon eren, zoals zij de Vader eren. Wie de Zoon niet eert, eert de Vader niet, Die Hem gezonden heeft.", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Jes 9:20": "Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ps 114:2": "Werd Juda tot Zijn heiligdom, Israël Zijn volkomen heerschappij.", "Ps 2:7": "Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.", "Ezech 34:2-4": "Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet. De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Hand 1:16": "Mannen broeders, deze Schrift moest vervuld worden, die de Heilige Geest bij monde van David voorzegd heeft over Judas, die de leidsman is geweest van hen die Jezus gevangennamen;", "Ps 96:13": "Voor het aangezicht van de HEERE; want Hij komt, want Hij komt, om de aarde te oordelen; Hij zal de wereld oordelen met gerechtigheid, en de volken met Zijn waarheid.", "Matt 4:7": "Jezus zei tegen hem: Er is ook geschreven: U zult de Heere, uw God, niet beproeven.", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Ef 1:20-22": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel; Ver boven alle overheid, en macht, en kracht, en heerschappij, en elke naam die genoemd wordt, niet alleen in deze wereld, maar ook in de toekomende; En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "Ps 132:13-16": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei: Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd. Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen.", "Dan 7:22": "Totdat de Oude van dagen kwam, en het gericht gegeven werd aan de heiligen van de hoge plaatsen, en de bestemde tijd kwam, dat de heiligen het Rijk bezaten.", "Jes 33:20-24": "Bekijk Sion, de stad van onze samenkomsten; uw ogen zullen Jeruzalem zien, een rustige woonplaats, een tent, die niet neergehaald zal worden, waarvan de pinnen in eeuwigheid niet uitgetrokken zullen worden, en waarvan geen touwen verscheurd zullen worden. Maar de HEERE zal daar bij ons heerlijk zijn, het zal een plaats zijn van rivieren, van wijde stromen; geen roeischuit zal daar doorvaren, en geen praalschip zal daar overvaren. Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Hebr 7:1-3": "Want deze Melchizedek was koning van Salem, een priester van de allerhoogste God, die Abraham tegemoet ging toen hij terugkeerde van het verslaan van de koningen, en hem zegende; aan wie Abraham ook van alles de tienden gaf; hij wordt eerst vertaald met 'koning van de gerechtigheid', en daarna was hij ook koning van Salem, dat is: koning van de vrede; zonder vader, zonder moeder, zonder geslachtsregister, zonder begin van dagen of einde van leven, maar gelijk geworden aan de Zoon van God, blijft hij een priester voor eeuwig.", "Jes 44:23": "Zing met vreugde, u hemelen! Want de HEERE heeft het gedaan; juich, u onderste delen van de aarde! U bergen! Maak een groot gedreun met vreugdegezang, u bossen, en al het geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "1 Petr 1:22": "Nu u uw zielen gereinigd hebt door de gehoorzaamheid aan de waarheid, door de Geest, tot ongeveinsde broederlijke liefde, heb dan elkaar vurig lief uit een rein hart;", "Jes 45:24": "Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Hab 1:5": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt.", "Ps 116:10": "Ik heb geloofd, daarom sprak ik; ik ben zeer bedrukt geweest.", "Openb 14:10": "die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Jer 31:7": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël.", "Jer 5:28": "Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.", "1 Joh 3:9": "Ieder die uit God geboren is, doet de zonde niet, want Zijn zaad blijft in hem; en hij kan niet zondigen, want hij is uit God geboren.", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "Deut 6:13": "U zult de HEERE, uw God, vrezen, en Hem dienen; en u zult bij Zijn Naam zweren.", "Pred 4:14": "Want de een komt uit de gevangenis om koning te worden; terwijl ook iemand die in zijn koninkrijk geboren is, verarmt.", "Ps 110:1-6": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten. De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden. Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Joh 12:49": "Want Ik heb niet uit Mijzelf gesproken; maar de Vader, Die Mij gezonden heeft, Die heeft Mij een gebod gegeven wat Ik zeggen zal en wat Ik spreken zal.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Ps 69:25": "Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.", "Ps 78:49": "Hij zond onder hen de gloed van Zijn toorn, verbolgenheid, en verstoordheid, en benauwdheid, met uitzending van boden van veel kwaad.", "1 Kon 2:19": "Zo kwam Bathseba naar de koning Salomo, om hem namens Adonia aan te spreken. En de koning stond op, haar tegemoet, en boog voor haar; daarna ging hij op zijn troon zitten, en liet een stoel neerzetten voor de moeder van de koning; en zij zat aan zijn rechterhand.", "Joh 17:1": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt.", "2 Tim 4:1": "Ik roep u dus dringend op, voor het aangezicht van God en de Heere Jezus Christus, Die de levenden en doden zal oordelen bij Zijn verschijning en in Zijn Koninkrijk:", "Joël 2:28-32": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien; Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten. En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Matt 22:42-46": "En zei: Wat denkt u van de Christus? Wiens Zoon is Hij? Zij zeiden tegen Hem: De Zoon van David. Hij zei tegen hen: Hoe noemt David Hem dan, in de Geest, zijn Heere? Hij zei immers: De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb.", "Ps 48:12-14": "Laat de berg Sion blijde zijn; laat de dochters van Juda zich verheugen, om Uw oordelen wil. Ga rondom Sion, en omring haar; tel haar torens; Zet uw hart op haar vesting; beschouw nauwkeurig haar paleizen, opdat u het aan het volgende geslacht vertelt.", "Rom 8:9": "Maar u bent niet in het vlees, maar in de Geest, als tenminste de Geest van God in u woont. Maar als iemand de Geest van Christus niet heeft, die komt Hem niet toe.", "Hand 2:34-36": "Want David is niet opgevaren naar de hemel; maar hij zegt zelf: De Heere heeft gesproken tot mijn Heere: Zit aan Mijn rechterhand, Totdat Ik Uw vijanden tot een voetbank voor Uw voeten gezet zal hebben. Laat dan het hele huis van Israël zeker weten dat God Hem tot een Heere en Christus gemaakt heeft, namelijk deze Jezus, Die u gekruisigd hebt.", "Ex 25:40": "Zie er dan op toe dat u het maakt naar hun voorbeeld, dat u op de berg getoond is.", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Openb 1:8": "Ik ben de Alfa en de Omega, het Begin en het Einde, zegt de Heere, Die is, en Die was, en Die komen zal, de Almachtige.", "1 Kor 2:16": "Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "Zach 14:20": "Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "Jes 63:1": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen.", "Joh 2:19": "Jezus antwoordde en zei tegen hen: Breek deze tempel af, en in drie dagen zal Ik hem oprichten.", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "Matt 20:23": "En Hij zei tegen hen: Mijn drinkbeker zult u wel drinken, en met de doop waarmee Ik gedoopt word, zult u gedoopt worden; maar het zitten aan Mijn rechterhand en aan Mijn linkerhand, staat niet aan Mij te geven, maar het zal gegeven worden aan hen voor wie het bereid is door Mijn Vader.", "Matt 13:15": "Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Hos 5:10": "De vorsten van Juda zijn geworden als zij die de grenzen verleggen; Ik zal Mijn verbolgenheid als water over hen uitgieten.", "Jes 1:27": "Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Hoogl 1:4": "Trek mij, wij zullen u nalopen! De koning heeft mij gebracht in zijn binnenkamers; wij zullen ons verheugen en in u verblijden; wij zullen uw uitnemende liefde vermelden, meer dan de wijn; de oprechten hebben u lief.", "Joh 12:38": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard?", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "Mark 11:9": "En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere!", "Ezech 34:23-31": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn. En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken. En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden.", "Hand 13:22": "En nadat Hij hem afgezet had, verwekte Hij hun David tot koning; aan wie Hij ook getuigenis gaf, en zei: Ik heb David gevonden, de zoon van Isaï, een man naar Mijn hart, die al Mijn wil zal doen.", "Ps 125:1": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid.", "Deut 5:18": "En u zult geen overspel doen.", "2 Kor 9:9": "Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid.", "Mark 7:6": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij.", "1 Kor 15:55": "Dood, waar is uw prikkel? Graf, waar is uw overwinning?", "Ps 138:5": "En zij zullen zingen van de wegen van de HEERE, want de heerlijkheid van de HEERE is groot.", "Jes 55:5": "Zie, u zult een volk roepen, dat u niet kende, en het volk, dat u niet kende, zal tot u lopen, om de wil van de HEERE, uw God, en om de wil van de Heilige van Israël, want Hij heeft u verheerlijkt.", "Ps 106:29": "En zij hebben de Heere tot toorn verwekt met hun daden, zodat de plaag een inbreuk onder hen deed.", "Ps 89:30": "En Ik zal zijn zaad in eeuwigheid vestigen, en zijn troon als de dagen van de hemelen.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Openb 1:18": "en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood.", "Gal 6:15": "Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar een nieuw schepsel.", "Matt 11:11": "Voorwaar, Ik zeg u: onder degenen die uit vrouwen geboren zijn, is niemand opgestaan die groter is dan Johannes de Doper; maar wie de minste is in het Koninkrijk der hemelen, is groter dan hij.", "Gen 17:5": "En uw naam zal niet meer Abram genoemd worden; maar uw naam zal Abraham zijn; want Ik heb u tot een vader van een menigte volken gemaakt.", "Matt 22:32": "Ik ben de God van Abraham, en de God van Izak, en de God van Jakob! God is niet een God van de doden, maar van de levenden.", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "Ps 109:8": "Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "Jes 12:3": "En u zult water scheppen met vreugde uit de fonteinen van het heil;", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "Rom 8:36": "(Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.)", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Joh 19:28": "Hierna, omdat Jezus wist dat nu alles volbracht was, zei Hij, opdat de Schrift vervuld zou worden: Ik heb dorst.", "1 Joh 2:29": "Als u weet, dat Hij rechtvaardig is, dan weet u, dat ieder, die de rechtvaardigheid doet, uit Hem geboren is.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Hand 15:16": "Hierna zal Ik terugkeren, en de tabernakel van David, die vervallen is, weer opbouwen; en wat ervan verwoest is, zal Ik weer opbouwen, en Ik zal hem weer oprichten,", "Ps 41:14": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid! Amen, ja, amen.", "2 Petr 1:17": "Want Hij heeft van God de Vader eer en heerlijkheid ontvangen, toen zo'n stem van de hoogwaardige heerlijkheid tot Hem gebracht werd: Dit is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Ps 45:8": "U hebt gerechtigheid lief, en haat goddeloosheid; daarom heeft God, Uw God, U gezalfd met vreugdeolie, boven Uw metgezellen.", "Ps 2:6-9": "Ik heb Mijn Koning toch gezalfd over Sion, de berg van Mijn heiligheid. Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt. Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting.", "Jes 6:1-3": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Joh 14:7": "Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien.", "Jes 34:2-8": "Want de toorn van de HEERE is over alle heidenvolken, en grimmigheid over heel hun leger; Hij heeft hen met de ban geslagen, Hij heeft ze ter slachting overgegeven. En hun gesneuvelden zullen weggeworpen worden, en van hun dode lichamen zal hun stank opstijgen; en de bergen zullen smelten van hun bloed. En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.", "Openb 6:2": "En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen!", "Ps 22:30": "Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.", "Ps 89:20-22": "Toen hebt Gij in een gezicht gesproken van Uw heilige, en gezegd: Ik heb hulp besteld bij een held; Ik heb een verkorene uit het volk verhoogd. Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd; met wie Mijn hand vast blijven zal; ook zal hem Mijn arm versterken.", "Mark 1:2": "Zoals geschreven is in de profeten: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg voor U heen bereiden zal.", "Ps 2:2-6": "De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen: Laat ons hun banden verscheuren, en hun touwen van ons afwerpen. Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "1 Petr 1:16": "want er staat geschreven: Wees heilig, want Ik ben heilig.", "Hand 2:38": "En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.", "Ex 12:46": "In één huis zal het gegeten worden; u mag van het vlees niet naar buiten, het huis uit, dragen, en u mag er geen been van breken.", "Jes 44:3-5": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Joh 6:32": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: Mozes heeft u niet het brood uit de hemel gegeven; maar Mijn Vader geeft u dat ware Brood uit de hemel.", "Openb 20:1-3": "En ik zag een engel neerkomen uit de hemel, die de sleutel van het afgrond had, en een grote keten in zijn hand; En hij greep de draak, de oude slang, die de duivel is en satan, en bond hem duizend jaar; En wierp hem in het afgrond, en sloot hem daarin, en verzegelde het boven hem, opdat hij de volken niet meer verleiden zou, totdat de duizend jaar geëindigd zouden zijn. En daarna moet hij een korte tijd losgelaten worden.", "Jes 41:17-20": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten. Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen. Ik zal in de woestijn de cederboom, de sittimboom, en de mirteboom, en de olieboom zetten; Ik zal in de wildernis de denneboom, de beuk, en de busboom samen plaatsen;", "Ps 68:31": "Bestraf het wilde gedierte van het riet, de vergadering van de stieren met de kalveren van de volken; en hem die zich onderwerpt met stukken van het zilver; Hij heeft de volken verstrooid die lust hebben in oorlogen.", "2 Kor 8:1-3": "Verder maken wij u bekend, broeders, de genade van God, die in de gemeenten van Macedonië gegeven is. Dat in veel beproeving van de verdrukking de overvloed van hun blijdschap, en hun zeer diepe armoede overvloedig geweest is tot de rijkdom van hun goeddadigheid. Want zij zijn naar vermogen (ik betuig het), ja, boven vermogen gewillig geweest;", "Mark 13:10": "En het Evangelie moet eerst gepredikt worden onder alle volken.", "Matt 4:15": "Het land Zebulon en het land Nafthali, aan de weg naar de zee, over de Jordaan, Galilea van de volken;", "Hand 7:6": "En God sprak zo, dat zijn nageslacht als vreemdeling zou wonen in een vreemd land, en dat men hen tot slaaf zou maken en slecht behandelen, vierhonderd jaar.", "Luk 1:32": "Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven.", "Hebr 1:10": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen;", "1 Joh 5:18": "Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.", "Joh 10:36-38": "zegt u dan tegen Mij, Die de Vader geheiligd en in de wereld gezonden heeft: U lastert God; omdat Ik gezegd heb: Ik ben Gods Zoon? Als Ik de werken van Mijn Vader niet doe, geloof Mij dan niet; maar als Ik ze doe, en u Mij niet gelooft, geloof dan de werken; opdat u mag weten en geloven dat de Vader in Mij is, en Ik in Hem.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Matt 8:27": "En de mensen verwonderden zich, en zeiden: Wat voor iemand is dit, dat zelfs de winden en de zee Hem gehoorzaam zijn!", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "Hebr 3:7-10": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn; Waar uw vaders Mij beproefden; zij hebben Mij op de proef gesteld, en hebben Mijn werken gezien, veertig jaar lang.", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Openb 19:11": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid.", "Kol 1:2": "Aan de heilige en gelovige broeders in Christus die in Kolosse zijn: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Ps 89:28": "Ook zal Ik hem tot eerstgeboren zoon stellen, tot de hoogste over de koningen van de aarde.", "Hebr 1:2": "Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft;", "1 Kor 12:13": "Want ook wij allen zijn door één Geest tot één lichaam gedoopt; hetzij Joden, hetzij Grieken, hetzij dienstknechten, hetzij vrijen; en wij zijn allen tot één Geest gedrenkt.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "2 Kor 6:2": "Want Hij zegt: In de aangename tijd heb Ik u verhoord, en in de dag van de zaligheid heb Ik u geholpen. Zie, nu is het de welaangename tijd, zie, nu is het de dag van de zaligheid!", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Ps 118:25": "Och HEERE, geef nu heil; och HEERE, geef nu voorspoed.", "1 Petr 2:22": "Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden;", "Matt 12:7": "Maar als u geweten had wat dit betekent: Ik wil barmhartigheid en geen offerande, dan zou u de onschuldigen niet veroordeeld hebben.", "Num 32:13": "Zo ontstak de toorn van de HEERE tegen Israël, en Hij liet hen ronddwalen in de woestijn, veertig jaar lang, totdat heel het geslacht verteerd was dat gedaan had wat kwaad was in de ogen van de HEERE.", "Ex 24:8": "Toen nam Mozes dat bloed, en sprengde het op het volk; en hij zei: Zie, dit is het bloed van het verbond, dat de HEERE met u gemaakt heeft over al die woorden.", "Ps 30:13": "Opdat mijn eer voor U psalmen zingt, en niet zwijgt. HEERE, mijn God! in eeuwigheid zal ik U loven.", "Joh 5:45": "Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt.", "Ezech 11:20": "Opdat zij wandelen in Mijn inzettingen, en Mijn rechten bewaren en die doen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "1 Kor 15:54": "En wanneer dit vergankelijke onvergankelijkheid zal hebben aangedaan, en dit sterfelijke onsterfelijkheid zal hebben aangedaan, dan zal het woord gebeuren dat geschreven is: De dood is verslonden tot overwinning.", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Rom 3:10-12": "zoals geschreven is: Er is niemand rechtvaardig, ook niet één; er is niemand die verstandig is, er is niemand die God zoekt. Allen zijn zij afgeweken, samen zijn zij onnut geworden; er is niemand die goed doet, er is zelfs niet één.", "Hebr 5:6": "Zoals Hij ook op een andere plaats zegt: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Jes 29:23": "want wanneer hij zijn kinderen, het werk van Mijn handen, zal zien in zijn midden, zullen zij Mijn Naam heiligen; en zij zullen de Heilige van Jakob heiligen, en de God van Israël vrezen.", "Jes 11:3": "En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Hand 7:33": "En de Heere zei tegen hem: Doe de schoenen van uw voeten; want de plaats waarop u staat, is heilige grond.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "Matt 22:44": "De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb.", "Joh 3:34": "Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.", "Joh 16:15": "Alles wat de Vader heeft, is van Mij; daarom heb Ik gezegd dat Hij het uit het Mijne zal nemen, en het u zal verkondigen.", "Ps 72:2": "Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht.", "Matt 21:42": "Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?", "Luk 1:33": "En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Jes 53:8": "Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest.", "Ps 72:8-11": "En hij zal heersen van de zee tot aan de zee, en van de rivier tot aan de einden van de aarde. De inwoners van dorre plaatsen zullen voor zijn aangezicht knielen, en zijn vijanden zullen het stof lekken. De koningen van Tharsis en de eilanden zullen geschenken aanbrengen; de koningen van Scheba en Seba zullen vereringen toevoeren.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Hand 7:41": "En zij maakten een kalf in die dagen, en brachten een offer aan de afgod, en verheugden zich in de werken van hun eigen handen.", "Mark 4:20": "En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Spr 29:4": "Een koning houdt het land staande door recht; maar wie tot geschenken geneigd is, verstoort het.", "Hand 10:42": "En Hij heeft ons geboden aan het volk te prediken, en te betuigen dat Hij Degene is Die door God aangesteld is tot een Rechter van levenden en doden.", "Ps 96:9": "Aanbidt de HEERE in de heerlijkheid van het heiligdom; beeft voor Zijn aangezicht, heel de aarde.", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Ps 16:7-11": "Ik zal de HEERE loven, Die mij raad heeft gegeven; zelfs 's nachts onderwijzen mijn nieren mij. Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen. Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten.", "Ezech 16:14": "Daardoor ging van u een naam uit onder de heidenvolken vanwege uw schoonheid; want die was volmaakt door Mijn heerlijkheid, die Ik op u gelegd had, spreekt de Heere HEERE.", "Jer 17:13": "O HEERE, Israëls Verwachting! Allen die U verlaten, zullen beschaamd worden; en die van Mij afwijken, zullen in de aarde geschreven worden; want zij verlaten de HEERE, de Springader van het levende water.", "Jes 22:22": "En Ik zal de sleutel van het huis van David op zijn schouder leggen; en hij zal opendoen, en niemand zal sluiten, en hij zal sluiten, en niemand zal opendoen.", "Openb 15:1": "En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd.", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Joh 18:11": "Jezus dan zei tegen Petrus: Steek uw zwaard in de schede. Zou Ik de drinkbeker die de Vader Mij gegeven heeft, niet drinken?", "Amos 5:25-27": "Hebt u Mij veertig jaar in de woestijn slachtoffers en spijsoffer gebracht, o huis van Israël? Ja, u droeg de tent van uw Melech, en de Kijun, uw beelden, de ster van uw god, die u zelf gemaakt had. Daarom zal Ik u gevankelijk wegvoeren, ver voorbij Damaskus, zegt de HEERE, Wiens Naam is God van de heerscharen.", "Gal 5:14": "Want de hele wet wordt in één woord vervuld, namelijk in dit: U zult uw naaste liefhebben als uzelf.", "Spr 14:27": "De vreze van de HEERE is een bron van leven, om af te wijken van de strikken van de dood.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "1 Kor 3:19": "Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "Mark 5:20": "En hij ging weg, en begon in het gebied van Dekapolis te verkondigen wat grote dingen Jezus aan hem gedaan had; en zij verwonderden zich allen.", "Deut 19:15": "Eén enkele getuige zal tegen niemand opstaan in verband met enige ongerechtigheid of enige zonde, van welke zonde hij ook zou hebben gezondigd; op de verklaring van twee getuigen, of op de verklaring van drie getuigen, zal de zaak vaststaan.", "1 Kor 10:7": "En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Ps 40:7-9": "Gij hebt geen lust gehad aan slachtoffer en spijsoffer; Gij hebt mij de oren doorboord; brandoffer en zondoffer hebt Gij niet geëist. Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Jes 60:1-22": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Jes 1:17": "Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.", "Ps 2:1-12": "Waarom woeden de heidenen, en bedenken de volken iets zinloos? De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen: Laat ons hun banden verscheuren, en hun touwen van ons afwerpen.", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "Joh 1:23": "Hij zei: Ik ben de stem van hem die roept in de woestijn: Maak de weg van de Heere recht, zoals Jesaja, de profeet, gesproken heeft.", "Jer 21:6": "En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Matt 19:28": "En Jezus zei tegen hen: Voorwaar, Ik zeg u, dat u, die Mij gevolgd bent, in de wedergeboorte, wanneer de Zoon des mensen zal zitten op de troon van Zijn heerlijkheid, dat u ook zult zitten op twaalf tronen, en de twaalf geslachten van Israël zult oordelen.", "Rom 11:2-6": "God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt: Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven. Maar wat zegt het Goddelijk antwoord tegen hem? Ik heb Mijzelf nog zevenduizend mannen overgelaten, die de knie voor het beeld van Baäl niet gebogen hebben.", "Joh 19:37": "En weer zegt een andere Schrift: Zij zullen zien op Hem, in Wie zij gestoken hebben.", "1 Kor 1:24": "Maar voor hen die geroepen zijn, zowel Joden als Grieken, prediken wij Christus, de kracht van God, en de wijsheid van God.", "Num 11:10": "Toen hoorde Mozes het volk wenen door hun huisgezinnen, ieder aan de deur van zijn tent; en de toorn van de HEERE ontstak zeer; ook was dat kwaad in de ogen van Mozes.", "Ps 129:5": "Laat hen beschaamd worden en achteruitgedreven, allen die Sion haten.", "2 Kor 1:2": "Genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Joh 6:44": "Niemand kan tot Mij komen, als de Vader, Die Mij gezonden heeft, hem niet trekt; en Ik zal hem opwekken op de laatste dag.", "Jes 55:1-3": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Mark 12:29": "En Jezus antwoordde hem: Het eerste van alle geboden is: Hoor, Israël! De Heere, onze God, is een enig Heere.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Luk 18:20": "U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Jes 62:11": "Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Hand 4:25": "Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht?", "Ps 21:9": "Uw hand zal alle vijanden vinden; uw rechterhand zal uw haters vinden.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "2 Kor 8:1": "Verder maken wij u bekend, broeders, de genade van God, die in de gemeenten van Macedonië gegeven is.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "1 Kor 11:3": "Maar ik wil dat u weet, dat Christus het Hoofd is van iedere man, en de man het hoofd van de vrouw, en God het Hoofd van Christus.", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Luk 8:38": "En de man uit wie de duivels weggegaan waren, smeekte Hem bij Hem te mogen blijven. Maar Jezus liet hem van Zich gaan en zei:", "Jer 26:3": "Misschien zullen zij horen, en zich bekeren, ieder van zijn boze weg; zo zou Ik berouw hebben over het kwaad dat Ik hun denk te doen vanwege de boosheid van hun daden.", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Ex 22:24": "en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Mal 4:6": "En hij zal het hart van de vaders terugbrengen tot de kinderen, en het hart van de kinderen tot hun vaders, zodat Ik niet hoef te komen en de aarde met de ban sla.", "Joz 10:24": "En het gebeurde, toen zij die koningen uitgebracht hadden tot Jozua, dat Jozua al de mannen van Israël riep, en hij zei tot de aanvoerders van het krijgsvolk, die met hem opgetrokken waren: Treed toe, zet uw voeten op de nekken van deze koningen. En zij traden toe, en zetten hun voeten op hun nekken.", "Ezech 11:19": "En Ik zal hun één hart geven, en Ik zal een nieuwe geest in uw binnenste geven; en Ik zal het stenen hart uit hun vlees wegnemen, en zal hun een hart van vlees geven;", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "2 Kor 3:18": "En wij allen, die met ongedekt gezicht de heerlijkheid van de Heere aanschouwen als in een spiegel, worden naar datzelfde beeld veranderd van heerlijkheid tot heerlijkheid, als door de Geest van de Heere.", "Ps 67:2-8": "God is ons genadig en zegent ons; Hij laat Zijn aangezicht over ons lichten. Sela. Opdat men op de aarde Uw weg kent, onder alle heidenvolken Uw heil. De volken zullen U, o God, loven; de volken, allemaal, zullen U loven.", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Matt 13:33": "Een andere gelijkenis sprak Hij tot hen: Het Koninkrijk der hemelen is gelijk aan zuurdesem, die een vrouw nam en verborg in drie maten van het meel, totdat het geheel gezuurd was.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Openb 15:7": "En een van de vier dieren gaf de zeven engelen zeven gouden schalen, vol van de toorn van God, Die leeft in alle eeuwigheid.", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Gal 3:11": "En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven.", "Matt 28:18": "En Jezus kwam bij hen en sprak tot hen: Mij is gegeven alle macht in hemel en op aarde.", "Joh 5:37": "En de Vader, Die Mij gezonden heeft, Die heeft Zelf van Mij getuigd. U hebt Zijn stem nooit gehoord, en Zijn gedaante ook niet gezien.", "Luk 19:38": "en zij zeiden: Gezegend is de Koning, Die komt in de Naam van de Heere! Vrede in de hemel, en heerlijkheid in de hoogste hemelen!", "Matt 22:37": "En Jezus zei tegen hem: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw verstand.", "Micha 5:3": "En Hij zal staan, en zal weiden in de kracht van de HEERE, in de hoogheid van de Naam van de HEERE, Zijn God, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden van de aarde.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Ef 6:3": "opdat het u goed gaat, en u lang leeft op de aarde.", "Jes 40:9-11": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God! Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht. Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Hebr 10:12": "Maar Deze, die één offer voor de zonden gebracht heeft, is voor eeuwig gaan zitten aan de rechterhand van God;", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Joh 16:10": "En van gerechtigheid, omdat Ik tot Mijn Vader heenga, en u Mij niet meer zult zien;", "2 Kor 13:1": "Dit is de derde keer dat ik naar u toe kom; op grond van de verklaring van twee of drie getuigen zal elk woord vaststaan.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "2 Kon 17:18": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Hebr 11:18": "(tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Joh 16:23": "En op die dag zult u Mij niets vragen. Voorwaar, voorwaar, Ik zeg u: alles wat u de Vader zult bidden in Mijn Naam, zal Hij u geven.", "1 Kor 3:6": "Ik heb geplant, Apollos heeft nat gemaakt; maar God heeft de groei gegeven.", "Ps 2:8": "Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 12:6": "Om de verwoesting van de ellendigen, om het kermen van de behoeftigen, zal Ik nu opstaan, zegt de HEERE; Ik zal in veiligheid zetten wie ernaar snakt.", "Joh 8:29": "En Die Mij gezonden heeft, is met Mij. De Vader heeft Mij niet alleen gelaten, want Ik doe altijd wat Hem welgevallig is.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Joh 5:17": "En Jezus antwoordde hun: Mijn Vader werkt tot nu toe, en Ik werk ook.", "Ezech 21:25": "En u, o onheilige, goddeloze vorst van Israël, wiens dag komen zal, in de tijd van de uiterste ongerechtigheid;", "2 Sam 6:7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "Gal 3:8": "En de Schrift, die van tevoren zag dat God de heidenen uit het geloof zou rechtvaardigen, heeft van tevoren aan Abraham het Evangelie verkondigd, en zei: In u zullen alle volken gezegend worden.", "Joh 8:36": "Als dan de Zoon u vrijgemaakt zal hebben, zult u werkelijk vrij zijn.", "1 Kor 3:23": "Doch u bent van Christus, en Christus is van God.", "Hand 21:19": "En nadat hij hen gegroet had, verhaalde hij stuk voor stuk wat God onder de heidenen door zijn dienst had gedaan.", "Openb 14:11": "En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Rom 9:13": "Zoals geschreven is: Jakob heb Ik liefgehad, en Ezau heb Ik gehaat.", "Ex 20:12-16": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "Ezech 22:27": "Haar vorsten zijn in haar midden als wolven die een prooi roven, om bloed te vergieten en om zielen te verderven, opdat zij gierigheid zouden plegen.", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Hab 2:14": "Want de aarde zal vervuld worden met de kennis van de heerlijkheid van de HEERE, zoals het water de bodem van de zee bedekt.", "Luk 4:4": "En Jezus antwoordde hem: Er is geschreven dat de mens niet van brood alleen zal leven, maar van elk woord van God.", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "Ps 72:1-20": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning. Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht. De bergen zullen aan het volk vrede dragen, ook de heuvels, met gerechtigheid.", "Jes 32:4": "En het hart van de onbedachtzamen zal de kennis verstaan, en de tong van de stamelende zal vaardig zijn, om duidelijk te spreken.", "Tit 3:6": "Die Hij over ons rijkelijk heeft uitgegoten door Jezus Christus, onze Zaligmaker;", "Joh 11:42": "Maar Ik wist dat U Mij altijd hoort; maar vanwege de menigte die er omheen staat heb Ik dit gezegd, opdat zij geloven dat U Mij gezonden hebt.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Spr 29:2": "Als de rechtvaardigen groot worden, verblijdt het volk zich; maar als de goddeloze heerst, zucht het volk.", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Ps 49:21": "De mens, die in aanzien is, en geen verstand heeft, wordt gelijk aan de dieren, die vergaan.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "Ps 24:1": "Een psalm van David. De aarde is van de HEERE, alsook haar volheid, de wereld, en zij die daarin wonen.", "Matt 2:2": "Zij zeiden: Waar is de geboren Koning van de Joden? Want wij hebben Zijn ster gezien in het Oosten, en zijn gekomen om Hem te aanbidden.", "Luk 23:42": "En hij zei tegen Jezus: Heere, denk aan mij, wanneer U in Uw Koninkrijk gekomen bent.", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "1 Kor 9:9": "Want in de wet van Mozes staat geschreven: U zult een dorsende os niet muilbanden. Zorgt God soms voor de ossen?", "Matt 4:10": "Toen zei Jezus tegen hem: Ga weg, satan, want er staat geschreven: De Heere, uw God, zult u aanbidden, en Hem alleen dienen.", "1 Tim 3:14": "Deze dingen schrijf ik u, in de hoop spoedig bij u te komen;", "Jes 1:8": "En de dochter van Sion is overgebleven als een hutje in de wijngaard, als een nachthutje in de komkommerhof, als een belegerde stad.", "2 Kor 10:17": "Maar wie roemt, laat die roemen in de Heere.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Ezech 25:14-17": "En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE. Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.", "2 Petr 1:16": "Want wij hebben geen kunstig verzonnen fabels nagevolgd, toen wij u de kracht en toekomst van onze Heere Jezus Christus bekendmaakten, maar wij zijn ooggetuigen geweest van Zijn majesteit.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Jer 7:11": "Is dan dit huis, dat naar Mijn Naam genoemd is, in uw ogen een schuilplaats van rovers? Zie, Ik heb het ook gezien, spreekt de HEERE.", "Mark 12:30": "En u zult de Heere, uw God, liefhebben uit heel uw hart, en uit heel uw ziel, en uit heel uw verstand, en uit heel uw kracht. Dit is het eerste gebod.", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "Ps 18:44": "U hebt mij uitgeholpen van de twisten van het volk; U hebt mij gesteld tot een hoofd van de heidenen; het volk dat ik niet kende, heeft mij gediend.", "Ps 72:17": "Zijn naam zal zijn tot in eeuwigheid; zolang als er de zon is, zal zijn naam van kind tot kind voortgeplant worden; en zij zullen in hem gezegend worden; alle heidenvolken zullen hem gelukkig noemen.", "Ps 45:6": "Uw pijlen zijn scherp; volken zullen onder U vallen; zij treffen in het hart van de vijanden van de Koning.", "Jes 60:1-6": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Num 16:45": "Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.", "Joh 12:45": "En wie Mij ziet, ziet Hem Die Mij gezonden heeft.", "Hagg 2:7": "Want zo zegt de HEERE van de heerscharen: Nog eenmaal, over een korte tijd, zal het zover zijn; en Ik zal de hemel, en de aarde, en de zee, en het droge doen beven.", "1 Tess 5:18": "Dank God in alles; want dit is de wil van God in Christus Jezus over u.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "2 Sam 22:9": "Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daardoor aangestoken.", "Jer 31:3": "De HEERE is mij verschenen van lang geleden! Ja, Ik heb u liefgehad met een eeuwige liefde; daarom heb Ik u getrokken met goedertierenheid.", "Ps 29:2": "Geef de HEERE de eer van Zijn Naam, aanbid de HEERE in de heerlijkheid van het heiligdom.", "Hebr 3:7-11": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn; Waar uw vaders Mij beproefden; zij hebben Mij op de proef gesteld, en hebben Mijn werken gezien, veertig jaar lang.", "1 Kor 15:23-28": "Maar ieder in zijn eigen orde: de eersteling Christus, daarna zij die van Christus zijn, bij Zijn komst. Daarna zal het einde zijn, wanneer Hij het Koninkrijk aan God en de Vader zal hebben overgegeven; wanneer Hij alle heerschappij, alle macht en kracht zal hebben tenietgedaan. Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.", "Jes 42:1-4": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "1 Kor 2:8": "Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben.", "Luk 20:17": "Maar Hij keek hen aan en zei: Wat betekent dan wat er geschreven staat: De steen die de bouwers verworpen hebben, die is de hoeksteen geworden?", "Jes 28:11": "Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "Jer 13:11": "Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Hand 3:25": "U bent kinderen van de profeten, en van het verbond dat God met onze vaderen gesloten heeft, toen Hij tegen Abraham zei: En in uw nageslacht zullen alle geslachten van de aarde gezegend worden.", "Spr 17:26": "Het is niet goed, de rechtvaardige te straffen, laat staan dat men vorsten zou slaan om wat recht is.", "Zach 11:13": "Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze in het huis van de HEERE, voor de pottenbakker.", "Gal 1:1": "Paulus, een apostel, geroepen niet vanuit mensen, ook niet door een mens, maar door Jezus Christus, en God de Vader, Die Hem uit de doden heeft opgewekt,", "Joh 12:31": "Nu is het oordeel over deze wereld; nu zal de leider van deze wereld buitengeworpen worden.", "Deut 6:15": "Want de HEERE, uw God, is een na-ijverig God in uw midden; dat de toorn van de HEERE, uw God, tegen u niet ontsteekt, en Hij u van de aardbodem verdelgt.", "Micha 5:1-14": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid. Daarom zal Hij hen overgeven, tot de tijd toe dat zij, die baren zal, gebaard heeft; dan zullen de overigen van Zijn broeders zich bekeren met de kinderen van Israël. En Hij zal staan, en zal weiden in de kracht van de HEERE, in de hoogheid van de Naam van de HEERE, Zijn God, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden van de aarde.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Ef 1:23": "Welke Zijn lichaam is, en de vervulling van Hem die alles in allen vervult.", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "1 Kor 15:28": "En wanneer Hem alle dingen onderworpen zullen zijn, dan zal ook de Zoon Zelf onderworpen worden aan Hem Die Hem alle dingen onderworpen heeft, opdat God alles in allen zal zijn.", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Num 25:3": "Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Deut 5:16": "Eer uw vader en uw moeder, zoals de HEERE, uw God, u geboden heeft, opdat uw dagen verlengd worden, en opdat het u goed gaat in het land dat de HEERE, uw God, u geven zal.", "Ps 87:1-6": "Een psalm, een lied voor de kinderen van Korach. Zijn grondslag is op de bergen van heiligheid. De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob. Zeer heerlijke dingen worden van u gesproken, o stad van God! Sela.", "Hand 1:20": "Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.", "Matt 18:8": "Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden.", "Mark 5:6": "Toen hij nu Jezus van verre zag, rende hij ernaartoe, en aanbad Hem.", "1 Kron 16:29": "Geeft de HEERE de eer van Zijn Naam, brengt offer, en komt voor Zijn aangezicht; aanbidt de HEERE in de heerlijkheid van het heiligdom.", "Rom 11:8": "(Zoals ges
