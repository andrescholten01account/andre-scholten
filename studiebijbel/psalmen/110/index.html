pan> hem <span class=\"wl\" data-l=\"L5\" data-code=\"H4272\">verslaan</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7218\">die</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7218\">het</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7218\">hoofd</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7218\">is</span> over <span class=\"wl\" data-l=\"L7\" data-code=\"H7227\">een</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H7227\">groot</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H776\">land</span>.","7":"<span class=\"wl\" data-l=\"L1\" data-code=\"H1870\">Hij</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1870\">zal</span> op <span class=\"wl\" data-l=\"L1\" data-code=\"H1870\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1870\">weg</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1870\">uit</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5158\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5158\">beek</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8354\">drinken</span>; <span class=\"wl\" data-l=\"L4\" data-code=\"H7218\">daarom</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7218\">zal</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7218\">Hij</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7218\">het</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7218\">hoofd</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7311\">omhoog</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7311\">heffen</span>."},"koppeling_kjv":{"1":"[[A <span class=\"wl wl-kjv\" data-code=\"H4210\">Psalm</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.]]</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">said</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">Sit</span> thou at my right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> until I <span class=\"wl wl-kjv\" data-code=\"H7896\">make</span> thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> thy <span class=\"wl wl-kjv\" data-code=\"H1916\">footstool.</span>","2":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> the <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5797\">strength</span> out of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion:</span> <span class=\"wl wl-kjv\" data-code=\"H7287\">rule</span> thou in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of thine enemies.","3":"Thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5071\">willing</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2428\">power,</span> in the <span class=\"wl wl-kjv\" data-code=\"H1926\">beauties</span> of <span class=\"wl wl-kjv\" data-code=\"H6944\">holiness</span> from the <span class=\"wl wl-kjv\" data-code=\"H7358\">womb</span> of the <span class=\"wl wl-kjv\" data-code=\"H4891\">morning:</span> thou hast the <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> of thy youth.","4":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn,</span> and will not <span class=\"wl wl-kjv\" data-code=\"H5162\">repent,</span> Thou art a <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> after the <span class=\"wl wl-kjv\" data-code=\"H1700\">order</span> of Melchizedek.","5":"The <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> at thy right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> shall <span class=\"wl wl-kjv\" data-code=\"H4272\">strike</span> through <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of his wrath.","6":"He shall <span class=\"wl wl-kjv\" data-code=\"H1777\">judge</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> the places with the dead <span class=\"wl wl-kjv\" data-code=\"H1472\">bodies;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H4272\">wound</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> over <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> countries.","7":"He shall <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way:</span> therefore shall he lift <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> the head."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"De HEERE heeft","tekst":"Te weten, God de Vader."},{"catchword":"tot mijn Heere","tekst":"Dat is, Christus, dien David hier zijnen Heere noemt. Want Christus is de zoon van David naar het vlees, maar Davids Heere ten aanzien dat Hij waarachtig God is met God den Vader en den Heilige Geest, en een Heere aller mense, doch inzonderheid van zijne uitverkorenen. Zie Mat 22:43 , Mat 22:45 ; Mar 12:36 ; Luk 20:42 ; Act 2:34 ; Heb 1:13 ."},{"catchword":"gesproken","tekst":"Te weten, in zijn eeuwigen raad, hetwelk Hij ons te zijner tijd heeft laten openbaren en verkondigen."},{"catchword":"Zit aan Mijn rechterhand,","tekst":"Dat is, heers in heerlijkheid en majesteit, in den hemel en op de aarde, 1Co 15:25 ; Heb 1:3 , Heb 1:13 , en Heb 8:1 , en Heb 10:12-13 ; Eph 1:20 , enz. Deze manier van spreken is genomen van de koningen, die aan hunne rechterhand zetten wien zij eer willen aandoen. Zie 1Ki 2:19 , en Psa 45:10 ."},{"catchword":"totdat Ik Uw","tekst":"De zin is: totdat Ik uwe vijanden, [te weten, de vervolgers der kerk, ja de dood zelf, 1Co 15:25-26 ] , U zal onderworpen hebben. Hieruit kan men geenzins besluiten dat Christus geen eeuwig koninkrijk zou hebben, ofschoon de manier van de bediening van het rijk van Christus, zodanig als die nu is, ten jongsten dage met het laatste oordeel zal ophouden; want alsdan zullen er gene vijanden meer zijn, die de kerk van Christus zullen kunnen schaden; 1Co 15:24 , 1Co 15:28 . Zie de aantekening bij Gen 28:15 ."}],"2":[{"catchword":"De HEERE zal","tekst":"In het eerste vers heeft David het volk Gods aangesproken; hier spreekt hij nu Christus aan."},{"catchword":"de scepter","tekst":"Of, uw sterkte scepter, of de roede, of staf uwer sterkte; te weten, de verkondiging ven het heilige Evangelie, waardoor de Heilige Geest krachtiglijk in de harten der uitverkorenen werkt. Zie Rom 1:16 ."},{"catchword":"Uwer sterkte","tekst":"Christus."},{"catchword":"zenden","tekst":"Te weten, in de ganse wereld."},{"catchword":"uit Sion, zeggende","tekst":"Versta dit alzo, dat het Evangelie eerst te Jeruzalem en in het Joodse land moest gepredikt worden, en vandaar voort uitgespreid worden door de ganse wereld; Isa 2:3 ; Mic 4:2 ; Act 1:8 ."},{"catchword":"Heers in het midden","tekst":"Te weten, door uw woord en Geest, in de harten der uitverkorenen, en door uwe almogendheid in het beschutten uwer kerk en in het straffen van hare vervolgers. Anders: Gij zult heersen."},{"catchword":"Uwer vijanden","tekst":"Te weten, der vijanden uwer kerk. Want die de kerk vervolgt, die vervolgt Christus zelf; Act 9:4 ."}],"3":[{"catchword":"Uw volk zal","tekst":"Hebr. uw volk der gewilligheden; dat is, het zal zijn een volk van grote gewilligheid, of vol gewilligheid, te weten, om het Evangelie aan te nemen, en om U, o Heere Jezus Christus, te dienen; ja het zal, bij manier van spreken, de gewilligheid zelve zijn. Zie Exo 25:2 ; Psa 119:108 ; Act 2:41 , en Rom 12:11 , en versta hier door uw volk de uitverkorenen, of gelovigen."},{"catchword":"op den dag Uwer","tekst":"Dat is, als Gij de krachtige predikatie van het heilige Evangelie, door de apostelen, mitsgaders vele andere verkondigers van hetzelve, zult uitzenden, om de wereld en den duivel te overwinnen en veel schapen in den waren schaapstal te brengen. Zie Rom 1:16 ; 2Co 10:4-5 ; Rev 6:2 ."},{"catchword":"in heilig sieraad;","tekst":"Hebr. in de schoonheden of versierselen der heiligheid, of in heilig sieraad; dat is, in heiligheid des levens en allrlei Christelijke deugden, die uit het geloof voortkomen. Het is een gelijkenis, genomen van de priesters van het Oude Testament, die sierlijke en heilige klederen aantrokken als zij den Levietischen goddienst verrichten zouden. Anders: in de heerlijkheden des heiligdoms, of in het sierlijke heiligdom; dat is, in den schonen tempel; met welke woorden de kerk Gods dikwijls beduid wordt."},{"catchword":"uit de baarmoeder","tekst":"Dat is, uwe kinderen zullen U geboren worden, gelijk de dauw uit de baarmoeder van den dageraad. Gelijk de dauw in den dageraad als uit ene baarmoeder voortkomt en geboren wordt, en het gras met ontelbare droppels begiet en lieflijk bevochtigt, alzo zal het eerste licht der predikatie van het heilige Evangelie als een dauw ontallijk vele harten der uitverkorenen begieten en bevochtigen en die geestelijkerwijze baren. Zie Joh 3:5 ; alwaar de Heere Christus den Heiligen Geest vergelijkt bij water, door hetwelk de aarde bevochtigd en vruchtbaar gemaakt wordt. Anders: het zal u van de baarmoeder des dageraads af een dauw van uwe jeugd wezen. Sommigen zo ouden als nieuwe leraars, verstaan deze woorden van de eeuwige geboorte des Zoons van den Vader, gesproken bij gelijkenis, genomen van menselijke geboorte, en zetten het over: Uit de baarmoeder voor den dageraad is U de dauw uwer geboorte. Anderen verstaan het van de menschwording onzes Heeren Christus en zijne geboorte uit de maagd Maria."}],"4":[{"catchword":"HEERE heeft gezworen,","tekst":"Zie over deze psalm, inzonderheid over dit vierde vers het zevende hoofdstuk van den brief aan de Heb 7:4 ."},{"catchword":"Gij zijt","tekst":"Of, wees priester, of gij zult priester wezen."},{"catchword":"Priester in eeuwigheid,","tekst":"Te weten, die zichzelven zal offeren op het altaar des kruises, tot verzoening van al degenen, die in hem geloven; Heb 5:9 , en Heb 5:9-10"},{"catchword":"naar de ordening","tekst":"Of, naar de wijze van, of gelijk Melchizedek; die begin der dagen noch einde des levens had; idem, gelijk Melchizedek een koning en ook een priester geweest is, Gen 14:18 , alzo ook Jezus Christus, wiens voorbeeld Melchizedek geweest is."}],"5":[{"catchword":"De HEERE is aan","tekst":"Te weten, de Heere Jezus Christus, die aan uw rechterhand gezeten is, en alzo spreekt hier nu David God den Vader aan; of hij spreekt het volk Gods aan, hetzelve belovende dat Christus de Heere hen zal bijstaan en verdedigen, gelijk Psa 16:8 , en Psa 109:31 ."},{"catchword":"Hij zal","tekst":"Hebr. Hij heeft koningen verslagen; een profetische wijze van spreken."},{"catchword":"koningen","tekst":"Versta hier, zulke koningen en prinsen, die zich tegen Christus verzetten en zijne kerk vervolgen, gelijk Psa 2:9 , Psa 2:12 ."},{"catchword":"verslaan","tekst":"Hebr. doorsteken."},{"catchword":"ten dage Zijns toorns","tekst":"Dat is, ten tijde wanneer God bestemd heeft dat zijn toorn zal uitbarsten."}],"6":[{"catchword":"Hij zal recht doen","tekst":"Dat is, Hij zal de vervolgers van zijn volk straffen."},{"catchword":"vol dode lichamen","tekst":"Te weten, zijner vijanden, die in den slag zullen omkomen. Verg. Psa 45:5 ."},{"catchword":"dengene, die het","tekst":"Sommigen verstaan door deze woorden den antichrist, heersende over vele landen, ja den duivel zelf; anderen duiden het op de boze regeerders in het algemeen."}],"7":[{"catchword":"Hij zal op den","tekst":"Dat is, Hij zal uit de drinkbeker van Gods toorn drinken en alzo in zijne heerlijkheid ingaan. Alzo dat hier de staat zijner vernedering en verhoging samengevoegd worden. Of hij wil zeggen: Christus zal de victorie over de vijanden zijner kerk zolang vervolgen, totdat Hij hen verslagen of teniet gebracht zal hebben. En dit zal Hij met zulken ernst en ijver doen, dat Hij den tijd niet nemen zal om lang te rusten en zich met spijs en drank verkwikken; maar Hij zal zijn dorst lessen met water uit de beken, die Hij bij den weg, in het vervolgen zijner vijanden, vinden zal. Dit is bij gelijkenis gesproken, zijnde dit de zin dezer woorden in het kort: Christus zal zich zijne vijanden volkomenlijk onderwerpen en zijn volk uit hunne handen verlossen. Verg. hiermede de historie van Gideon, Jdg 7:4-7 , enz."},{"catchword":"Hij het hoofd","tekst":"Dat is, [Hij], te weten Christus, zal na zijnen dood verrijzen en tot de hoogste heerlijkheid verhoogd worden. Zie Phi 2:8-9 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A Psalm of David. The Lord [viz. God the Father] hath spoken [viz. In his eternal Council, which he hath revealed and punished unto us in his appointed time] unto my Lord: [i.e. unto Christ, whom David calleth his Lord here. For Christ is the son of David, according to the flesh, but Davids Lord, in regard of his being truely God, with God the Father and Holy Ghost, and a Lord of all men, especially of his Elect. See Mat 22:43.45. Mark 12.36. Luk 20:42. Act 2:34. Heb 1:13.] sit at my right hand, [i.e. have and exercise dominion with all Glory and Majesty, in heaven and earth, 1 Cor.15.25. Heb 1:3.13. and 8.1. and 10.12,13. Eph.1.20, etc. This kind of speaking is taken from Kings and Princes, who cause those to sit at their right hand whom they will honour. See 1 Kings 2.19. and Psa 45:10.] until I shall have put thine enemies for a footstool of thy feet. [the sence is, until I shall have subdued thine enemies, ( to wit, the persecutors of the Church, yea, death it self, 1 Cor.15.24,26.) under thee. Hence can no ways be concluded, that Christs Kingdom shall not be everlasting, although the administration of the Kingdom of Christ, such as now it is, shall cease at the last day of judgement: for then there shall be no more enemies to annoy or hurt the Church of Christ, 1 Cor.15.24,28. See the Annot. Gen.28.on v.15.]"}],"2":[{"catchword":null,"tekst":"The LORD, [In the first verse David address his speech to the people of God; here he speaketh unto Christ] shall send [forth, namely, into all the world] the Scepter of thy [Christ] strength, [or, thy strong Scepter or the rod, or staff of thy strength, to wit, the publishing of the holy Gospel, whereby the Holy Ghost doth work powerfully in the hearts of the Elect. See Rom 1:16.] out of Zion, [understand this, so as that the Jewry, and thence be further spread abroad, throughout all the world, Isa 2:3. Mic 4:2. Act 1:8.] (saying) Rule [viz. By thy Word and spirit, in the hearts of the Elect, and by thine Almighty power, in protecting of thy church, and in the punishing of the persecutors thereof. Others, thou shalt rule] in the midst of thine enemies. [viz. The enemies of thy Church: for he that persecuteth the Church, doth persecute Christ himself, Act 9:4.]"}],"3":[{"catchword":null,"tekst":"Thy people shall be very willing, [Heb. Thy people of willingnesses, namely, to embrace the Gospel, and to serve and worship thee, O LORD Jesus Christ: yea, it shall be in a manner, willingness it self. See Act 2:41. Rom 12:1. and Psalm.119.108. Exo 25:2. and understand here by thy people the Elect, or faithful] in the day of thy warlike power, [that is, when as thou shalt send abroad the powerful preaching of the holy Gospel, by the Apostles and many other publishers of it, thereby to subdue the world and the devil, and to bring many sheep into the true fold of Christ. See Rom 1:16. 2 Cor.10.4,5. Rev 6:2.] in holy ornaments: [Heb. In the beauties or, ornaments of holiness, that is to say, in holiness of life and all Christian vertues, proceeding of true faith. It is spoken by way of similitude taken from the Priests of the old testament, who were wont to put on stately and holy garments when they were to attend the Levitical service. Others, in the glory of the Sanctuary, or in the comely, or decent Sanctuary; that is, in the glorious and beautiful Temple, by which words the Church of God is often signified] out of the womb of the dawning day shall be born unto thee, as the dew out of the womb of the dawning day. Even as the dew in the dew in the morning, cometh forth and is born out of a womb as it were, and doth sprinkle the grass with drops innumerable, and sweetly refresh it: so shall the first light of the preaching of the gospel, like unto a dew, besprinkled and water an innumerable company of elect hearts, and cause them to be unborn in a spiritual manner: See Joh 3:5. Where our Saviour Christ compareth the Holy Ghost with water, whereby the earth is moistened and made fruitful. Others, it shall be unto thee, from the womb of the morning, a dew of thy youth. Some, both ancient and latter Divines, do understand this passage of eternal Birth of the son from the Father, by a borrowed speech, taken from human generation, and render the words thus; Out of the Womb of the morning is the dew of thy birth unto thee. There are others which understand it of the Incarnation of Christ, and his being born out of the Virgin Mary.]"}],"4":[{"catchword":null,"tekst":"The LORD hath sworn, [See upon this Psalm, especially this fourth verse, the seventh chapter of the Epistle to the Hebrews] and it shall not repent him, Thou art [or be thou, or thou shalt be] Priest [viz. Such a one, as was to offer up himself on the Altar of the Cross, for the atonement or reconciliation of all that believe in him, Hebr.5.9. and 9.10.] in Eternity, according to the order of Melchizedek. [or according to the manner or likeness of Melchizedek, which had neither beginning of days, nor end of life: Again, as Melchizedek was a King, and also a Priest, Gen 14:18. So is Christ Jesus likewise, Typified or shadowed forth by Melchizedek."}],"5":[{"catchword":null,"tekst":"The Lord is at thy right hand; [viz. The const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
