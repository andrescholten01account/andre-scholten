 Dit woord dat u gesproken hebt, is goed om te doen.", "Jer 5:5": "Ik zal naar de groten gaan, en met hen spreken, want die kennen de weg van de HEERE, het recht van hun God; maar zij hadden samen het juk verbroken, en de banden verscheurd.", "Ps 93:1": "De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen.", "Matt 5:33": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Job 7:8-10": "Het oog van hem die mij nu ziet, zal mij niet zien; uw ogen zullen op mij zijn; maar ik zal niet meer zijn. Een wolk vergaat en vaart heen; zo zal hij die in het graf daalt, niet weer opkomen. Hij zal niet meer terugkeren naar zijn huis, en zijn plaats zal hem niet meer kennen.", "Rom 11:10": "Dat hun ogen verduisterd worden, om niet te zien; en verkrom hun rug alle tijd.", "Luk 4:11": "En dat zij U op de handen zullen dragen, opdat U uw voet niet ooit aan een steen stoot.", "Hand 13:34": "En dat Hij Hem uit de doden heeft opgewekt, zodat Hij niet meer tot verderving zal terugkeren, heeft Hij zo gezegd: Ik zal u de weldaden van David geven, die betrouwbaar zijn;", "Hab 2:5-13": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken. Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk! Zullen niet onvoorziens opstaan die u zullen bijten, en ontwaken die u zullen doen beven, en zult u hun niet tot buit worden?", "Ex 23:7": "Blijf ver van valse zaken; en de onschuldige en rechtvaardige zult u niet doden; want Ik zal de goddeloze niet rechtvaardigen.", "Ps 88:10-15": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?", "Luk 19:46": "en zei tegen hen: Er is geschreven: Mijn huis is een huis van het gebed; maar u hebt er een rovershol van gemaakt.", "Ps 14:4": "Hebben dan alle werkers van de ongerechtigheid geen kennis, die mijn volk opeten alsof zij brood aten? Zij roepen de HEERE niet aan.", "Jes 54:5": "Want uw Maker is uw Man, HEERE van de heerscharen is Zijn Naam; en de Heilige van Israël is uw Verlosser; Hij zal de God van de hele aardbodem genoemd worden.", "Rom 15:10": "En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk!", "Ef 6:9": "En u heren, doe hetzelfde bij hen, en laat het dreigen achterwege; als iemand die weet dat ook uw eigen Heere in de hemelen is, en dat er geen aanneming van het persoon bij Hem is.", "Spr 25:21": "Als hij die u haat, honger heeft, geef hem brood te eten; en als hij dorstig is, geef hem water te drinken;", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "Jer 18:12": "Doch zij zeggen: Het is buiten hoop; maar wij zullen naar onze eigen gedachten wandelen, en wij zullen doen, ieder, wat zijn boze hart goeddunkt.", "Rom 3:18": "Er is geen vreze van God voor hun ogen.", "Jes 5:23": "Die de goddeloze rechtvaardigen om een geschenk, en de gerechtigheid van de rechtvaardigen van hen afwenden.", "Deut 16:14": "En u zult vrolijk zijn op uw feest, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet, en de vreemdeling, en de wees, en de weduwe, die in uw poorten zijn.", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Ps 94:21": "Zij rotten samen tegen de ziel van de rechtvaardige, en zij veroordelen onschuldig bloed.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Matt 23:39": "Want Ik zeg u: U zult Mij van nu af aan niet zien, totdat u zeggen zult: Gezegend is Hij Die komt in de Naam van de Heere!", "2 Kron 20:6": "En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Ps 7:9": "De HEERE zal de volken recht doen; doe mij recht, HEERE, naar mijn gerechtigheid, en naar mijn oprechtheid, die bij mij is.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Deut 26:13": "En u zult voor het aangezicht van de HEERE, uw God, zeggen: Ik heb het heilige uit het huis weggenomen, en heb het ook aan de Leviet en aan de vreemdeling, aan de wees en aan de weduwe gegeven, naar al Uw geboden die U mij geboden hebt; ik heb niets van Uw geboden overtreden, en niets vergeten.", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Joh 8:33": "Zij antwoordden Hem: Wij zijn Abrahams nageslacht, en hebben nog nooit iemand gediend; hoe kunt U dan zeggen: U zult vrij worden?", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Luk 1:53": "Hongerigen heeft Hij met goede dingen verzadigd; en rijken heeft Hij met lege handen weggestuurd.", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Amos 3:10": "Want zij weten niet te doen wat recht is, spreekt de HEERE; zij die in hun paleizen schatten vergaren door geweld en verwoesting.", "Ps 49:13": "De mens echter, die in aanzien is, blijft niet; hij wordt gelijk aan de dieren, die vergaan.", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Mal 1:14": "Ja, vervloekt is de bedrieger, die een mannetje in zijn kudde heeft, en de Heere een gelofte doet, en offert wat verdorven is! want Ik ben een groot Koning, zegt de HEERE van de heerscharen, en Mijn Naam is ontzagwekkend onder de heidenen.", "Hand 10:34": "En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon;", "Ps 118:23": "Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen.", "Mark 12:31": "En het tweede, hieraan gelijk, is dit: U zult uw naaste liefhebben als uzelf. Er is geen ander gebod groter dan deze.", "Ps 119:18": "Ontdek mijn ogen, dat ik aanschouw de wonderen van Uw wet.", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "Deut 2:19": "En u zult naderen tegenover de kinderen van Ammon; beangstig hen niet, en meng u niet met hen; want Ik zal u van het land van de kinderen van Ammon geen erfenis geven, omdat Ik het aan de kinderen van Lot tot erfenis gegeven heb.", "2 Sam 22:25-27": "Zo gaf de HEERE mij weer naar mijn gerechtigheid, naar mijn reinheid, voor Zijn ogen. Bij de goedertierene houdt U Zich goedertieren; bij de oprechte held houdt U Zich oprecht. Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "1 Kor 15:55-57": "Dood, waar is uw prikkel? Graf, waar is uw overwinning? De prikkel van de dood nu is de zonde; en de kracht van de zonde is de wet. Maar God zij dank, Die ons de overwinning geeft door onze Heere Jezus Christus.", "Job 16:22": "Want er zullen nog maar weinige jaren in aantal aankomen, en ik zal het pad heengaan waardoor ik niet zal terugkeren.", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Jes 28:21": "Want de HEERE zal Zich opmaken, zoals op de berg Perazim, Hij zal beroerd zijn, zoals in het dal van Gibeon, om Zijn werk te doen, Zijn werk zal vreemd zijn; en om Zijn daad te doen, Zijn daad zal vreemd zijn!", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "Gen 2:24": "Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.", "Ex 22:9": "Bij elke zaak van onrecht, of het nu gaat om een os, een ezel, klein vee, kleding, of om iets verlorens waarvan iemand zegt dat het van hem is, zal de zaak van beide partijen voor de rechters komen; wie de rechters schuldig verklaren, die moet het aan zijn naaste dubbel teruggeven.", "1 Petr 1:14": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had;", "Zef 3:8": "Daarom, verwacht Mij, spreekt de HEERE, op de dag dat Ik Mij opmaak² tot de roof; want Mijn oordeel is, de heidenen te verzamelen, de koninkrijken te vergaderen, om over hen Mijn gramschap, de gehele gloed van Mijn toorn, uit te storten; want dit gehele land zal door het vuur van Mijn na-ijver verteerd worden.", "Ezech 31:14": "opdat geen waterrijke bomen zich verheffen over hun stam, en hun top niet opsteken boven het midden van de dichte takken, en geen bomen, die water drinken, op zichzelf staan vanwege hun hoogte; want zij zijn allen overgegeven aan de dood, aan het onderste van de aarde, in het midden van de mensenkinderen, bij hen die in de kuil neerdalen.", "Ps 2:7": "Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.", "Deut 4:24": "Want de HEERE, uw God, is een verterend vuur, een na-ijverig God.", "Ezech 34:2-4": "Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet. De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "Jes 1:3": "Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "Ps 96:13": "Voor het aangezicht van de HEERE; want Hij komt, want Hij komt, om de aarde te oordelen; Hij zal de wereld oordelen met gerechtigheid, en de volken met Zijn waarheid.", "Micha 4:12": "Maar zij kennen de gedachten van de HEERE niet, en begrijpen Zijn raadsbesluit niet; dat Hij hen bijeengebracht heeft als schoven op de dorsvloer.", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "Matt 4:7": "Jezus zei tegen hem: Er is ook geschreven: U zult de Heere, uw God, niet beproeven.", "Joh 3:4": "Nicodemus zei tegen Hem: Hoe kan een mens geboren worden als hij al oud is? Kan hij soms voor de tweede keer in de buik van zijn moeder ingaan en geboren worden?", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Job 22:9": "De weduwen hebt u met lege handen weggezonden, en de armen van de wezen zijn verbrijzeld.", "Rom 5:14": "Maar de dood heeft geheerst van Adam tot Mozes toe, ook over hen die niet gezondigd hadden op dezelfde manier als de overtreding van Adam, die een voorbeeld is van Hem die komen zou.", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "Jes 30:18": "En daarom zal de HEERE wachten, opdat Hij u genadig is, en daarom zal Hij verhoogd worden, opdat Hij Zich over u ontfermt, want de HEERE is een God van het gericht; gelukkig zijn zij allen die Hem verwachten.", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Ezech 20:13": "Maar het huis van Israël werd opstandig tegen Mij in de woestijn; zij wandelden niet in Mijn inzettingen, en verwierpen Mijn rechten, die, als een mens ze doet, hij daardoor zal leven; en zij ontheiligden Mijn sabbatten zeer, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten in de woestijn, om hen te verdelgen.", "Hab 1:5": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt.", "Ps 116:10": "Ik heb geloofd, daarom sprak ik; ik ben zeer bedrukt geweest.", "Ps 43:1": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht.", "Spr 7:7-23": "En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling; Die voorbijging op de straat, naast haar hoek, en hij trad op de weg naar haar huis. In de schemering, in de avond van de dag, in de zwarte nacht en de donkerheid;", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Jer 5:28": "Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.", "Deut 6:13": "U zult de HEERE, uw God, vrezen, en Hem dienen; en u zult bij Zijn Naam zweren.", "Ps 94:6": "De weduwe en de vreemdeling doden zij, en zij vermoorden de wezen.", "Pred 4:14": "Want de een komt uit de gevangenis om koning te worden; terwijl ook iemand die in zijn koninkrijk geboren is, verarmt.", "Deut 24:17": "U zult het recht van de vreemdeling en van de wees niet buigen, en u zult het kleed van de weduwe niet te pand nemen.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Jak 1:9": "Maar de broeder die nederig is, moet roemen in zijn hoogheid.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Pred 7:7": "Voorwaar, de onderdrukking zou wel een wijze dol maken; en het geschenk verdoemt het hart.", "Rom 2:2": "En wij weten dat het oordeel van God naar waarheid is, over hen die zulke dingen doen.", "Ps 99:4": "En de sterkte van de Koning, die het recht liefheeft. U hebt wat recht is bevestigd, U hebt recht en gerechtigheid gedaan in Jakob.", "Micha 4:7": "En Ik zal haar die kreupel was maken tot een overblijfsel, en haar die ver weg verstoten was, tot een machtig volk; en de HEERE zal Koning over hen zijn op de berg Sion, van nu af aan tot in eeuwigheid.", "Ps 136:2": "Loof de God der goden; want Zijn goedertierenheid is voor eeuwig.", "Joël 2:28-32": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien; Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten. En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Spr 1:24-31": "Omdat Ik geroepen heb, en u geweigerd hebt; Mijn hand uitgestrekt heb, en er niemand was die opmerkte; En u al Mijn raad verworpen hebt, en Mijn bestraffing niet gewild hebt; Zo zal Ik ook in uw verderf lachen; Ik zal spotten, wanneer uw vrees komt.", "Jes 65:15": "En u zult uw naam voor Mijn uitverkorenen tot een vervloeking laten; en de Heere HEERE zal u doden, maar Zijn knechten zal Hij met een andere naam noemen;", "Ps 103:14-16": "Want Hij weet wat voor maaksel wij zijn, en Hij denkt eraan dat wij stof zijn. De dagen van de mens zijn als het gras, zoals een bloem van het veld, zo bloeit hij. Als de wind daarover gegaan is, is hij er niet meer, en zijn plaats kent hem niet meer.", "Ex 25:40": "Zie er dan op toe dat u het maakt naar hun voorbeeld, dat u op de berg getoond is.", "1 Kor 2:16": "Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "Matt 13:13-16": "Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken. Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Gen 18:25": "Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen?", "Ex 9:29": "Toen zei Mozes tegen hem: Zodra ik de stad uitgegaan ben, zal ik mijn handen uitspreiden voor de HEERE; de donder zal ophouden, en de hagel zal niet meer zijn; zodat u weet dat de aarde van de HEERE is!", "Spr 28:19": "Wie zijn land bouwt, zal met brood verzadigd worden; maar wie nietige mensen volgt, zal met armoede verzadigd worden.", "Matt 13:15": "Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Hos 5:10": "De vorsten van Juda zijn geworden als zij die de grenzen verleggen; Ik zal Mijn verbolgenheid als water over hen uitgieten.", "Hos 5:4": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet.", "Jes 1:27": "Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Joh 12:38": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard?", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Lev 19:36": "U zult een eerlijke weegschaal hebben, eerlijke gewichten, een eerlijke efa, en een eerlijke hin; Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb!", "Mark 11:9": "En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere!", "Ps 81:13": "Daarom heb Ik hen overgegeven aan het goeddunken van hun hart, zodat zij wandelden in hun eigen raadslagen.", "Ps 76:13": "Die de geest van de vorsten als druiven afsnijdt; Die de koningen van de aarde vreselijk is.", "Ps 148:11": "Koningen van de aarde, en alle volken, vorsten, en alle rechters van de aarde!", "Hand 13:22": "En nadat Hij hem afgezet had, verwekte Hij hun David tot koning; aan wie Hij ook getuigenis gaf, en zei: Ik heb David gevonden, de zoon van Isaï, een man naar Mijn hart, die al Mijn wil zal doen.", "Luk 13:1-3": "En er waren in diezelfde tijd enigen aanwezig, die Hem vertelden van de Galileeërs, van wie Pilatus het bloed met hun offers gemengd had. En Jezus antwoordde en zei tegen hen: Denkt u dat deze Galileeërs meer zondaars zijn geweest dan alle andere Galileeërs, omdat zij zulke dingen hebben geleden? Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Deut 5:18": "En u zult geen overspel doen.", "2 Kor 9:9": "Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid.", "Ex 15:18": "De HEERE zal in eeuwigheid en voortdurend regeren!", "Ex 23:3": "Ook zult u de arme niet voortrekken in zijn geschil.", "Mark 7:6": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij.", "1 Kor 15:55": "Dood, waar is uw prikkel? Graf, waar is uw overwinning?", "Job 21:25": "De ander daarentegen sterft met een bittere ziel, en hij heeft van het goede niet gegeten.", "Job 38:17": "Zijn u de poorten van de dood ontdekt, en hebt u gezien de poorten van de schaduw van de dood?", "Job 12:10": "In Wiens hand de ziel is van alles wat leeft, en de geest van alle vlees van de mens.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Openb 1:18": "en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood.", "Luk 8:12": "Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden.", "Job 34:17": "Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen?", "Gen 17:5": "En uw naam zal niet meer Abram genoemd worden; maar uw naam zal Abraham zijn; want Ik heb u tot een vader van een menigte volken gemaakt.", "Matt 22:32": "Ik ben de God van Abraham, en de God van Izak, en de God van Jakob! God is niet een God van de doden, maar van de levenden.", "Joh 4:11": "De vrouw zei tegen Hem: Heere, U hebt niets om mee te putten, en de put is diep; waar hebt U dan het levende water vandaan?", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "Job 31:13-15": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij; (Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden? Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "Rom 8:36": "(Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.)", "Spr 17:16": "Waarom toch zou de dwaas geld in zijn hand hebben, om wijsheid te kopen, terwijl hij geen verstand heeft?", "Jer 9:3": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "Hand 15:16": "Hierna zal Ik terugkeren, en de tabernakel van David, die vervallen is, weer opbouwen; en wat ervan verwoest is, zal Ik weer opbouwen, en Ik zal hem weer oprichten,", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Mark 12:43": "En Jezus riep Zijn discipelen tot Zich, en zei tegen hen: Voorwaar, Ik zeg u, dat deze arme weduwe meer heeft ingeworpen dan allen die iets in de schatkist geworpen hebben.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Ezech 16:49": "Zie, dit was de ongerechtigheid van uw zuster Sodom: hoogmoed, verzadiging van brood, en zorgeloze rust had zij en haar dochters; maar zij versterkte de hand van de arme en de behoeftige niet.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Ps 45:8": "U hebt gerechtigheid lief, en haat goddeloosheid; daarom heeft God, Uw God, U gezalfd met vreugdeolie, boven Uw metgezellen.", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Spr 19:3": "De dwaasheid van de mens verdraait zijn weg; en zijn hart is boos op de HEERE.", "Ps 119:137": "Tsade. HEERE! U bent rechtvaardig, en elk van Uw oordelen is recht.", "Ps 22:30": "Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.", "Job 34:33": "Zal het van u zijn, hoe Hij iets vergelden zal, omdat u Hem versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.", "Mark 1:2": "Zoals geschreven is in de profeten: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg voor U heen bereiden zal.", "Jer 19:15": "Zo zegt de HEERE van de heerscharen, de God van Israël: Ziet, Ik zal over deze stad, en over al haar steden, al het kwaad brengen, dat Ik over haar gesproken heb; omdat zij hun nek verhard hebben, om Mijn woorden niet te horen.", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "1 Petr 1:16": "want er staat geschreven: Wees heilig, want Ik ben heilig.", "Ezech 17:24": "Zo zullen alle bomen van het veld weten dat Ik, de HEERE, de hoge boom vernederd heb, de nederige boom verheven heb, de groene boom verdroogd heb, en de droge boom bloeiend gemaakt heb; Ik, de HEERE, heb het gesproken, en zal het doen.", "Jer 4:22": "Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.", "Ex 12:46": "In één huis zal het gegeten worden; u mag van het vlees niet naar buiten, het huis uit, dragen, en u mag er geen been van breken.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "Ps 143:2": "En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn.", "Lev 26:21-24": "En als u tegen Mij in blijft ingaan, en Mij niet wilt horen, zal Ik over u, naar uw zonden, zevenvoudig slagen toedoen. Want Ik zal onder u zenden het gedierte van het veld, dat u van uw kinderen zal beroven, en uw vee zal uitroeien, en u zal verminderen; en uw wegen zullen woest worden. Als u door deze dingen nog niet getuchtigd bent, maar tegen Mij in blijft ingaan;", "Matt 4:15": "Het land Zebulon en het land Nafthali, aan de weg naar de zee, over de Jordaan, Galilea van de volken;", "Hand 7:6": "En God sprak zo, dat zijn nageslacht als vreemdeling zou wonen in een vreemd land, en dat men hen tot slaaf zou maken en slecht behandelen, vierhonderd jaar.", "Ps 10:5": "Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.", "Joh 7:24": "Oordeel niet naar het aanzien, maar oordeel een rechtvaardig oordeel.", "1 Sam 2:25": "Wanneer een mens tegen een mens zondigt, zullen de goden hem oordelen; maar wanneer een mens tegen de HEERE zondigt, wie zal voor hem bidden? Maar zij luisterden niet naar de stem van hun vader, want de HEERE wilde hen doden.", "Deut 24:17-22": "U zult het recht van de vreemdeling en van de wees niet buigen, en u zult het kleed van de weduwe niet te pand nemen. Maar u zult gedenken dat u een knecht in Egypte geweest bent, en de HEERE, uw God, heeft u van daar verlost; daarom gebied ik u deze zaak te doen. Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen.", "Deut 16:20": "Gerechtigheid, gerechtigheid zult u najagen; opdat u leeft, en het land erfelijk bezit dat de HEERE, uw God, u geven zal.", "Pred 3:2": "Er is een tijd om geboren te worden, en een tijd om te sterven; een tijd om te planten, en een tijd om het geplante uit te roeien;", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Jes 44:6": "Zo zegt de HEERE, de Koning van Israël, en zijn Verlosser, de HEERE van de heerscharen: Ik ben de Eerste, en Ik ben de Laatste, en behalve Mij is er geen God.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "Hebr 3:7-10": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn; Waar uw vaders Mij beproefden; zij hebben Mij op de proef gesteld, en hebben Mijn werken gezien, veertig jaar lang.", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "1 Kor 1:21": "Want omdat de wereld God, in de wijsheid van God, niet door de wijsheid heeft gekend, heeft het God behaagd om door de dwaasheid van de prediking zalig te maken hen die geloven;", "Ex 23:9": "U zult ook de vreemdeling niet onderdrukken; want u kent het gemoed van de vreemdeling, omdat u vreemdelingen geweest bent in het land Egypte.", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "2 Kor 6:2": "Want Hij zegt: In de aangename tijd heb Ik u verhoord, en in de dag van de zaligheid heb Ik u geholpen. Zie, nu is het de welaangename tijd, zie, nu is het de dag van de zaligheid!", "Spr 23:21": "Want een zuiper en een vraat zullen arm worden; en de sluimering doet iemand versleten kleren dragen.", "Spr 29:13": "De arme en de bedrieger ontmoeten elkaar; de HEERE verlicht hun beider ogen.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "1 Petr 2:22": "Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden;", "Matt 12:7": "Maar als u geweten had wat dit betekent: Ik wil barmhartigheid en geen offerande, dan zou u de onschuldigen niet veroordeeld hebben.", "Jer 27:5-7": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.", "Ex 24:8": "Toen nam Mozes dat bloed, en sprengde het op het volk; en hij zei: Zie, dit is het bloed van het verbond, dat de HEERE met u gemaakt heeft over al die woorden.", "Deut 14:28": "Aan het einde van drie jaren zult u alle tienden van uw opbrengst voortbrengen, in datzelfde jaar, en u zult ze wegleggen in uw poorten;", "1 Kor 15:54": "En wanneer dit vergankelijke onvergankelijkheid zal hebben aangedaan, en dit sterfelijke onsterfelijkheid zal hebben aangedaan, dan zal het woord gebeuren dat geschreven is: De dood is verslonden tot overwinning.", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Hebr 5:11": "Over hem hebben wij veel te zeggen, en het is moeilijk uit te leggen, omdat u traag geworden bent om te horen.", "Rom 3:10-12": "zoals geschreven is: Er is niemand rechtvaardig, ook niet één; er is niemand die verstandig is, er is niemand die God zoekt. Allen zijn zij afgeweken, samen zijn zij onnut geworden; er is niemand die goed doet, er is zelfs niet één.", "Hebr 5:6": "Zoals Hij ook op een andere plaats zegt: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Hand 7:33": "En de Heere zei tegen hem: Doe de schoenen van uw voeten; want de plaats waarop u staat, is heilige grond.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Matt 22:44": "De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb.", "Ps 72:2": "Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht.", "Matt 21:42": "Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?", "Jes 53:8": "Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest.", "1 Kor 15:34": "Word op de juiste manier wakker, en zondig niet. Want sommigen hebben geen kennis van God. Ik zeg dit tot uw schaamte.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Hand 7:41": "En zij maakten een kalf in die dagen, en brachten een offer aan de afgod, en verheugden zich in de werken van hun eigen handen.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "Micha 7:7": "Maar ik zal uitzien naar de HEERE, ik zal wachten op de God van mijn heil; mijn God zal mij horen.", "Spr 29:4": "Een koning houdt het land staande door recht; maar wie tot geschenken geneigd is, verstoort het.", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Mark 3:5": "En nadat Hij hen met toorn had aangekeken, bedroefd over de verharding van hun hart, zei Hij tegen de man: Strek uw hand uit. En hij strekte hem uit; en zijn hand werd hersteld, gezond als de andere.", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.", "Matt 6:23": "maar als uw oog slecht is, zal heel uw lichaam duister zijn. Als dan het licht dat in u is duisternis is, hoe groot is dan die duisternis!", "Amos 5:25-27": "Hebt u Mij veertig jaar in de woestijn slachtoffers en spijsoffer gebracht, o huis van Israël? Ja, u droeg de tent van uw Melech, en de Kijun, uw beelden, de ster van uw god, die u zelf gemaakt had. Daarom zal Ik u gevankelijk wegvoeren, ver voorbij Damaskus, zegt de HEERE, Wiens Naam is God van de heerscharen.", "Gal 5:14": "Want de hele wet wordt in één woord vervuld, namelijk in dit: U zult uw naaste liefhebben als uzelf.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "1 Kor 3:19": "Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "Joh 6:52": "De Joden streden dan onder elkaar en zeiden: Hoe kan Hij ons Zijn vlees te eten geven?", "Spr 31:5": "opdat hij niet drinkt en het vastgestelde vergeet, en de rechtszaak van alle verdrukten verandert.", "Zach 1:4": "Wees niet als uw vaderen, tot wie de vorige profeten riepen en zeiden: Zo zegt de HEERE van de heerscharen: Bekeer u toch van uw slechte wegen en uw slechte daden; maar zij hoorden niet, en zij luisterden niet naar Mij, spreekt de HEERE.", "Deut 19:15": "Eén enkele getuige zal tegen niemand opstaan in verband met enige ongerechtigheid of enige zonde, van welke zonde hij ook zou hebben gezondigd; op de verklaring van twee getuigen, of op de verklaring van drie getuigen, zal de zaak vaststaan.", "1 Kor 10:7": "En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Ps 40:7-9": "Gij hebt geen lust gehad aan slachtoffer en spijsoffer; Gij hebt mij de oren doorboord; brandoffer en zondoffer hebt Gij niet geëist. Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Jes 1:17": "Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "Ps 104:29": "Verbergt U Uw gezicht, zij worden angstig; neemt U hun adem weg, zij sterven, en zij keren terug tot hun stof.", "Ps 103:19": "De HEERE heeft Zijn troon in de hemelen bevestigd, en Zijn Koninkrijk heerst over alles.", "Joh 1:23": "Hij zei: Ik ben de stem van hem die roept in de woestijn: Maak de weg van de Heere recht, zoals Jesaja, de profeet, gesproken heeft.", "Spr 22:9": "Wie goed van oog is, zal gezegend worden; want hij heeft van zijn brood aan de arme gegeven.", "Jer 9:21": "Want de dood is geklommen in onze vensters, hij is in onze paleizen gekomen, om de kinderen uit te roeien van de wijken, de jongemannen van de straten.", "Joh 19:37": "En weer zegt een andere Schrift: Zij zullen zien op Hem, in Wie zij gestoken hebben.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Mark 12:29": "En Jezus antwoordde hem: Het eerste van alle geboden is: Hoor, Israël! De Heere, onze God, is een enig Heere.", "Luk 18:20": "U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Neh 5:1-13": "Maar het geroep van het volk en van hun vrouwen was groot, tegen hun broeders, de Joden. Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven. Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.", "Hand 4:25": "Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht?", "Matt 23:16-24": "Wee u, blinde leidslieden, die zeggen: Wie ook zweert bij de tempel, dat is niets; maar wie zweert bij het goud van de tempel, die is verplicht zijn eed te houden. Dwazen en blinden, want wat is meer, het goud, of de tempel die het goud heiligt? En wie zweert bij het altaar, dat is niets; maar wie zweert bij de gave die daarop ligt, die is verplicht zijn eed te houden.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Job 37:23": "De Almachtige, Hem kunnen wij niet doorgronden; Hij is groot van kracht; doch door recht en grote gerechtigheid verdrukt Hij niet.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Spr 17:3": "De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE toetst de harten.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Mal 4:6": "En hij zal het hart van de vaders terugbrengen tot de kinderen, en het hart van de kinderen tot hun vaders, zodat Ik niet hoef te komen en de aarde met de ban sla.", "Ezech 20:21": "Maar die kinderen waren ook opstandig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet in acht om die te doen, die, als een mens ze doet, hij daardoor zal leven; zij ontheiligden Mijn sabbatten, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen in de woestijn.", "Ps 39:14": "Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "Jer 11:8": "Maar zij hebben niet gehoord, en ook hun oor niet geneigd, maar hebben gewandeld, ieder naar het goeddunken van hun boze hart; daarom heb Ik over hen gebracht al de woorden van dit verbond, dat Ik geboden had te doen, maar zij hebben het niet gedaan.", "Richt 16:20": "En zij zei: De Filistijnen over u, Simson! En hij werd wakker uit zijn slaap, en zei: Ik zal ditmaal uitgaan, zoals de andere keren, en mij uitschudden; want hij wist niet, dat de HEERE van hem geweken was.", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Ps 94:1": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend!", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "Job 34:10-12": "Daarom, u, lieden van verstand, hoor naar mij: Ver zij God van goddeloosheid, en de Almachtige van onrecht! Want naar het werk van de mens vergeldt Hij hem, en naar ieders weg doet Hij het hem vinden. Ook waarlijk, God handelt niet goddeloos, en de Almachtige verkeert het recht niet.", "Ps 136:3": "Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Ex 23:6": "U zult het recht van uw arme niet buigen in zijn geschil.", "Jer 32:27": "Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Ps 145:11-13": "Caph. Zij zullen de heerlijkheid van Uw Koninkrijk vermelden, en Uw macht zullen zij uitspreken. Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk. Mem. Uw Koninkrijk is een Koninkrijk van alle eeuwen, en Uw heerschappij is in alle geslacht en geslacht.", "Ps 11:7": "Want de HEERE is rechtvaardig, Hij heeft gerechtigheden lief; Zijn aangezicht aanschouwt de oprechte.", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Gal 3:11": "En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven.", "Matt 22:37": "En Jezus zei tegen hem: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw verstand.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Ef 6:3": "opdat het u goed gaat, en u lang leeft op de aarde.", "Job 3:17-19": "Daar houden de bozen op van beroering, en daar rusten de vermoeiden van kracht; Daar zijn de gebondenen samen in rust; zij horen de stem van de drijver niet. De kleine en de grote is daar; en de knecht vrij van zijn heer.", "Ef 4:6": "Eén God en Vader van allen, Die boven allen is, en door allen, en in u allen.", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Dan 12:10": "Velen zullen gereinigd, wit gemaakt en gelouterd worden; maar de goddelozen zullen goddeloos handelen, en geen van de goddelozen zal het begrijpen, maar de verstandigen zullen het begrijpen.", "2 Sam 1:23": "Saul en Jonathan, die geliefd waren, en die liefelijke mensen in hun leven, zijn ook in hun dood niet gescheiden; zij waren sneller dan arenden, zij waren sterker dan leeuwen.", "Spr 14:20": "De arme wordt zelfs door zijn vriend gehaat; maar de liefhebbers van de rijke zijn met velen.", "2 Kor 13:1": "Dit is de derde keer dat ik naar u toe kom; op grond van de verklaring van twee of drie getuigen zal elk woord vaststaan.", "Luk 20:34-38": "En Jezus antwoordde en zei tegen hen: De kinderen van deze wereld trouwen, en worden ten huwelijk uitgegeven; maar wie waardig geacht worden om die andere wereld te verwerven en de opstanding uit de doden, zullen niet trouwen, en ook niet ten huwelijk uitgegeven worden; want zij kunnen niet meer sterven, want zij zijn gelijk aan de engelen; en zij zijn kinderen van God, omdat zij kinderen van de opstanding zijn.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Hebr 11:18": "(tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Ps 2:8": "Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting.", "Jes 42:6": "Ik, de HEERE, heb u geroepen in gerechtigheid, en Ik zal u bij uw hand grijpen; en Ik zal u behoeden, en Ik zal u geven tot een Verbond van het volk, tot een Licht van de heidenen.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 92:7": "Een redeloos man weet er niet van, en een dwaas begrijpt dit niet;", "Ps 12:6": "Om de verwoesting van de ellendigen, om het kermen van de behoeftigen, zal Ik nu opstaan, zegt de HEERE; Ik zal in veiligheid zetten wie ernaar snakt.", "Luk 7:35": "Doch de wijsheid is in het gelijk gesteld door al haar kinderen.", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Ps 110:4": "De HEERE heeft gezworen, en het zal Hem niet berouwen: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Deut 10:14": "Zie, van de HEERE, van uw God, is de hemel, en de hemel der hemelen, de aarde, en al wat daarin is.", "Ezech 21:25": "En u, o onheilige, goddeloze vorst van Israël, wiens dag komen zal, in de tijd van de uiterste ongerechtigheid;", "1 Kor 13:6": "Zij verblijdt zich niet in de ongerechtigheid, maar zij verblijdt zich in de waarheid;", "Gal 3:8": "En de Schrift, die van tevoren zag dat God de heidenen uit het geloof zou rechtvaardigen, heeft van tevoren aan Abraham het Evangelie verkondigd, en zei: In u zullen alle volken gezegend worden.", "Pred 2:14": "De ogen van de wijze staan in zijn hoofd, maar de dwaas wandelt in de duisternis. Toen merkte ik ook op dat één en hetzelfde lot hun allen treft.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Hos 4:6": "Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "Rom 9:13": "Zoals geschreven is: Jakob heb Ik liefgehad, en Ezau heb Ik gehaat.", "Ex 20:12-16": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Ezech 22:27": "Haar vorsten zijn in haar midden als wolven die een prooi roven, om bloed te vergieten en om zielen te verderven, opdat zij gierigheid zouden plegen.", "Ps 135:6": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Hos 14:4": "Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Luk 4:4": "En Jezus antwoordde hem: Er is geschreven dat de mens niet van brood alleen zal leven, maar van elk woord van God.", "Spr 13:7": "Er is iemand die zichzelf rijk maakt, en toch niets heeft, en iemand die zichzelf arm maakt, en toch veel goed heeft.", "Job 10:22": "Een stikdonker land, als de duisternis zelf, de schaduw van de dood, en zonder ordeningen, en het geeft schijnsel als de duisternis.", "Ps 93:2": "Van toen af is Uw troon bevestigd, U bent van eeuwigheid af.", "Spr 29:2": "Als de rechtvaardigen groot worden, verblijdt het volk zich; maar als de goddeloze heerst, zucht het volk.", "Ps 49:21": "De mens, die in aanzien is, en geen verstand heeft, wordt gelijk aan de dieren, die vergaan.", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Jer 50:7": "Allen die hen vonden, aten hen op, en hun tegenstanders zeiden: Wij zullen geen schuld hebben; omdat zij gezondigd hebben tegen de HEERE, in de woning van de gerechtigheid, ja, tegen de HEERE, de Verwachting van hun vaderen.", "Ps 24:1": "Een psalm van David. De aarde is van de HEERE, alsook haar volheid, de wereld, en zij die daarin wonen.", "Micha 7:2": "De goedertierene is verdwenen uit het land, en er is niemand oprecht onder de mensen; zij loeren allemaal op bloed, zij jagen, ieder op zijn broeder, met een jachtnet.", "Ps 49:8": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven;", "Klaagl 3:34-36": "Lamed. Dat men al de gevangenen van de aarde onder Zijn voeten verbrijzelt; Lamed. Dat men het recht van een man buigt voor het aangezicht van de Allerhoogste; Lamed. Dat men een mens verongelijkt in zijn rechtszaak; zou de Heere dat niet zien?", "1 Kor 9:9": "Want in de wet van Mozes staat geschreven: U zult een dorsende os niet muilbanden. Zorgt God soms voor de ossen?", "Matt 4:10": "Toen zei Jezus tegen hem: Ga weg, satan, want er staat geschreven: De Heere, uw God, zult u aanbidden, en Hem alleen dienen.", "Ps 98:2": "De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.", "Jer 44:16": "Wat betreft het woord dat u tot ons in de Naam van de HEERE gesproken hebt, wij zullen niet naar u horen.", "2 Kor 10:17": "Maar wie roemt, laat die roemen in de Heere.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Jer 7:11": "Is dan dit huis, dat naar Mijn Naam genoemd is, in uw ogen een schuilplaats van rovers? Zie, Ik heb het ook gezien, spreekt de HEERE.", "Spr 21:2": "Elke weg van een mens is recht in zijn eigen ogen; maar de HEERE weegt de harten.", "Mark 12:30": "En u zult de Heere, uw God, liefhebben uit heel uw hart, en uit heel uw ziel, en uit heel uw verstand, en uit heel uw kracht. Dit is het eerste gebod.", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Ps 29:10": "De HEERE heeft gezeten over de watervloed; ja, de HEERE zit, Koning in eeuwigheid.", "Ps 81:12": "Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mij niet gewild.", "Jes 48:4": "Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;", "Spr 2:13": "Van hen die de paden van de oprechtheid verlaten, om te gaan in de wegen van de duisternis;", "Ps 74:12": "Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.", "Job 33:13": "Waarom hebt u tegen Hem getwist? Want Hij antwoordt niet van al Zijn daden.", "Ps 89:49": "Wat man leeft er, die de dood niet zien zal, die zijn ziel zal bevrijden van het geweld van het graf? Sela.", "Deut 19:16-19": "Wanneer een kwaadwillige getuige tegen iemand zal opstaan om een valse verklaring tegen hem af te leggen; dan zullen die twee mannen die de twist hebben, staan voor het aangezicht van de HEERE, voor het aangezicht van de priesters en de rechters, die er in die dagen zullen zijn. En de rechters zullen zorgvuldig onderzoek doen; en zie, de getuige is een valse getuige, hij heeft een valse verklaring afgelegd tegen zijn broeder;", "Hagg 2:7": "Want zo zegt de HEERE van de heerscharen: Nog eenmaal, over een korte tijd, zal het zover zijn; en Ik zal de hemel, en de aarde, en de zee, en het droge doen beven.", "Jes 30:30": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.", "Job 29:15": "Voor de blinden was ik ogen, en voor de kreupelen was ik voeten.", "Jes 42:1-4": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "1 Kor 2:8": "Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben.", "Ef 4:18": "Verduisterd in het verstand, vervreemd van het leven van God, door de onwetendheid die in hen is, door de verharding van hun hart;", "Luk 20:17": "Maar Hij keek hen aan en zei: Wat betekent dan wat er geschreven staat: De steen die de bouwers verworpen hebben, die is de hoeksteen geworden?", "Jes 28:11": "Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;", "Spr 17:26": "Het is niet goed, de rechtvaardige te straffen, laat staan dat men vorsten zou slaan om wat recht is.", "Hand 3:25": "U bent kinderen van de profeten, en van het verbond dat God met onze vaderen gesloten heeft, toen Hij tegen Abraham zei: En in uw nageslacht zullen alle geslachten van de aarde gezegend worden.", "Zach 11:13": "Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze in het huis van de HEERE, voor de pottenbakker.", "Ps 89:19": "Want ons schild is van de HEERE, en onze koning is van de Heilige van Israël.", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Ps 97:9": "Want U, HEERE, bent de Allerhoogste over de hele aarde; U bent zeer hoog verheven boven alle goden.", "Job 29:17": "En ik verbrak de baktanden van de verkeerde, en wierp de roof uit zijn tanden.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "Dan 4:34": "Aan het einde van deze dagen nu, hief ik, Nebukadnezar, mijn ogen op naar de hemel, want mijn verstand kwam weer in mij; en ik loofde de Allerhoogste, en ik prees en verheerlijkte de Eeuwiglevende, omdat Zijn heerschappij een eeuwige heerschappij is, en Zijn Koninkrijk is van geslacht tot geslacht;", "Deut 5:16": "Eer uw vader en uw moeder, zoals de HEERE, uw God, u geboden heeft, opdat uw dagen verlengd worden, en opdat het u goed gaat in het land dat de HEERE, uw God, u geven zal.", "Hand 1:20": "Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.", "Micha 4:13": "Maak u op en dors, dochter van Sion! Want Ik zal uw hoorn ijzer maken, en uw hoeven koper maken, en u zult veel volken verpletteren; en Ik zal hun winst aan de HEERE toewijden, en hun bezit aan de Heere van de hele aarde.", "Deut 25:1-4": "Wanneer er tussen mannen twist is, en zij naar het gerecht gaan zodat men hen recht spreekt, dan zal men de rechtvaardige rechtvaardig verklaren, en de onrechtvaardige veroordelen. En het zal gebeuren, als de onrechtvaardige slagen verdiend heeft, dat de rechter hem zal laten neervallen, en hem in zijn tegenwoordigheid laten slaan, naar het aantal dat past bij zijn onrechtvaardigheid. Met veertig slagen zal hij hem laten slaan, hij zal er niet meer bij doen; anders zou hij, als hij méér dan dat aantal slagen zou laten geven, uw broeder voor uw ogen verachtelijk maken.", "Pred 4:13": "Beter is een arme en wijze jongeman, dan een oude en dwaze koning, die niet meer weet zich te laten vermanen.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Ps 99:1": "De HEERE regeert, dat de volken beven; Hij zit tussen de cherubs; de aarde beeft.", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "Jes 37:16": "O HEERE van de heerscharen¹, God van Israël, Die tussen de cherubs² woont! U Zelf, U alleen bent de God van alle koninkrijken van de aarde; U hebt de hemel en de aarde gemaakt!", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "Jes 29:10-12": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind. Daarom is voor u elk visioen geworden als de woorden van een verzegeld boek, dat men geeft aan iemand die lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet, want het is verzegeld. Of men geeft het boek aan iemand die niet lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet lezen.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "2 Tess 2:12": "opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Gal 4:8": "Maar toen u God niet kende, diende u hen die van nature geen goden zijn;", "Ps 94:20": "Zou de troon van het onrecht zich met U verbinden, die moeite verzint bij wet?", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Spr 10:21": "De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Jer 16:12": "En u erger gedaan hebt dan uw vaders; want zie, u wandelt, ieder naar het goeddunken van zijn slechte hart, om naar Mij niet te horen.", "Spr 29:14": "Een koning die de armen in trouw recht doet, diens troon zal voor eeuwig bevestigd worden.", "Mark 4:11": "En Hij zei tegen hen: Aan u is het gegeven het geheimenis van het Koninkrijk van God te verstaan; maar aan hen die buiten zijn, gebeurt dit alles door gelijkenissen;", "Spr 29:12": "Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Spr 22:27": "Als u niets hebt om te betalen, waarom zou men uw bed van onder u wegnemen?", "Jer 14:1-16": "Het woord van de HEERE, dat tot Jeremia gekomen is, over de zaken van de grote droogte. Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op. En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Jes 59:7": "Hun voeten lopen naar het kwade, en zij haasten zich om onschuldig bloed te vergieten; hun gedachten zijn gedachten van ongerechtigheid, verwoesting en verderf is op hun wegen.", "Rom 10:5": "Want Mozes beschrijft de rechtvaardigheid die uit de wet is, en zegt: De mens die deze dingen doet, zal daardoor leven.", "Job 34:19": "Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "1 Kor 1:19": "Want er is geschreven: Ik zal de wijsheid van de wijzen doen vergaan, en het verstand van de verstandigen zal Ik tenietdoen.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "2 Kron 9:8": "Geloofd zij de HEERE, uw God, Die behagen in u gehad heeft, om u op Zijn troon te zetten, tot een koning voor de HEERE, uw God; omdat uw God Israël liefheeft, om het voor eeuwig op te richten, daarom heeft Hij u tot koning over hen gesteld, om recht en gerechtigheid te doen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Gen 14:22": "Doch Abram zei tegen de koning van Sodom: Ik heb mijn hand opgeheven tot de HEERE, de allerhoogste God, Die hemel en aarde bezit;", "Job 17:16": "Zij zullen mee naar beneden gaan met de grendels van het graf, als er rust samen in het stof zal zijn.", "Pred 3:15": "Wat geweest is, dat is nu, en wat wezen zal, dat is al geweest; en God zoekt het weggedrevene op.", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "Openb 2:27": "En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Jes 66:24": "En zij zullen naar buiten gaan, en zij zullen de dode lichamen zien van de mensen die tegen Mij in opstand zijn gekomen; want hun worm zal niet sterven, en hun vuur zal niet uitgeblust worden, en zij zullen voor alle vlees een afgrijzen zijn.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Hand 13:35": "Daarom zegt hij ook in een andere psalm: U zult Uw Heilige geen verderving laten zien.", "Job 25:2": "Heerschappij en ontzag zijn bij Hem, Hij maakt vrede in Zijn hoogten.", "Ef 5:8": "Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht.", "Lev 18:5": "Ja, Mijn inzettingen en Mijn rechten zult u houden; welk mens die doet, die zal daardoor leven; Ik ben de HEERE!", "Rom 3:4-6": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt. Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.) Dat zij verre, anders hoe zal God de wereld oordelen?", "Rom 15:21": "maar zoals geschreven is: Aan wie van Hem niet was verkondigd, die zullen het zien; en die het niet gehoord hebben, die zullen het verstaan.", "Hand 3:22": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.", "Spr 1:30": "Zij hebben in Mijn raad niet toegestemd; al Mijn bestraffingen hebben zij versmaad;", "Mark 11:17": "En Hij onderwees hen, en zei: Staat er niet geschreven: Mijn huis zal een huis van gebed genoemd worden voor alle volken? Maar u hebt het tot een rovershol gemaakt.", "Lev 12:8": "Maar als haar hand niet genoeg vindt voor een lam, zal zij twee tortelduiven of twee jonge duiven nemen, één als brandoffer en één als zondoffer; en de priester zal voor haar verzoening doen; zo zal zij rein zijn.", "Dan 9:14": "Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken die Hij gedaan heeft, omdat wij Zijn stem niet gehoorzaamden.", "Spr 30:21": "Om drie dingen beeft de aarde, ja, om vier, die zij niet kan dragen:", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Spr 28:28": "Als de goddelozen opkomen, verbergt de mens zich; maar als zij omkomen, worden de rechtvaardigen talrijker.", "Deut 1:16": "En ik gebood in die tijd uw rechters, en zei: Hoor de geschillen tussen uw broeders, en oordeel rechtvaardig tussen de man en zijn broeder, en zijn vreemdeling.", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "Spr 1:29": "Omdat zij de wetenschap gehaat hebben, en de vrees van de HEERE niet hebben verkozen.", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "Job 14:19-21": "Het water vermaalt de stenen, het stof van de aarde overspoelt het gewas dat er zelf uit voortkomt; zo verderft U de verwachting van de mens. U overweldigt hem voor altijd, en hij gaat heen; U verandert zijn gelaat, en zendt hem weg. Zijn kinderen komen tot eer, en hij weet het niet; of zij worden klein, en hij merkt het niet aan hen.", "Joh 8:27": "Zij begrepen niet dat Hij tot hen over de Vader sprak.", "Gal 3:12": "Maar de wet is niet uit het geloof; maar de mens die deze dingen doet, zal daardoor leven.", "Mark 7:10": "Want Mozes heeft gezegd: Eer uw vader en uw moeder; en: Wie vader of moeder vervloekt, die zal zeker sterven.", "Pred 8:8": "Er is geen mens die macht heeft over de geest, om de geest tegen te houden; en hij heeft geen macht over de dag van de dood; er is ook geen vrijstelling in die strijd; en de goddeloosheid zal haar meesters niet redden.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Pred 7:15": "Dit alles heb ik gezien in de dagen van mijn vluchtige leven; er is een rechtvaardige die in zijn gerechtigheid omkomt; daarentegen is er een goddeloze die in zijn slechtheid zijn dagen verlengt.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "Openb 22:11": "Die onrecht doet, laat hij nog onrecht doen; en die vuil is, laat hij nog vuil worden; en die rechtvaardig is, laat hij nog gerechtvaardigd worden; en die heilig is, laat hij nog geheiligd worden.", "Hebr 2:13": "En verder: Ik zal Mijn vertrouwen op Hem stellen. En verder: Zie, hier ben Ik met de kinderen die God Mij gegeven heeft.", "Ps 23:4": "Al ging ik ook in een dal van de schaduw van de dood, ik zou geen kwaad vrezen, want U bent met mij; Uw stok en Uw staf, die troosten mij.", "Ps 58:2": "Spreekt u werkelijk gerechtigheid, gij vergadering? Oordeelt u wat recht is, mensenkinderen?", "Deut 16:11": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is, en de vreemdeling, en de wees, en de weduwe die in uw midden zijn; in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen.", "Lev 19:15": "U zult geen onrecht doen in het gericht; u zult het aangezicht van de geringe niet aannemen, noch het aangezicht van de grote voortrekken; in gerechtigheid zult u uw naaste rechtspreken.", "Rom 11:4": "Maar wat zegt het Goddelijk antwoord tegen hem? Ik heb Mijzelf nog zevenduizend mannen overgelaten, die de knie voor het beeld van Baäl niet gebogen hebben.", "Jak 1:11": "Want de zon is opgegaan met hitte, en heeft het gras dor gemaakt, en zijn bloem is afgevallen, en de mooie vorm van zijn aanzien is vergaan; zo zal ook de rijke in zijn wegen verwelken.", "Spr 24:23": "Ook deze spreuken zijn van de wijzen. Het aanzien van personen in het gericht kennen, is niet goed.", "Joh 1:5": "En het Licht schijnt in de duisternis, en de duisternis heeft het niet begrepen.", "Hand 15:17": "opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.", "Rom 9:17": "Want de Schrift zegt tegen Farao: Hiertoe heb Ik u doen opstaan, opdat Ik in u Mijn kracht zou bewijzen, en opdat Mijn Naam verkondigd wordt op de hele aarde.", "Ps 44:27": "Sta op, ons ter hulp, en verlos ons om Uw goedertierenheid.", "Joh 19:36": "Want deze dingen zijn gebeurd, opdat de Schrift vervuld wordt: Geen been van Hem zal verbroken worden.", "Rom 2:5-16": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God. Die ieder zal vergelden naar zijn werken: Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Pred 7:25": "Ik keerde mij om, en mijn hart, om te weten, en om na te sporen, en te zoeken wijsheid en een verklaring; en om te weten de goddeloosheid van de dwaasheid, en de onzinnigheid van de waanzin.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Jes 60:2": "Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden.", "Gal 4:30": "Maar wat zegt de Schrift? Werp de dienstmaagd uit en haar zoon; want de zoon van de dienstmaagd zal geenszins erven met de zoon van de vrije.", "Hand 7:49": "De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?", "Spr 18:23": "De arme spreekt smekingen; maar de rijke antwoordt harde dingen.", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Zef 3:5": "De rechtvaardige HEERE is in haar midden, Hij doet geen onrecht; elke morgen geeft Hij Zijn recht in het licht, het ontbreekt niet; maar de verkeerde weet van geen schaamte.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Jes 3:13": "De HEERE stelt Zich op om te pleiten, en Hij staat om de volken te richten.", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen he
