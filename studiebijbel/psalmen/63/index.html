ij was in de woestijn van Juda.","2":"O God! Gij zijt mijn God! ik zoek U in den dageraad; mijn ziel dorst naar U; mijn vlees verlangt naar U, in een land, dor en mat, zonder water.","3":"Voorwaar, ik heb U in het heiligdom aanschouwd, ziende Uw sterkheid en Uw eer;","4":"Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen.","5":"Alzo zou ik U loven in mijn leven; in Uw Naam zou ik mijn handen opheffen.","6":"Mijn ziel zou als met smeer en vettigheid verzadigd worden, en mijn mond zou roemen met vrolijk zingende lippen.","7":"Als ik Uwer gedenk op mijn legerstede, zo peins ik aan U in de nachtwaken.","8":"Want Gij zijt mij een hulp geweest; en in de schaduw Uwer vleugelen zal ik vrolijk zingen.","9":"Mijn ziel kleeft U achteraan; Uw rechterhand ondersteunt mij.","10":"Maar dezen, *die* mijn ziel zoeken tot verwoesting, zullen komen in de onderste plaatsen der aarde.","11":"Men zal hen storten door het geweld des zwaards; zij zullen de vossen ten deel worden.","12":"Maar de koning zal zich in God verblijden; een iegelijk, die bij Hem zweert, zal zich beroemen; want de mond der leugensprekers zal gestopt worden."},"KJV":{"1":"[[A Psalm of David, when he was in the wilderness of Judah.]] O God, thou *art* my God; early will I seek thee: my soul thirsteth for thee, my flesh longeth for thee in a dry and thirsty land, where no water","2":"[[A Psalm of David, when he was in the wilderness of Judah.]] O God, thou *art* my God; early will I seek thee: my soul thirsteth for thee, my flesh longeth for thee in a dry and thirsty land, where no water","3":"To see thy power and thy glory, so *as* I have seen thee in the sanctuary.","4":"Because thy lovingkindness *is* better than life, my lips shall praise","5":"Thus will I bless thee while I live: I will lift up my hands in thy name.","6":"My soul shall be satisfied as *with* marrow and fatness; and my mouth shall praise *thee* with joyful lips:","7":"When I remember thee upon my bed, *and* meditate on zijn; Exo 17:1 ; Num 20:1-2 ; Psa 107:33 , Psa 107:35 ; Jer 2:6 ."},{"catchword":"mat,","tekst":"Of, vermoeid, dat is dorstig; alzo wordt het land genoemd, vermits gebrek aan water, waarop de dorst volgt. Sommigen verstaan dat David van zichzelven spreekt dat hij, gelijk een vermoeid mens pleegt te zijn, [zie Pro 25:25 ] dorstig is en zonder water passende zijn lichamelijke gebrek op het geestelijke, gelijk volgt. Verg. Psa 143:6 ."}],"3":[{"catchword":"heiligdom","tekst":"Dat is, uw reine godsdienst, waarin Gij deze uwe eigenschappen openbaart, en waarin de Messias werd afgebeeld."},{"catchword":"ziende","tekst":"Anders aldus: Om uwe sterkte en uwe eer te zien, alzo ik U in het heiligdom aanschouwd heb. De woorden een weinig verzet zijnde."}],"4":[{"catchword":"zouden","tekst":"Wanneer mij zulks mocht gebeuren. Of, zullen U prijzen; en zo voorts in het volgende."}],"5":[{"catchword":"loven","tekst":"Hebr. zegenen. Versta, wanneer Gij mij de genade zult hebben gedaan dat ik wederom vrijelijk in uw huis mag verschijnen, gelijk tevoren."},{"catchword":"leven;","tekst":"Dat is, zolang ik leef, gelijk Psa 104:33 , en Psa 146:2 ."},{"catchword":"handen","tekst":"Hebr. palmen; zie Psa 28:2 ."}],"6":[{"catchword":"verzadigd","tekst":"Dit stelt hij tegen den geestelijken dorst en honger naar den publieken godsdienst en vergaderingen der heidenen, waarvan vs.2,3; zie Psa 36:9 ."},{"catchword":"vrolijk","tekst":"Hebr. lippen der vrolijke gezangen, of der juichingen."}],"7":[{"catchword":"nachtwaken","tekst":"Van de vier delen des nachts, bij de Joden genoemd nachtwaken; zie Exo 14:24 ; 1Sa 11:11 ; Lam 2:19 ; Mat 14:25 , en Mat 24:43 ; Mar 6:48 , en verg. wijders Psa 1:2 ."}],"8":[{"catchword":"hulp","tekst":"Anders, volkomen hulp. Van zulke bijvoeging dezes woords volkomen, zie Psa 44:27 , en verg. Psa 3:3 ."},{"catchword":"schaduw","tekst":"Dat is, uwe beschutting. Zie Rth 2:12 ."}],"9":[{"catchword":"achteraan;","tekst":"Willende U volgen, niet willende van U scheiden."}],"10":[{"catchword":"ziel","tekst":"Dat is, die naar mijn leven staan [zie Exo 4:19 ; 2Sa 4:8 ] om mij dat te benemen, met zulk een geraas en onstuimigheid, dat het ganse land daarvan gewaagt. Zie Psa 35:8 ."},{"catchword":"de onderste","tekst":"Dat is, zij zullen ter aarde worden nedergeveld, sterven en verderven in de aarde en hel."}],"11":[{"catchword":"zal hen","tekst":"Hebr. zij zullen hem storten; dat is, men zal een ieder van hen storten, enz."},{"catchword":"storten","tekst":"Dat hun bloed, leven en levenskrachten, als water uitgestrot, wegvloeien en verdwijnen. Verg. 2Sa 14:14 ."},{"catchword":"geweld","tekst":"Hebr. de handen. Zie Job 5:20 ."},{"catchword":"vossen","tekst":"Die hun verworpen, dode lichamen zullen opeten. Deze dieren waren bij menigten in die landen. Zie Jdg 15:4 . Verg. wijders Rev 19:21 ."}],"12":[{"catchword":"koning","tekst":"Namelijk, ik David, als mij God naar zijne beloften, tot het koninkrijk zal hebben verheven, dat zij zoeken te beletten; Psa 62:5."},{"catchword":"Hem","tekst":"Te weten, bij God, dat is, die Hem recht eert en dient, zal zich met vreugde gelukkig achten in God en zijn genadewerk, dat Hij aan mij en zijn volk zal hebben bewezen. Alzo Psa 64:11 ."},{"catchword":"leugensprekers","tekst":"Die nu zo stout en onbeschaamd van mij en andere vromen liegen, verdichtende en uitstrooiende al wat zij willen."}]},"kanttekeningen_en":{"1":[{"catchword":"A Psalm of David; as he was in the wilderness of Juda","tekst":"Fled before Saul, see the story, 1 Sam.22.5. and 23.14,15."},{"catchword":"(Psalms 63:2) O God, thou art my God, I seek thee","tekst":"For to call upon thee"},{"catchword":"in the dawning","tekst":"i.e. early, fervently, and zealously, with a singular desire. See Job 7.on verse 21. And Psa 78:34. Pro 1:28. HOs.5.15. Luk 21:38."},{"catchword":"My soul thirsteth after thee:","tekst":"Oth. Is withered, dried, viz. For thirst: some are opinion, that the Hebrew word (onely here extant) doth signify to be hot, hungry after meat, as in the former words was spoken of being thirsty"},{"catchword":"in a land dry","tekst":"as the Deserts are commonly and destitute of water. Exo 17:1. Num 20:1,2. Psa 107:33,35. Jer 2:6."},{"catchword":"and faint","tekst":"or, tired, wearied out; i.e. thirsty: as a land is called or said to be, when it wanteth water, whereupon thirst followeth: Some do take it, as if David spake of himself; that he was like a faint and tired man; (See Pro 25:25.) very dry and thirsty, wanting water, applying his outward lack to the spiritual; as followeth, comp. Psa 143:6. without water:"}],"2":[{"catchword":"A Psalm of David; as he was in the wilderness of Juda","tekst":"Fled before Saul, see the story, 1 Sam.22.5. and 23.14,15."},{"catchword":"(Psalms 63:2) O God, thou art my God, I seek thee","tekst":"For to call upon thee"},{"catchword":"in the dawning","tekst":"i.e. early, fervently, and zealously, with a singular desire. See Job 7.on verse 21. And Psa 78:34. Pro 1:28. HOs.5.15. Luk 21:38."},{"catchword":"My soul thirsteth after thee:","tekst":"Oth. Is withered, dried, viz. For thirst: some are opinion, that the Hebrew word (onely here extant) doth signify to be hot, hungry after meat, as in the former words was spoken of being thirsty"},{"catchword":"in a land dry","tekst":"as the Deserts are commonly and destitute of water. Exo 17:1. Num 20:1,2. Psa 107:33,35. Jer 2:6."},{"catchword":"and faint","tekst":"or, tired, wearied out; i.e. thirsty: as a land is called or said to be, when it wanteth water, whereupon thirst followeth: Some do take it, as if David spake of himself; that he was like a faint and tired man; (See Pro 25:25.) very dry and thirsty, wanting water, applying his outward lack to the spiritual; as followeth, comp. Psa 143:6. without water:"}],"3":[{"catchword":"(3) Indeed I have beheld thee in the Sanctuary","tekst":"In thy pure solemn worship, wherein thou dost reveal these thy attributes or properties, and wherein the Messiahs is variously figured out, and represented unto us. seeing thy strength and thine honour.] oth. Thus; for to see thy strength and thine honour; so as I beheld thee in the sanctuary; the words being a little transposed.]"}],"4":[{"catchword":"(4) For thy kindness is better then the life: My lips should praise thee","tekst":"Namely, when this might happen unto me; or, shall praise thee, and so on in the sequel."}],"5":[{"catchword":"(5) Thus should I praise thee","tekst":"Heb. Bless thee, understand, when thou shalt have been so gracious to me, that I may freely again repair and appear in thine house, as in former times"},{"catchword":"in my life:","tekst":"i.e. during all my life, as Psalm 104.verse 33. And 146.2."},{"catchword":"In thy name should I lift up my hands","tekst":"Hebrew Psalms. See Psalm 28.on v.2."}],"6":[{"catchword":"(6) My soul should be satisified as with grease and fatness:","tekst":"This he opposeth to the spiritual hunger and thirst after the public and solemn worship of God and the assemblies and communion of Saints; whereof v.2,3. See Psa.36.on v.9."},{"catchword":"and my mouth should celebrate with joyful singing lips","tekst":"Heb. Lips of cheerful songs, or, of shoutings."}],"7":[{"catchword":"(7) When I remember thee upon my couches, I meditate of thee in the night-watches","tekst":"Of the four parts of the night, called night-watches by the Jews, See Exo 14:24. 1 Sam.11.11. Lam 2:19. Mat 14:25. and 24.43. Mark 6.48. and compare further, Psa.1.on v.2."}],"8":[{"catchword":"(8) For thou hast been a help to me:","tekst":"oth. A perfect help, of the addition of the word perfect, see Psalm 44.on v.27. and compare Psalm 3.on v.3."},{"catchword":"and in the shadow of thy wings shall I sing cheerfully","tekst":"i.e. under thy protection. See Ruth 2.on v.12."}],"9":[{"catchword":"(9) My soul cleaveth on thee behind:","tekst":"Willing to follow and loth to leave or part from thee thy right hand underprops me."}],"10":[{"catchword":"(10) But those (that) seek my soul to desolation","tekst":"i.e. those that go about to take away my life: (See Exod.4.on v.8.) with such fury and violence, that all the land is in uproar and trouble for it: See Psalm 35.on ver.8."},{"catchword":"shall come in the nethermost places of the earth","tekst":"i.e. They shall be cast down on the ground, die and perish in the earth and hell."}],"11":[{"catchword":"(11) They shall be overthrown","tekst":"Hebr. They shall overthrow him; i.e. Every one of them shall be thrown; that is, destroyed in that manner, that their blood, lives and faculties, shall be power out, fleet and vanish away like water: compare 2 Sam.11.14."},{"catchword":"through the force of the sword:","tekst":"Heb. The hands; see Job 5.on v.20."},{"catchword":"they shall become a portion to the Foxes","tekst":"that shall devour their dead carcases. These beasts did mightily abound in those countries. See Jud.15.on verse 4. Compare further, Rev 19:21."}],"12":[{"catchword":"(12) But the king shall rejoice in God","tekst":"I David namely, when God shall have exalted me once to the kingdom which they do seek to let, Psa 62:5."},{"catchword":"every one that sweareth by him","tekst":"God namely"},{"catchword":"shall glory:","tekst":"i.e. he that truely honoureth and serveth him, shall joyfully count himself happy in God, and his work of grace, that shall have shewed to me and to his people, so also Psa 64:11."},{"catchword":"for the mouth of the lies-tellers","tekst":"i.e. those which now so boldly and impudently bely me and other godly people, inventing abroad, what-ever they list. shall be stopped."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {

// popup positioneren bij een element
function plaatsPopup(el, html) {

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function bijbeluitlegHtml(n) {

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

function renderPaneel(n) {

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');

    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen

        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });

  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();

    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {

      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);

    }

    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
