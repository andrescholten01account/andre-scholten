ederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.","2":"Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft.","3":"En hen die Hij uit de landen verzameld heeft, van het oosten en van het westen, van het noorden en van de zee.","4":"Die in de woestijn dwaalden, op een weg door de wildernis, die geen stad vonden om in te wonen;","5":"Zij waren hongerig, ook dorstig; hun ziel was in hen overstelpt.","6":"Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij heeft hen gered uit hun angsten;","7":"En Hij leidde hen op een rechte weg, om te gaan naar een stad om in te wonen.","8":"Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;","9":"Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;","10":"Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;","11":"Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden.","12":"Daarom heeft Hij hun hart door zwarigheid vernederd; zij zijn gestruikeld, en er was geen helper.","13":"Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.","14":"Hij voerde hen uit de duisternis en de schaduw van de dood, en Hij brak hun banden.","15":"Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;","16":"Want Hij heeft de koperen deuren gebroken, en de ijzeren grendels in stukken gehouwen.","17":"De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;","18":"Hun ziel gruwde van alle voedsel, en zij waren tot aan de poorten van de dood gekomen.","19":"Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.","20":"Hij zond Zijn woord uit, en genas hen, en rukte hen uit hun kuilen.","21":"Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen.","22":"En laat hen lofoffers offeren, en met gejuich Zijn werken vertellen.","23":"Die met schepen ter zee afvaren, handel drijvend op grote wateren;","24":"Die zien de werken van de HEERE, en Zijn wonderwerken in de diepte.","25":"Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.","26":"Zij rijzen op naar de hemel; zij dalen neer tot in de afgronden; hun ziel versmelt van angst.","27":"Zij dansen en waggelen als een dronken man, en al hun wijsheid wordt verslonden.","28":"Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij voerde hen uit hun angsten.","29":"Hij doet de storm stilstaan, zodat hun golven zwijgen.","30":"Dan zijn zij verblijd, omdat zij tot rust gekomen zijn, en omdat Hij hen naar de haven van hun verlangen geleid heeft.","31":"Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;","32":"En Hem verhogen in de gemeente van het volk, en Hem roemen in de vergadering van de oudsten.","33":"Hij maakt van rivieren een woestijn, en van waterbronnen dorstig land.","34":"Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.","35":"Hij maakt van de woestijn een waterpoel, en van het dorre land waterbronnen.","36":"En Hij doet de hongerigen daar wonen, en zij stichten een stad om in te wonen;","37":"En bezaaien akkers, en planten wijngaarden, die vrucht opbrengen.","38":"En Hij zegent hen, zodat zij zeer meer worden, en hun vee vermindert Hij niet.","39":"Daarna verminderen zij, en komen ten onder, door verdrukking, kwaad en droefenis.","40":"Hij stort verachting uit over de prinsen, en doet hen dwalen in het woeste, waar geen weg is.","41":"Maar Hij brengt de nooddruftige uit de verdrukking in een veilig verblijf, en maakt de huisgezinnen als kudden.","42":"De oprechten zien het, en zijn verblijd, maar alle ongerechtigheid stopt haar mond.","43":"Wie is wijs? Laat hij op deze dingen letten; en laat men verstandig letten op de blijken van goedertierenheid van de HEERE."},"SV":{"1":"Looft den HEERE, want Hij is goed; want Zijn goedertierenheid is in der eeuwigheid.","2":"Dat *zulks* de bevrijden des HEEREN zeggen, die Hij van de hand der wederpartijders bevrijd heeft.","3":"En Hij die uit de landen verzameld heeft, van het oosten en van het westen, van het noorden en van de zee.","4":"Die in de woestijn dwaalden, in een weg der wildernis, die geen stad ter woning vonden;","5":"Zij waren hongerig, ook dorstig; hun ziel was in hen overstelpt.","6":"Doch roepende tot den HEERE in de benauwdheid, die zij hadden, heeft Hij hen gered uit hun angsten;","7":"En Hij leidde hen op een rechten weg, om te gaan tot een stad ter woning.","8":"Laat hen voor den HEERE Zijn goedertierenheid loven, en Zijn wonderwerken voor de kinderen der mensen;","9":"Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goed vervuld;","10":"Die in duisternis en de schaduw des doods zaten, gebonden met verdrukking en ijzer;","11":"Omdat zij wederspannig waren geweest tegen Gods geboden, en den raad des Allerhoogsten onwaardiglijk verworpen hadden.","12":"Waarom Hij hun het hart door zwarigheid vernederd heeft; zij zijn gestruikeld, en er was geen helper.","13":"Doch roepende tot den HEERE in de benauwdheid, die zij hadden, verloste Hij hen uit hun angsten.","14":"Hij voerde hen uit de duisternis en de schaduw des doods, en Hij brak hun banden.","15":"Laat hen voor den HEERE Zijn goedertierenheid loven, en Zijn wonderwerken voor de kinderen der mensen;","16":"Want Hij heeft de koperen deuren gebroken, en de ijzeren grendelen in stukken gehouwen.","17":"De zotten worden om den weg hunner overtreding, en om hun ongerechtigheden geplaagd;","18":"Hun ziel gruwelde van alle spijze, en zij waren tot aan de poorten des doods gekomen.","19":"Doch roepende tot den HEERE in de benauwdheid, die zij hadden, verloste Hij hen uit hun angsten.","20":"Hij zond Zijn woord uit, en heelde hen, en rukte hen uit hun kuilen.","21":"Laat hen voor den HEERE Zijn goedertierenheid loven, en Zijn wonderwerken voor de kinderen der mensen.","22":"En dat zij lofofferen offeren, en met gejuich Zijn werken vertellen.","23":"Die met schepen ter zee afvaren, handel doende op grote wateren;","24":"Die zien de werken des HEEREN, en Zijn wonderwerken in de diepte.","25":"Als Hij spreekt, zo doet Hij een stormwind opstaan, die haar golven omhoog verheft.","26":"Zij rijzen op naar den hemel; zij dalen neder tot in de afgronden; hun ziel versmelt van angst.","27":"Zij dansen en waggelen als een dronken man, en al hun wijsheid wordt verslonden.","28":"Doch roepende tot den HEERE in de benauwdheid, die zij hadden, zo voerde Hij hen uit hun angsten.","29":"Hij doet den storm stilstaan, zodat hun golven stilzwijgen.","30":"Dan zijn zij verblijd, omdat zij gestild zijn, en dat Hij hen tot de haven hunner begeerte geleid heeft.","31":"Laat hen voor den HEERE Zijn goedertierenheid loven, en Zijn wonderwerken voor de kinderen der mensen;","32":"En Hem verhogen in de gemeente des volks, en in het gestoelte der oudsten Hem roemen.","33":"Hij stelt de rivieren tot een woestijn, en watertochten tot dorstig *land*.","34":"Het vruchtbaar land tot zouten *grond*, om de boosheid dergenen, die daarin wonen.","35":"Hij stelt de woestijn tot een waterpoel, en het dorre land tot watertochten.","36":"En Hij doet de hongerigen aldaar wonen, en zij stichten een stad ter woning;","37":"En bezaaien akkers, en planten wijngaarden, die inkomende vrucht voortbrengen.","38":"En Hij zegent hen, zodat zij zeer vermenigvuldigen, en hun vee vermindert Hij niet.","39":"Daarna verminderen zij, en komen ten onder, door verdrukking, kwaad en droefenis.","40":"Hij stort verachting uit over de prinsen, en doet hen dwalen in het woeste, waar geen weg is.","41":"Maar Hij brengt den nooddruftige uit de verdrukking in een hoog vertrek, en maakt de huisgezinnen als kudden.","42":"De oprechten zien het, en zijn verblijd, maar alle ongerechtigheid stopt haar mond.","43":"Wie is wijs? Die neme deze *dingen* waar; en dat zij verstandelijk letten op de goedertierenheden des HEEREN."},"KJV":{"1":"O give thanks unto the LORD, for *he is* good: for his mercy *endureth* for ever.","2":"Let the redeemed of the LORD say *so*, whom he hath redeemed from the hand of the enemy;","3":"And gathered them out of the lands, from the east, and from the west, from the north, and from the south.","4":"They wandered in the wilderness in a solitary way; they found no city to dwell","5":"Hungry and thirsty, their soul fainted","6":"Then they cried unto the LORD in their trouble, *and* he delivered them out of their distresses.","7":"And he led them forth by the right way, that they might go to a city of habitation.","8":"Oh that *men* would praise the LORD *for* his goodness, and *for* his wonderful works to the children of men!","9":"For he satisfieth the longing soul, and filleth the hungry soul with goodness.","10":"Such as sit in darkness and in the shadow of death, *being* bound in affliction and iron;","11":"Because they rebelled against the words of God, and contemned the counsel of the most High:","12":"Therefore he brought down their heart with labour; they fell down, and *there was* none to help.","13":"Then they cried unto the LORD in their trouble, *and* he saved them out of their distresses.","14":"He brought them out of darkness and the shadow of death, and brake their bands in sunder.","15":"Oh that *men* would praise the LORD *for* his goodness, and *for* his wonderful works to the children of men!","16":"For he hath broken the gates of brass, and cut the bars of iron in sunder.","17":"Fools because of their transgression, and because of their iniquities, are afflicted.","18":"Their soul abhorreth all manner of meat; and they draw near unto the gates of death.","19":"Then they cry unto the LORD in their trouble, *and* he saveth them out of their distresses.","20":"He sent his word, and healed them, and delivered *them* from their destructions.","21":"Oh that *men* would praise the LORD *for* his goodness, and *for* his wonderful works to the children of men!","22":"And let them sacrifice the sacrifices of thanksgiving, and declare his works with rejoicing.","23":"They that go down to the sea in ships, that do business in great waters;","24":"These see the works of the LORD, and his wonders in the deep.","25":"For he commandeth, and raiseth the stormy wind, which lifteth up the waves","26":"They mount up to the heaven, they go down again to the depths: their soul is melted because of trouble.","27":"They reel to and fro, and stagger like a drunken man, and are at their wits' end.","28":"Then they cry unto the LORD in their trouble, and he bringeth them out of their distresses.","29":"He maketh the storm a calm, so that the waves thereof are still.","30":"Then are they glad because they be quiet; so he bringeth them unto their desired haven.","31":"Oh that *men* would praise the LORD *for* his goodness, and *for* his wonderful works to the children of men!","32":"Let them exalt him also in the congregation of the people, and praise him in the assembly of the elders.","33 an class=\"wl\" data-l=\"L3\" data-code=\"H8055\">zijn</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8055\">verblijd</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H5766\">maar</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H5766\">alle</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H5766\">ongerechtigheid</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7092\">stopt</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7092\">haar</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6310\">mond</span>.","43":"<span class=\"wl\" data-l=\"L1\" data-code=\"H2450\">Wie</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H2450\">is</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H2450\">wijs</span>? Laat hij <span class=\"wl\" data-l=\"L2\" data-code=\"H8104\">op</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8104\">deze</span> dingen letten; <span class=\"wl\" data-l=\"L3\" data-code=\"H995\">en</span> laat men <span class=\"wl\" data-l=\"L3\" data-code=\"H995\">verstandig</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H995\">letten</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H995\">op</span> de blijken <span class=\"wl\" data-l=\"L4\" data-code=\"H2617\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2617\">goedertierenheid</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2617\">van</span> de HEERE."},"koppeling_kjv":{"1":"O give <span class=\"wl wl-kjv\" data-code=\"H3034\">thanks</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> for he is <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> for his <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> endureth for ever.","2":"Let the <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemed</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> so, whom he hath <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemed</span> from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the enemy;","3":"And <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> them out of the <span class=\"wl wl-kjv\" data-code=\"H776\">lands,</span> from the <span class=\"wl wl-kjv\" data-code=\"H4217\">east,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H4628\">west,</span> from the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> and from the south.","4":"They <span class=\"wl wl-kjv\" data-code=\"H8582\">wandered</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> in a <span class=\"wl wl-kjv\" data-code=\"H3452\">solitary</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way;</span> they <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> no <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> to dwell","5":"<span class=\"wl wl-kjv\" data-code=\"H7457\">Hungry</span> and <span class=\"wl wl-kjv\" data-code=\"H6771\">thirsty,</span> their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> fainted","6":"Then they <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in their <span class=\"wl wl-kjv\" data-code=\"H6862\">trouble,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> them out of their distresses.","7":"And he led them <span class=\"wl wl-kjv\" data-code=\"H1869\">forth</span> by the <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> that they might <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to a <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of habitation.","8":"Oh that men would <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for his <span class=\"wl wl-kjv\" data-code=\"H2617\">goodness,</span> and for his wonderful <span class=\"wl wl-kjv\" data-code=\"H6381\">works</span> to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of men!","9":"For he <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfieth</span> the <span class=\"wl wl-kjv\" data-code=\"H8264\">longing</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">filleth</span> the <span class=\"wl wl-kjv\" data-code=\"H7457\">hungry</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> with goodness.","10":"Such as <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> in <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> and in the shadow of <span class=\"wl wl-kjv\" data-code=\"H6757\">death,</span> being <span class=\"wl wl-kjv\" data-code=\"H615\">bound</span> in <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction</span> and iron;","11":"Because they <span class=\"wl wl-kjv\" data-code=\"H4784\">rebelled</span> against the <span class=\"wl wl-kjv\" data-code=\"H561\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H5006\">contemned</span> the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the most High:","12":"Therefore he brought <span class=\"wl wl-kjv\" data-code=\"H3665\">down</span> their <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> with <span class=\"wl wl-kjv\" data-code=\"H5999\">labour;</span> they fell <span class=\"wl wl-kjv\" data-code=\"H3782\">down,</span> and there was none to help.","13":"Then they <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in their <span class=\"wl wl-kjv\" data-code=\"H6862\">trouble,</span> and he <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> them out of their distresses.","14":"He brought them <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> and the shadow of <span class=\"wl wl-kjv\" data-code=\"H6757\">death,</span> and <span class=\"wl wl-kjv\" data-code=\"H5423\">brake</span> their <span class=\"wl wl-kjv\" data-code=\"H4147\">bands</span> in sunder.","15":"Oh that men would <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for his <span class=\"wl wl-kjv\" data-code=\"H2617\">goodness,</span> and for his wonderful <span class=\"wl wl-kjv\" data-code=\"H6381\">works</span> to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of men!","16":"For he hath <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">gates</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass,</span> and <span class=\"wl wl-kjv\" data-code=\"H1438\">cut</span> the <span class=\"wl wl-kjv\" data-code=\"H1280\">bars</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> in sunder.","17":"<span class=\"wl wl-kjv\" data-code=\"H191\">Fools</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">because</span> of their <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression,</span> and because of their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities,</span> are afflicted.","18":"Their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H8581\">abhorreth</span> all manner of <span class=\"wl wl-kjv\" data-code=\"H400\">meat;</span> and they draw <span class=\"wl wl-kjv\" data-code=\"H5060\">near</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of death.","19":"Then they <span class=\"wl wl-kjv\" data-code=\"H2199\">cry</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in their <span class=\"wl wl-kjv\" data-code=\"H6862\">trouble,</span> and he <span class=\"wl wl-kjv\" data-code=\"H3467\">saveth</span> them out of their distresses.","20":"He <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> his <span class=\"wl wl-kjv\" data-code=\"H1697\">word,</span> and <span class=\"wl wl-kjv\" data-code=\"H7495\">healed</span> them, and <span class=\"wl wl-kjv\" data-code=\"H4422\">delivered</span> them from their destructions.","21":"Oh that men would <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for his <span class=\"wl wl-kjv\" data-code=\"H2617\">goodness,</span> and for his wonderful <span class=\"wl wl-kjv\" data-code=\"H6381\">works</span> to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of men!","22":"And let them <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> of <span class=\"wl wl-kjv\" data-code=\"H8426\">thanksgiving,</span> and <span class=\"wl wl-kjv\" data-code=\"H5608\">declare</span> his <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> with rejoicing.","23":"They that go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> in <span class=\"wl wl-kjv\" data-code=\"H591\">ships,</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H4399\">business</span> in <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> waters;","24":"These <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6381\">wonders</span> in the deep.","25":"For he <span class=\"wl wl-kjv\" data-code=\"H559\">commandeth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">raiseth</span> the <span class=\"wl wl-kjv\" data-code=\"H5591\">stormy</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind,</span> which lifteth <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> the waves","26":"They mount <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> they go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> again to the <span class=\"wl wl-kjv\" data-code=\"H8415\">depths:</span> their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> is <span class=\"wl wl-kjv\" data-code=\"H4127\">melted</span> because of trouble.","27":"They reel to and <span class=\"wl wl-kjv\" data-code=\"H2287\">fro,</span> and <span class=\"wl wl-kjv\" data-code=\"H5128\">stagger</span> like a drunken <span class=\"wl wl-kjv\" data-code=\"H7910\">man,</span> and are at their <span class=\"wl wl-kjv\" data-code=\"H2451\">wits'</span> end.","28":"Then they <span class=\"wl wl-kjv\" data-code=\"H6817\">cry</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in their <span class=\"wl wl-kjv\" data-code=\"H6862\">trouble,</span> and he bringeth them <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of their distresses.","29":"He <span class=\"wl wl-kjv\" data-code=\"H6965\">maketh</span> the <span class=\"wl wl-kjv\" data-code=\"H5591\">storm</span> a <span class=\"wl wl-kjv\" data-code=\"H1827\">calm,</span> so that the <span class=\"wl wl-kjv\" data-code=\"H1530\">waves</span> thereof are still.","30":"Then are they <span class=\"wl wl-kjv\" data-code=\"H8055\">glad</span> because they be <span class=\"wl wl-kjv\" data-code=\"H8367\">quiet;</span> so he <span class=\"wl wl-kjv\" data-code=\"H5148\">bringeth</span> them unto their <span class=\"wl wl-kjv\" data-code=\"H2656\">desired</span> haven.","31":"Oh that men would <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for his <span class=\"wl wl-kjv\" data-code=\"H2617\">goodness,</span> and for his wonderful <span class=\"wl wl-kjv\" data-code=\"H6381\">works</span> to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of men!","32":"Let them <span class=\"wl wl-kjv\" data-code=\"H7311\">exalt</span> him also in the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> him in the <span class=\"wl wl-kjv\" data-code=\"H4186\">assembly</span> of the elders.","33":"He <span class=\"wl wl-kjv\" data-code=\"H7760\">turneth</span> <span class=\"wl wl-kjv\" data-code=\"H5104\">rivers</span> into a <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4325\">watersprings</span> into dry ground;","34":"A <span class=\"wl wl-kjv\" data-code=\"H6529\">fruitful</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> into <span class=\"wl wl-kjv\" data-code=\"H4420\">barrenness,</span> for the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of them that dwell","35":"He <span class=\"wl wl-kjv\" data-code=\"H7760\">turneth</span> the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> into a <span class=\"wl wl-kjv\" data-code=\"H98\">standing</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and <span class=\"wl wl-kjv\" data-code=\"H6723\">dry</span> <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> into <span class=\"wl wl-kjv\" data-code=\"H4325\">watersprings.</span>","36":"And there he maketh the <span class=\"wl wl-kjv\" data-code=\"H7457\">hungry</span> to <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> a <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> for habitation;","37":"And <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields,</span> and <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> which may <span class=\"wl wl-kjv\" data-code=\"H6213\">yield</span> <span class=\"wl wl-kjv\" data-code=\"H6529\">fruits</span> of increase.","38":"He <span class=\"wl wl-kjv\" data-code=\"H1288\">blesseth</span> them also, so that they are <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly;</span> and <span class=\"wl wl-kjv\" data-code=\"H4591\">suffereth</span> not their <span class=\"wl wl-kjv\" data-code=\"H929\">cattle</span> to decrease.","39":"Again, they are <span class=\"wl wl-kjv\" data-code=\"H4591\">minished</span> and brought <span class=\"wl wl-kjv\" data-code=\"H7817\">low</span> through <span class=\"wl wl-kjv\" data-code=\"H6115\">oppression,</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">affliction,</span> and sorrow.","40":"He <span class=\"wl wl-kjv\" data-code=\"H8210\">poureth</span> <span class=\"wl wl-kjv\" data-code=\"H937\">contempt</span> upon <span class=\"wl wl-kjv\" data-code=\"H5081\">princes,</span> and causeth them to <span class=\"wl wl-kjv\" data-code=\"H8582\">wander</span> in the <span class=\"wl wl-kjv\" data-code=\"H8414\">wilderness,</span> where there is no way.","41":"Yet setteth he the <span class=\"wl wl-kjv\" data-code=\"H34\">poor</span> on <span class=\"wl wl-kjv\" data-code=\"H7682\">high</span> from <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">maketh</span> him <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> like a flock.","42":"The <span class=\"wl wl-kjv\" data-code=\"H3477\">righteous</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> it, and <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice:</span> and all <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity</span> shall <span class=\"wl wl-kjv\" data-code=\"H7092\">stop</span> her mouth.","43":"Whoso is <span class=\"wl wl-kjv\" data-code=\"H2450\">wise,</span> and will <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> these things, even they shall <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> the <span class=\"wl wl-kjv\" data-code=\"H2617\">lovingkindness</span> of the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"zulks","tekst":"Te weten, dat de Heere goed is, enz. vs.1."},{"catchword":"de bevrijden","tekst":"Of, verlosten; te weten, uit veel gevaren en zwarigheden, gelijk straks volgt."}],"3":[{"catchword":"de zee","tekst":"Te weten, de Rode zee, die ten zuiden van het land Kanaän; Jos 23:4 ."}],"4":[{"catchword":"weg der","tekst":"Hebr. in ene wildernis, of eenzaamheid van den weg; zie van deze woestijn Deu 8:15 ; Jer 2:6 ."},{"catchword":"geen stad","tekst":"Anders: geen bewoonlijke stad. Hebr. gene stad der woning."}],"5":[{"catchword":"overstelpt","tekst":"Te weten, van angst en benauwdheid gelijk Psa 102:1 ."}],"6":[{"catchword":"in de benauwdheid,","tekst":"Anders: in hunne benauwdheid."}],"7":[{"catchword":"tot een stad","tekst":"Hebr. ene stad der woning; gelijk vs.4."}],"8":[{"catchword":"Laat hen","tekst":"Dit vers wordt herhaald onder vs.15."},{"catchword":"voor den HEERE","tekst":"Of, bij den Heere; dat is, zo heimelijk, in hun hart [wetende dat God een kenner der harten en doorgronder der nieren is] als openlijk voor Gods gemeente."},{"catchword":"voor de kinderen","tekst":"Dat is, dat het de mensen horen en zien."}],"9":[{"catchword":"dorstige ziel","tekst":"Hebr. begerige, of begerende; te weten een dronk om den dorst te lessen; gelijk Isa 29:8 . Zie de aantekening bij Job 39:1 ."},{"catchword":"de hongerige ziel","tekst":"Zie Psa 65:5 ; Luk 1:53 . Zie ook de aantekening bij Job 18:12 ."}],"10":[{"catchword":"schaduw des","tekst":"Dat is, dikke duisternis, waarvan men verschrik, of zulke duisternis als onder de aarde is, waar de doden begraven liggen. Zie Psa 23:4 ."},{"catchword":"met verdrukking","tekst":"Dat is, in de ijzers geslagen en zeer bedrukt. Zie Job 36:8-9 ."}],"11":[{"catchword":"geboden en den","tekst":"Hebr. redenen, of zeggen; dat is geboden, bevelen."}],"12":[{"catchword":"Hij hun het hart","tekst":"Te weten, de Heere."}],"13":[{"catchword":"Doch roepende","tekst":"Gelijk vs.6."}],"14":[{"catchword":"uit de duisternis","tekst":"Dat is, uit de benauwdheid en bangheid."}],"15":[{"catchword":"Laat hen","tekst":"Gelijk vs.8."}],"16":[{"catchword":"de koperen","tekst":"Waarmede de gevangenissen gesloten waren; versta hierdoor alle grote hindernissen. Zie Isa 45:2 ."},{"catchword":"gebroken . . . in stukken","tekst":"Te weten, om de ellendige en benauwde mensen te verlossen."}],"17":[{"catchword":"De zotten","tekst":"Dat is, de kwalijk beradene en kwalijk bedachte mensen, of die God niet vrezen, hetwelk de grootste dwaasheid is, gelijk integendeel God vrezen de grootste wijsheid is. Zie Job 5:2 ."}],"18":[{"catchword":"ziel gruwelde","tekst":"Dat is, eetlust; gelijk Job 33:20 ."},{"catchword":"zij waren","tekst":"Dat is, zij zijn in merkelijke gevaar des doods gekomen. Zie Job 33:22 ; Psa 9:14 ."}],"19":[{"catchword":"Doch roepende","tekst":"Zie boven vs.6."}],"20":[{"catchword":"zijn woord","tekst":"Dat is, zijn bevel; te weten opdat zij weder gezond zouden worden."},{"catchword":"heelde hen,","tekst":"Zie Deu 32:39 ; Job 33:19 , Job 33:24 ; Hos 6:1 ; zie een exempel in Hizkia: 2Ki 20:1 , 2Ki 20:4-5 , 2Ki 20:7 ."},{"catchword":"rukte hen","tekst":"Dat is, Hij heeft hen gelijk als uit het graf weder doen opstaan en in de uiterste gevaarlijkheid des doods bewaard. Zie Psa 7:16 ; Job 33:24 , Job 33:28 , Job 33:30 ."},{"catchword":"kuilen","tekst":"Of, verdervingen."}],"21":[{"catchword":"Laat hen","tekst":"Gelijk boven vs.8."}],"23":[{"catchword":"afvaren,","tekst":"Te weten, diepte in de baren der zee. Of van den oever afdalen, afvaren, of nederdalen."},{"catchword":"op grote","tekst":"Anders: op vele wateren."}],"24":[{"catchword":"in de diepte","tekst":"Zie Job 41:22 ."}],"25":[{"catchword":"haar golven","tekst":"Te weten, der zee. Zie de aantekening bij Job 26:12 ."}],"26":[{"catchword":"Zij rijzen op","tekst":"Dit is ene afbeelding der gevaren, in welke de mensen op zee zijn als zich de stormwinden verheffen."},{"catchword":"tot in de","tekst":"Dat is, tot op den bodem der zee. Zie Psa 42:8 ."},{"catchword":"hun ziel","tekst":"Dat is, de moed ontzinkt hun, en zij zijn zo bang alsof zij straks het leven verliezen zouden."},{"catchword":"angst","tekst":"Hebr. van het kwaad."}],"27":[{"catchword":"al hun wijsheid","tekst":"Dat is, zij weten geen raad hoe zij uit die benauwdheid geraken zullen."}],"29":[{"catchword":"Hij doet den","tekst":"Hebr. Hij stelt den strom in stilte; dat is, Hij verandert den storm in kalmte. Zie Job 26:12 ."},{"catchword":"hun golven","tekst":"Hebr. hunlieder golven; te weten, de golven, die zij zozeer vreesden als die hen den dood dreigden. Zie Jon 1:15 ; Mat 8:26 ; Mar 4:37 ."},{"catchword":"stilzwijgen","tekst":"Alzo ook vs.30."}],"30":[{"catchword":"omdat zij","tekst":"Te weten, de wateren."}],"32":[{"catchword":"in het gestoelte","tekst":"Dat is, in het gestoelte waar de oudsten bij elkander zitten."},{"catchword":"der oudsten Hem","tekst":"Dat is, de raadsheren en oversten des volks."}],"33":[{"catchword":"Hij","tekst":"Te weten, de Heere."},{"catchword":"stelt de","tekst":"Dat is, Hij verandert vruchtbare waterige landen in droge onvruchtbare woestijnen."},{"catchword":"watertochten","tekst":"Hebr. uitgangen; dat is, vochtige vruchtdragende landen. De zin van dit vers is dat God door zijn goddelijke kracht, voorzienigheid en regering, dikwijls wonderbaarlijke verandering in de wereld brengt, als Hij een land straffen of zegenen wil, opdat zijne glorie en macht blijke, zo in het straffen als in het zegenen."}],"34":[{"catchword":"Het vruchtbaar","tekst":"Hetgeen hier gezegd wordt, blijkt aan het Joodse land, hetwelk eertijds zeer vruchtbaar geweest is, maar nu is het zeer onvruchtbaar, woest en dor."},{"catchword":"tot zouten","tekst":"Hebr. tot zoutigheid; dat is, tot een zout, onvruchtbaar land. Alzo ook Job 39:9 ; Jer 17:6 ; want zoutigheid veroorzaakt onvruchtbaarheid. Zie Deu 29:23 ; Jdg 9:45 ."}],"35":[{"catchword":"Hij stelt","tekst":"Dat is, het droge onvruchtbare land maakt Hij vochtig en dienvolgens vruchtbaar."},{"catchword":"tot watertochten","tekst":"Hebr. tot uitgangen der wateren, gelijk vs.33."}],"36":[{"catchword":"de hongerigen","tekst":"Zie boven vs.9."},{"catchword":"aldaar wonen,","tekst":"Te weten, in dat land, hetwelk Hij van onvruchtbaar tot vruchtbaar land heeft gemaakt."},{"catchword":"een stad ter","tekst":"Hebr. ene stad der woning."}],"37":[{"catchword":"die inkomende","tekst":"Hebr. die vrucht der inkomsten maken; dat is, vruchten jaarlijks inkomende. Of zij, te weten, de landbouwers, geven vruchtbare opkomsten."}],"38":[{"catchword":"vermindert","tekst":"Versta hierbij, maar Hij vermeerdert het."}],"39":[{"catchword":"komen ten onder","tekst":"Hebr. worden nedergebogen, of nedergekromd; te weten, wanneer God, omdat zij zich wederom enig verloop geeft in het land, waar zij hunne woning hadden."},{"catchword":"kwaad en","tekst":"Dat is, ongeluk, allerlei ellende."}],"40":[{"catchword":"Hij","tekst":"Te weten, de Heere. Zie Job 12:21 , Job 12:24 ."},{"catchword":"stort verachting","tekst":"Te weten, als Hij hen straffen wil."},{"catchword":"over de prinsen","tekst":"Dat is, over of op de voornaamste en meest uitstekende personen des lands."}],"41":[{"catchword":"in een hoog","tekst":"Dat is, op een hoge plaats, wwar hij buiten gevaar is van vertreden of overrompeld te worden."},{"catchword":"maakt de","tekst":"Dat is, Hij maakt hen sterk van geslachten, of Hij vermeerdert hen."}],"42":[{"catchword":"alle ongerechtigheid","tekst":"Dat is, alle ongerechtigen, gelijk Job 24:20 ; alzo staat er hovaardij voor hovaardige mensen, Psa 36:12 ; boosheid voor boze. De profeet wil zeggen: De bozen en goddelozen zulks ziende, worden gedwongen den mond toe te houden, dien zij tegen God geopend hadden, voortaan de voorzienigheid Gods niet durvende tegenspreken. Zie Job 5:16 ."}],"43":[{"catchword":"Wie is wijs?","tekst":"Of, wie is wijs en neemt deze dingen waar? alsof hij zeide: Och hoe weinige zulke wijzen vindt men? Alzo ook Jer 9:12 ; Hos 14:10 ."},{"catchword":"dat zij verstandiglijk","tekst":"Of, zo zal men verstaan de goedertierenheid des Heeren."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Praise the LORD, for he is good, for his kindness is into Eternity."}],"2":[{"catchword":null,"tekst":"Let the redeemed [Or, delivered, viz. Out of various perils and troubles, as followeth] of the LORD, say (thus,) [viz. That the LORD is good, etc. V.1.] whom he hath redeemed from the hand of the adversaries."}],"3":[{"catchword":null,"tekst":"And whom he hath gathered out of the Countries, from the East, and from the West, from the North, and from the sea; [viz. From the red sea, which lieth South from the land of Canaan. Otherwise, this expression usually signifieth the West, viz. Toward the Mediterranean, or Midland Sea, lying westward from the Land of Canaan, Jos.23.4.]"}],"4":[{"catchword":null,"tekst":"Which wandered in the Desert, in away of the wilderness, [Heb. In wilderness, or solitude of the way. Of this wilderness, see Deut.8.15. Jer 22:6.] which found no City, for habitation; [Otherwise, no inhabitable City. Heb. No city of habitation.]"}],"5":[{"catchword":null,"tekst":"They were hungry and thirty, their soul was overwhelmed within them. [viz. For the anxious fear, distress and straights they were in, Psa 102:1.]"}],"6":[{"catchword":null,"tekst":"Yet a crying to the LORD in the straight which they had, [Others, in their straight] he rescued them out of their anxieties."}],"7":[{"catchword":null,"tekst":"And he guided them upon a right way: for to go to a city for habitation [Hebr. Of habitation, as above, verse 4.]"}],"8":[{"catchword":null,"tekst":"Let them [This verse is repeated again below v.15.and 31.] praise before the LORD his kindness, [or by, with the LORD, that is, as well privately in the hearts, (knowing that God is one that knoweth and searcheth hearts and reins) as publicly before Gods Congregation] and his marvellous works before the children of men. [i.e. So that men my hear and see it.]"}],"9":[{"catchword":null,"tekst":"For that he did satisfay the thirsty soul, [Hebr. The desiring (or desirous soul: desirous, viz. Of drink to quench the thirst, as Jer 29:8. See the Annot. Job 39:1.] and filled the hungry soul with good. [See Psa 65:5. Luk 1:53. see likewise the Annot. Job 18.on v.12.]"}],"10":[{"catchword":null,"tekst":"Those which sate in the darkness and shadow of death, [i.e. in very thick darkness which is full of horror and affrightment, or such darkness as is under ground where the dead lie buried. See Psa 23:4.] bound with oppression and iron: [i.e. fettered or manacled with iron, and grievously oppressed. See Job 36:8.6.]"}],"11":[{"catchword":null,"tekst":"For that they were rebellious against Gods Commandments] and had unworthily rejected the counsel of the most high."}],"12":[{"catchword":null,"tekst":"Wherefore he, [The Lord namely] had humbled them the heart with heaviness: they stumbled, and there was no helper."}],"13":[{"catchword":null,"tekst":"Yet [As above v.6.] crying to the LORD in the straight which they had: he delivered them out of their anxieties."}],"14":[{"catchword":null,"tekst":"He led them forth out of the darkness and shadow of death: [i.e. out of their distress and anxious condition] and he brake their bonds."}],"15":[{"catchword":null,"tekst":"Let them [As above v.8.] praise before the LORD his kindness, and his marvellous works before their children of men."}],"16":[{"catchword":null,"tekst":"For that he broke the copper doors: [Whereby they were shut up in their imprisonments. See Isai.45.2. and those doors he is said to break, by delivering those that are in straight and misery] and cut in pieces the iron bars. [in the same sence, or, to the same purpose.]"}],"17":[{"catchword":null,"tekst":"The sorts [i.e. the ill-advised or ill-conceited: or those which do not fear God, then which there is no greater folly, as on the contrary, the greatest wisdom is to fear God. See Job 5.on v.2.] are plagued for the way of their transgression, and for their iniquities."}],"18":[{"catchword":null,"tekst":"Their soul loanched all food: [By the soul understand the appetite or stomach here, as Job 33:20.] and they were come unto the gates of death. [i.e. they were in apparent danger of death. See Job 33:22. Psa 9:14.]"}],"19":[{"catchword":null,"tekst":"Yet crying to the LORD in the straights which they had: he saved them out of their anxieties. [See above verse 6.]"}],"20":[{"catchword":null,"tekst":"He sent forth his word [i.e. his command, that they should be restored to health again, or recover] and healed them, [See Deut.32.39. Job 39:19.24. Hos 6:1. See an example in Hizkia, 2 King.20.1,4 5,7.] and pluck them forth out of their holes. [or, corruptions, that is to say, He did in a manner raise them from the dead again; and preserved them in danger or peril of death. See Psa 7:16. Job 33:24,28,30.]"}],"21":[{"catchword":null,"tekst":"Let them praise before the LORD his kindness, and his marvellous works before the children of men. [As above, v.8.]"}],"22":[{"catchword":null,"tekst":"And offer praise-offerings, and relate his works with shouting."}],"23":[{"catchword":null,"tekst":"Those which descend to Sea in ships, [viz. Deep into the waves of the Sea; or which descend from the shore, go down, go off] negotiating (or trafficking, trading) upon great waters. (or upon many waters.)"}],"24":[{"catchword":null,"tekst":"They see the works of the LORD, and his marvellous works in the deep. [See Job 41:22]."}],"25":[{"catchword":null,"tekst":"When he speaketh, he maketh a storm-wind to arise which raiseth the waves thereof, [viz. Of the sea. See Job 26, the annot.on v.12.]"}],"26":[{"catchword":null,"tekst":"They mount up towards heaven, [This and the next verse containeth a description of the dangers, and jeopardies which men are in at Sea, when stormy winds and temptest arise] they go down into the abysses; [i.e. to the bottom of the Sea; Sea Psalm 42.on v.8.] their soul doth melt [i.e. their heart, or courage faileth them, and they are as much dismayed and afraid, as if they were to die instantly, or every moment] for anxiety. [Heb. From or, of evil.]"}],"27":[{"catchword":null,"tekst":"They dance and stagger like a drunken man, and all their wisdom is swallowed up. [i.e. they know not how to steer, what course or counsel to take, to get out of their straights.]"}],"28":[{"catchword":null,"tekst":"Yet crying to the LORD in the straight which they had; he led them forth out of their anxieties.]"}],"29":[{"catchword":null,"tekst":"He maketh the storm to stand still, [Heb. He putteth the storm in quiet (or) silence: that is, he changeth the storm into a calm. See Job 26.on v.12.] so that their waves [i.e. the waves which they, the Seafaring people, were so much afraid of fearing to perish or to drowned by them. See Jon.1.15. Mat 8:26. Mark 4.37.] be silent, [or, hold their peace.]"}],"30":[{"catchword":null,"tekst":"Then they are glad, because they are silenced [Or, quieted; the water or waves namely] and that he hath led (conducted) them to the haven of their desire."}],"31":[{"catchword":null,"tekst":"Let them praise befor the LORD his kindness, and his marvellous works before the children of men."}],"32":[{"catchword":null,"tekst":"And exalt him in the congregation of the people and celebrate him in the sitting (or session) of the Eldest, [i.e. in the places, or courts where the ancient, that is, the Senators, Governors ad Magistrates of the people are assembled.]"}],"33":[{"catchword":null,"tekst":"He [The LORD, namely] putteth the rivers to a Desert; [that is, he changeth or turneth fruitful water Countries into dry and barren Deserts] and issues of waters into a thirty (land). [by issues of water, he understandeth moist and fertile soils. The meaning of this verse is, that God by his Divine Power, Providence and Government doth often bring wonderful changes about in the world, when he doth purpose to punish or bless a land or Country, to the end that his glory and power may appear as well in punishing, as in blessing.]"}],"34":[{"catchword":null,"tekst":"The fruitful land into a salt (ground) [Hebr. To saltness; i.e. to barrenness or unfruitfulness. So likewise Job 39:6. Jer 17:6. For saltness causeth barrenness: See Deut.29.33. Jud 9:45. and that which is here, doth evidently appear in jury land, which of old times was a fruitful land indeed, but is very barren, dry and bare now] for the malice sake of them that dwell therein."}],"35":[{"catchword":null,"tekst":"He putteth the desert to a water-pool; [i.e. the dry and barren ground he maketh moist, and thereby fruitful] and the dry Land to issues of water; [as above verse 33.]"}],"36":[{"catchword":null,"tekst":"And he maketh the hungry, [See above v.9.] to dwell there, [namely, in that land, which from a barren one, he turned into a fruitful land] and they rear up a City for habitation: [Heb. A city of habitation.]"}],"37":[{"catchword":null,"tekst":"And sow grounds, and plant vineyards, which bring forth incoming fruit of income, or revenue; that is, fruit yearly coming in. Or they viz. The husbandmen give or yield fruitful revenues.]"}],"38":[{"catchword":null,"tekst":"And he blesseth them, so that they multiply much, and their cattle doth not diminish. [Understand withal, but it doth much increase in number.]"}],"39":[{"catchword":null,"tekst":"Afterward, they do diminish, and are brought untheir sinning again against him, God brings an alteration again in the land, wherein they inhabited] through oppression, evil, [mischief, all manner of misery,] and sorrow."}],"40":[{"catchword":null,"tekst":"He poureth out, [The LORD namely. See Job 12:21.24.] over the Princes, [or over the chiefest and most eminent persons of the land, namely, when they provoke him to punish them] and maketh them to wander in wastness (desolation) where there is no way."}],"41":[{"catchword":null,"tekst":"But he bringeth the needy out of oppression into an high retrait [i.e. into a high place where he is out of danger to be trod upon, or surprised] and maketh the families as flocks. [i.e. he blesseth them to become many generations, or he doth multiply them.]"}],"42":[{"catchword":null,"tekst":"The upright see it, and rejoice; but all unrighteousness stoppeth her mouth, [i.e. all unrighteous or wicked ones, as Job 24:20. So pride is put for proud persons, Psa 36:12. and malice for malicious. The meaning here is, that the wicked seeing this, they are put to silence thereby, not daring to open their mouths any more against the providence of God, as they were wont to do formerly. See Job 5:16.]"}],"43":[{"catchword":null,"tekst":"Who is wise? Let him observe these (things): [Or, who is wise, and doth observe, etc. As if he said, Alasse, how few are there that are so wise. So Jer 9:12. Hosea.14.10.] and let them understandingly mark the kindnesses of the LORD, [or, so shall (men) understand the kindnesses of the LORD.]"}]}}};

(function bouwHfdnav() {

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
