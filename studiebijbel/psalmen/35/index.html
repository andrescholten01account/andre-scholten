"Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm van David. Twist, HEERE, met wie tegen mij twisten; strijd tegen wie tegen mij strijden.","2":"Grijp het schild en de rondas, en sta op tot mijn hulp.","3":"En breng de spies naar voren, en sluit de weg toe voor mijn vervolgers; zeg tegen mijn ziel: Ik ben uw Heil.","4":"Laat hen beschaamd worden en te schande, die mijn ziel zoeken; laat hen achterwaarts gedreven worden en schaamrood, die kwaad tegen mij bedenken.","5":"Laat hen worden als kaf voor de wind, en de Engel van de HEERE drijft hen weg.","6":"Hun weg zij duister en helemaal glibberig; en de Engel van de HEERE vervolgt hen.","7":"Want zij hebben zonder oorzaak de groeve van hun net voor mij verborgen; zij hebben zonder oorzaak gegraven voor mijn ziel.","8":"De verwoesting overkomt hem, zodat hij het niet weet, en zijn net, dat hij verborgen heeft, vangt hemzelf; hij valt daarin met verwoesting.","9":"Zo zal mijn ziel zich verheugen in de HEERE; zij zal vrolijk zijn in Zijn heil.","10":"Al mijn beenderen zullen zeggen: HEERE, wie is U gelijk! U, Die de ellendige redt van hem die sterker is dan hij, en de ellendige en de nooddruftige van zijn berover.","11":"Wrevelige getuigen staan op; wat ik niet weet, eisen zij van mij.","12":"Zij vergelden mij kwaad voor goed, de beroving van mijn ziel.","13":"Mij aangaande daarentegen, toen zij ziek waren, was een zak mijn kleed; ik kwelde mijn ziel met vasten, en mijn gebed keerde weer in mijn boezem.","14":"Ik ging steeds als een vriend, als was hij mij een broeder geweest; ik ging gebukt in het zwart, als iemand die over zijn moeder treurt.","15":"Maar toen ik hinkte, waren zij verblijd, en verzamelden zich; zij verzamelden zich tegen mij als geslagenen, en ik merkte niets; zij scheurden hun kleren, en zwegen niet stil.","16":"Onder spotachtige tafelbroeders die huichelden, knerste men over mij met de tanden.","17":"Heere! Hoe lang zult U toezien? Breng mijn ziel weer van hun verwoestingen, mijn eenzame van de jonge leeuwen.","18":"Zo zal ik U loven in de grote gemeente; onder machtig veel volk zal ik U prijzen.","19":"Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.","20":"Want zij spreken niet van vrede, maar zij bedenken bedrieglijke zaken tegen de stillen in het land.","21":"En zij sperren hun mond wijd open tegen mij; zij zeggen: Ha, ha, ons oog heeft het gezien!","22":"HEERE! U hebt het gezien, zwijg niet; Heere! Wees niet ver van mij.","23":"Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.","24":"Doe mij recht naar Uw gerechtigheid, HEERE, mijn God! En laat hen zich over mij niet verblijden.","25":"Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!","26":"Laat hen beschaamd worden en samen schaamrood, die zich in mijn kwaad verblijden; laat hen met schaamte en schande bekleed worden, die zich tegen mij groot maken.","27":"Laat hen vrolijk zingen en verblijd zijn, die lust hebben tot mijn gerechtigheid; en laat hen voortdurend zeggen: Groot gemaakt zij de HEERE, Die lust heeft tot de vrede van Zijn knecht!","28":"Zo zal mijn tong Uw gerechtigheid vermelden, en Uw lof de hele dag."},"SV":{"1":"*Een* *psalm* van David. Twist, HEERE! met mijn twisters; strijd met mijn bestrijders.","2":"Grijp het schild en de rondas, en sta op tot mijn hulp.","3":"En breng de spies voort, en sluit *den* *weg* toe, mijn vervolgers tegemoet; zeg tot mijn ziel: Ik ben uw Heil.","4":"Laat hen beschaamd en te schande worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en schaamrood worden, die kwaad tegen mij bedenken.","5":"Laat hen worden als kaf voor den wind, en de Engel des HEEREN drijve hen weg.","6":"Hun weg zij duister en gans slibberig; en de Engel des HEEREN vervolge hen.","7":"Want zij hebben zonder oorzaak de groeve van hun net voor mij verborgen; zij hebben zonder oorzaak gegraven voor mijn ziel.","8":"De verwoesting overkome hem, dat hij het niet wete, en zijn net, dat hij verborgen heeft, vange hemzelven; hij valle daarin met verwoesting.","9":"Zo zal mijn ziel zich verheugen in den HEERE; zij zal vrolijk zijn in Zijn heil.","10":"Al mijn beenderen zullen zeggen: HEERE, wie is U gelijk! U, Die den ellendige redt van dien, die sterker is dan hij, en den ellendige en nooddruftige van zijn berover.","11":"Wrevelige getuigen staan er op; hetgeen ik niet weet, eisen zij van mij.","12":"Zij vergelden mij kwaad voor goed, de beroving mijner ziel.","13":"Mij aangaande daarentegen, als zij krank waren, was een zak mijn kleed; ik kwelde mijn ziel met vasten, en mijn gebed keerde weder in mijn boezem.","14":"Ik ging steeds, alsof het een vriend, alsof het mij een broeder geweest ware; ik ging gebukt in het zwart, als een, die over *zijn* moeder treurt.","15":"Maar als ik hinkte, waren zij verblijd, en verzamelden zich; zij verzamelden zich tot mij *als* geslagenen, en ik merkte niets; zij scheurden *hun* *klederen*, en zwegen niet stil.","16":"Onder de huichelende spotachtige tafelbroeders knersten zij over mij met hun tanden.","17":"Heere! hoe lang zult Gij toezien? Breng mijn ziel weder van hunlieder verwoestingen, mijn eenzame van de jonge leeuwen.","18":"Zo zal ik U loven in de grote gemeente; onder machtig veel volks zal ik U prijzen.","19":"Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijanden zijn; *noch* wenken met de ogen, die mij zonder oorzaak haten.","20":"Want zij spreken niet van vrede, maar zij bedenken bedriegelijke zaken tegen de stillen in het land.","21":"En zij sperren hun mond wijd op tegen mij; zij zeggen: Ha, ha, ons oog heeft het gezien!","22":"HEERE! Gij hebt het gezien, zwijg niet; Heere! wees niet verre van mij.","23":"Ontwaak en word wakker tot mijn recht; mijn God en Heere! tot mijn twistzaak.","24":"Doe mij recht naar Uw gerechtigheid, HEERE, mijn God! en laat hen zich over mij niet verblijden.","25":"Laat hen niet zeggen in hun hart: Heah, onze ziel! laat hen niet zeggen: Wij hebben hem verslonden!","26":"Laat hen beschaamd en te zamen schaamrood worden, die zich in mijn kwaad verblijden; laat hen met schaamte en schande bekleed worden, die zich tegen mij groot maken.","27":"Laat hen vrolijk zingen en verblijd zijn, die lust hebben tot mijn gerechtigheid; en laat hen geduriglijk zeggen: Groot gemaakt zij de HEERE, Die lust heeft tot den vrede Zijns knechts!","28":"Zo zal mijn tong vermelden Uw gerechtigheid, *en* Uw lof den gansen dag."},"KJV":{"1":"[[*A Psalm* of David.]] Plead *my cause*, O LORD, with them that strive with me: fight against them that fight","2":"Take hold of shield and buckler, and stand up for mine help.","3":"Draw out also the spear, and stop *the way* against them that persecute me: say unto my soul, I *am* thy salvation.","4":"Let them be confounded and put to shame that seek after my soul: let them be turned back and brought to confusion that devise my hurt.","5":"Let them be as chaff before the wind: and let the angel of the LORD chase","6":"Let their way be dark and slippery: and let the angel of the LORD persecute","7":"For without cause have they hid for me their net *in* a pit, *which* without cause they have digged for my soul.","8":"Let destruction come upon him at unawares; and let his net that he hath hid catch himself: into that very destruction let him fall.","9":"And my soul shall be joyful in the LORD: it shall rejoice in his salvation.","10":"All my bones shall say, LORD, who *is* like unto thee, which deliverest the poor from him that is too strong for him, yea, the poor and the needy from him that spoileth","11":"False witnesses did rise up; they laid to my charge *things* that I knew","12":"They rewarded me evil for good *to* the spoiling of my soul.","13":"But as for me, when they were sick, my clothing *was* sackcloth: I humbled my soul with fasting; and my prayer returned into mine own bosom.","14":"I behaved myself as though *he had been* my friend *or* brother: I bowed down heavily, as one that mourneth *for his* mother.","15":"But in mine adversity they rejoiced, and gathered themselves together: *yea*, the abjects gathered themselves together against me, and I knew *it* not; they did tear *me*, and ceased","16":"With hypocritical mockers in feasts, they gnashed upon me with their teeth.","17":"Lord, how long wilt thou look on? rescue my soul from their destructions, my darling from the lions.","18":"I will give thee thanks in the great congregation: I will praise thee among much people.","19":"Let not them that are mine enemies wrongfully rejoice over me: *neither* let them wink with the eye that hate me without a cause.","20":"For they speak not peace: but they devise deceitful matters against *them that are* quiet in the land.","21":"Yea, they opened their mouth wide against me, *and* said, Aha, aha, our eye hath seen","22":"*This* thou hast seen, O LORD: keep not silence: O Lord, be not far","23":"Stir up thyself, and awake to my judgment, *even* unto my cause, my God and my Lord.","24":"Judge me, O LORD my God, according to thy righteousness; and let them not rejoice","25":"Let them not say in their hearts, Ah, so would we have it: let them not say, We have swallowed hi h <span class=\"wl wl-kjv\" data-code=\"H5337\">deliverest</span> the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> from him that is too <span class=\"wl wl-kjv\" data-code=\"H2389\">strong</span> for him, yea, the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> and the <span class=\"wl wl-kjv\" data-code=\"H34\">needy</span> from him that spoileth","11":"<span class=\"wl wl-kjv\" data-code=\"H2555\">False</span> <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses</span> did rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up;</span> they laid to my <span class=\"wl wl-kjv\" data-code=\"H7592\">charge</span> things that I knew","12":"They <span class=\"wl wl-kjv\" data-code=\"H7999\">rewarded</span> me <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> for <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> to the <span class=\"wl wl-kjv\" data-code=\"H7908\">spoiling</span> of my soul.","13":"But as for me, when they were <span class=\"wl wl-kjv\" data-code=\"H2470\">sick,</span> my <span class=\"wl wl-kjv\" data-code=\"H3830\">clothing</span> was <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth:</span> I <span class=\"wl wl-kjv\" data-code=\"H6031\">humbled</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> with <span class=\"wl wl-kjv\" data-code=\"H6685\">fasting;</span> and my <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> into mine own bosom.","14":"I <span class=\"wl wl-kjv\" data-code=\"H1980\">behaved</span> myself as though he had been my <span class=\"wl wl-kjv\" data-code=\"H7453\">friend</span> or <span class=\"wl wl-kjv\" data-code=\"H251\">brother:</span> I bowed <span class=\"wl wl-kjv\" data-code=\"H7817\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6937\">heavily,</span> as one that <span class=\"wl wl-kjv\" data-code=\"H57\">mourneth</span> for his mother.","15":"But in mine <span class=\"wl wl-kjv\" data-code=\"H6761\">adversity</span> they <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced,</span> and gathered themselves <span class=\"wl wl-kjv\" data-code=\"H622\">together:</span> yea, the <span class=\"wl wl-kjv\" data-code=\"H5222\">abjects</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> against me, and I <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> it not; they did <span class=\"wl wl-kjv\" data-code=\"H7167\">tear</span> me, and ceased","16":"With <span class=\"wl wl-kjv\" data-code=\"H2611\">hypocritical</span> <span class=\"wl wl-kjv\" data-code=\"H3934\">mockers</span> in <span class=\"wl wl-kjv\" data-code=\"H4580\">feasts,</span> they <span class=\"wl wl-kjv\" data-code=\"H2786\">gnashed</span> upon me with their teeth.","17":"<span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> how long wilt thou look <span class=\"wl wl-kjv\" data-code=\"H7200\">on?</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">rescue</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> from their <span class=\"wl wl-kjv\" data-code=\"H7722\">destructions,</span> my <span class=\"wl wl-kjv\" data-code=\"H3173\">darling</span> from the lions.","18":"I will give thee <span class=\"wl wl-kjv\" data-code=\"H3034\">thanks</span> in the <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation:</span> I will <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> thee among <span class=\"wl wl-kjv\" data-code=\"H6099\">much</span> people.","19":"Let not them that are mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">wrongfully</span> <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> over me: neither let them <span class=\"wl wl-kjv\" data-code=\"H7169\">wink</span> with the <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> that <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> me without a cause.","20":"For they <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> not <span class=\"wl wl-kjv\" data-code=\"H7965\">peace:</span> but they <span class=\"wl wl-kjv\" data-code=\"H2803\">devise</span> <span class=\"wl wl-kjv\" data-code=\"H4820\">deceitful</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">matters</span> against them that are <span class=\"wl wl-kjv\" data-code=\"H7282\">quiet</span> in the land.","21":"Yea, they opened their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> <span class=\"wl wl-kjv\" data-code=\"H7337\">wide</span> against me, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1889\">Aha,</span> <span class=\"wl wl-kjv\" data-code=\"H1889\">aha,</span> our <span class=\"wl wl-kjv\" data-code=\"H5869\">eye</span> hath seen","22":"This thou hast <span class=\"wl wl-kjv\" data-code=\"H7200\">seen,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> keep not <span class=\"wl wl-kjv\" data-code=\"H2790\">silence:</span> O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> be not far","23":"Stir <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> thyself, and <span class=\"wl wl-kjv\" data-code=\"H6974\">awake</span> to my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> even unto my <span class=\"wl wl-kjv\" data-code=\"H7379\">cause,</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> and my Lord.","24":"<span class=\"wl wl-kjv\" data-code=\"H8199\">Judge</span> me, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> according to thy <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness;</span> and let them not rejoice","25":"Let them not <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> in their <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts,</span> <span class=\"wl wl-kjv\" data-code=\"H1889\">Ah,</span> so would we have <span class=\"wl wl-kjv\" data-code=\"H5315\">it:</span> let them not <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> We have swallowed him up.","26":"Let them be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> and brought to <span class=\"wl wl-kjv\" data-code=\"H2659\">confusion</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> that <span class=\"wl wl-kjv\" data-code=\"H8056\">rejoice</span> at mine <span class=\"wl wl-kjv\" data-code=\"H7451\">hurt:</span> let them be <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> with <span class=\"wl wl-kjv\" data-code=\"H1322\">shame</span> and <span class=\"wl wl-kjv\" data-code=\"H3639\">dishonour</span> that magnify","27":"Let them shout for <span class=\"wl wl-kjv\" data-code=\"H7442\">joy,</span> and be <span class=\"wl wl-kjv\" data-code=\"H8055\">glad,</span> that <span class=\"wl wl-kjv\" data-code=\"H2655\">favour</span> my righteous <span class=\"wl wl-kjv\" data-code=\"H6664\">cause:</span> yea, let them <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually,</span> Let the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be <span class=\"wl wl-kjv\" data-code=\"H1431\">magnified,</span> which hath <span class=\"wl wl-kjv\" data-code=\"H2655\">pleasure</span> in the <span class=\"wl wl-kjv\" data-code=\"H7965\">prosperity</span> of his servant.","28":"And my <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> shall <span class=\"wl wl-kjv\" data-code=\"H1897\">speak</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> all the day"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Twist,","tekst":"Of, pleit, recht, dat is, neem Gij mijne zaak op U, en voer mijn recht uit tegen mijne wederpartijders, betonende metterdaad dat het niet mijne, maar uw eigen zaak is; zie onder Psa 43:1 , en Psa 74:22 , en Psa 119:154 ; Isa 49:24 ; Jer 50:34 , en Jer 51:36 , enz."}],"3":[{"catchword":"breng","tekst":"Of, vel, trek uit, breng uit."},{"catchword":"sluit","tekst":"Hebr. Segor. Hetwelk sommigen menen te wezen de naam van een krijgswapen."},{"catchword":"Mijn vervolgers","tekst":"Dat is, kom mijnen vervolgers voor, ga hen tegemoet en sluit hun den pas."},{"catchword":"zeg","tekst":"Betuig dit door uw Heiligen Geest in mij. Verg. Rom 8:16 ."},{"catchword":"heil","tekst":"Of, verlossing, behoudenis; dat is, uw verlosser, behouder."}],"4":[{"catchword":"ziel","tekst":"Dat is, naar mijn leven staan. Zie 2Sa 4:8 ."},{"catchword":"die","tekst":"Hebr. die mijn kwaad [dat is ellende, verdrukking, ondergang] denken, voorhebben."}],"6":[{"catchword":"duister","tekst":"Hebr. duisternis en slibberigheden; dat zij niet kunnen voortkomen om mij te achterhalen. Verg. Jer 23:12 ."}],"7":[{"catchword":"zonder oorzaak de","tekst":"Hebr. tevergeefs, om niet; dat is, zonder reden. Alzo in het volgende, en onder vs.19, en elders. Zie Job 2:3 ."},{"catchword":"hun net","tekst":"Dat is, waarin zij hun net gelegd hebben; ene gelijkenis van vogelvangers en jagers genomen. De zin is, zij hebben mijn leven lagen gelegd, boze en listige aanslagen tegen mij uitgedacht, die dikwijls bij netten worden vergeleken. Zie boven, Psa 9:16 , en Psa 10:9 , en Psa 25:15 , en Psa 31:5 , en Psa 141:10 , enz."},{"catchword":"gegraven","tekst":"Te weten, een kuil, uit Psa 7:16 ."}],"8":[{"catchword":"verwoesting","tekst":"Het Hebr. woord betekent ene verwoesting, die met geraas, gedruis, rumoer en grote onstuimigheid overkomt."},{"catchword":"hem","tekst":"Mijnen vervolger."},{"catchword":"dat hij","tekst":"Dat is onvoorziens, waar hij het gans niet meent of verwacht."},{"catchword":"met","tekst":"Dat is alzo, dat hij voorts verwoest en vernield worde. Anders, als er verwoesting is, hij valle daarin."}],"10":[{"catchword":"Al","tekst":"Dat is, ik zal uit al mijne binnenste kracht, of met al het vermogen mijns lichaams, U roemen. Verg. Psa 51:10 ."}],"11":[{"catchword":"Wrevelige","tekst":"Hebr. getuigen des wrevels; of des gewelds; dat is, die mij met valsheid pogen te verdrukken en met geweld doen overvallen."},{"catchword":"ik niet","tekst":"Dat is, zij leggen mij ten laste, des ik mij niet bewust ben."}],"12":[{"catchword":"de","tekst":"Dat is, zij zoeken mij van mijn leven te beroven."}],"13":[{"catchword":"zak","tekst":"Dat is, ik droeg rouw over hen. Zie Gen 37:34 ."},{"catchword":"keerde","tekst":"Dat is, ik herhaalde dikwijls in stilte en bij mijzelven mijn gebed voor hen. Hij wil zeggen dat hij het oprecht en wel met hen gemeend heeft. Anders, mijn gebed kere weder in mijnen boezem, of schoot; dat is, mij wedervare zulks, gelijk ik voor hen gebeden heb."}],"14":[{"catchword":"ging","tekst":"Dat is, ik hield en gedroeg mij niet anders dan of zij van mijn naaste bloedvrienden geweest waren. Anders, ik ging steeds [tot hen] als [tot] enz. Dat is, ik bezocht hen dagelijks."},{"catchword":"in het","tekst":"Dat is, in het zwart gekleed, gelijk de rouwdragenden gewoon zijn te doen. Alzo Psa 38:7 , en Psa 42:10 , en Psa 43:2 . Zie ook Job 5:11 ."}],"15":[{"catchword":"hinkte,","tekst":"Dat is als mijne zaken kwalijk gingen, dat het scheen alsof ik zou moeten struikelen en vallen. Alzo Psa 38:18 ; Jer 20:10 . Verg. Job 12:5 ."},{"catchword":"als geslagene","tekst":"Te weten, aan de voeten; gelijk enigen dit nemen. Dat is, zich houdende alsof zij lam waren en van rouw over mijn ongeluk hinkten. Zie 2Sa 4:4 , en 2Sa 9:3 , alwaar deze woorden alzo bij het woord geslagen gevonden worden, van Mefiboseth; of versta, geslagene, dat is, verslagen zijnde [van geest,] uit Isa 66:2 , blijvende de zin gelijk, of, als [mede] geslagene. Want zij wilden met hun lichamelijke gebaren [als hinken en klederen te scheuren ] te kennen geven dat zij bemoeid en bekommerd waren over Davids lijden, doch valselijk en als huichelaars. Anders worden deze woorden aldus overgezet: fielten, of boeven, [die voor zulken bekend waren, dat zij slagen of geselen verdiend hadden, dat is, het snoodste gespuis onder het volk, daar toe opgerokkend zijnde]; verzamelden zich tegen mij, die ik niet kende; [en vervolgens nimmer leed gedaan had] zij scheurden [de keel] op [dat is, plaagden en spotten] en hielden niet op. Beide overzettingen hebben een goeden zin, hoewel hetgeen in den tekst gesteld is, naast met de eigenschap der Hebr. spraak schijnt overeen te komen; waarvan de verstandige lezer kan oordelen."},{"catchword":"merkte","tekst":"Te weten, niets kwaads, ik dacht niet dat zij huichelden en mij bedrogen maar meende dat zij het van harte deden."},{"catchword":"zwegen","tekst":"Maar troostten mij, weenden over mij. Of, doch zij zwegen niet; maar achter mijn rug toonden zij genoeg hoe zij het meenden, gelijk volgt."}],"16":[{"catchword":"spotachtige","tekst":"Of, smetbroeders, tafellikkers. Hebr. eigenlijk, spotters van den koek, of koekspotters. [ Hebr. spotting van den koek ]; dat is, die hunne gebaren en tongen om een stuk broods, of smets, [gelijk men zegt] verkopen, sprekende en doende alles naar het believen desgenen, die hun buik vult, waarom ook het Hebreeuwse woord bij sommigen voorts genomen wordt voor boetsmakers, spotvogels. Hij wil zeggen: Als zij bij dit hun volkje zijn, dan uiten zij de bitterheid huns harten tegen mij, wensende mij alles kwaads en verdrietig zijnde dat het nog zo lang met mij duurt. Van het knarsen met de tanden, zie Job 16:9 ."}],"17":[{"catchword":"eenzame","tekst":"Verst, mijne ziel; gelijk Psa 22:21 ; zie aldaar."}],"19":[{"catchword":"valse","tekst":"Hebr. leugen, of, valsheid, valselijk; Dat is, om de valse oorzaken, gelijk Psa 38:20 , en Psa 69:5 ."},{"catchword":"wenken","tekst":"Dat is, mij spijtig en spotachtig aanzien, mij dreigende, alsof zij wilden zeggen: Men zal u haast leren, enz. Verg. Pro 6:13 , en Pro 10:10 ."},{"catchword":"zonder","tekst":"Gelijk boven vs.7."}],"20":[{"catc // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

    toast.classList.add('zichtbaar');

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
