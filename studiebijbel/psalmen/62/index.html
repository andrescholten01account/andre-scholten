","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm van David, voor de koorleider, over Jeduthun.","2":"Zeker, mijn ziel is stil bij God; van Hem is mijn heil.","3":"Zeker, Hij is mijn Rots en mijn Heil, mijn Hoog Vertrek, ik zal niet erg wankelen.","4":"Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.","5":"Zij overleggen slechts om *hem* van zijn hoogheid te verstoten; zij hebben behagen in leugen; met hun mond zegenen zij, maar met hun binnenste vloeken zij. Sela.","6":"Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting.","7":"Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen.","8":"In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.","9":"Vertrouw op Hem te allen tijde, o volk! Stort uw hart uit voor Zijn aangezicht; God is ons een Toevlucht. Sela.","10":"Zeker, de gewone mensen zijn nietigheid, de aanzienlijke mensen zijn leugen; in de weegschaal gewogen, zouden zij samen *lichter* zijn dan de nietigheid.","11":"Vertrouw niet op onderdrukking, en word niet ijdel door roverij; als het vermogen overvloedig toeneemt, zet er het hart niet op.","12":"God heeft één ding gesproken, dit heb ik tweemaal gehoord: dat de sterkte van God is.","13":"En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk."},"SV":{"1":"Een psalm van David, voor den opperzangmeester, over Jeduthun.","2":"Immers is mijn ziel stil tot God; van Hem is mijn heil.","3":"Immers is Hij mijn Rotssteen en mijn Heil, mijn Hoog Vertrek, ik zal niet grotelijks wankelen.","4":"Hoe lang zult gijlieden kwaad aanstichten tegen een man? Gij allen zult gedood worden; gij zult zijn als een ingebogen wand, een aangestoten muur.","5":"Zij raadslagen slechts, om *hem* van zijn hoogheid te verstoten; zij hebben behagen in leugen; met hun mond zegenen zij; maar met hun binnenste vloeken zij. Sela.","6":"Doch gij, o mijn ziel! zwijg Gode; want van Hem is mijn verwachting.","7":"Hij is immers mijn Rotssteen en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen.","8":"In God is mijn Heil en mijn Eer; de Rotssteen mijner sterkte, mijn Toevlucht is in God.","9":"Vertrouw op Hem te aller tijd, o gij volk! Stort ulieder hart uit voor Zijn aangezicht; God is ons een Toevlucht. Sela.","10":"Immers zijn de gemene lieden ijdelheid, de grote lieden zijn leugen; in de weegschaal opgewogen, zouden zij samen *lichter* zijn dan de ijdelheid.","11":"Vertrouwt niet op onderdrukking, noch op roverij; wordt niet ijdel, als het vermogen overvloedig aanwast, en zet er het hart niet op.","12":"God heeft een ding gesproken, ik heb dit tweemaal gehoord: dat de sterkte Godes is.","13":"En de goedertierenheid, o Heere! is Uwe; want Gij zult een iegelijk vergelden naar zijn werk."},"KJV":{"1":"[[To the chief Musician, to Jeduthun, A Psalm of David.]] Truly my soul waiteth upon God: from him *cometh* my salvation.","2":"[[To the chief Musician, to Jeduthun, A Psalm of David.]] Truly my soul waiteth upon God: from him *cometh* my salvation.","3":"He only *is* my rock and my salvation; *he is* my defence; I shall not be greatly moved.","4":"How long will ye imagine mischief against a man? ye shall be slain all of you: as a bowing wall *shall ye be, and as* a tottering fence.","5":"They only consult to cast *him* down from his excellency: they delight in lies: they bless with their mouth, but they curse inwardly. Selah.","6":"My soul, wait thou only upon God; for my expectation","7":"He only *is* my rock and my salvation: *he is* my defence; I shall not be moved.","8":"In God *is* my salvation and my glory: the rock of my strength, *and* my refuge, *is* in God.","9":"Trust in him at all times; *ye* people, pour out your heart before him: God *is* a refuge for us. Selah.","10":"Surely men of low degree *are* vanity, *and* men of high degree *are* a lie: to be laid in the balance, they *are* altogether *lighter* than vanity.","11":"Trust not in oppression, and become not vain in robbery: if riches increase, set not your heart","12":"God hath spoken once; twice have I heard this; that power *belongeth* unto God.","13":"Also unto thee, O Lord, *belongeth* mercy: for thou renderest to every man according to his work."}},"tsk":{"2":[{"kopje":"Zeker","refs":["Ps 62:3","Ps 62:6","Ps 62:7"]},{"kopje":"mijn ziel","refs":["Ps 25:5","Ps 27:14","Ps 33:20","Ps 40:2","Ps 123:2","Ps 130:5","Ps 130:6","Jes 30:18","Jes 40:31","Klaagl 3:25","Klaagl 3:38","Jak 5:7"]},{"kopje":"stil","refs":["Ps 37:7","Ps 65:2"]},{"kopje":"van","refs":["Ps 37:39","Ps 68:20","Ps 68:21","Ps 121:2","Jes 12:2","Jer 3:23","Luk 2:30-32"]}],"3":[{"kopje":"Hij","refs":["Ps 62:7","Ps 18:3","Ps 21:2","Ps 27:1","Ps 73:25","Ps 73:26","Deut 32:30","Deut 32:31","Jes 26:4","Jes 32:2"]},{"kopje":"Heil","refs":["Ps 59:10","Ps 59:18"]},{"kopje":"ik zal","refs":["Ps 37:24","Micha 7:8","Micha 7:9","1 Kor 10:13","2 Kor 4:8","2 Kor 4:9"]}],"4":[{"kopje":"Hoelang","refs":["Ps 4:3","Ps 82:2","Ex 10:3","Ex 16:28","Spr 1:22","Spr 6:9","Jer 4:14","Matt 17:17"]},{"kopje":"aanstichten","refs":["Ps 21:12","Ps 38:13","Ps 140:3","Hos 7:15"]},{"kopje":"u zult","refs":["Ps 73:18-20","1 Sam 26:10"]},{"kopje":"ingebogen","refs": rdt] betekent allerlei kwade praktijken tot iemands verdriet en verderf te bedenken en in het werk te stellen."},{"catchword":"man?","tekst":"Te weten, mij, alsof hij zeide: tegen een enigen man, den onschuldigen en goeden David, die u niets heeft misdaan, ja zich als een man en held voor Saul en Gods volk gekweten heeft. Verg. Jer 5:1 ."},{"catchword":"gedood","tekst":"De vervulling hiervan kan men afnemen uit de slag, waarin Saul met de zijnen gebleven is; 1Sa 31 ;."},{"catchword":"ingebogen","tekst":"Die zich neigt tot den val."},{"catchword":"muur","tekst":"Versta, die van losse stenen tot een heining [als om wijngaarden en anderzins tot een scheiding, zie Num 22:24 ; Pro 24:31 ,] is opgehoopt, en aangestoten zijnde, lichtelijk wordt omgestort. Deze gelijkenis beduidt een haastigen en zwaren val. Zie Isa 30:13 ; Eze 13:13-14 ."}],"5":[{"catchword":"hem","tekst":"Mij, David, dien God tot de koninklijke hoogheid verkoren en gezalfd heeft."},{"catchword":"hun","tekst":"Hebr. zijnen; dat is, elkeen van hen doet zo."},{"catchword":"zegenen","tekst":"Verg. Psa 5:10 , en zie 2Sa 8:10 , en Job 31:20 ."},{"catchword":"binnenste","tekst":"Dat is hun hart."},{"catchword":"Sela","tekst":"Zie Psa 3:3 ."}],"6":[{"catchword":"zwijg","tekst":"Zie boven vs.2."},{"catchword":"verwachting","tekst":"Dat is, ik verwacht van Hem mijn heil, gelijk vs.2."}],"8":[{"catchword":"rotssteen","tekst":"Dat is, mijn sterke rotssteen."}],"9":[{"catchword":"volk","tekst":"Te weten, des Heeren, namelijk Israël."},{"catchword":"hart","tekst":"Dat is, de begeerten uws harten, gebeden met tranen. Verg. 1Sa 1:15 ; Lam 2:19 , en Psa 42:5 ."}],"10":[{"catchword":"gemene","tekst":"Hebr. de zonen of kinderen des mensen, en daarna, zonen of kinderen des mans. Zie hiervan Psa 4:3 ."},{"catchword":"leugen;","tekst":"Dat is, beiden, kleinen en groten, zijn een gans nietig en bedriegelijk ding. Zie Job 15:31 ."},{"catchword":"in de","tekst":"Of, in de weegschaal zouden zij tezamen opgaan boven, of meer dan ijdelheid; dat is, de ijdelheid zou overwegen, zij zouden minder wegen dan ijdelheid."}],"11":[{"catchword":"onderdrukking","tekst":"Dat gij iemand met list of geweld zoudt verdrukken en pogen te verwoesten. Zie Isa 30:12 ."},{"catchword":"ijdel","tekst":"Uzelven bedriegende en bij anderen voor dwaas geacht, omdat gij u op ijdele dingen verlaat. Verg. Psa 31:7 ."},{"catchword":"het vermogen","tekst":"Rijkdom en macht."},{"catchword":"overvloedig","tekst":"Als een kruid, dat in menigte opkomt en voorspruit. Verg. Psa 92:15 ; Pro 10:31 ."}],"12":[{"catchword":"een ding","tekst":"Of, eenmaal; als een zeker ongetwijfeld woord, eens vooral, waarvan alle profeten hetzelfde betuigen, te weten dat God alleen almachtig is, en daarentegen de macht der groten op aarde [gelijk gezegd] maar ijdelheid is."},{"catchword":"tweemaal","tekst":"Dat is, menigmaal, een zeker getal voor het onzekere, naar het gebruik der Schrift."},{"catchword":"Godes is","tekst":"Of, God toekomt, toebehoort; dat Hij sterkte heeft, te weten, om bozen te bedwingen en te straffen; gelijk Hij ook goedertierenheid heeft met sterkte [gelijk volgt] om den zijnen wel te geven."}],"13":[{"catchword":"is uwe;","tekst":"Of, komt U toe, Gij hebt haar."},{"catchword":"want","tekst":"Of, zekerlijk, voorwaar."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A Psalm of David for the chief Song-master over Jeduthun [i.e. the family and order of Jeduthun, or, to Jeduthun, as being a chief Song-master, as Psalm 39.verse.1. See there.] (62:2) Verily is my soul still (or silent) to God: [Or, nevertheless, (or yet) in my soul quiet, or, silent, holding her peace. Or, My soul is silent to God, or before God; as if he said, let it go as it may, I shall not cease, by prayers, patience and confidence to wait for Gods help and salvation; notwithstanding he seem ready to forsake me, because mine enemies do still persecute me with so much bitterness and malice. Compare Psalm 37.on v.7. and below v.6. Thus David breaks out with words of comfortable assurance, after a great conflict endured in his mind. Compare Psa 37:1, &c.] from him is my salvation."}],"2":[{"catchword":null,"tekst":"A Psalm of David for the chief Song-master over Jeduthun [i.e. the family and order of Jeduthun, or, to Jeduthun, as being a chief Song-master, as Psalm 39.verse.1. See there.] (62:2) Verily is my soul still (or silent) to God: [Or, nevertheless, (or yet) in my soul quiet, or, silent, holding her peace. Or, My soul is silent to God, or before God; as if he said, let it go as it may, I shall not cease, by prayers, patience and confidence to wait for Gods help and salvation; notwithstanding he seem ready to forsake me, because mine enemies do still persecute me with so much bitterness and malice. Compare Psalm 37.on v.7. and below v.6. Thus David breaks out with words of comfortable assurance, after a great conflict endured in his mind. Compare Psa 37:1, &c.] from him is my salvation."}],"3":[{"catchword":null,"tekst":"(3) Verily is he my rock, and my salvation; mine high retreat, I shall not greatly waver. [i.e. not so, as that I shall be in danger of falling and perishing utterly. See Psalm 15.on verse.5. and withal 1 Cor.10.v.13. and 2 Cor.4.9.]"}],"4":[{"catchword":null,"tekst":"(4) How long shall ye [Speaking to his persecutors.] contrive evil [the Hebrew word (onely extant in this place) doth signify to devise and act all manner of evil, and mischievous practises to vex and ruin one] against a man? [i.e. me, my self, as if he said, against one onely man, innocent and honest David, who never wronged you; yea, against him too, that hath shewed himself a man (virum) a Champion before King Saul himself, and the people of God. Compare Jer 5:1.] ye shall all be put to death; [the fulfilling hereof may be gathered from the great overthrow where Saul and most of his did lose their lives, 1 Sam.31.] ye shall be as a bowed wall [which inclineth and is ready to fall] a pushed fence. [understand this of loose stones, or such like materials, raised up to serve for a fence (as about vineyards, or otherwise for a partition. See Num 22:24. Pro 24:31) and being pushed at, is easily thrown down. This similitude doth imply a sudden and a heavy fall. See Isa.30.v.13. Ezek.13.v.13,14.]"}],"5":[{"catchword":null,"tekst":"(5) They consult plainly to thrust him from his Highness: [Him, viz. Me (David) whom God hath chosen, anointed and exalted to the Royal Dignity] they delight in lies; with their mouth [Heb. His mouth, i.e. every one of them doth so] they bless, [compare Psa 5:10. and see 2 Samuel 8.on v.10. and Job 31.on v.20.] but with their inmost [i.e. their heart] they curse, Sela! [see Psa.3.v.3.]"}],"6":[{"catchword":null,"tekst":"(6) Yet thou my soul, be still to God: [See above on v.2.] for my expectation is from him. [i.e. from him I do expect my salvation, as above v.2.]"}],"7":[{"catchword":null,"tekst":"(7) He surely is my rock, and my salvation, mine high retreat, I shall not waver."}],"8":[{"catchword":null,"tekst":"(8) In God in my salvation and mine honour: the rock of strength, [i.e. my strong rock] my refuge is in God."}],"9":[{"catchword":null,"tekst":"(9) Trust in him at all times, O ye people; [viz. Of the LORD, ye people of Israel.] power out your heart [i.e. the desires of your heart, your prayers with tears, 1 Sam.ver.15. Lamen.2.19. and Psalm 41.on ver.5.] before his face: God is to us Refuge; Sela! [see Psalm 3.on ver.3.]"}],"10":[{"catchword":null,"tekst":"(10) Verily the common people are vanity, the great ones are lies. [Heb. The sons (or, children of a man (hominis) and afterwards, sons or children of a man, (viri) See hereof Psalm 4.on verse 3. The meaning is; both small and great, all men in general, are vain and deceitful, there is no trusting nor relying on them. See Job 15.on ver.31.] weighed up in the balance, they should together be (lighter) then vanity. [or, in the balance should they together go up above (or) more) then vanity. i.e. Vanity being laid in the one scale, and all they together in the other, vanity would yet out weigh them, they should weigh less, and therefore rise up higher then the scale of vanity.]"}],"11":[{"catchword":null,"tekst":"(11) Trust not in oppression, [That ye should go about, by any way of craft or force, to oppress and ruin others. See Isa 30:12.] nor in robbery, and grow not vain; [deceiving yourselves, and prostituting your own folly, for putting your trust in vain things. Compare Psalm 31.on verse 7.] when the ability [richess and power] encreaseth abundantly, [like an herb that commeth up spreading and multiplying in abundance. Compare Psa 92:15. and Pro 10:31.] set not the heart (there) on."}],"12":[{"catchword":null,"tekst":"(12) God hath spoken one thing [Or, once, as a most sure and undoubted word, once for all, whereof all the Prophets jointly testify, to wit, that God alone is Almighty, and in comparison thereof all the power of the great ones on earth is meer vanity.] I heard this twice, [i.e. several or oftentimes; a certain number for an uncertain, as is usual in the Scripture] that the strength is Gods, [or, belongeth, oppertaineth to God, that he hath strength: [namely, to curb and punish the wicked: as he hath likewise kindness or mercy, together with strength as followeth, to do good to his, and thus to give every one his due.]"}],"13":[{"catchword":null,"tekst":"(13) And the kindness, O Lord, is thine; [Or, comes to thee, thou hast it:] for thou shalt recompence every one according to his work. [or, surely, verily thou shalt, etc.]"}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const concordCache = {};

  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);

  } catch (e) { cache[code] = null; }

}

const popupCache = {};

  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;

document.addEventListener('mouseover', e => {

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
