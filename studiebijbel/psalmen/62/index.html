ij door de wijzen bedrogen was, werd hij zeer toornig, en na enigen uitgezonden te hebben, bracht hij al de kinderen om die binnen Bethlehem en in heel dat gebied waren, van twee jaar oud en daaronder, overeenkomstig de tijd die hij van de wijzen nauwkeurig had nagevraagd.", "2 Tim 4:14": "Alexander, de kopersmid, heeft mij veel kwaad aangedaan; de Heere zal hem vergelden naar zijn werken.", "Job 35:14": "Dat u ook gezegd hebt: U zult Hem niet aanschouwen; er is toch een oordeel voor Zijn aangezicht, wacht u dan op Hem.", "Zach 1:17": "Roep nog, en zeg: Zo zegt de HEERE van de heerscharen: Mijn steden zullen nog uitgespreid worden vanwege de voorspoed; want de HEERE zal Sion nog troosten, en Hij zal Jeruzalem nog verkiezen.", "Spr 24:17": "Verblijd u niet, als uw vijand valt; en als hij neerstruikelt, laat uw hart zich niet verheugen;", "Ps 21:2": "O HEERE! De koning is verblijd over Uw sterkte; en hoezeer is hij verheugd over Uw heil!", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Mark 10:30": "of hij ontvangt honderdvoud, nu in deze tijd, huizen, en broers, en zusters, en moeders, en kinderen, en akkers, met vervolgingen, en in de toekomende tijd het eeuwige leven.", "Luk 6:20-23": "En Hij sloeg Zijn ogen op naar Zijn discipelen, en zei: Zalig bent u, armen, want van u is het Koninkrijk van God. Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen. Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen.", "Ps 42:12": "Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke verlossing van mijn aangezicht, en mijn God.", "Num 14:18-20": "De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht. Vergeef toch de ongerechtigheid van dit volk, naar de grootte van Uw goedertierenheid, en zoals U dit volk vergeven hebt, van Egypteland af tot hiertoe! En de HEERE zei: Ik heb hun vergeven naar uw woord.", "Klaagl 3:25": "Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Ps 118:9": "Het is beter tot de HEERE toevlucht te nemen, dan op prinsen te vertrouwen.", "Ps 91:1": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige.", "Ps 89:14": "Gij hebt een arm met macht; Uw hand is sterk, Uw rechterhand is hoog.", "Ps 20:6-8": "Wij zullen juichen over Uw heil, en de vaandels opsteken in de Naam van onze God. De HEERE vervult al uw verlangens. Nu weet ik, dat de HEERE Zijn Gezalfde behoudt; Hij zal Hem verhoren uit de hemel van Zijn heiligheid; het heil van Zijn rechterhand zal zijn met machten. Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Ps 91:10": "U zal geen kwaad overkomen, en geen plaag zal uw tent naderen.", "Jes 3:10": "Zegt de rechtvaardige, dat het hem goed zal gaan; dat zij de vrucht van hun werken zullen eten.", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Ps 111:4": "Zain. Hij heeft Zijn wonderen tot een gedachtenis gemaakt; Cheth. de HEERE is genadig en barmhartig.", "Matt 5:3-12": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen. Zalig zijn zij die treuren, want zij zullen vertroost worden. Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Ps 65:7": "Die de bergen vastzet door Zijn kracht, omgord met macht.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Ps 29:11": "De HEERE zal Zijn volk sterkte geven; de HEERE zal Zijn volk zegenen met vrede.", "Ps 104:7": "Van Uw dreigen vluchtten zij, zij haastten zich weg voor de stem van uw donder.", "Job 38:11": "En zei: Tot hiertoe zult u komen, en niet verder, en hier zal hij zich stellen tegen de hoogmoed van uw golven.", "Jes 33:13": "Hoort, u die ver weg bent, wat Ik gedaan heb; en u, die nabij bent, erken Mijn macht!", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Matt 18:23-27": "Daarom wordt het Koninkrijk der hemelen vergeleken met een zekere koning die met zijn dienstknechten rekening wilde houden. Toen hij nu begon te rekenen, werd er iemand bij hem gebracht die hem tienduizend talenten schuldig was. En omdat hij niet had waarmee hij kon betalen, beval zijn heer dat men hem zou verkopen, en zijn vrouw en kinderen, en alles wat hij had, en dat de schuld zo betaald zou worden.", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Jes 58:10": "En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Job 9:19": "Als het op kracht aankomt, zie, Hij is sterk; en als het op recht aankomt, wie zal mij dagvaarden?", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Tit 3:3-7": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar. Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is, Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Ps 37:3-5": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw. En verlustig u in de HEERE, zo zal Hij u geven de verlangens van uw hart. Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Luk 22:29": "En Ik ken u het Koninkrijk toe, zoals Mijn Vader dat Mij toegekend heeft;", "Ps 11:5": "De HEERE beproeft de rechtvaardige; maar de goddeloze, en wie geweld liefheeft, haat Zijn ziel.", "Ps 77:19": "Het geluid van uw donder was rondom; de bliksemen verlichtten de wereld; de aarde werd beroerd en daverde.", "Ps 73:23-26": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat; U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen. Aan wie heb ik behalve U iets in de hemel? Behalve U verlang ik ook niets op de aarde!", "Jona 4:11": "En zou Ik dan die grote stad Ninevé niet ontzien? Daarin wonen meer dan honderdtwintigduizend mensen, die geen onderscheid weten te maken tussen hun rechterhand en hun linkerhand; en bovendien nog veel vee?", "Job 31:6": "Hij weegt mij op, in een rechte weegschaal, en God zal mijn oprechtheid weten.", "Joh 6:40": "En dit is de wil van Hem die Mij gezonden heeft: dat ieder die de Zoon aanschouwt en in Hem gelooft, het eeuwige leven heeft; en Ik zal hem opwekken op de laatste dag.", "Ps 62:6-9": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "1 Tim 1:16": "Maar juist daarom is mij barmhartigheid overkomen, opdat Jezus Christus in mij, die de voornaamste ben, al Zijn geduld zou tonen, tot een voorbeeld voor hen die later in Hem geloven zullen tot het eeuwige leven.", "Ps 22:9": "Hij heeft het op de HEERE gewenteld, dat Hij hem nu uithelpt, dat Hij hem redt, omdat Hij lust aan hem heeft!", "Mark 15:10": "(Want hij wist dat de overpriesters Hem uit afgunst overgeleverd hadden.)", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Ex 22:21-24": "U mag de vreemdeling geen onrecht aandoen, en hem ook niet onderdrukken; want u bent zelf vreemdeling geweest in het land Egypte. U mag geen weduwe of wees kwaad doen. Als u hen op enige manier kwaad doet, en zij roepen dan tot Mij, zal Ik hun geroep zeker verhoren;", "Jer 21:12": "O huis van David! zo zegt de HEERE: Spreek 's morgens recht, en bevrijd de beroofde uit de hand van de verdrukker; anders zal Mijn gramschap uitvaren als een vuur, en branden, zodat niemand het blussen kan, vanwege de slechtheid van uw daden.", "Hand 10:4": "En hij hield de ogen op hem gericht, en werd zeer bevreesd, en zei: Wat is er, Heere? En Hij zei tegen hem: Uw gebeden en uw aalmoezen zijn als gedachtenis opgekomen voor God.", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Deut 23:25": "Wanneer u in het staande koren van uw naaste komt, dan mag u de aren met uw hand afplukken; maar de sikkel zult u niet gebruiken over het staande koren van uw naaste.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Ps 29:3-9": "De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid. De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Job 14:20": "U overweldigt hem voor altijd, en hij gaat heen; U verandert zijn gelaat, en zendt hem weg.", "Ps 22:5": "Op U hebben onze vaders vertrouwd; zij hebben vertrouwd, en U hebt hen uitgeholpen.", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Ps 51:3-19": "Wees mij genadig, o God! naar Uw goedertierenheid; delg mijn overtreding uit, naar de grootheid van Uw barmhartigheden. Was mij goed van mijn ongerechtigheid, en reinig mij van mijn zonde. Want ik ken mijn overtredingen, en mijn zonde staat mij steeds voor ogen.", "Jes 65:8": "Zo zegt de HEERE: Zoals wanneer men most in een tros druiven vindt, men zegt: Verderf ze niet, want er is een zegen in; zo zal Ik het om Mijn knechten doen, dat Ik hen niet allen verderf.", "Ps 142:3": "Ik stortte mijn klacht uit voor Zijn aangezicht; ik maakte voor Zijn aangezicht mijn benauwdheid bekend.", "Ezech 18:30": "Daarom zal Ik u richten, o huis van Israël, ieder naar zijn wegen, spreekt de Heere HEERE. Keer terug, en bekeer u van al uw overtredingen, zo zal de ongerechtigheid u niet tot een struikelblok worden.", "Ps 41:3": "De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Jes 43:16": "Zo zegt de HEERE, Die in de zee een weg, en in de sterke wateren een pad maakte;", "Luk 21:18": "Toch zal er geen haar van uw hoofd verloren gaan.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "Openb 16:5-7": "En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt; Omdat zij het bloed van de heiligen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard. En ik hoorde een ander vanaf het altaar zeggen: Ja, Heere, U almachtige God! Uw oordelen zijn waarachtig en rechtvaardig.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Ps 27:8": "Mijn hart zegt tegen U: U zegt: Zoek Mijn aangezicht; ik zoek Uw aangezicht, o HEERE!", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "Ps 59:10": "Tegen zijn sterkte zal ik op U wachten; want God is mijn Hoog Vertrek.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Ps 69:17": "Verhoor mij, o HEERE, want Uw goedertierenheid is goed; zie mij aan naar de grootheid van Uw barmhartigheden.", "Jes 37:6": "En Jesaja zei tegen hen: Zo moet u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bang voor de woorden die u gehoord hebt, waarmee de knechten van de koning van Assyrië Mij gelasterd hebben.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Openb 2:26-28": "En wie overwint, en Mijn werken tot het einde toe bewaart, hem zal Ik macht geven over de heidenen; En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb. En Ik zal hem de morgenster geven.", "Rom 10:11-13": "Want de Schrift zegt: Ieder die in Hem gelooft, zal niet beschaamd worden. Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen. Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Ex 15:10-12": "U hebt met Uw wind geblazen; de zee heeft hen gedekt, zij zonken onder als lood in geweldige wateren! O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet? U hebt Uw rechterhand uitgestrekt, de aarde heeft hen verslonden!", "Gal 3:29": "En als u van Christus bent, dan bent u Abrahams nageslacht, en naar de belofte erfgenamen.", "Ps 119:150": "Die kwade praktijken najagen, genaken mij, zij wijken ver van Uw wet.", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Gen 18:21": "Zal Ik nu afgaan en zien of zij naar hun geroep, dat tot Mij gekomen is, het uiterste gedaan hebben, en zo niet, Ik zal het weten.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "Gen 18:26-32": "Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen. En Abraham antwoordde en zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere, hoewel ik stof en as ben! Misschien zullen aan de vijftig rechtvaardigen vijf ontbreken; zult U dan om vijf de hele stad verwoesten? En Hij zei: Ik zal haar niet verwoesten, als Ik er vijfenveertig zal vinden.", "Joz 24:19": "Toen zei Jozua tegen het volk: U zult de HEERE niet kunnen dienen, want Hij is een heilig God; Hij is een na-ijverig God; Hij zal uw overtredingen en uw zonden niet vergeven.", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "Ps 9:10": "En de HEERE zal een Hoog Vertrek zijn voor de verdrukte, een Hoog Vertrek in tijden van benauwdheid.", "Matt 6:14": "Want als u de mensen hun misdaden vergeeft, zal uw hemelse Vader ook u vergeven.", "Jer 31:13": "Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis.", "Jes 66:14": "En u zult het zien, en uw hart zal vrolijk zijn, en uw beenderen zullen groeien als het tedere gras; dan zal de hand van de HEERE bekend worden aan Zijn knechten, en Hij zal boos worden op Zijn vijanden.", "Joh 13:36": "Simon Petrus zei tegen Hem: Heere, waar gaat U heen? Jezus antwoordde hem: Waar Ik heenga, kunt u Mij nu niet volgen; maar u zult Mij later volgen.", "Neh 9:33": "Doch U bent rechtvaardig, in alles wat ons overkomen is; want U hebt trouw gehandeld, maar wij hebben goddeloos gehandeld.", "Fil 1:19-21": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus. Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood. Want het leven is voor mij Christus, en het sterven is winst.", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Jak 2:6": "Maar u hebt de arme oneer aangedaan. Onderdrukken de rijken u niet, en trekken zij u niet voor de rechterstoelen?", "Deut 8:12-14": "Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt; Uw hart zich dan verheft, zodat u de HEERE, uw God, vergeet, Die u uit Egypteland, uit het slavenhuis, uitgeleid heeft;", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Ps 50:23": "Wie dank offert, die zal Mij eren; en wie zijn weg goed inricht, die zal Ik Gods heil doen zien.", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Job 11:15-20": "Want dan zult u uw gezicht opheffen zonder smet, en zult vast staan, en niet vrezen. Want u zult de moeite vergeten, en er aan denken als aan water dat voorbijgegaan is. Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn.", "Job 21:22": "Zal men God wetenschap leren, terwijl Hij hen die hoog zijn richt?", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "Jes 26:4": "Vertrouw op de HEERE tot in eeuwigheid; want in de HEERE HEERE is een eeuwige rots.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Dan 3:16": "Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Luk 22:30": "opdat u eet en drinkt aan Mijn tafel in Mijn Koninkrijk, en zit op tronen, en de twaalf stammen van Israël oordeelt.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "1 Joh 3:2": "Geliefden, nu zijn wij kinderen van God, en het is nog niet openbaar geworden wat wij zijn zullen. Maar wij weten dat, als Hij geopenbaard zal zijn, wij Hem gelijk zullen zijn; want wij zullen Hem zien zoals Hij is.", "Jer 39:18": "Want Ik zal u zeker bevrijden, en u zult door het zwaard niet vallen; maar u zult uw leven als een buit hebben, omdat u op Mij vertrouwd hebt, spreekt de HEERE.", "1 Sam 18:5": "En David trok uit, overal waar Saul hem zond; hij gedroeg zich voorzichtig, en Saul stelde hem aan over de krijgslieden; en hij was aangenaam in de ogen van het hele volk, en ook in de ogen van de knechten van Saul.", "Rom 8:35-39": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "Spr 3:31": "Wees niet jaloers op een man van het geweld, en kies geen van zijn wegen.", "Jes 46:12": "Hoor naar Mij, u die hardnekkig van hart bent, u, die ver van de gerechtigheid zijt!", "1 Joh 3:22": "en wat wij ook bidden, ontvangen wij van Hem, omdat wij Zijn geboden bewaren en doen wat welgevallig is voor Hem.", "Ps 69:33": "De zachtmoedigen, als zij dit gezien hebben, zullen zich verblijden; en u die God zoekt, uw hart zal leven.", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "Ps 21:8": "Want de koning vertrouwt op de HEERE, en door de goedertierenheid van de Allerhoogste zal hij niet wankelen.", "Ps 115:3": "Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "Job 40:4": "Hebt u een arm gelijk God? En kunt u, gelijk Hij, met de stem donderen?", "Ps 4:9": "Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.", "Ps 85:3": "De misdaad van Uw volk hebt U weggenomen; U hebt al hun zonden bedekt. Sela.", "Jes 33:21": "Maar de HEERE zal daar bij ons heerlijk zijn, het zal een plaats zijn van rivieren, van wijde stromen; geen roeischuit zal daar doorvaren, en geen praalschip zal daar overvaren.", "Spr 14:8": "De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.", "Jes 50:3": "Ik bekleed de hemel met zwartheid, en maak een zak tot zijn bedekking.", "Joh 8:44": "U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.", "Ps 90:3": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen!", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Spr 26:24-26": "Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart. Wiens haat door bedrog bedekt is, diens slechtheid zal in de gemeente openbaar worden.", "Rom 2:6": "Die ieder zal vergelden naar zijn werken:", "1 Joh 2:28": "En nu, kinderen, blijft in Hem; opdat, wanneer Hij geopenbaard zal zijn, wij vrijmoedigheid hebben, en wij bij Zijn komst niet beschaamd worden voor Hem.", "Jer 5:22": "Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Zach 9:12": "Keert u weer tot de sterkte, gebondenen, die daar hopen! Ook heden verkondig Ik, dat Ik u dubbel zal wedergeven;", "Hand 3:15": "En de Vorst van het leven hebt u gedood, Die God heeft opgewekt uit de doden; waarvan wij getuigen zijn.", "Jer 7:9": "Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent,", "Jak 1:25": "Maar wie zich verdiept in de volmaakte wet, die van de vrijheid is, en daarbij blijft, die is geen vergeetachtige hoorder geworden, maar een dader van het werk, die zal, zeg ik, gelukzalig zijn in dit zijn doen.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Luk 21:28": "Wanneer nu deze dingen beginnen te gebeuren, kijk dan omhoog, en hef uw hoofden opwaarts, omdat uw verlossing nabij is.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Jes 46:13": "Ik breng Mijn gerechtigheid nabij, zij zal niet ver weg zijn, en Mijn heil zal niet uitblijven; maar Ik zal heil geven in Sion, aan Israël Mijn heerlijkheid.", "Job 11:6": "En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Matt 25:40": "En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Ps 71:13": "Laat hen beschaamd worden, laat hen verteerd worden, die mijn ziel tegenstaan; laat hen met smaad en schande overdekt worden, die mijn kwaad zoeken.", "Ezech 33:18-20": "Als de rechtvaardige afwijkt van zijn gerechtigheid en onrecht doet, zal hij daarin sterven. En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven. Toch zegt u: De weg van de Heere is niet recht; Ik zal u richten, ieder naar zijn wegen, o huis van Israël!", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Spr 30:4": "Wie is naar de hemel opgeklommen, en neergedaald? Wie heeft de wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft alle einden van de aarde vastgesteld? Hoe is Zijn Naam, en hoe is de Naam van Zijn Zoon, als u het weet?", "Num 16:22": "Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "1 Joh 4:16": "En wij hebben de liefde gekend en geloofd, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem.", "Ps 60:14": "In God zullen wij kloeke daden doen, en Hij zal onze tegenstanders vertreden.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Jer 49:11": "Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Deut 33:25-29": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen! Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken. De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Spr 12:19": "Een waarachtige lip zal voor altijd bevestigd worden; maar een valse tong is maar voor een ogenblik.", "Ps 102:2": "O HEERE! Hoor mijn gebed, en laat mijn geroep tot U komen.", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "Luk 20:36": "want zij kunnen niet meer sterven, want zij zijn gelijk aan de engelen; en zij zijn kinderen van God, omdat zij kinderen van de opstanding zijn.", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Fil 3:12-14": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben. Broeders, ik acht niet dat ik het zelf al gegrepen heb. Maar één ding doe ik: ik vergeet wat achter is, en strek mij uit naar wat voor is, en jaag naar het doel, naar de prijs van de roeping van God van boven in Christus Jezus.", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Joz 1:5-9": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten. Wees sterk en heb goede moed! Want u zult dit volk dat land als erfelijk bezit doen verkrijgen, dat Ik hun vaderen gezworen heb hun te geven. Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Ps 98:9": "Voor het aangezicht van de HEERE, want Hij komt om de aarde te oordelen; Hij zal de wereld oordelen in gerechtigheid, en de volken in alle rechtmatigheid.", "2 Kon 18:5": "Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Openb 20:13": "En de zee gaf de doden, die in haar waren; en de dood en het rijk van de dood gaven de doden, die in hen waren; en zij werden geoordeeld, ieder naar zijn werken.", "Ps 3:9": "Het heil is van de HEERE; Uw zegen is over Uw volk. Sela.", "Openb 7:10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "Spr 10:31": "De mond van de rechtvaardige brengt overvloedig wijsheid voort; maar de tong van de verkeerdheden zal uitgeroeid worden.", "Amos 1:11": "Zo zegt de HEERE: Om drie overtredingen van Edom, en om vier zal Ik dat niet afwenden; omdat hij zijn broeders met het zwaard heeft vervolgd, en zijn medelijden heeft verdorven; en dat zijn toorn eeuwig verscheurt, en hij zijn woede altijd blijft koesteren.", "Ps 66:16-20": "Komt, hoort toe, allen die God vrezen, en ik zal vertellen wat Hij aan mijn ziel gedaan heeft. Ik riep tot Hem met mijn mond, en Hij werd verhoogd onder mijn tong. Had ik naar ongerechtigheid met mijn hart gezien, de Heere zou niet gehoord hebben.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Hebr 2:18": "Want doordat Hij Zelf, beproefd zijnde, geleden heeft, kan Hij hun die beproefd worden, te hulp komen.", "Ps 91:2": "Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw!", "Hand 10:31": "en zie, een man stond voor mij, in een blinkend kleed, en zei: Cornelius! Uw gebed is verhoord, en uw aalmoezen zijn voor God in gedachtenis gekomen.", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Luk 6:36": "Wees dan barmhartig, zoals ook uw Vader barmhartig is.", "Ps 33:5": "Hij heeft gerechtigheid en recht lief; de aarde is vol van de goedertierenheid van de HEERE.", "Rom 12:12": "Verblijd u in de hoop. Wees geduldig in de verdrukking. Volhard in het gebed.", "Ezech 45:9": "Zo zegt de Heere HEERE: Het is genoeg voor u, vorsten van Israël! Doe geweld en verwoesting weg, en doe recht en gerechtigheid; neem uw uitstotingen weg van Mijn volk, spreekt de Heere HEERE.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Jona 2:2-9": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen. En ik zei: Ik ben weggestoten van voor Uw ogen; toch zal ik de tempel van Uw heiligheid weer aanschouwen.", "Ps 32:6-8": "Hierom zal iedere heilige U aanbidden in de tijd dat U te vinden bent; ja, in een overstroming van grote wateren zullen zij hem niet aanraken. U bent mij een schuilplaats; U behoedt mij voor benauwdheid; U omringt mij met vrolijke gezangen van bevrijding. Sela. Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Jes 26:16": "HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.", "Ps 91:3-7": "Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie. Hij zal u dekken met Zijn vlerken, en onder Zijn vleugels zult u vertrouwen; Zijn waarheid is een schild en beukelaar. U zult niet vrezen voor de schrik van de nacht, voor de pijl die overdag vliegt;", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Ps 111:9": "Pe. Hij heeft Zijn volk verlossing gezonden; Tsade. Hij heeft Zijn verbond in eeuwigheid geboden; Koph. Zijn Naam is heilig en ontzagwekkend.", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "Jes 50:7-9": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Ps 34:23": "De HEERE verlost de ziel van Zijn knechten; en allen die op Hem vertrouwen, zullen niet schuldig verklaard worden.", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Ezech 9:4-6": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden. Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren.", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "Matt 5:4": "Zalig zijn zij die treuren, want zij zullen vertroost worden.", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "1 Sam 17:36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Ps 40:5": "Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot leugen afwijken.", "2 Sam 12:13": "Toen zei David tegen Nathan: Ik heb gezondigd tegen de HEERE! En Nathan zei tegen David: De HEERE heeft ook uw zonde weggenomen, u zult niet sterven.", "Hand 24:14": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is;", "Luk 17:6": "En de Heere zei: Als u een geloof had als een mosterdzaad, zou u tegen deze moerbeiboom zeggen: Word ontworteld en in de zee geplant, en hij zou u gehoorzaam zijn.", "Hebr 8:12": "Want Ik zal hun ongerechtigheden genadig zijn, en aan hun zonden en hun overtredingen zal Ik geenszins meer denken.", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Ezech 22:9": "Achterklappers zijn in u geweest om bloed te vergieten, en in u hebben zij op de bergen gegeten, zij hebben schandelijkheid in uw midden gedaan.", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "Openb 20:12": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken.", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "Job 38:8": "Of wie heeft de zee met deuren toegesloten, toen zij uitbrak, en uit de baarmoeder voortkwam?", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Hos 12:3": "Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Ef 1:6-8": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde; In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade, Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;", "Jes 60:16": "En u zult de melk van de heidenen zuigen, en u zult de borsten van de koningen zuigen; en u zult weten dat Ik de HEERE ben, uw Heiland, en uw Verlosser, de Machtige van Jakob.", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden."}, "not const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
