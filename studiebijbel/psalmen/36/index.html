","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm van David, de knecht van de HEERE, voor de koorleider[1].","2":"De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen.","3":"Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, *die* te haten is.","4":"De woorden van de mond van hem zijn onrecht en bedrog; hij laat na te verstaan tot weldoen.","5":"Hij bedenkt onrecht op zijn leger; hij stelt zich op een weg, die niet goed is; het kwaad verwerpt hij niet.","6":"O HEERE! Uw goedertierenheid is *tot* in de hemelen; Uw waarheid tot de bovenste wolken toe.","7":"Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.","8":"Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.","9":"Zij worden dronken van de vettigheid van uw huis; en U drenkt hen *uit* de beek van Uw wellusten.","10":"Want bij U is de fontein van het leven; in Uw licht zien wij het licht.","11":"Strek Uw goedertierenheid uit over degenen, die U kennen, en Uw gerechtigheid over de oprechten van hart.","12":"De voet van de hoogmoedigen komt niet over mij, en de hand van de goddelozen doet mij niet omzwerven.","13":"Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan."},"SV":{"1":"*Een* *psalm* van David, den knecht des HEEREN, voor den opperzangmeester.","2":"De overtreding des goddelozen spreekt in het binnenste van mijn hart: Er is geen vreze Gods voor zijn ogen.","3":"Want hij vleit zichzelven in zijn ogen, als men zijn ongerechtigheid bevindt, *die* te haten is.","4":"De woorden zijns monds zijn onrecht en bedrog; hij laat na te verstaan tot weldoen.","5":"Hij bedenkt onrecht op zijn leger; hij stelt zich op een weg, die niet goed is; het kwaad verwerpt hij niet.","6":"O HEERE! Uw goedertierenheid is *tot* in de hemelen; Uw waarheid tot de bovenste wolken toe.","7":"Uw gerechtigheid is als de bergen Gods, Uw oordelen zijn een grote afgrond; HEERE! Gij behoudt mensen en beesten.","8":"Hoe dierbaar is Uw goedertierenheid, o God! Dies de mensenkinderen onder de schaduw Uwer vleugelen toevlucht nemen.","9":"Zij worden dronken van de vettigheid Uws huizes; en Gij drenkt hen *uit* de beek Uwer wellusten.","10":"Want bij U is de fontein des levens; in Uw licht zien wij het licht.","11":"Strek Uw goedertierenheid uit over degenen, die U kennen, en Uw gerechtigheid over de oprechten van hart.","12":"De voet der hovaardigen kome niet over mij, en de hand der goddelozen doe mij niet omzwerven.","13":"Aldaar zijn de werkers der ongerechtigheid gevallen; zij zijn nedergestoten, en kunnen niet weder opstaan."},"KJV":{"1":"[[To the chief Musician, *A Psalm* of David the servant of the LORD.]] The transgression of the wicked saith within my heart, *that there is* no fear of God before his eyes.","2":"[[To the chief Musician, *A Psalm* of David the servant of the LORD.]] The transgression of the wicked saith within my heart, *that there is* no fear of God before his eyes.","3":"For he flattereth himself in his own eyes, until his iniquity be found to be hateful.","4":"The words of his mouth *are* iniquity and deceit: he hath left off to be wise, *and* to do good.","5":"He deviseth mischief upon his bed; he setteth himself in a way *that is* not good; he abhorreth not evil.","6":"Thy mercy, O LORD, *is* in the heavens; *and* thy faithfulness *reacheth* unto the clouds.","7":"Thy righteousness *is* like the great mountains; thy judgments *are* a great deep: O LORD, thou preservest man and beast.","8":"How excellent *is* thy lovingkindness, O God! therefore the children of men put their trust under the shadow of thy wings.","9":"They shall be abundantly satisfied with the fatness of thy house; and thou shalt make them drink of the river of thy pleasures.","10":"For with thee *is* the fountain of life: in thy light shall we see light.","11":"O continue thy lovingkindness unto them that know thee; and thy righteousness to the upright in heart.","12":"Let not the foot of pride come against me, and let not the hand of the wicked remove","13":"There are the workers of iniquity fallen: they are cast down, and shall not be able to rise."}},"tsk":{"2":[{"kopje":"goddeloze","refs":["Ps 18:2","Ps 90:1","Ps 143:12","Deut 34:5","2 Tim 2:24","Tit 1:1","Jak 1:1","2 Petr 1:1","Judas 1:1","Openb 1:1"]},{"kopje":"De overtreding","refs":["1 Sam 15:13","1 Sam 15:14","Spr 20:11","Matt 7:16-20","Matt 12:33","Matt 12:34","Tit 1:16"]},{"kopje":"geen","refs":["Ps 112:1","Gen 20:11","Spr 8:13","Spr 16:6","Pred 12:13","Rom 3:18"]}],"3":[{"kopje":"Want hij","refs":["Ps 10:3","Ps 49:19","Deut 29:19","Jer 2:23","Jer 2:34","Jer 2:35","Jer 17:9","Hos 12:8","Hos 12:9","Luk 10:29","Luk 16:14","Luk 16:15","Rom 7:9","Rom 10:3"]},{"kopje":"als","refs":["1 Sam 15:18-24","1 Kron 10:13","1 Kron 10:14","Rom 3:9"]}],"4":[{"kopje":"De woorden","refs":["Ps 5:10","Ps 12:3","Ps 12:4","Ps 55:22","Ps 58:4","Ps 140:4","1 Sam 18:21","1 Sam 19:6","1 Sam 19:7","1 Sam 26:21","Matt 22:15-18","Matt 22:35"]},{"kopje":"hij laat na","refs":["Ps 125:5","1 Sam 11:6-13","1 Sam 13:13","1 Sam 13:14","1 Sam 15:26","1 Sam 16:14 "10":"For with thee is the <span class=\"wl wl-kjv\" data-code=\"H4726\">fountain</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">life:</span> in thy <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> shall we <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> light.","11":"O <span class=\"wl wl-kjv\" data-code=\"H4900\">continue</span> thy <span class=\"wl wl-kjv\" data-code=\"H2617\">lovingkindness</span> unto them that <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> thee; and thy <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> to the <span class=\"wl wl-kjv\" data-code=\"H3477\">upright</span> in heart.","12":"Let not the <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> of <span class=\"wl wl-kjv\" data-code=\"H1346\">pride</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> against me, and let not the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> remove","13":"There are the <span class=\"wl wl-kjv\" data-code=\"H6466\">workers</span> of <span class=\"wl wl-kjv\" data-code=\"H205\">iniquity</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen:</span> they are cast <span class=\"wl wl-kjv\" data-code=\"H1760\">down,</span> and shall not be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to rise."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"opperzangmeester","tekst":"Zie Psa 4:1 ."},{"catchword":"De overtreding","tekst":"Dat is, als ik het boos en zorgeloos wezen en doen der goddelozen aanmerk en overweeg, zo word ik gedrongen bij mijzelven zo zeker te geloven dat zij geen vrees noch schrik voor God hebben, alsof de goddelozen zulks met ronde woorden zeiden; zo klaar blijkt de goddeloosheid in hunne werken, hetwelk mij wee doet in het binneste van mijn hart."}],"2":[{"catchword":"opperzangmeester","tekst":"Zie Psa 4:1 ."},{"catchword":"De overtreding","tekst":"Dat is, als ik het boos en zorgeloos wezen en doen der goddelozen aanmerk en overweeg, zo word ik gedrongen bij mijzelven zo zeker te geloven dat zij geen vrees noch schrik voor God hebben, alsof de goddelozen zulks met ronde woorden zeiden; zo klaar blijkt de goddeloosheid in hunne werken, hetwelk mij wee doet in het binneste van mijn hart."}],"3":[{"catchword":"als men","tekst":"Of, totdat men zijne ongerechtigheid bevindt, [die] te haten, of hatelijk [is]. Dat is, al wordt zijne boosheid gans openbaar en als handtastelijk, zulks dat zij van een ieder gehaat wordt, evenwel behaagt en pluimstrijkt hij zichzelven in het boze en gaat er immer in voort; anders; als hij zijne ongerechtigheid, dat is, zijn boos voornemen] volbrengt, of verkrijgt, die hij behoorde te haten; dat is, als het hem naar zijnen zin gaat, zo dunkt hem dat zijn doen goed is, hoewel hij een afschrik daarvan behoorde te hebben."}],"4":[{"catchword":"onrecht","tekst":"Dat is, ondeugdelijk, schadelijk en bedriegelijk, of strekkende tot verdriet, schenderij en bedrog der vromen."},{"catchword":"hij laat","tekst":"Dat is, hij wil zich van nieumand laten onderwijzen tot enige verbetering zijns levens, hij is vertwijfeld, hardnekkig en ongevoelig."}],"6":[{"catchword":"O HEERE","tekst":"Tegen al het woelen en woeden der goddelozen, mitsgaders zijn hartzeer, dat hij daaruit schepte, troost en verkwikt zich de profeet met betrachting van Gods onbegrijpelijke, ondoorgrondelijke en bestendige goedheid, trouw en gerechtigheid, die Hij bewijst in de regering zo van alles in het algemeen, als van zijn volk in het bijzonder, dat Hij, niettegenstaande der goddelozen vijandschap, overvloediglijk begenadigt en van hunner vijanden rechtvaardigen en eindelijken ondergang verzekert."}],"7":[{"catchword":"Gods","tekst":"Dat is, gelijk de allergrootste en allerhoogste bergen. Zie van deze manier van spreken Gen 13:10 . De zin is dat Gods gerechtigheid zich alom vertoont, bestendig en vast is, ook ons begrip verre teboven gaande. Zie vs.11."},{"catchword":"afgrond","tekst":"Dat is, uw raad en regering, of wijze van doen, die Gij houdt zo in de uitverkorenen en verworpenen, is ondoorgrondelijk. Zie Rom 11:33 ."},{"catchword":"mensen","tekst":"Hebr. mens en beest. Zie Mat 5:45 ; 1Ti 4:10 , en Job 39:1 , enz., Psa 147:9 ."}],"8":[{"catchword":"schaduw","tekst":"Zie Rth 2:12 . en verg. met deze plaats Job 36:11 . met de aantekening."}],"9":[{"catchword":"dronken","tekst":"Versta hier, de geestelijke spijs en drank der ziel. Zie Isa 25:6 ; Isa 65:13 ; Isa 66:11 . en verg. Psa 63:6 ; Psa 65:5 . Jer 31:12 , Jer 31:14 ; Jer 50:19 , idem het Hooglied van Salomo."}],"10":[{"catchword":"levens","tekst":"Dat is, een levende en altoosdurende fontein, waardoor de ziel geestelijk leeft, overvloediglijk gelaafd, onderhouden en verkwikt wordt. Verg. Joh 4:14 ; Joh 7:38-39 ; Jer 2:13 ; Jer 17:13 ."},{"catchword":"uw licht","tekst":"Dat is, als Gij ons door uw Heiligen Geest verlicht, en uw vaderlijk aanschijn in den Messias vertoont, dan bekomen wij het rechte verstand van uwe genadewerken en genieten een levenden troost en hartelijke blijdschap. Verg. Job 29:3 . Psa 4:6-7 ; Psa 27:1 , met de aantekening, Isa 9:1 . Jam 1:17 . idem voor zoveel dit de heerlijkheid des eeuwigen levens mede aangaat; Psa 16:11 ; Psa 17:15 . idem Zec 14:6-7 . Col 1:12 . Rev 21:11 , Rev 21:23 ; Rev 22:5 ."}],"11":[{"catchword":"Strek","tekst":"Of, ga voort, verleng, vervolg. Verg. Jer 31:3 ."},{"catchword":"uw gerechtigheid","tekst":"Die medebrengt dat Gij uwe beloften houdt, die oprecht van harte zijn beschermt, hunne vijanden straft, en alzo alles [niettegenstaande het goddeloze gewoel] in goede richtigheid houdt."}],"12":[{"catchword":"hovaardigen","tekst":"Hebr. der hovaardij; dat is, der hovaardigen, [zie Job 35:13 .] die mij onder de voeten zoeken te treden, of den voet mij op den nek te zetten."},{"catchword":"omzwerven","tekst":"Of, verjagen mij niet."}],"13":[{"catchword":"Aldaar","tekst":"Te weten, waar zij nu de vromen zochten en meenden // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},

     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);

    } else {

      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`

    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';

    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

function toggle(n) {

    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
