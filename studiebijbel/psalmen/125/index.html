re der heerlijkheid, niet met aanneming van de persoon. Want als er in uw samenkomst een man binnenkomt met een gouden ring aan de vinger, in sierlijke kleding, en er komt ook een arme man binnen met slechte kleding; en u zou opzien tegen hem die de sierlijke kleding draagt, en tegen hem zeggen: Ga hier op een goede plaats zitten; en zou tegen de arme zeggen: Ga daar staan, of: Ga hier onder mijn voetbank zitten;", "1 Tim 6:10": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.", "Jer 3:15": "En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Hebr 4:1-11": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "Zach 9:14-16": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden. De HEERE van de heerscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar. En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "Ps 64:11": "De rechtvaardige zal zich verblijden in de HEERE, en op Hem vertrouwen; en alle oprechten van hart zullen zich beroemen.", "Job 11:15-20": "Want dan zult u uw gezicht opheffen zonder smet, en zult vast staan, en niet vrezen. Want u zult de moeite vergeten, en er aan denken als aan water dat voorbijgegaan is. Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn.", "1 Kor 6:3": "Weet u niet, dat wij de engelen zullen oordelen? Hoeveel te meer de zaken die dit leven aangaan?", "Ps 102:15": "Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis.", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "Jes 52:7-12": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning. Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal. Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.", "Jes 14:3": "En het zal gebeuren op de dag, wanneer de HEERE u rust zal geven van uw smart, en van uw onrust, en van de harde dienstbaarheid waarin men u heeft laten dienen,", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "Deut 11:25": "Niemand zal voor uw aangezicht standhouden; de HEERE, uw God, zal de schrik en de vrees voor u geven over heel het land, waarop u treden zult, zoals Hij tot u gesproken heeft.", "Openb 2:4": "Maar Ik heb tegen u, dat u uw eerste liefde hebt verlaten.", "1 Kor 1:3": "Genade zij u en vrede van God onze Vader, en van de Heere Jezus Christus.", "Job 22:21-30": "Gewen u toch aan Hem, en heb vrede; daardoor zal het goede u overkomen. Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart. Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Ps 9:12": "Zingt psalmen voor de HEERE, Die te Sion woont; verkondigt onder de volken Zijn daden.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Deut 30:4": "Al waren uw verdrevenen aan het einde van de hemel, van daar zal de HEERE, uw God, u bijeenbrengen, en van daar zal Hij u halen.", "Ps 125:1-3": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid. Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid. Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "Luk 22:30": "opdat u eet en drinkt aan Mijn tafel in Mijn Koninkrijk, en zit op tronen, en de twaalf stammen van Israël oordeelt.", "Ezech 23:35": "Daarom, zo zegt de Heere HEERE: Omdat u Mij vergeten hebt, en Mij achter uw rug geworpen hebt, daarom draagt u ook uw schandelijkheid en uw hoererijen.", "Ef 1:22": "En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;", "Jes 12:6": "Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.", "Spr 24:16": "Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.", "1 Joh 3:2": "Geliefden, nu zijn wij kinderen van God, en het is nog niet openbaar geworden wat wij zijn zullen. Maar wij weten dat, als Hij geopenbaard zal zijn, wij Hem gelijk zullen zijn; want wij zullen Hem zien zoals Hij is.", "Jer 39:18": "Want Ik zal u zeker bevrijden, en u zult door het zwaard niet vallen; maar u zult uw leven als een buit hebben, omdat u op Mij vertrouwd hebt, spreekt de HEERE.", "1 Sam 12:23": "Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "Jes 10:20": "En het zal gebeuren op die dag, dat het overblijfsel van Israël, en wie ontkomen waren van het huis van Jakob, niet meer zullen steunen op hem die ze geslagen heeft; maar zij zullen steunen op de HEERE, de Heilige van Israël, oprecht.", "Rom 9:31-33": "Maar Israël, dat de wet van de rechtvaardigheid zocht, is tot de wet van de rechtvaardigheid niet gekomen. Waarom? Omdat zij die niet uit het geloof zochten, maar als het ware uit de werken van de wet; want zij hebben zich gestoten aan de steen des aanstoots; zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "Ef 2:22": "op Wie ook u mede gebouwd wordt tot een woonplaats van God in de Geest.", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "1 Joh 3:22": "en wat wij ook bidden, ontvangen wij van Hem, omdat wij Zijn geboden bewaren en doen wat welgevallig is voor Hem.", "1 Kor 13:10-12": "Maar wanneer het volmaakte gekomen zal zijn, dan zal wat ten dele is, tot niets gemaakt worden. Toen ik een kind was, sprak ik als een kind, was ik gezind als een kind, overlegde ik als een kind; maar toen ik een man geworden ben, heb ik wat bij een kind hoort tot niets gemaakt. Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Spr 28:5": "De kwade mensen begrijpen het recht niet; maar wie de HEERE zoeken, begrijpen alles.", "Jes 27:5": "Of hij moest Mijn sterkte aangrijpen, dan zal hij vrede met Mij maken; vrede zal hij met Mij maken.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Kol 2:2": "Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus;", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Gal 6:16": "En zovelen als er naar deze regel zullen wandelen, over hen zij vrede en barmhartigheid, en over het Israël van God.", "Gen 48:15": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "2 Tess 3:16": "De Heere nu van de vrede Zelf geeft u vrede te allen tijde, op allerlei wijze. De Heere zij met u allen.", "Nahum 1:12": "Zo zegt de HEERE: Al zijn zij voorspoedig, en al zijn er nog zoveel, toch zullen zij afgesneden worden, en hij zal doorgaan. Ik heb u wel vernederd, maar Ik zal u niet meer vernederen.", "Hebr 3:6": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Ps 4:9": "Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.", "Ps 122:3": "Jeruzalem is gebouwd als een stad die goed samengevoegd is;", "Deut 31:3": "De HEERE, uw God, Die zal voor u overtrekken; Die zal deze volken van voor u wegvagen, zodat u hen erfelijk bezit. Jozua zal voor u overtrekken, zoals de HEERE gesproken heeft.", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Jes 33:21": "Maar de HEERE zal daar bij ons heerlijk zijn, het zal een plaats zijn van rivieren, van wijde stromen; geen roeischuit zal daar doorvaren, en geen praalschip zal daar overvaren.", "Matt 24:31": "En Hij zal Zijn engelen uitzenden met een bazuin van groot geluid, en zij zullen Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het ene uiterste van de hemel tot het andere uiterste daarvan.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "Ps 36:11": "Strek Uw goedertierenheid uit over degenen, die U kennen, en Uw gerechtigheid over de oprechten van hart.", "Ps 73:1-28": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn. Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag.", "Ps 147:2": "De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël.", "Spr 28:1": "De goddelozen vluchten, terwijl geen vervolger er is; maar elke rechtvaardige is moedig, als een jonge leeuw.", "Openb 21:11": "En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "1 Petr 4:13": "maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.", "1 Kron 5:20": "Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden.", "Openb 21:2": "En ik, Johannes, zag de heilige stad, het nieuwe Jeruzalem, neerdalen van God uit de hemel, gereedgemaakt als een bruid, die voor haar man versierd is.", "1 Joh 2:28": "En nu, kinderen, blijft in Hem; opdat, wanneer Hij geopenbaard zal zijn, wij vrijmoedigheid hebben, en wij bij Zijn komst niet beschaamd worden voor Hem.", "Ps 122:7": "Vrede zij binnen uw vesting, welvaart in uw paleizen.", "1 Joh 5:4": "Want al wat uit God geboren is, overwint de wereld; en dit is de overwinning die de wereld overwint, namelijk ons geloof.", "1 Tess 5:23": "En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Ps 149:2": "Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning.", "Jak 1:25": "Maar wie zich verdiept in de volmaakte wet, die van de vrijheid is, en daarbij blijft, die is geen vergeetachtige hoorder geworden, maar een dader van het werk, die zal, zeg ik, gelukzalig zijn in dit zijn doen.", "Hebr 4:11": "Laat ons ons dan beijveren om die rust in te gaan, opdat niemand in hetzelfde voorbeeld van ongehoorzaamheid valt.", "Jak 1:6": "Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt.", "Luk 21:28": "Wanneer nu deze dingen beginnen te gebeuren, kijk dan omhoog, en hef uw hoofden opwaarts, omdat uw verlossing nabij is.", "Spr 10:23-25": "Het is voor de dwaas als een spel om iets schandelijks te doen; maar voor een man van verstand, om wijsheid te plegen. Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven. Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Jer 2:6": "En zij zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw van de dood, in een land waar niemand doorheen ging, en waar geen mens woonde?", "Ps 41:2": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads.", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "Luk 1:79": "om te verschijnen aan hen die gezeten zijn in duisternis en schaduw van de dood, om onze voeten te richten op de weg van de vrede.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "1 Kor 12:28": "En God heeft sommigen in de Gemeente gesteld: ten eerste apostelen, ten tweede profeten, ten derde leraars, daarna krachten, daarna gaven van gezondmaking, hulpverleningen, bestuur, allerlei talen.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Joël 2:15-17": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Ezech 37:26": "En Ik zal een verbond van vrede met hen sluiten, het zal een eeuwig verbond met hen zijn; en Ik zal ze vestigen en zal ze vermenigvuldigen, en Ik zal Mijn heiligdom in het midden van hen zetten tot in eeuwigheid.", "Dan 3:27": "Toen verzamelden zich de stadhouders, de overheden, de landvoogden, en de raadsheren van de koning, en zij zagen deze mannen, dat het vuur geen macht had gehad over hun lichamen, en dat het haar van hun hoofd niet verbrand was, en hun mantels niet veranderd waren, ja, dat de geur van het vuur er zelfs niet doorheen gegaan was.", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "Ezech 34:11-16": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Ezech 11:13": "Het gebeurde nu, toen ik profeteerde, dat Pelatja, de zoon van Benaja, stierf. Toen viel ik neer op mijn gezicht, en riep met luide stem, en zei: Ach, Heere HEERE! Zult U een volledig einde maken met het overblijfsel van Israël?", "Spr 22:19": "Opdat uw vertrouwen op de HEERE is, maak ik ze u vandaag bekend, ja, aan u.", "Joz 23:10": "Eén man onder u zal er duizend opjagen; want het is de HEERE, uw God, Zelf, Die voor u strijdt, zoals Hij tot u gesproken heeft.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Ex 9:26": "Alleen in het land Gosen, waar de kinderen van Israël waren, daar was geen hagel.", "Matt 13:43": "Dan zullen de rechtvaardigen stralen als de zon, in het Koninkrijk van hun Vader. Wie oren heeft om te horen, laat hij horen.", "Hand 3:16": "En door het geloof in Zijn Naam heeft Zijn Naam deze man sterk gemaakt, die u ziet en kent; en het geloof, dat door Hem is, heeft hem deze volmaakte gezondheid gegeven, in aanwezigheid van u allen.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "1 Petr 1:9": "en zo het einddoel van uw geloof bereikt, namelijk de zaligheid van de zielen.", "Ps 91:1-16": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige. Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie.", "Jes 59:2": "Maar uw ongerechtigheden brengen een scheiding tussen u en uw God, en uw zonden verbergen Zijn aangezicht voor u, zodat Hij niet hoort.", "1 Tim 3:14": "Deze dingen schrijf ik u, in de hoop spoedig bij u te komen;", "Ps 102:20": "Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben;", "Jes 1:8": "En de dochter van Sion is overgebleven als een hutje in de wijngaard, als een nachthutje in de komkommerhof, als een belegerde stad.", "Rom 2:7-9": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven; Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden; Verdrukking en benauwdheid over elke ziel van de mens die het kwade doet, eerst van de Jood, en ook van de Griek;", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Ps 102:14": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.", "Rom 14:17": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Job 34:29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "Jes 54:1-17": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "Matt 10:28-32": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel. Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Ex 6:5": "Daarom, zeg tegen de kinderen van Israël: Ik ben de HEERE! En Ik zal u uitleiden van onder de lasten van de Egyptenaren, en Ik zal u redden uit hun dienstbaarheid, en zal u verlossen door een uitgestrekte arm, en door grote gerichten;", "1 Petr 3:9-12": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven. Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Ps 19:15": "Laat de redenen van mijn mond, en de overdenking van mijn hart welgevallig zijn voor Uw aangezicht, o HEERE, mijn Rotssteen en mijn Verlosser!", "Fil 1:3-5": "Ik dank mijn God, zo dikwijls als ik aan u denk. (In elk gebed van mij voor u allen doe ik dat gebed altijd met blijdschap) Vanwege uw gemeenschap aan het Evangelie, vanaf de eerste dag tot nu toe;", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "1 Kor 15:48-57": "Zoals de aardse is, zo zijn ook de aardsen; en zoals de Hemelse is, zo zijn ook de hemelsen. En zoals wij het beeld van de aardse gedragen hebben, zo zullen wij ook het beeld van de Hemelse dragen. Maar dit zeg ik, broeders, dat vlees en bloed het Koninkrijk van God niet kunnen beërven, en de vergankelijkheid beërft de onvergankelijkheid niet.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Ps 78:5-7": "Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen; En dat zij hun hoop op God zouden stellen, en Gods daden niet vergeten, maar Zijn geboden bewaren;", "Mark 13:13": "En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "Ps 112:5": "Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht.", "Deut 33:25-29": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen! Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken. De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Luk 20:36": "want zij kunnen niet meer sterven, want zij zijn gelijk aan de engelen; en zij zijn kinderen van God, omdat zij kinderen van de opstanding zijn.", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "2 Kor 9:10": "Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid;", "Openb 2:5": "Bedenk dan waarvan u uitgevallen bent, en bekeer u, en doe de eerste werken; en zo niet, Ik zal u haastig bij komen, en zal uw kandelaar van zijn plaats wegnemen, als u zich niet bekeert.", "Hebr 10:35": "Werp dan uw vrijmoedigheid niet weg, die een grote beloning van loon heeft.", "Deut 23:14": "Want de HEERE, uw God, wandelt in het midden van uw leger, om u te verlossen, en om uw vijanden aan u over te geven; daarom zal uw leger heilig zijn, opdat Hij niets schandelijks onder u ziet, en Zich niet van u afkeert.", "Jes 60:1-6": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "Ps 134:1-3": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat! Hef uw handen op naar het heiligdom, en loof de HEERE. De HEERE zegent u uit Sion, Hij, Die de hemel en de aarde gemaakt heeft.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Num 14:43": "Want de Amalekieten en de Kanaänieten zijn daar vóór u, en u zult door het zwaard vallen; want omdat u zich hebt afgekeerd van de HEERE, zal de HEERE niet met u zijn.", "Matt 5:13": "U bent het zout der aarde; maar als het zout smakeloos wordt, waarmee zal het gezouten worden? Het deugt nergens meer toe dan om buiten geworpen en door de mensen vertrapt te worden.", "Spr 3:24": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn.", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "Spr 15:29": "De HEERE is ver van de goddelozen; maar het gebed van de rechtvaardigen zal Hij verhoren.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Jes 26:12": "HEERE, U zult ons vrede geven, want U hebt ook al onze zaken voor ons volbracht.", "Rom 5:1": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus;", "Jes 51:22": "Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.", "Ps 74:2": "Denk aan Uw vergadering, die U vanouds verworven hebt; de roede van Uw erfenis, die U verlost hebt; de berg Sion, waar U gewoond hebt.", "Mal 3:12": "En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "Jes 2:4": "En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Ef 2:7": "opdat Hij zou tonen in de toekomende eeuwen de uitnemende rijkdom van Zijn genade, door de goedertierenheid over ons in Christus Jezus.", "Ex 34:24": "Wanneer Ik de volken voor uw aangezicht uit hun bezit zal verdrijven, en uw grenzen verruimen, dan zal niemand uw land begeren, terwijl u erheen optrekt, om te verschijnen voor het aangezicht van de HEERE, uw God, driemaal in het jaar.", "Jer 13:11": "Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Hand 10:31": "en zie, een man stond voor mij, in een blinkend kleed, en zei: Cornelius! Uw gebed is verhoord, en uw aalmoezen zijn voor God in gedachtenis gekomen.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "1 Tim 4:8": "Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.", "Luk 10:20": "Maar verblijd u daar niet in, dat de geesten zich aan u onderwerpen; verblijd u veel meer dat uw namen opgeschreven zijn in de hemelen.", "Ps 103:14": "Want Hij weet wat voor maaksel wij zijn, en Hij denkt eraan dat wij stof zijn.", "Jes 32:1-8": "Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht. En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land. En de ogen van hen die zien, zullen niet terugzien, en de oren van hen die horen, zullen opmerken.", "Ef 1:23": "Welke Zijn lichaam is, en de vervulling van Hem die alles in allen vervult.", "Kol 3:4": "Wanneer nu Christus geopenbaard zal zijn, Die ons leven is, dan zult ook u met Hem geopenbaard worden in heerlijkheid.", "Openb 2:11": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, zal van de tweede dood geen schade lijden.", "Ps 32:6-8": "Hierom zal iedere heilige U aanbidden in de tijd dat U te vinden bent; ja, in een overstroming van grote wateren zullen zij hem niet aanraken. U bent mij een schuilplaats; U behoedt mij voor benauwdheid; U omringt mij met vrolijke gezangen van bevrijding. Sela. Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "Ezech 18:24": "Maar als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, en handelt naar al de gruwelen die de goddeloze doet, zou die leven? Al zijn gerechtigheden, die hij gedaan heeft, zullen niet aangerekend worden; door zijn overtreding, waardoor hij overtreden heeft, en door zijn zonde, die hij gezondigd heeft, daardoor zal hij sterven.", "Ps 91:3-7": "Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie. Hij zal u dekken met Zijn vlerken, en onder Zijn vleugels zult u vertrouwen; Zijn waarheid is een schild en beukelaar. U zult niet vrezen voor de schrik van de nacht, voor de pijl die overdag vliegt;", "Joh 12:26": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "Jes 50:7-9": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Ps 34:23": "De HEERE verlost de ziel van Zijn knechten; en allen die op Hem vertrouwen, zullen niet schuldig verklaard worden.", "Job 11:18": "En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen;", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Ps 91:7": "Aan uw zijden zullen er duizend vallen, en tienduizend aan uw rechterhand; tot u zal het niet naderen.", "1 Petr 3:5": "Want zo versierden zichzelf vroeger ook de heilige vrouwen, die op God hoopten, en die hun eigen mannen onderdanig waren;", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "Ps 101:3": "Ik zal geen slechte zaak voor mijn ogen stellen; ik haat het doen van de afvalligen, het zal mij niet aankleven.", "Ps 87:1-6": "Een psalm, een lied voor de kinderen van Korach. Zijn grondslag is op de bergen van heiligheid. De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob. Zeer heerlijke dingen worden van u gesproken, o stad van God! Sela.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Jer 30:17": "Want Ik zal u de gezondheid doen terugkeren, en u van uw plagen genezen, spreekt de HEERE; omdat zij u noemen: De verdrevene. Het is Sion, zeggen zij; niemand vraagt naar haar.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Ps 118:13": "U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "Ps 73:1": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn.", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "Ps 40:5": "Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot leugen afwijken.", "Jes 62:3": "En u zult een sierlijke kroon zijn in de hand van de HEERE, en een koninklijke hoed in de hand van uw God.", "Spr 3:25": "Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "1 Petr 1:21": "die door Hem gelooft in God, Die Hem uit de doden heeft opgewekt en Hem heerlijkheid gegeven heeft, zodat uw geloof en hoop op God gericht zouden zijn.", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Ps 28:8": "De HEERE is hun Sterkte, en Hij is de Sterkheid van de verlossingen van Zijn Gezalfde.", "Openb 22:4": "En zij zullen Zijn aangezicht zien, en Zijn Naam zal op hun voorhoofden zijn.", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Gen 31:3": "En de HEERE zei tegen Jakob: Keer terug naar het land van uw vaderen, en naar uw familie, en Ik zal met u zijn.", "Ps 44:21": "Als wij de Naam van onze God hadden vergeten, en onze handen tot een vreemde god uitgebreid,", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Gal 5:7": "U liep goed; wie heeft u verhinderd de waarheid niet gehoorzaam te zijn?", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Ps 137:1-6": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Ps 84:13": "HEERE van de heerscharen! gelukkig is de mens, die op U vertrouwt.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Hebr 6:7": "Want de aarde, die de regen indrinkt die er dikwijls op valt, en geschikt gewas voortbrengt voor hen door wie zij ook bewerkt wordt, die ontvangt zegen van God;", "Ps 133:1-3": "Een lied Hammaäloth, van David. Zie, hoe goed en hoe fijn is het, dat broeders ook samenwonen! Het is als de kostelijke olie op het hoofd, die neerdaalt op de baard, de baard van Aäron, die neerdaalt tot op de zoom van zijn kleren. Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Ps 17:15": "Maar ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal ontwaken.", "Hebr 5:12": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Luk 18:30": "die niet veel meer terug zal ontvangen in deze tijd, en in de toekomende eeuw het eeuwige leven.", "1 Tess 5:5-8": "U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis. Laten wij dan niet slapen, zoals de anderen, maar laten wij waken en nuchter zijn. Want wie slapen, slapen 's nachts, en wie dronken zijn, zijn 's nachts dronken;", "Jes 41:13": "Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Kol 2:1": "Want ik wil dat u weet hoe zware strijd ik voor u heb, en voor hen die in Laodicea zijn, en voor allen die mijn gezicht in het vlees niet gezien hebben;", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "Ezech 9:6": "Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
