en, ja, psalmzingen voor de HEERE.", "Ps 18:18": "Hij verloste mij van mijn sterke vijand, en van mijn haters, omdat zij machtiger waren dan ik.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Jer 31:28": "En het zal gebeuren, zoals Ik over hen gewaakt heb om uit te rukken, en af te breken, en te verstoren, en te verderven, en kwaad aan te doen; zo zal Ik over hen waken om te bouwen en te planten, spreekt de HEERE.", "Ps 22:6": "Tot U hebben zij geroepen, en zijn uitgered; op U hebben zij vertrouwd, en zijn niet beschaamd geworden.", "Ps 4:8": "U hebt vreugde in mijn hart gegeven, meer dan ten tijde dat hun koren en hun most vermenigvuldigd waren.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Luk 2:14": "Ere zij God in de hoogste hemelen, en vrede op aarde, in de mensen een welbehagen.", "Hand 5:38": "En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen gaan; want als deze raad of dit werk uit mensen is, zal het gebroken worden;", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "Jer 29:13": "En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.", "Micha 6:8": "Hij heeft u bekendgemaakt, o mens, wat goed is; en wat eist de HEERE van u, dan recht te doen, en weldadigheid lief te hebben, en ootmoedig te wandelen met uw God?", "Ps 39:11": "Neem Uw plaag van mij weg; ik ben bezweken door de slagen van Uw hand.", "Ps 121:3": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Ps 100:5": "Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Deut 30:1-10": "Verder zal het gebeuren, wanneer al deze dingen over u gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult u het weer ter harte nemen, onder alle volken, waarheen de HEERE, uw God, u gedreven heeft; En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.", "Ps 103:2-5": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden;", "Ps 119:116": "Ondersteun mij naar Uw toezegging, opdat ik leve; en laat mij niet beschaamd worden over mijn hoop.", "Jes 30:26": "En het licht van de maan zal zijn als het licht van de zon, en het licht van de zon zal zevenvoudig zijn als het licht van zeven dagen; op de dag dat de HEERE de breuk van Zijn volk zal verbinden, en de wond waarmee het geslagen is, genezen.", "Dan 12:13": "Maar u, ga heen tot het einde, want u zult rusten, en u zult opstaan in uw lot, aan het einde van de dagen.", "Luk 23:43": "En Jezus zei tegen hem: Voorwaar, Ik zeg u: Vandaag zult u met Mij in het Paradijs zijn.", "Luk 18:8": "Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde?", "Klaagl 1:9-11": "Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot. Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden. Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "Spr 11:6": "De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid.", "1 Joh 4:5": "Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Ps 115:12-14": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen. Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten. De HEERE zal de zegen over u vermeerderen, over u en over uw kinderen.", "Richt 9:24": "opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Num 9:23": "Naar het bevel van de HEERE legerden zij zich, en naar het bevel van de HEERE trokken zij verder; zij namen de wacht van de HEERE waar, naar het bevel van de HEERE, door de hand van Mozes.", "Ps 119:43": "En ruk het woord van de waarheid van mijn mond niet al te zeer, want ik hoop op Uw rechten.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Zef 3:12": "Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.", "Ps 97:12": "Rechtvaardigen, verblijd u in de HEERE, en spreek lof ter gedachtenis van Zijn heiligheid.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Jer 4:14": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?", "Ps 24:7": "Heft uw hoofden op, poorten, en verhef u, eeuwige deuren, opdat de Koning der ere ingaat!", "Jes 44:4": "En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.", "Hoogl 3:1-4": "Ik zocht 's nachts op mijn bed Hem, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet; ik zei: ... Ik zal nu opstaan, en in de stad omgaan, in de wijken en in de straten; ik zal Hem zoeken, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet. De wachters, die in de stad omgingen, vonden mij: ik zei: Hebt u Die gezien, Die mijn ziel liefheeft?", "Spr 12:26": "De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg van de goddelozen doet hen dwalen.", "Ps 41:2-4": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads. De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden. De HEERE zal hem ondersteunen op het ziekbed; in zijn ziekte verandert U zijn hele leger.", "Ps 21:2": "O HEERE! De koning is verblijd over Uw sterkte; en hoezeer is hij verheugd over Uw heil!", "Ps 7:3": "Anders zou hij mijn ziel roven als een leeuw, die verscheurt, terwijl er geen redder is.", "Hand 2:21": "En het zal gebeuren dat ieder die de Naam van de Heere zal aanroepen, behouden zal worden.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Klaagl 3:25": "Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt.", "Ex 13:21": "En de HEERE ging voor hun aangezicht uit, overdag in een wolkkolom om hen de weg te leiden, en 's nachts in een vuurkolom om hen licht te geven, zodat zij dag en nacht konden voortgaan.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Ps 91:1": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige.", "Luk 8:11-15": "Dit is nu de gelijkenis: het zaad is het Woord van God. Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden. En zij die op de rots bezaaid worden, zijn zij die, wanneer zij het gehoord hebben, het Woord met vreugde ontvangen; en dezen hebben geen wortel: zij geloven maar voor een tijd, en in de tijd van verzoeking wijken zij af.", "Ps 20:6-8": "Wij zullen juichen over Uw heil, en de vaandels opsteken in de Naam van onze God. De HEERE vervult al uw verlangens. Nu weet ik, dat de HEERE Zijn Gezalfde behoudt; Hij zal Hem verhoren uit de hemel van Zijn heiligheid; het heil van Zijn rechterhand zal zijn met machten. Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Rom 15:33": "En de God van de vrede zij met u allen. Amen.", "Ps 91:10": "U zal geen kwaad overkomen, en geen plaag zal uw tent naderen.", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Job 19:27": "Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.", "Jona 2:2": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Ps 29:11": "De HEERE zal Zijn volk sterkte geven; de HEERE zal Zijn volk zegenen met vrede.", "Rom 8:19": "Want de schepping verwacht, als met opgeheven hoofd, de openbaring van de kinderen van God.", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Ps 119:44": "Zo zal ik Uw wet voortdurend onderhouden, eeuwig en altijd.", "Jer 18:19": "HEERE, luister naar mij, en hoor naar de stem van hen die met mij twisten.", "Spr 19:23": "De vreze van de HEERE is ten leven; want men zal verzadigd zijnde overnachten; met het kwaad zal men niet bezocht worden.", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Ps 11:5": "De HEERE beproeft de rechtvaardige; maar de goddeloze, en wie geweld liefheeft, haat Zijn ziel.", "Jes 33:17": "Uw ogen zullen de Koning zien in Zijn schoonheid; zij zullen een ver gelegen land zien.", "Ps 119:84": "Hoeveel zullen de dagen van Uw knecht zijn? Wanneer zult U recht doen over mijn vervolgers?", "Matt 13:23": "Maar die in de goede aarde bezaaid is, dit is degene die het woord hoort en begrijpt, die ook vrucht draagt en voortbrengt, de een honderdvoud, de ander zestigvoud, en de ander dertigvoud.", "Luk 22:29": "En Ik ken u het Koninkrijk toe, zoals Mijn Vader dat Mij toegekend heeft;", "Ps 119:18-20": "Ontdek mijn ogen, dat ik aanschouw de wonderen van Uw wet. Ik ben een vreemdeling op de aarde, verberg Uw geboden voor mij niet. Mijn ziel is verbroken vanwege het verlangen naar Uw oordelen te aller tijd.", "Ps 31:21": "U verbergt hen in het verborgene van Uw aangezicht voor de hoogmoedigheden van de man; U versteekt hen in een hut voor de twist van de tongen.", "Joh 6:40": "En dit is de wil van Hem die Mij gezonden heeft: dat ieder die de Zoon aanschouwt en in Hem gelooft, het eeuwige leven heeft; en Ik zal hem opwekken op de laatste dag.", "Ps 130:1": "Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE!", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Ps 119:55": "HEERE! 's nachts ben ik Uw Naam indachtig geweest, en heb Uw wet bewaard.", "Matt 15:8": "Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij;", "Pred 12:11": "De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.", "Nahum 1:15": "Zie op de bergen de voeten van hem die het goede nieuws brengt, die vrede laat horen; vier uw feestdagen, o Juda! Betaal uw geloften; want de man van Belial zal voortaan niet meer door u heen gaan, hij is helemaal uitgeroeid.", "Ex 12:23": "Want de HEERE zal doorgaan, om de Egyptenaren te slaan; doch wanneer Hij het bloed zien zal aan de bovendorpel en aan de twee zijposten, zal de HEERE de deur voorbijgaan, en de verderver niet toelaten in uw huizen te komen om te slaan.", "Ps 40:14": "Het behaagt U, HEERE! mij te verlossen; HEERE! haast U tot mijn hulp.", "Luk 12:35-38": "Laat uw middel omgord zijn, en de lampen brandend. En wees zelf gelijk aan mensen die op hun heer wachten, wanneer hij terugkomt van de bruiloft, zodat zij, als hij komt en klopt, hem meteen kunnen opendoen. Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Ex 23:20-31": "Zie, Ik zend een Engel voor uw aangezicht, om u te behoeden op deze weg, en om u te brengen naar de plaats die Ik voorbereid heb. Wees op uw hoede voor Zijn aangezicht, en wees Zijn stem gehoorzaam, en verbitter Hem niet; want Hij zal uw overtredingen niet vergeven; want Mijn Naam is in Hem. Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Deut 27:3": "en u zult daarop alle woorden van deze wet schrijven, wanneer u overgestoken bent; opdat u komt in het land dat de HEERE, uw God, u geven zal, een land dat overvloeit van melk en honing, zoals de HEERE, de God van uw vaderen, u beloofd heeft.", "Ex 19:4": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb.", "2 Tim 1:10": "Doch nu geopenbaard is door de verschijning van onze Zaligmaker Jezus Christus, Die de dood tenietgedaan heeft, en het leven en de onvergankelijkheid aan het licht gebracht heeft door het Evangelie;", "Ps 22:5": "Op U hebben onze vaders vertrouwd; zij hebben vertrouwd, en U hebt hen uitgeholpen.", "Spr 6:20-23": "Mijn zoon, bewaar het gebod van uw vader, en verlaat de wet van uw moeder niet. Bind ze voortdurend aan uw hart, hecht ze aan uw hals. Als u wandelt, zal dat u leiden; als u neerligt, zal het over u de wacht houden; als u wakker wordt, zal het met u spreken.", "Hebr 4:2": "Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was.", "1 Tess 4:17": "Daarna zullen wij, die levend overgebleven zijn, samen met hen opgenomen worden in de wolken, de Heere tegemoet, in de lucht; en zo zullen wij altijd bij de Heere zijn.", "Ps 51:3-19": "Wees mij genadig, o God! naar Uw goedertierenheid; delg mijn overtreding uit, naar de grootheid van Uw barmhartigheden. Was mij goed van mijn ongerechtigheid, en reinig mij van mijn zonde. Want ik ken mijn overtredingen, en mijn zonde staat mij steeds voor ogen.", "Ps 142:3": "Ik stortte mijn klacht uit voor Zijn aangezicht; ik maakte voor Zijn aangezicht mijn benauwdheid bekend.", "Spr 30:5": "Elk woord van God is doorlouterd; Hij is een Schild voor hen die op Hem vertrouwen.", "Jes 49:17": "Uw zonen zullen zich haasten; maar uw verstoorders en uw verwoesters zullen van u uitgaan.", "Spr 11:18-21": "De goddeloze doet een vals werk; maar hem die gerechtigheid zaait, is een trouw loon toegezegd. Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt. De verkeerden van hart zijn de HEERE een gruwel; maar de oprechten van weg zijn Zijn welgevallen.", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "Ps 35:22": "HEERE! U hebt het gezien, zwijg niet; Heere! Wees niet ver van mij.", "Spr 16:11": "Een eerlijke weegschaal en balans zijn van de HEERE; alle gewichten in de zak zijn Zijn werk.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Amos 8:11-13": "Zie, de dagen komen, spreekt de Heere HEERE, dat Ik een honger in het land zal zenden; niet een honger naar brood, en geen dorst naar water, maar om de woorden van de HEERE te horen. En zij zullen zwerven van zee tot zee, en van het noorden tot het oosten; zij zullen rondlopen om het woord van de HEERE te zoeken, maar zullen het niet vinden. Op die dag zullen de mooie jonkvrouwen en de jongemannen van dorst versmachten;", "Ps 106:47": "Verlos ons, HEERE, onze God! en verzamel ons uit de heidenen, opdat wij de Naam van Uw heiligheid loven, ons beroemend in Uw lof.", "Jer 15:16": "Toen Uw woorden gevonden werden, heb ik ze opgegeten, en Uw woord is mij geweest tot vreugde en tot blijdschap van mijn hart; want ik ben naar Uw Naam genoemd, o HEERE, God van de heerscharen!", "1 Tess 1:1": "Paulus, en Silvanus, en Timotheüs, aan de Gemeente van de Thessalonicenzen, die is in God de Vader, en de Heere Jezus Christus: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Luk 21:18": "Toch zal er geen haar van uw hoofd verloren gaan.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ef 2:14-17": "Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken; en opdat Hij die beiden met God in één lichaam zou verzoenen door het kruis, nadat Hij de vijandschap daaraan gedood had.", "Ps 6:2-8": "O HEERE, straf mij niet in Uw toorn, en tuchtig mij niet in Uw grimmigheid! Wees mij genadig, HEERE, want ik ben verzwakt; genees mij, HEERE, want mijn beenderen zijn verschrikt. Ja, mijn ziel is zeer verschrikt; en U, HEERE, hoe lang nog?", "Luk 14:26-33": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn. En wie zijn kruis niet draagt en Mij navolgt, die kan Mijn discipel niet zijn. Want wie van u die een toren wil bouwen, gaat niet eerst zitten om de kosten te berekenen, of hij wel genoeg heeft om het af te maken?", "Spr 2:10-15": "Als de wijsheid in uw hart gekomen zal zijn, en de wetenschap voor uw ziel liefelijk zal zijn; Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden; Om u te redden van de kwade weg, van de man die verkeerdheden spreekt;", "Ps 33:10": "De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.", "Ps 141:2": "Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer.", "Zach 9:8": "En Ik zal Mij rondom Mijn huis legeren, vanwege het leger, vanwege de doorgaande, en vanwege de wederkerende, opdat de drijver niet meer door hen doorga; want nu heb Ik het met Mijn ogen aangezien.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Ps 27:8": "Mijn hart zegt tegen U: U zegt: Zoek Mijn aangezicht; ik zoek Uw aangezicht, o HEERE!", "Ps 59:10": "Tegen zijn sterkte zal ik op U wachten; want God is mijn Hoog Vertrek.", "Job 13:18": "Zie toch, ik heb de zaak ordelijk gesteld; ik weet dat ik rechtvaardig verklaard zal worden.", "Matt 26:44": "En Hij liet hen achter, ging opnieuw weg, en bad voor de derde keer, met dezelfde woorden.", "Ps 119:9-11": "Beth. Waarmee zal de jongeling zijn pad zuiver houden? Als hij dat houdt naar Uw woord. Ik zoek U met mijn hele hart, laat mij van Uw geboden niet afdwalen. Ik heb Uw rede in mijn hart verborgen, opdat ik tegen U niet zondigen zou.", "Ps 69:17": "Verhoor mij, o HEERE, want Uw goedertierenheid is goed; zie mij aan naar de grootheid van Uw barmhartigheden.", "Job 5:18-24": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen. In zes benauwdheden zal Hij u verlossen, en in de zevende zal het kwaad u niet aanraken. In de honger zal Hij u verlossen van de dood, en in de oorlog van het geweld van het zwaard.", "Ex 8:23": "En Ik zal een verlossing zetten tussen Mijn volk en uw volk; tegen morgen zal dit teken gebeuren!", "Ps 13:5": "Zodat mijn vijand niet zegt: Ik heb de overhand op hem gekregen; en mijn tegenstanders zich niet verheugen, wanneer ik zou wankelen.", "Joh 14:3": "En wanneer Ik heen zal zijn gegaan en u plaats zal hebben bereid, kom Ik terug en zal u tot Mij nemen, opdat u ook mag zijn waar Ik ben.", "Ps 5:3": "Let op de stem van mijn geroep, o mijn Koning en mijn God! Want tot U zal ik bidden.", "Ps 25:16-19": "Pe. Wend U tot mij, en wees mij genadig, want ik ben eenzaam en ellendig. Tsade. De benauwdheden van mijn hart hebben zich wijd uitgestrekt; voer mij uit mijn noden. Resch. Zie mijn ellende, en mijn moeite, en neem al mijn zonden weg.", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Ps 9:10": "En de HEERE zal een Hoog Vertrek zijn voor de verdrukte, een Hoog Vertrek in tijden van benauwdheid.", "Jes 12:1-6": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij. Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden. En u zult water scheppen met vreugde uit de fonteinen van het heil;", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Jes 37:35": "Want Ik zal deze stad beschermen om die te verlossen, omwille van Mijzelf, en omwille van David, Mijn knecht.", "Job 33:26": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven.", "Matt 22:23-32": "Diezelfde dag kwamen de Sadduceeën naar Hem toe, die zeggen dat er geen opstanding is, en vroegen Hem, En zeiden: Meester! Mozes heeft gezegd: Als iemand sterft zonder kinderen te hebben, zal zijn broer met zijn vrouw trouwen en voor zijn broer nakomelingen verwekken. Nu waren er bij ons zeven broers; en de eerste trouwde en stierf, en omdat hij geen kinderen had, liet hij zijn vrouw na aan zijn broer.", "Jes 66:14": "En u zult het zien, en uw hart zal vrolijk zijn, en uw beenderen zullen groeien als het tedere gras; dan zal de hand van de HEERE bekend worden aan Zijn knechten, en Hij zal boos worden op Zijn vijanden.", "Ps 94:12": "Gelukkig is de man, o HEERE! die Gij tuchtigt, en die Gij leert uit Uw wet,", "Joh 13:36": "Simon Petrus zei tegen Hem: Heere, waar gaat U heen? Jezus antwoordde hem: Waar Ik heenga, kunt u Mij nu niet volgen; maar u zult Mij later volgen.", "Ps 5:8": "Maar ik zal door de grootheid van Uw goedertierenheid in Uw huis ingaan; ik zal mij buigen naar het paleis van Uw heiligheid, in Uw vreze.", "Neh 12:43": "En zij offerden op die dag grote slachtoffers, en waren vrolijk; want God had hen vrolijk gemaakt met grote vrolijkheid; en ook de vrouwen en de kinderen waren vrolijk; zodat de vrolijkheid van Jeruzalem tot van verre gehoord werd.", "Hab 1:2": "HEERE! Hoe lang schreeuw ik, en U hoort niet, hoe lang roep ik: Geweld! tot U, en U verlost niet!", "Fil 1:19-21": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus. Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood. Want het leven is voor mij Christus, en het sterven is winst.", "Ps 12:8": "U, HEERE, zult hen bewaren; U zult hen behoeden voor dit geslacht, tot in eeuwigheid.", "1 Joh 3:3": "En ieder die deze hoop op Hem heeft, reinigt zichzelf, zoals Hij rein is.", "Ps 7:8": "Zo zal de vergadering van de volken U omringen; keer dan boven haar terug in de hoogte.", "1 Petr 4:2": "om niet meer naar de begeerten van de mensen, maar naar de wil van God de tijd te leven die nog over is in het vlees.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Dan 9:17-19": "En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf. Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn. O Heere, hoor! o Heere, vergeef! o Heere, merk op en doe het, wacht er niet mee! Om Uzelf, o mijn God! Want Uw stad, en Uw volk is naar Uw Naam genoemd.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Ps 119:125": "Ik ben Uw knecht, maak mij verstandig, en ik zal Uw getuigenissen kennen.", "Luk 15:22-32": "Maar de vader zei tegen zijn dienaren: Breng hier het beste kleed, en trek het hem aan, en geef hem een ring aan zijn hand, en schoenen aan zijn voeten; en breng het gemeste kalf, en slacht het; en laten wij eten en vrolijk zijn. Want deze zoon van mij was dood, en is weer levend geworden; en hij was verloren, en is gevonden! En zij begonnen vrolijk te zijn.", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "1 Kor 15:35-57": "Maar iemand zal zeggen: Hoe zullen de doden opgewekt worden, en met wat voor lichaam zullen zij komen? Dwaas die u bent, wat u zaait wordt niet levend, tenzij het gestorven is; en wat u zaait, daarvan zaait u niet het lichaam dat worden zal, maar een kaal graankorrel, naar het toevallig uitkomt, van tarwe of van een andere graansoort.", "Openb 22:1-5": "En hij toonde mij een zuivere rivier van het water des levens, klaar als kristal, die uit de troon van God en van het Lam kwam. In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen. En geen vervloeking zal er meer tegen iemand zijn; en de troon van God en van het Lam zal daar zijn, en Zijn dienstknechten zullen Hem dienen;", "Dan 3:16": "Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden.", "Deut 30:4": "Al waren uw verdrevenen aan het einde van de hemel, van daar zal de HEERE, uw God, u bijeenbrengen, en van daar zal Hij u halen.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Ps 104:34": "Mijn overdenking van Hem zal zoet zijn; ik zal mij in de HEERE verblijden.", "Luk 22:30": "opdat u eet en drinkt aan Mijn tafel in Mijn Koninkrijk, en zit op tronen, en de twaalf stammen van Israël oordeelt.", "1 Sam 12:23": "Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.", "1 Joh 3:2": "Geliefden, nu zijn wij kinderen van God, en het is nog niet openbaar geworden wat wij zijn zullen. Maar wij weten dat, als Hij geopenbaard zal zijn, wij Hem gelijk zullen zijn; want wij zullen Hem zien zoals Hij is.", "Spr 24:16": "Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Ps 69:33": "De zachtmoedigen, als zij dit gezien hebben, zullen zich verblijden; en u die God zoekt, uw hart zal leven.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Ps 21:8": "Want de koning vertrouwt op de HEERE, en door de goedertierenheid van de Allerhoogste zal hij niet wankelen.", "Ps 4:9": "Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.", "Ps 84:9": "HEERE, God van de heerscharen! hoor mijn gebed; neem het ter oren, o God van Jakob! Sela.", "Ex 5:2": "Maar Farao zei: Wie is de HEERE, Wiens stem ik gehoorzamen zou, om Israël te laten trekken? Ik ken de HEERE niet, en ik zal ook Israël niet laten trekken.", "Gen 6:9": "Dit zijn de afstammelingen van Noach. Noach was een rechtvaardig, oprecht man onder zijn tijdgenoten. Noach wandelde met God.", "Job 14:12": "Zo ligt de mens neer, en staat niet meer op; totdat de hemelen er niet meer zijn, zullen zij niet ontwaken, noch uit hun slaap opgewekt worden.", "Ps 73:1-28": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn. Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag.", "Ps 147:2": "De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël.", "Ps 125:5": "Maar die zich neigen tot hun kromme wegen, die zal de HEERE weg doen gaan met de werkers van de ongerechtigheid. Vrede zal over Israël zijn!", "Spr 2:2": "Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt;", "Neh 6:14": "Denk toch, mijn God, aan Tobia en aan Sanballat, naar deze daden van hen; en ook aan de profetes Noadja en de andere profeten, die mij bang hebben proberen te maken.", "Job 31:1": "Ik heb een verbond gemaakt met mijn ogen; hoe zou ik dan acht gegeven hebben op een maagd?", "Ps 149:5": "Laat Zijn gunstgenoten opspringen van vreugde vanwege die eer; laat hen juichen op hun rustplaatsen.", "Jer 7:5": "Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "1 Tess 1:6": "En u bent navolgers geworden van ons en van de Heere, doordat u het Woord aannam onder veel verdrukking, met blijdschap van de Heilige Geest;", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Luk 1:79": "om te verschijnen aan hen die gezeten zijn in duisternis en schaduw van de dood, om onze voeten te richten op de weg van de vrede.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "Amos 5:4-6": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef. Maar zoek Beth-el niet, en kom niet naar Gilgal, en trek niet over naar Ber-seba; want Gilgal zal zeker in gevangenschap weggevoerd worden, en Beth-el zal tot niets worden. Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "1 Petr 4:3": "Want het is ons genoeg dat wij in de voorgaande tijd van ons leven de wil van de heidenen volbracht hebben, en geleefd hebben in losbandigheid, begeerten, dronkenschap, zwelgpartijen, drinkgelagen en gruwelijke afgoderij;", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Ps 45:16": "Zij zullen geleid worden met alle blijdschap en verheuging; zij zullen ingaan in het paleis van de Koning.", "Ps 91:1-16": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige. Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie.", "Deut 30:9": "En de HEERE, uw God, zal u overvloed geven in al het werk van uw hand, in de vrucht van uw buik, en in de vrucht van uw vee, en in de vrucht van uw land, ten goede; want de HEERE zal Zich weer verblijden over u ten goede, zoals Hij Zich over uw vaderen verblijd heeft;", "Ps 119:70": "Hun hart is vet als smeer; maar ik heb vermaak in Uw wet.", "1 Joh 4:16": "En wij hebben de liefde gekend en geloofd, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem.", "Hebr 6:5": "en het goede woord van God geproefd hebben, en de krachten van de toekomende eeuw,", "Ps 60:14": "In God zullen wij kloeke daden doen, en Hij zal onze tegenstanders vertreden.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Jer 51:20": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.", "Ps 10:12-16": "Sta op, HEERE God! Hef Uw hand op, vergeet de ellendigen niet. Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken? U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Luk 6:35": "Maar heb uw vijanden lief, en doe goed, en leen, zonder iets terug te hopen; en uw loon zal groot zijn, en u zult kinderen van de Allerhoogste zijn; want Hij is goedertieren over de ondankbaren en de bozen.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Deut 33:25-29": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen! Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken. De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "Ps 102:2": "O HEERE! Hoor mijn gebed, en laat mijn geroep tot U komen.", "Ex 18:21": "Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien.", "Mal 2:6": "De wet van de waarheid was in zijn mond, en er werd geen onrecht in zijn lippen gevonden; hij wandelde met Mij in vrede en in rechtvaardigheid, en hij bekeerde er velen van ongerechtigheid.", "Deut 31:9-13": "En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël. En Mozes gebood hun: Aan het einde van elke zeven jaar, op de vastgestelde tijd van het jaar van de vrijlating, op het feest van de loofhutten, wanneer heel Israël zal komen om te verschijnen voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen, zult u deze wet voorlezen voor heel Israël, ten aanhoren van hen;", "Ps 100:2": "Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang.", "Deut 23:14": "Want de HEERE, uw God, wandelt in het midden van uw leger, om u te verlossen, en om uw vijanden aan u over te geven; daarom zal uw leger heilig zijn, opdat Hij niets schandelijks onder u ziet, en Zich niet van u afkeert.", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Fil 3:12-14": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben. Broeders, ik acht niet dat ik het zelf al gegrepen heb. Maar één ding doe ik: ik vergeet wat achter is, en strek mij uit naar wat voor is, en jaag naar het doel, naar de prijs van de roeping van God van boven in Christus Jezus.", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Zach 10:7": "En zij zullen zijn als een held van Efraïm, en hun hart zal zich verblijden als door de wijn; en hun kinderen zullen het zien en zich verblijden, hun hart zal zich verheugen in de HEERE.", "Spr 3:24": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "2 Kon 18:5": "Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.", "1 Sam 15:1-19": "Toen zei Samuël tegen Saul: De HEERE heeft mij gezonden om u tot koning te zalven over Zijn volk, over Israël; hoor dan nu naar de stem van de woorden van de HEERE. Zo zegt de HEERE van de heerscharen: Ik heb bezocht wat Amalek aan Israël gedaan heeft, hoe hij zich tegen hem gesteld heeft op de weg, toen hij uit Egypte opkwam. Ga nu heen, en sla Amalek, en verban alles wat hij heeft, en verschoon hem niet; maar dood van de man af tot de vrouw toe, van de kinderen tot de zuigelingen, van de ossen tot de schapen, van de kamelen tot de ezels toe.", "Matt 5:17": "Denk niet dat Ik gekomen ben om de wet of de profeten af te schaffen; Ik ben niet gekomen om die af te schaffen, maar om te vervullen.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "Openb 20:13": "En de zee gaf de doden, die in haar waren; en de dood en het rijk van de dood gaven de doden, die in hen waren; en zij werden geoordeeld, ieder naar zijn werken.", "Ps 20:2": "De HEERE verhoort u in de dag van benauwdheid; de Naam van de God van Jakob zet u in een hoog vertrek.", "Luk 6:24": "Maar wee u, rijken, want u hebt uw troost al gehad.", "Ps 91:2": "Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw!", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Ps 33:5": "Hij heeft gerechtigheid en recht lief; de aarde is vol van de goedertierenheid van de HEERE.", "Rom 12:12": "Verblijd u in de hoop. Wees geduldig in de verdrukking. Volhard in het gebed.", "Ps 30:12": "U hebt mijn weeklagen veranderd in een reidans; U hebt mijn rouwkleed losgemaakt, en mij met blijdschap omgord;", "Ps 86:3": "Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Ps 69:2-37": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel. Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij. Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.", "Luk 24:32": "En zij zeiden tegen elkaar: Was ons hart niet brandend in ons, toen Hij onderweg tot ons sprak, en toen Hij ons de Schriften opende?", "Jona 2:2-9": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen. En ik zei: Ik ben weggestoten van voor Uw ogen; toch zal ik de tempel van Uw heiligheid weer aanschouwen.", "Joh 2:22": "Daarom, toen Hij opgestaan was uit de doden, herinnerden Zijn discipelen zich dat Hij dit tegen hen had gezegd, en zij geloofden de Schrift en het woord dat Jezus gesproken had.", "1 Petr 4:7": "En het einde van alle dingen is nabij; wees dan nuchter en waak in de gebeden.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Jes 50:7-9": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "Ps 59:2-18": "Red mij van mijn vijanden, o mijn God! Stel mij in een hoog vertrek voor hen die tegen mij opstaan. Red mij van de werkers van de ongerechtigheid, en verlos mij van de mannen van het bloed. Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "Ps 119:146": "Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden.", "2 Sam 22:21": "De HEERE vergold mij naar mijn gerechtigheid; Hij gaf mij weer naar de reinheid van mijn handen.", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "Jes 26:19": "Uw doden zullen leven, ook mijn dode lichaam, zij zullen opstaan; waak op en juich, u die in het stof woont! Want uw dauw zal zijn als een dauw van de moeskruiden, en het land zal de overledenen uitwerpen.", "1 Sam 17:36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Ps 40:5": "Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot leugen afwijken.", "Hand 24:14": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is;", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Ps 119:45-52": "En ik zal wandelen in de ruimte, omdat ik Uw bevelen gezocht heb. Ook zal ik voor koningen spreken van Uw getuigenissen, en mij niet schamen. En ik zal mij vermaken in Uw geboden, die ik liefheb.", "Ps 24:3": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid?", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "Deut 4:8": "En welk groot volk is er, dat zulke rechtvaardige inzettingen en rechten heeft als deze hele wet, die ik vandaag voor u leg?", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Jes 41:16": "U zult ze wannen, en de wind zal ze wegvoeren, en de stormwind zal ze verstrooien; maar u zult u verheugen in de HEERE; in de Heilige van Israël zult u zich beroemen.", "Gen 1:26": "En God zei: Laat Ons mensen maken, naar Ons beeld, naar Onze gelijkenis; en laten zij heersen over de vissen van de zee, en over het gevogelte van de hemel, en over het vee, en over de hele aarde, en over al de kruipende dieren die op de aarde kruipen.", "Ps 39:2": "Ik zei: Ik zal op mijn wegen letten, dat ik niet zondig met mijn tong; ik zal mijn mond met een breidel in toom houden, terwijl de goddeloze nog tegenover mij is.", "Ps 141:1-10": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep. Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer. HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "Hebr 2:1-3": "Daarom moeten wij ons des te meer houden aan wat wij gehoord hebben, opdat wij het niet op enig moment laten wegglijden. Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft, hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Jes 45:1-6": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H8605\">Een</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8605\">gebed</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8605\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1732\">David</span>. <span class=\"wl\" data-l=\"L3\" data-code=\"H8085\">HEERE</span>! <span class=\"wl\" data-l=\"L3\" data-code=\"H8085\">Hoor</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8085\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6664\">gerechtigheid</span>, let op <span class=\"wl\" data-l=\"L5\" data-code=\"H7440\">mijn</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7440\">geschrei</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H238\">neem</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H238\">ter</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H238\">ore</span> <span clas /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
</body>
