de handelingen des mensen, ik heb mij, naar het woord Uwer lippen, gewacht voor de paden des inbrekers;", "5": "Houdende mijn gangen in Uw sporen, opdat mijn voetstappen niet zouden wankelen.", "6": "Ik roep U aan, omdat Gij mij verhoort; o God! neig Uw oor tot mij; hoor mijn rede.", "7": "Maak Uw weldadigheden wonderbaar, Gij, die verlost degenen, die op *U* betrouwen, van degenen, die tegen Uw rechterhand opstaan!", "8": "Bewaar mij als het zwart des oogappels, verberg mij onder de schaduw Uwer vleugelen,", "9": "Voor het aangezicht der goddelozen, die mij verwoesten, mijner doodsvijanden, die mij omringen.", "10": "Met hun vet besluiten zij *zich*, met hun mond spreken zij hovaardelijk.", "11": "In onzen gang hebben zij ons nu omsingeld, zij zetten hun ogen *op* *ons* ter aarde nederbukkende.", "12": "Hij is gelijk als een leeuw, die begeert te roven, en als een jonge leeuw, zittende in verborgen plaatsen.", "13": "Sta op, HEERE, kom zijn aangezicht voor, vel hem neder; bevrijd mijn ziel met Uw zwaard van den goddeloze;", "14": "Met Uw hand van de lieden, o HEERE! van de lieden, die van de wereld zijn, welker deel in dit leven is, welker buik Gij vervult met Uw verborgen *schat*; de kinderen worden verzadigd, en zij laten hun overschot hun kinderkens achter.", "15": "*Maar* ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal opwaken."}, "KJV": {"1": "[[A Prayer of David.]] Hear the right, O LORD, attend unto my cry, give ear unto my prayer, *that goeth* not out of feigned lips.", "2": "Let my sentence come forth from thy presence; let thine eyes behold the things that are equal.", "3": "Thou hast proved mine heart; thou hast visited *me* in the night; thou hast tried me, *and* shalt find nothing; I am purposed *that* my mouth shall not transgress.", "4": "Concerning the works of men, by the word of thy lips I have kept *me from* the paths of the destroyer.", "5": "Hold up my goings in thy paths, *that* my footsteps slip", "6": "I have called upon thee, for thou wilt hear me, O God: incline thine ear unto me, *and hear* my speech.", "7": "Shew thy marvellous lovingkindness, O thou that savest by thy right hand them which put their trust *in thee* from those that rise up", "8": "Keep me as the apple of the eye, hide me under the shadow of thy wings,", "9": "From the wicked that oppress me, *from* my deadly enemies, *who* compass me about.", "10": "They are inclosed in their own fat: with their mouth they speak proudly.", "11": "They have now compassed us in our steps: they have set their eyes bowing down to the earth;", "12": "Like as a lion *that* is greedy of his prey, and as it were a young lion lurking in secret places.", "13": "Arise, O LORD, disappoint him, cast him down: deliver my soul from the wicked, *which is* thy sword:", "14": "From men *which are* thy hand, O LORD, from men of the world, *which have* their portion in *this* life, and whose belly thou fillest with thy hid *treasure*: they are full of children, and leave the rest of their *substance* to their babes.", "15": "As for me, I will behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness."}}, "tsk": {"1": [{"kopje": "Hoor", "refs": ["Ps 7:9", "Ps 18:21", "Ps 43:1", "Ps 140:13", "1 Joh 3:21"]}, {"kopje": "let op", "refs": ["Ps 5:3", "Ps 55:3", "Ps 55:4", "Ps 61:2", "Ps 66:19", "Ps 142:7", "2 Kron 7:15", "Neh 1:6", "Dan 9:18", "Dan 9:19"]}, {"kopje": "met onbedriegelijke lippen", "refs": ["Ps 18:45", "Ps 145:18", "Jer 3:10", "Matt 15:8", "Joh 1:48"]}], "2": [{"kopje": "Laat mijn recht", "refs": ["Ps 37:6", "Ps 37:33", "2 Tess 1:6-9", "Judas 1:24"]}, {"kopje": "wat recht is", "refs": ["Ezech 18:25", "Ezech 18:29", "Ezech 33:17", "Ezech 33:20"]}], "3": [{"kopje": "geproefd", "refs": ["Ps 11:5", "Ps 26:2", "Ps 66:10", "Ps 139:1", "Job 23:10", "Zach 13:9", "Mal 3:2", "1 Kor 4:4", "1 Petr 1:7"]}, {"kopje": "U hebt", "refs": ["Ps 16:7", "Job 24:14", "Hos 7:6", "Micha 2:1", "Hand 16:9 rrey": [{"topic": "Assurance", "href": "../../torrey/a/#t-assurance", "kinderen": [{"label": "Saints Privileged To Have, Of", "href": "../../torrey/a/?hl=Ps.17.15#i1219", "refs": [], "kinderen": [{"label": "A glorious resurrection", "href": "../../torrey/a/?hl=Ps.17.15#i1233", "refs": [{"disp": "Job 19:26", "href": "../../job/19/#v26", "ref": "Job 19:26", "svLabel": null}, {"disp": "Ps 17:15", "href": "../../psalmen/17/#v15", "ref": "Ps 17:15", "svLabel": null}, {"disp": "Fil 3:21", "href": "../../filippenzen/3/#v21", "ref": "Fil 3:21", "svLabel": null}, {"disp": "1 Joh 3:2", "href": "../../1-johannes/3/#v2", "ref": "1 Joh 3:2", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Reward Of Saints, The", "href": "../../torrey/r/#t-reward-of-saints-the", "kinderen": [{"label": "Described As", "href": "../../torrey/r/?hl=Ps.17.15#i17573", "refs": [], "kinderen": [{"label": "Beholding the face of God", "href": "../../torrey/r/?hl=Ps.17.15#i17575", "refs": [{"disp": "Ps 17:15", "href": "../../psalmen/17/#v15", "ref": "Ps 17:15", "svLabel": null}, {"disp": "Matt 5:8", "href": "../../mattheus/5/#v8", "ref": "Matt 5:8", "svLabel": null}, {"disp": "Openb 22:4", "href": "../../openbaring/22/#v4", "ref": "Openb 22:4", "svLabel": null}], "kinderen": []}]}, {"label": "Is satisfying", "href": "../../torrey/r/?hl=Ps.17.15#i17607", "refs": [{"disp": "Ps 17:15", "href": "../../psalmen/17/#v15", "ref": "Ps 17:15", "svLabel": null}], "kinderen": []}]}, {"topic": "Righteousness", "href": "../../torrey/r/#t-righteousness", "kinderen": [{"label": "Saints", "href": "../../torrey/r/?hl=Ps.17.15#i17755", "refs": [], "kinderen": [{"label": "Shall see God's face in", "href": "../../torrey/r/?hl=Ps.17.15#i17783", "refs": [{"disp": "Ps 17:15", "href": "../../psalmen/17/#v15", "ref": "Ps 17:15", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Rom 14:22": "Hebt u geloof? Houd dat bij uzelf voor God. Zalig is hij die zichzelf niet oordeelt in wat hij voor goed houdt.", "Ps 119:60": "Ik heb gehaast, en niet vertraagd Uw geboden te onderhouden.", "Jes 55:11": "Zo zal Mijn woord, dat uit Mijn mond uitgaat, ook zijn, het zal niet leeg naar Mij terugkeren; maar het zal doen wat Mij behaagt, en het zal voorspoedig zijn in wat, waartoe Ik het zend.", "Ps 71:12": "O God, wees niet ver van mij; mijn God! haast U tot mijn hulp.", "Matt 14:30": "Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij!", "Dan 12:1": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.", "Ps 119:126": "Het is tijd voor de HEERE, dat Hij werkt, want zij hebben Uw wet verbroken.", "Spr 4:25-27": "Laat uw ogen recht vooruit zien, en uw oogleden zich recht voor u heen richten. Weeg de gang van uw voet, en laat al uw wegen vast staan. Wijk niet naar rechts of naar links, wend uw voet af van het kwade.", "1 Joh 2:8": "Opnieuw schrijf ik u een nieuw gebod: wat waar is in Hem, is ook waar in u; want de duisternis gaat voorbij, en het waarachtige licht schijnt nu.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "Jer 14:19-21": "Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking. HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd. Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "Ps 25:8-10": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg. Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren. Caph. Alle paden van de HEERE zijn goedertierenheid en waarheid, voor hun die Zijn verbond en Zijn getuigenissen bewaren.", "Deut 12:18": "Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt.", "Ps 62:6-8": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Fil 3:3": "Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.", "Joh 20:31": "maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam.", "1 Petr 1:7": "opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Ps 119:165": "Die Uw wet beminnen, hebben grote vrede, en zij hebben geen aanstoot.", "Ps 16:9": "Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten.", "Ps 88:10-15": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?", "Ps 119:61": "De goddeloze hopen hebben mij beroofd; nochtans heb ik Uw wet niet vergeten.", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Ps 119:121": "Ain. Ik heb recht en gerechtigheid gedaan; geef mij niet over aan mijn onderdrukkers.", "Ps 119:105": "Nun. Uw woord is een lamp voor mijn voet, en een licht voor mijn pad.", "Hebr 6:2": "van de leer van de dopen, en van de handoplegging, en van de opstanding van de doden, en van het eeuwige oordeel.", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "Ps 40:2-5": "Ik heb de HEERE lang verwacht; en Hij heeft Zich tot mij geneigd, en mijn geroep gehoord. En Hij heeft mij uit een ruisende kuil, uit modderig slijk opgehaald, en heeft mijn voeten op een rotssteen gesteld, Hij heeft mijn gangen vastgemaakt. En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.", "Ps 78:1": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Openb 13:6": "En het opende zijn mond tot lastering tegen God, om Zijn Naam te lasteren, en Zijn tabernakel, en hen die in de hemel wonen.", "Openb 14:1-3": "En ik zag, en zie, het Lam stond op de berg Sion, en met Hem honderdvierenveertigduizend, die de naam van Zijn Vader geschreven hadden op hun voorhoofden. En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers; en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.", "Matt 7:7-12": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden. Of welk mens is er onder u die, als zijn zoon hem om brood zou vragen, hem een steen zal geven?", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Ps 48:9": "Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "Ps 119:122": "Wees borg voor Uw knecht ten goede; laat de hoogmoedigen mij niet onderdrukken.", "Ezech 29:19": "Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "Jes 49:9-12": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn. Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden. En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Ps 84:3": "Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Ps 7:9": "De HEERE zal de volken recht doen; doe mij recht, HEERE, naar mijn gerechtigheid, en naar mijn oprechtheid, die bij mij is.", "Spr 15:19": "De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Ps 119:81-83": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt. Mijn ogen zijn bezweken van verlangen naar Uw toezegging, terwijl ik zei: Wanneer zult U mij vertroosten? Want ik ben geworden als een lederen zak in de rook; doch Uw inzettingen heb ik niet vergeten.", "2 Kon 19:34": "Want Ik zal deze stad beschermen, om die te verlossen, om Mijnentwil, en om de wil van David, Mijn knecht.", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Ps 66:16": "Komt, hoort toe, allen die God vrezen, en ik zal vertellen wat Hij aan mijn ziel gedaan heeft.", "Ps 18:2-4": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte! De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek. Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Ps 74:19": "Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.", "Rom 15:13": "De God nu van de hoop vervult u met alle blijdschap en vrede in het geloven, opdat u overvloedig mag zijn in de hoop, door de kracht van de Heilige Geest.", "Matt 5:3": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen.", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "2 Kron 36:23": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, dat in Juda is; wie is er onder u van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekt op.", "Matt 15:9": "Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Luk 1:53": "Hongerigen heeft Hij met goede dingen verzadigd; en rijken heeft Hij met lege handen weggestuurd.", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "Spr 3:13-18": "Gelukkig is de mens die wijsheid vindt, en de mens die verstandigheid voortbrengt! Want haar koophandel is beter dan de koophandel van zilver, en haar inkomst dan het uitgegraven goud. Zij is kostbaarder dan robijnen; en alles wat u kan verlangen, is met haar niet te vergelijken.", "Ps 35:25": "Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Gen 48:21": "Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Deut 27:2": "Het zal dan gebeuren, op de dag dat u de Jordaan overgestoken bent naar het land dat de HEERE, uw God, u geven zal, dat u grote stenen zult oprichten en ze met kalk bestrijken;", "Mal 3:7": "Vanaf de dag van uw vaderen af zijn jullie afgeweken van Mijn inzettingen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?", "Joh 12:21": "Dezen gingen dan naar Filippus, die van Bethsaïda in Galilea was, en vroegen hem: Heer, wij zouden Jezus graag zien.", "Ps 119:68": "U bent goed en goeddoend; leer mij Uw inzettingen.", "1 Joh 1:4": "En deze dingen schrijven wij u, opdat uw blijdschap vervuld is.", "Hebr 11:35": "de vrouwen hebben hun doden door de opstanding weer teruggekregen; en anderen zijn gefolterd, en wilden de aangeboden verlossing niet aannemen, opdat zij een betere opstanding zouden verkrijgen.", "2 Kor 4:16-18": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Ps 130:5": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "1 Sam 26:11": "De HEERE late het verre van mij zijn, dat ik mijn hand zou leggen aan de gezalfde van de HEERE! Neem toch nu de speer die bij zijn hoofdeinde ligt, en de waterfles, en laten we gaan.", "Ps 116:4": "Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.", "Ps 143:6": "Ik breid mijn handen uit tot U; mijn ziel is voor U als een dorstig land. Sela.", "Spr 28:4": "Wie de wet verlaten, prijzen de goddelozen; maar wie de wet bewaren, gaan de strijd met hen aan.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "Openb 1:2": "die het woord van God betuigd heeft, en de getuigenis van Jezus Christus, en alles wat hij gezien heeft.", "Ps 56:12": "Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?", "Ps 7:12-14": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt. Als hij zich niet bekeert, zal Hij Zijn zwaard scherpen; Hij heeft Zijn boog gespannen, en hem gereedgemaakt. En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ps 40:10": "Ik verkondig de gerechtigheid in de grote gemeente; zie, mijn lippen bedwing ik niet; HEERE! Gij weet het.", "Job 5:11": "Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "Luk 24:52": "En zij aanbaden Hem, en keerden terug naar Jeruzalem met grote blijdschap.", "Ps 119:93": "Ik zal Uw bevelen in de eeuwigheid niet vergeten, want daardoor hebt U mij levend gemaakt.", "Ps 80:15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,", "Ps 107:8": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Ezech 3:3": "En Hij zei tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honing, vanwege de zoetheid.", "Matt 4:7": "Jezus zei tegen hem: Er is ook geschreven: U zult de Heere, uw God, niet beproeven.", "2 Kor 4:14": "Wetend dat Hij, Die de Heere Jezus opgewekt heeft, ook ons door Jezus zal opwekken, en met u daar zal stellen.", "Ps 119:9": "Beth. Waarmee zal de jongeling zijn pad zuiver houden? Als hij dat houdt naar Uw woord.", "1 Sam 2:1": "Toen bad Hanna en zei: Mijn hart springt van vreugde op in de HEERE; mijn hoorn is verhoogd in de HEERE; mijn mond is wijd opengedaan over mijn vijanden; want ik verheug mij in Uw heil.", "Ps 119:140-144": "Uw woord is zeer gelouterd, en Uw knecht heeft het lief. Ik ben klein en veracht, doch Uw bevelen vergeet ik niet. Uw gerechtigheid is gerechtigheid in eeuwigheid, en Uw wet is de waarheid.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Spr 28:12": "Als de rechtvaardigen opspringen van vreugde, is er grote heerlijkheid; maar als de goddelozen opkomen, wordt de mens angstvallig gezocht.", "2 Kron 30:18": "Want een menigte van het volk, velen uit Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet zoals geschreven is. Doch Hizkia bad voor hen, en zei: De HEERE, die goed is, doe verzoening voor ieder,", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Jer 31:12-14": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn. Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis. En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "Spr 22:12": "De ogen van de HEERE bewaren de kennis; maar de zaken van de trouweloze zal Hij omkeren.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "Jes 44:23": "Zing met vreugde, u hemelen! Want de HEERE heeft het gedaan; juich, u onderste delen van de aarde! U bergen! Maak een groot gedreun met vreugdegezang, u bossen, en al het geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.", "Ps 119:48": "En ik zal mijn handen opheffen naar Uw geboden, die ik liefheb, en ik zal Uw inzettingen betrachten.", "Spr 15:21": "De dwaasheid is voor de verstandeloze een blijdschap; maar een man van verstand gaat recht zijn weg.", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Ps 100:1": "Een lofzang. Heel de aarde, juich voor de HEERE!", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Spr 8:17": "Ik heb hen lief die Mij liefhebben; en die Mij vroeg zoeken, zullen Mij vinden.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "Job 27:14-17": "Indien zijn kinderen zich vermenigvuldigen, het is voor het zwaard; en zijn spruiten zullen van brood niet verzadigd worden. Zijn overgeblevenen zullen in de dood begraven worden, en zijn weduwen zullen niet wenen. Zo hij zilver opgehoopt zal hebben als stof, en kleding bereid als leem;", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "Ps 88:3": "Laat mijn gebed voor Uw aangezicht komen; neig Uw oor tot mijn geschrei.", "Ps 43:1": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht.", "Deut 17:18": "Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Jes 45:2": "Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan.", "Deut 4:30": "Wanneer u in angst zult zijn, en al deze dingen u zullen treffen, in de laatste dagen, dan zult u terugkeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn.", "Jes 8:16": "Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "Ezech 21:27": "Ik zal die kroon omgekeerd, omgekeerd, omgekeerd neerzetten; ja, zij zal er niet zijn, totdat hij komt die daartoe recht heeft, en aan wie Ik hem geven zal.", "Job 31:33": "Als ik, net als Adam, mijn overtredingen bedekt heb, door eigenliefde mijn misdaad verbergende!", "Dan 9:18": "Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn.", "2 Kon 19:22": "Wie hebt u gehoond en gelasterd? En tegen wie hebt u de stem verheven, en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "Ps 94:19": "Toen mijn gedachten in mij talrijk werden, hebben Uw vertroostingen mijn ziel verkwikt.", "Ps 73:25": "Aan wie heb ik behalve U iets in de hemel? Behalve U verlang ik ook niets op de aarde!", "Ps 119:23-25": "Als zelfs de vorsten zittend tegen mij gesproken hebben, heeft Uw knecht Uw inzettingen betracht. Ook zijn Uw getuigenissen mijn vermakingen, en mijn raadslieden. Daleth. Mijn ziel kleeft aan het stof; maak mij levend naar Uw woord.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Joz 8:32-35": "Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël. En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen. En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "1 Joh 2:21": "Ik heb u niet geschreven, omdat u de waarheid niet weet, maar omdat u die weet, en omdat geen leugen uit de waarheid is.", "Job 10:9": "Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Job 10:7": "Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlost.", "1 Tess 4:1": "Verder dan, broeders, wij bidden en vermanen u in de Heere Jezus, zoals u van ons ontvangen hebt hoe u moet wandelen en God behagen, dat u daarin meer overvloedig wordt.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Hab 3:17-19": "Alhoewel de vijgenboom niet bloeien zal, en er geen vrucht aan de wijnstok zal zijn, dat het werk van de olijfboom liegen zal, en de velden geen voedsel voortbrengen; dat men de kudde uit de kooi zal wegscheuren, en dat er geen rund in de stallen zal zijn; Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil. De HEERE Heere is mijn Sterkte; en Hij zal mijn voeten maken als die van de hinden, en Hij zal mij doen treden op mijn hoogten. Voor de koorleider, op mijn Neginoth.", "Ps 119:115": "Wijkt van mij, u boosdoeners! dat ik de geboden van mijn God moge bewaren.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ps 141:8": "Doch op U zijn mijn ogen, HEERE, Heere; op U vertrouw ik, ontbloot mijn ziel niet.", "Job 23:10": "Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.", "Job 23:12": "Het gebod van Zijn lippen heb ik ook niet weggedaan; de woorden van Zijn mond heb ik meer weggelegd dan mijn bescheiden deel.", "Ps 57:9": "Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken.", "Ps 13:2-5": "Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen? Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn? Kijk naar mij, verhoor mij, HEERE, mijn God; verlicht mijn ogen, zodat ik niet in de dood ontslaap;", "Zef 3:19": "Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "Spr 11:11": "Door de zegen van de oprechten wordt een stad verheven; maar door de mond van de goddelozen wordt zij verbroken.", "2 Kor 5:11": "Wij dan, die de schrik van de Heere kennen, bewegen de mensen tot het geloof, en wij zijn openbaar geworden voor God; en ik hoop dat wij ook in uw gewetens geopenbaard zijn geworden.", "Matt 13:15": "Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Gen 32:11": "Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Luk 18:19": "En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God.", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Gen 39:7-10": "En het gebeurde na deze dingen, dat de vrouw van zijn heer haar ogen op Jozef liet vallen; en zij zei: lig bij mij! Maar hij weigerde het, en zei tegen de vrouw van zijn heer: Zie, mijn heer weet niet, met mij hier, wat er in het huis is; en alles wat hij heeft, heeft hij in mijn hand gegeven. Niemand is groter in dit huis dan ik, en hij heeft mij niets onthouden, behalve u, omdat u zijn vrouw bent; hoe zou ik dan dit zo grote kwaad doen, en zondigen tegen God!", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "Deut 29:29": "De verborgen dingen zijn voor de HEERE, onze God; maar de geopenbaarde dingen zijn voor ons en voor onze kinderen, tot in eeuwigheid, om al de woorden van deze wet te doen.", "2 Kor 7:2": "Geef ons plaats; wij hebben niemand onrecht aangedaan, wij hebben niemand verdorven, wij hebben bij niemand ons voordeel gezocht.", "Ps 125:1": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid.", "Dan 8:26": "Het gezicht nu van de avond en de morgen, dat verteld is, is waar; en u, houd dit gezicht geheim, want er zijn nog veel dagen tot die tijd.", "2 Kon 19:16": "HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.", "Ps 25:8": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.", "Joël 1:19": "Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.", "Ps 138:5": "En zij zullen zingen van de wegen van de HEERE, want de heerlijkheid van de HEERE is groot.", "Rom 6:17": "Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;", "2 Tim 1:13": "Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "Ps 119:114": "U bent mijn Schuilplaats en mijn Schild; op Uw Woord heb ik gehoopt.", "Job 22:18": "Hij had immers hun huizen met goed gevuld; daarom is de raad van de goddelozen ver van mij.", "Ps 18:19": "Zij hadden mij bejegend ten dage van mijn ongeval; maar de HEERE was mij tot een Steunsel.", "Openb 1:18": "en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood.", "Ps 73:2-22": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Lev 26:40-42": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Matt 19:21": "Jezus zei tegen hem: Als u volmaakt wilt zijn, ga heen, verkoop wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom hier, volg Mij.", "Jer 2:20": "Toen Ik van oude tijden af uw juk verbroken, en uw banden verscheurd had, zei u: Ik zal niet dienen; maar op alle hoge heuvels en onder elke groene boom loopt u om, hoererend.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Jes 37:17": "O HEERE, neig Uw oor en hoor; HEERE, doe Uw ogen open en zie; en hoor al de woorden van Sanherib, die gezonden heeft om de levende God te honen.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Joz 14:6-14": "Toen naderden de kinderen van Juda tot Jozua, te Gilgal, en Kaleb, de zoon van Jefunne, de Keneziet, zei tegen hem: U weet het woord dat de HEERE tot Mozes, de man van God, gesproken heeft te Kades-Barnea, vanwege mij, en vanwege u. Ik was veertig jaar oud, toen Mozes, de dienaar van de HEERE, mij uitgezonden heeft van Kades-Barnea om het land te verkennen, en ik hem antwoord bracht, zoals het in mijn hart was. Maar mijn broeders, die met mij opgegaan waren, deden het hart van het volk smelten; maar ik volhardde erin de HEERE, mijn God, na te volgen.", "Ps 73:28": "Maar wat mij aangaat, het is mij goed om dicht bij God te zijn; ik stel mijn vertrouwen op de Heere HEERE, om al Uw werken te vertellen.", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Jes 63:7": "Ik zal de blijken van goedertierenheid van de HEERE vermelden, de veelvoudige lof van de HEERE, naar alles wat de HEERE ons heeft bewezen, en de grote goedheid aan het huis van Israël, die Hij hun bewezen heeft, naar Zijn barmhartigheden, en naar de veelheid van Zijn blijken van goedertierenheid.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Ps 119:14-16": "Ik ben vrolijker in de weg van Uw getuigenissen, dan over alle rijkdom. Ik zal Uw bevelen overdenken, en op Uw paden letten. Ik zal mijzelf vermaken in Uw inzettingen; Uw woord zal ik niet vergeten.", "Num 14:9": "Wees alleen niet opstandig tegen de HEERE! En vrees het volk van dit land niet; want zij zijn ons brood! Hun bescherming is van hen geweken, en de HEERE is met ons; vrees hen niet!", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "Jes 42:13": "De HEERE zal uittrekken als een held; Hij zal de ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot geschreeuw maken; Hij zal Zijn vijanden overweldigen.", "Hebr 11:16-39": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt. Door het geloof heeft Abraham, toen hij beproefd werd, Izak geofferd, en hij die de beloften ontvangen had, heeft zijn enige zoon geofferd, (tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Ps 17:6-9": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden. Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan! Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,", "Ps 108:7": "Opdat Uw beminden bevrijd worden; geef heil door Uw rechterhand, en verhoor ons.", "Est 9:25": "Maar toen zij voor de koning gekomen was, heeft hij door brieven bevolen dat zijn boze plan, dat hij bedacht had tegen de Joden, op zijn eigen hoofd zou terugkeren; en men heeft hem en zijn zonen aan de galg gehangen.", "Spr 10:9": "Wie in oprechtheid wandelt, wandelt zeker; maar wie zijn wegen verdraait, zal bekend worden.", "Ps 90:1": "Een gebed van Mozes, de man van God. Heere! U bent ons geweest een Toevlucht van geslacht tot geslacht.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "2 Tim 2:15": "Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt.", "Jes 37:20": "Nu dan, HEERE, onze God, verlos ons uit zijn hand, zodat alle koninkrijken van de aarde weten dat U alleen de HEERE bent.", "2 Tim 2:18": "die van de waarheid zijn afgeweken, en zeggen dat de opstanding al gebeurd is, en het geloof van sommigen omverwerpen.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "Ps 64:3": "Verberg mij voor de heimelijke afspraken van de boosdoeners, voor het oproer van de werkers van ongerechtigheid.", "Ezra 8:23": "Zo vastten wij en verzochten dat van onze God; en Hij liet Zich door ons verbidden.", "Ps 119:145": "Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren.", "1 Tess 4:2": "Want u weet, wat bevelen wij u gegeven hebben door de Heere Jezus.", "1 Sam 9:16": "Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is.", "Ex 11:7": "Maar bij alle kinderen van Israël zal geen hond zijn tong bewegen, van de mensen af tot de beesten toe; opdat u weet dat de HEERE tussen de Egyptenaren en tussen de Israëlieten een afzondering maakt.", "Joh 15:19": "Als u van de wereld was, zou de wereld het hare liefhebben; maar omdat u van de wereld niet bent, maar Ik u uit de wereld heb uitverkoren, daarom haat de wereld u.", "Ps 136:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Klaagl 2:19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "1 Kor 2:13": "Die dingen spreken wij ook, niet met woorden die de menselijke wijsheid leert, maar met woorden die de Heilige Geest leert, terwijl wij geestelijke dingen met geestelijke vergelijken.", "Deut 31:26": "Neem dit wetboek, en leg het aan de zijde van de ark van het verbond van de HEERE, uw God, opdat het daar tot getuige zij tegen u.", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "Ps 119:89": "Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen.", "Hebr 10:28": "Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "Ps 61:2": "O God! hoor mijn geschrei, merk op mijn gebed.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Deut 16:20": "Gerechtigheid, gerechtigheid zult u najagen; opdat u leeft, en het land erfelijk bezit dat de HEERE, uw God, u geven zal.", "Luk 1:38": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "2 Petr 3:1": "Deze tweede brief, geliefden, schrijf ik nu aan u; in beide brieven wek ik door herinnering uw oprechte gemoed op;", "1 Tess 4:14": "Want als wij geloven dat Jezus gestorven is en opgestaan, zo zal God ook hen die in Jezus ontslapen zijn, met Hem terug brengen.", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Jak 3:2": "Want wij struikelen allen in veel dingen. Als iemand in woorden niet struikelt, die is een volmaakt man, in staat om ook het hele lichaam in toom te houden.", "Joh 17:22": "En Ik heb hun de heerlijkheid gegeven die U Mij gegeven hebt; opdat zij één zijn, zoals Wij Eén zijn;", "Spr 3:23": "Dan zult u uw weg zeker gaan, en u zult uw voet niet stoten.", "Hebr 1:2": "Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft;", "Ps 15:1-5": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "Ps 66:20": "Geloofd zij God, Die mijn gebed niet heeft afgewend, en Zijn goedertierenheid niet van mij.", "Openb 1:3": "Zalig is hij die leest, en zij die horen de woorden van deze profetie, en die bewaren wat daarin geschreven is; want de tijd is nabij.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Ef 1:12": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.", "Hand 4:2": "Zeer ontevreden, omdat zij het volk leerden en in Jezus de opstanding uit de doden verkondigden.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Matt 19:17": "En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Ps 119:76": "Laat toch Uw goedertierenheid zijn om mij te troosten, naar Uw toezegging aan Uw knecht.", "1 Tess 2:10": "U bent getuigen, en God ook, hoe heilig, en rechtvaardig, en onberispelijk wij ons onder u, die gelooft, gedragen hebben.", "1 Tim 4:5": "want het wordt geheiligd door het Woord van God en door het gebed.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Hebr 11:10": "Want hij verwachtte de stad die fundamenten heeft, waarvan God de Ontwerper en Bouwer is.", "Ps 86:5": "Want Gij, Heere! zijt goed, en vergeeft graag, en van grote goedertierenheid voor allen die U aanroepen.", "Ps 30:13": "Opdat mijn eer voor U psalmen zingt, en niet zwijgt. HEERE, mijn God! in eeuwigheid zal ik U loven.", "Ps 64:2": "Hoor, o God, mijn stem in mijn geklaag; behoed mijn leven voor de schrik van de vijand.", "Spr 11:5": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid.", "1 Kor 15:12-32": "Als nu van Christus gepredikt wordt dat Hij uit de doden opgewekt is, hoe zeggen sommigen onder u dat er geen opstanding van de doden is? En als er geen opstanding van de doden is, dan is Christus ook niet opgewekt. En als Christus niet opgewekt is, dan is onze prediking zonder inhoud, en is ook uw geloof zonder inhoud.", "Jak 1:2": "Acht het voor grote vreugde, mijn broeders, wanneer u in allerlei verzoekingen valt;", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Ps 35:23": "Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.", "Ezech 34:22": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee.", "Spr 12:22": "Valse lippen zijn de HEERE een gruwel; maar wie trouw handelen, zijn Zijn welgevallen.", "1 Tess 5:16": "Wees blij, altijd.", "2 Tim 2:9": "waarvoor ik verdrukkingen lijd tot aan boeien toe, als een misdadiger; maar het Woord van God is niet gebonden.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Matt 24:42-44": "Waak dan, want u weet niet in welk uur uw Heere komen zal. Maar weet dit, dat als de heer des huizes geweten had in welke nachtwake de dief komen zou, hij gewaakt zou hebben en niet zou hebben toegelaten dat zijn huis werd doorgraven. Daarom, wees ook u bereid, want op een uur dat u het niet verwacht, zal de Zoon des mensen komen.", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "1 Petr 2:12": "En houd uw levenswandel eerlijk onder de heidenen; opdat, waar zij nu kwaad van u spreken als van kwaaddoeners, zij door de goede werken die zij van u zien, God mogen verheerlijken op de dag dat Hij naar hen omziet.", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "Klaagl 5:19-22": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht. Waarom zou U ons voor altijd vergeten? Waarom zou U ons zo lange tijd verlaten? HEERE, bekeer ons tot U, dan zullen wij bekeerd zijn; vernieuw onze dagen als vanouds.", "Ps 79:5": "Hoe lang, HEERE? Zult U eeuwig toornen? Zal Uw ijver als vuur branden?", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ps 33:20": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild.", "Ef 5:26": "opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord,", "Luk 22:44": "En omdat Hij in zware strijd was, bad Hij des te ernstiger. En Zijn zweet werd als grote druppels bloed, die op de aarde afliepen.", "Ps 86:1-17": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Hebr 11:13": "Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren.", "Openb 21:6": "En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.", "Ps 56:4": "Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "Mark 4:20": "En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Ex 24:4": "Mozes nu beschreef al de woorden van de HEERE, en hij maakte zich 's morgens vroeg op, en hij bouwde een altaar onder aan de berg, en twaalf kolommen, naar de twaalf stammen van Israël.", "Luk 12:33": "Verkoop wat u hebt, en geef aalmoezen. Maak uzelf beurzen die niet verslijten, een schat die niet afneemt, in de hemelen, waar de dief niet bijkomt en de mot niet verteert.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "2 Kor 7:4": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.", "Matt 5:20": "Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan.", "Ps 119:149": "Hoor mijn stem naar Uw goedertierenheid, o HEERE! maak mij levend naar Uw recht.", "Ps 22:27": "De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Spr 11:8": "De rechtvaardige wordt uit benauwdheid bevrijd; en de goddeloze komt in zijn plaats.", "1 Kor 7:12": "Maar tegen de anderen zeg ik, niet de Heere: als een broeder een ongelovige vrouw heeft, en zij ermee tevreden is bij hem te wonen, laat hij haar niet verlaten;", "Ps 31:2": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Hebr 11:5": "Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.", "Ps 119:172-174": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid. Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen. O HEERE! ik verlang naar Uw heil, en Uw wet is al mijn vermaking.", "Micha 2:1": "Wee hun die onrecht bedenken en kwaad beramen op hun slaapplaatsen; in het licht van de morgen doen zij het, omdat het in de macht van hun hand is.", "Zach 4:7": "Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!", "Ex 15:9": "De vijand zei: Ik zal vervolgen, ik zal achterhalen, ik zal de buit delen, mijn ziel zal van hen vervuld worden, ik zal mijn zwaard trekken, mijn hand zal hen uitroeien.", "Rom 15:29": "En ik weet dat ik, wanneer ik tot u kom, met volle zegen van het Evangelie van Christus komen zal.", "Num 23:23": "Want er is geen toverij tegen Jakob, en geen waarzeggerij tegen Israël. Op dit moment zal van Jakob gezegd worden, en van Israël, wat God tot stand gebracht heeft.", "2 Kor 6:3": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt.", "Ps 42:10": "Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?", "Ps 121:7": "De HEERE zal u bewaren voor alle kwaad; uw ziel zal Hij bewaren.", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Luk 21:33-36": "De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan. En let op uzelf, dat uw harten niet op enig moment bezwaard worden met brasserij en dronkenschap, en zorgen van dit leven, en dat die dag u niet onvoorzien overkomt. Want als een strik zal hij komen over allen die op de hele aardbodem gezeten zijn.", "Ps 41:13": "Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.", "Ps 71:17": "O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.", "Ex 24:3": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen.", "Ps 78:12": "Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan.", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "2 Kron 36:22": "Maar in het eerste jaar van Kores, koning van Perzië, opdat het woord van de HEERE volbracht werd, door de mond van Jeremia, wekte de HEERE de geest op van Kores, koning van Perzië, zodat hij een stem liet doorgaan door zijn hele koninkrijk, ook zelfs op schrift, en hij zei:", "Spr 22:21": "om u de zekerheid van de woorden van de waarheid bekend te maken, opdat u de woorden van de waarheid kunt beantwoorden aan hen die u zenden?", "2 Kor 1:2": "Genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Ps 116:13": "Ik zal de beker der verlossingen opnemen, en de Naam van de HEERE aanroepen.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Joh 6:44": "Niemand kan tot Mij komen, als de Vader, Die Mij gezonden heeft, hem niet trekt; en Ik zal hem opwekken op de laatste dag.", "Num 23:1-30": "Toen zei Bileam tegen Balak: Bouw hier zeven altaren voor mij, en maak hier zeven stieren en zeven rammen voor mij klaar. Balak deed wat Bileam had gezegd; en Balak en Bileam offerden een stier en een ram op elk altaar. Toen zei Bileam tegen Balak: Blijf bij uw brandoffer staan, en ik zal weggaan; misschien zal de HEERE mij tegemoetkomen; en wat Hij mij laat zien, dat zal ik u bekendmaken. Toen ging hij naar de hoogte.", "1 Petr 3:13": "En wie is het die u kwaad zal doen, als u navolgers bent van het goede?", "Hand 11:23": "Toen hij daar aangekomen was en de genade van God zag, werd hij blij, en vermaande hen allen dat zij met een vast voornemen van het hart bij de Heere zouden blijven.", "Ps 35:9": "Zo zal mijn ziel zich verheugen in de HEERE; zij zal vrolijk zijn in Zijn heil.", "Ps 3:7": "Ik zal niet bang zijn voor tienduizenden van het volk, die zich rondom tegen mij opstellen.", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Ps 54:6": "Zie, God is mij een Helper; de Heere is onder hen die mijn ziel ondersteunen.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Hebr 5:7": "Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Ps 81:15": "In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Deut 31:19": "En nu, schrijf u dit lied, en leer het de kinderen van Israël; leg het in hun mond; opdat dit lied Mij tot getuige zij tegen de kinderen van Israël.", "Dan 6:11": "Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.", "Ps 27:12": "Geef mij niet over in de begeerte van mijn tegenstanders; want valse getuigen zijn tegen mij opgestaan, alsook wie geweld uitblaast.", "1 Kon 8:33-53": "Wanneer Uw volk Israël verslagen wordt voor het aangezicht van de vijand, omdat zij tegen U gezondigd zullen hebben, en zich tot U bekeren, en Uw Naam belijden, en tot U in dit huis bidden en smeken zullen; hoor Ú dan in de hemel, en vergeef de zonde van Uw volk Israël, en breng hen terug in het land, dat U hun vaderen gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij op deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Mark 7:9": "En Hij zei tegen hen: U doet inderdaad het gebod van God volledig teniet, opdat u uw overleveringen zou onderhouden.", "Luk 15:32": "Men behoorde dan vrolijk en blij te zijn; want deze broer van u was dood, en is weer levend geworden; en hij was verloren, en is gevonden.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Job 13:21": "Doe Uw hand ver van mij weg, en laat Uw verschrikking mij niet verbaasd maken.", "Ezra 7:10": "Want Ezra had zijn hart erop gericht om de wet van de HEERE te zoeken en te doen, en om in Israël de inzettingen en de rechten te leren.", "Ps 77:2": "Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen.", "Deut 4:6": "Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk!", "Ps 39:14": "Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.", "Deut 17:19": "En het moet bij hem blijven, en hij moet daarin lezen al de dagen van zijn leven; opdat hij de HEERE, zijn God, leert vrezen, om al de woorden van deze wet en deze inzettingen te bewaren en te doen;", "Ps 107:19": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Openb 12:11": "En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Ps 119:154": "Twist mijn twistzaak, en verlos mij, maak mij levend, naar Uw toezegging.", "Jer 17:17": "Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.", "Jes 13:3-5": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid. Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger. Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.", "Ps 141:1": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Fil 3:7-14": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Joh 17:17": "Heilig hen in Uw waarheid; Uw woord is de waarheid.", "2 Kor 3:18": "En wij allen, die met ongedekt gezicht de heerlijkheid van de Heere aanschouwen als in een spiegel, worden naar datzelfde beeld veranderd van heerlijkheid tot heerlijkheid, als door de Geest van de Heere.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Matt 13:33": "Een andere gelijkenis sprak Hij tot hen: Het Koninkrijk der hemelen is gelijk aan zuurdesem, die een vrouw nam en verborg in drie maten van het meel, totdat het geheel gezuurd was.", "Matt 5:8": "Zalig zijn de reinen van hart, want zij zullen God zien.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!", "Klaagl 3:26": "Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Ef 6:17": "En neem de helm van de zaligheid, en het zwaard van de Geest, dat is het Woord van God.", "Ps 51:10": "Doe mij vreugde en blijdschap horen; laat de beenderen zich verheugen die U verbrijzeld hebt.", "Ex 15:17": "Hen zult U inbrengen, en planten op de berg van Uw erfenis, op de plaats die U, o HEERE, gemaakt hebt om te wonen, het heiligdom, dat Uw handen gesticht hebben, o Heere!", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "Ezech 33:20": "Toch zegt u: De weg van de Heere is niet recht; Ik zal u richten, ieder naar zijn wegen, o huis van Israël!", "1 Kon 12:15": "Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Hand 7:9": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem,", "Ps 68:29": "Uw God heeft uw sterkte geboden; wees sterk, o God, in wat U voor ons hebt uitgewerkt!", "Hos 13:10": "Waar is uw koning nu? Laat hij u toch redden in al uw steden! En uw rechters, van wie u zei: Geef mij een koning en vorsten?", "Pred 3:10": "Ik heb de bezigheid gezien, die God aan de kinderen van de mensen gegeven heeft, om zichzelf daarmee te bekommeren.", "Spr 30:6": "Voeg niets toe aan Zijn woorden, opdat Hij u niet bestraft, en u leugenachtig wordt bevonden.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Job 22:26": "Want dan zult u zich verlustigen over de Almachtige, en u zult uw aangezicht opheffen tot God.", "Hand 16:9": "En in de nacht kreeg Paulus een visioen te zien: er stond een Macedonische man, die hem smeekte en zei: Kom over naar Macedonië, en help ons.", "Ps 2:11": "Dient de HEERE met vrees, en verheugt u met beving.", "Jes 48:15": "Ik, Ik heb het gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn op zijn weg.", "Ps 37:7": "Daleth. Zwijg voor de HEERE, en verwacht Hem; wind u niet op over hem die voorspoedig is op zijn weg; over een man die listige plannen uitvoert.", "Ps 25:20": "Schin. Bewaar mijn ziel, en red mij; laat mij niet beschaamd worden, want ik vertrouw op U.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "2 Petr 3:13": "Maar wij verwachten, naar Zijn belofte, nieuwe hemelen en een nieuwe aarde, waarin gerechtigheid woont.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "Deut 11:25": "Niemand zal voor uw aangezicht standhouden; de HEERE, uw God, zal de schrik en de vrees voor u geven over heel het land, waarop u treden zult, zoals Hij tot u gesproken heeft.", "Ps 123:1": "Een lied op Hammaäloth. Ik hef mijn ogen op tot U, Die in de hemelen zit.", "Jes 62:7": "En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.", "Mark 7:13": "Zo maakt u Gods woord krachteloos door uw overlevering, die u heeft ingesteld; en vele dergelijke dingen doet u.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 125:1-3": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid. Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid. Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "Jes 10:5-7": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Job 3:17": "Daar houden de bozen op van beroering, en daar rusten de vermoeiden van kracht;", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Matt 7:24": "Ieder dan die deze woorden van Mij hoort en ze doet, hem zal Ik vergelijken met een verstandig man, die zijn huis op een steenrots gebouwd heeft;", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Luk 6:47": "Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Rom 8:18": "Want ik houd het ervoor, dat het lijden van deze tegenwoordige tijd niet opweegt tegen de heerlijkheid die aan ons geopenbaard zal worden.", "Luk 24:45": "Toen opende Hij hun verstand, zodat zij de Schriften begrepen.", "Nahum 1:12": "Zo zegt de HEERE: Al zijn zij voorspoedig, en al zijn er nog zoveel, toch zullen zij afgesneden worden, en hij zal doorgaan. Ik heb u wel vernederd, maar Ik zal u niet meer vernederen.", "Fil 3:11": "Of ik op enige manier mag komen tot de opstanding van de doden.", "Matt 15:3": "Maar Hij antwoordde en zei tegen hen: Waarom overtreedt u ook het gebod van God, door uw overlevering?", "Job 31:5-17": "Als ik met ijdelheid omgegaan heb, en mijn voet gesneld heeft tot bedriegerij; Hij weegt mij op, in een rechte weegschaal, en God zal mijn oprechtheid weten. Als mijn gang uit de weg geweken is, en mijn hart mijn ogen nagevolgd is, en aan mijn handen iets aankleeft;", "Gal 1:12": "Want ik heb het ook niet van een mens ontvangen, ook niet geleerd, maar door de openbaring van Jezus Christus.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Ps 88:11-13": "Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw i
