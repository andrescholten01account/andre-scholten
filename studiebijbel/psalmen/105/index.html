arover een brief terugbrachten.", "Ps 14:2": "De HEERE heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht.", "2 Kor 1:22": "Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Gen 45:7": "Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "1 Kron 21:12": "Of drie jaren honger, of drie maanden verteerd te worden voor het aangezicht van uw tegenstanders, en dat het zwaard van uw vijanden u achterhaalt; of drie dagen het zwaard van de HEERE, dat is, de pestilentie in het land, en een verdervende engel van de HEERE in al de gebieden van Israël? Zo bezie nu goed, wat antwoord ik Hem zal teruggeven, Die mij gezonden heeft.", "1 Sam 2:4": "De boog van de sterken is gebroken; en zij die struikelden, zijn met sterkte omgord.", "Luk 17:34-36": "Ik zeg u: In die nacht zullen er twee op één bed zijn; de één zal aangenomen worden, en de ander zal achtergelaten worden. Twee vrouwen zullen samen malen; de één zal aangenomen worden, en de ander zal achtergelaten worden. Twee zullen op de akker zijn; de één zal aangenomen worden, en de ander zal achtergelaten worden.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Ex 12:17": "Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "Ps 50:14": "Offert God dank, en betaalt de Allerhoogste uw geloften.", "Gen 9:1-17": "En God zegende Noach en zijn zonen, en Hij zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde! En vrees en angst voor u zal er zijn over al het gedierte van de aarde, en over al het gevogelte van de hemel; over alles wat zich op de aardbodem beweegt, en over alle vissen van de zee; zij zijn in uw hand overgegeven. Alles wat zich beweegt, dat leeft, zal u tot voedsel zijn; Ik heb het u allemaal gegeven, zoals het groene kruid.", "Deut 12:9": "Want u bent tot nu toe niet gekomen in de rust en in de erfenis die de HEERE, uw God, u geven zal.", "2 Sam 17:14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "Spr 3:1": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden.", "Jer 29:19": "Omdat zij naar Mijn woorden niet geluisterd hebben, spreekt de HEERE, toen Ik Mijn knechten, de profeten, tot hen zond, vroeg opstaand en zendend; maar u hebt niet geluisterd, spreekt de HEERE.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Ex 28:1": "Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron.", "Gen 26:4": "En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Ps 146:6": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.", "Hebr 6:18": "opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Joël 2:25": "Zo zal Ik u de jaren vergelden, die de sprinkhaan, de kever, en de kruidworm, en de rups heeft afgegeten; Mijn grote leger, dat Ik onder u gezonden heb.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Matt 24:40": "Dan zullen er twee op de akker zijn: de één zal aangenomen worden, en de ander zal achtergelaten worden.", "1 Kor 1:29": "Opdat geen vlees zou roemen voor Hem.", "Joh 17:23": "Ik in hen, en U in Mij; opdat zij volmaakt zijn tot één, en opdat de wereld erkent dat U Mij gezonden hebt, en hen liefgehad hebt, zoals U Mij liefgehad hebt.", "Hebr 11:9": "Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.", "Ex 23:24": "U zult zich voor hun goden niet buigen, hen ook niet dienen; ook zult u niet doen naar hun werken; maar u zult ze geheel afbreken, en hun opgerichte beelden helemaal vermorzelen.", "Gen 12:14-20": "En het gebeurde, toen Abram in Egypte kwam, dat de Egyptenaren deze vrouw zagen, dat zij zeer knap was. Ook zagen de vorsten van Farao haar, en prezen haar bij Farao; en die vrouw werd meegenomen naar het huis van Farao. En hij deed Abram goed omwille van haar; zodat hij schapen had, en runderen, en ezels, en knechten, en dienstmeisjes, en ezelinnen, en kamelen.", "Luk 6:23": "Verblijd u op die dag, en wees vrolijk; want zie, uw loon is groot in de hemel; want hun vaders deden hetzelfde met de profeten.", "Joh 6:31-33": "Onze vaders hebben het manna gegeten in de woestijn, zoals geschreven is: Hij gaf hun brood uit de hemel te eten. Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: Mozes heeft u niet het brood uit de hemel gegeven; maar Mijn Vader geeft u dat ware Brood uit de hemel. Want het Brood van God is Hij Die uit de hemel neerdaalt en Die aan de wereld het leven geeft.", "1 Kron 29:20": "Daarna zei David tegen de hele gemeente: Looft nu de HEERE, uw God! Toen loofde de hele gemeente de HEERE, de God van hun vaderen; en zij bogen hun hoofd, en zij bogen zich neer voor de HEERE, en voor de koning.", "Joh 1:16": "En uit Zijn volheid hebben wij allen ontvangen, ook genade voor genade.", "Mal 3:2": "Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers.", "Rom 11:2": "God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt:", "1 Kron 22:5": "Want David zei: Mijn zoon Salomo is een jongeman en teder; en het huis dat men voor de HEERE bouwen zal, moet buitengewoon groot gemaakt worden, tot een naam en tot glorie in alle landen; ik zal er nu voorraad voor bereiden. Zo bereidde David voorraad in overvloed voor zijn dood.", "Luk 15:10": "Zo, zeg Ik u, is er blijdschap voor de engelen van God over één zondaar die zich bekeert.", "Job 30:31": "Hierom is mijn harp tot een rouwklacht geworden, en mijn orgel tot een stem van hen die wenen.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Matt 24:22": "En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.", "Ex 3:22": "Maar elke vrouw zal van haar buurvrouw, en van de vrouw die in haar huis woont, zilveren voorwerpen eisen, en gouden voorwerpen, en kleren; die zult u op uw zonen en op uw dochters leggen, en u zult Egypte beroven.", "Ezra 2:64": "Deze hele gemeente samen was tweeënveertigduizend driehonderdzestig.", "Deut 8:4": "Uw kleding is aan u niet versleten, en uw voet is niet gezwollen, deze veertig jaar.", "Ex 12:38": "En veel vermengd volk trok ook met hen op, en schapen, en runderen, heel veel vee.", "Hand 7:34": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.", "Ps 21:7": "Want U zet hem tot zegeningen in eeuwigheid; U vervrolijkt hem door vreugde met Uw aangezicht.", "Gen 45:9-11": "Haast u en trek op naar mijn vader, en zeg het hem: Zo zegt uw zoon Jozef: God heeft mij tot een heer over heel Egypte gesteld; kom af naar mij, en wacht niet. En u zult in het land Gosen wonen, en dicht bij mij zijn, u en uw zonen, en de zonen van uw zonen, en uw schapen, en uw runderen, en alles wat u hebt. En ik zal u daar onderhouden; want er zullen nog vijf jaren van de honger zijn, opdat u niet verarmt, u en uw huis, en alles wat u hebt!", "Deut 2:30": "Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.", "1 Sam 2:6-9": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Ex 13:14-16": "Wanneer het zal gebeuren dat uw zoon u later zal vragen en zegt: Wat is dat, dan moet u tegen hem zeggen: De HEERE heeft ons door een sterke hand uit Egypte, uit het diensthuis, uitgevoerd. Want het gebeurde, toen de farao zich verhardde om ons te laten gaan, dat de HEERE alle eerstgeborenen in Egypteland doodde, van de eerstgeborene van de mens af tot de eerstgeborene van het vee; daarom offer ik aan de HEERE de mannetjes van alles wat de baarmoeder opent; maar alle eerstgeborenen van mijn zonen koop ik vrij. En het zal tot een teken zijn op uw hand, en tot voorhoofdsbanden tussen uw ogen; want de HEERE heeft ons door een sterke hand uit Egypte uitgevoerd.", "Hand 7:11": "En er kwam een hongersnood over het hele land van Egypte en Kanaän, en grote nood; en onze vaders vonden geen voedsel.", "Jes 38:18": "Want het graf zal U niet loven, de dood zal U niet prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.", "Gen 47:28": "En Jakob leefde in het land van Egypte zeventien jaar; zodat de dagen van Jakob, de jaren van zijn leven, honderdzevenenveertig jaar geweest zijn.", "Jes 6:7": "En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Jer 12:12": "Op alle hoge plaatsen in de woestijn zijn verstoorders gekomen; want het zwaard van de HEERE verteert van het ene einde van het land tot aan het andere einde van het land; er is geen vrede voor enig vlees.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "Deut 28:2-13": "En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld. Gezegend zal zijn de vrucht van uw schoot, en de vrucht van uw land, en de vrucht van uw vee, de aanwas van uw koeien, en de kudden van uw kleinvee.", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Gen 13:15": "Want al dit land, dat u ziet, zal Ik u geven, en aan uw nageslacht, tot in eeuwigheid.", "Jer 22:15": "Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Joz 24:15-24": "Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen! Toen antwoordde het volk en zei: Het zij verre van ons, dat wij de HEERE zouden verlaten om andere goden te dienen. Want de HEERE is onze God; Hij is het die ons en onze vaderen uit het land Egypte, uit het diensthuis, heeft opgevoerd, en die deze grote tekenen voor onze ogen gedaan heeft, en ons bewaard heeft op heel de weg waarlangs wij getrokken zijn, en onder alle volken door wier midden wij getrokken zijn.", "Hand 7:19": "Deze gebruikte listen tegen ons volk, en behandelde onze vaders slecht, zodat zij hun jonge kinderen moesten wegwerpen, opdat die niet in leven zouden blijven.", "Ps 7:18": "Ik zal de HEERE loven naar Zijn gerechtigheid, en voor de Naam van de HEERE, de Allerhoogste, psalmzingen.", "Ex 3:10": "Zo kom nu, en Ik zal u naar Farao zenden, opdat u Mijn volk (de kinderen van Israël) uit Egypte voert.", "Ps 77:21": "U leidde Uw volk als een kudde door de hand van Mozes en Aäron.", "Jer 42:3": "dat de HEERE, uw God, ons de weg bekendmaakt die wij zullen ingaan, en de zaak die wij zullen doen.", "Ps 71:7": "Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "Ps 143:5": "Ik denk aan de dagen van vroeger; ik overleg al Uw daden; ik spreek bij mijzelf over de werken van Uw handen.", "1 Joh 4:4": "Kinderen, u bent uit God, en hebt hen overwonnen; want Hij die in u is, is meer dan hij die in de wereld is.", "Lev 26:26": "Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.", "2 Kon 19:25": "Hebt u niet gehoord dat Ik dit lang van tevoren gedaan heb, en het van oude dagen af gevormd heb? Nu heb Ik het laten komen, dat u de versterkte steden zou verstoren tot puinhopen.", "Ex 10:1-19": "Daarna zei de HEERE tegen Mozes: Ga naar Farao; want Ik heb zijn hart verzwaard, ook het hart van zijn knechten, opdat Ik deze Mijn tekenen in hun midden zou stellen; En opdat u voor de oren van uw kinderen en uw kleinkinderen kunt vertellen wat Ik in Egypte gedaan heb, en Mijn tekenen, die Ik onder hen gedaan heb; opdat u weet dat Ik de HEERE ben. Zo gingen Mozes en Aäron naar Farao, en zeiden tegen hem: Zo zegt de HEERE, de God van de Hebreeën: Hoe lang weigert u zich voor Mijn aangezicht te verootmoedigen? Laat Mijn volk gaan, dat zij Mij dienen.", "1 Kron 17:27": "Nu dan, het heeft U behaagd het huis van Uw knecht te zegenen, zodat het in eeuwigheid voor Uw aangezicht zal zijn; want U, HEERE, hebt het gezegend, en het zal gezegend zijn in eeuwigheid.", "Jer 3:14": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen.", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "Luk 6:22": "Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen.", "Ps 71:8": "Laat mijn mond vervuld worden met Uw lof, de hele dag met Uw heerlijkheid.", "Job 34:13": "Wie heeft Hem gesteld over de aarde, en wie heeft de hele wereld geschikt?", "Jes 55:12": "Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Ps 119:111": "Ik heb Uw getuigenissen genomen tot een eeuwige erve, want zij zijn de vrolijkheid van mijn hart.", "1 Kon 2:3": "En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;", "Ps 65:9-14": "En die aan de einden wonen, vrezen voor Uw tekenen; U doet de uitgangen van de morgen en van de avond juichen. U bezoekt het land, en hebt het begerig gemaakt, U verrijkt het overvloedig; de rivier van God is vol water; wanneer U het zo bereid hebt, maakt U hun koren gereed. U maakt zijn opgeploegde aarde dronken; U doet ze dalen in zijn voren; U maakt het zacht door de druppels; U zegent zijn uitspruitsel.", "Deut 6:2-25": "Opdat u de HEERE, uw God, vreest, om al Zijn inzettingen en Zijn geboden te houden, die ik u gebied; u, en uw kind, en kindskind, al de dagen van uw leven; en opdat uw dagen verlengd worden. Hoor dan, Israël! en let erop dat u ze doet, opdat het u goed gaat, en opdat u zeer vermenigvuldigt (zoals de HEERE, de God van uw vaderen, u gesproken heeft) in het land, dat overvloeit van melk en honing. Hoor, Israël! De HEERE, onze God, is een enig HEERE!", "Ps 50:7": "Hoort, Mijn volk! en Ik zal spreken; Israël! en Ik zal onder u getuigen; Ik, God, ben uw God.", "Jes 51:6": "Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.", "Ps 65:2": "De lofzang is in stilte tot U, o God! in Sion; en U zal de gelofte betaald worden.", "Joël 2:21": "Vrees niet, o land! verheug u, en wees blijde; want de HEERE heeft grote dingen gedaan.", "Hebr 11:12": "Daarom zijn er ook uit één mens, en dat een als het ware al gestorvene, zovelen in aantal geboren als de sterren van de hemel, en als het zand aan de oever van de zee, dat niet te tellen is.", "Ps 119:2": "Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;", "Kol 1:11": "bekrachtigd met alle kracht, naar de sterkte van Zijn heerlijkheid, tot alle lijdzaamheid en geduld, met blijdschap;", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Jes 43:15": "Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Ps 65:10-14": "U bezoekt het land, en hebt het begerig gemaakt, U verrijkt het overvloedig; de rivier van God is vol water; wanneer U het zo bereid hebt, maakt U hun koren gereed. U maakt zijn opgeploegde aarde dronken; U doet ze dalen in zijn voren; U maakt het zacht door de druppels; U zegent zijn uitspruitsel. U kroont het jaar van Uw goedheid; en Uw voetstappen druipen van vettigheid.", "2 Sam 7:23": "En wie is gelijk Uw volk, gelijk Israël, een enig volk op aarde, dat God is heengegaan om Zich tot een volk te verlossen, en om Zich een Naam te maken, en om voor u deze grote en verschrikkelijke dingen te doen aan Uw land, voor het aangezicht van Uw volk, dat U voor Uzelf uit Egypte verlost hebt, terwijl U de heidenen en hun goden verdreef.", "Spr 15:9": "De weg van de goddelozen is de HEERE een gruwel; maar hem die de gerechtigheid najaagt, zal Hij liefhebben.", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Ps 37:17": "Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen.", "Ps 97:5": "De bergen smelten als was voor het aangezicht van de HEERE, voor het aangezicht van de Heere van de hele aarde.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "2 Kor 12:10": "Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus' wil; want als ik zwak ben, dan ben ik machtig.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Deut 4:37": "En omdat Hij uw vaderen liefhad, en hun nageslacht na hen verkoren had, zo heeft Hij u voor Zijn aangezicht door Zijn grote kracht uit Egypte weggevoerd;", "Dan 4:8": "Totdat ten laatste Daniël bij mij binnenkwam, wiens naam Beltsazar is, naar de naam van mijn god, in wie ook de geest van de heilige goden is; en ik vertelde de droom aan hem en zei:", "Ex 12:35": "De kinderen van Israël nu hadden gedaan naar het woord van Mozes, en hadden van de Egyptenaren gevraagd zilveren voorwerpen, en gouden voorwerpen, en kleren.", "Ex 12:33": "En de Egyptenaren drongen sterk aan bij het volk, om ze snel uit het land te drijven; want zij zeiden: Wij zijn allen dood!", "Gen 46:2-7": "En God sprak tot Israël in visioenen in de nacht, en zei: Jakob, Jakob! En hij zei: Zie, hier ben ik! En Hij zei: Ik ben die God, de God van uw vader; wees niet bang om af te trekken naar Egypte; want Ik zal u daar tot een groot volk maken. Ik zal met u aftrekken naar Egypte, en Ik zal u ook weer laten optrekken; en Jozef zal zijn hand op uw ogen leggen.", "Gen 14:18-20": "En Melchizedek, koning van Salem, bracht brood en wijn; en hij was een priester van de allerhoogste God. En hij zegende hem en zei: Gezegend zij Abram door God, de Allerhoogste, Die hemel en aarde bezit! En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Rom 15:8": "En ik zeg dat Jezus Christus een dienaar van de besnijdenis geworden is, vanwege de waarheid van God, opdat Hij de beloften aan de vaderen zou bevestigen;", "1 Kron 15:27": "David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.", "Job 36:23": "Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?", "Deut 6:1": "Dit zijn dan de geboden, de inzettingen en de rechten, die de HEERE, uw God, geboden heeft om u te leren; opdat u ze doet in het land, waar u naartoe gaat, om het te bezitten;", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Gal 1:15": "Maar toen het God behaagd heeft, Die mij van mijn moeders schoot af afgezonderd heeft, en geroepen door Zijn genade,", "2 Kron 23:13": "En zij keek toe; en zie, de koning stond bij zijn pilaar, bij de ingang; en de leiders en de trompetten waren bij de koning; en heel het volk van het land was blij, en blies op de trompetten; en de zangers waren er met muzikale instrumenten, en gaven aanwijzingen om lof te zingen; toen scheurde Athalia haar kleren, en riep: Verraad, verraad!", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "Rom 16:27": "Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Jer 46:15-17": "Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef. Hij maakte de struikelende velen; ja, de een viel op de ander; zodat zij zeiden: Staat op en laat ons wederkeren tot ons volk, en tot het land van onze geboorte, vanwege het verdrukkende zwaard. Daar riepen zij: Farao, de koning van Egypte, is maar een gedruis; hij heeft de gezette tijd laten voorbijgaan.", "Ps 36:9": "Zij worden dronken van de vettigheid van uw huis; en U drenkt hen uit de beek van Uw wellusten.", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Hand 4:24": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.", "1 Kron 25:6": "Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.", "Ex 1:11-14": "En zij stelden leiders van dwangarbeid over hen aan, om hen te onderdrukken met hun lasten; want men bouwde voor Farao voorraadsteden, Pitom en Raamses. Maar hoe meer zij hen onderdrukten, hoe meer het vermeerderde, en hoe meer het uitbreidde; zodat zij verontrust waren vanwege de kinderen van Israël. En de Egyptenaren lieten de kinderen van Israël dienen met hardheid;", "Ps 123:2": "Zie, zoals de ogen van de knechten zijn op de hand van hun heren, zoals de ogen van de dienstmaagd zijn op de hand van haar meesteres, zo zijn onze ogen op de HEERE, onze God, totdat Hij ons genadig is.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Ps 103:3-5": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden; Die uw mond verzadigt met het goede, uw jeugd vernieuwt als die van een arend.", "Matt 5:45": "opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen.", "Hand 17:26": "En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Spr 19:21": "In het hart van de man zijn veel gedachten; maar de raad van de HEERE, die zal standhouden.", "Deut 32:41-43": "Als Ik Mijn glinsterend zwaard scherp, en Mijn hand grijpt naar het gericht, zo zal Ik wraak op Mijn tegenpartijen doen wederkeren, en Mijn haters vergelden. Ik zal Mijn pijlen dronken maken van bloed, en Mijn zwaard zal vlees eten; van het bloed van de verslagene en van de gevangene, vanaf het begin zullen er wraken van de vijand zijn. Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Ex 1:8": "Daarna kwam er een nieuwe koning over Egypte aan de macht, die Jozef niet gekend had;", "Jes 65:14": "Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Ps 39:13": "Hoor, HEERE, mijn gebed, en neem mijn geroep ter ore; zwijg niet bij mijn tranen; want ik ben een vreemdeling bij U, een bijwoner, zoals al mijn vaders.", "1 Kon 8:24": "Die Uw dienaar, mijn vader David, gehouden hebt wat U tot hem gesproken had; want met Uw mond hebt U gesproken, en met Uw hand vervuld, zoals het op deze dag is.", "Ps 67:7": "De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.", "Num 11:31-33": "Toen kwam er een wind van de HEERE, en die bracht kwakkels vanaf de zee, en strooide ze bij het leger, ongeveer een dagreis hierheen en ongeveer een dagreis daarheen, rondom het leger; en zij lagen ongeveer twee el boven de aarde. Toen maakte het volk zich op, die hele dag, en die hele nacht, en de hele volgende dag, en verzamelde de kwakkels; wie het minst had, had tien homers verzameld; en zij spreidden ze voor zichzelf uit rondom het leger. Dat vlees was nog tussen hun tanden, voordat het gekauwd was, toen ontstak de toorn van de HEERE tegen het volk, en de HEERE sloeg het volk met een zeer grote plaag.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Gen 49:3": "Ruben! U bent mijn eerstgeborene, mijn kracht, en het begin van mijn macht; de voortreffelijkste in hoogheid, en de voortreffelijkste in sterkte!", "1 Kron 16:41": "En met hen Heman en Jeduthun, en de overige uitgelezen mannen, die met naam uitgedrukt zijn om de HEERE te loven; want Zijn goedertierenheid is tot in eeuwigheid.", "Zach 8:8": "En Ik zal hen hierheen brengen, zodat zij in het midden van Jeruzalem wonen zullen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn, in waarheid en in gerechtigheid.", "Jer 52:3": "Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Ps 24:3-6": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Luk 1:68-70": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht; zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Job 36:1-33": "Elihu ging nog verder, en zei: Wacht op mij nog even, en ik zal u aanwijzen dat er nog redenen voor God zijn. Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "Joz 21:43": "Zo gaf de HEERE aan Israël het hele land, dat Hij gezworen had aan hun vaderen te geven, en zij beërfden het, en woonden daarin.", "1 Sam 18:7": "En de vrouwen, spelend, antwoordden elkaar en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden!", "Job 39:3": "Wie bereidt de raaf haar kost, als haar jongen tot God schreeuwen, als zij dwalen, omdat er geen eten is?", "Jes 43:7": "ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.", "Zach 10:1": "Vraag van de HEERE regen, in de tijd van de late regen; de HEERE maakt de bliksemwolken¹, en Hij zal hun regen genoeg geven, voor ieder kruid op het veld.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Deut 10:18": "Die het recht van de wees en van de weduwe doet; en de vreemdeling liefheeft, door hem brood en kleding te geven.", "Ps 24:6": "Dat is het geslacht van hen die naar Hem vragen, die Uw aangezicht zoeken, dat is Jakob! Sela.", "2 Kron 6:6": "Maar Ik heb Jeruzalem verkoren, dat Mijn Naam daar zou zijn; en Ik heb David verkoren, dat hij over Mijn volk Israël zou zijn.", "Gal 5:22": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.", "Ps 105:1-45": "Looft de HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken. Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen. Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "Ps 34:8": "Cheth. De Engel van de HEERE legert Zich rondom hen die Hem vrezen, en redt hen.", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Ps 135:5": "Want ik weet dat de HEERE groot is, en dat onze Heere boven alle goden is.", "Ps 71:6": "Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U.", "Ps 57:8-10": "Mijn hart is standvastig, o God! mijn hart is standvastig; ik zal zingen en psalmzingen. Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o Heere! ik zal U psalmzingen onder de naties.", "Ps 109:30": "Ik zal de HEERE met mijn mond zeer loven, en te midden van velen zal ik Hem prijzen.", "Num 24:10-13": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend! En nu, pak u weg naar uw plaats! Ik had gezegd dat ik u hoog zou eren; maar zie, de HEERE heeft u die eer onthouden! Toen zei Bileam tegen Balak: Heb ik ook niet tegen uw boden, die u naar mij gezonden hebt, gesproken en gezegd:", "Amos 4:6-9": "Daarom heb Ik u ook reinheid van de tanden gegeven in al uw steden, en gebrek aan brood in al uw plaatsen; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "1 Sam 2:8": "Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Ps 119:27": "Geef mij de weg van Uw bevelen te verstaan, opdat ik Uw wonderen betracht.", "Luk 2:10": "En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal;", "Ps 72:6": "Hij zal neerdalen als een regen op het nagras, als de druppels, die de aarde bevochtigen.", "Jes 54:1-3": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "Joz 3:11": "Zie, de ark van het verbond van de Heere van de hele aarde gaat voor u door de Jordaan.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Ps 89:12": "De hemel is van U, ook is de aarde van U; de wereld en haar volheid, die hebt Gij gegrond.", "Ps 132:16": "En haar priesters zal Ik met heil bekleden, en haar gunstgenoten zullen zeer juichen.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Lev 26:10": "En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "Gen 47:19": "Waarom zouden wij voor uw ogen sterven, zowel wij als ons land? Koop ons en ons land voor brood, dan zullen wij en ons land Farao dienstbaar zijn; en geef ons zaad, opdat wij leven en niet sterven, en het land niet woest wordt!", "Deut 23:4": "Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken.", "2 Kor 8:2": "Dat in veel beproeving van de verdrukking de overvloed van hun blijdschap, en hun zeer diepe armoede overvloedig geweest is tot de rijkdom van hun goeddadigheid.", "Ps 135:12": "En Hij gaf hun land tot erfenis, tot erfenis aan Zijn volk Israël.", "Num 16:47": "En Aäron nam het, zoals Mozes gesproken had, en liep midden in de gemeente, en zie, de plaag was al begonnen onder het volk; en hij legde reukwerk daarin, en deed verzoening over het volk.", "Ex 8:2-14": "En als u weigert hen te laten trekken, zie, dan zal Ik heel uw gebied met kikkers slaan; Zodat de rivier van kikkers zal krioelen; die zullen opkomen en in uw huis komen, en in uw slaapkamer, ja, op uw bed; ook in de huizen van uw knechten, en op uw volk, en in uw bakovens, en in uw baktroggen. En de kikkers zullen opkomen, op u, en op uw volk, en op al uw knechten.", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "Klaagl 3:41": "Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "Jer 33:20": "Zo zegt de HEERE: Als u Mijn verbond met de dag, en Mijn verbond met de nacht zou kunnen verbreken, zodat er geen dag en nacht meer zijn op hun tijd;", "2 Kron 7:17": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "2 Kron 7:1-3": "Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis. En de priesters konden niet ingaan in het huis van de HEERE, want de heerlijkheid van de HEERE had het huis van de HEERE vervuld. En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Jes 51:2": "Kijk naar Abraham, uw vader, en naar Sara, die u gebaard heeft; want Ik riep hem, toen hij nog alleen was, en Ik zegende hem, en Ik vermenigvuldigde hem.", "Luk 1:46-55": "En Maria zei: Mijn ziel maakt de Heere groot, en mijn geest verheugt zich in God, mijn Zaligmaker; omdat Hij de nederigheid van Zijn dienstmaagd heeft aangezien; want zie, van nu af aan zullen alle geslachten mij zalig spreken.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Ezech 36:24-28": "Want Ik zal u uit de heidenen halen, en zal u uit al de landen bijeenbrengen; en Ik zal u in uw land brengen. Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen. En Ik zal u een nieuw hart geven, en zal een nieuwe geest geven in het binnenste van u; en Ik zal het stenen hart uit uw vlees wegnemen, en zal u een vlezen hart geven.", "Job 37:6": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Matt 5:6": "Zalig zijn zij die hongeren en dorsten naar de gerechtigheid, want zij zullen verzadigd worden.", "Ps 119:20": "Mijn ziel is verbroken vanwege het verlangen naar Uw oordelen te aller tijd.", "Lev 25:42": "Want zij zijn Mijn dienstknechten, die Ik uit het land Egypte geleid heb; zij zullen niet verkocht worden, zoals men een slaaf verkoopt.", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Jes 41:8-10": "Maar u, Israël, Mijn knecht! U, Jakob, die Ik uitgekozen heb! Het nageslacht van Abraham, die Mij liefheeft! U, die Ik gegrepen heb van de einden van de aarde, en uit haar voornaamste mannen geroepen heb; en tegen wie Ik zei: U bent Mijn knecht; u heb Ik uitverkoren, en Ik heb u niet verworpen. Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ps 106:12": "Toen geloofden zij Zijn woorden; zij zongen Zijn lof.", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Deut 4:38": "Om volken die groter en machtiger waren dan u, voor u uit hun bezit te verdrijven; om u binnen te brengen en u hun land als erfenis te geven, zoals het vandaag is.", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Hand 14:17": "hoewel Hij Zichzelf toch niet zonder getuigenis gelaten heeft, doordat Hij goeddeed, ons vanuit de hemel regen en vruchtbare tijden gaf, en onze harten vervulde met voedsel en vreugde.", "Joz 11:20": "Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.", "Ps 78:55": "En Hij verdreef voor hun aangezicht de heidenen, en liet hen vallen in het snoer van hun erfenis, en liet de stammen van Israël in hun tenten wonen.", "Jak 1:18": "Naar Zijn wil heeft Hij ons gebaard door het Woord van de waarheid, opdat wij zouden zijn als eerstelingen van Zijn schepselen.", "Spr 9:10": "De vreze van de HEERE is het beginsel van de wijsheid, en de kennis van de Heilige is verstand.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Ex 15:21": "Toen antwoordde Mirjam hun: Zingt de HEERE; want Hij is hoog verheven! Hij heeft het paard met zijn ruiter in de zee gestort!", "Klaagl 5:10": "Onze huid is zwart geworden als een oven, vanwege de verzengende hitte van de honger.", "Hand 1:7": "En Hij zei tegen hen: Het komt u niet toe de tijden of gelegenheden te weten die de Vader in Zijn eigen macht gesteld heeft;", "Hand 9:14": "en hij heeft hier macht van de overpriesters om allen te binden die Uw Naam aanroepen.", "Jona 4:6": "En God, de HEERE, liet een wonderboom groeien en die opschieten boven Jona, zodat er schaduw zou zijn over zijn hoofd, om hem te bevrijden van zijn ellende. En Jona verheugde zich over de wonderboom met grote blijdschap.", "Num 22:12-18": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend. Toen stond Bileam 's morgens op, en zei tegen de vorsten van Balak: Ga naar uw land; want de HEERE weigert mij toe te staan met u mee te gaan. Toen stonden de vorsten van Moab op, en kwamen bij Balak, en zij zeiden: Bileam heeft geweigerd met ons mee te gaan.", "Jer 31:11": "Want de HEERE heeft Jakob vrijgekocht, en Hij heeft hem verlost uit de hand van hem die sterker was dan hij.", "Ps 34:5": "Daleth. Ik heb de HEERE gezocht, en Hij heeft mij geantwoord, en mij uit al mijn angsten gered.", "Jes 5:25-30": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt. Want Hij zal een banier opwerpen voor de heidenvolken van ver, en Hij zal hen hierheen lokken met een fluitsignaal, van het einde van de aarde; en zie, haastig, snel zullen zij aankomen. Geen vermoeide, en geen struikelende zal onder hen zijn; niemand zal sluimeren noch slapen, noch zal de gordel om zijn heupen losraken, noch zal de schoenriem van zijn schoenen afscheuren.", "Ps 23:1": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken.", "2 Sam 7:8": "Nu dan, zo zult u tegen Mijn knecht, tegen David, zeggen: Zo zegt de HEERE van de heerscharen: Ik heb u genomen van de schaapskooi, van achter de schapen, om een voorganger te zijn over Mijn volk, over Israël.", "Ps 4:8": "U hebt vreugde in mijn hart gegeven, meer dan ten tijde dat hun koren en hun most vermenigvuldigd waren.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Ps 149:8": "om hun koningen te binden met ketenen, en hun aanzienlijken met ijzeren boeien,", "Hand 5:38": "En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen gaan; want als deze raad of dit werk uit mensen is, zal het gebroken worden;", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Num 16:42": "En het gebeurde, toen de vergadering zich verzamelde tegen Mozes en Aäron, en zich wendde naar de tent van de samenkomst, zie, dat de wolk haar bedekte; en de heerlijkheid van de HEERE verscheen.", "1 Petr 1:15": "maar word, zoals Hij Die u geroepen heeft heilig is, ook zelf heilig in heel uw levenswandel;", "Spr 14:11": "Het huis van de goddelozen zal weggevaagd worden; maar de tent van de oprechten zal bloeien.", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "Jer 29:13": "En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.", "Ps 145:12": "Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk.", "Ps 136:1-26": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Loof de God der goden; want Zijn goedertierenheid is voor eeuwig. Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Jes 47:4": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël.", "Gen 26:3": "Woon als vreemdeling in dat land, en Ik zal met u zijn, en zal u zegenen; want aan u en uw nageslacht zal Ik al deze landen geven, en Ik zal de eed bevestigen die Ik Abraham, uw vader, gezworen heb.", "Ps 100:5": "Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.", "Ps 121:3": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Ps 107:15": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Spr 3:9": "Vereer de HEERE met uw goed, en met de eerstelingen van al uw inkomsten;", "Ps 103:2-5": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden;", "Ps 119:116": "Ondersteun mij naar Uw toezegging, opdat ik leve; en laat mij niet beschaamd worden over mijn hoop.", "Jes 1:25": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen.", "2 Kron 20:3-30": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda. En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.", "Ps 81:14-17": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld! In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders. Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Richt 9:24": "opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.", "Ezech 14:13": "Mensenkind, als een land tegen Mij zondigt door zwaar te overtreden, dan zal Ik Mijn hand daartegen uitstrekken, en de staf van het brood daarvan breken, en een honger daarin zenden, zodat Ik daaruit mensen en beesten uitroei;", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Ex 16:10": "En het gebeurde, toen Aäron tegen de hele gemeenschap van de Israëlieten sprak, en zij zich naar de woestijn keerden, zie, daar verscheen de heerlijkheid van de HEERE in de wolk.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Gen 15:18": "Op dezelfde dag maakte de HEERE een verbond met Abram, en Hij zei: Aan uw nageslacht heb Ik dit land gegeven, van de rivier van Egypte af, tot aan die grote rivier, de rivier de Eufraat:", "Ps 83:19": "opdat zij weten dat U alleen met Uw Naam de HEERE bent, de Allerhoogste over de hele aarde.", "Zach 14:2": "Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden.", "1 Kron 25:7": "En hun aantal, met hun broeders die onderwezen waren in het gezang van de HEERE, allen meesters, was tweehonderdachtentachtig.", "Jes 16:10": "zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.", "Ps 97:12": "Rechtvaardigen, verblijd u in de HEERE, en spreek lof ter gedachtenis van Zijn heiligheid.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Spr 11:20": "De verkeerden van hart zijn de HEERE een gruwel; maar de oprechten van weg zijn Zijn welgevallen.", "Ps 119:90": "Uw trouw is van geslacht tot geslacht; U hebt de aarde vastgemaakt, en zij blijft staan;", "Neh 9:20": "En U hebt Uw goede Geest gegeven om hen te onderwijzen; en Uw Manna hebt U niet geweerd van hun mond, en water hebt U hun gegeven voor hun dorst.", "Jes 44:4": "En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.", "Ps 149:1-3": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning. Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "Ex 6:3-7": "En ook heb Ik Mijn verbond met hen opgericht, dat Ik hun het land Kanaän geven zou, het land van hun vreemdelingschap, waarin zij vreemdelingen zijn geweest. En ook heb Ik het gekerm gehoord van de kinderen van Israël, die de Egyptenaars in dienstbaarheid houden, en Ik heb aan Mijn verbond gedacht. Daarom, zeg tegen de kinderen van Israël: Ik ben de HEERE! En Ik zal u uitleiden van onder de lasten van de Egyptenaren, en Ik zal u redden uit hun dienstbaarheid, en zal u verlossen door een uitgestrekte arm, en door grote gerichten;", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Deut 6:2": "Opdat u de HEERE, uw God, vreest, om al Zijn inzettingen en Zijn geboden te houden, die ik u gebied; u, en uw kind, en kindskind, al de dagen van uw leven; en opdat uw dagen verlengd worden.", "Hoogl 3:1-4": "Ik zocht 's nachts op mijn bed Hem, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet; ik zei: ... Ik zal nu opstaan, en in de stad omgaan, in de wijken en in de straten; ik zal Hem zoeken, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet. De wachters, die in de stad omgingen, vonden mij: ik zei: Hebt u Die gezien, Die mijn ziel liefheeft?", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Ex 14:20": "En zij kwam tussen het leger van de Egyptenaren en tussen het leger van Israël; en de wolk was tegelijk duisternis en verlichtte de nacht; zodat de een tot de ander niet naderde de hele nacht.", "Ps 21:2": "O HEERE! De koning is verblijd over Uw sterkte; en hoezeer is hij verheugd over Uw heil!", "Ps 135:19": "U, huis van Israël! looft de HEERE; u, huis van Aäron! looft de HEERE.", "Hand 2:21": "En het zal gebeuren dat ieder die de Naam van de Heere zal aanroepen, behouden zal worden.", "Jer 27:4-6": "En beveel hun om tegen hun heren te zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zo zult u tegen uw heren zeggen: Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "Klaagl 3:25": "Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt.", "Hagg 2:24": "Op die dag, spreekt de HEERE van de heerscharen, zal Ik u nemen, Zerubbabel, zoon van Sealthiël, Mijn dienstknecht! spreekt de HEERE, en Ik zal u stellen als een zegelring; want Ik heb u verkozen, spreekt de HEERE van de heerscharen.", "Ex 13:21": "En de HEERE ging voor hun aangezicht uit, overdag in een wolkkolom om hen de weg te leiden, en 's nachts in een vuurkolom om hen licht te geven, zodat zij dag en nacht konden voortgaan.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Dan 4:1-3": "Koning Nebukadnezar aan alle volken, natiën en talen, die op de hele aardbodem wonen: uw vrede moet vermenigvuldigd worden! Het behaagt mij te verkondigen de tekenen en wonderen, die de allerhoogste God aan mij gedaan heeft. Hoe groot zijn Zijn tekenen! En hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.", "2 Kon 8:19": "Toch wilde de HEERE Juda niet verderven, omwille van David, Zijn dienaar; zoals Hij hem gezegd had dat Hij hem altijd een lamp zou geven voor zijn zonen.", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Num 16:19": "En Korach liet de hele vergadering tegen hen verzamelen bij de deur van de tent van de samenkomst. Toen verscheen de heerlijkheid van de HEERE aan deze hele vergadering.", "Gen 41:25": "Toen zei Jozef tot Farao: De droom van Farao is één; wat God gaat doen, heeft Hij Farao bekendgemaakt.", "Deut 10:15": "Alleen heeft de HEERE behagen gehad in uw vaderen, om hen lief te hebben, en heeft hun nageslacht na hen, u, uit alle volken uitverkoren, zoals het op deze dag is.", "Spr 3:2": "Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen.", "Ps 63:4": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen.", "Jer 32:21": "En U hebt Uw volk Israël uit het land Egypte uitgeleid, door tekenen en door wonderen, en door een sterke hand, en door een uitgestrekte arm, en door grote verschrikking.", "2 Kron 6:41": "En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.", "Ps 29:11": "De HEERE zal Zijn volk sterkte geven; de HEERE zal Zijn volk zegenen met vrede.", "Ezech 18:4": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "Ps 135:1-3": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE! U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God! Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "Jes 63:7-9": "Ik zal de blijken van goedertierenheid van de HEERE vermelden, de veelvoudige lof van de HEERE, naar alles wat de HEERE ons heeft bewezen, en de grote goedheid aan het huis van Israël, die Hij hun bewezen heeft, naar Zijn barmhartigheden, en naar de veelheid van Zijn blijken van goedertierenheid. Want Hij zei: Zij zijn zeker Mijn volk, kinderen die niet liegen zullen? Zo is Hij hun geworden tot een Heiland. In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Gen 21:12": "Maar God zei tegen Abraham: Laat het niet kwaad zijn in uw ogen vanwege de jongen en vanwege uw slavin; alles wat Sara tegen u zegt, luister naar haar stem; want in Izak zal uw nageslacht genoemd worden.", "Gen 12:1-3": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal. En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen! En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Jes 58:10": "En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.", "Jer 18:1-23": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei: Maak u op en ga naar het huis van de pottenbakker, en daar zal Ik u Mijn woorden doen horen. Zo ging ik naar het huis van de pottenbakker; en zie, hij maakte een werk op de schijven.", "Spr 19:23": "De vreze van de HEERE is ten leven; want men zal verzadigd zijnde overnachten; met het kwaad zal men niet bezocht worden.", "Jes 48:20": "Ga uit van Babel, vlucht van de Chaldeeën, verkondig met de stem van het gejuich, doe zulks horen, breng het uit tot aan het einde van de aarde, zeg: De HEERE heeft Zijn knecht Jakob verlost!", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "1 Kron 15:16-22": "En David zei tegen de leiders van de Levieten, dat zij hun broeders, de zangers, moesten aanstellen met muziekinstrumenten, met luiten, en harpen, en cimbalen, zodat zij zich lieten horen, terwijl zij de stem verhieven met blijdschap. Zo stelden de Levieten Heman aan, de zoon van Joël, en uit zijn broeders Asaf, de zoon van Berechja; en uit de zonen van Merari, hun broeders, Ethan, de zoon van Kusaja; En met hen hun broeders van de tweede orde: Zecharja, Ben en Jaaziel, en Semiramoth, en Jehiel, en Unni, Eliab, en Benaja, en Maaseja, en Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, de poortwachters.", "Deut 11:8": "Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;", "Jak 5:16": "Belijd elkaar de misdaden, en bid voor elkaar, opdat u gezond wordt; een krachtig gebed van de rechtvaardige vermag veel.", "Ex 9:18-29": "Zie, Ik zal morgen omstreeks deze tijd een zeer zware hagel laten regenen, zoals in Egypte niet geweest is vanaf de dag dat het gegrond is, tot nu toe. En nu, stuur mensen, verzamel uw vee, en alles wat u op het veld hebt; alle mens en dier, dat op het veld gevonden zal worden en niet in huis verzameld zal zijn, als deze hagel op hen valt, zullen zij sterven. Wie onder de dienaren van Farao het woord van de HEERE vreesde, die liet zijn dienaren en zijn vee naar de huizen vluchten;", "Openb 6:5-8": "En toen Het het derde zegel geopend had, hoorde ik het derde dier zeggen: Kom en zie! En ik zag, en zie, een zwart paard, en die daarop zat, had een weegschaal in zijn hand. En ik hoorde een stem in het midden van de vier dieren, die zei: Een maatje tarwe voor een penning, en drie maatjes gerst voor een penning; en beschadig de olie en de wijn niet. En toen Het het vierde zegel geopend had, hoorde ik een stem van het vierde dier, die zei: Kom en zie!", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Jak 1:13": "Niemand moet, als hij verzocht wordt, zeggen: Ik word door God verzocht; want God kan niet verzocht worden met het kwade, en Hij Zelf verzoekt niemand.", "Ps 22:29": "Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen.", "Lev 25:23": "Het land ook zal niet voor altijd verkocht worden; want het land is van Mij, omdat u vreemdelingen en bijwoners bij Mij bent.", "Gen 22:16": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt;", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u gesteld, zodat u zou heengaan en vrucht dragen, en dat uw vrucht blijft; zodat, wat u ook van de Vader zal vragen in Mijn Naam, Hij u dat geeft.", "Ps 119:55": "HEERE! 's nachts ben ik Uw Naam indachtig geweest, en heb Uw wet bewaard.", "Deut 29:10-15": "U staat heden allen voor het aangezicht van de HEERE, uw God: uw hoofden van uw stammen, uw oudsten, en uw opzichters, alle mannen van Israël; Uw kinderen, uw vrouwen, en uw vreemdeling, die in het midden van uw kamp is, van uw houthakker tot uw waterputter toe; Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;", "Gen 34:30": "Toen zei Jakob tegen Simeon en tegen Levi: U hebt mij in het ongeluk gestort, doordat u mij stinkend maakt onder de inwoners van dit land, onder de Kanaänieten en onder de Ferezieten; en ik heb weinig volk in aantal; als zij zich tegen mij verzamelen, zullen zij mij verslaan, en ik zal vernietigd worden, ik en mijn huis.", "Nahum 1:15": "Zie op de bergen de voeten van hem die het goede nieuws brengt, die vrede laat horen; vier uw feestdagen, o Juda! Betaal uw geloften; want de man van Belial zal voortaan niet meer door u heen gaan, hij is helemaal uitgeroeid.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Rom 9:7-33": "Ook zijn zij niet allen kinderen omdat zij nageslacht van Abraham zijn; maar: In Izaak zal uw nageslacht genoemd worden. Dat is: niet de kinderen van het vlees zijn kinderen van God, maar de kinderen van de belofte worden als nageslacht gerekend. Want dit is het woord van de belofte: Rond deze tijd zal Ik komen, en Sara zal een zoon hebben.", "Lev 26:17": "Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand.", "Fil 1:6": "Ervan overtuigd dat Hij, Die in u een goed werk begonnen is, dat zal voleindigen tot op de dag van Jezus Christus;", "Ps 148:1-14": "Halleluja! Looft de HEERE uit de hemelen; looft Hem in de hoogste plaatsen! Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen! Looft Hem, zon en maan! Looft Hem, alle lichtende sterren!", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "2 Kron 12:1-12": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem. Daarom gebeurde het, in het vijfde jaar van koning Rehabeam, dat Sisak, de koning van Egypte, tegen Jeruzalem optrok (want zij hadden tegen de HEERE overtreden), met duizend tweehonderd wagens, en met zestigduizend ruiters; en van het volk dat met hem uit Egypte kwam was geen getal: Libiërs, Sukkieten en Cusjieten.", "Matt 6:10": "Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Ex 8:16-19": "Verder zei de HEERE tegen Mozes: Zeg tegen Aäron: Strek uw staf uit, en sla het stof van de aarde, zodat het tot luizen wordt, in heel Egypteland. En zij deden zo; want Aäron strekte zijn hand uit met zijn staf, en sloeg het stof van de aarde, en er kwamen veel luizen aan de mensen, en aan het vee; al het stof van de aarde werd luizen, in heel Egypteland. De tovenaars deden ook zo met hun bezweringen, om luizen voort te brengen; doch zij konden het niet; zo waren de luizen aan de mensen, en aan het vee.", "Ps 148:14": "En Hij heeft de hoorn van Zijn volk verhoogd, de roem van al Zijn gunstgenoten, van de kinderen van Israël, het volk, dat dicht bij Hem is. Halleluja!", "Gen 41:54": "En de zeven jaren van honger begonnen te komen, zoals Jozef gezegd had. En er was honger in alle landen; maar in heel Egypteland was brood.", "Fil 4:20": "Onze God en Vader nu zij de heerlijkheid tot in alle eeuwigheid. Amen.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Jes 13:3": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid.", "Ps 89:36": "Ik heb eens gezworen bij Mijn heiligheid: Zeker zal Ik aan David niet liegen!", "Jes 34:2-6": "Want de toorn van de HEERE is over alle heidenvolken, en grimmigheid over heel hun leger; Hij heeft hen met de ban geslagen, Hij heeft ze ter slachting overgegeven. En hun gesneuvelden zullen weggeworpen worden, en van hun dode lichamen zal hun stank opstijgen; en de bergen zullen smelten van hun bloed. En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Gen 9:16": "Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.", "Ps 51:3-19": "Wees mij genadig, o God! naar Uw goedertierenheid; delg mijn overtreding uit, naar de grootheid van Uw barmhartigheden. Was mij goed van mijn ongerechtigheid, en reinig mij van mijn zonde. Want ik ken mijn overtredingen, en mijn zonde staat mij steeds voor ogen.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Joël 1:4": "Wat de rups heeft overgelaten, heeft de sprinkhaan afgegeten, en wat de sprinkhaan heeft overgelaten, heeft de kever afgegeten, en wat de kever heeft overgelaten, heeft de kruidworm afgegeten.", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "Ex 1:7": "werden de kinderen van Israël vruchtbaar en namen ze sterk in aantal toe, en zij vermeerderden, en werden buitengewoon machtig, zodat het land met hen vervuld werd.", "Neh 9:15": "En U hebt hun brood uit de hemel gegeven voor hun honger, en hun water uit de steenrots voortgebracht voor hun dorst; en U hebt tot hen gezegd, dat zij zouden ingaan om het land te erven, waarover U Uw hand ophief, dat U het hun zou geven.", "Num 11:4-6": "En het gemengde volk, dat in hun midden was, werd bevangen met lust; daarom weenden ook de kinderen van Israël weer, en zeiden: Wie zal ons vlees te eten geven? Wij denken aan de vissen die wij in Egypte voor niets aten; aan de komkommers, en aan de meloenen, en aan het look, en aan de uien, en aan het knoflook. Maar nu is onze ziel dor, er is helemaal niets, behalve dit manna voor onze ogen!", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Jer 15:16": "Toen Uw woorden gevonden werden, heb ik ze opgegeten, en Uw woord is mij geweest tot vreugde en tot blijdschap van mijn hart; want ik ben naar Uw Naam genoemd, o HEERE, God van de heerscharen!", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "2 Kor 1:20": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.", "Gen 31:27": "Waarom bent u heimelijk gevlucht, en hebt u zich aan mij ontstolen? En hebt u het mij niet verteld, zodat ik u had kunnen wegzenden met vreugde, en met gezangen, met tamboerijn en met harp?", "Openb 11:4": "Dezen zijn de twee olijfbomen en de twee kandelaars, die voor de God van de aarde staan.", "Job 37:17": "Hoe uw klederen warm worden, als Hij de aarde stil maakt vanuit het zuiden?", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 107:35-38": "Hij maakt van de woestijn een waterpoel, en van het dorre land waterbronnen. En Hij doet de hongerigen daar wonen, en zij stichten een stad om in te wonen; En bezaaien akkers, en planten wijngaarden, die vrucht opbrengen.", "Ps 98:1-8": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven. De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen. Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Jer 47:6": "O wee, u zwaard van de HEERE! Hoe lang zult u niet stil houden? Vaar in uw schede, rust en wees stil!", "Ex 34:5": "De HEERE nu kwam neerwaarts in een wolk, en stelde Zich daar bij hem; en Hij riep de Naam van de HEERE uit.", "Luk 14:26-33": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn. En wie zijn kruis niet draagt en Mij navolgt, die kan Mijn discipel niet zijn. Want wie van u die een toren wil bouwen, gaat niet eerst zitten om de kosten te berekenen, of hij wel genoeg heeft om het af te maken?", "Ef 6:19": "en voor mij, opdat mij het Woord gegeven wordt bij het openen van mijn mond, met vrijmoedigheid, om de verborgenheid van het Evangelie bekend te maken;", "Ps 33:10": "De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Ps 27:8": "Mijn hart zegt tegen U: U zegt: Zoek Mijn aangezicht; ik zoek Uw aangezicht, o HEERE!", "2 Kor 3:5": "Niet dat wij uit onszelf bekwaam zijn om iets te bedenken, alsof het uit onszelf komt; maar onze bekwaamheid is uit God;", "Lev 25:55": "Want de kinderen van Israël zijn voor Mij dienstknechten; Mijn dienstknechten zijn zij, die Ik uit het land Egypte geleid heb; Ik ben de HEERE, uw God!", "Ps 135:10-12": "Die veel volken sloeg, en machtige koningen doodde; Sihon, de koning van de Amorieten, en Og, de koning van Basan, en al de koninkrijken van Kanaän, En Hij gaf hun land tot erfenis, tot erfenis aan Zijn volk Israël.", "Joël 1:16": "Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God?", "1 Kor 2:7": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;", "Ps 116:17-19": "Ik zal U een offer van dankzegging offeren, en de Naam van de HEERE aanroepen. Ik zal mijn gelofte de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk, in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "Ps 95:11": "Daarom heb Ik in Mijn toorn gezworen: Zij zullen in Mijn rust niet ingaan!", "Ps 78:15": "Hij kliefde de rotsstenen in de woestijn, en drenkte hen overvloedig, als uit afgronden.", "Gen 37:18-28": "En zij zagen hem van verre; en voordat hij bij hen kwam, smeedden zij een listig plan tegen hem, om hem te doden. En zij zeiden de een tegen de ander: Zie, daar komt die meesterdromer aan! Nu dan, komt, laten wij hem doodslaan en hem in een van deze kuilen werpen; en wij zullen zeggen: Een wild dier heeft hem opgegeten! Zo zullen wij zien wat er van zijn dromen worden zal.", "Joz 24:19": "Toen zei Jozua tegen het volk: U zult de HEERE niet kunnen dienen, want Hij is een heilig God; Hij is een na-ijverig God; Hij zal uw overtredingen en uw zonden niet vergeven.", "Jer 12:7": "Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde van Mijn ziel in de hand van haar vijanden gegeven.", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Jes 12:1-6": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij. Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden. En u zult water scheppen met vreugde uit de fonteinen van het heil;", "Joh 21:23": "Dit woord ging dan uit onder de broeders, dat deze discipel niet zou sterven. En Jezus had tegen hem niet gezegd dat hij niet zou sterven, maar: Als Ik wil dat hij blijft totdat Ik kom, wat gaat het u aan?", "Gen 35:9-13": "En God verscheen Jakob opnieuw, toen hij uit Paddan-Aram gekomen was; en Hij zegende hem. En God zei tegen hem: Uw naam is Jakob, uw naam zal voortaan niet Jakob genoemd worden, maar Israël zal uw naam zijn; en Hij noemde zijn naam Israël. Verder zei God tegen hem: Ik ben God de Almachtige! Wees vruchtbaar en word talrijk! Een volk, ja, een menigte volken zal uit u worden, en koningen zullen uit uw lenden voortkomen.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Luk 1:72": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken;", "Job 33:26": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven.", "Jes 66:14": "En u zult het zien, en uw hart zal vrolijk zijn, en uw beenderen zullen groeien als het tedere gras; dan zal de hand van de HEERE bekend worden aan Zijn knechten, en Hij zal boos worden op Zijn vijanden.", "Neh 12:43": "En zij offerden op die dag grote slachtoffers, en waren vrolijk; want God had hen vrolijk gemaakt met grote vrolijkheid; en ook de vrouwen en de kinderen waren vrolijk; zodat de vrolijkheid van Jeruzalem tot van verre gehoord werd.", "Jer 10:16": "Jakobs deel is niet gelijk die, want Hij is de Formeerder van alles, en Israël is de roede van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "Joz 21:45": "Er viel niet één woord weg van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam allemaal uit.", "Pred 2:8": "Ik verzamelde mij ook zilver en goud, en kostbaarheden van koningen en landstreken; ik nam mij zangers en zangeressen aan, en wat mensenkinderen tot lust strekt: allerlei snarenspel.", "Ps 99:9": "Verhef de HEERE, onze God, en buig u voor de berg van Zijn heiligheid; want de HEERE, onze God, is heilig.", "Gen 17:8": "En Ik zal u en uw nageslacht na u het land waar u als vreemdeling verblijft geven, het hele land Kanaän, tot eeuwig eigendom; en Ik zal hun tot een God zijn.", "Ps 50:23": "Wie dank offert, die zal Mij eren; en wie zijn weg goed inricht, die zal Ik Gods heil doen zien.", "Luk 15:22-32": "Maar de vader zei tegen zijn dienaren: Breng hier het beste kleed, en trek het hem aan, en geef hem een ring aan zijn hand, en schoenen aan zijn voeten; en breng het gemeste kalf, en slacht het; en laten wij eten en vrolijk zijn. Want deze zoon van mij was dood, en is weer levend geworden; en hij was verloren, en is gevonden! En zij begonnen vrolijk te zijn.", "Job 8:21":
