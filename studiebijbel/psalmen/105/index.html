eren","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Looft de HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken.","2":"Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen.","3":"Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.","4":"Vraagt naar de HEERE en Zijn sterkte; zoekt Zijn aangezicht voortdurend.","5":"Gedenkt Zijn wonderen, die Hij gedaan heeft, Zijn wondertekenen, en de oordelen van Zijn mond.","6":"U, nakomelingen van Abraham, Zijn knecht, u, kinderen van Jakob, Zijn uitverkorene!","7":"Hij is de HEERE, onze God; Zijn oordelen zijn over de gehele aarde.","8":"Hij gedenkt Zijn verbond tot in eeuwigheid, het woord dat Hij ingesteld heeft, tot in duizend geslachten;","9":"Het verbond, dat Hij met Abraham heeft gemaakt, en Zijn eed aan Izak;","10":"Wat Hij ook aan Jakob gesteld heeft tot een inzetting, aan Israël tot een eeuwig verbond,","11":"En zei: Ik zal u geven het land Kanaän, het snoer van uw erfdeel.","12":"Toen zij weinig mensen in getal waren, ja, weinig en vreemdelingen daarin;","13":"En van volk tot volk trokken, van het ene koninkrijk tot het andere volk;","14":"Liet Hij geen mens toe hen te onderdrukken; ook bestrafte Hij koningen om hunnentwil, en zei:","15":"Raak Mijn gezalfden niet aan, en doe Mijn profeten geen kwaad.","16":"Hij riep ook een honger over het land; Hij brak elke staf van het brood.","17":"Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf.","18":"Men drukte zijn voeten in de stok; zijn persoon kwam in de ijzers.","19":"Tot de tijd toe dat Zijn woord kwam, heeft de rede van de HEERE hem doorlouterd.","20":"De koning zond, en liet hem ontslaan; de heerser van de volken liet hem los.","21":"Hij zette hem tot een heer over zijn huis, en tot een heerser over al zijn goed;","22":"Om zijn vorsten te binden naar zijn lust, en zijn oudsten te onderwijzen.","23":"Daarna kwam Israël in Egypte, en Jakob verkeerde als vreemdeling in het land van Cham.","24":"En Hij deed Zijn volk zeer meer worden, en maakte het machtiger dan zijn tegenstanders.","25":"Hij keerde hun hart om, zodat zij Zijn volk haatten, dat zij met Zijn knechten listig omgingen.","26":"Hij zond Mozes, Zijn knecht, en Aäron, die Hij verkoren had.","27":"Zij deden onder hen de bevelen van Zijn tekenen, en de wonderwerken in het land van Cham.","28":"Hij zond duisternis, en maakte het duister; en zij waren Zijn woord niet opstandig.","29":"Hij keerde hun water in bloed, en Hij doodde hun vissen.","30":"Hun land bracht kikvorsen voort in overvloed, tot in de binnenste kamers van hun koningen.","31":"Hij sprak, en er kwam een vermenging van ongedierte, luizen, in hun hele gebied.","32":"Hij maakte hun regen tot hagel, vlammend vuur in hun land.","33":"En Hij sloeg hun wijnstok en hun vijgenboom, en Hij brak het geboomte van hun gebied.","34":"Hij sprak, en er kwamen sprinkhanen en kevers, en dat zonder getal;","35":"Die al het kruid in hun land opaten, ja, aten de vrucht van hun akkerland op.","36":"Hij versloeg ook alle eerstgeborenen in hun land, de eerstelingen van al hun krachten.","37":"En Hij voerde hen uit met zilver en goud; en onder hun stammen was niemand die struikelde.","38":"Egypte was blij toen zij uittrokken, want hun verschrikking was op hen gevallen.","39":"Hij breidde een wolk uit tot een deksel, en vuur om de nacht te verlichten.","40":"Zij baden, en Hij deed kwakkels komen, en Hij verzadigde hen met brood uit de hemel.","41":"Hij opende een steenrots, en er vloeide water uit, dat door de dorre plaatsen ging als een rivier.","42":"Want Hij dacht aan Zijn heilig woord, aan Abraham, Zijn knecht.","43":"Zo voerde Hij Zijn volk uit met vrolijkheid, Zijn uitverkorenen met gejuich.","44":"En Hij gaf hun de landen van de heidenen, zodat zij als erfenis bezaten de arbeid van de volken;","45":"Opdat zij Zijn inzettingen zouden onderhouden, en Zijn wetten zouden bewaren. Halleluja!"},"SV":{"1":"Looft den HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken.","2":"Zingt Hem, psalmzingt Hem, spreekt aandachtelijk van al Zijn wonderen.","3":"Roemt u in den Naam Zijner heiligheid; het hart dergenen, die den HEERE zoeken, verblijde zich.","4":"Vraagt naar den HEERE en Zijn sterkte; zoekt Zijn aangezicht geduriglijk.","5":"Gedenkt Zijner wonderen, die Hij gedaan heeft, Zijner wondertekenen, en der oordelen Zijns monds.","6":"Gij zaad van Abraham, Zijn knecht, gij kinderen van Jakob, Zijn uitverkorene!","7":"Hij is de HEERE, onze God; Zijn oordelen zijn over de gehele aarde.","8":"Hij gedenkt Zijns verbonds tot in der eeuwigheid, des woords, *dat* Hij ingesteld heeft, tot in duizend geslachten;","9":"*Des* *verbonds*, dat Hij met Abraham heeft gemaakt, en Zijns eeds aan Izak;","10":"Welken Hij ook gesteld heeft aan Jakob tot een inzetting, aan Israël *tot* een eeuwig verbond,","11":"Zeggende: Ik zal u geven het land Kanaän, het snoer van ulieder erfdeel.","12":"Als zij weinig mensen in getal waren, ja, weinig en vreemdelingen daarin;","13":"En wandelden van volk tot volk, van het ene koninkrijk tot het andere volk;","14":"Hij liet geen mens toe hen te onderdrukken; ook bestrafte Hij koningen om hunnentwil, *zeggende*:","15":"Tast Mijn gezalfden niet aan, en doet Mijn profeten geen kwaad.","16":"Hij riep ook een honger in het land; Hij brak allen staf des broods.","17":"Hij zond een man voor hun aangezicht henen; Jozef werd verkocht tot een slaaf.","18":"Men drukte zijn voeten in den stok; zijn persoon kwam *in* de ijzers.","19":"Tot den tijd toe, dat Zijn woord kwam, heeft hem de rede des HEEREN doorlouterd.","20":"De koning zond, en deed hem ontslaan; de heerser der volken liet hem los.","21":"Hij zette hem tot een heer over zijn huis, en tot een heerser over al zijn goed;","22":"Om zijn vorsten te binden naar zijn lust, en zijn oudsten te onderwijzen.","23":"Daarna kwam Israël in Egypte, en Jakob verkeerde als vreemdeling in het land van Cham.","24":"En Hij deed Zijn volk zeer wassen, en maakte het machtiger dan Zijn tegenpartijders.","25":"Hij keerde hun hart om, dat zij Zijn volk haatten, dat zij met Zijn knechten listiglijk handelden.","26":"Hij zond Mozes, Zijn knecht, *en* Aäron, dien Hij verkoren had.","27":"Zij deden onder hen de bevelen Zijner tekenen, en de wonderwerken in het land van Cham.","28":"Hij zond duisternis, en maakte het duister; en zij waren Zijn woord niet wederspannig.","29":"Hij keerde hun wateren in bloed, en Hij doodde hun vissen.","30":"Hun land bracht vorsen voort in overvloed, *tot* in de binnenste kameren hunner koningen.","31":"Hij sprak, en er kwam een vermenging van ongedierte, luizen, in hun ganse landpale.","32":"Hij maakte hun regen tot hagel, vlammig vuur in hun land.","33":"En Hij sloeg hun wijnstok en hun vijgeboom, en Hij brak het geboomte hunner landpalen.","34":"Hij sprak, en er kwamen sprinkhanen en kevers, en dat zonder getal;","35":"Die al het kruid in hun land opaten, ja, aten de vrucht hunner landouwe op.","36":"Hij versloeg ook alle eerstgeborenen in hun land, de eerstelingen al hunner krachten.","37":"En Hij voerde hen uit met zilver en goud; en onder hun stammen was niemand, die struikelde.","38":"Egypte was blijde, als zij uittrokken, want hun verschrikking was op hen gevallen.","39":"Hij breidde een wolk uit tot een deksel, en vuur om den nacht te verlichten.","40":"Zij baden, en Hij deed kwakkelen komen, en Hij verzadigde hen met hemels brood.","41":"Hij opende een steenrots, en er vloeiden wateren uit, *die* gingen door de dorre plaatsen *als* een rivier.","42":"Want Hij dacht aan Zijn heilig woord, aan Abraham, Zijn knecht.","43":"Alzo voerde Hij Zijn volk uit met vrolijkheid, Zijn uitverkorenen met gejuich.","44":"En Hij gaf hun de landen der heidenen, zodat zij in erfenis bezaten den arbeid der volken;","45":"Opdat zij Zijn inzettingen onderhielden, en Zijn wetten bewaarden. Hallelujah!"},"KJV":{"1":"O give thanks unto the LORD; call upon his name: make known his deeds among the people.","2":"Sing unto him, sing psalms unto him: talk ye of all his wondrous works.","3":"Glory ye in his holy name: let the heart of them rejoice that seek the LORD.","4":"Seek the LORD, and his strength: seek his face evermore.","5":"Remember his marvellous works that he hath done; his wonders, and the judgments of his mouth;","6":"O ye seed of Abraham his servant, ye children of Jacob his chosen.","7":"He *is* the LORD our God: his judgments *are* in all the earth.","8":"He hath remembered his covenant for ever, the word *which* he commanded to a thousand generations.","9":"Which *covenant* he made with Abraham, and his oath unto Isaac;","10":"And confirmed the same unto Jacob for a law, *and* to Israel *for* an everlasting covenant:","11":"Saying, Unto thee will I give the land of Canaan, the lot of your inheritance:","12":"When they were *but* a few men in number; yea, very few, and strangers","13":"When they went from one nation to another, from *one* kingdom to another people;","14":"He suffered no man to do them wrong: yea, he reproved kings","15":"*Saying*, Touch not mine anointed, and do my prophets no harm.","16":"Moreover he called for a famine upon the land: he brake the whole staff of bread.","17":"He sent a man before them, *even* Joseph, *who* was sold for a servant:","18":"Whose feet they hurt with fetters: he was laid in iron:","19":"Until the time that his word came: the word of the LORD tried","20":"The king sent and loosed him; *even* the ruler of the people, and let him go free.","21":"He made him lord of his house, and ruler of all his substance:","22":"To bind his princes at his pleasure; and teach his senators wisdom.","23":"Israel also came into Egypt; and Jacob sojourned in the land of Ham.","24":"And he increased his people greatly; and made them stronger than their enemies.","25":"He turned their heart to hate his people, to deal subtilly with his servants.","26":"He sent Moses his servant; *and* Aaron whom he had chosen.","27":"They shewed his signs among them, and wonders in the land of Ham.","28":"He sent darkness, and made it dark; and they rebelled not against his word.","29":"He turned their waters into blood, and slew their fish.","30":"Their land brought forth frogs in abundance, in the chambers of their kings.","31":"He spake, and there came divers sorts of flies, *and* lice in all their coasts.","32":"He gave them hail for rain, *and* flaming fire in their land.","33":"He smote their vines also and their fig trees; and brake the trees of their coasts.","34":"He spake, and the locusts came, and caterpillers, and that without number,","35":"And did eat up all the herbs in their land, and devoured the fruit of their ground.","36":"He smote also all the firstborn in their land, the chief of all their strength.","37":"He brought them forth also with silver and gold: and *there was* not one feeble *person* among their tribes.","38":"Egypt was glad when they departed: for the fear of them fell","39":"He spread a cloud for a covering; and fire to give light in the night.","40":"*The people* asked, and he brought quails, and satisfied them with the bread of heaven.","41":"He opened the rock, and the waters gushed out; they ran in the dry places *like* a river.","42":"For he remem ":[{"catchword":"Hij sloeg","tekst":"Te weten, door den hagel en het vuur."}],"34":[{"catchword":"kwamen","tekst":"Dit was de achste plaag; Exo 10:13 ; Psa 78:46 ."},{"catchword":"sprinkhanen en","tekst":"Hebr. de sprinkhaan en de kever."}],"36":[{"catchword":"Hij versloeg ook","tekst":"Dit was de tiende plaag. Zie Exo 12:23 , Exo 12:29 ; Psa 78:51 ."},{"catchword":"alle eerstgeborenen","tekst":"In dit vers wordt een ding tweemaal, doch met andere woorden gezegd, hetwelk bij de Hebr. zeer gebruikelijk is. Zie boven vs.20."},{"catchword":"eerstelingen","tekst":"Dit is ene beschrijving der eerstgeborenen, gelijk Gen 49:3 , en Psa 78:51 ."}],"37":[{"catchword":"met zilver","tekst":"Dat is, met zilveren en gouden vaten; Exo 12:35 ."},{"catchword":"onder hun","tekst":"Sterk zijnde zeshonderd duizend mannen, behalve de vrouwen en kinderen, Exo 12:37 , en Exo 13:18 . Dusdanige belofte werd der kerk Gods ook gedaan; Isa 33:24 ."},{"catchword":"die struikelde","tekst":"Te weten, van zwakheid."}],"38":[{"catchword":"hun verschrikking","tekst":"Dat is, zij hadden een schrik voor de Israëlieten gekregen, zodat zij hen voortdreven en hun hun beste juwelen gaven, Exo 12:33 , Exo 12:35 ; vrezende dat zij allen van God zouden gedood worden indien zij hen niet lieten trekken. Zie dergelijke manier van spreken Est 8:17 , en Est 9:2 ."}],"39":[{"catchword":"een wolk","tekst":"Te weten, om de Israëlieten voor de hitte der zon te bedekken en te beschermen."},{"catchword":"vuur om den","tekst":"Dat is, een vurige kolom."}],"40":[{"catchword":"Zij baden,","tekst":"Of, het bad; te weten het volk van Israël. Zie Num 11 , en Psa 78:27-28 ."},{"catchword":"Hij deed","tekst":"Te weten, God de Heere."},{"catchword":"met hemels","tekst":"Dat is, met brood, dat uit den hemel, dat is uit de lucht viel. Zie Exo 16:1-14 ; Psa 78:24-25 ."}],"41":[{"catchword":"Hij","tekst":"Te weten, God."},{"catchword":"opende","tekst":"Te weten, te Rafidim, Exo 17:6 , en te Kades, Num 20:11 . Zie ook Psa 78:15 ."},{"catchword":"de dorre","tekst":"Door welke de Israëlieten reisden. Waar zij gingen, het water volgde hen na. Zie 1Co 10:4 ."}],"42":[{"catchword":"aan zijn heilig","tekst":"Hebr. aan het woord zijner heiligheid; dat is aan zijn heilige beloften."},{"catchword":"aan Abraham","tekst":"Dat is, aan het verbond met Abraham gemaakt. Anderen, tot Abraham [gesproken]."}],"43":[{"catchword":"zijn uitverkorenen","tekst":"Te weten, van God; gelijk boven vs.6."}],"44":[{"catchword":"Hij gaf hun","tekst":"Zie de Boeken Numeri, Deuteronomium, en Jozua."},{"catchword":"der heidenen,","tekst":"Te weten, der zeven natiën, van welke gesproken wordt Psa 78:55 ."},{"catchword":"den arbeid","tekst":"Dat is, de goederen, die de heidense volken met moeite en arbeid verkregen hadden; Deu 6:10-11 ."}],"45":[{"catchword":"Hallelujah","tekst":"Zie de aantekening bij Psa 104:35 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Praise the LORD, [A good part of this Psalm, is extant, 1 Chron.16.8. being sung before the Ark of the LORD] call upon his Name, make known his Acts among the Nations."}],"2":[{"catchword":null,"tekst":"Sing unto him, sing Psalms unto him; speak devoutly of all wonders."}],"3":[{"catchword":null,"tekst":"Glory (or boast) i [Or of] the name of his holiness; let the heart of them that seek the LORD rejoice."}],"4":[{"catchword":null,"tekst":"Enquire after the LORD and his strength: [Whereof they had a visible Testimony in the Ark. See 2 Chron.6.41. Psa 78:61, and the Annot.Psa 63:3.] seek his face continually. [i.e. his Counsel and Commands; 2 Sam.21.v.1.]"}],"5":[{"catchword":null,"tekst":"Remember his wonders, which he hath done; [viz. In Egypt by Moses and Aaron] his miracles and the judgements of his mouth. [understand here, the plagues of Egypt, which God had threatened before hand. The word judgements is taken for plagues, or punishments, as Rom 13:2. and 1 Cor.11.29.]"}],"6":[{"catchword":null,"tekst":"Ye seed of Abraham his servant [These words are likewise, 1 Chron.16.13. with this difference only, that there in stead of Abraham is put Israel] yee children of Jacob his chosen. [viz. Gods]"}],"7":[{"catchword":null,"tekst":"He is the LORD our God: his judgements are over all the earth; that is, over all people and nations, that his Name may be recounted throughout the whole earth, Exo 9:16.]"}],"8":[{"catchword":null,"tekst":"He remembered his Covenant [That namely, which he made with us] in eternity: the Word (which he instituted [Heb. Commanded; i.e. his promise which is so stedfast and assured, as if it were a solemn institution , or ordinance, and a commanded Law. See of the Hebrew word, 2 Sam.7.on v.11.] unto thousand generations: [that is, very many.]"}],"9":[{"catchword":null,"tekst":"(The Covenant) which he made with Abraham: [Hereof see Gen 15:18. and 17.2. and 22.16. Luk 1:73. Heb 6:13.] and his oath to Isaac."}],"10":[{"catchword":null,"tekst":"Which he put likewise for an institution to Jacob, to Israel for an everlasting Covenant."}],"11":[{"catchword":null,"tekst":"Saying, I will give you the Land of Canaan, the line of your inheritance. [See the Annotat. Deut.32.on v.9. and Psa 16:6.]"}],"12":[{"catchword":null,"tekst":"When they were few men in number, [Heb. Men, or people of number, i.e. easy to ne numbered, soon told. See Gen.34.on verse 30.the contrary whereof is, people without number; that is, innumerable, Psa 147:5.] yea few, and strangers therein."}],"13":[{"catchword":null,"tekst":"And walked from people to people: [viz. In the Land of Canaan, wherein there were seven mighty Nations, Deut.7.1. How the Patriarchs wandered and sojourned therein, see Gen 12:8,9.10. and 13.18. and 20.1. and 23.4. and 26.1.23. and ch.33.19. and 35.1. Hebr. 11.9.13.] from the one Kingdom, to another people."}],"14":[{"catchword":null,"tekst":"He suffered no man to oppress them, also he rebuked Kings for their sake, [viz. Both in word and deed; as Pharaoh Gen 12:17. and Abimelech, Gen 20:3. and divers others] (saying.)"}],"15":[{"catchword":null,"tekst":"Touch not [The Prophet introduceth God here, addressing his speech to Kings and Magistrates, & charging them to beware and take heed, that they do no hurt or injustice to Gods servants] my anointed (ones), [i.e. those which are sanctified and set apart for my service. Here is spoken first of Abraham, Isaac and Jacob, under whose names the rest of Gods Prophets and Ministers are to be understood] and do no evil to my Prophets. [ Abraham is called a Prophet, Gen 20:7. See the Annotations.]"}],"16":[{"catchword":null,"tekst":"He called likewise a famine into the land, [viz. Of Egypt, Canaan, and other Countrys, Gen 41:45. etc. And 42.1. The manner of speaking here, is used likewise, 2 King.8.1. Dearth and famine, like all other plagues and judgements, are pursuivants, and executioners of Gods commands and Decrees against sinners] he broke all the or aged body is supported and upheld by a staff; so doth the bread sustain and strengthen mans heart, Psa 104:15.]"}],"17":[{"catchword":null,"tekst":"He sent a man before their face: Joseph was sold for a slave."}],"18":[{"catchword":null,"tekst":"They pressed his feet in the stocked (or fetters.) [See Gen 39:20. and 40.15.] his person [Heb. His soul, i.e. himself. See that Annot. Gen.12.on v.5.] came into the iron fetters, Hebrew, into the iron.]"}],"19":[{"catchword":null,"tekst":"Until the time that his word came, [viz. The Word of the LORD; that is to say; until the time was fulfilled, that the things should come to pass, which God had decree over him, and revealed formerly unto him i a dream, Gen 36:5. etc, and 42.9 the word or verb to come, for accomplish, is likewise used. 1 Sam.9.6. Job 6:8. Jer 17:15. and elsewhere] the sayings of the LORD [i.e. the promises which God had made unto him by dreams, Gen.37.] purified him. [viz. By grievous sufferings and afflictions. See Psal.12.on v.7. and 1 Pet.1.7.]"}],"20":[{"catchword":null,"tekst":"The King sent [Pharaoh, namely, Gen 41:14. and 45.8.] and set him free: the ruler of people, he let him loose. [Hebr. He opened him. i.e. he opened and loosened the bonds and fetters, wherewith he was bound.]"}],"21":[{"catchword":null,"tekst":"He set him Lord over his house: and ruler over all his goods."}],"22":[{"catchword":null,"tekst":"To bind his Princes [The Kings, Namely, Pharaohs] according to his pleasure, [Heb. According to his soul: i.e. according to his own good will, pleasure and discretion. Others, oblige to his soul] and to instinct [viz. How they should gather and preserve the Corn of the fruitful years, for provision against the dearth to come, Gen 41:47.] his Eldest. [viz. The Senators or Counsellors of Kings Pharaoh, the chief Noble men at his Court.]"}],"23":[{"catchword":null,"tekst":"Then came Israel [Together with all his family, being called by Pharaoh and Joseph, and excited and strengthened by God for it, Gen 45:17,20. And 46.3.4.] and Jacob sojourned as a stranger, in the land of Cham. [i.e. in the land which the posterity of Cham had in possession: to wit, in Egypt, Cham was Mitsraims father, Gen 10:6. from whom the land of Egypt is called Mistsraim. See Psa 78:51.]"}],"24":[{"catchword":null,"tekst":"And he made his people to grow much and made them mightier then his adversaries, [Or his distressours.]"}],"25":[{"catchword":null,"tekst":"He turned their heart about, [The Egyptians, namely, others their heart turned about, or was turned about] that they hated his people, that they dealt subtily with his powers. See the Annot. Gen.37.on verse 18. Or that they laid wiles, (plotted) against his servants, viz. Against the children of Israel."}],"26":[{"catchword":null,"tekst":"He sent Moseh his servant, (and) Aaron whom he had chosen, [To be the mouth of Moseh to the people, and a Prophet to Pharaoh, Exodus 4. Verse 12,14,16. And 7.1,2,3.]"}],"27":[{"catchword":null,"tekst":"They did (or performed) among them the Commandments of his tokens, [Heb. The words of his signs, that is to say, the charge, which God had given them to do signs] in the land of Cham. [See above v.23.]"}],"28":[{"catchword":null,"tekst":"He [God namely] sent darkness and made it dark: [this was the ninth plague which God sent over Egypt: and this darkness lasted for three days together, Exo 10:22,23.] and they were not refractory to his word. [i.e. command, meaning that those miraculous sings, happened immediately upon the word uttered. Or you may understand it thus, that Moseh and Aaron, were ready to act and perform what they were enjoyened, though with the great hazard of their lives.]"}],"29":[{"catchword":null,"tekst":"He returned their waters into blood, and he made their fish die. [Tis was the first of the ten plagues of Egypt, Exo 7:20. Psa 78:44. The Prophet bringeth in some of the leagues here which God wrought in Egypt, without observing the order set down in Exodus.]"}],"30":[{"catchword":null,"tekst":"Their land brought forth frogs in abundance, [This was the second plague, Exo 8:3.6. Psa 68:45.] into the (very) innermost Chambers of their Kings. [understand here of Pharaoh and his Princes, Exo 8:3.]"}],"31":[{"catchword":null,"tekst":"he spake, and there came a mixture of insects: [As Grasshoppers, swarms of flies, and the like. See Psalm 78.v.45. this was the fourth plague, Exo 8:24.] lice throughout all their border. [this was the third plague, Exod.8.v.17.]"}],"32":[{"catchword":null,"tekst":"he made their rain to hail, [This was the seventh plague Exo 9:23. See also Psa 78:47.] flaming fire in their land. [Heb. Fire of the flame, as never the like was seen in Egypt. Exo 9:24.]"}],"33":[{"catchword":null,"tekst":"And he smote their vine and their fig-tree, and he, brake the trees of their border, [viz. By the hail and by the fire.]"}],"34":[{"catchword":null,"tekst":"He spake, and there came Grasshoppers and Beetles: [Heb. The grasshoppers and the Battle: this was the eight plague, Exo 10:13. Psa 78:46.] and that without number."}],"35":[{"catchword":null,"tekst":"Which ate up all the herb in their land, yea they ate up the fruit of their Country."}],"36":[{"catchword":null,"tekst":"He smote likewise all the first-born in their land; [This was tenth league, see Exo 12:23,29. Psa 78:51.] The firstlings of all their visors [This is a description of the firstborn; as Gen 49:3. and Psa 78:51. so that one and the same thing is twice set down in this verse, though not in the same words, which is usual with the Hebrews: See above v.20.]"}],"37":[{"catchword":null,"tekst":"And he led them forth with silver and gold, [That is, with silver and golden vessels, Exo 12:35.] and among their Tribes [consisting of six hundred thousand men; besides women ad children, Exo 12:37. and chap.13.18.] there was none which stumbled. [viz. Of weakness or feebleness: the like promise is made to the Church of God, Isa 33:24.]"}],"38":[{"catchword":null,"tekst":"Egypt was glad when they marched forth for their terror was fallen upon them: [That is, they stood in deadly fear of the Israelites, so that they urged and priest them to go, and gave them their best jewels Exo 12:33, 35. Fearing God would put them all to death, if they suffered them to go. Se the like kind of expression, Esth.8.17. and 9.2.]"}],"39":[{"catchword":null,"tekst":"He spread forth a cloud for a covering, [viz. For to cover and shield the Israelites against the heat of the Sun] and fire to enlighten the night. [i.e. fiery pillar.]"}],"40":[{"catchword":null,"tekst":"They entreated, [Or, it entreated or prayed, viz. The people of Israel. See Numb.11. and Psa 78:27,28.] and he made Quails to come, [God namely] and he filled (or satisfied them) with heavenly bread. [i.e. with bread which came from heaven, i.e. fell down out of the Air. See Exo 16:1,2. And 13.14. Psa 78:24.25.]"}],"41":[{"catchword":null,"tekst":"He [God] opened a rock, [viz. At Raphidim, Exo 17:6. and at Kades, Num 20:11. See likewise Psa 78:15.] and there flowed waters forth, (which) went thorough the dry places [which the Israelites past thorough: Whither they went, the water followed them. See 1 Cor.10.4.] (as) a river."}],"42":[{"catchword":null,"tekst":"For he was mindful of his holy word, [Heb. Of the word of his holiess, i.e. of his holy promises] to Abraham his senate, [i.e. of his Covenant made with Abraham: Others, (spoken) to Abraham.]"}],"43":[{"catchword":null,"tekst":"Thus he led forth his people with gladness: his chosen [Gods namely, as above v.8.] with shouting."}],"44":[{"catchword":null,"tekst":"And he gave them the Countries of the Heathen, [viz.of the seven Nations, of whom is spoken, Psalm.78. 55. See the books of Numbers, Deuteromy, and Joshua.] so that they possessed by inheritance the labour of the Nations; [i.e. the goods and possessions which these heathen people had got and gathered together with much toil and labour, Deut.6.10,11.]"}],"45":[{"catchword":null,"tekst":"That they might entertain his institutions, and keep his laws. Halelu-Jah. [See the Annotations, Psalm 104.on verse 35.]"}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const popupCache = {};

  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;

  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
