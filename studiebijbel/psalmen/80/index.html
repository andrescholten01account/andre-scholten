de weg voorbijgaan, hem plukken?","14":"Het zwijn uit het woud heeft hem uitgewroet, en het wild van het veld heeft hem afgeweid.","15":"O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen[2] deze wijnstok,","16":"en de stam die Uw rechterhand geplant heeft, en dat om de zoon die U voor Uzelf gesterkt hebt!","17":"Hij is met vuur verbrand; hij is afgehouwen; zij komen om van het schelden van Uw aangezicht.","18":"Uw hand zij over de man van Uw rechterhand, over de zoon van de mens, die U voor Uzelf gesterkt hebt.","19":"Zo zullen wij van U niet terugkeren; behoud ons in het leven, zo zullen wij Uw Naam aanroepen.","20":"HEERE, God van de heerscharen! Breng ons terug; laat Uw aanschijn lichten, zo zullen wij verlost worden."},"SV":{"1":"Voor den opperzangmeester, op Schoschannim; een getuigenis, een psalm van Asaf.","2":"O Herder Israëls! neem ter ore, Die Jozef als schapen leiddet; Die tussen de cherubim zit, verschijn blinkende.","3":"Wek Uw macht op voor het aangezicht van Efraïm, en Benjamin, en Manasse, en kom tot onze verlossing.","4":"O God! breng ons weder, en laat Uw aanschijn lichten, zo zullen wij verlost worden.","5":"O HEERE, God der heirscharen! hoe lang zult Gij roken tegen het gebed Uws volks?","6":"Gij spijst hen met tranenbrood, en drenkt hen met tranen uit een drieling.","7":"Gij hebt ons onzen naburen tot een twist gesteld, en onze vijanden spotten onder zich.","8":"O God der heirscharen! breng ons weder, en laat Uw aangezicht lichten; zo zullen wij verlost worden.","9":"Gij hebt een wijnstok uit Egypte overgebracht, hebt de heidenen verdreven, en hebt denzelven geplant;","10":"Gij hebt *de* *plaats* voor hem bereid, en zijn wortelen doen inwortelen, zodat hij het land vervuld heeft.","11":"De bergen zijn met zijn schaduw bedekt geweest, en zijn ranken waren *als* cederbomen Gods.","12":"Hij schoot zijn ranken uit tot aan de zee, en zijn scheuten tot aan de rivier.","13":"Waarom hebt Gij zijn muren doorgebroken, zodat allen, die den weg voorbijgaan, hem plukken?","14":"Het zwijn uit het woud heeft hem uitgewroet, en het wild des velds heeft hem afgeweid.","15":"O God der heirscharen! keer toch weder; aanschouw uit den hemel, en zie, en bezoek dezen wijnstok,","16":"En den stam, dien Uw rechterhand geplant heeft, en dat om den zoon, *dien* Gij U gesterkt hebt!","17":"Hij is met vuur verbrand; hij is afgehouwen; zij komen om van het schelden Uws aangezichts.","18":"Uw hand zij over den man Uwer rechterhand, over des mensen zoon, *dien* Gij U gesterkt hebt.","19":"Zo zullen wij van U niet terugkeren; behoud ons in het leven, zo zullen wij Uw Naam aanroepen.","20":"O HEERE, God der heirscharen! breng ons weder; laat Uw aanschijn lichten, zo zullen wij verlost worden."},"KJV":{"1":"[[To the chief Musician upon Shoshannimeduth, A Psalm of Asaph.]] Give ear, O Shepherd of Israel, thou that leadest Joseph like a flock; thou that dwellest *between* the cherubims, shine forth.","2":"[[To the chief Musician upon Shoshannimeduth, A Psalm of Asaph.]] Give ear, O Shepherd of Israel, thou that leadest Joseph like a flock; thou that dwellest *between* the cherubims, shine forth.","3":"Before Ephraim and Benjamin and Manasseh stir up thy strength, and come *and* save","4":"Turn us again, O God, and cause thy face to shine; and we shall be saved.","5":"O LORD God of hosts, how long wilt thou be angry against the prayer of thy people?","6":"Thou feedest them with the bread of tears; and givest them tears to drink in great measure.","7":"Thou makest us a strife unto our neighbours: and our enemies laugh","8":"Turn us again, O God of hosts, and cause thy face to shine; and we shall be saved.","9":"Thou hast brought a vine out of Egypt: thou hast cast out the heathen, and planted","10":"Thou preparedst *room* before it, and didst cause it to take deep root, and it filled the land.","11":"The hills were covered with the shadow of it, and the boughs thereof *were like* the goodly cedars.","12":"She sent out her boughs unto the sea, and her branches unto the river.","13":"Why hast thou *then* broken down her hedges, so that all they which pass by the way do pluck","14":"The boar out of the wood doth waste it, and the wild beast of the field doth devour","15":"Return, we beseech thee, O God of hosts: look down from heaven, and behold, and visit this vine;","16":"And the vineyard which thy right hand hath planted, and the branch *that* thou madest strong","17":"*It is* burned with fire, *it is* cut down: they perish at the rebuke of thy countenance.","18":"Let thy hand be upon the man of thy right hand, upon the son of man *whom* thou madest strong","19":"So will not we go back from thee: quicken us, and we will call upon thy name.","20":"Turn us again, O LORD God of hosts, cause thy face to shine; and we shall be saved."}},"tsk":{"2":[{"kopje":"Neem het ter oor","refs":["Ps 5:2","Ps 55:2"]},{"kopje":"O Herder","refs":["Ps 23:1","Ps 23:2","Jes 40:11","Ezech 34:23","Joh 10:14","Hebr 13:20","1 Petr 2:25","1 Petr 5:4"]},{"kopje":"leidde","refs":["Ps 77:21","Ps 78:52","Jes 49:9","Jes 49:10","Jes 63:11","Joh 10:3","Joh 10:4"]},{"kopje":"zit","refs":["Ps 99:1","Ex 25:20-22","1 Sam 4:4","2 Sam 6:2","2 Kon 19:15","Ezech 1:13","Ezech 10:4"]},{"kopje":"verschijn blinkend","refs":["Ps 80:4","Ps 80:8","Ps 80:20","Ps 50:2","Ps 94:1","Deut 33:2","Job 10:3","Jes 60:1","Ezech 43:2","Dan 9:17","Openb 21:23"]}],"3":[{"kopje":"Voor het aangezicht van","refs":["Num 2:18-24","Num 10:22-24"]},{"kopje":"Wek Uw macht op","refs":["Ps 35:23","Ps 44:24-27","Ps 78:38","Jes 42:13","Jes 42:14"]},{"kopje":"kom tot onze verlossing","refs":["Jes 25:9","Jes 33:22"]}],"4":[{"kopje":"Breng ons terug","refs":["Ps 80:8","Ps 80:20","Ps 85:5","1 Kon 18:37","Jer 31:18","Jer 31:19","Klaagl 5:21"]},{"kopje":"laat","refs":["Ps 80:2","Ps 4:7","Ps 67:2","Ps 119:135","Num 6:25","Num 6:26"]}],"5":[{"kopje":"hoe lang","refs":["Ps 85:6","Jes 58:2","Jes 58:3","Jes 58:6-9","Klaagl 3:44","Matt 15:22-28","  Asaf, gelijk Psa 79:1 ."},{"catchword":"O Herder","tekst":"Verg. Psa 23:1 , en Psa 48:15 ; Isa 40:11 ; Eze 34:12 , Eze 34:14-15 ; Joh 10:11 , en 1Pe 2:25 ."},{"catchword":"Jozef","tekst":"Jozef, dat is, de nakomelingen van Jozef, te weten de stammen van Efraïm en Manasse, die van Jozef afkomstig waren. De Heilige Schrift begrijpt somtijds onder den naam van Jozef al de andere stammen, en voornamelijk de tien stammen, overmits Jozef de voornaamste en geachtste was onder de kinderen van Jakob; zie Gen 49:26 , en Psa 81:6 ."},{"catchword":"die","tekst":"Of, die op de cherubim pleegt te zitten; want nadat de tempel door de Chaldeën was afgebroken en verwoest, zat de Heere niet langer op de cherubim. Van de cherubim, zie de aantekeningen bij 1Sa 4:4 ."},{"catchword":"verschijn","tekst":"Dat is, toon ons uwe gunst en genade, ons verlossende uit deze langdurige gevangenis, in welke wij nu langen tijd als in duisternis gezeten hebben."}],"3":[{"catchword":"O Herder","tekst":"Verg. Psa 23:1 , en Psa 48:15 ; Isa 40:11 ; Eze 34:12 , Eze 34:14-15 ; Joh 10:11 , en 1Pe 2:25 ."},{"catchword":"Jozef","tekst":"Jozef, dat is, de nakomelingen van Jozef, te weten de stammen van Efraïm en Manasse, die van Jozef afkomstig waren. De Heilige Schrift begrijpt somtijds onder den naam van Jozef al de andere stammen, en voornamelijk de tien stammen, overmits Jozef de voornaamste en geachtste was onder de kinderen van Jakob; zie Gen 49:26 , en Psa 81:6 ."},{"catchword":"die","tekst":"Of, die op de cherubim pleegt te zitten; want nadat de tempel door de Chaldeën was afgebroken en verwoest, zat de Heere niet langer op de cherubim. Van de cherubim, zie de aantekeningen bij 1Sa 4:4 ."},{"catchword":"verschijn","tekst":"Dat is, toon ons uwe gunst en genade, ons verlossende uit deze langdurige gevangenis, in welke wij nu langen tijd als in duisternis gezeten hebben."}],"4":[{"catchword":"Wek","tekst":"Dat is, toon en doe uwe macht blijken, die nu een tijdlang als geslapen heeft."},{"catchword":"Efraïm . . .Benjamin . . .Manasse","tekst":"Dat is, voor de stammen of nakomelingen van Efraïm, Benjamin en Manasse. Deze drie stammen waren bij elkander gelegerd aan de westzijde des tabernakels, Num 2:17-18 , Num 2:20 , Num 2:22 , en Num 10:21-24 . Daarom worden zij hier en 1Ch 9:3 , en elders meer, gelijkelijk genoemd."}],"5":[{"catchword":"O God","tekst":"Dit vers wordt herhaald vs.8, 20."},{"catchword":"breng","tekst":"Te weten, in onzen vorigen staat, of uit onze gevangenis en ballingschap, in het land waaruit wij vervoerd zijn. Anders, verkwik ons, gelijk Psa 23:3 ."},{"catchword":"laat","tekst":"Te weten, over ons. Zie de aantekeningen bij Num 6:25-26 ."}],"6":[{"catchword":"roken","tekst":"Dat is, toornig zijn, ons gebed in grote toornigheid verstotende. Het is ene gelijkenis, ziende op het gelaat dergenen, die zeer vertoornd zijn; zie Psa 74:1 ."}],"7":[{"catchword":"Gij","tekst":"Dat is, Gij spijst ons, zie Psa 42:4 ."},{"catchword":"met tranenbrood","tekst":"De zin dezer woorden is dat hun het lijden zo gemeen is als eten en drinken, en dat zij met zeer grote zwarigheden bezocht werden. Of, tranenbrood; dat is, brood in de tranen gedoopt: of tranen in de plaats van brood, gelijk Psa 42:4 ."},{"catchword":"een drieling","tekst":"Of, een grote maat. Het Hebreeuwse woord betekent ene maat, hetzij van natte, gelijk hier, of droge waren, gelijk het schijnt genomen te worden Isa 40:12 ; waar drie gemene maten ingaan, waarvan de grootte ons onbekend is."}],"8":[{"catchword":"onzen naburen","tekst":"Te weten, de Edomieten, gelijk Psa 79:4 , en andere goddelozen."},{"catchword":"tot een","tekst":"Dat is, zij twisten en dwarsdrijven dagelijks tegen ons. Of, zij twisten onder elkander, wie de eer zal hebben van ons te onderdrukken."},{"catchword":"spotten","tekst":"Te weten, met ons, als zij zien dat het ons kwalijk gaat."}],"9":[{"catchword":"breng","tekst":"Zie boven vs.4."}],"10":[{"catchword":"wijnstok","tekst":"Aldus noemt hij de kerk en het volk van Israël, gelijk ook Isa 5:1 , Isa 5:7 ; Jer 2:21 ; Mat 21:33 ; Mar 12:1 ; Luk 20:9 ."},{"catchword":"de heidenen","tekst":"Versta hier de zeven natiën der Kanaänieten. Zie het boek Jozua en Psa 44:3 , en Psa 78:55 ."},{"catchword":"hem","tekst":"Te weten, wijnstok; Exo 15:17 ; Psa 44:3 ."}],"11":[{"catchword":"bereid","tekst":"Dat is, Gij hebt de Kanaänieten voor hun aangezicht uitgestoten en verdreven; Exo 23:28 ; Jos 24:12 . Zie de aantekeningen bij Gen 24:31 , aangaande de betekenis van het Hebr. woord, hetwelk eigenlijk betekent uitzuiveren, reinigen, uitkeren."},{"catchword":"doen","tekst":"Dat is, diep en vast in de aarde doen wassen."},{"catchword":"vervuld","tekst":"Te weten, met zijne ranken."}],"12":[{"catchword":"De bergen","tekst":"De psalmist geeft te kennen dat het volk van Israël zeer vermenigvuldigd is geweest door het gehele land Kanaän."},{"catchword":"cederbomen","tekst":"Dat is, zeer grote, zeer hoge cederbomen. Zie de aantekeningen bij Gen 13:10 ; Psa 36:7 staat bergen des Heeren; dat is, grote en hoge bergen. Of cederbomen Gods, betekent hier cederbomen door God zelf geplant; gelijk Psa 104:16 ."}],"13":[{"catchword":"Hij","tekst":"Te weten, de wijnstok, dat is, het volk Gods, het volk van Israël."},{"catchword":"tot aan de zee,","tekst":"Te weten, tot aan de Middellandse zee; gelijk Psa 72:8 ."},{"catchword":"aan de rivier","tekst":"Te weten, Eufraat, gelijk Psa 72:8 ."}],"14":[{"catchword":"zijn","tekst":"Dat is, zijne sterkten, of vastigheden, welke verbroken zijnde, zo ligt het land open tot een prooi zijner vijanden. Zie Psa 89:41-42 , en Isa 5:5 ."}],"15":[{"catchword":"Het zwijn","tekst":"Aldus noemt hij de vijanden en vervolgers van Gods volk; gelijk Psa 68:31 , welke in die tijden inzonderheid waren de Assyriërs en de Babyloniërs; gelijk te lezen is 2Ki 17:6 , en 2Ki 25:1 ."},{"catchword":"het wild","tekst":"Hier kan men verstaan de wilde dieren, waarmede God zijn volk dreigende is, Lev 26:22 ; of de wrede tirannen, gelijk in ditzelfde vers door de wilde zwijnen wordt te verstaan gegeven. Zie Job 4:11 ."}],"16":[{"catchword":"keer toch","tekst":"Te weten, tot onze hulp, welke Gij, op ons vertoornd zijnde, nu langen tijd ons hebt onttrokken."},{"catchword":"bezoek","tekst":"Zie de aantekeningen bij Gen 21:1 , en Job 5:24 ."}],"17":[{"catchword":"om den zoon","tekst":"Versta hier, den Zoon Gods. Verg. Psa 2:7 ; Isa 9:5 ; Dan 9:17 , en vs.18. Anderen verstaan door den zoon hier een jonge spruit, en duiden het op Israël of de gemeente Gods."},{"catchword":"dien Gij","tekst":"Verg. Isa 49:1-5 , Isa 49:8 , enz. Anders, [ spruit] [ die ] Gij groot en sterk gemaakt hebt tot uwe eer, en om vrucht daarvan te genieten."}],"18":[{"catchword":"Hij is","tekst":"Te weten, de stam, vs.16, of hij; te weten, de wijnstok, gelijk vs.9."},{"catchword":"zij komen","tekst":"Te weten, de mensen, en met name uw volk Israël [van hetwelk hier gesproken wordt] vergaat, wanneer Gij uw aangezicht tegen hetzelve zet om den vloek tegen hem uit te spreken. Zie bij Psa 9:6 , de aantekeningen."}],"19":[{"catchword":"Uw hand","tekst":"Versta dit vers van den Zoon Gods, den Messias, van wien gesproken is vs.16. Uwe hand zij over hem, is zoveel als: Wees met hem, onderhoud hem en bevorder zijn rijk. Zie gelijke manier van spreken Ezr 7:6 , enz., en verg. Psa 118:25 ; Isa 11:2-3 , en Isa 61:1 ; Act 10:38 ."},{"catchword":"over den","tekst":"Dat is, dien Gij zo liefhebt als uwe rechterhand. Zie Gen 35:18 , of den man die uw naaste, of metgezel is, Zec 13:7 , [als zijnde uw eeuwige Zoon] en door welken Gij uwe kracht uitstrekt, alles geschapen hebt, onderhoudt en regeert, Joh 1:3 ; Col 1:16 ; Heb 1:2-3 , en tot wien Gij gezegd hebt: Zit tot mijne rechterhand, enz.; Psa 110:1 , genoemd, des mensen Zoon; Psa 8:5 ; Heb 2:6 , Heb 2:9 , en doorgaans in het Nieuwe Testament, gelijk Hij ook alzo verschenen is; Dan 7:13 . Bij dezen man [gelijk ook bij des mensen Zoon, waarvan terstond volgt] verstaan sommigen het volk van Israël, die ook Gods eerstgeboren Zoon genoemd wordt; Exo 4:22 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"For the chief song-master upon Shoshannim: [See the Annot.on Psa 45:1.] a Testimony, [a testification, or declaration of faith in Gods gracious promises during the heavy pressure of his Church] a Psalm of ASaph: [or for Asaph, as Psa 79:1.] (80:2) O Shepherd of Israel, [Compare Psal.23.1. and 48.15. Isa 40:11. Eze 34:12,14,15. Joh.10.11. and 1 Pet. 2.25.] take to ears: [or, hearken, listen] which leadeth Joseph like sheep: [Joseph, that is the posterity of Joseph, to wit, the tribes of Ephraim and Manasse, which described from Joseph. The holy Scripture doth sometimes comprehend under the name of Joseph all the rest of the Tribes, especially the ten, in regard that Joseph was the principal and most reputed among the sons of Jacob; See Gen 49:26. Psa 81:6.] which sitteth between the Cherubims, [or, which was wont, or (used) to sit upon the Cherubim: For after that the Chaldees had destroyed the Temple, the LORD fate no longer upon the Cherubim there; of the Cherubim see 1 Sam.4.4.] appear shining (or with lustre.) [i.e. shew us thy grace and favour by delivering us out of this long and loathsome captivity, wherein we have sat so long as in darkness.]"}],"2":[{"catchword":null,"tekst":"For the chief song-master upon Shoshannim: [See the Annot.on Psa 45:1.] a Testimony, [a testification, or declaration of faith in Gods gracious promises during the heavy pressure of his Church] a Psalm of ASaph: [or for Asaph, as Psa 79:1.] (80:2) O Shepherd of Israel, [Compare Psal.23.1. and 48.15. Isa 40:11. Eze 34:12,14,15. Joh.10.11. and 1 Pet. 2.25.] take to ears: [or, hearken, listen] which leadeth Joseph like sheep: [Joseph, that is the posterity of Joseph, to wit, the tribes of Ephraim and Manasse, which described from Joseph. The holy Scripture doth sometimes comprehend under the name of Joseph all the rest of the Tribes, especially the ten, in regard that Joseph was the principal and most reputed among the sons of Jacob; See Gen 49:26. Psa 81:6.] which sitteth between the Cherubims, [or, which was wont, or (used) to sit upon the Cherubim: For after that the Chaldees had destroyed the Temple, the LORD fate no longer upon the Cherubim there; of the Cherubim see 1 Sam.4.4.] appear shining (or with lustre.) [i.e. shew us thy grace and favour by delivering us out of this long and loathsome captivity, wherein we have sat so long as in darkness.]"}],"3":[{"catchword":null,"tekst":"(3) Rouze up thy might [Shew forth thy might and let it appear, which was in a manner asleep all this while] before the face of Ephraim and Benjamin, and Manasse; [i.e. for, or in the behalf of the Tribes of Ephraim, Benjamin, and Manasse. These three Tribes were camped together on the west side of the Tabernacle; Num 2:17,18,20,22. And chap.10.21,22,23,24. Therefore they are both here, and 1 Chron.9.3. and elsewhere named jointly together,] and come to our deliverance."}],"4":[{"catchword":null,"tekst":"(4) O God, [This verse is repeated, v.8. and verse 20.] bring us again, [viz. To our former state and condition, or, out of our captivity and wandering into the land, whence we were carried forth; others, revive us, as Pasl.23.3.] and let thy face shine [viz. Over us; see the Annot. Num.6.on v.25,26.] so shall we be delivered."}],"5":[{"catchword":null,"tekst":"(5) O LORD, God of hosts, how long wilt thou smoak against the prayer of thy people? [i.e. be angry, rejecting our prayer in great anger; it is a similitude or comparison taken from the carriage of such as are extremely angered; see Psa 74:1.]"}],"6":[{"catchword":null,"tekst":"(6) Thou feedest them [i.e. thou feedest us. See Psa 42:4.] with tear-bread; (or bread of tears [the sence of these words is, that affliction is as common to them, as their meat and drink, and that they are visited with very great and sensible griences. Or, bread of tears, that is, bread dipped in tears, or tears in stead of bread, as Psa 42:4.] and drenchest them with (or givest them to drink) tears out of a great measure. [The Hebrew word doth signify a certain measure of either liquid, as here, or dry wares, as it seems to be used Isa 40:12. which held three ordinary measures, though of what size or largeness be unknown.]"}],"7":[{"catchword":null,"tekst":"(7) Thou hast set us for a strife (or contention) to our neighbours, [viz. The Edomites, as Psa 79:4. and other wicked people about us; who contend with, cross and thwart us daily; or they contend and strive among themselves, who shall have the honour and advantage to subdue and ruine us] and our enemies make a mock amongt them. [viz. Of us, or with us, when they see us in straights and troubles.]"}],"8":[{"catchword":null,"tekst":"(8) O God of boasts bring us again; [See above v.4. and let thy face shine, so shall we be saved."}],"9":[{"catchword":null,"tekst":"(9) Thou hast brought over a Vine [thus he calleth the Church and people of Israel, as also Isa.chap.5.1,7. Jer 2:21. Mat 21:33. Mark 12,1. Luk 10:9.] out of Egypt: hast expelled the heathen, [understand here the seven Nations of the Canaanites. See the book of Joshua and Psa 44:3. and 78.55.] and hast planted the same [Vine, namely, Exo 15:17. Psa 44:3.]"}],"10":[{"catchword":null,"tekst":"(10) Thou hast prepared (the place) before him, [i.e. thou hast driven and thrust out the Canaanites, out the Canaanites, before their faces, Exo 23:28. Josh.24.12. see the annot.on Gen 24:31. touching the signification of the Hebrew word, which properly is, to cleanse, scoured, sweep out;] and made his roots to take rooting [to grow deep and firm in the ground] so that he hath filled the land: [viz. With his branches.]"}],"11":[{"catchword":null,"tekst":"(11) The hills were covered with his shadow, [The Psalmist implieth, that the people of Israel was mightily multiplied, throughout all the land of Canaan,] and his branches were (like) the Cedar-trees of God. [mighty great and tall ones: See the annot.on Gen 13:10. Psal.36.7. you have mountains of the Lord, i.e. very great and lofty ones: or, Cedar-trees of God, do signify such as were of Gods own planting, as Psal.104.16.]"}],"12":[{"catchword":null,"tekst":"(12) He [Meaning that Vine, viz. The people of God, the people of Israel] shot forth his branches unto the Sea; [viz. To the midland, or Mediterranean Sea, as Psal.72.8.] and his sprouts unto the river. [Euphrates, namely, as Psa 72:8.]"}],"13":[{"catchword":null,"tekst":"(13) Why hast thou broken through his walls, [i.e. all his Forts and strongs holds, which being broke thorough, layeth the whole land open to the prey of his enemies: See Psa 89:4.42. and Isa. 5.5.] so that all which pass by that way, do pluck him?"}],"14":[{"catchword":null,"tekst":"(14) The Boar out of the wood [Thus he calleth the enemies and persecuters of Gods people, as Psa 68:31. which were then especially the Assyrians and Babylonians, as we read, 2 Kings 17.6. and 25.1.] hath rooted him up: and the savage (beast) of the field hath eat him off. [Hereby may be understood the wild beasts, wherewith God threatened his people, Levit.26.22. or fierce and cruel Tyrants; as likewise are implied by the wild Boars before mentioned: see Job 24:21.]"}],"15":[{"catchword":null,"tekst":"(15) O God of hoasts, turn again now, [viz. To help us after that thou hast so long with-held thine assistance from us] regard out of Heaven, and behold, and visit this Vine. [See the Annotat. Gen.21.on verse 1. And Job 5:24.]"}],"16":[{"catchword":null,"tekst":"(16) And the stock (or stem) which thy right hand hath planted, and that for the Son; [Understand here the son of God: compare Psa 2:7. Isa 9.5. Dan.9.17. and here below, verse 18. Others understand by the Son here, a young sprout or branch, and apply it to Israel, or the Church of God:] (whom) thou hast strengthened thee: [compare Isa.49.v.1,2,3,4,5,8. Etc. Others, sprout which thou madest great and strong for thy glory, and to enjoy the fruit thereof.]"}],"17":[{"catchword":null,"tekst":"(17) She is burnt with fire, she is cut off; [That same stock or stem v.16.or, he viz. The Vine, as v.9.] They perish from the rebuke of thy Countenance: [they, viz. Thy people Israel, of whom the Text here speaketh, or all men, they must perish when so ever thou dost set once thy face against them, pronouncing thy curse upon them; see Psal.9. Annot.on v.6.]"}],"18":[{"catchword":null,"tekst":"(18) Let thine hand be upon the man of thy right hand; [Understand this verse of the Son of God, the Messiah, of whom was spoken v.16. Thy hand be upon him, i.e. be with him support him, support him, and establish or maintain him in his Kingdom: See the like kind of expression, Ezra 7.6. etc. And compare Psa 118:25. Isa 11:2,3. And 61.1. Act 10:38. the man of thy right hand: i.e. him whom thou lovest as thy right hand: see Gen 35:18, or, the man that is thy neighbour or companion, Zach.13.7. (as being thine eternal Son) and by whom thou dost stretch forth thy power, hast created, maintainest and governest all things; Joh 1:3. Col.1.16. Hebr. 1.2,3. And to whom thou hast said, Sit down at my right hand, etc. Psa 110:1. called the Son of man, Psa 8:5. Hebr.2.6,9. And throughout all the New Testament; according as he appeared likewise Dan.7.13. by this Man, as (also by the Son of Man in the next following words) some do understand the people of Israel, which is likewise called Gods first-born, Exo 4:22.] upon the Son of Man, (whom) thou hast strengthened thee."}],"19":[{"catchword":null,"tekst":"(19) So shall we not turn back from thee: keep us alive, so shall we call on thy Name."}],"20":[{"catchword":null,"tekst":"(20) O LORD, God of hosts, bring up again; [See above v.4.] Let thy face shine [above, v.4.] so shall we be saved."}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
