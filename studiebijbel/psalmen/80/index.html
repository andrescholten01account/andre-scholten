 kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "Job 1:10": "Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.", "Job 36:16": "Zo zou Hij ook u afgekeerd hebben van de mond van de benauwdheid naar de ruimte, waaronder geen benauwing zou zijn geweest; en het gerecht van uw tafel zou vol vettigheid zijn geweest.", "Job 33:19-22": "Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte van zijn beenderen; Zodat zijn leven het brood zelf verfoeit, en zijn ziel het begeerlijke voedsel; Dat zijn vlees verdwijnt uit het gezicht, en zijn beenderen, die niet gezien werden, uitsteken;", "Ps 119:145-149": "Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren. Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden. Ik ben de morgenschemering voorgekomen, en heb geschrei gemaakt; op Uw woord heb ik gehoopt.", "1 Tim 3:3": "niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "Rom 9:18": "Zo ontfermt Hij Zich dan over wie Hij wil, en Hij verhardt wie Hij wil.", "2 Kron 20:15": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.", "Micha 7:18": "Wie is een God gelijk U, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel van Zijn erfenis voorbijgaat? Hij houdt Zijn toorn niet voor eeuwig vast; want Hij heeft lust aan goedertierenheid.", "Ps 130:3": "Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Jes 52:12": "Want u zult niet haastig weggaan, en ook niet vluchtend heengaan; want de HEERE zal voor uw aangezicht heentrekken, en de God van Israël zal uw achterhoede zijn.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Jes 54:9": "Want dat zal Mij zijn als de wateren van Noach, toen Ik zwoer dat de wateren van Noach niet meer over de aarde zouden gaan; zo heb Ik gezworen dat Ik niet meer op u toornen, of u bestraffen zal.", "Hand 13:39": "En dat ieder die gelooft, door Hem gerechtvaardigd wordt van alles waarvan u niet gerechtvaardigd kon worden door de wet van Mozes.", "Jes 38:2": "Toen keerde Hizkia zijn gezicht om naar de wand, en hij bad tot de HEERE.", "Hebr 10:38": "Maar de rechtvaardige zal uit het geloof leven; en als iemand zich terugtrekt, heeft Mijn ziel in hem geen behagen.", "Ezech 36:4": "Daarom, bergen van Israël! Hoort het woord van de Heere HEERE: Zo zegt de Heere HEERE tot de bergen en tot de heuvels, tot de stromen en tot de dalen, tot de verwoeste eenzame plaatsen en tot de verlaten steden, die tot een roof en tot een spot geworden zijn voor het overblijfsel van de heidenen, die rondom zijn;", "Job 24:12": "Uit de stad zuchten de mensen, en de ziel van de verwonden schreeuwt uit; toch rekent God het niet aan als ongerijmd.", "1 Kron 13:6": "Toen trok David op met heel Israël naar Baäla, dat is Kirjath-jearim, dat in Juda ligt, om vandaar de ark van God op te halen, van de HEERE, Die tussen de cherubs woont, waar de Naam wordt aangeroepen.", "Luk 2:34": "En Simeon zegende hen, en zei tegen Maria, Zijn moeder: Zie, Deze wordt gezet tot een val en opstanding van velen in Israël, en tot een teken dat weersproken zal worden.", "Jes 36:12-20": "Maar Rabsake zei: Heeft mijn heer mij naar uw heer en naar u gezonden om deze woorden te spreken? Is het niet naar de mannen die op de muur zitten, om met u hun eigen drek te eten en hun eigen water te drinken? Zo stond Rabsake, en riep met luide stem in het Joods, en zei: Hoor de woorden van de grote koning, de koning van Assyrië! Zo zegt de koning: Laat Hizkia u niet bedriegen, want hij zal u niet kunnen redden.", "Kol 1:3": "Wij danken de God en Vader van onze Heere Jezus Christus, terwijl wij altijd voor u bidden,", "Ps 80:4-6": "O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden. HEERE, God van de heerscharen! Hoe lang zult U roken tegen het gebed van Uw volk? U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.", "Num 10:36": "En als zij rustte, zei hij: Kom terug, HEERE, tot de tienduizenden van de duizenden van Israël!", "Hand 4:29": "En nu dan, Heere, zie op hun dreigingen, en geef Uw dienstknechten met alle vrijmoedigheid Uw woord te spreken;", "2 Kron 20:17": "U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Ps 34:20-23": "Resch. Veel is de tegenspoed van de rechtvaardige; maar uit dat alles redt de HEERE hem. Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken. Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Rom 3:24-26": "en worden om niet gerechtvaardigd, uit Zijn genade, door de verlossing die in Christus Jezus is; Hem heeft God voorgesteld tot een verzoening, door het geloof in Zijn bloed, tot een betoning van Zijn gerechtigheid, door de vergeving van de zonden die eerder gebeurd zijn, tijdens de verdraagzaamheid van God; tot een betoning van Zijn gerechtigheid in deze tegenwoordige tijd; opdat Hij rechtvaardig is, en rechtvaardigend degene die uit het geloof van Jezus is.", "1 Joh 5:20": "Maar wij weten dat de Zoon van God gekomen is, en ons het verstand gegeven heeft, opdat wij de Waarachtige kennen; en wij zijn in de Waarachtige, namelijk in Zijn Zoon Jezus Christus. Deze is de waarachtige God, en het eeuwige Leven.", "Hos 6:1-3": "Kom, laten wij terugkeren tot de Heere, want Hij heeft verscheurd, en Hij zal ons genezen; Hij heeft geslagen, en Hij zal ons verbinden. Hij zal ons na twee dagen levend maken; op de derde dag zal Hij ons doen opstaan, en wij zullen voor Zijn aangezicht leven. Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Jer 3:1-25": "Men zegt: Als een man zijn vrouw verlaat, en zij gaat van hem weg en wordt de vrouw van een andere man, zal hij dan nog naar haar terugkeren? Zou dat land niet ernstig ontheiligd worden? U hebt met veel minnaars gehoereerd, en toch zou u weer naar Mij terugkeren, spreekt de HEERE. Sla uw ogen op naar de hoge plaatsen, en zie toe: waar bent u niet beslapen? U hebt voor hen gezeten langs de wegen, als een Arabier in de woestijn; zo hebt u het land ontheiligd met uw hoererijen en met uw slechtheid. Daarom zijn de regendruppels ingehouden, en is er geen late regen geweest. Maar u hebt een hoerenvoorhoofd, u weigert schaamrood te worden.", "Gen 49:18": "Op Uw zaligheid wacht ik, HEERE!", "Rom 15:7": "Daarom neemt elkaar aan, zoals ook Christus ons aangenomen heeft, tot de heerlijkheid van God.", "Ps 44:14": "U stelt ons tot smaad voor onze naburen, tot spot en schimp voor hen die rondom ons zijn.", "Rom 8:3": "Want wat voor de wet onmogelijk was, omdat zij door het vlees krachteloos was, dat heeft God gedaan: Hij heeft Zijn eigen Zoon gezonden in de gelijkenis van het zondige vlees, en dat voor de zonde, en Hij heeft de zonde veroordeeld in het vlees.", "Spr 18:19": "Een broeder is moeilijker te winnen dan een sterke stad; en geschillen zijn als de grendel van een paleis.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "1 Tim 3:2": "Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren;", "Klaagl 2:18": "Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op!", "Luk 1:78": "door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;", "Tit 3:1-3": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn; Dat zij niemand belasteren, geen ruziezoekers zijn, maar vriendelijk zijn, en alle zachtmoedigheid bewijzen tegenover alle mensen. Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Job 36:15": "Hij zal de ellendige in zijn ellende bevrijden, en in de onderdrukking zal Hij voor hun oor openbaren.", "Ps 56:2-14": "Wees mij genadig, o God! Want de mens zoekt mij op te slokken; de hele dag dringt de bestrijder mij. Mijn verspieders zoeken mij de hele dag op te slokken; want ik heb veel bestrijders, o Allerhoogste! Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Ps 43:1-5": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht. Want U bent de God van mijn sterkte; waarom verstoot U mij dan? Waarom ga ik steeds in het zwart, vanwege de onderdrukking van de vijand? Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Joh 6:53-58": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: als u het vlees van de Zoon des mensen niet eet en Zijn bloed niet drinkt, hebt u geen leven in uzelf. Wie Mijn vlees eet en Mijn bloed drinkt, heeft het eeuwige leven; en Ik zal hem opwekken op de laatste dag. Want Mijn vlees is werkelijk voedsel, en Mijn bloed is werkelijk drank.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "Ef 5:14": "Daarom zegt Hij: Ontwaak, u die slaapt, en sta op uit de doden; en Christus zal over u lichten.", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Ps 145:8": "Cheth. Genadig en barmhartig is de HEERE, geduldig en groot van goedertierenheid.", "Joh 7:37-39": "En op de laatste dag, zijnde de grote dag van het feest, stond Jezus en riep: Als iemand dorst heeft, laat hij tot Mij komen en drinken. Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien. (En dit zei Hij van de Geest, die zij die in Hem geloven zouden ontvangen; want de Heilige Geest was er nog niet, omdat Jezus nog niet verheerlijkt was.)", "Gal 5:10": "Ik vertrouw van u in de Heere, dat u niet anders zult denken; maar wie u in verwarring brengt, zal het oordeel dragen, wie hij ook is.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Ps 33:13": "De HEERE kijkt uit de hemel, en ziet alle mensenkinderen.", "Ps 102:21": "Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Ps 60:3": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons.", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.", "Joh 6:37": "Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.", "Jona 1:14": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd.", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Richt 2:18": "En wanneer de HEERE hun richters verwekte, zo was de HEERE met de richter, en verloste hen uit de hand van hun vijanden, al de dagen van de richter; want het berouwde de HEERE vanwege hun zuchten om hen die hen drongen en die hen drukten.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "Kol 3:11": "waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar en Scyth, dienstknecht en vrije; maar Christus is alles en in allen.", "Matt 8:25": "En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan!", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Luk 1:50": "En Zijn barmhartigheid is van geslacht tot geslacht over hen die Hem vrezen.", "Spr 25:24": "Het is beter te wonen op een hoek van het dak, dan met een twistzieke huisvrouw, en dat in een huis vol gezelschap.", "Joh 14:19": "Nog een korte tijd, en de wereld zal Mij niet meer zien; maar u zult Mij zien; want Ik leef, en u zult leven.", "Jer 48:27": "Want is Israël u niet tot bespotting geweest? Was hij onder de dieven gevonden, dat u zich zo bewoog, van de tijd af dat uw woorden over hem gingen?", "Joz 7:7-26": "En Jozua zei: Ach, Heere HEERE! Waarom hebt U dit volk ooit de Jordaan laten oversteken, om ons te geven in de hand van de Amorieten, om ons te vernietigen? Was het toch maar zo dat wij tevreden waren geweest en gebleven waren aan de overkant van de Jordaan! Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd? Als de Kanaänieten en alle inwoners van het land dit horen, zullen zij ons omsingelen, en onze naam van de aarde uitroeien; wat zult U dan doen voor Uw grote Naam?", "2 Tess 1:12": "Opdat de Naam van onze Heere Jezus Christus verheerlijkt wordt in u, en u in Hem, naar de genade van onze God en de Heere Jezus Christus.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Zach 12:8": "Op die dag zal de HEERE de inwoners van Jeruzalem beschutten; en wie onder hen struikelen zou, zal op die dag zijn als David; en het huis van David zal zijn als goden, als de Engel van de HEERE voor hun aangezicht.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "1 Petr 2:4-7": "Kom naar Hem toe, als naar een levende Steen, door de mensen wel verworpen, maar bij God uitverkoren en kostbaar; Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus. Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "Ps 44:24-27": "Waak op, waarom zou U slapen, Heere! Ontwaak, verstoot niet tot in eeuwigheid. Waarom zou U Uw aangezicht verbergen, onze ellende en onze onderdrukking vergeten? Want onze ziel is in het stof neergebogen; onze buik kleeft aan de aarde.", "Ef 5:2": "en wandel in de liefde, zoals ook Christus ons liefgehad heeft, en Zichzelf voor ons heeft overgegeven als een offerande en een slachtoffer, God tot een welriekende reuk.", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Spr 14:10": "Het hart kent zijn eigen bittere droefheid; en een vreemde zal zich met zijn blijdschap niet vermengen.", "Spr 2:7": "Hij legt weg voor de oprechten een bestendig bezit; Hij is een schild voor hen die oprecht wandelen;", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "2 Petr 1:3": "Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd;", "Ps 3:2": "O HEERE, hoe zijn mijn tegenstanders talrijk geworden; velen staan tegen mij op.", "Joh 5:34": "Toch neem Ik geen getuigenis van een mens aan; maar dit zeg Ik, opdat u behouden wordt.", "Jak 3:14-16": "Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid. Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels. Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Jes 58:2": "Hoewel zij Mij dagelijks zoeken en een lust hebben aan de kennis van Mijn wegen, als een volk dat gerechtigheid doet en het recht van zijn God niet verlaat, vragen zij Mij naar de rechten van de gerechtigheid; zij hebben een lust om tot God te naderen;", "Jer 32:16-25": "Vervolgens, nadat ik de koopbrief aan Baruch, de zoon van Nerija, gegeven had, bad ik tot de HEERE: Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk. U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Ps 31:24": "Heb de HEERE lief, u, al Zijn gunstgenoten! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.", "Jes 30:15": "Want zo zegt de Heere HEERE, de Heilige van Israël: Door terugkering en rust zou u behouden worden, in stilte en in vertrouwen zou uw sterkte zijn; maar u hebt niet gewild.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Job 22:25": "Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "Ef 5:23": "want de man is het hoofd van de vrouw, zoals ook Christus het Hoofd van de Gemeente is; en Hij is de Behouder van het lichaam.", "1 Joh 1:1-3": "Wat er was van het begin af, wat wij gehoord hebben, wat wij gezien hebben met onze ogen, wat wij aanschouwd hebben, en onze handen getast hebben, van het Woord des levens; (Want het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.) Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "Job 5:18": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen.", "Jes 1:6": "Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "Spr 25:8": "Ga niet haastig een geschil aan om te twisten, opdat u misschien aan het einde daarvan niet weet wat u moet doen, wanneer uw naaste u beschaamd zou hebben.", "Dan 9:16-19": "O Heere! naar al Uw gerechtigheden, laat toch Uw toorn en Uw grimmigheid afgekeerd worden van Uw stad Jeruzalem, Uw heilige berg; want om onze zonden en om de ongerechtigheden van onze vaderen zijn Jeruzalem en Uw volk tot smaad bij allen die rondom ons zijn. En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf. Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Deut 7:22": "En de HEERE, uw God, zal deze volken voor uw aangezicht geleidelijk uitwerpen; u zult hen niet snel mogen vernietigen, omdat anders de wilde dieren van het veld tegen u te veel worden.", "Ps 119:156": "HEERE! Uw barmhartigheden zijn vele; maak mij levend naar Uw rechten.", "Jes 41:11": "Zie, zij zullen beschaamd worden en te schande gemaakt, allen die tegen u in woede ontstoken zijn; zij zullen worden als niets, en de mensen die met u twisten, zullen vergaan.", "1 Kor 1:30": "Maar uit Hem bent u in Christus Jezus, Die voor ons geworden is wijsheid van God, en rechtvaardigheid, en heiligmaking, en verlossing;", "Ps 78:38": "Doch Hij, barmhartig zijnde, verzoende de ongerechtigheid, en verdierf hen niet; maar wendde dikwijls Zijn toorn af, en wekte Zijn hele grimmigheid niet op.", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Ps 74:21-23": "Laat de verdrukte niet beschaamd terugkeren; laat de ellendige en de arme Uw Naam prijzen. Sta op, o God! Voer Uw eigen rechtszaak; denk aan de smaad die U de hele dag door de dwaas aangedaan wordt. Vergeet het geroep van Uw tegenstanders niet; het rumoer van hen die tegen U opstaan, klimt voortdurend op.", "1 Tess 5:10": "Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven.", "Spr 30:33": "Want het karnen van melk brengt boter voort, en het knijpen van de neus brengt bloed voort, en het opjagen van de toorn brengt twist voort.", "Ps 107:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Spr 15:13": "Een vrolijk hart maakt het gezicht blij; maar door verdriet in het hart wordt de geest verslagen.", "Spr 26:17": "De voorbijganger die zich opwindt in een twist die hem niet aangaat, is als iemand die een hond bij de oren grijpt.", "Ps 23:2": "Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren.", "Ps 48:15": "Want deze God is onze God eeuwig en altoos; Hij zal ons geleiden tot de dood toe.", "Hos 2:17": "En Ik zal op die dag een verbond voor hen sluiten met het wild gedierte van het veld, en met het gevogelte van de hemel, en het kruipend gedierte van de aardbodem; en Ik zal de boog, en het zwaard, en de oorlog van de aarde wegbreken, en Ik zal hen in veiligheid laten neerliggen.", "Ps 80:4-8": "O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden. HEERE, God van de heerscharen! Hoe lang zult U roken tegen het gebed van Uw volk? U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.", "Ps 45:10": "Dochters van koningen zijn onder Uw kostbare hofdames; de Koningin staat aan Uw rechterhand, in het fijnste goud van Ofir.", "Dan 9:3-19": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as. Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden. Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten.", "Jes 45:4": "Om Jakobs, Mijn knechts wil, en Israëls, Mijn uitverkorenen; ja, Ik riep u bij uw naam, Ik noemde u toe, hoewel u Mij niet kende.", "Ps 40:9": "Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "Hos 14:2-9": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Dan 9:17": "En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf.", "Ezech 34:31": "U nu, o Mijn schapen, schapen van Mijn weide! U bent mensen; maar Ik ben uw God, spreekt de Heere HEERE.", "Joël 2:14": "Wie weet, Hij mocht Zich wenden en berouw hebben; en Hij mocht een zegen achter Zich overlaten tot spijsoffer en drankoffer voor de HEERE, uw God.", "Luk 9:56": "Want de Zoon des mensen is niet gekomen om het leven van mensen te vernietigen, maar om het te behouden. En zij gingen naar een ander dorp.", "1 Sam 1:17": "Toen antwoordde Eli en zei: Ga heen in vrede, en de God van Israël geeft u wat u van Hem gebeden hebt.", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Ps 25:6": "Zain. Gedenk, HEERE! Uw barmhartigheden en Uw blijken van goedertierenheid, want die zijn er van eeuwigheid.", "Spr 8:20": "Ik doe wandelen op de weg van de gerechtigheid, in het midden van de paden van het recht;", "Luk 1:16": "En hij zal velen van de kinderen van Israël bekeren tot de Heere, hun God.", "Hebr 13:20": "De God nu van de vrede, Die de grote Herder van de schapen, door het bloed van het eeuwige testament, uit de doden heeft teruggebracht, namelijk onze Heere Jezus Christus,", "2 Kor 12:20": "Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;", "2 Kon 13:23": "Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe.", "Hand 13:23": "Uit het nageslacht van deze heeft God, naar de belofte, voor Israël de Zaligmaker Jezus verwekt;", "Ps 130:8": "En Hij zal Israël verlossen van al zijn ongerechtigheden.", "Klaagl 3:50": "Ain. Totdat de HEERE van de hemel neerkijkt, en het ziet.", "Ps 89:41": "Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen.", "Neh 4:5": "Dek hun ongerechtigheid niet toe, en laat hun zonde niet uitgewist worden van voor Uw aangezicht, want zij hebben U getergd, tegenover de bouwers.", "Ps 18:51": "Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid.", "Job 14:22": "Maar zijn vlees, dat nog aan hem is, heeft smart; en zijn ziel, die nog in hem is, heeft rouw.", "Ps 119:37": "Wend mijn ogen af, dat zij geen ijdelheid zien; maak mij levend door Uw wegen.", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "1 Kor 4:7": "Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had?", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "Ex 25:20-22": "En de cherubs zullen hun beide vleugels omhoog uitspreiden, en met hun vleugels het verzoendeksel bedekken; en hun gezichten zullen naar elkaar toe zijn; de gezichten van de cherubs zullen naar het verzoendeksel gericht zijn. En u zult het verzoendeksel boven op de ark zetten, nadat u in de ark de getuigenis, die Ik u geven zal, gelegd zult hebben. En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Spr 12:21": "De rechtvaardigen zal geen leed overkomen; maar de goddelozen zullen met kwaad vervuld worden.", "Jer 33:15": "In die dagen, en te dien tijde zal Ik David een SPRUIT van gerechtigheid doen opkomen; en Hij zal recht en gerechtigheid doen op aarde.", "Ex 6:6": "En Ik zal u tot Mijn volk aannemen, en Ik zal u tot een God zijn; en u zult weten dat Ik de HEERE uw God ben, Die u uitleidt van onder de lasten van de Egyptenaren.", "Matt 1:16-18": "en Jakob verwekte Jozef, de man van Maria, uit wie geboren is JEZUS, Die Christus genoemd wordt. Al de geslachten dus, van Abraham tot David, zijn veertien geslachten; en van David tot de Babylonische wegvoering veertien geslachten; en van de Babylonische wegvoering tot Christus veertien geslachten. De geboorte van Jezus Christus was nu als volgt. Toen Maria, Zijn moeder, met Jozef in ondertrouw was, bleek zij, voordat zij samengekomen waren, zwanger te zijn uit de Heilige Geest.", "Jes 1:5": "Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.", "Jak 4:2": "U begeert, en hebt niet; u benijdt en jaagt naar dingen, en kunt ze niet krijgen; u vecht en voert strijd, maar u hebt niet, omdat u niet bidt.", "Ps 31:4": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "Jer 10:24": "Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat U mij niet te niet maakt.", "Job 17:7-16": "Daarom is mijn oog door verdriet verdonkerd, en al mijn ledematen zijn als een schaduw. De oprechten zullen hierover verbaasd zijn, en de onschuldige zal zich tegen de huichelaar opmaken; En de rechtvaardige zal zijn weg vasthouden, en wie rein van handen is, zal in sterkte toenemen.", "Jes 41:12": "U zult hen zoeken, maar zult hen niet vinden, de mensen die met u kijven; zij zullen worden als niets, en de mensen die met u oorlogen, als een nietig ding.", "2 Tim 2:10": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid.", "2 Kon 18:1": "Het gebeurde nu in het derde jaar van Hosea, de zoon van Ela, de koning van Israël, dat Hizkia koning werd, de zoon van Achaz, koning van Juda.", "1 Kor 3:11": "Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus.", "Ps 35:1-3": "Een psalm van David. Twist, HEERE, met wie tegen mij twisten; strijd tegen wie tegen mij strijden. Grijp het schild en de rondas, en sta op tot mijn hulp. En breng de spies naar voren, en sluit de weg toe voor mijn vervolgers; zeg tegen mijn ziel: Ik ben uw Heil.", "Ex 13:22": "Hij nam de wolkkolom overdag, en de vuurkolom 's nachts, niet weg van voor het aangezicht van het volk.", "1 Tim 6:21": "waarmee sommigen, terwijl zij die beleden, van het geloof zijn afgeweken. De genade zij met u. Amen. De eerste brief aan Timotheüs werd geschreven vanuit Laodicea, de voornaamste stad in Frygië Pacatania.", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Ezech 18:31": "Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "Ex 12:13": "En dat bloed zal voor u een teken zijn aan de huizen waarin u zich bevindt; wanneer Ik het bloed zie, zal Ik u voorbijgaan; en er zal geen plaag onder u zijn tot verderf, wanneer Ik Egypteland zal slaan.", "Ps 61:4": "Want U bent mij een Toevlucht geweest, een sterke Toren voor de vijand.", "Job 30:15-19": "Men heeft zich met verschrikkingen tegen mij gekeerd; ieder vervolgt als een wind mijn edele ziel, en mijn heil is als een wolk voorbijgegaan. Daarom stort mijn ziel zich nu in mij uit; de dagen van het druk grijpen mij aan. 's Nachts doorboort Hij mijn beenderen in mij, en mijn polsaderen rusten niet.", "Matt 15:24": "Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "Jes 63:17": "HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "Joh 7:42": "Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?", "Dan 9:4": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "2 Kon 20:6": "En Ik zal vijftien jaar aan uw dagen toevoegen, en Ik zal u uit de hand van de koning van Assyrië verlossen, alsook deze stad; en Ik zal deze stad beschermen, omwille van Mijzelf en omwille van Mijn dienaar David.", "Jes 18:5": "Want vóór de oogst, als de bloesem volkomen is, en de onrijpe druif rijp wordt na de bloei, zo zal Hij de ranken met snoeimessen afsnijden, en de takken wegdoen en afkappen.", "1 Tim 6:13": "Ik beveel u voor het aangezicht van God, Die alles levend maakt, en van Christus Jezus, Die onder Pontius Pilatus de goede belijdenis heeft afgelegd,", "Jak 4:1": "Waar komen strijd en ruzies onder u vandaan? Komen ze niet hieruit voort, namelijk uit uw lusten, die in uw leden strijd voeren?", "Ps 28:1": "Een psalm van David. Tot U roep ik, HEERE! Mijn Rotssteen, houd U niet als doof van mij af; anders, als U zich stil houdt voor mij, word ik gelijk aan degenen die in de kuil neerdalen.", "Deut 4:31": "Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Zach 9:14-16": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden. De HEERE van de heerscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar. En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "Jes 14:3": "En het zal gebeuren op de dag, wanneer de HEERE u rust zal geven van uw smart, en van uw onrust, en van de harde dienstbaarheid waarin men u heeft laten dienen,", "Ezech 1:13": "Wat de gelijkenis van de levende wezens betreft, hun gedaante was als brandende kolen van vuur, als de gedaante van fakkels; dat vuur ging steeds tussen die levende wezens; en het vuur had een glans, en uit het vuur kwam een bliksem voort.", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "1 Kor 1:3": "Genade zij u en vrede van God onze Vader, en van de Heere Jezus Christus.", "Gal 5:15": "Maar als u elkaar bijt en verslindt, kijk dan uit dat u niet door elkaar verteerd wordt.", "Joh 5:33": "U hebt naar Johannes gezonden, en hij heeft van de waarheid getuigenis gegeven.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Ps 119:41": "Vau. En dat mij Uw blijken van goedertierenheid overkomen, o HEERE! Uw heil, naar Uw toezegging;", "Ps 74:10": "Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?", "Ps 119:22": "Wentel van mij smaad en verachting, want ik heb Uw getuigenissen onderhouden.", "Jes 49:5": "En nu zegt de HEERE, Die Mij van moeders buik af tot een Knecht gevormd heeft, dat Ik Jakob tot Hem terugbrengen zou; maar Israël zal zich niet laten verzamelen; toch zal Ik verheerlijkt worden in de ogen van de HEERE, en Mijn God zal Mijn Sterkte zijn.", "Ps 78:4-72": "Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft. Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Ef 2:4-7": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;", "Gen 48:15": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;", "Gal 6:16": "En zovelen als er naar deze regel zullen wandelen, over hen zij vrede en barmhartigheid, en over het Israël van God.", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Luk 1:77": "om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,", "Jer 2:6": "En zij zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw van de dood, in een land waar niemand doorheen ging, en waar geen mens woonde?", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "2 Kor 12:8": "Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken.", "2 Kron 6:24-39": "En wanneer Uw volk Israël voor het aangezicht van de vijand geslagen zal worden, omdat zij tegen U gezondigd zullen hebben, en zich bekeren, en Uw Naam belijden, en voor Uw aangezicht in dit huis bidden en smeken zullen, Hoor U dan uit de hemel, en vergeef de zonden van Uw volk Israël, en breng hen terug in het land dat U hun en hun vaders gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben, en zij in deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "2 Sam 22:29": "Want U bent mijn Lamp, o HEERE, en de HEERE doet mijn duisternis opklaren.", "2 Sam 6:2": "En David maakte zich op en ging heen met al het volk dat bij hem was, van Baälim-juda, om vandaar de ark van God op te brengen, bij wie de Naam wordt aangeroepen, de Naam van de HEERE van de heerscharen, Die daarop woont tussen de cherubs.", "Joz 23:10": "Eén man onder u zal er duizend opjagen; want het is de HEERE, uw God, Zelf, Die voor u strijdt, zoals Hij tot u gesproken heeft.", "Ex 9:26": "Alleen in het land Gosen, waar de kinderen van Israël waren, daar was geen hagel.", "Jes 37:31": "Want wie ontkomen is, die overgebleven is van het huis van Juda, zal opnieuw naar beneden wortelen, en het zal naar boven vrucht dragen.", "Ps 55:2-18": "O God! neem mijn gebed ter ore, en verberg U niet voor mijn smeking. Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier; Om het geroep van de vijand, vanwege de beangstiging van de goddeloze; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.", "Klaagl 5:1": "Denk, HEERE, aan wat ons gebeurd is, kijk ernaar en zie onze smaad aan.", "Ps 102:20": "Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben;", "Ps 79:1": "Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt.", "Hos 3:5": "Daarna zullen de kinderen van Israël zich bekeren, en de Heere, hun God, zoeken, en David, hun Koning; en zij zullen vol ontzag komen tot de Heere en tot Zijn goedheid, in de laatste dagen.", "Ef 2:1-5": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden; waarin u eertijds gewandeld hebt, naar de eeuw van deze wereld, naar de leider van de macht van de lucht, van de geest die nu werkt in de kinderen van de ongehoorzaamheid; onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen;", "Ex 6:5": "Daarom, zeg tegen de kinderen van Israël: Ik ben de HEERE! En Ik zal u uitleiden van onder de lasten van de Egyptenaren, en Ik zal u redden uit hun dienstbaarheid, en zal u verlossen door een uitgestrekte arm, en door grote gerichten;", "Fil 1:3-5": "Ik dank mijn God, zo dikwijls als ik aan u denk. (In elk gebed van mij voor u allen doe ik dat gebed altijd met blijdschap) Vanwege uw gemeenschap aan het Evangelie, vanaf de eerste dag tot nu toe;", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Ps 66:10-12": "Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert; U had ons in het net gebracht; U had een engs band om onze lenden gelegd; U had de mens over ons hoofd laten rijden; wij waren in het vuur en in het water gekomen; maar U hebt ons uitgevoerd naar een overvloeiende verversing.", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Nahum 2:2": "Want de HEERE heeft de hovaardij van Jakob afgewend, gelijk de hovaardij van Israël; want de ledigmakers hebben ze leeg gemaakt, en zij hebben hun wijnranken verdorven.", "Rom 9:5": "van wie de vaders zijn, en uit wie Christus is, wat het vlees aangaat, Hij Die God is, boven allen te prijzen tot in eeuwigheid. Amen.", "Ps 78:47": "Hij doodde hun wijnstok door de hagel, en hun wilde vijgenbomen door felle hagelstenen.", "Ef 2:7": "opdat Hij zou tonen in de toekomende eeuwen de uitnemende rijkdom van Zijn genade, door de goedertierenheid over ons in Christus Jezus.", "Mark 3:25": "En als een huis tegen zichzelf verdeeld is, kan dat huis niet standhouden.", "Ex 34:24": "Wanneer Ik de volken voor uw aangezicht uit hun bezit zal verdrijven, en uw grenzen verruimen, dan zal niemand uw land begeren, terwijl u erheen optrekt, om te verschijnen voor het aangezicht van de HEERE, uw God, driemaal in het jaar.", "Zach 1:16": "Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "Ps 119:170": "Laat mijn smeken voor Uw aanschijn komen, red mij naar Uw toezegging.", "2 Kon 14:26": "Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Ezech 43:2": "En zie, de heerlijkheid van de God van Israël kwam van de weg naar het oosten; en Zijn stem was als het geruis van veel water, en de aarde werd verlicht van Zijn heerlijkheid.", "2 Kon 25:30": "En aangaande zijn levensonderhoud, een voortdurend levensonderhoud werd hem van de koning gegeven, elke dag een vastgesteld deel op zijn dag, al de dagen van zijn leven.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Luk 1:26-35": "En in de zesde maand werd de engel Gabriël door God gezonden naar een stad in Galilea, genaamd Nazareth, naar een maagd die ondertrouwd was met een man wiens naam Jozef was, uit het huis van David; en de naam van de maagd was Maria. En de engel kwam bij haar binnen, en zei: Wees gegroet, begenadigde; de Heere is met u; u bent gezegend onder de vrouwen.", "Ps 142:6-8": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden. Let op mijn geschrei, want ik ben zeer uitgeput; red mij van mijn vervolgers, want zij zijn sterker dan ik. Voer mijn ziel uit de gevangenis, om Uw Naam te loven; de rechtvaardigen zullen mij omringen, wanneer U goed voor mij zult zijn geweest.", "Matt 1:21": "en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden.", "Ps 116:3": "De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Ps 102:25": "Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht.", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "Ps 140:2-14": "Red mij, HEERE, van de kwade mens; behoed mij voor de man van geweld; Die veel kwaad in het hart bedenken, elke dag komen zij samen om te oorlogen. Zij scherpen hun tong als een slang; heet addervergif is onder hun lippen. Sela.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Ps 73:10": "Daarom keert Zijn volk zich hierheen, als hun water uit een volle beker wordt uitgedrukt,", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "Jer 30:17": "Want Ik zal u de gezondheid doen terugkeren, en u van uw plagen genezen, spreekt de HEERE; omdat zij u noemen: De verdrevene. Het is Sion, zeggen zij; niemand vraagt naar haar.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Matt 2:5": "Zij zeiden tegen hem: In Bethlehem, in Judea; want zo is geschreven door de profeet:", "Jes 64:9-12": "HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting. Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Spr 21:19": "Het is beter te wonen in een woest land, dan bij een zeer kijfachtige en toornige vrouw.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Jes 50:2": "Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "2 Kon 19:14": "Toen Hizkia de brieven uit de hand van de boden ontvangen had en die gelezen had, ging hij op naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE.", "Ps 85:5-7": "Breng ons terug, o God van ons heil! En maak een einde aan Uw toorn over ons. Zult U eeuwig tegen ons toornen? Zult U Uw toorn uitstrekken van geslacht tot geslacht? Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt?", "Spr 20:3": "Het is eer voor een man, om van twist af te blijven; maar iedere dwaas zal zich erin mengen.", "Ps 85:7": "Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt?", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Jes 49:1": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld.", "Joh 1:9": "Dit was het waarachtige Licht, Dat ieder mens verlicht die in de wereld komt.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "Matt 18:11-13": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "2 Kon 24:1": "In zijn dagen trok Nebukadnezar, de koning van Babel, op, en Jojakim werd zijn dienaar, drie jaar lang; daarna keerde hij zich om en kwam in opstand tegen hem.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "Rom 12:18": "Als het mogelijk is, houd voor zover het van u afhangt vrede met alle mensen.", "2 Kron 7:6": "Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst Hem prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond.", "1 Kon 8:38": "elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Job 33:23": "Is er dan bij Hem een Gezant, een Uitlegger, een uit duizend, om de mens zijn rechte plicht te verkondigen;", "Joz 23:13-15": "Weet voorzeker, dat de HEERE, uw God, niet zal voortgaan deze volken van voor uw aangezicht te verdrijven; maar zij zullen u zijn tot een strik, en tot een net, en tot een gesel aan uw zijden, en tot doornen in uw ogen, totdat u omkomt van dit goede land, dat de HEERE, uw God, u gegeven heeft. En ziet, ik ga heden in de weg van de hele aarde; en u weet in uw hele hart en in uw hele ziel, dat er niet één woord gevallen is van al die goede woorden, die de HEERE, uw God, over u gesproken heeft; zij zijn u alle overkomen; er is daarvan niet één woord gevallen. En het zal gebeuren, zoals al die goede dingen over u gekomen zijn, die de HEERE, uw God, tot u gesproken heeft, zo zal de HEERE over u laten komen al die kwade dingen, totdat Hij u verdelgt van dit goede land, dat de HEERE, uw God, u gegeven heeft.", "2 Sam 12:22": "En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.", "Num 10:35": "Het gebeurde nu bij het optrekken van de ark, dat Mozes zei: Sta op, HEERE! En laat Uw vijanden verstrooid worden, en laat Uw haters van Uw aangezicht vluchten!", "Matt 13:56": "En Zijn zusters, zijn die niet allemaal bij ons? Waar komt dan bij Deze dit alles vandaan?", "Ps 32:5": "Mijn zonde maakte ik U bekend, en mijn ongerechtigheid bedekte ik niet. Ik zei: Ik zal belijdenis van mijn overtredingen doen voor de HEERE; en U vergaf de ongerechtigheid van mijn zonde. Sela.", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "Spr 18:14": "De geest van een man zal zijn ziekte dragen; maar een verslagen geest, wie zal die opheffen?", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Hebr 10:39": "Maar wij zijn niet van hen die zich terugtrekken tot verderf, maar van hen die geloven tot behoud van de ziel.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Ex 12:17": "Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "Ex 30:36": "En daarvan moet u een deel heel fijn stoten, en daarvan moet u leggen vóór de getuigenis, in de tent van de samenkomst, waar Ik tot u komen zal; het zal voor u allerheiligst zijn.", "1 Joh 4:10": "Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Ps 4:7": "Velen zeggen: Wie zal ons het goede laten zien? Verhef U over ons het licht van uw aangezicht, o HEERE!", "Ex 14:30": "Zo verloste de HEERE Israël op die dag uit de hand van de Egyptenaren; en Israël zag de Egyptenaren dood aan de oever van de zee.", "1 Joh 5:11-13": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon. Wie de Zoon heeft, die heeft het leven; wie de Zoon van God niet heeft, die heeft het leven niet. Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Jer 18:9": "Ook zal Ik in een ogenblik spreken over een volk en over een koninkrijk, dat Ik het zal bouwen en planten;", "Jer 29:11": "Want Ik weet de gedachten die Ik over u koester, spreekt de HEERE, gedachten van vrede en niet van kwaad, om u het einde en de verwachting te geven.", "Ezech 16:6": "Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef!", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "Joh 10:9-11": "Ik ben de Deur; als iemand door Mij ingaat, zal hij behouden worden; en hij zal ingaan en uitgaan, en weide vinden. De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben. Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen.", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "Jes 37:32": "Want van Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is van de berg Sion; de ijver van de HEERE van de heerscharen zal dit doen.", "Spr 27:15": "Een aanhoudend druppelen op een dag van slagregen en een twistzieke huisvrouw zijn precies gelijk.", "Job 36:7": "Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven.", "Ps 142:2": "Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "2 Kor 5:19": "Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd.", "Ef 1:11": "In Hem, in Wie wij ook een erfdeel geworden zijn, wij, die van tevoren voorbestemd waren naar het voornemen van Hem die alle dingen werkt naar de raad van Zijn wil;", "Matt 24:22": "En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "1 Kon 8:36-50": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt. Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn; elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Ezech 20:48": "En alle vlees zal zien dat Ik, de HEERE, dat heb aangestoken; het zal niet uitgeblust worden.", "Jes 63:17-19": "HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel. Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden. Wij zijn geworden als zij over wie U van ouds niet hebt geheerst, en die naar Uw Naam niet genoemd zijn.", "Jer 2:9": "Daarom zal Ik nog met u twisten, spreekt de HEERE; ja, met uw kindskinderen zal Ik twisten.", "Jer 31:18": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Ps 109:22-24": "Want ik ben ellendig en behoeftig, en mijn hart is in mijn binnenste doorwond. Ik ga heen als een schaduw wanneer die zich neigt; ik word omgedreven als een sprinkhaan. Mijn knieën struikelen van het vasten, en mijn vlees is vermagerd, zodat er geen vet aan is.", "1 Joh 4:14": "En wij hebben het gezien, en getuigen dat de Vader Zijn Zoon gezonden heeft tot een Zaligmaker van de wereld.", "Ps 80:9-15": "U hebt een wijnstok uit Egypte overgebracht, hebt de heidenen verdreven, en hebt hem geplant; U hebt de plaats voor hem bereid, en zijn wortels doen inwortelen, zodat hij het land vervuld heeft. De bergen zijn met zijn schaduw bedekt geweest, en zijn ranken waren als cederbomen van God.", "Ps 74:11": "Waarom trekt U Uw hand, ja, Uw rechterhand terug? Trek haar uit het midden van Uw boezem; maak er een einde aan.", "Jes 27:2": "Op die dag zal er een wijngaard van rode wijn zijn; zing daarvan bij beurte.", "Ps 119:39": "Wend mijn smaad af, die ik vrees, want Uw rechten zijn goed.", "Klaagl 1:12": "Lamed. Gaat het u niet aan, u allen, die over de weg gaat? Schouwt het aan en ziet, of er een smart is gelijk mijn smart, die mij aangedaan is, waarmee de HEERE mij bedroefd heeft ten dage van de gloed van Zijn toorn.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Ps 115:10": "U, huis van Aäron! vertrouw op de HEERE; Hij is hun Hulp en hun Schild.", "Hebr 12:7": "Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?", "Jes 6:7": "En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "2 Sam 22:7": "Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; en Hij hoorde mijn stem uit Zijn paleis, en mijn geroep kwam in Zijn oren.", "Job 16:6-14": "Als ik spreek, wordt mijn smart niet ingehouden; en houd ik op, wat gaat er dan van mij weg? Zeker, Hij heeft mij nu vermoeid; U hebt mijn hele vergadering verwoest. Dat U mij rimpelig gemaakt hebt, is tot een getuige; en mijn magerheid staat tegen mij op, zij getuigt in mijn gezicht.", "Ps 139:10": "ook daar zou Uw hand mij leiden, en Uw rechterhand zou mij vasthouden.", "Jes 17:7": "Op die dag zal de mens zien naar Hem, Die hem gemaakt heeft, en zijn ogen zullen op de Heilige van Israël zien.", "2 Kor 13:7": "En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "Jes 58:4": "Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "1 Tim 1:15": "Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.", "Deut 1:12": "Hoe zou ik alleen uw moeite, en uw last, en uw geschillen dragen?", "Ps 45:2": "Mijn hart geeft een goede rede op; ik spreek mijn gedichten uit van een Koning; mijn tong is een pen van een vaardige schrijver.", "Ps 57:11": "Want Uw goedertierenheid is groot tot aan de hemelen, en Uw waarheid tot aan de hoogste wolken.", "Ps 69:2": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Ps 72:4": "Hij zal de ellendigen van het volk richten; hij zal de kinderen van de behoeftige verlossen, en de verdrukker verbrijzelen.", "Ps 77:21": "U leidde Uw volk als een kudde door de hand van Mozes en Aäron.", "Gen 48:15-20": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag; Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land! Toen Jozef zag dat zijn vader zijn rechterhand op het hoofd van Efraïm legde, was dat niet goed in zijn ogen, en hij greep de hand van zijn vader vast, om die van het hoofd van Efraïm naar het hoofd van Manasse te brengen.", "1 Petr 2:25": "Want u was als dwalende schapen; maar u bent nu bekeerd tot de Herder en Opziener van uw zielen.", "Jes 8:23": "Maar het land dat beangstigd was, zal niet helemaal verduisterd worden; zoals Hij het in de eerste tijd verachtelijk gemaakt heeft, naar het land van Zebulon toe en naar het land van Nafthali toe, zo heeft Hij het in het laatste heerlijk gemaakt, naar de weg zeewaarts toe gelegen over de Jordaan, aan Galilea van de heidenen.", "Ex 17:4": "Toen riep Mozes tot de HEERE en zei: Wat moet ik met dit volk doen? Het scheelt niet veel, of zij zullen mij stenigen.", "Spr 23:30": "Bij hen die bij de wijn blijven hangen; bij hen die komen om gemengde drank op te zoeken.", "Luk 2:11": "namelijk dat u heden geboren is de Zaligmaker, Die is Christus, de Heere, in de stad van David.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Spr 6:12-14": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Amos 7:3": "Toen kreeg de HEERE berouw hierover; het zal niet gebeuren, zei de HEERE.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Ps 103:3": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Ps 37:17": "Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Jes 48:10": "Zie, Ik heb u gelouterd, doch niet als zilver, Ik heb u gekeurd in de smeltkroes van de ellende.", "2 Sam 24:14": "Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.", "Neh 9:17-20": "En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die U bij hen gedaan had, en hebben hun nek verhard, en in hun weerspannigheid een hoofd aangesteld, om terug te keren tot hun dienstbaarheid. Doch U, een God van vergevingen, genadig en barmhartig, geduldig, en groot van weldadigheid, hebt hen toch niet verlaten. Zelfs, toen zij zich een gegoten kalf gemaakt hadden, en gezegd hadden: Dit is uw God, Die u uit Egypte heeft opgevoerd; en grote lasteringen gedaan hadden; Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.", "Ps 119:153": "Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Ex 32:14": "Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.", "Dan 9:16": "O Heere! naar al Uw gerechtigheden, laat toch Uw toorn en Uw grimmigheid afgekeerd worden van Uw stad Jeruzalem, Uw heilige berg; want om onze zonden en om de ongerechtigheden van onze vaderen zijn Jeruzalem en Uw volk tot smaad bij allen die rondom ons zijn.", "Ps 107:5": "Zij waren hongerig, ook dorstig; hun ziel was in hen overstelpt.", "Rom 14:21": "Het is goed geen vlees te eten, en geen wijn te drinken, en niets waaraan uw broeder zich stoot, of geërgerd wordt, of waarin hij zwak is.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Spr 26:20": "Als er geen hout is, gaat het vuur uit; en als er geen roddelaar is, wordt het gekijf gestild.", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Luk 22:42": "en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "Jer 11:4": "Dat Ik uw vaderen geboden heb, op de dag dat Ik hen uit Egypteland, uit de ijzeroven, uitvoerde, en Ik zei: Wees Mijn stem gehoorzaam, en doe die, naar alles wat Ik u gebied; zo zult u Mij tot een volk zijn, en Ik zal u tot een God zijn;", "Ps 51:12": "Schep mij een rein hart, o God! en vernieuw in mijn binnenste een vaste geest.", "Ps 39:13": "Hoor, HEERE, mijn gebed, en neem mijn geroep ter ore; zwijg niet bij mijn tranen; want ik ben een vreemdeling bij U, een bijwoner, zoals al mijn vaders.", "Ps 146:8": "De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.", "Ps 28:9": "Verlos Uw volk, en zegen Uw erfdeel, en weid hen, en verhef hen tot in eeuwigheid.", "Ps 122:8": "Om mijn broeders en mijn vrienden zal ik nu zeggen: Vrede zij in u!", "Joh 11:3": "Zijn zusters dan zonden tot Hem, en zeiden: Heere, zie, hij die U liefhebt, is ziek.", "Ps 126:4": "O HEERE, keer onze gevangenschap, zoals waterstromen in het zuiden.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Openb 22:16": "Ik, Jezus, heb Mijn engel gezonden om u deze dingen te getuigen in de Gemeenten. Ik ben de Wortel en het geslacht van David, de blinkende Morgenster.", "Ps 145:9": "Teth. De HEERE is voor allen goed, en Zijn barmhartigheden zijn over al Zijn werken.", "Spr 20:22": "Zeg niet: Ik zal het kwaad vergelden; wacht op de HEERE, en Hij zal u verlossen.", "Matt 5:44": "Maar Ik zeg u: heb uw vijanden lief; zegen hen die u vervloeken; doe goed aan hen die u haten; en bid voor hen die u geweld aandoen en die u vervolgen;", "Job 5:17": "Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.", "Jak 5:13-16": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen. Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere. En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Micha 2:13": "De doorbreker zal voor hen uittrekken; zij zullen doorbreken en door de poort gaan, en daardoor naar buiten trekken; en hun koning zal voor hen uit heengaan, en de HEERE aan hun spits.", "Ps 14:5": "Daar zijn zij door grote angst overvallen; want God is bij het geslacht van de rechtvaardige.", "Matt 18:15-17": "Maar als uw broeder tegen u gezondigd heeft, ga naar hem toe en wijs hem terecht tussen u en hem alleen; als hij naar u luistert, hebt u uw broeder gewonnen. Maar als hij niet naar u luistert, neem dan nog één of twee mensen met u mee, zodat elk woord vaststaat door de mond van twee of drie getuigen. En als hij naar hen niet luistert, zeg het dan aan de gemeente; en als hij ook naar de gemeente niet luistert, laat hij dan voor u zijn als de heiden en de tollenaar.", "Ps 119:25": "Daleth. Mijn ziel kleeft aan het stof; maak mij levend naar Uw woord.", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Ps 22:2-22": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen? Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte. Doch U bent heilig, wonende onder de lofzangen van Israël.", "Joh 3:17": "Want God heeft Zijn Zoon niet in de wereld gezonden opdat Hij de wereld zou veroordelen, maar opdat de wereld door Hem behouden zou worden.", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "Jer 4:27": "Want zo zegt de HEERE: Dit hele land zal een woestijn zijn (toch zal Ik geen volledig einde maken);", "1 Kor 3:4": "Want als de een zegt: Ik ben van Paulus; en een ander: Ik ben van Apollos; bent u niet vleselijk?", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Luk 12:58": "Want als u met uw tegenpartij naar de overheid gaat, doe dan onderweg moeite om van hem verlost te worden; anders zou hij u misschien voor de rechter slepen, en de rechter zou u aan de gerechtsdienaar overleveren, en de gerechtsdienaar zou u in de gevangenis werpen.", "Joh 15:1-8": "Ik ben de ware Wijnstok, en Mijn Vader is de Landman. Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt. U bent nu rein om het woord dat Ik tot u gesproken heb.", "Ezra 9:7-14": "Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag. En nu is er, als een klein ogenblik, een genade gebeurd van de HEERE, onze God, om ons een ontkoming over te laten, en ons een nagel te geven in Zijn heilige plaats, om onze ogen te verlichten, o onze God, en om ons een weinig leven te geven in onze dienstbaarheid. Want wij zijn knechten; maar in onze dienstbaarheid heeft onze God ons niet verlaten; maar Hij heeft weldadigheid tot ons geneigd voor het aangezicht van de koningen van Perzië, dat Hij ons een weinig leven zou geven, om het huis van onze God te verhogen, en de woestenijen ervan op te richten, en om ons een muur te geven in Juda en te Jeruzalem.", "Deut 1:31": "En in de woestijn, waar u gezien hebt dat de HEERE, uw God, u gedragen heeft, zoals een man zijn zoon draagt, op heel de weg die u gegaan bent, totdat u kwam bij deze plaats.", "Rom 14:19": "Laten wij dan najagen wat tot de vrede dient, en wat tot de opbouw van elkaar dient.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Spr 17:22": "Een blij hart zal goed doen als een medicijn; maar een verslagen geest zal het gebeente doen verdrogen.", "Zef 3:13": "De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.
