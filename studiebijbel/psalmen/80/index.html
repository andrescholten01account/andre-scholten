linkend.", "3": "Wek Uw macht op voor het aangezicht van Efraïm, en Benjamin, en Manasse, en kom tot onze verlossing.", "4": "O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden.", "5": "HEERE, God van de heerscharen[1]! Hoe lang zult U roken tegen het gebed van Uw volk?", "6": "U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.", "7": "U hebt ons onze buren tot een twist gesteld, en onze vijanden spotten onder elkaar.", "8": "O God van de heerscharen! Breng ons terug, en laat Uw aangezicht lichten; zo zullen wij verlost worden.", "9": "U hebt een wijnstok uit Egypte overgebracht, hebt de heidenen verdreven, en hebt hem geplant;", "10": "U hebt de plaats voor hem bereid, en zijn wortels doen inwortelen, zodat hij het land vervuld heeft.", "11": "De bergen zijn met zijn schaduw bedekt geweest, en zijn ranken waren als cederbomen van God.", "12": "Hij schoot zijn ranken uit tot aan de zee, en zijn scheuten tot aan de rivier.", "13": "Waarom hebt U zijn muren doorgebroken, zodat allen die de weg voorbijgaan, hem plukken?", "14": "Het zwijn uit het woud heeft hem uitgewroet, en het wild van het veld heeft hem afgeweid.", "15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen[2] deze wijnstok,", "16": "en de stam die Uw rechterhand geplant heeft, en dat om de zoon die U voor Uzelf gesterkt hebt!", "17": "Hij is met vuur verbrand; hij is afgehouwen; zij komen om van het schelden van Uw aangezicht.", "18": "Uw hand zij over de man van Uw rechterhand, over de zoon van de mens, die U voor Uzelf gesterkt hebt.", "19": "Zo zullen wij van U niet terugkeren; behoud ons in het leven, zo zullen wij Uw Naam aanroepen.", "20": "HEERE, God van de heerscharen! Breng ons terug; laat Uw aanschijn lichten, zo zullen wij verlost worden."}, "SV": {"1": "Voor den opperzangmeester, op Schoschannim; een getuigenis, een psalm van Asaf.", "2": "O Herder Israëls! neem ter ore, Die Jozef als schapen leiddet; Die tussen de cherubim zit, verschijn blinkende.", "3": "Wek Uw macht op voor het aangezicht van Efraïm, en Benjamin, en Manasse, en kom tot onze verlossing.", "4": "O God! breng ons weder, en laat Uw aanschijn lichten, zo zullen wij verlost worden.", "5": "O HEERE, God der heirscharen! hoe lang zult Gij roken tegen het gebed Uws volks?", "6": "Gij spijst hen met tranenbrood, en drenkt hen met tranen uit een drieling.", "7": "Gij hebt ons onzen naburen tot een twist gesteld, en onze vijanden spotten onder zich.", "8": "O God der heirscharen! breng ons weder, en laat Uw aangezicht lichten; zo zullen wij verlost worden.", "9": "Gij hebt een wijnstok uit Egypte overgebracht, hebt de heidenen verdreven, en hebt denzelven geplant;", "10": "Gij hebt *de* *plaats* voor hem bereid, en zijn wortelen doen inwortelen, zodat hij het land vervuld heeft.", "11": "De bergen zijn met zijn schaduw bedekt geweest, en zijn ranken waren *als* cederbomen Gods.", "12": "Hij schoot zijn ranken uit tot aan de zee, en zijn scheuten tot aan de rivier.", "13": "Waarom hebt Gij zijn muren doorgebroken, zodat allen, die den weg voorbijgaan, hem plukken?", "14": "Het zwijn uit het woud heeft hem uitgewroet, en het wild des velds heeft hem afgeweid.", "15": "O God der heirscharen! keer toch weder; aanschouw uit den hemel, en zie, en bezoek dezen wijnstok,", "16": "En den stam, dien Uw rechterhand geplant heeft, en dat om den zoon, *dien* Gij U gesterkt hebt!", "17": "Hij is met vuur verbrand; hij is afgehouwen; zij komen om van het schelden Uws aangezichts.", "18": "Uw hand zij over den man Uwer rechterhand, over des mensen zoon, *dien* Gij U gesterkt hebt.", "19": "Zo zullen wij van U niet terugkeren; behoud ons in het leven, zo zullen wij Uw Naam aanroepen.", "20": "O HEERE, God der heirscharen! breng ons weder; laat Uw aanschijn lichten, zo zullen wij verlost worden."}, "KJV": {"1": "[[To the chief Musician upon Shoshannimeduth, A Psalm of Asaph.]] Give ear, O Shepherd of Israel, thou that leadest Joseph like a flock; thou that dwellest *between* the cherubims, shine forth.", "2": "Before Ephraim and Benjamin and Manasseh stir up thy strength, and come *and* save", "3": "Turn us again, O God, and cause thy face to shine; and we shall be saved.", "4": "O LORD God of hosts, how long wilt thou be angry against the prayer of thy people?", "5": "Thou feedest them with the bread of tears; and givest them tears to drink in great measure.", "6": "Thou makest us a strife unto our neighbours: and our enemies laugh", "7": "Turn us again, O God of hosts, and cause thy face to shine; and we shall be saved.", "8": "Thou hast brought a vine out of Egypt: thou hast cast out the heathen, and planted", "9": "Thou preparedst *room* before it, and didst cause it to take deep root, and it filled the land.", "10": "The hills were covered with the shadow of it, and the boughs thereof *were like* the goodly cedars.", "11": "She sent out her boughs unto the sea, and her branches unto the river.", "12": "Why hast thou *then* broken down her hedges, so that all they which pass by the way do pluck", "13": "The boar out of the wood doth waste it, and the wild beast of the field doth devour", "14": "Return, we beseech thee, O God of hosts: look down from heaven, and behold, and visit this vine;", "15": "And the vineyard which thy right hand hath planted, and the branch *that* thou madest strong", "16": "*It is* burned with fire, *it is* cut down: they perish at the rebuke of thy countenance.", "17": "Let thy hand be upon the man of thy right hand, upon the son of man *whom* thou madest strong", "18": "So will not we go back from thee: quicken us, and we will call upon thy name.", "19": "Turn us again, O LORD God of hosts, cause thy face to shine; and we shall be saved."}}, "tsk": {"2": [{"kopje": "Neem het ter oor", "refs": ["Ps 5:2", "Ps 55:2"]}, {"kopje": "O Herder", "refs": ["Ps 23:1", "Ps 23:2", "Jes 40:11", "Ezech 34:23", "Joh 10:14", "Hebr 13:20", "1 Petr 2:25", "1 Pe  te zinken, riep hij: Heere, red mij!", "Dan 12:1": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "Jer 14:19-21": "Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking. HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd. Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "2 Kor 4:16": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag.", "Rom 5:17-19": "Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus. Zo dan, zoals door één misdaad de schuld gekomen is over alle mensen tot verdoemenis; zo komt ook door één rechtvaardigheid de genade over alle mensen tot rechtvaardigmaking van het leven. Want zoals door de ongehoorzaamheid van die ene mens velen tot zondaars gesteld zijn geworden, zo zullen ook door de gehoorzaamheid van Één velen tot rechtvaardigen gesteld worden.", "Ps 88:10-15": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Joh 10:27": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij.", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "Openb 2:12-25": "En schrijf aan de engel van de gemeente die in Pergamus is: Dit zegt Hij, Die het tweesnijdend scherpe zwaard heeft: Ik weet uw werken, en waar u woont; namelijk daar waar de troon van de satan is, en u houdt Mijn Naam vast, en hebt Mijn geloof niet verloochend, ook in die dagen waarin Antipas, Mijn getrouwe getuige, gedood is bij u, daar waar de satan woont. Maar Ik heb enkele weinige dingen tegen u, dat u daar mensen hebt die de leer van Balaäm vasthouden, die Balak leerde de kinderen van Israël een aanstoot voor te werpen, opdat zij afgodenoffer zouden eten en hoereren.", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Spr 15:19": "De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.", "Ps 18:5-7": "Banden van de dood hadden mij omvangen, en beken van Belial verschrikten mij. Banden van het graf omringden mij, strikken van de dood bejegenden mij. Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; Hij hoorde mijn stem uit Zijn paleis, en mijn geroep voor Zijn aangezicht kwam in Zijn oren.", "Ps 55:10": "Verslind hen, Heere! verdeel hun tong; want ik zie geweld en twist in de stad.", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Ps 74:19": "Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.", "2 Kor 6:4-10": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten, in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Ps 55:5-9": "Mijn hart doet mij pijn in mijn binnenste, en verschrikkingen van de dood zijn op mij gevallen. Vrees en beving komen over mij, en gruwen overdekt mij; Zodat ik zeg: Och, kreeg ik maar vleugels als een duif! ik zou wegvliegen, waar ik blijven mocht.", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Ezech 16:23": "Het is ook gebeurd na al uw slechtheid (wee, wee u, spreekt de Heere HEERE),", "1 Joh 4:2": "Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God;", "Ps 35:25": "Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Spr 3:20": "Door Zijn kennis zijn de afgronden gekloofd, en de wolken druipen dauw.", "Rom 13:13": "Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie;", "Mal 3:7": "Vanaf de dag van uw vaderen af zijn jullie afgeweken van Mijn inzettingen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?", "Ex 20:22": "Toen zei de HEERE tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: U hebt gezien dat Ik met u vanuit de hemel gesproken heb.", "Ps 132:8-10": "Sta op, HEERE, tot Uw rust, U en de ark van Uw sterkte! Dat Uw priesters bekleed worden met gerechtigheid, en dat Uw gunstgenoten juichen. Wend het gezicht van Uw gezalfde niet af, om Davids wil, Uw dienaar.", "Hebr 2:9-17": "maar wij zien Jezus met heerlijkheid en eer gekroond, Die een weinig minder dan de engelen geworden was, vanwege het lijden van de dood, opdat Hij door de genade van God voor allen de dood zou proeven. Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken. Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen,", "Spr 13:12": "De uitgestelde hoop maakt het hart ziek; maar de begeerte die komt, is een boom des levens.", "Klaagl 3:1-36": "Aleph. Ik ben de man die ellende gezien heeft door de roede van Zijn verbolgenheid. Aleph. Hij heeft mij geleid en gevoerd in de duisternis, en niet in het licht. Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Ezech 2:3-5": "En Hij zei tegen mij: Mensenkind! Ik zend u tot de kinderen van Israël, tot de rebellerende volken, die tegen Mij gerebelleerd hebben; zij en hun vaderen hebben tegen Mij overtreden tot op deze huidige dag. En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE! En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "Ps 105:44": "En Hij gaf hun de landen van de heidenen, zodat zij als erfenis bezaten de arbeid van de volken;", "Ps 116:4": "Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.", "Ps 134:3": "De HEERE zegent u uit Sion, Hij, Die de hemel en de aarde gemaakt heeft.", "Job 33:24": "Zo zal Hij hem genadig zijn, en zeggen: Verlos hem, dat hij in het verderf niet nederdaalt, Ik heb verzoening gevonden.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Spr 19:13": "Een dwaze zoon is voor zijn vader een grote ellende; en de kijvingen van een vrouw zijn als een aanhoudend druppelen.", "Jes 59:16": "Omdat Hij zag dat er niemand was, ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Zijn arm Hem heil, en Zijn gerechtigheid ondersteunde Hem.", "Ex 34:9": "En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga dan nu de Heere in ons midden, want dit is een hardnekkig volk; maar vergeef onze ongerechtigheid en onze zonde, en neem ons aan tot een erfdeel!", "Jes 37:23": "Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Ps 141:5": "Laat de rechtvaardige mij slaan, het zal weldadigheid zijn; en laat hij mij bestraffen, het zal olie van het hoofd zijn, het zal mijn hoofd niet breken; want ook dan zal mijn gebed voor hen zijn in hun tegenspoeden.", "Ps 2:7": "Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.", "2 Tim 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, naar de belofte van het leven dat in Christus Jezus is,", "Job 5:11": "Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Jer 52:12-14": "Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was; Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "2 Kron 30:18": "Want een menigte van het volk, velen uit Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet zoals geschreven is. Doch Hizkia bad voor hen, en zei: De HEERE, die goed is, doe verzoening voor ieder,", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "Luk 5:31": "En Jezus antwoordde en zei tegen hen: Wie gezond zijn, hebben geen dokter nodig, maar wie ziek zijn.", "Spr 22:12": "De ogen van de HEERE bewaren de kennis; maar de zaken van de trouweloze zal Hij omkeren.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "Ef 1:15-19": "Daarom ook ik, nadat ik gehoord heb van het geloof in de Heere Jezus, dat onder u is, en de liefde tot al de heiligen, Houd niet op voor u te danken, en u te gedenken in mijn gebeden; Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Jes 45:2": "Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan.", "Ezech 18:23": "Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "Pred 2:22": "Wat heeft die mens toch van al zijn arbeid en van de kwellingen van zijn hart, waarmee hij zich aftobt onder de zon?", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Gal 4:7": "Zo bent u dan niet meer een dienstknecht, maar een zoon; en als u een zoon bent, dan bent u ook een erfgenaam van God door Christus.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Openb 22:2": "In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Ps 88:15": "HEERE, waarom verstoot U mijn ziel, en verbergt U Uw aangezicht voor mij?", "Job 10:9": "Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Jer 52:7": "Toen werd de stad doorgebroken, en al de krijgslieden vluchtten, en trokken 's nachts uit de stad, door de weg van de poort tussen de twee muren, die bij de hof van de koning waren (de Chaldeeën nu waren tegen de stad rondom), en zij gingen door de weg van het vlakke veld.", "Jes 5:2": "En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Spr 15:18": "Een grimmige man verwekt gekijf; maar wie langzaam tot toorn is, doet de twist bedaren.", "Ezech 19:10": "Uw moeder was als een wijnstok in uw bloed, geplant bij water; hij was vruchtbaar en vol ranken vanwege veel water.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Job 23:10": "Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.", "Kol 1:28": "Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;", "Ps 13:2-5": "Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen? Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn? Kijk naar mij, verhoor mij, HEERE, mijn God; verlicht mijn ogen, zodat ik niet in de dood ontslaap;", "Zef 3:19": "Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "Jes 63:1": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen.", "Joël 2:17": "Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Gen 32:11": "Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Hoogl 1:4": "Trek mij, wij zullen u nalopen! De koning heeft mij gebracht in zijn binnenkamers; wij zullen ons verheugen en in u verblijden; wij zullen uw uitnemende liefde vermelden, meer dan de wijn; de oprechten hebben u lief.", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "2 Kon 19:16": "HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.", "Ps 25:8": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.", "Joël 1:19": "Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.", "Dan 9:9": "Bij de Heere, onze God, zijn de barmhartigheden en vergevingen, hoewel wij tegen Hem gerebelleerd hebben.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "1 Kron 5:2": "want Juda werd machtig onder zijn broeders, en hij die tot een voorganger was, kwam uit hem; maar het eerstgeboorterecht was van Jozef.)", "Ps 143:4": "Daarom wordt mijn geest overstelpt in mij, mijn hart is verbaasd in het midden van mij.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "1 Kron 29:19": "En geef mijn zoon Salomo een volkomen hart, om Uw geboden, Uw getuigenissen en Uw inzettingen te houden; en om alles te doen, en om dit paleis te bouwen, dat ik klaargemaakt heb.", "1 Kor 15:57": "Maar God zij dank, Die ons de overwinning geeft door onze Heere Jezus Christus.", "Jer 2:20": "Toen Ik van oude tijden af uw juk verbroken, en uw banden verscheurd had, zei u: Ik zal niet dienen; maar op alle hoge heuvels en onder elke groene boom loopt u om, hoererend.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Hand 15:16": "Hierna zal Ik terugkeren, en de tabernakel van David, die vervallen is, weer opbouwen; en wat ervan verwoest is, zal Ik weer opbouwen, en Ik zal hem weer oprichten,", "Rom 11:32": "Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Ex 2:25": "En God zag de kinderen van Israël aan, en God kende hen.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Joh 10:4": "En wanneer hij zijn eigen schapen naar buiten gedreven heeft, gaat hij voor hen uit; en de schapen volgen hem, omdat zij zijn stem kennen.", "Jes 42:13": "De HEERE zal uittrekken als een held; Hij zal de ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot geschreeuw maken; Hij zal Zijn vijanden overweldigen.", "Jes 17:9-11": "Op die dag zullen zijn sterke steden zijn als een verlaten struik en opperste tak, die zij verlaten hebben vanwege de kinderen van Israël, hoewel daar verwoesting zal zijn. Want u hebt de God van uw heil vergeten, en niet gedacht aan de Rotssteen van uw sterkte; daarom zult u wel liefelijke planten planten, en die met uitheemse ranken bezetten; Op de dag dat u ze plant, zult u ze doen groeien, en in de morgenstond zult u uw zaad doen bloeien; maar het zal maar een hoop zijn van het gemaaide, op de dag van ziekte en van pijnlijke smart.", "Ps 17:6-9": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden. Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan! Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,", "Ps 108:7": "Opdat Uw beminden bevrijd worden; geef heil door Uw rechterhand, en verhoor ons.", "Jer 33:8": "En Ik zal hen reinigen van al hun ongerechtigheid, waarmee zij tegen Mij gezondigd hebben; en Ik zal al hun ongerechtigheden vergeven, waarmee zij tegen Mij gezondigd en waarmee zij tegen Mij overtreden hebben.", "Hand 4:12": "En de zaligheid is in geen Ander; want er is ook onder de hemel geen andere Naam, die onder de mensen gegeven is, waardoor wij moeten zalig worden.", "1 Kor 11:16-19": "Maar als iemand meent twistgierig te moeten zijn: wij hebben zulke gewoonten niet, en de Gemeenten van God ook niet. Dit nu, wat ik u aanzeg, prijs ik niet, namelijk dat u niet tot beter, maar tot erger samenkomt. Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;", "Luk 11:17": "Maar Hij, die hun gedachten kende, zei tegen hen: Elk koninkrijk dat tegen zichzelf verdeeld is, wordt verwoest; en een huis dat tegen zichzelf verdeeld is, valt.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "2 Tim 2:7": "Bedenk wat ik zeg; en de Heere geeft u inzicht in alle dingen.", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "Ps 130:4": "Maar bij U is vergeving, opdat U gevreesd wordt.", "Ps 64:3": "Verberg mij voor de heimelijke afspraken van de boosdoeners, voor het oproer van de werkers van ongerechtigheid.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Ezra 8:23": "Zo vastten wij en verzochten dat van onze God; en Hij liet Zich door ons verbidden.", "Jes 17:6": "Toch zal er een nalezing in overblijven, zoals bij het afschudden van de olijfboom, twee of drie bezien in de top van de opperste twijg, en vier of vijf aan zijn vruchtbare takken, spreekt de HEERE, de God van Israël.", "Joh 6:32": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: Mozes heeft u niet het brood uit de hemel gegeven; maar Mijn Vader geeft u dat ware Brood uit de hemel.", "Hagg 2:8": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen.", "Ezech 9:8": "Het gebeurde nu, toen zij hen geslagen hadden en ik overgebleven was, dat ik op mijn aangezicht viel, en riep, en zei: Ach, Heere HEERE, zult U het hele overblijfsel van Israël verderven, door Uw grimmigheid uit te gieten over Jeruzalem?", "1 Sam 9:16": "Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is.", "Ex 11:7": "Maar bij alle kinderen van Israël zal geen hond zijn tong bewegen, van de mensen af tot de beesten toe; opdat u weet dat de HEERE tussen de Egyptenaren en tussen de Israëlieten een afzondering maakt.", "Klaagl 2:19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "Ps 31:17": "Laat Uw aangezicht over Uw knecht lichten; verlos mij door Uw goedertierenheid.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "Openb 3:1-4": "En schrijf aan de engel van de gemeente die in Sardis is: Dit zegt Hij Die de zeven Geesten van God heeft, en de zeven sterren: Ik ken uw werken, dat u de naam hebt dat u leeft, en u bent dood. Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God. Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Ps 61:2": "O God! hoor mijn geschrei, merk op mijn gebed.", "Spr 17:19": "Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.", "Jes 53:10": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan.", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Mark 12:1-12": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "Spr 3:23": "Dan zult u uw weg zeker gaan, en u zult uw voet niet stoten.", "Ps 118:1-4": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat Israël nu zeggen, dat Zijn goedertierenheid voor eeuwig is. Laat het huis van Aäron nu zeggen, dat Zijn goedertierenheid voor eeuwig is.", "Gen 3:16": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen.", "Gen 45:24": "En hij zond zijn broers heen; en zij vertrokken; en hij zei tegen hen: Maak geen ruzie op de weg.", "Ps 12:2": "Behoud, o HEERE; want de goedertierene ontbreekt, want de getrouwen zijn weinig geworden onder de mensenkinderen.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Richt 10:16": "En zij deden de vreemde goden uit hun midden weg, en dienden de HEERE. Toen werd Zijn ziel verdrietig over de ellende van Israël.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Ps 119:76": "Laat toch Uw goedertierenheid zijn om mij te troosten, naar Uw toezegging aan Uw knecht.", "Spr 12:25": "Bekommernis in het hart van de mens buigt het neer; maar een goed woord verblijdt het.", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Richt 5:31": "Zo moeten omkomen al Uw vijanden, o HEERE! Die Hem daarentegen liefhebben, moeten zijn, als wanneer de zon opgaat in haar kracht. En het land was stil, veertig jaren.", "Ps 86:5": "Want Gij, Heere! zijt goed, en vergeeft graag, en van grote goedertierenheid voor allen die U aanroepen.", "Ps 119:135": "Doe Uw aangezicht lichten over Uw knecht, en leer mij Uw inzettingen.", "Ezech 33:11": "Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël?", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "Ps 64:2": "Hoor, o God, mijn stem in mijn geklaag; behoed mijn leven voor de schrik van de vijand.", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Ps 35:23": "Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.", "Ezech 34:22": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee.", "1 Kon 8:44": "Wanneer Uw volk in de oorlog tegen zijn vijand uittrekken zal, langs de weg die U hen zenden zult, en tot de HEERE bidden zullen in de richting van deze stad, die U verkoren hebt, en van dit huis, dat ik voor Uw Naam gebouwd heb;", "Ezech 20:47": "En zeg tegen het zuiderwoud: Hoor het woord van de HEERE: Zo zegt de Heere HEERE: Zie, Ik zal een vuur in u aansteken, dat in u elke groene boom en elke dorre boom zal verteren; de vlammende vlam zal niet uitgeblust worden, maar daardoor zullen alle aangezichten verbrand worden, van het zuiden tot het noorden toe.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "Ps 88:4-19": "Want mijn ziel is verzadigd van tegenspoed, en mijn leven raakt tot aan het graf. Ik word gerekend bij hen die in de kuil neerdalen; ik ben geworden als een man die geen kracht heeft; Afgezonderd onder de doden, zoals de verslagenen die in het graf liggen, die U niet meer gedenkt, en zij zijn afgesneden van Uw hand.", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "Klaagl 5:19-22": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht. Waarom zou U ons voor altijd vergeten? Waarom zou U ons zo lange tijd verlaten? HEERE, bekeer ons tot U, dan zullen wij bekeerd zijn; vernieuw onze dagen als vanouds.", "Ps 79:5": "Hoe lang, HEERE? Zult U eeuwig toornen? Zal Uw ijver als vuur branden?", "Luk 24:39": "Zie Mijn handen en Mijn voeten; want Ik ben het Zelf; raak Mij aan, en zie; want een geest heeft geen vlees en beenderen, zoals u ziet dat Ik heb.", "Micha 7:19": "Hij zal Zich weer over ons ontfermen; Hij zal onze ongerechtigheden dempen; ja, U zult al hun zonden in de diepten van de zee werpen.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Ef 5:26": "opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord,", "Ps 86:1-17": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.", "1 Kon 4:25": "En Juda en Israël woonden zeker, ieder onder zijn wijnstok en onder zijn vijgenboom, van Dan tot Ber-seba toe, al de dagen van Salomo.", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Joh 10:7": "Jezus dan zei opnieuw tegen hen: Voorwaar, voorwaar zeg Ik u: Ik ben de Deur van de schapen.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "2 Tess 3:5": "Doch de Heere richte uw harten op de liefde van God, en op de lijdzaamheid van Christus.", "Spr 11:8": "De rechtvaardige wordt uit benauwdheid bevrijd; en de goddeloze komt in zijn plaats.", "Num 6:25": "De HEERE doet Zijn aangezicht over u lichten, en is u genadig!", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Ps 103:8-14": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid. Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden. Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Zach 4:7": "Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!", "Ex 22:27": "want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!", "Ps 5:2": "O HEERE, neem mijn woorden ter oor; let op mijn overdenking.", "Jer 51:5": "Want Israël of Juda zal niet in weduwschap gelaten worden door zijn God, door de HEERE van de heerscharen (hoewel hun land vol schuld is), door de Heilige van Israël.", "Num 23:23": "Want er is geen toverij tegen Jakob, en geen waarzeggerij tegen Israël. Op dit moment zal van Jakob gezegd worden, en van Israël, wat God tot stand gebracht heeft.", "Luk 12:59": "Ik zeg u: u zult daar geenszins uitgaan, totdat u ook de laatste penning betaald hebt.", "Ps 42:10": "Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "1 Tess 3:10": "Nacht en dag zeer overvloedig biddend, om uw gezicht te mogen zien en te volmaken wat er aan uw geloof ontbreekt.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Rom 5:8-11": "Maar God bevestigt Zijn liefde tegenover ons hierin, dat Christus voor ons gestorven is toen wij nog zondaars waren. Veelmeer dan zullen wij, nu gerechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn. Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven.", "Ef 2:13-18": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus. Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Jes 55:4": "Zie, Ik heb hem tot een getuige van de volken gegeven, een vorst en gebieder van de volken.", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "1 Petr 3:13": "En wie is het die u kwaad zal doen, als u navolgers bent van het goede?", "Fil 2:3": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "Ezech 9:3": "En de heerlijkheid van de God van Israël verhief zich van de cherub waarop Hij was, naar de drempel van het huis; en Hij riep tot de man die met linnen bekleed was, die de schrijversinktkoker aan zijn heup had.", "Jes 62:11": "Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Ps 85:5": "Breng ons terug, o God van ons heil! En maak een einde aan Uw toorn over ons.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Dan 6:11": "Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.", "Ps 27:12": "Geef mij niet over in de begeerte van mijn tegenstanders; want valse getuigen zijn tegen mij opgestaan, alsook wie geweld uitblaast.", "Jes 64:8-12": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen. HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting.", "Spr 17:3": "De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE toetst de harten.", "1 Joh 4:3": "en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Ps 77:2": "Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen.", "Job 13:21": "Doe Uw hand ver van mij weg, en laat Uw verschrikking mij niet verbaasd maken.", "Ps 39:14": "Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.", "Fil 1:15": "Sommigen prediken Christus wel uit afgunst en twist, maar sommigen ook uit goedwilligheid.", "1 Kron 21:5": "En Joab gaf aan David het aantal van het getelde volk; en heel Israël was elfhonderdduizend man, die het zwaard uittrokken, en Juda vierhonderdzeventigduizend man, die het zwaard uittrokken.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Ps 94:1": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend!", "Jer 9:1-3": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk. Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop. En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "Ps 119:154": "Twist mijn twistzaak, en verlos mij, maak mij levend, naar Uw toezegging.", "Jer 17:17": "Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!", "Micha 5:2": "Daarom zal Hij hen overgeven, tot de tijd toe dat zij, die baren zal, gebaard heeft; dan zullen de overigen van Zijn broeders zich bekeren met de kinderen van Israël.", "Ex 15:17": "Hen zult U inbrengen, en planten op de berg van Uw erfenis, op de plaats die U, o HEERE, gemaakt hebt om te wonen, het heiligdom, dat Uw handen gesticht hebben, o Heere!", "Num 16:48": "En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Hab 1:3": "Waarom laat U mij ongerechtigheid zien, en aanschouwt U de kwelling? Want verwoesting en geweld is tegen mij, en er is twist, en men neemt gekijf op.", "Hos 13:10": "Waar is uw koning nu? Laat hij u toch redden in al uw steden! En uw rechters, van wie u zei: Geef mij een koning en vorsten?", "Ps 102:4-12": "Want mijn dagen zijn vergaan als rook, en mijn beenderen zijn uitgebrand als een haard. Mijn hart is geslagen en verdord als gras, zodat ik vergeten heb mijn brood te eten. Mijn beenderen kleven aan mijn vlees, vanwege de stem van het zuchten.", "1 Tess 3:12": "En moge de Heere u doen toenemen en overvloedig maken in de liefde tot elkaar en tot allen, zoals wij ook zijn tot u,", "Kol 1:27": "aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "Matt 5:25": "Wees snel welgezind tegenover uw tegenpartij, terwijl u nog met hem onderweg bent, opdat de tegenpartij u misschien niet aan de rechter overlevert, en de rechter u aan de gerechtsdienaar overlevert, en u in de gevangenis geworpen wordt.", "Ps 139:24": "En zie, of er bij mij een schadelijke weg is; en leid mij op de eeuwige weg.", "2 Kon 14:27": "En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.", "Joz 24:12": "En Ik zond horzels voor u uit; die dreven hen voor u weg, zoals de beide koningen van de Amorieten, niet door uw zwaard, en ook niet door uw boog.", "Dan 4:22-27": "Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk. Dat nu de koning een wachter, namelijk een heilige, gezien heeft, uit de hemel neerkomend, die zei: Houwt deze boom om, en verderf hem; maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld, en in de dauw van de hemel nat gemaakt worden, en dat zijn deel zij met het gedierte van het veld, totdat er zeven tijden over hem voorbijgaan; Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal:", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "Deut 11:25": "Niemand zal voor uw aangezicht standhouden; de HEERE, uw God, zal de schrik en de vrees voor u geven over heel het land, waarop u treden zult, zoals Hij tot u gesproken heeft.", "Jes 24:1-16": "Zie, de HEERE maakt het land leeg, en Hij maakt het woest; en Hij keert de gestalte ervan om, en Hij verstrooit zijn inwoners. En zoals het met het volk zal gaan, zo zal het met de priester zijn; zoals met de knecht, zo met zijn heer; zoals met de dienstmaagd, zo met haar vrouw; zoals met de koper, zo met de verkoper; zoals met de lener, zo met de ontlener; zoals met de woekeraar, zo met hem van wie hij woeker ontvangt. Dat land zal helemaal leeg gemaakt worden, en het zal helemaal beroofd worden; want de HEERE heeft dit woord gesproken.", "Jes 42:6": "Ik, de HEERE, heb u geroepen in gerechtigheid, en Ik zal u bij uw hand grijpen; en Ik zal u behoeden, en Ik zal u geven tot een Verbond van het volk, tot een Licht van de heidenen.", "Luk 1:68-77": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht; zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 125:1-3": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid. Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid. Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "Fil 1:16": "Dezen verkondigen Christus wel uit eigenbelang, niet zuiver, en menen aan mijn banden verdrukking toe te brengen;", "1 Sam 4:4": "Het volk zond dan naar Silo, en men bracht vandaar de ark van het verbond van de HEERE van de heerscharen, die tussen de cherubs† woont; en de twee zonen van Eli, Hofni en Pinehas, waren daar bij de ark van het verbond van God.", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Hebr 7:14": "Want het is duidelijk, dat onze Heere uit Juda voortgekomen is; over die stam heeft Mozes niets gesproken wat het priesterschap betreft.", "Nahum 1:12": "Zo zegt de HEERE: Al zijn zij voorspoedig, en al zijn er nog zoveel, toch zullen zij afgesneden worden, en hij zal doorgaan. Ik heb u wel vernederd, maar Ik zal u niet meer vernederen.", "Openb 2:1-6": "Schrijf aan de engel van de gemeente van Efeze: Dit zegt Hij, Die de zeven sterren in Zijn rechterhand houdt, Die in het midden van de zeven gouden kandelaren wandelt: Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden; En u hebt verdragen, en hebt geduld; en u hebt om Mijn Naam gearbeid, en bent niet moe geworden.", "Jes 18:6": "Zij zullen samen overgelaten worden aan de roofvogels van de bergen, en aan de dieren van de aarde; en de roofvogels zullen op hen overzomeren, en alle dieren van de aarde zullen daarop overwinteren.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Openb 11:10": "En zij die op de aarde wonen, die zullen zich verblijden over hen, en zullen vreugde bedrijven, en zullen elkaar geschenken zenden; omdat deze twee profeten hen die op de aarde wonen, gepijnigd hadden.", "Matt 24:31": "En Hij zal Zijn engelen uitzenden met een bazuin van groot geluid, en zij zullen Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het ene uiterste van de hemel tot het andere uiterste daarvan.", "2 Kron 24:19": "Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "Ps 36:11": "Strek Uw goedertierenheid uit over degenen, die U kennen, en Uw gerechtigheid over de oprechten van hart.", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "1 Sam 1:10": "Zij dan, bitter bedroefd zijnde, bad tot de HEERE, en zij weende zeer.", "Deut 29:20": "De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen.", "Spr 26:21": "De dode kool is voor de vurige kool, en het hout voor het vuur; zo is een twistzieke man om ruzie aan te wakkeren.", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "Ezech 5:5-17": "Zo zegt de Heere HEERE: Dit is Jeruzalem, die Ik in het midden van de heidenvolken gezet heb, met landen rondom haar heen. Toch heeft zij Mijn rechten veranderd in goddeloosheid, erger dan de heidenvolken, en Mijn inzettingen erger dan de landen die rondom haar zijn; want zij hebben Mijn rechten verworpen, en in Mijn inzettingen hebben zij niet gewandeld. Daarom zegt de Heere HEERE zo: Omdat u meer gedaan hebt dan de heidenvolken die rondom u zijn, in Mijn inzettingen niet gewandeld hebt, en Mijn rechten niet gedaan hebt, ja zelfs naar de rechten van de heidenvolken die rondom u zijn niet gedaan hebt;", "1 Kor 3:1": "En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus.", "Dan 3:27": "Toen verzamelden zich de stadhouders, de overheden, de landvoogden, en de raadsheren van de koning, en zij zagen deze mannen, dat het vuur geen macht had gehad over hun lichamen, en dat het haar van hun hoofd niet verbrand was, en hun mantels niet veranderd waren, ja, dat de geur van het vuur er zelfs niet doorheen gegaan was.", "Joh 9:5": "Zolang Ik in de wereld ben, ben Ik het Licht van de wereld.", "Jer 10:19-22": "O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal! Mijn tent is verstoord, en al mijn touwen zijn verscheurd; mijn kinderen zijn van mij uitgegaan, en zij zijn er niet; er is niemand meer, die mijn tent uitspant, en mijn gordijnen opricht. Want de herders zijn redeloos geworden, en hebben de HEERE niet gezocht; daarom hebben zij niet verstandig gehandeld, en hun hele kudde is verstrooid.", "Ps 76:7": "Van Uw schelden, o God van Jakob! zijn samen wagen en paard in slaap gezonken.", "Ex 20:2": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Ps 89:3": "Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:", "Rom 5:6": "Want Christus is, toen wij nog krachteloos waren, op Zijn tijd voor de goddelozen gestorven.", "Kol 2:10": "En u bent in Hem volmaakt, Die het Hoofd is van alle overheid en macht;", "Ps 85:6-8": "Zult U eeuwig tegen ons toornen? Zult U Uw toorn uitstrekken van geslacht tot geslacht? Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt? Toon ons Uw goedertierenheid, o HEERE, en geef ons Uw heil.", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Ps 69:2-4": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel. Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij. Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Zach 6:12": "En spreek tegen hem, en zeg: Zo spreekt de HEERE van de heerscharen: Zie, een Man, Wiens naam is SPRUIT, Die zal uit Zijn plaats opgroeien, en Hij zal de tempel van de HEERE bouwen.", "Ps 72:17": "Zijn naam zal zijn tot in eeuwigheid; zolang als er de zon is, zal zijn naam van kind tot kind voortgeplant worden; en zij zullen in hem gezegend worden; alle heidenvolken zullen hem gelukkig noemen.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Ps 108:13": "Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Jona 2:1-10": "En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis. En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.", "Neh 1:10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Ezech 10:4": "Toen hief de heerlijkheid van de HEERE zich omhoog van boven de cherub, naar de drempel van het huis; en het huis werd vervuld met een wolk, en het voorhof was vol van de glans van de heerlijkheid van de HEERE.", "Rom 5:1": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus;", "Job 23:2-6": "Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten. Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "2 Kor 1:8": "Want wij willen niet, broeders, dat u onwetend bent van onze verdrukking, die ons in Azië overkomen is: dat wij uitzonderlijk zwaar belast zijn geweest, boven ons vermogen, zodat wij zeer in twijfel waren, ook aan het leven.", "Jes 31:6": "Bekeer u tot Hem, van Wie de kinderen van Israël diep afgeweken zijn.", "Jer 15:10": "Wee mij, mijn moeder, dat u mij gebaard hebt, een man van twist, en een man van ruzie voor het hele land! Ik heb hun niet op rente gegeven, ook hebben zij mij niet op rente gegeven, toch vervloekt mij ieder van hen.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Ps 35:17": "Heere! Hoe lang zult U toezien? Breng mijn ziel weer van hun verwoestingen, mijn eenzame van de jonge leeuwen.", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Ps 90:10": "Aangaande de dagen van onze jaren, daarin zijn zeventig jaren, of, als wij zeer sterk zijn, tachtig jaren; en het voortreffelijkste van die is moeite en verdriet; want het wordt snel afgesneden, en wij vliegen daarheen.", "2 Kor 5:16": "Zo kennen wij van nu af aan niemand meer naar het vlees; en al hebben wij ook Christus naar het vlees gekend, toch kennen wij Hem nu niet meer naar het vlees.", "Luk 18:1-8": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven, en Hij zei: Er was een zekere rechter in een stad, die God niet vreesde en geen mens ontzag. En er was een zekere weduwe in dezelfde stad, en zij kwam naar hem toe en zei: Doe mij recht tegenover mijn tegenpartij.", "Job 11:18": "En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen;", "Neh 9:19": "Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.", "1 Kon 18:37": "Antwoord mij, HEERE, antwoord mij; opdat dit volk erkent dat U, HEERE, die God bent, en dat U hun hart weer terug hebt gebracht.", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "Jer 15:15": "O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Tit 2:13": "Verwachtend de zalige hoop en verschijning van de heerlijkheid van de grote God en onze Zaligmaker Jezus Christus;", "Ps 99:1": "De HEERE regeert, dat de volken beven; Hij zit tussen de cherubs; de aarde beeft.", "Jes 37:16": "O HEERE van de heerscharen¹, God van Israël, Die tussen de cherubs² woont! U Zelf, U alleen bent de God van alle koninkrijken van de aarde; U hebt de hemel en de aarde gemaakt!", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Hebr 5:9": "En nadat Hij volmaakt gemaakt was, is Hij voor allen die Hem gehoorzaam zijn een oorzaak van eeuwige zaligheid geworden;", "Gen 31:3": "En de HEERE zei tegen Jakob: Keer terug naar het land van uw vaderen, en naar uw familie, en Ik zal met u zijn.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "Ezech 9:6": "Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren.", "Ps 30:11": "Hoor, HEERE! en wees mij genadig; HEERE! wees mij een Helper.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "2 Kron 36:1-23": "Toen nam het volk van het land Joahaz, de zoon van Josia, en zij maakten hem koning in de plaats van zijn vader, te Jeruzalem. Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem. Want de koning van Egypte zette hem af te Jeruzalem, en hij legde het land een boete op van honderd talenten zilver en een talent goud.", "Gen 19:16": "Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad neer.", "Ezech 10:18": "Toen ging de heerlijkheid van de HEERE weg van boven de drempel van het huis, en bleef staan boven de cherubs.", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Jes 63:15-17": "Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in. U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam. HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "Ef 2:20": "gebouwd op het fundament van de apostelen en profeten, waarvan Jezus Christus Zelf is de uiterste Hoeksteen;", "Mark 13:20": "En als de Heere de dagen niet verkort had, zou geen vlees behouden worden; maar omwille van de uitverkorenen, die Hij uitverkoren heeft, heeft Hij de dagen verkort.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Jer 2:21": "Ik had u toch geplant, een edele wijnstok, een geheel getrouw zaad; hoe bent u Mij dan veranderd in verbasterde ranken van een vreemde wijnstok?", "Ezech 11:16": "Daarom, zeg: Zo zegt de Heere HEERE: Hoewel Ik hen ver onder de heidenvolken weggedaan heb, en hoewel Ik hen in de landen verstrooid heb, zal Ik hun toch een korte tijd tot een heiligdom zijn, in de landen waar zij naartoe gekomen zijn.", "Lev 26:40-45": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Ps 78:52": "En Hij voerde Zijn volk als schapen, en leidde hen, als een kudde, door de woestijn.", "Ps 17:6": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden.", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Ps 124:1-8": "Een lied Hammaäloth, van David. Als de HEERE niet bij ons geweest was, laat Israël dat nu zeggen: Als de HEERE niet bij ons geweest was, toen de mensen tegen ons opstonden, dan zouden zij ons levend verslonden hebben, toen hun toorn tegen ons ontstak.", "Gen 31:13": "Ik ben die God van Bethel, waar u het opgerichte teken gezalfd hebt, waar u Mij een gelofte beloofd hebt; nu, maak u op, vertrek uit dit land, en keer terug naar het land van uw familie.", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Ps 77:3": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Spr 17:1": "Een droge bete brood, en rust daarbij, is beter, dan een huis vol geslachte beesten met twist.", "Deut 33:2": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen.", "Spr 18:6": "De lippen van de dwaas komen in twist, en zijn mond roept om slagen.", "Ps 107:7": "En Hij leidde hen op een rechte weg, om te gaan naar een stad om in te wonen.", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "Jer 12:2": "U hebt hen geplant, zij zijn ook ingeworteld, zij groeien, ook dragen zij vrucht; U bent wel nabij in hun mond, maar ver van hun nieren.", "Klaagl 3:31-33": "Caph. Want de Heere zal niet verstoten in eeuwigheid. Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid. Caph. Want Hij plaagt of bedroeft de kinderen van de mensen niet van harte.", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "Hand 3:22": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Jak 5:15": "En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Ps 116:5": "De HEERE is genadig en rechtvaardig, en onze God ontfermt Zich.", "Num 2:18-24": "De banier van het leger van Efraïm, naar hun legers, zal tegen het westen zijn; en Elisama, de zoon van Ammihud, zal de leider van de zonen van Efraïm zijn. Zijn leger nu, en zijn getelden, waren veertigduizend vijfhonderd. En naast hem de stam van Manasse; en Gamaliël, de zoon van Pedazur, zal de leider van de zonen van Manasse zijn.", "Matt 5:39-41": "Maar Ik zeg u, dat u de boze niet weerstaat; maar wie u op uw rechterwang slaat, keer hem ook de andere toe; en als iemand met u wil rechtstoetsen en uw onderkleed nemen, laat hem ook de mantel; en wie u zal dwingen één mijl te gaan, ga met hem twee
