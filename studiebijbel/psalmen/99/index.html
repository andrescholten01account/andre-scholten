ngelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Job 34:10": "Daarom, u, lieden van verstand, hoor naar mij: Ver zij God van goddeloosheid, en de Almachtige van onrecht!", "Hand 17:24-26": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn; En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft; En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Openb 14:5": "En in hun mond is geen bedrog gevonden; want zij zijn onberispelijk voor de troon van God.", "2 Kron 24:16": "En zij begroeven hem in de stad van David, bij de koningen; want hij had goed gedaan in Israël, zowel aan God als aan Zijn huis.", "Jes 24:13": "Want in het binnenste van het land, in het midden van deze volken, zal het zo zijn als de afschudding van het olijfboom, als de nalezingen, wanneer de wijnoogst geëindigd is.", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "1 Kon 11:39": "En Ik zal om die reden het nageslacht van David vernederen; maar niet voor altijd.", "Ps 135:21": "Geloofd zij de HEERE uit Sion, Die te Jeruzalem woont. Halleluja!", "Rom 3:26": "tot een betoning van Zijn gerechtigheid in deze tegenwoordige tijd; opdat Hij rechtvaardig is, en rechtvaardigend degene die uit het geloof van Jezus is.", "Joh 19:11": "Jezus antwoordde: U zou geen enkele macht tegen Mij hebben, als het u niet van boven gegeven was; daarom heeft hij die Mij aan u heeft overgeleverd, groter zonde.", "Luk 2:20": "En de herders keerden terug, terwijl zij God verheerlijkten en prezen om alles wat zij gehoord en gezien hadden, zoals tegen hen gesproken was.", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Ps 144:1": "Een psalm van David. Geprezen zij de HEERE, mijn Rotssteen, Die mijn handen leert voor de strijd, mijn vingers voor de oorlog;", "Jer 12:10": "Veel herders hebben Mijn wijngaard verdorven, zij hebben Mijn akker vertrapt; zij hebben Mijn gewenste akker gesteld tot een woeste wildernis.", "Num 21:8": "En de HEERE zei tegen Mozes: Maak u een vurige slang, en zet die op een stang; en het zal gebeuren, dat ieder die gebeten is, als hij haar aanziet, zal leven.", "Num 14:20": "En de HEERE zei: Ik heb hun vergeven naar uw woord.", "Ezech 18:29": "Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Ps 106:43-46": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid. Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde. En Hij dacht tot hun voordeel aan Zijn verbond, en het berouwde Hem naar de veelheid van Zijn blijken van goedertierenheid.", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "Ps 90:8": "U stelt onze ongerechtigheden voor U, onze heimelijke zonden in het licht van uw aangezicht.", "2 Sam 24:16": "Toen nu de engel zijn hand uitstrekte over Jeruzalem om haar te verderven, kreeg de HEERE berouw over dat kwaad, en Hij zei tegen de engel die het verderf onder het volk aanrichtte: Het is genoeg, trek uw hand nu terug. De engel van de HEERE was nu bij de dorsvloer van Arauna, de Jebusiet.", "Jes 24:23": "En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Ps 96:10": "Zegt onder de heidenen: De HEERE regeert; ook zal de wereld vaststaan, zij zal niet wankelen; Hij zal de volken oordelen in alle rechtvaardigheid.", "Ex 31:18": "En Hij gaf aan Mozes, toen Hij met hem op de berg Sinaï geëindigd had te spreken, de twee tafelen van de getuigenis, tafelen van steen, beschreven met de vinger van God.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "Jona 2:9": "Maar ik zal U offeren met de stem van de dankzegging; wat ik beloofd heb, zal ik betalen. Het heil is van de HEERE.", "Jes 33:5": "De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.", "Ps 4:2": "Als ik roep, verhoor mij, o God van mijn gerechtigheid! In benauwdheid hebt U mij ruimte gemaakt; wees mij genadig, en hoor mijn gebed.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Ps 69:35": "Dat Hem prijzen de hemel en de aarde, de zeeën, en al wat daarin wemelt.", "Jak 5:13": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen.", "Ex 3:5": "En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land.", "Ps 2:12": "Kust de Zoon, opdat Hij niet toornt, en u op de weg vergaat, wanneer Zijn toorn maar een weinig zou ontbranden. Gelukkig zijn allen die op Hem vertrouwen.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "Ps 24:7-10": "Heft uw hoofden op, poorten, en verhef u, eeuwige deuren, opdat de Koning der ere ingaat! Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat!", "Ps 19:10": "De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Ps 66:19": "Maar zeker, God heeft gehoord; Hij heeft gemerkt op de stem van mijn gebed.", "Ezech 10:1-22": "Daarna zag ik, en zie, boven het uitspansel dat over het hoofd van de cherubs was, was er iets als een saffiersteen, als de gedaante van de gelijkenis van een troon; en Hij verscheen daarop. En Hij sprak tot de man, gekleed in linnen, en zei: Ga naar binnen, tussen de wielen, tot onder de cherub, en vul uw vuisten met vurige kolen van tussen de cherubs, en strooi ze over de stad; en hij ging voor mijn ogen naar binnen. De cherubs nu stonden aan de rechterzijde van het huis, toen die man naar binnen ging; en een wolk vervulde de binnenste voorhof.", "Hand 3:19": "Kom dus tot inkeer en bekeer u, opdat uw zonden uitgewist worden, wanneer de tijden van verkwikking gekomen zijn van het aangezicht van de Heere,", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Spr 16:6": "Door goedertierenheid en trouw wordt de misdaad verzoend; en door de vreze van de HEERE wijkt men af van het kwade.", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "Ps 106:31": "En het is hem gerekend tot gerechtigheid, van geslacht tot geslacht tot in eeuwigheid.", "Ps 33:4": "Want het woord van de HEERE is recht, en al Zijn werk is trouw.", "1 Kron 16:31": "Laat de hemelen zich verblijden, en de aarde zich verheugen, en laat men onder de heidenen zeggen: De HEERE regeert.", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Jes 57:18": "Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.", "Openb 1:17-19": "En toen ik Hem zag, viel ik als dood aan Zijn voeten; en Hij legde Zijn rechterhand op mij, en zei tegen mij: Wees niet bang; Ik ben de Eerste en de Laatste; en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood. Schrijf wat u gezien hebt, en wat is, en wat hierna gebeuren zal:", "Ps 126:1": "Een lied Hammaäloth. Toen de HEERE de gevangenen van Sion terugbracht, waren wij als mensen die dromen.", "Jes 49:13": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.", "Jes 47:6": "Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erfdeel, en Ik gaf hen over in uw hand; toch bewees u hun geen barmhartigheid, ja, zelfs over de oude maakte u uw juk zeer zwaar.", "Jes 66:8": "Wie heeft ooit zoiets gehoord? Wie heeft dergelijke dingen gezien? Zou een land geboren kunnen worden op één dag? Zou een volk geboren kunnen worden in één keer? Maar Sion heeft weeën gekregen, en zij heeft haar zonen gebaard.", "2 Tim 1:3": "Ik dank God, aan Wie ik dien vanaf mijn voorouders met een rein geweten, zoals ik zonder ophouden aan u denk in mijn gebeden, nacht en dag;", "Openb 1:11": "die zei: Ik ben de Alfa en de Omega, de Eerste en de Laatste; en wat u ziet, schrijf dat in een boek, en stuur het aan de zeven gemeenten die in Azië zijn, namelijk naar Efeze, en naar Smyrna, en naar Pergamus, en naar Thyatire, en naar Sardis, en naar Filadelfia, en naar Laodicea.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "Ps 82:1": "Een psalm van Asaf. God staat in de vergadering van God; Hij oordeelt in het midden van de goden;", "Ef 3:21": "Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.", "Jer 31:37": "Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "1 Joh 2:17": "En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "Ps 26:2": "Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart.", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Jes 31:4": "Want zo heeft de HEERE tegen mij gezegd: Zoals een leeuw, en een jonge leeuw over zijn prooi brult, wanneer ook een volle menigte herders tegen hem samengeroepen wordt, verschrikt hij voor hun stem niet, en vernedert zich niet vanwege hun grote aantal; zo zal de HEERE van de heerscharen neerdalen, om te strijden voor de berg Sion en voor haar heuvel.", "1 Tess 2:13": "Daarom danken wij ook God zonder ophouden, dat u, toen u het Woord van de prediking van God van ons ontvangen had, dat aangenomen hebt niet als een woord van mensen, maar (zoals het werkelijk is) als het Woord van God, dat ook werkt in u die gelooft.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?", "Job 9:28": "Dan schroom ik voor al mijn smarten; ik weet dat U mij niet onschuldig zult houden.", "2 Kon 18:6": "Want hij kleefde de HEERE aan; hij week niet van Hem af om Hem na te volgen, en hij hield Zijn geboden, die de HEERE aan Mozes geboden had.", "1 Sam 2:2": "Er is niemand heilig, zoals de HEERE; want er is niemand dan U, en er is geen rotssteen, zoals onze God!", "Jes 14:32": "Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben.", "Dan 2:47": "De koning antwoordde Daniël en zei: Het is werkelijk waar dat uw God een God der goden is, en een Heere der koningen, en Iemand Die geheimen openbaart, omdat u dit geheim hebt kunnen openbaren.", "Ps 75:2": "Wij loven U, o God! Wij loven, dat Uw Naam nabij is; men vertelt Uw wonderen.", "Ps 136:3-26": "Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig. Hem, Die alleen grote wonderen doet; want Zijn goedertierenheid is voor eeuwig. Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Ex 32:11-14": "Doch Mozes smeekte de HEERE zijn God, en zei: O HEERE, waarom zou Uw toorn ontsteken tegen Uw volk, dat Gij met grote kracht en met een sterke hand uit Egypteland hebt uitgevoerd? Waarom zouden de Egyptenaren zeggen: In kwaadheid heeft Hij hen weggeleid, om hen te doden op de bergen en om hen te vernietigen van de aardbodem? Keer af van de gloed van Uw toorn, en laat het U berouwen over het kwaad tegen Uw volk. Denk aan Abraham, aan Izak en aan Israël, Uw dienaren, aan wie Gij bij Uzelf gezworen hebt, en tot wie Gij gesproken hebt: Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel; en dit hele land, waarvan Ik gezegd heb dat Ik het aan uw nageslacht zal geven, zullen zij voor eeuwig in erfelijk bezit hebben.", "Ex 40:23-29": "En hij schikte daarop het brood in orde, voor het aangezicht van de HEERE, zoals de HEERE aan Mozes geboden had. Hij zette ook de kandelaar in de tent der samenkomst, recht tegenover de tafel, aan de zijde van de tabernakel, zuidwaarts. En hij stak de lampen aan voor het aangezicht van de HEERE, zoals de HEERE aan Mozes geboden had.", "Job 8:3": "Zou God dan het recht verdraaien? En zou de Almachtige de gerechtigheid verdraaien?", "Luk 15:4-7": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Klaagl 3:57": "Koph. U bent tot mij genaderd op de dag dat ik U aanriep; U hebt gezegd: Vrees niet!", "Ps 111:7": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar.", "Ps 119:172": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid.", "Dan 5:26-28": "Dit is de uitleg van deze woorden: MENE; God heeft uw koninkrijk geteld, en Hij heeft het beëindigd. TEKEL; u bent op een weegschaal gewogen, en u bent te licht bevonden. PERES; uw koninkrijk is verdeeld, en het is aan de Meden en de Perzen gegeven.", "Openb 4:11": "U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.", "Joh 15:10": "Als u Mijn geboden bewaart, dan zult u in Mijn liefde blijven; zoals Ik de geboden van Mijn Vader bewaard heb, en blijf in Zijn liefde.", "Openb 12:17": "En de draak werd toornig op de vrouw, en ging heen om oorlog te voeren tegen de overigen van haar nageslacht, die de geboden van God bewaren, en de getuigenis van Jezus Christus hebben.", "Ps 108:2-4": "O God! Mijn hart is bereid; ik zal zingen en psalmzingen, ook mijn eer. Ontwaak, u luit en harp! Ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o HEERE! En ik zal U psalmzingen onder de natiën.", "Ps 32:11": "Verblijd u in de HEERE, en verheug u, rechtvaardigen! En zing vrolijk, alle oprechten van hart!", "Gen 16:5": "Toen zei Sarai tegen Abram: Het onrecht mij aangedaan komt op u neer; ik heb mijn dienstmaagd in uw schoot gegeven; nu zij ziet dat zij zwanger is geworden, ben ik veracht in haar ogen; de HEERE oordele tussen mij en tussen u!", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Hagg 2:9": "Mijn is het zilver, en Mijn is het goud, spreekt de HEERE van de heerscharen.", "Jes 27:3": "Ik, de HEERE, behoed die, elk ogenblik zal Ik hem bevochtigen; opdat de vijand hem niet bezoekt, zal Ik hem bewaren, nacht en dag.", "Ps 106:48": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid; en al het volk zegt: Amen, Halleluja!", "Ps 86:12": "Heere, mijn God! ik zal U met mijn hele hart loven, en ik zal Uw Naam eren tot in eeuwigheid;", "Ps 106:30": "Toen stond Pinehas op, en hij voerde het oordeel uit, en de plaag werd opgehouden.", "Klaagl 3:22": "Cheth. Het zijn de blijken van goedertierenheid van de HEERE, dat wij niet vernietigd zijn, dat Zijn barmhartigheden geen einde hebben;", "1 Kon 8:32": "hoor Ú dan in de hemel, en doe, en oordeel Uw dienaren, veroordeel de onrechtvaardige door zijn weg op zijn hoofd te leggen, en verklaar de rechtvaardige rechtvaardig door hem te geven naar zijn gerechtigheid.", "Ps 117:1": "Loof de HEERE, alle heidenvolken; prijs Hem, alle natiën!", "Ps 22:4": "Doch U bent heilig, wonende onder de lofzangen van Israël.", "Ps 89:53": "Geloofd zij de HEERE in eeuwigheid! Amen, ja, amen.", "Jona 4:2": "En hij bad tot de HEERE, en zei: Och HEERE! Was dit niet mijn woord, toen ik nog in mijn land was? Daarom kwam ik het voor, door naar Tarsis te vluchten; want ik wist dat U een genadig en barmhartig God bent, geduldig en groot van goedertierenheid, en berouw hebbend over het kwaad.", "Jer 23:6": "In Zijn dagen zal Juda verlost worden, en Israël zal zeker wonen; en dit zal Zijn naam zijn, waarmee men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.", "Ex 34:32": "En daarna kwamen al de kinderen van Israël dichterbij; en hij gebood hun alles wat de HEERE met hem gesproken had op de berg Sinaï.", "Ps 40:2": "Ik heb de HEERE lang verwacht; en Hij heeft Zich tot mij geneigd, en mijn geroep gehoord.", "Dan 2:23": "Ik dank U en ik loof U, o God van mijn vaderen! Omdat U mij wijsheid en kracht gegeven hebt, en mij nu bekendgemaakt hebt wat wij van U gevraagd hebben, want U hebt ons de zaak van de koning bekendgemaakt.", "Jes 10:18": "Ook zal Hij verteren de heerlijkheid van zijn woud en van zijn vruchtbare veld; van de ziel af, tot het vlees toe; en hij zal zijn, zoals wanneer een vaandeldrager versmelt.", "Zach 10:6": "En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren.", "2 Kon 21:8": "En Ik zal niet langer de voet van Israël laten wankelen uit dit land, dat Ik hun vaderen gegeven heb; alleen als zij nauwlettend doen naar alles wat Ik hun geboden heb, en naar de hele wet die Mijn dienaar Mozes hun geboden heeft.", "1 Petr 5:11": "Aan Hem zij de heerlijkheid en de kracht, tot in alle eeuwigheid. Amen.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Ps 107:31": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Hebr 12:22-24": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen; Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn; En tot de Middelaar van het nieuwe testament, Jezus, en het bloed van de besprenging, dat betere dingen spreekt dan Abel.", "Openb 3:7": "En schrijf aan de engel van de gemeente die in Filadelfia is: Dit zegt de Heilige, de Waarachtige, Die de sleutel van David heeft; Die opent, en niemand sluit, en Hij sluit, en niemand opent:", "Ps 72:1": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning.", "Jes 45:19": "Ik heb niet in het verborgene gesproken, op een donkere plaats van de aarde; Ik heb tegen het zaad van Jakob niet gezegd: Zoekt Mij tevergeefs; Ik ben de HEERE, Die gerechtigheid spreekt, Die rechtmatige dingen verkondigt.", "Job 12:9": "Wie weet niet, uit al deze dingen, dat de hand van de HEERE dit doet?", "Ps 43:4": "En dat ik inga tot Gods altaar, tot de God van de blijdschap van mijn verheuging, en U met de harp loof, o God, mijn God!", "Pred 12:14": "Want God zal ieder werk in het gericht brengen, met alles wat verborgen is, hetzij goed, of hetzij kwaad.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Ps 10:16": "De HEERE is Koning eeuwig en altijd; de heidenen zijn vergaan uit Zijn land.", "Ex 32:2": "Aäron zei tegen hen: Rukt de gouden oorringen af, die in de oren van uw vrouwen, uw zonen en uw dochters zijn, en breng ze bij mij.", "Rom 1:32": "die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.", "Richt 3:15": "Toen riepen de kinderen van Israël tot de HEERE, en de HEERE verwekte hun een verlosser, Ehud, de zoon van Gera, een zoon van Jemini, een man die links was. En de kinderen van Israël zonden door zijn hand een geschenk aan Eglon, de koning van de Moabieten.", "Ezech 33:14-16": "Als Ik ook tegen de goddeloze zeg: U zult zeker sterven! en hij zich van zijn zonde bekeert en recht en gerechtigheid doet; Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven. Aan al zijn zonden die hij gezondigd heeft, zal niet meer gedacht worden; hij heeft recht en gerechtigheid gedaan, hij zal zeker leven.", "Jer 36:27": "Toen kwam het woord van de HEERE tot Jeremia, nadat de koning de rol en de woorden die Baruch geschreven had uit de mond van Jeremia, verbrand had:", "Luk 17:16": "En hij viel op zijn gezicht voor Zijn voeten en dankte Hem; en dat was een Samaritaan.", "Neh 9:27-31": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten. Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered. En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Ps 59:14": "Verteer hen in grimmigheid; verteer hen, zodat zij er niet meer zijn, en laat hen weten dat God Heerser is in Jakob, ja, tot aan de einden van de aarde. Sela.", "Openb 19:16": "En Hij heeft op Zijn kleed en op Zijn dij deze Naam geschreven: Koning der koningen, en Heere der heren.", "Joh 15:14": "U bent Mijn vrienden, als u doet wat Ik u gebied.", "Jer 3:22": "Keer terug, afkerige kinderen! Ik zal uw afkeringen genezen. Zie, hier zijn wij, wij komen tot U, want U bent de HEERE, onze God!", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "Openb 1:20": "de verborgenheid van de zeven sterren die u gezien hebt in Mijn rechterhand, en de zeven gouden kandelaren. De zeven sterren zijn de engelen van de zeven gemeenten; en de zeven kandelaren die u gezien hebt, zijn de zeven gemeenten.", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Hos 2:13-22": "Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken. En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland. En het zal op die dag gebeuren, spreekt de Heere, dat u Mij zult noemen: Mijn Man; en Mij niet meer zult noemen: Mijn Baäl!", "Ps 130:7": "Israël, hoop op de HEERE; want bij de HEERE is goedertierenheid, en bij Hem is veel verlossing.", "Openb 15:4": "Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.", "Joh 8:28": "Jezus zei dan tegen hen: Wanneer u de Zoon des mensen verhoogd zult hebben, dan zult u weten dat Ik Die ben, en dat Ik niets uit Mijzelf doe; maar Ik spreek deze dingen zoals Mijn Vader Mij geleerd heeft.", "Jer 3:15": "En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand.", "Ps 31:8": "Ik zal mij verheugen en verblijden in Uw goedertierenheid, omdat U mijn ellende hebt aangezien, en mijn ziel in benauwdheden gekend hebt;", "Ps 98:4-6": "Juich de HEERE toe, heel de aarde! Roep uit van vreugde, en zing vrolijk, en zing psalmen. Zing psalmen voor de HEERE met de harp, met de harp en met de stem van het gezang, Met trompetten en bazuingeklank; juich voor het aangezicht van de Koning, de HEERE.", "Jes 52:7-12": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning. Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal. Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.", "Ps 72:1-19": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning. Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht. De bergen zullen aan het volk vrede dragen, ook de heuvels, met gerechtigheid.", "Ps 50:6": "En de hemelen verkondigen Zijn gerechtigheid; want God Zelf is Rechter. Sela.", "Ps 9:12": "Zingt psalmen voor de HEERE, Die te Sion woont; verkondigt onder de volken Zijn daden.", "Luk 17:15": "En een van hen, die zag dat hij genezen was, keerde terug en verheerlijkte God met luide stem.", "Ef 1:22": "En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;", "Jes 24:20": "De aarde zal helemaal waggelen, zoals een dronkaard, en zij zal heen en weer bewogen worden, zoals een nachthut; en haar overtreding zal zwaar op haar zijn, en zij zal vallen, en niet meer opstaan.", "Ps 95:6": "Komt, laat ons aanbidden en neerbukken; laat ons knielen voor de HEERE, Die ons gemaakt heeft.", "Ef 2:22": "op Wie ook u mede gebouwd wordt tot een woonplaats van God in de Geest.", "Joël 1:14": "Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE.", "Ps 119:87": "Zij hebben mij bijna vernietigd op de aarde, maar ik heb Uw bevelen niet verlaten.", "Rom 10:12": "Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen.", "Zach 3:9": "Want zie, aangaande die steen, die Ik gelegd heb voor het aangezicht van Jozua, op die ene steen zullen zeven ogen zijn; zie, Ik zal zijn graveersel graveren, spreekt de HEERE van de heerscharen, en Ik zal de ongerechtigheid van dit land op één dag wegnemen.", "2 Tess 1:4-6": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt; Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken;", "Hand 23:1": "En Paulus keek de raad recht aan en zei: Mannen broeders! Ik heb met een geheel goed geweten voor God geleefd tot op deze dag.", "Joh 7:28": "Jezus riep dan in de tempel, terwijl Hij leerde, en zei: U kent Mij, en u weet van waar Ik ben; en Ik ben niet uit Mijzelf gekomen, maar Hij die Mij gezonden heeft, is waarachtig, Hem kent u niet.", "1 Joh 2:3-6": "En hieraan weten wij, dat wij Hem gekend hebben, als wij Zijn geboden bewaren. Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet; Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "Deut 5:29": "Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!", "Ps 119:7": "Ik zal U loven in oprechtheid van hart, als ik de rechten van Uw gerechtigheid geleerd zal hebben.", "Ps 119:51": "De hoogmoedigen hebben mij boven mate zeer bespot; nochtans ben ik van Uw wet niet geweken.", "Richt 9:56": "Zo liet God het kwaad van Abimelech, dat hij aan zijn vader gedaan had door zijn zeventig broers te doden, op hem terugkomen.", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Jes 40:22": "Hij is het, Die daar zit boven de kring van de aarde, en haar inwoners zijn als sprinkhanen; Hij is het, Die de hemel uitspant als een dunne doek, en breidt hem uit als een tent, om te bewonen;", "1 Kron 29:12": "En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.", "Ps 60:8": "God heeft gesproken in Zijn heiligdom; daarom zal ik van vreugde opspringen; ik zal Sichem verdelen, en het dal van Sukkoth zal ik afmeten.", "Ps 132:7": "Wij zullen in Zijn woningen ingaan, wij zullen ons neerbuigen voor de voetbank van Zijn voeten.", "Ps 86:15": "Maar Gij, Heere! zijt een barmhartig en genadig God, geduldig, en groot van goedertierenheid en waarheid.", "Ps 102:14": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.", "Zef 3:7": "Ik zei: Zeker zult u Mij vrezen, u zult de tucht aannemen, opdat haar woning niet uitgeroeid zou worden; alles waarmee Ik haar bezocht heb¹, waarlijk, zij hebben zich vroeg opgemaakt, zij hebben al hun handelingen verdorven.", "Hand 4:31": "En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.", "Ps 94:10": "Zou Hij, Die de heidenen tuchtigt, niet straffen, Hij, Die de mens wetenschap leert?", "Job 41:2": "Wie heeft Mij iets gegeven, dat Ik het hem zou vergelden? Wat onder de hele hemel is, is van Mij.", "Ps 71:22": "Ook zal ik U loven met het instrument van de luit, Uw trouw, mijn God; ik zal U psalmzingen met de harp, o Heilige van Israël!", "Ps 108:6": "Verhef U, o God! Boven de hemelen, en Uw eer over de hele aarde.", "Ps 76:9": "U deed een oordeel horen uit de hemel; de aarde vreesde en werd stil,", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "1 Kron 16:10": "Roemt u in de Naam van Zijn heiligheid; laat het hart van hen die de HEERE zoeken zich verblijden.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Matt 13:8": "En een ander deel viel in de goede aarde, en gaf vrucht, het ene honderdvoud, het andere zestigvoud, en het andere dertigvoud.", "Luk 1:49": "Want grote dingen heeft Hij, Die machtig is, aan mij gedaan, en heilig is Zijn Naam.", "Ps 143:10": "Leer mij Uw welbehagen doen, want Gij zijt mijn God; Uw goede Geest leidt mij in een effen land.", "Ps 118:5": "Uit de benauwdheid heb ik de HEERE aangeroepen; de HEERE heeft mij verhoord en mij in de ruimte gezet.", "Judas 1:15": "Om over allen gericht te houden, en alle goddelozen onder hen te straffen, vanwege al hun goddeloze werken, die zij goddeloos gedaan hebben, en vanwege alle harde woorden die de goddeloze zondaars tegen Hem gesproken hebben.", "Ex 15:1": "Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen.", "Ps 79:13": "Zo zullen wij, Uw volk en de schapen van Uw weide, U loven in eeuwigheid, van geslacht tot geslacht; wij zullen Uw roem vertellen.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Jes 51:3": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang.", "Ps 119:54-56": "Uw inzettingen zijn mij gezangen geweest, ter plaatse van mijn vreemdelingschap. HEERE! 's nachts ben ik Uw Naam indachtig geweest, en heb Uw wet bewaard. Dat is mij gebeurd, omdat ik Uw bevelen bewaard heb.", "Ps 11:4": "De HEERE is in het paleis van Zijn heiligheid, de troon van de HEERE is in de hemel; Zijn ogen aanschouwen, Zijn oogleden beproeven de mensenkinderen.", "Ex 34:23": "Al wat mannelijk is onder u zal driemaal in het jaar verschijnen voor het aangezicht van de Heere HEERE, de God van Israël.", "Job 36:5-7": "Zie, God is machtig, toch veracht Hij niemand; machtig is Hij in kracht van hart. Hij laat de goddeloze niet leven, en het recht van de ellendigen verschaft Hij. Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven.", "Ps 36:6": "O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe.", "Matt 9:9": "En toen Jezus vandaar verder ging, zag Hij een man in het tolhuis zitten, genaamd Mattheüs; en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "2 Kron 6:22": "Wanneer iemand tegen zijn naaste zal gezondigd hebben, en die hem een eed van de vloek opgelegd zal hebben om zichzelf te vervloeken, en de eed van de vloek voor Uw altaar in dit huis komen zal;", "1 Kron 23:30": "En om elke morgen te staan om de HEERE te loven en te prijzen; en evenzo 's avonds;", "1 Sam 12:3-5": "Zie, hier ben ik, getuig tegen mij voor de HEERE, en voor Zijn gezalfde: van wie heb ik een os genomen, en van wie heb ik een ezel genomen, en wie heb ik onrecht aangedaan, wie heb ik onderdrukt, en uit wiens hand heb ik een geschenk genomen om daarmee mijn ogen dicht te doen? Dan zal ik het u teruggeven. Toen zeiden zij: U hebt ons geen onrecht aangedaan, en u hebt ons niet onderdrukt, en u hebt van niemands hand iets genomen. Toen zei hij tegen hen: De HEERE is Getuige tegen u, en Zijn gezalfde is vandaag getuige, dat u in mijn hand niets gevonden hebt! En het volk zei: Hij is Getuige!", "Ps 66:2": "Zingt psalmen tot eer van Zijn Naam; geeft eer aan Zijn lof.", "Deut 32:43": "Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Ps 98:6": "Met trompetten en bazuingeklank; juich voor het aangezicht van de Koning, de HEERE.", "Ezech 36:22": "Daarom, zeg tot het huis van Israël: Zo zegt de Heere HEERE: Ik doe het niet om u, huis van Israël! Maar om Mijn heilige Naam, die u ontheiligd hebt onder de heidenen waarheen u gekomen bent.", "Jer 3:12": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.", "Ps 18:7": "Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; Hij hoorde mijn stem uit Zijn paleis, en mijn geroep voor Zijn aangezicht kwam in Zijn oren.", "Ex 29:11-37": "En u zult de stier slachten voor het aangezicht van de HEERE, bij de deur van de tent van de samenkomst. Daarna zult u van het bloed van de stier nemen, en met uw vinger op de hoornen van het altaar doen; en al het bloed zult u uitgieten bij de bodem van het altaar. U zult ook al het vet nemen, dat het ingewand bedekt, en het net over de lever, en beide nieren en het vet, dat daaraan is, en u zult ze in rook laten opgaan op het altaar.", "Openb 19:2": "Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft.", "Ps 144:9": "O God, ik zal U een nieuw lied zingen; met de luit en het tiensnarig instrument zal ik U lofzingen.", "1 Joh 1:5": "En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is.", "Ps 89:31-33": "Als zijn kinderen Mijn wet verlaten, en in Mijn rechten niet wandelen; als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden; dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Ezech 16:50": "En zij verhieven zich, en deden gruwelijkheid voor Mijn aangezicht; daarom deed Ik ze weg, nadat Ik het gezien had.", "Jona 4:10": "En de HEERE zei: U hebt medelijden met de wonderboom, waarvoor u niet gewerkt hebt en die u niet hebt laten groeien; die in één nacht ontstond, en in één nacht verging.", "Ps 18:45": "Zo gauw als hun oor van mij hoorde, hebben zij mij gehoorzaamd; vreemden hebben zich mij geveinsd onderworpen.", "Rom 1:23": "en hebben de heerlijkheid van de onvergankelijke God veranderd in de gelijkenis van het beeld van een vergankelijk mens, en van vogels, en van viervoetige en kruipende dieren.", "Lev 20:26": "En u zult Mij heilig zijn, want Ik, de HEERE, ben heilig; en Ik heb u van de volken afgezonderd, opdat u van Mij zou zijn.", "Ps 118:21": "Ik zal U loven, omdat U mij verhoord hebt, en mij tot heil geweest bent.", "Ps 76:3": "En in Salem is Zijn hut, en Zijn woning in Sion.", "2 Petr 3:2": "Opdat u de woorden gedenkt die van tevoren gesproken zijn door de heilige profeten, en het gebod van ons, de apostelen van de Heere en Zaligmaker;", "Ps 119:72": "De wet van Uw mond is mij beter, dan duizenden van goud of zilver.", "Job 12:17": "Hij voert de raadsheren beroofd weg, en de rechters maakt Hij uitzinnig,", "Joh 14:15": "Als u Mij liefhebt, bewaar dan Mijn geboden.", "Ps 147:19": "Hij maakt aan Jakob Zijn woorden bekend, aan Israël Zijn inzettingen en Zijn rechten.", "Ps 30:4": "HEERE! U hebt mijn ziel uit het graf opgevoerd; U hebt mij bij het leven behouden, zodat ik niet in de kuil neerdaalde.", "Job 34:23": "Zeker, Hij legt de mens niet te veel op, dat hij tegen God in het gericht zou mogen treden.", "Jer 32:18": "U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!", "Jes 60:10": "En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Num 9:21": "Maar als het zo was dat de wolk van de avond tot de morgen daar bleef, en de wolk in de morgen werd opgeheven, dan trokken zij verder; of het nu overdag of 's nachts was dat de wolk werd opgeheven, zij trokken verder.", "Ps 95:2": "Laat ons Zijn aangezicht tegemoet gaan met lof; laat ons Hem juichen met psalmen.", "Ezech 16:42": "Zo zal Ik Mijn grimmigheid op u laten rusten, en Mijn ijver zal van u wijken; en Ik zal stil zijn, en niet meer toornig zijn.", "Jes 58:9": "Dan zult u roepen, en de HEERE zal antwoorden; u zult schreeuwen, en Hij zal zeggen: Zie, hier ben Ik. Als u uit uw midden wegdoet het juk, het uitsteken van de vinger, en het spreken van ongerechtigheid;", "Ex 32:16": "En diezelfde tafelen waren het werk van God; het schrift was ook het schrift van God zelf, in de tafelen gegraveerd.", "Ezech 18:32": "Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Ps 95:3-5": "Want de HEERE is een grote God; ja, een groot Koning boven alle goden; In Wiens hand de diepste plaatsen van de aarde zijn, en de hoogten van de bergen zijn van Hem; Van Hem is ook de zee, want Hij heeft ze gemaakt; en Zijn handen hebben het droge gevormd.", "Num 14:13-20": "En Mozes zei tegen de HEERE: Dan zullen de Egyptenaren het horen; want U hebt door Uw kracht dit volk uit hun midden doen optrekken; en zij zullen het zeggen tegen de inwoners van dit land, die gehoord hebben dat U, HEERE, in het midden van dit volk bent; dat U, HEERE, oog in oog gezien wordt, dat Uw wolk over hen staat, en U voor hun aangezicht gaat in een wolkkolom overdag, en in een vuurkolom 's nachts. En zou U dit volk als één man doden, dan zouden de heidenvolken, die het bericht over U gehoord hebben, zeggen:", "Ezech 20:42": "En u zult weten dat Ik de HEERE ben, wanneer Ik u in het land van Israël gebracht zal hebben, in het land waarover Ik Mijn hand heb opgeheven om het aan uw vaderen te geven.", "Luk 1:68-73": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht; zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Ps 99:1-9": "De HEERE regeert, dat de volken beven; Hij zit tussen de cherubs; de aarde beeft. De HEERE is groot in Sion, en Hij is hoog boven alle volken. Laat men Uw grote en ontzagwekkende Naam loven, die heilig is;", "Job 36:3": "Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "Jak 5:11": "Zie, wij noemen hen gelukkig die volharden; u hebt van de volharding van Job gehoord, en u hebt gezien hoe de Heere het einde bracht, dat de Heere zeer barmhartig is en vol ontferming.", "Ps 48:3": "Schoon van ligging, een vreugde van de hele aarde is de berg Sion, aan de zijden van het noorden; de stad van de grote Koning.", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Deut 3:26": "Maar de HEERE was zeer toornig op mij vanwege u, en luisterde niet naar mij; maar de HEERE zei tegen mij: Laat het u genoeg zijn; spreek niet meer tot Mij over deze zaak.", "Ps 146:10": "De HEERE zal in eeuwigheid regeren; uw God, o Sion! is van geslacht tot geslacht. Halleluja!", "Ps 119:142": "Uw gerechtigheid is gerechtigheid in eeuwigheid, en Uw wet is de waarheid.", "Zach 14:16-18": "En het zal gebeuren, dat allen die overgebleven zijn van alle heidenen die tegen Jeruzalem gekomen zullen zijn, van jaar tot jaar zullen optrekken om de Koning, de HEERE van de heerscharen, te aanbidden, en om het feest van de loofhutten te vieren. En het zal gebeuren: wie van de geslachten van de aarde niet naar Jeruzalem zal optrekken om de Koning, de HEERE van de heerscharen, te aanbidden, over hen zal geen regen zijn. En als het geslacht van de Egyptenaren, over wie de regen niet is, niet zal optrekken en niet zal komen, dan zal die plaag over hen zijn, waarmee de HEERE de heidenen plagen zal die niet optrekken zullen om het feest van de loofhutten te vieren.", "Hebr 10:7": "Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Hagg 1:8": "Klim het gebergte op, breng hout aan, en bouw dit huis, en Ik zal er welgevallen aan hebben en verheerlijkt worden, zegt de HEERE.", "Ps 119:166-168": "O HEERE! ik hoop op Uw heil, en doe Uw geboden. Mijn ziel onderhoudt Uw getuigenissen, en ik heb ze zeer lief. Ik onderhoud Uw bevelen en Uw getuigenissen, want al mijn wegen zijn voor U.", "Jer 5:10": "Beklim haar muren, en verwoest ze (maar maak er geen einde aan); haal haar tinnen weg, want zij zijn niet van de HEERE.", "Ex 32:35": "Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had.", "Klaagl 5:19": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht.", "2 Kor 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting;", "Num 14:24": "Maar Mijn dienaar Kaleb, omdat een andere geest met hem geweest is, en hij Mij trouw is blijven volgen, zal Ik hem brengen tot het land waarin hij gekomen was, en zijn nageslacht zal het erfelijk bezitten.", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "Ps 35:24": "Doe mij recht naar Uw gerechtigheid, HEERE, mijn God! En laat hen zich over mij niet verblijden.", "Ps 76:12": "Doe geloften en betaal ze de HEERE, uw God, u allen, die rondom Hem zijn! Laat men Hem, Die te vrezen is, geschenken brengen;", "Mark 14:26": "En nadat zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.", "2 Kron 6:23": "Hoor U dan uit de hemel, en doe, en richt Uw knechten, door de goddeloze te vergelden en zijn weg op zijn hoofd te leggen, en door de rechtvaardige recht te doen en hem naar zijn gerechtigheid te geven.", "Ps 67:4": "De volken zullen U, o God, loven; de volken, allemaal, zullen U loven.", "Ps 89:29": "Ik zal hem Mijn goedertierenheid in eeuwigheid bewaren, en Mijn verbond zal hem vast blijven.", "Ps 14:7": "Och, dat Israëls verlossing uit Sion kwam! Als de HEERE de gevangenen van Zijn volk zal doen terugkeren, dan zal Jakob zich verheugen, Israël zal blij zijn.", "Deut 28:58": "Als u niet oplet om al de woorden van deze wet te doen, die in dit boek geschreven zijn, om deze heerlijke en ontzagwekkende Naam te vrezen, de HEERE, uw God;", "Ps 89:34": "Maar Mijn goedertierenheid zal Ik van hem niet wegnemen, en in Mijn getrouwheid niet feilen.", "Ps 98:1-9": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven. De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen. Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Jes 40:23": "Die de vorsten teniet maakt; de rechters van de aarde maakt Hij tot ijdelheid.", "Openb 4:8": "En de vier dieren hadden ieder voor zichzelf zes vleugels rondom, en waren van binnen vol ogen; en zij hebben geen rust, dag en nacht, en zeggen: Heilig, heilig, heilig is de Heere God, de Almachtige, Die was, en Die is, en Die komen zal.", "Ps 78:5": "Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken;", "Hos 11:7": "Want Mijn volk blijft hangen aan de afkering van Mij; zij roepen het wel tot de Allerhoogste, maar niet één verhoogt Hem.", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Jes 5:16": "Doch de HEERE van de heerscharen zal verhoogd worden door het recht; en God, die Heilige, zal geheiligd worden door gerechtigheid.", "Ps 22:25": "Want Hij heeft niet veracht, noch verfoeid de verdrukking van de verdrukte, noch Zijn aangezicht voor hem verborgen; maar Hij heeft gehoord, toen hij tot Hem riep.", "Ps 119:15": "Ik zal Uw bevelen overdenken, en op Uw paden letten.", "Neh 4:14": "En ik zag toe, stond op, en zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Wees niet bang voor hen; denk aan die grote en ontzagwekkende Heere, en strijd voor uw broeders, uw zonen en uw dochters, uw vrouwen en uw huizen.", "Ps 119:30": "Ik heb gekozen de weg van de waarheid, Uw rechten heb ik mij voorgesteld.", "Ps 56:11": "In God zal ik het woord prijzen; in de HEERE zal ik het woord prijzen.", "Ex 23:18": "U zult het bloed van Mijn offer niet offeren met gedesemde broden; ook zal het vet van Mijn feest niet tot de morgen overblijven.", "Ps 30:3": "HEERE, mijn God! ik heb tot U geroepen, en U hebt mij genezen.", "Dan 4:3": "Hoe groot zijn Zijn tekenen! En hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.", "Rom 9:18": "Zo ontfermt Hij Zich dan over wie Hij wil, en Hij verhardt wie Hij wil.", "Micha 7:18": "Wie is een God gelijk U, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel van Zijn erfenis voorbijgaat? Hij houdt Zijn toorn niet voor eeuwig vast; want Hij heeft lust aan goedertierenheid.", "Ps 130:3": "Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Ps 71:19": "Ook is Uw gerechtigheid, o God, tot in de hoogte; Gij, Die grote dingen gedaan hebt; o God! wie is U gelijk?", "Ps 47:8": "Want God is een Koning van de hele aarde; zingt psalmen met verstand!", "Jak 4:12": "Er is één Wetgever, Die kan behouden en verderven. Maar wie bent u, dat u een ander veroordeelt?", "Rom 3:2": "Veel, in alle opzichten; want dit is wel het eerste, dat hun de woorden van God zijn toevertrouwd.", "Jes 54:9": "Want dat zal Mij zijn als de wateren van Noach, toen Ik zwoer dat de wateren van Noach niet meer over de aarde zouden gaan; zo heb Ik gezworen dat Ik niet meer op u toornen, of u bestraffen zal.", "Ps 51:17": "Heere, open mijn lippen, zo zal mijn mond Uw lof verkondigen.", "Ps 47:3": "Want de HEERE, de Allerhoogste, is ontzagwekkend, een groot Koning over de hele aarde.", "Ps 101:2": "Ik zal verstandig handelen op de oprechte weg; wanneer zult U tot mij komen? Ik zal in het midden van mijn huis wandelen, in oprechtheid van mijn hart.", "Job 24:12": "Uit de stad zuchten de mensen, en de ziel van de verwonden schreeuwt uit; toch rekent God het niet aan als ongerijmd.", "Ps 107:6": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij heeft hen gered uit hun angsten;", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "1 Kron 13:6": "Toen trok David op met heel Israël naar Baäla, dat is Kirjath-jearim, dat in Juda ligt, om vandaar de ark van God op te halen, van de HEERE, Die tussen de cherubs woont, waar de Naam wordt aangeroepen.", "Ps 68:29-36": "Uw God heeft uw sterkte geboden; wees sterk, o God, in wat U voor ons hebt uitgewerkt! Om uw tempel te Jeruzalem zullen de koningen U geschenken brengen. Bestraf het wilde gedierte van het riet, de vergadering van de stieren met de kalveren van de volken; en hem die zich onderwerpt met stukken van het zilver; Hij heeft de volken verstrooid die lust hebben in oorlogen.", "Gen 35:1": "Daarna zei God tegen Jakob: Maak u op, trek op naar Bethel, en woon daar; en maak daar een altaar voor de God Die u verscheen, toen u vluchtte voor het aangezicht van uw broer Ezau.", "1 Kor 3:9": "Want wij zijn medearbeiders van God; akkerwerk van God, gebouw van God bent u.", "Ps 99:6-8": "Mozes en Aäron waren onder Zijn priesters, en Samuël onder de aanroepers van Zijn Naam; zij riepen tot de HEERE, en Hij verhoorde hen. Hij sprak tot hen in een wolkkolom; zij hebben Zijn getuigenissen onderhouden, en de inzettingen die Hij hun gegeven had. O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.", "Ps 116:12-14": "Wat zal ik de HEERE vergelden voor al Zijn weldaden aan mij bewezen? Ik zal de beker der verlossingen opnemen, en de Naam van de HEERE aanroepen. Mijn geloften zal ik de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Ps 1:2": "Maar zijn vreugde is in de wet van de HEERE, en hij overdenkt Zijn wet dag en nacht.", "Spr 1:33": "Maar die naar Mij hoort, zal zeker wonen, en hij zal gerust zijn van de vrees voor het kwaad.", "Ps 119:110": "De goddelozen hebben mij een strik gelegd; nochtans ben ik niet afgedwaald van Uw bevelen.", "Jer 7:23": "Maar deze zaak heb Ik hun geboden, en Ik zei: Hoor naar Mijn stem, dan zal Ik u tot een God zijn, en u zult Mij tot een volk zijn; en wandel in heel de weg die Ik u gebieden zal, opdat het u goed gaat.", "Ps 96:7-9": "Geeft de HEERE, geslachten van de volken! Geeft de HEERE eer en sterkte. Geeft de HEERE de eer van Zijn Naam; brengt een offer, en komt in Zijn voorhoven. Aanbidt de HEERE in de heerlijkheid van het heiligdom; beeft voor Zijn aangezicht, heel de aarde.", "Rom 9:19": "U zult dan tegen mij zeggen: Wat heeft Hij dan nog aan te klagen? Want wie heeft Zijn wil weerstaan?", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Openb 6:14": "En de hemel is weggeweken, als een boek, dat opgerold wordt; en alle bergen en eilanden zijn bewogen uit hun plaatsen.", "Ps 71:14": "Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.", "Ps 145:1-21": "Een lofzang van David. Aleph. O mijn God, U Koning! Ik zal U verhogen, en Uw Naam loven voor eeuwig en altijd. Beth. Elke dag zal ik U loven, en Uw Naam prijzen voor eeuwig en altijd. Gimel. De HEERE is groot en zeer te prijzen, en Zijn grootheid is ondoorgrondelijk.", "Luk 1:78": "door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;", "Dan 7:10": "Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "Ps 22:24": "U die de HEERE vreest, prijs Hem; al u nageslacht van Jakob, vereer Hem; en ontzie u voor Hem, al u nageslacht van Israël!", "Ps 96:8": "Geeft de HEERE de eer van Zijn Naam; brengt een offer, en komt in Zijn voorhoven.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "1 Kor 10:26": "want de aarde is van de Heere, en al wat zij bevat.", "Zach 8:3": "Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "1 Joh 3:24": "En die Zijn geboden bewaart, blijft in Hem, en Hij in hem. En hieraan weten wij dat Hij in ons blijft, namelijk uit de Geest, Die Hij ons gegeven heeft.", "Gen 18:20": "Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Neh 9:5": "En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!", "Ps 145:8": "Cheth. Genadig en barmhartig is de HEERE, geduldig en groot van goedertierenheid.", "Ps 138:1": "Een psalm van David. Ik zal U loven met mijn hele hart; in de tegenwoordigheid van de goden zal ik U psalmzingen.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Ps 26:3-6": "Want Uw goedertierenheid is voor mijn ogen, en ik wandel in Uw waarheid. Ik zit niet bij nietswaardige mensen, en met huichelaars ga ik niet om. Ik haat de vergadering van de boosdoeners, en bij de goddelozen zit ik niet.", "Ps 21:14": "Verhoog U, HEERE! In Uw sterkte; zo zullen wij zingen, en Uw macht met psalmen loven.", "Ps 119:16": "Ik zal mijzelf vermaken in Uw inzettingen; Uw woord zal ik niet vergeten.", "Dan 2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Klaagl 3:38": "Mem. Gaat niet uit de mond van de Allerhoogste het kwade en het goede?", "Ps 112:1": "Halleluja! Aleph. Gelukkig is de man, die de HEERE vreest; Beth. die grote lust heeft in Zijn geboden.", "Richt 2:18": "En wanneer de HEERE hun richters verwekte, zo was de HEERE met de richter, en verloste hen uit de hand van hun vijanden, al de dagen van de richter; want het berouwde de HEERE vanwege hun zuchten om hen die hen drongen en die hen drukten.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "Ps 97:4": "Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft.", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "Lev 21:8": "Daarom zult u hem heiligen, omdat hij het voedsel van uw God offert; hij zal u heilig zijn, want Ik ben heilig; Ik ben de HEERE, die u heiligt!", "Jer 31:12": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn.", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Ps 108:8": "God heeft gesproken in Zijn heiligdom, daarom zal ik van vreugde opspringen; ik zal Sichem delen, en het dal van Sukkoth zal ik afmeten.", "Ps 18:26": "Bij de goedertierene houdt U Zich goedertieren, bij de oprechte man houdt U Zich oprecht.", "Ps 119:106": "Ik heb gezworen, en zal het bevestigen, dat ik onderhouden zal de rechten van Uw gerechtigheid.", "Luk 1:50": "En Zijn barmhartigheid is van geslacht tot geslacht over hen die Hem vrezen.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "2 Kon 20:3": "Och, HEERE, gedenk toch dat ik voor Uw aangezicht in waarheid en met een volkomen hart gewandeld heb, en gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg veel.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Ps 66:1": "Een lied, een psalm, voor de koorleider. Juicht tot God, heel de aarde!", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "Ps 66:3": "Zegt tot God: Hoe ontzagwekkend bent U in Uw werken! Om de grootheid van Uw sterkte zullen Uw vijanden zich geveinsd aan U onderwerpen.", "Ps 97:1": "De HEERE regeert, de aarde verheugt zich; laat veel eilanden zich verblijden.", "Matt 22:31": "En wat de opstanding van de doden betreft, hebt u niet gelezen wat door God tot u gesproken is, toen Hij zei:", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Ex 39:42": "Naar alles wat de HEERE aan Mozes geboden had, zo hadden de kinderen van Israël het gehele werk gemaakt.", "Ps 134:2": "Hef uw handen op naar het heiligdom, en loof de HEERE.", "Ps 76:10": "Toen God opstond ten oordeel, om alle zachtmoedigen van de aarde te verlossen. Sela.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "Ps 118:28": "U bent mijn God, daarom zal ik U loven; o mijn God, ik zal U verhogen.", "Openb 14:1-5": "En ik zag, en zie, het Lam stond op de berg Sion, en met Hem honderdvierenveertigduizend, die de naam van Zijn Vader geschreven hadden op hun voorhoofden. En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers; en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.", "Joh 14:31": "Maar opdat de wereld weet dat Ik de Vader liefheb, en zo doe zoals de Vader Mij geboden heeft. Sta op, laten wij vanhier gaan.", "Joz 22:2": "En hij zei tegen hen: U hebt alles onderhouden wat Mozes, de dienaar van de HEERE, u geboden heeft; en u bent mijn stem gehoorzaam geweest in alles wat ik u geboden heb.", "Pred 3:17": "Ik zei in mijn hart: God zal de rechtvaardige en de goddeloze oordelen; want daar is de tijd voor alle voornemen, en over alle werk.", "Ps 103:20-22": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord. Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet! Loof de HEERE, al Zijn werken! Aan alle plaatsen van Zijn heerschappij. Loof de HEERE, mijn ziel!", "1 Sam 2:6-8": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Dan 6:27": "Van mij is een bevel uitgegaan, dat men in de hele heerschappij van mijn koninkrijk moet beven en sidderen voor het aangezicht van de God van Daniël; want Hij is de levende God, en blijvend in eeuwigheid, en Zijn koninkrijk gaat niet te gronde, en Zijn heerschappij duurt tot het einde toe.", "Ps 105:3": "Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "1 Kron 29:11": "Van U, o HEERE, is de grootheid, en de macht, en de heerlijkheid, en de overwinning, en de majesteit; want alles wat in de hemel en op aarde is, is van U: van U, o HEERE, is het Koninkrijk, en U hebt Uzelf verhoogd tot een Hoofd boven alles.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Luk 11:28": "Maar Hij zei: Ja, gelukkiger zijn zij die het Woord van God horen, en het bewaren.", "Jer 36:2": "Neem een rol van het boek, en schrijf daarop alle woorden die Ik tot u gesproken heb over Israël, over Juda en over alle volken, vanaf de dag dat Ik tot u gesproken heb, vanaf de dagen van Josia tot op deze dag.", "Ps 115:16": "Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.", "Ps 119:156": "HEERE! Uw barmhartigheden zijn vele; maak mij levend naar Uw rechten.", "Deut 4:14": "Ook gebood de HEERE mij in diezelfde tijd dat ik u inzettingen en rechten zou leren; opdat u die deed in het land waar u naar toe trekt, om het in bezit te nemen.", "Ps 113:4": "De HEERE is hoog boven alle heidenvolken, boven de hemelen is Zijn heerlijkheid.", "Hebr 3:8": "Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "Jes 34:16": "Zoek in het boek van de HEERE, en lees; niet één van deze zal ontbreken, de één noch de ander zal men missen; want Mijn mond Zelf heeft het geboden, en Zijn Geest Zelf zal ze samenbrengen.", "1 Tess 4:1-3": "Verder dan, broeders, wij bidden en vermanen u in de Heere Jezus, zoals u van ons ontvangen hebt hoe u moet wandelen en God behagen, dat u daarin meer overvloedig wordt. Want u weet, wat bevelen wij u gegeven hebben door de Heere Jezus. Want dit is de wil van God, uw heiliging: dat u zich onthoudt van de hoererij;", "1 Kor 15:9": "Want ik ben de minste van de apostelen, die niet waardig ben een apostel genoemd te worden, omdat ik de Gemeente van God vervolgd heb.", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Klaagl 1:18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.", "Jes 30:13": "Daarom zal deze misdaad voor u zijn als een vallende scheur, uitwaarts gebogen in een hoge muur, waarvan de breuk snel, in een ogenblik, komen zal.", "Deut 32:8": "Toen de Allerhoogste aan de volken de erfenis uitdeelde, toen Hij Adams kinderen van elkaar scheidde, heeft Hij de grenzen van de volken vastgesteld naar het getal van de kinderen van Israël.", "Ps 9:9": "En Hij Zelf zal de wereld richten in gerechtigheid, en de volken oordelen in rechtmatigheden.", "Ex 15:11": "O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet?", "Ps 119:10": "Ik zoek U met mijn hele hart, laat mij van Uw geboden niet afdwalen.", "Ps 102:11": "Vanwege Uw verstoordheid en Uw grote toorn; want U hebt mij verheven, en mij weer neergeworpen.", "Ps 107:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Ps 116:2": "want Hij neigt Zijn oor tot mij; daarom zal ik Hem in mijn dagen aanroepen.", "Ps 145:17": "Tsade. De HEERE is rechtvaardig in al Zijn wegen, en goedertieren in al Zijn werken.", "Ps 25:10": "Caph. Alle paden van de HEERE zijn goedertierenheid en waarheid, voor hun die Zijn verbond en Zijn getuigenissen bewaren.", "Jes 35:1-10": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos. Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God. Versterkt de slappe handen, en maakt de struikelende knieën vast.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Ps 84:2-11": "Hoe lieflijk zijn Uw woningen, o HEERE van de heerscharen! Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God. Zelfs vindt de mus een huis, en de zwaluw een nest voor zich, waar zij haar jongen legt, bij Uw altaren, HEERE van de heerscharen, mijn Koning, en mijn God!", "Matt 12:50": "Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Luk 11:2": "En Hij zei tegen hen: Wanneer u bidt, zegt dan: Onze Vader, Die in de hemelen bent! Uw Naam worde geheiligd. Laat Uw Koninkrijk komen. Uw wil geschiede, zoals in de hemel, zo ook op de aarde.", "Ps 119:47": "En ik zal mij vermaken in Uw geboden, die ik liefheb.", "Hos 14:2-9": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Ps 2:6": "Ik heb Mijn Koning toch gezalfd over Sion, de berg van Mijn heiligheid.", "Ps 25:6": "Zain. Gedenk, HEERE! Uw barmhartigheden en Uw blijken van goedertierenheid, want die zijn er van eeuwigheid.", "1 Petr 2:5": "Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus.", "2 Kon 13:23": "Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Job 36:19": "Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht?", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Ps 130:8": "En Hij zal Israël verlossen van al zijn ongerechtigheden.", "Jer 20:12": "Gij dan, o HEERE van de heerscharen, Die de rechtvaardige beproeft, Die de nieren en het hart ziet, laat mij Uw wraak op hen zien, want ik heb U mijn rechtszaak voorgelegd.", "Ps 18:51": "Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid.", "Ps 53:7": "Och, dat Israëls verlossingen uit Sion kwamen! Als God de gevangenen van Zijn volk zal doen terugkeren, dan zal Jakob zich verheugen, Israël zal verblijd zijn.", "Ps 119:109": "Mijn ziel is voortdurend in mijn hand; nochtans vergeet ik Uw wet niet.", "Ps 26:12": "Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.", "Hand 16:25": "En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen.", "1 Sam 24:16": "Doch de HEERE zal Rechter zijn, en rechtspreken tussen mij en tussen u, en zien daarin, en mijn geschil beslechten, en mij redden uit uw hand.", "Ex 39:43": "Mozes nu bezag het gehele werk, en zie, zij hadden het gemaakt zoals de HEERE geboden had; zo hadden zij het gemaakt. Toen zegende Mozes hen.", "Jes 1:5": "Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.", "Job 34:24": "Hij vermorzelt de geweldigen, dat men het niet doorzoeken kan, en stelt anderen in hun plaats.", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "1 Kron 16:33": "Dan zullen de bomen van het woud juichen voor het aangezicht van de HEERE, omdat Hij komt om de aarde te richten.", "Jer 51:10": "De HEERE heeft onze gerechtigheden hervoor gebracht; kom en laat ons in Sion het werk van de HEERE, onze God, vertellen!", "Ezech 18:31": "Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "Ex 29:9": "En u zult hen met de gordel omgorden, namelijk Aäron en zijn zonen; en u zult hun de mutsen opbinden, opdat zij het priesterambt hebben tot een eeuwige inzetting. Vervolgens zult u de hand van Aäron vullen, en de hand van zijn zonen.", "Jer 31:6": "Want er zal een dag zijn, waarop de wachters op het gebergte van Efraïm zullen roepen: Maak u op, en laat ons opgaan naar Sion, tot de HEERE, onze God!", "Deut 12:12": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zonen, en uw dochters, en uw dienstknechten, en uw dienstmaagden, en de Leviet die in uw poorten is; want hij heeft geen deel noch erfenis met u.", "Dan 9:4": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Jes 19:14": "De HEERE heeft een zeer verkeerde geest ingeschonken in hun midden, en zij hebben Egypte doen dwalen in al zijn doen, zoals een dronkaard zich om en om wentelt in zijn uitspuwsel.", "Job 23:7": "Daar zou de oprechte met Hem pleiten; en ik zou mij voor eeuwig van mijn Rechter vrijmaken.", "Ps 119:104-106": "Uit Uw bevelen krijg ik verstand, daarom haat ik alle leugenpaden. Nun. Uw woord is een lamp voor mijn voet, en een licht voor mijn pad. Ik heb gezworen, en zal het bevestigen, dat ik onderhouden zal de rechten van Uw gerechtigheid.", "Jer 50:46": "De aarde is beginnen te beven van het geluid van de inneming van Babel, en het geroep is gehoord onder de volken.", "Ps 17:3": "U hebt mijn hart geproefd, 's nachts bezocht, U hebt mij getoetst. U vindt niets; wat ik gedacht heb, overtreedt mijn mond niet.", "Num 16:21": "Scheid u af uit het midden van deze vergadering, en Ik zal hen in een ogenblik verteren!", "Rom 3:1": "Wat is dan het voordeel van de Jood? Of wat is het nut van de besnijdenis?", "2 Tim 3:16": "Heel de Schrift is door God ingegeven, en is nuttig tot lering, tot weerlegging, tot verbetering, tot onderwijzing die in de rechtvaardigheid is;", "Deut 4:31": "Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Ps 119:33": "He. HEERE! leer mij de weg van Uw inzettingen, en ik zal hem houden tot het einde toe.", "Ezech 18:25": "Nog zegt u: De weg van de Heere is niet recht; hoor nu, o huis van Israël! Is Mijn weg niet recht? Zijn niet uw wegen onrecht?", "1 Joh 1:1-5": "Wat er was van het begin af, wat wij gehoord hebben, wat wij gezien hebben met onze ogen, wat wij aanschouwd hebben, en onze handen getast hebben, van het Woord des levens; (Want het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.) Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Dan 7:9": "Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Jes 24:14-16": "Die zullen hun stem opheffen, zij zullen vrolijk zingen; vanwege de heerlijkheid van de HEERE zullen zij juichen vanaf de zee. Daarom eert de HEERE in de valleien, in de eilanden van de zee de Naam van de HEERE, de God van Israël. Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Jes 12:6": "Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.", "Gen 24:3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde,
