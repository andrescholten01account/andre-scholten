 dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Ps 75:7": "Want het verhogen komt niet uit het oosten, noch uit het westen, noch uit de woestijn;", "Ps 119:22": "Wentel van mij smaad en verachting, want ik heb Uw getuigenissen onderhouden.", "Ps 78:4-72": "Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft. Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Ps 92:2-4": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste! Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten; Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.", "Ef 2:4-7": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;", "Hebr 3:6": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden.", "1 Kor 7:10": "Maar de getrouwden gebied ik niet, maar de Heere, dat de vrouw niet van de man scheidt.", "Jak 5:17": "Elia was een mens net zo onderhevig aan gevoelens als wij; en hij bad een gebed, dat het niet zou regenen; en het regende niet op de aarde, drie jaar en zes maanden lang.", "Spr 28:9": "Wie zijn oor afwendt van het horen van de wet, diens gebed zelfs zal een gruwel zijn.", "1 Kor 14:15": "Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen.", "Ezech 14:23": "Zo zullen zij u vertroosten, wanneer u hun weg en hun handelingen zult zien; en u zult weten dat Ik niet zonder reden heb gedaan al wat Ik in haar gedaan heb, spreekt de Heere HEERE.", "Ps 9:8": "Maar de HEERE zal in eeuwigheid zitten; Hij heeft Zijn troon bereid ten gerichte.", "Jer 36:28": "Neem u weer een andere rol, en schrijf daarop al de eerste woorden die op de eerste rol stonden, die Jojakim, de koning van Juda, verbrand heeft.", "Openb 21:11": "En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal.", "Dan 4:25": "Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil.", "Openb 21:2": "En ik, Johannes, zag de heilige stad, het nieuwe Jeruzalem, neerdalen van God uit de hemel, gereedgemaakt als een bruid, die voor haar man versierd is.", "Ps 119:4-6": "Heere! U hebt geboden, dat men Uw bevelen zeer bewaren zal. Och, dat mijn wegen gericht werden, om Uw inzettingen te bewaren! Dan zou ik niet beschaamd worden, wanneer ik letten zou op al Uw geboden.", "Luk 1:77": "om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,", "Ps 149:2": "Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning.", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "2 Kor 12:8": "Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Deut 12:11": "Dan zal er een plaats zijn die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; daarheen zult u brengen alles wat ik u gebied: uw brandoffers, en uw slachtoffers, uw tienden, en het hefoffer van uw hand, en alle beste keuze van uw geloften, die u de HEERE beloven zult.", "2 Sam 6:2": "En David maakte zich op en ging heen met al het volk dat bij hem was, van Baälim-juda, om vandaar de ark van God op te brengen, bij wie de Naam wordt aangeroepen, de Naam van de HEERE van de heerscharen, Die daarop woont tussen de cherubs.", "Ps 22:26": "Van U zal mijn lof zijn in een grote gemeente; ik zal mijn geloften betalen in de tegenwoordigheid van hen die Hem vrezen.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Matt 20:15": "Of mag ik met het mijne niet doen wat ik wil? Of is uw oog boos, omdat ik goed ben?", "Ps 63:4-7": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen. Zo zou ik U loven in mijn leven; in Uw Naam zou ik mijn handen opheffen. Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen.", "Dan 9:7": "Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Ps 119:167": "Mijn ziel onderhoudt Uw getuigenissen, en ik heb ze zeer lief.", "Ps 24:10": "Wie is Hij, deze Koning der ere? De HEERE van de heerscharen, Die is de Koning der ere. Sela.", "Ps 107:32": "En Hem verhogen in de gemeente van het volk, en Hem roemen in de vergadering van de oudsten.", "Ps 119:100-102": "Ik ben voorzichtiger dan de ouden, omdat ik Uw bevelen bewaard heb. Ik heb mijn voeten geweerd van alle kwade paden, opdat ik Uw woord zou onderhouden. Ik ben niet geweken van Uw rechten, want U hebt mij geleerd.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Hos 10:10": "Het is Mijn wens, dat Ik hen zal tuchtigen; en volken zullen tegen hen verzameld worden, wanneer Ik hen bind in hun twee voren.", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Zach 1:16": "Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "2 Kon 14:26": "Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Ps 105:7": "Hij is de HEERE, onze God; Zijn oordelen zijn over de gehele aarde.", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "1 Sam 12:1-5": "Toen zei Samuël tegen heel Israël: Zie, ik heb naar uw stem geluisterd in alles wat u mij gezegd hebt, en ik heb een koning over u gezet. En nu, zie, daar trekt de koning voor uw ogen heen, en ik ben oud en grijs geworden, en zie, mijn zonen zijn bij u; en ik heb voor uw ogen gewandeld van mijn jeugd af tot vandaag toe. Zie, hier ben ik, getuig tegen mij voor de HEERE, en voor Zijn gezalfde: van wie heb ik een os genomen, en van wie heb ik een ezel genomen, en wie heb ik onrecht aangedaan, wie heb ik onderdrukt, en uit wiens hand heb ik een geschenk genomen om daarmee mijn ogen dicht te doen? Dan zal ik het u teruggeven.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Deut 4:39": "Zo zult u vandaag weten, en in uw hart overdenken, dat de HEERE die God is, boven in de hemel en beneden op de aarde, niemand anders!", "Ps 103:18": "Over hen die Zijn verbond houden, en die aan Zijn bevelen denken, om die te doen.", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Openb 11:13": "En op datzelfde uur gebeurde er een grote aardbeving, en het tiende deel van de stad viel, en er werden in de aardbeving zevenduizend namen van mensen gedood, en de overigen werden zeer bevreesd, en gaven de God van de hemel heerlijkheid.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Jer 36:1": "Het gebeurde in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda, dat dit woord van de HEERE tot Jeremia kwam:", "Richt 11:27": "Ik heb ook niet tegen u gezondigd, maar u doet mij onrecht aan door tegen mij te strijden. De HEERE, Die Rechter is, oordele vandaag tussen de kinderen van Israël en de kinderen van Ammon!", "Jes 52:7-10": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning. Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal. Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "Ps 43:3": "Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "Jes 42:10-12": "Zingt de HEERE een nieuw lied, Zijn lof van het einde van de aarde; u, die ter zee vaart, en al wat daarin is, u eilanden en hun inwoners. Laat de woestijn en haar steden de stem verheffen, met de dorpen die Kedar bewoont; laat hen juichen die in de rotsen wonen, en van de top van de bergen af schreeuwen. Laat ze de HEERE de eer geven, en Zijn lof in de eilanden verkondigen.", "Ps 133:1-3": "Een lied Hammaäloth, van David. Zie, hoe goed en hoe fijn is het, dat broeders ook samenwonen! Het is als de kostelijke olie op het hoofd, die neerdaalt op de baard, de baard van Aäron, die neerdaalt tot op de zoom van zijn kleren. Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "Hebr 5:12": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.", "Job 4:17": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker?", "Jer 49:21": "De aarde heeft gebeefd van het geluid van hun val, van het geroep, waarvan het geluid gehoord is bij de Schelfzee.", "Openb 11:17": "en zeiden: Wij danken U, Heere God, Almachtige, Die is, en Die was, en Die komen zal! dat U Uw grote kracht hebt aangenomen, en als Koning hebt geheerst;", "Openb 1:1": "De openbaring van Jezus Christus, die God Hem gegeven heeft, om Zijn dienstknechten te tonen de dingen die spoedig moeten gebeuren; en die Hij door Zijn engel gezonden en aan Zijn dienstknecht Johannes bekendgemaakt heeft;", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Openb 3:4": "Toch hebt u enkele weinige namen ook in Sardis, die hun kleren niet bevlekt hebben, en zij zullen met Mij wandelen in witte kleren, omdat zij het waard zijn.", "2 Kron 7:6": "Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst Hem prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond.", "Ex 12:28": "En de kinderen van Israël gingen en deden het, zoals de HEERE Mozes en Aäron geboden had, zo deden zij.", "Ps 111:1": "Halleluja! Aleph. Ik zal de HEERE loven van ganser harte; Beth. in de raad en vergadering van de oprechten.", "Ps 68:33-35": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Ps 32:5": "Mijn zonde maakte ik U bekend, en mijn ongerechtigheid bedekte ik niet. Ik zei: Ik zal belijdenis van mijn overtredingen doen voor de HEERE; en U vergaf de ongerechtigheid van mijn zonde. Sela.", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Ps 103:6": "De HEERE doet gerechtigheid en recht aan allen die onderdrukt worden.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Ex 30:36": "En daarvan moet u een deel heel fijn stoten, en daarvan moet u leggen vóór de getuigenis, in de tent van de samenkomst, waar Ik tot u komen zal; het zal voor u allerheiligst zijn.", "Deut 9:19": "Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment.", "Jer 29:11": "Want Ik weet de gedachten die Ik over u koester, spreekt de HEERE, gedachten van vrede en niet van kwaad, om u het einde en de verwachting te geven.", "Ps 119:8": "Ik zal Uw inzettingen bewaren; verlaat mij niet al te zeer.", "Ezech 16:6": "Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef!", "Ex 28:1": "Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron.", "2 Kon 17:36": "Maar de HEERE, Die u uit het land Egypte met grote kracht en met een uitgestrekte arm opgevoerd heeft, Hem zult u vrezen, en voor Hem zult u zich buigen, en Hem zult u offers brengen;", "Ps 119:26": "Ik heb U mijn wegen verteld, en U hebt mij verhoord; leer mij Uw inzettingen.", "Ps 119:129": "Pe. Uw getuigenissen zijn wonderbaar, daarom bewaart ze mijn ziel.", "Job 9:15": "Aan wie ik, ook al was ik rechtvaardig, niet zou antwoorden; mijn Rechter zal ik om genade bidden.", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "2 Kron 31:20": "Zo deed Hizkia in heel Juda; en hij deed wat goed, en recht, en waarachtig was, voor het aangezicht van de HEERE, zijn God.", "Luk 6:46-48": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg? Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt. Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "Rom 9:14": "Wat zullen wij dan zeggen? Is er onrechtvaardigheid bij God? Dat zij verre.", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Deut 32:9": "Want het deel van de HEERE is Zijn volk, Jakob is het snoer van Zijn erfenis.", "Ps 81:8": "In de benauwdheid riep u, en Ik hielp u eruit; Ik antwoordde u uit de schuilplaats van de donder; Ik beproefde u aan het water van Meriba. Sela.", "Jer 2:9": "Daarom zal Ik nog met u twisten, spreekt de HEERE; ja, met uw kindskinderen zal Ik twisten.", "Jes 27:2": "Op die dag zal er een wijngaard van rode wijn zijn; zing daarvan bij beurte.", "Jes 38:18": "Want het graf zal U niet loven, de dood zal U niet prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.", "Ef 2:21": "op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere;", "Job 1:8": "En de HEERE zei tegen de satan: Hebt u ook acht geslagen op Mijn knecht Job? Want er is niemand op de aarde zoals hij, een man oprecht en vroom, godvrezend en afwijkend van het kwaad.", "Jes 6:7": "En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Luk 19:12": "Hij zei dan: Een man van hoge afkomst reisde naar een ver land om voor zichzelf een koninkrijk te ontvangen, en dan terug te keren.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Ps 57:11": "Want Uw goedertierenheid is groot tot aan de hemelen, en Uw waarheid tot aan de hoogste wolken.", "Ps 6:10": "De HEERE heeft mijn smeking gehoord; de HEERE zal mijn gebed aannemen.", "Ps 119:59": "Ik heb mijn wegen bedacht, en heb mijn voeten gekeerd tot Uw getuigenissen.", "Ps 7:18": "Ik zal de HEERE loven naar Zijn gerechtigheid, en voor de Naam van de HEERE, de Allerhoogste, psalmzingen.", "Neh 7:2": "En ik gaf bevel aan mijn broer Hanani, en aan Hananja, de leider van de burcht in Jeruzalem, want hij was een man van trouw, en godvrezend boven velen.", "Jes 28:5": "Op die dag zal de HEERE van de heerscharen tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;", "Pred 7:29": "Alleen zie, dit heb ik gevonden, dat God de mens recht gemaakt heeft, maar zij hebben veel uitvindingen gezocht.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Jes 3:14": "De HEERE komt ten gerichte tegen de oudsten van Zijn volk en hun vorsten, want u hebt deze wijngaard verteerd; de roof van de ellendige is in uw huizen.", "Jer 3:14": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen.", "Ps 71:8": "Laat mijn mond vervuld worden met Uw lof, de hele dag met Uw heerlijkheid.", "Job 34:13": "Wie heeft Hem gesteld over de aarde, en wie heeft de hele wereld geschikt?", "Jes 43:1-7": "Maar nu, zo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! Vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, u bent van Mij. Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken. Want Ik ben de HEERE, uw God, de Heilige van Israël, uw Heiland; Ik heb Egypte, Morenland en Seba gegeven tot uw losgeld in uw plaats.", "Deut 9:20": "Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.", "Ps 65:2": "De lofzang is in stilte tot U, o God! in Sion; en U zal de gelofte betaald worden.", "Jer 51:59-64": "Het woord dat de profeet Jeremia opdroeg aan Seraja, de zoon van Nerija, de zoon van Machseja, toen hij met Zedekia, de koning van Juda, naar Babel trok, in het vierde jaar van zijn regering; en Seraja was een vreedzame vorst. Jeremia nu schreef al het kwaad, dat over Babel komen zou, in een boek, namelijk al deze woorden, die tegen Babel geschreven zijn. En Jeremia zei tegen Seraja: Als u in Babel komt, zult u zien en al deze woorden lezen;", "Ps 119:2": "Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;", "Jes 43:15": "Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning.", "Amos 7:3": "Toen kreeg de HEERE berouw hierover; het zal niet gebeuren, zei de HEERE.", "Ps 103:3": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Openb 19:10": "En ik viel neer voor zijn voeten, om hem te aanbidden, en hij zei tegen mij: Zie toe dat u dat niet doet; ik ben uw mededienstknecht, en uw broeder, die de getuigenis van Jezus hebben; aanbid God. Want de getuigenis van Jezus is de geest van de profetie.", "Ps 97:5": "De bergen smelten als was voor het aangezicht van de HEERE, voor het aangezicht van de Heere van de hele aarde.", "Ps 96:1-13": "Zingt de HEERE een nieuw lied; zingt de HEERE, heel de aarde! Zingt de HEERE, looft Zijn Naam; verkondigt Zijn heil van dag tot dag. Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Jer 15:1": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Jer 36:32": "Jeremia dan nam een andere rol, en gaf ze aan de schrijver Baruch, de zoon van Nerija; die schreef daarop, uit de mond van Jeremia, alle woorden van het boek dat Jojakim, de koning van Juda, met vuur verbrand had; en er werden nog veel woorden van dezelfde soort aan toegevoegd.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Ps 97:1-12": "De HEERE regeert, de aarde verheugt zich; laat veel eilanden zich verblijden. Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon. Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "Richt 2:7": "En het volk diende de HEERE al de dagen van Jozua, en al de dagen van de oudsten die lang geleefd hadden na Jozua; die al dat grote werk van de HEERE gezien hadden, dat Hij voor Israël gedaan had.", "2 Sam 24:14": "Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.", "Neh 9:17-20": "En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die U bij hen gedaan had, en hebben hun nek verhard, en in hun weerspannigheid een hoofd aangesteld, om terug te keren tot hun dienstbaarheid. Doch U, een God van vergevingen, genadig en barmhartig, geduldig, en groot van weldadigheid, hebt hen toch niet verlaten. Zelfs, toen zij zich een gegoten kalf gemaakt hadden, en gezegd hadden: Dit is uw God, Die u uit Egypte heeft opgevoerd; en grote lasteringen gedaan hadden; Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.", "Dan 4:8": "Totdat ten laatste Daniël bij mij binnenkwam, wiens naam Beltsazar is, naar de naam van mijn god, in wie ook de geest van de heilige goden is; en ik vertelde de droom aan hem en zei:", "Gen 14:18-20": "En Melchizedek, koning van Salem, bracht brood en wijn; en hij was een priester van de allerhoogste God. En hij zegende hem en zei: Gezegend zij Abram door God, de Allerhoogste, Die hemel en aarde bezit! En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Ex 32:14": "Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.", "Job 36:23": "Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?", "Luk 5:14": "En Hij gebood hem het aan niemand te vertellen, maar: Ga heen, zei Hij, laat uzelf aan de priester zien, en offer voor uw reiniging, zoals Mozes geboden heeft, hun tot een getuigenis.", "Rom 16:27": "Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Jes 42:4": "Hij zal niet verdonkerd worden, en Hij zal niet gebroken worden, totdat Hij het recht op aarde heeft gevestigd; en de eilanden zullen op Zijn leer wachten.", "Hand 4:24": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.", "Ps 50:4": "Hij zal roepen tot de hemel van boven, en tot de aarde, om Zijn volk te oordelen.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "Deut 32:41-43": "Als Ik Mijn glinsterend zwaard scherp, en Mijn hand grijpt naar het gericht, zo zal Ik wraak op Mijn tegenpartijen doen wederkeren, en Mijn haters vergelden. Ik zal Mijn pijlen dronken maken van bloed, en Mijn zwaard zal vlees eten; van het bloed van de verslagene en van de gevangene, vanaf het begin zullen er wraken van de vijand zijn. Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Ps 146:8": "De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Ps 145:9": "Teth. De HEERE is voor allen goed, en Zijn barmhartigheden zijn over al Zijn werken.", "Job 36:1-33": "Elihu ging nog verder, en zei: Wacht op mij nog even, en ik zal u aanwijzen dat er nog redenen voor God zijn. Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Ps 102:17": "Als de HEERE Sion zal opgebouwd hebben, in Zijn heerlijkheid zal verschenen zijn,", "Hebr 4:12": "Want het Woord van God is levend en krachtig, en scherper dan enig tweesnijdend zwaard, en gaat door tot de verdeling van ziel en geest, en van de gewrichten en het merg, en is een beoordelaar van de gedachten en overleggingen van het hart.", "Luk 1:1-4": "Omdat velen ter hand hebben genomen om een verhaal op te stellen van de dingen die onder ons volkomen zeker zijn, zoals zij het ons hebben overgeleverd, die van het begin af aan ogen­getuigen en dienaren van het Woord zijn geweest, heeft ook ik het goed gedacht, nadat ik alles van voren af aan nauwkeurig heb onderzocht, om het achter elkaar aan u te schrijven, voortreffelijke Theofilus,", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "Jer 4:27": "Want zo zegt de HEERE: Dit hele land zal een woestijn zijn (toch zal Ik geen volledig einde maken);", "1 Sam 2:3": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.", "1 Joh 3:21": "Geliefden, als ons hart ons niet veroordeelt, hebben wij vrijmoedigheid tegenover God;", "Ps 135:5": "Want ik weet dat de HEERE groot is, en dat onze Heere boven alle goden is.", "Ps 57:8-10": "Mijn hart is standvastig, o God! mijn hart is standvastig; ik zal zingen en psalmzingen. Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o Heere! ik zal U psalmzingen onder de naties.", "Ps 109:30": "Ik zal de HEERE met mijn mond zeer loven, en te midden van velen zal ik Hem prijzen.", "Ps 110:1-7": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten. De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden. Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Matt 13:24": "Een andere gelijkenis heeft Hij hun voorgehouden en zei: Het Koninkrijk der hemelen is gelijk aan een mens die goed zaad zaaide in zijn akker.", "Ex 19:7": "En Mozes kwam en riep de oudsten van het volk, en legde hun al deze woorden voor, die de HEERE hem geboden had.", "Joz 3:11": "Zie, de ark van het verbond van de Heere van de hele aarde gaat voor u door de Jordaan.", "Ps 89:12": "De hemel is van U, ook is de aarde van U; de wereld en haar volheid, die hebt Gij gegrond.", "Ezra 9:7-14": "Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag. En nu is er, als een klein ogenblik, een genade gebeurd van de HEERE, onze God, om ons een ontkoming over te laten, en ons een nagel te geven in Zijn heilige plaats, om onze ogen te verlichten, o onze God, en om ons een weinig leven te geven in onze dienstbaarheid. Want wij zijn knechten; maar in onze dienstbaarheid heeft onze God ons niet verlaten; maar Hij heeft weldadigheid tot ons geneigd voor het aangezicht van de koningen van Perzië, dat Hij ons een weinig leven zou geven, om het huis van onze God te verhogen, en de woestenijen ervan op te richten, en om ons een muur te geven in Juda en te Jeruzalem.", "Num 16:47": "En Aäron nam het, zoals Mozes gesproken had, en liep midden in de gemeente, en zie, de plaag was al begonnen onder het volk; en hij legde reukwerk daarin, en deed verzoening over het volk.", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "Num 16:15": "Toen ontstak Mozes zeer, en hij zei tegen de HEERE: Zie hun offer niet aan! Ik heb niet één ezel van hen genomen, en niemand van hen kwaad gedaan.", "1 Kor 2:12": "Maar wij hebben niet de geest van de wereld ontvangen, maar de Geest Die uit God is, opdat wij zouden weten de dingen die ons door God geschonken zijn;", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Deut 33:19": "Zij zullen de volken tot de berg roepen; daar zullen zij offeranden van gerechtigheid offeren; want zij zullen de overvloed van de zeeën zuigen, en de bedekte verborgen dingen van het zand.", "2 Kron 19:7": "Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Luk 1:46-55": "En Maria zei: Mijn ziel maakt de Heere groot, en mijn geest verheugt zich in God, mijn Zaligmaker; omdat Hij de nederigheid van Zijn dienstmaagd heeft aangezien; want zie, van nu af aan zullen alle geslachten mij zalig spreken.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Jes 31:5": "Zoals vliegende vogels, zo zal de HEERE van de heerscharen Jeruzalem beschutten, beschuttend zal Hij haar ook verlossen, voorbijgaand zal Hij haar ook uithelpen.", "Hebr 3:2": "Die trouw is aan Hem Die Hem aangesteld heeft, zoals ook Mozes trouw was in heel Zijn huis.", "Ps 102:20-22": "Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben; Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood; Opdat men de Naam van de HEERE vertelt te Sion, en Zijn lof te Jeruzalem;", "Richt 9:57": "Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen.", "Matt 16:18": "En Ik zeg u ook, dat u Petrus bent, en op deze petra zal Ik Mijn gemeente bouwen, en de poorten van de hel zullen haar niet overweldigen.", "Spr 9:10": "De vreze van de HEERE is het beginsel van de wijsheid, en de kennis van de Heilige is verstand.", "Ex 34:27": "Verder zei de HEERE tegen Mozes: Schrijf u deze woorden; want naar de inhoud van deze woorden heb Ik een verbond met u en met Israël gemaakt.", "Ps 119:31": "Ik kleef vast aan Uw getuigenissen; o HEERE! beschaam mij niet.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Joël 3:21": "En Ik zal hun bloed reinigen, dat Ik niet gereinigd had; en de HEERE zal wonen op Sion.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Jes 55:7-9": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig. Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE. Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.", "Ps 22:6": "Tot U hebben zij geroepen, en zijn uitgered; op U hebben zij vertrouwd, en zijn niet beschaamd geworden.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Jes 10:17": "Want het Licht van Israël zal tot een vuur zijn, en zijn Heilige tot een vlam, die in brand zal steken en verteren zal zijn doornen en zijn distels, op één dag.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "1 Petr 1:15": "maar word, zoals Hij Die u geroepen heeft heilig is, ook zelf heilig in heel uw levenswandel;", "Ps 65:4": "Onrechtvaardige dingen hadden de overhand over mij; maar onze overtredingen, die verzoent U.", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "Jer 33:9": "En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.", "Ps 45:7": "Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.", "Ps 136:1-26": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Loof de God der goden; want Zijn goedertierenheid is voor eeuwig. Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Jes 47:4": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël.", "Ps 100:5": "Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.", "Ps 107:15": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "1 Sam 7:9-12": "Toen nam Samuël een melklam, en offerde het geheel aan de HEERE als brandoffer; en Samuël riep tot de HEERE voor Israël; en de HEERE verhoorde hem. En het gebeurde, terwijl Samuël dat brandoffer offerde, dat de Filistijnen naderden ten strijde tegen Israël; en de HEERE donderde die dag met een grote donder over de Filistijnen, en Hij bracht hen in verwarring, zodat zij verslagen werden voor het aangezicht van Israël. En de mannen van Israël trokken uit vanuit Mizpa, en vervolgden de Filistijnen, en zij sloegen hen tot onder Beth-kar.", "Jes 45:21": "Verkondig het en treed hier toe, ja, beraadslaag samen: wie heeft dat van oudsher laten horen? Wie heeft dat van toen af verkondigd? Ben Ik het niet, de HEERE? En er is geen God meer behalve Mij, een rechtvaardig God, en een Heiland, niemand is er dan Ik.", "Hand 7:38": "Dit is degene die in de samenkomst van het volk in de woestijn was, samen met de engel die tot hem sprak op de berg Sinaï, en met onze vaders; die de levende woorden ontving, om ons die te geven,", "Luk 23:43": "En Jezus zei tegen hem: Voorwaar, Ik zeg u: Vandaag zult u met Mij in het Paradijs zijn.", "Luk 1:6": "En zij waren beiden rechtvaardig voor God, en wandelden onberispelijk in alle geboden en voorschriften van de Heere.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Num 9:23": "Naar het bevel van de HEERE legerden zij zich, en naar het bevel van de HEERE trokken zij verder; zij namen de wacht van de HEERE waar, naar het bevel van de HEERE, door de hand van Mozes.", "Jer 31:23": "Zo zegt de HEERE van de heerscharen, de God van Israël: Dit woord zullen zij nog zeggen in het land van Juda, en in zijn steden, wanneer Ik hun gevangenschap ombuigen zal: De HEERE zegent u, woning van de gerechtigheid, berg van de heiligheid!", "Ps 83:19": "opdat zij weten dat U alleen met Uw Naam de HEERE bent, de Allerhoogste over de hele aarde.", "Ex 25:17": "U zult ook een verzoendeksel maken van zuiver goud; twee el en een halve zal de lengte daarvan zijn, en anderhalve el de breedte daarvan.", "Ps 97:12": "Rechtvaardigen, verblijd u in de HEERE, en spreek lof ter gedachtenis van Zijn heiligheid.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Job 35:14": "Dat u ook gezegd hebt: U zult Hem niet aanschouwen; er is toch een oordeel voor Zijn aangezicht, wacht u dan op Hem.", "Zach 1:17": "Roep nog, en zeg: Zo zegt de HEERE van de heerscharen: Mijn steden zullen nog uitgespreid worden vanwege de voorspoed; want de HEERE zal Sion nog troosten, en Hij zal Jeruzalem nog verkiezen.", "Ef 5:29": "Want niemand heeft ooit zijn eigen vlees gehaat, maar hij voedt het, en verzorgt het, zoals ook de Heere de Gemeente.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Jak 5:18": "En hij bad opnieuw, en de hemel gaf regen, en de aarde bracht haar vrucht voort.", "Num 14:18-20": "De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht. Vergeef toch de ongerechtigheid van dit volk, naar de grootte van Uw goedertierenheid, en zoals U dit volk vergeven hebt, van Egypteland af tot hiertoe! En de HEERE zei: Ik heb hun vergeven naar uw woord.", "Ps 135:19": "U, huis van Israël! looft de HEERE; u, huis van Aäron! looft de HEERE.", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Jes 11:3-5": "En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen. Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden. Want gerechtigheid zal de gordel van Zijn lendenen zijn; ook zal de trouw de gordel van Zijn lendenen zijn.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Ps 111:4": "Zain. Hij heeft Zijn wonderen tot een gedachtenis gemaakt; Cheth. de HEERE is genadig en barmhartig.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Jona 2:2": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem.", "Ezech 18:4": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "Ps 135:1-3": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE! U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God! Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "Jes 52:1": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen.", "Matt 18:23-27": "Daarom wordt het Koninkrijk der hemelen vergeleken met een zekere koning die met zijn dienstknechten rekening wilde houden. Toen hij nu begon te rekenen, werd er iemand bij hem gebracht die hem tienduizend talenten schuldig was. En omdat hij niet had waarmee hij kon betalen, beval zijn heer dat men hem zou verkopen, en zijn vrouw en kinderen, en alles wat hij had, en dat de schuld zo betaald zou worden.", "Jak 4:7": "Onderwerp u dan aan God; weerstaat de duivel, en hij zal van u wegvluchten.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Ps 119:44": "Zo zal ik Uw wet voortdurend onderhouden, eeuwig en altijd.", "Lev 26:46": "Dit zijn de inzettingen, en de rechten, en de wetten, die de HEERE gegeven heeft, tussen Zich en de kinderen van Israël, op de berg Sinaï, door de hand van Mozes.", "Jer 18:1-23": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei: Maak u op en ga naar het huis van de pottenbakker, en daar zal Ik u Mijn woorden doen horen. Zo ging ik naar het huis van de pottenbakker; en zie, hij maakte een werk op de schijven.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Ps 11:5": "De HEERE beproeft de rechtvaardige; maar de goddeloze, en wie geweld liefheeft, haat Zijn ziel.", "Ps 51:20": "Doe goed bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.", "Matt 13:23": "Maar die in de goede aarde bezaaid is, dit is degene die het woord hoort en begrijpt, die ook vrucht draagt en voortbrengt, de een honderdvoud, de ander zestigvoud, en de ander dertigvoud.", "Num 14:20-34": "En de HEERE zei: Ik heb hun vergeven naar uw woord. Maar zeker, zo waarachtig als Ik leef, zal de hele aarde met de heerlijkheid van de HEERE vervuld worden! Want al de mannen die Mijn heerlijkheid gezien hebben, en Mijn tekenen, die Ik in Egypte en in de woestijn gedaan heb, en Mij nu tien keer beproefd hebben, en niet gehoorzaam zijn geweest aan Mijn stem;", "Kol 1:24": "die mij nu verblijd in mijn lijden voor u, en aanvult in mijn vlees wat nog ontbreekt aan de verdrukkingen van Christus, voor Zijn lichaam, dat is de Gemeente;", "Jona 4:11": "En zou Ik dan die grote stad Ninevé niet ontzien? Daarin wonen meer dan honderdtwintigduizend mensen, die geen onderscheid weten te maken tussen hun rechterhand en hun linkerhand; en bovendien nog veel vee?", "Ps 22:29": "Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen.", "Jak 1:13": "Niemand moet, als hij verzocht wordt, zeggen: Ik word door God verzocht; want God kan niet verzocht worden met het kwade, en Hij Zelf verzoekt niemand.", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u gesteld, zodat u zou heengaan en vrucht dragen, en dat uw vrucht blijft; zodat, wat u ook van de Vader zal vragen in Mijn Naam, Hij u dat geeft.", "Ps 119:55": "HEERE! 's nachts ben ik Uw Naam indachtig geweest, en heb Uw wet bewaard.", "Ex 24:6-8": "En Mozes nam de helft van het bloed, en zette het in bekkens; en de helft van het bloed sprengde hij op het altaar. En hij nam het boek van het verbond, en hij las het voor de oren van het volk; en zij zeiden: Al wat de HEERE gesproken heeft, zullen wij doen en gehoorzamen. Toen nam Mozes dat bloed, en sprengde het op het volk; en hij zei: Zie, dit is het bloed van het verbond, dat de HEERE met u gemaakt heeft over al die woorden.", "Nahum 1:15": "Zie op de bergen de voeten van hem die het goede nieuws brengt, die vrede laat horen; vier uw feestdagen, o Juda! Betaal uw geloften; want de man van Belial zal voortaan niet meer door u heen gaan, hij is helemaal uitgeroeid.", "Pred 12:11": "De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.", "Ps 148:1-14": "Halleluja! Looft de HEERE uit de hemelen; looft Hem in de hoogste plaatsen! Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen! Looft Hem, zon en maan! Looft Hem, alle lichtende sterren!", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Matt 6:10": "Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Ef 5:23-27": "want de man is het hoofd van de vrouw, zoals ook Christus het Hoofd van de Gemeente is; en Hij is de Behouder van het lichaam. Daarom, zoals de Gemeente aan Christus onderdanig is, zo ook de vrouwen aan hun eigen mannen in alles. Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,", "Fil 4:20": "Onze God en Vader nu zij de heerlijkheid tot in alle eeuwigheid. Amen.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Ps 22:5": "Op U hebben onze vaders vertrouwd; zij hebben vertrouwd, en U hebt hen uitgeholpen.", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Ps 89:36": "Ik heb eens gezworen bij Mijn heiligheid: Zeker zal Ik aan David niet liegen!", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Jes 65:8": "Zo zegt de HEERE: Zoals wanneer men most in een tros druiven vindt, men zegt: Verderf ze niet, want er is een zegen in; zo zal Ik het om Mijn knechten doen, dat Ik hen niet allen verderf.", "Ezech 18:30": "Daarom zal Ik u richten, o huis van Israël, ieder naar zijn wegen, spreekt de Heere HEERE. Keer terug, en bekeer u van al uw overtredingen, zo zal de ongerechtigheid u niet tot een struikelblok worden.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Jes 4:2-6": "Op die dag zal de SPRUIT van de HEERE tot sieraad en heerlijkheid zijn, en de vrucht van de aarde tot voortreffelijkheid en tot versiering voor hen die ontkomen zullen in Israël. En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem; wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Openb 11:4": "Dezen zijn de twee olijfbomen en de twee kandelaars, die voor de God van de aarde staan.", "Openb 16:5-7": "En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt; Omdat zij het bloed van de heiligen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard. En ik hoorde een ander vanaf het altaar zeggen: Ja, Heere, U almachtige God! Uw oordelen zijn waarachtig en rechtvaardig.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Ps 48:2-4": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid. Schoon van ligging, een vreugde van de hele aarde is de berg Sion, aan de zijden van het noorden; de stad van de grote Koning. God is in haar paleizen; Hij is er bekend voor een Hoog Vertrek.", "Ps 69:17": "Verhoor mij, o HEERE, want Uw goedertierenheid is goed; zie mij aan naar de grootheid van Uw barmhartigheden.", "Jes 49:14-17": "Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten. Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.", "Ps 116:17-19": "Ik zal U een offer van dankzegging offeren, en de Naam van de HEERE aanroepen. Ik zal mijn gelofte de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk, in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "Gen 18:21": "Zal Ik nu afgaan en zien of zij naar hun geroep, dat tot Mij gekomen is, het uiterste gedaan hebben, en zo niet, Ik zal het weten.", "Gen 18:26-32": "Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen. En Abraham antwoordde en zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere, hoewel ik stof en as ben! Misschien zullen aan de vijftig rechtvaardigen vijf ontbreken; zult U dan om vijf de hele stad verwoesten? En Hij zei: Ik zal haar niet verwoesten, als Ik er vijfenveertig zal vinden.", "Joz 24:19": "Toen zei Jozua tegen het volk: U zult de HEERE niet kunnen dienen, want Hij is een heilig God; Hij is een na-ijverig God; Hij zal uw overtredingen en uw zonden niet vergeven.", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Matt 6:14": "Want als u de mensen hun misdaden vergeeft, zal uw hemelse Vader ook u vergeven.", "Jes 12:1-6": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij. Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden. En u zult water scheppen met vreugde uit de fonteinen van het heil;", "Neh 9:33": "Doch U bent rechtvaardig, in alles wat ons overkomen is; want U hebt trouw gehandeld, maar wij hebben goddeloos gehandeld.", "Luk 12:37": "Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "Luk 8:21": "Maar Hij antwoordde en zei tegen hen: Mijn moeder en Mijn broers zijn zij die Gods Woord horen en het doen.", "Ps 50:23": "Wie dank offert, die zal Mij eren; en wie zijn weg goed inricht, die zal Ik Gods heil doen zien.", "Ps 102:15": "Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis.", "Job 21:22": "Zal men God wetenschap leren, terwijl Hij hen die hoog zijn richt?", "Ps 47:9": "God regeert over de heidenen; God zit op de troon van Zijn heiligheid.", "Ps 34:2-4": "Aleph. Ik zal de HEERE loven te allen tijde; Zijn lof zal voortdurend in mijn mond zijn. Beth. Mijn ziel zal zich beroemen in de HEERE; de zachtmoedigen zullen het horen en zich verblijden. Gimel. Maakt de HEERE met mij groot, en laten wij Zijn Naam samen verhogen.", "Ps 45:12": "Zo zal de Koning verlangen naar uw schoonheid; omdat Hij uw Heere is, buig u voor Hem neer.", "Deut 16:6-8": "Maar in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen, daar zult u het pascha slachten, aan de avond, als de zon ondergaat, op de vastgestelde tijd van uw uittrekken uit Egypte. Dan zult u het koken en eten in de plaats die de HEERE, uw God, zal uitkiezen; daarna zult u zich 's morgens omkeren en teruggaan naar uw tenten. Zes dagen zult u ongezuurde broden eten, en op de zevende dag is het een dag van het verbod voor de HEERE, uw God; dan zult u geen werk doen.", "Ex 40:16": "Mozes nu deed het naar alles wat de HEERE hem geboden had; zo deed hij het.", "Ps 104:34": "Mijn overdenking van Hem zal zoet zijn; ik zal mij in de HEERE verblijden.", "Num 11:33": "Dat vlees was nog tussen hun tanden, voordat het gekauwd was, toen ontstak de toorn van de HEERE tegen het volk, en de HEERE sloeg het volk met een zeer grote plaag.", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "Ps 119:62": "Te middernacht sta ik op, om U te loven voor de rechten van Uw gerechtigheid.", "Ps 105:1-5": "Looft de HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken. Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen. Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "1 Joh 3:22": "en wat wij ook bidden, ontvangen wij van Hem, omdat wij Zijn geboden bewaren en doen wat welgevallig is voor Hem.", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "Ps 115:3": "Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "Gen 6:9": "Dit zijn de afstammelingen van Noach. Noach was een rechtvaardig, oprecht man onder zijn tijdgenoten. Noach wandelde met God.", "Ps 85:3": "De misdaad van Uw volk hebt U weggenomen; U hebt al hun zonden bedekt. Sela.", "Job 4:17-19": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker? Zie, op Zijn knechten zou Hij niet vertrouwen; ook Zijn engelen heeft Hij van dwaasheid beschuldigd. Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot.", "Ps 113:2": "De Naam van de HEERE zij geprezen, van nu af tot in eeuwigheid.", "Ps 3:5": "Ik riep met mijn stem tot de HEERE, en Hij verhoorde mij van Zijn heilige berg. Sela.", "Jer 5:22": "Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Ezech 11:25": "En ik sprak tot de weggevoerde gevangenen al de woorden van de HEERE, die Hij mij had laten zien.", "Hebr 10:25": "en laten wij onze onderlinge bijeenkomst niet nalaten, zoals sommigen dat gewend zijn, maar elkaar vermanen; en dat des te meer, naarmate u ziet dat de dag nadert.", "Ps 84:5": "Gelukkig zijn zij, die in Uw huis wonen; zij prijzen U gestadig. Sela.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Job 11:6": "En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "1 Kor 12:28": "En God heeft sommigen in de Gemeente gesteld: ten eerste apostelen, ten tweede profeten, ten derde leraars, daarna krachten, daarna gaven van gezondmaking, hulpverleningen, bestuur, allerlei talen.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "Ps 50:10-12": "Want al het gedierte van het woud is Mijn, de dieren op duizend bergen. Ik ken al het gevogelte van de bergen, en het wild van het veld is bij Mij. Zo Mij hongerde, Ik zou het u niet zeggen; want Mijn is de wereld en haar volheid.", "Joël 2:15-17": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "Ps 116:1": "Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen;", "Num 16:22": "Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?", "Hand 2:46": "En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "Ps 149:1-9": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning. Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "Ps 106:44": "Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde.", "Ps 118:19-29": "Doe mij de poorten van de gerechtigheid open, ik zal daardoor ingaan, ik zal de HEERE loven. Dit is de poort van de HEERE, waardoor de rechtvaardigen zullen ingaan. Ik zal U loven, omdat U mij verhoord hebt, en mij tot heil geweest bent.", "Ps 134:1-3": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat! Hef uw handen op naar het heiligdom, en loof de HEERE. De HEERE zegent u uit Sion, Hij, Die de hemel en de aarde gemaakt heeft.", "Hos 12:5": "Ja, hij gedroeg zich vorstelijk tegen de Engel, en kreeg de overhand op Hem; hij weende en smeekte Hem. Te Bethel vond hij Hem, en daar sprak Hij met ons;", "Ps 98:9": "Voor het aangezicht van de HEERE, want Hij komt om de aarde te oordelen; Hij zal de wereld oordelen in gerechtigheid, en de volken in alle rechtmatigheid.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Ps 74:2": "Denk aan Uw vergadering, die U vanouds verworven hebt; de roede van Uw erfenis, die U verlost hebt; de berg Sion, waar U gewoond hebt.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Klaagl 3:37": "Mem. Wie zegt iets, en het gebeurt, als de Heere het niet beveelt?", "Ps 119:164": "Ik loof U zevenmaal per dag, over de rechten van Uw gerechtigheid.", "Deut 10:21": "Hij is uw lof, en Hij is uw God. Die bij u deze grote en ontzagwekkende dingen gedaan heeft, die uw ogen gezien hebben.", "Luk 6:36": "Wees dan barmhartig, zoals ook uw Vader barmhartig (function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}
