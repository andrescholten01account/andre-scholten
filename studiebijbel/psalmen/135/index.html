en gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE;", "Ps 74:12": "Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.", "Job 33:13": "Waarom hebt u tegen Hem getwist? Want Hij antwoordt niet van al Zijn daden.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Jer 31:4": "Ik zal u weer bouwen, en u zult gebouwd worden, o jonkvrouw Israël! U zult weer versierd zijn met uw tamboerijnen, en uitgaan met de rei van de spelende mensen.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Jes 30:30": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.", "Jes 17:13": "De naties zullen wel ruisen, zoals grote wateren ruisen; maar Hij zal het bestraffen, zo zal het ver wegvluchten, ja, het zal opgejaagd worden als het kaf van de bergen voor de wind, en als een bal voor de wervelwind.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Jer 31:3": "De HEERE is mij verschenen van lang geleden! Ja, Ik heb u liefgehad met een eeuwige liefde; daarom heb Ik u getrokken met goedertierenheid.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Neh 1:10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Ps 147:18": "Hij zendt Zijn woord, en doet ze smelten; Hij laat Zijn wind waaien, de wateren stromen weg.", "1 Kron 17:7": "Nu dan, zo zult u zeggen tegen Mijn knecht, tegen David: Zo zegt de HEERE van de heerscharen: Ik heb u van de schaapskooi genomen, van achter de schapen vandaan, opdat u een voorganger over Mijn volk Israël zou zijn;", "Job 23:2-6": "Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten. Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.", "1 Kron 25:8": "En zij wierpen de loten over de dienst, tegen elkaar, zowel de kleinen als de groten, de meester met de leerling.", "Ps 18:4": "Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Jer 13:11": "Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Neh 9:10": "En U hebt tekenen en wonderen gedaan aan Farao, en aan al zijn knechten, en aan al het volk van zijn land; want U wist, dat zij trots tegen hen handelden; en U hebt U een Naam gemaakt, zoals het is op deze dag.", "Jes 44:27": "Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik doen verdrogen.", "Ps 89:19": "Want ons schild is van de HEERE, en onze koning is van de Heilige van Israël.", "Ps 81:2": "Zingt vrolijk voor God, onze Sterkte; juicht voor de God van Jakob.", "Job 38:24-28": "Waar is de weg, daar het licht verdeeld wordt, en de oostenwind zich verstrooit op de aarde? Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen? Om te regenen op het land, waar niemand is, op de woestijn, waarin geen mens is;", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "Ps 68:10": "U hebt zeer milde regen doen druipen, o God! En U hebt Uw erfenis gesterkt, toen zij moe geworden was.", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Matt 5:5": "Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Ps 111:3": "He. Zijn doen is majesteit en heerlijkheid; Vau. en Zijn gerechtigheid bestaat in eeuwigheid.", "Ps 97:9": "Want U, HEERE, bent de Allerhoogste over de hele aarde; U bent zeer hoog verheven boven alle goden.", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Ps 136:22": "Als erfbezit aan Zijn dienaar Israël; want Zijn goedertierenheid is voor eeuwig.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Dan 4:34": "Aan het einde van deze dagen nu, hief ik, Nebukadnezar, mijn ogen op naar de hemel, want mijn verstand kwam weer in mij; en ik loofde de Allerhoogste, en ik prees en verheerlijkte de Eeuwiglevende, omdat Zijn heerschappij een eeuwige heerschappij is, en Zijn Koninkrijk is van geslacht tot geslacht;", "Matt 26:30": "En toen zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.", "Ps 147:5": "Onze Heere is groot en heeft veel kracht; van Zijn verstand is geen aantal te noemen.", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "Micha 4:13": "Maak u op en dors, dochter van Sion! Want Ik zal uw hoorn ijzer maken, en uw hoeven koper maken, en u zult veel volken verpletteren; en Ik zal hun winst aan de HEERE toewijden, en hun bezit aan de Heere van de hele aarde.", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Ps 73:1": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Ps 99:1": "De HEERE regeert, dat de volken beven; Hij zit tussen de cherubs; de aarde beeft.", "Jes 37:16": "O HEERE van de heerscharen¹, God van Israël, Die tussen de cherubs² woont! U Zelf, U alleen bent de God van alle koninkrijken van de aarde; U hebt de hemel en de aarde gemaakt!", "Ps 56:13": "O God! Op mij zijn Uw geloften; ik zal U dankzeggingen vergelden;", "Jes 43:9": "Laat alle heidenvolken samen vergaderd worden, en laat de volken verzameld worden; wie onder hen zal dit verkondigen? Of laat hen ons de vorige dingen doen horen, laat hen hun getuigen voortbrengen, opdat zij gerechtvaardigd worden, en men het hoort en zegt: Het is de waarheid.", "1 Sam 15:29": "En ook liegt Hij niet, Die de Overwinning van Israël is, en het berouwt Hem niet; want Hij is geen mens, dat Hem iets berouwen zou.", "Spr 28:10": "Wie de oprechten doet dwalen op een kwade weg, zal zelf in zijn eigen kuil vallen; maar de vromen zullen het goede beërven.", "Gen 2:5": "En elke struik van het veld, voordat hij op de aarde was, en al het kruid van het veld, voordat het opkwam; want de HEERE God had het niet laten regenen op de aarde, en er was geen mens geweest, om de aardbodem te bewerken.", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "Job 9:2-35": "Waarlijk, ik weet dat het zo is; want hoe zou de mens rechtvaardig zijn bij God? Als Hij lust heeft om met hem te twisten, zal hij Hem niet één op de duizend beantwoorden. Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Ps 104:10-19": "Die de bronnen laat stromen door de dalen, zodat zij tussen de bergen door lopen. Zij drenken al het gedierte van het veld; de wilde ezels lessen er hun dorst mee. Daarbij woont het gevogelte van de hemel, een geluid latend horen van tussen de takken.", "Job 37:13": "Hetzij dat Hij die tot een roede, of tot Zijn land, of tot weldadigheid beschikt.", "Gal 4:8": "Maar toen u God niet kende, diende u hen die van nature geen goden zijn;", "Gen 19:16": "Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad neer.", "Jes 44:22": "Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer terug tot Mij, want Ik heb u verlost.", "Jer 30:22": "En u zult Mij tot een volk zijn, en Ik zal u tot een God zijn.", "Ps 78:51": "En Hij sloeg al het eerstgeborene in Egypte, het begin van de krachten in de tenten van Cham.", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Ps 31:22": "Geloofd zij de HEERE, want Hij heeft Zijn goedertierenheid aan mij wonderlijk gemaakt, mij voerende als in een vaste stad.", "Matt 28:3": "Zijn gedaante was als een bliksem, en zijn kleding wit als sneeuw.", "1 Kron 15:24": "En Sebanja, en Josafat, en Nethaneel, en Amasai, en Zecharja, en Benaja, en Eliëzer, de priesters, bliezen op trompetten voor de ark van God; en Obed-edom en Jehia waren poortwachters van de ark.", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "Gen 22:14": "En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Ps 136:5-25": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig. Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "Joz 4:24": "Opdat alle volken van de aarde de hand van de HEERE zouden kennen, dat die sterk is; opdat u de HEERE, uw God, vreest, alle dagen.", "1 Kon 1:40": "En al het volk kwam achter hem aan omhoog, en het volk speelde op fluiten, en verblijdde zich met grote blijdschap, zodat de aarde van hun geluid barstte.", "Ps 78:48": "Ook gaf Hij hun vee over aan de hagel, en hun beesten aan de vurige kolen.", "Mark 13:20": "En als de Heere de dagen niet verkort had, zou geen vlees behouden worden; maar omwille van de uitverkorenen, die Hij uitverkoren heeft, heeft Hij de dagen verkort.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Lev 26:40-45": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "2 Kron 20:22": "Toen zij nu begonnen met vreugdegeroep en lofzang, stelde de HEERE hinderlagen tegen de kinderen van Ammon, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden verslagen.", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Job 34:19": "Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "Ef 1:9-11": "Ons bekendgemaakt hebbend het geheimenis van Zijn wil, naar Zijn welbehagen, dat Hij voorgenomen had in Zichzelf. Om in de bedeling van de volheid der tijden alles weer tot één te vergaderen in Christus, zowel wat in de hemel is, als wat op de aarde is; In Hem, in Wie wij ook een erfdeel geworden zijn, wij, die van tevoren voorbestemd waren naar het voornemen van Hem die alle dingen werkt naar de raad van Zijn wil;", "Jes 62:4": "Tegen u zal niet meer gezegd worden: Wie verlaten is; en tegen uw land zal niet meer gezegd worden: Het verwoeste; maar u zult genoemd worden: Mijn lust is aan haar! en uw land: Het getrouwde; want de HEERE heeft een lust aan u, en uw land zal getrouwd worden.", "Ps 78:43-50": "Hoe Hij Zijn tekenen stelde in Egypte, en Zijn wonderen in het veld van Zoan; En hun stromen in bloed veranderde, en hun waterlopen, zodat zij niet konden drinken. Hij zond een vermenging van ongedierte onder hen, dat hen verteerde, en vorsen, die hen verdierven.", "Deut 28:10": "En alle volken van de aarde zullen zien dat de Naam van de HEERE over u uitgeroepen is, en zij zullen voor u vrezen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Joh 16:27": "Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Jes 44:9-20": "De formeerders van gesneden beelden zijn allemaal samen ijdelheid, en hun gewenste dingen doen geen nut; ja, zijzelf zijn hun getuigen; zij zien niet, en zij weten niet, daarom zullen zij beschaamd worden. Wie formeert een god, of giet een beeld, dat geen nut doet? Zie, al zijn medegenoten zullen beschaamd worden, want de werkmeesters zijn uit de mensen; laat ze zich allemaal verzamelen, laat ze opstaan, zij zullen schrikken, zij zullen samen beschaamd worden.", "Gen 14:22": "Doch Abram zei tegen de koning van Sodom: Ik heb mijn hand opgeheven tot de HEERE, de allerhoogste God, Die hemel en aarde bezit;", "Deut 7:13-24": "en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten; en de HEERE zal alle ziekte van u afweren, en Hij zal u geen van de kwade ziekten van de Egyptenaren, die u kent, opleggen, maar zal ze leggen op allen die u haten.", "Pred 3:15": "Wat geweest is, dat is nu, en wat wezen zal, dat is al geweest; en God zoekt het weggedrevene op.", "Pred 3:13": "Ja ook, dat ieder mens eet en drinkt, en het goede geniet van al zijn arbeid, dit is een gave van God.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "Ps 74:15": "U hebt een bron en beek gekliefd; U hebt sterke rivieren uitgedroogd.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Lev 22:33": "Die u uit het land Egypte heb uitgevoerd, opdat Ik u tot een God zou zijn; Ik ben de HEERE!", "Gen 12:7": "Toen verscheen de HEERE aan Abram, en zei: Aan uw nageslacht zal Ik dit land geven. Toen bouwde hij daar een altaar voor de HEERE, Die hem verschenen was.", "Jes 25:4": "Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed tegen een wand.", "Zach 1:14": "En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.", "Jes 40:12-26": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal? Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen? Met wie heeft Hij raad gehouden, die Hem verstand zou geven, en Hem zou leren van het pad van het recht, en Hem wetenschap zou leren, en Hem bekend zou maken de weg van het veelvoudige verstand?", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Dan 3:7": "Daarom, op dat moment, toen al die volken het geluid hoorden van de hoorn, de pijp, de citer, de vedel, de psalters, en allerlei soorten muziek, vielen alle volken, naties en tongen neer en aanbaden het gouden beeld, dat de koning Nebukadnezar had opgericht.", "2 Kron 28:23": "Want hij offerde aan de goden van Damascus, die hem geslagen hadden, en zei: Omdat de goden van de koningen van Syrië hen helpen, zal ik hun offeren, opdat zij mij ook helpen; maar zij waren hem tot zijn val, alsook aan heel Israël.", "Job 25:2": "Heerschappij en ontzag zijn bij Hem, Hij maakt vrede in Zijn hoogten.", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "Job 37:10": "Door Zijn geblaas geeft God de vorst, zodat het brede water verstijft.", "Klaagl 3:31-33": "Caph. Want de Heere zal niet verstoten in eeuwigheid. Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid. Caph. Want Hij plaagt of bedroeft de kinderen van de mensen niet van harte.", "1 Kor 16:2": "Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.", "Ps 115:5": "zij hebben een mond, maar spreken niet; zij hebben ogen, maar zien niet;", "Ps 105:17-22": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf. Men drukte zijn voeten in de stok; zijn persoon kwam in de ijzers. Tot de tijd toe dat Zijn woord kwam, heeft de rede van de HEERE hem doorlouterd.", "Rom 3:4-6": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt. Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.) Dat zij verre, anders hoe zal God de wereld oordelen?", "Rom 8:32": "Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken?", "Amos 4:7-12": "Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Ik heb u geslagen met brandkoren en met honingdauw; de veelheid van uw hoven, en uw wijngaarden, en uw vijgenbomen, en uw olijfbomen at de rups op; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Gen 21:33": "En hij plantte een bos in Berseba, en riep daar de Naam van de HEERE, de eeuwige God, aan.", "Deut 13:18": "wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, om al Zijn geboden te houden, die ik u heden gebied, om te doen wat recht is in de ogen van de HEERE, uw God.", "Dan 10:6": "En Zijn lichaam was als een turkoois, en Zijn gezicht als het uiterlijk van de bliksem, en Zijn ogen als vurige fakkels, en Zijn armen en Zijn voeten als de glans van gepolijst koper; en de stem van Zijn woorden was als de stem van een menigte.", "2 Kron 35:25": "En Jeremia maakte een klaaglied over Josia; evenzo spraken alle zangers en zangeressen in hun klaagliederen van Josia, tot op deze dag; want zij gaven ze tot een inzetting in Israël; en zie, zij zijn geschreven in de klaagliederen.", "Luk 4:25-27": "Maar Ik zeg u naar waarheid: Er waren veel weduwen in Israël in de dagen van Elia, toen de hemel drie jaar en zes maanden gesloten was, zodat er grote hongersnood kwam over het hele land. En tot geen van hen werd Elia gezonden, behalve naar Sarepta bij Sidon, naar een vrouw die weduwe was. En er waren veel melaatsen in Israël, in de tijd van de profeet Elisa; en geen van hen werd gereinigd, behalve Naäman, de Syriër.", "Dan 9:14": "Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken die Hij gedaan heeft, omdat wij Zijn stem niet gehoorzaamden.", "Rom 1:22": "terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "2 Kron 31:2": "En Hizkia stelde de verdelingen van de priesters en de Levieten in, naar hun verdelingen, ieder naar zijn dienst, de priesters en de Levieten voor het brandoffer en voor de dankoffers, om te dienen, en om te loven, en om te prijzen in de poort van de legerplaatsen van de HEERE;", "Hos 12:6": "Namelijk, de Heere, de God van de heerscharen; Heere is Zijn gedenknaam.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Job 5:6-11": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde; Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen. Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Joz 9:10": "En alles wat Hij gedaan heeft aan de twee koningen van de Amorieten die aan de overkant van de Jordaan waren, Sihon, de koning van Hesbon, en Og, de koning van Bazan, die te Astharoth woonde.", "2 Kron 25:8": "Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen.", "Job 12:23": "Hij vermenigvuldigt de volken, en verdelgt ze; Hij breidt de volken uit, en leidt ze.", "Jak 5:15": "En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Ps 116:5": "De HEERE is genadig en rechtvaardig, en onze God ontfermt Zich.", "Ps 99:5": "Verhef de HEERE, onze God, en buig u neer voor de voetbank van Zijn voeten; Hij is heilig!", "Job 28:25": "Toen Hij de wind het gewicht gaf, en de wateren afwoog in mate;", "Hab 3:9-11": "De naakte grond werd ontbloot door Uw boog, om de eden, aan de stammen gedaan door het woord. Sela. U hebt de rivieren van de aarde gekloofd. De bergen zagen U, en leden smart; de waterstroom ging erdoorheen, de afgrond gaf zijn stem, hij hief zijn handen op in de hoogte. De zon en de maan stonden stil in hun woning; met het licht gingen Uw pijlen daarheen, met glans Uw bliksemende speer.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "Ps 66:8": "Looft, volken, onze God; en laat de stem van Zijn roem horen.", "Ps 108:5": "Want Uw goedertierenheid is groot tot boven de hemelen, en Uw waarheid tot aan de bovenste wolken.", "Spr 25:20": "Wie liederen zingt bij een treurig hart, is als iemand die een kleed aflegt op de dag van de koude, en als azijn op salpeter.", "Jes 64:3": "Toen U vreselijke dingen deed, die wij niet verwachtten; U kwam neer, van Uw aangezicht smolten de bergen weg.", "Ps 128:2-6": "Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel. Zie, zo zal die man zeker gezegend worden, die de HEERE vreest.", "Jes 49:13-17": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen. Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Ps 78:65": "Toen ontwaakte de Heere, als iemand die slaapt, als een held, die juicht van de wijn.", "Ex 15:6-8": "O HEERE! Uw rechterhand is verheerlijkt in macht; Uw rechterhand, o HEERE, heeft de vijand verbroken! En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel. En door het geblaas van Uw neus zijn de wateren opgehoopt; de stromen hebben overeind gestaan als een hoop; de afgronden zijn stijf geworden in het hart van de zee.", "Ps 101:1": "Een psalm van David. Ik zal van goedertierenheid en recht zingen; U zal ik psalmzingen, o HEERE!", "Hos 2:21": "En de aarde zal het koren verhoren, alsook de nieuwe wijn en de olie; en die zullen Jizreël verhoren.", "Gen 9:1-3": "En God zegende Noach en zijn zonen, en Hij zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde! En vrees en angst voor u zal er zijn over al het gedierte van de aarde, en over al het gevogelte van de hemel; over alles wat zich op de aardbodem beweegt, en over alle vissen van de zee; zij zijn in uw hand overgegeven. Alles wat zich beweegt, dat leeft, zal u tot voedsel zijn; Ik heb het u allemaal gegeven, zoals het groene kruid.", "Openb 4:8-10": "En de vier dieren hadden ieder voor zichzelf zes vleugels rondom, en waren van binnen vol ogen; en zij hebben geen rust, dag en nacht, en zeggen: Heilig, heilig, heilig is de Heere God, de Almachtige, Die was, en Die is, en Die komen zal. En wanneer de dieren heerlijkheid, en eer, en dankzegging gaven aan Hem Die op de troon zat, Die leeft tot in alle eeuwigheid, dan vielen de vierentwintig oudsten neer voor Hem Die op de troon zat, en aanbaden Hem Die leeft tot in alle eeuwigheid, en wierpen hun kronen voor de troon, en zeiden:", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Rom 2:5-16": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God. Die ieder zal vergelden naar zijn werken: Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Joh 17:26": "En Ik heb hun Uw Naam bekendgemaakt, en zal Hem bekendmaken; opdat de liefde waarmee U Mij liefgehad hebt, in hen is, en Ik in hen.", "Zach 9:14": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.", "Ps 89:6": "Daarom loven de hemelen Uw wonderen, o HEERE! ook is Uw getrouwheid in de gemeente van de heiligen.", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Hand 7:49": "De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?", "Ps 78:52-55": "En Hij voerde Zijn volk als schapen, en leidde hen, als een kudde, door de woestijn. Ja, Hij leidde hen zeker, zodat zij niet vreesden; want de zee had hun vijanden overdekt. En Hij bracht hen tot het gebied van Zijn heiligheid, tot deze berg, die Zijn rechterhand verkregen heeft.", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Zef 3:5": "De rechtvaardige HEERE is in haar midden, Hij doet geen onrecht; elke morgen geeft Hij Zijn recht in het licht, het ontbreekt niet; maar de verkeerde weet van geen schaamte.", "Jes 14:24": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan!", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "1 Kron 16:34": "Looft de HEERE, want Hij is goed, want Zijn goedertierenheid is tot in eeuwigheid.", "Jes 3:13": "De HEERE stelt Zich op om te pleiten, en Hij staat om de volken te richten.", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen hen die het loon van de dagloner met geweld inhouden, die de weduwe, en de wees, en de vreemdeling het recht verdraaien, en Mij niet vrezen, zegt de HEERE van de heerscharen.", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "Ex 32:34": "Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken!", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "Joz 2:11": "Toen wij dat hoorden, versmolt ons hart, en er bleef geen moed meer over in iemand, vanwege uw aanwezigheid; want de HEERE, uw God, is een God boven in de hemel, en beneden op de aarde.", "2 Kron 6:33": "Hoor U dan uit de hemel, uit de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken der aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Ps 136:10": "Hem, Die de Egyptenaren geslagen heeft in hun eerstgeborenen; want Zijn goedertierenheid is voor eeuwig.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Job 12:16": "Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "Job 11:10": "Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?", "Ps 104:31": "De heerlijkheid van de HEERE zij tot in eeuwigheid; de HEERE verblijde Zich in Zijn werken.", "2 Kron 25:15": "Toen ontstak de toorn van de HEERE tegen Amazia; en Hij zond tot hem een profeet, die tegen hem zei: Waarom hebt u de goden van dat volk gezocht, die hun eigen volk niet gered hebben uit uw hand?", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "1 Sam 24:13": "De HEERE zal rechtspreken tussen mij en tussen u, en de HEERE zal mij op u wreken; maar mijn hand zal niet tegen u zijn.", "Ex 12:29": "En het gebeurde te middernacht, dat de HEERE alle eerstgeborenen in Egypteland sloeg, van de eerstgeborene van Farao af, die op zijn troon zou zitten, tot de eerstgeborene van de gevangene, die in de gevangenis was, en alle eerstgeborenen van het vee.", "Hand 2:23": "Deze, door de bepaalde raad en voorkennis van God overgegeven, hebt u genomen en door de handen van onrechtvaardigen aan het kruis gehecht en gedood;", "Pred 9:1": "Zeker, dit alles heb ik in mijn hart overwogen, opdat ik dit alles klaar mocht verstaan: dat de rechtvaardigen en de wijzen en hun werken in de hand van God zijn; ook liefde, ook haat, weet de mens niet uit al wat voor zijn aangezicht is.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Ps 127:1-5": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs. Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap. Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Ps 65:8": "Die het bruisen van de zeeën stilt, het bruisen van haar golven, en het rumoer van de volken.", "Gen 2:6": "Maar een damp steeg op uit de aarde, en bevochtigde de hele aardbodem.", "Ps 81:14": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld!", "Ex 15:26": "en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "Jer 50:20": "In die dagen en op die tijd, spreekt de HEERE, zal de ongerechtigheid van Israël gezocht worden, maar zij zal er niet zijn, en de zonden van Juda, maar zullen niet gevonden worden; want Ik zal het vergeven aan hen die Ik zal doen overblijven.", "Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "Spr 11:10": "Een stad springt op van vreugde over het welvaren van de rechtvaardigen; en als de goddelozen vergaan, is er gejuich.", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Ezech 33:7-19": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Amos 8:7": "De HEERE heeft gezworen bij de heerlijkheid van Jakob: Zeker zal Ik al hun werken voor altijd niet vergeten!", "Deut 8:1-10": "Alle geboden die ik u vandaag gebied, moet u nauwkeurig opvolgen, opdat u leeft en meer wordt, en het land binnengaat en erft, dat de HEERE aan uw vaderen gezworen heeft. En u zult denken aan heel de weg, die de HEERE, uw God, u deze veertig jaar in de woestijn geleid heeft; opdat Hij u verootmoedigt, om u te beproeven, om te weten wat in uw hart was, of u Zijn geboden zou houden, of niet. En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Hebr 10:31": "Vreselijk is het te vallen in de handen van de levende God.", "Ezra 3:11": "En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE.", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "Spr 15:6": "In het huis van de rechtvaardige is een grote schat; maar in de inkomst van de goddeloze is opschudding.", "Deut 33:3": "Zeker bemint Hij de volken! Al Zijn heiligen zijn in Uw hand; zij zullen in het midden tussen Uw voeten gezet worden; ieder zal ontvangen van Uw woorden.", "Ps 115:8": "Laat wie hen maken, hun gelijk worden, en ieder die op hen vertrouwt.", "Matt 10:29": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader.", "Job 38:37": "Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?", "Ex 7:1": "Toen zei de HEERE tegen Mozes: Zie, Ik heb u tot een God gezet over Farao; en Aäron, uw broer, zal uw profeet zijn.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Ps 119:64": "HEERE! de aarde is vol van Uw goedertierenheid; leer mij Uw inzettingen.", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "Lev 11:45": "Want Ik ben de HEERE, Die u uit het land Egypte doet optrekken, opdat Ik u tot een God zij, en opdat u heilig bent, omdat Ik heilig ben.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Ps 139:17": "Daarom, hoe kostbaar zijn mij, o God, Uw gedachten! Hoe machtig veel zijn hun sommen!", "Ps 113:6-9": "Die zeer laag ziet, in de hemel en op de aarde. Die de arme uit het stof opricht, en de behoeftige uit de vuilnis verhoogt; Om hem te doen zitten bij de vorsten, bij de vorsten van Zijn volk.", "Ps 113:3": "Van de opgang van de zon af tot haar neergang zij de Naam van de HEERE geloofd.", "Hand 17:24-26": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn; En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft; En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Deut 3:24": "Heere HEERE! U bent begonnen Uw dienaar Uw grootheid en Uw sterke hand te tonen; want welke God is er in de hemel of op de aarde, die kan doen naar Uw werken en naar Uw machtige daden!", "Deut 8:15-18": "Die u geleid heeft in die grote en angstaanjagende woestijn, waar vurige slangen, en schorpioenen, en droogte waren, waar geen water was; Die u water uit de keiharde rots liet komen; Die u in de woestijn voedde met manna, dat uw vaderen niet gekend hadden; om u te verootmoedigen, en om u te beproeven, opdat Hij u uiteindelijk goeddeed; En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven.", "Ps 90:2": "Eer de bergen geboren waren, en U de aarde en de wereld voortgebracht had, ja, van eeuwigheid tot eeuwigheid bent U God.", "Joël 2:23": "En u, kinderen van Sion! verheugt u en weest blijde in de HEERE, uw God; want Hij zal u die Leraar ter gerechtigheid geven; en Hij zal u de regen doen neerdalen, de vroege regen en de late regen in de eerste maand.", "Jes 24:13": "Want in het binnenste van het land, in het midden van deze volken, zal het zo zijn als de afschudding van het olijfboom, als de nalezingen, wanneer de wijnoogst geëindigd is.", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "Jer 2:28": "Waar zijn dan uw goden, die u zich gemaakt hebt? Laat ze opstaan, of zij u ten tijde van uw kwaad zullen verlossen; want naar het getal van uw steden zijn uw goden, Juda!", "Ps 147:9": "Die het vee zijn voer geeft; aan de jonge raven, als zij roepen.", "1 Kon 11:39": "En Ik zal om die reden het nageslacht van David vernederen; maar niet voor altijd.", "Matt 19:26": "En Jezus keek hen aan, en zei tegen hen: Bij de mensen is dat onmogelijk, maar bij God zijn alle dingen mogelijk.", "Rom 3:26": "tot een betoning van Zijn gerechtigheid in deze tegenwoordige tijd; opdat Hij rechtvaardig is, en rechtvaardigend degene die uit het geloof van Jezus is.", "Joh 19:11": "Jezus antwoordde: U zou geen enkele macht tegen Mij hebben, als het u niet van boven gegeven was; daarom heeft hij die Mij aan u heeft overgeleverd, groter zonde.", "Ps 97:6": "De hemelen verkondigen Zijn gerechtigheid, en alle volken zien Zijn eer.", "Luk 2:20": "En de herders keerden terug, terwijl zij God verheerlijkten en prezen om alles wat zij gehoord en gezien hadden, zoals tegen hen gesproken was.", "1 Joh 4:8": "Wie niet liefheeft, kent God niet; want God is liefde.", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Ps 136:15": "Farao met zijn leger stortte Hij in de Schelfzee; want Zijn goedertierenheid is voor eeuwig.", "Ps 115:4-8": "Hun afgoden zijn zilver en goud, het werk van mensenhanden; zij hebben een mond, maar spreken niet; zij hebben ogen, maar zien niet; oren hebben zij, maar horen niet; zij hebben een neus, maar ruiken niet;", "Ps 86:8-10": "Onder de goden is niemand U gelijk, Heere! en er zijn geen werken gelijk aan Uw werken. Al de heidenen, Heere! die Gij gemaakt hebt, zullen komen, en zullen zich voor Uw aangezicht neerbuigen, en Uw Naam eren. Want Gij zijt groot, en doet wonderwerken; Gij alleen zijt God.", "Jes 41:23": "Verkondig de dingen die hierna komen zullen, opdat wij weten dat u goden bent; ja, doe goed, of doe kwaad, zodat wij verbaasd staan, en samen toezien.", "Ps 144:1": "Een psalm van David. Geprezen zij de HEERE, mijn Rotssteen, Die mijn handen leert voor de strijd, mijn vingers voor de oorlog;", "Job 39:8": "Wie heeft de woudezel vrij heengezonden, en wie heeft de banden van de wilde ezel gelost?", "Jer 51:17": "Ieder mens is redeloos geworden, zodat hij geen kennis heeft; iedere goudsmid is beschaamd over het gesneden beeld; want zijn gegoten beeld is leugen, en er is geen geest in hen.", "Matt 20:16": "Zo zullen de laatsten de eersten zijn, en de eersten de laatsten; want velen zijn geroepen, maar weinigen uitverkoren.", "Num 21:8": "En de HEERE zei tegen Mozes: Maak u een vurige slang, en zet die op een stang; en het zal gebeuren, dat ieder die gebeten is, als hij haar aanziet, zal leven.", "Jes 30:32": "En overal waar die gegrondveste staf doorgegaan zal zijn (waarop de HEERE hem zal hebben doen rusten), daar zal men met trommels en harpen zijn; want met bewegende bestrijdingen zal Hij tegen hen strijden.", "Ps 106:43-46": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid. Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde. En Hij dacht tot hun voordeel aan Zijn verbond, en het berouwde Hem naar de veelheid van Zijn blijken van goedertierenheid.", "Ezech 18:29": "Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?", "Ps 44:3": "U hebt de heidenvolken met Uw hand uit de bezitting verdreven, maar hen geplant; U hebt de volken geplaagd, hen daarentegen doen voortschieten.", "Ef 1:3-6": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus. Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde; Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil.", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Jer 1:5": "Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld.", "1 Kron 29:14": "Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.", "Jer 10:11": "(Zo zult u tegen hen zeggen: De goden, die de hemel en de aarde niet gemaakt hebben, zullen vergaan van de aarde, en van onder deze hemel.)", "1 Kron 28:8": "Welnu, voor de ogen van heel Israël, de gemeente van de HEERE, en voor de oren van onze God: houd en zoek al de geboden van de HEERE, uw God; opdat u dit goede land erfelijk bezit, en het na u nalaat als erfenis aan uw kinderen tot in eeuwigheid.", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "Ps 90:8": "U stelt onze ongerechtigheden voor U, onze heimelijke zonden in het licht van uw aangezicht.", "Job 5:9": "Die grote dingen doet, die men niet doorzoeken kan; wonderen, die men niet tellen kan;", "2 Sam 24:16": "Toen nu de engel zijn hand uitstrekte over Jeruzalem om haar te verderven, kreeg de HEERE berouw over dat kwaad, en Hij zei tegen de engel die het verderf onder het volk aanrichtte: Het is genoeg, trek uw hand nu terug. De engel van de HEERE was nu bij de dorsvloer van Arauna, de Jebusiet.", "Job 36:26": "Zie, God is groot, en wij begrijpen het niet; er is ook geen onderzoeking van het aantal van Zijn jaren.", "Ps 17:7": "Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan!", "Luk 22:35": "En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.", "Job 22:12": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn.", "Ps 107:43": "Wie is wijs? Laat hij op deze dingen letten; en laat men verstandig letten op de blijken van goedertierenheid van de HEERE.", "Jes 24:23": "En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Ps 96:10": "Zegt onder de heidenen: De HEERE regeert; ook zal de wereld vaststaan, zij zal niet wankelen; Hij zal de volken oordelen in alle rechtvaardigheid.", "2 Kon 3:13": "Maar Elisa zei tegen de koning van Israël: Wat heb ik met u te doen? Ga naar de profeten van uw vader, en naar de profeten van uw moeder. Doch de koning van Israël zei tegen hem: Nee, want de HEERE heeft deze drie koningen bij elkaar geroepen, om hen in de hand van de Moabieten te geven.", "Ex 19:4-6": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb. Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn; En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "Jes 65:19": "En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem van het wenen, noch de stem van het geschreeuw.", "Jona 2:9": "Maar ik zal U offeren met de stem van de dankzegging; wat ik beloofd heb, zal ik betalen. Het heil is van de HEERE.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Micha 1:4": "En de bergen zullen onder Hem versmelten, en de dalen gekloofd worden, zoals was voor het vuur, zoals water dat uitgestort wordt in de laagte.", "Jes 62:5": "Want zoals een jongeling een jonkvrouw trouwt, zo zullen uw kinderen u trouwen; en zoals de bruidegom vrolijk is over de bruid, zo zal uw God over u vrolijk zijn.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Ps 69:35": "Dat Hem prijzen de hemel en de aarde, de zeeën, en al wat daarin wemelt.", "2 Kor 7:6": "Doch God, Die de nederigen vertroost, heeft ons getroost door de komst van Titus.", "Jak 5:13": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen.", "Ps 99:8": "O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Jes 40:20": "Wie te arm is om zo'n offer te brengen, kiest een hout uit dat niet verrot; hij zoekt zich een wijze werkmeester, om een beeld te maken, dat niet wankelt.", "Job 12:14-16": "Zie, Hij breekt af, en het zal niet herbouwd worden; Hij besluit iemand op, en er zal niet opengedaan worden. Zie, Hij houdt de wateren tegen, en zij drogen uit; ook laat Hij ze los, en zij keren de aarde om. Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "Ps 24:7-10": "Heft uw hoofden op, poorten, en verhef u, eeuwige deuren, opdat de Koning der ere ingaat! Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat!", "Matt 11:26": "Ja, Vader! Want zo is het welbehagen geweest voor U.", "Ps 19:10": "De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Job 21:12": "Zij heffen op met de trommel en de harp, en verblijden zich bij het geluid van de fluit.", "Ps 92:9": "Maar U bent de Allerhoogste in eeuwigheid, de HEERE!", "Hand 3:19": "Kom dus tot inkeer en bekeer u, opdat uw zonden uitgewist worden, wanneer de tijden van verkwikking gekomen zijn van het aangezicht van de Heere,", "Ps 37:25": "Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "Dan 6:28": "Hij verlost en redt, en Hij doet tekenen en wonderen in de hemel en op de aarde; Hij heeft Daniël uit de macht van de leeuwen verlost.", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Ps 37:22": "Want zijn gezegenden zullen de aarde erfelijk bezitten; maar zijn vervloekten zullen uitgeroeid worden.", "1 Kron 22:13": "Dan zult u voorspoedig zijn, als u erop toeziet om te doen de inzettingen en de rechten die de HEERE aan Mozes geboden heeft over Israël. Wees sterk en heb goede moed, wees niet bevreesd, en wees niet verslagen!", "Spr 16:6": "Door goedertierenheid en trouw wordt de misdaad verzoend; en door de vreze van de HEERE wijkt men af van het kwade.", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "1 Kron 16:31": "Laat de hemelen zich verblijden, en de aarde zich verheugen, en laat men onder de heidenen zeggen: De HEERE regeert.", "Jer 51:16": "Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Jes 57:18": "Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.", "Jes 49:13": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.", "Job 10:2-18": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist. Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft? Hebt U vleselijke ogen, ziet U zoals een mens ziet?", "2 Sam 7:24": "En U hebt Uw volk Israël voor Uzelf bevestigd, voor Uzelf tot een volk, tot in eeuwigheid; en U, HEERE, bent hun tot een God geworden.", "Ps 149:6": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand,", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "Jes 23:16": "Neem de harp, ga rond door de stad, u vergeten hoer! Speel mooi, zing veel liederen, opdat men weer aan u denkt!", "Jes 65:23": "Zij zullen niet tevergeefs arbeiden, noch baren voor verstoring; want zij zijn het nageslacht van de gezegenden van de HEERE, en hun nakomelingen met hen.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "Joh 17:9": "Ik bid voor hen; Ik bid niet voor de wereld, maar voor hen die U Mij gegeven hebt, want zij zijn van U.", "Ps 82:1": "Een psalm van Asaf. God staat in de vergadering van God; Hij oordeelt in het midden van de goden;", "Ef 3:21": "Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.", "Jer 31:37": "Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "Deut 7:6": "Want u bent een heilig volk voor de HEERE, uw God; u heeft de HEERE, uw God, uitgekozen om Hem een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn.", "Ps 26:2": "Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart.", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Ps 105:27-29": "Zij deden onder hen de bevelen van Zijn tekenen, en de wonderwerken in het land van Cham. Hij zond duisternis, en maakte het duister; en zij waren Zijn woord niet opstandig. Hij keerde hun water in bloed, en Hij doodde hun vissen.", "Job 9:28": "Dan schroom ik voor al mijn smarten; ik weet dat U mij niet onschuldig zult houden.", "Ps 104:1-35": "Loof de HEERE, mijn ziel! O HEERE, mijn God! U bent zeer groot, U bent bekleed met majesteit en heerlijkheid. Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn. Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Dan 2:47": "De koning antwoordde Daniël en zei: Het is werkelijk waar dat uw God een God der goden is, en een Heere der koningen, en Iemand Die geheimen openbaart, omdat u dit geheim hebt kunnen openbaren.", "Ps 75:2": "Wij loven U, o God! Wij loven, dat Uw Naam nabij is; men vertelt Uw wonderen.", "Ps 136:3-26": "Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig. Hem, Die alleen grote wonderen doet; want Zijn goedertierenheid is voor eeuwig. Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Jes 44:1": "Maar hoor nu Mijn knecht Jakob, en Israël, die Ik uitgekozen heb!", "Job 29:5": "Toen de Almachtige nog met mij was, en mijn jongens rondom mij;", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "Luk 15:4-7": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Job 8:3": "Zou God dan het recht verdraaien? En zou de Almachtige de gerechtigheid verdraaien?", "1 Kron 15:28": "Zo bracht heel Israël de ark van het verbond van de HEERE op, met gejuich, en met geluid van de bazuin, en met trompetten, en met cimbalen, en maakte geluid met luiten en met harpen.", "Ps 111:7": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar.", "Ps 119:172": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid.", "Dan 5:26-28": "Dit is de uitleg van deze woorden: MENE; God heeft uw koninkrijk geteld, en Hij heeft het beëindigd. TEKEL; u bent op een weegschaal gewogen, en u bent te licht bevonden. PERES; uw koninkrijk is verdeeld, en het is aan de Meden en de Perzen gegeven.", "Openb 4:11": "U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.", "Jes 27:4": "Grimmigheid is bij Mij niet; wie zou Mij als een doorn en distel in oorlog willen zetten, zodat Ik tegen hem zou aanvallen, en hem tegelijk zou verbranden?", "Ps 108:2-4": "O God! Mijn hart is bereid; ik zal zingen en psalmzingen, ook mijn eer. Ontwaak, u luit en harp! Ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o HEERE! En ik zal U psalmzingen onder de natiën.", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Ps 32:11": "Verblijd u in de HEERE, en verheug u, rechtvaardigen! En zing vrolijk, alle oprechten van hart!", "Ex 34:5-7": "De HEERE nu kwam neerwaarts in een wolk, en stelde Zich daar bij hem; en Hij riep de Naam van de HEERE uit. Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid. Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Jer 1:4": "Het woord van de HEERE dan kwam tot mij, en zei:", "Dan 6:21-23": "Toen hij nu bij de kuil gekomen was, riep hij naar Daniël met droevige stem; de koning antwoordde en zei tegen Daniël: O Daniël, dienaar van de levende God! heeft ook uw God, Die u voortdurend eert, u uit de macht van de leeuwen kunnen verlossen? Toen sprak Daniël tegen de koning: O koning, leef voor eeuwig! Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "Jes 44:18-20": "Zij weten niet, en begrijpen niet, want het heeft hun ogen dichtgesmeerd, zodat zij niet zien, en hun harten, zodat zij niet begrijpen. En niemand van hen brengt het in zijn hart, en er is geen kennis en geen verstand, zodat hij zou zeggen: De helft daarvan heb ik verbrand in het vuur, ja, ook op de kolen daarvan heb ik brood gebakken, ik heb vlees daarbij gebraden, en heb het gegeten; en zou ik het overblijfsel daarvan tot een gruwel maken, zou ik neerknielen voor iets dat van een boom gekomen is? Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?", "Pred 3:14": "Ik weet, dat al wat God doet, dat zal in eeuwigheid zijn, en er is niets aan toe te doen, en er is niets van af te doen; en God doet dat, opdat men vreest voor Zijn aangezicht.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Ps 118:14": "De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.", "Gen 16:5": "Toen zei Sarai tegen Abram: Het onrecht mij aangedaan komt op u neer; ik heb mijn dienstmaagd in uw schoot gegeven; nu zij ziet dat zij zwanger is geworden, ben ik veracht in haar ogen; de HEERE oordele tussen mij en tussen u!", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Hagg 2:9": "Mijn is het zilver, en Mijn is het goud, spreekt de HEERE van de heerscharen.", "Ps 118:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Ps 106:48": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid; en al het volk zegt: Amen, Halleluja!", "Ps 86:12": "Heere, mijn God! ik zal U met mijn hele hart loven, en ik zal Uw Naam eren tot in eeuwigheid;", "Gen 49:11": "Hij bindt zijn jonge ezel aan de wijnstok, en het veulen van zijn ezelin aan de edelste wijnstok; hij wast zijn kleed in de wijn, en zijn mantel in wijndruivenbloed.", "Klaagl 3:22": "Cheth. Het zijn de blijken van goedertierenheid van de HEERE, dat wij niet vernietigd zijn, dat Zijn barmhartigheden geen einde hebben;", "1 Kon 8:32": "hoor Ú dan in de hemel, en doe, en oordeel Uw dienaren, veroordeel de onrechtvaardige door zijn weg op zijn hoofd te leggen, en verklaar de rechtvaardige rechtvaardig door hem te geven naar zijn gerechtigheid.", "Ps 117:1": "Loof de HEERE, alle heidenvolken; prijs Hem, alle natiën!", "Spr 10:27": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort.", "Ps 89:53": "Geloofd zij de HEERE in eeuwigheid! Amen, ja, amen.", "Jona 4:2": "En hij bad tot de HEERE, en zei: Och HEERE! Was dit niet mijn woord, toen ik nog in mijn land was? Daarom kwam ik het voor, door naar Tarsis te vluchten; want ik wist dat U een genadig en barmhartig God bent, geduldig en groot van goedertierenheid, en berouw hebbend over het kwaad.", "Ex 21:17-20": "Wie ook zijn vader of zijn moeder vervloekt, die zal zeker gedood worden. En wanneer mannen ruzie hebben, en de een slaat de ander met een steen of met een vuist, en hij sterft niet, maar moet het bed houden; als hij weer opstaat en op straat gaat met behulp van zijn stok, zal hij die hem sloeg, onschuldig zijn; alleen zal hij vergoeden wat de ander door verzuim verloren heeft, en hij zal hem volledig laten helen.", "Ezech 1:14": "De levende wezens nu liepen en keerden weer als de gedaante van een bliksemflits.", "2 Kron 6:27": "Hoor U dan in de hemel, en vergeef de zonden van Uw knechten en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben, waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt.", "Openb 1:4": "Johannes aan de zeven gemeenten die in Azië zijn: genade zij u en vrede van Hem, Die is, en Die was, en Die komen zal; en van de zeven geesten die voor Zijn troon zijn;", "Neh 9:27": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten.", "Dan 2:23": "Ik dank U en ik loof U, o God van mijn vaderen! Omdat U mij wijsheid en kracht gegeven hebt, en mij nu bekendgemaakt hebt wat wij van U gevraagd hebben, want U hebt ons de zaak van de koning bekendgemaakt.", "Jes 10:18": "Ook zal Hij verteren de heerlijkheid van zijn woud en van zijn vruchtbare veld; van de ziel af, tot het vlees toe; en hij zal zijn, zoals wanneer een vaandeldrager versmelt.", "Zach 10:6": "En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren.", "Ps 89:9": "O HEERE, God van de heerscharen! Wie is als Gij, grootmachtig, o HEERE! en Uw getrouwheid is rondom U.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "Openb 10:6": "En hij zwoer bij Hem Die leeft in alle eeuwigheid, Die de hemel geschapen heeft en wat daarin is, en de aarde en wat daarin is, en de zee en wat daarin is, dat er geen tijd meer zal zijn;", "Deut 28:7": "De HEERE zal geven dat uw vijanden, die tegen u opstaan, verslagen worden voor uw ogen; door één weg zullen zij tegen u uittrekken, maar door zeven wegen zullen zij voor u vluchten.", "Neh 8:11": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte.", "1 Petr 5:11": "Aan Hem zij de heerlijkheid en de kracht, tot in alle eeuwigheid. Amen.", "Jes 30:29": "Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.", "Neh 13:26": "Heeft Salomo, de koning van Israël, daarin niet gezondigd, hoewel er onder veel heidenvolken geen koning was zoals hij, en hij door zijn God bemind was, en God hem tot koning over heel Israël gesteld had? Ook hem lieten de vreemde vrouwen zondigen.", "Ps 68:20": "Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela.", "Joh 6:31": "Onze vaders hebben het manna gegeten in de woestijn, zoals geschreven is: Hij gaf hun brood uit de hemel te eten.", "Ps 52:3": "Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag.", "Ps 107:31": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Richt 11:34": "Toen Jeftha nu bij Mizpa bij zijn huis kwam, zie, zo kwam zijn dochter hem tegemoet, met trommels en met reidansen. Zij was zijn enige kind; hij had verder geen zoon of dochter.", "Job 12:9": "Wie weet niet, uit al deze dingen, dat de hand van de HEERE dit doet?", "Ps 43:4": "En dat ik inga tot Gods altaar, tot de God van de blijdschap van mijn verheuging, en U met de harp loof, o God, mijn God!", "Matt 7:11": "Als u dan, die slecht bent, uw kinderen goede gaven weet te geven, hoeveel te meer zal uw Vader, Die in de hemelen is, goede gaven geven aan hen die ze van Hem vragen!", "Job 36:22": "Zie, God verhoogt door Zijn kracht; wie is een Leraar zoals Hij?", "Num 10:29": "Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.", "Pred 12:14": "Want God zal ieder werk in het gericht brengen, met alles wat verborgen is, hetzij goed, of hetzij kwaad.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Ps 8:2-10": "O HEERE, onze Heere! Hoe heerlijk is Uw Naam op de hele aarde! U, die Uw majesteit boven de hemelen gesteld hebt. Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden. Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;", "Ps 10:16": "De HEERE is Koning eeuwig en altijd; de heidenen zijn vergaan uit Zijn land.", "Rom 1:32": "die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.", "Richt 3:15": "Toen riepen de kinderen van Israël tot de HEERE, en de HEERE verwekte hun een verlosser, Ehud, de zoon van Gera, een zoon van Jemini, een man die links was. En de kinderen van Israël zonden door zijn hand een geschenk aan Eglon, de koning van de Moabieten.", "Lev 20:24": "En Ik heb u gezegd: U zult hun land in erfelijk bezit nemen, en Ik zal het u geven, opdat u het in erfelijk bezit neemt, een land dat overvloeit van melk en honing; Ik ben de HEERE, uw God, Die u van de volken afgezonderd heb!", "Job 38:25": "Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen?", "Ps 105:2": "Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen.", "1 Kron 29:16": "HEERE, onze God, al deze overvloed die wij klaargemaakt hebben om U een huis te bouwen, voor de Naam van Uw heiligheid, dat komt van Uw hand, en het is alles van U.", "Deut 2:7": "Want de HEERE, uw God, heeft u gezegend in al het werk van uw hand; Hij kent uw wandelen door deze zo grote woestijn; deze veertig jaren is de HEERE, uw God, met u geweest; niets heeft u ontbroken.", "Ps 103:4": "Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden;", "Pred 5:1": "Wees niet te snel met uw mond, en laat uw hart niet haasten om een woord voort te brengen voor Gods aangezicht; want God is in de hemel, en u bent op de aarde; daarom laat uw woorden weinig zijn.", "Luk 17:16": "En hij viel op zijn gezicht voor Zijn voeten en dankte Hem; en dat was een Samaritaan.", "Neh 9:27-31": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten. Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered. En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.", "Jes 24:8": "De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houdt op, de vreugde van de harp rust.", "Lev 26:4-6": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen. Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Jes 5:7": "Want de wijngaard van de HEERE van de heerscharen is het huis van Israël, en de mannen van Juda zijn een plant van Zijn welbehagen; en Hij heeft gewacht op recht, maar zie, het is onderdrukking; op gerechtigheid, maar zie, het is geschreeuw.", "Ps 59:14": "Verteer hen in grimmigheid; verteer hen, zodat zij er niet meer zijn, en laat hen weten dat God Heerser is in Jakob, ja, tot aan de einden van de aarde. Sela.", "Joh 17:10": "En al het Mijne is van U, en het Uwe is van Mij; en Ik ben in hen verheerlijkt.", "Jer 3:22": "Keer terug, afkerige kinderen! Ik zal uw afkeringen genezen. Zie, hier zijn wij, wij komen tot U, want U bent de HEERE, onze God!", "Jes 55:10": "Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter;", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "Ps 116:1-15": "Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen; want Hij neigt Zijn oor tot mij; daarom zal ik Hem in mijn dagen aanroepen. De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "1 Kron 22:9": "Zie, de zoon die u geboren zal worden, die zal een man van rust zijn, want Ik zal hem rust geven van al zijn vijanden rondom; want zijn naam zal Salomo zijn, en Ik zal vrede en rust over Israël geven in zijn dagen.", "Hos 2:13-22": "Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken. En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland. En het zal op die dag gebeuren, spreekt de Heere, dat u Mij zult noemen: Mijn Man; en Mij niet meer zult noemen: Mijn Baäl!", "Ps 130:7": "Israël, hoop op de HEERE; want bij de HEERE is goedertierenheid, en bij Hem is veel verlossing.", "Matt 6:30-33": "Als God nu het gras van het veld, dat er vandaag is en morgen in de oven geworpen wordt, zo kleedt, zal Hij u niet veel meer kleden, kleingelovigen? Wees daarom niet bezorgd en zeg niet: Wat zullen wij eten, of wat zullen wij drinken, of waarmee zullen wij ons kleden? Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt.", "Jak 1:5": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.", "Gen 2:16": "En de HEERE God gebood de mens en zei: Van elke boom van deze hof mag u vrijelijk eten;", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Jer 3:15": "En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand.", "Ps 31:8": "Ik zal mij verheugen en verblijden in Uw goedertierenheid, omdat U mijn ellende hebt aangezien, en mijn ziel in benauwdheden gekend hebt;", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "Ps 98:4-6": "Juich de HEERE toe, heel de aarde! Roep uit van vreugde, en zing vrolijk, en zing psalmen. Zing psalmen voor de HEERE met de harp, met de harp en met de stem van het gezang, Met trompetten en bazuingeklank; juich voor het aangezicht van de Koning, de HEERE.", "Ps 106:20": "En zij veranderden hun Eer in de gedaante van een os, die gras eet.", "Ps 50:6": "En de hemelen verkondigen Zijn gerechtigheid; want God Zelf is Rechter. Sela.", "Ps 9:12": "Zingt psalmen voor de HEERE, Die te Sion woont; verkondigt onder de volken Zijn daden.", "Luk 17:15": "En een van hen, die zag dat hij genezen was, keerde terug en verheerlijkte God met luide stem.", "Ps 76:8": "U, vreselijk bent U; en wie zal voor Uw aangezicht bestaan, vanaf het moment van uw toorn?", "Job 29:19": "Mijn wortel was uitgebreid tot aan het water, en dauw vernachtte op mijn tak.", "Ps 95:6": "Komt, laat ons aanbidden en neerbukken; laat ons knielen voor de HEERE, Die ons gemaakt heeft.", "Ps 139:18": "Zou ik ze tellen? Ze zijn meer dan het zand; word ik wakker, dan ben ik nog bij U.", "Jes 51:15": "Want Ik ben de HEERE, uw God, Die de zee klieft, zodat haar golven bruisen; HEERE van de heerscharen is Zijn Naam.", "Micha 1:3": "Want ziet, de HEERE gaat uit van Zijn plaats, en Hij zal neerdalen en treden op de hoogten van de aarde.", "Rom 10:12": "Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen.", "Dan 3:6
