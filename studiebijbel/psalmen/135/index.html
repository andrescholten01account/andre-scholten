": "En wie niet neervalt en aanbidt, die zal op datzelfde moment in het midden van de brandende vuuroven geworpen worden.", "Zach 3:9": "Want zie, aangaande die steen, die Ik gelegd heb voor het aangezicht van Jozua, op die ene steen zullen zeven ogen zijn; zie, Ik zal zijn graveersel graveren, spreekt de HEERE van de heerscharen, en Ik zal de ongerechtigheid van dit land op één dag wegnemen.", "1 Kron 29:10": "Daarom loofde David de HEERE voor de ogen van de hele gemeente; en David zei: Geloofd bent U, HEERE, God van onze vader Israël, van eeuwigheid tot in eeuwigheid!", "Tit 1:1": "Paulus, een dienstknecht van God, en een apostel van Jezus Christus, naar het geloof van de uitverkorenen van God, en de kennis van de waarheid die naar de godzaligheid is;", "2 Tess 1:4-6": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt; Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken;", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "2 Kron 23:18": "Jojada nu stelde de diensten van het huis van de HEERE aan, onder leiding van de Levitische priesters, die David in het huis van de HEERE ingedeeld had, om de brandoffers van de HEERE te offeren, zoals in de wet van Mozes geschreven staat, met blijdschap en met gezang, naar de instelling van David.", "Joz 12:24": "De koning van Thirza, één. Al deze koningen zijn eenendertig.", "Deut 3:1-7": "Daarna keerden wij ons om en trokken op, de weg van Bazan; en Og, de koning van Bazan, trok uit ons tegemoet, hij en al zijn volk, ten strijde bij Edrei. Toen zei de HEERE tegen mij: Wees niet bang voor hem, want Ik heb hem, en al zijn volk, en zijn land, in uw hand gegeven; en u zult hem doen, zoals u met Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt. En de HEERE, onze God, gaf ook Og, de koning van Bazan, en al zijn volk, in onze hand, zodat wij hem sloegen, totdat wij hem niemand lieten overblijven.", "Job 8:6": "als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "Deut 5:29": "Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!", "Deut 28:9": "De HEERE zal u voor Zichzelf tot een heilig volk bevestigen, zoals Hij u gezworen heeft, wanneer u de geboden van de HEERE, uw God, houdt, en in Zijn wegen wandelt.", "Ps 23:5": "U richt de tafel voor mij aan, tegenover mijn tegenstanders; U maakt mijn hoofd vet met olie, mijn beker vloeit over.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Ps 119:7": "Ik zal U loven in oprechtheid van hart, als ik de rechten van Uw gerechtigheid geleerd zal hebben.", "Ps 104:1-32": "Loof de HEERE, mijn ziel! O HEERE, mijn God! U bent zeer groot, U bent bekleed met majesteit en heerlijkheid. Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn. Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Ps 114:3-8": "De zee zag het en vluchtte; de Jordaan keerde achterwaarts. De bergen sprongen als rammen, de heuvels als lammeren. Wat was er met u, zee, dat u vluchtte? Met u, Jordaan, dat u achterwaarts keerde?", "Job 9:4-7": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad? Die de bergen verzet, zodat zij het niet gewaar worden, Die ze omkeert in Zijn toorn; Die de aarde beweegt uit haar plaats, zodat haar pilaren schudden;", "Richt 9:56": "Zo liet God het kwaad van Abimelech, dat hij aan zijn vader gedaan had door zijn zeventig broers te doden, op hem terugkomen.", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Ps 55:20": "God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.", "Jer 33:21": "Dan zou ook Mijn verbond met Mijn knecht David verbroken kunnen worden, zodat hij geen zoon heeft die op zijn troon regeert, en met de Levieten, de priesters, Mijn dienaren.", "Deut 28:8": "De HEERE zal de zegen gebieden, zodat Hij met u is in uw schuren, en in alles waar u uw hand aan slaat; en Hij zal u zegenen in het land dat de HEERE, uw God, u geven zal.", "Jes 40:22": "Hij is het, Die daar zit boven de kring van de aarde, en haar inwoners zijn als sprinkhanen; Hij is het, Die de hemel uitspant als een dunne doek, en breidt hem uit als een tent, om te bewonen;", "1 Kron 29:12": "En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Ps 105:36": "Hij versloeg ook alle eerstgeborenen in hun land, de eerstelingen van al hun krachten.", "Jes 46:6": "Zij verkwisten het goud uit de beurs, en wegen het zilver met de weegschaal; zij huren een goudsmid, en die maakt het tot een god, zij knielen neer, ook buigen zij zich daarvoor.", "Mal 3:10-12": "Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn. En Ik zal om uwentwil de opeter bestraffen, zodat hij u de vrucht van het land niet verderft; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE van de heerscharen. En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "Job 9:13": "God zal Zijn toorn niet afkeren; onder Hem worden de hoogmoedige helpers gebogen.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Ps 86:15": "Maar Gij, Heere! zijt een barmhartig en genadig God, geduldig, en groot van goedertierenheid en waarheid.", "Deut 11:7": "Want het zijn uw ogen, die al dit grote werk van de HEERE gezien hebben, dat Hij gedaan heeft.", "2 Kron 28:22": "Ja, in de tijd toen men hem benauwde, ging hij nog meer overtreden tegen de HEERE; dit was koning Achaz.", "Ps 94:10": "Zou Hij, Die de heidenen tuchtigt, niet straffen, Hij, Die de mens wetenschap leert?", "Ps 104:24-30": "Hoe groot zijn Uw werken, o HEERE! U hebt ze allemaal met wijsheid gemaakt; het aardrijk is vol van Uw rijkdom. Deze zee, die groot en wijd van omvang is, daarin is het wemelende gedierte, ontelbaar, kleine dieren met grote. Daar varen de schepen, en de Leviathan, die U gevormd hebt om daarin te spelen.", "Job 41:2": "Wie heeft Mij iets gegeven, dat Ik het hem zou vergelden? Wat onder de hele hemel is, is van Mij.", "Ps 71:22": "Ook zal ik U loven met het instrument van de luit, Uw trouw, mijn God; ik zal U psalmzingen met de harp, o Heilige van Israël!", "Ps 90:4": "Want duizend jaren zijn in Uw ogen als de dag van gisteren, als hij voorbijgegaan is, en als een nachtwaak.", "Ps 89:7": "Want wie mag in de hemel tegen de HEERE geschat worden? Wie is de HEERE gelijk, onder de kinderen van de sterken?", "Ps 33:2": "Looft de HEERE met de harp; zingt Hem psalmen met de luit, en het tiensnarig instrument.", "Ps 76:9": "U deed een oordeel horen uit de hemel; de aarde vreesde en werd stil,", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "1 Kor 7:23": "U bent duur gekocht, word geen dienstknechten van mensen.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Jes 31:7": "Want op die dag zullen zij verwerpen, ieder zijn zilveren afgoden en zijn gouden afgoden, die uw eigen handen tot zonde gemaakt hadden;", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Ps 147:14": "Die uw grondgebied in vrede stelt; Hij verzadigt u met het beste van de tarwe.", "Job 37:6-24": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui. Dan zegelt Hij de hand van ieder mens toe, opdat elk mens het werk van Hem kent. En het gedierte gaat in de holen, en blijft in zijn schuilplaatsen.", "Luk 1:49": "Want grote dingen heeft Hij, Die machtig is, aan mij gedaan, en heilig is Zijn Naam.", "Ps 136:10-22": "Hem, Die de Egyptenaren geslagen heeft in hun eerstgeborenen; want Zijn goedertierenheid is voor eeuwig. En Israël uit hun midden heeft uitgebracht; want Zijn goedertierenheid is voor eeuwig. Met een sterke hand, en met een uitgestrekte arm; want Zijn goedertierenheid is voor eeuwig.", "Ps 100:3": "Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Ps 143:10": "Leer mij Uw welbehagen doen, want Gij zijt mijn God; Uw goede Geest leidt mij in een effen land.", "Ps 118:5": "Uit de benauwdheid heb ik de HEERE aangeroepen; de HEERE heeft mij verhoord en mij in de ruimte gezet.", "Ex 15:1": "Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen.", "Ps 150:6": "Alles wat adem heeft, love de HEERE! Halleluja!", "Luk 10:20": "Maar verblijd u daar niet in, dat de geesten zich aan u onderwerpen; verblijd u veel meer dat uw namen opgeschreven zijn in de hemelen.", "Jes 24:9": "Zij zullen geen wijn drinken met gezang; de sterke drank zal bitter zijn voor hen die hem drinken.", "Joz 11:23": "Zo nam Jozua heel dat land in, naar alles wat de HEERE tot Mozes gesproken had; en Jozua gaf het aan Israël als erfdeel, naar hun afdelingen, naar hun stammen. En het land rustte van de oorlog.", "Jes 37:19": "En hebben hun goden in het vuur geworpen, want het waren geen goden, maar het werk van mensenhanden, hout en steen; daarom hebben zij die vernietigd.", "Ps 79:13": "Zo zullen wij, Uw volk en de schapen van Uw weide, U loven in eeuwigheid, van geslacht tot geslacht; wij zullen Uw roem vertellen.", "2 Kron 20:28": "En zij kwamen in Jeruzalem, met luiten, en met harpen, en met trompetten, naar het huis van de HEERE.", "Jer 11:12": "Dan zullen de steden van Juda en de inwoners van Jeruzalem heengaan, en roepen tot de goden aan wie zij wierook gebracht hebben; maar die zullen hen zeker niet kunnen verlossen ten tijde van hun kwaad.", "Ef 1:4": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde;", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "2 Kron 7:18": "Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst.", "1 Kron 16:4-39": "En hij stelde voor de ark van de HEERE sommigen uit de Levieten aan tot dienaars, en dat om de HEERE, de God van Israël, te vermelden, en te loven, en te prijzen. Asaf was het hoofd, en Zecharja de tweede na hem; Jeïel, en Semiramoth, en Jehiël, en Mattithja, en Eliab, en Benaja, en Obed-Edom, en Jeïel, met instrumenten van luiten en met harpen; en Asaf liet zich horen met cimbalen; Maar Benaja en Jahaziël, de priesters, voortdurend met trompetten voor de ark van het verbond van God.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Jes 51:3": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang.", "Hand 4:28": "Om te doen alles wat Uw hand en Uw raad van tevoren bepaald hadden dat zou gebeuren.", "Jer 50:44": "Zie, zoals een leeuw van de verheffing van de Jordaan zal hij opkomen tegen de sterke woning; want Ik zal hen in een ogenblik daaruit doen wegvluchten; en wie daartoe verkoren is, hem zal Ik tegen haar aanstellen; want wie is Mij gelijk, en wie zou Mij dagvaarden? En wie is de herder die voor Mijn aangezicht kan bestaan?", "1 Kor 1:26-29": "Want u ziet uw roeping, broeders, dat u niet veel wijzen bent naar het vlees, niet veel machtigen, niet veel edelen. Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen; En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken;", "Ps 118:13": "U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "2 Sam 22:16": "En de diepe kolken van de zee werden gezien, de bodems van de wereld werden ontdekt, door het schelden van de HEERE, van het geblaas van de wind van Zijn neus.", "Ezra 3:10": "Toen nu de bouwers de grond van de tempel van de HEERE legden, stelden zij de priesters op, gekleed in hun ambtskleding, met trompetten, en de Levieten, de zonen van Asaf, met cimbalen, om de HEERE te loven, naar de instelling van David, de koning van Israël.", "Richt 5:1-3": "Verder zong Debora, en Barak, de zoon van Abinoam, op dezelfde dag, en zei: Looft de HEERE, om het wreken van de wraken in Israël, om dat het volk zich gewillig heeft aangeboden. Hoor, u koningen, neem het ter ore, u vorsten! Ik, den HEERE zal ik zingen, ik zal den HEERE, de God van Israël, psalmzingen.", "Ps 11:4": "De HEERE is in het paleis van Zijn heiligheid, de troon van de HEERE is in de hemel; Zijn ogen aanschouwen, Zijn oogleden beproeven de mensenkinderen.", "Job 34:15": "Alle vlees zou tegelijk de geest geven, en de mens zou tot stof terugkeren.", "Hebr 8:1": "De hoofdsom nu van de dingen waarover wij spreken, is dat wij zo'n Hogepriester hebben, Die gezeten is aan de rechterhand van de troon van de Majesteit in de hemelen:", "Ps 145:7": "Zain. Zij zullen de gedachtenis van de grootheid van Uw goedheid overvloedig uitstorten, en zij zullen Uw gerechtigheid met gejuich verkondigen.", "Gen 49:12": "Hij is roodachtig van ogen door de wijn, en wit van tanden door de melk.", "Ps 36:6": "O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe.", "Deut 13:17": "Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;", "Deut 27:9": "Vervolgens sprak Mozes, samen met de Levitische priesters, tot heel Israël: Luister toe en hoor, o Israël! Op deze dag bent u het volk van de HEERE, uw God, geworden.", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "2 Kron 6:22": "Wanneer iemand tegen zijn naaste zal gezondigd hebben, en die hem een eed van de vloek opgelegd zal hebben om zichzelf te vervloeken, en de eed van de vloek voor Uw altaar in dit huis komen zal;", "Gen 21:13": "Maar Ik zal ook de zoon van deze slavin tot een volk maken, omdat hij uw nageslacht is.", "1 Sam 12:22": "Want de HEERE zal Zijn volk niet verlaten, omwille van Zijn grote Naam, omdat het de HEERE behaagd heeft, u tot een volk voor Zichzelf te maken.", "1 Kron 23:30": "En om elke morgen te staan om de HEERE te loven en te prijzen; en evenzo 's avonds;", "Job 42:2": "Ik weet, dat U alles vermag, en dat geen van Uw gedachten kan afgesneden worden.", "Ps 66:2": "Zingt psalmen tot eer van Zijn Naam; geeft eer aan Zijn lof.", "Hebr 9:14": "hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Deut 32:43": "Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Job 26:12": "Door Zijn kracht klieft Hij de zee, en door Zijn verstand verslaat Hij haar trots.", "Ps 98:6": "Met trompetten en bazuingeklank; juich voor het aangezicht van de Koning, de HEERE.", "Deut 11:12-15": "Een land, dat de HEERE, uw God, verzorgt; de ogen van de HEERE, uw God, zijn er voortdurend op gericht, van het begin van het jaar tot het einde van het jaar. En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel; Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt.", "Job 36:5": "Zie, God is machtig, toch veracht Hij niemand; machtig is Hij in kracht van hart.", "1 Kor 8:5": "Want al zijn er ook die goden genoemd worden, hetzij in de hemel, hetzij op de aarde (zoals er veel goden en veel heren zijn),", "Jer 3:12": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.", "2 Kron 6:21": "Hoor dan naar de smekingen van Uw knecht, en van Uw volk Israël, die in deze plaats zullen bidden; en hoor U uit de plaats van Uw woning, uit de hemel, ja, hoor, en vergeef.", "Deut 31:4": "En de HEERE zal met hen doen, zoals Hij met Sihon en Og, koningen van de Amorieten, en met hun land gedaan heeft, die Hij weggevaagd heeft.", "Hos 2:22": "En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!", "Job 39:4-33": "Weet u de tijd van het baren van de steengeiten? Hebt u waargenomen de arbeid van de hinden? Zult u de maanden tellen, die zij vervullen, en weet u de tijd van haar baren? Als zij zich krommen, haar jongen met versplijting voortbrengen, haar smarten uitwerpen?", "Openb 19:2": "Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft.", "1 Kon 9:5": "Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.", "Ps 144:9": "O God, ik zal U een nieuw lied zingen; met de luit en het tiensnarig instrument zal ik U lofzingen.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is; maar wee die mens door wie de Zoon des mensen verraden wordt; het zou beter voor hem geweest zijn als die mens niet geboren was.", "Job 39:9": "Die Ik de wildernis tot zijn huis besteld heb, en het ziltige tot zijn woningen.", "Ps 107:29": "Hij doet de storm stilstaan, zodat hun golven zwijgen.", "Ezech 16:50": "En zij verhieven zich, en deden gruwelijkheid voor Mijn aangezicht; daarom deed Ik ze weg, nadat Ik het gezien had.", "2 Kron 5:12": "en de Levieten, die zangers waren, van hen allen, van Asaf, van Heman, van Jeduthun, en van hun zonen, en van hun broeders, in fijn linnen gekleed, met cimbalen, en met luiten, en harpen, stonden aan de oostzijde van het altaar, en met hen tot honderdtwintig priesters toe, die op trompetten trompetten);", "Jona 4:10": "En de HEERE zei: U hebt medelijden met de wonderboom, waarvoor u niet gewerkt hebt en die u niet hebt laten groeien; die in één nacht ontstond, en in één nacht verging.", "Ps 48:10": "O God! wij gedenken Uw weldadigheid, in het midden van Uw tempel.", "Amos 7:6": "Toen kreeg de HEERE berouw hierover. Ook dit zal niet gebeuren, zei de Heere HEERE.", "Rom 1:23": "en hebben de heerlijkheid van de onvergankelijke God veranderd in de gelijkenis van het beeld van een vergankelijk mens, en van vogels, en van viervoetige en kruipende dieren.", "Job 34:14": "Als Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich verzamelen;", "Lev 20:26": "En u zult Mij heilig zijn, want Ik, de HEERE, ben heilig; en Ik heb u van de volken afgezonderd, opdat u van Mij zou zijn.", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Deut 5:33": "In heel de weg die de HEERE, uw God, u gebiedt, zult u gaan; opdat u leeft, en opdat het u goed gaat, en u de dagen verlengt in het land dat u erven zult.", "Ps 102:13": "Maar U, HEERE! blijft in eeuwigheid, en Uw gedachtenis van geslacht tot geslacht.", "Ps 76:3": "En in Salem is Zijn hut, en Zijn woning in Sion.", "Jes 14:11": "Uw hoogmoed is in het rijk van de dood neergestort, met het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.", "2 Kon 19:18": "En hebben hun goden in het vuur gegooid; want zij waren geen goden, maar het werk van mensenhanden, hout en steen; daarom hebben zij die vernietigd.", "Luk 1:37": "Want geen ding zal bij God onmogelijk zijn.", "Rom 16:26": "maar nu geopenbaard is, en door de profetische Schriften, naar het bevel van de eeuwige God, tot gehoorzaamheid aan het geloof, onder alle heidenen bekendgemaakt is;", "Job 12:17": "Hij voert de raadsheren beroofd weg, en de rechters maakt Hij uitzinnig,", "Ps 78:67": "Doch Hij verwierp de tent van Jozef, en de stam van Efraïm verkoos Hij niet.", "Jes 40:26": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist.", "Job 34:23": "Zeker, Hij legt de mens niet te veel op, dat hij tegen God in het gericht zou mogen treden.", "Ps 78:61": "En Hij gaf Zijn sterkte in de gevangenis, en Zijn heerlijkheid in de hand van de tegenstander.", "Jer 32:18": "U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "Jes 60:10": "En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Ps 95:2": "Laat ons Zijn aangezicht tegemoet gaan met lof; laat ons Hem juichen met psalmen.", "Ezech 16:42": "Zo zal Ik Mijn grimmigheid op u laten rusten, en Mijn ijver zal van u wijken; en Ik zal stil zijn, en niet meer toornig zijn.", "Ezech 18:32": "Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Ps 95:3-5": "Want de HEERE is een grote God; ja, een groot Koning boven alle goden; In Wiens hand de diepste plaatsen van de aarde zijn, en de hoogten van de bergen zijn van Hem; Van Hem is ook de zee, want Hij heeft ze gemaakt; en Zijn handen hebben het droge gevormd.", "2 Kron 31:10": "En Azarja, de hoofdpriester, van het huis van Zadok, sprak tot hem en zei: Sinds men deze heffing is begonnen tot het huis van de HEERE te brengen, is er te eten geweest en genoeg om verzadigd te worden, ja, tot overvloed toe; want de HEERE heeft Zijn volk gezegend, zodat deze grote hoeveelheid overgebleven is.", "Ezech 20:42": "En u zult weten dat Ik de HEERE ben, wanneer Ik u in het land van Israël gebracht zal hebben, in het land waarover Ik Mijn hand heb opgeheven om het aan uw vaderen te geven.", "Ps 136:18-20": "En machtige koningen heeft gedood; want Zijn goedertierenheid is voor eeuwig. Sihon, de Amoritische koning; want Zijn goedertierenheid is voor eeuwig. En Og, de koning van Basan; want Zijn goedertierenheid is voor eeuwig.", "Job 36:3": "Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "Jak 5:11": "Zie, wij noemen hen gelukkig die volharden; u hebt van de volharding van Job gehoord, en u hebt gezien hoe de Heere het einde bracht, dat de Heere zeer barmhartig is en vol ontferming.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "1 Sam 15:11": "Het berouwt Mij dat Ik Saul tot koning gemaakt heb, omdat hij zich van Mij afgekeerd heeft, en Mijn woorden niet volbracht heeft. Toen ontstak Samuël in toorn, en hij riep tot de HEERE de hele nacht.", "Deut 32:38": "Van wiens slachtoffers zij het vet aten, van wiens drankoffers zij de wijn dronken; laten zij opstaan en u helpen, zodat er bescherming voor u is.", "Job 29:20": "Mijn heerlijkheid was nieuw bij mij, en mijn boog vernieuwde zich in mijn hand.", "Luk 2:37": "En zij was een weduwe van ongeveer vierentachtig jaar, die niet week uit de tempel, maar God diende met vasten en bidden, nacht en dag.", "Ps 146:10": "De HEERE zal in eeuwigheid regeren; uw God, o Sion! is van geslacht tot geslacht. Halleluja!", "Jer 5:10": "Beklim haar muren, en verwoest ze (maar maak er geen einde aan); haal haar tinnen weg, want zij zijn niet van de HEERE.", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Klaagl 5:19": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht.", "Ps 148:8": "Vuur en hagel, sneeuw en damp; stormwind, die Zijn woord doet!", "Ps 87:7": "En de zangers, evenals de speellieden, alsook al mijn bronnen, zullen binnen u zijn.", "Job 23:13": "Maar is Hij tegen iemand, wie zal Hem dan afkeren? Wat Zijn ziel begeert, dat zal Hij doen.", "2 Kor 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting;", "Jes 19:1": "De last van Egypte. Zie, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden vanwege Zijn aangezicht, en het hart van de Egyptenaren zal smelten in hun binnenste.", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "Ps 35:24": "Doe mij recht naar Uw gerechtigheid, HEERE, mijn God! En laat hen zich over mij niet verblijden.", "Ruth 1:6": "Toen maakte zij zich klaar met haar schoondochters, en keerde terug uit de velden van Moab; want zij had in het land van Moab gehoord dat de HEERE naar Zijn volk had omgezien en hun brood gaf.", "Ps 76:12": "Doe geloften en betaal ze de HEERE, uw God, u allen, die rondom Hem zijn! Laat men Hem, Die te vrezen is, geschenken brengen;", "Ps 146:7-9": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los. De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief. De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Mark 14:26": "En nadat zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.", "Hos 2:20": "En het zal op die dag gebeuren, dat Ik verhoren zal, spreekt de Heere; Ik zal de hemel verhoren, en die zal de aarde verhoren.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "Job 38:35": "Kunt u de bliksemen uitlaten, dat zij heengaan, en tot u zeggen: Zie, hier zijn wij?", "2 Kron 6:23": "Hoor U dan uit de hemel, en doe, en richt Uw knechten, door de goddeloze te vergelden en zijn weg op zijn hoofd te leggen, en door de rechtvaardige recht te doen en hem naar zijn gerechtigheid te geven.", "Ps 67:4": "De volken zullen U, o God, loven; de volken, allemaal, zullen U loven.", "Ps 89:29": "Ik zal hem Mijn goedertierenheid in eeuwigheid bewaren, en Mijn verbond zal hem vast blijven.", "Jes 51:16": "En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw van Mijn hand; om de hemel te planten, en om de aarde te gronden, en om tegen Sion te zeggen: U bent Mijn volk.", "Neh 9:22": "Verder hebt U hun koninkrijken en volken gegeven, en hebt hen verdeeld in hoeken. Zo hebben zij het land van Sihon erfelijk bezeten, namelijk het land van de koning van Hesbon, en het land van Og, koning van Basan.", "Ps 89:34": "Maar Mijn goedertierenheid zal Ik van hem niet wegnemen, en in Mijn getrouwheid niet feilen.", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Jes 44:21": "Denk aan deze dingen, o Jakob, en Israël! Want u bent Mijn knecht, Ik heb u geformeerd; u bent Mijn knecht, Israël, u zult door Mij niet vergeten worden.", "Jes 40:23": "Die de vorsten teniet maakt; de rechters van de aarde maakt Hij tot ijdelheid.", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "1 Kon 8:43": "hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Openb 14:2": "En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers;", "Matt 24:27": "Want zoals de bliksem uitgaat vanuit het oosten en schijnt tot het westen, zo zal ook de komst van de Zoon des mensen zijn.", "Ezech 16:1-14": "Verder gebeurde het woord van de HEERE tot mij, en Hij zei: Mensenkind, maak Jeruzalem haar gruwelen bekend, en zeg: Zo zegt de Heere HEERE tot Jeruzalem: Uw oorsprong en uw geboorte zijn uit het land van de Kanaänieten; uw vader was een Amoriet en uw moeder een Hethitische.", "Hand 2:39": "Want voor u is de belofte, en voor uw kinderen, en voor allen die ver weg zijn, zoveel als de Heere, onze God, ertoe roepen zal.", "Ps 8:4-7": "Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt; Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond?", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "Ps 132:13": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei:", "1 Kron 16:42": "Met hen dan waren Heman en Jeduthun, met trompetten en cimbalen voor hen die zich lieten horen, en met instrumenten van de muziek van God; maar de zonen van Jeduthun waren aan de poort.", "Deut 26:18": "En de HEERE heeft u heden laten zeggen dat u Hem tot een volk van het eigendom zult zijn, zoals Hij u gesproken heeft, en dat u al Zijn geboden zult houden;", "Nahum 1:3-6": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten. Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg. De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.", "Ef 1:19": "En wat de uitnemende grootheid is van Zijn kracht aan ons, die geloven, naar de werking van de sterkte van Zijn macht,", "Jes 46:7": "Zij nemen hem op de schouder, zij dragen hem, en zetten hem op zijn plaats; daar staat hij, hij wijkt niet van zijn plaats; ja, roept iemand tot hem, dan antwoordt hij niet, hij verlost hem niet uit zijn benauwdheid.", "2 Tess 1:11": "Daarom bidden wij ook altijd voor u, dat onze God u waardig acht voor deze roeping, en al het welbehagen van Zijn goedheid vervult, en het werk van het geloof met kracht.", "Deut 4:4": "U daarentegen, die de HEERE, uw God, aanhing, u bent vandaag allemaal nog in leven.", "Joz 10:1": "Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren;", "Job 22:28": "Als u een zaak besluit, zal zij voor u bestendig zijn; en op uw wegen zal het licht schijnen.", "1 Kor 8:4": "Wat betreft dan het eten van de dingen die aan de afgoden geofferd zijn: wij weten dat een afgod niets is in de wereld, en dat er geen andere God is dan Eén.", "Ps 46:7": "De heidenen raasden, de koninkrijken bewogen zich; Hij verhief Zijn stem, de aarde versmolt.", "Num 11:23": "Maar de HEERE zei tegen Mozes: Zou dan de hand van de HEERE verkort zijn? U zult nu zien of Mijn woord u zal overkomen, of niet.", "Ps 56:11": "In God zal ik het woord prijzen; in de HEERE zal ik het woord prijzen.", "Job 38:25-27": "Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen? Om te regenen op het land, waar niemand is, op de woestijn, waarin geen mens is; Om het woeste en het verwoeste te verzadigen, en om het uitspruitsel van de grasscheutjes te doen meer worden.", "Rom 9:18": "Zo ontfermt Hij Zich dan over wie Hij wil, en Hij verhardt wie Hij wil.", "Dan 4:3": "Hoe groot zijn Zijn tekenen! En hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.", "Micha 7:18": "Wie is een God gelijk U, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel van Zijn erfenis voorbijgaat? Hij houdt Zijn toorn niet voor eeuwig vast; want Hij heeft lust aan goedertierenheid.", "Ps 130:3": "Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Ps 71:19": "Ook is Uw gerechtigheid, o God, tot in de hoogte; Gij, Die grote dingen gedaan hebt; o God! wie is U gelijk?", "Ps 47:8": "Want God is een Koning van de hele aarde; zingt psalmen met verstand!", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Jak 4:12": "Er is één Wetgever, Die kan behouden en verderven. Maar wie bent u, dat u een ander veroordeelt?", "Neh 12:27-31": "Bij de inwijding nu van de muur van Jeruzalem, zochten zij de Levieten op uit al hun plaatsen, om hen naar Jeruzalem te brengen, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen. Zo werden de kinderen van de zangers verzameld, zowel uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten; En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.", "Jes 54:9": "Want dat zal Mij zijn als de wateren van Noach, toen Ik zwoer dat de wateren van Noach niet meer over de aarde zouden gaan; zo heb Ik gezworen dat Ik niet meer op u toornen, of u bestraffen zal.", "Ps 51:17": "Heere, open mijn lippen, zo zal mijn mond Uw lof verkondigen.", "2 Kor 6:16": "Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Jer 30:19": "En van hen zal dankzegging uitgaan, en een stem van spelende mensen; en Ik zal hen vermeerderen, en zij zullen niet minder worden, en Ik zal hen verheerlijken, en zij zullen niet gering worden.", "Ps 47:3": "Want de HEERE, de Allerhoogste, is ontzagwekkend, een groot Koning over de hele aarde.", "Ps 50:5": "Verzamelt Mij Mijn gunstgenoten¹, die Mijn verbond maken met een offer!", "1 Tess 2:12": "en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Ps 135:8-12": "Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe. Hij zond tekenen en wonderen in het midden van u, o Egypte! tegen Farao en tegen al zijn knechten. Die veel volken sloeg, en machtige koningen doodde;", "Gen 6:7": "En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "Ex 32:3": "Toen rukte heel het volk de gouden oorringen af die in hun oren waren, en zij brachten ze bij Aäron.", "Deut 29:9": "Houdt dan de woorden van dit verbond, en doet ze; opdat u verstandig handelt in alles, wat u doen zult.", "Rom 11:7": "Wat dan? Wat Israël zoekt, dat heeft het niet verkregen; maar de uitverkorenen hebben het verkregen, en de anderen zijn verhard geworden.", "Job 24:12": "Uit de stad zuchten de mensen, en de ziel van de verwonden schreeuwt uit; toch rekent God het niet aan als ongerijmd.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "1 Kor 3:9": "Want wij zijn medearbeiders van God; akkerwerk van God, gebouw van God bent u.", "Ps 116:12-14": "Wat zal ik de HEERE vergelden voor al Zijn weldaden aan mij bewezen? Ik zal de beker der verlossingen opnemen, en de Naam van de HEERE aanroepen. Mijn geloften zal ik de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk.", "Jer 31:35-37": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam: Als deze ordeningen van voor Mijn aangezicht zullen wijken, spreekt de HEERE, dan zal ook het nageslacht van Israël ophouden een volk te zijn voor Mijn aangezicht, alle dagen. Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "Luk 1:51": "Hij heeft een krachtig werk gedaan met Zijn arm; Hij heeft de hoogmoedigen verstrooid in de gedachten van hun hart.", "Ps 107:1-43": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft. En hen die Hij uit de landen verzameld heeft, van het oosten en van het westen, van het noorden en van de zee.", "Gen 49:20": "Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.", "Ps 145:15": "Ain. Aller ogen wachten op U; en U geeft hun hun voedsel op de juiste tijd.", "Hos 2:7": "Zij erkent echter niet dat Ik haar het koren, de nieuwe wijn, en de olie gegeven heb, en haar het zilver en goud vermeerderd heb, dat zij voor de Baäl gebruikt hebben.", "Hos 2:19": "En Ik zal u aan Mij verloven in geloof; en u zult de Heere kennen.", "Ps 96:7-9": "Geeft de HEERE, geslachten van de volken! Geeft de HEERE eer en sterkte. Geeft de HEERE de eer van Zijn Naam; brengt een offer, en komt in Zijn voorhoven. Aanbidt de HEERE in de heerlijkheid van het heiligdom; beeft voor Zijn aangezicht, heel de aarde.", "Jer 32:41": "En Ik zal Mij over hen verblijden, dat Ik hun goeddoe; en Ik zal hen trouw in dat land planten, met Mijn hele hart en met Mijn hele ziel.", "Rom 9:19": "U zult dan tegen mij zeggen: Wat heeft Hij dan nog aan te klagen? Want wie heeft Zijn wil weerstaan?", "Lev 25:20-22": "En als u zou zeggen: Wat zullen wij eten in het zevende jaar! Zie, wij zullen niet zaaien, en onze opbrengst niet inzamelen; Dan zal Ik Mijn zegen gebieden over u in het zesde jaar, dat het de opbrengst voor drie jaar zal voortbrengen. Het achtste jaar nu zult u zaaien, en zult van de oude opbrengst eten, tot het negende jaar toe; totdat zijn opbrengst binnengekomen is, zult u het oude eten.", "Mal 1:2": "Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad,", "Gen 28:21": "en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn!", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Joh 17:6": "Ik heb Uw Naam geopenbaard aan de mensen die U Mij uit de wereld gegeven hebt. Zij waren van U, en U hebt Mij hen gegeven; en zij hebben Uw woord bewaard.", "Jes 45:20": "Verzamel u, en kom, treed hier samen toe, u die van de heidenvolken ontkomen bent! Zij weten niets, zij die hun houten gesneden beelden dragen, en een god aanbidden die niet verlossen kan.", "Ps 71:14": "Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.", "Ps 145:1-21": "Een lofzang van David. Aleph. O mijn God, U Koning! Ik zal U verhogen, en Uw Naam loven voor eeuwig en altijd. Beth. Elke dag zal ik U loven, en Uw Naam prijzen voor eeuwig en altijd. Gimel. De HEERE is groot en zeer te prijzen, en Zijn grootheid is ondoorgrondelijk.", "Luk 1:78": "door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;", "Dan 7:10": "Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.", "Ps 22:24": "U die de HEERE vreest, prijs Hem; al u nageslacht van Jakob, vereer Hem; en ontzie u voor Hem, al u nageslacht van Israël!", "Jes 63:16": "U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.", "Ps 96:8": "Geeft de HEERE de eer van Zijn Naam; brengt een offer, en komt in Zijn voorhoven.", "Ps 106:45": "En Hij dacht tot hun voordeel aan Zijn verbond, en het berouwde Hem naar de veelheid van Zijn blijken van goedertierenheid.", "Matt 9:23": "En toen Jezus in het huis van de leider kwam, en de fluitspelers zag en de rumoerige menigte,", "1 Kor 10:26": "want de aarde is van de Heere, en al wat zij bevat.", "Gen 12:6": "En Abram trok door dat land, tot aan de plaats Sichem, tot aan het eikenbos More; en de Kanaänieten waren toen in dat land.", "Gen 18:20": "Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Neh 9:5": "En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!", "Ps 145:8": "Cheth. Genadig en barmhartig is de HEERE, geduldig en groot van goedertierenheid.", "Ps 138:1": "Een psalm van David. Ik zal U loven met mijn hele hart; in de tegenwoordigheid van de goden zal ik U psalmzingen.", "2 Petr 2:7-9": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft; (want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden); dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Ps 37:19": "Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Jer 32:17": "Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.", "Jer 10:2": "Zo zegt de HEERE: Leert de weg van de heidenen niet, en schrikt niet van de tekenen van de hemel, omdat de heidenen daarvan schrikken.", "Ps 147:15-18": "Hij zendt Zijn bevel over de aarde; Zijn woord loopt zeer snel. Hij geeft sneeuw als wol; Hij strooit de rijp als as. Hij werpt Zijn ijs neer als stukken; wie kan standhouden voor Zijn koude?", "Ps 21:14": "Verhoog U, HEERE! In Uw sterkte; zo zullen wij zingen, en Uw macht met psalmen loven.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Ps 33:13": "De HEERE kijkt uit de hemel, en ziet alle mensenkinderen.", "Hos 11:3": "Ik echter leerde Efraïm lopen; Hij nam ze op Zijn armen, maar zij erkenden niet dat Ik ze genas.", "Joh 6:37": "Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.", "Dan 2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Job 26:7-14": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets. Hij bindt het water in Zijn wolken; toch scheurt de wolk daaronder niet. Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "Ps 113:5": "Wie is gelijk de HEERE, onze God? Die zeer hoog woont.", "Ps 34:9": "Teth. Proeft en ziet dat de HEERE goed is; gelukkig is de man die op Hem vertrouwt.", "Klaagl 3:38": "Mem. Gaat niet uit de mond van de Allerhoogste het kwade en het goede?", "2 Kron 30:27": "Toen stonden de Levitische priesters op, en zegenden het volk; en hun stem werd gehoord; want hun gebed kwam tot Zijn heilige woning in de hemel.", "Ps 112:1": "Halleluja! Aleph. Gelukkig is de man, die de HEERE vreest; Beth. die grote lust heeft in Zijn geboden.", "Richt 2:18": "En wanneer de HEERE hun richters verwekte, zo was de HEERE met de richter, en verloste hen uit de hand van hun vijanden, al de dagen van de richter; want het berouwde de HEERE vanwege hun zuchten om hen die hen drongen en die hen drukten.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "1 Tess 1:4": "Wij weten, geliefde broeders, dat u door God uitgekozen bent;", "Ps 97:4": "Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft.", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "Ps 18:26": "Bij de goedertierene houdt U Zich goedertieren, bij de oprechte man houdt U Zich oprecht.", "1 Kron 16:37-42": "Zo liet hij daar, voor de ark van het verbond van de HEERE, Asaf en zijn broeders, om voortdurend te dienen voor de ark, naarmate op elke dag besteld was. Obed-Edom nu, met hun broeders, waren achtenzestig; en hij stelde Obed-Edom, de zoon van Jeduthun, en Hosa, aan tot poortwachters; En de priester Zadok, en zijn broeders, de priesters, voor de tabernakel van de HEERE op de hoogte, die te Gibeon is;", "Luk 1:50": "En Zijn barmhartigheid is van geslacht tot geslacht over hen die Hem vrezen.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Ps 102:22": "Opdat men de Naam van de HEERE vertelt te Sion, en Zijn lof te Jeruzalem;", "Ps 66:1": "Een lied, een psalm, voor de koorleider. Juicht tot God, heel de aarde!", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "Dan 3:4": "En een heraut riep met kracht: Men zegt u aan, u volken, u naties en tongen!", "Ps 97:1": "De HEERE regeert, de aarde verheugt zich; laat veel eilanden zich verblijden.", "Ps 66:3": "Zegt tot God: Hoe ontzagwekkend bent U in Uw werken! Om de grootheid van Uw sterkte zullen Uw vijanden zich geveinsd aan U onderwerpen.", "1 Kon 20:42": "En hij zei tegen hem: Zo zegt de HEERE: Omdat u de man, die Ik verbannen had, uit uw hand hebt laten gaan, zal uw leven in de plaats van zijn leven zijn, en uw volk in de plaats van zijn volk.", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "1 Petr 1:20": "Die al vóór de grondlegging van de wereld voorbestemd was, maar in deze laatste tijden geopenbaard is omwille van u,", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Job 5:10": "Die de regen geeft op de aarde, en water zendt op de straten;", "Deut 1:10": "De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel.", "Ps 134:2": "Hef uw handen op naar het heiligdom, en loof de HEERE.", "2 Kron 35:15": "En de zangers, de zonen van Asaf, waren op hun standplaats, naar het gebod van David, en Asaf, en Heman, en Jeduthun, de ziener van de koning, alsook de poortwachters bij elke poort; zij hoefden niet te wijken van hun dienst, want hun broeders, de Levieten, bereidden voor hen.", "Ps 76:10": "Toen God opstond ten oordeel, om alle zachtmoedigen van de aarde te verlossen. Sela.", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "Job 28:26": "Toen Hij voor de regen een vaste orde maakte, en een weg voor het weerlicht van de donders;", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "Ps 145:16": "Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen.", "Job 22:25": "Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "Ex 15:27": "Toen kwamen zij bij Elim, en daar waren twaalf waterbronnen, en zeventig palmbomen; en zij legerden zich daar aan de wateren.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Deut 7:1-3": "Wanneer de HEERE, uw God, u gebracht zal hebben in het land waar u naar toe gaat om het te erven, en Hij vele volken voor uw aangezicht zal hebben uitgeworpen, de Hethieten, en de Girgasieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, en de Hevieten, en de Jebusieten, zeven volken, die groter en machtiger zijn dan u, en de HEERE, uw God, hen aan u zal hebben overgegeven, zodat u hen verslaat, dan moet u hen helemaal met de ban vernietigen; u zult geen verbond met hen maken, en hun ook niet genadig zijn. U zult zich ook niet met hen verzwageren; uw dochters zult u niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "Ps 118:28": "U bent mijn God, daarom zal ik U loven; o mijn God, ik zal U verhogen.", "Job 41:1": "Niemand is zo dapper, dat hij hem opwekken zou; wie is dan hij, die zich voor Mijn aangezicht stellen zou?", "Matt 25:34": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld.", "Pred 3:17": "Ik zei in mijn hart: God zal de rechtvaardige en de goddeloze oordelen; want daar is de tijd voor alle voornemen, en over alle werk.", "Ps 103:20-22": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord. Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet! Loof de HEERE, al Zijn werken! Aan alle plaatsen van Zijn heerschappij. Loof de HEERE, mijn ziel!", "1 Sam 2:6-8": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Dan 6:27": "Van mij is een bevel uitgegaan, dat men in de hele heerschappij van mijn koninkrijk moet beven en sidderen voor het aangezicht van de God van Daniël; want Hij is de levende God, en blijvend in eeuwigheid, en Zijn koninkrijk gaat niet te gronde, en Zijn heerschappij duurt tot het einde toe.", "Job 36:11": "Als zij horen, en Hem dienen, dan zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.", "Deut 7:7": "De HEERE heeft geen liefde tot u opgevat, en u niet uitgekozen, om uw grote aantal boven alle andere volken; want u was het minste van alle volken.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "Deut 11:2": "En u zult heden weten, dat ik niet spreek met uw kinderen, die het niet weten, en de vermaning van de HEERE, uw God, niet gezien hebben. Zijn grootheid, Zijn sterke hand en Zijn uitgestrekte arm;", "1 Kron 29:11": "Van U, o HEERE, is de grootheid, en de macht, en de heerlijkheid, en de overwinning, en de majesteit; want alles wat in de hemel en op aarde is, is van U: van U, o HEERE, is het Koninkrijk, en U hebt Uzelf verhoogd tot een Hoofd boven alles.", "Zach 9:17": "Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Ps 115:16": "Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.", "Ps 119:156": "HEERE! Uw barmhartigheden zijn vele; maak mij levend naar Uw rechten.", "1 Sam 5:4": "Toen zij nu de volgende dag 's morgens vroeg opstonden, zie, Dagon lag voorover op de aarde gevallen voor de ark van de HEERE; maar het hoofd van Dagon, en de beide palmen van zijn handen, afgehouwen, lagen bij de drempel; alleen de romp van Dagon was ervan overgebleven.", "Ps 113:4": "De HEERE is hoog boven alle heidenvolken, boven de hemelen is Zijn heerlijkheid.", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Klaagl 1:18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.", "Deut 32:8": "Toen de Allerhoogste aan de volken de erfenis uitdeelde, toen Hij Adams kinderen van elkaar scheidde, heeft Hij de grenzen van de volken vastgesteld naar het getal van de kinderen van Israël.", "Ps 9:9": "En Hij Zelf zal de wereld richten in gerechtigheid, en de volken oordelen in rechtmatigheden.", "2 Kron 20:21": "Hij nu overlegde met het volk, en hij stelde voor de HEERE zangers aan, die de heilige Majesteit zouden prijzen, uitgaande voor de toegeruste troepen, en die zeiden: Loof de HEERE, want Zijn goedertierenheid is voor eeuwig!", "Amos 6:5": "Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "Ps 89:10": "Gij heerst over de opgeblazenheid van de zee; wanneer haar baren zich verheffen, dan stilt Gij ze.", "Jes 41:8": "Maar u, Israël, Mijn knecht! U, Jakob, die Ik uitgekozen heb! Het nageslacht van Abraham, die Mij liefheeft!", "Ps 107:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Jer 10:8": "In één ding zijn zij toch redeloos en dwaas: een stuk hout is een onderwijs van de ijdelheden.", "1 Sam 12:21": "En wijk niet af; want dan zou u de nietige afgoden achterna gaan, die niet baten, noch verlossen, want zij zijn nietig.", "Rom 8:31": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn?", "Job 26:14": "Zie, dit zijn nog maar de uiterste randen van Zijn wegen; en wat een klein stukje van de zaak hebben wij van Hem gehoord? Wie zou dan de donder van Zijn machtige daden kunnen begrijpen?", "Ps 145:17": "Tsade. De HEERE is rechtvaardig in al Zijn wegen, en goedertieren in al Zijn werken.", "Ps 48:15": "Want deze God is onze God eeuwig en altoos; Hij zal ons geleiden tot de dood toe.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Matt 12:50": "Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Deut 15:4": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten;", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "Mal 1:3": "en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.", "1 Kon 18:1": "En het gebeurde na veel dagen, dat het woord van de HEERE tot Elia gebeurde, in het derde jaar: Ga heen, vertoon u aan Achab; want Ik zal regen geven op de aardbodem.", "Hos 14:2-9": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Ezech 34:31": "U nu, o Mijn schapen, schapen van Mijn weide! U bent mensen; maar Ik ben uw God, spreekt de Heere HEERE.", "Ps 33:15": "Hij vormt hun aller hart; Hij let op al hun werken.", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Ps 25:6": "Zain. Gedenk, HEERE! Uw barmhartigheden en Uw blijken van goedertierenheid, want die zijn er van eeuwigheid.", "Rom 1:6": "onder wie u ook bent, geroepenen van Jezus Christus!)", "Jer 27:6": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Richt 6:31": "Maar Joas zei tegen allen die bij hem stonden: Wilt u voor Baäl strijden? Wilt u hem redden? Wie voor hem strijdt, zal nog deze morgen gedood worden! Als hij een god is, laat hij dan voor zichzelf strijden, omdat men zijn altaar heeft omgeworpen.", "2 Kon 13:23": "Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "1 Kon 8:51-53": "want zij zijn Uw volk en Uw erfdeel, die U uitgevoerd hebt uit Egypteland, uit het midden van de ijzeren oven; opdat Uw ogen open zijn tot de smeking van Uw dienaar, en tot de smeking van Uw volk Israël, om naar hen te horen, in al hun roepen tot U. Want U hebt hen voor Uzelf tot een erfdeel afgezonderd, uit alle volken van de aarde; zoals U gesproken hebt door de dienst van Mozes, Uw dienaar, toen U onze vaderen uit Egypte uitvoerde, Heere HEERE!", "Job 36:19": "Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht?", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Ps 34:10": "Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.", "Ps 136:13-15": "Hem, Die de Schelfzee in stukken deelde; want Zijn goedertierenheid is voor eeuwig. En Israël erdoorheen liet gaan; want Zijn goedertierenheid is voor eeuwig. Farao met zijn leger stortte Hij in de Schelfzee; want Zijn goedertierenheid is voor eeuwig.", "Jes 14:27": "Want de HEERE van de heerscharen heeft het in Zijn raad besloten, wie zal het dan verbreken? en Zijn hand is uitgestrekt, wie zal die dan keren?", "Matt 6:26": "Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven?", "Ps 130:8": "En Hij zal Israël verlossen van al zijn ongerechtigheden.", "Jes 46:1": "Bel is gekromd, Nebo wordt neergebogen, hun afgoden zijn geworden voor de dieren en voor de beesten; uw opgeladen pakken zijn een last voor de vermoeide beesten.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Job 33:12-30": "Zie, hierin bent u niet rechtvaardig, antwoord ik u; want God is meerder dan een mens. Waarom hebt u tegen Hem getwist? Want Hij antwoordt niet van al Zijn daden. Maar God spreekt eens of tweemaal; doch men let daar niet op.", "Klaagl 3:50": "Ain. Totdat de HEERE van de hemel neerkijkt, en het ziet.", "Deut 15:4-6": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten; Als u alleen maar de stem van de HEERE, uw God, vlijtig gehoorzaamt, zodat u erop let te doen al deze geboden die ik u vandaag gebied. Want de HEERE, uw God, zal u zegenen, zoals Hij tot u heeft gesproken; zo zult u aan veel volken lenen, maar u zult niet lenen; en u zult over veel volken heersen, maar over u zullen zij niet heersen.", "Luk 12:22-31": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u: wees niet bezorgd voor uw leven, wat u eten zult, en ook niet voor het lichaam, waarmee u zich kleden zult. Het leven is meer dan het voedsel, en het lichaam meer dan de kleding. Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard?", "Jer 20:12": "Gij dan, o HEERE van de heerscharen, Die de rechtvaardige beproeft, Die de nieren en het hart ziet, laat mij Uw wraak op hen zien, want ik heb U mijn rechtszaak voorgelegd.", "Lev 26:4-10": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen. Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Ps 18:51": "Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid.", "Matt 10:32": "Ieder dan die Mij belijden zal voor de mensen, die zal Ik ook belijden voor Mijn Vader, Die in de hemelen is.", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Ps 26:12": "Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.", "Deut 33:27": "De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Rom 4:21": "En was ten volle verzekerd, dat wat beloofd was, Hij ook machtig was te doen.", "Hand 16:25": "En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen.", "1 Sam 24:16": "Doch de HEERE zal Rechter zijn, en rechtspreken tussen mij en tussen u, en zien daarin, en mijn geschil beslechten, en mij redden uit uw hand.", "1 Kon 8:30": "Hoor dan naar de smeking van Uw dienaar, en van Uw volk Israël, die op deze plaats zullen bidden; en hoor Ú in de plaats van Uw woning, in de hemel, ja, hoor, en vergeef.", "1 Kron 22:6": "Toen riep hij zijn zoon Salomo, en gebood hem voor de HEERE, de God van Israël, een huis te bouwen.", "2 Kor 13:14": "De genade van de Heere Jezus Christus, en de liefde van God, en de gemeenschap van de Heilige Geest, zij met u allen. Amen. De tweede brief aan de Korinthiërs werd door Titus en Lukas geschreven vanuit Filippi, een stad in Macedonië.", "Ps 68:33-36": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.", "Jes 46:2": "Samen zijn zij neergebogen, zij zijn gekromd, zij hebben de last niet kunnen redden, maar zijzelf zijn in de gevangenis gegaan.", "Ps 118:16": "De rechterhand van de HEERE is verhoogd; de rechterhand van de HEERE doet krachtige daden.", "Ex 6:6": "En Ik zal u tot Mijn volk aannemen, en Ik zal u tot een God zijn; en u zult weten dat Ik de HEERE uw God ben, Die u uitleidt van onder de lasten van de Egyptenaren.", "Rom 1:25": "als degenen die de waarheid van God veranderd hebben in de leugen, en het schepsel geëerd en gediend hebben boven de Schepper, Die te prijzen is tot in eeuwigheid, amen.", "Jes 1:5": "Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.", "Ps 40:6": "Gij, o HEERE, mijn God! hebt Uw wonderen en Uw gedachten aan ons vele gemaakt, men kan ze niet in orde bij U verhalen; zal ik ze verkondigen en uitspreken, dan zijn ze menigvuldiger dan dat ik ze zou kunnen vertellen.", "Job 34:24": "Hij vermorzelt de geweldigen, dat men het niet doorzoeken kan, en stelt anderen in hun plaats.", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Jer 32:20": "U, Die tekenen en wonderen gesteld hebt in het land Egypte, tot op deze dag, zowel in Israël als onder andere mensen, en U hebt Uzelf een Naam gemaakt, zoals dat op deze dag nog blijkt!", "1 Kron 16:33": "Dan zullen de bomen van het woud juichen voor het aangezicht van de HEERE, omdat Hij komt om de aarde te richten.", "Ps 135:6-12": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden. Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort. Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe.", "Jer 15:6": "U hebt Mij verlaten, spreekt de HEERE; u bent achterwaarts gegaan; daarom zal Ik Mijn hand tegen u uitstrekken en u vernietigen; Ik ben het van het berouwen moe geworden.", "Hab 2:18": "Wat zal het gesneden beeld baten, dat zijn maker het gesneden heeft? Of het gegoten beeld, dat een leraar van leugens is, dat de maker op zijn maaksel vertrouwt, wanneer hij stomme afgoden gemaakt heeft?", "Tit 3:4": "Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is,", "Jes 63:12": "Die de arm van Zijn heerlijkheid heeft laten gaan aan de rechterhand van Mozes; Die de wateren voor hun aangezicht kliefde, opdat Hij Zich een eeuwige Naam maakte?", "Jer 51:10": "De HEERE heeft onze gerechtigheden hervoor gebracht; kom en laat ons in Sion het werk van de HEERE, onze God, vertellen!", "Ps 116:19": "in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "Ezech 18:31": "Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Openb 19:1": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God.", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Ps 106:8": "Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.", "Dan 9:4": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Ex 15:20": "En Mirjam, de profetes, de zuster van Aäron, nam een trommel in haar hand; en alle vrouwen gingen achter haar aan, met trommels en met reidansen.", "Job 23:7": "Daar zou de oprechte met Hem pleiten; en ik zou mij voor eeuwig van mijn Rechter vrijmaken.", "Ps 33:12": "Gelukkig is het volk wiens God de HEERE is; het volk, dat Hij Zich als erfdeel heeft uitgekozen.", "Ps 33:11": "Maar de raad van de HEERE bestaat in eeuwigheid, de gedachten van Zijn hart van geslacht tot geslacht.", "2 Kor 9:8-10": "En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk. Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid. Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid;", "Deut 4:31": "Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Job 8:7": "Uw begin zal wel gering zijn geweest, maar uw einde zal zeer toenemen.", "Nahum 2:4": "De wagens razen door de wijken, zij lopen heen en weer op de straten; hun verschijning is als die van fakkels, zij lopen door elkaar heen als de bliksems.", "Ezech 18:25": "Nog zegt u: De weg van de Heere is niet recht; hoor nu, o huis van Israël! Is Mijn weg niet recht? Zijn niet uw wegen onrecht?", "1 Kron 21:26": "Toen bouwde David daar voor de HEERE een altaar, en hij offerde brandoffers en dankoffers. Toen hij de HEERE aanriep, antwoordde Hij hem door vuur uit de hemel, op het brandofferaltaar.", "Dan 7:9": "Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.", "Ezech 1:13": "Wat de gelijkenis van de levende wezens betreft, hun gedaante was als brandende kolen van vuur, als de gedaante van fakkels; dat vuur ging steeds tussen die levende wezens; en het vuur had een glans, en uit het vuur kwam een bliksem voort.", "Ps 74:13": "U hebt door Uw sterkte de zee gespleten; U hebt de koppen van de draken in het water verbroken.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Jes 24:14-16": "Die zullen hun stem opheffen, zij zullen vrolijk zingen; vanwege de heerlijkheid van de HEERE zullen zij juichen vanaf de zee. Daarom eert de HEERE in de valleien, in de eilanden van de zee de Naam van de HEERE, de God van Israël. Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.", "Pred 5:18": "Ook: ieder mens aan wie God rijkdom en bezittingen gegeven heeft, en aan wie Hij de macht geeft om daarvan te eten, en om zijn deel te nemen, en om zich te verheugen in zijn arbeid, dat is een gave van God.", "Luk 12:24-28": "Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard? Wie van u kan door bezorgd te zijn één el aan zijn lengte toevoegen? Als u dan zelfs het kleinste niet kunt, waarom bent u dan bezorgd over de andere dingen?", "Jes 12:6": "Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.", "Openb 9:20": "En de overige mensen, die niet gedood zijn door deze plagen, hebben zich niet bekeerd van de werken van hun handen, om de duivelen niet meer te aanbidden; en de gouden, en zilveren, en koperen, en stenen, en houten afgoden, die noch kunnen zien, noch horen, noch lopen;", "Gen 24:3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "Hos 8:4": "Zij hebben koningen aangesteld, maar niet door Mij; zij hebben vorsten aangesteld, maar Ik heb het niet erkend; van hun zilver en hun goud hebben zij voor zichzelf afgoden gemaakt, zodat zij uitgeroeid worden.", "Ps 75:7": "Want het verhogen komt niet uit het oosten, noch uit het westen, noch uit de woestijn;", "Ps 78:4-72": "Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft. Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Ps 92:2-4": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste! Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten; Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.", "Ef 2:4-7": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "1 Kor 14:15": "Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen.", "Mark 16:19": "De Heere dan, nadat Hij tot hen gesproken had, is opgenomen in de hemel, en zit aan de rechterhand van God.", "Deut 8:18": "Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "Ezech 14:23": "Zo zullen zij u vertroosten, wanneer u hun weg en hun handelingen zult zien; en u zult weten dat Ik niet zonder reden heb gedaan al wat Ik in haar gedaan heb, spreekt de Heere HEERE.", "Ps 9:8": "Maar de HEERE zal in eeuwigheid zitten; Hij heeft Zijn troon bereid ten gerichte.", "Dan 4:25": "Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil.", "1 Kron 17:8": "En Ik ben met u geweest overal waar u heen bent gegaan, en Ik heb al uw vijanden voor u uitgeroeid; en Ik heb u een naam gemaakt, gelijk de naam van de groten die op de aarde zijn.", "Ezech 26:13": "Zo zal Ik het gedreun van uw liederen doen ophouden, en het geschal van uw harpen zal niet meer gehoord worden.", "Dan 5:23": "Maar u hebt uzelf verheven tegen de Heere van de hemel, en men heeft de vaten van Zijn huis voor u gebracht, en u, en uw leiders, uw vrouwen, en uw bijvrouwen hebben daaruit wijn gedronken, en de goden van zilver en goud, koper, ijzer, hout en steen, die niet zien, niet horen, en niet weten, hebt u geprezen; maar die God, in Wiens hand uw adem is, en aan Wie al uw wegen toebehoren, hebt u niet verheerlijkt.", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "Luk 1:77": "om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de
