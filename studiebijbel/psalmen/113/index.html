k verhoogt;","8":"Om te doen zitten bij de prinsen, bij de prinsen Zijns volks.","9":"Die de onvruchtbare doet wonen met een huisgezin, een blijde moeder van kinderen. Hallelujah!"},"KJV":{"1":"Praise ye the LORD. Praise, O ye servants of the LORD, praise the name of the LORD.","2":"Blessed be the name of the LORD from this time forth and for evermore.","3":"From the rising of the sun unto the going down of the same the LORD'S name *is* to be praised.","4":"The LORD *is* high above all nations, *and* his glory above the heavens.","5":"Who *is* like unto the LORD our God, who dwelleth on high,","6":"Who humbleth *himself* to behold *the things that are* in heaven, and in the earth!","7":"He raiseth up the poor out of the dust, *and* lifteth the needy out of the dunghill;","8":"That he may set *him* with princes, *even* with the princes of his people.","9":"He maketh the barren woman to keep house, *and to be* a joyful mother of children. Praise ye the LORD."}},"tsk":{"1":[{"kopje":"Halleluja","refs":["Ps 112:1"]},{"kopje":"Loof","refs":["Ps 33:1","Ps 33:2","Ps 103:20","Ps 103:21","Ps 134:1","Ps 135:1-3","Ps 135:20","Ps 145:10","Ef 5:19","Ef 5:20","Openb 19:5"]}],"4":[{"kopje":"hoog","refs":["Ps 97:9","Ps 99:2","Jes 40:15","Jes 40:17","Jes 40:22"]},{"kopje":"Zijn heerlijkheid","refs":["Ps 8:2","Ps 57:11","Ps 57:12","1 Kon 8:27","Jes 66:1"]}],"5":[{"kopje":"gelijk","refs":["Ps 89:7","Ps 89:9","Ex 15:11","Deut 33:26","Jes 40:18","Jes 40:25","Jes 16:5","Jer 10:6"]}],"6":[{"kopje":"Die zeer laag ziet","refs":["Ps 11:4","Job 4:18","Job 15:15","Jes 6:2"]},{"kopje":"op de aarde","refs":["Ps 138:6","Jes 57:15","Jes 66:2"]}],"7":[{"kopje":"opricht","refs":["Ps 75:7","Ps 75:8","Ps 107:41","Job 5:11","Job 5:15","Job 5:16","Ezech 17:24","Ezech 21:26","Ezech 21:27","Luk 1:52","Luk 1:53","Jak 2:5"]},{"kopje":"uit","refs":["Ps 22:16","Jes 26:19","Dan 12:2","Dan 12:3","Hand 2:31-33","Ef 1:20","Ef 1:21","1 Petr 3:21","1 Petr 3:22"]},{"kopje":"behoeftige","refs":["1 Sam 2:7","1 Sam 2:8     if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
