euwigheid! Amen, ja, amen.", "Ps 147:1": "Looft de HEERE, want onze God te bezingen is goed, omdat Hij liefelijk is; de lof is Hem waardig.", "Ps 57:8-10": "Mijn hart is standvastig, o God! mijn hart is standvastig; ik zal zingen en psalmzingen. Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o Heere! ik zal U psalmzingen onder de naties.", "Ps 109:30": "Ik zal de HEERE met mijn mond zeer loven, en te midden van velen zal ik Hem prijzen.", "Ps 138:1": "Een psalm van David. Ik zal U loven met mijn hele hart; in de tegenwoordigheid van de goden zal ik U psalmzingen.", "Ps 110:1-7": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten. De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden. Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Jak 2:5": "Luister, mijn geliefde broeders, heeft God niet de armen van deze wereld uitverkoren, om rijk te zijn in het geloof, en erfgenamen van het Koninkrijk, dat Hij belooft aan hen die Hem liefhebben?", "1 Kron 28:8": "Welnu, voor de ogen van heel Israël, de gemeente van de HEERE, en voor de oren van onze God: houd en zoek al de geboden van de HEERE, uw God; opdat u dit goede land erfelijk bezit, en het na u nalaat als erfenis aan uw kinderen tot in eeuwigheid.", "2 Petr 2:7-9": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft; (want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden); dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Hand 2:31-33": "Heeft hij, dit vooruitziend, gesproken over de opstanding van Christus, dat Zijn ziel niet verlaten is in het rijk van de dood, en Zijn vlees geen verderving heeft gezien. Deze Jezus heeft God opgewekt; daarvan zijn wij allen getuigen. Hij dan, door de rechterhand van God verhoogd, en de belofte van de Heilige Geest ontvangen hebbend van de Vader, heeft dit uitgestort, wat u nu ziet en hoort.", "1 Sam 2:8": "Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Ps 18:8-16": "Toen daverde en beefde de aarde, en de gronden van de bergen beroerden zich en daverden, omdat Hij ontstoken was. Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daarvan aangestoken. En Hij boog de hemel, en daalde neer, en donkerheid was onder Zijn voeten.", "Luk 2:10": "En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal;", "Ps 102:19-23": "Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven; Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben; Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Ps 37:19": "Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.", "Jes 55:10-13": "Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter; Zo zal Mijn woord, dat uit Mijn mond uitgaat, ook zijn, het zal niet leeg naar Mij terugkeren; maar het zal doen wat Mij behaagt, en het zal voorspoedig zijn in wat, waartoe Ik het zend. Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "Zach 14:8-21": "Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn. En de HEERE zal Koning zijn over de hele aarde; op die dag zal de HEERE één zijn, en Zijn Naam één. Dit hele land zal rondom als een vlak veld gemaakt worden, van Geba tot Rimmon toe, zuidwaarts van Jeruzalem; en zij zal verhoogd en bewoond worden op haar plaats; van de poort van Benjamin af, tot aan de plaats van de eerste poort, tot aan de Hoekpoort toe; en van de toren van Hananeel, tot aan de wijnbakken van de koning toe.", "Job 22:12": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn.", "Luk 22:35": "En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.", "Ef 1:21": "Ver boven alle overheid, en macht, en kracht, en heerschappij, en elke naam die genoemd wordt, niet alleen in deze wereld, maar ook in de toekomende;", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Jes 54:1-3": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "Jes 24:23": "En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Joz 3:11": "Zie, de ark van het verbond van de Heere van de hele aarde gaat voor u door de Jordaan.", "Ps 89:12": "De hemel is van U, ook is de aarde van U; de wereld en haar volheid, die hebt Gij gegrond.", "Ps 96:10": "Zegt onder de heidenen: De HEERE regeert; ook zal de wereld vaststaan, zij zal niet wankelen; Hij zal de volken oordelen in alle rechtvaardigheid.", "Openb 6:2": "En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen!", "Ps 21:14": "Verhoog U, HEERE! In Uw sterkte; zo zullen wij zingen, en Uw macht met psalmen loven.", "Deut 33:26": "Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken.", "Ps 33:13": "De HEERE kijkt uit de hemel, en ziet alle mensenkinderen.", "Lev 26:10": "En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Hos 11:3": "Ik echter leerde Efraïm lopen; Hij nam ze op Zijn armen, maar zij erkenden niet dat Ik ze genas.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "2 Kron 2:6": "Doch wie zou de kracht hebben om voor Hem een huis te bouwen, aangezien de hemelen, ja, de hemel der hemelen, Hem niet bevatten kunnen? En wie ben ik, dat ik voor Hem een huis zou bouwen, behalve om reukwerk voor Zijn aangezicht aan te steken?", "Ps 22:30": "Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.", "Job 34:33": "Zal het van u zijn, hoe Hij iets vergelden zal, omdat u Hem versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "Jona 2:9": "Maar ik zal U offeren met de stem van de dankzegging; wat ik beloofd heb, zal ik betalen. Het heil is van de HEERE.", "Jes 33:5": "De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.", "Dan 12:1-13": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek. En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing. De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Dan 2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Hab 3:4-6": "En er was een glans als van het licht, Hij had hoornen aan Zijn hand, en daar was Zijn sterkte verborgen. Voor Zijn aangezicht ging de pestilentie, en de vurige kool ging voor Zijn voeten uit. Hij stond, en mat het land, Hij zag toe, en maakte de heidenvolken los, en de aloude bergen zijn verstrooid geworden; de heuvels van eeuwigheid hebben zich gebogen; de gangen van eeuwigheid zijn van Hem.", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Jes 62:9": "Maar wie het inzamelen, zullen het eten, en zij zullen de HEERE prijzen; en wie het bijeenbrengen, zullen het drinken in de voorhoven van Mijn heiligdom.", "Ex 20:18": "En al het volk zag de donderslagen, en de bliksemflitsen, en het geluid van de bazuin, en de rokende berg; toen het volk dit zag, weken zij terug en bleven op een afstand staan;", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Klaagl 3:38": "Mem. Gaat niet uit de mond van de Allerhoogste het kwade en het goede?", "Ps 112:1": "Halleluja! Aleph. Gelukkig is de man, die de HEERE vreest; Beth. die grote lust heeft in Zijn geboden.", "Ps 69:35": "Dat Hem prijzen de hemel en de aarde, de zeeën, en al wat daarin wemelt.", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "2 Kron 30:27": "Toen stonden de Levitische priesters op, en zegenden het volk; en hun stem werd gehoord; want hun gebed kwam tot Zijn heilige woning in de hemel.", "Klaagl 3:41": "Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "1 Tim 1:17": "De Koning nu der eeuwen, de onverderfelijke, de onzichtbare, de alleen wijze God, zij eer en heerlijkheid in alle eeuwigheid. Amen.", "2 Kor 7:6": "Doch God, Die de nederigen vertroost, heeft ons getroost door de komst van Titus.", "Jes 40:15": "Ziet, de volken zijn geacht als een druppel van een emmer, en als een stofje van de weegschaal; ziet, Hij werpt de eilanden weg als dun stof!", "Jak 5:13": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen.", "Ezech 17:24": "Zo zullen alle bomen van het veld weten dat Ik, de HEERE, de hoge boom vernederd heb, de nederige boom verheven heb, de groene boom verdroogd heb, en de droge boom bloeiend gemaakt heb; Ik, de HEERE, heb het gesproken, en zal het doen.", "Matt 13:31-33": "Een andere gelijkenis heeft Hij hun voorgehouden en zei: Het Koninkrijk der hemelen is gelijk aan een mosterdzaadje, dat een mens genomen heeft en in zijn akker gezaaid heeft; Dat wel het kleinste is van alle zaden, maar wanneer het opgegroeid is, is het het grootste van de tuingewassen, en het wordt een boom, zodat de vogels van de hemel komen en nestelen in zijn takken. Een andere gelijkenis sprak Hij tot hen: Het Koninkrijk der hemelen is gelijk aan zuurdesem, die een vrouw nam en verborg in drie maten van het meel, totdat het geheel gezuurd was.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "2 Kron 7:17": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Jes 61:1-11": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ps 68:33": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela.", "Jes 44:3-5": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Zach 8:20-23": "Zo zegt de HEERE van de heerscharen: Nog zal het gebeuren, dat de volken, en de inwoners van veel steden, komen zullen; En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan. Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "Matt 13:16": "Maar uw ogen zijn gelukkig, omdat zij zien, en uw oren, omdat zij horen.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "Luk 1:46-55": "En Maria zei: Mijn ziel maakt de Heere groot, en mijn geest verheugt zich in God, mijn Zaligmaker; omdat Hij de nederigheid van Zijn dienstmaagd heeft aangezien; want zie, van nu af aan zullen alle geslachten mij zalig spreken.", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Jes 51:2": "Kijk naar Abraham, uw vader, en naar Sara, die u gebaard heeft; want Ik riep hem, toen hij nog alleen was, en Ik zegende hem, en Ik vermenigvuldigde hem.", "Gen 30:6": "Toen zei Rachel: God heeft mij recht gedaan, en heeft ook mijn stem verhoord, en heeft mij een zoon gegeven; daarom noemde zij zijn naam Dan.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "Openb 20:1-3": "En ik zag een engel neerkomen uit de hemel, die de sleutel van het afgrond had, en een grote keten in zijn hand; En hij greep de draak, de oude slang, die de duivel is en satan, en bond hem duizend jaar; En wierp hem in het afgrond, en sloot hem daarin, en verzegelde het boven hem, opdat hij de volken niet meer verleiden zou, totdat de duizend jaar geëindigd zouden zijn. En daarna moet hij een korte tijd losgelaten worden.", "Jes 41:17-20": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten. Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen. Ik zal in de woestijn de cederboom, de sittimboom, en de mirteboom, en de olieboom zetten; Ik zal in de wildernis de denneboom, de beuk, en de busboom samen plaatsen;", "Jes 26:15": "U, o HEERE, had dit volk vermeerderd, U had dit volk vermeerderd; U was verheerlijkt; maar U hebt hen tot alle einden van het aardrijk ver weggedaan.", "Job 37:6": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui.", "Ps 140:14": "Zeker, de rechtvaardigen zullen Uw Naam loven; de oprechten zullen voor Uw aangezicht blijven.", "Ps 29:2-4": "Geef de HEERE de eer van Zijn Naam, aanbid de HEERE in de heerlijkheid van het heiligdom. De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid.", "Ps 24:7-10": "Heft uw hoofden op, poorten, en verhef u, eeuwige deuren, opdat de Koning der ere ingaat! Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat!", "Jes 2:2-5": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien. En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Jer 17:12": "Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.", "Jes 18:7": "In die tijd zal de HEERE van de heerscharen een geschenk gebracht worden van het volk dat lang en glad is, en van het volk dat gevreesd is van oudsher tot nu; een volk van regel en regel, en van vertreding, welks land de rivieren beroven; naar de plaats van de Naam van de HEERE van de heerscharen, naar de berg Sion.", "Ps 66:1": "Een lied, een psalm, voor de koorleider. Juicht tot God, heel de aarde!", "Mark 13:10": "En het Evangelie moet eerst gepredikt worden onder alle volken.", "Ezech 36:28-38": "En u zult wonen in het land dat Ik uw vaderen gegeven heb, en u zult Mij tot een volk zijn, en Ik zal u tot een God zijn. En Ik zal u verlossen van al uw onreinheden; en Ik zal roepen tot het koren, en zal dat vermenigvuldigen, en Ik zal geen honger op u leggen. En Ik zal de vrucht van het geboomte en de opbrengst van het veld vermenigvuldigen, opdat u de smaad van het honger niet meer ontvangt onder de heidenen.", "Jes 35:2": "Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God.", "Ps 97:1": "De HEERE regeert, de aarde verheugt zich; laat veel eilanden zich verblijden.", "Hand 14:17": "hoewel Hij Zichzelf toch niet zonder getuigenis gelaten heeft, doordat Hij goeddeed, ons vanuit de hemel regen en vruchtbare tijden gaf, en onze harten vervulde met voedsel en vreugde.", "Jes 40:5": "En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Job 11:17-19": "Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn. En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen; En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.", "Matt 16:18": "En Ik zeg u ook, dat u Petrus bent, en op deze petra zal Ik Mijn gemeente bouwen, en de poorten van de hel zullen haar niet overweldigen.", "Joh 8:35": "En de dienstknecht blijft niet eeuwig in het huis, de zoon blijft er eeuwig.", "Ps 37:25": "Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "Job 31:15": "Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Zach 14:8": "Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn.", "Dan 12:3": "De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Jes 44:6": "Zo zegt de HEERE, de Koning van Israël, en zijn Verlosser, de HEERE van de heerscharen: Ik ben de Eerste, en Ik ben de Laatste, en behalve Mij is er geen God.", "Deut 32:13": "Hij deed hem rijden op de hoogten van de aarde, zodat hij at van de opbrengsten van het veld; en Hij deed hem honing zuigen uit de steenrots, en olie uit de harde rots;", "Jona 4:6": "En God, de HEERE, liet een wonderboom groeien en die opschieten boven Jona, zodat er schaduw zou zijn over zijn hoofd, om hem te bevrijden van zijn ellende. En Jona verheugde zich over de wonderboom met grote blijdschap.", "Ps 37:22": "Want zijn gezegenden zullen de aarde erfelijk bezitten; maar zijn vervloekten zullen uitgeroeid worden.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "1 Kron 22:13": "Dan zult u voorspoedig zijn, als u erop toeziet om te doen de inzettingen en de rechten die de HEERE aan Mozes geboden heeft over Israël. Wees sterk en heb goede moed, wees niet bevreesd, en wees niet verslagen!", "Jes 11:1-10": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "1 Kron 16:31": "Laat de hemelen zich verblijden, en de aarde zich verheugen, en laat men onder de heidenen zeggen: De HEERE regeert.", "Ps 118:15": "In de tenten van de rechtvaardigen is een stem van gejuich en van het heil; de rechterhand van de HEERE doet krachtige daden.", "Jer 51:16": "Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Ps 146:1-10": "Halleluja! O mijn ziel, prijs de HEERE. Ik zal de HEERE prijzen in mijn leven; ik zal mijn God psalmzingen, terwijl ik nog ben. Vertrouw niet op prinsen, op een mensenkind, bij wie geen heil is.", "Openb 21:9-27": "En er kwam naar mij een van de zeven engelen, die de zeven schalen hadden, die vol geweest waren van de zeven laatste plagen, en hij sprak met mij en zei: Kom hier, ik zal u de Bruid tonen, de Vrouw van het Lam. En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God. En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Job 5:10": "Die de regen geeft op de aarde, en water zendt op de straten;", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Jes 25:6-8": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn. En Hij zal op deze berg verslinden het bewindsel van het aangezicht, waarmee alle volken bewonden zijn, en het deksel, waarmee alle naties bedekt zijn. Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Ps 23:1": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken.", "Ex 33:23": "En wanneer Ik Mijn hand zal hebben weggenomen, zult u Mijn achterste delen zien; maar Mijn aangezicht zal niet gezien worden!", "Deut 1:10": "De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel.", "2 Sam 7:8": "Nu dan, zo zult u tegen Mijn knecht, tegen David, zeggen: Zo zegt de HEERE van de heerscharen: Ik heb u genomen van de schaapskooi, van achter de schapen, om een voorganger te zijn over Mijn volk, over Israël.", "Ps 134:2": "Hef uw handen op naar het heiligdom, en loof de HEERE.", "Jes 45:6": "Opdat men weet, vanaf de opgang van de zon tot aan de ondergang, dat er buiten Mij niets is, Ik ben de HEERE, en niemand meer.", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Jes 49:13": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Luk 2:14": "Ere zij God in de hoogste hemelen, en vrede op aarde, in de mensen een welbehagen.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "Ps 145:16": "Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen.", "Amos 9:13": "Zie, de dagen komen, spreekt de HEERE, dat de ploeger de maaier zal bereiken, en de druiventreder de zaadzaaier; en de bergen zullen van zoete wijn druipen, en alle heuvels zullen smelten.", "Ef 1:12": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.", "Spr 14:11": "Het huis van de goddelozen zal weggevaagd worden; maar de tent van de oprechten zal bloeien.", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "1 Kon 2:4": "opdat de HEERE Zijn woord bevestigt, dat Hij over mij gesproken heeft, toen Hij zei: Als uw zonen hun weg bewaren, om voor Mijn aangezicht trouw, met hun hele hart en met hun hele ziel te wandelen, dan zal het u nooit ontbreken, zei Hij, aan een man op de troon van Israël.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Jer 33:9": "En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.", "Deut 5:25": "Maar nu, waarom zouden wij sterven? Want dit grote vuur zou ons verteren; als wij nog langer de stem van de HEERE, onze God, blijven horen, zouden wij sterven.", "Job 22:25": "Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "Spr 29:13": "De arme en de bedrieger ontmoeten elkaar; de HEERE verlicht hun beider ogen.", "Ps 107:38": "En Hij zegent hen, zodat zij zeer meer worden, en hun vee vermindert Hij niet.", "Ps 145:12": "Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk.", "Ps 135:20": "U, huis van Levi! looft de HEERE; u die de HEERE vreest! looft de HEERE.", "Joh 10:16": "Ik heb nog andere schapen, die niet van deze schaapskooi zijn; ook die moet Ik toebrengen; en zij zullen Mijn stem horen; en het zal worden één kudde, en één Herder.", "Ps 136:1-26": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Loof de God der goden; want Zijn goedertierenheid is voor eeuwig. Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Jer 31:7-9": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël. Zie, Ik zal ze aanbrengen uit het land van het noorden, en zal hen verzamelen van de einden van de aarde; onder hen zullen blinden en lammen zijn, zwangere vrouwen en barenden samen; met een grote menigte zullen zij hierheen terugkomen. Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "Jes 65:23": "Zij zullen niet tevergeefs arbeiden, noch baren voor verstoring; want zij zijn het nageslacht van de gezegenden van de HEERE, en hun nakomelingen met hen.", "Jer 27:5-7": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.", "Openb 12:7-9": "En er kwam strijd in de hemel: Michaël en zijn engelen streden tegen de draak, en de draak streed, ook zijn engelen; En zij hebben het niet gewonnen, en hun plaats werd niet meer gevonden in de hemel. En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen.", "Ps 118:28": "U bent mijn God, daarom zal ik U loven; o mijn God, ik zal U verhogen.", "Gen 17:20": "En wat Ismaël betreft, Ik heb u verhoord; zie, Ik heb hem gezegend, en zal hem vruchtbaar maken, en hem heel erg veel meer maken; twaalf vorsten zal hij voortbrengen, en Ik zal hem tot een groot volk maken;", "Ps 148:1": "Halleluja! Looft de HEERE uit de hemelen; looft Hem in de hoogste plaatsen!", "Ps 82:1": "Een psalm van Asaf. God staat in de vergadering van God; Hij oordeelt in het midden van de goden;", "Ps 107:15": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Ef 3:21": "Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.", "Ps 103:20-22": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord. Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet! Loof de HEERE, al Zijn werken! Aan alle plaatsen van Zijn heerschappij. Loof de HEERE, mijn ziel!", "Jer 31:37": "Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "1 Sam 2:6-8": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Jes 1:24": "Daarom spreekt de Heere, HEERE van de heerscharen, de Machtige van Israël: O wee! Ik zal Mij troosten over Mijn tegenstanders. Ik zal Mij wreken op Mijn vijanden.", "Dan 6:27": "Van mij is een bevel uitgegaan, dat men in de hele heerschappij van mijn koninkrijk moet beven en sidderen voor het aangezicht van de God van Daniël; want Hij is de levende God, en blijvend in eeuwigheid, en Zijn koninkrijk gaat niet te gronde, en Zijn heerschappij duurt tot het einde toe.", "Ps 103:2-5": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden;", "2 Sam 22:4": "Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.", "Ps 22:16": "Mijn kracht is verdroogd als een potscherf, en mijn tong kleeft aan mijn gehemelte; en U legt mij in het stof van de dood.", "Deut 12:28": "Neem het waar, en hoor al deze woorden die ik u gebied, opdat het u, en uw kinderen na u, goed gaat tot in eeuwigheid, als u zult gedaan hebben wat goed en recht is in de ogen van de HEERE, uw God.", "Job 5:24-26": "En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen. Ook zult u bevinden dat uw nageslacht talrijk zal zijn, en uw spruiten als het kruid van de aarde. U zult in ouderdom naar het graf gaan, zoals de korenhoop op zijn tijd wordt opgevoerd.", "2 Kron 20:3-30": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda. En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.", "Job 36:11": "Als zij horen, en Hem dienen, dan zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.", "Ps 8:5-7": "Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond? U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;", "Ps 81:14-17": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld! In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders. Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "1 Sam 24:15": "Achter wie is de koning van Israël uitgetrokken? Wie jaagt u na? Een dode hond, een enkele vlo!", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "1 Kron 29:11": "Van U, o HEERE, is de grootheid, en de macht, en de heerlijkheid, en de overwinning, en de majesteit; want alles wat in de hemel en op aarde is, is van U: van U, o HEERE, is het Koninkrijk, en U hebt Uzelf verhoogd tot een Hoofd boven alles.", "Zach 9:17": "Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "Jes 4:2": "Op die dag zal de SPRUIT van de HEERE tot sieraad en heerlijkheid zijn, en de vrucht van de aarde tot voortreffelijkheid en tot versiering voor hen die ontkomen zullen in Israël.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Jes 29:23": "want wanneer hij zijn kinderen, het werk van Mijn handen, zal zien in zijn midden, zullen zij Mijn Naam heiligen; en zij zullen de Heilige van Jakob heiligen, en de God van Israël vrezen.", "Ps 35:10": "Al mijn beenderen zullen zeggen: HEERE, wie is U gelijk! U, Die de ellendige redt van hem die sterker is dan hij, en de ellendige en de nooddruftige van zijn berover.", "Ps 83:19": "opdat zij weten dat U alleen met Uw Naam de HEERE bent, de Allerhoogste over de hele aarde.", "Ps 104:1-35": "Loof de HEERE, mijn ziel! O HEERE, mijn God! U bent zeer groot, U bent bekleed met majesteit en heerlijkheid. Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn. Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "Matt 24:29": "En meteen na de verdrukking van die dagen zal de zon verduisterd worden, en de maan zal haar licht niet geven, en de sterren zullen van de hemel vallen, en de krachten van de hemelen zullen beven.", "Jes 14:32": "Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben.", "Ps 115:16": "Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.", "Zef 3:12": "Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.", "Dan 2:47": "De koning antwoordde Daniël en zei: Het is werkelijk waar dat uw God een God der goden is, en een Heere der koningen, en Iemand Die geheimen openbaart, omdat u dit geheim hebt kunnen openbaren.", "Joël 2:18-26": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen. En de HEERE zal antwoorden en tegen Zijn volk zeggen: Ziet, Ik zend u het koren, en de most, en de olie, zodat u daarvan verzadigd zult worden; en Ik zal u niet meer overgeven tot een smaad onder de heidenen. En Ik zal hem die uit het noorden komt ver van u doen vertrekken, en hem wegdrijven in een dor en woest land, zijn voorkant naar de Oostzee, en zijn achterkant naar de verste zee; en zijn stank zal opgaan, en zijn vuiligheid zal opgaan; want hij heeft grote dingen gedaan.", "Ps 109:31": "Want Hij zal de behoeftige ter rechterhand staan, om hem te verlossen van hen die zijn ziel veroordelen.", "Ps 75:2": "Wij loven U, o God! Wij loven, dat Uw Naam nabij is; men vertelt Uw wonderen.", "Ps 72:2": "Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht.", "Ps 145:5": "He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden.", "Ps 97:12": "Rechtvaardigen, verblijd u in de HEERE, en spreek lof ter gedachtenis van Zijn heiligheid.", "Hebr 10:13": "verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.", "Jes 2:10": "Ga in de rotssteen, en verberg u in het stof, vanwege de schrik van de HEERE, en om de heerlijkheid van Zijn majesteit.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Jes 60:6": "Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.", "Luk 1:33": "En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Ps 72:8-11": "En hij zal heersen van de zee tot aan de zee, en van de rivier tot aan de einden van de aarde. De inwoners van dorre plaatsen zullen voor zijn aangezicht knielen, en zijn vijanden zullen het stof lekken. De koningen van Tharsis en de eilanden zullen geschenken aanbrengen; de koningen van Scheba en Seba zullen vereringen toevoeren.", "Job 29:5": "Toen de Almachtige nog met mij was, en mijn jongens rondom mij;", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "Ps 119:172": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid.", "Jes 33:13-24": "Hoort, u die ver weg bent, wat Ik gedaan heb; en u, die nabij bent, erken Mijn macht! De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen? Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Dan 5:26-28": "Dit is de uitleg van deze woorden: MENE; God heeft uw koninkrijk geteld, en Hij heeft het beëindigd. TEKEL; u bent op een weegschaal gewogen, en u bent te licht bevonden. PERES; uw koninkrijk is verdeeld, en het is aan de Meden en de Perzen gegeven.", "Ps 19:2-5": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen. De dag aan de dag stort overvloedig spraak uit, en de nacht aan de nacht toont wetenschap. Geen spraak, en geen woorden zijn er, waar hun stem niet wordt gehoord.", "Luk 24:53": "En zij waren voortdurend in de tempel, waar zij God loofden en dankten. Amen.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Openb 4:11": "U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.", "Deut 32:8": "Toen de Allerhoogste aan de volken de erfenis uitdeelde, toen Hij Adams kinderen van elkaar scheidde, heeft Hij de grenzen van de volken vastgesteld naar het getal van de kinderen van Israël.", "1 Sam 2:5": "Zij die verzadigd waren, hebben zich verhuurd om brood, en zij die hongerig waren, hebben opgehouden; totdat de onvruchtbare zeven heeft gebaard, en zij die veel kinderen had, krachteloos is geworden.", "Luk 1:13-15": "Maar de engel zei tegen hem: Wees niet bang, Zacharias! Want uw gebed is verhoord, en uw vrouw Elizabet zal u een zoon baren, en u zult hem Johannes noemen. En u zult blijdschap en vreugde hebben, en velen zullen zich over zijn geboorte verblijden. Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Ps 108:2-4": "O God! Mijn hart is bereid; ik zal zingen en psalmzingen, ook mijn eer. Ontwaak, u luit en harp! Ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o HEERE! En ik zal U psalmzingen onder de natiën.", "Ex 15:11": "O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet?", "Ps 135:19": "U, huis van Israël! looft de HEERE; u, huis van Aäron! looft de HEERE.", "Ps 32:11": "Verblijd u in de HEERE, en verheug u, rechtvaardigen! En zing vrolijk, alle oprechten van hart!", "Jes 48:21": "En: Zij hadden geen dorst, toen Hij hen leidde door de woeste plaatsen; Hij deed hun water uit de rotssteen vloeien; toen Hij de rotssteen kliefde, vloeide het water daarheen.", "Ps 144:12-15": "opdat onze zonen zijn als planten, die groot geworden zijn in hun jeugd; onze dochters als hoekstenen, uitgehouwen naar het voorbeeld van een paleis. Dat onze schuren vol zijn, de ene voorraad na de andere opleverend; dat onze kudden bij duizenden jongen werpen, ja, bij tienduizenden op onze velden zich vermenigvuldigen. Dat onze ossen goed beladen zijn; dat er geen inbraak is, geen uitval, geen gejammer op onze straten.", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "Jer 27:4-6": "En beveel hun om tegen hun heren te zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zo zult u tegen uw heren zeggen: Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "2 Kron 6:35": "Hoor dan uit de hemel hun gebed en hun smeking, en voer hun recht uit.", "Gen 4:25": "En Adam had opnieuw gemeenschap met zijn vrouw, en zij baarde een zoon, en zij noemde zijn naam Seth; want God heeft mij, zei zij, een ander nageslacht gegeven in de plaats van Abel; want Kaïn heeft hem doodgeslagen.", "Joh 13:31": "Toen hij dan naar buiten gegaan was, zei Jezus: Nu is de Zoon des mensen verheerlijkt, en God is in Hem verheerlijkt.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Jer 3:17": "In die tijd zullen zij Jeruzalem noemen: de troon van de HEERE; en alle heidenvolken zullen daar samenkomen, vanwege de Naam van de HEERE, in Jeruzalem; en zij zullen niet meer wandelen naar het goeddunken van hun slechte hart.", "Ex 40:34": "Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid van de HEERE vervulde de tabernakel.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Hos 2:20": "En het zal op die dag gebeuren, dat Ik verhoren zal, spreekt de Heere; Ik zal de hemel verhoren, en die zal de aarde verhoren.", "Dan 6:21-23": "Toen hij nu bij de kuil gekomen was, riep hij naar Daniël met droevige stem; de koning antwoordde en zei tegen Daniël: O Daniël, dienaar van de levende God! heeft ook uw God, Die u voortdurend eert, u uit de macht van de leeuwen kunnen verlossen? Toen sprak Daniël tegen de koning: O koning, leef voor eeuwig! Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Ezech 17:22": "Zo zegt de Heere HEERE: Ik zal ook van de opperste tak van de hoge ceder nemen, dat Ik zal planten; van de top van zijn jonge takjes zal Ik een teer takje afplukken, dat Ik op een hoge en verheven berg planten zal;", "Joh 3:30": "Hij moet meer worden, maar ik minder.", "Spr 3:2": "Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Ps 118:14": "De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Ezech 17:22-24": "Zo zegt de Heere HEERE: Ik zal ook van de opperste tak van de hoge ceder nemen, dat Ik zal planten; van de top van zijn jonge takjes zal Ik een teer takje afplukken, dat Ik op een hoge en verheven berg planten zal; op de berg van de hoogte van Israël zal Ik hem planten; en hij zal takken voortbrengen, en vrucht dragen, en hij zal tot een heerlijke ceder worden, zodat onder hem alle vogels van allerlei vleugel zullen wonen; in de schaduw van zijn takken zullen zij wonen. Zo zullen alle bomen van het veld weten dat Ik, de HEERE, de hoge boom vernederd heb, de nederige boom verheven heb, de groene boom verdroogd heb, en de droge boom bloeiend gemaakt heb; Ik, de HEERE, heb het gesproken, en zal het doen.", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "Deut 12:7": "En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "Jes 35:1-10": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos. Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God. Versterkt de slappe handen, en maakt de struikelende knieën vast.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Hagg 2:9": "Mijn is het zilver, en Mijn is het goud, spreekt de HEERE van de heerscharen.", "Deut 5:5": "(ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei:", "Matt 12:50": "Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "Deut 15:4": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten;", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "Ps 106:48": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid; en al het volk zegt: Amen, Halleluja!", "Ps 86:12": "Heere, mijn God! ik zal U met mijn hele hart loven, en ik zal Uw Naam eren tot in eeuwigheid;", "Gen 49:11": "Hij bindt zijn jonge ezel aan de wijnstok, en het veulen van zijn ezelin aan de edelste wijnstok; hij wast zijn kleed in de wijn, en zijn mantel in wijndruivenbloed.", "Ps 33:15": "Hij vormt hun aller hart; Hij let op al hun werken.", "Ezech 1:26-28": "En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend. En ik zag iets als de kleur van amber, als de gedaante van vuur rondom daarbinnen, vanaf de gedaante van Zijn lendenen en opwaarts; en vanaf de gedaante van Zijn lendenen en neerwaarts, zag ik iets als de gedaante van vuur, en een glans rondom Hem. Zoals de gedaante van de boog die in de wolk is op de dag van de regen, zo was de gedaante van de glans rondom; dit was de gedaante van de gelijkenis van de heerlijkheid van de HEERE; en toen ik het zag, viel ik op mijn gezicht, en ik hoorde een stem van Iemand Die sprak.", "Ezech 18:4": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "Ps 135:1-3": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE! U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God! Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "Ps 117:1": "Loof de HEERE, alle heidenvolken; prijs Hem, alle natiën!", "Jes 60:1-22": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Dan 2:35": "Toen werden het ijzer, het leem, het koper, het zilver en het goud tegelijk verbrijzeld, en zij werden als kaf van de dorsvloeren in de zomer, en de wind voerde ze weg, zodat er geen plaats meer voor gevonden werd; maar de steen die het beeld verbrijzeld had, werd tot een grote berg, zodat hij de hele aarde vulde.", "1 Kron 16:25": "Want de HEERE is groot, en zeer te prijzen, en Hij is te vrezen boven alle goden.", "Gen 1:30": "Maar aan al de dieren van de aarde, en aan al het gevogelte van de hemel, en aan al het kruipende gedierte op de aarde, waarin een levende ziel is, heb Ik al het groene gewas tot voedsel gegeven. En het was zo.", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Spr 10:27": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort.", "Ps 102:18": "Zich gewend zal hebben tot het gebed van hem die geheel ontbloot is, en niet versmaad hebben hun gebed;", "1 Kor 15:24-28": "Daarna zal het einde zijn, wanneer Hij het Koninkrijk aan God en de Vader zal hebben overgegeven; wanneer Hij alle heerschappij, alle macht en kracht zal hebben tenietgedaan. Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd. De laatste vijand die tenietgedaan wordt, is de dood.", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Ps 103:19": "De HEERE heeft Zijn troon in de hemelen bevestigd, en Zijn Koninkrijk heerst over alles.", "Jes 52:1-15": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen. Schud u uit het stof, sta op, ga zitten, o Jeruzalem! Maak u los van de banden van uw hals, u gevangen dochter van Sion! Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Job 2:8": "En hij nam zich een potscherf om zich daarmee te schrapen, en hij zat neer in het midden van de as.", "Ex 34:29-35": "En het gebeurde, toen Mozes van de berg Sinaï afdaalde (de twee tafelen van de getuigenis nu waren in de hand van Mozes, toen hij van de berg afdaalde), dat Mozes niet wist dat de huid van zijn aangezicht straalde, doordat Hij met hem gesproken had. Toen Aäron nu en al de kinderen van Israël Mozes aanzagen, zie, zo straalde de huid van zijn aangezicht; daarom waren zij bang om naar hem toe te gaan. Toen riep Mozes hen; en Aäron, en al de leiders in de vergadering keerden terug naar hem; en Mozes sprak tot hen.", "Ps 89:53": "Geloofd zij de HEERE in eeuwigheid! Amen, ja, amen.", "Ps 86:9": "Al de heidenen, Heere! die Gij gemaakt hebt, zullen komen, en zullen zich voor Uw aangezicht neerbuigen, en Uw Naam eren.", "Jer 18:1-23": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei: Maak u op en ga naar het huis van de pottenbakker, en daar zal Ik u Mijn woorden doen horen. Zo ging ik naar het huis van de pottenbakker; en zie, hij maakte een werk op de schijven.", "Jer 27:6": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Ps 107:21": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen.", "2 Kron 6:27": "Hoor U dan in de hemel, en vergeef de zonden van Uw knechten en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben, waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt.", "Hand 2:35": "Totdat Ik Uw vijanden tot een voetbank voor Uw voeten gezet zal hebben.", "Gen 30:2": "Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft?", "Ps 146:5-9": "Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is; Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid. Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Ps 35:18": "Zo zal ik U loven in de grote gemeente; onder machtig veel volk zal ik U prijzen.", "Jes 16:5": "Want er zal een troon bevestigd worden in goedertierenheid, en daarop zal iemand betrouwbaar zitten in de tent van David, iemand die oordeelt en het recht zoekt, en vaardig is tot gerechtigheid.", "Joh 12:28": "Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "Hand 2:34": "Want David is niet opgevaren naar de hemel; maar hij zegt zelf: De Heere heeft gesproken tot mijn Heere: Zit aan Mijn rechterhand,", "Neh 9:27": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Hebr 6:17": "waarbij God, omdat Hij aan de erfgenamen van de belofte overvloediger de onveranderlijkheid van Zijn raad wilde tonen, er een eed tussen heeft gebracht;", "Job 15:15": "Zie, op Zijn heiligen zou Hij niet vertrouwen, en de hemelen zijn niet zuiver in Zijn ogen.", "Jer 33:22": "Zoals het leger van de hemel niet geteld, en het zand van de zee niet gemeten kan worden, zo zal Ik het nageslacht van Mijn knecht David vermenigvuldigen, en de Levieten die Mij dienen.", "Ps 96:4": "Want de HEERE is groot, en zeer te prijzen; Hij is ontzagwekkend boven alle goden.", "Deut 11:8": "Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Ps 34:10": "Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.", "Dan 2:23": "Ik dank U en ik loof U, o God van mijn vaderen! Omdat U mij wijsheid en kracht gegeven hebt, en mij nu bekendgemaakt hebt wat wij van U gevraagd hebben, want U hebt ons de zaak van de koning bekendgemaakt.", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Ps 46:11": "Laat af, en weet, dat Ik God ben; Ik zal verhoogd worden onder de heidenen, Ik zal verhoogd worden op de aarde.", "Luk 19:37": "En toen Hij nu in de buurt kwam van de afdaling van de Olijfberg, begon heel de menigte van de discipelen zich te verblijden, en God te loven met luide stem, vanwege alle krachtige daden die zij gezien hadden,", "Ps 22:29": "Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen.", "Spr 10:22": "De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.", "Matt 6:26": "Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven?", "Ps 89:9": "O HEERE, God van de heerscharen! Wie is als Gij, grootmachtig, o HEERE! en Uw getrouwheid is rondom U.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Deut 28:7": "De HEERE zal geven dat uw vijanden, die tegen u opstaan, verslagen worden voor uw ogen; door één weg zullen zij tegen u uittrekken, maar door zeven wegen zullen zij voor u vluchten.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Ps 33:1-3": "Rechtvaardigen! Zingt vrolijk in de HEERE; lof past de oprechten. Looft de HEERE met de harp; zingt Hem psalmen met de luit, en het tiensnarig instrument. Zingt Hem een nieuw lied; speelt goed met vrolijk geschal.", "Zach 2:10": "Juich en verblijd u, dochter van Sion; want zie, Ik kom, en Ik zal in het midden van u wonen, spreekt de HEERE.", "Klaagl 3:50": "Ain. Totdat de HEERE van de hemel neerkijkt, en het ziet.", "Neh 8:11": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte.", "Jes 43:20": "Het gedierte van het veld zal Mij eren, de jakhalzen en de jonge struisvogels; want Ik zal in de woestijn water geven, en rivieren in de wildernis, om Mijn volk, Mijn uitverkorenen te drinken te geven.", "Jes 51:8": "Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.", "Ps 148:1-14": "Halleluja! Looft de HEERE uit de hemelen; looft Hem in de hoogste plaatsen! Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen! Looft Hem, zon en maan! Looft Hem, alle lichtende sterren!", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Deut 15:4-6": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten; Als u alleen maar de stem van de HEERE, uw God, vlijtig gehoorzaamt, zodat u erop let te doen al deze geboden die ik u vandaag gebied. Want de HEERE, uw God, zal u zegenen, zoals Hij tot u heeft gesproken; zo zult u aan veel volken lenen, maar u zult niet lenen; en u zult over veel volken heersen, maar over u zullen zij niet heersen.", "Ps 102:23": "Wanneer de volken samen zullen vergaderd worden, ook de koninkrijken, om de HEERE te dienen.", "Hagg 2:20": "Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.", "Lev 26:4-10": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen. Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Ps 96:6": "Majesteit en heerlijkheid zijn voor Zijn aangezicht, sterkte en sieraad in Zijn heiligdom.", "Luk 12:22-31": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u: wees niet bezorgd voor uw leven, wat u eten zult, en ook niet voor het lichaam, waarmee u zich kleden zult. Het leven is meer dan het voedsel, en het lichaam meer dan de kleding. Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard?", "Matt 6:10": "Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.", "Matt 10:32": "Ieder dan die Mij belijden zal voor de mensen, die zal Ik ook belijden voor Mijn Vader, Die in de hemelen is.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "1 Petr 5:11": "Aan Hem zij de heerlijkheid en de kracht, tot in alle eeuwigheid. Amen.", "Gen 30:22-24": "God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder. En zij werd zwanger, en baarde een zoon; en zij zei: God heeft mijn smaad weggenomen! En zij noemde zijn naam Jozef, en zei: De HEERE voegt mij nog een andere zoon toe.", "Jes 49:6-12": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde. Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft. Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Ps 105:14-45": "Liet Hij geen mens toe hen te onderdrukken; ook bestrafte Hij koningen om hunnentwil, en zei: Raak Mijn gezalfden niet aan, en doe Mijn profeten geen kwaad. Hij riep ook een honger over het land; Hij brak elke staf van het brood.", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Fil 4:20": "Onze God en Vader nu zij de heerlijkheid tot in alle eeuwigheid. Amen.", "Ps 68:20": "Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela.", "Ps 22:28-32": "Alle einden van de aarde zullen het gedenken, en zich tot de HEERE bekeren; en alle geslachten van de heidenen zullen voor Uw aangezicht aanbidden. Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen. Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.", "Jes 19:25": "Want de HEERE van de heerscharen zal hen zegenen en zeggen: Gezegend zij Mijn volk, de Egyptenaars, en de Assyriërs, het werk van Mijn handen, en Israël, Mijn erfdeel!", "Job 5:15": "Maar Hij verlost de behoeftige van het zwaard, van hun mond, en van de hand van de sterke.", "Ps 26:12": "Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.", "Joh 6:31": "Onze vaders hebben het manna gegeten in de woestijn, zoals geschreven is: Hij gaf hun brood uit de hemel te eten.", "Ps 91:1-16": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige. Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Joël 2:26-32": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid. En u zult weten, dat Ik in het midden van Israël ben, en dat Ik de HEERE, uw God, ben, en niemand anders meer; en Mijn volk zal niet beschaamd worden in eeuwigheid. En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Hand 16:25": "En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen.", "Ps 102:14-16": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen. Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis. Dan zullen de heidenen de Naam van de HEERE vrezen, en alle koningen van de aarde Uw heerlijkheid.", "Ps 107:31": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "1 Kon 8:30": "Hoor dan naar de smeking van Uw dienaar, en van Uw volk Israël, die op deze plaats zullen bidden; en hoor Ú in de plaats van Uw woning, in de hemel, ja, hoor, en vergeef.", "Jes 6:2": "De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij.", "Job 12:9": "Wie weet niet, uit al deze dingen, dat de hand van de HEERE dit doet?", "Ps 43:4": "En dat ik inga tot Gods altaar, tot de God van de blijdschap van mijn verheuging, en U met de harp loof, o God, mijn God!", "Num 10:29": "Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.", "2 Kor 1:20": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Rom 1:5-7": "(Door Wie wij genade en het apostelschap hebben ontvangen, tot gehoorzaamheid van het geloof onder alle heidenen, voor Zijn Naam; onder wie u ook bent, geroepenen van Jezus Christus!) Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "Openb 11:4": "Dezen zijn de twee olijfbomen en de twee kandelaars, die voor de God van de aarde staan.", "Job 37:17": "Hoe uw klederen warm worden, als Hij de aarde stil maakt vanuit het zuiden?", "Ps 126:6": "Die het zaad draagt om te zaaien, gaat al gaande en wenende; maar hij zal zeker met gejuich terugkomen, terwijl hij zijn schoven draagt.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 28:6": "Geprezen zij de HEERE, want Hij heeft de stem van mijn smekingen gehoord.", "Ps 10:16": "De HEERE is Koning eeuwig en altijd; de heidenen zijn vergaan uit Zijn land.", "Ps 107:35-38": "Hij maakt van de woestijn een waterpoel, en van het dorre land waterbronnen. En Hij doet de hongerigen daar wonen, en zij stichten een stad om in te wonen; En bezaaien akkers, en planten wijngaarden, die vrucht opbrengen.", "Dan 2:45": "Daarom hebt u gezien dat uit de berg een steen zonder handen werd afgehouwen, die het ijzer, koper, leem, zilver en goud verbrijzelde; de grote God heeft de koning bekendgemaakt wat hierna gebeuren zal; de droom is dus waar, en de uitleg ervan betrouwbaar.", "Ps 74:21": "Laat de verdrukte niet beschaamd terugkeren; laat de ellendige en de arme Uw Naam prijzen.", "Ex 34:5": "De HEERE nu kwam neerwaarts in een wolk, en stelde Zich daar bij hem; en Hij riep de Naam van de HEERE uit.", "Jes 23:17": "Want het zal gebeuren aan het einde van zeventig jaren, dat de HEERE Tyrus zal bezoeken, en dat zij zal terugkeren tot haar hoerenloon, en zij zal hoererij bedrijven met alle koninkrijken van de aarde, die op de aardbodem zijn.", "Jes 49:1-26": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld. En Hij heeft Mijn mond gemaakt als een scherp zwaard, onder de schaduw van Zijn hand heeft Hij Mij bedekt; en Hij heeft Mij tot een gezuiverde pijl gesteld, in Zijn pijlkoker heeft Hij Mij verborgen. En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.", "Ps 40:6": "Gij, o HEERE, mijn God! hebt Uw wonderen en Uw gedachten aan ons vele gemaakt, men kan ze niet in orde bij U verhalen; zal ik ze verkondigen en uitspreken, dan zijn ze menigvuldiger dan dat ik ze zou kunnen vertellen.", "Job 34:24": "Hij vermorzelt de geweldigen, dat men het niet doorzoeken kan, en stelt anderen in hun plaats.", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Spr 22:22": "Beroof de arme niet, omdat hij arm is; en verbrijzel de ellendige niet in de poort.", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "Jes 30:23-26": "Dan zal Hij uw zaad, waarmee u het land bezaaid hebt, regen geven, en brood van de opbrengst van het land, en dat zal vet en overvloedig zijn; uw vee zal op die dag in een wijde landouwe weiden. En de ossen, en ezelveulens, die het land bewerken, zullen zuiver voeder eten, dat verschud is met de werpschoffel en met de wan. En er zullen op elke hoge berg, en op elke hoge heuvel, beekjes en watervlieten zijn, op de dag van de grote slachting, wanneer de torens vallen zullen.", "Ps 72:12-14": "Want hij zal de behoeftige redden, die daar roept, alsook de ellendige, en die geen helper heeft. Hij zal de arme en behoeftige verschonen, en de zielen van de behoeftigen verlossen. Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "Ps 147:8": "Die de hemel met wolken bedekt, Die voor de aarde regen klaarmaakt; Die het gras op de bergen laat opkomen;", "Ps 57:12": "Verhef U boven de hemelen, o God! Uw eer zij over de hele aarde.", "1 Kron 16:33": "Dan zullen de bomen van het woud juichen voor het aangezicht van de HEERE, omdat Hij komt om de aarde te richten.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Ps 135:6-12": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden. Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort. Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe.", "Zach 11:7": "Daarom heb ik deze slachtschapen geweid, omdat zij ellendige schapen zijn; en ik heb mij twee stokken genomen, de een heb ik LIEFELIJKHEID genoemd, en de ander heb ik SAMENBINDERS genoemd; en ik heb die schapen geweid.", "Ps 87:1-5": "Een psalm, een lied voor de kinderen van Korach. Zijn grondslag is op de bergen van heiligheid. De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob. Zeer heerlijke dingen worden van u gesproken, o stad van God! Sela.", "Richt 5:3": "Hoor, u koningen, neem het ter ore, u vorsten! Ik, den HEERE zal ik zingen, ik zal den HEERE, de God van Israël, psalmzingen.", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Ps 136:3": "Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Ps 78:70": "En Hij verkoos Zijn knecht David, en nam hem van de schaapskooien;", "1 Kron 29:16": "HEERE, onze God, al deze overvloed die wij klaargemaakt hebben om U een huis te bouwen, voor de Naam van Uw heiligheid, dat komt van Uw hand, en het is alles van U.", "Jer 32:27": "Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?", "Deut 2:7": "Want de HEERE, uw God, heeft u gezegend in al het werk van uw hand; Hij kent uw wandelen door deze zo grote woestijn; deze veertig jaren is de HEERE, uw God, met u geweest; niets heeft u ontbroken.", "Ps 116:17-19": "Ik zal U een offer van dankzegging offeren, en de Naam van de HEERE aanroepen. Ik zal mijn gelofte de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk, in de voorhoven van het huis van de H
