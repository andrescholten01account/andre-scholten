 des HEEREN, en wie zal staan in de plaats Zijner heiligheid?","4":"Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedriegelijk zweert;","5":"Die zal den zegen ontvangen van den HEERE, en gerechtigheid van den God zijns heils.","6":"Dat is het geslacht dergenen, die naar Hem vragen, die Uw aangezicht zoeken, *dat* is Jakob! Sela.","7":"Heft uw hoofden op, gij poorten, en verheft u, gij eeuwige deuren, opdat de Koning der ere inga!","8":"Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in den strijd.","9":"Heft uw hoofden op, gij poorten, ja, heft op, gij eeuwige deuren! opdat de Koning der ere inga!","10":"Wie is Hij, deze Koning der ere? De HEERE der heirscharen, Die is de Koning der ere. Sela."},"KJV":{"1":"[[A Psalm of David.]] The earth *is* the LORD'S, and the fulness thereof; the world, and they that dwell","2":"For he hath founded it upon the seas, and established it upon the floods.","3":"Who shall ascend into the hill of the LORD? or who shall stand in his holy place?","4":"He that hath clean hands, and a pure heart; who hath not lifted up his soul unto vanity, nor sworn deceitfully.","5":"He shall receive the blessing from the LORD, and righteousness from the God of his salvation.","6":"This *is* the generation of them that seek him, that seek thy face, O Jacob. Selah.","7":"Lift up your heads, O ye gates; and be ye lift up, ye everlasting doors; and the King of glory shall come in.","8":"Who *is* this King of glory? The LORD strong and mighty, the LORD mighty in battle.","9":"Lift up your heads, O ye gates; even lift *them* up, ye everlasting doors; and the King of glory shall come in.","10":"Who is this King of glory? The LORD of hosts, he *is* the King of glory. Selah."}},"tsk":{"1":[{"kopje":"aarde","refs":["Ps 50:12","Ex 9:29","Ex 19:5","Deut 10:14","1 Kron 29:11","Job 41:2","Dan 4:25","1 Kor 10:26"]},{"kopje":"wereld","refs":["Ps 89:12","Ps 98:7","Nahum 1:5"]}],"2":[{"kopje":" -kjv\" data-code=\"H3824\">heart;</span> who hath not lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> unto <span class=\"wl wl-kjv\" data-code=\"H7723\">vanity,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> deceitfully.","5":"He shall <span class=\"wl wl-kjv\" data-code=\"H5375\">receive</span> the <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> from the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of his salvation.","6":"This is the <span class=\"wl wl-kjv\" data-code=\"H1755\">generation</span> of them that <span class=\"wl wl-kjv\" data-code=\"H1875\">seek</span> him, that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> O <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob.</span> Selah.","7":"Lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> your <span class=\"wl wl-kjv\" data-code=\"H7218\">heads,</span> O ye <span class=\"wl wl-kjv\" data-code=\"H8179\">gates;</span> and be ye lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up,</span> ye <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H6607\">doors;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> of <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> shall come in.","8":"Who is this <span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> of <span class=\"wl wl-kjv\" data-code=\"H3519\">glory?</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5808\">strong</span> and <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> in battle.","9":"Lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> your <span class=\"wl wl-kjv\" data-code=\"H7218\">heads,</span> O ye <span class=\"wl wl-kjv\" data-code=\"H8179\">gates;</span> even lift them <span class=\"wl wl-kjv\" data-code=\"H5375\">up,</span> ye <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H6607\">doors;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> of <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> shall come in.","10":"Who is this <span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> of <span class=\"wl wl-kjv\" data-code=\"H3519\">glory?</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> he is the <span class=\"wl wl-kjv\" data-code=\"H4428\">King</span> of <span class=\"wl wl-kjv\" data-code=\"H3519\">glory.</span> Selah."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"volheid,","tekst":"Te weten, alle schepselen, waarmede de Heere de aarde vervuld heeft. Dat Hij dan uit dit alles, hetwelk Hem door het recht der schepping toekomt, zijn volk tot een bijzonder eigendom voor zich verkiest en op zijn berg huisvest, is zijn bijzonder genade. Verg. Exo 19:5 ; Deu 10:14-15 ."}],"2":[{"catchword":"op de","tekst":"Of, aan de zeeën, en zo in het volggende, aan de rivieren."},{"catchword":"zeeën","tekst":"Dat is, wateren. Zie Gen 1:10 . Dat wateren on der de aarde zijn, is bekend en blijkt Exo 20:4 , doch men kan dit alzo verstaan, dat God de aarde, of het droge, heeft doen uitsteken boven de wateren, die tevoren de aarde bedekten, en heeft ze voorts gegrondvest en als bebolwerkt, met, aan en op de wateren, die Hij [niettegenstaande dat zij vochtig en vloeiende, van nature onvast en daartoe ondienstig zouden zijn] maakt tot een zeer vast fondament des aardbodems, gelijk Hij het licht uit de duisternis voortbrengt; houdende alzo door zijne kracht water en aarde in hun verordineerde plaatsen. Zie verder Psa 104:5-8 , en Psa 136:6 , en verg. Job 26:7 , en Job 38:4 , Job 38:6 ; Mic 6:2 ."}],"3":[{"catchword":"Wie","tekst":"Alsof hij zeide: Hoewel Israël Gods eigendom is, zo zijn nochtans de huichelaars, die wel naar het vlees Israëlieten zijn en in den uiterlijken godsdienst mede verschijnen, geen rechte leden van zijn volk, maar alleen die het geestelijk Israël uitmaken en in het volgende met kentekenen beschreven worden. Verg. Rom 9:6 , en Rom 2:28-29 ; Gal 6:16 ."},{"catchword":"berg","tekst":"Zie Psa 2:6 ."}],"4":[{"catchword":"rein","tekst":"Dat is, vreemd van stelen, roven, doodslaan, overspel, enz. Verg. Gen 20:5 ."},{"catchword":"zuiver","tekst":"Dat is, oprecht, ongeveinsd, in zijn gansen godsdienst."},{"catchword":"niet opheft","tekst":"Dat is, die zijne ziel niet begeeft tot ijdelheid of valsheid; of die geen begeerte noch verlangen heeft naar ijdelheid. Zie dezelfde manier van spreken Deu 24:15 ; Jer 22:27 , en Jer 44:14 , en verg. Eze 24:25 ; Hos 4:8 . Anders, die mijne ziel; [dat is, mij, mijn heiligen naam] niet ijdellijk opneemt; dat is, in den mond neemt. Aldus zouden dit Gods eigen woorden zijn, van David hier ingevoegd tot meerderen nadruk."},{"catchword":"bedriegelijk","tekst":"Hebr. tot, in, of met bedrog; dat is, om te bedriegen, niet denkende in zijn hart hetgeen hij zweert met den mond."}],"5":[{"catchword":"ontvangen","tekst":"Of wegdragen, afdragen."},{"catchword":"gerechtigheid","tekst":"Dat is, de vrucht der gerechtigheid, te weten, tijdelijken zegen en eeuwige heerlijkheid. Zie Isa 48:18 ; Hos 10:12 :of hij zal van God, zijn Zaligmaker, ontvangen de weldaden, die Hij zijnene kinderen rechtvaardiglijk uitdeeldt, niet naar hunne verdiensten, maar volgens zijn genadige en getrouwe beloften die Hij naar zijne gerechtigheid houdt; zie Heb 6:9-10 ; 1Jo 1:9 ."},{"catchword":"zijns","tekst":"Dat is, die zijn Heiland, of Zaligmaker is."}],"6":[{"catchword":"uw","tekst":"Hij spreekt God aan, tonende zijn vast vertrouwen van de waarheid dezer gewichtige zaak, om de huichelaars, die zich het tegendeel inbeelden, als voor Gods rechterstoel te overtuigen en te beschamen. Aangaande deze manier van spreken, zie 2Ch 7:14 , en 2Ch 11:16 ."},{"catchword":"Jakob","tekst":"Dat is, dat zij de rechte kinderen Jakobs, de rechte Israëlieten. Verg. Joh 1:48 ; Rom 9:6 . Anders, o Jakob; dat is, o gij ware gemeente, gij geestelijk Israël. Dit is ene zaak [wil hij zeggen] waarop gij wel moet letten, als zijnde van groot gewicht in het punt van godsdienst, kerende zich alzo van de aanspraak Gods tot de kerk."},{"catchword":"Sela","tekst":"Zie Psa 3:3 ."}],"7":[{"catchword":"hoofden","tekst":"Dat is, bovenste posten."},{"catchword":"poorten,","tekst":"Des tempels, dien David van God door den profeet Nathan verstaan had dat zijn zoon Salomo zou bouwen, waarin de ark des verbonds [op welke God zijne tegenwoordigheid vertoonde] aan hare plaats zou gebracht worden, en alzo God daar zijne woonstede nemen. Waardoor werd afgebeeld de komst van Christus in het vlees en tot zijn kerk, alsmede zijne hemelvaart, waarover zich David in den geest grotelijks verheugt, alzo hem Nathan mede zo uitnemend bericht gedaan had, dat hij niet wist hoe hij God daarvoor genoeg zou danken; 2Sa 7 ."},{"catchword":"eeuwige deuren","tekst":"Hebr. deuren der eeuwigheid; alzo in het volgende vs.9; dat is, die langen tijd zouden blijven in hare plaatsen, daar de vorige tabernakel van de ene plaats op de andere was verdragen en weinig rust gehad had. Maar geduid zijnde op de gemeente der kinderen Gods, tot dewelke God met zijn genade en Geest ingaat, en daarin woont, [waarom zij Gods tempel genoemd worden], kan dit de eeuwigdurigheid der kerk Gods betekenen, alsook den hemel zelf, voorzoveel de hemelvaart van Christus hier ook wordt beduid. Zie van het woord eeuwig, Gen 17:7 , en voorts 1Co 3:16 , en 1Co 6:19 ; Rev 3:20 ."},{"catchword":"Koning","tekst":"God, die gezegd wordt te wonen tussen de cherubim op de ark, 2Sa 6:2 . Waardoor Christus werd afgebeeld, de rechte Koning der heerlijkheid."}],"10":[{"catchword":"heirscharen,","tekst":"Zie 1Ki 18:15 . Sommigen verstaan, dat in dezen Psalm, van het vs.7 af, gesproken wordt alleen van de hemelvaart onzes Heeren Jezus Christus."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A Psalm of David. The Earth is the LORDS, together with her fullness; [i.e. All the Creatures, wherewith the LORD hath filled the Earth. Now that out of all this fullness (which by right of creation appertaineth unto him) he hath chosen out a peculiar people for himself, to be his own, and to dwell upon his holy hill: that is of his meer and special favour. Comp.Exo 19:5. Deut.10.14,15.] the world and those that dwell in it."}],"2":[{"catchword":null,"tekst":"For he hath founded it upon the Seas, [Or, at, or by the Seas, and so in the sequel, at or by the Rivers, Seas, i.e. Waters. See Gen.1.on verse 10. That there are waters under the earth is known and appeareth, Exo 20:4. Yet this may also be understood thereof, that God made the earth, or dry land (To siccum) to stand out ver, and founded and bull-walked the same, as it were furthermore, with, at, and upon the waters, whom (not with standing that they are moist and flowing, unstable by nature, and consequently in all appearance in all appearance unsit and unserviceable for it) he doth make to become a very firm and stable foundation of the earth; even as he doth bring forth light out of darkness: holding and maintaining thus both water, and earth together, in their ordained places through his power. See further Psa 104:5,6,7,8. And 136.6. and compare Job 26:7. & 38.4,6. Mic 6:2.] and hath established it upon the Rivers."}],"3":[{"catchword":null,"tekst":"Who shall ascend upon the hill of the LORD? [See Psalm 2.on ver.6.] And who shall stand in the place of his holiness? [As if he should say, though Israel be Gods peculiar people; yet the hypocrites, which are only Israelites according to the flesh, and some appearance in the outward worship, are no true members of his people, but those only, that make up the Israel according to the spirit, and are described in the sequel by their proper marks; Compare Rom 9:6. and 2.28,29. Gal 6:16.]"}],"4":[{"catchword":null,"tekst":"He that is clean of hands, [i.e. far and clear from stealing. Robbing, killing, adultery, &c. Compare Genesis 20.on v.5.] and pure of heart, [i.e. sincere, upright, and unfained kin all his service of God] that doth not lift up his soul to vanity, [i.e. that doth not give up or addict himself to vanity or falsehood: or, that hath no desire nor longing after vanity. See the same kind of expression, Deut.24.on verse 15. Jer 22:27. and 44.14. and compare Eze 24:15. Hos 4:8. Oth. That taketh not up soul (i.e. my Holy Name) in vain, viz. Into his mouth; and thus these should be Gods own words, inserted here by David, to add the more weight unto them] and he that sweareth that he may deceive, not meaning that in his heart, which his mouth sweareth.]"}],"5":[{"catchword":null,"tekst":"He shall receive the blessing from the LORD [Or, bear away, carry away] and righteousness [i.e. the fruit of righteousness, viz. Temporal blessing, and glory everlasting. See Isa 48:18. Hos 10:12.or, he shall receive the benefit, which he doth righteously distribute unto his children, not according to their deserts, which he doth keep and perform according to his righteousness. See Heb.6. verse 9,10. 1Jn 1:9.] from the God of his salvation. [i.e. That is his Saviour or Redeemer.]"}],"6":[{"catchword":null,"tekst":"That is the generation of those, that enquire after him, that seek thy face, [He speaketh unto God, shewing his assured confidence, about the truth of this weighry matter, for to conceive and shame the hypocrites, (who imagined the contrary) as before the Tribunal-seat of God. Concerning these kind of speechs see 2 Chron.7.on verse 14. And 11.on verse 6.] (that) is Jacob: [i.e. those are the true children of Jacob, or true Israelites. Compare Joh 1:47. Rom 9:6. Oth. O Jacob. i.e. O thou true Church; thou spiritual Israel; This is a matter (he implies) which ought to be well weighed by thee, as being of great importancein point of Religion. Turning himself thus from be speaking God, unto the church of God] Sela. [see Psa.3.on verse 3.]"}],"7":[{"catchword":null,"tekst":"Lift up your heads [i.e. the upper posts, or top beams] ye gates [of the Temple, which David had learnt of God by Nathan the Prophet, his Son Solomon should build up, and into which the Ark of the Covenant (whereupon God shewed his presence) was to be brought unto her place, and so God to take up his habitation there. Whereby was prefigured the coming Christ into the flesh, and unto his Church, together with his ascension, which David doth greatly rejoice at in the spirit, after that Nathan had given him such an ample information thereof, that he knew not how to thank God sufficiently for it, 2 Sam.7.] and exalt yourselves, ye everlasting doors: [Heb. Gates of eternity, and so in the next verse likewise, i.e. gates that were to last and stand long time in their places, whereas the Tabernacle was removed often from one place to another, and had but little rest. But being applied to the church of Gods children, whom God entered with his grace and spirit, and dwelleth in them, (for which cause they are called the Temple of God) this may sitly signify the everlastingness of the church of God, yea and heaven it self, for as much as Christs ascension into heaven is likewise shadowed out hereby. See of the word eternal, or everlasting, Genesis 17.on verse 7. And further, [Cor.3.16. and 6.19. rev.3.20.] that the King of glory may enter. [i.e. God, who is said to dwell between the Cherubims upon the Ark, 2 Sam.6.2. whereby Christ is figured out the true King of Glory.]"}],"8":[{"catchword":null,"tekst":"Who is the King of Glory? The LORD, strong and mighty; the LORD, mighty in the Battle."}],"9":[{"catchword":null,"tekst":"Lift up your heads yr gates, yea lift up, ye everlasting doors, that the King of glory may enter."}],"10":[{"catchword":null,"tekst":"Who is he, this King of Glory? The LORD of hosts: [See 1 Kings 18.on verse 15. Some do understand that in this Psalm from the seventh verse to the end, there is onely mention made of the ascension of our LORD Jesus Christ into heaven] That is the King of Glory. Sela!"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +

  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
