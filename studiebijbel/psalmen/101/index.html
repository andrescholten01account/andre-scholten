 Dit is ook ijdelheid en kwelling van de geest.", "1 Kor 1:29": "Opdat geen vlees zou roemen voor Hem.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Spr 19:9": "Een vals getuige zal niet onschuldig blijven; en die leugens waait, zal vergaan.", "Jak 1:15": "Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.", "Ps 120:2-4": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong. Wat zal U de bedrieglijke tong geven, of wat zal zij U toevoegen? Scherpe pijlen van een machtige, alsook gloeiende jeneverkolen.", "Hand 19:19": "Velen ook van hen die toverkunsten hadden beoefend, brachten de boeken bijeen en verbrandden ze voor het oog van allen; en zij berekenden de waarde daarvan, en kwamen tot vijftigduizend zilveren penningen.", "2 Kron 31:20": "Zo deed Hizkia in heel Juda; en hij deed wat goed, en recht, en waarachtig was, voor het aangezicht van de HEERE, zijn God.", "2 Petr 2:21": "Want het zou beter voor hen geweest zijn de weg van de gerechtigheid niet gekend te hebben, dan die gekend te hebben en zich weer af te keren van het heilige gebod dat hun overgeleverd was.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Jes 22:19": "En Ik zal u wegstoten van uw positie, en van uw plaats zal Hij u neerhalen.", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "2 Petr 2:1-3": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Luk 12:43": "Zalig is die dienstknecht, die zijn heer, als hij komt, zo bezig zal vinden.", "Luk 6:40": "De discipel staat niet boven zijn meester; maar ieder die volleerd is, zal zijn zoals zijn meester.", "Spr 5:8": "Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "1 Tim 4:12": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid.", "Ps 40:8-11": "Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand. Ik verkondig de gerechtigheid in de grote gemeente; zie, mijn lippen bedwing ik niet; HEERE! Gij weet het.", "Ps 18:21-24": "De HEERE vergold mij naar mijn gerechtigheid, Hij gaf mij weer naar de reinheid van mijn handen. Want ik heb de wegen van de HEERE gehouden, en ben van mijn God niet goddeloos afgegaan. Want al Zijn rechten waren voor mij, en Zijn inzettingen deed ik niet van mij weg.", "Hand 11:30": "En dat deden zij ook, en zonden het naar de oudsten, door de hand van Barnabas en Saulus.", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Jes 38:18": "Want het graf zal U niet loven, de dood zal U niet prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Hab 2:5": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken.", "Job 1:8": "En de HEERE zei tegen de satan: Hebt u ook acht geslagen op Mijn knecht Job? Want er is niemand op de aarde zoals hij, een man oprecht en vroom, godvrezend en afwijkend van het kwaad.", "Jak 4:11": "Broeders, spreek niet kwaad van elkaar. Wie kwaad spreekt van zijn broeder en zijn broeder veroordeelt, die spreekt kwaad van de wet en veroordeelt de wet. Als u nu de wet veroordeelt, bent u geen dader van de wet, maar een rechter.", "Kol 3:9": "Lieg niet tegen elkaar, omdat u de oude mens met zijn werken hebt uitgedaan,", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Job 36:4": "Want voorwaar, mijn woorden zullen geen valsheid zijn; iemand die oprecht van kennis is, is bij u.", "Tit 3:14": "En laat ook de onzen leren goede werken voor te staan, voor de dingen die nodig zijn, opdat zij niet onvruchtbaar zijn.", "Jes 29:16": "Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "1 Kon 21:2-29": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven. Maar Naboth zei tegen Achab: Dat de HEERE ver van mij houde, dat ik u de erfenis van mijn vaderen zou geven! Toen kwam Achab in zijn huis, knorrig en toornig over het woord dat Naboth, de Jizreëliet, tot hem gesproken had, want hij had gezegd: Ik zal de erfenis van mijn vaderen niet geven. En hij legde zich neer op zijn bed, keerde zijn gezicht om, en at geen brood.", "Ps 119:59": "Ik heb mijn wegen bedacht, en heb mijn voeten gekeerd tot Uw getuigenissen.", "Ps 7:18": "Ik zal de HEERE loven naar Zijn gerechtigheid, en voor de Naam van de HEERE, de Allerhoogste, psalmzingen.", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Neh 7:2": "En ik gaf bevel aan mijn broer Hanani, en aan Hananja, de leider van de burcht in Jeruzalem, want hij was een man van trouw, en godvrezend boven velen.", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Hand 4:8-13": "Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël! Als wij vandaag ondervraagd worden over de weldaad aan een zieke mens gedaan, waardoor hij gezond geworden is; Laat het u allen bekend zijn, en het hele volk van Israël, dat door de Naam van Jezus Christus, de Nazarener, Die u gekruisigd hebt, Die God uit de doden heeft opgewekt, door Hem, zeg ik, staat deze man hier gezond voor u.", "Ps 71:8": "Laat mijn mond vervuld worden met Uw lof, de hele dag met Uw heerlijkheid.", "Luk 13:13-17": "En Hij legde haar de handen op; en zij werd meteen weer recht, en verheerlijkte God. En de leider van de synagoge nam het kwalijk dat Jezus op de sabbat genezen had, en antwoordde en zei tegen de menigte: Er zijn zes dagen waarop men moet werken; kom dan op die dagen en laat u genezen, en niet op de dag van de sabbat. De Heere dan antwoordde hem en zei: Huichelaar, maakt niet ieder van u op de sabbat zijn os of ezel los van de kribbe, en leidt hem weg om hem te laten drinken?", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Jes 55:12": "Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "Openb 3:1": "En schrijf aan de engel van de gemeente die in Sardis is: Dit zegt Hij Die de zeven Geesten van God heeft, en de zeven sterren: Ik ken uw werken, dat u de naam hebt dat u leeft, en u bent dood.", "Job 13:4": "Want zeker, u bent leugensmeders; u bent allemaal artsen van niets.", "Spr 10:10": "Wie met het oog knipoogt, veroorzaakt smart; en een dwaas van lippen zal ten val komen.", "Lev 6:2-7": "Als een mens gezondigd heeft en tegen de HEERE door overtreding overtreden zal hebben, doordat hij tegen zijn naaste gelogen heeft over iets dat hem in bewaring gegeven was, of ter hand gesteld was, of over roof, of dat hij met geweld zijn naaste iets onthoudt; Of dat hij het verlorene gevonden heeft, en daarover gelogen heeft, en met valsheid gezworen zal hebben; over iets van alles dat de mens doet, waarin hij zo zondigt. Dan zal het gebeuren, omdat hij gezondigd heeft en schuldig geworden is, dat hij zal teruggeven de roof die hij geroofd heeft, of het onthoudene dat hij met geweld onthoudt, of het bewaarde dat bij hem te bewaren gegeven was, of het verlorene dat hij gevonden heeft;", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Ps 65:2": "De lofzang is in stilte tot U, o God! in Sion; en U zal de gelofte betaald worden.", "Deut 18:13": "Oprecht zult u zijn met de HEERE, uw God.", "Hab 1:2-4": "HEERE! Hoe lang schreeuw ik, en U hoort niet, hoe lang roep ik: Geweld! tot U, en U verlost niet! Waarom laat U mij ongerechtigheid zien, en aanschouwt U de kwelling? Want verwoesting en geweld is tegen mij, en er is twist, en men neemt gekijf op. Daarom wordt de wet losgelaten, en het recht komt nooit meer voort; want de goddeloze omringt de rechtvaardige; daarom komt het recht verdraaid voort.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Ps 119:63": "Ik ben een gezel van allen, die U vrezen, en van hen, die Uw bevelen onderhouden.", "1 Sam 22:14": "En Achimelech antwoordde de koning en zei: Wie is er onder al uw knechten zo trouw als David, en schoonzoon van de koning, en die gaat waar u hem heen zendt, en die eerlijk is in uw huis?", "Jes 59:12": "Want onze overtredingen zijn talrijk voor U, en onze zonden getuigen tegen ons; want onze overtredingen zijn bij ons, en onze ongerechtigheden kennen wij;", "Ps 144:8": "wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is.", "Spr 15:12": "De spotter zal hem die hem bestraft niet liefhebben; hij zal niet naar de wijzen gaan.", "1 Tim 3:4": "iemand die zijn eigen huis goed bestuurt en zijn kinderen in onderdanigheid houdt, met alle waardigheid;", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Job 27:8-10": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken? Zal God zijn geroep horen, als benauwdheid over hem komt? Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "Ps 116:16": "Och HEERE, zeker, ik ben Uw knecht, ik ben Uw knecht, een zoon van Uw dienstmaagd; U hebt mijn banden losgemaakt.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Matt 16:12": "Toen begrepen zij dat Hij niet gezegd had dat zij zich moesten wachten voor de zuurdesem van het brood, maar voor de leer van de Farizeeën en Sadduceeën.", "Rom 6:19-22": "Ik spreek op menselijke wijze, vanwege de zwakheid van uw vlees; want zoals u uw leden gesteld hebt om dienstbaar te zijn aan de onreinheid en de ongerechtigheid, tot ongerechtigheid, zo stel nu uw leden om dienstbaar te zijn aan de gerechtigheid, tot heiliging. Want toen u dienstknechten was van de zonde, was u vrij van de gerechtigheid. Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Joz 23:6-13": "Zo weest zeer sterk, om te bewaren en om te doen alles, wat geschreven is in het wetboek van Mozes; opdat u daarvan niet afwijkt naar rechts noch naar links; Dat u niet ingaat tot deze volken: deze, die overgebleven zijn bij u; gedenkt ook niet aan de naam van hun goden, en laat er niet bij zweren, en dient hen niet, en buigt u voor hen niet; Maar de HEERE, uw God, zult u aanhangen, zoals u tot op deze dag gedaan hebt.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Ps 73:6": "Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Hand 8:35": "En Filippus deed zijn mond open en begon vanaf datzelfde Schriftgedeelte, en verkondigde hem Jezus.", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Rom 16:27": "Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.", "Jer 9:8": "Hun tong is een moordpijl, zij spreekt bedrog; ieder spreekt met zijn naaste van vrede met zijn mond, maar in zijn binnenste legt hij lagen.", "Num 33:55": "Maar als u de inwoners van het land niet voor uw aangezicht uit hun bezit verdrijft, dan zal het gebeuren dat wie u van hen laat overblijven, tot doornen zullen zijn in uw ogen, en tot prikkels in uw zijden, en u zullen benauwen in het land waarin u woont.", "Hand 4:24": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "Jes 59:13": "het overtreden en het liegen tegen de HEERE, en het achterwaarts wijken van onze God; het spreken van onderdrukking en afval, het ontvangen en het uitspreken van valse woorden uit het hart.", "Ps 119:128": "Daarom heb ik al Uw bevelen, van alles, voor recht gehouden; maar elk vals pad heb ik gehaat.", "Fil 2:22": "En u kent zijn beproefdheid, dat hij, zoals een kind zijn vader dient, met mij gediend heeft in het Evangelie.", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Deut 9:18": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Luk 21:16": "En u zult overgeleverd worden, ook door ouders, en broers, en verwanten, en vrienden; en zij zullen sommigen van u doden.", "Joh 15:8": "Hierin is Mijn Vader verheerlijkt, dat u veel vrucht draagt; en u zult Mijn discipelen zijn.", "Job 5:17": "Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Jes 10:5-16": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Hebr 10:14": "Want met één offer heeft Hij voor eeuwig volmaakt gemaakt hen die geheiligd worden.", "Gal 5:22": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "1 Sam 2:3": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.", "1 Petr 3:10": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken;", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Ps 57:8-10": "Mijn hart is standvastig, o God! mijn hart is standvastig; ik zal zingen en psalmzingen. Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o Heere! ik zal U psalmzingen onder de naties.", "Ps 109:30": "Ik zal de HEERE met mijn mond zeer loven, en te midden van velen zal ik Hem prijzen.", "Job 36:14": "Hun ziel zal in de jeugd sterven, en hun leven onder de schandjongens.", "Ps 10:2-6": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben. Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE. De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "2 Sam 11:3": "En David zond iemand, en liet naar deze vrouw navragen; en men zei: Is dat niet Bathseba, de dochter van Eliam, de vrouw van Uria, de Hethiet?", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Ef 4:32": "Maar wees jegens elkaar goedertieren, barmhartig, en vergeef elkaar, zoals ook God in Christus u vergeven heeft.", "Gal 4:9": "en nu u God kent, ja, veelmeer door God gekend bent, hoe keert u zich weer tot de zwakke en arme beginselen, die u weer van voren af aan wilt dienen?", "Jes 30:11": "Wijkt af van de weg, maakt u van het pad; laat de Heilige van Israël van ons ophouden!", "Ezech 14:7": "Want ieder man uit het huis van Israël, en uit de vreemdeling die in Israël verblijft, die zich van achter Mij afscheidt, en zijn drekgoden opzet in zijn hart, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet om Mij door hem te raadplegen; Ik ben de HEERE, hem zal door Mij geantwoord worden;", "Spr 1:14": "U zult uw lot midden onder ons werpen; wij zullen allen één buidel hebben.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Ps 37:31": "De wet van zijn God is in zijn hart; zijn gangen zullen niet uitglijden.", "Zef 3:13": "De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.", "Matt 23:2-33": "en zei: De Schriftgeleerden en de Farizeeën zitten op de stoel van Mozes; daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet. Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "Hand 11:26": "en toen hij hem gevonden had, bracht hij hem naar Antiochië. En het gebeurde dat zij een heel jaar samenkwamen in de gemeente en een grote menigte onderwezen; en dat de discipelen voor het eerst in Antiochië Christenen genoemd werden.", "Job 27:4": "Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken!", "Spr 6:14": "in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Pred 5:5": "Laat uw mond niet toe dat hij uw lichaam laat zondigen; en zeg niet voor het aangezicht van de engel dat het een vergissing was; waarom zou God erg toornen om wat u zegt, en het werk van uw handen te gronde richten?", "Luk 1:46-55": "En Maria zei: Mijn ziel maakt de Heere groot, en mijn geest verheugt zich in God, mijn Zaligmaker; omdat Hij de nederigheid van Zijn dienstmaagd heeft aangezien; want zie, van nu af aan zullen alle geslachten mij zalig spreken.", "2 Kor 5:9": "Daarom stellen wij er ook alles aan, hetzij wij thuis zijn, hetzij afwezig, om Hem welgevallig te zijn.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "2 Kor 7:11": "Want zie, ditzelfde, dat u naar God bedroefd bent geworden, hoe grote naarstigheid heeft dat in u gewerkt? Ja, verantwoording, ja, onlust, ja, vrees, ja, verlangen, ja, ijver, ja, wraak; in alles hebt u uzelf bewezen rein te zijn in deze zaak.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Matt 5:6": "Zalig zijn zij die hongeren en dorsten naar de gerechtigheid, want zij zullen verzadigd worden.", "Tit 2:11": "Want de genade van God die zaligmakend is, is verschenen aan alle mensen.", "Ps 41:7-10": "En als iemand van hen komt om mij te zien, spreekt hij valsheid; zijn hart verzamelt onrecht; gaat hij naar buiten, dan spreekt hij ervan. Al mijn haters mompelen samen tegen mij; ze bedenken tegen mij wat mij kwaad doet, en zeggen: Een Belialsstuk kleeft hem aan; en hij, die neerligt, zal niet weer opstaan.", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Jes 48:1": "Hoor dit, huis van Jakob, die genoemd wordt met de naam van Israël, en uit de wateren van Juda voortgekomen bent! Die daar zweert bij de Naam van de HEERE, en de God van Israël vermeldt, maar niet in waarheid, en ook niet in gerechtigheid.", "Openb 19:1-3": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God. Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft. En zij zeiden ten tweeden maal: Halleluja! En haar rook gaat op in alle eeuwigheid.", "Hebr 13:21": "Hij volmaakt u in alle goed werk, opdat u Zijn wil mag doen; terwijl Hij in u werkt wat voor Hem welgevallig is, door Jezus Christus; aan Wie de heerlijkheid is, tot in alle eeuwigheid. Amen.", "Matt 22:18": "Maar Jezus doorzag hun boosheid, en zei: Huichelaars, waarom stelt u Mij op de proef?", "Ps 119:31": "Ik kleef vast aan Uw getuigenissen; o HEERE! beschaam mij niet.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Luk 16:13": "Geen huisknecht kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten; u kunt God niet dienen en de Mammon.", "1 Joh 2:24": "Wat u dan vanaf het begin gehoord hebt, laat dat in u blijven. Als in u blijft, wat u vanaf het begin gehoord hebt, dan zult u ook in de Zoon en in de Vader blijven.", "1 Sam 12:20": "Toen zei Samuël tegen het volk: Vrees niet, u hebt al dit kwaad gedaan; maar wijk niet af van achter de HEERE, maar dien de HEERE met uw hele hart.", "Spr 11:2": "Als de hoogmoed komt, zal de schande ook komen; maar met de ootmoedigen is wijsheid.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Deut 8:17-20": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is. Maar als het gebeurt, dat u de HEERE, uw God, helemaal vergeet, en andere goden navolgt, en hen dient, en u voor hen buigt, dan verklaar ik vandaag tegen u, dat u zeker zult omkomen.", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "Ps 50:18": "Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.", "Ps 136:1-26": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Loof de God der goden; want Zijn goedertierenheid is voor eeuwig. Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Ps 107:15": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Spr 11:6": "De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid.", "2 Kor 8:1-5": "Verder maken wij u bekend, broeders, de genade van God, die in de gemeenten van Macedonië gegeven is. Dat in veel beproeving van de verdrukking de overvloed van hun blijdschap, en hun zeer diepe armoede overvloedig geweest is tot de rijkdom van hun goeddadigheid. Want zij zijn naar vermogen (ik betuig het), ja, boven vermogen gewillig geweest;", "Ex 32:31": "Zo keerde Mozes terug tot de HEERE, en zei: Och, dit volk heeft een grote zonde gezondigd, doordat zij zich gouden goden gemaakt hebben.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Num 9:23": "Naar het bevel van de HEERE legerden zij zich, en naar het bevel van de HEERE trokken zij verder; zij namen de wacht van de HEERE waar, naar het bevel van de HEERE, door de hand van Mozes.", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Hos 8:2": "Dan zullen zij tot Mij roepen: Mijn God! Wij, Israël, kennen U.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Ps 97:12": "Rechtvaardigen, verblijd u in de HEERE, en spreek lof ter gedachtenis van Zijn heiligheid.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Spr 11:20": "De verkeerden van hart zijn de HEERE een gruwel; maar de oprechten van weg zijn Zijn welgevallen.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Spr 12:26": "De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg van de goddelozen doet hen dwalen.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Ps 135:19": "U, huis van Israël! looft de HEERE; u, huis van Aäron! looft de HEERE.", "Jer 3:11": "Toen zei de HEERE tegen mij: Het afgekeerde Israël heeft zichzelf rechtvaardiger getoond dan de trouweloze Juda.", "Hos 10:1": "Israël is een uitgeledigde wijnstok, hij brengt weer vrucht voort voor zichzelf; maar naar de veelheid van zijn vrucht heeft hij de altaren vermeerderd; naar de goedheid van zijn land hebben zij de opgerichte beelden mooi gemaakt.", "1 Kor 4:20": "Want het Koninkrijk van God bestaat niet in woorden, maar in kracht.", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Ps 73:8": "Zij mergelen de mensen uit, en spreken bos van verdrukking; zij spreken uit de hoogte.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Job 21:31": "Wie zal hem in het aangezicht zijn weg voorhouden? Als hij iets doet, wie zal het hem vergelden?", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "2 Sam 8:15": "Zo regeerde David over heel Israël, en David deed aan zijn hele volk recht en gerechtigheid.", "Jes 42:25": "Daarom heeft Hij over hen uitgestort de grimmigheid van Zijn toorn en de macht van de oorlog; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Ps 112:4-8": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig. Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht. Caph. Zeker, hij zal in eeuwigheid niet wankelen; Lamed. de rechtvaardige zal in eeuwige gedachtenis zijn.", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Openb 18:7": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.", "2 Kon 5:26": "Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "Ps 135:1-3": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE! U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God! Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "2 Kor 6:14": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis?", "Kol 3:14": "En doe boven dit alles de liefde aan, die de band van de volmaaktheid is.", "Jes 9:16": "Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ps 26:5": "Ik haat de vergadering van de boosdoeners, en bij de goddelozen zit ik niet.", "Fil 3:12-15": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben. Broeders, ik acht niet dat ik het zelf al gegrepen heb. Maar één ding doe ik: ik vergeet wat achter is, en strek mij uit naar wat voor is, en jaag naar het doel, naar de prijs van de roeping van God van boven in Christus Jezus.", "Mark 7:6-8": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij. Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen; Want u laat het gebod van God los, en houdt vast aan de overleveringen van mensen, namelijk het wassen van kannen en drinkbekers; en vele andere dergelijke dingen doet u.", "Ps 119:44": "Zo zal ik Uw wet voortdurend onderhouden, eeuwig en altijd.", "Luk 14:35": "Het is niet meer geschikt voor het land, en ook niet voor de mesthoop; men gooit het weg. Wie oren heeft om te horen, laat hij horen.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Kol 1:7": "Zoals u ook geleerd hebt van Epafras, onze geliefde mededienstknecht, die een trouw dienaar van Christus is voor u;", "Rom 11:25": "Want ik wil niet, broeders, dat u deze verborgenheid onbekend is (opdat u niet wijs bent, bij uzelf), dat de verharding voor een deel over Israël gekomen is, totdat de volheid van de heidenen zal ingegaan zijn.", "Job 31:6": "Hij weegt mij op, in een rechte weegschaal, en God zal mijn oprechtheid weten.", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Jer 21:12": "O huis van David! zo zegt de HEERE: Spreek 's morgens recht, en bevrijd de beroofde uit de hand van de verdrukker; anders zal Mijn gramschap uitvaren als een vuur, en branden, zodat niemand het blussen kan, vanwege de slechtheid van uw daden.", "Hand 8:25": "Zij dan nu, toen zij het Woord van de Heere betuigd en gesproken hadden, keerden terug naar Jeruzalem, en verkondigden het Evangelie in veel dorpen van de Samaritanen.", "Ezech 28:17": "Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.", "Ps 148:1-14": "Halleluja! Looft de HEERE uit de hemelen; looft Hem in de hoogste plaatsen! Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen! Looft Hem, zon en maan! Looft Hem, alle lichtende sterren!", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Matt 5:28": "Maar Ik zeg u, dat ieder die naar een vrouw kijkt om haar te begeren, al overspel met haar gepleegd heeft in zijn hart.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Matt 20:27": "en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "Fil 4:20": "Onze God en Vader nu zij de heerlijkheid tot in alle eeuwigheid. Amen.", "Zef 1:6": "En hen die terugkeren van achter de HEERE; en die de HEERE niet zoeken, en niet naar Hem vragen.", "Hand 11:29": "En naarmate ieder van de discipelen in staat was, besloot elk van hen iets te sturen ten dienste van de broeders die in Judea woonden.", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Matt 25:3": "Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Matt 23:10-12": "Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus. Maar de meeste onder u zal uw dienaar zijn. En wie zichzelf verhogen zal, die zal vernederd worden; en wie zichzelf zal vernederen, die zal verhoogd worden.", "Hos 8:13": "Aangaande de offers van Mijn gaven: zij offeren vlees en eten het, maar de Heere heeft in hen geen welbehagen. Nu zal Hij aan hun ongerechtigheid denken en hun zonden straffen; zij zullen terugkeren naar Egypte.", "Matt 7:5": "Huichelaar! Haal eerst de balk uit uw eigen oog, en dan zult u goed genoeg zien om de splinter uit het oog van uw broeder te halen.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Richt 9:15": "En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "1 Kor 13:1": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn.", "Hos 4:17": "Efraïm is met de afgoden verbonden; laat hem begaan.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Gen 17:1": "Toen Abram negenennegentig jaar oud was, verscheen de HEERE aan Abram en zei tegen hem: Ik ben God, de Almachtige! Wandel voor Mijn aangezicht en wees oprecht!", "Job 9:21": "Ben ik oprecht, dan acht ik toch mijn ziel niet; ik versmaad mijn leven.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Jer 48:29": "Wij hebben Moabs hoogmoed gehoord (hij is zeer hoogmoedig), zijn trots, en zijn hoogmoed, en zijn overmoed, en de hoogheid van zijn hart.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Jak 1:22-24": "En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel; Want hij heeft zichzelf bekeken, en is weggegaan, en heeft meteen vergeten hoe hij eruitzag.", "1 Joh 3:7": "Kinderen, laat niemand u verleiden. Die de rechtvaardigheid doet, is rechtvaardig, zoals Hij rechtvaardig is.", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Ps 116:17-19": "Ik zal U een offer van dankzegging offeren, en de Naam van de HEERE aanroepen. Ik zal mijn gelofte de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk, in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Ps 141:4": "Neig mijn hart niet tot een kwade zaak, om enige handel in goddeloosheid te bedrijven, met mannen die ongerechtigheid bedrijven; en laat mij niet eten van hun lekkernijen.", "Joh 14:3": "En wanneer Ik heen zal zijn gegaan en u plaats zal hebben bereid, kom Ik terug en zal u tot Mij nemen, opdat u ook mag zijn waar Ik ben.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "Hos 7:7": "Zij zijn allemaal samen verhit als een bakoven, en zij verteren hun rechters; al hun koningen vallen; er is niemand onder hen die tot Mij roept.", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "Jes 12:1-6": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij. Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden. En u zult water scheppen met vreugde uit de fonteinen van het heil;", "Jer 7:4": "Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze!", "Ps 94:12": "Gelukkig is de man, o HEERE! die Gij tuchtigt, en die Gij leert uit Uw wet,", "1 Joh 3:3": "En ieder die deze hoop op Hem heeft, reinigt zichzelf, zoals Hij rein is.", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "1 Petr 4:2": "om niet meer naar de begeerten van de mensen, maar naar de wil van God de tijd te leven die nog over is in het vlees.", "Ps 99:9": "Verhef de HEERE, onze God, en buig u voor de berg van Zijn heiligheid; want de HEERE, onze God, is heilig.", "1 Joh 5:10": "Wie in de Zoon van God gelooft, heeft het getuigenis in zichzelf; wie God niet gelooft, heeft Hem tot een leugenaar gemaakt, omdat hij niet geloofd heeft het getuigenis dat God getuigd heeft van Zijn Zoon.", "Ps 50:23": "Wie dank offert, die zal Mij eren; en wie zijn weg goed inricht, die zal Ik Gods heil doen zien.", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Ps 119:125": "Ik ben Uw knecht, maak mij verstandig, en ik zal Uw getuigenissen kennen.", "Amos 5:21-27": "Ik haat, Ik verafschuw uw feesten, en Ik kan uw verbodsdagen niet rieken. Want al offert u Mij brandoffers, alsook uw spijsoffers, Ik heb er toch geen welgevallen aan; en het dankoffer van uw vette beesten wil Ik niet aanzien. Doe het lawaai van uw liederen van Mij weg; ook wil Ik het spel van uw luiten niet horen.", "Ps 34:2-4": "Aleph. Ik zal de HEERE loven te allen tijde; Zijn lof zal voortdurend in mijn mond zijn. Beth. Mijn ziel zal zich beroemen in de HEERE; de zachtmoedigen zullen het horen en zich verblijden. Gimel. Maakt de HEERE met mij groot, en laten wij Zijn Naam samen verhogen.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Spr 3:32": "Want de afwijker is de HEERE een gruwel; maar Zijn verborgenheid is met de oprechte.", "Ps 104:34": "Mijn overdenking van Hem zal zoet zijn; ik zal mij in de HEERE verblijden.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "1 Kor 14:38": "Maar als iemand onwetend is, laat hij dan onwetend blijven.", "Ps 119:62": "Te middernacht sta ik op, om U te loven voor de rechten van Uw gerechtigheid.", "Jer 6:20": "Waartoe zal dan de wierook voor Mij uit Scheba komen, en de beste kalmus uit ver land? Uw brandoffers zijn Mij niet behagelijk, en uw slachtoffers zijn Mij niet zoet.", "Job 27:13-18": "Dit is het deel van de goddeloze mens bij God, en de erve van de tirannen, die zij van de Almachtige ontvangen zullen. Indien zijn kinderen zich vermenigvuldigen, het is voor het zwaard; en zijn spruiten zullen van brood niet verzadigd worden. Zijn overgeblevenen zullen in de dood begraven worden, en zijn weduwen zullen niet wenen.", "Ps 105:1-5": "Looft de HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken. Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen. Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "Job 40:7": "Zie ieder hoogmoedige, en breng hem ten onder; en verpletter de goddelozen in hun plaats!", "Spr 18:12": "Vóór de ondergang verheft zich het hart van de mens; en de nederigheid gaat vóór de eer.", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Spr 16:19": "Het is beter nederig van geest te zijn met de zachtmoedigen, dan buit te delen met de hoogmoedigen.", "Jer 42:20-22": "Zeker, u hebt uzelf misleid; want u hebt mij tot de HEERE, uw God, gezonden, en gezegd: Bid voor ons tot de HEERE, onze God, en maak ons alles bekend wat de HEERE, onze God, zal zeggen, en wij zullen het doen. Nu heb ik het u heden bekendgemaakt; maar u hebt niet geluisterd naar de stem van de HEERE, van uw God, noch naar al hetgeen waarmee Hij mij tot u gezonden heeft. Zo weet nu zeker, dat u door het zwaard, door de honger en door de pestilentie zult sterven, op de plaats waar u naartoe wilde gaan om daar als vreemdelingen te wonen.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "Gen 6:9": "Dit zijn de afstammelingen van Noach. Noach was een rechtvaardig, oprecht man onder zijn tijdgenoten. Noach wandelde met God.", "Spr 14:8": "De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.", "Joh 8:44": "U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.", "Joh 4:34": "Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.", "2 Petr 2:17": "Dezen zijn waterloze bronnen, wolken die door een storm worden voortgedreven; voor hen is de donkerheid van de duisternis voor eeuwig bewaard.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Spr 26:24-26": "Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart. Wiens haat door bedrog bedekt is, diens slechtheid zal in de gemeente openbaar worden.", "Ps 113:2": "De Naam van de HEERE zij geprezen, van nu af tot in eeuwigheid.", "Ps 125:5": "Maar die zich neigen tot hun kromme wegen, die zal de HEERE weg doen gaan met de werkers van de ongerechtigheid. Vrede zal over Israël zijn!", "Job 31:1": "Ik heb een verbond gemaakt met mijn ogen; hoe zou ik dan acht gegeven hebben op een maagd?", "2 Kor 13:5": "Onderzoek uzelf, of u in het geloof bent, beproef uzelf. Of weet u zelf niet, dat Jezus Christus in u is? Tenzij u op de een of andere manier verwerpelijk bent.", "Jak 1:25": "Maar wie zich verdiept in de volmaakte wet, die van de vrijheid is, en daarbij blijft, die is geen vergeetachtige hoorder geworden, maar een dader van het werk, die zal, zeg ik, gelukzalig zijn in dit zijn doen.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Ps 84:5": "Gelukkig zijn zij, die in Uw huis wonen; zij prijzen U gestadig. Sela.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Jer 17:16": "Ik heb toch niet aangedrongen, meer dan een herder achter U betaamde; ook heb ik de dodelijke dag niet begeerd, Gij weet het; wat uit mijn lippen is gegaan, is voor Uw aangezicht geweest.", "2 Kor 5:12": "Want wij prijzen onszelf bij u niet opnieuw aan, maar wij geven u aanleiding om over ons te roemen, opdat u iets zou hebben tegen hen die roemen op het uiterlijk en niet op het hart.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Ps 119:70": "Hun hart is vet als smeer; maar ik heb vermaak in Uw wet.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Hand 2:46": "En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "Ps 149:1-9": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning. Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "1 Kon 8:61": "En uw hart zij volkomen met de HEERE, onze God, om te wandelen in Zijn inzettingen, en Zijn geboden te houden, zoals op deze dag.", "Matt 16:3": "en 's morgens: Vandaag onweer; want de hemel is somber rood. Huichelaars! Het uiterlijk van de hemel weet u wel te onderscheiden, maar kunt u de tekenen van de tijden niet onderscheiden?", "Spr 12:19": "Een waarachtige lip zal voor altijd bevestigd worden; maar een valse tong is maar voor een ogenblik.", "Ps 106:44": "Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde.", "2 Kron 25:19": "U zegt: Zie, ik heb de Edomieten geslagen; daarom heeft uw hart u verheven om te roemen; blijf nu in uw huis; waarom zou u zich in het kwaad mengen, zodat u zou vallen, u en Juda met u?", "Jes 14:12-16": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte! En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden. Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "Ps 50:17": "Omdat u de kastijding haat, en Mijn woorden achter u weggooit.", "Hos 12:1": "Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.", "Fil 3:12-14": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben. Broeders, ik acht niet dat ik het zelf al gegrepen heb. Maar één ding doe ik: ik vergeet wat achter is, en strek mij uit naar wat voor is, en jaag naar het doel, naar de prijs van de roeping van God van boven in Christus Jezus.", "Ezech 5:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Spr 10:31": "De mond van de rechtvaardige brengt overvloedig wijsheid voort; maar de tong van de verkeerdheden zal uitgeroeid worden.", "Deut 11:20": "En schrijf ze op de posten van uw huis, en aan uw poorten;", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Ps 119:164": "Ik loof U zevenmaal per dag, over de rechten van Uw gerechtigheid.", "Deut 10:21": "Hij is uw lof, en Hij is uw God. Die bij u deze grote en ontzagwekkende dingen gedaan heeft, die uw ogen gezien hebben.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Luk 14:8": "Wanneer u door iemand op een bruiloft genodigd wordt, ga dan niet op de eerste plaats zitten; anders zou misschien iemand die voornamer is dan u door hem genodigd zijn,", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "2 Kron 25:18": "Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Jes 26:16": "HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Ps 104:33": "Ik zal de HEERE zingen in mijn leven; ik zal mijn God psalmzingen, zolang ik nog ben.", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Ps 119:108": "Laat U toch, o HEERE! welgevallen de vrijwillige offeranden van mijn mond, en leer mij Uw rechten.", "Ps 26:9": "Raap mijn ziel niet weg met de zondaars, en mijn leven niet met de mannen van het bloed;", "Job 37:24": "Daarom vrezen de mensen Hem; Hij ziet geen enkele wijze van hart aan.", "Jes 65:5": "Die daar zeggen: Houd u tot uzelf, en kom niet bij mij, want ik ben heiliger dan u. Deze zijn een rook in Mijn neus, een vuur, dat de hele dag brandt.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 119:146": "Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden.", "Joh 14:21-24": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren. Judas, niet de Iskariot, zei tegen Hem: Heere, hoe komt het dat U Uzelf aan ons zult openbaren, en niet aan de wereld? Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Ps 40:5": "Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot leugen afwijken.", "Obadja 1:3": "De trots van uw hart heeft u bedrogen; u die woont in de kloven van de rotsen, in uw hoge woning; die in uw hart zegt: Wie zou mij ter aarde neerstoten?", "Job 15:34": "Want de vergadering van de huichelaars wordt eenzaam, en het vuur verteert de tenten van de geschenken.", "Spr 29:7": "De rechtvaardige neemt kennis van de rechtszaak van de armen; maar de goddeloze begrijpt die kennis niet.", "Ps 47:2": "Al u volken, klapt in de hand; juicht tot God met een stem van vreugdegezang.", "Spr 1:10": "Mijn zoon! als de zondaars u aanlokken, stem er niet mee in;", "Ps 38:2": "O HEERE! Straf mij niet in Uw grote toorn, en straf mij niet in Uw grimmigheid.", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Luk 1:52": "Hij heeft machtigen van de tronen afgezet, en nederigen heeft Hij verhoogd.", "Ezech 22:9": "Achterklappers zijn in u geweest om bloed te vergieten, en in u hebben zij op de bergen gegeten, zij hebben schandelijkheid in uw midden gedaan.", "2 Kron 7:13": "Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend;", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "Jak 1:26": "Als iemand onder u denkt dat hij godsdienstig is, en zijn tong niet in toom houdt, maar zijn hart verleidt, diens godsdienst is nutteloos.", "1 Kor 13:4": "De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen;", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Spr 10:16": "Het werk van de rechtvaardige leidt tot leven; de opbrengst van de goddeloze leidt tot zonde.", "Ps 39:2": "Ik zei: Ik zal op mijn wegen letten, dat ik niet zondig met mijn tong; ik zal mijn mond met een breidel in toom houden, terwijl de goddeloze nog tegenover mij is.", "Hos 12:3": "Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.", "Luk 8:15": "En wat in de goede aarde valt, dat zijn zij die het Woord gehoord hebben en het in een eerlijk en goed hart bewaren, en met volharding vruchten voortbrengen.", "Lev 18:3": "U zult niet doen naar de werken van het Egyptische land, waarin u gewoond hebt; en naar de werken van het land Kanaän, waarheen Ik u breng, zult u niet doen, en u zult in hun inzettingen niet wandelen.", "Ps 97:8": "Sion heeft het gehoord, en het heeft zich verblijd, en de dochters van Juda hebben zich verheugd vanwege Uw oordelen, o HEERE!", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam a /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();
