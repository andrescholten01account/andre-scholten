 is ook ijdelheid en kwelling van de geest.", "Ps 10:2-4": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben. Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE. De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "Jer 51:45": "Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.", "Ps 50:19": "Uw mond zet u in voor het kwade, en uw tong koppelt bedrog.", "Jes 32:7": "En het hele gereedschap van een gierigaard is kwaad; hij bedenkt schandelijke plannen, om de ellendigen te gronde te richten met valse woorden, ook als de arme spreekt wat recht is.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Joh 6:70": "Jezus antwoordde hun: Heb Ik u niet twaalf uitgekozen? En één van u is een duivel.", "Spr 17:12": "Beter dat een berin die van haar jongen beroofd is, een man tegemoetkomt, dan een dwaas in zijn dwaasheid.", "Ps 138:6": "Want de HEERE is hoog, toch ziet Hij de nederige aan, en de verhevene kent Hij van verre.", "Ps 49:12": "Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen.", "Matt 20:26": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn;", "Ps 119:105": "Nun. Uw woord is een lamp voor mijn voet, en een licht voor mijn pad.", "Hebr 12:5-11": "En u bent de vermaning vergeten, die tot u spreekt als tot zonen: Mijn zoon, acht de kastijding van de Heere niet klein, en bezwijk niet als u door Hem bestraft wordt; Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt. Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?", "Joh 8:45": "Maar Mij, omdat Ik u de waarheid zeg, gelooft u niet.", "Ps 34:22": "Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Ps 30:5": "Zingt psalmen voor de HEERE, u, Zijn gunstgenoten! en looft ter gedachtenis aan Zijn heiligheid.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Jer 48:14": "Hoe kunt u zeggen: Wij zijn helden en dappere mannen voor de strijd?", "Rom 13:1-4": "Ieder mens moet onderworpen zijn aan de machten die over hem gesteld zijn; want er is geen macht dan van God, en de machten die er zijn, zijn door God aangesteld. Zodat hij die zich tegen de macht stelt, de instelling van God weerstaat; en zij die weerstaan, zullen over zichzelf een oordeel halen. Want de leiders zijn niet tot een schrik voor de goede werken, maar voor de kwade. Wilt u nu de macht niet vrezen? Doe het goede, en u zult lof van haar hebben;", "Ps 48:9": "Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "Ps 150:1-6": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte! Loof Hem vanwege Zijn machtige daden; loof Hem naar de overvloed van Zijn grootheid! Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Hos 7:9": "Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwheid over hem verspreid, en hij merkt het niet.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "1 Tim 5:22": "Leg niemand haastig de handen op, en heb geen gemeenschap met de zonden van anderen; bewaar uzelf rein.", "Ps 66:16": "Komt, hoort toe, allen die God vrezen, en ik zal vertellen wat Hij aan mijn ziel gedaan heeft.", "Hos 9:3": "Zij zullen in het land van de Heere niet blijven; maar Efraïm zal weer naar Egypte terugkeren, en zij zullen in Assyrië het onreine eten.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Ps 55:21": "Hij slaat zijn handen aan hen die vrede met Hem hadden; hij ontheiligt Zijn verbond.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Ezech 18:5-9": "Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert; En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "Ps 119:158": "Ik heb gezien degenen, die trouweloos handelen, en het verdroot mij, dat zij Uw woord niet onderhielden.", "Matt 24:12": "En omdat de ongerechtigheid zal toenemen, zal de liefde van velen verkillen.", "Dan 11:45": "En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben.", "Joh 7:19": "Heeft Mozes u niet de wet gegeven? En niemand van u doet de wet. Waarom probeert u Mij te doden?", "Ps 100:1-5": "Een lofzang. Heel de aarde, juich voor de HEERE! Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang. Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "1 Kor 4:6-8": "En deze dingen, broeders, heb ik op mijzelf en Apollos bij wijze van voorbeeld toegepast, om uwentwil; opdat u van ons zou leren niet te denken boven wat geschreven is, opdat u niet, de een om de ander, opgeblazen wordt tegen elkaar. Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had? Al bent u verzadigd, al bent u rijk geworden, zonder ons hebt u geheerst; en och, was het maar zo dat u heerste, opdat ook wij met u heersen mochten!", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "2 Sam 19:26": "En hij zei: Mijn heer koning, mijn knecht heeft mij bedrogen; want uw knecht zei: Ik zal voor mij een ezel zadelen, en daarop rijden, en naar de koning trekken, want uw knecht is kreupel.", "Ps 89:11": "Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.", "Spr 6:25": "Begeer haar schoonheid niet in uw hart, en laat u door haar niet vangen met haar oogleden.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "1 Kor 5:13": "Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "Ps 55:13-15": "Want het is geen vijand die mij hoont, anders zou ik het hebben gedragen; het is mijn hater niet die zich tegen mij groot maakt, anders zou ik mij voor hem verborgen hebben. Maar u bent het, o mens, als van mijn eigen stand, mijn leidsman en mijn bekende! Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Luk 1:67-75": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei: Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Spr 28:4": "Wie de wet verlaten, prijzen de goddelozen; maar wie de wet bewaren, gaan de strijd met hen aan.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Ps 99:3": "Laat men Uw grote en ontzagwekkende Naam loven, die heilig is;", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "Ps 7:12-14": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt. Als hij zich niet bekeert, zal Hij Zijn zwaard scherpen; Hij heeft Zijn boog gespannen, en hem gereedgemaakt. En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ps 40:10": "Ik verkondig de gerechtigheid in de grote gemeente; zie, mijn lippen bedwing ik niet; HEERE! Gij weet het.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Spr 26:16": "De luiaard is wijzer in zijn eigen ogen, dan zeven die met verstand antwoorden.", "2 Sam 22:27": "Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Hand 6:10": "En zij konden niet opgewassen zijn tegen de wijsheid en de Geest, door Wie hij sprak.", "Jes 32:5": "De dwaas zal niet meer milddadig genoemd worden, en de gierige zal niet meer mild geheten worden.", "Luk 24:52": "En zij aanbaden Hem, en keerden terug naar Jeruzalem met grote blijdschap.", "Ps 107:8": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "1 Joh 3:17-24": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem? Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid. En hieraan weten wij dat wij uit de waarheid zijn, en wij zullen ons hart verzekeren voor Hem.", "Ps 14:3": "Zij zijn allen afgeweken, samen zijn zij smerig geworden; er is niemand die goed doet, ook niet één.", "Ps 147:1-20": "Looft de HEERE, want onze God te bezingen is goed, omdat Hij liefelijk is; de lof is Hem waardig. De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël. Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "Rom 11:36": "Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid tot in eeuwigheid. Amen.", "Spr 21:27": "Het offer van de goddelozen is een gruwel; hoeveel te meer, als zij het met een schandelijk voornemen brengen!", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Hebr 6:8": "maar die doornen en distels draagt, is verwerpelijk, en dicht bij de vervloeking, waarvan het einde verbranding is.", "Ps 119:48": "En ik zal mijn handen opheffen naar Uw geboden, die ik liefheb, en ik zal Uw inzettingen betrachten.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Ps 119:171": "Mijn lippen zullen Uw lof overvloedig uitstorten, als U mij Uw inzettingen zult geleerd hebben.", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "Jer 31:7": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël.", "Ezech 33:30-32": "En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt. En zij komen tot u, zoals het volk gewoon is te komen, en zitten voor uw aangezicht als Mijn volk, en horen uw woorden, maar zij doen ze niet; want zij spreken lieve woorden met hun mond, maar hun hart gaat hun hebzucht na. En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.", "Jes 2:11-17": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn. Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt; En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan;", "Job 8:13-15": "Zo zijn de wegen van allen die God vergeten; en de verwachting van de huichelaar zal vergaan. Van wie zijn hoop walgen zal; en zijn vertrouwen zal zijn als het huis van een spin. Hij zal op zijn huis leunen, maar het zal niet bestaan; hij zal zich eraan vasthouden, maar het zal niet staande blijven.", "Job 31:33": "Als ik, net als Adam, mijn overtredingen bedekt heb, door eigenliefde mijn misdaad verbergende!", "Ps 12:3": "Zij spreken valsheid, ieder met zijn naaste, met vleiende lippen; zij spreken met een dubbel hart.", "Hand 10:1-6": "En er was een zeker man in Cesarea, met de naam Cornelius, een hoofdman over honderd, uit de bende die de Italiaanse genoemd werd; Godvrezend en godvruchtig, met heel zijn huis, en hij gaf veel aalmoezen aan het volk, en bad voortdurend tot God. Deze zag in een gezicht klaar, omtrent het negende uur van de dag, een engel van God bij hem binnenkomen, die tegen hem zei: Cornelius!", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "Matt 3:10": "En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Ps 61:9": "Zo zal ik Uw Naam psalmzingen in eeuwigheid; opdat ik mijn geloften betaal, dag bij dag.", "Jes 57:16-18": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb. Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart. Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.", "1 Petr 3:6": "zoals Sara Abraham gehoorzaam is geweest, hem heer noemend, van wie u dochters geworden bent, als u goed doet en voor geen enkele verschrikking bang bent.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Hand 8:4": "Zij dan nu, die verstrooid waren, trokken het land door en verkondigden het Woord.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Matt 6:5": "En wanneer u bidt, wees dan niet zoals de geveinsden; want die bidden graag terwijl ze in de synagogen en op de hoeken van de straten staan, opdat zij door de mensen gezien worden. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben.", "Fil 2:26": "Omdat hij zeer begerig was naar u allen, en zeer beangst was, omdat u had gehoord dat hij ziek was geweest.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Ps 119:115": "Wijkt van mij, u boosdoeners! dat ik de geboden van mijn God moge bewaren.", "Ps 119:53": "Grote beroering heeft mij bevangen vanwege de goddelozen, die Uw wet verlaten.", "Spr 13:2": "Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.", "Num 11:29": "Maar Mozes zei tegen hem: Bent u ijverzuchtig voor mij? Och, was al het volk van de HEERE maar profeten, zodat de HEERE Zijn Geest over hen zou geven!", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Ps 35:28": "Zo zal mijn tong Uw gerechtigheid vermelden, en Uw lof de hele dag.", "Kol 1:28": "Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;", "Ps 57:9": "Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken.", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "1 Petr 2:11-25": "Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel; En houd uw levenswandel eerlijk onder de heidenen; opdat, waar zij nu kwaad van u spreken als van kwaaddoeners, zij door de goede werken die zij van u zien, God mogen verheerlijken op de dag dat Hij naar hen omziet. Wees dan onderdanig aan alle menselijke instelling, om de Heere; hetzij aan de koning, als hebbende het hoogste gezag;", "Matt 21:41": "Zij zeiden tegen hem: Hij zal die kwaden een kwade dood laten sterven, en de wijngaard verhuren aan andere landbouwers, die hem de vruchten op de juiste tijd zullen geven.", "Spr 28:19": "Wie zijn land bouwt, zal met brood verzadigd worden; maar wie nietige mensen volgt, zal met armoede verzadigd worden.", "Jak 1:14": "Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Mark 12:38-40": "En Hij zei tegen hen in Zijn onderwijs: Pas op voor de Schriftgeleerden, die graag in lange kleren willen rondlopen, en gegroet willen worden op de markten; en de voorste plaatsen willen hebben in de synagogen, en de ereplaatsen bij de maaltijden; die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "Ps 119:163": "Ik haat de valsheid, en heb er een gruwel van; maar Uw wet heb ik lief.", "Rom 6:17": "Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Matt 19:21": "Jezus zei tegen hem: Als u volmaakt wilt zijn, ga heen, verkoop wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom hier, volg Mij.", "1 Kor 15:57": "Maar God zij dank, Die ons de overwinning geeft door onze Heere Jezus Christus.", "1 Kron 29:19": "En geef mijn zoon Salomo een volkomen hart, om Uw geboden, Uw getuigenissen en Uw inzettingen te houden; en om alles te doen, en om dit paleis te bouwen, dat ik klaargemaakt heb.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "1 Joh 4:4-21": "Kinderen, u bent uit God, en hebt hen overwonnen; want Hij die in u is, is meer dan hij die in de wereld is. Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen. Wij zijn uit God. Die God kent, hoort ons; die niet uit God is, hoort ons niet. Hieraan herkennen wij de geest van de waarheid en de geest van de dwaling.", "1 Joh 2:29": "Als u weet, dat Hij rechtvaardig is, dan weet u, dat ieder, die de rechtvaardigheid doet, uit Hem geboren is.", "Matt 22:12": "En hij zei tegen hem: Vriend! Hoe bent u hier binnengekomen zonder een bruiloftskleed aan te hebben? En hij verstomde.", "Jer 9:3": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "1 Tess 3:1": "Daarom hebben wij, omdat we het verlangen niet langer konden verdragen, het goed gevonden om alleen in Athene achtergelaten te worden;", "Joz 14:6-14": "Toen naderden de kinderen van Juda tot Jozua, te Gilgal, en Kaleb, de zoon van Jefunne, de Keneziet, zei tegen hem: U weet het woord dat de HEERE tot Mozes, de man van God, gesproken heeft te Kades-Barnea, vanwege mij, en vanwege u. Ik was veertig jaar oud, toen Mozes, de dienaar van de HEERE, mij uitgezonden heeft van Kades-Barnea om het land te verkennen, en ik hem antwoord bracht, zoals het in mijn hart was. Maar mijn broeders, die met mij opgegaan waren, deden het hart van het volk smelten; maar ik volhardde erin de HEERE, mijn God, na te volgen.", "Jes 5:11-14": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft! En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Mark 6:6": "En Hij verwonderde Zich over hun ongeloof, en trok rond door de dorpen daar in de omgeving, terwijl Hij onderwees.", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "Ex 23:32": "U zult met hen, noch met hun goden, een verbond sluiten.", "Fil 4:3": "En ik bid ook u, mijn oprechte metgezel, wees deze vrouwen behulpzaam, die met mij gestreden hebben in het Evangelie, ook met Clemens, en de andere medearbeiders van mij, van wie de namen in het boek van het leven staan.", "Ps 41:14": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid! Amen, ja, amen.", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Joh 15:4": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Gen 6:12": "Toen zag God de aarde, en zie, zij was verdorven; want alle vlees had zijn weg verdorven op de aarde.", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Spr 30:12": "Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "Spr 10:9": "Wie in oprechtheid wandelt, wandelt zeker; maar wie zijn wegen verdraait, zal bekend worden.", "Jes 48:2": "Ja, van de heilige stad worden zij genoemd, en zij steunen op de God van Israël; HEERE van de heerscharen is Zijn Naam.", "2 Petr 2:10": "maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren;", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "1 Tim 1:17": "De Koning nu der eeuwen, de onverderfelijke, de onzichtbare, de alleen wijze God, zij eer en heerlijkheid in alle eeuwigheid. Amen.", "Jer 51:6": "Vlucht uit het midden van Babel, en red ieder zijn ziel; word niet uitgeroeid in haar ongerechtigheid; want dit is de tijd van de wraak van de HEERE, Die haar de verdienste betaalt.", "1 Sam 3:11-14": "En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.", "Ps 34:16": "Ain. De ogen van de HEERE zijn op de rechtvaardigen, en Zijn oren gericht op hun geroep.", "Kol 2:9-11": "Want in Hem woont heel de volheid van de Godheid lichamelijk; En u bent in Hem volmaakt, Die het Hoofd is van alle overheid en macht; In Wie u ook besneden bent met een besnijdenis die niet met handen gedaan wordt, in het uittrekken van het lichaam van de zonden van het vlees, door de besnijdenis van Christus;", "Ps 52:4-7": "Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela. U hebt alle woorden van verslinding lief, en een tong van het bedrog.", "Ps 119:145": "Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren.", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "1 Petr 4:18": "En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?", "Jer 50:32": "Dan zal de trotse aanstoten en vallen, en er zal niemand zijn die hem opricht; ja, Ik zal een vuur aansteken in zijn steden, dat zal alle plaatsen rondom hem verteren.", "Ps 140:14": "Zeker, de rechtvaardigen zullen Uw Naam loven; de oprechten zullen voor Uw aangezicht blijven.", "1 Joh 3:9-11": "Ieder die uit God geboren is, doet de zonde niet, want Zijn zaad blijft in hem; en hij kan niet zondigen, want hij is uit God geboren. Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft, want dit is de verkondiging die u vanaf het begin gehoord hebt, dat wij elkaar zouden liefhebben.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Job 20:4-18": "Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft, Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken;", "Ps 118:18": "De HEERE heeft mij wel hard gekastijd; maar Hij heeft mij niet ter dood overgegeven.", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "1 Kor 8:1": "Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "1 Joh 5:18": "Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Spr 17:19": "Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Obadja 1:4": "Al verheft u zich als de arend, en al zet u uw nest tussen de sterren, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Jak 3:2": "Want wij struikelen allen in veel dingen. Als iemand in woorden niet struikelt, die is een volmaakt man, in staat om ook het hele lichaam in toom te houden.", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "Ps 118:15": "In de tenten van de rechtvaardigen is een stem van gejuich en van het heil; de rechterhand van de HEERE doet krachtige daden.", "Ps 146:1-10": "Halleluja! O mijn ziel, prijs de HEERE. Ik zal de HEERE prijzen in mijn leven; ik zal mijn God psalmzingen, terwijl ik nog ben. Vertrouw niet op prinsen, op een mensenkind, bij wie geen heil is.", "Lev 19:11": "U zult niet stelen, en u zult niet liegen, noch bedrieglijk handelen, ieder tegen zijn naaste.", "Jer 6:28": "Zij zijn allen de ergste afvalligen; zij wandelen in achterklap; zij zijn koper en ijzer; zij zijn allemaal verdervers.", "Ps 15:1-5": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "Micha 2:8-10": "Maar onlangs stelde Mijn volk zich op als vijand, tegenover een kleed; u stroopt een mantel af van hen die zonder zorg voorbijgaan, terugkomende van de strijd. De vrouwen van Mijn volk verdrijft u, elk uit het huis van haar genoegens; van haar kinderen neemt u Mijn sieraad voor altijd weg. Maak u dan op en ga heen; want dit land zal de rust niet zijn; omdat het verontreinigd is, zal het u verderven, en dat met een hevige verderving.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Job 15:33": "Men zal zijn onrijpe druiven afrukken, als van een wijnstok, en zijn bloeisel afwerpen, als van een olijfboom.", "Ezech 20:39": "En u, o huis van Israël, zo zegt de Heere HEERE: Gaat heen, dient ieder zijn drekgoden, ook hierna, omdat u naar Mij niet wilt horen; maar ontheiligt niet meer Mijn heilige Naam, met uw giften en met uw drekgoden.", "Hand 4:2": "Zeer ontevreden, omdat zij het volk leerden en in Jezus de opstanding uit de doden verkondigden.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "1 Tess 2:10": "U bent getuigen, en God ook, hoe heilig, en rechtvaardig, en onberispelijk wij ons onder u, die gelooft, gedragen hebben.", "Hos 7:10": "Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles.", "Spr 11:5": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid.", "2 Sam 22:4": "Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.", "1 Kor 16:10": "Als Timotheüs nu komt, ziet erop dat hij zonder vrees bij u is; want hij doet het werk van de Heere, zoals ik ook.", "Spr 12:22": "Valse lippen zijn de HEERE een gruwel; maar wie trouw handelen, zijn Zijn welgevallen.", "Spr 17:7": "Een voortreffelijke lip past een dwaas niet, veel minder een vorst een leugenachtige lip.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Jer 13:9": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem.", "Jak 1:8": "Een dubbelhartig man is onstandvastig in al zijn wegen.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Mal 1:6-14": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam? U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk. Want als u iets blinds aanbrengt om te offeren, is dat bij u niet kwaad; en als u iets kreupels of iets kranks aanbrengt, is dat niet kwaad! Breng dat toch aan uw vorst; zal hij welgevallen aan u hebben? of zal hij u gunstig ontvangen? zegt de HEERE van de heerscharen.", "Spr 12:11": "Wie zijn land bewerkt, zal met brood verzadigd worden; maar wie nutteloze mensen volgt, is verstandeloos.", "Deut 22:13-19": "Wanneer een man een vrouw genomen heeft, en tot haar ingegaan is, en haar dan haat, En haar oorzaak geeft tot naspraak, en een kwade naam over haar verspreidt, en zegt: Deze vrouw heb ik genomen, en toen ik tot haar naderde, heb ik haar maagdelijkheid niet gevonden; Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "Ex 23:33": "Zij zullen in uw land niet wonen, opdat zij u niet tegen Mij laten zondigen; als u hun goden dient, zal het u zeker tot een valstrik zijn.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "1 Kor 10:12": "Wie dan meent te staan, laat hij toezien dat hij niet valt.", "Jes 23:7": "Is dit uw vrolijk huppelende stad? Wier oudheid van oude dagen af is; maar haar eigen voeten zullen haar ver wegdragen, om als vreemdeling te verblijven.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Spr 12:8": "Ieder zal geprezen worden, naarmate zijn verstandigheid is; maar wie verkeerd van hart is, zal tot verachting wezen.", "Spr 4:14": "Kom niet op het pad van de goddelozen, en betreed niet de weg van de bozen.", "Luk 24:53": "En zij waren voortdurend in de tempel, waar zij God loofden en dankten. Amen.", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "Ps 119:104": "Uit Uw bevelen krijg ik verstand, daarom haat ik alle leugenpaden.", "Matt 5:20": "Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan.", "Rom 2:1": "Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen.", "Spr 16:29": "Een man van geweld verlokt zijn naaste, en hij leidt hem op een weg die niet goed is.", "2 Kron 15:17": "De hoogten werden wel niet weggenomen uit Israël, het hart van Asa was echter volkomen al zijn dagen.", "Jes 2:5": "Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "Nahum 3:19": "Er is geen genezing voor uw breuk, uw plaag is smartelijk; allen die het gerucht van u horen, zullen de handen over u klappen; want over wie is uw boosheid niet voortdurend gegaan?", "Pred 12:9": "En verder, omdat de prediker wijs geweest is, leerde hij het volk nog kennis, en lette hij op, en onderzocht hij; hij bracht veel spreuken in orde.", "Jes 2:11": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn.", "Jer 7:8-10": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Spr 29:8": "Spotters brengen een stad in vuur en vlam; maar de wijzen keren de toorn af.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Jer 5:2": "En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals.", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "Hand 18:24-28": "En een zekere Jood, met de naam Apollos, van geboorte een Alexandriër, een welsprekend man, kwam naar Efeze, machtig zoals hij was in de Schriften. Deze was onderwezen in de weg van de Heere; en omdat hij vurig was van geest, sprak en leerde hij nauwkeurig de zaken van de Heere, al kende hij alleen de doop van Johannes. En hij begon vrijmoedig te spreken in de synagoge. En toen Aquila en Priscilla hem gehoord hadden, namen zij hem tot zich, en legden hem de weg van God nauwkeuriger uit.", "Zef 2:10": "Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Ef 4:29": "Laat geen vuile taal uit uw mond komen, maar als er iets goeds is tot nuttige opbouw, opdat het genade geeft aan hen die het horen.", "Jes 5:15": "Dan zal de gewone man neergebogen worden, en de aanzienlijke man zal vernederd worden, en de ogen van de hoogmoedigen zullen vernederd worden.", "Luk 18:14": "Ik zeg u: deze ging gerechtvaardigd naar zijn huis, meer dan die ander; want ieder die zichzelf verhoogt, zal vernederd worden, en die zichzelf vernedert, zal verhoogd worden.", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Mark 5:20": "En hij ging weg, en begon in het gebied van Dekapolis te verkondigen wat grote dingen Jezus aan hem gedaan had; en zij verwonderden zich allen.", "2 Kor 6:3": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt.", "Hand 1:16-20": "Mannen broeders, deze Schrift moest vervuld worden, die de Heilige Geest bij monde van David voorzegd heeft over Judas, die de leidsman is geweest van hen die Jezus gevangennamen; want hij werd met ons gerekend, en had het lot van deze bediening verkregen. Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Luk 12:2": "Er is niets bedekt, dat niet onthuld zal worden, en niets verborgen, dat niet bekend zal worden.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Spr 20:26": "Een wijs koning verstrooit de goddelozen, en hij brengt het rad over hen.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "1 Tess 3:10": "Nacht en dag zeer overvloedig biddend, om uw gezicht te mogen zien en te volmaken wat er aan uw geloof ontbreekt.", "Ps 89:2": "Ik zal de goedertierenheid van de HEERE eeuwig zingen; ik zal Uw waarheid met mijn mond bekend maken, van geslacht tot geslacht.", "Matt 13:38-42": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Ps 107:21": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen.", "Ps 35:18": "Zo zal ik U loven in de grote gemeente; onder machtig veel volk zal ik U prijzen.", "Ps 71:17": "O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.", "Luk 13:26": "Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.", "Matt 5:48": "Wees dan volmaakt, zoals uw Vader, Die in de hemelen is, volmaakt is.", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Luk 19:37": "En toen Hij nu in de buurt kwam van de afdaling van de Olijfberg, begon heel de menigte van de discipelen zich te verblijden, en God te loven met luide stem, vanwege alle krachtige daden die zij gezien hadden,", "Ps 116:13": "Ik zal de beker der verlossingen opnemen, en de Naam van de HEERE aanroepen.", "Spr 19:5": "Een vals getuige zal niet onschuldig blijven; en die leugens waait, zal niet ontkomen.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Fil 2:3": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "Joz 24:14-16": "En nu, vrees de HEERE, en dien Hem in oprechtheid en in waarheid; en doe de goden weg die uw vaders gediend hebben, aan de overkant van de rivier, en in Egypte; en dien de HEERE. Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen! Toen antwoordde het volk en zei: Het zij verre van ons, dat wij de HEERE zouden verlaten om andere goden te dienen.", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Ps 33:1-3": "Rechtvaardigen! Zingt vrolijk in de HEERE; lof past de oprechten. Looft de HEERE met de harp; zingt Hem psalmen met de luit, en het tiensnarig instrument. Zingt Hem een nieuw lied; speelt goed met vrolijk geschal.", "Spr 26:23-26": "Brandende lippen en een kwaadaardig hart zijn als een potscherf overtrokken met een laagje zilverschuim. Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.", "Spr 10:2": "Schatten van goddeloosheid geven geen voordeel; maar gerechtigheid redt van de dood.", "Spr 16:18": "Hoogmoed komt vóór de ondergang, en hoogheid van geest vóór de val.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Ps 26:4": "Ik zit niet bij nietswaardige mensen, en met huichelaars ga ik niet om.", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Ps 9:20": "Sta op, HEERE, laat de mens zich niet versterken; laat de heidenen voor Uw aangezicht geoordeeld worden.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Joh 3:21": "Maar wie de waarheid doet, komt tot het licht, opdat van zijn werken openbaar wordt dat zij in God gedaan zijn.", "Ps 119:29": "Wend van mij de weg van de valsheid, en verleen mij genadig Uw wet.", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.", "Klaagl 3:3": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Jes 47:4-10": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël. Zit zwijgend, en ga in de duisternis, dochter van de Chaldeeën! Want u zult niet meer genoemd worden koningin van de koninkrijken. Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erfdeel, en Ik gaf hen over in uw hand; toch bewees u hun geen barmhartigheid, ja, zelfs over de oude maakte u uw juk zeer zwaar.", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Ezra 7:10": "Want Ezra had zijn hart erop gericht om de wet van de HEERE te zoeken en te doen, en om in Israël de inzettingen en de rechten te leren.", "Job 32:9-13": "De groten zijn niet altijd wijs, en de ouden verstaan het recht niet. Daarom zeg ik: Luister naar mij; ik zal mijn mening ook tonen. Zie, ik heb gewacht op uw woorden; ik heb het oor gewend tot uw overwegingen, totdat u redenen had uitgezocht.", "Job 31:34": "Zeker, ik kon wel een grote menigte geweldig onderdrukt hebben; maar de verachtste van de huisgezinnen zou mij afgeschrikt hebben; zodat ik gewezen zou hebben, en bij de deur niet uitgegaan zijn.", "Spr 9:6": "Verlaat de dwaasheden, en leef; en treed in de weg van het verstand.", "Ps 28:6": "Geprezen zij de HEERE, want Hij heeft de stem van mijn smekingen gehoord.", "1 Tess 1:3": "Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader;", "Job 10:14": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.", "Openb 16:2-21": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.", "Jer 9:1-3": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk. Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop. En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "Jes 6:8": "Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen.", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Fil 3:7-14": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "2 Tim 3:13": "Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.", "Spr 12:20": "Bedrog is in het hart van hen die kwaad smeden; maar zij die vrede raden, hebben blijdschap.", "Richt 5:3": "Hoor, u koningen, neem het ter ore, u vorsten! Ik, den HEERE zal ik zingen, ik zal den HEERE, de God van Israël, psalmzingen.", "Ezech 31:10-14": "Daarom, zo zegt de Heere HEERE: Omdat u zich verheven heeft over uw stam, ja, hij stak zijn top op boven het midden van de dichte takken, en zijn hart verhief zich over zijn hoogte; daarom gaf Ik hem in de hand van de machtigste van de heidenvolken, zodat die hem naar recht zou behandelen; Ik dreef hem uit om zijn goddeloosheid. En vreemden, de meest tirannieke van de heidenvolken, roeiden hem uit en verlieten hem; zijn takken vielen op de bergen en in alle valleien, en zijn scheuten werden verbroken bij alle waterstromen van het land; en alle volken van de aarde gingen weg uit zijn schaduw, en verlieten hem.", "Job 17:8": "De oprechten zullen hierover verbaasd zijn, en de onschuldige zal zich tegen de huichelaar opmaken;", "Spr 26:19": "zo is een man die zijn naaste bedriegt, en zegt: Maakte ik geen grapje?", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Job 36:24": "Denk eraan, dat u Zijn werk groot maakt, dat de mensen aanschouwen.", "Ps 47:7": "Zingt psalmen voor God, zingt psalmen! Zingt psalmen voor onze Koning, zingt psalmen!", "Neh 5:8-19": "En ik zei tegen hen: Wij hebben onze broeders, de Joden, die aan de heidenen verkocht waren, naar ons vermogen teruggekocht; en zouden u ook uw broeders verkopen, of zouden zij aan ons verkocht worden? Toen zwegen zij en vonden geen antwoord. Verder zei ik: De zaak die u doet, is niet goed; zou u niet wandelen in de vreze van onze God, om de smaad van de heidenen, onze vijanden? Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.", "Luk 19:38": "en zij zeiden: Gezegend is de Koning, Die komt in de Naam van de Heere! Vrede in de hemel, en heerlijkheid in de hoogste hemelen!", "Deut 11:19": "En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat;", "2 Kron 6:24-31": "En wanneer Uw volk Israël voor het aangezicht van de vijand geslagen zal worden, omdat zij tegen U gezondigd zullen hebben, en zich bekeren, en Uw Naam belijden, en voor Uw aangezicht in dit huis bidden en smeken zullen, Hoor U dan uit de hemel, en vergeef de zonden van Uw volk Israël, en breng hen terug in het land dat U hun en hun vaders gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben, en zij in deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Hand 4:33": "En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ps 78:57": "En zij weken terug, en handelden trouweloos, zoals hun vaders; zij zijn omgekeerd, als een bedrieglijke boog.", "1 Tim 3:5": "(want als iemand niet weet hoe hij zijn eigen huis moet besturen, hoe zal hij dan voor de Gemeente van God zorgen?)", "Zef 1:5": "En hen die zich neerbuigen op de daken voor het leger van de hemel, en hen die zich neerbuigend zweren bij de HEERE, en zweren bij Malcham;", "Micha 6:12": "Omdat haar rijke lieden vol zijn van geweld, en haar inwoners leugen spreken, en hun tong bedrieglijk is in hun mond,", "1 Kor 15:33": "Dwaal niet. Slechte omgang bederft goede zeden.", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "2 Kron 12:14": "En hij deed wat kwaad was, omdat hij zijn hart er niet op richtte om de HEERE te zoeken.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "Ps 96:1-4": "Zingt de HEERE een nieuw lied; zingt de HEERE, heel de aarde! Zingt de HEERE, looft Zijn Naam; verkondigt Zijn heil van dag tot dag. Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Spr 15:25": "Het huis van de hoogmoedigen zal de HEERE afbreken; maar het gebied van de weduwe zal Hij vastzetten.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Rom 12:3": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld.", "Jes 28:3": "De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Spr 6:17": "hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten;", "Jes 58:2-5": "Hoewel zij Mij dagelijks zoeken en een lust hebben aan de kennis van Mijn wegen, als een volk dat gerechtigheid doet en het recht van zijn God niet verlaat, vragen zij Mij naar de rechten van de gerechtigheid; zij hebben een lust om tot God te naderen; En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid. Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Luk 18:12": "Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Ps 115:18": "Maar wij zullen de HEERE loven van nu af tot in eeuwigheid. Halleluja!", "2 Kor 6:11": "Onze mond is opengegaan tegen u, Korinthiërs, ons hart is verruimd.", "2 Petr 2:5": "en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "1 Tim 3:11": "De vrouwen moeten evenzo eerbaar zijn, geen kwaadspreeksters, waakzaam, betrouwbaar in alles.", "Micha 6:16": "Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Lev 19:16": "U zult niet rondgaan als een kwaadspreker onder uw volken; u zult niet opstaan tegen het bloed van uw naaste; Ik ben de HEERE!", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "Ps 119:175": "Laat mijn ziel leven, en zij zal U loven, en laat Uw rechten mij helpen.", "Hos 10:11": "Omdat Efraïm een vaars is, gewend om graag te dorsen, ben Ik over de schoonheid van haar hals heengegaan; Ik zal Efraïm laten rijden, Juda zal ploegen, Jakob zal voor zich eggen.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Ps 28:7": "De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.", "Deut 12:5-7": "Maar naar de plaats die de HEERE, uw God, uit al uw stammen zal uitkiezen om Zijn Naam daar te vestigen, naar Zijn woning zult u vragen, en daarheen zult u komen; En daarheen zult u brengen uw brandoffers, en uw slachtoffers, en uw tienden, en het hefoffer van uw hand, en uw geloften, en uw vrijwillige offers, en de eerstgeboorte van uw runderen en van uw schapen. En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Ps 52:11": "Ik zal U loven voor eeuwig, omdat U het gedaan hebt; en ik zal Uw Naam verwachten; want hij is goed voor Uw gunstgenoten.", "Rom 9:15-18": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben. Zo hangt het dan niet af van hem die wil, ook niet van hem die loopt, maar van God Die Zich ontfermt. Want de Schrift zegt tegen Farao: Hiertoe heb Ik u doen opstaan, opdat Ik in u Mijn kracht zou bewijzen, en opdat Mijn Naam verkondigd wordt op de hele aarde.", "Spr 11:9": "De huichelaar verderft zijn naaste door de mond; maar door kennis worden de rechtvaardigen bevrijd.", "Jes 59:4": "Er is niemand die om gerechtigheid roept, en niemand die zich voor de waarheid in het gericht begeeft; zij vertrouwen op ijdelheid en spreken leugen; met moeite zijn zij zwanger, en zij baren ongerechtigheid.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Hand 6:4": "Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "1 Petr 3:16": "en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.", "Spr 29:2": "Als de rechtvaardigen groot worden, verblijdt het volk zich; maar als de goddeloze heerst, zucht het volk.", "2 Kron 6:36": "Wanneer zij tegen U gezondigd zullen hebben (want er is geen mens die niet zondigt), en U tegen hen vertoornd zult zijn, en hen zult overleveren aan de vijand, zodat degenen die hen gevangen hebben, hen gevankelijk wegvoeren naar een land dat ver weg of nabij is;", "Ps 69:31": "Ik zal de Naam van God prijzen met gezang, en Hem met dankzegging grootmaken.", "Micha 7:2": "De goedertierene is verdwenen uit het land, en er is niemand oprecht onder de mensen; zij loeren allemaal op bloed, zij jagen, ieder op zijn broeder, met een jachtnet.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Ps 68:27": "Looft God in de gemeenten, de Heere, u die uit de bron van Israël bent!", "Ps 134:1": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!", "1 Petr 4:11": "Als iemand spreekt, laat hij spreken als de woorden van God; als iemand dient, laat hij dienen als uit kracht die God verleent; opdat God in alles geprezen wordt door Jezus Christus, aan Wie de heerlijkheid en de kracht toekomt, tot in alle eeuwigheid. Amen.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Ps 113:1": "Halleluja! Loof, u dienaren van de HEERE! Loof de Naam van de HEERE.", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Ps 6:2": "O HEERE, straf mij niet in Uw toorn, en tuchtig mij niet in Uw grimmigheid!", "1 Tess 1:6-8": "En u bent navolgers geworden van ons en van de Heere, doordat u het Woord aannam onder veel verdrukking, met blijdschap van de Heilige Geest; Zodat u voorbeelden geworden bent voor alle gelovigen in Macedonië en Achaje. Want vanuit u heeft het Woord van de Heere weerklonken, niet alleen in Macedonië en Achaje; maar ook op elke plaats is uw geloof, dat u op God hebt, bekend geworden, zodat wij het niet nodig hebben daar iets over te zeggen.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Openb 18:4": "En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Ps 119:44-46": "Zo zal ik Uw wet voortdurend onderhouden, eeuwig en altijd. En ik zal wandelen in de ruimte, omdat ik Uw bevelen gezocht heb. Ook zal ik voor koningen spreken van Uw getuigenissen, en mij niet schamen.", "Hand 16:25-34": "En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen. En er gebeurde plotseling een grote aardbeving, zodat de fundamenten van de kerker schudden; en meteen gingen alle deuren open, en de boeien van allen raakten los. En de stokbewaarder, wakker geworden en ziende dat de deuren van de gevangenis geopend waren, trok een zwaard en wilde zichzelf ombrengen, omdat hij dacht dat de gevangenen ontvlucht waren.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Ps 36:4": "De woorden van de mond van hem zijn onrecht en bedrog; hij laat na te verstaan tot weldoen.", "Hand 5:21": "Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen.", "Ps 120:5-7": "O, wee mij, dat ik een vreemdeling ben in Mesech, dat ik in de tenten van Kedar woont. Mijn ziel heeft lang gewoond bij hen die de vrede haten. Ik ben vreedzaam; maar als ik spreek, zijn zij uit op oorlog.", "Spr 30:13": "Een geslacht wiens ogen hoogmoedig zijn, en wiens oogleden verheven zijn;", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "Ps 26:6": "Ik was mijn handen in onschuld, en ik ga rondom Uw altaar, o HEERE!", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Ps 18:4": "Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Deut 6:25": "En het zal ons gerechtigheid zijn, als wij ernaar streven al deze geboden te doen, voor het aangezicht van de HEERE, onze God, zoals Hij ons geboden heeft.", "Ps 81:2": "Zingt vrolijk voor God, onze Sterkte; juicht voor de God van Jakob.", "Ezech 44:15": "Maar de Levitische priesters, de kinderen van Zadok, die de wacht van Mijn heiligdom in acht genomen hebben, toen de kinderen van Israël van Mij afdwaalden, die zullen tot Mij naderen om Mij te dienen; en zullen voor Mijn aangezicht staan om Mij het vette en het bloed te offeren, spreekt de Heere HEERE;", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Luk 12:1": "Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.", "Ps 58:4": "De goddelozen zijn vervreemd van de moederschoot af; de leugensprekers dolen van de moederbuik af.", "2 Tess 3:6": "En wij bevelen u, broeders, in de Naam van onze Heere Jezus Christus, dat u zich onttrekt van iedere broeder die ongeregeld wandelt, en niet naar de overlevering die hij van ons ontvangen heeft.", "Matt 26:30": "En toen zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.", "1 Petr 3:5": "Want zo versierden zichzelf vroeger ook de heilige vrouwen, die op God hoopten, en die hun eigen mannen onderdanig waren;", "Matt 25:44-46": "Dan zullen ook zij Hem antwoorden: Heere, wanneer hebben wij U hongerig gezien, of dorstig, of een vreemdeling, of naakt, of ziek, of in de gevangenis, en hebben U niet gediend? Dan zal Hij hun antwoorden: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze minsten niet gedaan hebt, hebt u het Mij ook niet gedaan. En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Job 6:10": "Dat zou nog mijn troost zijn, en zou mij verkwikken in de weedom, zo Hij niet spaarde; want ik heb de redenen van de Heilige niet verborgen gehouden.", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Ps 56:13": "O God! Op mij zijn Uw geloften; ik zal U dankzeggingen vergelden;", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Job 40:6": "Strooi de verbolgenheden van uw toorn uit, en zie ieder hoogmoedige, en verneder hem!", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Ps 119:1-3": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan. Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken; Ook geen onrecht werken, maar wandelen in Zijn wegen.", "Gen 13:4": "tot de plaats van het altaar, dat hij daar eerst gemaakt had; en Abram heeft daar de Naam van de HEERE aangeroepen.", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "1 Tim 3:6": "Geen pas bekeerde, opdat hij niet hoogmoedig wordt en onder het oordeel van de duivel valt.", "Spr 15:8": "Het offer van de goddelozen is de HEERE een gruwel; maar het gebed van de oprechten is Zijn welgevallen.", "Hebr 6:1": "Laten wij daarom het beginsel van de leer van Christus achterlaten en doorgaan tot de volmaaktheid; niet opnieuw het fundament leggend van de bekering van dode werken en van het geloof in God,", "Matt 25:41-45": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is. Want Ik ben hongerig geweest, en u hebt Mij niet te eten gegeven; Ik ben dorstig geweest, en u hebt Mij niet te drinken gegeven; Ik was een vreemdeling; en u hebt Mij geen onderkomen gegeven; naakt, en u hebt Mij niet gekleed; ziek, en in de gevangenis, en u hebt Mij niet bezocht.", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "1 Tim 1:9": "En als hij dit weet, dat de wet niet gemaakt is voor de rechtvaardige, maar voor de onrechtvaardigen en de weerspannigen, de goddelozen en de zondaars, de onheiligen en de ongodsdienstigen, de vadermoordenaars en de moedermoordenaars, de doodslagers,", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "Gen 24:2": "Zo zei Abraham tegen zijn knecht, de oudste van zijn huis, die over alles regeerde wat hij had: Leg toch uw hand onder mijn heup,", "Spr 2:19": "Allen die tot haar ingaan, zullen niet terugkomen, en zullen de paden van het leven niet bereiken;", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "Ps 139:22": "Ik haat hen met volkomen haat, tot vijanden zijn zij mij.", "Job 31:
