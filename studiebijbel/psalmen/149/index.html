."}],"2":[{"catchword":"in Dengene,","tekst":"Hebr. in zijne makers. Zie Gen 12:1 ; en Gen 20:13 ; Job 35:10 ; Ecc 12:1 ; Isa 54:5 . God heeft Israël niet alleen geschapen, maar ook tot zijn volk uitverkoren."},{"catchword":"over hun Koning","tekst":"Of, vanwege hunnen Koning, te weten, Christus; gelijk Son 1:4 ; Mat 21:5 , wiens voorbeeld David geweest is."}],"3":[{"catchword":"op de trommel en harp","tekst":"Anders: in reien; gelijk Psa 30:12 , en Psa 150:4 ; Jer 31:4 , Jer 31:13 ."}],"4":[{"catchword":"versieren met heil","tekst":"Dat is, hij maakt hen heerlijk, nadat Hij hen heeft gered en verhoogd. Ja, Hij zal hen brengen tot de genieting der eeuwige vreugde en zaligheid."}],"5":[{"catchword":"die eer; dat","tekst":"Die God hun aandoet. Zie het voorgaande vs.4."},{"catchword":"op hun legers","tekst":"Op welke zij zacht liggen en rusten, dewijl God de Heere hen bewaart. Zie Psa 3:6 . De zin is: Zij zullen den Heere loven bij dag en bij nacht, zelfs als zij op hunne bedden liggen."}],"6":[{"catchword":"De verheffingen","tekst":"Dat is, de lofzangen, waarmede zij de heerlijke werken Gods verheffen zullen. Anders: de opheffingen; te weten, der stem, dat is, de predikatiën van het goddelijke Woord."},{"catchword":"zullen in hun","tekst":"Dat is, zullen overluid uitgesproken of uitgeroepen worden, gelijk Isa 58:1 ."},{"catchword":"een tweesnijdend","tekst":"Hebr. het zwaard der monden; dat is, met twee monden of scherten, gelijk de aantekening bij Jdg 3:16 . Dit tweesnijdend zwaard is Gods Woord, en komt uit den mond van Christus, en met dit zwaard overwinnen de gelovige de duivel, de wereld en de geweldigen der wereld; 2Co 10:4 ; Eph 6:17 ; Heb 4:12 ; Rev 1:16 ."}],"7":[{"catchword":"wraak te doen","tekst":"Te weten, met woorden, gelijk Joh 16:8 , enz."},{"catchword":"bestraffingen","tekst":"Dit geschiedt met te prediken tegen de heidenen en de ongelovige afgoderij en goddeloosheid, gelijk Act 14:1 , en Act 17:16-17 , Act 17:22 , enz. Verg. dit met Isa 41:15 , en met 2Co 10:4-5 ."}],"8":[{"catchword":"te binden met","tekst":"Te weten, door strafpredikatiën en met inbinding hunner zonden, hen alzo brengende onder het juk en de onderdanigheid van het heilige Evangelie. Zie Isa 45:14 ; Psa 2:3 ; Mar 6:20 ; Act 24:26 ; Rev 21:24 ."}],"9":[{"catchword":"het beschreven recht","tekst":"Dat is, om hen vrij te spreken van hunne afgoderij en andere zonden, indien zij zich oprecht bekeren. Maar indien zij zich oprecht bekeren. Maar indien zij in hunne goddeloosheid blijven steken, hun den dood en de eeuwige verdoemenis te verkondigen, naar inhoud van het woord Gods, in de boeken der heilige Schrift geopenbaard."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Hallelu-Jah. Sing unto the LORD a new song; [See Psalm 33. The Annot.on verse 3.] let his praise be in the Congregation of (his) Favourites. [the Word (his) is inserted here; as also v.5. out of v.9. here is meant the Church of God, which is an assembly of his Elect.]"}],"2":[{"catchword":null,"tekst":"Let Israel rejoice in him that made him: [Hebr. In his makers. Gen 1:26. and Chron.20.on verse 13. Job 35:10. Ecc 12:1. Isa 54:5. God did not onely create Israel, but chose them likewise for his own peculiar people] let the children of Zion be glad over their King. [Or by reason of their King; viz. Christ; Canticles, 1.4. Matthew, 21.5. whose Type David was.]"}],"3":[{"catchword":null,"tekst":"Let them praise his Name upon the Flute; [Others, in dancing-rings, as Psa 30:12. and 150.4. Jer 31:4,13.] let them sing Psalms upon the Timbrel and Harp."}],"4":[{"catchword":null,"tekst":"For the LORD is well pleased with his people; he shall adorn the meek with salvation. [i.e. he makes them glorious, after that he hath rescued and exalted them; yea, he shall bring them to the enjoinment of the everlasting joy and salvation.]"}],"5":[{"catchword":null,"tekst":"Let his Favourites exult (leap up) for joy, for the verse foreging] let them shout upon their couches. [on which they lie soft and rest themselves, God protecting and keeping them. See Psa 3:6. the sence is: They shall praise the LORD, by day and by night, even when they lie upon their beds.]"}],"6":[{"catchword":null,"tekst":"The exaltations of God, i.e. the songs of praises, whereby they are to exalt the great and glorious works of God. Others, the elevations, viz. Of the voice, i.e. the preaching of Gods Word] shall be in their throat; [i.e. shall be uttered and proclaimed with a loud resounding voice; as Isa 58:1.] and a two-edged sword in their hand: [Heb. The sword of the mouths, i.e. with two mouths or edges; as Jud 3:16. See the Annot. There. This two edged sword, is the Word of God. And it proceedeth out of the mouth of Christ; and with this sword the godly overcome the Devil, the World, and all the powers of this world, 2 Cor.10.4. Eph.6.17. Heb 4:12. Revel.1.16.]"}],"7":[{"catchword":null,"tekst":"To do vengeance [viz. With words, as Joh 16:8. etc.] over the heathen: and reproofs over the nations; [this is done, by preaching against the idolatry and impiety of the Heathen and unbelievers, as Act 14:15. and 17.16,17,22. Etc. Compare this with Isa 41:15. and with 2 Cor.10.4,5.]"}],"8":[{"catchword":null,"tekst":"For to bind their Kings with chains: [viz. By preaching of repentance, and by binding their sins, bringing them thus under the yoak and subjection of the Gospel. See Isa 45:14. Psa 2:3. Mark.6.20. Act 24:26. Revel.21.24.] and their honourable with iron fetters."}],"9":[{"catchword":null,"tekst":"For to do the Written right over them: [i.e. for to acquit, or absolve them from their idolatry, and other sins, if they repent uprightly; but if they remain obstinate in their impenitency, to denounce unto them eternal death and condemnation, according to the tenor of the Word of God, revealed unto us in the books of holy Scripture.] This shall be the Glory of all his favourites. Hallelu-Jah."}]}}};

// popup positioneren bij een element

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

document.addEventListener('click', e => {

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
