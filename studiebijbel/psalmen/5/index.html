en in witte kleren, omdat zij het waard zijn.", "Richt 16:28": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "Matt 25:21": "En zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht! Over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer.", "Luk 12:4": "En Ik zeg u, Mijn vrienden: wees niet bang voor hen die het lichaam doden, en daarna niets meer kunnen doen.", "Matt 12:34": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.", "Joh 12:41": "Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.", "1 Kon 8:38": "elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Ps 105:43": "Zo voerde Hij Zijn volk uit met vrolijkheid, Zijn uitverkorenen met gejuich.", "Hos 2:8-12": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken. En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden. En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "2 Sam 12:22": "En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.", "Jes 32:6": "Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken.", "Rom 7:18-21": "Want ik weet dat in mij, dat is, in mijn vlees, geen goed woont; want het willen is wel aanwezig bij mij, maar het goede te doen, dat vind ik niet. Want het goede dat ik wil, doe ik niet, maar het kwade dat ik niet wil, dat doe ik. Als ik dan doe wat ik niet wil, dan doe ik dat nu niet meer zelf, maar de zonde die in mij woont.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Ps 119:12": "HEERE! U bent gezegend; leer mij Uw inzettingen.", "Hand 28:25-27": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders, Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken. Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "Ps 18:50": "Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;", "1 Kor 6:2": "Weet u niet, dat de heiligen de wereld zullen oordelen? En als door u de wereld geoordeeld wordt, bent u dan onwaardig de kleinste rechtszaken te oordelen?", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Deut 11:29": "En het zal gebeuren, als de HEERE, uw God, u zal hebben binnengebracht in het land, waar u naartoe gaat, om dat te erven; dan zult u de zegen uitspreken op de berg Gerizim, en de vloek op de berg Ebal.", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "2 Tess 1:5-7": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Ps 62:5": "Zij overleggen slechts om hem van zijn hoogheid te verstoten; zij hebben behagen in leugen; met hun mond zegenen zij, maar met hun binnenste vloeken zij. Sela.", "Luk 14:34": "Het zout is goed; maar als het zout smakeloos geworden is, waarmee zal het smakelijk gemaakt worden?", "Gen 4:9-12": "En de HEERE zei tegen Kaïn: Waar is Abel, uw broeder? En hij zei: Ik weet het niet; ben ik de hoeder van mijn broeder? En Hij zei: Wat hebt u gedaan? Daar is een stem van het bloed van uw broeder, die tot Mij roept vanuit de aardbodem. En nu bent u vervloekt, verbannen van de aardbodem, die zijn mond heeft opengedaan om het bloed van uw broeder uit uw hand te ontvangen.", "Zach 8:21": "En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan.", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Hebr 10:39": "Maar wij zijn niet van hen die zich terugtrekken tot verderf, maar van hen die geloven tot behoud van de ziel.", "1 Tess 4:15-18": "Want dit zeggen wij u door het Woord van de Heere, dat wij, die levend overblijven tot de komst van de Heere, hen die ontslapen zijn niet zullen voorgaan. Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan; Daarna zullen wij, die levend overgebleven zijn, samen met hen opgenomen worden in de wolken, de Heere tegemoet, in de lucht; en zo zullen wij altijd bij de Heere zijn.", "Gen 34:26": "Zij sloegen ook Hemor en zijn zoon Sichem dood met de scherpte van het zwaard; en zij namen Dina uit Sichems huis en gingen vandaar weg.", "2 Sam 17:14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Spr 19:28": "Een getuige van Belial bespot het recht; en de mond van de goddelozen slokt de ongerechtigheid in.", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Deut 25:4": "Een os zult u niet muilbanden, als hij graan dorst.", "Jes 40:6-8": "Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld. Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras. Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "2 Sam 12:14": "Toch, omdat u door deze daad de vijanden van de HEERE ernstig hebt doen lasteren, zal ook de zoon die u geboren is, zeker sterven.", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "1 Kon 19:14": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "Ezech 16:6": "Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef!", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "2 Kon 17:36": "Maar de HEERE, Die u uit het land Egypte met grote kracht en met een uitgestrekte arm opgevoerd heeft, Hem zult u vrezen, en voor Hem zult u zich buigen, en Hem zult u offers brengen;", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "Hebr 6:18": "opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Ps 119:26": "Ik heb U mijn wegen verteld, en U hebt mij verhoord; leer mij Uw inzettingen.", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Lev 24:10-16": "En de zoon van een Israëlitische vrouw ging naar buiten – hij was, te midden van de Israëlieten, de zoon van een Egyptische man – en de zoon van deze Israëlitische vrouw en een Israëlitische man kregen ruzie in het kamp. Toen lasterde de zoon van de Israëlitische vrouw uitdrukkelijk de NAAM, en vloekte; daarom brachten zij hem tot Mozes; de naam van zijn moeder nu was Selomith, de dochter van Dibri, van de stam Dan. En zij zetten hem in bewaring, totdat hun, naar de mond van de HEERE, uitspraak gedaan zou worden.", "Ef 1:15": "Daarom ook ik, nadat ik gehoord heb van het geloof in de Heere Jezus, dat onder u is, en de liefde tot al de heiligen,", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Ezech 14:8": "En Ik zal Mijn aangezicht tegen die man zetten, en zal hem stellen tot een teken en tot een spreekwoord, en zal hem uitroeien uit het midden van Mijn volk; en u zult weten dat Ik de HEERE ben.", "Spr 14:9": "Elke dwaas maakt de schuld belachelijk; maar onder de oprechten is goedwilligheid.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Jes 54:1": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.", "Job 19:21": "Ontferm u over mij, ontferm u over mij, o mijn vrienden! want de hand van God heeft mij aangeraakt.", "Spr 19:9": "Een vals getuige zal niet onschuldig blijven; en die leugens waait, zal vergaan.", "Jak 1:15": "Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "Luk 6:23": "Verblijd u op die dag, en wees vrolijk; want zie, uw loon is groot in de hemel; want hun vaders deden hetzelfde met de profeten.", "Gen 2:7": "En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.", "Ps 120:2-4": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong. Wat zal U de bedrieglijke tong geven, of wat zal zij U toevoegen? Scherpe pijlen van een machtige, alsook gloeiende jeneverkolen.", "Hand 13:10": "O kind van de duivel, vol van alle bedrog en van alle arglistigheid, vijand van alle gerechtigheid, zult u niet ophouden de rechte wegen van de Heere te verdraaien?", "Mark 9:44": "Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.", "Ps 37:12": "Zain. De goddeloze bedenkt listige plannen tegen de rechtvaardige, en knerst met zijn tanden over hem.", "Ps 142:2": "Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Mark 10:29": "En Jezus antwoordde en zei: Voorwaar, Ik zeg u: Er is niemand die huis, of broers, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers verlaten heeft, omwille van Mij en omwille van het Evangelie,", "Rom 9:14": "Wat zullen wij dan zeggen? Is er onrechtvaardigheid bij God? Dat zij verre.", "Ezech 36:26": "En Ik zal u een nieuw hart geven, en zal een nieuwe geest geven in het binnenste van u; en Ik zal het stenen hart uit uw vlees wegnemen, en zal u een vlezen hart geven.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Ps 7:15-17": "Zie, hij is zwanger van onrecht, en heeft moeite ontvangen, hij zal leugen baren. Hij heeft een kuil gegraven, en hem uitgegraven, maar hij is gevallen in de groeve, die hij gemaakt heeft. Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "Luk 15:10": "Zo, zeg Ik u, is er blijdschap voor de engelen van God over één zondaar die zich bekeert.", "Ef 1:18": "Namelijk verlichte ogen van uw verstand, opdat u mag weten wat de hoop is van Zijn roeping, en wat de rijkdom is van de heerlijkheid van Zijn erfenis in de heiligen;", "Matt 24:22": "En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.", "Joh 4:24": "God is een Geest, en wie Hem aanbidden, moeten Hem aanbidden in geest en waarheid.", "1 Kon 8:36-50": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt. Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn; elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "2 Petr 2:1-3": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Hand 7:34": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.", "Ps 21:7": "Want U zet hem tot zegeningen in eeuwigheid; U vervrolijkt hem door vreugde met Uw aangezicht.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Jes 57:13": "Wanneer u zult roepen, laat dan degenen die door u verzameld zijn, u redden; maar de wind zal hen allemaal wegvoeren, de leegte zal hen wegnemen. Maar wie op Mij vertrouwt, die zal het land erven, en Mijn heilige berg in bezit krijgen.", "Deut 2:30": "Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.", "Ps 74:11": "Waarom trekt U Uw hand, ja, Uw rechterhand terug? Trek haar uit het midden van Uw boezem; maak er een einde aan.", "Ps 119:39": "Wend mijn smaad af, die ik vrees, want Uw rechten zijn goed.", "Luk 6:11": "Maar zij werden vervuld met woede, en overlegden met elkaar wat zij Jezus zouden aandoen.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Spr 14:15": "De onnozele gelooft elk woord; maar de kloekzinnige let goed op zijn gang.", "Ps 69:14": "Maar mij aangaande, mijn gebed is tot U, o HEERE; er is een tijd van het welbehagen, o God! Door de grootheid van Uw goedertierenheid; verhoor mij door de trouw van Uw heil.", "Ef 2:21": "op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere;", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Job 34:37": "Want tot zijn zonde zou hij nog overtreding bijvoegen; hij zou onder ons in de handen klappen, en hij zou zijn redenen vermenigvuldigen tegen God.", "2 Sam 22:7": "Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; en Hij hoorde mijn stem uit Zijn paleis, en mijn geroep kwam in Zijn oren.", "Ps 139:10": "ook daar zou Uw hand mij leiden, en Uw rechterhand zou mij vasthouden.", "Kol 3:9": "Lieg niet tegen elkaar, omdat u de oude mens met zijn werken hebt uitgedaan,", "Ex 16:18": "Maar toen zij het met de gomer maten, had hij die veel verzameld had, niets over, en hem die weinig verzameld had, ontbrak niets; ieder verzamelde zoveel als hij eten kon.", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "Ps 4:3": "U, mannen, hoe lang zal mijn eer tot schande zijn? Hoe lang zult u de ijdelheid liefhebben, de leugen zoeken? Sela.", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Openb 20:4-6": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar. Maar de overigen van de doden werden niet weer levend, totdat de duizend jaar geëindigd waren. Dit is de eerste opstanding. Gelukkig en heilig is hij, die deel heeft in de eerste opstanding; over hen heeft de tweede dood geen macht, maar zij zullen priesters van God en Christus zijn, en zij zullen met Hem als koningen heersen, duizend jaar.", "Ezech 34:11-17": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Job 36:4": "Want voorwaar, mijn woorden zullen geen valsheid zijn; iemand die oprecht van kennis is, is bij u.", "Ps 33:18": "Zie, het oog van de HEERE is over hen die Hem vrezen, op hen die op Zijn goedertierenheid hopen.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Spr 10:8": "Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Jes 29:16": "Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Deut 24:15": "Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Gen 6:8": "Maar Noach vond genade in de ogen van de HEERE.", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Pred 7:29": "Alleen zie, dit heb ik gevonden, dat God de mens recht gemaakt heeft, maar zij hebben veel uitvindingen gezocht.", "Jer 6:7": "Zoals een bornput zijn water opgeeft, zo geeft zij haar boosheid op; geweld en verstoring wordt in haar gehoord, weedom en plaging is voortdurend voor Mijn aangezicht.", "1 Petr 2:25": "Want u was als dwalende schapen; maar u bent nu bekeerd tot de Herder en Opziener van uw zielen.", "Gal 4:27": "Want er is geschreven: Wees vrolijk, u onvruchtbare, die niet baart, breek uit en roep, u die geen weeën hebt, want de kinderen van de eenzame zijn veel meer dan van haar die de man heeft.", "Ps 34:13-17": "Mem. Wie is de man die lust heeft ten leven, die dagen liefheeft om het goede te zien? Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog. Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Gal 1:8": "Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Jes 28:5": "Op die dag zal de HEERE van de heerscharen tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;", "Ef 2:11": "Denk daarom eraan, dat u, die eertijds heidenen was in het vlees, en die voorhuid genoemd werd door hen die genoemd worden besnijdenis in het vlees, wat met handen gebeurt;", "Jes 8:23": "Maar het land dat beangstigd was, zal niet helemaal verduisterd worden; zoals Hij het in de eerste tijd verachtelijk gemaakt heeft, naar het land van Zebulon toe en naar het land van Nafthali toe, zo heeft Hij het in het laatste heerlijk gemaakt, naar de weg zeewaarts toe gelegen over de Jordaan, aan Galilea van de heidenen.", "Pred 8:5": "Wie het gebod onderhoudt, zal niets kwaads ervaren; en het hart van een wijze weet tijd en wijze.", "Ps 54:7": "Hij zal dit kwaad aan mijn belagers vergelden; roei hen uit door Uw waarheid.", "Ex 17:4": "Toen riep Mozes tot de HEERE en zei: Wat moet ik met dit volk doen? Het scheelt niet veel, of zij zullen mij stenigen.", "Joh 3:19": "En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht.", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Luk 6:22": "Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen.", "Dan 12:1-3": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek. En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing. De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Luk 13:13-17": "En Hij legde haar de handen op; en zij werd meteen weer recht, en verheerlijkte God. En de leider van de synagoge nam het kwalijk dat Jezus op de sabbat genezen had, en antwoordde en zei tegen de menigte: Er zijn zes dagen waarop men moet werken; kom dan op die dagen en laat u genezen, en niet op de dag van de sabbat. De Heere dan antwoordde hem en zei: Huichelaar, maakt niet ieder van u op de sabbat zijn os of ezel los van de kribbe, en leidt hem weg om hem te laten drinken?", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Jes 63:19": "Wij zijn geworden als zij over wie U van ouds niet hebt geheerst, en die naar Uw Naam niet genoemd zijn.", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Ps 119:111": "Ik heb Uw getuigenissen genomen tot een eeuwige erve, want zij zijn de vrolijkheid van mijn hart.", "Jes 55:12": "Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "Openb 3:1": "En schrijf aan de engel van de gemeente die in Sardis is: Dit zegt Hij Die de zeven Geesten van God heeft, en de zeven sterren: Ik ken uw werken, dat u de naam hebt dat u leeft, en u bent dood.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Ps 69:23": "Hun tafel moet voor hun gezicht tot een strik worden, en tot volle vergelding tot een valstrik.", "Spr 10:10": "Wie met het oog knipoogt, veroorzaakt smart; en een dwaas van lippen zal ten val komen.", "Mark 7:22": "diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid.", "Job 13:4": "Want zeker, u bent leugensmeders; u bent allemaal artsen van niets.", "Lev 6:2-7": "Als een mens gezondigd heeft en tegen de HEERE door overtreding overtreden zal hebben, doordat hij tegen zijn naaste gelogen heeft over iets dat hem in bewaring gegeven was, of ter hand gesteld was, of over roof, of dat hij met geweld zijn naaste iets onthoudt; Of dat hij het verlorene gevonden heeft, en daarover gelogen heeft, en met valsheid gezworen zal hebben; over iets van alles dat de mens doet, waarin hij zo zondigt. Dan zal het gebeuren, omdat hij gezondigd heeft en schuldig geworden is, dat hij zal teruggeven de roof die hij geroofd heeft, of het onthoudene dat hij met geweld onthoudt, of het bewaarde dat bij hem te bewaren gegeven was, of het verlorene dat hij gevonden heeft;", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Jer 2:22-25": "Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE. Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait! Zij is een woudezelin, gewend aan de woestijn, naar de lust van haar ziel schept zij de wind; wie zou haar ontmoeting kunnen afkeren? Allen die haar zoeken, zullen niet moe worden, in haar maand zullen zij haar vinden.", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Rom 11:23": "Maar ook zij, als zij in het ongeloof niet blijven, zullen ingeënt worden; want God is machtig om hen weer in te enten.", "1 Sam 24:14": "Zoals het spreekwoord van de ouden zegt: Van de goddelozen komt goddeloosheid voort; maar mijn hand zal niet tegen u zijn.", "Ex 24:1": "Daarna zei Hij tegen Mozes: Klim op tot de HEERE, u en Aäron, Nadab en Abihu, en zeventig van de oudsten van Israël; en buig u neer van verre!", "Ps 88:14": "Maar ik, HEERE, roep tot U, en mijn gebed komt U al voor in de morgenstond.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Openb 16:5": "En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt;", "Ps 119:2": "Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;", "Kol 1:11": "bekrachtigd met alle kracht, naar de sterkte van Zijn heerlijkheid, tot alle lijdzaamheid en geduld, met blijdschap;", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Spr 15:9": "De weg van de goddelozen is de HEERE een gruwel; maar hem die de gerechtigheid najaagt, zal Hij liefhebben.", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Jes 59:12": "Want onze overtredingen zijn talrijk voor U, en onze zonden getuigen tegen ons; want onze overtredingen zijn bij ons, en onze ongerechtigheden kennen wij;", "Ps 144:8": "wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is.", "Deut 22:8": "Wanneer u een nieuw huis bouwt, zult u op uw dak een leuning maken; opdat u geen bloedschuld op uw huis legt, wanneer iemand ervan afvalt.", "Openb 22:5": "En daar zal geen nacht zijn, en zij zullen geen kaars noch licht van de zon nodig hebben; want de Heere God verlicht hen; en zij zullen als koningen heersen tot in alle eeuwigheid.", "2 Kron 7:1": "Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Job 27:8-10": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken? Zal God zijn geroep horen, als benauwdheid over hem komt? Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "2 Kor 12:10": "Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus' wil; want als ik zwak ben, dan ben ik machtig.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Matt 16:12": "Toen begrepen zij dat Hij niet gezegd had dat zij zich moesten wachten voor de zuurdesem van het brood, maar voor de leer van de Farizeeën en Sadduceeën.", "2 Petr 2:22": "Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "Rom 6:20": "Want toen u dienstknechten was van de zonde, was u vrij van de gerechtigheid.", "Ps 53:2-4": "De dwaas zegt in zijn hart: Er is geen God; zij verderven het, en zij bedrijven gruwelijk onrecht; er is niemand die goed doet. God heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht. Een ieder van hen is teruggekeerd, samen zijn zij stinkend geworden, er is niemand die goed doet, ook niet één.", "Micha 4:2": "En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Spr 25:26": "De rechtvaardige, wankelend voor het aangezicht van de goddeloze, is een beroerde bron, en een verdorven springader.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "Ps 119:153": "Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Ps 94:8": "Let op, u onverstandigen onder het volk! En u dwazen! Wanneer zult u verstandig worden?", "Ps 55:17": "Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.", "Ps 50:17-20": "Omdat u de kastijding haat, en Mijn woorden achter u weggooit. Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers. Uw mond zet u in voor het kwade, en uw tong koppelt bedrog.", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Ex 20:14": "U zult geen echtbreuk plegen.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Deut 24:1": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis.", "Ps 53:2-6": "De dwaas zegt in zijn hart: Er is geen God; zij verderven het, en zij bedrijven gruwelijk onrecht; er is niemand die goed doet. God heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht. Een ieder van hen is teruggekeerd, samen zijn zij stinkend geworden, er is niemand die goed doet, ook niet één.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Ps 36:9": "Zij worden dronken van de vettigheid van uw huis; en U drenkt hen uit de beek van Uw wellusten.", "Jer 9:8": "Hun tong is een moordpijl, zij spreekt bedrog; ieder spreekt met zijn naaste van vrede met zijn mond, maar in zijn binnenste legt hij lagen.", "Ps 14:1": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "Job 34:5": "Want Job heeft gezegd: Ik ben rechtvaardig, en God heeft mijn recht weggenomen.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "Jes 59:13": "het overtreden en het liegen tegen de HEERE, en het achterwaarts wijken van onze God; het spreken van onderdrukking en afval, het ontvangen en het uitspreken van valse woorden uit het hart.", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Luk 22:42": "en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Joh 14:16-21": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid; Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn. Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Spr 8:5": "Gij eenvoudigen! versta kloekzinnigheid, en gij dwazen! versta met het hart.", "Jes 65:14": "Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Ps 39:13": "Hoor, HEERE, mijn gebed, en neem mijn geroep ter ore; zwijg niet bij mijn tranen; want ik ben een vreemdeling bij U, een bijwoner, zoals al mijn vaders.", "Hand 8:33": "In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.", "Rom 9:29": "En zoals Jesaja van tevoren gezegd heeft: Als de Heere Sebaoth ons geen nageslacht had overgelaten, dan waren wij geworden als Sodom, en gelijk gemaakt aan Gomorra.", "Ps 15:2-5": "Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste; In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Joh 17:25": "Rechtvaardige Vader, de wereld heeft U niet gekend; maar Ik heb U gekend, en dezen hebben erkend dat U Mij gezonden hebt.", "Hand 4:11": "Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is.", "Joh 11:3": "Zijn zusters dan zonden tot Hem, en zeiden: Heere, zie, hij die U liefhebt, is ziek.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Ps 126:4": "O HEERE, keer onze gevangenschap, zoals waterstromen in het zuiden.", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Spr 3:35": "De wijzen zullen eer beërven; maar de dwazen dragen schande.", "Jer 4:2": "Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "Luk 21:16": "En u zult overgeleverd worden, ook door ouders, en broers, en verwanten, en vrienden; en zij zullen sommigen van u doden.", "Jak 5:13-16": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen. Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere. En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Ps 24:3-6": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Matt 19:4": "Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Matt 24:21": "Want dan zal er grote verdrukking zijn, wat voor verdrukking er niet geweest is vanaf het begin van de wereld tot nu toe, en er ook nooit meer zal zijn.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Jer 19:4": "Omdat zij Mij verlaten, en deze plaats vervreemd hebben, en andere goden daarin gerookt hebben die zij niet gekend hebben, zij, noch hun vaders, noch de koningen van Juda; en hebben deze plaats vervuld met bloed van onschuldigen.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Gal 5:22": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.", "Ps 22:2-22": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen? Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte. Doch U bent heilig, wonende onder de lofzangen van Israël.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Hebr 6:16-20": "Want mensen zweren wel bij iemand die groter is dan zij, en de eed tot bevestiging is voor hen een einde van alle tegenspraak; waarbij God, omdat Hij aan de erfgenamen van de belofte overvloediger de onveranderlijkheid van Zijn raad wilde tonen, er een eed tussen heeft gebracht; opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Job 22:17": "Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?", "Spr 3:5": "Vertrouw op de HEERE met heel uw hart, en steun op uw eigen verstand niet.", "1 Joh 3:21": "Geliefden, als ons hart ons niet veroordeelt, hebben wij vrijmoedigheid tegenover God;", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "1 Petr 3:10": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken;", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Ps 109:9-20": "Laat zijn kinderen wezen worden, en zijn vrouw weduwe. En laat zijn kinderen hier en daar omzwerven, en bedelen, en de nooddruft uit hun verwoeste plaatsen zoeken. Laat de schuldeiser aanslaan al wat hij heeft, en laat de vreemden zijn arbeid roven.", "Spr 18:7": "De mond van de dwaas is voor hemzelf een verstoring, en zijn lippen zijn een strik voor zijn ziel.", "Job 36:14": "Hun ziel zal in de jeugd sterven, en hun leven onder de schandjongens.", "Ps 119:27": "Geef mij de weg van Uw bevelen te verstaan, opdat ik Uw wonderen betracht.", "Luk 2:10": "En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal;", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Luk 16:22-25": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Ef 6:18-20": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen; en voor mij, opdat mij het Woord gegeven wordt bij het openen van mijn mond, met vrijmoedigheid, om de verborgenheid van het Evangelie bekend te maken; waarvoor ik een gezant ben in een keten, opdat ik daarin vrijmoedig mag spreken, zoals het mij past te spreken.", "Kol 3:24": "want u weet dat u van de Heere de vergelding van de erfenis zult ontvangen; want u dient de Heere Christus.", "Deut 6:16": "U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.", "Ps 132:16": "En haar priesters zal Ik met heil bekleden, en haar gunstgenoten zullen zeer juichen.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Lev 26:10": "En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "Ezech 14:7": "Want ieder man uit het huis van Israël, en uit de vreemdeling die in Israël verblijft, die zich van achter Mij afscheidt, en zijn drekgoden opzet in zijn hart, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet om Mij door hem te raadplegen; Ik ben de HEERE, hem zal door Mij geantwoord worden;", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "2 Kor 8:2": "Dat in veel beproeving van de verdrukking de overvloed van hun blijdschap, en hun zeer diepe armoede overvloedig geweest is tot de rijkdom van hun goeddadigheid.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Ps 64:7": "Zij doorzoeken allerlei schalkheid; ten uiterste doorzoeken zij, wat te doorzoeken is; zelfs het binnenste van een man, en het diepe hart.", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Kol 2:12": "Met Hem begraven in de doop, waarin u ook met Hem opgewekt bent door het geloof in de werking van God, Die Hem uit de doden opgewekt heeft.", "Spr 22:16": "Wie de arme verdrukt om zijn eigen bezit te vermeerderen, en wie aan de rijke geeft, komt zeker tot gebrek.", "1 Tim 6:12": "Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.", "Zef 3:13": "De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.", "Matt 23:2-33": "en zei: De Schriftgeleerden en de Farizeeën zitten op de stoel van Mozes; daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet. Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "2 Sam 20:1": "Toen was daar bij toeval een man van Belial, wiens naam was Seba, een zoon van Bichri, een man van Jemini; die blies op de bazuin, en zei: Wij hebben geen deel aan David, en wij hebben geen erfenis aan de zoon van Isaï, ieder naar zijn tenten, o Israël!", "Ps 25:9": "Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren.", "Job 27:4": "Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken!", "Num 16:15": "Toen ontstak Mozes zeer, en hij zei tegen de HEERE: Zie hun offer niet aan! Ik heb niet één ezel van hen genomen, en niemand van hen kwaad gedaan.", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Luk 4:19": "Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.", "Mark 9:24": "En meteen riep de vader van het kind met tranen: Ik geloof, Heere! Kom mijn ongeloof te hulp.", "Ps 59:11": "De God van mijn goedertierenheid zal mij voor zijn; God zal mij op mijn verspieders doen zien.", "Pred 5:5": "Laat uw mond niet toe dat hij uw lichaam laat zondigen; en zeg niet voor het aangezicht van de engel dat het een vergissing was; waarom zou God erg toornen om wat u zegt, en het werk van uw handen te gronde richten?", "Joh 19:7": "De Joden antwoordden hem: Wij hebben een wet, en naar onze wet moet Hij sterven, want Hij heeft Zichzelf Gods Zoon gemaakt.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Ps 49:14": "Deze weg van hen is een dwaasheid van hen; toch hebben hun nakomelingen welbehagen in hun woorden. Sela.", "Matt 13:14": "En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Micha 3:1": "Verder zei ik: Hoor nu, hoofden van Jakob, en leiders van het huis van Israël! Betaamt het u niet om het recht te weten?", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Jes 48:1": "Hoor dit, huis van Jakob, die genoemd wordt met de naam van Israël, en uit de wateren van Juda voortgekomen bent! Die daar zweert bij de Naam van de HEERE, en de God van Israël vermeldt, maar niet in waarheid, en ook niet in gerechtigheid.", "Ps 94:3-8": "Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen? Uitgieten? Hard spreken? Zullen alle werkers van de ongerechtigheid zich beroemen? O HEERE! Zij verbrijzelen Uw volk, en zij verdrukken Uw erfdeel.", "Rom 2:29": "Maar die is een Jood, die het in het verborgen is, en de besnijdenis van het hart, in de geest, niet in de letter, dat is de besnijdenis; wiens lof niet is uit de mensen, maar uit God.", "Matt 5:21": "U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Hand 4:30": "Doordat U Uw hand uitstrekt tot genezing, en doordat er tekenen en wonderen gebeuren door de Naam van Uw heilig Kind Jezus.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Openb 5:12-14": "die met een luide stem zeiden: Het Lam, Dat geslacht is, is waard te ontvangen de kracht, en rijkdom, en wijsheid, en sterkte, en eer, en heerlijkheid, en dankzegging. En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid. En de vier dieren zeiden: Amen. En de vierentwintig oudsten vielen neer en aanbaden Hem Die leeft tot in alle eeuwigheid.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Ps 55:3": "Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier;", "Gen 49:7": "Vervloekt is hun toorn, want hij is heftig; en hun verbolgenheid, want zij is hard! Ik zal hen verdelen onder Jakob, en zal hen verstrooien onder Israël.", "Openb 7:4": "En ik hoorde het getal van hen die verzegeld waren: honderdvierenveertigduizend waren verzegeld uit alle geslachten van de kinderen van Israël.", "Matt 22:18": "Maar Jezus doorzag hun boosheid, en zei: Huichelaars, waarom stelt u Mij op de proef?", "Job 10:2-7": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist. Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft? Hebt U vleselijke ogen, ziet U zoals een mens ziet?", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Luk 16:13": "Geen huisknecht kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten; u kunt God niet dienen en de Mammon.", "Jer 31:11": "Want de HEERE heeft Jakob vrijgekocht, en Hij heeft hem verlost uit de hand van hem die sterker was dan hij.", "Joël 3:21": "En Ik zal hun bloed reinigen, dat Ik niet gereinigd had; en de HEERE zal wonen op Sion.", "Hand 7:32": "die zei: Ik ben de God van uw vaders, de God van Abraham, en de God van Izak, en de God van Jakob. En Mozes begon hevig te beven, en durfde niet te kijken.", "Ps 31:18": "HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Ps 4:8": "U hebt vreugde in mijn hart gegeven, meer dan ten tijde dat hun koren en hun most vermenigvuldigd waren.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Hand 7:26-28": "En de volgende dag liet hij zich aan hen zien, terwijl zij vochten; en hij drong hen tot vrede, en zei: Mannen, u bent broeders; waarom doet u elkaar onrecht aan? Maar die zijn naaste onrecht aandeed, stiet hem weg, en zei: Wie heeft u tot leider en rechter over ons gesteld? Wilt u mij ook ombrengen, zoals u gisteren de Egyptenaar hebt omgebracht?", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Hand 7:3": "en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal.", "Ex 28:35": "En Aäron zal die aanhebben om te dienen; opdat zijn geluid gehoord wordt als hij in het heilige, voor het aangezicht van de HEERE, ingaat, en als hij uitgaat, opdat hij niet sterft.", "Ps 45:7": "Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.", "Joh 12:25": "Wie zijn leven liefheeft, zal het verliezen; en wie zijn leven haat in deze wereld, zal het bewaren tot het eeuwige leven.", "Ps 39:11": "Neem Uw plaag van mij weg; ik ben bezweken door de slagen van Uw hand.", "2 Sam 16:8": "De HEERE heeft op u al het bloed van het huis van Saul laten terugkomen, in wiens plaats u geregeerd hebt; nu heeft de HEERE het koninkrijk gegeven in de hand van Absalom, uw zoon; zie nu, u bent in uw ongeluk, omdat u een man van bloed bent.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Rom 3:14": "Hun mond is vol vervloeking en bitterheid;", "Jes 30:26": "En het licht van de maan zal zijn als het licht van de zon, en het licht van de zon zal zevenvoudig zijn als het licht van zeven dagen; op de dag dat de HEERE de breuk van Zijn volk zal verbinden, en de wond waarmee het geslagen is, genezen.", "Luk 23:43": "En Jezus zei tegen hem: Voorwaar, Ik zeg u: Vandaag zult u met Mij in het Paradijs zijn.", "Jes 43:22-24": "Doch u hebt Mij niet aangeroepen, o Jakob! toen u zich tegen Mij vermoeid hebt, o Israël! Mij hebt u niet gebracht het kleinvee van uw brandoffers, en met uw slachtoffers hebt u Mij niet geëerd; Ik heb u Mij niet doen dienen met spijsoffer, en Ik heb u niet vermoeid met wierook. Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Luk 18:8": "Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde?", "Klaagl 1:9-11": "Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot. Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden. Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "Deut 33:23": "En van Naftali zei hij: O Naftali! wees verzadigd van de goedgunstigheid, en vol van de zegen van de HEERE; bezit erfelijk het westen en het zuiden.", "Ps 119:147": "Ik ben de morgenschemering voorgekomen, en heb geschrei gemaakt; op Uw woord heb ik gehoopt.", "Ps 39:5": "HEERE, maak mij mijn einde bekend, en welke de mate van mijn dagen is; dat ik weet, hoe vergankelijk ik ben.", "Jer 7:10": "en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Matt 4:5": "Toen nam de duivel Hem mee naar de heilige stad, en zette Hem op de tinne van de tempel,", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Zach 9:16": "En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "Ps 119:80": "Laat mijn hart oprecht zijn tot Uw inzettingen, opdat ik niet beschaamd word.", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Hos 8:2": "Dan zullen zij tot Mij roepen: Mijn God! Wij, Israël, kennen U.", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "2 Petr 3:4": "En zeggen: Waar is de belofte van Zijn komst? Want vanaf de dag dat de vaders ontslapen zijn, blijven alle dingen zo, net zoals vanaf het begin van de schepping.", "Ps 26:10": "In wier handen schandelijk bedrijf is, en van wie de rechterhand vol geschenken is.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Rom 7:26": "Zo dan, ik zelf dien wel met het gemoed de wet van God, maar met het vlees de wet van de zonde.", "Ps 97:12": "Rechtvaardigen, verblijd u in de HEERE, en spreek lof ter gedachtenis van Zijn heiligheid.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Jer 4:14": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?", "Hebr 10:13": "verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.", "Ps 119:161": "Schin. De vorsten hebben mij vervolgd zonder oorzaak; maar mijn hart heeft gevreesd voor Uw woord.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Hand 2:17-21": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren. En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Spr 20:9": "Wie kan zeggen: Ik heb mijn hart gezuiverd, ik ben rein van mijn zonde?", "Spr 11:20": "De verkeerden van hart zijn de HEERE een gruwel; maar de oprechten van weg zijn Zijn welgevallen.", "Ps 24:7": "Heft uw hoofden op, poorten, en verhef u, eeuwige deuren, opdat de Koning der ere ingaat!", "Spr 26:3-12": "Een zweep is voor het paard, een toom voor de ezel, en een roede voor de rug van de dwazen. Antwoord de dwaas niet naar zijn dwaasheid, opdat u ook niet aan hem gelijk wordt. Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Spr 29:9": "Een wijs man, die met een dwaas man een geschil voert, wordt of boos of belachen, en toch komt er geen rust.", "Neh 9:20": "En U hebt Uw goede Geest gegeven om hen te onderwijzen; en Uw Manna hebt U niet geweerd van hun mond, en water hebt U hun gegeven voor hun dorst.", "2 Tim 4:14": "Alexander, de kopersmid, heeft mij veel kwaad aangedaan; de Heere zal hem vergelden naar zijn werken.", "Zach 11:8": "En ik heb drie herders in één maand afgesneden; want mijn ziel was verdrietig over hen geworden, en ook had hun ziel een walg van mij.", "Zach 11:12": "Want ik had tegen hen gezegd: Als het goed is in uw ogen, breng mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.", "Ps 21:2": "O HEERE! De koning is verblijd over Uw sterkte; en hoezeer is hij verheugd over Uw heil!", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Mark 10:30": "of hij ontvangt honderdvoud, nu in deze tijd, huizen, en broers, en zusters, en moeders, en kinderen, en akkers, met vervolgingen, en in de toekomende tijd het eeuwige leven.", "Ps 66:14": "Die mijn lippen hebben geuit, en mijn mond heeft uitgesproken, toen het mij bang te moede was.", "Ps 7:3": "Anders zou hij mijn ziel roven als een leeuw, die verscheurt, terwijl er geen redder is.", "Luk 6:20-23": "En Hij sloeg Zijn ogen op naar Zijn discipelen, en zei: Zalig bent u, armen, want van u is het Koninkrijk van God. Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen. Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen.", "Jer 3:11": "Toen zei de HEERE tegen mij: Het afgekeerde Israël heeft zichzelf rechtvaardiger getoond dan de trouweloze Juda.", "Hos 10:1": "Israël is een uitgeledigde wijnstok, hij brengt weer vrucht voort voor zichzelf; maar naar de veelheid van zijn vrucht heeft hij de altaren vermeerderd; naar de goedheid van zijn land hebben zij de opgerichte beelden mooi gemaakt.", "Hagg 2:15": "Toen antwoordde Haggai en zei: Zo is dit volk, en zo is deze natie voor Mijn aangezicht, spreekt de HEERE, en zo is al het werk van hun handen; en wat zij daar offeren, dat is onrein.", "Ex 13:21": "En de HEERE ging voor hun aangezicht uit, overdag in een wolkkolom om hen de weg te leiden, en 's nachts in een vuurkolom om hen licht te geven, zodat zij dag en nacht konden voortgaan.", "Ps 102:26-28": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn. Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Ps 118:9": "Het is beter tot de HEERE toevlucht te nemen, dan op prinsen te vertrouwen.", "Ps 91:1": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige.", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Num 22:12": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend.", "Ex 40:34": "Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid van de HEERE vervulde de tabernakel.", "Rom 12:20": "Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.", "Luk 12:10": "En ieder die een woord spreken zal tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest gelasterd zal hebben, die zal het niet vergeven worden.", "Spr 7:5": "Opdat zij u bewaren voor een vreemde vrouw, voor de onbekende, die met haar woorden vleit.", "Hebr 8:8-12": "Want omdat Hij hen berispt, zegt Hij tegen hen: Zie, de dagen komen, spreekt de Heere, dat Ik over het huis van Israël en over het huis van Juda een nieuw verbond zal oprichten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere. Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Openb 12:18": "En ik stond op het zand van de zee.", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Rom 6:19": "Ik spreek op menselijke wijze, vanwege de zwakheid van uw vlees; want zoals u uw leden gesteld hebt om dienstbaar te zijn aan de onreinheid en de ongerechtigheid, tot ongerechtigheid, zo stel nu uw leden om dienstbaar te zijn aan de gerechtigheid, tot heiliging.", "Matt 4:16": "het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.", "Matt 5:3-12": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen. Zalig zijn zij die treuren, want zij zullen vertroost worden. Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Mark 1:3": "De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht.", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "Ps 69:26": "Hun paleis worde verwoest; in hun tenten zij geen inwoner.", "Ps 99:1-4": "De HEERE regeert, dat de volken beven; Hij zit tussen de cherubs; de aarde beeft. De HEERE is groot in Sion, en Hij is hoog boven alle volken. Laat men Uw grote en ontzagwekkende Naam loven, die heilig is;", "Spr 8:35": "Want die Mij vindt, vindt het leven, en verkrijgt een welgevallen van de HEERE.", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "Matt 3:3": "Want deze is het, van wie gesproken is door Jesaja, de profeet, toen hij zei: De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Ps 139:9": "Nam ik vleugels van de dageraad, woonde ik aan het uiterste van de zee;", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Jer 5:26-28": "Want onder Mijn volk worden goddelozen gevonden; ieder van hen loert, zoals de vogelvanger zich schikt; zij zetten een verderfelijke strik, zij vangen de mensen. Zoals een kooi vol is van vogels, zo zijn hun huizen vol van bedrog; daarom zijn zij groot en rijk geworden. Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.",
