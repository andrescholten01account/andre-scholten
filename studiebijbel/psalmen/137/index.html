abel": null}, {"disp": "Ezech 25:15", "href": "../../ezechiel/25/#v15", "ref": "Ezech 25:15", "svLabel": null}, {"disp": "Ezech 25:16", "href": "../../ezechiel/25/#v16", "ref": "Ezech 25:16", "svLabel": null}, {"disp": "Ezech 35:6", "href": "../../ezechiel/35/#v6", "ref": "Ezech 35:6", "svLabel": null}, {"disp": "Obadja 1:10-16", "href": "../../obadja/1/#v10", "ref": "Obadja 1:10-16", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Jes 49:21": "En u zult zeggen in uw hart: Wie heeft mij dezen voortgebracht, aangezien ik van kinderen beroofd en eenzaam was? Ik was in gevangenschap gegaan, en weggeweken; wie heeft mij dan dezen opgevoed? Zie, ik was alleen overgelaten, waar waren dezen?", "Jer 50:5": "Zij zullen naar Sion vragen; op de weg hierheen zullen hun gezichten gericht zijn; zij zullen komen en zich bij de HEERE aansluiten, met een eeuwig verbond, dat niet zal worden vergeten.", "Jer 50:15-29": "Juich over haar rondom, zij heeft haar hand gegeven; haar fundamenten zijn gevallen, haar muren zijn afgebroken; want dat is de wraak van de HEERE, wreek u aan haar, doe haar zoals zij gedaan heeft! Roei uit van Babel de zaaier, en hem die de sikkel hanteert in de oogsttijd; laat hen vanwege het verdrukkende zwaard zich keren, ieder tot zijn volk, en vlieden, ieder naar zijn land. Israël is een verjaagd lam, dat de leeuwen weggejaagd hebben; de eerste die hem heeft opgegeten, was de koning van Assur, en deze, de laatste, Nebukadrezar, de koning van Babel, heeft hem de beenderen verbrijzeld.", "Jer 51:50": "U die ontkomen bent aan het zwaard, ga weg, en blijf niet staan; gedenk de HEERE van verre, en laat Jeruzalem in uw hart opkomen.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "1 Kron 15:24": "En Sebanja, en Josafat, en Nethaneel, en Amasai, en Zecharja, en Benaja, en Eliëzer, de priesters, bliezen op trompetten voor de ark van God; en Obed-edom en Jehia waren poortwachters van de ark.", "Jes 5:29": "Hun gebrul zal zijn als van een oude leeuw, en zij zullen brullen als de jonge leeuwen, en zij zullen grommen, en de prooi grijpen en wegvoeren; en er zal niemand zijn die redt.", "Jes 52:8": "Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal.", "Ps 111:1": "Halleluja! Aleph. Ik zal de HEERE loven van ganser harte; Beth. in de raad en vergadering van de oprechten.", "Amos 6:10": "En de naaste bloedverwant zal ieder van hen opnemen, degene die hem verbrandt, om de beenderen uit het huis naar buiten te brengen, en zal zeggen tegen hem die binnen in het huis is: Is er nog iemand bij u? En hij zal zeggen: Niemand. Dan zal hij zeggen: Zwijg! Want wij mogen de Naam van de HEERE niet noemen.", "1 Kon 1:40": "En al het volk kwam achter hem aan omhoog, en het volk speelde op fluiten, en verblijdde zich met grote blijdschap, zodat de aarde van hun geluid barstte.", "Ps 144:9": "O God, ik zal U een nieuw lied zingen; met de luit en het tiensnarig instrument zal ik U lofzingen.", "Jes 60:19-21": "De zon zal voor u niet meer zijn tot een licht overdag, en tot een glans zal de maan u niet lichten; maar de HEERE zal u tot een eeuwig licht zijn, en uw God tot uw sierlijkheid. Uw zon zal niet meer ondergaan, en uw maan zal haar licht niet intrekken; want de HEERE zal u tot een eeuwig licht zijn, en de dagen van uw treuren zullen een einde nemen. En uw volk zullen allen samen rechtvaardig zijn, zij zullen voor eeuwig de aarde erfelijk bezitten; zij zullen zijn een scheut van Mijn planting, een werk van Mijn handen, opdat Ik verheerlijkt word.", "Openb 17:14": "Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Ps 110:2": "De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden.", "2 Kron 20:22": "Toen zij nu begonnen met vreugdegeroep en lofzang, stelde de HEERE hinderlagen tegen de kinderen van Ammon, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden verslagen.", "2 Kron 5:12": "en de Levieten, die zangers waren, van hen allen, van Asaf, van Heman, van Jeduthun, en van hun zonen, en van hun broeders, in fijn linnen gekleed, met cimbalen, en met luiten, en harpen, stonden aan de oostzijde van het altaar, en met hen tot honderdtwintig priesters toe, die op trompetten trompetten);", "Jer 4:19-31": "O mijn binnenste, mijn binnenste! ik heb weeën, o wanden van mijn hart! Mijn hart maakt getier in mij, ik kan niet zwijgen; want u, mijn ziel! hoort het geluid van de bazuin en het krijgsgeschreeuw. Ondergang op ondergang wordt uitgeroepen; want het hele land is verwoest; haastig zijn mijn tenten verwoest, mijn gordijnen in een ogenblik! Hoe lang zal ik de banier zien, het geluid van de bazuin horen?", "Luk 21:20-26": "Maar wanneer u zult zien dat Jeruzalem door legers omsingeld wordt, weet dan, dat haar verwoesting nabij gekomen is. Laten dan zij die in Judea zijn, vluchten naar de bergen; en zij die in het midden ervan zijn, daaruit trekken; en zij die op de velden zijn, daar niet in komen. Want dit zijn dagen van wraak, opdat alles vervuld wordt wat geschreven is.", "Ezech 30:10": "Zo zegt de Heere HEERE: Ja, Ik zal de menigte van Egypte doen ophouden, door de hand van Nebukadrezar, de koning van Babel.", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "Openb 14:1-3": "En ik zag, en zie, het Lam stond op de berg Sion, en met Hem honderdvierenveertigduizend, die de naam van Zijn Vader geschreven hadden op hun voorhoofden. En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers; en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Ps 135:3": "Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "2 Sam 19:35": "Ik ben vandaag tachtig jaar oud; zou ik nog kunnen onderscheiden tussen goed en kwaad? Zou uw knecht kunnen proeven wat ik eet en wat ik drink? Zou ik nog kunnen horen naar de stem van zangers en zangeressen? En waarom zou uw knecht mijn heer de koning nog langer tot last zijn?", "Jes 14:11": "Uw hoogmoed is in het rijk van de dood neergestort, met het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.", "2 Kron 20:19": "En de Levieten uit de kinderen van de Kahathieten en uit de kinderen van de Korachieten stonden op om de HEERE, de God van Israël, met luide stem uitbundig te prijzen.", "Ps 150:1-6": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte! Loof Hem vanwege Zijn machtige daden; loof Hem naar de overvloed van Zijn grootheid! Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Dan 3:7": "Daarom, op dat moment, toen al die volken het geluid hoorden van de hoorn, de pijp, de citer, de vedel, de psalters, en allerlei soorten muziek, vielen alle volken, naties en tongen neer en aanbaden het gouden beeld, dat de koning Nebukadnezar had opgericht.", "Ps 84:3": "Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "Jes 62:6": "O Jeruzalem! Ik heb wachters op uw muren aangesteld, die voortdurend, de hele dag en de hele nacht, niet zullen zwijgen. U die de HEERE doet gedenken, laat geen stilzwijgen bij u zijn!", "Ps 137:2-4": "Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion; zeiden wij: Hoe zouden wij een lied van de HEERE zingen in een vreemd land?", "Ps 95:2": "Laat ons Zijn aangezicht tegemoet gaan met lof; laat ons Hem juichen met psalmen.", "Jer 7:34": "En Ik zal uit de steden van Juda en uit de straten van Jeruzalem doen ophouden de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid; want het land zal tot een verwoesting worden.", "2 Kron 35:25": "En Jeremia maakte een klaaglied over Josia; evenzo spraken alle zangers en zangeressen in hun klaagliederen van Josia, tot op deze dag; want zij gaven ze tot een inzetting in Israël; en zie, zij zijn geschreven in de klaagliederen.", "Jes 62:12": "En zij zullen hen noemen het heilige volk, de verlosten van de HEERE; en u zult genoemd worden de gezochte, de stad, die niet verlaten is.", "Neh 2:2": "Zo zei de koning tegen mij: Waarom is uw gezicht treurig, terwijl u toch niet ziek bent? Dit is niets anders dan treurigheid van het hart. Toen werd ik erg bevreesd,", "Ef 3:15": "uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt,", "2 Kron 31:2": "En Hizkia stelde de verdelingen van de priesters en de Levieten in, naar hun verdelingen, ieder naar zijn dienst, de priesters en de Levieten voor het brandoffer en voor de dankoffers, om te dienen, en om te loven, en om te prijzen in de poort van de legerplaatsen van de HEERE;", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Neh 1:3": "En zij zeiden tegen mij: De overgeblevenen, die van de gevangenschap daar in het gebied zijn overgebleven, zijn in grote ellende en in smaad; en de muur van Jeruzalem is afgebroken, en haar poorten zijn met vuur verbrand.", "Jes 3:25": "Uw mannen zullen door het zwaard vallen, en uw helden in de strijd.", "Jer 51:33": "Want zo zegt de HEERE van de heerscharen, de God van Israël: De dochter van Babel is als een dorsvloer, het is tijd dat men haar dorst; nog een korte tijd, dan zal haar de tijd van de oogst overkomen.", "1 Kron 22:5": "Want David zei: Mijn zoon Salomo is een jongeman en teder; en het huis dat men voor de HEERE bouwen zal, moet buitengewoon groot gemaakt worden, tot een naam en tot glorie in alle landen; ik zal er nu voorraad voor bereiden. Zo bereidde David voorraad in overvloed voor zijn dood.", "Job 30:31": "Hierom is mijn harp tot een rouwklacht geworden, en mijn orgel tot een stem van hen die wenen.", "Klaagl 5:14": "De oudsten houden op met zitten in de poort, de jongemannen met hun snarenspel.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "Ps 48:3": "Schoon van ligging, een vreugde van de hele aarde is de berg Sion, aan de zijden van het noorden; de stad van de grote Koning.", "Jes 6:12": "Want de HEERE zal die mensen ver wegdoen, en de verlating zal groot zijn in het binnenste van het land.", "Deut 32:9": "Want het deel van de HEERE is Zijn volk, Jakob is het snoer van Zijn erfenis.", "Openb 18:6": "Vergeld haar, zoals zij u vergolden heeft, en verdubbel haar het dubbele, naar haar werken; schenk haar het dubbele in de drinkbeker waarin zij geschonken heeft.", "Jer 43:7": "en zij trokken naar Egypteland, want zij waren aan de stem van de HEERE niet gehoorzaam; en zij kwamen tot Tachpanhes.", "Ps 135:1": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE!", "Ezra 2:64": "Deze hele gemeente samen was tweeënveertigduizend driehonderdzestig.", "Jes 14:21": "Maak de slachting voor zijn kinderen gereed, om de ongerechtigheid van hun vaderen; opdat zij niet opstaan, en de aarde erven, en de wereld vervullen met steden;", "Jes 58:12": "En zij die uit u voortkomen, zullen de oude verwoeste plaatsen bouwen; de fundamenten, van geslacht tot geslacht verwoest, zult u oprichten; en u zult genoemd worden: Die de bressen dichtmuurt, die de paden weer opmaakt, om te bewonen.", "Jer 51:30-58": "Babels helden hebben opgehouden te strijden, zij zijn gebleven in de vestingen, hun kracht is bezweken, zij zijn tot vrouwen geworden; zij hebben hun woningen aangestoken, hun grendels zijn verbroken. De ene loper zal de andere loper tegemoet lopen, en de ene kondschapper de andere kondschapper tegemoet, om de koning van Babel bekend te maken dat zijn stad van het ene einde tot het andere is ingenomen; En dat de veren ingenomen zijn, en de rietpoelen met vuur verbrand zijn; en dat de krijgslieden verbaasd zijn.", "Jes 27:2": "Op die dag zal er een wijngaard van rode wijn zijn; zing daarvan bij beurte.", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Ps 87:4": "Ik zal Rahab en Babel vermelden, onder hen die Mij kennen; zie, de Filistijn en de Tyriër, met de Moor, deze is daar geboren.", "Spr 25:20": "Wie liederen zingt bij een treurig hart, is als iemand die een kleed aflegt op de dag van de koude, en als azijn op salpeter.", "Lev 23:40": "En op de eerste dag zult u voor uzelf nemen takken van schoon geboomte, palmtakken, en takken van dichte bomen, met beekwilgen; en u zult voor het aangezicht van de HEERE, uw God, zeven dagen vrolijk zijn.", "Ps 114:2": "Werd Juda tot Zijn heiligdom, Israël Zijn volkomen heerschappij.", "Ef 2:21": "op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere;", "Ps 87:7": "En de zangers, evenals de speellieden, alsook al mijn bronnen, zullen binnen u zijn.", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Obadja 1:11": "Op de dag dat u tegenover hem stond, op de dag dat vreemden zijn leger gevangen wegvoerden, en buitenlanders zijn poorten binnentrokken, en over Jeruzalem het lot wierpen, was u ook als een van hen.", "Ps 126:2": "Toen was onze mond vol lachen, en onze tong vol gejuich; toen zei men onder de heidenvolken: De HEERE heeft grote dingen aan hen gedaan.", "Jer 9:11": "En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner.", "Ex 17:14": "Toen zei de HEERE tegen Mozes: Schrijf dit ter gedachtenis in een boek, en prent het in de oren van Jozua, dat Ik de gedachtenis van Amalek geheel zal uitwissen van onder de hemel.", "Richt 5:1-31": "Verder zong Debora, en Barak, de zoon van Abinoam, op dezelfde dag, en zei: Looft de HEERE, om het wreken van de wraken in Israël, om dat het volk zich gewillig heeft aangeboden. Hoor, u koningen, neem het ter ore, u vorsten! Ik, den HEERE zal ik zingen, ik zal den HEERE, de God van Israël, psalmzingen.", "Hand 20:24": "Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.", "Jer 42:11": "Vrees niet voor het aangezicht van de koning van Babel, voor wie u vreest; vrees niet voor hem, spreekt de HEERE; want Ik zal met u zijn, om u te behouden en u van zijn hand te redden.", "Mark 14:26": "En nadat zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.", "Jer 15:8": "Hun weduwen zijn Mij meer geworden dan het zand van de zeeën; Ik heb hun over de moeder een jongeman doen komen, een verwoester op de middag; Ik heb hem haastig hen doen overvallen, de stad met verschrikkingen.", "Jer 15:9": "Zij die zeven kinderen baarde, is zwak geworden; zij heeft haar ziel uitgeblazen, haar zon is ondergegaan, toen het nog dag was; zij is beschaamd en te schande geworden; en hun overblijfsel zal Ik aan het zwaard overgeven, voor het aangezicht van hun vijanden, spreekt de HEERE.", "Jes 51:16": "En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw van Mijn hand; om de hemel te planten, en om de aarde te gronden, en om tegen Sion te zeggen: U bent Mijn volk.", "Ps 14:7": "Och, dat Israëls verlossing uit Sion kwam! Als de HEERE de gevangenen van Zijn volk zal doen terugkeren, dan zal Jakob zich verheugen, Israël zal blij zijn.", "Ps 132:13-16": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei: Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd. Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen.", "Klaagl 2:10": "Jod. De oudsten van de dochter van Sion zitten op de aarde, zij zwijgen stil, zij werpen stof op hun hoofd, zij hebben zakken aangegord; de jonge dochters van Jeruzalem laten hun hoofd ter aarde hangen.", "Jes 33:20-24": "Bekijk Sion, de stad van onze samenkomsten; uw ogen zullen Jeruzalem zien, een rustige woonplaats, een tent, die niet neergehaald zal worden, waarvan de pinnen in eeuwigheid niet uitgetrokken zullen worden, en waarvan geen touwen verscheurd zullen worden. Maar de HEERE zal daar bij ons heerlijk zijn, het zal een plaats zijn van rivieren, van wijde stromen; geen roeischuit zal daar doorvaren, en geen praalschip zal daar overvaren. Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Jes 47:1": "Daal af en ga zitten in het stof, jonkvrouw, dochter van Babel! Zit op de aarde, er is geen troon meer, dochter van de Chaldeeën! Want u zult niet meer genoemd worden de tedere, of de wellustige.", "1 Kron 25:1": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst.", "Jes 63:1-6": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen. Waarom bent U rood aan Uw gewaad, en Uw kleren als van iemand die in de wijnpers treedt? Ik heb de pers alleen getreden, en er was niemand van de volken met Mij; en Ik heb hen getreden in Mijn toorn, en heb hen vertrapt in Mijn grimmigheid; en hun bloed is gesprenkeld op Mijn kleren, en heel Mijn gewaad heb Ik bezoedeld.", "Jes 44:23": "Zing met vreugde, u hemelen! Want de HEERE heeft het gedaan; juich, u onderste delen van de aarde! U bergen! Maak een groot gedreun met vreugdegezang, u bossen, en al het geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Jer 9:2": "Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop.", "Rom 11:26": "En zo zal heel Israël zalig worden; zoals geschreven is: De Verlosser zal uit Sion komen en zal de goddeloosheden afwenden van Jakob.", "Jes 28:5": "Op die dag zal de HEERE van de heerscharen tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;", "Openb 14:2": "En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers;", "Jer 8:11": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Terwijl er geen vrede is.", "Jer 31:7": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël.", "Jer 3:14": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen.", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Jes 44:28": "Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.", "Jes 43:1-7": "Maar nu, zo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! Vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, u bent van Mij. Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken. Want Ik ben de HEERE, uw God, de Heilige van Israël, uw Heiland; Ik heb Egypte, Morenland en Seba gegeven tot uw losgeld in uw plaats.", "Ps 132:13": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei:", "1 Kron 16:42": "Met hen dan waren Heman en Jeduthun, met trompetten en cimbalen voor hen die zich lieten horen, en met instrumenten van de muziek van God; maar de zonen van Jeduthun waren aan de poort.", "Ezech 33:32": "En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.", "Jer 7:33": "En de dode lichamen van dit volk zullen voedsel zijn voor het gevogelte van de hemel en het gedierte van de aarde, en niemand zal ze verjagen.", "Ezech 32:11": "Want zo zegt de Heere HEERE: Het zwaard van de koning van Babel zal u overkomen.", "Ps 128:6": "En u zult uw kleinkinderen zien. Vrede over Israël!", "Jes 13:1-22": "De last van Babel, die Jesaja, de zoon van Amoz, gezien heeft. Hef een banier op, op een hoge berg; verhef een stem tot hen; beweeg de hand omhoog, dat zij binnengaan door de deuren van de vorsten. Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid.", "Matt 6:33": "Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Jes 52:2": "Schud u uit het stof, sta op, ga zitten, o Jeruzalem! Maak u los van de banden van uw hals, u gevangen dochter van Sion!", "Ps 65:2": "De lofzang is in stilte tot U, o God! in Sion; en U zal de gelofte betaald worden.", "Jes 21:1-10": "De last die rust op de woestijn aan de zee. Zoals wervelwinden in het zuiden voorbijtrekken, zo komt het uit de woestijn, uit een schrikwekkend land. Een hard visioen is mij bekendgemaakt: die trouweloze handelt trouweloos, en die verwoester verwoest; trek op, o Elam! beleger het, o Media! Ik heb al haar gezucht doen ophouden. Daarom zijn mijn lendenen vol grote pijn, weeën hebben mij aangegrepen, zoals de weeën van een barende vrouw; ik krom mij van wat ik hoor, ik word ontsteld van wat ik zie.", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "Dan 6:12": "Toen kwamen die mannen met elkaar bijeen, en zij vonden Daniël biddend en smekend voor het aangezicht van zijn God.", "Jes 14:4-24": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "Ezech 21:19": "U nu, mensenkind, stel u twee wegen voor, waardoor het zwaard van de koning van Babel komt; uit één land zullen zij beide voortkomen; en kies een plaats, kies die aan het hoofd van de weg naar de stad.", "Jer 21:4-10": "Zo zegt de HEERE, de God van Israël: Zie, Ik zal de oorlogswapens omkeren, die in uw hand zijn, waarmee u strijdt tegen de koning van Babel en tegen de Chaldeeën, die u belegeren, van buiten aan de muur; en Ik zal ze verzamelen in het midden van deze stad. En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid. En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "Ezech 17:5": "Hij nam ook van het zaad van het land, en legde het in een zaadakker; hij nam het, hij zette het bij veel water met grote zorgvuldigheid.", "Zach 11:17": "Wee de nietige herder, die de kudde verlaat! Het zwaard zal over zijn arm zijn, en over zijn rechteroog; zijn arm zal helemaal verdorren, en zijn rechteroog zal helemaal donker worden.", "Neh 12:27-31": "Bij de inwijding nu van de muur van Jeruzalem, zochten zij de Levieten op uit al hun plaatsen, om hen naar Jeruzalem te brengen, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen. Zo werden de kinderen van de zangers verzameld, zowel uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten; En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.", "Jes 14:4-26": "dan zult u deze spreuk aanheffen tegen de koning van Babel, en zeggen: Hoe houdt de onderdrukker op! Hoe houdt de gouden stad op! De HEERE heeft de stok van de goddelozen gebroken, de scepter van de heersers. Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "Ps 122:6": "Bid om de vrede van Jeruzalem; het moet goed gaan met hen die u liefhebben.", "Ps 50:2": "Uit Sion, de volkomenheid van de schoonheid, verschijnt God blinkend.", "Jes 43:25": "Ik, Ik ben het, Die uw overtredingen uitwis, om Mijnentwil, en Ik denk aan uw zonden niet.", "Ezra 3:11": "En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE.", "Ps 48:12-14": "Laat de berg Sion blijde zijn; laat de dochters van Juda zich verheugen, om Uw oordelen wil. Ga rondom Sion, en omring haar; tel haar torens; Zet uw hart op haar vesting; beschouw nauwkeurig haar paleizen, opdat u het aan het volgende geslacht vertelt.", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "Openb 17:1-18": "En een uit de zeven engelen die de zeven schalen hadden, kwam en sprak met mij, en zei tegen mij: Kom hier, ik zal u het oordeel tonen van de grote hoer, die zit op veel water; met wie de koningen van de aarde gehoereerd hebben, en zij die de aarde bewonen zijn dronken geworden van de wijn van haar hoererij. En hij bracht mij weg naar een woestijn, in de geest, en ik zag een vrouw zitten op een scharlaken rood beest, dat vol was van namen van godslastering, en dat zeven hoofden had en tien horens.", "1 Kron 15:27": "David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.", "Hos 7:2": "En zij zeggen niet in hun hart dat Ik al hun boosheid onthoud; nu omsingelen hun daden hen, zij zijn voor Mijn aangezicht.", "Dan 10:3": "Smakelijk voedsel at ik niet, en vlees of wijn kwam niet in mijn mond; ook zalfde ik mij helemaal niet, totdat die drie volle weken vervuld waren.", "Neh 2:1-20": "Toen gebeurde het in de maand Nisan, in het twintigste jaar van koning Arthahsasta, als er wijn voor hem was, dat ik de wijn opnam en aan de koning gaf; nu was ik nooit eerder treurig geweest voor hem. Zo zei de koning tegen mij: Waarom is uw gezicht treurig, terwijl u toch niet ziek bent? Dit is niets anders dan treurigheid van het hart. Toen werd ik erg bevreesd, en ik zei tegen de koning: De koning leve in eeuwigheid! Hoe zou mijn gezicht niet treurig zijn, terwijl de stad, de plaats van de graven van mijn vaderen, verwoest is, en haar poorten met vuur verteerd zijn?", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "2 Kron 23:13": "En zij keek toe; en zie, de koning stond bij zijn pilaar, bij de ingang; en de leiders en de trompetten waren bij de koning; en heel het volk van het land was blij, en blies op de trompetten; en de zangers waren er met muzikale instrumenten, en gaven aanwijzingen om lof te zingen; toen scheurde Athalia haar kleren, en riep: Verraad, verraad!", "Jer 8:16": "Vanuit Dan wordt het gesnuif van zijn paarden gehoord; het hele land beeft van het geluid van het gebries van zijn sterke dieren; en zij komen daarheen om het land op te eten en al wat het bevat, de stad en wie daarin wonen.", "Zach 2:7": "Hoi, Sion! ontkom, u die woont bij de dochter van Babel!", "Dan 10:2": "In die dagen was ik, Daniël, drie volle weken aan het treuren.", "Jes 32:14": "Want het paleis zal verlaten zijn, het gewoel van de stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in eeuwigheid, een vreugde van de woudezels, een weide voor de kudden.", "1 Kor 3:9": "Want wij zijn medearbeiders van God; akkerwerk van God, gebouw van God bent u.", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Deut 26:1-11": "Verder zal het gebeuren, wanneer u gekomen bent in het land dat de HEERE, uw God, u als erfelijk bezit geven zal, en u dat erfelijk bezit en daarin woont; dan zult u van de eerstelingen van alle vrucht van het land nemen, die u opbrengt van uw land dat de HEERE, uw God, u geeft, en zult ze in een korf leggen; en u zult gaan naar de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; en u zult komen bij de priester die er in die dagen zal zijn, en tegen hem zeggen: Ik verklaar heden voor de HEERE, uw God, dat ik gekomen ben in het land dat de HEERE onze vaderen gezworen heeft ons te zullen geven.", "1 Kron 25:6": "Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.", "Jer 8:22": "Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Jes 33:8": "De gebaande wegen zijn verwoest, wie over de paden gaat, houdt op; hij vernietigt het verbond, hij veracht de steden, hij telt geen mens.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Jes 1:27": "Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Neh 1:2-4": "dat Hanani kwam, een van mijn broers, hij en enkele mannen uit Juda, en ik vroeg hen naar de Joden die ontkomen waren, die overgebleven waren van de gevangenschap, en naar Jeruzalem. En zij zeiden tegen mij: De overgeblevenen, die van de gevangenschap daar in het gebied zijn overgebleven, zijn in grote ellende en in smaad; en de muur van Jeruzalem is afgebroken, en haar poorten zijn met vuur verbrand. En het gebeurde, toen ik deze woorden hoorde, dat ik neerzat, en huilde, en rouw bedreef, enkele dagen; en ik vastte en bad voor het aangezicht van de God van de hemel.", "Jes 6:11": "Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.", "Jer 9:10-21": "Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan! En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner. Wie is de wijze man, die dit begrijpt? En tot wie heeft de mond van de HEERE gesproken, dat hij het verkondigt, waarom het land vergaat en afgebrand is als een woestijn, zodat er niemand doorgaat?", "Jes 43:14-17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten. Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning. Zo zegt de HEERE, Die in de zee een weg, en in de sterke wateren een pad maakte;", "Openb 17:5": "En op haar voorhoofd was een naam geschreven: namelijk Verborgenheid; het grote Babylon, de moeder van de hoererijen en van de gruwelen van de aarde.", "Ps 125:1": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid.", "Luk 19:41": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,", "Jer 51:64": "En zult zeggen: Zo zal Babel zinken, en niet meer opkomen, vanwege het kwaad dat Ik over haar zal brengen, en zij zullen moe worden. Tot hiertoe zijn de woorden van Jeremia.", "1 Kron 16:41": "En met hen Heman en Jeduthun, en de overige uitgelezen mannen, die met naam uitgedrukt zijn om de HEERE te loven; want Zijn goedertierenheid is tot in eeuwigheid.", "Jes 34:7-15": "En de eenhoorns zullen met hen neerdalen, en de jonge stieren met de stieren; en hun land zal doordrenkt worden van het bloed, en hun stof zal van het vet vet gemaakt worden. Want het zal zijn de dag van de wraak van de HEERE, een jaar van vergeldingen, om de rechtszaak van Sion. En hun beken zullen in pek veranderd worden, en hun stof in zwavel; ja, hun land zal tot brandend pek worden.", "Jes 5:30": "En zij zullen op die dag tegen hen bruisen, als het bruisen van de zee. Als men dan naar het land kijkt, zie, dan is er duisternis en benauwdheid, en het licht zal verduisterd worden in de wolken erboven.", "Ezech 25:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.", "1 Sam 18:7": "En de vrouwen, spelend, antwoordden elkaar en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden!", "Ezech 33:27": "Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: Zo waarachtig als Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven!", "Ps 48:12": "Laat de berg Sion blijde zijn; laat de dochters van Juda zich verheugen, om Uw oordelen wil.", "Klaagl 2:18": "Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op!", "1 Sam 18:6": "Het gebeurde nu, toen zij kwamen, en David terugkeerde van het verslaan van de Filistijn, dat de vrouwen uit al de steden van Israël uitgingen, met gezang en reidansen, koning Saul tegemoet, met tamboerijnen, met vreugde en met muziekinstrumenten.", "Ps 102:17": "Als de HEERE Sion zal opgebouwd hebben, in Zijn heerlijkheid zal verschenen zijn,", "Klaagl 1:16": "Ain. Om deze dingen ween ik; mijn oog, mijn oog vliet af van water, omdat de trooster, die mijn ziel zou verkwikken, ver van mij is; mijn kinderen zijn verwoest, omdat de vijand de overhand heeft.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Matt 9:23": "En toen Jezus in het huis van de leider kwam, en de fluitspelers zag en de rumoerige menigte,", "Jer 12:10": "Veel herders hebben Mijn wijngaard verdorven, zij hebben Mijn akker vertrapt; zij hebben Mijn gewenste akker gesteld tot een woeste wildernis.", "Ezech 35:3-10": "En zeg ertegen: Zo zegt de Heere HEERE: Zie, Ik heb het tegen u, o gebergte Seir! En Ik zal Mijn hand tegen u uitstrekken, en zal u maken tot een verwoesting en een verlatenheid. Ik zal uw steden maken tot een woestenij, en u zult een verwoesting worden, en u zult weten, dat Ik de HEERE ben. Omdat u een eeuwige vijandschap hebt, en de kinderen van Israël hebt laten omkomen door het geweld van het zwaard, ten tijde van hun ondergang, ten tijde van hun uiterste ongerechtigheid;", "Zach 8:3": "Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "Jes 30:32": "En overal waar die gegrondveste staf doorgegaan zal zijn (waarop de HEERE hem zal hebben doen rusten), daar zal men met trommels en harpen zijn; want met bewegende bestrijdingen zal Hij tegen hen strijden.", "1 Tess 4:9": "Wat de broederlijke liefde nu betreft, hebt u niet nodig dat ik u schrijf; want u zelf bent door God geleerd om elkaar lief te hebben.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Jer 34:3": "En u zult van zijn hand niet ontkomen, maar zeker gegrepen en in zijn hand gegeven worden; en uw ogen zullen de ogen van de koning van Babel zien, en zijn mond zal tot uw mond spreken, en u zult naar Babel komen.", "Zach 2:7-9": "Hoi, Sion! ontkom, u die woont bij de dochter van Babel! Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan. Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Jes 66:10": "Verblijd u met Jeruzalem, en verheug u over haar, al haar liefhebbers! Wees vrolijk over haar met vreugde, u allen die over haar hebt getreurd!", "Jes 41:17": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten.", "Matt 13:24": "Een andere gelijkenis heeft Hij hun voorgehouden en zei: Het Koninkrijk der hemelen is gelijk aan een mens die goed zaad zaaide in zijn akker.", "Jes 24:23": "En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Ps 79:1-3": "Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt. Zij hebben de dode lichamen van Uw knechten aan het gevogelte van de hemel tot voedsel gegeven; het vlees van Uw gunstgenoten aan het gedierte van het land. Zij hebben hun bloed rondom Jeruzalem als water vergoten; en er was niemand die hen begroef.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Klaagl 5:1-22": "Denk, HEERE, aan wat ons gebeurd is, kijk ernaar en zie onze smaad aan. Ons erfdeel is overgegaan aan vreemden, onze huizen aan uitlanders. Wij zijn wezen zonder vader, onze moeders zijn als weduwen.", "Dan 6:19": "Toen ging de koning naar zijn paleis, en bracht de nacht door zonder te eten, en liet geen muziek voor zich brengen; en zijn slaap ontweek hem.", "Jes 21:1": "De last die rust op de woestijn aan de zee. Zoals wervelwinden in het zuiden voorbijtrekken, zo komt het uit de woestijn, uit een schrikwekkend land.", "Jes 33:5": "De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.", "2 Kon 19:31": "Want uit Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is uit de berg Sion; de na-ijver van de HEERE van de heerscharen² zal dit doen.", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "Jer 19:7-9": "Want Ik zal de raad van Juda en Jeruzalem in deze plaats verijdelen, en zal hen voor het aangezicht van hun vijanden doen vallen door het zwaard, en door de hand van hen die hun ziel zoeken; en Ik zal hun dode lichamen aan het gevogelte van de hemel en het gedierte van de aarde tot voedsel geven. En Ik zal deze stad zetten tot een ontzetting en tot een aanfluiting; ieder die haar voorbijgaat, zal zich ontzetten en fluiten over al haar plagen. En Ik zal hun het vlees van hun zonen en het vlees van hun dochters doen eten, en zij zullen eten, ieder het vlees van zijn naaste, in de belegering en in de benauwing, waarmee hun vijanden, en zij die hun ziel zoeken, hen benauwen zullen.", "Obadja 1:10-14": "Om het geweld, gepleegd tegen uw broeder Jakob, zal schaamte u bedekken; en u zult voor eeuwig worden uitgeroeid. Op de dag dat u tegenover hem stond, op de dag dat vreemden zijn leger gevangen wegvoerden, en buitenlanders zijn poorten binnentrokken, en over Jeruzalem het lot wierpen, was u ook als een van hen. U had niet moeten kijken naar de dag van uw broeder, de dag van zijn vervreemding; en u had zich niet moeten verblijden over de kinderen van Juda, op de dag van hun ondergang; en u had uw mond niet groot moeten maken, op de dag van de benauwdheid;", "Luk 21:6": "Wat deze dingen aangaat, die u aanschouwt: er zullen dagen komen waarin geen steen op de andere steen gelaten zal worden, die niet zal worden afgebroken.", "Ezech 25:12-14": "Zo zegt de Heere HEERE: Omdat Edom met louter wraakgierigheid gehandeld heeft tegen het huis van Juda, en zij zich zeer schuldig gemaakt hebben doordat zij zich op hen gewroken hebben: Daarom, zo zegt de Heere HEERE: Ik zal ook Mijn hand uitstrekken tegen Edom, en Ik zal mens en dier uit haar uitroeien; en Ik zal haar tot een woestenij maken, vanaf Teman; en zij zullen tot Dedan toe door het zwaard vallen. En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE.", "Jer 32:28": "Daarom zegt de HEERE zo: Zie, Ik geef deze stad in de hand van de Chaldeeën, en in de hand van Nebukadnezar, de koning van Babel, en hij zal haar innemen.", "Jer 31:12": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn.", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Ps 74:18": "Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Fil 1:20": "Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood.", "Jes 13:15": "Al wie gevonden wordt, zal doorstoken worden, en al wie daarbij gegrepen wordt, zal door het zwaard vallen.", "Klaagl 3:48-51": "Pe. Met waterbeken loopt mijn oog neer, vanwege de breuk van de dochter van mijn volk. Ain. Mijn oog vliet, en kan niet ophouden, omdat er geen rust is; Ain. Totdat de HEERE van de hemel neerkijkt, en het ziet.", "1 Kron 25:5": "Deze allen waren kinderen van Heman, de ziener van de koning, in de woorden van God, om de hoorn te verheffen; want God had Heman veertien zonen gegeven, en drie dochters.", "Rom 9:33": "zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "Jes 31:5": "Zoals vliegende vogels, zo zal de HEERE van de heerscharen Jeruzalem beschutten, beschuttend zal Hij haar ook verlossen, voorbijgaand zal Hij haar ook uithelpen.", "Ezech 25:15": "Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap;", "Ps 102:20-22": "Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben; Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood; Opdat men de Naam van de HEERE vertelt te Sion, en Zijn lof te Jeruzalem;", "Dan 3:4": "En een heraut riep met kracht: Men zegt u aan, u volken, u naties en tongen!", "Klaagl 3:48": "Pe. Met waterbeken loopt mijn oog neer, vanwege de breuk van de dochter van mijn volk.", "Job 21:12": "Zij heffen op met de trommel en de harp, en verblijden zich bij het geluid van de fluit.", "Matt 16:18": "En Ik zeg u ook, dat u Petrus bent, en op deze petra zal Ik Mijn gemeente bouwen, en de poorten van de hel zullen haar niet overweldigen.", "Openb 18:20": "Bedrijf vreugde over haar, u hemel, en u heilige apostelen en profeten, want God heeft uw oordeel aan haar voltrokken.", "Ex 15:21": "Toen antwoordde Mirjam hun: Zingt de HEERE; want Hij is hoog verheven! Hij heeft het paard met zijn ruiter in de zee gestort!", "Jer 51:13": "U, die aan veel water woont, die machtig bent van schatten! Uw einde is gekomen, de maat van uw gierigheid.", "Jer 48:33": "Zodat de blijdschap en vreugde uit het vruchtbare veld, namelijk uit Moabs land, weggenomen is; want Ik heb de wijn doen ophouden uit de kuipen; men zal geen druiven treden met vreugdegeroep; het vreugdegeroep zal geen vreugdegeroep zijn.", "Klaagl 2:11": "Caph. Mijn ogen zijn verteerd door tranen, mijn ingewand wordt beroerd; mijn lever is ter aarde uitgeschud, vanwege de breuk van de dochter van mijn volk; omdat het kind en de zuigeling op de straten van de stad in onmacht zinken;", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Ps 85:2-14": "U bent Uw land gunstig geweest, HEERE! De gevangenschap van Jakob hebt U gekeerd. De misdaad van Uw volk hebt U weggenomen; U hebt al hun zonden bedekt. Sela. U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Jes 32:13": "Op het land van mijn volk zal de doorn en de distel opgaan; ja, op alle vreugdehuizen, in de vrolijk huppelende stad.", "Gen 2:10-14": "En een rivier stroomde voort uit Eden, om deze hof te bewateren; en werd vandaar verdeeld, en werd tot vier hoofden. De naam van de eerste rivier is Pison; dat is het, dat het hele land van Havila omstroomt, waar het goud is. En het goud van dit land is goed; daar is ook bedolah, en de steen sardonix.", "Hab 1:5-11": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt. Want zie, Ik verwek de Chaldeeën, een bitter en snel volk, dat door de breedten van de aarde trekt, om woningen die niet van hem zijn, in erfelijk bezit te nemen. Schrikkelijk en vreselijk is het; zijn recht en zijn hoogheid gaan van hemzelf uit.", "Ps 126:1": "Een lied Hammaäloth. Toen de HEERE de gevangenen van Sion terugbracht, waren wij als mensen die dromen.", "2 Kron 35:15": "En de zangers, de zonen van Asaf, waren op hun standplaats, naar het gebod van David, en Asaf, en Heman, en Jeduthun, de ziener van de koning, alsook de poortwachters bij elke poort; zij hoefden niet te wijken van hun dienst, want hun broeders, de Levieten, bereidden voor hen.", "Jes 66:8": "Wie heeft ooit zoiets gehoord? Wie heeft dergelijke dingen gezien? Zou een land geboren kunnen worden op één dag? Zou een volk geboren kunnen worden in één keer? Maar Sion heeft weeën gekregen, en zij heeft haar zonen gebaard.", "Ps 149:6": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand,", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "Jes 23:16": "Neem de harp, ga rond door de stad, u vergeten hoer! Speel mooi, zing veel liederen, opdat men weer aan u denkt!", "Jer 33:9": "En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.", "Amos 8:3": "Maar de gezangen van de tempel zullen op die dag huilen worden, spreekt de Heere HEERE; er zullen veel dode lichamen zijn, in alle plaatsen zal men ze stilzwijgend wegwerpen.", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Ef 3:21": "Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.", "Ps 135:2": "U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God!", "Hand 7:38": "Dit is degene die in de samenkomst van het volk in de woestijn was, samen met de engel die tot hem sprak op de berg Sinaï, en met onze vaders; die de levende woorden ontving, om ons die te geven,", "Ps 22:16": "Mijn kracht is verdroogd als een potscherf, en mijn tong kleeft aan mijn gehemelte; en U legt mij in het stof van de dood.", "Jes 31:4": "Want zo heeft de HEERE tegen mij gezegd: Zoals een leeuw, en een jonge leeuw over zijn prooi brult, wanneer ook een volle menigte herders tegen hem samengeroepen wordt, verschrikt hij voor hun stem niet, en vernedert zich niet vanwege hun grote aantal; zo zal de HEERE van de heerscharen neerdalen, om te strijden voor de berg Sion en voor haar heuvel.", "Ezra 8:31": "Zo braken wij op van de rivier Ahava, op de twaalfde van de eerste maand, om te gaan naar Jeruzalem; en de hand van onze God was over ons, en redde ons uit de hand van de vijand, en van hen die ons op de weg opwachtten om te overvallen.", "Jer 26:18": "Micha, de Morastiet, heeft in de dagen van Hizkia, koning van Juda, geprofeteerd, en tot al het volk van Juda gesproken, en gezegd: Zo zegt de HEERE van de heerscharen: Sion zal als een akker geploegd worden, en Jeruzalem tot steenhopen worden, en de berg van dit huis tot hoogten van het woud.", "Nahum 3:10": "Toch is zij gevankelijk gegaan in de gevangenis; ook zijn haar kinderen op het hoofd van alle straten verpletterd geworden; en over haar geëerde hebben zij het lot geworpen, en al haar groten zijn in boeien gebonden geworden.", "Jer 31:23": "Zo zegt de HEERE van de heerscharen, de God van Israël: Dit woord zullen zij nog zeggen in het land van Juda, en in zijn steden, wanneer Ik hun gevangenschap ombuigen zal: De HEERE zegent u, woning van de gerechtigheid, berg van de heiligheid!", "Ps 48:13": "Ga rondom Sion, en omring haar; tel haar torens;", "Jer 13:17": "Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.", "Ps 84:11": "Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.", "Jes 49:14": "Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten.", "Openb 17:6": "En ik zag dat de vrouw dronken was van het bloed van de heiligen, en van het bloed van de getuigen van Jezus. En ik verwonderde mij, toen ik haar zag, met grote verwondering.", "Obadja 1:18-21": "En het huis van Jakob zal een vuur zijn, en het huis van Jozef een vlam, en het huis van Ezau tot een stoppel; en zij zullen tegen hen ontbranden en hen verteren, zodat het huis van Ezau geen overgeblevene zal hebben; want de HEERE heeft het gesproken. En zij die uit het zuiden zijn, zullen het gebergte van Ezau erfelijk bezitten, en zij die uit de laagte zijn, zullen de Filistijnen erfelijk bezitten; ja, zij zullen het veld van Efraïm en het veld van Samaria erfelijk bezitten; en Benjamin zal Gilead bezitten. En de gevankelijk weggevoerden van dit leger van de kinderen van Israël, dat van de Kanaänieten was, tot Zarfath toe; en de gevankelijk weggevoerden van Jeruzalem, dat in Sefarad is, zij zullen de steden van het zuiden erfelijk bezitten.", "Jes 14:32": "Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben.", "Jes 19:2-16": "Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, zodat zij zullen strijden, ieder tegen zijn broeder, en ieder tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk. En de geest van de Egyptenaren zal uitgeledigd worden in hun binnenste, en hun raad zal Ik verslinden; dan zullen zij hun afgoden vragen, en de bezweerders, en de waarzeggers, en de duivelskunstenaars. En Ik zal de Egyptenaars overleveren in de hand van harde heren, en een strenge koning zal over hen heersen, spreekt de Heere HEERE van de heerscharen.", "Zach 14:2": "Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden.", "Jer 15:17": "Ik heb in de raad van de spotters niet gezeten, en ben ook niet van vreugde opgesprongen; vanwege Uw hand heb ik alleen gezeten, want U hebt mij met gramschap vervuld.", "1 Kron 25:7": "En hun aantal, met hun broeders die onderwezen waren in het gezang van de HEERE, allen meesters, was tweehonderdachtentachtig.", "Jes 16:10": "zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.", "Jer 10:20": "Mijn tent is verstoord, en al mijn touwen zijn verscheurd; mijn kinderen zijn van mij uitgegaan, en zij zijn er niet; er is niemand meer, die mijn tent uitspant, en mijn gordijnen opricht.", "Joël 2:15": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit.", "Jes 3:5": "En het volk zal gedrongen worden, de een zal zijn tegen de ander, en ieder tegen zijn naaste; de jongeling zal zich brutaal gedragen tegen de oude, de verachte tegen de eerlijke.", "Openb 11:3": "En Ik zal Mijn twee getuigen macht geven, en zij zullen profeteren duizend tweehonderd zestig dagen, met zakken bekleed.", "1 Kron 15:28": "Zo bracht heel Israël de ark van het verbond van de HEERE op, met gejuich, en met geluid van de bazuin, en met trompetten, en met cimbalen, en maakte geluid met luiten en met harpen.", "Ps 149:1-3": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning. Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "1 Kor 12:25": "opdat er geen verdeeldheid in het lichaam zou zijn, maar de leden voor elkaar dezelfde zorg zouden dragen.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "Ps 137:1-7": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Ef 5:29": "Want niemand heeft ooit zijn eigen vlees gehaat, maar hij voedt het, en verzorgt het, zoals ook de Heere de Gemeente.", "1 Kor 15:9": "Want ik ben de minste van de apostelen, die niet waardig ben een apostel genoemd te worden, omdat ik de Gemeente van God vervolgd heb.", "Jer 50:42": "Boog en spies zullen zij voeren; wreed zijn zij, en zullen niet barmhartig zijn; hun stem zal bruisen als de zee, en op paarden zullen zij rijden; het is opgesteld als een man ten oorlog, tegen u, o dochter van Babel!", "Hos 14:1": "Samaria zal woest worden, want zij is opstandig geweest tegen haar God; zij zullen door het zwaard vallen, hun kinderen zullen verpletterd, en hun zwangere vrouwen zullen opengesneden worden.", "Klaagl 4:4": "Daleth. De tong van het zuigeling kleeft aan zijn gehemelte van dorst; de kinderen vragen om brood, er is niemand die het hun uitdeelt.", "2 Kron 20:21": "Hij nu overlegde met het volk, en hij stelde voor de HEERE zangers aan, die de heilige Majesteit zouden prijzen, uitgaande voor de toegeruste troepen, en die zeiden: Loof de HEERE, want Zijn goedertierenheid is voor eeuwig!", "Ps 123:4": "Onze ziel is veel te zat van de spot van de weldenkenden, van de verachting van de hoogmoedigen.", "Amos 6:5": "Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "Jer 34:2": "Zo zegt de HEERE, de God van Israël: Ga heen en spreek tot Zedekia, de koning van Juda, en zeg tegen hem: Zo zegt de HEERE: Zie, Ik geef deze stad in de hand van de koning van Babel, en hij zal ze met vuur verbranden.", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "2 Sam 10:12": "Wees sterk, en laten wij sterk zijn voor ons volk, en voor de steden van onze God; de HEERE nu doet, wat goed is in Zijn ogen.", "Klaagl 5:15": "De vreugde van ons hart houdt op, onze dans is in treurigheid veranderd.", "Amos 1:13": "Zo zegt de HEERE: Om drie overtredingen van de kinderen van Ammon, en om vier zal Ik dat niet afwenden; omdat zij de zwangere vrouwen van Gilead hebben opengesneden, om hun grondgebied te vergroten.", "Jes 33:9": "Het land treurt, het kwijnt weg; de Libanon schaamt zich, hij verwelkt; Saron is geworden als een woestijn; zo zijn Basan en Karmel geschud.", "Ezech 3:15": "En ik kwam tot de weggevoerden te Tel-Abib, die aan de rivier Chebar woonden, en ik bleef daar zij woonden; ja, ik bleef daar verbaasd in het midden van hen zeven dagen.", "Nahum 3:3": "De ruiter steekt omhoog, zo het vlammende zwaard, als de bliksemende speer, en er zal een veelheid van verslagenen zijn, en een zware menigte dode lichamen; ja, er zal geen einde zijn aan de lichamen, men zal over hun lichamen struikelen;", "Jes 35:1-10": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos. Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God. Versterkt de slappe handen, en maakt de struikelende knieën vast.", "Ps 102:10-15": "Want ik eet as als brood, en vermeng mijn drank met tranen. Vanwege Uw verstoordheid en Uw grote toorn; want U hebt mij verheven, en mij weer neergeworpen. Mijn dagen zijn als een afgaande schaduw, en ik verdor als gras.", "Ps 84:2-11": "Hoe lieflijk zijn Uw woningen, o HEERE van de heerscharen! Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God. Zelfs vindt de mus een huis, en de zwaluw een nest voor zich, waar zij haar jongen legt, bij Uw altaren, HEERE van de heerscharen, mijn Koning, en mijn God!", "Jes 27:3": "Ik, de HEERE, behoed die, elk ogenblik zal Ik hem bevochtigen; opdat de vijand hem niet bezoekt, zal Ik hem bewaren, nacht en dag.", "Ps 2:6": "Ik heb Mijn Koning toch gezalfd over Sion, de berg van Mijn heiligheid.", "Ezra 8:21": "Toen riep ik daar een vasten uit bij de rivier Ahava, opdat wij ons zouden verootmoedigen voor het aangezicht van onze God, om van Hem te verzoeken een rechte weg, voor ons, en voor onze kinderen, en voor al onze have.", "Obadja 1:10-16": "Om het geweld, gepleegd tegen uw broeder Jakob, zal schaamte u bedekken; en u zult voor eeuwig worden uitgeroeid. Op de dag dat u tegenover hem stond, op de dag dat vreemden zijn leger gevangen wegvoerden, en buitenlanders zijn poorten binnentrokken, en over Jeruzalem het lot wierpen, was u ook als een van hen. U had niet moeten kijken naar de dag van uw broeder, de dag van zijn vervreemding; en u had zich niet moeten verblijden over de kinderen van Juda, op de dag van hun ondergang; en u had uw mond niet groot moeten maken, op de dag van de benauwdheid;", "Hos 9:4": "Zij zullen de Heere geen drankoffers doen van wijn, en die zouden Hem ook niet aangenaam zijn; hun offers zouden voor hen zijn als treurbrood; allen die daarvan zouden eten, zouden onrein worden; want hun brood zal voor henzelf zijn, het zal niet in het huis van de Heere komen.", "Klaagl 3:51": "Ain. Mijn oog doet mijn ziel moeite aan, vanwege al de dochters van mijn stad.", "Jes 52:1": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen.", "Jer 51:51": "U zou kunnen zeggen: Wij zijn beschaamd geworden, want wij hebben smaad gehoord, schaamte heeft ons gezicht bedekt; omdat vreemden over de heiligdommen van het huis van de HEERE gekomen zijn;", "1 Petr 2:5": "Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus.", "Ex 21:17-20": "Wie ook zijn vader of zijn moeder vervloekt, die zal zeker gedood worden. En wanneer mannen ruzie hebben, en de een slaat de ander met een steen of met een vuist, en hij sterft niet, maar moet het bed houden; als hij weer opstaat en op straat gaat met behulp van zijn stok, zal hij die hem sloeg, onschuldig zijn; alleen zal hij vergoeden wat de ander door verzuim verloren heeft, en hij zal hem volledig laten helen.", "Jes 48:20": "Ga uit van Babel, vlucht van de Chaldeeën, verkondig met de stem van het gejuich, doe zulks horen, breng het uit tot aan het einde van de aarde, zeg: De HEERE heeft Zijn knecht Jakob verlost!", "Ps 51:20": "Doe goed bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.", "1 Kron 15:16-22": "En David zei tegen de leiders van de Levieten, dat zij hun broeders, de zangers, moesten aanstellen met muziekinstrumenten, met luiten, en harpen, en cimbalen, zodat zij zich lieten horen, terwijl zij de stem verhieven met blijdschap. Zo stelden de Levieten Heman aan, de zoon van Joël, en uit zijn broeders Asaf, de zoon van Berechja; en uit de zonen van Merari, hun broeders, Ethan, de zoon van Kusaja; En met hen hun broeders van de tweede orde: Zecharja, Ben en Jaaziel, en Semiramoth, en Jehiel, en Unni, Eliab, en Benaja, en Maaseja, en Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, de poortwachters.", "Ps 129:5": "Laat hen beschaamd worden en achteruitgedreven, allen die Sion haten.", "Jes 13:16": "Ook zullen hun kinderen voor hun ogen verpletterd worden; hun huizen zullen geplunderd, en hun vrouwen geschonden worden.", "Kol 1:24": "die mij nu verblijd in mijn lijden voor u, en aanvult in mijn vlees wat nog ontbreekt aan de verdrukkingen van Christus, voor Zijn lichaam, dat is de Gemeente;", "Jer 5:17": "En het zal uw oogst en uw brood opeten, dat uw zonen en uw dochters zouden eten; het zal uw schapen en uw runderen opeten; het zal uw wijnstok en uw vijgenboom opeten; uw vaste steden, waarop u vertrouwt, zal het arm maken door het zwaard.", "Jer 50:1": "Het woord dat de HEERE gesproken heeft tegen Babel, tegen het land van de Chaldeeën, door de dienst van de profeet Jeremia.", "Jes 46:1": "Bel is gekromd, Nebo wordt neergebogen, hun afgoden zijn geworden voor de dieren en voor de beesten; uw opgeladen pakken zijn een last voor de vermoeide beesten.", "Jes 16:9": "Daarom beween ik, met de wening over Jaezer, de wijnstok van Sibma; ik maak u doornat met mijn tranen, o Hesbon en Eleale! Want het vreugdegeroep over uw zomervruchten en over uw oogst is verstomd;", "Jes 62:11": "Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Neh 5:1-18": "Maar het geroep van het volk en van hun vrouwen was groot, tegen hun broeders, de Joden. Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven. Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.", "Ps 53:7": "Och, dat Israëls verlossingen uit Sion kwamen! Als God de gevangenen van Zijn volk zal doen terugkeren, dan zal Jakob zich verheugen, Israël zal verblijd zijn.", "2 Kor 8:1": "Verder maken wij u bekend, broeders, de genade van God, die in de gemeenten van Macedonië gegeven is.", "Jes 30:29": "Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.", "Ef 5:23-27": "want de man is het hoofd van de vrouw, zoals ook Christus het Hoofd van de Gemeente is; en Hij is de Behouder van het lichaam. Daarom, zoals de Gemeente aan Christus onderdanig is, zo ook de vrouwen aan hun eigen mannen in alles. Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,", "Dan 6:11": "Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Jer 49:7-22": "Tegen Edom zegt de HEERE van de heerscharen zo: Is er dan geen wijsheid meer te Theman? Is de raad vergaan van de verstandigen? Is hun wijsheid onnut geworden? Vlucht, keer u om, woon in diepe plaatsen, inwoners van Dedan! want Ik heb Ezaus verderf over hem gebracht, de tijd waarop Ik hem bezocht heb. Als er wijnoogsters tot u gekomen waren, zouden zij niet een nalezing hebben overgelaten? Als er dieven bij nacht gekomen waren, zouden zij niet verwoest hebben zoveel hun genoeg was?", "1 Kron 22:6": "Toen riep hij zijn zoon Salomo, en gebood hem voor de HEERE, de God van Israël, een huis te bouwen.", "Richt 11:34": "Toen Jeftha nu bij Mizpa bij zijn huis kwam, zie, zo kwam zijn dochter hem tegemoet, met trommels en met reidansen. Zij was zijn enige kind; hij had verder geen zoon of dochter.", "Ps 68:33-36": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.", "Jes 46:2": "Samen zijn zij neergebogen, zij zijn gekromd, zij hebben de last niet kunnen redden, maar zijzelf zijn in de gevangenis gegaan.", "Jes 51:11": "Zo zullen de vrijgekochte van de HEERE terugkeren, en met gejuich naar Sion komen; en eeuwige blijdschap zal op hun hoofd zijn; vreugde en blijdschap zullen zij aangrijpen, treuring en zuchten zullen wegvluchten.", "Jes 4:2-6": "Op die dag zal de SPRUIT van de HEERE tot sieraad en heerlijkheid zijn, en de vrucht van de aarde tot voortreffelijkheid en tot versiering voor hen die ontkomen zullen in Israël. En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem; wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Neh 1:4": "En het gebeurde, toen ik deze woorden hoorde, dat ik neerzat, en huilde, en rouw bedreef, enkele dagen; en ik vastte en bad voor het aangezicht van de God van de hemel.", "1 Sam 15:2": "Zo zegt de HEERE van de heerscharen: Ik heb bezocht wat Amalek aan Israël gedaan heeft, hoe hij zich tegen hem gesteld heeft op de weg, toen hij uit Egypte opkwam.", "Gen 31:27": "Waarom bent u heimelijk gevlucht, en hebt u zich aan mij ontstolen? En hebt u het mij niet verteld, zodat ik u had kunnen wegzenden met vreugde, en met gezangen, met tamboerijn en met harp?", "Jer 5:16": "Zijn pijlkoker is als een open graf; zij zijn allemaal helden.", "Ps 46:9": "Komt, aanschouwt de daden van de HEERE, Die verwoestingen op aarde aanricht.", "Ps 98:1-8": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven. De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen. Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Jes 60:14": "Ook zullen, zich buigend, tot u komen de kinderen van hen die u onderdrukt hebben, en allen die u gelasterd hebben zullen zich neerbuigen aan de zolen van uw voeten; en zij zullen u noemen: de stad van de HEERE, het Sion van de Heilige van Israël.", "Openb 14:8-11": "En er is een andere engel gevolgd, die zei: Zij is gevallen, zij is gevallen, Babylon, die grote stad, omdat zij uit de wijn van de toorn van haar hoererij alle volken heeft laten drinken. En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "Ps 149:6-9": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand, om wraak te doen over de heidenvolken, en bestraffingen over de volken, om hun koningen te binden met ketenen, en hun aanzienlijken met ijzeren boeien,", "Jes 13:3-5": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid. Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger. Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.", "Hos 10:14": "Daarom zal er een groot rumoer ontstaan onder uw volken, en al uw vestingen zullen verwoest worden, zoals Salman Beth-arbel verwoestte op de dag van de strijd; de moeder werd verpletterd met de zonen.", "Ps 105:2": "Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen.", "Jes 9:18-20": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien. Als hij ter rechterhand snijdt, zal hij toch hongeren, en als hij ter linkerhand eet, zal hij toch niet verzadigd worden; ieder zal het vlees van zijn eigen arm eten; Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ps 81:2-4": "Zingt vrolijk voor God, onze Sterkte; juicht voor de God van Jakob. Heft een psalm op, en geeft de trommel; de liefelijke harp met de luit. Blaast de bazuin in de nieuwe maan, op de bestemde tijd, op onze feestdag.", "Jes 62:1-7": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt. En de heidenen zullen uw gerechtigheid zien, en alle koningen uw heerlijkheid; en u zult met een nieuwe naam genoemd worden, die de mond van de HEERE nauwkeurig noemen zal. En u zult een sierlijke kroon zijn in de hand van de HEERE, en een koninklijke hoed in de hand van uw God.", "Jes 49:14-17": "Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten. Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.", "Jer 46:13-26": "Het woord, dat de HEERE tot de profeet Jeremia sprak, over de aankomst van Nebukadrezar, de koning van Babel, om Egypteland te slaan. Verkondigt in Egypte, en doet het horen te Migdol; doet het ook horen te Nof en Tachpanhes; zegt: Stelt u op, en maakt u gereed, want het zwaard heeft verslonden, wat rondom u is. Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef.", "Openb 19:17": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God;", "Jes 24:8": "De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houdt op, de vreugde van de harp rust.", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Jer 31:6": "Want er zal een dag zijn, waarop de wachters op het gebergte van Efraïm zullen roepen: Maak u op, en laat ons opgaan naar Sion, tot de HEERE, onze God!", "Jer 31:13": "Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis.", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "Jes 66:14": "En u zult het zien, en uw hart zal vrolijk zijn, en uw beenderen zullen groeien als het tedere gras; dan zal de hand van de HEERE bekend worden aan Zijn knechten, en Hij zal boos worden op Zijn vijanden.", "Jer 27:1-11": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia: Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals. En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.", "Ex 15:20": "En Mirjam, de profetes, de zuster van Aäron, nam een trommel in haar hand; en alle vrouwen gingen achter haar aan, met trommels en met reidansen.", "Jer 14:17": "Daarom zult u dit woord tegen hen zeggen: Mijn ogen zullen van tranen neerdalen, nacht en dag, en niet ophouden; want de jonkvrouw, de dochter van Mijn volk, is gebroken met een grote breuk, een plaag die zeer smartelijk is.", "Ps 79:8-12": "Denk ons de vorige misdaden niet aan; haast U, laat Uw barmhartigheden ons tegemoetkomen; want wij zijn zeer zwak geworden. Help ons, o God van ons heil! Vanwege de eer van Uw Naam; en red ons, en doe verzoening over onze zonden, om Uw Naam. Waarom zouden de heidenen zeggen: Waar is hun God? Laat de wraak van het vergoten bloed van Uw knechten onder de heidenen voor onze ogen bekend worden.", "Jer 42:12": "En Ik zal u barmhartigheid geven, dat hij zich over u erbarmt, en u weer in uw land brengt.", "Klaagl 2:15": "Samech. Allen die voorbijgaan, klappen met de handen over u, zij fluiten en schudden hun hoofd over de dochter van Jeruzalem, en zeggen: Is dit die stad, waarvan men zei, dat zij volkomen was van schoonheid, een vreugde van de hele aarde?", "Openb 1:20": "de verborgenheid van de zeven sterren die u gezien hebt in Mijn rechterhand, en de zeven gouden kandelaren. De zeven sterren zijn de engelen van de zeven gemeenten; en de zeven kandelaren die u gezien hebt, zijn de zeven gemeenten.", "Jes 40:9-11": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God! Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht. Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen,
