<style>

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }

  @keyframes flits { 0% { background: #f0e2bd; } 100% { background: var(--bg-soft); } }
  .vnr { color: #b3a184; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }

","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm[1] van David, voor de koorleider[2].","2":"Toen de profeet Nathan bij hem gekomen was, nadat hij bij Bathseba was ingegaan.","3":"Wees mij genadig, o God! naar Uw goedertierenheid; delg mijn overtreding uit, naar de grootheid van Uw barmhartigheden.","4":"Was mij goed van mijn ongerechtigheid, en reinig mij van mijn zonde.","5":"Want ik ken mijn overtredingen, en mijn zonde staat mij steeds voor ogen.","6":"Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.","7":"Zie, ik ben in ongerechtigheid geboren, en in zonde heeft mijn moeder mij ontvangen.","8":"Zie, U hebt lust tot waarheid in het binnenste, en in het verborgene maakt U mij wijsheid bekend.","9":"Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw.","10":"Doe mij vreugde en blijdschap horen; laat de beenderen zich verheugen die U verbrijzeld hebt.","11":"Verberg Uw aangezicht van mijn zonden, en delg al mijn ongerechtigheden uit.","12":"Schep mij een rein hart, o God! en vernieuw in mijn binnenste een vaste geest.","13":"Verwerp mij niet van Uw aangezicht, en neem Uw Heilige Geest niet van mij.","14":"Geef mij de vreugde van het heil weer; en de vrijmoedige geest ondersteunt mij.","15":"Zo zal ik de overtreders Uw wegen leren; en de zondaars zullen zich tot U bekeren.","16":"Verlos mij van bloedschuld, o God, U, God van mijn heil! zo zal mijn tong Uw gerechtigheid vrolijk roemen.","17":"Heere, open mijn lippen, zo zal mijn mond Uw lof verkondigen.","18":"Want U hebt geen lust tot offerande, anders zou ik ze geven; in brandoffers hebt U geen behagen.","19":"De offeranden van God zijn een gebroken geest; een gebroken en verslagen hart zult U, o God! niet verachten.","20":"Doe goed bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.","21":"Dan zult U lust hebben aan de offeranden van de gerechtigheid, aan brandoffer en een offer dat helemaal verteerd wordt; dan zullen zij jonge stieren offeren op Uw altaar."},"SV":{"1":"Een psalm van David, voor den opperzangmeester.","2":"Toen de profeet Nathan tot hem was gekomen, nadat hij tot Bathseba was ingegaan.","3":"Wees mij genadig, o God! naar Uw goedertierenheid; delg mijn overtreding uit, naar de grootheid Uwer barmhartigheden.","4":"Was mij wel van mijn ongerechtigheid, en reinig mij van mijn zonde.","5":"Want ik ken mijn overtredingen, en mijn zonde is steeds voor mij.","6":"Tegen U, U alleen, heb ik gezondigd, en gedaan, dat kwaad is in Uw ogen; opdat Gij rechtvaardig zijt in Uw spreken, *en* rein zijt in Uw richten.","7":"Zie, ik ben in ongerechtigheid geboren, en in zonde heeft mij mijn moeder ontvangen.","8":"Zie, Gij hebt lust tot waarheid in het binnenste, en in het verborgene maakt Gij mij wijsheid bekend.","9":"Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw.","10":"Doe mij vreugde en blijdschap horen; dat de beenderen zich verheugen, *die* Gij verbrijzeld hebt.","11":"Verberg Uw aangezicht van mijn zonden, en delg uit al mijn ongerechtigheden.","12":"Schep mij een rein hart, o God! en vernieuw in het binnenste van mij een vasten geest.","13":"Verwerp mij niet van Uw aangezicht, en neem Uw Heiligen Geest niet van mij.","14":"Geef mij weder de vreugde Uws heils; en de vrijmoedige geest ondersteune mij.","15":"Zo zal ik den overtreders Uw wegen leren; en de zondaars zullen zich tot U bekeren.","16":"Verlos mij van bloedschulden, o God, Gij, God mijns heils! zo zal mijn tong Uw gerechtigheid vrolijk roemen.","17":"Heere, open mijn lippen, zo zal mijn mond Uw lof verkondigen.","18":"Want Gij hebt geen lust tot offerande, anders zou ik ze geven; in brandofferen hebt Gij geen behagen.","19":"De offeranden Gods zijn een gebroken geest; een gebroken en verslagen hart zult Gij, o God! niet verachten.","20":"Doe wel bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.","21":"Dan zult Gij lust hebben aan de offeranden der gerechtigheid, aan brandoffer en een offer, dat gans verteerd wordt; dan zullen zij varren offeren op Uw altaar."},"KJV":{"1":"[[To the chief Musician, A Psalm of David, when Nathan the prophet came unto him, after he had gone in to Bathsheba.]] Have mercy upon me, O God, according to thy lovingkindness: according unto the multitude of thy tender mercies blot out my transgressions.","2":"[[To the chief Musician, A Psalm of David, when Nathan the prophet came unto him, after he had gone in to Bathsheba.]] Have mercy upon me, O God, according to thy lovingkindness: according unto the multitude of thy tender mercies blot out my transgressions.","3":"[[To the chief Musician, A Psalm of David, when Nathan the prophet came unto him, after he had gone in to Bathsheba.]] Have mercy upon me, O God, according to thy lovingkindness: according unto the multitude of thy tender mercies blot out my transgressions.","4":"Wash me throughly from mine iniquity, and cleanse me from my sin.","5":"For I acknowledge my transgressions: and my sin *is* ever","6":"Against thee, thee only, have I sinned, and done *this* evil in thy sight: that thou mightest be justified when thou speakest, *and* be clear when thou judgest.","7":"Behold, I was shapen in iniquity; and in sin did my mother conceive","8":"Behold, thou desirest truth in the inward parts: and in the hidden *part* thou shalt make me to know wisdom.","9":"Purge me with hyssop, and I shall be clean: wash me, and I shall be whiter than snow.","10":"Make me to hear joy and gladness; *that* the bones *which* thou hast broken may rejoice.","11":"Hide thy face from my sins, and blot out all mine iniquities.","12":"Create in me a clean heart, O God; and renew a right spirit within","13":"Cast me not away from thy presence; and take not thy holy spirit","14":"Restore unto me the joy of thy salvation; and uphold me *with thy* free spirit.","15":"*Then* will I teach transgressors thy ways; and sinners shall be converted","16":"Deliver me from bloodguiltiness, O God, thou God of my salvation: *and* my tongue shall sing aloud of thy righteousness.","17":"O Lord, open thou my lips; and my mouth shall shew forth thy praise.","18":"For thou desirest not sacrifice; else would I give *it*: thou delightest not in burnt offering.","19":"The sacrifices of God *are* a broken spirit: a broken and a contrite heart, O God, thou wilt not despise.","20":"Do good in thy good pleasure unto Zion: build thou the walls of Jerusalem.","21":"Then shalt thou be pleased with the sacrifices of righteousness, with burnt offering and whole burnt offering: then shall they offer bullocks upon thine altar."}},"tsk":{"3":[{"kopje":"naar","refs":["2 Sam 11:2-27"]},{"kopje":"o God","refs":["Ps 25:6","Ps 25:7","Ps 109:21","Ps 119:124","Ex 34:6","Ex 34:7","Num 14:18","Num 14:19","Dan 9:9","Dan 9:18","Micha 7:18","Micha 7:19","Rom 5:20","Rom 5:21","Ef 1:6-8","Ef 2:4-7"]},{"kopje":"grootheid","refs":["Ps 5:8","Ps 69:14","Ps 69:17","Ps 106:7","Ps 106:45","Jes 63:7","Jes 63:15","Klaagl 3:32"]},{"kopje":"barmhartigheden","refs":["Ps 40:12","Ps 77:10","Ps 145:9"]},{"kopje":"delg uit","refs":["Ps 51:11","Neh 4:5","Jes 43:25","Jes 44:22","Jer 18:23","Hand 3:19","Kol 2:14"]}],"4":[{"kopje":"Was","r \" data-code=\"H2889\">clean</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> O <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> and <span class=\"wl wl-kjv\" data-code=\"H2318\">renew</span> a <span class=\"wl wl-kjv\" data-code=\"H3559\">right</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> within","13":"Cast me not <span class=\"wl wl-kjv\" data-code=\"H7993\">away</span> from thy <span class=\"wl wl-kjv\" data-code=\"H6440\">presence;</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> not thy <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> spirit","14":"<span class=\"wl wl-kjv\" data-code=\"H7725\">Restore</span> unto me the <span class=\"wl wl-kjv\" data-code=\"H8342\">joy</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3468\">salvation;</span> and <span class=\"wl wl-kjv\" data-code=\"H5564\">uphold</span> me with thy <span class=\"wl wl-kjv\" data-code=\"H5081\">free</span> spirit.","15":"Then will I <span class=\"wl wl-kjv\" data-code=\"H3925\">teach</span> <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressors</span> thy <span class=\"wl wl-kjv\" data-code=\"H1870\">ways;</span> and <span class=\"wl wl-kjv\" data-code=\"H2400\">sinners</span> shall be converted","16":"<span class=\"wl wl-kjv\" data-code=\"H5337\">Deliver</span> me from <span class=\"wl wl-kjv\" data-code=\"H1818\">bloodguiltiness,</span> O <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> thou <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H8668\">salvation:</span> and my <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> shall sing <span class=\"wl wl-kjv\" data-code=\"H7442\">aloud</span> of thy righteousness.","17":"O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> thou my <span class=\"wl wl-kjv\" data-code=\"H8193\">lips;</span> and my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> shall shew <span class=\"wl wl-kjv\" data-code=\"H5046\">forth</span> thy praise.","18":"For thou <span class=\"wl wl-kjv\" data-code=\"H2654\">desirest</span> not <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice;</span> else would I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it: thou <span class=\"wl wl-kjv\" data-code=\"H7521\">delightest</span> not in burnt offering.","19":"The <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> are a <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit:</span> a <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> and a <span class=\"wl wl-kjv\" data-code=\"H1794\">contrite</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> O <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> thou wilt not despise.","20":"Do <span class=\"wl wl-kjv\" data-code=\"H3190\">good</span> in thy good <span class=\"wl wl-kjv\" data-code=\"H7522\">pleasure</span> unto <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion:</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> thou the <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> of Jerusalem.","21":"Then shalt thou be <span class=\"wl wl-kjv\" data-code=\"H2654\">pleased</span> with the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> of <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness,</span> with burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> and <span class=\"wl wl-kjv\" data-code=\"H3632\">whole</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering:</span> then shall they <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullocks</span> upon thine altar."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"opperzangmeester","tekst":"Zie Psa 4:1 . Het is opmerkelijk dat, gelijk het Gode geliefd heeft Davids val tot menigvuldig onderwijs zijns volks in de Heilige Schrift te doen beschrijven, David desgelijks door Gods Geest gedreven zijnde, dezen psalm tot gelijk einde in Gods huis heeft doen zingen en spelen."},{"catchword":"ingegaan","tekst":"Zie Gen 6:4 ."}],"2":[{"catchword":"opperzangmeester","tekst":"Zie Psa 4:1 . Het is opmerkelijk dat, gelijk het Gode geliefd heeft Davids val tot menigvuldig onderwijs zijns volks in de Heilige Schrift te doen beschrijven, David desgelijks door Gods Geest gedreven zijnde, dezen psalm tot gelijk einde in Gods huis heeft doen zingen en spelen."},{"catchword":"ingegaan","tekst":"Zie Gen 6:4 ."}],"3":[{"catchword":"opperzangmeester","tekst":"Zie Psa 4:1 . Het is opmerkelijk dat, gelijk het Gode geliefd heeft Davids val tot menigvuldig onderwijs zijns volks in de Heilige Schrift te doen beschrijven, David desgelijks door Gods Geest gedreven zijnde, dezen psalm tot gelijk einde in Gods huis heeft doen zingen en spelen."},{"catchword":"ingegaan","tekst":"Zie Gen 6:4 ."}],"4":[{"catchword":"delg mijn","tekst":"Of, wis uit, doe uit. Verg. Isa 43:25 , en Isa 44:22 ; Col 2:14 , alzo onder vs.11."},{"catchword":"grootheid","tekst":"Of, menigte."}],"5":[{"catchword":"wel van","tekst":"Hebr. vermenigvuldig, was mij, of vermenigvuldig, maak veel mij te wassen, of was mij veel, of veelvoudiglijk, wel terdege, over en weer over. Aldus spreekt David uit overdenking en gevoel van de grootheid en veelheid zijner zonden. De manier van spreken is wel genomen van het uiterlijk en ceremoniëel wassen en reinigen, [waarvan Lev 11:25 , Lev 11:32 , en Lev 14:8-9 ; Num 19:19-20 , enz., ook Exo 19:10 ,] maar ziet op de betekenende zaak, te weten de geestelijke afwassing en reiniging van zonden, door het bloed van den Messias. Zie 1Co 6:11 ; 1Jo 1:7 , en Rev 7:14 . Verg. onder vs.9."}],"6":[{"catchword":"ken mijn","tekst":"Of, ik weet, mijne overtredingen zijn mij bekend."}],"7":[{"catchword":"alleen,","tekst":"Te weten, voorzoveel ik, gepoogd hebbende mijne zonden voor mensen te verbergen, U nochtans, door Nathans aanzeggingen, bevonden en in mijne conscientie gevoeld heb een getuige en Rechter daarvan te zijn; Gij die ook alleen mijne zonde kondt straffen en vergeven."},{"catchword":"kwaad","tekst":"Dat is, dat U mishaagt."},{"catchword":"rechtvaardig","tekst":"Dat is, rechtvaardig bevonden, gehouden en geoordeeld wordt. Door deze bekentenis geeft David God de eer, dat zijne woorden en oordelen, hem door Nathan aangediend, rechtvaardig en rein zijn. Anders, zodat Gij rechtvaardig zijt, enz."}],"8":[{"catchword":"ongerechtigheid","tekst":"Versta, de erfzonde, aangeboren verdorvenheid, het vlees en de inwonende zonde. Zie Joh 3:6 ; Rom 7:17 ."},{"catchword":"geboren","tekst":"Alzo wordt het Hebr. woord gebruikt Job 15:7 ; Pro 8:24-25 ."},{"catchword":"ontvangen","tekst":"Hebr. verwarmd. Of, is van mij verwarmd geworden; te weten, mij ontvangende en dragende. Aangaande het Hebr. woord, verg. Gen 30:38-39 , Gen 30:41 ."}],"9":[{"catchword":"waarheid","tekst":"Dat is, ongeveinsdheid, onbedriegelijke oprechtheid, gesteld tegen huichelarij en geveinsdheid, waaraan zich David te dezer tijd had schuldig gemaakt."},{"catchword":"binnenste,","tekst":"Of, binnenste, inwendige delen of partijen; te weten des mensen, dat is, in het hart. Verg. Rom 3:29 , en Rom 7:22 ; 2Co 4:16 ; 1Pe 3:4 ; idem Luk 11:39 , Luk 11:40 . Het Hebr. woord wordt alleen hier en Job 38:36 gevonden, komende van een woord, dat bestrijken, bedekken, overtrekken [gelijk muren met kalk, cement, leem, enz.] betekent, en wordt van sommigen overgezet, nieren; [als met vet overdekt zijnde] waardoor de bewegingen des mensen dikwijls verstaan worden. Doch van anderen, praecordia; dat is, hartedeksel, of borstbeen, dat het hart overdekt, waarin God de wijsheid gesteld heeft; Job 38:36 ."},{"catchword":"verborgene","tekst":"Of, besloten; te weten het hart. Hij schijnt te willen zeggen dat God hem geleerd heeft, niet alleen van buiten zijn licht te laten schijnen, maar ook inzonderheid van binnene en in het verborgen heilig te zijn. Sommigen duiden het op de wijsheid Gods in verborgenheid, 1Co 2:7 , enz., in het Evangelie en door zijnen Geest geopenbaard."}],"10":[{"catchword":"hysop","tekst":"Dat is, door de besprenging met het bloed van den Messias, afgebeeld door de ceremoniën, waarvan te zien is. Lev 14:4-7 ; Num 19:6 , Num 19:9 , zie de aantekening aldaar; en van hysop; 1Ki 4:33 ."}],"11":[{"catchword":"horen;","tekst":"Mits mij verzekerende van de vergeving mijner zonden, inwendiglijk door uw Heiligen Geest en uitwendiglijk door den dienst uwer profeten."},{"catchword":"beenderen","tekst":"Dat is, dat ik mij verheuge, wien Gij door de boodschap uwer gramschap zulke smart hebt aangedaan, gelijk iemand lijdt, dien de beenderen gebroken en verbrijzeld of vermorzeld worden, of wiens kracht, vermogen en lust als versmolten is. Zie Job 2:5 , en Job 30:17 , en Job 33:19 ; Psa 35:10 , en Psa 38:4 , enz."}],"12":[{"catchword":"Verberg","tekst":"Dat is, reken ze mij niet toe. Verg. Psa 90:8 , en Psa 109:14-15 ; Jer 16:17 ."},{"catchword":"delg","tekst":"Gelijk boven, vs.3."}],"13":[{"catchword":"Schep","tekst":"Dat is, werk door uw Heilige Geest krachtiglijk in mij de reiniging mijns harten. Alzo wordt het woord scheppen elders in deze materie gebruikt. Zie Isa 41:20 , en Isa 57:19 ; Eph 2:10 ; en Eph 4:24 , enz."},{"catchword":"vasten","tekst":"Dat is, vernieuwd door een vast geloof, een vast en bestendig opzet in mijne ziel, tot de gehoorzaamheid uwer geboden, opdat ik zo niet meer slibber of val, gelijk nu geschied is. Verg. Psa 57:8 , en Psa 112:7 . Verg. wijders van hart en geest, Eze 11:19 , met de aantekening; en van den mensen binneste, Job 20:14 ."}],"14":[{"catchword":"Verwerp","tekst":"Dat een gevolg is van Gods groten toorn. Zie Gen 4:14 , Gen 4:16 ; 2Ki 24:20 ; Jer 7:15 , en Jer 52:3 ."},{"catchword":"Heiligen Geest","tekst":"Hebr. den Geest uwer heiligheid; dat is, uw Heilige Geest, als, berg mijner heiligheid, Psa 2:6 ; paleis, of tempel zijner heiligheid, Psa 11:4 , enz. Alzo hebben de Heere Christus en zijne apostelen doorgaans den derden persoon der Heilige Drievuldigheid genoemd den Heilige Geest."}],"15":[{"catchword":"vreugde","tekst":"De vreugde, die ik tevoren gevoeld en gehad heb, over de zaligheid, die Gij mij bereid hebt en geven zult; waarvan het gevoel door mijn val in mij verduisterd is."},{"catchword":"vrijmoedige","tekst":"Of, ondersteun mij [met] den vrijwilligen, of vrijmoedigen, goedwilligen, edelen, weldadigen geest; waardoor ik U met kinderlijke vrijmoedigheid mag aanroepen en met blijmoedigheid en bereidwilligheid dienen. Verg. dit met den Geest van het kindschap, waarvan Rom 8:15-16 . Anders, de Geest der goedwilligheid, vrijmoedigheid."}],"16":[{"catchword":"Zo zal","tekst":"Door mijn voorbeeld zal ik hen onderwijzen en troosten, en door dat middel [ziende dat er genade bij U is voor een armen boetvaardigen zondaar] zullen zij zich bekeren. Van des Heeren wegen, zie Gen 18:19 , en Psa 25:4 , Psa 25:10 ; Hos 14:10 , enz."}],"17":[{"catchword":"bloedschulden,","tekst":"Hebr. bloeden; dat is de schuld van doodslag, dien ik aan Uria en anderen, die om zijnenetwil mede zijn omgekomen bedreven heb, waardoor ik de straf des doods zelf verdiend heb. Zie Gen 4:10 , en Gen 9:5-6 ."},{"catchword":"gerechtigheid","tekst":"Die Gij bewijst in het genadig houden en volbrengen uwer beloften. Anders gebedsgewijze: laat mijne tong, enz."}],"18":[{"catchword":"open","tekst":"Leg in mijnen mond een nieuw lied. Zie Psa 40:4 . Hij wil zeggen dat zijn mond door de droefenis over zijne zonden en betrachting zijner onwaardigheid, als gesloten was, en door Gods genade en troost des Heiligen Geestes moest geopend worden."}],"19":[{"catchword":"geen lust","tekst":"Te weten, zonder voor en medegaande boetvaardigheid. Zie den voorgaanden Psalm, Psa 50 en onder vs.21; Rom 12:1 ; idem Hos 6:6 . Sommigen verstaan het van den staat des Nieuwe (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
