etuigenissen onderhouden, en de inzettingen die Hij hun gegeven had. O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.", "Ps 27:10": "Want mijn vader en mijn moeder hebben mij verlaten, maar de HEERE zal mij aannemen.", "Luk 3:4-6": "zoals geschreven is in het boek van de woorden van Jesaja, de profeet, die zei: De stem van iemand die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht! Elk dal zal gevuld worden, en elke berg en heuvel zal verlaagd worden, en de kromme wegen zullen tot een rechte weg worden, en de oneffen tot effen wegen. En alle vlees zal de zaligheid van God zien.", "Lev 26:28": "Dan zal Ik ook in verhitte woede tegen u in gaan, en Ik zal u ook zevenvoudig over uw zonden tuchtigen.", "Richt 2:1-3": "En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid. En wat u aangaat, u zult geen verbond maken met de inwoners van dit land; hun altaren zult u afbreken. Maar u bent Mijn stem niet gehoorzaam geweest; waarom hebt u dit gedaan? Daarom heb Ik ook gezegd: Ik zal hen voor uw aangezicht niet verdrijven; maar zij zullen u aan de zijden zijn, en hun goden zullen u tot een strik zijn.", "Klaagl 1:2": "Beth. Zij weent steeds 's nachts, en haar tranen lopen over haar kaken; zij heeft geen trooster onder al haar liefhebbers; al haar vrienden hebben trouweloos met haar gehandeld, zij zijn haar tot vijanden geworden.", "Deut 4:29-31": "Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel. Wanneer u in angst zult zijn, en al deze dingen u zullen treffen, in de laatste dagen, dan zult u terugkeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn. Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Ps 140:7": "Ik heb tegen de HEERE gezegd: U bent mijn God; neem ter ore, HEERE, de stem van mijn smekingen.", "Ps 80:4-6": "O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden. HEERE, God van de heerscharen! Hoe lang zult U roken tegen het gebed van Uw volk? U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.", "Ps 94:22": "Doch de HEERE is mij geweest tot een Hoog Vertrek, en mijn God tot een Steenrots van mijn toevlucht.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "1 Kor 1:31": "Opdat het zij, zoals geschreven is: Wie roemt, laat hij roemen in de Heere.", "Hand 4:29": "En nu dan, Heere, zie op hun dreigingen, en geef Uw dienstknechten met alle vrijmoedigheid Uw woord te spreken;", "Matt 27:9": "Toen is vervuld wat gesproken is door de profeet Jeremia, die zei: En zij hebben de dertig zilverstukken genomen, de prijs van Hem Die gewaardeerd was, op wie de kinderen van Israël een waarde gesteld hadden;", "Ps 31:15": "Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God.", "Deut 11:9": "En opdat u de dagen verlengt in het land, dat de HEERE aan uw vaderen gezworen heeft, aan hen en aan hun nageslacht te geven; een land, vloeiend van melk en honing.", "Ps 18:29": "Want U doet mijn lamp lichten; de HEERE, mijn God, doet mijn duisternis opklaren.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Ps 119:57": "Cheth. De HEERE is mijn deel, ik heb gezegd, dat ik Uw woorden zal bewaren.", "Ps 86:17": "Doe aan mij een teken ten goede, opdat mijn haters het zien, en beschaamd worden, omdat Gij, HEERE, mij geholpen en mij getroost hebt.", "Luk 20:42": "En David zelf zegt in het boek van de Psalmen: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand,", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "Ps 86:2": "Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt.", "Klaagl 1:5": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander.", "Mal 1:2": "Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad,", "Ps 108:11-14": "Wie zal mij voeren in een vaste stad? Wie zal mij leiden tot in Edom? Zult U het niet zijn, o God! Die ons verstoten had, en Die niet uittrok, o God! Met onze legers? Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Hebr 13:14": "Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige.", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Rom 1:17": "Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.", "Ex 20:12-17": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "Luk 9:30": "En zie, twee mannen spraken met Hem; dat waren Mozes en Elia,", "Ps 31:16": "Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers.", "Ps 71:14": "Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.", "Gen 44:29": "Als u nu deze ook van mijn gezicht wegneemt, en hem een ongeluk overkomt, zult u mijn grijze haren met verdriet naar het graf doen afdalen!", "Klaagl 2:18": "Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op!", "Job 36:15": "Hij zal de ellendige in zijn ellende bevrijden, en in de onderdrukking zal Hij voor hun oor openbaren.", "Jes 63:16": "U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.", "Num 24:10": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend!", "Ps 56:2-14": "Wees mij genadig, o God! Want de mens zoekt mij op te slokken; de hele dag dringt de bestrijder mij. Mijn verspieders zoeken mij de hele dag op te slokken; want ik heb veel bestrijders, o Allerhoogste! Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "1 Kor 10:26": "want de aarde is van de Heere, en al wat zij bevat.", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Ps 43:1-5": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht. Want U bent de God van mijn sterkte; waarom verstoot U mij dan? Waarom ga ik steeds in het zwart, vanwege de onderdrukking van de vijand? Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "Gen 46:26": "Al de zielen die met Jakob naar Egypte kwamen, uit zijn heup voortgekomen, behalve de vrouwen van de zonen van Jakob, waren allen zesenzestig zielen.", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Rom 9:28": "Want Hij voltooit een zaak en snijdt haar af in rechtvaardigheid; want de Heere zal een afgesneden zaak doen op de aarde.", "Job 14:5-12": "Omdat zijn dagen bepaald zijn, het aantal van zijn maanden bij U bekend is, en U zijn grenzen gesteld hebt, die hij niet zal overschrijden; Wend U van hem af, zodat hij rust heeft, totdat hij als een dagloner een welgevallen heeft aan zijn dag. Want voor een boom is er, als hij wordt omgehakt, nog verwachting dat hij opnieuw zal uitlopen, en dat zijn scheut niet zal ophouden.", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Mark 7:7": "Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen;", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Ps 91:9": "Want U, HEERE, bent mijn Toevlucht! De Allerhoogste hebt u gesteld tot uw Vertrek;", "Joh 6:37": "Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.", "Jona 1:14": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd.", "Pred 9:4-6": "Want voor hem die zich bij alle levenden gevoegd heeft, is er hoop; want een levende hond is beter dan een dode leeuw. Want de levenden weten dat zij zullen sterven, maar de doden weten helemaal niets; zij hebben ook geen loon meer, maar hun gedachtenis is vergeten. Ook zijn hun liefde, hun haat en hun jaloezie al vergaan; en zij hebben geen deel meer in deze wereld, in alles wat er onder de zon gebeurt.", "Matt 12:17-21": "Opdat vervuld zou worden wat gesproken is door de profeet Jesaja, die zei: Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen. Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen.", "Hos 6:6": "Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "Matt 8:25": "En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan!", "Klaagl 3:48-50": "Pe. Met waterbeken loopt mijn oog neer, vanwege de breuk van de dochter van mijn volk. Ain. Mijn oog vliet, en kan niet ophouden, omdat er geen rust is; Ain. Totdat de HEERE van de hemel neerkijkt, en het ziet.", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Matt 22:38": "Dit is het eerste en het grootste gebod.", "Gen 24:40": "En hij zei tegen mij: De HEERE, voor Wiens aangezicht ik gewandeld heb, zal Zijn Engel met u zenden, en Hij zal uw weg voorspoedig maken, zodat u voor mijn zoon een vrouw neemt, uit mijn geslacht en uit het huis van mijn vader.", "Deut 12:30": "Wacht u ervoor dat u niet verstrikt raakt door hen te volgen, nadat zij voor uw aangezicht zullen verdelgd zijn; en dat u niet vraagt naar hun goden, en zegt: Zoals deze volken hun goden gediend hebben, zo zal ik ook doen.", "Rom 9:33": "zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "Ps 34:19": "Koph. De HEERE is nabij de gebrokenen van hart, en Hij behoudt de verslagenen van geest.", "2 Kor 3:13": "en doen niet zoals Mozes, die een sluier op zijn gezicht legde, opdat de kinderen van Israël niet strak zouden kijken naar het einde van wat teniet gedaan wordt.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Gen 18:10": "En Hij zei: Ik zal zeker bij u terugkomen, omstreeks deze tijd volgend jaar; en zie, Sara, uw vrouw, zal een zoon hebben! En Sara hoorde het aan de deur van de tent, die achter Hem was.", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Jes 29:14": "daarom, zie, Ik zal verder wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid van zijn wijzen zal vergaan, en het verstand van zijn verstandigen zal zich verbergen.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "Spr 30:16": "Het graf, de gesloten baarmoeder, de aarde die van water niet verzadigd wordt, en het vuur dat niet zegt: Het is genoeg!", "Spr 14:7": "Ga weg van het gezicht van een dwaze man; want u zou bij hem geen lippen van kennis merken.", "Job 26:5": "De doden worden geboren van onder het water, en zijn inwoners.", "Ps 13:3": "Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn?", "Ps 44:24-27": "Waak op, waarom zou U slapen, Heere! Ontwaak, verstoot niet tot in eeuwigheid. Waarom zou U Uw aangezicht verbergen, onze ellende en onze onderdrukking vergeten? Want onze ziel is in het stof neergebogen; onze buik kleeft aan de aarde.", "Luk 4:10": "Want er is geschreven dat Hij Zijn engelen bevelen zal geven over U, dat zij U bewaren zullen;", "Spr 14:10": "Het hart kent zijn eigen bittere droefheid; en een vreemde zal zich met zijn blijdschap niet vermengen.", "Ps 59:18": "Van U, o mijn Sterkte, zal ik psalmzingen; want God is mijn Hoog Vertrek, de God van mijn goedertierenheid.", "Ps 3:2": "O HEERE, hoe zijn mijn tegenstanders talrijk geworden; velen staan tegen mij op.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Ps 7:11": "Mijn schild is bij God, Die de oprechten van hart behoudt.", "Deut 27:26": "Vervloekt is hij die de woorden van deze wet niet bevestigt door ze te doen! En heel het volk zal zeggen: Amen.", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "Jer 32:16-25": "Vervolgens, nadat ik de koopbrief aan Baruch, de zoon van Nerija, gegeven had, bad ik tot de HEERE: Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk. U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!", "Ps 31:19": "Laat de valse lippen stom worden, die hard spreken tegen de rechtvaardige, in hoogmoed en verachting.", "Ex 32:1-6": "Toen het volk zag dat Mozes lang wegbleef om van de berg af te komen, verzamelde het volk zich bij Aäron, en zij zeiden tegen hem: Sta op, maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft weggeleid, weten wij niet wat er van hem geworden is. Aäron zei tegen hen: Rukt de gouden oorringen af, die in de oren van uw vrouwen, uw zonen en uw dochters zijn, en breng ze bij mij. Toen rukte heel het volk de gouden oorringen af die in hun oren waren, en zij brachten ze bij Aäron.", "Ps 25:1": "Een psalm van David. Aleph. Tot U, o HEERE! hef ik mijn ziel op.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Ps 56:9": "U hebt mijn omzwerven geteld; leg mijn tranen in Uw fles; staan zij niet in Uw register?", "Luk 13:35": "Zie, uw huis wordt aan u woest achtergelaten. En voorwaar, Ik zeg u, dat u Mij niet zult zien, totdat de tijd zal zijn gekomen dat u zult zeggen: Gezegend is Hij Die komt in de Naam van de Heere!", "Pred 6:10": "Wat iemand ook is, allang is zijn naam genoemd, en het is bekend dat hij een mens is; en dat hij niet kan rechten met wie sterker is dan hij.", "Num 14:8": "Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.", "Jes 53:4": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "Ps 63:8": "Want U bent mij een hulp geweest; en in de schaduw van Uw vleugels zal ik vrolijk zingen.", "2 Sam 7:15": "Maar Mijn goedertierenheid zal van hem niet wijken, zoals Ik die weggenomen heb van Saul, die Ik van voor uw aangezicht heb weggenomen.", "Job 14:2": "Hij komt op als een bloem, en wordt afgesneden; ook vlucht hij als een schaduw, en houdt geen stand.", "Ps 71:3": "Wees mij tot een Rotssteen, om daarin te wonen, om voortdurend daarin te gaan; Gij hebt bevel gegeven, om mij te verlossen, want Gij zijt mijn Steenrots en mijn Burg.", "Matt 27:10": "en zij hebben die gegeven voor de akker van de pottenbakker, zoals de Heere mij bevolen heeft.", "Job 5:18": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen.", "Jes 1:6": "Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "Ps 68:21": "Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Ps 8:5-7": "Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond? U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;", "Luk 20:43": "totdat Ik Uw vijanden tot een voetbank voor Uw voeten zal gezet hebben.", "Ps 40:15": "Laat hen samen beschaamd en schaamrood worden, die mijn ziel zoeken om die te vernielen; laat hen achterwaarts gedreven worden, en te schande worden, die lust hebben aan mijn kwaad.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "Deut 27:11-13": "En Mozes gebood het volk op diezelfde dag: Dezen zullen staan om het volk te zegenen op de berg Gerizim, wanneer u over de Jordaan gegaan bent: Simeon, en Levi, en Juda, en Issaschar, en Jozef, en Benjamin. En dezen zullen staan voor de vervloeking op de berg Ebal: Ruben, Gad en Aser, Zebulon, Dan en Naftali.", "Deut 11:2": "En u zult heden weten, dat ik niet spreek met uw kinderen, die het niet weten, en de vermaning van de HEERE, uw God, niet gezien hebben. Zijn grootheid, Zijn sterke hand en Zijn uitgestrekte arm;", "Ex 33:15": "Toen zei hij tegen Hem: Als Uw aangezicht niet meegaat, laat ons dan van hier niet optrekken!", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Rom 11:9": "En David zegt: Hun tafel moet worden tot een strik, en tot een val, en tot een aanstoot, en tot een vergelding voor hen.", "2 Petr 2:8": "(want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden);", "Hebr 5:5": "Zo heeft ook Christus Zichzelf niet verheerlijkt om Hogepriester te worden, maar Hij die tot Hem gesproken heeft: U bent Mijn Zoon, heden heb Ik U gegenereerd.", "Ps 55:18": "'s Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen.", "Ps 74:21-23": "Laat de verdrukte niet beschaamd terugkeren; laat de ellendige en de arme Uw Naam prijzen. Sta op, o God! Voer Uw eigen rechtszaak; denk aan de smaad die U de hele dag door de dwaas aangedaan wordt. Vergeet het geroep van Uw tegenstanders niet; het rumoer van hen die tegen U opstaan, klimt voortdurend op.", "1 Kor 15:27": "Want Hij heeft alle dingen aan Zijn voeten onderworpen. Maar wanneer Hij zegt dat Hem alle dingen onderworpen zijn, dan is het duidelijk dat Hij Zelf wordt uitgezonderd, Die Hem alle dingen onderworpen heeft.", "Spr 15:13": "Een vrolijk hart maakt het gezicht blij; maar door verdriet in het hart wordt de geest verslagen.", "Ps 116:2": "want Hij neigt Zijn oor tot mij; daarom zal ik Hem in mijn dagen aanroepen.", "Rom 9:25": "Zoals Hij ook bij Hosea zegt: Ik zal hen die Mijn volk niet waren, Mijn volk noemen, en haar die niet bemind was, Mijn beminde.", "Ps 48:15": "Want deze God is onze God eeuwig en altoos; Hij zal ons geleiden tot de dood toe.", "Ps 25:7": "Cheth. Gedenk niet de zonden van mijn jonkheid, noch mijn overtredingen; gedenk mij naar Uw goedertierenheid, om Uw goedheid wil, o HEERE!", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Jes 64:8": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen.", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Hand 7:40": "en zeiden tegen Aäron: Maak ons goden, die voor ons uit gaan; want wat deze Mozes betreft, die ons uit het land van Egypte geleid heeft, wij weten niet wat er met hem gebeurd is.", "Mal 1:3": "en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.", "Rom 10:21": "Maar tegen Israël zegt Hij: De hele dag heb Ik Mijn handen uitgestrekt naar een ongehoorzaam en tegensprekend volk.", "Luk 10:27": "En hij antwoordde: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw kracht, en met heel uw verstand; en uw naaste als uzelf.", "Joz 14:12": "En nu, geef mij dit gebergte, waarvan de HEERE op die dag gesproken heeft; want u hebt op diezelfde dag gehoord dat de Enakieten daar waren, en dat er grote versterkte steden waren; misschien is de HEERE met mij, zodat ik hen verdrijf, zoals de HEERE gesproken heeft.", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Ps 25:6": "Zain. Gedenk, HEERE! Uw barmhartigheden en Uw blijken van goedertierenheid, want die zijn er van eeuwigheid.", "Mark 10:7": "Daarom zal een man zijn vader en zijn moeder verlaten, en zich aan zijn vrouw hechten;", "Deut 18:15": "Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren,", "Pred 4:2": "Daarom prees ik de doden, die al gestorven waren, boven de levenden, die tot nu toe levend zijn.", "2 Kon 22:19": "Omdat uw hart week geworden is, en u zich voor het aangezicht van de HEERE vernederd hebt, toen u hoorde wat Ik gesproken heb tegen deze plaats en haar inwoners, dat zij tot een verwoesting en vloek zullen worden, en dat u uw kleren gescheurd en voor Mijn aangezicht geweend hebt; zo heb Ik u ook verhoord, spreekt de HEERE.", "Joz 8:33": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen.", "Matt 27:35": "Nadat zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, door het lot te werpen; opdat vervuld zou worden wat gezegd is door de profeet: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen.", "Job 36:19": "Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht?", "Hebr 2:14": "Omdat nu de kinderen deel hebben aan vlees en bloed, heeft Hij Zelf op dezelfde manier daaraan deelgenomen, opdat Hij door de dood hem teniet zou doen die de macht over de dood had, dat is: de duivel;", "Mark 10:8": "en die twee zullen tot één vlees zijn, zodat zij niet meer twee zijn, maar één vlees.", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Pred 9:5": "Want de levenden weten dat zij zullen sterven, maar de doden weten helemaal niets; zij hebben ook geen loon meer, maar hun gedachtenis is vergeten.", "2 Sam 22:6": "Banden van het graf omringden mij; strikken van de dood bejegenden mij.", "Ef 5:31": "Daarom zal een mens zijn vader en moeder verlaten, en zal zich aan zijn vrouw hechten; en die twee zullen tot één vlees worden.", "Job 16:19": "Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Deut 33:11": "Zegen, HEERE! zijn vermogen, en laat U het werk van zijn handen goed bevallen; versla de lenden van hen die tegen hem opstaan en hem haten, zodat zij niet weer opstaan!", "Ex 3:5-10": "En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land. Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien. En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "Rom 10:18": "Maar ik zeg: Hebben zij het niet gehoord? Zeker wel, hun geluid is over de hele aarde uitgegaan, en hun woorden tot de einden van de wereld.", "Jer 20:12": "Gij dan, o HEERE van de heerscharen, Die de rechtvaardige beproeft, Die de nieren en het hart ziet, laat mij Uw wraak op hen zien, want ik heb U mijn rechtszaak voorgelegd.", "Neh 4:5": "Dek hun ongerechtigheid niet toe, en laat hun zonde niet uitgewist worden van voor Uw aangezicht, want zij hebben U getergd, tegenover de bouwers.", "Job 14:22": "Maar zijn vlees, dat nog aan hem is, heeft smart; en zijn ziel, die nog in hem is, heeft rouw.", "Jes 26:1": "Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.", "Ps 66:9": "Die onze zielen in het leven houdt, en niet toelaat dat onze voet wankelt.", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Ps 26:12": "Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.", "Gen 37:35": "En al zijn zonen en al zijn dochters maakten zich op om hem te troosten; maar hij weigerde zich te laten troosten en zei: Want ik zal, rouw bedrijvend, tot mijn zoon in het graf neerdalen. Zo beweende zijn vader hem.", "Ps 16:2": "O mijn ziel, u hebt tegen de HEERE gezegd: U bent de Heere, mijn goedheid raakt niet tot U;", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "Lev 20:23": "En wandel niet in de gewoonten van het volk, dat Ik voor uw aangezicht wegjaag; want al deze dingen hebben zij gedaan; daarom ben Ik verdrietig op hen geworden.", "Spr 1:15": "Mijn zoon! wandel niet met hen op de weg; weer uw voet van hun pad.", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "Jer 10:24": "Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat U mij niet te niet maakt.", "Job 17:7-16": "Daarom is mijn oog door verdriet verdonkerd, en al mijn ledematen zijn als een schaduw. De oprechten zullen hierover verbaasd zijn, en de onschuldige zal zich tegen de huichelaar opmaken; En de rechtvaardige zal zijn weg vasthouden, en wie rein van handen is, zal in sterkte toenemen.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Pred 12:7": "En het stof terugkeert tot de aarde, zoals het geweest is; en de geest terugkeert tot God, Die hem gegeven heeft.", "Hand 7:43": "Ja, u hebt de tent van Moloch opgenomen, en de ster van uw god Remfan, de beelden die u gemaakt hebt om die te aanbidden; en Ik zal u wegvoeren tot voorbij Babylon.", "Luk 4:12": "En Jezus antwoordde en zei tegen hem: Er is gezegd: U zult de Heere, uw God, niet verzoeken.", "Ps 35:1-3": "Een psalm van David. Twist, HEERE, met wie tegen mij twisten; strijd tegen wie tegen mij strijden. Grijp het schild en de rondas, en sta op tot mijn hulp. En breng de spies naar voren, en sluit de weg toe voor mijn vervolgers; zeg tegen mijn ziel: Ik ben uw Heil.", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Job 22:23-29": "Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten. Dan zult u het goud op het stof leggen, en het goud van Ofir bij de rotssteen van de beken; Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "Spr 24:1": "Wees niet jaloers op de slechte mensen, en laat u niet drijven om bij hen te zijn.", "Ps 94:14": "Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "Spr 23:20": "Wees niet onder de wijnzuipers, ook niet onder de vleesvreters;", "Job 30:15-19": "Men heeft zich met verschrikkingen tegen mij gekeerd; ieder vervolgt als een wind mijn edele ziel, en mijn heil is als een wolk voorbijgegaan. Daarom stort mijn ziel zich nu in mij uit; de dagen van het druk grijpen mij aan. 's Nachts doorboort Hij mijn beenderen in mij, en mijn polsaderen rusten niet.", "Ex 34:13-16": "Maar hun altaren zult u omverwerpen, en hun opgerichte beelden zult u verbreken, en hun gewijde palen zult u afhouwen. (Want u zult zich niet buigen voor een andere god; want de Naam van de HEERE is IJveraar! Een ijverig God is Hij!) Zodat u misschien geen verbond maakt met de inwoner van dat land; en zij hun goden niet nahoereren, noch hun goden offers brengen, en hij u uitnodigt, en u van zijn offer eet.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "2 Kor 5:7": "(Want wij wandelen door geloof en niet door aanschouwen.)", "Rom 9:12": "werd tot haar gezegd: De oudste zal de jongste dienen.", "Ps 146:4": "Zijn geest gaat uit, hij keert terug tot zijn aarde; op diezelfde dag vergaan zijn plannen.", "Ps 10:7": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.", "1 Sam 20:2": "Hij daarentegen zei tegen hem: Dat zij verre, u zult niet sterven. Zie, mijn vader doet geen grote zaak, en geen kleine zaak, die hij niet aan mij bekendmaakt; waarom zou dan mijn vader deze zaak voor mij verbergen? Dat is niet zo.", "Pred 9:3": "Dit is een kwaad onder alles wat er onder de zon gebeurt, dat eenzelfde lot allen treft, en dat ook het hart van de mensenkinderen vol boosheid is, en dat er in hun leven onzinnigheden zijn in hun hart; en daarna moeten zij naar de doden toe.", "Spr 18:4": "De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.", "Ps 28:1": "Een psalm van David. Tot U roep ik, HEERE! Mijn Rotssteen, houd U niet als doof van mij af; anders, als U zich stil houdt voor mij, word ik gelijk aan degenen die in de kuil neerdalen.", "Ps 107:23-31": "Die met schepen ter zee afvaren, handel drijvend op grote wateren; Die zien de werken van de HEERE, en Zijn wonderwerken in de diepte. Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.", "2 Kron 32:7": "Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.", "Gen 21:10": "En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Rom 10:9-13": "namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden. Want met het hart gelooft men tot rechtvaardigheid, en met de mond belijdt men tot zaligheid. Want de Schrift zegt: Ieder die in Hem gelooft, zal niet beschaamd worden.", "Luk 11:9-13": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden. En welke vader onder u zal, als de zoon hem om brood vraagt, hem een steen geven? Of ook, als hij om een vis vraagt, zal hij hem in plaats van een vis een slang geven?", "Ps 119:41": "Vau. En dat mij Uw blijken van goedertierenheid overkomen, o HEERE! Uw heil, naar Uw toezegging;", "Ps 74:10": "Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?", "Rom 4:7": "En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn;", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Jes 27:5": "Of hij moest Mijn sterkte aangrijpen, dan zal hij vrede met Mij maken; vrede zal hij met Mij maken.", "Ps 119:22": "Wentel van mij smaad en verachting, want ik heb Uw getuigenissen onderhouden.", "Jak 5:17": "Elia was een mens net zo onderhevig aan gevoelens als wij; en hij bad een gebed, dat het niet zou regenen; en het regende niet op de aarde, drie jaar en zes maanden lang.", "Rom 15:12": "En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Ps 83:17": "Maak hun gezicht vol schande, opdat zij, o HEERE, Uw Naam zoeken.", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "Ps 35:26": "Laat hen beschaamd worden en samen schaamrood, die zich in mijn kwaad verblijden; laat hen met schaamte en schande bekleed worden, die zich tegen mij groot maken.", "1 Kor 14:21": "In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en toch zullen zij Mij ook zo niet horen, zegt de Heere.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "Ex 13:2": "Heilig voor Mij alle eerstgeborenen; wat er ook onder de kinderen van Israël de baarmoeder opent, van mensen en van dieren, dat is Mijn eigendom.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Klaagl 3:52": "Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Ps 73:14": "Want ik ben de hele dag geplaagd, en mijn straf is er elke morgen.", "Spr 22:24": "Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;", "Job 30:23": "Want ik weet dat U mij ter dood zult brengen, en tot het huis der samenkomst van alle levenden.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Ps 71:5-7": "Want Gij zijt mijn Verwachting, Heere HEERE! mijn Vertrouwen van mijn jeugd af aan. Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U. Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "1 Kor 15:45": "Zo staat er ook geschreven: De eerste mens Adam is geworden tot een levende ziel; de laatste Adam tot een levendmakende Geest.", "Ps 16:8": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen.", "Spr 29:24": "Wie met een dief deelt, haat zijn eigen leven; hij hoort een vervloeking, en geeft het niet te kennen.", "2 Tim 3:5": "met een schijn van godzaligheid, maar de kracht daarvan verloochenend. Heb ook een afkeer van hen.", "2 Kor 12:8": "Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Gen 15:13": "Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "2 Kron 6:24-39": "En wanneer Uw volk Israël voor het aangezicht van de vijand geslagen zal worden, omdat zij tegen U gezondigd zullen hebben, en zich bekeren, en Uw Naam belijden, en voor Uw aangezicht in dit huis bidden en smeken zullen, Hoor U dan uit de hemel, en vergeef de zonden van Uw volk Israël, en breng hen terug in het land dat U hun en hun vaders gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben, en zij in deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Luk 2:24": "En om een offer te geven, naar wat in de wet van de Heere gezegd is, een paar tortelduiven of twee jonge duiven.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Ps 77:8": "Zal de Heere dan voor eeuwig verstoten, en voortaan niet meer goedgunstig zijn?", "Ps 55:2-18": "O God! neem mijn gebed ter ore, en verberg U niet voor mijn smeking. Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier; Om het geroep van de vijand, vanwege de beangstiging van de goddeloze; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Klaagl 5:1": "Denk, HEERE, aan wat ons gebeurd is, kijk ernaar en zie onze smaad aan.", "Neh 5:13": "Ook schudde ik mijn boezem uit, en zei: Zo schudde God uit iedere man die dit woord niet zal nakomen, uit zijn huis en uit zijn arbeid, en hij worde zo uitgeschud en leeg. En de hele gemeente zei: Amen! En zij prezen de HEERE. En het volk deed volgens dit woord.", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Ps 79:1": "Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt.", "Rom 3:15-17": "hun voeten zijn snel om bloed te vergieten; vernieling en ellende is op hun wegen; en de weg van de vrede hebben zij niet gekend.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Ps 31:4-7": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam. Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want U bent mijn Sterkte. In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Hos 10:10": "Het is Mijn wens, dat Ik hen zal tuchtigen; en volken zullen tegen hen verzameld worden, wanneer Ik hen bind in hun twee voren.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Ps 66:10-12": "Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert; U had ons in het net gebracht; U had een engs band om onze lenden gelegd; U had de mens over ons hoofd laten rijden; wij waren in het vuur en in het water gekomen; maar U hebt ons uitgevoerd naar een overvloeiende verversing.", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "1 Sam 17:37": "Verder zei David: De HEERE, Die mij gered heeft uit de klauw van de leeuw en uit de klauw van de beer, Die zal mij redden uit de hand van deze Filistijn. Toen zei Saul tegen David: Ga heen, en de HEERE zij met u!", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "Mark 14:27": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.", "Spr 2:11": "Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden;", "Spr 1:12": "Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;", "Ps 44:6": "Door U zullen wij onze tegenstanders met hoorns stoten; in Uw Naam zullen wij vertrappen die tegen ons opstaan.", "Ex 21:24": "oog voor oog, tand voor tand, hand voor hand, voet voor voet,", "Ef 2:7": "opdat Hij zou tonen in de toekomende eeuwen de uitnemende rijkdom van Zijn genade, door de goedertierenheid over ons in Christus Jezus.", "Gen 27:2": "En hij zei: Zie toch, ik ben oud geworden, ik weet de dag van mijn dood niet.", "Gal 1:9": "Zoals wij al eerder gezegd hebben, zeg ik het nu ook weer: als iemand u een evangelie verkondigt naast wat u ontvangen hebt, laat hij vervloekt zijn.", "Spr 13:20": "Die met de wijzen omgaat, zal wijs worden; maar die de metgezel van de dwazen is, zal verbroken worden.", "Ps 119:170": "Laat mijn smeken voor Uw aanschijn komen, red mij naar Uw toezegging.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Ps 142:6-8": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden. Let op mijn geschrei, want ik ben zeer uitgeput; red mij van mijn vervolgers, want zij zijn sterker dan ik. Voer mijn ziel uit de gevangenis, om Uw Naam te loven; de rechtvaardigen zullen mij omringen, wanneer U goed voor mij zult zijn geweest.", "Job 3:13-19": "Want nu zou ik neerliggen, en stil zijn; ik zou slapen, dan zou voor mij rust zijn; Met de koningen en raadsheren van de aarde, die voor zich woeste plaatsen bebouwden; Of met de vorsten, die goud hadden, die hun huizen met zilver vulden.", "Matt 5:27": "U hebt gehoord dat gezegd is: U zult geen overspel plegen.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Ps 115:17": "De doden zullen de HEERE niet prijzen, evenmin wie in de stilte neergedaald zijn.", "Ps 116:3": "De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Ps 42:4": "Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "Ps 102:25": "Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht.", "Hand 8:32": "En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.", "Deut 31:16": "En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb.", "Ps 140:2-14": "Red mij, HEERE, van de kwade mens; behoed mij voor de man van geweld; Die veel kwaad in het hart bedenken, elke dag komen zij samen om te oorlogen. Zij scherpen hun tong als een slang; heet addervergif is onder hun lippen. Sela.", "Job 21:26": "Zij liggen samen neer in het stof, en het gewormte overdekt hen.", "Ps 73:10": "Daarom keert Zijn volk zich hierheen, als hun water uit een volle beker wordt uitgedrukt,", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "Jer 2:25": "Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar u zegt: Het is buiten hoop; nee, want ik heb de vreemden lief, en die zal ik nawandelen!", "Joh 10:9": "Ik ben de Deur; als iemand door Mij ingaat, zal hij behouden worden; en hij zal ingaan en uitgaan, en weide vinden.", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Ps 112:10": "Resch. De goddeloze zal het zien, en hij zal boos worden; Schin. hij zal met zijn tanden knarsen en wegkwijnen. Thau. de wens van de goddelozen zal vergaan.", "2 Kor 6:15": "En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige?", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Jes 64:9-12": "HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting. Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Ps 79:12": "En geef onze buren zevenvoudig terug in hun schoot hun smaad, waarmee zij U, o Heere, gesmaad hebben.", "Spr 23:6": "Eet niet het brood van hem die boos is van oog, en wees niet belust op zijn smakelijke gerechten;", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "2 Kron 32:8": "Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.", "Job 6:29": "Keert toch weder, laat er geen onrecht zijn, ja, keert weder; nog zal mijn gerechtigheid daarin zijn.", "Matt 21:16": "en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzelf lof toebereid?", "Ps 119:166": "O HEERE! ik hoop op Uw heil, en doe Uw geboden.", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is.", "Pred 9:10": "Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "Richt 16:28": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.", "Ps 49:16": "Maar God zal mijn ziel uit de macht van het graf verlossen, want Hij zal mij opnemen. Sela.", "Ps 43:5": "Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke Verlossing van mijn aangezicht, en mijn God.", "Joh 12:41": "Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "2 Sam 12:22": "En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.", "Ps 138:7": "Als ik wandel in het midden van de benauwdheid, maakt Gij mij levend; Uw hand strekt Gij uit tegen de toorn van mijn vijanden, en Uw rechterhand behoudt mij.", "Hand 28:25-27": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders, Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken. Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "Hebr 9:27": "En zoals het de mensen beschikt is eenmaal te sterven, en daarna het oordeel;", "Ps 32:5": "Mijn zonde maakte ik U bekend, en mijn ongerechtigheid bedekte ik niet. Ik zei: Ik zal belijdenis van mijn overtredingen doen voor de HEERE; en U vergaf de ongerechtigheid van mijn zonde. Sela.", "Ps 18:50": "Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Deut 11:29": "En het zal gebeuren, als de HEERE, uw God, u zal hebben binnengebracht in het land, waar u naartoe gaat, om dat te erven; dan zult u de zegen uitspreken op de berg Gerizim, en de vloek op de berg Ebal.", "Job 36:18": "Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen.", "Spr 18:14": "De geest van een man zal zijn ziekte dragen; maar een verslagen geest, wie zal die opheffen?", "Hand 24:15": "Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen.", "Matt 7:7-11": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden. Of welk mens is er onder u die, als zijn zoon hem om brood zou vragen, hem een steen zal geven?", "Num 12:13": "Mozes riep dan tot de HEERE en zei: O God! Genees haar toch!", "Gen 49:6": "Mijn ziel, kom niet in hun verborgen raad; mijn eer, wordt niet verenigd met hun vergadering! Want in hun toorn hebben zij de mannen doodgeslagen, en in hun moedwil hebben zij de ossen verlamd.", "Job 10:21": "Voordat ik heenga (en niet terugkom) naar een land van duisternis en van de schaduw van de dood;", "1 Tim 6:7": "Want wij hebben niets in de wereld meegebracht, het is duidelijk dat wij er ook niets uit kunnen meedragen.", "1 Kor 5:9-11": "Ik heb u in de brief geschreven dat u zich niet moet inlaten met de hoereerders; Maar niet geheel met de hoereerders van deze wereld, of met de gierigaards, of met de rovers, of met de afgodendienaars; want dan zou u wel uit de wereld moeten gaan. Maar nu heb ik u geschreven dat u zich niet moet inlaten namelijk met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Deut 25:4": "Een os zult u niet muilbanden, als hij graan dorst.", "1 Sam 17:45-47": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Job 14:15": "Dat U zou roepen, en ik U zou antwoorden, dat U naar het werk van Uw handen zou verlangen.", "Jes 40:6-8": "Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld. Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras. Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "1 Kon 19:14": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Hos 7:8": "Efraïm, die vermengt zich met de volken; Efraïm is een koek die niet is omgekeerd;", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Ps 119:26": "Ik heb U mijn wegen verteld, en U hebt mij verhoord; leer mij Uw inzettingen.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Jes 54:1": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.", "Job 19:21": "Ontferm u over mij, ontferm u over mij, o mijn vrienden! want de hand van God heeft mij aangeraakt.", "Gen 2:7": "En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.", "Mark 9:44": "Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.", "Ps 142:2": "Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "1 Kon 8:36-50": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt. Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn; elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Ps 81:8": "In de benauwdheid riep u, en Ik hielp u eruit; Ik antwoordde u uit de schuilplaats van de donder; Ik beproefde u aan het water van Meriba. Sela.", "Hand 7:34": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Ps 109:22-24": "Want ik ben ellendig en behoeftig, en mijn hart is in mijn binnenste doorwond. Ik ga heen als een schaduw wanneer die zich neigt; ik word omgedreven als een sprinkhaan. Mijn knieën struikelen van het vasten, en mijn vlees is vermagerd, zodat er geen vet aan is.", "Spr 5:8": "Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "Hebr 11:14": "Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken.", "Ps 74:11": "Waarom trekt U Uw hand, ja, Uw rechterhand terug? Trek haar uit het midden van Uw boezem; maak er een einde aan.", "Klaagl 1:12": "Lamed. Gaat het u niet aan, u allen, die over de weg gaat? Schouwt het aan en ziet, of er een smart is gelijk mijn smart, die mij aangedaan is, waarmee de HEERE mij bedroefd heeft ten dage van de gloed van Zijn toorn.", "Ps 119:39": "Wend mijn smaad af, die ik vrees, want Uw rechten zijn goed.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Jes 38:18": "Want het graf zal U niet loven, de dood zal U niet prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.", "Ps 69:14": "Maar mij aangaande, mijn gebed is tot U, o HEERE; er is een tijd van het welbehagen, o God! Door de grootheid van Uw goedertierenheid; verhoor mij door de trouw van Uw heil.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Hebr 12:7": "Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?", "Klaagl 3:24-32": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen. Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt. Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Job 16:6-14": "Als ik spreek, wordt mijn smart niet ingehouden; en houd ik op, wat gaat er dan van mij weg? Zeker, Hij heeft mij nu vermoeid; U hebt mijn hele vergadering verwoest. Dat U mij rimpelig gemaakt hebt, is tot een getuige; en mijn magerheid staat tegen mij op, zij getuigt in mijn gezicht.", "2 Sam 22:7": "Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; en Hij hoorde mijn stem uit Zijn paleis, en mijn geroep kwam in Zijn oren.", "Ex 16:18": "Maar toen zij het met de gomer maten, had hij die veel verzameld had, niets over, en hem die weinig verzameld had, ontbrak niets; ieder verzamelde zoveel als hij eten kon.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Gen 24:7": "De HEERE, de God van de hemel, Die mij uit het huis van mijn vader en uit het land van mijn familie genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft en zei: Aan uw nageslacht zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, zodat u voor mijn zoon van daar een vrouw neemt.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Ps 51:19": "De offeranden van God zijn een gebroken geest; een gebroken en verslagen hart zult U, o God! niet verachten.", "Deut 24:15": "Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.", "Luk 23:39-43": "En een van de kwaaddoeners die daar hingen, lasterde Hem en zei: Als U de Christus bent, verlos Uzelf en ons. Maar de ander antwoordde en bestrafte hem: Vreest u ook God niet, terwijl u in hetzelfde oordeel bent? En wij toch terecht; want wij ontvangen straf die past bij wat wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.", "Ps 69:20": "U weet mijn smaad, en mijn schaamte, en mijn schande; al mijn belagers zijn voor U.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Ps 121:2": "Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft.", "Gal 4:27": "Want er is geschreven: Wees vrolijk, u onvruchtbare, die niet baart, breek uit en roep, u die geen weeën hebt, want de kinderen van de eenzame zijn veel meer dan van haar die de man heeft.", "Pred 6:6": "Ja, al leefde hij wel tweemaal duizend jaren, en zag hij het goede niet; gaan zij niet allen naar één plaats?", "Gal 1:8": "Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Ps 34:13-17": "Mem. Wie is de man die lust heeft ten leven, die dagen liefheeft om het goede te zien? Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog. Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Jes 8:23": "Maar het land dat beangstigd was, zal niet helemaal verduisterd worden; zoals Hij het in de eerste tijd verachtelijk gemaakt heeft, naar het land van Zebulon toe en naar het land van Nafthali toe, zo heeft Hij het in het laatste heerlijk gemaakt, naar de weg zeewaarts toe gelegen over de Jordaan, aan Galilea van de heidenen.", "Ps 54:7": "Hij zal dit kwaad aan mijn belagers vergelden; roei hen uit door Uw waarheid.", "Ex 17:4": "Toen riep Mozes tot de HEERE en zei: Wat moet ik met dit volk doen? Het scheelt niet veel, of zij zullen mij stenigen.", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Ps 69:23": "Hun tafel moet voor hun gezicht tot een strik worden, en tot volle vergelding tot een valstrik.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Ps 118:10": "Alle heidenen hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "Ps 60:11": "Wie zal mij brengen in een vaste stad? Wie zal mij leiden tot in Edom?", "Ps 5:11": "Verklaar hen schuldig, o God; laat hen vervallen van hun raadslagen; drijf hen weg om de veelheid van hun overtredingen, want zij zijn opstandig tegen U.", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Ps 33:20-22": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild. Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen. Uw goedertierenheid, HEERE! zij over ons, zoals wij op U hopen.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "2 Petr 2:22": "Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "Jes 48:10": "Zie, Ik heb u gelouterd, doch niet als zilver, Ik heb u gekeurd in de smeltkroes van de ellende.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "Ps 119:153": "Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Ps 55:17": "Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Gen 20:17": "En Abraham bad tot God; en God genas Abimelech, en zijn vrouw, en zijn dienstmaagden, zodat zij weer kinderen kregen.", "Ps 107:5": "Zij waren hongerig, ook dorstig; hun ziel was in hen overstelpt.", "Deut 24:1": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis.", "Joz 23:6-13": "Zo weest zeer sterk, om te bewaren en om te doen alles, wat geschreven is in het wetboek van Mozes; opdat u daarvan niet afwijkt naar rechts noch naar links; Dat u niet ingaat tot deze volken: deze, die overgebleven zijn bij u; gedenkt ook niet aan de naam van hun goden, en laat er niet bij zweren, en dient hen niet, en buigt u voor hen niet; Maar de HEERE, uw God, zult u aanhangen, zoals u tot op deze dag gedaan hebt.", "Ex 20:14": "U zult geen echtbreuk plegen.", "Job 21:33": "De kluiten van het dal zijn hem zoet, en hij trekt achter zich alle mensen aan; en van hen die vóór hem geweest zijn, is geen getal.", "Num 33:55": "Maar als u de inwoners van het land niet voor uw aangezicht uit hun bezit verdrijft, dan zal het gebeuren dat wie u van hen laat overblijven, tot doornen zullen zijn in uw ogen, en tot prikkels in uw zijden, en u zullen benauwen in het land waarin u woont.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Luk 22:42": "en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.", "Jes 38:1": "In die dagen werd Hizkia ziek tot de dood toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Regel uw zaken; want u zult sterven en niet leven.", "Ps 39:13": "Hoor, HEERE, mijn gebed, en neem mijn geroep ter ore; zwijg niet bij mijn tranen; want ik ben een vreemdeling bij U, een bijwoner, zoals al mijn vaders.", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Hand 8:33": "In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.", "Rom 9:29": "En zoals Jesaja van tevoren gezegd heeft: Als de Heere Sebaoth ons geen nageslacht had overgelaten, dan waren wij geworden als Sodom, en gelijk gemaakt aan Gomorra.", "Ps 67:7": "De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.", "Ps 22:15": "Ik ben uitgestort als water, en al mijn beenderen hebben zich vaneen gescheiden; mijn hart is als was, het is gesmolten in het midden van mijn ingewand.", "Hand 4:11": "Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is.", "Joh 11:3": "Zijn zusters dan zonden tot Hem, en zeiden: Heere, zie, hij die U liefhebt, is ziek.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Ps 126:4": "O HEERE, keer onze gevangenschap, zoals waterstromen in het zuiden.", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "2 Kor 12:8-10": "Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken. En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont. Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus' wil; want als ik zwak ben, dan ben ik machtig.", "Job 5:17": "Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.", "Jak 5:13-16": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen. Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere. En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Ps 24:3-6": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Job 3:13": "Want nu zou ik neerliggen, en stil zijn; ik zou slapen, dan zou voor mij rust zijn;", "Matt 19:4": "Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Jak 1:10": "En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan.", "2 Kor 12:4": "dat hij opgetrokken is geweest in het paradijs, en onuitsprekelijke woorden gehoord heeft, die het een mens niet geoorloofd is te spreken.", "Ps 143:9": "Red mij, HEERE, van mijn vijanden; bij U schuil ik.", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "Matt 4:24": "En het nieuws over Hem verspreidde zich door heel Syrië; en men bracht bij Hem allen die er slecht aan toe waren, met allerlei ziekten en pijnen bevangen, en van de duivel bezetenen, en maanzieken en verlamden; en Hij genas hen.", "Ps 22:2-22": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen? Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte. Doch U bent heilig, wonende onder de lofzangen van Israël.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Ps 77:11-13": "Daarna zei ik: Dit krenkt mij; maar de rechterhand van de Allerhoogste verandert. Ik zal de daden van de HEERE gedenken; ja, ik zal Uw wonderen van vroeger gedenken; En ik zal al Uw werken overdenken, en van Uw daden spreken.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Ps 109:9-20": "Laat zijn kinderen wezen worden, en zijn vrouw weduwe. En laat zijn kinderen hier en daar omzwerven, en bedelen, en de nooddruft uit hun verwoeste plaatsen zoeken. Laat de schuldeiser aanslaan al wat hij heeft, en laat de vreemden zijn arbeid roven.", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Deut 6:16": "U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Openb 20:12-14": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken. En de zee gaf de doden, die in haar waren; en de dood en het rijk van de dood gaven de doden, die in hen waren; en zij werden geoordeeld, ieder naar zijn werken. En de dood en het rijk van de dood werden geworpen in de poel van het vuur; dit is de tweede dood.", "Pred 11:1": "Werp uw brood uit op het water, want u zult het vinden na veel dagen.", "Spr 1:14": "U zult uw lot midden onder ons werpen; wij zullen allen één buidel hebben.", "Ps 32:7": "U bent mij een schuilplaats; U behoedt mij voor benauwdheid; U omringt mij met vrolijke gezangen van bevrijding. Sela.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Spr 17:22": "Een blij hart zal goed doen als een medicijn; maar een verslagen geest zal het gebeente doen verdrogen.", "Num 16:15": "Toen ontstak Mozes zeer, en hij zei tegen de HEE
