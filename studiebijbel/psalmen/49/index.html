"Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm, voor de koorleider, onder de kinderen van Korach.","2":"Hoort dit, alle volken! Neemt *het* ter oor, alle inwoners van de wereld,","3":"zowel eenvoudigen als aanzienlijken, samen rijk en arm!","4":"Mijn mond zal enkel wijsheid spreken, en de overdenking van mijn hart zal vol verstand zijn.","5":"Ik zal mijn oor neigen tot een spreuk; ik zal mijn verborgen rede openen op de harp.","6":"Waarom zou ik vrezen in kwade dagen, *als* de ongerechtigen, die op de hielen zijn, mij omringen?","7":"Aangaande hen die op hun bezit vertrouwen, en op de overvloed van hun rijkdom roemen;","8":"niemand van hen zal *zijn* broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven;","9":"(want de verlossing van hun ziel is te kostbaar, en zal voor eeuwig ophouden);","10":"dat hij ook voortaan voor altijd zou leven, *en* de vergankelijkheid niet zien.","11":"Want hij ziet dat de wijzen sterven, dat samen een dwaas en een onverstandig mens omkomen, en hun bezit aan anderen nalaten.","12":"Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen.","13":"De mens echter, *die* in aanzien is, blijft niet; hij wordt gelijk aan de dieren, *die* vergaan.","14":"Deze weg van hen is een dwaasheid van hen; toch hebben hun nakomelingen welbehagen in hun woorden. Sela.","15":"Men zet hen als schapen in het graf, de dood zal hen afweiden; en de oprechten zullen over hen heersen in die morgenstond; en het graf zal hun gedaante verslijten, *elk* uit zijn woning.","16":"Maar God zal mijn ziel uit de macht van het graf verlossen, want Hij zal mij opnemen. Sela.","17":"Vrees niet wanneer een man rijk wordt, wanneer de eer van zijn huis groot wordt;","18":"want hij zal bij zijn sterven niets meenemen, zijn eer zal hem niet achterna dalen.","19":"Hoewel hij zijn ziel in zijn leven zegent, en zij u loven, omdat u uzelf goed doet;","20":"zo zal zij *toch* komen tot het geslacht van haar vaderen; tot in eeuwigheid zullen zij het licht niet zien.","21":"De mens, *die* in aanzien is, en geen verstand heeft, wordt gelijk aan de dieren, *die* vergaan."},"SV":{"1":"Een psalm, voor den opperzangmeester, onder de kinderen van Korach.","2":"Hoort dit, alle gij volken! neemt ter ore, alle inwoners der wereld,","3":"Zowel slechten als aanzienlijken, te zamen rijk en arm!","4":"Mijn mond zal enkel wijsheid spreken, en de overdenking mijns harten zal vol verstand zijn.","5":"Ik zal mijn oor neigen tot een spreuk; ik zal mijn verborgene rede openen op de harp.","6":"Waarom zou ik vrezen in kwade dagen, *als* de ongerechtigen, die op de hielen zijn, mij omringen?","7":"Aangaande degenen, die op hun goed vertrouwen; en op de veelheid huns rijkdoms roemen;","8":"Niemand van hen zal *zijn* broeder immermeer kunnen verlossen; hij zal Gode zijn rantsoen niet kunnen geven;","9":"(Want de verlossing hunner ziel is te kostelijk, en zal in eeuwigheid ophouden);","10":"Dat hij ook voortaan geduriglijk zou leven, *en* de verderving niet zien.","11":"Want hij ziet, dat de wijzen sterven, dat te zamen een dwaas en een onvernuftige omkomen, en hun goed anderen nalaten.","12":"Hun binnenste gedachte is, dat hun huizen zullen zijn in eeuwigheid, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen.","13":"De mens nochtans, *die* in waarde is, blijft niet; hij wordt gelijk als de beesten, *die* vergaan.","14":"Deze hun weg is een dwaasheid van hen; nochtans hebben hun nakomelingen een welbehagen in hun woorden. Sela.","15":"Men zet hen als schapen in het graf, de dood zal hen afweiden; en de oprechten zullen over hen heersen in dien morgenstond; en het graf zal hun gedaante verslijten, *elk* uit zijn woning.","16":"Maar God zal mijn ziel van het geweld des grafs verlossen, want Hij zal mij opnemen. Sela.","17":"Vrees niet, wanneer een man rijk wordt, wanneer de eer van zijn huis groot wordt;","18":"Want hij zal in zijn sterven niet met al medenemen, zijn eer zal hem niet nadalen.","19":"Hoewel hij zijn ziel in zijn leven zegent, en zij u loven, omdat gij uzelven goed doet;","20":"Zo zal zij *toch* komen tot het geslacht harer vaderen; tot in eeuwigheid zullen zij het licht niet zien.","21":"De mens, *die* in waarde is, en geen verstand heeft, wordt gelijk als de beesten, *die* vergaan."},"KJV":{"1":"[[To the chief Musician, A Psalm for the sons of Korah.]] Hear this, all *ye* people; give ear, all *ye* inhabitants of the world:","2":"[[To the chief Musician, A Psalm for the sons of Korah.]] Hear this, all *ye* people; give ear, all *ye* inhabitants of the world:","3":"Both low and high, rich and poor, together.","4":"My mouth shall speak of wisdom; and the meditation of my heart *shall be* of understanding.","5":"I will incline mine ear to a parable: I will open my dark saying upon the harp.","6":"Wherefore should I fear in the days of evil, *when* the iniquity of my heels shall compass","7":"They that trust in their wealth, and boast themselves in the multitude of their riches;","8":"None *of them* can by any means redeem his brother, nor give to God a ransom","9":"(For the redemption of their soul *is* precious, and it ceaseth for ever:)","10":"That he should still live for ever, *and* not see corruption.","11":"For he seeth *that* wise men die, likewise the fool and the brutish person perish, and leave their wealth to others.","12":"Their inward thought *is, that* their houses *shall continue* for ever, *and* their dwelling places to all generations; they call *their* lands after their own names.","13":"Nevertheless man *being* in honour abideth not: he is like the beasts *that* perish.","14":"This their way *is* their folly: yet their posterity approve their sayings. Selah.","15":"Like sheep they are laid in the grave; death shall feed on them; and the upright shall have dominion over them in the morning; and their beauty shall consume in the grave from their dwelling.","16":"But God will redeem my soul from the power of the grave: for he shall receive me. Selah.","17":"Be not thou afraid when one is made rich, when the glory of his house is increased;","18":"For when he dieth he shall carry nothing away: his glory shall not descend after","19":"Though while he lived he blessed his soul: and *men* will praise thee, when thou doest well","20":"He shall go to the generation of his fathers; they shall never see light.","21":"Man *that is* in honour, and understandeth not, is like the beasts *that* perish."}},"tsk":{"2":[{"kopje":"alle volken","refs":["Ps 46:2","Ps 48:2"]},{"kopje":"Hoort","refs":["Ps 34:12","Ps 78:1","Spr 1:20-23","Matt 11:15","Matt 13:9","Openb 2:7","Openb 2:11","Openb 2:17","Openb 2:29"]},{"kopje":"inwoners","refs":["Ps 50:1","Jes 49:6","Mal 1:11","Matt 28:19","Matt 28:20","Rom 3:29","Rom 10:18"]}],"4":[{"kopje":"mond","refs":["Deut 32:2","Job 33:3","Job 33:33","Spr 4:1","Spr 4:2","Spr 8:6-11","Spr 22:17","Spr 22:20","Spr 22:21","2 Tim 3:15-17"]},{"kopje":"overdenking","refs":["Ps 19:15","Ps 45:2","Ps 104:34","Matt 12:35"]}],"5":[{"kopje":"neigen","refs":["Ps 78:2","Matt 13:35"]},{"kopje":"spreuk","refs":["Num 23:7","Ezech 20:49","Matt 13:11-15"]},{"kopje":"verborgen","refs":["Spr 1:6","Dan 8:23","Luk 12 ull,"tekst":"A Psalm for the chief song-master, [Psa.4.on v.1.] among the children of Korah. [See Psa.42.on v.1.] (49:2) Hear this all ye nations: take to ears all ye inhabitants of the world."}],"2":[{"catchword":null,"tekst":"A Psalm for the chief song-master, [Psa.4.on v.1.] among the children of Korah. [See Psa.42.on v.1.] (49:2) Hear this all ye nations: take to ears all ye inhabitants of the world."}],"3":[{"catchword":null,"tekst":"(3) As well (the) mean as (the) respected [Heb. Et file hominis, et. Filij viri. See Psa.4.on v.3.] rich and rooted together."}],"4":[{"catchword":null,"tekst":"(4) My mouth shall speak nothing but wisdom, [Heb. Wisdoms] and the meditation of my heart shall be full of understanding. [Heb. Understandings.]"}],"5":[{"catchword":null,"tekst":"(5) I shall encline mine ear to a sentence: I shall open my hidden sayings [Or riddles. See Jud.14.on v.12. and 1 Kings 10.on v.1.] upon the Harp. [or Cithern.]"}],"6":[{"catchword":null,"tekst":"(6) Why should I fear in evil days? [Heb. Days of evil, i.e. time of adversity and trouble] (when) the unrighteous (ones) which are on my heels surround me [Heb. The iniquity of my heels surround me. i.e. men of iniquity, unrighteous men; or understand the iniquity and malice of his Enemies, persecuting me unjustly, and so closely something me at the heels, that sometimes they encompass me round. This whole Psalm sheweth, that the godly have cause to be of good chear and consort in the midst, and against the power and insolence of all their wicked persecutors.]"}],"7":[{"catchword":null,"tekst":"(7) As for those that trust in their goods, and boast of the multitude of their riches."}],"8":[{"catchword":null,"tekst":"(8) None of them shall ever be able to redeem [Heb. Shall redeeming redeem, i.e. they shall never, nor in any wise be able to deliver or redeem them] (his) brother; [i.e. kinsmen, or friend, whom he would gladly keep and preserve alive, and be loath to lose by death, if he could any ways chuse or let it] he shall not be able to give God his ransom (or redemption-money) [as to the LORD of life and death, to whom all men do owe death, Gen 2:17. and 3.19. Rom 5:12, &c. And 6.23.]"}],"9":[{"catchword":null,"tekst":"(9) For the redemption [Or ransom, relaxation, freemaking, freedoms purchase] of their soul [i.e. of their life. See Gen.19.on v.17.] is too precious (or costly) [oth. Too heavy, i.e. impossible, as Dan.2.11.] and shall cease forever.) [i.e. never be compassed, or brought to pass, but remain behind forever.]"}],"10":[{"catchword":null,"tekst":"(10) That he also should live on continually, [Or always, evermore as he was not able to redeem other from death, so he can not do it for himself neither] (and) not see the corruption. [See Psa.16.on v.10.]"}],"11":[{"catchword":null,"tekst":"(11) For he seeth; [Or one seeth sure, or yet one seeth] that the wise (ones) die, that a fool and irrational [or brutal one) i.e. he that like a brute beast hath no understand, to he that is enflamed or enraged with unreasonable and furious passions. Compare Psa 73:22.and 92.7. and 94.8. Pro 30:2. 2 Pet.2.12. Jude v.10.] perish withal; and leave their goods to others."}],"12":[{"catchword":null,"tekst":"(12) Their inward thought is [Heb. Their inward, or, inmost] that their houses shall be for ever, their habitation from generation to generation: [Heb. In generation etc.] they call the Lands after their Names. [Others, they boast, or proclaimed their names in the Countries.]"}],"13":[{"catchword":null,"tekst":"(13) Never the less man (home) (that) is in reputation [And hath no understanding, as v.21. being for all his state and excellency in the world, but such a brute and idiote as is described before. See v.7.12.] abideth not: [Heb. Properly, shall not stay all night; but the Hebrew word is taken beside for lodging, sojourning abiding] he becometh like to the beasts (that) perish [or are cut off, destroyed. The likeness consisteth in the death, which is common to wicked men and beasts, and in regard of the brute, dull, and senceless condition, wherein the wicked die, even as if they were very beasts, of the immortality of the soul there is spoken elsewhere.]"}],"14":[{"catchword":null,"tekst":"(14) This way of theirs [i.e. course of life practise and conversation. See Gen.6.on v.12.] is a folly of them. [Oth.hope, i.e. that wherein they put their hope and confidence, the Hebrew word admitting of contrary significations, as folly, unconstancy, unsteddiness, levity; sometimes hope stedfastness, confidence, even as the Hebrew word. Berechsignifies blessing and sometimes cursing, the like happens also with some words in most languages, some being of very different and even contrary siginifications] nevertheless their posterities take delight in their words [Hebrew mouth, i.e. savings, instructions, charges, commands, as the mouth is often taken for that which proceedeth thence. The meaning is, they do and carry themselves even, as others did before them, instead of forsaking and abhorring the folly of their predecessours] Sela. [See Psa.3.on v.3.]"}],"15":[{"catchword":null,"tekst":"(15) One puts them [Heb. They put, them namely, or place, lay them, these wicked, wretched rich ones, i.e. one puts them, or they are put; as frequently elsewhere] as sheep [who are thrust and thronged into the fold as thick as they sufficient to contain the ambitious and covetous thoughts of the wicked] into the grave, [Heb. Scheol, and so in the sequel. See Gen.37.on v.35.] Death shall feed on them [i.e. consume them [i.e. consume them, wear them out, waste them, See of the Hebrew word Job 24.on v.21. Others feed them, i.e. be their Lord and Master, rule order and possess them] and the upright shall have Dominion over them [in Christ their head, under whose feet all Enemies shall be thrown, and made his foot-stool as it were, Psa 110:1.1. Cor.15.25.] in that morning [when they shall awake out of their sleep unto their blessed resurrection, through the power of their head Jesus Christ] and the grave shall waste [Heb.properly inveterate, made old] their feature, [or shape, countenance. Oth. Their rock, strength, whereon they grounded their confindence] (each one) out of his dwelling, [to wit, being pluckt away therehence, for all the fond and vain conceits he entertained thereof. See v.12.Oth. thus for their (the uprights) rock (the Messiahs) (is) to destroy the grave, that it shall be no habitation to them (Heb. Him, i.e. to none of the godly, not one of them] or out of its (i.e. the graves) habitation, as when one subdues an Enemy in his own camp.]"}],"16":[{"catchword":null,"tekst":"(16) But [Or assuredly; in regard of the translation or reading mentioned just before] God shall redeem my soul [Compare Psa.16.on v.10. though here regard is had to the perfect Redemption of all the members of Christ in soul and body, which every true believer doth apply unto himself, as is done here] from the power of the grave: [Heb. Out, or from the hand, so Hos 13:14. See Job 5.on v.20. and Psa 22:21.] for he shall take me up, [or when he shall take me up, See Joh 14:3. 1 Thes.4.14,17.] Sela."}],"17":[{"catchword":null,"tekst":"(17) Fear not when a man grows rich; [Be not dismayed, fainthearted, pusillanimous, distrustfull, when you see the wicked grow mighty and powerful] when the honour of his house grows great. [or multiplied, enlarged.]"}],"18":[{"catchword":null,"tekst":"(18) For he shall take nothing at all with him in his death, (Or dying) his honour shall not descend after him."}],"19":[{"catchword":null,"tekst":"(19) Although he bless his soul; [Count himself a happy man. See Deut.29.on v.19. Some do understand it of his voluptuous and luxurious course of life spoken of in the sequel, and Luk 12:19. and 16.25. and they [the foolish worldlings] praise thee [o foolish rich man] for doing good to thy self. [or when thou doest.]"}],"20":[{"catchword":null,"tekst":"(20) (Yet) shall ye she [To wit, the soul, whereof was spoken in the former verse, that is, himself] come to the generation of their fathers, [of his fore-fathers, which are gone down to the grave and pit of hell, even as the faithful are gathered to their fellow members. See Gen 15:15. and 25.8,17. Some do understand this verse thus, that those wicked ones shall live no longer on Earth then did their fore-fathers: they should enjoy no everlasting life here in this world] in eternity shall not they see the light. [Compare Psa.36.on v.10. but they (the wicked described before) shall be cast out into the utter darkness. Mat 8:12.]"}],"21":[{"catchword":null,"tekst":"(21) The man that is in honour, and hath no understanding, becometh like unto the beasts that perish."}]}}};

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));

    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
