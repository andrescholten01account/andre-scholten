ij worden van de stoute wereldskinderen zo veracht, dat wij zeer verdrietig daarover worden en schier niet meer lijden kunnen. Zie de aantekening bij Job 7:4 , en Psa 88:4 ."}],"4":[{"catchword":"der weelderigen,","tekst":"Hebr. der rustigen, of der gerusten; dat is, dergenen, die in rust en weelde in deze wereld zitten en van geen lijden of verdriet weten, en overzulks moedig en moedwillig zijn."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A song Hammaaloth [See Psalm 129.v.1.] I lift up mine eyes unto thee, that sitteth in the heavens. [These words are set down here and elsewhere, more for to rowse, and raise up our hearts unto the consideration of the heavenly excellency and Majesty of God; then to shew that God doth onely reside in Heaven. The Heavens of Heavens, are not able to comprehend the same.]"}],"2":[{"catchword":null,"tekst":"Behold, as the eyes of the servants are upon the hands of their masters, [viz. Being wronged, or like to be injured or oppressed] as the eyes of the maiden servant are upon the hand of her mistress: so are our eyes upon the LORD our God, until he be gracious unto us. [An example encouraging us to be restless in prayer, until we are heard. See Luk 18:1,2. Etc. And Psa 55:18.]"}],"3":[{"catchword":null,"tekst":"Be gracious unto us O LORD, be gracious unto us, for we are too full of contempt. [The meaning is, we are so exceedingly scorned and despised by the haughty and insolent worldlings, that it proveth very irksome and tedious unto us, being scarce able to endure it any longer, See the Annot. Job 7.on v.4. and Psal.88.4.]"}],"4":[{"catchword":null,"tekst":"Our soul is too full of the scorn of the wellfaring, [Or, the easy ones, them that are rest or ease, in quiet. i.e. of them which live at ease and quietness in this world, and know of no cross nor sorrow, and therefore grow wanton, proud and insolent] of the contempt of the proud ones."}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

    .then(r => r.ok ? r.json() : null).catch(() => null);

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));

  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
