 bezweken door de slagen van Uw hand.", "Ps 130:1-8": "Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE! Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen. Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Jer 27:5-7": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.", "Jes 7:7": "Zo zegt de Heere HEERE: Het zal niet standhouden, en het zal niet gebeuren.", "Ps 10:9": "Hij legt lagen in een verborgen plaats, zoals een leeuw in zijn hol; hij legt lagen om de ellendige te roven; hij rooft de ellendige als hij hem trekt in zijn net.", "Ps 82:1": "Een psalm van Asaf. God staat in de vergadering van God; Hij oordeelt in het midden van de goden;", "Ps 27:9": "Verberg Uw aangezicht niet voor mij, keer Uw knecht niet af in toorn; U bent mijn Hulp geweest, verlaat mij niet, en begeef mij niet, o God van mijn heil!", "1 Sam 2:6-8": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Dan 6:27": "Van mij is een bevel uitgegaan, dat men in de hele heerschappij van mijn koninkrijk moet beven en sidderen voor het aangezicht van de God van Daniël; want Hij is de levende God, en blijvend in eeuwigheid, en Zijn koninkrijk gaat niet te gronde, en Zijn heerschappij duurt tot het einde toe.", "Ps 64:2": "Hoor, o God, mijn stem in mijn geklaag; behoed mijn leven voor de schrik van de vijand.", "2 Kron 20:1": "Het gebeurde nu hierna, dat de kinderen van Moab, en de kinderen van Ammon, en met hen anderen naast de Ammonieten, tegen Josafat kwamen om te strijden.", "Ps 119:116": "Ondersteun mij naar Uw toezegging, opdat ik leve; en laat mij niet beschaamd worden over mijn hoop.", "Ezech 27:9": "De oudsten van Gebal en haar wijzen waren in u, zij verbeterden uw breuken; alle schepen van de zee en hun zeelieden waren in u, om onderlinge handel met u te drijven.", "Klaagl 1:9-11": "Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot. Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden. Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "Ps 35:23": "Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Deut 27:11-13": "En Mozes gebood het volk op diezelfde dag: Dezen zullen staan om het volk te zegenen op de berg Gerizim, wanneer u over de Jordaan gegaan bent: Simeon, en Levi, en Juda, en Issaschar, en Jozef, en Benjamin. En dezen zullen staan voor de vervloeking op de berg Ebal: Ruben, Gad en Aser, Zebulon, Dan en Naftali.", "Ps 40:15": "Laat hen samen beschaamd en schaamrood worden, die mijn ziel zoeken om die te vernielen; laat hen achterwaarts gedreven worden, en te schande worden, die lust hebben aan mijn kwaad.", "Ps 74:23": "Vergeet het geroep van Uw tegenstanders niet; het rumoer van hen die tegen U opstaan, klimt voortdurend op.", "Ps 119:94": "Ik ben van U, behoud mij, want ik heb Uw bevelen gezocht.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "1 Kron 29:11": "Van U, o HEERE, is de grootheid, en de macht, en de heerlijkheid, en de overwinning, en de majesteit; want alles wat in de hemel en op aarde is, is van U: van U, o HEERE, is het Koninkrijk, en U hebt Uzelf verhoogd tot een Hoofd boven alles.", "Jes 38:14-19": "Zoals een kraanvogel of zwaluw, zo piepte ik; ik kirde als een duif; mijn ogen keken smachtend omhoog; o HEERE! ik word onderdrukt, wees Gij mijn Borg. Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel. Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.", "Ps 119:43": "En ruk het woord van de waarheid van mijn mond niet al te zeer, want ik hoop op Uw rechten.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Ezech 20:47": "En zeg tegen het zuiderwoud: Hoor het woord van de HEERE: Zo zegt de Heere HEERE: Zie, Ik zal een vuur in u aansteken, dat in u elke groene boom en elke dorre boom zal verteren; de vlammende vlam zal niet uitgeblust worden, maar daardoor zullen alle aangezichten verbrand worden, van het zuiden tot het noorden toe.", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "Ps 9:14": "Wees mij genadig, HEERE, zie mijn ellende aan, die mijn haters mij aandoen, Gij, Die mij verhoogt uit de poorten van de dood;", "Ps 6:11": "Al mijn vijanden zullen zeer beschaamd en verbaasd worden; zij zullen terugkeren, zij zullen in een ogenblik beschaamd worden.", "Ps 115:16": "Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.", "Dan 2:47": "De koning antwoordde Daniël en zei: Het is werkelijk waar dat uw God een God der goden is, en een Heere der koningen, en Iemand Die geheimen openbaart, omdat u dit geheim hebt kunnen openbaren.", "Klaagl 5:19-22": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht. Waarom zou U ons voor altijd vergeten? Waarom zou U ons zo lange tijd verlaten? HEERE, bekeer ons tot U, dan zullen wij bekeerd zijn; vernieuw onze dagen als vanouds.", "Ps 79:5": "Hoe lang, HEERE? Zult U eeuwig toornen? Zal Uw ijver als vuur branden?", "Ps 33:20": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Ps 113:4": "De HEERE is hoog boven alle heidenvolken, boven de hemelen is Zijn heerlijkheid.", "Ps 86:1-17": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Openb 21:6": "En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Jes 44:4": "En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.", "2 Tim 4:14": "Alexander, de kopersmid, heeft mij veel kwaad aangedaan; de Heere zal hem vergelden naar zijn werken.", "Neh 1:9": "Maar als u zich tot Mij bekeert, en Mijn geboden houdt, en die doet; al waren uw verdrevenen aan het einde van de hemel, Ik zal hen vandaar verzamelen, en zal ze brengen naar de plaats die Ik gekozen heb om Mijn Naam daar te doen wonen.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Dan 5:26-28": "Dit is de uitleg van deze woorden: MENE; God heeft uw koninkrijk geteld, en Hij heeft het beëindigd. TEKEL; u bent op een weegschaal gewogen, en u bent te licht bevonden. PERES; uw koninkrijk is verdeeld, en het is aan de Meden en de Perzen gegeven.", "Hoogl 3:1-4": "Ik zocht 's nachts op mijn bed Hem, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet; ik zei: ... Ik zal nu opstaan, en in de stad omgaan, in de wijken en in de straten; ik zal Hem zoeken, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet. De wachters, die in de stad omgingen, vonden mij: ik zei: Hebt u Die gezien, Die mijn ziel liefheeft?", "Openb 4:11": "U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.", "Deut 32:8": "Toen de Allerhoogste aan de volken de erfenis uitdeelde, toen Hij Adams kinderen van elkaar scheidde, heeft Hij de grenzen van de volken vastgesteld naar het getal van de kinderen van Israël.", "Ps 74:21-23": "Laat de verdrukte niet beschaamd terugkeren; laat de ellendige en de arme Uw Naam prijzen. Sta op, o God! Voer Uw eigen rechtszaak; denk aan de smaad die U de hele dag door de dwaas aangedaan wordt. Vergeet het geroep van Uw tegenstanders niet; het rumoer van hen die tegen U opstaan, klimt voortdurend op.", "Ps 7:3": "Anders zou hij mijn ziel roven als een leeuw, die verscheurt, terwijl er geen redder is.", "Ps 119:10": "Ik zoek U met mijn hele hart, laat mij van Uw geboden niet afdwalen.", "Ps 123:4": "Onze ziel is veel te zat van de spot van de weldenkenden, van de verachting van de hoogmoedigen.", "Hand 2:21": "En het zal gebeuren dat ieder die de Naam van de Heere zal aanroepen, behouden zal worden.", "Ps 119:149": "Hoor mijn stem naar Uw goedertierenheid, o HEERE! maak mij levend naar Uw recht.", "Ps 22:27": "De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.", "Klaagl 3:25": "Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt.", "2 Kon 19:15-19": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt. HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen. Werkelijk, HEERE, de koningen van Assyrië hebben die heidenvolken en hun land verwoest;", "Ps 109:2": "Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong.", "Ps 91:1": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Gen 25:3": "En Joksan verwekte Seba en Dedan; en de zonen van Dedan waren de Assurieten, en Letusieten, en Leummieten.", "Richt 4:15-24": "En de HEERE versloeg Sisera, met al zijn wagens, en het hele leger, door de scherpte van het zwaard, voor Barak; zodat Sisera van de wagen afklom, en te voet vluchtte. En Barak achtervolgde hen, achter de wagens en achter het leger, tot aan Haroseth der heidenen. En het hele leger van Sisera viel door de scherpte van het zwaard, zodat er niemand overbleef. Maar Sisera vluchtte te voet naar de tent van Jaël, de vrouw van Heber, de Keniet; want er was vrede tussen Jabin, de koning van Hazor, en het huis van Heber, de Keniet.", "Jes 42:8": "Ik ben de HEERE, dat is Mijn Naam; en Mijn eer zal Ik aan geen ander geven, noch Mijn lof aan de gesneden beelden.", "Richt 4:7": "En Ik zal aan de beek Kison tot u trekken Sisera, de legeraanvoerder van Jabin, met zijn wagens en zijn menigte; en Ik zal hem in uw hand geven?", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Jes 38:3": "En hij zei: Och HEERE, denk er toch aan dat ik voor Uw gezicht in waarheid en met een volkomen hart gewandeld heb, en dat ik gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg hard.", "Hagg 2:9": "Mijn is het zilver, en Mijn is het goud, spreekt de HEERE van de heerscharen.", "2 Sam 7:25-29": "Nu dan, HEERE God, doe dit woord, dat U over Uw knecht en over zijn huis gesproken hebt, blijven bestaan tot in eeuwigheid, en doe zoals U gesproken hebt. En laat Uw Naam groot gemaakt worden tot in eeuwigheid, zodat men zegt: De HEERE van de heerscharen is God over Israël; en het huis van Uw knecht David zal bestendig zijn voor Uw aangezicht. Want U, HEERE van de heerscharen, God van Israël! U hebt het voor het oor van Uw knecht geopenbaard, en gezegd: Ik zal u een huis bouwen; daarom heeft Uw knecht in zijn hart gevonden, dit gebed tot U te bidden.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Ps 42:10": "Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?", "Ezech 18:4": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "Ps 35:5": "Laat hen worden als kaf voor de wind, en de Engel van de HEERE drijft hen weg.", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "Ps 25:6": "Zain. Gedenk, HEERE! Uw barmhartigheden en Uw blijken van goedertierenheid, want die zijn er van eeuwigheid.", "Ps 103:19": "De HEERE heeft Zijn troon in de hemelen bevestigd, en Zijn Koninkrijk heerst over alles.", "Ps 143:11": "O HEERE, maak mij levend, om Uw Naam; voer mijn ziel uit de benauwdheid, om Uw gerechtigheid.", "Jer 18:19": "HEERE, luister naar mij, en hoor naar de stem van hen die met mij twisten.", "Richt 4:24": "En de hand van de Israëlieten ging steeds voort, en werd zwaarder over Jabin, de koning van Kanaän, totdat zij Jabin, de koning van Kanaän, uitgeroeid hadden.", "Jer 18:1-23": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei: Maak u op en ga naar het huis van de pottenbakker, en daar zal Ik u Mijn woorden doen horen. Zo ging ik naar het huis van de pottenbakker; en zie, hij maakte een werk op de schijven.", "Ps 77:8-10": "Zal de Heere dan voor eeuwig verstoten, en voortaan niet meer goedgunstig zijn? Houdt Zijn goedertierenheid voor eeuwig op? Heeft de toezegging een einde, van geslacht tot geslacht? Heeft God vergeten genadig te zijn? Heeft Hij Zijn barmhartigheden door toorn toegesloten? Sela.", "Joz 8:33": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen.", "Ps 119:84": "Hoeveel zullen de dagen van Uw knecht zijn? Wanneer zult U recht doen over mijn vervolgers?", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "Ps 129:5": "Laat hen beschaamd worden en achteruitgedreven, allen die Sion haten.", "Ps 31:21": "U verbergt hen in het verborgene van Uw aangezicht voor de hoogmoedigheden van de man; U versteekt hen in een hut voor de twist van de tongen.", "Ps 22:29": "Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen.", "1 Sam 13:19": "En er werd geen smid gevonden in het hele land van Israël; want de Filistijnen hadden gezegd: Anders maken de Hebreeën zwaard of speer.", "Ps 89:40-52": "Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen. Allen die de weg voorbijgingen, hebben hem beroofd; voor zijn naburen is hij tot een smaad geweest.", "Ps 109:21-27": "Maar U, o HEERE Heere! doe met mij naar wat past bij Uw Naam; omdat Uw goedertierenheid goed is, verlos mij. Want ik ben ellendig en behoeftig, en mijn hart is in mijn binnenste doorwond. Ik ga heen als een schaduw wanneer die zich neigt; ik word omgedreven als een sprinkhaan.", "Deut 33:11": "Zegen, HEERE! zijn vermogen, en laat U het werk van zijn handen goed bevallen; versla de lenden van hen die tegen hem opstaan en hem haten, zodat zij niet weer opstaan!", "Ps 69:28": "Doe misdaad bij hun misdaad, en laat hen niet komen tot Uw gerechtigheid.", "Joz 17:11": "Want Manasse had, in Issaschar en in Aser, Beth-Sean en haar onderhorige plaatsen, en Jibleam en haar onderhorige plaatsen, en de inwoners van Dor en haar onderhorige plaatsen, en de inwoners van En-Dor en haar onderhorige plaatsen, en de inwoners van Thaänach en haar onderhorige plaatsen, en de inwoners van Megiddo en haar onderhorige plaatsen: drie landstreken.", "Jes 9:3": "Want het juk van hun last, en de stok van hun schouders, en de staf van hem die hen dreef, hebt U verbroken, zoals op de dag van de Midianieten;", "Richt 4:13": "Zo riep Sisera al zijn wagens bijeen, negenhonderd ijzeren wagens, en al het volk dat met hem was, van Haroseth der heidenen tot de beek Kison.", "Ps 40:14": "Het behaagt U, HEERE! mij te verlossen; HEERE! haast U tot mijn hulp.", "Jer 20:12": "Gij dan, o HEERE van de heerscharen, Die de rechtvaardige beproeft, Die de nieren en het hart ziet, laat mij Uw wraak op hen zien, want ik heb U mijn rechtszaak voorgelegd.", "Neh 4:5": "Dek hun ongerechtigheid niet toe, en laat hun zonde niet uitgewist worden van voor Uw aangezicht, want zij hebben U getergd, tegenover de bouwers.", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Spr 8:34": "Gelukkig is de mens die naar Mij hoort, dagelijks wakend aan Mijn poorten, wachtend bij de posten van Mijn deuren.", "Ps 83:2-19": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "Matt 6:10": "Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.", "2 Kon 9:37": "En het dode lichaam van Izebel zal zijn als mest op het veld, in het stuk land van Jizreël, zodat men niet zal kunnen zeggen: Dit is Izebel.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Ps 9:20": "Sta op, HEERE, laat de mens zich niet versterken; laat de heidenen voor Uw aangezicht geoordeeld worden.", "2 Kon 16:9": "Zo luisterde de koning van Assyrië naar hem; want de koning van Assyrië trok op tegen Damaskus, en nam het in, en voerde de bevolking gevankelijk weg naar Kir, en hij doodde Rezin.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Deut 4:35": "Aan u is het getoond, opdat u weet dat de HEERE die God is; er is niemand anders dan Hij alleen!", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "Dan 6:11": "Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.", "Ps 27:12": "Geef mij niet over in de begeerte van mijn tegenstanders; want valse getuigen zijn tegen mij opgestaan, alsook wie geweld uitblaast.", "Jes 9:10": "Want de HEERE zal Rezins tegenstanders tegen hem opheffen, en Hij zal zijn vijanden samen verenigen:", "Deut 4:29": "Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Deut 3:25": "Laat mij toch oversteken, en dat goede land bezien, dat aan de overkant van de Jordaan is, dat goede gebergte, en de Libanon!", "1 Kron 22:19": "Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Ps 142:3": "Ik stortte mijn klacht uit voor Zijn aangezicht; ik maakte voor Zijn aangezicht mijn benauwdheid bekend.", "Job 13:21": "Doe Uw hand ver van mij weg, en laat Uw verschrikking mij niet verbaasd maken.", "Ps 77:2": "Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen.", "Jes 45:19": "Ik heb niet in het verborgene gesproken, op een donkere plaats van de aarde; Ik heb tegen het zaad van Jakob niet gezegd: Zoekt Mij tevergeefs; Ik ben de HEERE, Die gerechtigheid spreekt, Die rechtmatige dingen verkondigt.", "Ps 35:22": "HEERE! U hebt het gezien, zwijg niet; Heere! Wees niet ver van mij.", "Ps 69:24": "Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Job 12:9": "Wie weet niet, uit al deze dingen, dat de hand van de HEERE dit doet?", "Ps 106:47": "Verlos ons, HEERE, onze God! en verzamel ons uit de heidenen, opdat wij de Naam van Uw heiligheid loven, ons beroemend in Uw lof.", "Ps 39:14": "Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.", "Openb 11:4": "Dezen zijn de twee olijfbomen en de twee kandelaars, die voor de God van de aarde staan.", "Ps 6:2-8": "O HEERE, straf mij niet in Uw toorn, en tuchtig mij niet in Uw grimmigheid! Wees mij genadig, HEERE, want ik ben verzwakt; genees mij, HEERE, want mijn beenderen zijn verschrikt. Ja, mijn ziel is zeer verschrikt; en U, HEERE, hoe lang nog?", "Ps 10:16": "De HEERE is Koning eeuwig en altijd; de heidenen zijn vergaan uit Zijn land.", "Ps 79:10-12": "Waarom zouden de heidenen zeggen: Waar is hun God? Laat de wraak van het vergoten bloed van Uw knechten onder de heidenen voor onze ogen bekend worden. Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn. En geef onze buren zevenvoudig terug in hun schoot hun smaad, waarmee zij U, o Heere, gesmaad hebben.", "Luk 14:26-33": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn. En wie zijn kruis niet draagt en Mij navolgt, die kan Mijn discipel niet zijn. Want wie van u die een toren wil bouwen, gaat niet eerst zitten om de kosten te berekenen, of hij wel genoeg heeft om het af te maken?", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Joz 10:1-5": "Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren; Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:", "Ps 31:4": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "Hand 22:22": "Zij luisterden naar hem tot dit woord toe; en toen verhieven zij hun stem en zeiden: Weg van de aarde met zo iemand, want het is niet behoorlijk dat hij leeft.", "Job 34:24": "Hij vermorzelt de geweldigen, dat men het niet doorzoeken kan, en stelt anderen in hun plaats.", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Ps 27:8": "Mijn hart zegt tegen U: U zegt: Zoek Mijn aangezicht; ik zoek Uw aangezicht, o HEERE!", "Jer 10:24": "Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat U mij niet te niet maakt.", "Jes 8:9-12": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden! Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons! Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "1 Sam 28:7": "Toen zei Saul tegen zijn dienaren: Zoek voor mij een vrouw die een waarzeggende geest heeft, zodat ik naar haar toe ga en door haar onderzoek doe. Zijn dienaren nu zeiden tegen hem: Zie, in Endor is een vrouw die een waarzeggende geest heeft.", "Ps 119:154": "Twist mijn twistzaak, en verlos mij, maak mij levend, naar Uw toezegging.", "Jer 17:17": "Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.", "Matt 26:44": "En Hij liet hen achter, ging opnieuw weg, en bad voor de derde keer, met dezelfde woorden.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Ps 69:17": "Verhoor mij, o HEERE, want Uw goedertierenheid is goed; zie mij aan naar de grootheid van Uw barmhartigheden.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "Ps 136:3": "Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Jer 32:27": "Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?", "Klaagl 3:26": "Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Ps 35:1-3": "Een psalm van David. Twist, HEERE, met wie tegen mij twisten; strijd tegen wie tegen mij strijden. Grijp het schild en de rondas, en sta op tot mijn hulp. En breng de spies naar voren, en sluit de weg toe voor mijn vervolgers; zeg tegen mijn ziel: Ik ben uw Heil.", "Hand 16:22": "En de menigte kwam gezamenlijk tegen hen in opstand; en de aanvoerders scheurden hun de kleren af en gaven bevel hen te geselen.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Amos 5:14": "Zoek het goede, en niet het kwade, opdat u leeft; en zo zal de HEERE, de God van de heerscharen¹, met u zijn, zoals u zegt.", "Ps 145:11-13": "Caph. Zij zullen de heerlijkheid van Uw Koninkrijk vermelden, en Uw macht zullen zij uitspreken. Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk. Mem. Uw Koninkrijk is een Koninkrijk van alle eeuwen, en Uw heerschappij is in alle geslacht en geslacht.", "Ps 25:16-19": "Pe. Wend U tot mij, en wees mij genadig, want ik ben eenzaam en ellendig. Tsade. De benauwdheden van mijn hart hebben zich wijd uitgestrekt; voer mij uit mijn noden. Resch. Zie mijn ellende, en mijn moeite, en neem al mijn zonden weg.", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Dan 4:24-26": "Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal: Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil. Dat er ook gezegd is dat men de stronk met de wortels van die boom zou laten staan; uw koninkrijk zal u zeker blijven, nadat u zult hebben erkend dat de Hemel heerst.", "Openb 17:13": "Dezen hebben één en dezelfde gezindheid, en zullen hun kracht en macht aan het beest overgeven.", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Ps 27:5": "Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.", "Ps 59:14": "Verteer hen in grimmigheid; verteer hen, zodat zij er niet meer zijn, en laat hen weten dat God Heerser is in Jakob, ja, tot aan de einden van de aarde. Sela.", "Hand 4:25-27": "Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht? De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde. Want in waarheid zijn tegen Uw heilig Kind Jezus, Die U gezalfd hebt, bijeengekomen, zowel Herodes en Pontius Pilatus, met de heidenen en de volken van Israël;", "Joz 11:1-5": "Het gebeurde daarna, toen Jabin, de koning van Hazor, dit hoorde, dat hij een boodschap stuurde naar Jobab, de koning van Madon, en naar de koning van Simron, en naar de koning van Achsaf, En naar de koningen die tegen het noorden op het gebergte, en op het vlakke, tegen het zuiden van Cinneroth, en in de laagte, en in Nafoth-dor, aan de zee waren; Tot de Kanaänieten tegen het oosten en tegen het westen, en de Amorieten, en de Hethieten, en de Ferezieten; en de Jebusieten op het gebergte, en de Hevieten onder aan Hermon, in het land van Mizpa.", "2 Sam 16:10-12": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd. Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "Ps 130:6": "Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen.", "Ps 119:134": "Verlos mij van de overlast van de mens, en ik zal Uw bevelen onderhouden.", "Ps 7:8": "Zo zal de vergadering van de volken U omringen; keer dan boven haar terug in de hoogte.", "Richt 4:2": "Zo verkocht de HEERE hen in de hand van Jabin, koning van de Kanaänieten, die te Hazor regeerde; en zijn legeraanvoerder was Sisera; hij woonde in Haroseth der heidenen.", "Ef 4:6": "Eén God en Vader van allen, Die boven allen is, en door allen, en in u allen.", "Jes 7:5-7": "Omdat de Syriër kwaad tegen u beraadslaagd heeft, samen met Efraïm en de zoon van Remalia, en gezegd heeft: Laten wij optrekken tegen Juda, en het schrik aanjagen, en het onder ons verdelen, en de zoon van Tabeal koning maken in hun midden. Zo zegt de Heere HEERE: Het zal niet standhouden, en het zal niet gebeuren.", "Ps 28:1": "Een psalm van David. Tot U roep ik, HEERE! Mijn Rotssteen, houd U niet als doof van mij af; anders, als U zich stil houdt voor mij, word ik gelijk aan degenen die in de kuil neerdalen.", "Ps 74:4": "Uw tegenstanders hebben in het midden van Uw vergaderplaatsen gebruld; zij hebben hun eigen tekens tot tekens gesteld.", "Zef 1:17": "En Ik zal de mensen bang maken, zodat zij zullen gaan als de blinden; want zij hebben tegen de HEERE gezondigd; en hun bloed zal vergoten worden als stof, en hun vlees zal worden als drek.", "Ezech 25:5": "En Ik zal Rabba tot een kameelstal maken, en de kinderen van Ammon tot een schaapskooi; en u zult weten dat Ik de HEERE ben.", "Amos 1:9": "Zo zegt de HEERE: Om drie overtredingen van Tyrus, en om vier zal Ik dat niet afwenden; omdat zij Mijn volk met een volledige wegvoering hebben overgeleverd aan Edom, en niet gedacht hebben aan het verbond van de broeders.", "1 Kron 19:7": "zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde.", "Richt 8:12-21": "En Zebah en Tsalmuna vluchtten; maar hij achtervolgde hen, en ving de beide koningen van de Midianieten, Zebah en Tsalmuna, en bracht het hele leger in verwarring. Toen Gideon, de zoon van Joas, uit de strijd terugkeerde, vóór zonsopgang, ving hij een jongeman van de mensen van Sukkoth, en ondervroeg hem; die schreef voor hem de leiders van Sukkoth op, en hun oudsten, zevenenzeventig man.", "Hand 23:12": "En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben.", "Num 20:16": "Toen riepen wij tot de HEERE, en Hij hoorde onze stem, en Hij zond een Engel, en Hij leidde ons uit Egypte; en zie, wij zijn te Kades, een stad aan de rand van uw gebied.", "Ps 83:14-18": "Mijn God! Maak hen als een wervelwind, als stoppels voor de wind. Zoals het vuur een woud verbrandt, en zoals de vlam de bergen in brand steekt; vervolg hen zo met Uw onweer, en verschrik hen met Uw storm.", "Ps 109:28": "Laat hen vloeken, maar zegen Ú; laat hen opstaan, maar laat hen beschaamd worden; maar laat Uw knecht zich verblijden.", "Ps 47:9": "God regeert over de heidenen; God zit op de troon van Zijn heiligheid.", "2 Kron 16:2-9": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei: Er is een verbond tussen mij en u, en tussen mijn vader en uw vader; zie, ik zend u zilver en goud; ga heen, verbreek uw verbond met Baësa, de koning van Israël, zodat hij van tegen mij aftrekt. En Benhadad hoorde naar de koning Asa, en zond de aanvoerders van de legers die hij had, tegen de steden van Israël, en zij sloegen Ijon, en Dan, en Abel-Maim, en alle schatsteden van Naftali.", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Ps 56:7": "Zij rotten samen, zij versteken zich, zij letten op mijn hielen, zoals zij die op mijn ziel wachten.", "Dan 5:20-23": "Maar toen zijn hart zich verhief, en zijn geest verstijfd werd tot hoogmoed, werd hij van de troon van zijn koninkrijk afgestoten, en men nam de eer van hem weg. En hij werd van de mensenkinderen verstoten, en zijn hart werd gelijk gemaakt aan de dieren, en zijn woning was bij de woudezels; men gaf hem gras te eten zoals de ossen; en zijn lichaam werd nat gemaakt door de dauw van de hemel, totdat hij erkende dat God, de Allerhoogste, Heerser is over de koninkrijken van de mensen, en daarover stelt wie Hij wil. En u, Belsazar, zijn zoon! U hebt uw hart niet vernederd, hoewel u dit alles goed geweten hebt.", "Ps 79:10": "Waarom zouden de heidenen zeggen: Waar is hun God? Laat de wraak van het vergoten bloed van Uw knechten onder de heidenen voor onze ogen bekend worden.", "Ezech 29:16": "En het zal voor het huis van Israël niet meer tot een vertrouwen zijn, dat hen aan de ongerechtigheid doet denken, wanneer zij naar hen omzien; maar zij zullen weten dat Ik de Heere HEERE ben.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Luk 11:9-13": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden. En welke vader onder u zal, als de zoon hem om brood vraagt, hem een steen geven? Of ook, als hij om een vis vraagt, zal hij hem in plaats van een vis een slang geven?", "2 Sam 10:15": "Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich weer samen.", "Ps 55:16": "Laat de dood hen overvallen als een schuldeiser, laat hen levend in het dodenrijk neerdalen; want boosheden zijn in hun woning, in hun binnenste.", "Joz 7:9": "Als de Kanaänieten en alle inwoners van het land dit horen, zullen zij ons omsingelen, en onze naam van de aarde uitroeien; wat zult U dan doen voor Uw grote Naam?", "Hand 19:28-41": "Toen zij dit nu hoorden, werden zij vol toorn, en riepen: Groot is de Diana van de Efezeërs! En de gehele stad werd vol verwarring; en zij liepen eendrachtig met een geroep naar de schouwplaats, en sleepten Gajus en Aristarchus mee, Macedoniërs, reisgenoten van Paulus. En toen Paulus naar het volk toe wilde gaan, lieten de discipelen hem dat niet toe.", "Ps 119:41": "Vau. En dat mij Uw blijken van goedertierenheid overkomen, o HEERE! Uw heil, naar Uw toezegging;", "Ps 115:2": "Waarom zouden de heidenen zeggen: Waar is nu hun God?", "Ps 74:10": "Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?", "Num 14:13-18": "En Mozes zei tegen de HEERE: Dan zullen de Egyptenaren het horen; want U hebt door Uw kracht dit volk uit hun midden doen optrekken; en zij zullen het zeggen tegen de inwoners van dit land, die gehoord hebben dat U, HEERE, in het midden van dit volk bent; dat U, HEERE, oog in oog gezien wordt, dat Uw wolk over hen staat, en U voor hun aangezicht gaat in een wolkkolom overdag, en in een vuurkolom 's nachts. En zou U dit volk als één man doden, dan zouden de heidenvolken, die het bericht over U gehoord hebben, zeggen:", "Ps 40:16": "Laat hen verwoest worden tot loon van hun beschaming, die van mij zeggen: Ha, ha!", "2 Sam 10:6": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man.", "Gen 24:3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Spr 28:5": "De kwade mensen begrijpen het recht niet; maar wie de HEERE zoeken, begrijpen alles.", "Ps 75:7": "Want het verhogen komt niet uit het oosten, noch uit het westen, noch uit de woestijn;", "Ps 119:22": "Wentel van mij smaad en verachting, want ik heb Uw getuigenissen onderhouden.", "Ps 69:33": "De zachtmoedigen, als zij dit gezien hebben, zullen zich verblijden; en u die God zoekt, uw hart zal leven.", "Deut 10:14": "Zie, van de HEERE, van uw God, is de hemel, en de hemel der hemelen, de aarde, en al wat daarin is.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Ezech 38:23": "Zo zal Ik Mij groot maken, en Mij heiligen, en bekend worden voor de ogen van veel heidenen; en zij zullen weten dat Ik de HEERE ben.", "1 Kon 8:59": "En dat deze mijn woorden, waarmee ik voor de HEERE gesmeekt heb, nabij mogen zijn bij de HEERE, onze God, dag en nacht; opdat Hij het recht van Zijn dienaar uitvoert, en het recht van Zijn volk Israël, elke dag opnieuw.", "Ps 115:3": "Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "Ps 35:26": "Laat hen beschaamd worden en samen schaamrood, die zich in mijn kwaad verblijden; laat hen met schaamte en schande bekleed worden, die zich tegen mij groot maken.", "1 Kron 5:10": "En in de dagen van Saul voerden zij oorlog tegen de Hagarenen, die vielen door hun hand; en zij woonden in hun tenten over de gehele oostzijde van Gilead.", "Ps 54:3-5": "O God! Verlos mij door Uw Naam, en doe mij recht door Uw macht. O God! Hoor mijn gebed; neig Uw oren tot de woorden van mijn mond. Want vreemden staan tegen mij op, en tirannen zoeken mijn ziel; zij stellen God niet voor hun ogen. Sela.", "Lev 10:3": "En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Ps 2:1": "Waarom woeden de heidenen, en bedenken de volken iets zinloos?", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Ps 17:2": "Laat mijn recht van voor Uw aangezicht uitgaan, laat Uw ogen aanschouwen wat recht is.", "Job 8:6": "als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "2 Kron 33:12": "En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,", "Hand 17:27": "Opdat zij de Heere zouden zoeken, of zij Hem misschien konden tasten en vinden; hoewel Hij niet ver is van ieder van ons.", "Dan 4:25": "Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil.", "1 Kron 5:20": "Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden.", "Ex 14:17": "En Ik, zie, Ik zal het hart van de Egyptenaren verstokken, zodat zij achter hen aan daarin gaan; en Ik zal verheerlijkt worden aan Farao en aan zijn hele leger, aan zijn wagens en aan zijn ruiters.", "Neh 6:14": "Denk toch, mijn God, aan Tobia en aan Sanballat, naar deze daden van hen; en ook aan de profetes Noadja en de andere profeten, die mij bang hebben proberen te maken.", "Ps 135:6": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.", "1 Sam 1:10": "Zij dan, bitter bedroefd zijnde, bad tot de HEERE, en zij weende zeer.", "Ps 38:2-23": "O HEERE! Straf mij niet in Uw grote toorn, en straf mij niet in Uw grimmigheid. Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald. Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "2 Sam 10:16": "En Hadad-Ezer zond heen, en liet de Syriërs uitkomen, die aan de overzijde van de rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-Ezers legeraanvoerder, trok voor hun aangezicht heen.", "2 Kron 22:5": "Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.", "Jes 17:12-14": "Wee de veelheid van de grote volken, die bruisen als de zeeën bruisen; en wee het geraas van de naties, die ruisen als de geweldige wateren ruisen! De naties zullen wel ruisen, zoals grote wateren ruisen; maar Hij zal het bestraffen, zo zal het ver wegvluchten, ja, het zal opgejaagd worden als het kaf van de bergen voor de wind, en als een bal voor de wervelwind. Ten tijde van de avond, zie, dan is er verschrikking; voordat het morgen is, is hij er niet meer. Dit is het deel van hen die ons beroven, en het lot van hen die ons plunderen.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Ps 119:124": "Doe bij Uw knecht naar Uw goedertierenheid, en leer mij Uw inzettingen.", "Klaagl 3:56-63": "Koph. U hebt mijn stem gehoord, verberg Uw oor niet voor mijn zuchten, voor mijn roepen. Koph. U bent tot mij genaderd op de dag dat ik U aanriep; U hebt gezegd: Vrees niet! Resch. Heere! U hebt de rechtszaken van mijn ziel bepleit, U hebt mijn leven verlost.", "Gen 19:38": "En de jongste baarde ook een zoon, en noemde hem Ben-Ammi; deze is de vader van de nakomelingen van Ammon, tot op deze dag.", "1 Sam 12:9": "Maar zij vergaten de HEERE, hun God; zo verkocht Hij hen in de hand van Sisera, de legeraanvoerder van Hazor, en in de hand van de Filistijnen, en in de hand van de koning van de Moabieten, die tegen hen streden.", "2 Kor 12:8": "Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken.", "Hebr 11:6": "Maar zonder geloof is het onmogelijk God te behagen. Want wie tot God komt, moet geloven dat Hij bestaat, en dat Hij Beloner is van hen die Hem zoeken.", "2 Kron 6:24-39": "En wanneer Uw volk Israël voor het aangezicht van de vijand geslagen zal worden, omdat zij tegen U gezondigd zullen hebben, en zich bekeren, en Uw Naam belijden, en voor Uw aangezicht in dit huis bidden en smeken zullen, Hoor U dan uit de hemel, en vergeef de zonden van Uw volk Israël, en breng hen terug in het land dat U hun en hun vaders gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben, en zij in deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Ps 93:2": "Van toen af is Uw troon bevestigd, U bent van eeuwigheid af.", "Hand 7:48": "Maar de Allerhoogste woont niet in tempels die met handen gemaakt zijn; zoals de profeet zegt:", "Ps 71:13": "Laat hen beschaamd worden, laat hen verteerd worden, die mijn ziel tegenstaan; laat hen met smaad en schande overdekt worden, die mijn kwaad zoeken.", "2 Sam 15:31": "Toen liet men David weten, en zei: Achitofel is onder degenen die zich met Absalom hebben verbonden. Toen zei David: HEERE, maak toch de raad van Achitofel tot dwaasheid.", "Amos 5:4-6": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef. Maar zoek Beth-el niet, en kom niet naar Gilgal, en trek niet over naar Ber-seba; want Gilgal zal zeker in gevangenschap weggevoerd worden, en Beth-el zal tot niets worden. Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Ps 50:10-12": "Want al het gedierte van het woud is Mijn, de dieren op duizend bergen. Ik ken al het gevogelte van de bergen, en het wild van het veld is bij Mij. Zo Mij hongerde, Ik zou het u niet zeggen; want Mijn is de wereld en haar volheid.", "Jes 40:22": "Hij is het, Die daar zit boven de kring van de aarde, en haar inwoners zijn als sprinkhanen; Hij is het, Die de hemel uitspant als een dunne doek, en breidt hem uit als een tent, om te bewonen;", "Ps 9:17": "De HEERE is bekend geworden; Hij heeft recht gedaan; de goddeloze is verstrikt in het werk van zijn handen! Higgajon, Sela.", "1 Kron 29:12": "En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.", "2 Kron 20:11": "Zie dan, zij vergelden ons dit, doordat zij komen om ons uit Uw erfbezit te verdrijven, dat U ons als erfdeel gegeven hebt.", "Ezech 25:11": "Ik zal ook in Moab strafgerichten voltrekken; en zij zullen weten dat Ik de HEERE ben.", "Ps 24:1": "Een psalm van David. De aarde is van de HEERE, alsook haar volheid, de wereld, en zij die daarin wonen.", "Num 16:22": "Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?", "2 Kron 28:16": "In diezelfde tijd zond koning Achaz tot de koningen van Assyrië, dat zij hem zouden helpen.", "Klaagl 1:22": "Thau. Laat al hun kwaad voor Uw aangezicht komen, en doe hun, zoals Gij mij gedaan hebt vanwege al mijn overtredingen; want mijn zuchtingen zijn veel, en mijn hart is mat.", "Ps 55:2-18": "O God! neem mijn gebed ter ore, en verberg U niet voor mijn smeking. Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier; Om het geroep van de vijand, vanwege de beangstiging van de goddeloze; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.", "Matt 20:15": "Of mag ik met het mijne niet doen wat ik wil? Of is uw oog boos, omdat ik goed ben?", "Ps 63:2-9": "O God! U bent mijn God! Ik zoek U in de dageraad; mijn ziel dorst naar U; mijn lichaam verlangt naar U, in een land, dor en mat, zonder water. Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien; Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen.", "Klaagl 5:1": "Denk, HEERE, aan wat ons gebeurd is, kijk ernaar en zie onze smaad aan.", "Neh 5:13": "Ook schudde ik mijn boezem uit, en zei: Zo schudde God uit iedere man die dit woord niet zal nakomen, uit zijn huis en uit zijn arbeid, en hij worde zo uitgeschud en leeg. En de hele gemeente zei: Amen! En zij prezen de HEERE. En het volk deed volgens dit woord.", "Ps 24:10": "Wie is Hij, deze Koning der ere? De HEERE van de heerscharen, Die is de Koning der ere. Sela.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Ps 79:1": "Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt.", "Ps 85:6-8": "Zult U eeuwig tegen ons toornen? Zult U Uw toorn uitstrekken van geslacht tot geslacht? Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt? Toon ons Uw goedertierenheid, o HEERE, en geef ons Uw heil.", "Jer 16:4": "Zij zullen pijnlijke doden sterven, zij zullen niet beklaagd en niet begraven worden, zij zullen tot mest op de aardbodem zijn, en zij zullen door het zwaard en door de honger verteerd worden, en hun dode lichamen zullen voedsel zijn voor de vogels van de hemel en voor de dieren van de aarde.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Hos 3:5": "Daarna zullen de kinderen van Israël zich bekeren, en de Heere, hun God, zoeken, en David, hun Koning; en zij zullen vol ontzag komen tot de Heere en tot Zijn goedheid, in de laatste dagen.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Openb 3:20": "Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.", "Ps 144:6": "Bliksem met bliksem, en verstrooi hen; zend Uw pijlen uit, en vernietig hen.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Klaagl 3:64-66": "Thau. HEERE! geef hun de vergelding terug, naar het werk van hun handen. Thau. Geef hun een verharding van het hart; Uw vloek zij over hen! Thau. Vervolg hen met toorn, en verdelg hen van onder de hemel van de HEERE.", "Job 41:2": "Wie heeft Mij iets gegeven, dat Ik het hem zou vergelden? Wat onder de hele hemel is, is van Mij.", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "Ezech 11:10-12": "U zult door het zwaard vallen; in het gebied van Israël zal Ik u oordelen, en u zult weten dat Ik de HEERE ben. Deze stad zal u niet tot een pot zijn, en u zult in het midden daarvan niet tot vlees zijn; in het gebied van Israël zal Ik u oordelen. En u zult weten dat Ik de HEERE ben, omdat u in Mijn inzettingen niet gewandeld hebt, en Mijn rechten niet gedaan hebt, maar naar de rechten van de heidenvolken die rondom u zijn, gedaan hebt.", "Jer 27:8": "En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.", "1 Kron 19:6": "Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba;", "2 Kron 15:12": "En zij sloten een verbond, dat zij de HEERE, de God van hun vaderen, zouden zoeken met hun hele hart en met hun hele ziel.", "Ps 29:10": "De HEERE heeft gezeten over de watervloed; ja, de HEERE zit, Koning in eeuwigheid.", "Num 24:9": "Hij heeft zich gekromd, hij heeft zich neergelegd, als een leeuw, en als een oude leeuw; wie zal hem doen opstaan? Wie u zegent, die zij gezegend, en vervloekt zij wie u vervloekt!", "Ps 75:6": "Verhoog uw hoorn niet omhoog; spreek niet met stijve hals.", "2 Kon 19:19": "Nu dan, HEERE, onze God, verlos ons toch uit zijn hand; zo zullen alle koninkrijken van de aarde weten dat U, HEERE, alleen God bent.", "Ps 86:1-5": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Richt 7:22-25": "Toen de driehonderd op de bazuinen bliezen, richtte de HEERE het zwaard van de een tegen de ander, door het hele leger heen; en het leger vluchtte tot Beth-sitta toe, naar Tseredath, tot aan de grens van Abel-mehola, boven Tabbath. Toen werden de mannen van Israël bijeengeroepen, uit Nafthali, en uit Aser, en uit heel Manasse; en zij achtervolgden de Midianieten. Ook zond Gideon boden naar heel het gebergte van Efraïm, en zei: Kom naar beneden, de Midianieten tegemoet, en neem hun de wateren af, tot aan Beth-bara, namelijk de Jordaan; zo werd elke man van Efraïm bijeengeroepen, en zij namen hun de wateren af tot aan Beth-bara, en de Jordaan.", "Ps 74:12": "Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Job 33:13": "Waarom hebt u tegen Hem getwist? Want Hij antwoordt niet van al Zijn daden.", "Ps 89:50-52": "Heere! waar zijn Uw vorige blijken van goedertierenheid, die Gij David gezworen hebt bij Uw trouw? Gedenk, Heere! aan de smaad van Uw knechten, die ik in mijn boezem draag, van alle grote volken. Waarmee, o HEERE! Uw vijanden smaden, waarmee zij de voetstappen van Uw gezalfde smaden.", "Ps 108:13": "Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Jona 2:1-10": "En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis. En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.", "Ps 20:2": "De HEERE verhoort u in de dag van benauwdheid; de Naam van de God van Jakob zet u in een hoog vertrek.", "Ps 58:8": "Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren.", "Ezech 30:26": "En Ik zal de Egyptenaars verstrooien onder de heidenvolken, en zal hen verspreiden in de landen; zo zullen zij weten dat Ik de HEERE ben.", "Ps 38:17": "Want ik zei: Laat hen zich toch over mij niet verblijden! Wanneer mijn voet zou wankelen, zouden zij zich tegen mij groot maken.", "Ps 119:82": "Mijn ogen zijn bezweken van verlangen naar Uw toezegging, terwijl ik zei: Wanneer zult U mij vertroosten?", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Ps 109:7": "Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden.", "Ps 79:8": "Denk ons de vorige misdaden niet aan; haast U, laat Uw barmhartigheden ons tegemoetkomen; want wij zijn zeer zwak geworden.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Zach 4:14": "Toen zei Hij: Deze zijn de twee olietakken, die voor de Heere van de hele aarde staan.", "Klaagl 3:37": "Mem. Wie zegt iets, en het gebeurt, als de Heere het niet beveelt?", "Num 31:7": "En zij streden tegen de Midianieten, zoals de HEERE Mozes geboden had, en zij doodden alles wat mannelijk was.", "Gal 1:9": "Zoals wij al eerder gezegd hebben, zeg ik het nu ook weer: als iemand u een evangelie verkondigt naast wat u ontvangen hebt, laat hij vervloekt zijn.", "Ps 69:7": "Laat hen door mij niet beschaamd worden, die U verwachten, o Heere, HEERE van de heerscharen, laat hen door mij niet te schande worden, die U zoeken, o God van Israël!", "Jer 13:24": "Daarom zal Ik hen verstrooien als een stoppel die wegwaait door een wind uit de woestijn.", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Ps 119:170": "Laat mijn smeken voor Uw aanschijn komen, red mij naar Uw toezegging.", "Luk 6:21": "Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen.", "Ps 89:19": "Want ons schild is van de HEERE, en onze koning is van de Heilige van Israël.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Ps 69:2-37": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel. Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij. Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Ps 105:7": "Hij is de HEERE, onze God; Zijn oordelen zijn over de gehele aarde.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Jes 47:14": "Zie, zij zullen zijn als stoppels, het vuur zal ze verbranden, zij zullen zichzelf niet kunnen rukken uit de macht van de vlam; het zal geen kool zijn om bij te warmen, geen vuur om daarvoor bij neer te zitten.", "Jer 50:4": "In die dagen en op die tijd, spreekt de HEERE, zullen de kinderen van Israël komen, zij en de kinderen van Juda samen; wandelend en wenend zullen zij heengaan, en de HEERE, hun God, zoeken.", "2 Kron 18:1": "Josafat had rijkdom en eer in overvloed; en hij verzwagerde zich aan Achab.", "Ps 142:6-8": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden. Let op mijn geschrei, want ik ben zeer uitgeput; red mij van mijn vervolgers, want zij zijn sterker dan ik. Voer mijn ziel uit de gevangenis, om Uw Naam te loven; de rechtvaardigen zullen mij omringen, wanneer U goed voor mij zult zijn geweest.", "Ps 35:17": "Heere! Hoe lang zult U toezien? Breng mijn ziel weer van hun verwoestingen, mijn eenzame van de jonge leeuwen.", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "Ps 105:4": "Vraagt naar de HEERE en Zijn sterkte; zoekt Zijn aangezicht voortdurend.", "Hand 21:30": "En de hele stad kwam in rep en roer, en het volk liep samen; en zij grepen Paulus en sleepten hem de tempel uit; en meteen werden de deuren gesloten.", "2 Kron 15:13": "En ieder die de HEERE, de God van Israël, niet zou zoeken, zou gedood worden, van klein tot groot, en van man tot vrouw toe.", "Ps 102:25": "Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht.", "1 Kron 5:19-22": "En zij voerden oorlog tegen de Hagarenen, en tegen Jethur, en Nafis, en Nodab. Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden. En zij voerden hun vee gevankelijk weg; van hun kamelen vijftigduizend, en tweehonderdvijftigduizend schapen, en tweeduizend ezels, en honderdduizend mensenzielen.", "Ps 97:9": "Want U, HEERE, bent de Allerhoogste over de hele aarde; U bent zeer hoog verheven boven alle goden.", "Ps 140:2-14": "Red mij, HEERE, van de kwade mens; behoed mij voor de man van geweld; Die veel kwaad in het hart bedenken, elke dag komen zij samen om te oorlogen. Zij scherpen hun tong als een slang; heet addervergif is onder hun lippen. Sela.", "Ps 83:17-19": "Maak hun gezicht vol schande, opdat zij, o HEERE, Uw Naam zoeken. Laat hen beschaamd en verschrikt worden tot in eeuwigheid, en laat hen schaamrood worden, en omkomen; opdat zij weten dat U alleen met Uw Naam de HEERE bent, de Allerhoogste over de hele aarde.", "Dan 4:34": "Aan het einde van deze dagen nu, hief ik, Nebukadnezar, mijn ogen op naar de hemel, want mijn verstand kwam weer in mij; en ik loofde de Allerhoogste, en ik prees en verheerlijkte de Eeuwiglevende, omdat Zijn heerschappij een eeuwige heerschappij is, en Zijn Koninkrijk is van geslacht tot geslacht;", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "Deut 4:39": "Zo zult u vandaag weten, en in uw hart overdenken, dat de HEERE die God is, boven in de hemel en beneden op de aarde, niemand anders!", "Ps 120:2": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong.", "1 Kon 18:37": "Antwoord mij, HEERE, antwoord mij; opdat dit volk erkent dat U, HEERE, die God bent, en dat U hun hart weer terug hebt gebracht.", "Micha 4:13": "Maak u op en dors, dochter van Sion! Want Ik zal uw hoorn ijzer maken, en uw hoeven koper maken, en u zult veel volken verpletteren; en Ik zal hun winst aan de HEERE toewijden, en hun bezit aan de Heere van de hele aarde.", "Ps 59:2-18": "Red mij van mijn vijanden, o mijn God! Stel mij in een hoog vertrek voor hen die tegen mij opstaan. Red mij van de werkers van de ongerechtigheid, en verlos mij van de mannen van het bloed. Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "Ps 119:146": "Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden.", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Jer 15:15": "O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.", "Openb 11:13": "En op datzelfde uur gebeurde er een grote aardbeving, en het tiende deel van de stad viel, en er werden in de aardbeving zevenduizend namen van mensen gedood, en de overigen werden zeer bevreesd, en gaven de God van de hemel heerlijkheid.", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "Ps 99:1": "De HEERE regeert, dat de volken beven; Hij zit tussen de cherubs; de aarde beeft.", "Ps 119:121-123": "Ain. Ik heb recht en gerechtigheid gedaan; geef mij niet over aan mijn onderdrukkers. Wees borg voor Uw knecht ten goede; laat de hoogmoedigen mij niet onderdrukken. Mijn ogen zijn bezweken van verlangen naar Uw heil, en naar de toezegging van Uw rechtvaardigheid.", "Jes 37:16": "O HEERE van de heerscharen¹, God van Israël, Die tussen de cherubs² woont! U Zelf, U alleen bent de God van alle koninkrijken van de aarde; U hebt de hemel en de aarde gemaakt!", "Luk 18:1": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven,", "Luk 20:20-23": "En zij hielden Hem in de gaten, en stuurden spionnen die zichzelf voordeden als rechtvaardige mensen, opdat zij Hem in Zijn woorden konden vangen, om Hem aan de heerschappij en de macht van de stadhouder over te leveren. En zij vroegen Hem: Meester, wij weten dat U juist spreekt en leert, en niemand naar de ogen ziet, maar de weg van God in waarheid leert. Is het ons geoorloofd de keizer belasting te betalen, of niet?", "Deut 29:22-28": "Dan zal het navolgende geslacht zeggen, uw kinderen, die na u opstaan zullen, en de vreemde, die uit een ver land komen zal, als zij de plagen van dit land zullen zien en de ziekten waarmee de HEERE het gekweld heeft; Dat zijn hele aarde zwavel en zout is van de verbranding; die niet bezaaid zal zijn, en geen spruit zal voortgebracht hebben, en geen kruid daarin zal opgekomen zijn; zoals de omkering van Sodom en Gomorra, Adama en Zeboïm, die de HEERE heeft omgekeerd in Zijn toorn en in Zijn grimmigheid; En alle volken zullen zeggen: Waarom heeft de HEERE dit land zo aangedaan? Wat betekent de gloed van deze grote toorn?", "Joh 11:47-53": "De overpriesters dan en de Farizeeën riepen de raad bijeen, en zeiden: Wat zullen wij doen? want deze Mens doet veel tekenen. Als wij Hem zo laten begaan, zullen zij allen in Hem geloven, en de Romeinen zullen komen en zowel onze plaats als ons volk wegnemen. En een van hen, namelijk Kajafas, die dat jaar hogepriester was, zei tegen hen: U begrijpt niets;", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Hand 23:10": "En toen er grote tweedracht ontstond, gaf de aanvoerder, uit vrees dat Paulus door hen verscheurd zou worden, bevel dat het krijgsvolk zou afdalen en hem uit hun midden zou wegrukken en naar de legerplaats brengen.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Jes 64:9-12": "HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting. Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "Ps 79:12": "En geef onze buren zevenvoudig terug in hun schoot hun smaad, waarmee zij U, o Heere, gesmaad hebben.", "Ezech 29:9": "En Egypteland zal worden tot een wildernis en woestheid, en zij zullen weten dat Ik de HEERE ben; omdat hij zegt: De rivier is van mij, en ik heb die gemaakt.", "Job 27:7": "Mijn vijand zij als de goddeloze, en die zich tegen mij opmaakt, als de verkeerde.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "2 Kon 18:19-21": "En Rabsake zei tot hen: Zeg nu tot Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat vertrouwen is dit, waarmee u vertrouwt? U zegt (doch het is een woord der lippen): Er is raad en macht tot de oorlog; op wie vertrouwt u nu, dat u tegen mij rebelleert? Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Joz 10:3-5": "Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei: Kom op tot mij, en help mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen van Israël. Toen werden de vijf koningen van de Amorieten verzameld en trokken op, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en streden tegen haar.", "1 Kon 22:1-4": "En zij bleven drie jaar stil, zodat er geen oorlog was tussen Syrië en Israël. En het gebeurde in het derde jaar, dat Josafat, de koning van Juda, naar de koning van Israël afkwam. Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.", "Jes 42:14": "Ik heb van oudsher gezwegen, Ik heb Mij stil gehouden en Mij ingehouden; Ik zal uitschreeuwen als een barende vrouw, Ik zal ze verwoesten en tegelijk opslokken.", "Ps 141:1-10": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep. Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer. HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "Rom 3:11": "er is niemand die verstandig is, er is niemand die God zoekt.", "Ps 115:1": "Niet ons, o HEERE, niet ons, maar geef aan Uw Naam eer, om Uw goedertierenheid, om Uw waarheid.", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "Jer 14:21": "Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "Openb 11:17": "en zeiden: Wij danken U, Heere God, Almachtige, Die is, en Die was, en Die komen zal! dat U Uw grote kracht hebt aangenomen, en als Koning hebt geheerst;", "Ps 30:11": "Hoor, HEERE! en wees mij genadig; HEERE! wees mij een Helper."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H7892\">Een</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7892\">lied</span>, <span class=\"wl\" data-l=\"L1\" data-code=\"H7892\">een</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4210\">psalm</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4210\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H623\">Asaf</span>.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H430\">O</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H430\">God</span>! <span class=\"wl\" data-l=\"L2\" data-code=\"H1824\">Zwijg</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2790\">niet</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H2790\">houd</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2790\">U</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2790\">niet</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H2790\">doof</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H8252\">en</span> blijf <span class=\"wl\" data-l=\"L4\" data-code=\"H8252\">niet</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8252\">stil</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H410\">o</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H410\">God</span>!", "3": "<span class=\"wl\" data-l=\"L1\" data-code=\"H341\">Want</span> <span class=\"wl\" data-l=
