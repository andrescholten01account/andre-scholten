gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan. U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Hebr 13:14": "Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige.", "Ex 32:33-35": "Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen. Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken! Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had.", "Ps 105:17-20": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf. Men drukte zijn voeten in de stok; zijn persoon kwam in de ijzers. Tot de tijd toe dat Zijn woord kwam, heeft de rede van de HEERE hem doorlouterd.", "Ps 33:7": "Hij verzamelt de wateren van de zee als op een hoop; Hij legt de diepten in schatkamers.", "Job 36:6": "Hij laat de goddeloze niet leven, en het recht van de ellendigen verschaft Hij.", "Rom 3:7": "Want als de waarheid van God door mijn leugen overvloediger is geworden, tot Zijn heerlijkheid, waarom word ik dan ook nog als een zondaar geoordeeld?", "Ps 71:14": "Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.", "Ps 145:1-21": "Een lofzang van David. Aleph. O mijn God, U Koning! Ik zal U verhogen, en Uw Naam loven voor eeuwig en altijd. Beth. Elke dag zal ik U loven, en Uw Naam prijzen voor eeuwig en altijd. Gimel. De HEERE is groot en zeer te prijzen, en Zijn grootheid is ondoorgrondelijk.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "Luk 1:78": "door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;", "1 Kor 13:13": "En nu blijven geloof, hoop en liefde, deze drie; maar de meeste van deze is de liefde.", "Job 36:15": "Hij zal de ellendige in zijn ellende bevrijden, en in de onderdrukking zal Hij voor hun oor openbaren.", "Ps 22:24": "U die de HEERE vreest, prijs Hem; al u nageslacht van Jakob, vereer Hem; en ontzie u voor Hem, al u nageslacht van Israël!", "Job 7:6-10": "Mijn dagen zijn lichter geweest dan een weversspoel, en zijn vergaan zonder verwachting. Bedenk, dat mijn leven een wind is; mijn oog zal niet terugkomen, om het goede te zien. Het oog van hem die mij nu ziet, zal mij niet zien; uw ogen zullen op mij zijn; maar ik zal niet meer zijn.", "Jes 63:16": "U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "Jes 2:22": "Laat u dan af van de mens, wiens adem in zijn neus is, want waarin is hij te achten?", "Ps 135:7": "Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort.", "1 Kor 10:26": "want de aarde is van de Heere, en al wat zij bevat.", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "Jer 17:8": "Want hij zal zijn als een boom die aan het water geplant is, en zijn wortels uitschiet aan een rivier, en merkt het niet wanneer er hitte komt, maar zijn loof blijft groen; en in een jaar van droogte zorgt hij niet, en houdt niet op vrucht te dragen.", "Jer 8:12-14": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE. Ik zal hen voorzeker wegrapen, spreekt de HEERE; er zijn geen druiven aan de wijnstok, en geen vijgen aan de vijgenboom, ja, het blad is afgevallen; en de geboden die Ik hun gegeven heb, die overtreden zij. Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.", "Neh 9:5": "En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!", "Ps 145:8": "Cheth. Genadig en barmhartig is de HEERE, geduldig en groot van goedertierenheid.", "Ps 138:1": "Een psalm van David. Ik zal U loven met mijn hele hart; in de tegenwoordigheid van de goden zal ik U psalmzingen.", "2 Petr 2:7-9": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft; (want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden); dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Jes 6:6": "Maar een van de serafs vloog naar mij toe, en had een gloeiende kool in zijn hand, die hij met de tang van het altaar genomen had.", "Ps 37:19": "Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Jer 32:17": "Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.", "Job 14:5-12": "Omdat zijn dagen bepaald zijn, het aantal van zijn maanden bij U bekend is, en U zijn grenzen gesteld hebt, die hij niet zal overschrijden; Wend U van hem af, zodat hij rust heeft, totdat hij als een dagloner een welgevallen heeft aan zijn dag. Want voor een boom is er, als hij wordt omgehakt, nog verwachting dat hij opnieuw zal uitlopen, en dat zijn scheut niet zal ophouden.", "1 Kor 1:9": "God is getrouw, door Wie u geroepen bent tot de gemeenschap van Zijn Zoon Jezus Christus, onze Heere.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Ps 21:14": "Verhoog U, HEERE! In Uw sterkte; zo zullen wij zingen, en Uw macht met psalmen loven.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Hos 11:3": "Ik echter leerde Efraïm lopen; Hij nam ze op Zijn armen, maar zij erkenden niet dat Ik ze genas.", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Ps 102:21": "Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.", "Dan 2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Ef 2:5": "heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden),", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Klaagl 3:38": "Mem. Gaat niet uit de mond van de Allerhoogste het kwade en het goede?", "Ps 112:1": "Halleluja! Aleph. Gelukkig is de man, die de HEERE vreest; Beth. die grote lust heeft in Zijn geboden.", "Richt 2:18": "En wanneer de HEERE hun richters verwekte, zo was de HEERE met de richter, en verloste hen uit de hand van hun vijanden, al de dagen van de richter; want het berouwde de HEERE vanwege hun zuchten om hen die hen drongen en die hen drukten.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "Lev 21:8": "Daarom zult u hem heiligen, omdat hij het voedsel van uw God offert; hij zal u heilig zijn, want Ik ben heilig; Ik ben de HEERE, die u heiligt!", "Jes 65:6": "Zie, het is voor Mijn aangezicht geschreven; Ik zal niet zwijgen, maar Ik zal vergelden, ja, in hun boezem zal Ik vergelden;", "Kol 1:23": "als u maar blijft in het geloof, gefundeerd en vast, en niet wordt weggebracht van de hoop van het Evangelie dat u gehoord hebt, dat gepredikt is onder alle schepselen die onder de hemel zijn; waarvan ik, Paulus, een dienaar geworden ben;", "Jer 31:12": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn.", "Luk 1:50": "En Zijn barmhartigheid is van geslacht tot geslacht over hen die Hem vrezen.", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Ps 84:6": "Gelukkig is de mens, wiens sterkte in U is, in wier hart de gebaande wegen zijn.", "Gen 5:1": "Dit is het boek van Adams geslacht. Op de dag dat God de mens schiep, maakte Hij hem naar de gelijkenis van God.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Ps 66:1": "Een lied, een psalm, voor de koorleider. Juicht tot God, heel de aarde!", "Zach 12:8": "Op die dag zal de HEERE de inwoners van Jeruzalem beschutten; en wie onder hen struikelen zou, zal op die dag zijn als David; en het huis van David zal zijn als goden, als de Engel van de HEERE voor hun aangezicht.", "Ps 97:1": "De HEERE regeert, de aarde verheugt zich; laat veel eilanden zich verblijden.", "Ps 46:12": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "2 Kor 1:21": "Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God;", "1 Sam 12:25": "Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen.", "1 Kron 16:26": "Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemelen gemaakt.", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "Spr 2:7": "Hij legt weg voor de oprechten een bestendig bezit; Hij is een schild voor hen die oprecht wandelen;", "Neh 9:8": "En U hebt zijn hart getrouw gevonden voor Uw aangezicht, en hebt een verbond met hem gemaakt, dat U zou geven het land van de Kanaänieten, de Hethieten, de Amorieten, en de Ferezieten, en de Jebusieten, en de Girgasieten, dat U het aan zijn nageslacht zou geven; en U hebt Uw woorden bevestigd, omdat U rechtvaardig bent.", "Joh 3:15": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Job 5:10": "Die de regen geeft op de aarde, en water zendt op de straten;", "Deut 1:10": "De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel.", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "Ps 134:2": "Hef uw handen op naar het heiligdom, en loof de HEERE.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Ps 31:24": "Heb de HEERE lief, u, al Zijn gunstgenoten! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.", "Hos 5:9": "Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "Pred 3:12": "Ik heb gemerkt, dat er niets beters voor hen is, dan zich te verblijden, en goed te doen in zijn leven.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "Ps 145:16": "Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen.", "Job 22:25": "Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "Pred 6:10": "Wat iemand ook is, allang is zijn naam genoemd, en het is bekend dat hij een mens is; en dat hij niet kan rechten met wie sterker is dan hij.", "Ezech 9:10": "Daarom ook, wat Mij aangaat, Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal hun weg op hun hoofd geven.", "Jak 4:14": "U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "Ps 118:28": "U bent mijn God, daarom zal ik U loven; o mijn God, ik zal U verhogen.", "Job 14:2": "Hij komt op als een bloem, en wordt afgesneden; ook vlucht hij als een schaduw, en houdt geen stand.", "2 Sam 7:15": "Maar Mijn goedertierenheid zal van hem niet wijken, zoals Ik die weggenomen heb van Saul, die Ik van voor uw aangezicht heb weggenomen.", "Ps 103:20-22": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord. Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet! Loof de HEERE, al Zijn werken! Aan alle plaatsen van Zijn heerschappij. Loof de HEERE, mijn ziel!", "1 Sam 2:6-8": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Dan 6:27": "Van mij is een bevel uitgegaan, dat men in de hele heerschappij van mijn koninkrijk moet beven en sidderen voor het aangezicht van de God van Daniël; want Hij is de levende God, en blijvend in eeuwigheid, en Zijn koninkrijk gaat niet te gronde, en Zijn heerschappij duurt tot het einde toe.", "Jes 65:16": "Zodat wie zich zal zegenen op aarde, zich zal zegenen in de God van de waarheid; en wie zal zweren op aarde, zal zweren bij de God van de waarheid, omdat de vorige benauwdheden vergeten zullen zijn, en omdat zij voor Mijn ogen verborgen zijn.", "Job 36:11": "Als zij horen, en Hem dienen, dan zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.", "Ps 68:21": "Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Deut 7:7": "De HEERE heeft geen liefde tot u opgevat, en u niet uitgekozen, om uw grote aantal boven alle andere volken; want u was het minste van alle volken.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "Zach 9:17": "Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "1 Kron 29:11": "Van U, o HEERE, is de grootheid, en de macht, en de heerlijkheid, en de overwinning, en de majesteit; want alles wat in de hemel en op aarde is, is van U: van U, o HEERE, is het Koninkrijk, en U hebt Uzelf verhoogd tot een Hoofd boven alles.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Ps 121:4": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Ps 119:155": "Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.", "Deut 7:22": "En de HEERE, uw God, zal deze volken voor uw aangezicht geleidelijk uitwerpen; u zult hen niet snel mogen vernietigen, omdat anders de wilde dieren van het veld tegen u te veel worden.", "Ps 115:16": "Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.", "Ps 90:5": "U overstroomt hen; zij zijn gelijk een slaap; in de morgenstond zijn zij gelijk het gras, dat verandert;", "Ps 119:156": "HEERE! Uw barmhartigheden zijn vele; maak mij levend naar Uw rechten.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Ps 113:4": "De HEERE is hoog boven alle heidenvolken, boven de hemelen is Zijn heerlijkheid.", "Num 23:19": "God is geen man, dat Hij zou liegen, en ook geen mensenkind, dat het Hem berouwen zou; zou Hij het zeggen, en het niet doen, of spreken, en het niet waarmaken?", "Job 18:5-21": "Ja, het licht van de goddelozen zal uitgeblust worden, en de vonk van zijn vuur zal niet glinsteren. Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden. De stappen van zijn kracht zullen beperkt worden, en zijn eigen plan zal hem neerwerpen.", "Luk 20:47": "die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen een des te zwaarder oordeel ontvangen.", "Matt 18:35": "Zo zal ook Mijn hemelse Vader met u doen, als u niet ieder van harte uw broeder zijn misdaden vergeeft.", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Deut 32:8": "Toen de Allerhoogste aan de volken de erfenis uitdeelde, toen Hij Adams kinderen van elkaar scheidde, heeft Hij de grenzen van de volken vastgesteld naar het getal van de kinderen van Israël.", "Ps 107:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Jes 24:17": "De angst, en de kuil, en de strik over u, o inwoners van het land!", "Hand 5:19": "Maar de engel van de Heere opende 's nachts de deuren van de gevangenis en leidde hen naar buiten, en zei:", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "Pred 8:12": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.", "Gen 6:17": "Want Ik, zie, Ik breng een watervloed over de aarde, om alle vlees waarin een geest van het leven is, van onder de hemel te verderven; alles wat op de aarde is, zal de geest geven.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Matt 25:30": "En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.", "Ps 6:6": "Want in de dood is aan U geen gedachtenis; wie zal U loven in het graf?", "Luk 19:26": "Want ik zeg u dat ieder die heeft, gegeven zal worden; maar van hem die niet heeft, zal ook wat hij heeft afgenomen worden.", "Ps 23:2": "Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren.", "Ps 25:10": "Caph. Alle paden van de HEERE zijn goedertierenheid en waarheid, voor hun die Zijn verbond en Zijn getuigenissen bewaren.", "Hos 2:17": "En Ik zal op die dag een verbond voor hen sluiten met het wild gedierte van het veld, en met het gevogelte van de hemel, en het kruipend gedierte van de aardbodem; en Ik zal de boog, en het zwaard, en de oorlog van de aarde wegbreken, en Ik zal hen in veiligheid laten neerliggen.", "Spr 16:20": "Wie op het woord verstandig let, zal het goede vinden; en wie op de HEERE vertrouwt, is gelukkig.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Jes 45:4": "Om Jakobs, Mijn knechts wil, en Israëls, Mijn uitverkorenen; ja, Ik riep u bij uw naam, Ik noemde u toe, hoewel u Mij niet kende.", "Ps 40:9": "Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Deut 15:4": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten;", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "Hos 14:2-9": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Ezech 34:31": "U nu, o Mijn schapen, schapen van Mijn weide! U bent mensen; maar Ik ben uw God, spreekt de Heere HEERE.", "Ps 33:15": "Hij vormt hun aller hart; Hij let op al hun werken.", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Ps 25:6": "Zain. Gedenk, HEERE! Uw barmhartigheden en Uw blijken van goedertierenheid, want die zijn er van eeuwigheid.", "Micha 2:3": "Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Jer 27:6": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Pred 4:2": "Daarom prees ik de doden, die al gestorven waren, boven de levenden, die tot nu toe levend zijn.", "Ps 113:7": "Die de arme uit het stof opricht, en de behoeftige uit de vuilnis verhoogt;", "2 Kon 13:23": "Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe.", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Ps 119:118": "U vertreedt allen, die van Uw inzettingen afdwalen, want hun bedrog is leugen.", "Job 36:19": "Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht?", "Hebr 2:14": "Omdat nu de kinderen deel hebben aan vlees en bloed, heeft Hij Zelf op dezelfde manier daaraan deelgenomen, opdat Hij door de dood hem teniet zou doen die de macht over de dood had, dat is: de duivel;", "1 Kon 8:51-53": "want zij zijn Uw volk en Uw erfdeel, die U uitgevoerd hebt uit Egypteland, uit het midden van de ijzeren oven; opdat Uw ogen open zijn tot de smeking van Uw dienaar, en tot de smeking van Uw volk Israël, om naar hen te horen, in al hun roepen tot U. Want U hebt hen voor Uzelf tot een erfdeel afgezonderd, uit alle volken van de aarde; zoals U gesproken hebt door de dienst van Mozes, Uw dienaar, toen U onze vaderen uit Egypte uitvoerde, Heere HEERE!", "Jes 10:2": "om de armen van het recht af te wenden, en om het recht van de ellendigen van Mijn volk te roven, opdat de weduwen hun buit worden, en opdat zij de wezen mogen plunderen!", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Ps 89:13": "Het noorden en het zuiden, die hebt Gij geschapen; Thabor en Hermon juichen in Uw Naam.", "Ps 34:10": "Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.", "Job 21:7-33": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen? Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht. Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.", "Rom 15:4": "Want al wat vroeger geschreven is, dat is tot onze lering geschreven, opdat wij, door lijdzaamheid en vertroosting van de Schriften, hoop zouden hebben.", "Matt 6:26": "Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven?", "Pred 9:5": "Want de levenden weten dat zij zullen sterven, maar de doden weten helemaal niets; zij hebben ook geen loon meer, maar hun gedachtenis is vergeten.", "Ps 130:8": "En Hij zal Israël verlossen van al zijn ongerechtigheden.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Job 24:3": "De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand.", "Job 29:13": "De zegen van hem die verloren dreigde te gaan, kwam op mij; en het hart van de weduwe deed ik vrolijk zingen.", "Jer 49:12": "Want zo zegt de HEERE: Zie, van hen wier oordeel het niet is de beker te drinken, zullen er helemaal drinken; en zou u dan enigszins ongestraft blijven? U zult niet ongestraft blijven, maar u zult helemaal drinken.", "Jes 51:8": "Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.", "Luk 12:22-31": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u: wees niet bezorgd voor uw leven, wat u eten zult, en ook niet voor het lichaam, waarmee u zich kleden zult. Het leven is meer dan het voedsel, en het lichaam meer dan de kleding. Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard?", "Deut 15:4-6": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten; Als u alleen maar de stem van de HEERE, uw God, vlijtig gehoorzaamt, zodat u erop let te doen al deze geboden die ik u vandaag gebied. Want de HEERE, uw God, zal u zegenen, zoals Hij tot u heeft gesproken; zo zult u aan veel volken lenen, maar u zult niet lenen; en u zult over veel volken heersen, maar over u zullen zij niet heersen.", "Luk 18:41": "Wat wilt u dat Ik voor u doe? En hij zei: Heere, dat ik weer kan zien.", "Lev 26:4-10": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen. Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Ps 18:51": "Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid.", "Ps 18:33": "Het is God, die mij met kracht omgordt; en Hij heeft mijn weg volkomen gemaakt.", "Job 37:18": "Hebt u met Hem de hemelen uitgespannen, die vast zijn, als een gegoten spiegel?", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Ps 66:9": "Die onze zielen in het leven houdt, en niet toelaat dat onze voet wankelt.", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Ps 26:12": "Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.", "Deut 33:27": "De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "Hand 16:25": "En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen.", "Hand 26:8": "Wat? Wordt het bij u ongelooflijk geoordeeld dat God de doden opwekt?", "Spr 12:21": "De rechtvaardigen zal geen leed overkomen; maar de goddelozen zullen met kwaad vervuld worden.", "Ps 63:9": "Mijn ziel kleeft U achteraan; Uw rechterhand ondersteunt mij.", "Ex 6:6": "En Ik zal u tot Mijn volk aannemen, en Ik zal u tot een God zijn; en u zult weten dat Ik de HEERE uw God ben, Die u uitleidt van onder de lasten van de Egyptenaren.", "Jes 1:5": "Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.", "Ps 40:6": "Gij, o HEERE, mijn God! hebt Uw wonderen en Uw gedachten aan ons vele gemaakt, men kan ze niet in orde bij U verhalen; zal ik ze verkondigen en uitspreken, dan zijn ze menigvuldiger dan dat ik ze zou kunnen vertellen.", "Job 34:24": "Hij vermorzelt de geweldigen, dat men het niet doorzoeken kan, en stelt anderen in hun plaats.", "Spr 22:22": "Beroof de arme niet, omdat hij arm is; en verbrijzel de ellendige niet in de poort.", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Deut 33:25": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen!", "1 Kron 10:14": "en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.", "1 Kron 16:33": "Dan zullen de bomen van het woud juichen voor het aangezicht van de HEERE, omdat Hij komt om de aarde te richten.", "Ps 135:6-12": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden. Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort. Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe.", "Pred 12:7": "En het stof terugkeert tot de aarde, zoals het geweest is; en de geest terugkeert tot God, Die hem gegeven heeft.", "Zach 11:7": "Daarom heb ik deze slachtschapen geweid, omdat zij ellendige schapen zijn; en ik heb mij twee stokken genomen, de een heb ik LIEFELIJKHEID genoemd, en de ander heb ik SAMENBINDERS genoemd; en ik heb die schapen geweid.", "Jes 24:18": "En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.", "Jes 38:12": "Mijn levenstijd is weggetrokken, en van mij weggevoerd als de tent van een herder; ik heb mijn leven afgesneden, zoals een wever zijn weefsel; Hij zal mij afsnijden, als van de drom; van de dag tot de nacht zult U mij ten einde gebracht hebben.", "Tit 3:4": "Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is,", "Ezech 5:4": "En nog zult u daarvan nemen, en dat werpen in het midden van het vuur, en zult ze verbranden met vuur; daaruit zal een vuur voortkomen tegen het hele huis van Israël.", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Ex 13:22": "Hij nam de wolkkolom overdag, en de vuurkolom 's nachts, niet weg van voor het aangezicht van het volk.", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Ezech 18:31": "Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Openb 19:1": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Ps 94:14": "Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "Ex 12:13": "En dat bloed zal voor u een teken zijn aan de huizen waarin u zich bevindt; wanneer Ik het bloed zie, zal Ik u voorbijgaan; en er zal geen plaag onder u zijn tot verderf, wanneer Ik Egypteland zal slaan.", "Ps 136:25": "Die alle vlees voedsel geeft; want Zijn goedertierenheid is voor eeuwig.", "Ps 61:4": "Want U bent mij een Toevlucht geweest, een sterke Toren voor de vijand.", "1 Tim 5:16": "Als een gelovige man of gelovige vrouw weduwen heeft, moet die haar voldoende hulp geven, en moet de gemeente niet belast worden, opdat zij hun die echt weduwen zijn voldoende hulp kan geven.", "Dan 9:4": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Hebr 6:19": "welke hoop wij hebben als een anker van de ziel, dat zeker en vast is, en dat ingaat in het binnenste van het voorhangsel;", "Hos 9:9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "2 Kon 20:6": "En Ik zal vijftien jaar aan uw dagen toevoegen, en Ik zal u uit de hand van de koning van Assyrië verlossen, alsook deze stad; en Ik zal deze stad beschermen, omwille van Mijzelf en omwille van Mijn dienaar David.", "Ps 33:12": "Gelukkig is het volk wiens God de HEERE is; het volk, dat Hij Zich als erfdeel heeft uitgekozen.", "Spr 14:21": "Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.", "1 Tim 6:13": "Ik beveel u voor het aangezicht van God, Die alles levend maakt, en van Christus Jezus, Die onder Pontius Pilatus de goede belijdenis heeft afgelegd,", "1 Sam 20:2": "Hij daarentegen zei tegen hem: Dat zij verre, u zult niet sterven. Zie, mijn vader doet geen grote zaak, en geen kleine zaak, die hij niet aan mij bekendmaakt; waarom zou dan mijn vader deze zaak voor mij verbergen? Dat is niet zo.", "Pred 9:3": "Dit is een kwaad onder alles wat er onder de zon gebeurt, dat eenzelfde lot allen treft, en dat ook het hart van de mensenkinderen vol boosheid is, en dat er in hun leven onzinnigheden zijn in hun hart; en daarna moeten zij naar de doden toe.", "Ps 33:11": "Maar de raad van de HEERE bestaat in eeuwigheid, de gedachten van Zijn hart van geslacht tot geslacht.", "2 Kor 9:8-10": "En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk. Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid. Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid;", "Deut 4:31": "Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Job 8:7": "Uw begin zal wel gering zijn geweest, maar uw einde zal zeer toenemen.", "Rom 5:2-5": "Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God. En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt; En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop;", "Ps 57:4": "Hij zal vanuit de hemel zenden, en mij verlossen, en te schande maken hem die mij zoekt te verslinden. Sela. God zal Zijn goedertierenheid en Zijn waarheid zenden.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Zach 9:14-16": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden. De HEERE van de heerscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar. En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "Gen 50:17": "Zo moet u tot Jozef zeggen: Ach, vergeef toch de overtreding van uw broeders, en hun zonde; want zij hebben u kwaad aangedaan; maar nu, vergeef toch de overtreding van de dienaren van de God van uw vader! En Jozef weende toen zij tot hem spraken.", "Jes 14:3": "En het zal gebeuren op de dag, wanneer de HEERE u rust zal geven van uw smart, en van uw onrust, en van de harde dienstbaarheid waarin men u heeft laten dienen,", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Ef 2:4": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft,", "Jes 24:14-16": "Die zullen hun stem opheffen, zij zullen vrolijk zingen; vanwege de heerlijkheid van de HEERE zullen zij juichen vanaf de zee. Daarom eert de HEERE in de valleien, in de eilanden van de zee de Naam van de HEERE, de God van Israël. Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.", "Ps 89:18": "Want Gij zijt de heerlijkheid van hun sterkte; en door Uw welbehagen zal onze hoorn verhoogd worden.", "Pred 5:18": "Ook: ieder mens aan wie God rijkdom en bezittingen gegeven heeft, en aan wie Hij de macht geeft om daarvan te eten, en om zijn deel te nemen, en om zich te verheugen in zijn arbeid, dat is een gave van God.", "Luk 12:24-28": "Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard? Wie van u kan door bezorgd te zijn één el aan zijn lengte toevoegen? Als u dan zelfs het kleinste niet kunt, waarom bent u dan bezorgd over de andere dingen?", "Jes 12:6": "Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.", "Gen 24:3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "Job 15:28-30": "En heeft verdelgde steden bewoond, en huizen die men niet bewoonde, die gereed waren om een puinhoop te worden. Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde. Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.", "Ps 75:7": "Want het verhogen komt niet uit het oosten, noch uit het westen, noch uit de woestijn;", "Ps 78:4-72": "Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft. Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Ps 92:2-4": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste! Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten; Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.", "Ef 2:4-7": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;", "Gen 48:15": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;", "Hebr 3:6": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden.", "Spr 3:33": "De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "1 Kor 14:15": "Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen.", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Ps 18:36": "Ook hebt U mij het schild van Uw heil gegeven, en Uw rechterhand heeft mij ondersteund, en Uw zachtmoedigheid heeft mij groot gemaakt.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Deut 8:18": "Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "Ps 9:8": "Maar de HEERE zal in eeuwigheid zitten; Hij heeft Zijn troon bereid ten gerichte.", "Dan 4:25": "Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil.", "1 Kron 17:8": "En Ik ben met u geweest overal waar u heen bent gegaan, en Ik heb al uw vijanden voor u uitgeroeid; en Ik heb u een naam gemaakt, gelijk de naam van de groten die op de aarde zijn.", "Job 30:23": "Want ik weet dat U mij ter dood zult brengen, en tot het huis der samenkomst van alle levenden.", "Dan 5:23": "Maar u hebt uzelf verheven tegen de Heere van de hemel, en men heeft de vaten van Zijn huis voor u gebracht, en u, en uw leiders, uw vrouwen, en uw bijvrouwen hebben daaruit wijn gedronken, en de goden van zilver en goud, koper, ijzer, hout en steen, die niet zien, niet horen, en niet weten, hebt u geprezen; maar die God, in Wiens hand uw adem is, en aan Wie al uw wegen toebehoren, hebt u niet verheerlijkt.", "Ef 3:9": "en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus;", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "Luk 1:77": "om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "Jer 2:6": "En zij zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw van de dood, in een land waar niemand doorheen ging, en waar geen mens woonde?", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Lev 26:44": "En hierboven is dit ook: als zij in het land van hun vijanden zullen zijn, zal Ik hen niet verwerpen, en ook niet van hen walgen, om een einde aan hen te maken en Mijn verbond met hen te vernietigen; want Ik ben de HEERE, hun God!", "Hos 7:11": "Want Efraïm is als een domme duif, zonder verstand; zij roepen Egypte aan, zij gaan heen tot Assur.", "Jer 33:26": "Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "Rom 11:29": "Want de genadegiften en de roeping van God zijn onberouwelijk.", "Ps 94:23": "En Hij zal hun ongerechtigheid op hen doen terugkeren, en Hij zal hen in hun boosheid verdelgen; de HEERE, onze God, zal hen verdelgen.", "Ps 44:2-4": "O God! Wij hebben het met onze oren gehoord, onze vaders hebben het ons verteld: Wat een werk hebt U gedaan in hun dagen, in de dagen van vroeger. U hebt de heidenvolken met Uw hand uit de bezitting verdreven, maar hen geplant; U hebt de volken geplaagd, hen daarentegen doen voortschieten. Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Ps 82:3": "Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme.", "Ps 22:26": "Van U zal mijn lof zijn in een grote gemeente; ik zal mijn geloften betalen in de tegenwoordigheid van hen die Hem vrezen.", "Deut 9:29": "Zij zijn toch Uw volk, en Uw erfdeel, dat U door Uw grote kracht, en door Uw uitgestrekte arm hebt uitgevoerd!", "Joz 23:10": "Eén man onder u zal er duizend opjagen; want het is de HEERE, uw God, Zelf, Die voor u strijdt, zoals Hij tot u gesproken heeft.", "Ex 9:26": "Alleen in het land Gosen, waar de kinderen van Israël waren, daar was geen hagel.", "Matt 20:15": "Of mag ik met het mijne niet doen wat ik wil? Of is uw oog boos, omdat ik goed ben?", "Deut 26:12": "Wanneer u klaar bent met het vertienen van alle tienden van uw inkomen, in het derde jaar, het jaar van de tienden; dan zult u aan de Leviet, aan de vreemdeling, aan de wees en aan de weduwe geven, opdat zij in uw poorten eten en verzadigd worden.", "Ps 63:4-7": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen. Zo zou ik U loven in mijn leven; in Uw Naam zou ik mijn handen opheffen. Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen.", "1 Kor 2:6": "En wij spreken wijsheid onder de volwassenen in het geloof; maar een wijsheid die niet van deze wereld is, en ook niet van de leiders van deze wereld, die tot niets worden;", "Ps 24:10": "Wie is Hij, deze Koning der ere? De HEERE van de heerscharen, Die is de Koning der ere. Sela.", "Ps 102:20": "Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben;", "Jes 35:5": "Dan zullen de ogen van de blinden opengedaan worden, en de oren van de doven zullen geopend worden.", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Amos 4:7": "Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde.", "Jes 40:6": "Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld.", "Ex 6:5": "Daarom, zeg tegen de kinderen van Israël: Ik ben de HEERE! En Ik zal u uitleiden van onder de lasten van de Egyptenaren, en Ik zal u redden uit hun dienstbaarheid, en zal u verlossen door een uitgestrekte arm, en door grote gerichten;", "Deut 27:19": "Vervloekt is hij die het recht van de vreemdeling, van de wees en van de weduwe buigt! En heel het volk zal zeggen: Amen.", "Ps 107:32": "En Hem verhogen in de gemeente van het volk, en Hem roemen in de vergadering van de oudsten.", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Luk 16:22-28": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Rom 6:16": "Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Ps 105:24": "En Hij deed Zijn volk zeer meer worden, en maakte het machtiger dan zijn tegenstanders.", "Spr 29:18": "Als er geen profetie is, wordt het volk ontbloot; maar gelukkig is hij die de wet bewaart.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "Gen 9:15": "dan zal Ik Mijn verbond gedenken, dat er is tussen Mij en tussen u, en tussen alle levende ziel van alle vlees; en het water zal niet meer worden tot een vloed, om alle vlees te verderven.", "Hos 13:3": "Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Dan 11:32": "En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.", "Gen 27:2": "En hij zei: Zie toch, ik ben oud geworden, ik weet de dag van mijn dood niet.", "Ex 34:24": "Wanneer Ik de volken voor uw aangezicht uit hun bezit zal verdrijven, en uw grenzen verruimen, dan zal niemand uw land begeren, terwijl u erheen optrekt, om te verschijnen voor het aangezicht van de HEERE, uw God, driemaal in het jaar.", "Zach 1:16": "Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "2 Kon 14:26": "Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Ps 105:7": "Hij is de HEERE, onze God; Zijn oordelen zijn over de gehele aarde.", "Lev 25:18-22": "En doe Mijn inzettingen, en houd Mijn rechten, en doe die; dan zult u zeker wonen in het land. En het land zal zijn vrucht geven, en u zult eten tot verzadiging toe; en u zult zeker daarin wonen. En als u zou zeggen: Wat zullen wij eten in het zevende jaar! Zie, wij zullen niet zaaien, en onze opbrengst niet inzamelen;", "Ps 115:17": "De doden zullen de HEERE niet prijzen, evenmin wie in de stilte neergedaald zijn.", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "Ps 105:4": "Vraagt naar de HEERE en Zijn sterkte; zoekt Zijn aangezicht voortdurend.", "Ps 36:13": "Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan.", "Rom 1:7": "Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "Job 21:26": "Zij liggen samen neer in het stof, en het gewormte overdekt hen.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Matt 24:35": "De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.", "Job 36:17": "Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "1 Kor 12:6": "en er is verscheidenheid van werkingen, maar het is dezelfde God, Die alles in allen werkt.", "Deut 4:39": "Zo zult u vandaag weten, en in uw hart overdenken, dat de HEERE die God is, boven in de hemel en beneden op de aarde, niemand anders!", "Jer 31:36": "Als deze ordeningen van voor Mijn aangezicht zullen wijken, spreekt de HEERE, dan zal ook het nageslacht van Israël ophouden een volk te zijn voor Mijn aangezicht, alle dagen.", "Jer 30:17": "Want Ik zal u de gezondheid doen terugkeren, en u van uw plagen genezen, spreekt de HEERE; omdat zij u noemen: De verdrevene. Het is Sion, zeggen zij; niemand vraagt naar haar.", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Openb 11:13": "En op datzelfde uur gebeurde er een grote aardbeving, en het tiende deel van de stad viel, en er werden in de aardbeving zevenduizend namen van mensen gedood, en de overigen werden zeer bevreesd, en gaven de God van de hemel heerlijkheid.", "Spr 8:22-26": "De HEERE bezat Mij in het beginsel van Zijn weg, voor Zijn werken, van toen aan. Ik ben van eeuwigheid af gezalfd geweest; van het begin, van de oudheden van de aarde aan. Ik was geboren, toen de afgronden nog niet waren, toen nog geen fonteinen waren, zwaar van water;", "Ps 119:102": "Ik ben niet geweken van Uw rechten, want U hebt mij geleerd.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "Jer 7:7": "dan zal Ik u in deze plaats, in het land dat Ik uw vaderen gegeven heb, laten wonen van eeuw tot eeuw.", "1 Petr 1:21": "die door Hem gelooft in God, Die Hem uit de doden heeft opgewekt en Hem heerlijkheid gegeven heeft, zodat uw geloof en hoop op God gericht zouden zijn.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Ps 128:2": "Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan.", "Jes 52:7-10": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning. Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal. Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "Ps 43:3": "Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Ps 37:6": "En Hij zal uw gerechtigheid doen voortkomen als het licht, en uw recht als de middag.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "Jes 42:10-12": "Zingt de HEERE een nieuw lied, Zijn lof van het einde van de aarde; u, die ter zee vaart, en al wat daarin is, u eilanden en hun inwoners. Laat de woestijn en haar steden de stem verheffen, met de dorpen die Kedar bewoont; laat hen juichen die in de rotsen wonen, en van de top van de bergen af schreeuwen. Laat ze de HEERE de eer geven, en Zijn lof in de eilanden verkondigen.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Jes 44:24": "Zo zegt de HEERE, uw Verlosser, en Die u geformeerd heeft van de buik af aan: Ik ben de HEERE, Die alles doet, Die de hemel uitbreidt, Ik alleen, en Die de aarde uitspant door Mijzelf;", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Jes 41:13": "Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "Ps 119:166": "O HEERE! ik hoop op Uw heil, en doe Uw geboden.", "Openb 11:17": "en zeiden: Wij danken U, Heere God, Almachtige, Die is, en Die was, en Die komen zal! dat U Uw grote kracht hebt aangenomen, en als Koning hebt geheerst;", "Pred 9:10": "Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Ps 85:13": "Ook zal de HEERE het goede geven; en ons land zal zijn vrucht geven.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "Deut 32:47": "Want dat is geen leeg woord voor u; maar het is uw leven; en door ditzelfde woord zult u de dagen verlengen op het land, waar u over de Jordaan naartoe gaat, om dat te erven.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Rom 5:8": "Maar God bevestigt Zijn liefde tegenover ons hierin, dat Christus voor ons gestorven is toen wij nog zondaars waren.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "Luk 12:4": "En Ik zeg u, Mijn vrienden: wees niet bang voor hen die het lichaam doden, en daarna niets meer kunnen doen.", "Ps 43:5": "Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke Verlossing van mijn aangezicht, en mijn God.", "2 Kron 7:6": "Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst Hem prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond.", "2 Sam 12:24": "Daarna troostte David zijn vrouw Bathseba, en ging naar haar toe, en lag bij haar; en zij baarde een zoon, wiens naam zij Salomo noemde; en de HEERE had hem lief,", "Matt 12:34": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.", "Rom 1:20": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Ps 111:1": "Halleluja! Aleph. Ik zal de HEERE loven van ganser harte; Beth. in de raad en vergadering van de oprechten.", "Spr 14:34": "Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.", "Hos 2:8-12": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken. En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden. En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "Ps 68:33-35": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.", "Ps 34:7": "Zain. Deze ellendige riep, en de HEERE hoorde; en Hij verloste hem uit al zijn benauwdheden.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "1 Joh 4:12": "Niemand heeft ooit God gezien; als wij elkaar liefhebben, blijft God in ons, en Zijn liefde is in ons volmaakt.", "Hebr 9:27": "En zoals het de mensen beschikt is eenmaal te sterven, en daarna het oordeel;", "Ps 32:5": "Mijn zonde maakte ik U bekend, en mijn ongerechtigheid bedekte ik niet. Ik zei: Ik zal belijdenis van mijn overtredingen doen voor de HEERE; en U vergaf de ongerechtigheid van mijn zonde. Sela.", "2 Kor 1:22": "Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "Job 36:18": "Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen.", "Hand 24:15": "Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen.", "1 Sam 2:4": "De boog van de sterken is gebroken; en zij die struikelden, zijn met sterkte omgord.", "Ps 148:5": "Laat hen de Naam van de HEERE loven; want toen Hij het beval, werden zij geschapen.", "Joh 20:17": "Jezus zei tegen haar: Raak Mij niet aan, want Ik ben nog niet opgevaren naar Mijn Vader; maar ga naar Mijn broeders, en zeg hun: Ik vaar op naar Mijn Vader en uw Vader, en naar Mijn God en uw God.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Ps 103:6": "De HEERE doet gerechtigheid en recht aan allen die onderdrukt worden.", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Ex 12:17": "Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "Ps 90:6": "In de morgenstond bloeit het, en het verandert; 's avonds wordt het afgesneden, en het verdort.", "Ex 14:30": "Zo verloste de HEERE Israël op die dag uit de hand van de Egyptenaren; en Israël zag de Egyptenaren dood aan de oever van de zee.", "Job 10:21": "Voordat ik heenga (en niet terugkom) naar een land van duisternis en van de schaduw van de dood;", "1 Tim 6:7": "Want wij hebben niets in de wereld meegebracht, het is duidelijk dat wij er ook niets uit kunnen meedragen.", "Spr 3:1": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden.", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Joh 17:19": "En Ik heilig Mijzelf voor hen, opdat ook zij geheiligd mogen zijn in waarheid.", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "Jer 29:11": "Want Ik weet de gedachten die Ik over u koester, spreekt de HEERE, gedachten van vrede en niet van kwaad, om u het einde en de verwachting te geven.", "Ezech 16:6": "Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef!", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Gen 26:4": "En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Hebr 6:18": "opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Ps 105:45": "Opdat zij Zijn inzettingen zouden onderhouden, en Zijn wetten zouden bewaren. Halleluja!", "Joh 17:23": "Ik in hen, en U in Mij; opdat zij volmaakt zijn tot één, en opdat de wereld erkent dat U Mij gezonden hebt, en hen liefgehad hebt, zoals U Mij liefgehad hebt.", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Jak 1:15": "Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.", "Ps 103:1": "Een psalm van David. Loof de HEERE, mijn ziel, en al wat binnen in mij is, Zijn heilige Naam.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "Gen 2:7": "En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.", "Jes 37:32": "Want van Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is van de berg Sion; de ijver van de HEERE van de heerscharen zal dit doen.", "Joh 1:16": "En uit Zijn volheid hebben wij allen ontvangen, ook genade voor genade.", "Job 36:7": "Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven.", "Mal 3:2": "Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers.", "Rom 11:2": "God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt:", "Luk 7:22": "En Jezus antwoordde en zei tegen hen: Ga heen, en vertel Johannes weer wat u gezien en gehoord hebt: dat de blinden ziende worden, de kreupelen lopen, de melaatsen gereinigd worden, de doven horen, de doden opgewekt worden, aan de armen het Evangelie verkondigd wordt.", "Ef 1:18": "Namelijk verlichte ogen van uw verstand, opdat u mag weten wat de hoop is van Zijn roeping, en wat de rijkdom is van de heerlijkheid van Zijn erfenis in de heiligen;", "Matt 24:22": "En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Deut 8:4": "Uw kleding is aan u niet versleten, en uw voet is niet gezwollen, deze veertig jaar.", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Job 13:28": "En hij vergaat als een verrotting, als een kleed dat de mot opeet.", "Jer 2:9": "Daarom zal Ik nog met u twisten, spreekt de HEERE; ja, met uw kindskinderen zal Ik twisten.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "Luk 13:11-13": "En zie, er was een vrouw die al achttien jaar lang een geest van ziekte had, en zij was samengebogen en kon zich totaal niet oprichten. En Jezus zag haar, riep haar bij Zich en zei tegen haar: Vrouw, u bent verlost van uw ziekte. En Hij legde haar de handen op; en zij werd meteen weer recht, en verheerlijkte God.", "Spr 27:1": "Beroem u niet over de dag van morgen; want u weet niet, wat de dag zal baren.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Jes 38:18": "Want het graf zal U niet loven, de dood zal U niet prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.", "Ps 104:5": "Hij heeft de aarde gegrond op haar fundamenten; zij zal nooit meer, ook niet eeuwig, wankelen.", "Ps 115:10": "U, huis van Aäron! vertrouw op de HEERE; Hij is hun Hulp en hun Schild.", "Jes 6:7": "En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Jes 17:7": "Op die dag zal de mens zien naar Hem, Die hem gemaakt heeft, en zijn ogen zullen op de Heilige van Israël zien.", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "Deut 28:2-13": "En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld. Gezegend zal zijn de vrucht van uw schoot, en de vrucht van uw land, en de vrucht van uw vee, de aanwas va
