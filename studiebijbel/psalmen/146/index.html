n uw koeien, en de kudden van uw kleinvee.", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Deut 14:29": "Zo zal de Leviet komen – omdat hij geen deel noch erfdeel met u heeft – en de vreemdeling, en de wees en de weduwe die in uw poorten zijn, en zij zullen eten en verzadigd worden; opdat de HEERE, uw God, u zegent in al het werk van uw hand, dat u doen zult.", "Jer 22:15": "Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Ps 74:17": "U hebt al de grenzen van de aarde gesteld; zomer en winter, die hebt U gevormd.", "Ps 57:11": "Want Uw goedertierenheid is groot tot aan de hemelen, en Uw waarheid tot aan de hoogste wolken.", "Ps 33:18": "Zie, het oog van de HEERE is over hen die Hem vrezen, op hen die op Zijn goedertierenheid hopen.", "Openb 11:15": "En de zevende engel heeft op de bazuin geblazen, en er kwamen grote stemmen in de hemel, die zeiden: De koninkrijken van de wereld zijn van onze Heere geworden en van Zijn Christus, en Hij zal als Koning heersen tot in alle eeuwigheid.", "Ps 72:4": "Hij zal de ellendigen van het volk richten; hij zal de kinderen van de behoeftige verlossen, en de verdrukker verbrijzelen.", "Ps 7:18": "Ik zal de HEERE loven naar Zijn gerechtigheid, en voor de Naam van de HEERE, de Allerhoogste, psalmzingen.", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Luk 23:39-43": "En een van de kwaaddoeners die daar hingen, lasterde Hem en zei: Als U de Christus bent, verlos Uzelf en ons. Maar de ander antwoordde en bestrafte hem: Vreest u ook God niet, terwijl u in hetzelfde oordeel bent? En wij toch terecht; want wij ontvangen straf die past bij wat wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.", "1 Kor 7:9": "Maar als zij zich niet kunnen onthouden, laten zij trouwen; want het is beter te trouwen dan van begeerte te branden.", "Ps 71:7": "Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "1 Joh 4:4": "Kinderen, u bent uit God, en hebt hen overwonnen; want Hij die in u is, is meer dan hij die in de wereld is.", "Ps 121:2": "Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft.", "Pred 7:29": "Alleen zie, dit heb ik gevonden, dat God de mens recht gemaakt heeft, maar zij hebben veel uitvindingen gezocht.", "Pred 6:6": "Ja, al leefde hij wel tweemaal duizend jaren, en zag hij het goede niet; gaan zij niet allen naar één plaats?", "Ps 91:4": "Hij zal u dekken met Zijn vlerken, en onder Zijn vleugels zult u vertrouwen; Zijn waarheid is een schild en beukelaar.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Jer 7:6": "de vreemdeling, de wees en de weduwe niet zult verdrukken, en geen onschuldig bloed in deze plaats zult vergieten, en andere goden niet zult nawandelen, u zelf tot kwaad;", "1 Kron 17:27": "Nu dan, het heeft U behaagd het huis van Uw knecht te zegenen, zodat het in eeuwigheid voor Uw aangezicht zal zijn; want U, HEERE, hebt het gezegend, en het zal gezegend zijn in eeuwigheid.", "Jer 10:12": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid heeft door Zijn verstand.", "Ps 90:9": "Want al onze dagen gaan henen door Uw verbolgenheid; wij brengen onze jaren door als een gedachte.", "Ps 71:8": "Laat mijn mond vervuld worden met Uw lof, de hele dag met Uw heerlijkheid.", "Job 34:13": "Wie heeft Hem gesteld over de aarde, en wie heeft de hele wereld geschikt?", "1 Kon 2:3": "En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;", "Ps 65:9-14": "En die aan de einden wonen, vrezen voor Uw tekenen; U doet de uitgangen van de morgen en van de avond juichen. U bezoekt het land, en hebt het begerig gemaakt, U verrijkt het overvloedig; de rivier van God is vol water; wanneer U het zo bereid hebt, maakt U hun koren gereed. U maakt zijn opgeploegde aarde dronken; U doet ze dalen in zijn voren; U maakt het zacht door de druppels; U zegent zijn uitspruitsel.", "Deut 6:2-25": "Opdat u de HEERE, uw God, vreest, om al Zijn inzettingen en Zijn geboden te houden, die ik u gebied; u, en uw kind, en kindskind, al de dagen van uw leven; en opdat uw dagen verlengd worden. Hoor dan, Israël! en let erop dat u ze doet, opdat het u goed gaat, en opdat u zeer vermenigvuldigt (zoals de HEERE, de God van uw vaderen, u gesproken heeft) in het land, dat overvloeit van melk en honing. Hoor, Israël! De HEERE, onze God, is een enig HEERE!", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Luk 18:42": "En Jezus zei tegen hem: Word ziende; uw geloof heeft u behouden.", "Jes 51:6": "Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.", "Ps 65:2": "De lofzang is in stilte tot U, o God! in Sion; en U zal de gelofte betaald worden.", "Joël 2:21": "Vrees niet, o land! verheug u, en wees blijde; want de HEERE heeft grote dingen gedaan.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Openb 16:5": "En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt;", "Kol 1:11": "bekrachtigd met alle kracht, naar de sterkte van Zijn heerlijkheid, tot alle lijdzaamheid en geduld, met blijdschap;", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Jes 43:15": "Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning.", "Amos 7:3": "Toen kreeg de HEERE berouw hierover; het zal niet gebeuren, zei de HEERE.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Ps 103:3": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Ps 65:10-14": "U bezoekt het land, en hebt het begerig gemaakt, U verrijkt het overvloedig; de rivier van God is vol water; wanneer U het zo bereid hebt, maakt U hun koren gereed. U maakt zijn opgeploegde aarde dronken; U doet ze dalen in zijn voren; U maakt het zacht door de druppels; U zegent zijn uitspruitsel. U kroont het jaar van Uw goedheid; en Uw voetstappen druipen van vettigheid.", "Spr 15:9": "De weg van de goddelozen is de HEERE een gruwel; maar hem die de gerechtigheid najaagt, zal Hij liefhebben.", "Ps 37:17": "Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen.", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Ps 97:5": "De bergen smelten als was voor het aangezicht van de HEERE, voor het aangezicht van de Heere van de hele aarde.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Job 4:19-21": "Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot. Van de morgen tot de avond worden zij vermorzeld; zonder dat men er acht op slaat, vergaan zij voor eeuwig. Verdwijnt hun uitnemendheid niet met hen? Zij sterven, maar niet in wijsheid.", "2 Kor 12:10": "Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus' wil; want als ik zwak ben, dan ben ik machtig.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Ps 142:8": "Voer mijn ziel uit de gevangenis, om Uw Naam te loven; de rechtvaardigen zullen mij omringen, wanneer U goed voor mij zult zijn geweest.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Deut 4:37": "En omdat Hij uw vaderen liefhad, en hun nageslacht na hen verkoren had, zo heeft Hij u voor Zijn aangezicht door Zijn grote kracht uit Egypte weggevoerd;", "2 Sam 24:14": "Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.", "Neh 9:17-20": "En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die U bij hen gedaan had, en hebben hun nek verhard, en in hun weerspannigheid een hoofd aangesteld, om terug te keren tot hun dienstbaarheid. Doch U, een God van vergevingen, genadig en barmhartig, geduldig, en groot van weldadigheid, hebt hen toch niet verlaten. Zelfs, toen zij zich een gegoten kalf gemaakt hadden, en gezegd hadden: Dit is uw God, Die u uit Egypte heeft opgevoerd; en grote lasteringen gedaan hadden; Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.", "Gen 14:18-20": "En Melchizedek, koning van Salem, bracht brood en wijn; en hij was een priester van de allerhoogste God. En hij zegende hem en zei: Gezegend zij Abram door God, de Allerhoogste, Die hemel en aarde bezit! En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Rom 15:8": "En ik zeg dat Jezus Christus een dienaar van de besnijdenis geworden is, vanwege de waarheid van God, opdat Hij de beloften aan de vaderen zou bevestigen;", "Ex 32:14": "Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Job 21:33": "De kluiten van het dal zijn hem zoet, en hij trekt achter zich alle mensen aan; en van hen die vóór hem geweest zijn, is geen getal.", "Rom 16:27": "Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Ps 36:9": "Zij worden dronken van de vettigheid van uw huis; en U drenkt hen uit de beek van Uw wellusten.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "Hand 4:24": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.", "Matt 5:45": "opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen.", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Jes 38:1": "In die dagen werd Hizkia ziek tot de dood toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Regel uw zaken; want u zult sterven en niet leven.", "Ps 103:3-5": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden; Die uw mond verzadigt met het goede, uw jeugd vernieuwt als die van een arend.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "Deut 32:41-43": "Als Ik Mijn glinsterend zwaard scherp, en Mijn hand grijpt naar het gericht, zo zal Ik wraak op Mijn tegenpartijen doen wederkeren, en Mijn haters vergelden. Ik zal Mijn pijlen dronken maken van bloed, en Mijn zwaard zal vlees eten; van het bloed van de verslagene en van de gevangene, vanaf het begin zullen er wraken van de vijand zijn. Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Jer 11:4": "Dat Ik uw vaderen geboden heb, op de dag dat Ik hen uit Egypteland, uit de ijzeroven, uitvoerde, en Ik zei: Wees Mijn stem gehoorzaam, en doe die, naar alles wat Ik u gebied; zo zult u Mij tot een volk zijn, en Ik zal u tot een God zijn;", "1 Kon 8:24": "Die Uw dienaar, mijn vader David, gehouden hebt wat U tot hem gesproken had; want met Uw mond hebt U gesproken, en met Uw hand vervuld, zoals het op deze dag is.", "Ps 67:7": "De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.", "Joh 14:21-23": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren. Judas, niet de Iskariot, zei tegen Hem: Heere, hoe komt het dat U Uzelf aan ons zult openbaren, en niet aan de wereld? Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Ps 145:9": "Teth. De HEERE is voor allen goed, en Zijn barmhartigheden zijn over al Zijn werken.", "Ps 68:34": "Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte.", "Spr 20:22": "Zeg niet: Ik zal het kwaad vergelden; wacht op de HEERE, en Hij zal u verlossen.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Micha 2:13": "De doorbreker zal voor hen uittrekken; zij zullen doorbreken en door de poort gaan, en daardoor naar buiten trekken; en hun koning zal voor hen uit heengaan, en de HEERE aan hun spits.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Job 3:13": "Want nu zou ik neerliggen, en stil zijn; ik zou slapen, dan zou voor mij rust zijn;", "Luk 1:68-70": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht; zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Job 36:1-33": "Elihu ging nog verder, en zei: Wacht op mij nog even, en ik zal u aanwijzen dat er nog redenen voor God zijn. Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "Jak 1:10": "En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan.", "Ps 14:5": "Daar zijn zij door grote angst overvallen; want God is bij het geslacht van de rechtvaardige.", "Ps 33:9": "Want Hij spreekt, en het is er; Hij gebiedt, en het staat er.", "Job 39:3": "Wie bereidt de raaf haar kost, als haar jongen tot God schreeuwen, als zij dwalen, omdat er geen eten is?", "Zach 10:1": "Vraag van de HEERE regen, in de tijd van de late regen; de HEERE maakt de bliksemwolken¹, en Hij zal hun regen genoeg geven, voor ieder kruid op het veld.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Jer 4:27": "Want zo zegt de HEERE: Dit hele land zal een woestijn zijn (toch zal Ik geen volledig einde maken);", "Ps 144:3": "O HEERE, wat is de mens, dat U hem kent, het kind van de mens, dat U op hem let?", "Ps 34:8": "Cheth. De Engel van de HEERE legert Zich rondom hen die Hem vrezen, en redt hen.", "Job 31:16-18": "Als ik de armen hun begeerte onthouden heb, of de ogen van de weduwe laten versmachten; En mijn bete alleen gegeten heb, zodat de wees daarvan niet gegeten heeft; (Want van mijn jonkheid af is hij bij mij opgetogen, als bij een vader, en van mijner moeders buik af heb ik haar geleid;)", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Ps 135:5": "Want ik weet dat de HEERE groot is, en dat onze Heere boven alle goden is.", "Ps 71:6": "Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Ps 57:8-10": "Mijn hart is standvastig, o God! mijn hart is standvastig; ik zal zingen en psalmzingen. Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o Heere! ik zal U psalmzingen onder de naties.", "Ps 147:1": "Looft de HEERE, want onze God te bezingen is goed, omdat Hij liefelijk is; de lof is Hem waardig.", "Ps 109:30": "Ik zal de HEERE met mijn mond zeer loven, en te midden van velen zal ik Hem prijzen.", "Ps 104:30": "Zendt U Uw Geest uit, dan worden zij geschapen, en U vernieuwt het gelaat van het aardrijk.", "1 Sam 2:8": "Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Ps 72:6": "Hij zal neerdalen als een regen op het nagras, als de druppels, die de aarde bevochtigen.", "Joz 3:11": "Zie, de ark van het verbond van de Heere van de hele aarde gaat voor u door de Jordaan.", "Ps 89:12": "De hemel is van U, ook is de aarde van U; de wereld en haar volheid, die hebt Gij gegrond.", "Lev 26:10": "En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.", "Openb 20:12-14": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken. En de zee gaf de doden, die in haar waren; en de dood en het rijk van de dood gaven de doden, die in hen waren; en zij werden geoordeeld, ieder naar zijn werken. En de dood en het rijk van de dood werden geworpen in de poel van het vuur; dit is de tweede dood.", "Ezra 9:7-14": "Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag. En nu is er, als een klein ogenblik, een genade gebeurd van de HEERE, onze God, om ons een ontkoming over te laten, en ons een nagel te geven in Zijn heilige plaats, om onze ogen te verlichten, o onze God, en om ons een weinig leven te geven in onze dienstbaarheid. Want wij zijn knechten; maar in onze dienstbaarheid heeft onze God ons niet verlaten; maar Hij heeft weldadigheid tot ons geneigd voor het aangezicht van de koningen van Perzië, dat Hij ons een weinig leven zou geven, om het huis van onze God te verhogen, en de woestenijen ervan op te richten, en om ons een muur te geven in Juda en te Jeruzalem.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Deut 1:31": "En in de woestijn, waar u gezien hebt dat de HEERE, uw God, u gedragen heeft, zoals een man zijn zoon draagt, op heel de weg die u gegaan bent, totdat u kwam bij deze plaats.", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Zef 3:13": "De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.", "Ps 25:9": "Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren.", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "Job 27:4": "Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken!", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Jer 33:20": "Zo zegt de HEERE: Als u Mijn verbond met de dag, en Mijn verbond met de nacht zou kunnen verbreken, zodat er geen dag en nacht meer zijn op hun tijd;", "Spr 8:23-25": "Ik ben van eeuwigheid af gezalfd geweest; van het begin, van de oudheden van de aarde aan. Ik was geboren, toen de afgronden nog niet waren, toen nog geen fonteinen waren, zwaar van water; Voordat de bergen ingevest waren, voor de heuvels was Ik geboren.", "2 Kron 7:17": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "Jes 49:25": "Doch zo zegt de HEERE: Ja, de gevangenen van de machtige zullen hem ontnomen worden, en de vangst van de tiran zal ontkomen; want met hen die u bestrijden zal Ik strijden, en uw kinderen zal Ik verlossen.", "Luk 1:46-55": "En Maria zei: Mijn ziel maakt de Heere groot, en mijn geest verheugt zich in God, mijn Zaligmaker; omdat Hij de nederigheid van Zijn dienstmaagd heeft aangezien; want zie, van nu af aan zullen alle geslachten mij zalig spreken.", "Jes 51:2": "Kijk naar Abraham, uw vader, en naar Sara, die u gebaard heeft; want Ik riep hem, toen hij nog alleen was, en Ik zegende hem, en Ik vermenigvuldigde hem.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Job 37:6": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Ps 38:16": "Want op U, HEERE! hoop ik; Gij zult verhoren, Heere, mijn God!", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Jes 31:5": "Zoals vliegende vogels, zo zal de HEERE van de heerscharen Jeruzalem beschutten, beschuttend zal Hij haar ook verlossen, voorbijgaand zal Hij haar ook uithelpen.", "Jer 17:12": "Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.", "Jes 49:9": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn.", "Jer 27:5": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Job 6:27": "Ook werpt u zich op een wees; en u graaft tegen uw vriend.", "Openb 21:4": "En God zal alle tranen van hun ogen afvegen; en de dood zal niet meer zijn; noch rouw, noch geroep, noch moeite zal er meer zijn; want de eerste dingen zijn weggegaan.", "Hand 14:17": "hoewel Hij Zichzelf toch niet zonder getuigenis gelaten heeft, doordat Hij goeddeed, ons vanuit de hemel regen en vruchtbare tijden gaf, en onze harten vervulde met voedsel en vreugde.", "Ps 145:2": "Beth. Elke dag zal ik U loven, en Uw Naam prijzen voor eeuwig en altijd.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "2 Tess 3:3": "Maar de Heere is getrouw, Die u zal versterken en bewaren van de boze.", "Jak 1:18": "Naar Zijn wil heeft Hij ons gebaard door het Woord van de waarheid, opdat wij zouden zijn als eerstelingen van Zijn schepselen.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Jer 31:10": "Hoort het woord van de HEERE, heidenvolken! En verkondigt het in de eilanden die ver weg zijn, en zegt: Hij, Die Israël verstrooid heeft, zal hem weer verzamelen, en hem bewaren zoals een herder zijn kudde.", "Jona 4:6": "En God, de HEERE, liet een wonderboom groeien en die opschieten boven Jona, zodat er schaduw zou zijn over zijn hoofd, om hem te bevrijden van zijn ellende. En Jona verheugde zich over de wonderboom met grote blijdschap.", "Job 4:7": "Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd?", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Jes 35:9": "Er zal geen leeuw zijn, en geen verscheurend gedierte zal daarop komen, en het zal daar niet gevonden worden; maar de verlosten zullen daarop wandelen.", "Joël 3:21": "En Ik zal hun bloed reinigen, dat Ik niet gereinigd had; en de HEERE zal wonen op Sion.", "Ps 23:1": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken.", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Jes 55:7-9": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig. Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE. Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.", "Ps 18:18": "Hij verloste mij van mijn sterke vijand, en van mijn haters, omdat zij machtiger waren dan ik.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "2 Sam 7:8": "Nu dan, zo zult u tegen Mijn knecht, tegen David, zeggen: Zo zegt de HEERE van de heerscharen: Ik heb u genomen van de schaapskooi, van achter de schapen, om een voorganger te zijn over Mijn volk, over Israël.", "Jer 31:28": "En het zal gebeuren, zoals Ik over hen gewaakt heb om uit te rukken, en af te breken, en te verstoren, en te verderven, en kwaad aan te doen; zo zal Ik over hen waken om te bouwen en te planten, spreekt de HEERE.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Ps 107:14-16": "Hij voerde hen uit de duisternis en de schaduw van de dood, en Hij brak hun banden. Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen; Want Hij heeft de koperen deuren gebroken, en de ijzeren grendels in stukken gehouwen.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Ps 65:4": "Onrechtvaardige dingen hadden de overhand over mij; maar onze overtredingen, die verzoent U.", "Spr 14:11": "Het huis van de goddelozen zal weggevaagd worden; maar de tent van de oprechten zal bloeien.", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "Ps 136:1-26": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Loof de God der goden; want Zijn goedertierenheid is voor eeuwig. Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Ps 121:3": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Ps 100:5": "Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Ps 107:15": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Ps 103:2-5": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden;", "Ps 119:116": "Ondersteun mij naar Uw toezegging, opdat ik leve; en laat mij niet beschaamd worden over mijn hoop.", "Jes 30:26": "En het licht van de maan zal zijn als het licht van de zon, en het licht van de zon zal zevenvoudig zijn als het licht van zeven dagen; op de dag dat de HEERE de breuk van Zijn volk zal verbinden, en de wond waarmee het geslagen is, genezen.", "Luk 18:8": "Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde?", "Ps 39:5": "HEERE, maak mij mijn einde bekend, en welke de mate van mijn dagen is; dat ik weet, hoe vergankelijk ik ben.", "Jes 1:25": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen.", "2 Kron 20:3-30": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda. En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.", "Ps 81:14-17": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld! In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders. Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Joh 1:3": "Alle dingen zijn door Hem gemaakt, en zonder Hem is geen ding gemaakt dat gemaakt is.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Jes 50:9": "Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Hab 3:6": "Hij stond, en mat het land, Hij zag toe, en maakte de heidenvolken los, en de aloude bergen zijn verstrooid geworden; de heuvels van eeuwigheid hebben zich gebogen; de gangen van eeuwigheid zijn van Hem.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Rom 8:25": "Maar als wij hopen wat wij niet zien, dan verwachten wij het met volharding.", "Ps 83:19": "opdat zij weten dat U alleen met Uw Naam de HEERE bent, de Allerhoogste over de hele aarde.", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Zef 3:12": "Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.", "Ps 109:31": "Want Hij zal de behoeftige ter rechterhand staan, om hem te verlossen van hen die zijn ziel veroordelen.", "Ex 25:17": "U zult ook een verzoendeksel maken van zuiver goud; twee el en een halve zal de lengte daarvan zijn, en anderhalve el de breedte daarvan.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Ps 97:12": "Rechtvaardigen, verblijd u in de HEERE, en spreek lof ter gedachtenis van Zijn heiligheid.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Ps 119:90": "Uw trouw is van geslacht tot geslacht; U hebt de aarde vastgemaakt, en zij blijft staan;", "Gen 3:19": "In het zweet van uw gezicht zult u brood eten, totdat u tot de aarde terugkeert, omdat u daaruit genomen bent; want u bent stof, en u zult tot stof terugkeren.", "Zach 1:17": "Roep nog, en zeg: Zo zegt de HEERE van de heerscharen: Mijn steden zullen nog uitgespreid worden vanwege de voorspoed; want de HEERE zal Sion nog troosten, en Hij zal Jeruzalem nog verkiezen.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Spr 8:28": "Toen Hij de opperwolken van boven vestigde; toen Hij de fonteinen van de afgrond vastmaakte;", "Ps 41:2-4": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads. De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden. De HEERE zal hem ondersteunen op het ziekbed; in zijn ziekte verandert U zijn hele leger.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Num 14:18-20": "De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht. Vergeef toch de ongerechtigheid van dit volk, naar de grootte van Uw goedertierenheid, en zoals U dit volk vergeven hebt, van Egypteland af tot hiertoe! En de HEERE zei: Ik heb hun vergeven naar uw woord.", "Ps 135:19": "U, huis van Israël! looft de HEERE; u, huis van Aäron! looft de HEERE.", "Jer 27:4-6": "En beveel hun om tegen hun heren te zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zo zult u tegen uw heren zeggen: Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "Ex 13:21": "En de HEERE ging voor hun aangezicht uit, overdag in een wolkkolom om hen de weg te leiden, en 's nachts in een vuurkolom om hen licht te geven, zodat zij dag en nacht konden voortgaan.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Ps 118:9": "Het is beter tot de HEERE toevlucht te nemen, dan op prinsen te vertrouwen.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Klaagl 3:21": "Zain. Dit zal ik mij ter harte nemen, daarom zal ik hopen;", "2 Kon 8:19": "Toch wilde de HEERE Juda niet verderven, omwille van David, Zijn dienaar; zoals Hij hem gezegd had dat Hij hem altijd een lamp zou geven voor zijn zonen.", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Spr 3:2": "Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen.", "Deut 10:15": "Alleen heeft de HEERE behagen gehad in uw vaderen, om hen lief te hebben, en heeft hun nageslacht na hen, u, uit alle volken uitverkoren, zoals het op deze dag is.", "Ps 111:4": "Zain. Hij heeft Zijn wonderen tot een gedachtenis gemaakt; Cheth. de HEERE is genadig en barmhartig.", "Matt 5:3-12": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen. Zalig zijn zij die treuren, want zij zullen vertroost worden. Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "Ps 63:4": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen.", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Ps 65:7": "Die de bergen vastzet door Zijn kracht, omgord met macht.", "Job 38:4-38": "Waar was u, toen Ik de aarde grondde? Geef het te kennen, indien u kloek van verstand bent. Wie heeft haar maten gezet, want u weet het; of wie heeft over haar een richtsnoer getrokken? Waarop zijn haar grondvesten neergezonken, of wie heeft haar hoeksteen gelegd?", "Ps 29:11": "De HEERE zal Zijn volk sterkte geven; de HEERE zal Zijn volk zegenen met vrede.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Ezech 18:4": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "Ps 135:1-3": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE! U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God! Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "Matt 18:23-27": "Daarom wordt het Koninkrijk der hemelen vergeleken met een zekere koning die met zijn dienstknechten rekening wilde houden. Toen hij nu begon te rekenen, werd er iemand bij hem gebracht die hem tienduizend talenten schuldig was. En omdat hij niet had waarmee hij kon betalen, beval zijn heer dat men hem zou verkopen, en zijn vrouw en kinderen, en alles wat hij had, en dat de schuld zo betaald zou worden.", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Jes 58:10": "En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.", "Jer 18:1-23": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei: Maak u op en ga naar het huis van de pottenbakker, en daar zal Ik u Mijn woorden doen horen. Zo ging ik naar het huis van de pottenbakker; en zie, hij maakte een werk op de schijven.", "Spr 19:23": "De vreze van de HEERE is ten leven; want men zal verzadigd zijnde overnachten; met het kwaad zal men niet bezocht worden.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Deut 11:8": "Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;", "Ps 31:21": "U verbergt hen in het verborgene van Uw aangezicht voor de hoogmoedigheden van de man; U versteekt hen in een hut voor de twist van de tongen.", "Jona 4:11": "En zou Ik dan die grote stad Ninevé niet ontzien? Daarin wonen meer dan honderdtwintigduizend mensen, die geen onderscheid weten te maken tussen hun rechterhand en hun linkerhand; en bovendien nog veel vee?", "Ps 22:29": "Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen.", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Ex 12:23": "Want de HEERE zal doorgaan, om de Egyptenaren te slaan; doch wanneer Hij het bloed zien zal aan de bovendorpel en aan de twee zijposten, zal de HEERE de deur voorbijgaan, en de verderver niet toelaten in uw huizen te komen om te slaan.", "Fil 1:6": "Ervan overtuigd dat Hij, Die in u een goed werk begonnen is, dat zal voleindigen tot op de dag van Jezus Christus;", "Ps 148:1-14": "Halleluja! Looft de HEERE uit de hemelen; looft Hem in de hoogste plaatsen! Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen! Looft Hem, zon en maan! Looft Hem, alle lichtende sterren!", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Matt 6:10": "Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Ex 23:20-31": "Zie, Ik zend een Engel voor uw aangezicht, om u te behoeden op deze weg, en om u te brengen naar de plaats die Ik voorbereid heb. Wees op uw hoede voor Zijn aangezicht, en wees Zijn stem gehoorzaam, en verbitter Hem niet; want Hij zal uw overtredingen niet vergeven; want Mijn Naam is in Hem. Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ex 19:4": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb.", "2 Tim 1:10": "Doch nu geopenbaard is door de verschijning van onze Zaligmaker Jezus Christus, Die de dood tenietgedaan heeft, en het leven en de onvergankelijkheid aan het licht gebracht heeft door het Evangelie;", "Fil 4:20": "Onze God en Vader nu zij de heerlijkheid tot in alle eeuwigheid. Amen.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Job 5:15": "Maar Hij verlost de behoeftige van het zwaard, van hun mond, en van de hand van de sterke.", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Hand 7:50": "Heeft Mijn hand niet al deze dingen gemaakt?", "Gen 9:16": "Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.", "Jes 65:8": "Zo zegt de HEERE: Zoals wanneer men most in een tros druiven vindt, men zegt: Verderf ze niet, want er is een zegen in; zo zal Ik het om Mijn knechten doen, dat Ik hen niet allen verderf.", "Jes 49:17": "Uw zonen zullen zich haasten; maar uw verstoorders en uw verwoesters zullen van u uitgaan.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "2 Kor 1:20": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Openb 11:4": "Dezen zijn de twee olijfbomen en de twee kandelaars, die voor de God van de aarde staan.", "Joh 10:34": "Jezus antwoordde hun: Staat er niet geschreven in uw wet: Ik heb gezegd, u bent goden?", "Job 37:17": "Hoe uw klederen warm worden, als Hij de aarde stil maakt vanuit het zuiden?", "Luk 21:18": "Toch zal er geen haar van uw hoofd verloren gaan.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 107:35-38": "Hij maakt van de woestijn een waterpoel, en van het dorre land waterbronnen. En Hij doet de hongerigen daar wonen, en zij stichten een stad om in te wonen; En bezaaien akkers, en planten wijngaarden, die vrucht opbrengen.", "1 Kor 7:8": "Maar ik zeg de ongetrouwden en de weduwen: het is goed voor hen als zij blijven zoals ik.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "Zach 9:8": "En Ik zal Mij rondom Mijn huis legeren, vanwege het leger, vanwege de doorgaande, en vanwege de wederkerende, opdat de drijver niet meer door hen doorga; want nu heb Ik het met Mijn ogen aangezien.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "2 Kor 3:5": "Niet dat wij uit onszelf bekwaam zijn om iets te bedenken, alsof het uit onszelf komt; maar onze bekwaamheid is uit God;", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "Ps 72:12-14": "Want hij zal de behoeftige redden, die daar roept, alsook de ellendige, en die geen helper heeft. Hij zal de arme en behoeftige verschonen, en de zielen van de behoeftigen verlossen. Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Ps 69:17": "Verhoor mij, o HEERE, want Uw goedertierenheid is goed; zie mij aan naar de grootheid van Uw barmhartigheden.", "Job 5:18-24": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen. In zes benauwdheden zal Hij u verlossen, en in de zevende zal het kwaad u niet aanraken. In de honger zal Hij u verlossen van de dood, en in de oorlog van het geweld van het zwaard.", "Jes 37:6": "En Jesaja zei tegen hen: Zo moet u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bang voor de woorden die u gehoord hebt, waarmee de knechten van de koning van Assyrië Mij gelasterd hebben.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Ex 8:23": "En Ik zal een verlossing zetten tussen Mijn volk en uw volk; tegen morgen zal dit teken gebeuren!", "Ps 135:13": "O HEERE! Uw Naam is er in eeuwigheid; HEERE! Uw gedachtenis is van geslacht tot geslacht.", "Job 13:12": "Uw spreuken zijn als as, uw verweer is als een verweer van leem.", "Ps 116:17-19": "Ik zal U een offer van dankzegging offeren, en de Naam van de HEERE aanroepen. Ik zal mijn gelofte de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk, in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "Gen 18:26-32": "Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen. En Abraham antwoordde en zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere, hoewel ik stof en as ben! Misschien zullen aan de vijftig rechtvaardigen vijf ontbreken; zult U dan om vijf de hele stad verwoesten? En Hij zei: Ik zal haar niet verwoesten, als Ik er vijfenveertig zal vinden.", "Ps 49:10": "dat hij ook voortaan voor altijd zou leven, en de vergankelijkheid niet zien.", "Matt 6:14": "Want als u de mensen hun misdaden vergeeft, zal uw hemelse Vader ook u vergeven.", "Ps 9:10": "En de HEERE zal een Hoog Vertrek zijn voor de verdrukte, een Hoog Vertrek in tijden van benauwdheid.", "Jes 12:1-6": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij. Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden. En u zult water scheppen met vreugde uit de fonteinen van het heil;", "Luk 1:72": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken;", "Jes 37:35": "Want Ik zal deze stad beschermen om die te verlossen, omwille van Mijzelf, en omwille van David, Mijn knecht.", "Ps 95:4": "In Wiens hand de diepste plaatsen van de aarde zijn, en de hoogten van de bergen zijn van Hem;", "Ps 148:6": "En Hij heeft ze bevestigd voor altijd, in eeuwigheid; Hij heeft hun een orde gegeven, die niemand van hen zal overtreden.", "1 Joh 3:3": "En ieder die deze hoop op Hem heeft, reinigt zichzelf, zoals Hij rein is.", "Ps 12:8": "U, HEERE, zult hen bewaren; U zult hen behoeden voor dit geslacht, tot in eeuwigheid.", "Jer 10:16": "Jakobs deel is niet gelijk die, want Hij is de Formeerder van alles, en Israël is de roede van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "Joz 21:45": "Er viel niet één woord weg van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam allemaal uit.", "Ps 99:9": "Verhef de HEERE, onze God, en buig u voor de berg van Zijn heiligheid; want de HEERE, onze God, is heilig.", "Gen 47:9": "En Jakob zei tegen Farao: De jaren van mijn vreemdelingschap zijn honderddertig jaar; weinig en zwaar zijn de jaren van mijn leven geweest, en zij hebben niet gehaald bij de jaren van het leven van mijn vaderen, in de dagen van hun vreemdelingschap.", "Ps 50:23": "Wie dank offert, die zal Mij eren; en wie zijn weg goed inricht, die zal Ik Gods heil doen zien.", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "1 Kor 15:19": "Als wij alleen in dit leven op Christus hopen, dan zijn wij de meest te beklagen van alle mensen.", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "Ps 34:2-4": "Aleph. Ik zal de HEERE loven te allen tijde; Zijn lof zal voortdurend in mijn mond zijn. Beth. Mijn ziel zal zich beroemen in de HEERE; de zachtmoedigen zullen het horen en zich verblijden. Gimel. Maakt de HEERE met mij groot, en laten wij Zijn Naam samen verhogen.", "Jes 26:4": "Vertrouw op de HEERE tot in eeuwigheid; want in de HEERE HEERE is een eeuwige rots.", "Ps 47:9": "God regeert over de heidenen; God zit op de troon van Zijn heiligheid.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Deut 30:4": "Al waren uw verdrevenen aan het einde van de hemel, van daar zal de HEERE, uw God, u bijeenbrengen, en van daar zal Hij u halen.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Ps 104:34": "Mijn overdenking van Hem zal zoet zijn; ik zal mij in de HEERE verblijden.", "Gen 28:20": "En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken;", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "Ps 104:3": "Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Spr 24:16": "Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.", "Ps 136:5": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Ps 119:62": "Te middernacht sta ik op, om U te loven voor de rechten van Uw gerechtigheid.", "Job 14:21": "Zijn kinderen komen tot eer, en hij weet het niet; of zij worden klein, en hij merkt het niet aan hen.", "Ps 105:1-5": "Looft de HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken. Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen. Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "Ex 22:22-24": "U mag geen weduwe of wees kwaad doen. Als u hen op enige manier kwaad doet, en zij roepen dan tot Mij, zal Ik hun geroep zeker verhoren; en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "Luk 1:54": "Hij heeft Israël, Zijn knecht, opgenomen, om Zijn barmhartigheid te gedenken,", "Job 5:12-14": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten. Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt. Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Ps 145:1": "Een lofzang van David. Aleph. O mijn God, U Koning! Ik zal U verhogen, en Uw Naam loven voor eeuwig en altijd.", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Ps 72:16": "Is er een handvol koren in het land op de hoogte van de bergen, de vrucht daarvan zal ruisen als de Libanon; en die van de stad zullen bloeien als het kruid van de aarde.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "Ps 115:3": "Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "Job 38:8-11": "Of wie heeft de zee met deuren toegesloten, toen zij uitbrak, en uit de baarmoeder voortkwam? Toen Ik de wolk tot haar kleding stelde, en de donkerheid tot haar windeldoek; Toen Ik voor haar met Mijn besluit de aarde doorbrak, en grendel en deuren zette;", "Ps 84:9": "HEERE, God van de heerscharen! hoor mijn gebed; neem het ter oren, o God van Jakob! Sela.", "Deut 15:6": "Want de HEERE, uw God, zal u zegenen, zoals Hij tot u heeft gesproken; zo zult u aan veel volken lenen, maar u zult niet lenen; en u zult over veel volken heersen, maar over u zullen zij niet heersen.", "Ps 85:3": "De misdaad van Uw volk hebt U weggenomen; U hebt al hun zonden bedekt. Sela.", "Ps 147:2": "De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël.", "Ps 90:3": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen!", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Ps 113:2": "De Naam van de HEERE zij geprezen, van nu af tot in eeuwigheid.", "Ps 144:15": "Gelukkig is het volk dat het zo vergaat; gelukkig is het volk wiens God de HEERE is.", "Jer 5:22": "Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Zach 9:12": "Keert u weer tot de sterkte, gebondenen, die daar hopen! Ook heden verkondig Ik, dat Ik u dubbel zal wedergeven;", "Rom 14:4": "Wie bent u, die de huisknecht van een ander oordeelt? Hij staat of valt voor zijn eigen heer; en hij zal staande gehouden worden, want God is machtig hem staande te houden.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Ps 84:5": "Gelukkig zijn zij, die in Uw huis wonen; zij prijzen U gestadig. Sela.", "Pred 12:5": "Ook wanneer zij bang zullen zijn voor de hoogte, en er verschrikkingen zullen zijn op de weg, en de amandelboom zal bloeien, en de sprinkhaan zichzelf een last zal zijn, en het verlangen zal vergaan; want de mens gaat naar zijn eeuwig huis, en de rouwklagers zullen in de straat rondgaan.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Job 11:6": "En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Ps 50:10-12": "Want al het gedierte van het woud is Mijn, de dieren op duizend bergen. Ik ken al het gevogelte van de bergen, en het wild van het veld is bij Mij. Zo Mij hongerde, Ik zou het u niet zeggen; want Mijn is de wereld en haar volheid.", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Spr 30:4": "Wie is naar de hemel opgeklommen, en neergedaald? Wie heeft de wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft alle einden van de aarde vastgesteld? Hoe is Zijn Naam, en hoe is de Naam van Zijn Zoon, als u het weet?", "Ps 21:4-6": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud. Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos. Groot is zijn eer door Uw heil; majesteit en heerlijkheid hebt U hem toegevoegd.", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Ps 91:1-16": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige. Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie.", "Pred 2:24-26": "Is het dan niet goed voor de mens dat hij eet en drinkt, en dat hij zijn ziel het goede laat genieten in zijn arbeid? Ik heb ook gezien dat dit uit de hand van God is. (Want wie zou ervan eten, of wie zou zich daartoe haasten, meer dan ikzelf?) Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Hand 2:46": "En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "1 Joh 4:16": "En wij hebben de liefde gekend en geloofd, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem.", "Jes 48:12": "Hoor naar Mij, o Jakob! En u, Israël, Mijn geroepene! Ik ben Dezelfde; Ik ben de Eerste, ook ben Ik de Laatste.", "Ps 149:1-9": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning. Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Jer 49:11": "Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.", "Pred 9:6": "Ook zijn hun liefde, hun haat en hun jaloezie al vergaan; en zij hebben geen deel meer in deze wereld, in alles wat er onder de zon gebeurt.", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Deut 33:25-29": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen! Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken. De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "1 Joh 3:1": "Zie, hoe grote liefde de Vader ons gegeven heeft, namelijk dat wij kinderen van God genoemd zouden worden. Daarom kent de wereld ons niet, omdat zij Hem niet kent.", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Deut 23:14": "Want de HEERE, uw God, wandelt in het midden van uw leger, om u te verlossen, en om uw vijanden aan u over te geven; daarom zal uw leger heilig zijn, opdat Hij niets schandelijks onder u ziet, en Zich niet van u afkeert.", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Hand 14:15": "Mannen, waarom doet u deze dingen? Ook wij zijn mensen net als u, en wij verkondigen u dat u zich van deze nutteloze dingen zou bekeren tot de levende God, Die de hemel, en de aarde, en de zee, en alles wat daarin is, gemaakt heeft;", "Ps 145:13": "Mem. Uw Koninkrijk is een Koninkrijk van alle eeuwen, en Uw heerschappij is in alle geslacht en geslacht.", "Klaagl 4:20": "Resch. De adem van onze neus, de gezalfde van de HEERE, is gevangen in hun kuilen; van wie wij zeiden: Wij zullen onder zijn schaduw leven onder de heidenen!", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Spr 3:24": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn.", "2 Kron 21:7": "Doch de HEERE wilde het huis van David niet te gronde richten, omwille van het verbond dat Hij met David gesloten had; en zoals Hij gezegd had hem en zijn zonen voor altijd een lamp te zullen geven.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "Dan 9:13": "Zoals geschreven is in de wet van Mozes, zo is al dat kwaad over ons gekomen; en wij smeekten het aangezicht van de HEERE, onze God, niet, door ons af te keren van onze ongerechtigheden en verstandig acht te geven op Uw waarheid.", "Klaagl 3:37": "Mem. Wie zegt iets, en het gebeurt, als de Heere het niet beveelt?", "Ps 119:164": "Ik loof U zevenmaal per dag, over de rechten van Uw gerechtigheid.", "Spr 21:31": "Het paar
