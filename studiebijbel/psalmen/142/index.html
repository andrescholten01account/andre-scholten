dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.","Ex 15:1-19":"Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen. De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen! De HEERE is een krijgsman; HEERE is Zijn Naam!","Ps 34:3":"Beth. Mijn ziel zal zich beroemen in de HEERE; de zachtmoedigen zullen het horen en zich verblijden.","Ps 130:1":"Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE!","Neh 1:4-6":"En het gebeurde, toen ik deze woorden hoorde, dat ik neerzat, en huilde, en rouw bedreef, enkele dagen; en ik vastte en bad voor het aangezicht van de God van de hemel. En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden. Laat toch Uw oor opmerkzaam, en Uw ogen open zijn, om te horen naar het gebed van Uw dienaar, dat ik vandaag voor Uw aangezicht bid, dag en nacht, voor de kinderen van Israël, Uw dienaren; en ik doe belijdenis over de zonden van de kinderen van Israël, die wij tegen U gezondigd hebben; ook ik en het huis van mijn vader, wij hebben gezondigd.","Dan 3:17":"Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.","Ps 89:40-52":"Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen. Allen die de weg voorbijgingen, hebben hem beroofd; voor zijn naburen is hij tot een smaad geweest.","Job 16:19":"Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.","Ps 3:7":"Ik zal niet bang zijn voor tienduizenden van het volk, die zich rondom tegen mij opstellen.","Ps 40:14":"Het behaagt U, HEERE! mij te verlossen; HEERE! haast U tot mijn hulp.","Ps 52:10":"Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.","Job 13:15":"Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.","Jer 20:12":"Gij dan, o HEERE van de heerscharen, Die de rechtvaardige beproeft, Die de nieren en het hart ziet, laat mij Uw wraak op hen zien, want ik heb U mijn rechtszaak voorgelegd.","Neh 4:5":"Dek hun ongerechtigheid niet toe, en laat hun zonde niet uitgewist worden van voor Uw aangezicht, want zij hebben U getergd, tegenover de bouwers.","Ps 54:6":"Zie, God is mij een Helper; de Heere is onder hen die mijn ziel ondersteunen.","Ps 83:2-19":"O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.","Ps 119:77":"Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.","Jes 26:1":"Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.","Hebr 5:7":"Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.","Jes 48:5":"Daarom heb Ik het u van toen af verkondigd, voordat het kwam, heb Ik het u doen horen; opdat u niet misschien zou zeggen: Mijn afgod heeft die dingen gedaan, of mijn gesneden beeld, of mijn gegoten beeld heeft ze bevolen.","Hebr 11:38":"(de wereld was hen niet waard) zij hebben rondgedoold in woestijnen, en op bergen, en in spelonken, en in holen van de aarde.","Dan 6:11":"Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.","Ps 27:12":"Geef mij niet over in de begeerte van mijn tegenstanders; want valse getuigen zijn tegen mij opgestaan, alsook wie geweld uitblaast.","Ps 22:5":"Op U hebben onze vaders vertrouwd; zij hebben vertrouwd, en U hebt hen uitgeholpen.","Ps 66:9":"Die onze zielen in het leven houdt, en niet toelaat dat onze voet wankelt.","Spr 17:3":"De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE toetst de harten.","Ps 26:12":"Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.","1 Kon 8:22-30":"En Salomo stond voor het altaar van de HEERE, tegenover de hele gemeente van Israël, en breidde zijn handen uit naar de hemel; en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen; Die Uw dienaar, mijn vader David, gehouden hebt wat U tot hem gesproken had; want met Uw mond hebt U gesproken, en met Uw hand vervuld, zoals het op deze dag is.","Dan 2:20":"Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.","Ps 52:3":"Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag.","Ps 16:2":"O mijn ziel, u hebt tegen de HEERE gezegd: U bent de Heere, mijn goedheid raakt niet tot U;","Job 24:1":"Waarom zouden voor de Almachtige de tijden niet verborgen zijn, terwijl zij die Hem kennen Zijn dagen niet zien?","Ps 40:18":"Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.","Ps 104:24":"Hoe groot zijn Uw werken, o HEERE! U hebt ze allemaal met wijsheid gemaakt; het aardrijk is vol van Uw rijkdom.","Ps 77:2":"Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen.","Job 13:21":"Doe Uw hand ver van mij weg, en laat Uw verschrikking mij niet verbaasd maken.","Ps 35:22":"HEERE! U hebt het gezien, zwijg niet; Heere! Wees niet ver van mij.","Ps 25:15":"Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.","Num 10:29":"Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.","Ps 106:47":"Verlos ons, HEERE, onze God! en verzamel ons uit de heidenen, opdat wij de Naam van Uw heiligheid loven, ons beroemend in Uw lof.","Ps 39:14":"Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.","Ps 6:2-8":"O HEERE, straf mij niet in Uw toorn, en tuchtig mij niet in Uw grimmigheid! Wees mij genadig, HEERE, want ik ben verzwakt; genees mij, HEERE, want mijn beenderen zijn verschrikt. Ja, mijn ziel is zeer verschrikt; en U, HEERE, hoe lang nog?","Neh 2:20":"Toen gaf ik hun antwoord, en zei tegen hen: De God van de hemel, Hij zal het ons doen gelukken, en wij, Zijn dienaren, zullen opstaan en bouwen; maar u hebt geen deel, geen recht, en geen aandenken in Jeruzalem.","Luk 18:1-7":"Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven, en Hij zei: Er was een zekere rechter in een stad, die God niet vreesde en geen mens ontzag. En er was een zekere weduwe in dezelfde stad, en zij kwam naar hem toe en zei: Doe mij recht tegenover mijn tegenpartij.","Ps 141:2":"Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer.","Ps 80:2":"O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.","Ps 139:1-24":"Een psalm van David, voor de koorleider. HEERE! U doorgrondt en kent mij. U weet mijn zitten en mijn opstaan; U verstaat van verre mijn gedachten. U omringt mijn gaan en mijn liggen; en U bent al mijn wegen gewend.","Jer 10:24":"Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat U mij niet te niet maakt.","Ps 59:10":"Tegen zijn sterkte zal ik op U wachten; want God is mijn Hoog Vertrek.","Ps 119:154":"Twist mijn twistzaak, en verlos mij, maak mij levend, naar Uw toezegging.","Jer 17:17":"Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.","Ps 141:1":"Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep.","Matt 26:44":"En Hij liet hen achter, ging opnieuw weg, en bad voor de derde keer, met dezelfde woorden.","Ex 18:11":"Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.","Jes 8:17":"Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.","2 Kor 4:9":"Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven;","Zach 4:10":"Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.","Rom 8:37":"Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.","Ps 35:1-3":"Een psalm van David. Twist, HEERE, met wie tegen mij twisten; strijd tegen wie tegen mij strijden. Grijp het schild en de rondas, en sta op tot mijn hulp. En breng de spies naar voren, en sluit de weg toe voor mijn vervolgers; zeg tegen mijn ziel: Ik ben uw Heil.","1 Kor 2:7":"Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;","Deut 2:7":"Want de HEERE, uw God, heeft u gezegend in al het werk van uw hand; Hij kent uw wandelen door deze zo grote woestijn; deze veertig jaren is de HEERE, uw God, met u geweest; niets heeft u ontbroken.","Ps 86:6":"HEERE! neem mijn gebed ter ore, en let op de stem van mijn smekingen.","Hand 15:18":"Aan God zijn al Zijn werken van eeuwigheid af bekend.","Joh 16:32":"Zie, de tijd komt, en is nu gekomen, dat u verstrooid zult worden, ieder naar het zijne, en u Mij alleen zult laten; en toch ben Ik niet alleen, want de Vader is met Mij.","Ps 25:16-19":"Pe. Wend U tot mij, en wees mij genadig, want ik ben eenzaam en ellendig. Tsade. De benauwdheden van mijn hart hebben zich wijd uitgestrekt; voer mij uit mijn noden. Resch. Zie mijn ellende, en mijn moeite, en neem al mijn zonden weg.","Job 28:24":"Want Hij schouwt tot aan de einden der aarde, Hij ziet onder al de hemelen.","2 Kon 19:27":"Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woeden tegen Mij.","Ps 31:5":"Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want U bent mijn Sterkte.","Ps 140:13":"Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.","Ps 9:15":"Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.","Ps 55:2":"O God! neem mijn gebed ter ore, en verberg U niet voor mijn smeking.","Ps 94:14":"Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.","Ps 27:5":"Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.","Jer 10:7":"Wie zou U niet vrezen, Koning van de heidenen? Want het komt U toe; omdat toch onder alle wijzen van de heidenen, en in hun hele koninkrijk, niemand U gelijk is.","Jes 25:9":"En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.","Klaagl 3:24":"Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen.","Ps 40:4":"En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.","Jes 44:7":"En wie zal, zoals Ik, roepen en het verkondigen, en het op orde voor Mij zetten, sinds Ik een eeuwig volk gesteld heb? En laat ze de toekomstige dingen, en die komen zullen, hun verkondigen.","Ex 5:24":"Toen zei de HEERE tegen Mozes: Nu zult u zien, wat Ik met Farao doen zal; want door een sterke hand zal hij hen laten trekken, ja, door een sterke hand zal hij hen uit zijn land verdrijven.","Ps 130:6":"Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen.","Hab 1:2":"HEERE! Hoe lang schreeuw ik, en U hoort niet, hoe lang roep ik: Geweld! tot U, en U verlost niet!","Fil 1:19-21":"Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus. Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood. Want het leven is voor mij Christus, en het sterven is winst.","2 Kor 5:7":"(Want wij wandelen door geloof en niet door aanschouwen.)","Ps 119:134":"Verlos mij van de overlast van de mens, en ik zal Uw bevelen onderhouden.","Jer 51:15":"Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid door Zijn verstand;","Gen 20:6":"En God zei tegen hem in de droom: Ik heb ook geweten dat u dit in oprechtheid van uw hart gedaan hebt, en Ik heb u ook belet om tegen Mij te zondigen; daarom heb Ik u niet toegelaten haar aan te raken.","Ps 7:8":"Zo zal de vergadering van de volken U omringen; keer dan boven haar terug in de hoogte.","Ps 17:3":"U hebt mijn hart geproefd, 's nachts bezocht, U hebt mij getoetst. U vindt niets; wat ik gedacht heb, overtreedt mijn mond niet.","Fil 4:6":"Wees over niets bezorgd; maar laat in alles, door bidden en smeken, met dankzegging uw verlangens bekend worden bij God;","Ps 27:13":"Als ik niet had geloofd dat ik het goede van de HEERE zou zien in het land van de levenden, dan was ik vergaan.","Ps 73:11":"Zodat zij zeggen: Hoe zou God het weten, en zou er kennis zijn bij de Allerhoogste?","Ps 28:1":"Een psalm van David. Tot U roep ik, HEERE! Mijn Rotssteen, houd U niet als doof van mij af; anders, als U zich stil houdt voor mij, word ik gelijk aan degenen die in de kuil neerdalen.","Ps 25:20":"Schin. Bewaar mijn ziel, en red mij; laat mij niet beschaamd worden, want ik vertrouw op U.","Ps 57:4":"Hij zal vanuit de hemel zenden, en mij verlossen, en te schande maken hem die mij zoekt te verslinden. Sela. God zal Zijn goedertierenheid en Zijn waarheid zenden.","2 Petr 3:13":"Maar wij verwachten, naar Zijn belofte, nieuwe hemelen en een nieuwe aarde, waarin gerechtigheid woont.","Num 20:16":"Toen riepen wij tot de HEERE, en Hij hoorde onze stem, en Hij zond een Engel, en Hij leidde ons uit Egypte; en zie, wij zijn te Kades, een stad aan de rand van uw gebied.","Ps 38:10":"Heere! Voor U is al mijn verlangen; en mijn zuchten is voor U niet verborgen.","Job 21:22":"Zal men God wetenschap leren, terwijl Hij hen die hoog zijn richt?","Ps 88:19":"U hebt vriend en metgezel ver van mij weggedaan; mijn bekenden zijn in duisternis.","Ps 136:23":"Die aan ons gedacht heeft toen wij vernederd waren; want Zijn goedertierenheid is voor eeuwig.","Jes 64:12":"HEERE! zou U Zich hierover inhouden, zou U zwijgen, en ons zozeer bedrukken?","2 Kron 32:7":"Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.","Jes 62:7":"En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.","Ps 56:7":"Zij rotten samen, zij versteken zich, zij letten op mijn hielen, zoals zij die op mijn ziel wachten.","Dan 3:16":"Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden.","1 Sam 12:23":"Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.","Ef 1:8":"Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;","Ps 136:5":"Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.","Ps 86:7":"In de dag van mijn benauwdheid roep ik U aan, want Gij verhoort mij.","Ps 119:41":"Vau. En dat mij Uw blijken van goedertierenheid overkomen, o HEERE! Uw heil, naar Uw toezegging;","Ps 74:10":"Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?","Ps 147:4":"Hij telt het aantal van de sterren; Hij noemt ze allemaal bij hun naam.","Neh 1:8-10":"Denk toch aan het woord, dat U Uw dienaar Mozes geboden hebt, en zei: Als u ontrouw wordt, zal Ik u onder de volken verstrooien. Maar als u zich tot Mij bekeert, en Mijn geboden houdt, en die doet; al waren uw verdrevenen aan het einde van de hemel, Ik zal hen vandaar verzamelen, en zal ze brengen naar de plaats die Ik gekozen heb om Mijn Naam daar te doen wonen. Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.","Ps 119:22":"Wentel van mij smaad en verachting, want ik heb Uw getuigenissen onderhouden.","Ps 119:145-147":"Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren. Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden. Ik ben de morgenschemering voorgekomen, en heb geschrei gemaakt; op Uw woord heb ik gehoopt.","Rom 8:18":"Want ik houd het ervoor, dat het lijden van deze tegenwoordige tijd niet opweegt tegen de heerlijkheid die aan ons geopenbaard zal worden.","Job 23:6":"Zou Hij naar de grootheid van Zijn macht met mij twisten? Nee; maar Hij zou acht op mij slaan.","Ps 21:8":"Want de koning vertrouwt op de HEERE, en door de goedertierenheid van de Allerhoogste zal hij niet wankelen.","Ps 4:9":"Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.","Ps 54:3-5":"O God! Verlos mij door Uw Naam, en doe mij recht door Uw macht. O God! Hoor mijn gebed; neig Uw oren tot de woorden van mijn mond. Want vreemden staan tegen mij op, en tirannen zoeken mijn ziel; zij stellen God niet voor hun ogen. Sela.","Luk 7:3":"En toen hij over Jezus gehoord had, zond hij de oudsten van de Joden naar Hem toe, en vroeg Hem dringend of Hij wilde komen om zijn dienstknecht gezond te maken.","Ps 92:6":"O HEERE! hoe groot zijn Uw werken! Zeer diep zijn Uw gedachten.","Ps 17:2":"Laat mijn recht van voor Uw aangezicht uitgaan, laat Uw ogen aanschouwen wat recht is.","Ps 28:7":"De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.","2 Kron 33:12":"En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,","Ps 138:8":"De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.","1 Kron 5:20":"Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden.","Neh 6:14":"Denk toch, mijn God, aan Tobia en aan Sanballat, naar deze daden van hen; en ook aan de profetes Noadja en de andere profeten, die mij bang hebben proberen te maken.","1 Sam 1:10":"Zij dan, bitter bedroefd zijnde, bad tot de HEERE, en zij weende zeer.","2 Kor 1:10":"Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.","Ps 71:5-7":"Want Gij zijt mijn Verwachting, Heere HEERE! mijn Vertrouwen van mijn jeugd af aan. Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U. Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.","Rom 8:38":"Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal,","Ps 38:2-23":"O HEERE! Straf mij niet in Uw grote toorn, en straf mij niet in Uw grimmigheid. Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald. Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.","Job 19:13-19":"Mijn broeders heeft Hij ver van mij gedaan; en die mij kennen, zeker, zij zijn van mij vervreemd. Mijn nabestaanden houden op, en mijn bekenden vergeten mij. Mijn huisgenoten en mijn dienstmaagden achten mij als een vreemde; een buitenlander ben ik in hun ogen.","Ps 16:8":"Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen.","Dan 6:17":"Toen beval de koning, en zij brachten Daniël naar voren, en wierpen hem in de kuil van de leeuwen; en de koning antwoordde en zei tegen Daniël: Uw God, Die u voortdurend eert, Die verlost u!","Ps 42:9":"Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.","Ps 11:1":"Een psalm van David, voor de koorleider. Ik vertrouw op de HEERE; hoe zegt u tegen mijn ziel: Vlucht naar uw gebergte, als een vogel?","2 Kor 12:8":"Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken.","Ps 69:37":"En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.","2 Kron 6:24-39":"En wanneer Uw volk Israël voor het aangezicht van de vijand geslagen zal worden, omdat zij tegen U gezondigd zullen hebben, en zich bekeren, en Uw Naam belijden, en voor Uw aangezicht in dit huis bidden en smeken zullen, Hoor U dan uit de hemel, en vergeef de zonden van Uw volk Israël, en breng hen terug in het land dat U hun en hun vaders gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben, en zij in deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;","Ps 143:3":"Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.","2 Sam 15:31":"Toen liet men David weten, en zei: Achitofel is onder degenen die zich met Absalom hebben verbonden. Toen zei David: HEERE, maak toch de raad van Achitofel tot dwaasheid.","Ps 57:5":"Mijn ziel is te midden van leeuwen, ik lig tussen mensen die vuur spuwen, mensenkinderen, wier tanden speren en pijlen zijn, en hun tong een scherp zwaard.","2 Tim 2:11-13":"Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven; als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen; als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.","2 Kron 13:10":"Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.","Hand 1:24":"En zij baden en zeiden: U, Heere! U, Kenner van de harten van allen, wijs van deze twee er één aan, die U uitverkoren hebt,","Matt 22:15":"Toen gingen de Farizeeën heen en overlegden samen hoe zij Hem in Zijn woorden konden verstrikken.","Ps 144:10":"U, Die de koningen overwinning geeft, Die Zijn dienaar David bevrijdt van het boze zwaard;","Ps 55:2-18":"O God! neem mijn gebed ter ore, en verberg U niet voor mijn smeking. Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier; Om het geroep van de vijand, vanwege de beangstiging van de goddeloze; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.","2 Sam 7:20":"En wat zal David nog meer tot U spreken? Want U kent Uw knecht, Heere HEERE!","Job 12:22":"Hij openbaart de diepten uit de duisternis, en de schaduw van de dood brengt Hij voort in het licht.","Hebr 11:7-11":"Door het geloof heeft Noach, door God gewaarschuwd over de dingen die nog niet gezien werden, en bevreesd geworden, de ark gebouwd tot redding van zijn huisgezin; door dit geloof heeft hij de wereld veroordeeld, en is hij een erfgenaam geworden van de rechtvaardigheid die naar het geloof is. Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou. Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.","1 Joh 4:16":"En wij hebben de liefde gekend en geloofd, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem.","Klaagl 5:1":"Denk, HEERE, aan wat ons gebeurd is, kijk ernaar en zie onze smaad aan.","Ps 60:14":"In God zullen wij kloeke daden doen, en Hij zal onze tegenstanders vertreden.","Jes 26:8":"Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.","Jes 12:2":"Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.","Ps 79:1":"Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt.","Ps 85:6-8":"Zult U eeuwig tegen ons toornen? Zult U Uw toorn uitstrekken van geslacht tot geslacht? Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt? Toon ons Uw goedertierenheid, o HEERE, en geef ons Uw heil.","Ps 102:14":"U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.","Spr 21:2":"Elke weg van een mens is recht in zijn eigen ogen; maar de HEERE weegt de harten.","Mark 13:32":"Maar van die dag en dat uur weet niemand, ook de engelen in de hemel niet, en ook de Zoon niet, maar alleen de Vader.","Ps 94:7":"En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet.","1 Sam 22:2":"En bij hem verzamelden zich alle mannen die benauwd waren, en alle mannen die een schuldeiser hadden, en alle mannen wier ziel bitter bedroefd was, en hij werd hun aanvoerder; zodat er bij hem omtrent vierhonderd mannen waren.","Ps 47:5":"Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.","Ps 102:2":"O HEERE! Hoor mijn gebed, en laat mijn geroep tot U komen.","Jes 33:2":"HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.","Jer 27:8":"En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.","Ps 31:4-7":"Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam. Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want U bent mijn Sterkte. In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!","1 Kor 1:25":"Want het dwaze van God is wijzer dan de mensen; en het zwakke van God is sterker dan de mensen.","Ps 9:5":"Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.","Ps 141:9":"Bewaar mij voor het geweld van de strik, die zij mij gelegd hebben, en voor de valstrikken van de werkers van de ongerechtigheid.","Ps 62:8":"In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.","2 Kon 19:19":"Nu dan, HEERE, onze God, verlos ons toch uit zijn hand; zo zullen alle koninkrijken van de aarde weten dat U, HEERE, alleen God bent.","Ps 46:2-4":"God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden. Daarom zullen wij niet vrezen, al veranderde de aarde haar plaats, en al werden de bergen verzet in het hart van de zeeën; Laat haar water bruisen, laat het beroerd worden; laat de bergen daveren, door de verheffing daarvan! Sela.","Ps 61:7":"U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;","Ps 74:12":"Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.","Ps 119:74":"Die U vrezen, zullen mij aanzien, en zich verblijden, omdat ik op Uw woord gehoopt heb.","1 Sam 17:37":"Verder zei David: De HEERE, Die mij gered heeft uit de klauw van de leeuw en uit de klauw van de beer, Die zal mij redden uit de hand van deze Filistijn. Toen zei Saul tegen David: Ga heen, en de HEERE zij met u!","2 Kon 18:5":"Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.","Ps 108:13":"Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.","Ps 71:16":"Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.","Jona 2:1-10":"En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis. En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.","Ps 69:36":"Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;","Ps 20:2":"De HEERE verhoort u in de dag van benauwdheid; de Naam van de God van Jakob zet u in een hoog vertrek.","Ps 60:12":"Zult U het niet zijn, o God! Die ons verstoten had, en niet uittrok, o God! met onze legers?","Ps 119:82":"Mijn ogen zijn bezweken van verlangen naar Uw toezegging, terwijl ik zei: Wanneer zult U mij vertroosten?","Ps 44:6":"Door U zullen wij onze tegenstanders met hoorns stoten; in Uw Naam zullen wij vertrappen die tegen ons opstaan.","Jer 18:22":"Laat er een geschrei uit hun huizen gehoord worden, wanneer U snel een bende over hen brengt; omdat zij een kuil gegraven hebben om mij te vangen, en strikken verborgen hebben voor mijn voeten.","Spr 15:11":"Het dodenrijk en het verderf liggen open voor de HEERE; hoeveel te meer de harten van de mensenkinderen?","Ps 79:8":"Denk ons de vorige misdaden niet aan; haast U, laat Uw barmhartigheden ons tegemoetkomen; want wij zijn zeer zwak geworden.","Ps 74:3":"Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.","Ps 91:2":"Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw!","Ps 56:14":"Want U hebt mijn ziel gered van de dood; ook niet mijn voeten van aanstoot, om voor Gods aangezicht te wandelen in het licht van de levenden?","1 Sam 1:16":"Beschouw uw dienstmaagd toch niet als een dochter van Belial; want ik heb tot nu toe gesproken uit de veelheid van mijn gedachten en van mijn verdriet.","Ps 79:11":"Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.","2 Kor 4:13":"Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;","Ps 119:170":"Laat mijn smeken voor Uw aanschijn komen, red mij naar Uw toezegging.","Neh 9:10":"En U hebt tekenen en wonderen gedaan aan Farao, en aan al zijn knechten, en aan al het volk van zijn land; want U wist, dat zij trots tegen hen handelden; en U hebt U een Naam gemaakt, zoals het is op deze dag.","Ps 89:19":"Want ons schild is van de HEERE, en onze koning is van de Heilige van Israël.","Ps 86:3":"Wees mij genadig, Heere! want ik roep tot U de hele dag.","Ps 25:5":"He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.","Ps 69:2-37":"Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel. Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij. Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.","Ps 103:14":"Want Hij weet wat voor maaksel wij zijn, en Hij denkt eraan dat wij stof zijn.","Matt 6:4":"opdat uw aalmoes in het verborgene is; en uw Vader, Die in het verborgene ziet, Die zal het u in het openbaar vergelden.","Ps 57:2":"Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.","Jona 2:2-9":"En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen. En ik zei: Ik ben weggestoten van voor Uw ogen; toch zal ik de tempel van Uw heiligheid weer aanschouwen.","Hebr 4:13":"En er is geen schepsel onzichtbaar voor Hem; maar alle dingen zijn naakt en geopend voor de ogen van Hem, met Wie wij te maken hebben.","Ps 142:6-8":"Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden. Let op mijn geschrei, want ik ben zeer uitgeput; red mij van mijn vervolgers, want zij zijn sterker dan ik. Voer mijn ziel uit de gevangenis, om Uw Naam te loven; de rechtvaardigen zullen mij omringen, wanneer U goed voor mij zult zijn geweest.","Ps 35:17":"Heere! Hoe lang zult U toezien? Breng mijn ziel weer van hun verwoestingen, mijn eenzame van de jonge leeuwen.","1 Sam 24:4":"En hij kwam bij de schaapskooien aan de weg, waar een spelonk was; en Saul ging daarin, om zijn voeten te bedekken. David nu en zijn mannen zaten aan de zijkanten van de spelonk.","Jes 26:16":"HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.","Rom 8:28":"En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.","Ps 102:25":"Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht.","Ps 54:3":"O God! Verlos mij door Uw Naam, en doe mij recht door Uw macht.","1 Kor 9:26":"Ik loop dan zo, niet als op het onzekere; ik strijd zo, niet als iemand die de lucht slaat;","Gen 6:22":"En Noach deed het; naar alles wat God hem geboden had, zo deed hij.","Ps 140:2-14":"Red mij, HEERE, van de kwade mens; behoed mij voor de man van geweld; Die veel kwaad in het hart bedenken, elke dag komen zij samen om te oorlogen. Zij scherpen hun tong als een slang; heet addervergif is onder hun lippen. Sela.","Jes 50:7-9":"Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.","Micha 7:20":"U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt.","Ps 17:1":"Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.","Hand 2:24":"Hem heeft God opgewekt, want Hij ontbond de smarten van de dood, omdat het niet mogelijk was dat Hij daardoor vastgehouden zou worden.","Ps 94:18":"Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.","Ps 120:2":"O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong.","Ps 147:5":"Onze Heere is groot en heeft veel kracht; van Zijn verstand is geen aantal te noemen.","Ps 59:2-18":"Red mij van mijn vijanden, o mijn God! Stel mij in een hoog vertrek voor hen die tegen mij opstaan. Red mij van de werkers van de ongerechtigheid, en verlos mij van de mannen van het bloed. Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!","Ps 31:9":"En mij niet hebt overgeleverd in de hand van de vijand; U hebt mijn voeten doen staan in de ruimte.","Gen 32:24-29":"Maar Jakob bleef alleen achter; en een man worstelde met hem, totdat de dageraad opging. En toen Hij zag dat Hij niet de overhand over hem kreeg, raakte Hij zijn heupgewricht aan, zodat het heupgewricht van Jakob verwrongen raakte, terwijl Hij met hem worstelde. En Hij zei: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zei: Ik zal U niet laten gaan, tenzij U mij zegent.","Jer 15:15":"O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.","Ps 71:20":"Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.","1 Sam 17:36":"Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.","Ps 40:5":"Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot   // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
