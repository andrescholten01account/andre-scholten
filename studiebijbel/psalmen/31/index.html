","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm[1] van David, voor de koorleider[2].","2":"Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid.","3":"Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden.","4":"Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.","5":"Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want U bent mijn Sterkte.","6":"In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!","7":"Ik haat hen die op valse ijdelheden acht slaan, en ik vertrouw op de HEERE.","8":"Ik zal mij verheugen en verblijden in Uw goedertierenheid, omdat U mijn ellende hebt aangezien, en mijn ziel in benauwdheden gekend hebt;","9":"En mij niet hebt overgeleverd in de hand van de vijand; U hebt mijn voeten doen staan in de ruimte.","10":"Wees mij genadig, HEERE! Want ik heb het benauwd; van verdriet is mijn oog doorknaagd, mijn ziel en mijn buik.","11":"Want mijn leven is verteerd van droefenis, en mijn jaren van zuchten; mijn kracht is vervallen door mijn ongerechtigheid, en mijn beenderen zijn doorknaagd.","12":"Vanwege al mijn wederpartijders ben ik, ook voor mijn buren, zeer tot een smaad geworden, en voor mijn bekenden tot een schrik; die mij op de straten zien, vluchten van mij weg.","13":"Ik ben uit het hart vergeten als een dode; ik ben geworden als een gebroken vat.","14":"Want ik hoorde de kwaadsprekerij van velen; vrees is van rondom, omdat zij samen tegen mij overleggen; zij zijn van plan mijn ziel te nemen.","15":"Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God.","16":"Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers.","17":"Laat Uw aangezicht over Uw knecht lichten; verlos mij door Uw goedertierenheid.","18":"HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.","19":"Laat de valse lippen stom worden, die hard spreken tegen de rechtvaardige, in hoogmoed en verachting.","20":"O, hoe groot is Uw goed, dat U weggelegd hebt voor hen die U vrezen; dat U gewrocht hebt voor hen die op U vertrouwen, in de tegenwoordigheid van de mensenkinderen!","21":"U verbergt hen in het verborgene van Uw aangezicht voor de hoogmoedigheden van de man; U versteekt hen in een hut voor de twist van de tongen.","22":"Geloofd zij de HEERE, want Hij heeft Zijn goedertierenheid aan mij wonderlijk gemaakt, *mij voerende als* in een vaste stad.","23":"Ik zei wel in mijn haast: Ik ben afgesneden van voor Uw ogen; maar toch hoorde U de stem van mijn smekingen, toen ik tot U riep.","24":"Heb de HEERE lief, u, al Zijn gunstgenoten[3]! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.","25":"Wees sterk, en Hij zal uw hart versterken, allen u, die op de HEERE hoopt!"},"SV":{"1":"Een psalm van David, voor den opperzangmeester.","2":"Op U, o HEERE! betrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij uit door Uw gerechtigheid.","3":"Neig Uw oor tot mij, red mij haastelijk; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden.","4":"Want Gij zijt mijn Steenrots en mijn Burg; leid mij dan, en voer mij, om Uws Naams wil.","5":"Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want Gij zijt mijn Sterkte.","6":"In Uw hand beveel ik mijn geest; Gij hebt mij verlost, HEERE, Gij, God der waarheid!","7":"Ik haat degenen, die op valse ijdelheden acht nemen, en ik betrouw op den HEERE.","8":"Ik zal mij verheugen en verblijden in Uw goedertierenheid, omdat Gij mijn ellende hebt aangezien, *en* mijn ziel in benauwdheden gekend;","9":"En mij niet hebt overgeleverd in de hand des vijands; Gij hebt mijn voeten doen staan in de ruimte.","10":"Wees mij genadig, HEERE! want mij is bange; van verdriet is doorknaagd mijn oog, mijn ziel en mijn buik.","11":"Want mijn leven is verteerd van droefenis, en mijn jaren van zuchten; mijn kracht is vervallen door mijn ongerechtigheid, en mijn beenderen zijn doorknaagd.","12":"Vanwege al mijn wederpartijders ben ik, ook mijn naburen, grotelijks tot een smaad geworden, en mijn bekenden tot een schrik; die mij op de straten zien, vlieden van mij weg.","13":"Ik ben uit het hart vergeten als een dode; ik ben geworden als een bedorven vat.","14":"Want ik hoorde de naspraak van velen; vreze is van rondom, dewijl zij te zamen tegen mij raadslaan; zij denken mijn ziel te nemen.","15":"Maar ik vertrouw op U, o HEERE! Ik zeg: Gij zijt mijn God.","16":"Mijn tijden zijn in Uw hand; red mij van de hand mijner vijanden, en van mijn vervolgers.","17":"Laat Uw aangezicht over Uw knecht lichten; verlos mij door Uw goedertierenheid.","18":"HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.","19":"Laat de valse lippen stom worden, die hard spreken tegen den rechtvaardige, in hoogmoed en verachting.","20":"O, hoe groot is Uw goed, dat Gij weggelegd hebt voor degenen, die U vrezen; *dat* Gij gewrocht hebt voor degenen, die op U betrouwen, in de tegenwoordigheid der mensenkinderen!","21":"Gij verbergt hen in het verborgene Uws aangezichts voor de hoogmoedigheden des mans; Gij versteekt hen in een hut voor den twist der tongen.","22":"Geloofd zij de HEERE, want Hij heeft Zijn goedertierenheid aan mij wonderlijk gemaakt, *mij* *voerende* *als* in een vaste stad.","23":"Ik zeide wel in mijn haasten: Ik ben afgesneden van voor Uw ogen; dan nog hoordet Gij de stem mijner smekingen, als ik tot U riep.","24":"Hebt den HEERE lief, gij, al Zijn gunstgenoten! *want* de HEERE behoedt de gelovigen, en vergeldt overvloediglijk dengene, die hoogmoed bedrijft.","25":"Zijt sterk, en Hij zal ulieder hart versterken, allen gij, die op den HEERE hoopt!"},"KJV":{"1":"[[To the chief Musician, A Psalm of David.]] In thee, O LORD, do I put my trust; let me never be ashamed: deliver me in thy righteousness.","2":"[[To the chief Musician, A Psalm of David.]] In thee, O LORD, do I put my trust; let me never be ashamed: deliver me in thy righteousness.","3":"Bow down thine ear to me; deliver me speedily: be thou my strong rock, for an house of defence to save","4":"For thou *art* my rock and my fortress; therefore for thy name's sake lead me, and guide","5":"Pull me out of the net that they have laid privily for me: for thou *art* my strength.","6":"Into thine hand I commit my spirit: thou hast redeemed me, O LORD God of truth.","7":"I have hated them that regard lying vanities: but I trust in the LORD.","8":"I will be glad and rejoice in thy mercy: for thou hast considered my trouble; thou hast known my soul in adversities;","9":"And hast not shut me up into the hand of the enemy: thou hast set my feet in a large room.","10":"Have mercy upon me, O LORD, for I am in trouble: mine eye is consumed with grief, *yea*, my soul and my belly.","11":"For my life is spent with grief, and my years with sighing: my strength faileth because of mine iniquity, and my bones are consumed.","12":"I was a reproach among all mine enemies, but especially among my neighbours, and a fear to mine acquaintance: they that did see me without fled","13":"I am forgotten as a dead man out of mind: I am like a broken vessel.","14":"For I have heard the slander of many: fear *was* on every side: while they took counsel together against me, they devised to take away my life.","15":"But I trusted in thee, O LORD: I said, Thou *art* my God.","16":"My times *are* in thy hand: deliver me from the hand of mine enemies, and from them that persecute","17":"Make thy face to shine upon thy servant: save me for thy mercies'","18":"Let me not be ashamed, O LORD; for I have called upon thee: let the wicked be ashamed, *and* let them be silent in the grave.","19":"Let the lying lips be put to silence; which speak grievous things proudly and contemptuously against the righteous.","20":"*Oh* how great *is* thy goodness, which thou hast laid up for them that fear thee; *which* thou hast wrought for them that trust in thee before the sons of men!","21":"Thou shalt hide them in the secret of thy presence from the pride of man: thou shalt keep them secretly in a pavilion from the strife of tongues.","22":"Blessed *be* the LORD: for he hath shewed me his marvellous kindness in a strong city.","23":"For I said in my haste, I am cut off from before thine eyes: nevertheless thou heardest the voice of my supplications when I cried","24":"O love the LORD, all ye his saints: *for* the LORD preserveth the faithful, and plentifully rewardeth the proud doer.","25":"Be of good courage, and he shall strengthen your heart, all ye that hope in the LORD."}},"tsk":{"2":[{"kopje":"U","refs":["Ps 22:5","Ps 22:6","Ps 25:2","Ps 71:1","Ps 71:2","Jes 49:23","Rom 5:5","Rom 10:11"]},{"kopje":"help mij eruit","refs":["Ps 7:9","Ps 7:10","Ps 43:1","Ps 143:1","Ps 143:11","Ps 143:12","Dan 9:16"]}],"3":[{"kopje":"Neig","refs":["Ps 71:2","Ps 86:1","Ps 130:2","Spr 22:17"]},{"kopje":"red mij","refs":["Ps 40:18","Ps 69:18","Ps 79:1","Ps 102:3","Ps 143:7","Job 7:21","Luk 18:8"]},{"kopje":"sterke Rotssteen","refs":["Ps 18:2","Ps 18:3","Ps 62:8",  wl-kjv\" data-code=\"H3467\">save</span> me for thy mercies'","18":"Let me not be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> for I have <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> upon thee: let the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> be <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed,</span> and let them be <span class=\"wl wl-kjv\" data-code=\"H1826\">silent</span> in the grave.","19":"Let the <span class=\"wl wl-kjv\" data-code=\"H8267\">lying</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> be put to <span class=\"wl wl-kjv\" data-code=\"H481\">silence;</span> which <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H6277\">grievous</span> things <span class=\"wl wl-kjv\" data-code=\"H1346\">proudly</span> and <span class=\"wl wl-kjv\" data-code=\"H937\">contemptuously</span> against the righteous.","20":"Oh how <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> is thy <span class=\"wl wl-kjv\" data-code=\"H2898\">goodness,</span> which thou hast laid <span class=\"wl wl-kjv\" data-code=\"H6845\">up</span> for them that <span class=\"wl wl-kjv\" data-code=\"H3373\">fear</span> thee; which thou hast <span class=\"wl wl-kjv\" data-code=\"H6466\">wrought</span> for them that <span class=\"wl wl-kjv\" data-code=\"H2620\">trust</span> in thee before the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of men!","21":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H5641\">hide</span> them in the <span class=\"wl wl-kjv\" data-code=\"H5643\">secret</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> from the <span class=\"wl wl-kjv\" data-code=\"H7407\">pride</span> of <span class=\"wl wl-kjv\" data-code=\"H376\">man:</span> thou shalt keep them <span class=\"wl wl-kjv\" data-code=\"H6845\">secretly</span> in a <span class=\"wl wl-kjv\" data-co "kanttekeningen_nl":{"1":[{"catchword":"opperzangmeester","tekst":"Zie Psa 4:1 ."},{"catchword":"gerechtigheid","tekst":"Die vereist dat Gij uw woord houdt en mijn rechtvaardige zaak voorstaat, gelijk Psa 71:2 ."}],"2":[{"catchword":"opperzangmeester","tekst":"Zie Psa 4:1 ."},{"catchword":"gerechtigheid","tekst":"Die vereist dat Gij uw woord houdt en mijn rechtvaardige zaak voorstaat, gelijk Psa 71:2 ."}],"3":[{"catchword":"sterke","tekst":"Hebr. rotssteen der sterkte."},{"catchword":"zeer","tekst":"Hebr. huis, of plaats der vastigheden of vestingen."}],"4":[{"catchword":"voer","tekst":"Gelijk een herder zijne schapen. Alzo boven Psa 23:2 ."}],"5":[{"catchword":"verborgen","tekst":"Dat is, in het verborgene of heimelijke gelegd hebben."}],"6":[{"catchword":"geest;","tekst":"Dat is, mijne ziel beveel ik uwe macht, bewaring, zorg en opzicht."},{"catchword":"waarheid","tekst":"Of, trouw; dat is, Gij waarachtige, of getrouwe God, die uwe beloften, aan mij gedaan, gehouden hebt."}],"7":[{"catchword":"valse","tekst":"Of, nietige; Hebr. ijdelheden der valsheid of nietigheid. Hij bedoelt die op vleselijke en afgodische hulp vertrouwen. Zie Deu 32:21 ; 1Ki 16:26 ; 2Ki 17:15 ; Psa 62:11 ; Jer 2:5 , en Jer 8:19 , en Jer 10:15 , en Jer 14:22 , en Jer 23:16 ; Rom 1:21 . Verg. Lev 19:4 ."}],"8":[{"catchword":"aangezien","tekst":"Zie Gen 16:13 ."},{"catchword":"gekend","tekst":"Mij niet versmaad, maar bemind en verzord. Verg. Gen 18:19 ; Psa 1:6 ."}],"9":[{"catchword":"overgeleverd","tekst":"Of, besloten; gelijk elders."}],"10":[{"catchword":"van verdriet","tekst":"Gelijk Psa 6:8 ."}],"11":[{"catchword":"vervallen","tekst":"Als wanneer iemand door onvermogen en zwakheid struikelt en daarheen valt. Verg. Psa 109:24 , en zie het tegendeel Psa 105:37 ."},{"catchword":"ongerechtigheid,","tekst":"Dat is, straf mijner ongerechtigheid. Zie Gen 4:13 , en Gen 19:15 , en verg. Num 14:33 ; Jer 51:6 ."}],"12":[{"catchword":"grotelijks","tekst":"Hebr. zeer."},{"catchword":"vlieden","tekst":"Opdat zij bij mijne wederpartijders niet verdacht mogen worden, alsof zij mijne zaak toegedaan of mijne vrienden waren."}],"13":[{"catchword":"bedorven","tekst":"Of vergaande, verloren gaande, ten naastenbij bedorven, dat men gans weinig of niet acht, als nergens meer nut toe zijnde. Verg. Deu 26:5 ; Psa 119:176 ; idem Jer 22:28 ."}],"14":[{"catchword":"naspraak","tekst":"Of, faamroving, lastering, kwaadspreken. Verg. Jer 20:10 ."},{"catchword":"van velen;","tekst":"Of, der groten."},{"catchword":"denken","tekst":"Of, praktiseren, maken aanslagen om, enz."},{"catchword":"ziel","tekst":"Dat is, mijn leven. Of aldus: Als zij tezamen tegen mij raadslaan, zo denken zij mijne ziel te nemen."}],"16":[{"catchword":"tijden","tekst":"Dat is, mijn leven en al mijn wedervaren; hoe het mij ook zou mogen gaan, ik weet dat het alles aan U hangt, dat Gij het alles regeert, en dat het niets is in mijner vijanden macht."}],"17":[{"catchword":"aangezicht","tekst":"Zie Num 6:25-26 ."}],"18":[{"catchword":"graf","tekst":"Dat zij, van de aarde weggenomen zijnde, hun kwade praktijken, lasteringen en geweld moeten laten achterstaan. Anders, laat hen afgesneden, of uitgeroeid worden ten grave; gelijk hHet Hebr. woord ook genomen wordt, Psa 49:13 , Psa 49:21 , enz."}],"19":[{"catchword":"valse","tekst":"Hebr. lippen der valsheid. Zie Psa 12:3 , en Psa 27:12 , enz."}],"20":[{"catchword":"groot","tekst":"Of, menigvuldig. Dit ziet wel op het goede, dat God den zijnen in het algemeen naar ziel en lichaam bereidt en voor hen, als in ene schatkamer opgesloten heeft, om daaruit ter bekwamer en bestemder tijd tot hun best voor den dag te brengen en hun te doen genieten; maar spruit uit overdenking van een bijzondere en onverwachte wonderlijke verlossing aan David bewezen, als hij in een zeer groot gevaar was van overvallen te worden, en niet kon gedenken dat God zulk een verlossing voor hem bereid had, als hem wedervoer; waarover hij aldus met verwondering uitroept."},{"catchword":"in de","tekst":"Hebr. tegenover, voor; dat is, in het aanschouwen van al de wereld, openbaar makende der vromen onschuld, en met uw wonderlijke onvoorziene hulp bewijzende dat zij U lief zijn, die tot U hunne toevlucht nemen met gelovige gebeden."}],"21":[{"catchword":"uws","tekst":"Door betoning van uw vaderlijke gunst en genade tegenwoordigheid, vertroost en behoudt Gij hen op een wonderlijke verborgen wijze, waarvan de wereld geen verstand heeft, zelfs dikwijls in verborgen schuilplaatsen, waar Gij hen heenleidt, het oog op hen hebt, hen bezorgt en beschut. Dit is aan David wel gebleken. Zie ook 1Ki 18:4 , en 1Ki 19:4-5 , 1Ki 19:9 , 1Ki 19:11 , enz.; Heb 11:38 . Verg. ook Psa 27:5 , en Psa 32:7 ."},{"catchword":"hoogmoedigheden","tekst":"Of, verbintenissen, samenkoppelingen, doorvlochten en doornaaide praktijken, of ruwe aanslagen."},{"catchword":"des mans","tekst":"Hierdoor kan men een groot en machtig persoon, als Saul, verstaan; of men kan het nemen, des mans; dat is, des mensen, der mensen, of een iegenlijk."},{"catchword":"twist","tekst":"Dat is, twistige tongen, die den vromen steeds allerlei verdriet, moeite en gevaar berokkenen met achterklap en valse beschuldigingen. Zie Psa 35:11 ."}],"22":[{"catchword":"Geloofd","tekst":"Hebr. gezegend."},{"catchword":"gemaakt,","tekst":"Dat is, op een wonderbare wijze aan mij bewezen. Verg. Psa 4:4 ; zie het tegendeel Deu 28:59 ."},{"catchword":"vaste stad","tekst":"Hebr. stad der vastigheid; hij wil zeggen dat God hem zowel bewaard heeft in het open veld, waar hij omsingeld scheen te wezen en niet te kunnen ontkomen, alsof hij in een sterke vaste stad geweest ware."}],"23":[{"catchword":"zeide","tekst":"Te weten, bij mijzelven, dat is, ik dacht."},{"catchword":"haasten","tekst":"Dit schijnt te zien op de historie, 1Sa 23:26 ; alwaar hetzelfde Hebr. woord van Davids haasten gebruikt wordt, dat hier staat; indien God het te dien tijde niet zeer wonderbaarlijk voorzien had zo was het naar alle gedachten met David gedaan geweest. Zie de a // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join('');

      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';

      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {

  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];

    if (engels && engels.length) {

        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';

  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
