eren","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een gebed van hem die verdrukt is, als hij overstelpt is en zijn klacht uitstort voor het aangezicht van de HEERE.","2":"O HEERE! Hoor mijn gebed, en laat mijn geroep tot U komen.","3":"Verberg Uw aangezicht niet voor mij, neig Uw oor tot mij ten dage van mijn benauwdheid; ten dage als ik roep, verhoor mij haastig.","4":"Want mijn dagen zijn vergaan als rook, en mijn beenderen zijn uitgebrand als een haard.","5":"Mijn hart is geslagen en verdord als gras, *zodat* ik vergeten heb mijn brood te eten.","6":"Mijn beenderen kleven aan mijn vlees, vanwege de stem van het zuchten.","7":"Ik ben een roerdomp van de woestijn gelijk geworden, ik ben geworden als een steenuil van de wildernissen.","8":"Ik waak, en ben geworden als een eenzame mus op het dak.","9":"Mijn vijanden smaden mij de hele dag; die *tegen* mij razen, zweren bij mij.","10":"Want ik eet as als brood, en vermeng mijn drank met tranen.","11":"Vanwege Uw verstoordheid en Uw grote toorn; want U hebt mij verheven, en mij *weer* neergeworpen.","12":"Mijn dagen zijn als een afgaande schaduw, en ik verdor als gras.","13":"Maar U, HEERE! blijft in eeuwigheid, en Uw gedachtenis van geslacht tot geslacht.","14":"U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.","15":"Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis.","16":"Dan zullen de heidenen de Naam van de HEERE vrezen, en alle koningen van de aarde Uw heerlijkheid.","17":"Als de HEERE Sion zal opgebouwd hebben, in Zijn heerlijkheid zal verschenen zijn,","18":"Zich gewend zal hebben tot het gebed van hem die geheel ontbloot is, en niet versmaad hebben hun gebed;","19":"Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven;","20":"Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben;","21":"Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;","22":"Opdat men de Naam van de HEERE vertelt te Sion, en Zijn lof te Jeruzalem;","23":"Wanneer de volken samen zullen vergaderd worden, ook de koninkrijken, om de HEERE te dienen.","24":"Hij heeft mijn kracht op de weg neergedrukt; mijn dagen heeft Hij verkort.","25":"Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht.","26":"U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen;","27":"Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn.","28":"Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.","29":"De kinderen van Uw knechten zullen wonen, en hun nageslacht zal voor Uw aangezicht bevestigd worden."},"SV":{"1":"Een gebed des verdrukten, als hij overstelpt is, en zijn klacht uitstort voor het aangezicht des HEEREN.","2":"O HEERE! hoor mijn gebed, en laat mijn geroep tot U komen.","3":"Verberg Uw aangezicht niet voor mij, neig Uw oor tot mij ten dage mijner benauwdheid; ten dage als ik roep, verhoor mij haastelijk.","4":"Want mijn dagen zijn vergaan als rook, en mijn gebeenten zijn uitgebrand als een haard.","5":"Mijn hart is geslagen en verdord als gras, *zodat* ik vergeten heb mijn brood te eten.","6":"Mijn gebeente kleeft aan mijn vlees, vanwege de stem mijns zuchtens.","7":"Ik ben een roerdomp der woestijn gelijk geworden, ik ben geworden als een steenuil der wildernissen.","8":"Ik waak, en ben geworden als een eenzame mus op het dak.","9":"Mijn vijanden smaden mij al den dag; die *tegen* mij razen, zweren bij mij.","10":"Want ik eet as als brood, en vermeng mijn drank met tranen.","11":"Vanwege Uw verstoordheid en Uw groten toorn; want Gij hebt mij verheven, en mij *weder* nedergeworpen.","12":"Mijn dagen zijn als een afgaande schaduw, en ik verdor als gras.","13":"Maar Gij, HEERE! blijft in eeuwigheid, en Uw gedachtenis van geslacht tot geslacht.","14":"Gij zult opstaan, Gij zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.","15":"Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis.","16":"Dan zullen de heidenen den Naam des HEEREN vrezen, en alle koningen der aarde Uw heerlijkheid.","17":"Als de HEERE Sion zal opgebouwd hebben, in Zijn heerlijkheid zal verschenen zijn,","18":"Zich gewend zal hebben tot het gebed desgenen, die gans ontbloot is, en niet versmaad hebben hunlieder gebed;","19":"Dat zal geschreven worden voor het navolgende geslacht; en het volk, dat geschapen zal worden, zal den HEERE loven;","20":"Omdat Hij uit de hoogte Zijns heiligdoms zal hebben nederwaarts gezien; dat de HEERE uit den hemel op de aarde geschouwd zal hebben;","21":"Om het zuchten der gevangenen te horen, om los te maken de kinderen des doods;","22":"Opdat men den Naam des HEEREN vertelle te Sion, en Zijn lof te Jeruzalem;","23":"Wanneer de volken samen zullen vergaderd worden, ook de koninkrijken, om den HEERE te dienen.","24":"Hij heeft mijn kracht op den weg ter neder gedrukt; mijn dagen heeft Hij verkort.","25":"Ik zeide: Mijn God! neem mij niet weg in het midden mijner dagen; Uw jaren zijn van geslacht tot geslacht.","26":"Gij hebt voormaals de aarde gegrond, en de hemelen zijn het werk Uwer handen;","27":"Die zullen vergaan, maar Gij zult staande blijven; en zij alle zullen als een kleed verouden; Gij zult ze veranderen als een gewaad, en zij zullen veranderd zijn.","28":"Maar Gij zijt Dezelfde, en Uw jaren zullen niet geëindigd worden.","29":"De kinderen Uwer knechten zullen wonen, en hun zaad zal voor Uw aangezicht bevestigd worden."},"KJV":{"1":"[[A Prayer of the afflicted, when he is overwhelmed, and poureth out his complaint before the LORD.]] Hear my prayer, O LORD, and let my cry come","2":"[[A Prayer of the afflicted, when he is overwhelmed, and poureth out his complaint before the LORD.]] Hear my prayer, O LORD, and let my cry come","3":"Hide not thy face from me in the day *when* I am in trouble; incline thine ear unto me: in the day *when* I call answer me speedily.","4":"For my days are consumed like smoke, and my bones are burned as an hearth.","5":"My heart is smitten, and withered like grass; so that I forget to eat my bread.","6":"By reason of the voice of my groaning my bones cleave to my skin.","7":"I am like a pelican of the wilderness: I am like an owl of the desert.","8":"I watch, and am as a sparrow alone upon the house top.","9":"Mine enemies reproach me all the day; *and* they that are mad against me are sworn","10":"For I have eaten ashes like bread, and mingled my drink with weeping,","11":"Because of thine indignation and thy wrath: for thou hast lifted me up, and cast me down.","12":"My days *are* like a shadow that declineth; and I am withered like grass.","13":"But thou, O LORD, shalt endure for ever; and thy remembrance unto all generations.","14":"Thou shalt arise, *and* have mercy upon Zion: for the time to favour her, yea, the set time, is come.","15":"For thy servants take pleasure in her stones, and favour the dust","16":"So the heathen shall fear the name of the LORD, and all the kings of the earth thy glory.","17":"When the LORD shall build up Zion, he shall appear in his glory.","18":"He will regard the prayer of the destitute, and not despise their prayer.","19":"This shall be written for the generation to come: and the people which shall be created shall praise the LORD.","20":"For he hath looked down from the height of his sanctuary; from heaven did the LORD behold the earth;","21":"To hear the groaning of the prisoner; to loose those that are appointed to death;","22":"To declare the name of the LORD in Zion, and his praise in Jerusalem;","23":"When the people are gathered together, and the kingdoms, to serve the LORD.","24":"He weakened my strength in the way; he shortened my days.","25":"I said, O my God, take me not away in the midst of my days: thy years *are* throughout all generations.","26":"Of old hast thou laid the foundation of the earth: and the heavens *are* the work of thy hands.","27":"They shall perish, but thou shalt endure: yea, all of them shall wax old like a garment; as a vesture shalt thou change them, and they shall be changed:","28":"But thou *art* the same, and thy years shall have no end.","29":"The children of thy servants shall continue, and their seed shall be established before"}},"tsk":{"2":[{"kopje":"geroep","refs":["Ps 12:6","Ps 61:3","Ps 69:2","Ps 69:3","Ps 142:3","Ps 142:4","Ps 143:4","Klaagl 3:18-20","Mark 14:33","Mark 14:34","Luk 22:44","Hebr 5:7"]},{"kopje":"komen","refs":["Ps 42:5","Ps 62:9","Ps 77:4","Ps 142:3","1 Sam 1:15","1 Sam 1:16"]},{"kopje":"Hoor","refs":["Ps 5:3","Ps 55:2-6","Ps 57:2-4","Ps 130:1","Ps 130:2","Ps 41:2","Ps 41:3","Ps 143:7","Ps 145:19"]},{"kopje":"laat mijn","refs":["Ps 18:7","Ex 2:23","Richt 10:16","1 Sam 9:16","2 Kron 30:27","Klaagl 3:8","Klaagl 3:44"]}],"3":[{"kopje":"Verberg","refs":["Ps 13:2","Ps 27:9","Ps 69:18","Ps 88:15","Ps 104:29","Ps 143:7","Job 34:29","Jes 8:17","Jes 43:2","1 Kor 10:13"]},{"kopje":"neig","refs":["Ps 71:2","Ps 88:3 l-kjv\" data-code=\"H3117\">days</span> are <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> like <span class=\"wl wl-kjv\" data-code=\"H6227\">smoke,</span> and my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> are <span class=\"wl wl-kjv\" data-code=\"H2787\">burned</span> as an hearth.","5":"My <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten,</span> and <span class=\"wl wl-kjv\" data-code=\"H3001\">withered</span> like <span class=\"wl wl-kjv\" data-code=\"H6212\">grass;</span> so that I <span class=\"wl wl-kjv\" data-code=\"H7911\">forget</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> my bread.","6":"By reason of the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of my <span class=\"wl wl-kjv\" data-code=\"H585\">groaning</span> my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">cleave</span> to my skin.","7":"I am <span class=\"wl wl-kjv\" data-code=\"H1819\">like</span> a <span class=\"wl wl-kjv\" data-code=\"H6893\">pelican</span> of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness:</span> I am like an <span class=\"wl wl-kjv\" data-code=\"H3563\">owl</span> of the desert.","8":"I <span class=\"wl wl-kjv\" data-code=\"H8245\">watch,</span> and am as a <span class=\"wl wl-kjv\" data-code=\"H6833\">sparrow</span> <span class=\"wl wl-kjv\" data-code=\"H909\">alone</span> upon the house top.","9":"Mine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> <span class=\"wl wl-kjv\" data-code=\"H2778\">reproach</span> me all the <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> and they that are <span class=\"wl wl-kjv\" data-code=\"H1984\">mad</span> against me are sworn","10":"For I have <span class=\"wl wl-kjv\" data-code=\"H398\">eaten</span> <span class=\"wl wl-kjv\" data-code=\"H665\">ashes</span> like <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and <span class=\"wl wl-kjv\" data-code=\"H4537\">mingled</span> my <span class=\"wl wl-kjv\" data-code=\"H8249\">drink</span> with weeping,","11":"<span class=\"wl wl-kjv\" data-code=\"H6440\">Because</span> of thine <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation</span> and thy <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath:</span> for thou hast lifted me <span class=\"wl wl-kjv\" data-code=\"H5375\">up,</span> and cast me down.","12":"My <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> are like a <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> that <span class=\"wl wl-kjv\" data-code=\"H5186\">declineth;</span> and I am <span class=\"wl wl-kjv\" data-code=\"H3001\">withered</span> like grass.","13":"But thou, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> shalt <span class=\"wl wl-kjv\" data-code=\"H3427\">endure</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever;</span> and thy <span class=\"wl wl-kjv\" data-code=\"H2143\">remembrance</span> unto <span class=\"wl wl-kjv\" data-code=\"H1755\">all</span> generations.","14":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> and have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> upon <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion:</span> for the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> to <span class=\"wl wl-kjv\" data-code=\"H2603\">favour</span> her, yea, the set <span class=\"wl wl-kjv\" data-code=\"H4150\">time,</span> is come.","15":"For thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> take <span class=\"wl wl-kjv\" data-code=\"H7521\">pleasure</span> in her <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and <span class=\"wl wl-kjv\" data-code=\"H2603\">favour</span> the dust","16":"So the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> shall <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">n n> to death;","22":"To <span class=\"wl wl-kjv\" data-code=\"H5608\">declare</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8416\">praise</span> in Jerusalem;","23":"When the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms,</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the LORD.","24":"He <span class=\"wl wl-kjv\" data-code=\"H6031\">weakened</span> my <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way;</span> he <span class=\"wl wl-kjv\" data-code=\"H7114\">shortened</span> my days.","25":"I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O my <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> take me not <span class=\"wl wl-kjv\" data-code=\"H5927\">away</span> in the <span class=\"wl wl-kjv\" data-code=\"H2677\">midst</span> of my <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> thy <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> are throughout <span class=\"wl wl-kjv\" data-code=\"H1755\">all</span> generations.","26":"Of <span class=\"wl wl-kjv\" data-code=\"H6440\">old</span> hast thou laid the <span class=\"wl wl-kjv\" data-code=\"H3245\">foundation</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> and the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> are the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of thy hands.","27":"They shall <span class=\"wl wl-kjv\" data-code=\"H6\">perish,</span> but thou shalt <span class=\"wl wl-kjv\" data-code=\"H5975\">endure:</span> yea, all of them shall wax <span class=\"wl wl-kjv\" data-code=\"H1086\">old</span> like a <span class=\"wl wl-kjv\" data-code=\"H899\">garment;</span> as a <span class=\"wl wl-kjv\" data-code=\"H3830\">vesture</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H2498\">change</span> them, and they shall be changed:","28":"But thou art the same, and thy <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> shall have no end.","29":"The <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> shall <span class=\"wl wl-kjv\" data-code=\"H7931\">continue,</span> and their <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> before"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"des verdrukten,","tekst":"Of, voor den bedrukte. Versta hier de bedrukte en ellendige gevangenen in Babylonië."},{"catchword":"overstelpt","tekst":"Te weten, met angst en schrik. In deze betekenis wordt het woord overstelpen ook gebruikt Psa 61:3 , en Psa 77:4 , en Psa 107:5 , en Psa 142:4 , en Psa 143:4 ."},{"catchword":"uitstort","tekst":"Dat is, vrijmoedig en overvloedig uit de grond des harten te kennen geeft."}],"2":[{"catchword":"des verdrukten,","tekst":"Of, voor den bedrukte. Versta hier de bedrukte en ellendige gevangenen in Babylonië."},{"catchword":"overstelpt","tekst":"Te weten, met angst en schrik. In deze betekenis wordt het woord overstelpen ook gebruikt Psa 61:3 , en Psa 77:4 , en Psa 107:5 , en Psa 142:4 , en Psa 143:4 ."},{"catchword":"uitstort","tekst":"Dat is, vrijmoedig en overvloedig uit de grond des harten te kennen geeft."}],"3":[{"catchword":"Verberg uw","tekst":"Dat is, onttrek mij uwe hulp niet. Zie de aantekening bij Job 13:24 ."},{"catchword":"verhoor mij","tekst":"Hebr. haast, verhoor mij."}],"4":[{"catchword":"mijn dagen","tekst":"Te weten, de dagen mijns levens."},{"catchword":"als rook,","tekst":"Anders, in of tot rook."},{"catchword":"als een haard","tekst":"Anders: als een brandend vuur aan den haard. Zie Job 21:24 ."}],"5":[{"catchword":"als gras,","tekst":"Hetwelk afgemaaid zijnde verdroogt en hop wordt."},{"catchword":"zo","tekst":"Hij wil zeggen: Ik heb geen lust gehad mijn nooddruft te nemen of enig voedsel te gebruiken."}],"6":[{"catchword":"aan mijn vlees","tekst":"Dat is, aan mijn vel. Hij wil zeggen: Ik ben zo uitgeteerd dat ik maar vel over been ben. Zie Job 19:20 ; Lam 4:8 ."},{"catchword":"vanwege","tekst":"Dat is, vanwege mijn zuchten, dat met geluid en geschrei dagelijks geschiedt."}],"7":[{"catchword":"ben een roerdomp","tekst":"Dat is, ik ben gedrongen alleen en eenzaam te blijven, van alle mensen verlaten zijnde en ik sla schrikkelijk geluid, gelijk de roerdomp en de uilen doen; Job 30:29 ."}],"8":[{"catchword":"Ik waak","tekst":"Ik kan niet slapen."},{"catchword":"als een","tekst":"Dat is, gelijk een mus, die haar wederpaar verloren heeft."}],"9":[{"catchword":"Mijn vijanden","tekst":"Te weten, de Babyloniërs, of Chaldeën."},{"catchword":"razen,","tekst":"Zie de aantekening bij Psa 5:6 ."},{"catchword":"zweren","tekst":"Dat is, als zij zweren dat zij iemand kwalijk behandelen zullen, zo dreigen zij dat zij hem zo zullen africhten, dat hij mij zal gelijk worden. Of, zij gebruiken mijnen naam tot een formulier van vervloekingen. Verg. Num 5:21 ; Isa 65:15 ; Jer 29:22 , met de aantekening. Anders: zweren tegen mij."}],"10":[{"catchword":"ik eet","tekst":"Hij wil zeggen: Dewijl ik rouw dragende in de as lig, zo gebeurt het dikwijls dat ik as eet met mijne spijs. Anders, ik ben zo bedroefd dat ik niet meer lust of smaak in het brood of andere spijs vind, dan of ik as at."},{"catchword":"mijn drank","tekst":"Hebr. mijne dranken, dat is, al wat ik drink."}],"11":[{"catchword":"uw verstoordheid","tekst":"Hebr. van het aangezicht uwer verstoordheid."}],"12":[{"catchword":"Mijn dagen","tekst":"De dagen mijns levens."},{"catchword":"als een afgaande","tekst":"Te weten, als de zon ondergaat is de schaduw wel lang uitgestrekt, maar zij blijft niet lang, alzo de nacht straks daarop volgt; Psa 109:23 , en Psa 144:4 ."},{"catchword":"als gras","tekst":"Zie vs.5."}],"13":[{"catchword":"uw gedachtenis","tekst":"Te weten, de gedachtenis uwer heerlijke werken en weldaden, die Gij voormaals uw volk gedaan en bewezen hebt. Zie Exo 3:15 , en Psa 135:13 ."}],"14":[{"catchword":"over Sion,","tekst":"Dat is, over uw volk en de stad Jeruzalem."},{"catchword":"bestemde","tekst":"Te weten, de tijd van de zeventig jaren onzer gevangenschap, door uwe profeten voorzegd. Zie 2Ch 36:21 ; Jer 25:12 , en Jer 29:10 ; Dan 9:2 , Dan 9:24-25 . Immers, uit de laatste woorden van dit vers blijkt genoegzaam dat deze psalm geschreven is op het einde van de Babylonische gevangenschap."}],"15":[{"catchword":"uw knechten","tekst":"Dat is, wij Joden; Neh 1:3 , en Neh 2:3 , en Neh 4:2 ."},{"catchword":"hebben een","tekst":"Dat is, zij zagen zeer gaarne dat de stad Jeruzalem weder opgebouwd werd, en hebben grote droefheid daarover, dat zij tot een steenhoop gemaakt is."},{"catchword":"hebben medelijden","tekst":"Dat is, het doet hun wee dat de stad en tempel aldus verwoest blijven liggen."},{"catchword":"gruis","tekst":"Of, steenmul, of puin."}],"16":[{"catchword":"de heidenen","tekst":"Te weten zij, die de wonderbaarlijke verlossing uws volks en de volvoering uwer beloften zullen zien."}],"18":[{"catchword":"desgenen,","tekst":"Versta hier, de arme Joden, die in de Babylonische gevangenschap waren."}],"19":[{"catchword":"Dat zal beschreven","tekst":"Te weten, onze verlossing uit de Babylonische gevangenschap."},{"catchword":"dat geschapen","tekst":"Dat is, het volk dat namaals, of lang na ons geboren zal worden; doch men mag dit ook verstaan van het volk Israël, hetwelk uit de gevangenschap van Babylonië verlost wordende, gelijk als uit het stof verwkt en opnieuw geschapen zou worden. Zie Psa 22:32 ; Eze 37 ."}],"20":[{"catchword":"uit de hoogte","tekst":"Dit is genoemn van Deu 26:15 ."},{"catchword":"op de aarde","tekst":"Dat is, op ons, die op de aarde wonen."}],"21":[{"catchword":"der gevangenen","tekst":"Te weten, die in Babel gevangen zijn. Hebr. des gevangenen, of des gebondenen."},{"catchword":"de kinderen","tekst":"Dat is, die ter dood geëigend waren; gelijk Psa 79:11 , en Psa 44:23 ."}],"23":[{"catchword":"Wanneer de","tekst":"Dat is, als God uit de Joden en heidenen een volk maken zal, en zich ene kerk uit alle koninkrijken der aarde zal verzamelen. Zie Act 2:5 ; Eph 2:13-14 ."}],"24":[{"catchword":"Hij heeft","tekst":"Te weten, God."},{"catchword":"op den weg","tekst":"Te weten, toen ik gevankelijk naar Babel gevoerd werd, waar ik tot nog toe gevankelijk ben gebleven."},{"catchword":"mijn dagen","tekst":"Te weten, de dagen mijns levens. Alzo dat velen onzer in droefenis en ellende gestorven zijn. Zie dergelijke manier van spreken Job 21:21 . Zie ook Psa 55:24 ."}],"25":[{"catchword":"Ik zeide","tekst":"Te weten, als de Heere mij drukte op den weg naar Babylonië, vs.24, stellende deze gedachten tegen de vorige plaag en vrees dat ik haast zou sterven."},{"catchword":"neem mij","tekst":"Hebr. neemt mij niet op; te weten, uit dit leven. Zie de aantekening bij Job 36:20 ."},{"catchword":"uw jaren","tekst":"Hij wil zeggen: Heere, dewijl Gij eeuwig blijft daarom zal ook uwe kerk eeuwig blijven, en zij zal door de vijanden en vervolgers niet kunnen onderdrukt worden, gelijk hij vs.29, besluit."},{"catchword":"van geslacht tot","tekst":"Hebr. van geslacht der geslachten."}],"26":[{"catchword":"Gij hebt","tekst":"De apostel gebruikt Heb 1:10-12 , deze woorden om de Godheid van Christus te bewijzen, omdat hier de Heere Christus verklaard wordt niet alleen te zijn de Schepper van alles en eeuwig, maar ook een Verlosser en Zaligmaker zijner gemeente. Zie vs.14, 16, 23, 29; waarom de apostel in de aangehaalde plaats ook den naam HEERE, uit het vs.13, herhaald zijnde, Hem toeschrijft."},{"catchword":"voormaals","tekst":"Hebr. voor het aangezicht; dat is hier te zeggen voormaals, voorheen."}],"27":[{"catchword":"Die zullen vergaan,","tekst":"Te weten, hemel en aarde; Heb 1:10-11 ."},{"catchword":"zij alle zullen","tekst":"Te weten, al de hemelen."}],"28":[{"catchword":"Gij zijt","tekst":"Te weten, die Gij tevoren geweest zijt van eeuwigheid af; en Gij blijft dezelfde in eeuwigheid."}],"29":[{"catchword":"De kinderen","tekst":"Dat is, onze kinderen of nakomelingen."},{"catchword":"wonen, en","tekst":"Dat is, een vaste woning bij U hebben, zonder immermeer te veranderen. Of, zij zullen in Zion wonen, vs.22, en Psa 69:36-37 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A prayer of the oppressed, [Or, for the oppressed: understand here the oppressed and afflicted Captives in Babylon] being, (or when he is) overwhelmed [viz. With straight and fears; in this sence is the word overwhelmed likewise taken, Psa 61:3. and 77.4. and 107.5. and 142.4. and 143.4.] and pouring out his complaint [making it known freely and abundantly, from the bottom of is heart] before the face of the LORD. (102:2) O LORD, hear my prayer; and let my crying come to thee."}],"2":[{"catchword":null,"tekst":"A prayer of the oppressed, [Or, for the oppressed: understand here the oppressed and afflicted Captives in Babylon] being, (or when he is) overwhelmed [viz. With straight and fears; in this sence is the word overwhelmed likewise taken, Psa 61:3. and 77.4. and 107.5. and 142.4. and 143.4.] and pouring out his complaint [making it known freely and abundantly, from the bottom of is heart] before the face of the LORD. (102:2) O LORD, hear my prayer; and let my crying come to thee."}],"3":[{"catchword":null,"tekst":"(3) Hide not thy face from me, [i.e. Withdraw not thy help from me. See the Annot. Job 13.on verse 24.] inline thine ear to me in the day of my distress: in the day, when I cry, hear me speedily. [Heb. Make haste, or hasten, hear me.]"}],"4":[{"catchword":null,"tekst":"(4) For my days, [The days of my life] are consumed like smoak: [others, in, or into smoak,] and my bones are burnt up as an hearth; [others, as a fire-brand on the bearth. See Job. 21.on verse 24.]"}],"5":[{"catchword":null,"tekst":"(5) Mine heart is smitten ad withered like grass, [Which being cut down, doth wither and turn hay] (so) that I have forgotten to eat my bread: [as if he said. I had no mind or pleasure to take my necessary refreshment, or to use any means of sustenance.]"}],"6":[{"catchword":null,"tekst":"(6) My bones cleave to my flesh, [To my skin he will say; I am so wasted that I have nothing left me but skin and bones. See Job 19.on verse 20. Jerm.4.v.8.] because of the voice of my sighing. [i.e. by reason of my sighing which cometh daily from me with loud groans and crying.]"}],"7":[{"catchword":null,"tekst":"(7) I am become like unto the Bittor, (or Bittern) of the wilderness, I am become as a stone-Owle of the Deserts: [i.e. I am fain to abide all alone and solitary, being forsaken by all men: I make a strange noise and sound, much like the Bittern, and screetch-Owle, Job 30:29.]"}],"8":[{"catchword":null,"tekst":"(8) I watch, [I can take no rest nor sleep] and am become like a solitary sparrow on the roof: [i.e.like a silly Sparrow that hath lost its mate, or companion.]"}],"9":[{"catchword":null,"tekst":"(9) Mine enemies reproach me all the day: [viz. The Babylonians or Chaldeans] these that rage against me, [See the Annot. Psalm 5.on verse 6.] swear by me. [i.e. when they swear to do some body a mischief, then they threaten they will serve him, to become like me: or, they use my Name for a form of cursing. Compare Num 5:21. Isai 65.15. Jer 29:22. together with the annot. Others, they swear against me.]"}],"10":[{"catchword":null,"tekst":"(10) For I eat ashes as bread: [He will say; since mourning, I lie in ashes. It happeneth often, that I eat ashes with my food: others, I am so cast down and troubled, that I find no more comfort nor relish in my bread, or other meat, then if I were eating of ashes] and mingled my drink, [Hebrew, my drinks: i.e. whatsoever I drink] with tears:"}],"11":[{"catchword":null,"tekst":"(11) Because of thy perturbation, [Heb. From the face of thy perturbation] and thy great wrath: for thou hast lift me up, and thrown me down (again.)"}],"12":[{"catchword":null,"tekst":"(12) My days [The days of my life] are as a declining shadow: [viz. At the going down of the Sun: then the shadow is indeed stretched out to a great length, but it is of no durance, the night presently intercepting it. Ps.109.13. and 144.4.] and I wither away as grass. [See above, verse 5.]"}],"13":[{"catchword":null,"tekst":"(13) But thou LORD, abides in eternity, and thy remembrance [i.e. the remembrance of thy glorious acts, and benefits formerly archieved, and shewed unto thy people, See Exo 3:15. and Psa 135:13.] from generation.]"}],"14":[{"catchword":null,"tekst":"(14) Thou shalt arise, thou wilt have mercy over Zion, [i.e. Over thy people, and over the City of Jerusalem] for the time to be gracious unto her, for the appointed time is come. [viz. The end of the LXX. Years of our Captivity, foretold by thy Prophets. See 2 Chron.36.21. Jer 25:12. and 29.10. Dan.9.2.24,25. However it appeareth plainly, by the last words of this verse, that this Psalm was made about the latter end of the Babylonian Captivity.]"}],"15":[{"catchword":null,"tekst":"(15) For thy servants, [i.e. we Jews, Nehem.1.3. and 2.3. and 4.2.] take pleasure in her stones; [i.e. they longed and would be delighted to see, that the City of Jerusalem were built up again, and were much grieved, that it was made a heap of stones] and have compassion with her cumber. [or dust, or rubbish.]"}],"16":[{"catchword":null,"tekst":"(16) Then shall the heathen, [viz. Those that shall see the wonderful deliverance of thy people, and the fulfilling or accomplishment of thy promises] fear the Name of the LORD: and all the Kings of the earth thy Glory:"}],"17":[{"catchword":null,"tekst":"(17) When the Lord shall have built up Zion, shall have appeared in his Glory."}],"18":[{"catchword":null,"tekst":"(18) Shall have turned himself to the prayer of him that is wholly stripped. [Understand hereby the poor Jews, that were in the Babylonian Captivity] and not disdained their prayer."}],"19":[{"catchword":null,"tekst":"(19) That [viz. Our deliverance out of the Babylonian Captivity:] shall be described for the following generation; ad the people that is to be created, [i.e. the people that shall be born or come hereafter, many ages hence long after: nevertheless, it may likewise be understood of the people of Israel, which being delivered out of the Babylonian Captivity, were as raised up again out of the dust, and new created as it were. See Psa 22:32. Ezek.ch.37.] shall praise the LORD."}],"20":[{"catchword":null,"tekst":"(20) For that he shall have looked downwards from the height of his holiness: [This is taken out of Deut.26.15.Other. of his holy height, i.e. from heaven] that the LORD shall have regarded upon earth, [i.e. upon us that dwell on earth] from heaven."}],"21":[{"catchword":null,"tekst":"(21) For to hear the sighting of the Captives: [viz. Of Babylon, or that were carried away Captives to Babylon. [Heb. Of the Captive or bounden] for to make loose the children death. [which were appointed to die; as Psalm 79.v.11. and 44.23.]"}],"22":[{"catchword":null,"tekst":"(22) That the Name of the LORD be recounted in Zion, and his praise at Jerusalem."}],"23":[{"catchword":null,"tekst":"(23) When the Nations shall be gathered together, the Kingdoms also for to serve the LORD. [i.e. when God shall make but one people of Jews and Gentiles, and gather a Church unto himself out of all the Kingdoms of the earth. See Act 2:5. Eph.2.13,14.]"}],"24":[{"catchword":null,"tekst":"(24) He hath pressed down my strength [He viz. God] upon the way: [when I was carried away Captive to Babylon, where I have continued in captivity hitherto] he hath shorted my days. [viz. The days of my life; insomuch that many of us died and perished in grief and misery. See the like speeches, Job 21:22. and see likewise Psa.55.on v.24.]"}],"25":[{"catchword":null,"tekst":"(25) I said, [viz. Then when the Lord afflicted me upon the way to Babylon, v.24. setting such thoughts as these in opposition, to the former temptation and fear of sudden death] My God; take me not away [Heb. Take me not up, viz. Out of this life. See the annot. Job 36.on v.20.] in the midst of my days: thy years are from generation to generation. [Heb. From generation of generation. The Prophet will say, LORD, since thou abides forever, therefore shall thy Church also continue thus, and none of all her enemies and persecutors shall ever be able to suppress her as he concludeth, v.29.]"}],"26":[{"catchword":null,"tekst":"(26) Thou hast formerly [Heb. Before thy face, i.e. in this place, formerly in former times] founded the earth, and the heavens are the works of thine hands. [the Apostle Heb.1. verse 10,11,12. Maketh use of these words, to prove the Godhead of Christ, the same being declared here, not onely to be the creator of all things and eternal, but likewise the Redeemer ad Saviour of his Church. See v.14.16,23,29. For which cause the Apostle doth likewise in the place alledged, ascribed unto him the Name of the LORD, out of v.13. ab.]"}],"27":[{"catchword":null,"tekst":"(27) They shall perish (or pass away) [Heaven and Earth namely, Hebr. 1.10,11.] but thou shalt abide standing: and they all [i.e. all the heavens] shall wax old like a garment, thou shalt change them as a raiment, and they shall be changed."}],"28":[{"catchword":null,"tekst":"(28) But thou art the same, [viz. That thou wast before from all Eternity, and thou abides the same likewise unto Eternity] and thy years shall not be ended."}],"29":[{"catchword":null,"tekst":"(29) The children of thy servants [i.e. our children and posterity] shall dwell, [i.e. have a permanent and abiding habitation with thee, which shall never be changed; or they shall dwell in Zion, v.22. and Psalm 69. V.36.37.] and their seed shall be established before thy face."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
