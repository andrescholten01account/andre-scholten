 tong verkoelt; want ik lijd pijn in deze vlam.","Rom 6:16":"Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?","Lev 23:1-3":"Daarna sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tegen hen: De vaste feesttijden van de HEERE, die u uitroepen zult, zullen heilige samenkomsten zijn; deze zijn Mijn vaste feesttijden. Zes dagen zal men het werk doen, maar op de zevende dag is de sabbat van de rust, een heilige samenkomst; geen werk zult u doen; het is de sabbat van de HEERE, in al uw woningen.","Hab 2:20":"Maar de HEERE is in Zijn heilige tempel. Zwijg voor Zijn aangezicht, heel de aarde!","Matt 7:23":"En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!","Hand 12:1":"In diezelfde tijd sloeg koning Herodes de handen aan sommigen van de gemeente, om hen kwalijk te behandelen.","2 Kron 21:20":"Hij was tweeëndertig jaar oud toen hij koning werd, en regeerde acht jaar in Jeruzalem; en hij ging heen zonder dat men hem miste; en zij begroeven hem in de stad van David, maar niet in de graven van de koningen.","Ezech 39:29":"En Ik zal Mijn aangezicht niet meer voor hen verbergen, wanneer Ik Mijn Geest over het huis van Israël zal hebben uitgegoten, spreekt de Heere HEERE.","Spr 14:12":"Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.","Gen 9:15":"dan zal Ik Mijn verbond gedenken, dat er is tussen Mij en tussen u, en tussen alle levende ziel van alle vlees; en het water zal niet meer worden tot een vloed, om alle vlees te verderven.","1 Sam 17:37":"Verder zei David: De HEERE, Die mij gered heeft uit de klauw van de leeuw en uit de klauw van de beer, Die zal mij redden uit de hand van deze Filistijn. Toen zei Saul tegen David: Ga heen, en de HEERE zij met u!","Ps 71:16":"Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.","Hos 13:3":"Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.","Ps 146:5":"Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is;","1 Tim 6:15":"die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;","Ps 44:6":"Door U zullen wij onze tegenstanders met hoorns stoten; in Uw Naam zullen wij vertrappen die tegen ons opstaan.","1 Kron 22:3":"En David bereidde ijzer in overvloed, voor de nagelen aan de deuren van de poorten en voor de verbindingen; ook koper in overvloed, zonder gewicht;","Ps 118:24":"Dit is de dag, die de HEERE gemaakt heeft; laten we ons daarover verheugen, en verblijd zijn.","Spr 15:11":"Het dodenrijk en het verderf liggen open voor de HEERE; hoeveel te meer de harten van de mensenkinderen?","Dan 11:32":"En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.","Joh 6:60":"Velen van Zijn discipelen dan zeiden, toen zij dit hoorden: Dit is een harde uitspraak; wie kan dat aanhoren?","Ps 25:5":"He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.","Dan 5:18":"Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;","Jes 5:20":"Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!","Ps 105:4":"Vraagt naar de HEERE en Zijn sterkte; zoekt Zijn aangezicht voortdurend.","Ps 36:13":"Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan.","Luk 16:19-25":"En er was een zeker rijk mens, en die was gekleed met purper en zeer fijn linnen, en leefde elke dag vrolijk en overvloedig. En er was een zekere bedelaar, met de naam Lazarus, die voor zijn poort lag, vol zweren; En hij verlangde verzadigd te worden van de kruimels die van de tafel van de rijke vielen; maar ook de honden kwamen en likten zijn zweren.","Hand 13:44":"En op de volgende sabbat kwam bijna de hele stad samen om het Woord van God te horen.","Ps 33:1-4":"Rechtvaardigen! Zingt vrolijk in de HEERE; lof past de oprechten. Looft de HEERE met de harp; zingt Hem psalmen met de luit, en het tiensnarig instrument. Zingt Hem een nieuw lied; speelt goed met vrolijk geschal.","Ps 73:3":"Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag.","Ps 81:3":"Heft een psalm op, en geeft de trommel; de liefelijke harp met de luit.","Neh 12:24":"De hoofden dan van de Levieten waren Hasabja, Serebja, en Jesua, de zoon van Kadmiel, en hun broeders tegenover hen, om te prijzen en te danken, naar het gebod van David, de man van God, wacht tegenover wacht.","Joh 15:21":"Maar al deze dingen zullen zij u doen om Mijn Naam, omdat zij Hem niet kennen, Die Mij gezonden heeft.","Ps 103:17":"Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;","Matt 24:35":"De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.","Job 36:17":"Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.","Ex 34:7":"Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.","1 Kor 12:6":"en er is verscheidenheid van werkingen, maar het is dezelfde God, Die alles in allen werkt.","Jer 31:36":"Als deze ordeningen van voor Mijn aangezicht zullen wijken, spreekt de HEERE, dan zal ook het nageslacht van Israël ophouden een volk te zijn voor Mijn aangezicht, alle dagen.","Gen 35:2":"Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren;","Deut 10:17":"Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;","Ps 71:20":"Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.","Jes 4:5":"En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.","Ps 119:102":"Ik ben niet geweken van Uw rechten, want U hebt mij geleerd.","2 Kron 7:3":"En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.","Richt 11:27":"Ik heb ook niet tegen u gezondigd, maar u doet mij onrecht aan door tegen mij te strijden. De HEERE, Die Rechter is, oordele vandaag tussen de kinderen van Israël en de kinderen van Ammon!","Jes 52:7-10":"Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning. Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal. Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.","Jes 40:31":"Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.","Ps 7:2":"HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.","Hos 14:5":"Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.","2 Kron 34:15":"En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.","Ps 21:10":"U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.","Ps 43:3":"Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;","Ps 37:6":"En Hij zal uw gerechtigheid doen voortkomen als het licht, en uw recht als de middag.","Ps 147:7":"Zingt beurtelings voor de HEERE met dankzegging; zingt psalmen voor onze God op de harp.","Ps 111:10":"Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.","Ps 31:6":"In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!","Jes 42:10-12":"Zingt de HEERE een nieuw lied, Zijn lof van het einde van de aarde; u, die ter zee vaart, en al wat daarin is, u eilanden en hun inwoners. Laat de woestijn en haar steden de stem verheffen, met de dorpen die Kedar bewoont; laat hen juichen die in de rotsen wonen, en van de top van de bergen af schreeuwen. Laat ze de HEERE de eer geven, en Zijn lof in de eilanden verkondigen.","Ps 73:2-28":"Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.","2 Kon 11:19":"En hij nam de leiders van honderd, en de hoofdmannen, en de lijfwacht, en al het volk van het land; en zij brachten de koning af uit het huis van de HEERE, en kwamen door de weg van de poort van de lijfwacht naar het huis van de koning, en hij zat op de troon der koningen.","Hebr 4:4":"Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.","Jer 23:24":"Zou iemand zich in verborgen plaatsen kunnen verbergen, zodat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet de hemel en de aarde? spreekt de HEERE.","Hebr 5:12":"Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.","Jes 41:13":"Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.","Job 4:17":"Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker?","2 Kron 32:8":"Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.","Spr 12:2":"De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.","Ps 119:166":"O HEERE! ik hoop op Uw heil, en doe Uw geboden.","Openb 11:17":"en zeiden: Wij danken U, Heere God, Almachtige, Die is, en Die was, en Die komen zal! dat U Uw grote kracht hebt aangenomen, en als Koning hebt geheerst;","Hebr 11:4":"Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is.","Ps 4:4":"Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.","Gen 1:25":"En God maakte de wilde dieren van de aarde naar hun aard, en het vee naar zijn aard, en al de kruipende dieren van de aardbodem naar hun aard. En God zag dat het goed was.","Ps 37:36":"Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.","Ps 73:26":"Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.","Rom 8:13":"Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.","Luk 8:18":"Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.","Ps 132:11":"De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.","Jer 10:10":"Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.","Jes 37:28":"Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woede tegen Mij.","Luk 12:4":"En Ik zeg u, Mijn vrienden: wees niet bang voor hen die het lichaam doden, en daarna niets meer kunnen doen.","Ps 43:5":"Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke Verlossing van mijn aangezicht, en mijn God.","Matt 12:34":"Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.","Rom 1:20":"Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.","Ps 111:1":"Halleluja! Aleph. Ik zal de HEERE loven van ganser harte; Beth. in de raad en vergadering van de oprechten.","Hos 2:8-12":"Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken. En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden. En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.","1 Kor 15:22":"Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.","Hand 19:2":"zei hij tegen hen: Hebt u de Heilige Geest ontvangen, toen u tot geloof kwam? En zij zeiden tegen hem: Wij hebben zelfs niet gehoord of er een Heilige Geest is.","Ex 3:20":"Want Ik zal Mijn hand uitstrekken, en Egypte slaan met al Mijn wonderen die Ik in het midden ervan doen zal; daarna zal hij u laten vertrekken.","Ps 68:33-35":"U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.","Jes 66:23":"En het zal gebeuren, dat van de ene nieuwe maan tot de andere, en van de ene sabbat tot de andere, alle vlees zal komen om te aanbidden voor Mijn aangezicht, zegt de HEERE.","Num 10:35":"Het gebeurde nu bij het optrekken van de ark, dat Mozes zei: Sta op, HEERE! En laat Uw vijanden verstrooid worden, en laat Uw haters van Uw aangezicht vluchten!","Joh 14:23":"Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.","Ps 138:7":"Als ik wandel in het midden van de benauwdheid, maakt Gij mij levend; Uw hand strekt Gij uit tegen de toorn van mijn vijanden, en Uw rechterhand behoudt mij.","2 Kron 6:18":"Maar zou God werkelijk bij de mensen op de aarde wonen? Zie, de hemelen, ja, de hemel der hemelen, zouden U niet kunnen bevatten, hoeveel te minder dit huis, dat ik gebouwd heb?","Ps 148:12":"Jongemannen en ook meisjes; oude mensen met de jongeren!","Job 12:6":"De tenten van de verwoesters hebben rust, en zij die God tergen, hebben zekerheid, om wat God met Zijn hand toebrengt.","Job 17:9":"En de rechtvaardige zal zijn weg vasthouden, en wie rein van handen is, zal in sterkte toenemen.","2 Kor 1:22":"Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.","Job 12:12":"In de stokoude is de wijsheid, en in de lengte van de dagen het verstand.","Num 14:27":"Hoelang zal Ik het bij deze slechte vergadering uithouden, die tegen Mij morren? Ik heb het gemor van de kinderen van Israël gehoord, waarmee zij tegen Mij morren.","Jes 35:10":"En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.","Job 36:18":"Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen.","Hand 24:15":"Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen.","1 Sam 2:4":"De boog van de sterken is gebroken; en zij die struikelden, zijn met sterkte omgord.","Hand 15:8":"En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons;","Zach 8:21":"En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan.","Ex 34:6":"Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.","Ps 103:6":"De HEERE doet gerechtigheid en recht aan allen die onderdrukt worden.","Rom 6:21":"Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.","Ezech 44:24":"En bij een rechtszaak zullen zij staan om te oordelen; naar Mijn rechten zullen zij hen oordelen; en zij zullen Mijn wetten en Mijn inzettingen op al Mijn vastgestelde hoogtijden houden, en Mijn sabbatten heiligen.","2 Kron 36:14":"Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.","Ps 90:6":"In de morgenstond bloeit het, en het verandert; 's avonds wordt het afgesneden, en het verdort.","Mark 9:43":"En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;","1 Sam 17:45-47":"David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.","Job 14:15":"Dat U zou roepen, en ik U zou antwoorden, dat U naar het werk van Uw handen zou verlangen.","Joh 15:2-5":"Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt. U bent nu rein om het woord dat Ik tot u gesproken heb. Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.","Ps 71:18":"Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij s goedwilligheid.","Jer 16:19":"O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.","Job 11:20":"Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.","Job 9:15":"Aan wie ik, ook al was ik rechtvaardig, niet zou antwoorden; mijn Rechter zal ik om genade bidden.","Jes 48:3":"De vorige dingen heb Ik verkondigd van toen af, en uit Mijn mond zijn zij voortgekomen, en Ik heb ze doen horen; Ik heb ze snel gedaan, en zij zijn gekomen;","Jak 1:15":"Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.","2 Kon 4:23":"En hij zei: Waarom gaat u vandaag naar hem toe? Het is geen nieuwe maan, en ook geen sabbat. En zij zei: Het zal goed zijn.","2 Petr 3:16":"Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.","Joh 1:16":"En uit Zijn volheid hebben wij allen ontvangen, ook genade voor genade.","Ps 62:7":"Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen.","Mal 3:2":"Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers.","Rom 11:2":"God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt:","1 Kron 22:5":"Want David zei: Mijn zoon Salomo is een jongeman en teder; en het huis dat men voor de HEERE bouwen zal, moet buitengewoon groot gemaakt worden, tot een naam en tot glorie in alle landen; ik zal er nu voorraad voor U, HEERE, hebt het gezegend, en het zal gezegend zijn in eeuwigheid.","Jer 10:12":"Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid heeft door Zijn verstand.","Jes 3:14":"De HEERE komt ten gerichte tegen de oudsten van Zijn volk en hun vorsten, want u hebt deze wijngaard verteerd; de roof van de ellendige is in uw huizen.","Joh 3:19":"En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht.","Amos 8:10":"En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.","Ps 71:8":"Laat mijn mond vervuld worden met Uw lof, de hele dag met Uw heerlijkheid.","1 Tim 4:10":"Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.","Jer 5:21":"Hoor nu dit, dwaas en harteloos volk! die ogen hebben, maar niet zien, die oren hebben, maar niet horen.","Jer 26:7":"En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis van de HEERE.","Luk 19:42":"en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.","Joh 4:22":"U aanbidt wat u niet weet; wij aanbidden wat wij weten; want de zaligheid is uit de Joden.","Spr 28:18":"Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.","Ps 118:10":"Alle heidenen hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.","1 Kron 16:5":"Asaf was het hoofd, en Zecharja de tweede na hem; Jeïel, en Semiramoth, en Jehiël, en Mattithja, en Eliab, en Benaja, en Obed-Edom, en Jeïel, met instrumenten van luiten en met harpen; en Asaf liet zich horen met cimbalen;","Ps 60:11":"Wie zal mij brengen in een vaste stad? Wie zal mij leiden tot in Edom?","2 Kon 25:9":"En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.","Jes 51:6":"Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.","Ps 65:2":"De lofzang is in stilte tot U, o God! in Sion; en U zal de gelofte betaald worden.","Ex 24:1":"Daarna zei Hij tegen Mozes: Klim op tot de HEERE, u en Aäron, Nadab en Abihu, en zeventig van de oudsten van Israël; en buig u neer van verre!","Ps 75:11":"En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.","Openb 16:5":"En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt;","Kol 1:11":"bekrachtigd met alle kracht, naar de sterkte van Zijn heerlijkheid, tot alle lijdzaamheid en geduld, met blijdschap;","Ps 23:1-6":"Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.","Ps 77:14":"O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?","Jes 43:15":"Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning.","Jes 42:16":"En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.","Ps 33:20-22":"Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild. Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen. Uw goedertierenheid, HEERE! zij over ons, zoals wij op U hopen.","Ps 37:17":"Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen.","1 Tim 1:12":"En ik dank Hem, Die mij kracht gegeven heeft, namelijk Christus Jezus, onze Heere, dat Hij mij trouw geacht heeft, doordat Hij mij in de bediening gesteld heeft;","2 Kron 29:25":"En hij stelde de Levieten aan in het huis van de HEERE, met cimbalen, met luiten en harpen, naar het gebod van David, en van Gad, de ziener van de koning, en van Nathan, de profeet; want dit gebod kwam van de hand van de HEERE, door de hand van Zijn profeten.","2 Kron 7:1":"Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis.","Joh 12:38-41":"Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard? Daarom konden zij niet geloven, omdat Jesaja opnieuw gezegd heeft: Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.","Hos 14:7":"Zijn scheuten zullen zich uitspreiden, en zijn heerlijkheid zal zijn als die van de olijfboom, en hij zal een geur hebben als de Libanon.","Jes 13:9":"Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.","2 Petr 2:9":"dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;","Jes 25:1":"HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.","Joh 7:21-24":"Jezus antwoordde en zei tegen hen: Eén werk heb Ik gedaan, en u verwondert u allen. Daarom heeft Mozes u de besnijdenis gegeven (niet dat ze uit Mozes is, maar uit de vaderen), en u besnijdt een mens op de sabbat. Als een mens de besnijdenis ontvangt op de sabbat, zodat de wet van Mozes niet gebroken wordt, bent u dan boos op Mij, omdat Ik een heel mens gezond gemaakt heb op de sabbat?","Dan 4:8":"Totdat ten laatste Daniël bij mij binnenkwam, wiens naam Beltsazar is, naar de naam van mijn god, in wie ook de geest van de heilige goden is; en ik vertelde de droom aan hem en zei:","Micha 4:2":"En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.","Rom 15:8":"En ik zeg dat Jezus Christus een dienaar van de besnijdenis geworden is, vanwege de waarheid van God, opdat Hij de beloften aan de vaderen zou bevestigen;","Ps 94:8":"Let op, u onverstandigen onder het volk! En u dwazen! Wanneer zult u verstandig worden?","1 Kron 15:27":"David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.","Job 36:23":"Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?","Ps 55:17":"Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.","Joël 2:26":"En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.","2 Kron 23:13":"En zij keek toe; en zie, de koning stond bij zijn pilaar, bij de ingang; en de leiders en de trompetten waren bij de koning; en heel het volk van het land was blij, en blies op de trompetten; en de zangers waren er met muzikale instrumenten, en gaven aanwijzingen om lof te zingen; toen scheurde Athalia haar kleren, en riep: Verraad, verraad!","Jes 41:4":"Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.","2 Kron 21:6":"En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want hij had de dochter van Achab tot vrouw; en hij deed wat slecht was in de ogen van de HEERE.","Ps 9:18":"De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.","Mark 12:40":"die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.","Joh 3:18":"Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.","Rom 16:27":"Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.","1 Kron 29:28":"En hij stierf op hoge leeftijd, verzadigd van dagen, rijkdom en eer; en zijn zoon Salomo regeerde in zijn plaats.","Ps 36:9":"Zij worden dronken van de vettigheid van uw huis; en U drenkt hen uit de beek van Uw wellusten.","Ps 14:1":"Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet.","1 Kron 25:6":"Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.","Hand 4:24":"En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.","Ezech 9:9":"Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.","Jer 13:22":"Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.","Ps 50:4":"Hij zal roepen tot de hemel van boven, en tot de aarde, om Zijn volk te oordelen.","2 Tess 1:6":"Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken;","Joh 14:16-21":"En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid; Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn. Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.","Ps 62:13":"En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.","1 Kon 8:24":"Die Uw dienaar, mijn vader David, gehouden hebt wat U tot hem gesproken had; want met Uw mond hebt U gesproken, en met Uw hand vervuld, zoals het op deze dag is.","Joh 17:25":"Rechtvaardige Vader, de wereld heeft U niet gekend; maar Ik heb U gekend, en dezen hebben erkend dat U Mij gezonden hebt.","Ps 67:7":"De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.","Job 15:29":"Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde.","Gal 6:8":"Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.","Ps 18:28":"Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.","Spr 3:35":"De wijzen zullen eer beërven; maar de dwazen dragen schande.","Spr 13:6":"De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.","1 Kron 16:41":"En met hen Heman en Jeduthun, en de overige uitgelezen mannen, die met naam uitgedrukt zijn om de HEERE te loven; want Zijn goedertierenheid is tot in eeuwigheid.","Amos 8:5":"En zegt: Wanneer is de nieuwe maan voorbij, zodat wij koren mogen verkopen? en de sabbat, zodat wij graan mogen aanbieden? terwijl u de efa verkleint en de sikkel vergroot, en verkeerd handelt met bedrieglijke weegschalen;","Ps 68:34":"Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte.","Matt 15:13":"Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.","Ps 24:3-6":"Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.","Luk 1:68-70":"Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht; zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;","Jes 58:14":"Dan zult u zich verlustigen in de HEERE, en Ik zal u doen rijden op de hoogten van de aarde, en Ik zal u voeden met het erfdeel van uw vader Jakob; want de mond van de HEERE heeft het gesproken.","Matt 8:12":"maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.","Jak 1:10":"En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan.","Jes 2:13":"En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan;","1 Sam 18:7":"En de vrouwen, spelend, antwoordden elkaar en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden!","Ps 143:9":"Red mij, HEERE, van mijn vijanden; bij U schuil ik.","Ps 71:15":"Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.","Gal 5:22":"Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.","1 Sam 2:3":"Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.","Ps 77:11-13":"Daarna zei ik: Dit krenkt mij; maar de rechterhand van de Allerhoogste verandert. Ik zal de daden van de HEERE gedenken; ja, ik zal Uw wonderen van vroeger gedenken; En ik zal al Uw werken overdenken, en van Uw daden spreken.","2 Kron 23:5":"en een derde deel zal bij het huis van de koning zijn; en een derde deel bij de Fondamentpoort; en heel het volk zal in de voorhoven van het huis van de HEERE zijn.","Ex 3:6":"Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.","Hand 5:3-10":"En Petrus zei: Ananias, waarom heeft de satan uw hart vervuld, dat u de Heilige Geest zou liegen, en onttrekken van de prijs van het land? Zolang het bleef, bleef het niet uw eigendom? En verkocht zijnde, was het niet in uw macht? Wat is het, dat u deze daad in uw hart hebt voorgenomen? U hebt niet mensen gelogen, maar God. En Ananias, deze woorden horend, viel neer en gaf de geest. En er kwam grote vrees over allen die dit hoorden.","1 Kor 6:9":"Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?","Ps 95:10":"Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd: Zij zijn een volk dat dwaalt van hart, en zij kennen Mijn wegen niet.","Ps 57:8-10":"Mijn hart is standvastig, o God! mijn hart is standvastig; ik zal zingen en psalmzingen. Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o Heere! ik zal U psalmzingen onder de naties.","Ps 147:1":"Looft de HEERE, want onze God te bezingen is goed, omdat Hij liefelijk is; de lof is Hem waardig.","Ps 109:30":"Ik zal de HEERE met mijn mond zeer loven, en te midden van velen zal ik Hem prijzen.","Job 24:23":"Geeft God hem gerustheid, dan steunt hij daarop; toch zijn Zijn ogen op hun wegen.","Job 36:14":"Hun ziel zal in de jeugd sterven, en hun leven onder de schandjongens.","Ps 1:4":"Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft.","Job 31:4":"Ziet Hij niet mijn wegen, en telt Hij niet al mijn treden?","Openb 22:19":"En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.","Ps 72:6":"Hij zal neerdalen als een regen op het nagras, als de druppels, die de aarde bevochtigen.","2 Petr 1:9":"Want bij wie deze dingen niet aanwezig zijn, die is blind, kan niet ver zien, en is vergeten dat hij gereinigd is van zijn vroegere zonden.","Gal 4:9":"en nu u God kent, ja, veelmeer door God gekend bent, hoe keert u zich weer tot de zwakke en arme beginselen, die u weer van voren af aan wilt dienen?","Pred 11:1":"Werp uw brood uit op het water, want u zult het vinden na veel dagen.","Fil 3:19":"Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.","Ps 73:27":"Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;","Ps 64:7":"Zij doorzoeken allerlei schalkheid; ten uiterste doorzoeken zij, wat te doorzoeken is; zelfs het binnenste van een man, en het diepe hart.","Ps 32:7":"U bent mij een schuilplaats; U behoedt mij voor benauwdheid; U omringt mij met vrolijke gezangen van bevrijding. Sela.","Ezech 9:5-7":"Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.","Ps 3:8":"Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.","Job 24:24":"Zij zijn een korte tijd verheven, daarna is er niemand meer van hen; zij worden neergedrukt; net als alle anderen worden zij weggenomen; en net als de top van een aar worden zij afgesneden.","Mark 6:2":"En toen het sabbat geworden was, begon Hij in de synagoge te onderwijzen; en velen die Hem hoorden, waren verbaasd, en zeiden: Waar komen Deze deze dingen vandaan, en wat is dit voor wijsheid die Hem gegeven is, dat ook zulke krachten door Zijn handen gebeuren?","Job 11:7-9":"Zult u de doorgronding van God vinden? Zult u tot de volmaaktheid toe de Almachtige vinden? Zij is als de hoogten van de hemelen, wat kunt u doen? Dieper dan het graf, wat kunt u weten? Langer dan de aarde is haar maat, en breder dan de zee.","Spr 24:7":"Alle wijsheid is voor de dwaas te hoog; hij zal in de poort zijn mond niet opendoen.","Jer 33:20":"Zo zegt de HEERE: Als u Mijn verbond met de dag, en Mijn verbond met de nacht zou kunnen verbreken, zodat er geen dag en nacht meer zijn op hun tijd;","Luk 13:10-17":"En Hij gaf onderwijs op de sabbat in een van de synagogen. En zie, er was een vrouw die al achttien jaar lang een geest van ziekte had, en zij was samengebogen en kon zich totaal niet oprichten. En Jezus zag haar, riep haar bij Zich en zei tegen haar: Vrouw, u bent verlost van uw ziekte.","Ps 73:22":"Toen was ik redeloos, en wist niets; ik was een groot dier bij U.","Spr 8:23-25":"Ik ben van eeuwigheid af gezalfd geweest; van het begin, van de oudheden van de aarde aan. Ik was geboren, toen de afgronden nog niet waren, toen nog geen fonteinen waren, zwaar van water; Voordat de bergen ingevest waren, voor de heuvels was Ik geboren.","Ps 62:4":"Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.","Joh 5:5-14":"En daar was een zeker mens, die achtendertig jaar ziek geweest was. Toen Jezus hem zag liggen en wist dat hij al lange tijd zo was, zei Hij tegen hem: Wilt u gezond worden? De zieke antwoordde Hem: Heere, ik heb geen mens om mij in het badwater te brengen, wanneer het water bewogen wordt; en terwijl ik kom, gaat een ander vóór mij naar beneden.","Hab 1:4":"Daarom wordt de wet losgelaten, en het recht komt nooit meer voort; want de goddeloze omringt de rechtvaardige; daarom komt het recht verdraaid voort.","Ps 59:11":"De God van mijn goedertierenheid zal mij voor zijn; God zal mij op mijn verspieders doen zien.","2 Kron 19:7":"Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.","Luk 1:46-55":"En Maria zei: Mijn ziel maakt de Heere groot, en mijn geest verheugt zich in God, mijn Zaligmaker; omdat Hij de nederigheid van Zijn dienstmaagd heeft aangezien; want zie, van nu af aan zullen alle geslachten mij zalig spreken.","1 Kron 13:8":"En David en heel Israël speelden voor het aangezicht van God met alle kracht, zowel met liederen, als met harpen, en met luiten, en met trommels, en met cimbalen, en met trompetten.","Jes 57:20":"Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.","Jer 28:1":"Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:","Spr 22:5":"Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.","Ps 89:15":"Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.","Ps 102:28":"Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.","Jer 17:12":"Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.","Rom 2:4":"Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?","Spr 19:2":"Ook is het niet goed als de ziel zonder kennis is; en die met de voeten haastig is, zondigt.","Luk 22:22":"En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!","Joh 9:29-39":"Wij weten dat God tot Mozes gesproken heeft; maar van Deze weten wij niet vanwaar Hij is. De man antwoordde en zei tegen hen: Hierin zit toch iets wonderlijks, dat u niet weet vanwaar Hij is, en Hij heeft toch mijn ogen geopend. En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.","Rom 2:29":"Maar die is een Jood, die het in het verborgen is, en de besnijdenis van het hart, in de geest, niet in de letter, dat is de besnijdenis; wiens lof niet is uit de mensen, maar uit God.","Richt 9:57":"Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen.","Jes 37:27":"Daarom waren haar inwoners machteloos, zij waren verslagen en beschaamd; zij waren als het gras van het veld en de groene grasscheutjes, als het hooi op de daken, en het brandkoren, voordat het overeind staat.","Ps 145:2":"Beth. Elke dag zal ik U loven, en Uw Naam prijzen voor eeuwig en altijd.","Matt 12:10-12":"En kijk, er was een mens die een verschrompelde hand had, en zij vroegen Hem: Is het geoorloofd op de sabbatdagen te genezen? (om Hem te kunnen beschuldigen.) En Hij zei tegen hen: Wie onder u is er die een schaap heeft, en als dat op een sabbatdag in een greppel valt, zal hij het niet vastpakken en eruit heffen? Hoeveel gaat een mens dan een schaap te boven! Daarom is het op de sabbatdagen geoorloofd goed te doen.","Jak 1:18":"Naar Zijn wil heeft Hij ons gebaard door het Woord van de waarheid, opdat wij zouden zijn als eerstelingen van Zijn schepselen.","Spr 9:10":"De vreze van de HEERE is het beginsel van de wijsheid, en de kennis van de Heilige is verstand.","Job 24:20":"De baarmoeder vergeet hem, het gewormte vindt hem zoet, aan hem wordt niet meer gedacht; en het onrecht wordt gebroken als een stuk hout.","Ex 15:21":"Toen antwoordde Mirjam hun: Zingt de HEERE; want Hij is hoog verheven! Hij heeft het paard met zijn ruiter in de zee gestort!","Jes 40:11":"Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.","Ezech 46:3":"Ook zal het volk van het land aanbidden voor de deur van die poort, op de sabbatten en op de nieuwe manen, voor het aangezicht van de HEERE.","Ps 44:9":"In God roemen wij de hele dag, en Uw Naam zullen wij loven tot in eeuwigheid. Sela.","Job 32:4-9":"Doch Elihu had gewacht op Job in het spreken, omdat zij ouder van dagen waren dan hij. Toen Elihu dan zag dat er geen antwoord was in de mond van die drie mannen, ontstak zijn toorn. Hierom antwoordde Elihu, de zoon van Baracheël, de Buziet, en zei: Ik ben jong van dagen, maar u bent stokoude; daarom heb ik geschroomd en gevreesd, u mijn mening te tonen.","Spr 19:16":"Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.","Jer 31:11":"Want de HEERE heeft Jakob vrijgekocht, en Hij heeft hem verlost uit de hand van hem die sterker was dan hij.","Joël 3:21":"En Ik zal hun bloed reinigen, dat Ik niet gereinigd had; en de HEERE zal wonen op Sion.","Ps 7:10":"Laa
