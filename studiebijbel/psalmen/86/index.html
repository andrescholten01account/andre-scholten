 gemaakt.", "Ef 2:15": "doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Zach 14:16": "En het zal gebeuren, dat allen die overgebleven zijn van alle heidenen die tegen Jeruzalem gekomen zullen zijn, van jaar tot jaar zullen optrekken om de Koning, de HEERE van de heerscharen, te aanbidden, en om het feest van de loofhutten te vieren.", "Ps 71:12": "O God, wees niet ver van mij; mijn God! haast U tot mijn hulp.", "Mal 3:6": "Want Ik, de HEERE, word niet veranderd; daarom zijn u, kinderen van Jakob, niet verteerd.", "Matt 14:30": "Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij!", "1 Kron 16:36": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid tot eeuwigheid! En al het volk zei: Amen! en het loofde de HEERE.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Jer 14:19-21": "Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking. HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd. Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "Ps 25:8-10": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg. Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren. Caph. Alle paden van de HEERE zijn goedertierenheid en waarheid, voor hun die Zijn verbond en Zijn getuigenissen bewaren.", "Ps 62:6-8": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Luk 7:47": "Daarom zeg Ik u: haar zonden, die vele waren, zijn haar vergeven; want zij heeft veel liefgehad; maar aan wie weinig vergeven wordt, die heeft weinig lief.", "Spr 20:12": "Een horend oor en een ziend oog heeft de HEERE gemaakt, ja, die beide.", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Ps 36:12": "De voet van de hoogmoedigen komt niet over mij, en de hand van de goddelozen doet mij niet omzwerven.", "Spr 25:6": "Praal niet voor het aangezicht van de koning, en sta niet op de plaats van de groten;", "Ps 88:10-15": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Ps 138:6": "Want de HEERE is hoog, toch ziet Hij de nederige aan, en de verhevene kent Hij van verre.", "Matt 20:26": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn;", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Ps 14:4": "Hebben dan alle werkers van de ongerechtigheid geen kennis, die mijn volk opeten alsof zij brood aten? Zij roepen de HEERE niet aan.", "Jer 7:13": "En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt;", "Openb 17:14": "Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Gen 32:9-12": "Verder zei Jakob: O, God van mijn vader Abraham, en God van mijn vader Izak, o HEERE! Die tegen mij gezegd hebt: Keer terug naar uw land en naar uw familie, en Ik zal u goeddoen! Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden! Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Jer 21:8": "En tegen dit volk zult u zeggen: Zo zegt de HEERE: Zie, Ik stel voor uw gezicht de weg van het leven en de weg van de dood.", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "Ps 30:5": "Zingt psalmen voor de HEERE, u, Zijn gunstgenoten! en looft ter gedachtenis aan Zijn heiligheid.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Ps 48:9": "Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Ps 21:5": "Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos.", "Matt 19:16": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb?", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Hand 16:17": "Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen.", "Ps 119:122": "Wees borg voor Uw knecht ten goede; laat de hoogmoedigen mij niet onderdrukken.", "Hand 15:7-9": "En toen daarover een grote twist ontstond, stond Petrus op en zei tegen hen: Mannen broeders, u weet dat God van lang geleden onder ons mij uitgekozen heeft, dat de heidenen door mijn mond het woord van het Evangelie zouden horen, en geloven. En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons; en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "Jes 32:15-17": "Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden. En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "Rom 3:18": "Er is geen vreze van God voor hun ogen.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Ps 150:1-6": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte! Loof Hem vanwege Zijn machtige daden; loof Hem naar de overvloed van Zijn grootheid! Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Ps 84:3": "Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God.", "Fil 3:7-11": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "Openb 19:5": "En een stem kwam uit de troon, die zei: Looft onze God, u al Zijn dienstknechten, en u die Hem vreest, beiden klein en groot!", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Ps 18:2-4": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte! De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek. Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Ps 66:16": "Komt, hoort toe, allen die God vrezen, en ik zal vertellen wat Hij aan mijn ziel gedaan heeft.", "Rom 15:13": "De God nu van de hoop vervult u met alle blijdschap en vrede in het geloven, opdat u overvloedig mag zijn in de hoop, door de kracht van de Heilige Geest.", "Ps 74:19": "Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.", "1 Kon 8:22": "En Salomo stond voor het altaar van de HEERE, tegenover de hele gemeente van Israël, en breidde zijn handen uit naar de hemel;", "Luk 21:36": "Waak dan te allen tijde, en bid, dat u waardig geacht mag worden om al deze dingen die gebeuren zullen te ontvluchten, en te staan voor de Zoon des mensen.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Matt 5:3": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen.", "Jes 46:9": "Denk aan de vorige dingen van oude tijden af, dat Ik God ben, en er is geen God meer, en er is niets gelijk Ik;", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Openb 5:14": "En de vier dieren zeiden: Amen. En de vierentwintig oudsten vielen neer en aanbaden Hem Die leeft tot in alle eeuwigheid.", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Luk 1:53": "Hongerigen heeft Hij met goede dingen verzadigd; en rijken heeft Hij met lege handen weggestuurd.", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "2 Sam 12:23": "Maar nu is het dood, waarom zou ik nu vasten? Zal ik het nog kunnen terughalen? Ik zal wel naar hem toe gaan, maar hij zal niet naar mij terugkomen.", "Ps 35:25": "Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!", "Gen 48:21": "Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Ps 100:1-5": "Een lofzang. Heel de aarde, juich voor de HEERE! Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang. Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Ps 111:6": "Caph. Hij heeft de kracht van Zijn werken aan Zijn volk bekendgemaakt; Lamed. door hun de erve van de heidenen te geven.", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Joh 12:21": "Dezen gingen dan naar Filippus, die van Bethsaïda in Galilea was, en vroegen hem: Heer, wij zouden Jezus graag zien.", "Ex 20:22": "Toen zei de HEERE tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: U hebt gezien dat Ik met u vanuit de hemel gesproken heb.", "1 Kon 8:41-43": "Zelfs ook aangaande de vreemdeling, die niet van Uw volk Israël zal zijn, maar uit ver land komt om Uw Naam wil; (want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis; hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Ps 119:68": "U bent goed en goeddoend; leer mij Uw inzettingen.", "Ps 119:18": "Ontdek mijn ogen, dat ik aanschouw de wonderen van Uw wet.", "2 Kor 4:16-18": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Ps 130:5": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "Gen 9:6": "Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.", "Job 25:5": "Zie, zelfs de maan geeft geen schijnsel, en de sterren zijn niet zuiver in Zijn ogen.", "Ps 116:4": "Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.", "Ps 143:6": "Ik breid mijn handen uit tot U; mijn ziel is voor U als een dorstig land. Sela.", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Job 33:24": "Zo zal Hij hem genadig zijn, en zeggen: Verlos hem, dat hij in het verderf niet nederdaalt, Ik heb verzoening gevonden.", "Luk 1:67-75": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei: Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Num 14:18": "De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht.", "Amos 5:4": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef.", "1 Kon 8:25": "En nu, HEERE, God van Israël, houd Uw dienaar, mijn vader David, wat U tot hem gesproken hebt, en zei: Er zal u geen man van voor Mijn aangezicht afgesneden worden, die op de troon van Israël zit; alleen als uw zonen hun weg bewaren, om te wandelen voor Mijn aangezicht, zoals u gewandeld hebt voor Mijn aangezicht.", "Zach 10:12": "En Ik zal hen sterken in de HEERE, en in Zijn Naam zullen zij wandelen, spreekt de HEERE.", "Ps 56:12": "Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?", "Ps 99:3": "Laat men Uw grote en ontzagwekkende Naam loven, die heilig is;", "Spr 9:1-6": "De opperste Wijsheid heeft haar huis gebouwd; zij heeft haar zeven pilaren gehouwen. Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt. Zij heeft haar dienstmeisjes uitgezonden; zij nodigt uit op de tinnen van de hoogten van de stad:", "Job 5:11": "Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.", "Ps 40:10": "Ik verkondig de gerechtigheid in de grote gemeente; zie, mijn lippen bedwing ik niet; HEERE! Gij weet het.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "2 Kron 6:14": "En hij zei: HEERE, God van Israël, er is geen God gelijk U, in de hemel noch op de aarde, Die het verbond en de goedertierenheid houdt aan Uw knechten, die voor Uw aangezicht met hun gehele hart wandelen;", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "Ps 69:34": "Want de HEERE hoort de behoeftigen, en Hij veracht Zijn gevangenen niet.", "Matt 5:38-41": "U hebt gehoord dat gezegd is: Oog om oog, en tand om tand. Maar Ik zeg u, dat u de boze niet weerstaat; maar wie u op uw rechterwang slaat, keer hem ook de andere toe; en als iemand met u wil rechtstoetsen en uw onderkleed nemen, laat hem ook de mantel;", "Jes 1:3": "Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "Luk 24:52": "En zij aanbaden Hem, en keerden terug naar Jeruzalem met grote blijdschap.", "Ps 18:20": "En Hij voerde mij uit in de ruimte, Hij rukte mij eruit, want Hij had lust aan mij.", "Ps 80:15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,", "Ps 96:13": "Voor het aangezicht van de HEERE; want Hij komt, want Hij komt, om de aarde te oordelen; Hij zal de wereld oordelen met gerechtigheid, en de volken met Zijn waarheid.", "Ps 107:8": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Ps 138:3": "Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Job 4:17-21": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker? Zie, op Zijn knechten zou Hij niet vertrouwen; ook Zijn engelen heeft Hij van dwaasheid beschuldigd. Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot.", "Ps 14:3": "Zij zijn allen afgeweken, samen zijn zij smerig geworden; er is niemand die goed doet, ook niet één.", "Tit 3:3": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Ps 147:1-20": "Looft de HEERE, want onze God te bezingen is goed, omdat Hij liefelijk is; de lof is Hem waardig. De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël. Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "Ezech 32:31": "Farao zal hen zien, en zich troosten over zijn hele menigte; de verslagenen van het zwaard van Farao en zijn hele leger, spreekt de Heere HEERE.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Gen 1:21": "En God schiep de grote zeedieren, en alle levende, wemelende wezens die de wateren in overvloed voortbrachten, naar hun aard; en al het gevleugelde gevogelte naar zijn aard. En God zag dat het goed was.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "2 Kron 30:18": "Want een menigte van het volk, velen uit Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet zoals geschreven is. Doch Hizkia bad voor hen, en zei: De HEERE, die goed is, doe verzoening voor ieder,", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "Hebr 11:13-16": "Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren. Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken. En als zij aan dat vaderland gedacht hadden waar zij uit weggegaan waren, zouden zij de tijd gehad hebben om terug te keren;", "Rom 11:36": "Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid tot in eeuwigheid. Amen.", "Spr 16:30": "Hij sluit zijn ogen, om verkeerdheden te bedenken; zijn lippen samenknijpend, brengt hij het kwaad tot stand.", "Dan 7:22": "Totdat de Oude van dagen kwam, en het gericht gegeven werd aan de heiligen van de hoge plaatsen, en de bestemde tijd kwam, dat de heiligen het Rijk bezaten.", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Luk 5:31": "En Jezus antwoordde en zei tegen hen: Wie gezond zijn, hebben geen dokter nodig, maar wie ziek zijn.", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Jes 59:4-7": "Er is niemand die om gerechtigheid roept, en niemand die zich voor de waarheid in het gericht begeeft; zij vertrouwen op ijdelheid en spreken leugen; met moeite zijn zij zwanger, en zij baren ongerechtigheid. Zij broeden basiliskuseieren uit, en zij weven spinnenwebben; wie van hun eieren eet, moet sterven, en als het in stukken gedrukt wordt, barst er een adder uit. Hun webben deugen niet tot kleding, en zij zullen zichzelf niet kunnen bedekken met hun werken; hun werken zijn werken van ongerechtigheid, en een daad van geweld is in hun handen.", "Ps 119:171": "Mijn lippen zullen Uw lof overvloedig uitstorten, als U mij Uw inzettingen zult geleerd hebben.", "Jes 45:24": "Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "Jes 30:18": "En daarom zal de HEERE wachten, opdat Hij u genadig is, en daarom zal Hij verhoogd worden, opdat Hij Zich over u ontfermt, want de HEERE is een God van het gericht; gelukkig zijn zij allen die Hem verwachten.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Rom 1:21": "Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden;", "Spr 8:17": "Ik heb hen lief die Mij liefhebben; en die Mij vroeg zoeken, zullen Mij vinden.", "Ef 2:18": "Want door Hem hebben wij beiden de toegang door één Geest tot de Vader.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Rom 3:29": "Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen;", "Jer 31:7": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël.", "Ps 88:3": "Laat mijn gebed voor Uw aangezicht komen; neig Uw oor tot mijn geschrei.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Ezech 18:23": "Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "Rom 2:26": "Als dan de voorhuid de rechten van de wet bewaart, zal zijn voorhuid dan niet tot een besnijdenis gerekend worden?", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Gal 3:20": "En de Middelaar is niet Middelaar van één, maar God is één.", "Dan 9:18": "Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn.", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Ps 110:1-6": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten. De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden. Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "1 Kon 8:26": "Nu dan, o God van Israël, laat toch Uw woord waar worden, dat U gesproken hebt tot Uw dienaar, mijn vader David.", "Ps 94:19": "Toen mijn gedachten in mij talrijk werden, hebben Uw vertroostingen mijn ziel verkwikt.", "2 Kor 11:30": "Als men moet roemen, zal ik roemen over de dingen van mijn zwakheid.", "Jak 1:9": "Maar de broeder die nederig is, moet roemen in zijn hoogheid.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Rom 2:2": "En wij weten dat het oordeel van God naar waarheid is, over hen die zulke dingen doen.", "Ps 61:9": "Zo zal ik Uw Naam psalmzingen in eeuwigheid; opdat ik mijn geloften betaal, dag bij dag.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Mark 10:31": "Maar vele eersten zullen de laatsten zijn, en velen die de laatsten zijn, de eersten.", "Ps 77:15": "U bent die God, Die wonderen doet; U hebt Uw sterkte bekendgemaakt onder de volken.", "Job 10:9": "Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.", "Joël 2:28-32": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien; Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten. En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Gal 3:1-28": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd. Dit alleen wil ik van u leren: hebt u de Geest ontvangen uit de werken van de wet, of uit de prediking van het geloof? Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Spr 25:7": "Want het is beter dat men tegen u zegt: Kom hier bovenaan, dan dat men u vernedert voor het aangezicht van een vorst, die uw ogen gezien hebben.", "Hab 3:17-19": "Alhoewel de vijgenboom niet bloeien zal, en er geen vrucht aan de wijnstok zal zijn, dat het werk van de olijfboom liegen zal, en de velden geen voedsel voortbrengen; dat men de kudde uit de kooi zal wegscheuren, en dat er geen rund in de stallen zal zijn; Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil. De HEERE Heere is mijn Sterkte; en Hij zal mijn voeten maken als die van de hinden, en Hij zal mij doen treden op mijn hoogten. Voor de koorleider, op mijn Neginoth.", "Deut 7:8": "Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Ps 119:115": "Wijkt van mij, u boosdoeners! dat ik de geboden van mijn God moge bewaren.", "1 Kor 10:21": "U kunt niet de drinkbeker van de Heere drinken én de drinkbeker van de duivelen; u kunt niet deelhebben aan de tafel van de Heere én aan de tafel van de duivelen.", "Ps 35:28": "Zo zal mijn tong Uw gerechtigheid vermelden, en Uw lof de hele dag.", "Ps 141:8": "Doch op U zijn mijn ogen, HEERE, Heere; op U vertrouw ik, ontbloot mijn ziel niet.", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ps 57:9": "Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken.", "Ps 13:2-5": "Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen? Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn? Kijk naar mij, verhoor mij, HEERE, mijn God; verlicht mijn ogen, zodat ik niet in de dood ontslaap;", "Zach 14:20": "Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;", "Joël 2:17": "Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Gen 32:11": "Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "Luk 18:19": "En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God.", "Ezech 34:23-31": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn. En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken. En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden.", "Lev 19:17": "U zult uw broeder in uw hart niet haten; u zult uw naaste zeker berispen, en zult de zonde in hem niet laten voortbestaan.", "Spr 17:5": "Die de arme bespot, smaadt zijn Maker; die zich verblijdt in het ongeluk van een ander, zal niet onschuldig blijven.", "2 Kon 19:16": "HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Ps 25:8": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.", "Joël 1:19": "Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.", "Ps 138:5": "En zij zullen zingen van de wegen van de HEERE, want de heerlijkheid van de HEERE is groot.", "Jes 40:25": "Bij wie dan zult u Mij vergelijken, aan wie zou Ik gelijk zijn? zegt de Heilige.", "Dan 9:9": "Bij de Heere, onze God, zijn de barmhartigheden en vergevingen, hoewel wij tegen Hem gerebelleerd hebben.", "Jes 55:5": "Zie, u zult een volk roepen, dat u niet kende, en het volk, dat u niet kende, zal tot u lopen, om de wil van de HEERE, uw God, en om de wil van de Heilige van Israël, want Hij heeft u verheerlijkt.", "Ps 119:114": "U bent mijn Schuilplaats en mijn Schild; op Uw Woord heb ik gehoopt.", "Job 12:10": "In Wiens hand de ziel is van alles wat leeft, en de geest van alle vlees van de mens.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Ps 18:19": "Zij hadden mij bejegend ten dage van mijn ongeval; maar de HEERE was mij tot een Steunsel.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Matt 11:11": "Voorwaar, Ik zeg u: onder degenen die uit vrouwen geboren zijn, is niemand opgestaan die groter is dan Johannes de Doper; maar wie de minste is in het Koninkrijk der hemelen, is groter dan hij.", "Spr 15:17": "Beter is een gerecht van groente, waar ook liefde is, dan een vetgemeste os met haat erbij.", "Deut 4:34": "Of: of God ooit beproefd heeft te gaan om Zich een volk uit het midden van een ander volk aan te nemen, door beproevingen, door tekenen, en door wonderen, en door strijd, en door een sterke hand, en door een uitgestrekte arm, en met grote verschrikkingen; naar alles wat de HEERE, uw God, voor u in Egypte voor uw ogen gedaan heeft?", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "1 Kor 15:57": "Maar God zij dank, Die ons de overwinning geeft door onze Heere Jezus Christus.", "Ex 31:6": "En Ik, zie, Ik heb hem Aholiab bijgevoegd, de zoon van Ahisamach, van de stam van Dan; en in het hart van ieder die wijs van hart is, heb Ik wijsheid gegeven; en zij zullen alles maken wat Ik u geboden heb.", "Jes 37:17": "O HEERE, neig Uw oor en hoor; HEERE, doe Uw ogen open en zie; en hoor al de woorden van Sanherib, die gezonden heeft om de levende God te honen.", "Ps 73:28": "Maar wat mij aangaat, het is mij goed om dicht bij God te zijn; ik stel mijn vertrouwen op de Heere HEERE, om al Uw werken te vertellen.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Rom 11:32": "Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.", "Ps 41:14": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid! Amen, ja, amen.", "Jes 63:7": "Ik zal de blijken van goedertierenheid van de HEERE vermelden, de veelvoudige lof van de HEERE, naar alles wat de HEERE ons heeft bewezen, en de grote goedheid aan het huis van Israël, die Hij hun bewezen heeft, naar Zijn barmhartigheden, en naar de veelheid van Zijn blijken van goedertierenheid.", "Joh 15:4": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Ex 2:25": "En God zag de kinderen van Israël aan, en God kende hen.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Num 14:9": "Wees alleen niet opstandig tegen de HEERE! En vrees het volk van dit land niet; want zij zijn ons brood! Hun bescherming is van hen geweken, en de HEERE is met ons; vrees hen niet!", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "Ps 119:132": "Zie mij aan, wees mij genadig, naar het recht aan degenen, die Uw Naam beminnen.", "1 Kron 29:13": "Nu dan, onze God, wij danken U, en loven de Naam van Uw heerlijkheid.", "Hebr 11:16-39": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt. Door het geloof heeft Abraham, toen hij beproefd werd, Izak geofferd, en hij die de beloften ontvangen had, heeft zijn enige zoon geofferd, (tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Ps 17:6-9": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden. Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan! Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,", "Jes 14:9": "Het rijk van de dood van onderen is beroerd om uwentwil, om u tegemoet te gaan, toen u kwam; het wekt om uwentwil de doden op, al de bokken van de aarde; het doet al de koningen van de heidenvolken van hun tronen opstaan.", "Ps 108:7": "Opdat Uw beminden bevrijd worden; geef heil door Uw rechterhand, en verhoor ons.", "Openb 6:2": "En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen!", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "Jer 33:8": "En Ik zal hen reinigen van al hun ongerechtigheid, waarmee zij tegen Mij gezondigd hebben; en Ik zal al hun ongerechtigheden vergeven, waarmee zij tegen Mij gezondigd en waarmee zij tegen Mij overtreden hebben.", "Hand 4:12": "En de zaligheid is in geen Ander; want er is ook onder de hemel geen andere Naam, die onder de mensen gegeven is, waardoor wij moeten zalig worden.", "Ps 90:1": "Een gebed van Mozes, de man van God. Heere! U bent ons geweest een Toevlucht van geslacht tot geslacht.", "Rom 2:7": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "2 Tim 2:7": "Bedenk wat ik zeg; en de Heere geeft u inzicht in alle dingen.", "Kol 3:12": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld;", "Jes 37:20": "Nu dan, HEERE, onze God, verlos ons uit zijn hand, zodat alle koninkrijken van de aarde weten dat U alleen de HEERE bent.", "1 Tim 1:17": "De Koning nu der eeuwen, de onverderfelijke, de onzichtbare, de alleen wijze God, zij eer en heerlijkheid in alle eeuwigheid. Amen.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "Ps 130:4": "Maar bij U is vergeving, opdat U gevreesd wordt.", "Ps 34:16": "Ain. De ogen van de HEERE zijn op de rechtvaardigen, en Zijn oren gericht op hun geroep.", "Jes 44:3-5": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Ps 64:3": "Verberg mij voor de heimelijke afspraken van de boosdoeners, voor het oproer van de werkers van ongerechtigheid.", "Jes 17:6": "Toch zal er een nalezing in overblijven, zoals bij het afschudden van de olijfboom, twee of drie bezien in de top van de opperste twijg, en vier of vijf aan zijn vruchtbare takken, spreekt de HEERE, de God van Israël.", "Ps 119:145": "Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren.", "Hagg 2:8": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen.", "Openb 20:1-3": "En ik zag een engel neerkomen uit de hemel, die de sleutel van het afgrond had, en een grote keten in zijn hand; En hij greep de draak, de oude slang, die de duivel is en satan, en bond hem duizend jaar; En wierp hem in het afgrond, en sloot hem daarin, en verzegelde het boven hem, opdat hij de volken niet meer verleiden zou, totdat de duizend jaar geëindigd zouden zijn. En daarna moet hij een korte tijd losgelaten worden.", "Jes 41:17-20": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten. Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen. Ik zal in de woestijn de cederboom, de sittimboom, en de mirteboom, en de olieboom zetten; Ik zal in de wildernis de denneboom, de beuk, en de busboom samen plaatsen;", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "Ps 140:14": "Zeker, de rechtvaardigen zullen Uw Naam loven; de oprechten zullen voor Uw aangezicht blijven.", "Ps 136:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Klaagl 2:19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "Mark 13:10": "En het Evangelie moet eerst gepredikt worden onder alle volken.", "Kol 2:1-3": "Want ik wil dat u weet hoe zware strijd ik voor u heb, en voor hen die in Laodicea zijn, en voor allen die mijn gezicht in het vlees niet gezien hebben; Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus; In Wie al de schatten van de wijsheid en van de kennis verborgen zijn.", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "Job 31:15": "Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Ps 61:2": "O God! hoor mijn geschrei, merk op mijn gebed.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Luk 1:38": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "Jes 44:6": "Zo zegt de HEERE, de Koning van Israël, en zijn Verlosser, de HEERE van de heerscharen: Ik ben de Eerste, en Ik ben de Laatste, en behalve Mij is er geen God.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Job 14:13": "Och, wilde U mij toch in het graf verbergen, mij verstoppen, totdat Uw toorn zich afkeerde; dat U mij een vaste tijd stelde, en aan mij zou denken!", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Ps 118:15": "In de tenten van de rechtvaardigen is een stem van gejuich en van het heil; de rechterhand van de HEERE doet krachtige daden.", "Zach 12:1": "De last van het woord van de HEERE over Israël. De HEERE spreekt, Die de hemel uitbreidt, en de aarde grondvest, en de geest van de mens in zijn binnenste formeert.", "Spr 4:16": "Want zij slapen niet, als zij geen kwaad gedaan hebben; en hun slaap wordt weggenomen, als zij niemand hebben doen struikelen.", "Ps 146:1-10": "Halleluja! O mijn ziel, prijs de HEERE. Ik zal de HEERE prijzen in mijn leven; ik zal mijn God psalmzingen, terwijl ik nog ben. Vertrouw niet op prinsen, op een mensenkind, bij wie geen heil is.", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Ps 118:1-4": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat Israël nu zeggen, dat Zijn goedertierenheid voor eeuwig is. Laat het huis van Aäron nu zeggen, dat Zijn goedertierenheid voor eeuwig is.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Ezech 26:3": "Daarom, zo zegt de Heere HEERE: Zie, Ik wil aan u, o Tyrus! En Ik zal veel heidenvolken tegen u doen opkomen, alsof Ik de zee met haar golven deed opkomen.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Ef 1:12": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.", "Spr 4:17": "Want zij eten brood van goddeloosheid, en drinken wijn van enkel geweld.", "Joh 3:14-16": "En zoals Mozes de slang in de woestijn verhoogd heeft, zo moet de Zoon des mensen verhoogd worden; Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Matt 19:17": "En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden.", "Richt 10:16": "En zij deden de vreemde goden uit hun midden weg, en dienden de HEERE. Toen werd Zijn ziel verdrietig over de ellende van Israël.", "Jes 45:18": "Want zo zegt de HEERE, Die de hemelen geschapen heeft, die God, Die de aarde gevormd heeft, en Die haar gemaakt heeft; Hij heeft haar bevestigd, Hij heeft haar niet geschapen opdat zij leeg zou zijn, maar heeft haar gevormd opdat men daarin zou wonen: Ik ben de HEERE, en niemand meer.", "Ps 119:76": "Laat toch Uw goedertierenheid zijn om mij te troosten, naar Uw toezegging aan Uw knecht.", "1 Petr 3:20": "die vroeger ongehoorzaam waren, toen de lankmoedigheid van God eenmaal wachtte, in de dagen van Noach, terwijl de ark klaargemaakt werd; waarin weinige (dat is acht) zielen behouden werden door het water.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Hebr 11:10": "Want hij verwachtte de stad die fundamenten heeft, waarvan God de Ontwerper en Bouwer is.", "Ps 119:135": "Doe Uw aangezicht lichten over Uw knecht, en leer mij Uw inzettingen.", "Ezech 33:11": "Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël?", "Ps 64:2": "Hoor, o God, mijn stem in mijn geklaag; behoed mijn leven voor de schrik van de vijand.", "2 Sam 22:4": "Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.", "Ps 131:2": "Zeker heb ik mijn ziel tot rust gebracht en stilgehouden, zoals een gespeend kind bij zijn moeder! Mijn ziel is in mij als een gespeend kind.", "Num 27:21": "En hij zal voor Eleazar, de priester, staan, die voor hem om raad zal vragen, volgens de wijze van Urim, voor de HEERE; naar zijn woord zullen zij uitgaan, en naar zijn woord zullen zij ingaan, hij, en alle kinderen van Israël met hem, en de hele vergadering.", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Ps 35:23": "Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.", "Ef 2:9": "niet uit de werken, opdat niemand roemt.", "1 Kor 14:20": "Broeders, word geen kinderen in het verstand, maar wees kinderen in de boosheid, en word in het verstand volwassen.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Matt 24:14": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen.", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "Ps 56:6": "De hele dag verdraaien zij mijn woorden; al hun gedachten zijn tegen mij ten kwade.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "1 Tim 2:5": "Want er is één God, er is ook één Middelaar van God en de mensen, de Mens Christus Jezus;", "Jes 17:10": "Want u hebt de God van uw heil vergeten, en niet gedacht aan de Rotssteen van uw sterkte; daarom zult u wel liefelijke planten planten, en die met uitheemse ranken bezetten;", "Ps 49:8-10": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven; (want de verlossing van hun ziel is te kostbaar, en zal voor eeuwig ophouden); dat hij ook voortaan voor altijd zou leven, en de vergankelijkheid niet zien.", "Klaagl 5:19-22": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht. Waarom zou U ons voor altijd vergeten? Waarom zou U ons zo lange tijd verlaten? HEERE, bekeer ons tot U, dan zullen wij bekeerd zijn; vernieuw onze dagen als vanouds.", "Ps 79:5": "Hoe lang, HEERE? Zult U eeuwig toornen? Zal Uw ijver als vuur branden?", "Ps 103:8-12": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid. Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden. Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "1 Kor 10:12": "Wie dan meent te staan, laat hij toezien dat hij niet valt.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Micha 7:19": "Hij zal Zich weer over ons ontfermen; Hij zal onze ongerechtigheden dempen; ja, U zult al hun zonden in de diepten van de zee werpen.", "Ps 33:20": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild.", "Luk 22:44": "En omdat Hij in zware strijd was, bad Hij des te ernstiger. En Zijn zweet werd als grote druppels bloed, die op de aarde afliepen.", "Luk 1:33": "En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Ps 72:8-11": "En hij zal heersen van de zee tot aan de zee, en van de rivier tot aan de einden van de aarde. De inwoners van dorre plaatsen zullen voor zijn aangezicht knielen, en zijn vijanden zullen het stof lekken. De koningen van Tharsis en de eilanden zullen geschenken aanbrengen; de koningen van Scheba en Seba zullen vereringen toevoeren.", "Ps 86:1-17": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Hebr 11:13": "Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren.", "Openb 21:6": "En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.", "Ps 56:4": "Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "Luk 24:53": "En zij waren voortdurend in de tempel, waar zij God loofden en dankten. Amen.", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Luk 15:2": "En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen.", "Jes 2:5": "Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.", "Ps 119:149": "Hoor mijn stem naar Uw goedertierenheid, o HEERE! maak mij levend naar Uw recht.", "Ps 22:27": "De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.", "2 Kon 19:15-19": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt. HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen. Werkelijk, HEERE, de koningen van Assyrië hebben die heidenvolken en hun land verwoest;", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "Luk 9:25": "Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden?", "Rom 15:6": "opdat u eendrachtig, met één mond, God mag verheerlijken, de Vader van onze Heere Jezus Christus.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Ps 31:2": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "1 Kor 15:38": "Maar God geeft het een lichaam zoals Hij wil, en aan ieder zaad zijn eigen lichaam.", "Ps 103:8-14": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid. Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden. Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "Hebr 11:5": "Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.", "Luk 20:36-38": "want zij kunnen niet meer sterven, want zij zijn gelijk aan de engelen; en zij zijn kinderen van God, omdat zij kinderen van de opstanding zijn. En dat de doden opgewekt zullen worden, heeft ook Mozes aangewezen bij de doornstruik, toen hij de Heere de God van Abraham noemt, en de God van Izak, en de God van Jakob. God is niet een God van de doden, maar van de levenden; want voor Hem leven zij allen.", "Micha 2:1": "Wee hun die onrecht bedenken en kwaad beramen op hun slaapplaatsen; in het licht van de morgen doen zij het, omdat het in de macht van hun hand is.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "2 Sam 7:25-29": "Nu dan, HEERE God, doe dit woord, dat U over Uw knecht en over zijn huis gesproken hebt, blijven bestaan tot in eeuwigheid, en doe zoals U gesproken hebt. En laat Uw Naam groot gemaakt worden tot in eeuwigheid, zodat men zegt: De HEERE van de heerscharen is God over Israël; en het huis van Uw knecht David zal bestendig zijn voor Uw aangezicht. Want U, HEERE van de heerscharen, God van Israël! U hebt het voor het oor van Uw knecht geopenbaard, en gezegd: Ik zal u een huis bouwen; daarom heeft Uw knecht in zijn hart gevonden, dit gebed tot U te bidden.", "Luk 18:14": "Ik zeg u: deze ging gerechtvaardigd naar zijn huis, meer dan die ander; want ieder die zichzelf verhoogt, zal vernederd worden, en die zichzelf vernedert, zal verhoogd worden.", "Ex 22:27": "want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!", "Jer 51:5": "Want Israël of Juda zal niet in weduwschap gelaten worden door zijn God, door de HEERE van de heerscharen (hoewel hun land vol schuld is), door de Heilige van Israël.", "Rom 15:29": "En ik weet dat ik, wanneer ik tot u kom, met volle zegen van het Evangelie van Christus komen zal.", "Ps 42:10": "Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?", "Ps 139:13": "Want U bezit mijn nieren; U hebt mij in de buik van mijn moeder bedekt.", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "Jes 60:1-22": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Joh 6:46": "Niet dat iemand de Vader gezien heeft, behalve Hij Die van God is; Hij heeft de Vader gezien.", "Ps 102:18": "Zich gewend zal hebben tot het gebed van hem die geheel ontbloot is, en niet versmaad hebben hun gebed;", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Jes 45:5": "Ik ben de HEERE, en niemand meer, buiten Mij is er geen God; Ik zal u gorden, hoewel u Mij niet kent.", "Ps 107:21": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen.", "Ps 41:13": "Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.", "Ps 35:18": "Zo zal ik U loven in de grote gemeente; onder machtig veel volk zal ik U prijzen.", "Ps 71:17": "O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.", "Joh 8:26": "Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld.", "Joh 6:44": "Niemand kan tot Mij komen, als de Vader, Die Mij gezonden heeft, hem niet trekt; en Ik zal hem opwekken op de laatste dag.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Ps 116:13": "Ik zal de beker der verlossingen opnemen, en de Naam van de HEERE aanroepen.", "Mark 12:29": "En Jezus antwoordde hem: Het eerste van alle geboden is: Hoor, Israël! De Heere, onze God, is een enig Heere.", "Luk 19:37": "En toen Hij nu in de buurt kwam van de afdaling van de Olijfberg, begon heel de menigte van de discipelen zich te verblijden, en God te loven met luide stem, vanwege alle krachtige daden die zij gezien hadden,", "Jes 55:1-3": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Hebr 4:1-10": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Joh 15:23-25": "Die Mij haat, die haat ook Mijn Vader. Als Ik de werken onder hen niet had gedaan, die niemand anders gedaan heeft, hadden zij geen zonde; maar nu hebben zij ze gezien, en hebben zowel Mij als Mijn Vader gehaat. Maar dit gebeurt, zodat het woord vervuld wordt dat in hun wet geschreven is: Zij hebben Mij zonder oorzaak gehaat.", "Ps 3:7": "Ik zal niet bang zijn voor tienduizenden van het volk, die zich rondom tegen mij opstellen.", "Ps 33:1-3": "Rechtvaardigen! Zingt vrolijk in de HEERE; lof past de oprechten. Looft de HEERE met de harp; zingt Hem psalmen met de luit, en het tiensnarig instrument. Zingt Hem een nieuw lied; speelt goed met vrolijk geschal.", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Jer 32:38": "Ja, zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Ps 54:6": "Zie, God is mij een Helper; de Heere is onder hen die mijn ziel ondersteunen.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Hebr 5:7": "Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.", "Ps 9:20": "Sta op, HEERE, laat de mens zich niet versterken; laat de heidenen voor Uw aangezicht geoordeeld worden.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Luk 15:4-32": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Jes 46:5": "Aan wie zou u Mij gelijk maken, en gelijkstellen, en Mij vergelijken, dat wij op elkaar zouden lijken?", "Dan 6:11": "Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.", "Ps 27:12": "Geef mij niet over in de begeerte van mijn tegenstanders; want valse getuigen zijn tegen mij opgestaan, alsook wie geweld uitblaast.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Job 13:21": "Doe Uw hand ver van mij weg, en laat Uw verschrikking mij niet verbaasd maken.", "Ps 77:2": "Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen.", "Luk 1:58": "En zij die daar rondom woonden, en haar verwanten, hoorden dat de Heere Zijn barmhartigheid overvloedig aan haar bewezen had, en zij verblijdden zich met haar.", "Ps 39:14": "Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.", "Fil 1:15": "Sommigen prediken Christus wel uit afgunst en twist, maar sommigen ook uit goedwilligheid.", "Ps 28:6": "Geprezen zij de HEERE, want Hij heeft de stem van mijn smekingen gehoord.", "Ezech 25:17": "En Ik zal grote wraak met grimmige straffen onder hen voltrekken; en zij zullen weten dat Ik de HEERE ben, wanneer Ik Mijn wraak aan hen zal hebben voltrokken.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Ps 119:154": "Twist mijn twistzaak, en verlos mij, maak mij levend, naar Uw toezegging.", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "Jer 17:17": "Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.", "Rom 9:24": "Ons namelijk, die Hij ook geroepen heeft, niet alleen uit de Joden, maar ook uit de heidenen.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Ps 141:1": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Joh 17:17": "Heilig hen in Uw waarheid; Uw woord is de waarheid.", "Richt 5:3": "Hoor, u koningen, neem het ter ore, u vorsten! Ik, den HEERE zal ik zingen, ik zal den HEERE, de God van Israël, psalmzingen.", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Ps 68:19-21": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God! Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela. Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Jer 32:27": "Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?", "Klaagl 3:26": "Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Jer 7:23-25": "Maar deze zaak heb Ik hun geboden, en Ik zei: Hoor naar Mijn stem, dan zal Ik u tot een God zijn, en u zult Mij tot een volk zijn; en wandel in heel de weg die Ik u gebieden zal, opdat het u goed gaat. Toch hebben zij niet gehoord, noch hun oor geneigd, maar gewandeld in de raadslagen, in het eigen goeddunken van hun slechte hart; en zij zijn achterwaarts gekeerd, en niet voorwaarts. Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en in uw geest, die van God zijn.", "Pred 11:5": "Zoals u niet weet wat de weg van de wind is, of hoe de beenderen zijn in de buik van een zwangere vrouw, zo weet u het werk van God niet, Die het alles maakt.", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "1 Kron 16:35": "En zegt: Verlos ons, o God van ons heil, en verzamel ons, en red ons van de heidenen, opdat wij Uw heilige Naam loven, en opdat wij ons in Uw lof roemen.", "Job 36:24": "Denk eraan, dat u Zijn werk groot maakt, dat de mensen aanschouwen.", "Num 16:48": "En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Ps 47:7": "Zingt psalmen voor God, zingt psalmen! Zingt psalmen voor onze Koning, zingt psalmen!", "Luk 19:38": "en zij zeiden: Gezegend is de Koning, Die komt in de Naam van de Heere! Vrede in de hemel, en heerlijkheid in de hoogste hemelen!", "Ps 68:29": "Uw God heeft uw sterkte geboden; wees sterk, o God, in wat U voor ons hebt uitgewerkt!", "Ps 55:11": "Dag en nacht gaan zij er omheen op haar muren; en ongerechtigheid en overlast is binnen in haar.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Richt 13:16": "Maar de Engel van de HEERE zei tegen Manoach: Al zou u Mij ophouden, Ik zal van uw brood niet eten; en als u een brandoffer wilt brengen, moet u dat aan de HEERE offeren. Want Manoach wist niet dat het een Engel van de HEERE was.", "Kol 1:27": "aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "Ef 4:6": "Eén God en Vader van allen, Die boven allen is, en door allen, en in u allen.", "Ps 139:24": "En zie, of er bij mij een schadelijke weg is; en leid mij op de eeuwige weg.", "2 Kon 6:22": "Doch hij zei: U zult hen niet doden; zou u ook doden wie u met uw zwaard en met uw boog gevangen had? Zet hun brood en water voor, dat zij eten en drinken, en naar hun heer trekken.", "2 Kon 14:27": "En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.", "Rom 1:5": "(Door Wie wij genade en het apostelschap hebben ontvangen, tot gehoorzaamheid van het geloof onder alle heidenen, voor Zijn Naam;", "Ps 37:7": "Daleth. Zwijg voor de HEERE, en verwacht Hem; wind u niet op over hem die voorspoedig is op zijn weg; over een man die listige plannen uitvoert.", "Zef 1:5": "En hen die zich neerbuigen op de daken voor het leger van de hemel, en hen die zich neerbuigend zweren bij de HEERE, en zweren bij Malcham;", "Ps 25:20": "Schin. Bewaar mijn ziel, en red mij; laat mij niet beschaamd worden, want ik vertrouw op U.", "Dan 4:22-27": "Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk. Dat nu de koning een wachter, namelijk een heilige, gezien heeft, uit de hemel neerkomend, die zei: Houwt deze boom om, en verderf hem; maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld, en in de dauw van de hemel nat gemaakt worden, en dat zijn deel zij met het gedierte van het veld, totdat er zeven tijden over hem voorbijgaan; Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal:", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "2 Petr 3:13": "Maar wij verwachten, naar Zijn belofte, nieuwe hemelen en een nieuwe aarde, waarin gerechtigheid woont.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "Joh 16:23": "En op die dag zult u Mij niets vragen. Voorwaar, voorwaar, Ik zeg u: alles wat u de Vader zult bidden in Mijn Naam, zal Hij u geven.", "Ps 2:8": "Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting.", "Ps 96:1-4": "Zingt de HEERE een nieuw lied; zingt de HEERE, heel de aarde! Zingt de HEERE, looft Zijn Naam; verkondigt Zijn heil van dag tot dag. Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Jes 62:7": "En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.", "Ps 123:1": "Een lied op Hammaäloth. Ik hef mijn ogen op tot U, Die in de hemelen zit.", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Fil 1:16": "Dezen verkondigen Christus wel uit eigenbelang, niet zuiver, en menen aan mijn banden verdrukking toe te brengen;", "Lev 19:14": "U zult de dove niet vloeken, en voor het aangezicht van de blinde geen struikelblok zetten; maar u zult voor uw God vrezen; Ik ben de HEERE!", "Rom 12:3": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld.", "Rom 12:19": "Wreek uzelf niet, ge
