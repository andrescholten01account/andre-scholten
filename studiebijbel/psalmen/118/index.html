ederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.","2":"Laat Israël nu zeggen, dat Zijn goedertierenheid voor eeuwig is.","3":"Laat het huis van Aäron nu zeggen, dat Zijn goedertierenheid voor eeuwig is.","4":"Laten zij die de HEERE vrezen, nu zeggen, dat Zijn goedertierenheid voor eeuwig is.","5":"Uit de benauwdheid heb ik de HEERE aangeroepen; de HEERE heeft mij verhoord en *mij* in de ruimte gezet.","6":"De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?","7":"De HEERE is bij mij onder degenen die mij helpen; daarom zal ik *mijn* *lust* zien aan degenen die mij haten.","8":"Het is beter tot de HEERE toevlucht te nemen, dan op de mens te vertrouwen.","9":"Het is beter tot de HEERE toevlucht te nemen, dan op prinsen te vertrouwen.","10":"Alle heidenen hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.","11":"Zij hadden mij omringd, ja, zij hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.","12":"Zij hadden mij omringd als bijen; zij zijn uitgeblust als een doornenvuur; het is in de Naam van de HEERE, dat ik hen verslagen heb.","13":"U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.","14":"De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.","15":"In de tenten van de rechtvaardigen is een stem van gejuich en van het heil; de rechterhand van de HEERE doet krachtige daden.","16":"De rechterhand van de HEERE is verhoogd; de rechterhand van de HEERE doet krachtige daden.","17":"Ik zal niet sterven, maar leven; en ik zal de werken van de HEERE vertellen.","18":"De HEERE heeft mij wel hard gekastijd; maar Hij heeft mij niet ter dood overgegeven.","19":"Doe mij de poorten van de gerechtigheid open, ik zal daardoor ingaan, ik zal de HEERE loven.","20":"Dit is de poort van de HEERE, waardoor de rechtvaardigen zullen ingaan.","21":"Ik zal U loven, omdat U mij verhoord hebt, en mij tot heil geweest bent.","22":"De steen, *die* de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden.","23":"Dit is van de HEERE gebeurd, *en* het is wonderlijk in onze ogen.","24":"Dit is de dag, *die* de HEERE gemaakt heeft; laten we ons daarover verheugen, en verblijd zijn.","25":"Och HEERE, geef nu heil; och HEERE, geef nu voorspoed.","26":"Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.","27":"De HEERE is God, Die ons licht gegeven heeft. Bind het feest*offer* met touwen tot aan de hoornen van het altaar.","28":"U bent mijn God, daarom zal ik U loven; o mijn God, ik zal U verhogen.","29":"Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig."},"SV":{"1":"Looft den HEERE, want Hij is goed; want Zijn goedertierenheid is in der eeuwigheid.","2":"Dat Israël nu zegge, dat Zijn goedertierenheid in der eeuwigheid is.","3":"Het huis van Aäron zegge nu, dat Zijn goedertierenheid in der eeuwigheid is.","4":"Dat degenen, die den HEERE vrezen, nu zeggen, dat Zijn goedertierenheid in der eeuwigheid is.","5":"Uit de benauwdheid heb ik den HEERE aangeroepen; de HEERE heeft mij verhoord, *stellende* *mij* in de ruimte.","6":"De HEERE is bij mij, ik zal niet vrezen; wat zal mij een mens doen?","7":"De HEERE is bij mij onder degenen, die mij helpen; daarom zal ik *mijn* *lust* zien aan degenen, die mij haten.","8":"Het is beter tot den HEERE toevlucht te nemen, dan op den mens te vertrouwen.","9":"Het is beter tot den HEERE toevlucht te nemen, dan op prinsen te vertrouwen.","10":"Alle heidenen hadden mij omringd; het is in den Naam des HEEREN, dat ik ze verhouwen heb.","11":"Zij hadden mij omringd, ja, zij hadden mij omringd; het is in den Naam des HEEREN, dat ik ze verhouwen heb.","12":"Zij hadden mij omringd als bijen; zij zijn uitgeblust als een doornenvuur; het is in den Naam des HEEREN, dat ik ze verhouwen heb.","13":"Gij hadt mij zeer hard gestoten, tot vallens toe, maar de HEERE heeft mij geholpen.","14":"De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.","15":"In de tenten der rechtvaardigen is een stem des gejuichs en des heils; de rechterhand des HEEREN doet krachtige daden.","16":"De rechterhand des HEEREN is verhoogd; de rechterhand des HEEREN doet krachtige daden.","17":"Ik zal niet sterven, maar leven; en ik zal de werken des HEEREN vertellen.","18":"De HEERE heeft mij wel hard gekastijd; maar Hij heeft mij ter dood niet overgegeven.","19":"Doet mij de poorten der gerechtigheid open, ik zal daardoor ingaan, ik zal den HEERE loven.","20":"Dit is de poort des HEEREN, door dewelke de rechtvaardigen zullen ingaan.","21":"Ik zal U loven, omdat Gij mij verhoord hebt, en mij tot heil geweest zijt.","22":"De steen, *dien* de bouwlieden verworpen hadden, is tot een hoofd des hoeks geworden.","23":"Dit is van den HEERE geschied, *en* het is wonderlijk in onze ogen.","24":"Dit is de dag, *dien* de HEERE gemaakt heeft; laat ons op denzelven ons verheugen, en verblijd zijn.","25":"Och HEERE! geef nu heil; och HEERE! geef nu voorspoed.","26":"Gezegend zij hij, die daar komt in den Naam des HEEREN! Wij zegenen ulieden uit het huis des HEEREN.","27":"De HEERE is God, Die ons licht gegeven heeft. Bindt het feest *offer* met touwen tot aan de hoornen van het altaar.","28":"Gij zijt mijn God, daarom zal ik U loven; o mijn God! ik zal U verhogen.","29":"Loof den HEERE, want Hij is goed; want Zijn goedertierenheid is in der eeuwigheid."},"KJV":{"1":"O give thanks unto the LORD; for *he is* good: because his mercy *endureth* for ever.","2":"Let Israel now say, that his mercy *endureth* for ever.","3":"Let the house of Aaron now say, that his mercy *endureth* for ever.","4":"Let them now that fear the LORD say, that his mercy *endureth* for ever.","5":"I called upon the LORD in distress: the LORD answered me, *and set me* in a large place.","6":"The LORD *is* on my side; I will not fear: what can man do","7":"The LORD taketh my part with them that help me: therefore shall I see *my desire* upon them that hate","8":"*It is* better to trust in the LORD than to put confidence in man.","9":"*It is* better to trust in the LORD than to put confidence in princes.","10":"All nations compassed me about: but in the name of the LORD will I destroy","11":"They compassed me about; yea, they compassed me about: but in the name of the LORD I will destroy","12":"They compassed me about like bees; they are quenched as the fire of thorns: for in the name of the LORD I will destroy","13":"Thou hast thrust sore at me that I might fall: but the LORD helped","14":"The LORD *is* my strength and song, and is become my salvation.","15":"The voice of rejoicing and salvation *is* in the tabernacles of the righteous: the right hand of the LORD doeth valiantly.","16":"The right hand of the LORD is exalted: the right hand of the LORD doeth valiantly.","17":"I shall not die, but live, and declare the works of the LORD.","18":"The LORD hath chastened me sore: but he hath not given me over unto death.","19":"Open to me the gates of righteousness: I will go into them, *and* I will praise the LORD:","20":"This gate of the LORD, into which the righteous shall enter.","21":"I will praise thee: for thou hast heard me, and art become my salvation.","22":"The stone *which* the builders refused is become the head *stone* of the corner.","23":"This is the LORD'S doing; it *is* marvellous in our eyes.","24":"This *is* the day *which* the LORD hath made; we will rejoice and be glad","25":"Save now, I beseech thee, O LORD: O LORD, I beseech thee, send now prosperity.","26":"Blessed *be* he that cometh in the name of the LORD: we have blessed you out of the house of the LORD.","27":"God *is* the LORD, which hath shewed us light: bind the sacrifice with cords, *even* unto the horns of the altar.","28":"Thou *art* my God, and I will praise thee: *thou art* my God, I will exalt","29":"O give thanks unto the LORD; for *he is* good: for his mercy *endureth* for ever."}},"tsk":{"5":[{"kopje":"aangeroepen","refs":["Ps 18:7","Ps 40:2-4","Ps 77:3","Ps 107:13","Ps 107:19","Ps 116:3","Ps 116:4","Ps 120:1","Ps 130:1","Ps 130:2","Gen 32:7","Gen 32:9-11","1 Sam 30:6-8","Mark 14:31-36"]},{"kopje":"Uit de benauwdheid","refs":["Ps 130:1"]},{"kopje":"in de ruimte gezet","refs":["Ps 18:20","Ps 31:9"]}],"6":[{"kopje":"De HEERE","refs":["Ps 27:1-3","Ps 46:2","Ps 46:12","Ps 56:5","Ps 56:10","Ps 56:12","Ps 146:5","Jes 51:12","Jer 20:11","Micha 7:8-10","Rom 8:31","Hebr 13:6"]}],"7":[{"kopje":"is bij mij","refs":["Ps 54:6","Ps 55:19","1 Kron 12:18"]},{"kopje":"daarom","refs":["Ps 54:9","Ps 59:11","Ps 92:12","Ps 112:8"]}],"9":[{"kopje":"dan op prinsen te vertrouwen","refs":["Ps 146:3-5","Jes 30:2","Jes 30:3","Jes 30:15-17","Jes 31:1","Jes 31:8","Jes 36:6","Jes 36:7","Ezech 29:7"]}],"10":[{"kopje":"Alle heidenen","refs":["2 Sam 5:1-25","2 Sam 8:1-18","2 Sam 10:1-19","Zach 12:3","Zach 14:1-3","Openb 19:19-21","Openb 20:8","Openb 20:9"]}],"12":[{"kopje":"als bijen","refs":["Deut 1:44"]},{"kopje":"uitgeblust","refs":["Ps 83:15","Ps 83:16","Pred 7:6","Jes 27:4","Nahum 1:10"]},{"kopje":"in de Naam","refs":["Ps 8:10","Ps 20:2","Ps 20:6","1 Sam 17:45","2 Sam 23:6","1 Kron 14:10","1 Kron 14:11","1 Kron 14:14-16","2 Kron 14:11","2 pan class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H7426\">exalted:</span> the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> valiantly.","17":"I shall not <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> but <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> and <span class=\"wl wl-kjv\" data-code=\"H5608\">declare</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> of the LORD.","18":"The <span class=\"wl wl-kjv\" data-code=\"H3050\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H3256\">chastened</span> me <span class=\"wl wl-kjv\" data-code=\"H3256\">sore:</span> but he hath not given me <span class=\"wl wl-kjv\" data-code=\"H5414\">over</span> unto death.","19":"<span class=\"wl wl-kjv\" data-code=\"H6605\">Open</span> to me the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness:</span> I will <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into them, and I will <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> the LORD:","20":"This <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> into which the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> shall enter.","21":"I will <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> thee: for thou hast <span class=\"wl wl-kjv\" data-code=\"H6030\">heard</span> me, and art become my salvation.","22":"The <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> which the <span class=\"wl wl-kjv\" data-code=\"H1129\">builders</span> <span class=\"wl wl-kjv\" data-code=\"H3988\">refused</span> is become the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> stone of the corner.","23":"This is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> doing; it is <span class=\"wl wl-kjv\" data-code=\"H6381\">marvellous</span> in our eyes.","24":"This is the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">made;</span> we will <span class=\"wl wl-kjv\" data-code=\"H1523\">rejoice</span> and be glad","25":"<span class=\"wl wl-kjv\" data-code=\"H3467\">Save</span> now, I <span class=\"wl wl-kjv\" data-code=\"H577\">beseech</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> I <span class=\"wl wl-kjv\" data-code=\"H577\">beseech</span> thee, send now prosperity.","26":"<span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be he that <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> we have <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> you out of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the LORD.","27":"<span class=\"wl wl-kjv\" data-code=\"H410\">God</span> is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which hath shewed us <span class=\"wl wl-kjv\" data-code=\"H215\">light:</span> <span class=\"wl wl-kjv\" data-code=\"H631\">bind</span> the <span class=\"wl wl-kjv\" data-code=\"H2282\">sacrifice</span> with <span class=\"wl wl-kjv\" data-code=\"H5688\">cords,</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> of the altar.","28":"Thou art my <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> thee: thou art my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> I will exalt","29":"O give <span class=\"wl wl-kjv\" data-code=\"H3034\">thanks</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> for he is <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> for his <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> endureth for ever."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"want Hij is goed;","tekst":"David vermaant alle mensen tot lof en prijs des Heeren met deze rede: want Hij is goed. De woorden van dit vers staan ook in Psa 106:1 en Psa 107:1 , en bij ieder vers van de Psa 136 psalm."}],"2":[{"catchword":"Israël nu zegge,","tekst":"Niet het aardse Israël alleen, maar ook het Israël Gods, Gal 6:16 ; dat is, alle gelovigen, die waarachtiglijk Gods volk zijn, zij zijn dan Joden of heidenen. Alzo ook vs.4."}],"3":[{"catchword":"Het huis Aärons","tekst":"Dat is, de priesters van Aäron afkomstig; zie Psa 115:10 ."}],"5":[{"catchword":"in de ruimte","tekst":"Of, in een ruime plaats; te weten, mij brengende uit de benauwdheid in de ruimte en tot eer en heerlijkheid, gelijk Psa 18:20 ."}],"6":[{"catchword":"bij mij,","tekst":"Of, met mij, of voor mij; dat is, gelijk het de apostel, Heb 13:6 , verklaart: de Heere is mijn helper. Alzo ook onder vs.7, en Psa 56:5 , Psa 56:12 ."},{"catchword":"ik zal niet vrezen;","tekst":"Te weten, voor mijne vijanden."},{"catchword":"mij een mens doen?","tekst":"Te weten, een zwak creatuur, geenzins met God te vergelijken."}],"7":[{"catchword":"bij mij","tekst":"Gelijk boven vs.6."},{"catchword":"onder degenen,","tekst":"Verg. Psa 54:6 ."},{"catchword":"zal ik","tekst":"Zie deze verkorte manier van spreken ook Psa 35:21 , en Psa 92:12 ; zie ook de aantekening bij Psa 22:18 aldaar."},{"catchword":"mijn lust","tekst":"Te weten, mij in God verblijdende over den ondergang van zijne en mijne verstokte, onbekeerlijke vijanden."}],"10":[{"catchword":"Alle heidenen","tekst":"Dat is, allerlei of zoveel, dat het scheen, dat zij zich allen tegen mij verbonden hadden; en versta hier inzonderheid de omliggende volken, gelijk de Filistijnen, die hem haatten, en de Amelekieten, die zijne stad Ziklag verbrand hadden, 1Sa 30 ja ook de velen onder de Israëlieten, die Saul hielpen toen hij David vervolgde."},{"catchword":"in den Naam des","tekst":"Dat is, mij verlatende op den Heere, mijn noodhelper, gelijk Psa 20:6 . Zie ook 2Ki 2:24 ."}],"11":[{"catchword":"zij hadden mij omringd;","tekst":"Te weten, met meer macht en geweld dan in het eerste."}],"12":[{"catchword":"als bijen; zij","tekst":"Zie de aantekening bij Deu 1:44 , en verg. Isa 7:18 ."},{"catchword":"als een doornenvuur;","tekst":"Hetwelk haast aan brand komt en heet is, ook veel rooks en gekraaks geeft, nochtans terstond vergaat. Zie Ecc 7:6 ; Nah 1:10 ."}],"13":[{"catchword":"Gij hadt mij zeer","tekst":"Hebr. stotende hadt gij mij gestoten. De psalmist spreekt hier zijnen vijand aan, die hem zeer wredelijk mishandeld had. Zie Psa 9:7 ."}],"14":[{"catchword":"mijn Sterkte en","tekst":"Dat is, die mij sterkte geeft, alzo dat ik tegen mijne vijanden kan bestaan; Isa 12:2 ."},{"catchword":"Psalm, want Hij","tekst":"Dat is, de materie en stof van mijn gezang. Zie Exo 15:2 ."}],"15":[{"catchword":"de tenten der","tekst":"Dat is, in de huizen."},{"catchword":"is een stem des","tekst":"Te weten, vanwege de verlossing, die Hij zijn volk gegeven heeft."},{"catchword":"des heils;","tekst":"Dat is, de overwinning, gelijk Psa 98:1 ."},{"catchword":"rechterhand des","tekst":"Dat is, God de Heere."},{"catchword":"krachtige daden","tekst":"Of, kracht, kloekheid, dapperheid, gelijk Psa 98:1 ."}],"16":[{"catchword":"is verhoogd;","tekst":"Dat is, God laat zijne kracht heerlijk en klaarlijk blijken, alzo dat elkeen die moet roemen en prijzen."}],"17":[{"catchword":"Ik zal niet sterven,","tekst":"Te weten, door het zwaard of de hand mijner vijanden."},{"catchword":"ik zal de werken","tekst":"Te weten, hoe wonderbaarlijk Hij mij en andere vrome lieden menigmaal verlost en bescherm heeft."}],"18":[{"catchword":"heeft mij wel hard","tekst":"Hebr. kastijdende gekastijd."}],"19":[{"catchword":"Doet mij","tekst":"Eene aanspraak aan de priesters en Levieten."},{"catchword":"de poorten der","tekst":"Dat is, de poorten des tabernakels en de heilige plaats, die daarom de poorten der gerechtigheid genoemd worden, omdat alleen de vromen en reinen daarin behoren te komen, gelijk blijkt in vs.20. David had geruime tijd in en bij den tabernakel niet mogen verschijnen, vluchtende voor Saul. Nu mocht hij weder daarin komen en in de vergadering der godzaligen verschijnen."}],"20":[{"catchword":"poort des HEEREN,","tekst":"Of deze poort is des Heeren. Versta, de poort des tabernakels, den Heere geheiligd; een voorbeeld des Heeren Jezus Christus, die de poort der gerechtigheid is; en des hemels, in welken Hij is ingegaan."}],"22":[{"catchword":"steen, dien de","tekst":"Versta door dezen steen vooreerst David, die een tijdlang van de vorsten in Israël en de voornaamsten des rijks is veracht en verworpen geweest, doch de Heere heeft hem evenwel nog eindelijk tot het koninkrijk veheven, om het te regeren en als de hoeksteen van hetzelve te zijn; daarna moet het van Christus, wiens voorbeeld David geweest is, voornamelijk verstaan worden, welken de overpriesters, schriftgeleerden en oversten des volks, die als bouwlieden over de kerk Gods gesteld waren, verworpen, vervolgd en gedood hebben; doch God heeft hem als een hoofd en fondament over zijne kerk verordineerd en gesteld, die het gebouw van het huis samenbindt en bevestigt."}],"23":[{"catchword":"Dit is van den","tekst":"Te weten, dat de verworpen steen is geworden de voorname steen van het huis des Heeren."},{"catchword":"het is wonderlijk","tekst":"Te weten, dat die verachte en verworpen steen nu zo geacht en verheven is."}],"24":[{"catchword":"Dit is de dag,","tekst":"Te weten, in welken dag David koning is geworden, en Christus door de predikatie van het heilige Evangelie is bekend gemaakt."},{"catchword":"dien de HEERE","tekst":"Dat is, dien de Heere boven andere dagen heeft verheerlijkt. Aldus wordt het woord maken voor verheerlijken ook genomen. Zie de aantekening bij 1Sa 12:6 ."}],"25":[{"catchword":"geef nu heil;","tekst":"De evangelisten houden de Hebr. woorden Hosia na ; Mat 21:9 , Mat 21:15 , en Mar 11:9-10 ."},{"catchword":"geef nu voorspoed","tekst":"Te weten, den koning David en den Heere Christus, wiens voorbeeld hij is."}],"26":[{"catchword":"Gezegend zij hij,","tekst":"Dat is, wij wensen hem Gods zegen; het is gelofelijk dat de priesters en het volk Gods deze gelukwensing den koning David gedaan hebben, als hij eerst de koninklijke regering heeft aangevangen; daarna heeft het volk dezelfde woorden; Christus toegeroepen, als Hij zijne inkomst binnen Jeruzalem gedaan heeft; Mat 21:9 ."},{"catchword":"in den Naam des","tekst":"Dat is, met macht en gezag van den Heere; Luk 19:38 ."},{"catchword":"Wij zegenen ulieden","tekst":"Dit schijnen te zijn de woorden der priesters, wiens ambt het was het volk te zegenen in het huis des Heeren; Num 6:23 ; Deu 10:8 ; 1Ch 23:13 . Alsof zij zeiden: Wij van het huis des Heeren, dat is wij priesters, die ingesteld zijn tot opzieners in het huis des Heeren en wien het toekomt het volk des Heeren te zegenen, wij zegenen u, o koning David, en het volk dat bij u is. Zie Psa 72:15 ."},{"catchword":"uit het huis des HEEREN","tekst":"Dat is, uit den tabernakel ten tijde van David; doch uit den tempel ten tijde van onze Heere Christus."}],"27":[{"catchword":"licht gegeven heeft","tekst":"Dat is, geluk, vreugde, troost en blijdschap, in plaats van droefenis en jammer, gelijk Est 8:16 ."},{"catchword":"Bindt","tekst":"Dat is, bereidt u om het feest te houden en den Heere te offeren."},{"catchword":"het feest- offer","tekst":"Hebr. het feest. Maar het betekent hier het beest of het offer, dat op dien feestdag zou geofferd worden."},{"catchword":"tot aan","tekst":"Dat is, zovelen dat men ze moest brengen en binden tot aan de hoornen des altaars."},{"catchword":"de hoornen van het altaar","tekst":"Zie de aantekening bij Exo 27:2"}],"29":[{"catchword":"Loof den HEERE,","tekst":"Zie boven vs.1."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Praise the LORD, for he is good: [David exhorteth all men to laud and praise the Lord, for this reason, that the LORD is good. The words of this verse are extant also, Psa 106:1. and 107.1. and in every verse of Psalm 136. [for his kindness is Eternity."}],"2":[{"catchword":null,"tekst":"Let Israel say now, [Not onely the earthly Israel, but also the Israel of God, Galat.6.16. i.e. all the faithful which are truely the people of God, whether Jews or Gentiles. So also verse 4.] that his kindness is in Eternity."}],"3":[{"catchword":null,"tekst":"Let the house of Aaron [i.e. the Priests of Aarons posterity. See Psalm 115.on v.10.] say now, that his kindness is in Eternity."}],"4":[{"catchword":null,"tekst":"Let those that fear the LORD say now, that his kindness is in Eternity."}],"5":[{"catchword":null,"tekst":"Out of distress I called upon the LORD: the LORD heard me (putting me) at large. [Or, into a large place: viz. Bringing me out of straights into liberty, honour and glory, as Psa 18:20.]"}],"6":[{"catchword":null,"tekst":"The LORD is with me [Or by, or for me, i.e. as the Apostle clears it, Heb 13:6. The LORD is my helper. So likewise below v.7. and Psa 56:5.12.] I shall not be afraid, [viz. Of mine enemies] what shall a man do unto me? [viz. Such a weak and feeble creature, not to be compared with God?]"}],"7":[{"catchword":null,"tekst":"The LORD is with me, [As before, v.6. among those that help me: Compare Psalm 54.on v.6.] therefore shall I see (my delight) on those that hate me. [See the like abrupt expressions, Psa 35:21. and 92.12. See also Psa 22:18. and the Annotations there. [The meaning is, that he shall rejoice in God over the destruction of Gods and his own hardened and unconvertible enemies.]"}],"8":[{"catchword":null,"tekst":"It is better to take (ones) refuge to the LORD, then to confide in men."}],"9":[{"catchword":null,"tekst": d of the LORD, [i.e. the LORD God] doth mighty works; [or power, valour, valiantness, as Psa 108:14.]"}],"16":[{"catchword":null,"tekst":"The right hand of the LORD is exalted: [The LORD causeth his power to appear gloriously and manifestly, so that every one must take notice of praise, and magnify the same] the right hand of the LORD doth mighty works."}],"17":[{"catchword":null,"tekst":"I shall not die, [viz. By the sword or hand of mine enemy] but live: and I shall rehearse the works of the LORD. [viz. How wonderfully and frequently he hath delivered and protected me and other godly ones."}],"18":[{"catchword":null,"tekst":"The LORD hath chastised me hard indeed [ Hebr. Chastising, chastised me] but he hath not delivered me over unto Death."}],"19":[{"catchword":null,"tekst":"Open unto me [He addresseth his speech to the Priests and Levites] the gates of righteousness, [i.e. the gates of the Tabernacle, and the holy place, called therefore the gates of righteousness, because none were to enter therein but the pure and godly, as appears, v.20. David was debarred for a great while from the Tabernacle, not daring to come near or into it, whilest Saul pursued him; and now he could freely repair again unto it, and present himself in the congregation of the godly] I will go in there, I will praise the LORD."}],"20":[{"catchword":null,"tekst":"This is the gate of the LORD, [Or this gate is the LORDS, understand teh gate of the Tabernacle, sanctified unto the LORD, a Type of Jesus Christ, who is the gate of righteousness, and of Heaven into which he in entered] through which the righteous shall enter."}],"21":[{"catchword":null,"tekst":"I will praise thee, for that thou hast heard me; and hast been salvation to me."}],"22":[{"catchword":null,"tekst":"The stone which the Builders had rejected, is become the head of the corner. [By this stone, there is understood, first David, who for a good while was despised and rejected by the Princes in Israel, and the chief of the Kin // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [

     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},

  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

  }
  if (tab === 'verwijzingen') {

    const engels = D.tsk_kjv[n];

    } else {
      h += '<em>Geen verwijzingen</em>';

  }

  const o = D.onderwerpen[n];

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
