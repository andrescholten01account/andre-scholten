ederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Een psalm van David. Geprezen zij de HEERE, mijn Rotssteen, Die mijn handen leert voor de strijd, mijn vingers voor de oorlog;","2":"Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!","3":"O HEERE, wat is de mens, dat U hem kent, het kind van de mens, dat U op hem let?","4":"De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.","5":"Buig Uw hemelen, HEERE, en daal neer; raak de bergen aan, zodat ze roken.","6":"Bliksem met bliksem, en verstrooi hen; zend Uw pijlen uit, en vernietig hen.","7":"Steek Uw handen van boven uit; bevrijd mij, en red mij uit het vele water, uit de hand van vreemden;","8":"wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is.","9":"O God, ik zal U een nieuw lied zingen; met de luit en het tiensnarig instrument zal ik U lofzingen.","10":"U, Die de koningen overwinning geeft, Die Zijn dienaar David bevrijdt van het boze zwaard;","11":"Bevrijd mij en red mij van de hand van vreemden, wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is;","12":"opdat onze zonen zijn als planten, die groot geworden zijn in hun jeugd; onze dochters als hoekstenen, uitgehouwen naar het voorbeeld van een paleis.","13":"Dat onze schuren vol zijn, de ene voorraad na de andere opleverend; dat onze kudden bij duizenden jongen werpen, ja, bij tienduizenden op onze velden zich vermenigvuldigen.","14":"Dat onze ossen goed beladen zijn; dat er geen inbraak is, geen uitval, geen gejammer op onze straten.","15":"Gelukkig is het volk dat het zo vergaat; gelukkig is het volk wiens God de HEERE is."},"SV":{"1":"*Een* *psalm* van David. Gezegend zij de HEERE, mijn Rotssteen, Die mijn handen onderwijst ten strijde, mijn vingeren ten oorlog;","2":"Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wien ik mij betrouwe; Die mijn volk aan mij onderwerpt!","3":"O HEERE! wat is de mens, dat Gij hem kent, het kind des mensen, dat Gij het acht?","4":"De mens is der ijdelheid gelijk; zijn dagen zijn als een voorbijgaande schaduw.","5":"Neig Uw hemelen, HEERE! en daal neder; raak de bergen aan, dat zij roken.","6":"Bliksem bliksem, en verstrooi hen; zend Uw pijlen uit, en verdoe hen.","7":"Steek Uw handen van de hoogte uit; ontzet mij, en ruk mij uit de grote wateren, uit de hand der vreemden;","8":"Welker mond leugen spreekt, en hun rechterhand is een rechterhand der valsheid.","9":"O God! ik zal U een nieuw lied zingen; met de luit *en* het tiensnarig instrument zal ik U psalmzingen.","10":"Gij, Die den koningen overwinning geeft, Die Zijn knecht David ontzet van het boze zwaard;","11":"Ontzet mij en red mij van de hand der vreemden, welker mond leugen spreekt, en hun rechterhand is een rechterhand der valsheid;","12":"Opdat onze zonen zijn als planten, welke groot geworden zijn in hun jeugd; onze dochters als hoekstenen, uitgehouwen naar de gelijkenis van een paleis.","13":"Dat onze winkelen vol zijnde, den enen voorraad na den anderen uitgeven; dat onze kudden bij duizenden werpen, *ja*, bij tienduizenden op onze hoeven vermenigvuldigen.","14":"Dat onze ossen wel geladen zijn; dat geen inbreuk, noch uitval, noch gekrijs zij op onze straten.","15":"Welgelukzalig is het volk, dien het alzo gaat; welgelukzalig, is het volk, wiens God de HEERE is."},"KJV":{"1":"[[*A Psalm* of David.]] Blessed *be* the LORD my strength, which teacheth my hands to war, *and* my fingers to fight:","2":"My goodness, and my fortress; my high tower, and my deliverer; my shield, and *he* in whom I trust; who subdueth my people","3":"LORD, what *is* man, that thou takest knowledge of him! *or* the son of man, that thou makest account","4":"Man is like to vanity: his days *are* as a shadow that passeth away.","5":"Bow thy heavens, O LORD, and come down: touch the mountains, and they shall smoke.","6":"Cast forth lightning, and scatter them: shoot out thine arrows, and destroy","7":"Send thine hand from above; rid me, and deliver me out of great waters, from the hand of strange children;","8":"Whose mouth speaketh vanity, and their right hand *is* a right hand of falsehood.","9":"I will sing a new song unto thee, O God: upon a psaltery *and* an instrument of ten strings will I sing praises","10":"*It is he* that giveth salvation unto kings: who delivereth David his servant from the hurtful sword.","11":"Rid me, and deliver me from the hand of strange children, whose mouth speaketh vanity, and their right hand *is* a right hand of falsehood:","12":"That our sons *may be* as plants grown up in their youth; *that* our daughters *may be* as corner stones, polished *after* the similitude of a palace:","13":"*That* our garners *may be* full, affording all manner of store: *that* our sheep may bring forth thousands and ten thousands in our streets:","14":"*That* our oxen *may be* strong to labour; *that there be* no breaking in, nor going out; that *there be* no complaining in our streets.","15":"Happy *is that* people, that is in such a case: *yea*, happy *is that* people, whose God *is* the LORD."}},"tsk":{"1":[{"kopje":"mijn Rotssteen","refs":["Ps 18  wl-kjv\" data-code=\"H3068\">LORD,</span> and come <span class=\"wl wl-kjv\" data-code=\"H3381\">down:</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">touch</span> the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and they shall smoke.","6":"Cast <span class=\"wl wl-kjv\" data-code=\"H1299\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H1300\">lightning,</span> and <span class=\"wl wl-kjv\" data-code=\"H6327\">scatter</span> them: shoot <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> thine <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows,</span> and destroy","7":"<span class=\"wl wl-kjv\" data-code=\"H7971\">Send</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> from <span class=\"wl wl-kjv\" data-code=\"H4791\">above;</span> <span class=\"wl wl-kjv\" data-code=\"H6475\">rid</span> me, and <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> me out of <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">waters,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5236\">strange</span> children;","8":"Whose <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaketh</span> <span class=\"wl wl-kjv\" data-code=\"H7723\">vanity,</span> and their right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> is a right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> of falsehood.","9":"I will <span class=\"wl wl-kjv\" data-code=\"H7891\">sing</span> a <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H7892\">song</span> unto thee, O <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> upon a <span class=\"wl wl-kjv\" data-code=\"H5035\">psaltery</span> and an instrument of ten <span class=\"wl wl-kjv\" data-code=\"H6218\">strings</span> will I sing praises","10":"It is he tha t verstoring uwer vijanden."},{"catchword":"bergen aan,","tekst":"Dat is, (naar sommiger gevoelen) mijn grote en geweldige vijanden. Men kan dit ook nemen als ene beschrijving van de majesteit en de macht Gods in het uitvoeren van zijne oordelen tegen de goddelozen, die de vromen verdrukken. Verg. Psa 104:32 , enz."},{"catchword":"dat zij roken","tekst":"Dat is, dat zij als rook verdwijnen."}],"6":[{"catchword":"Bliksem bliksem,","tekst":"Dat is, sla hen ter neder en maak hen te schande met uw goddelijke en hemelse kracht."},{"catchword":"verstrooi hen;","tekst":"Te weten, die vreemde kinderen, van welke gesproken wordt vs.7."}],"7":[{"catchword":"van de hoogte uit;","tekst":"Dat is, uit den hemel; gelijk Psa 18:17 ."},{"catchword":"uit de grote","tekst":"Dat is, uit de grote vervolgingen der goddelozen. Zie 2Sa 22:17 ."},{"catchword":"der vreemden;","tekst":"Hebr. der kinderen des vreemden: hetzij vreemd van het burgerschap van Israël, of dergenen die in vreemde landen wonen; of dergenen, die David voor hun koning nog niet wilden erkennen, maar hem met Saul vervolgden. Zie Psa 54:5 . Zie de aantekening bij 2Sa 22:45 ."}],"8":[{"catchword":"hun rechterhand","tekst":"Welke zij geven tot versterking hunner belofte, alzo ook vs.11."}],"9":[{"catchword":"een nieuw lied zingen;","tekst":"Zie de aantekening bij Psa 33:2-3 ."},{"catchword":"en het tiensnarig","tekst":"Dit wordt ook hier ingevoegd, om dat luit en het tiensnarig instrument onderscheidene instrumenten zijn, gelijk te zien is Psa 92:4 ."}],"10":[{"catchword":"die den koningen","tekst":"Zie 2Sa 8:6 ."},{"catchword":"van het boze zwaard;","tekst":"Dat is, van het zwaard, hetwelk onschuldig bloed zoekt te vergieten."}],"12":[{"catchword":"welke groot","tekst":"Te weten, planten."},{"catchword":"hoekstenen,","tekst":"Dat is, schoon en fraai van lijf en leden, gelijk men de hoekstenen aan een schoon gebouw fraai behouwt, besnijdt, polijst en versiert, opdat het van buiten te schoner schijne in aller ogen."},{"catchword":"uitgehouwen","tekst":"Te weten, kostelijk en fraai."}],"13":[{"catchword":"winkelen vol","tekst":"Versta hier, die plaatsen waar men den voorraad bijeenbrengt en bewaart, hetzij schuren, kelders, pakhuizen of korenzolders, enz. In een woord: David bidt hier dat God hem en de godzaligen wil zegenen met tijdelijke goederen."},{"catchword":"enen voorraad","tekst":"Hebr. van spijs tot spijs; dat is, overvloed van spijs."},{"catchword":"bij duizenden","tekst":"Dat is, in grote menigte."},{"catchword":"hoeven vermenigvuldigen","tekst":"Of, wijken. Zie de aantekening bij Job 5:10 ."}],"14":[{"catchword":"wel geladen zijn;","tekst":"Vet en vlezig; dat is, sterk en bekwaam om lasten te dragen en groten arbeid te doen; of welgeladen, te weten met jongens, want onder den naam van ossen moet men hier ook de koeien verstaan, gelijk Deu 7:13 ."},{"catchword":"geen inbreuk,","tekst":"Te weten, der vijandenin onze landen en steden om ons goed en vee weg te drijven."},{"catchword":"uitval, noch","tekst":"Te weten, uit onze steden om den vijand het geroofde goed en vee to ontjagen. Anders: gene uitgaande, te weten, vrouw, om te klagen en te krijten."}],"15":[{"catchword":"alzo gaat;","tekst":"Versta dit van den krijgsgeschrei of alarm."},{"catchword":"welgelukzalig is","tekst":"Te weten, gelijk straks verhaald is."},{"catchword":"welgelukzalig","tekst":"Alsof hij zeide bij manier van verbetering der naastvoorgaande spreuk: Ja ik zeg, dat vooral gelukzalig is dat volk, hetwelk in het verbond en de genade Gods staat, die de fontein van alle zegeningen en gelukzaligheid is; in welke zaligheid het hoogste goed gelegen is. Verg. Psa 4:7-8 , en Psa 17:14-15 , en Psa 33:12 , en Psa 65:5 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"(A Psalm) of David. Blessed be the LORD my Rock; [See the Annot.Deut.32.on v.4. and 2 Sam.22.2.] that instructeth my hands for the combat: my fingers for the war."}],"2":[{"catchword":null,"tekst":"My kindness, [i.e. he, which is so kind unto  land, or of those that would not acknowledge David their King yet, but did persecute him with Saul. See Psa 54:22.on verse 45.]"}],"8":[{"catchword":null,"tekst":"Whose mouth speaketh lies, and their right hand is a right hand of falsehood. [He meaneth the right hand which they reach forth, and give in pledge of faithfulness; and so likewise, v.11."}],"9":[{"catchword":null,"tekst":"O God, I will sing a new song unto thee: [See the Annot. Psalm 33.on v.2.3.] with the Lute, (and) [this particle is inserted here, because the Lute and the ten-stringed instrument are several instruments, as may be seen, Psalm 92.on v.4.] the ten- stringed instrument, will I sing Psalms unto thee:"}],"10":[{"catchword":null,"tekst":"Thee that giveth victory unto Kings: [See 2 Samuel, 8.verse 6.] that relieveth (or rescueth) his servant David from the evil sword: [i.e. from that sword, which goeth about to shed innocent blood.]"}],"11":[{"catchword":null,"tekst":"Relieve me, and rescue me from the hand of the strangers, whose mouth speaketh lies: and their Right hand is a right hand of falsehood. [as above, verse 8.]"}],"12":[{"catchword":null,"tekst":"That our sons may be as plants, which [Plants namely] grew great in their youth; our daughters as corner-stones, [i.e. fair and goodly of body and feature; as men use to trim, embellish and polish the cornerstones of a building, to give the more lustre and grace unto the whole frame in every ones eye] hewen out after the resemblance of a palace. [i.e. sumptuously and stately.]"}],"13":[{"catchword":null,"tekst":"That our shops, [Understand here such places, where any provisions are brought and laid up; as Barns, Granaries, Cellars, Store-houses, Magazines, etc. In a word, David prays here that God would bless him and all the Godly, with all manner yield forth one store after the other: [Hebrew, from food to food, i.e. aboundance of Food, plenty of Provision] that our flocks may bring forth by thousands, (yea) multiply by ten thousands, [i.e. in great aboundance] in our yards; [or streets, grounds, the word being variously taken See the Annot.on Job 5:10.]"}],"14":[{"catchword":null,"tekst":"That our Oxen be well-laden: [i.e. fat and fleshy, i.e. strong and sit to draw great burthens and to do much labour: or Bullocks well-laden, viz. With young ones, or Calves; for under the name of Oxen, the Cows are here to be understood likewise, as Deuterenomy 7.13.] that there be no breaking in, [viz. Of teh Enemies in our Towns and Cities, to take away our Goods and Cattle] nor no fallings to take away our Goods and cattle] nor no falling out [or, issuing forth, out of our Cities; viz. That we shall be compelled to pursue after our Enemies, for to recover the goods and Cattle they robbed us of: others, no issuing (woman,) crying and complaining abroad] nor clamour (or out-cry) upon our streets: [understand this of rumours of War, or allarums.]"}],"15":[{"catchword":null,"tekst":"Right happy is the people, with whom it fareth thus: [viz. As is just now related] right happy is the people, whose God is the LORD: [as if he said, be way of amending, or correcting, the last preceding words, thus; Nay, I say rather, that above all, right happy is that people, which is in Coverliving Source of all Bless and Happiness: which is the thing indeed, that doth contain the Chiefest good. Compare Psa 4:7,8. And 17.14.15. and 33.12. and 65.5.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

  const noten = D.noten || {};

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

}

/* ---------- rijen (her)bouwen ---------- */

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
