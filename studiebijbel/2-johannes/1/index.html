S, Die Christus genoemd wordt. Al de geslachten dus, van Abraham tot David, zijn veertien geslachten; en van David tot de Babylonische wegvoering veertien geslachten; en van de Babylonische wegvoering tot Christus veertien geslachten. De geboorte van Jezus Christus was nu als volgt. Toen Maria, Zijn moeder, met Jozef in ondertrouw was, bleek zij, voordat zij samengekomen waren, zwanger te zijn uit de Heilige Geest.", "Joz 23:8": "Maar de HEERE, uw God, zult u aanhangen, zoals u tot op deze dag gedaan hebt.", "2 Tim 1:14": "Bewaar het goede pand, dat u toevertrouwd is, door de Heilige Geest, Die in ons woont.", "Rom 8:15": "Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader!", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Joh 8:49": "Jezus antwoordde: Ik heb de duivel niet; maar Ik eer Mijn Vader, en u onteert Mij.", "Fil 4:10": "En ik ben zeer verblijd geweest in de Heere, dat u nu eindelijk opnieuw bent opgebloeid om aan mij te denken; waaraan u ook gedacht hebt, maar u hebt de gelegenheid niet gehad.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "1 Kor 3:11": "Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus.", "Ef 2:13": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus.", "Amos 2:12": "Maar u hebt aan de nazireeërs wijn te drinken gegeven, en u hebt de profeten geboden en gezegd: U zult niet profeteren.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Jak 1:21": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken.", "2 Tess 3:13": "En u, broeders, wordt niet moe in het goede te doen.", "Rom 8:14-16": "Want zovelen als er door de Geest van God geleid worden, die zijn kinderen van God. Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader! Diezelfde Geest getuigt met onze geest, dat wij kinderen van God zijn.", "Luk 12:35-40": "Laat uw middel omgord zijn, en de lampen brandend. En wees zelf gelijk aan mensen die op hun heer wachten, wanneer hij terugkomt van de bruiloft, zodat zij, als hij komt en klopt, hem meteen kunnen opendoen. Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "Hebr 3:12": "Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "1 Tim 6:21": "waarmee sommigen, terwijl zij die beleden, van het geloof zijn afgeweken. De genade zij met u. Amen. De eerste brief aan Timotheüs werd geschreven vanuit Laodicea, de voornaamste stad in Frygië Pacatania.", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Matt 26:64": "Jezus zei tegen hem: U hebt het gezegd. Maar Ik zeg u: van nu af aan zult u de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen op de wolken van de hemel.", "1 Tim 6:2": "En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen.", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "Rom 13:11": "En dit zeg ik te meer, omdat wij de tijd waarin we leven kennen, dat het de tijd is dat wij nu uit de slaap ontwaken; want de zaligheid is ons nu dichterbij dan toen wij tot geloof kwamen.", "Spr 24:1": "Wees niet jaloers op de slechte mensen, en laat u niet drijven om bij hen te zijn.", "Hand 8:36": "En terwijl zij over de weg reisden, kwamen zij bij een zeker water; en de kamerling zei: Zie, hier is water; wat verhindert mij om gedoopt te worden?", "Luk 12:45": "Maar als die dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg voor hij komt; en zou beginnen de knechten en de dienstmeisjes te slaan, en te eten en te drinken en dronken te worden;", "Spr 23:20": "Wees niet onder de wijnzuipers, ook niet onder de vleesvreters;", "Ex 4:22": "Dan zult u tegen Farao zeggen: Zo zegt de HEERE: Mijn zoon, Mijn eerstgeborene, is Israël.", "Joh 7:42": "Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?", "Zef 3:4": "Haar profeten zijn lichtvaardig, geheel trouweloze mannen; haar priesters verontreinigen het heilige, zij doen de wet geweld aan.", "Ps 112:1-10": "Halleluja! Aleph. Gelukkig is de man, die de HEERE vreest; Beth. die grote lust heeft in Zijn geboden. Gimel. Zijn nakomelingen zullen machtig zijn op aarde; Daleth. het geslacht van de oprechten zal gezegend worden. He. In zijn huis zullen bezit en rijkdom zijn; Vau. en zijn gerechtigheid houdt stand tot in eeuwigheid.", "Ps 119:104-106": "Uit Uw bevelen krijg ik verstand, daarom haat ik alle leugenpaden. Nun. Uw woord is een lamp voor mijn voet, en een licht voor mijn pad. Ik heb gezworen, en zal het bevestigen, dat ik onderhouden zal de rechten van Uw gerechtigheid.", "Joh 15:23": "Die Mij haat, die haat ook Mijn Vader.", "Openb 3:2": "Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God.", "Hebr 13:19": "En ik vraag u des te meer dit te doen, opdat ik des te eerder aan u teruggegeven mag worden.", "Ezra 10:11": "Nu dan, doe de HEERE, de God van uw vaderen, belijdenis en doe Zijn wil, en scheid u af van de volken van het land, en van de vreemde vrouwen.", "Luk 17:25": "Maar eerst moet Hij veel lijden, en verworpen worden door dit geslacht.", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Spr 21:8": "De weg van de mens is hele verkeerd en vreemd; maar het werk van de zuivere is recht.", "Joh 3:11": "Voorwaar, voorwaar, Ik zeg u: Wij spreken wat Wij weten, en getuigen wat Wij gezien hebben; en u neemt Ons getuigenis niet aan.", "Ps 119:33": "He. HEERE! leer mij de weg van Uw inzettingen, en ik zal hem houden tot het einde toe.", "1 Tess 2:19": "Want wat is onze hoop, of blijdschap, of kroon van het roem? Bent u dat niet, voor onze Heere Jezus Christus bij Zijn komst?", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "Joh 8:42": "Jezus zei dan tegen hen: Als God uw Vader was, zou u Mij liefhebben; want Ik ben van God uitgegaan, en Ik kom van Hem. Want Ik ben ook niet uit Mijzelf gekomen, maar Hij heeft Mij gezonden.", "1 Kor 1:3": "Genade zij u en vrede van God onze Vader, en van de Heere Jezus Christus.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Jak 5:7-12": "Wees dan geduldig, broeders, tot de komst van de Heere. Zie, de boer verwacht de kostbare vrucht van het land, en is daarover geduldig, totdat het de vroege en late regen zal hebben ontvangen. Wees ook u geduldig, versterk uw harten; want de komst van de Heere is nabij. Zucht niet tegen elkaar, broeders, opdat u niet veroordeeld wordt; zie, de Rechter staat voor de deur.", "Mark 3:33-35": "En Hij antwoordde hun: Wie is Mijn moeder, of Mijn broers? En terwijl Hij rondkeek naar hen die om Hem heen zaten, zei Hij: Zie, Mijn moeder en Mijn broers. Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Tit 2:2": "Dat de oude mannen nuchter zijn, stemmig, bezonnen, gezond in het geloof, in de liefde, in de volharding.", "Matt 27:54": "En de hoofdman over honderd, en zij die met hem Jezus bewaakten, zagen de aardbeving en de dingen die gebeurd waren, en werden zeer bevreesd, en zeiden: Waarlijk, Deze was Gods Zoon!", "1 Joh 2:23": "Ieder, die de Zoon loochent, heeft ook de Vader niet; wie de Zoon belijdt, heeft ook de Vader.", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "3 Joh 1:3": "Want ik ben zeer verblijd geweest, toen de broeders kwamen en getuigden van uw waarheid, zoals u in de waarheid wandelt.", "Ps 119:22": "Wentel van mij smaad en verachting, want ik heb Uw getuigenissen onderhouden.", "Jes 49:5": "En nu zegt de HEERE, Die Mij van moeders buik af tot een Knecht gevormd heeft, dat Ik Jakob tot Hem terugbrengen zou; maar Israël zal zich niet laten verzamelen; toch zal Ik verheerlijkt worden in de ogen van de HEERE, en Mijn God zal Mijn Sterkte zijn.", "Gal 6:16": "En zovelen als er naar deze regel zullen wandelen, over hen zij vrede en barmhartigheid, en over het Israël van God.", "Num 9:13": "Als een man, die rein is, en niet op reis is, en nalaat het pascha te houden, dan zal die ziel uit haar volk uitgeroeid worden; want hij heeft de offerande van de HEERE op zijn vastgestelde tijd niet geofferd, die man zal zijn zonde dragen.", "Hebr 3:6": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden.", "Hand 10:47": "Kan iemand soms het water weren, zodat dezen niet gedoopt zouden worden, die de Heilige Geest ontvangen hebben, evenals ook wij?", "Luk 10:16": "Wie naar u luistert, luistert naar Mij; en wie u verwerpt, verwerpt Mij; en wie Mij verwerpt, verwerpt Hem die Mij gezonden heeft.", "1 Kor 5:4-7": "In de Naam van onze Heere Jezus Christus, wanneer u en mijn geest samen vergaderd zijn, met de kracht van onze Heere Jezus Christus, Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus. Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Jes 32:16-18": "En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid. En mijn volk zal in een woonplaats van vrede wonen, en in welverzekerde woningen, en in stille geruste plaatsen.", "Joh 17:13": "Maar nu kom Ik tot U, en spreek dit in de wereld, opdat zij Mijn blijdschap vervuld in zichzelf mogen hebben.", "Joh 12:34": "De menigte antwoordde Hem: Wij hebben uit de wet gehoord dat de Christus blijft tot in eeuwigheid; en hoe zegt U dat de Zoon des mensen verhoogd moet worden? Wie is deze Zoon des mensen?", "Spr 22:24": "Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;", "1 Joh 5:4": "Want al wat uit God geboren is, overwint de wereld; en dit is de overwinning die de wereld overwint, namelijk ons geloof.", "Ps 119:4-6": "Heere! U hebt geboden, dat men Uw bevelen zeer bewaren zal. Och, dat mijn wegen gericht werden, om Uw inzettingen te bewaren! Dan zou ik niet beschaamd worden, wanneer ik letten zou op al Uw geboden.", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "2 Petr 2:1-22": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "2 Tim 3:5": "met een schijn van godzaligheid, maar de kracht daarvan verloochenend. Heb ook een afkeer van hen.", "Spr 29:24": "Wie met een dief deelt, haat zijn eigen leven; hij hoort een vervloeking, en geeft het niet te kennen.", "1 Kor 6:13-20": "De spijzen zijn voor de buik, en de buik is voor de spijzen; maar God zal beide dit en dat tenietdoen. Maar het lichaam is niet voor de hoererij, maar voor de Heere, en de Heere voor het lichaam. En God heeft ook de Heere opgewekt, en zal ons opwekken door Zijn kracht. Weet u niet, dat uw lichamen leden van Christus zijn? Zal ik dan de leden van Christus wegnemen, en ze maken tot leden van een hoer? Dat zij verre.", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Ezech 22:25": "De samenzwering van haar profeten heerst in haar midden als een brullende leeuw die een prooi rooft; zij eten de zielen op, de schat en het kostbare nemen zij weg; haar weduwen vermenigvuldigen zij in haar midden.", "Ex 12:15": "Zeven dagen moet u ongezuurde broden eten; maar op de eerste dag moet u het zuurdeeg wegdoen uit uw huizen; want wie het gedesemde eet, van de eerste dag af tot de zevende dag, die ziel zal uitgeroeid worden uit Israël.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Matt 16:6": "En Jezus zei tegen hen: Kijk uit, en wacht u voor de zuurdesem van de Farizeeën en Sadduceeën.", "Spr 17:17": "Een vriend heeft te allen tijde lief; en een broeder wordt geboren voor de tijd van benauwdheid.", "1 Tim 1:6": "Van wie sommigen afgeweken zijn en zich gewend hebben tot ijdel gepraat;", "Joh 16:3": "En deze dingen zullen zij u doen, omdat zij de Vader niet gekend hebben, en Mij ook niet.", "Ezech 33:15": "Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven.", "Ps 119:167": "Mijn ziel onderhoudt Uw getuigenissen, en ik heb ze zeer lief.", "Rom 14:17": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "Jes 55:13": "Voor een doorn zal een dennenboom opgaan, voor een distel zal een mirteboom opgaan; en het zal de HEERE wezen tot een naam, tot een eeuwig teken, dat niet uitgeroeid zal worden.", "Jak 3:11-18": "Welt er ook uit een fontein, uit een en dezelfde ader, het zoete en het bittere? Kan ook, mijn broeders, een vijgenboom olijven voortbrengen, of een wijnstok vijgen? Zo kan ook geen fontein zout en zoet water voortbrengen. Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.", "Hebr 13:13": "Laten wij dan naar Hem uitgaan, buiten de legerplaats, terwijl wij Zijn smaad dragen.", "Matt 23:3": "daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet.", "Ps 119:100-102": "Ik ben voorzichtiger dan de ouden, omdat ik Uw bevelen bewaard heb. Ik heb mijn voeten geweerd van alle kwade paden, opdat ik Uw woord zou onderhouden. Ik ben niet geweken van Uw rechten, want U hebt mij geleerd.", "1 Tim 4:1-3": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen, door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid; die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen.", "Mark 13:13": "En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "Matt 26:26-28": "En toen zij aten, nam Jezus het brood, en na de zegen brak Hij het, en gaf het aan de discipelen en zei: Neemt, eet, dat is Mijn lichaam. En Hij nam de drinkbeker, en na de dankzegging gaf Hij die aan hen en zei: Drinkt allen daaruit; want dat is Mijn bloed, het bloed van het Nieuwe Testament, dat voor velen vergoten wordt, tot vergeving van de zonden.", "Hebr 7:3": "zonder vader, zonder moeder, zonder geslachtsregister, zonder begin van dagen of einde van leven, maar gelijk geworden aan de Zoon van God, blijft hij een priester voor eeuwig.", "1 Tess 5:5": "U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.", "Ezra 10:1-44": "Terwijl Ezra zo bad en deze belijdenis deed, huilend en zich voor het huis van God neerwerpend, verzamelde zich bij hem uit Israël een zeer grote gemeente van mannen, vrouwen en kinderen; want het volk huilde met groot geween. Toen antwoordde Sechanja, de zoon van Jehiel, een van de zonen van Elam, en zei tegen Ezra: Wij hebben overtreden tegen onze God, en wij hebben vreemde vrouwen van de volken van het land bij ons laten wonen; maar nu is er hoop voor Israël wat dit betreft. Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet.", "Joh 10:8": "Allen die vóór Mij zijn gekomen, zijn dieven en rovers; maar de schapen hebben hen niet gehoord.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Jak 4:7-11": "Onderwerp u dan aan God; weerstaat de duivel, en hij zal van u wegvluchten. Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen! Gedraag u als ellendigen, en treur en ween; laat uw lachen veranderen in treuren, en uw blijdschap in verdriet.", "Rom 9:5": "van wie de vaders zijn, en uit wie Christus is, wat het vlees aangaat, Hij Die God is, boven allen te prijzen tot in eeuwigheid. Amen.", "Hand 11:24": "Want hij was een goed man, en vol van de Heilige Geest en van het geloof; en er werd een grote menigte aan de Heere toegevoegd.", "Spr 2:11": "Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden;", "Joz 22:31": "En Pinehas, de zoon van de priester Eleazar, zei tegen de kinderen van Ruben, en tegen de kinderen van Gad, en tegen de kinderen van Manasse: Vandaag weten wij, dat de HEERE in het midden van ons is, omdat u deze overtreding tegen de HEERE niet begaan hebt; nu hebt u de kinderen van Israël verlost uit de hand van de HEERE.", "Matt 5:30": "En als uw rechterhand u ergert, hak hem af en werp hem van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.", "2 Tim 3:6": "Want tot hen behoren zij die de huizen binnensluipen en de vrouwtjes gevangen nemen die met zonden beladen zijn en door allerlei begeerten gedreven worden,", "Gal 1:9": "Zoals wij al eerder gezegd hebben, zeg ik het nu ook weer: als iemand u een evangelie verkondigt naast wat u ontvangen hebt, laat hij vervloekt zijn.", "Joh 13:35": "Hieraan zullen allen weten dat u Mijn discipelen bent, als u liefde hebt onder elkaar.", "Spr 13:20": "Die met de wijzen omgaat, zal wijs worden; maar die de metgezel van de dwazen is, zal verbroken worden.", "1 Tim 4:8": "Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.", "Luk 1:35": "En de engel antwoordde en zei tegen haar: De Heilige Geest zal over u komen, en de kracht van de Allerhoogste zal u overschaduwen; daarom zal ook dat Heilige Dat uit u geboren zal worden, Gods Zoon genoemd worden.", "Spr 21:29": "Een goddeloze man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast.", "Luk 1:26-35": "En in de zesde maand werd de engel Gabriël door God gezonden naar een stad in Galilea, genaamd Nazareth, naar een maagd die ondertrouwd was met een man wiens naam Jozef was, uit het huis van David; en de naam van de maagd was Maria. En de engel kwam bij haar binnen, en zei: Wees gegroet, begenadigde; de Heere is met u; u bent gezegend onder de vrouwen.", "Jes 1:2": "Hoor, hemelen! en neem het ter oor, aarde! Want de HEERE spreekt: Ik heb kinderen groot gemaakt en verhoogd, maar zij hebben tegen Mij overtreden.", "Ef 1:5": "Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil.", "Jes 5:20": "Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!", "Rom 1:7": "Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "Joh 17:5": "En nu, verheerlijk Mij, U, Vader, bij Uzelf, met de heerlijkheid die Ik bij U had, voordat de wereld was.", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "2 Tim 1:4": "Zeer begerig om u te zien, als ik denk aan uw tranen, opdat ik met blijdschap vervuld mag worden;", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Jer 2:25": "Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar u zegt: Het is buiten hoop; nee, want ik heb de vreemden lief, en die zal ik nawandelen!", "2 Kor 4:1": "Omdat wij deze bediening hebben, naar de barmhartigheid die ons is bewezen, zo worden wij niet moedeloos;", "Gen 35:2": "Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren;", "Ps 103:18": "Over hen die Zijn verbond houden, en die aan Zijn bevelen denken, om die te doen.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Jes 33:15-17": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet; Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis. Uw ogen zullen de Koning zien in Zijn schoonheid; zij zullen een ver gelegen land zien.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "1 Kor 3:16": "Weet u niet, dat u de tempel van God bent, en dat de Geest van God in u woont?", "Joh 8:31": "Jezus zei dan tegen de Joden die in Hem geloofden: Als u in Mijn woord blijft, bent u werkelijk Mijn discipelen;", "Gal 5:7": "U liep goed; wie heeft u verhinderd de waarheid niet gehoorzaam te zijn?", "Zach 10:3": "Tegen de herders was Mijn toorn ontstoken, en over de bokken heb Ik bezoeking gedaan; maar de HEERE van de heerscharen³ zal Zijn kudde bezoeken, het huis van Juda, en Hij zal hen stellen als het paard van Zijn majesteit in de strijd.", "Joh 8:32": "En u zult de waarheid kennen, en de waarheid zal u vrijmaken.", "2 Kor 6:15": "En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige?", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Matt 2:5": "Zij zeiden tegen hem: In Bethlehem, in Judea; want zo is geschreven door de profeet:", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "1 Petr 5:14": "Groet elkaar met een kus van liefde. Vrede zij u allen die in Christus Jezus bent. Amen.", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "Joh 11:46-48": "Maar sommigen van hen gingen naar de Farizeeën, en vertelden hun wat Jezus gedaan had. De overpriesters dan en de Farizeeën riepen de raad bijeen, en zeiden: Wat zullen wij doen? want deze Mens doet veel tekenen. Als wij Hem zo laten begaan, zullen zij allen in Hem geloven, en de Romeinen zullen komen en zowel onze plaats als ons volk wegnemen.", "Ps 133:1-3": "Een lied Hammaäloth, van David. Zie, hoe goed en hoe fijn is het, dat broeders ook samenwonen! Het is als de kostelijke olie op het hoofd, die neerdaalt op de baard, de baard van Aäron, die neerdaalt tot op de zoom van zijn kleren. Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "Spr 23:6": "Eet niet het brood van hem die boos is van oog, en wees niet belust op zijn smakelijke gerechten;", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Mark 4:24": "En Hij zei tegen hen: Let op wat u hoort. Met de maat waarmee u meet, zal u gemeten worden, en aan u die hoort, zal meer gegeven worden.", "Hebr 5:12": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Jes 49:4": "Doch Ik zei: Ik heb tevergeefs gearbeid, Ik heb Mijn kracht nutteloos en tevergeefs besteed; zeker, Mijn recht is bij de HEERE, en Mijn loon is bij Mijn God.", "1 Tim 5:10": "Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd.", "1 Kor 11:28": "Maar laat de mens zichzelf beproeven, en laat hij zo van het brood eten, en van de drinkbeker drinken.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Jes 49:1": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Jes 53:1-4": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard? Want Hij is als een jonge loot voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben. Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.", "Mark 12:30-33": "En u zult de Heere, uw God, liefhebben uit heel uw hart, en uit heel uw ziel, en uit heel uw verstand, en uit heel uw kracht. Dit is het eerste gebod. En het tweede, hieraan gelijk, is dit: U zult uw naaste liefhebben als uzelf. Er is geen ander gebod groter dan deze. En de schriftgeleerde zei tegen Hem: Meester, U hebt naar waarheid goed gezegd dat er een enig God is, en er is geen ander dan Hij;", "Gal 4:4-7": "Maar toen de volheid van de tijd gekomen was, heeft God Zijn Zoon uitgezonden, geboren uit een vrouw, geboren onder de wet; opdat Hij hen die onder de wet waren, verlossen zou, en opdat wij de aanneming tot kinderen verkrijgen zouden. En omdat u kinderen bent, heeft God de Geest van Zijn Zoon uitgezonden in uw harten, Die roept: Abba, Vader!", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Matt 16:15-17": "Hij zei tegen hen: Maar u, wie zegt u dat Ik ben? En Simon Petrus antwoordde en zei: U bent de Christus, de Zoon van de levende God. En Jezus antwoordde en zei tegen hem: Zalig bent u, Simon, Bar-Jona! Want vlees en bloed heeft u dat niet geopenbaard, maar Mijn Vader, Die in de hemelen is.", "Joh 6:38": "Want Ik ben uit de hemel neergedaald, niet om Mijn eigen wil te doen, maar de wil van Hem die Mij gezonden heeft.", "Spr 14:34": "Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.", "Hand 18:7": "En hij ging vandaar weg en kwam in het huis van een man, met de naam Justus, die God diende, wiens huis grensde aan de synagoge.", "1 Kor 8:12": "Maar u, die zo tegen de broeders zondigt en hun zwakke geweten kwetst, zondigt tegen Christus.", "Matt 12:48-50": "Maar Hij antwoordde en zei tegen hem die Hem dat zei: Wie is Mijn moeder, en wie zijn Mijn broeders? En Hij strekte Zijn hand uit over Zijn discipelen, en zei: Kijk, Mijn moeder en Mijn broeders. Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "1 Kor 11:18": "Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;", "Matt 13:56": "En Zijn zusters, zijn die niet allemaal bij ons? Waar komt dan bij Deze dit alles vandaan?", "Gen 17:14": "En wat mannelijk is en de voorhuid heeft, wiens vlees van de voorhuid niet besneden wordt, die persoon zal uit zijn volk uitgeroeid worden; hij heeft Mijn verbond gebroken.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "1 Joh 4:12": "Niemand heeft ooit God gezien; als wij elkaar liefhebben, blijft God in ons, en Zijn liefde is in ons volmaakt.", "Luk 3:10-14": "En de menigten vroegen hem: Wat zullen wij dan doen? En hij antwoordde en zei tegen hen: Wie twee stukken kleding heeft, moet delen met wie er geen heeft; en wie voedsel heeft, moet hetzelfde doen. En er kwamen ook tollenaars om gedoopt te worden, en zeiden tegen hem: Meester, wat zullen wij doen?", "1 Tim 1:3": "Zoals ik u vermaand heb dat u in Efeze zou blijven, toen ik naar Macedonië reisde, zo vermaan ik het u nog, opdat u sommigen zou bevelen geen andere leer te leren;", "2 Tim 1:7": "Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid.", "Jer 23:1": "Wee de herders, die de schapen van Mijn weide ombrengen en verstrooien! spreekt de HEERE.", "Joh 6:67": "Jezus zei dan tegen de twaalf: Wilt u ook niet weggaan?", "Matt 26:63": "Maar Jezus zweeg stil. En de hogepriester antwoordde en zei tegen Hem: Ik bezweer U bij de levende God dat U ons zegt of U de Christus bent, de Zoon van God.", "Joh 16:28": "Ik ben van de Vader uitgegaan, en ben in de wereld gekomen; opnieuw verlaat Ik de wereld, en ga heen tot de Vader.", "Hebr 13:1": "Laat de broederlijke liefde blijven.", "Joh 20:17": "Jezus zei tegen haar: Raak Mij niet aan, want Ik ben nog niet opgevaren naar Mijn Vader; maar ga naar Mijn broeders, en zeg hun: Ik vaar op naar Mijn Vader en uw Vader, en naar Mijn God en uw God.", "Openb 2:3": "En u hebt verdragen, en hebt geduld; en u hebt om Mijn Naam gearbeid, en bent niet moe geworden.", "Ef 4:13-16": "Totdat wij allen komen tot de eenheid van het geloof en van de kennis van de Zoon van God, tot een volwassen man, tot de maat van de grootte van de volheid van Christus; Opdat wij niet meer kinderen zouden zijn, die heen en weer bewogen en meegevoerd worden met elke wind van leer, door het bedrog van de mensen, door arglistigheid, om listig tot dwaling te brengen; Maar dat wij, terwijl wij de waarheid betrachten in liefde, in alle dingen zouden opgroeien in Hem, Die het Hoofd is, namelijk Christus;", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Hebr 10:39": "Maar wij zijn niet van hen die zich terugtrekken tot verderf, maar van hen die geloven tot behoud van de ziel.", "Num 12:8": "Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "Joz 7:12": "Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt.", "Rom 13:12-14": "De nacht is voorbijgegaan, en de dag is nabij gekomen. Laten wij dan de werken van de duisternis afleggen, en de wapens van het licht aandoen. Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie; Maar doe de Heere Jezus Christus aan, en verzorg het vlees niet met het oog op begeerten.", "1 Joh 4:10": "Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Mal 2:9": "Daarom heb Ik u ook verachtelijk en onwaard gemaakt voor heel het volk, omdat u Mijn wegen niet houdt, maar partijdig bent in de wet.", "Rom 15:24": "zal ik, wanneer ik naar Spanje reis, tot u komen; want ik hoop u te zien terwijl ik onderweg ben, en door u daarheen op weg geholpen te worden, als ik eerst voor een deel verzadigd zal zijn van uw gezelschap.", "Gen 49:6": "Mijn ziel, kom niet in hun verborgen raad; mijn eer, wordt niet verenigd met hun vergadering! Want in hun toorn hebben zij de mannen doodgeslagen, en in hun moedwil hebben zij de ossen verlamd.", "Hand 28:27": "Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "1 Kor 5:9-11": "Ik heb u in de brief geschreven dat u zich niet moet inlaten met de hoereerders; Maar niet geheel met de hoereerders van deze wereld, of met de gierigaards, of met de rovers, of met de afgodendienaars; want dan zou u wel uit de wereld moeten gaan. Maar nu heb ik u geschreven dat u zich niet moet inlaten namelijk met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten.", "Matt 26:29": "En Ik zeg u dat Ik van nu af aan niet zal drinken van de vrucht van de wijnstok tot op die dag, wanneer Ik die met u nieuw zal drinken in het Koninkrijk van Mijn Vader.", "2 Petr 1:7": "En naast de godsvrucht broederlijke liefde, en naast de broederlijke liefde, liefde jegens allen.", "Ps 119:8": "Ik zal Uw inzettingen bewaren; verlaat mij niet al te zeer.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Hos 7:8": "Efraïm, die vermengt zich met de volken; Efraïm is een koek die niet is omgekeerd;", "Joh 1:1": "In het begin was het Woord, en het Woord was bij God, en het Woord was God.", "Ps 119:129": "Pe. Uw getuigenissen zijn wonderbaar, daarom bewaart ze mijn ziel.", "Joh 17:23": "Ik in hen, en U in Mij; opdat zij volmaakt zijn tot één, en opdat de wereld erkent dat U Mij gezonden hebt, en hen liefgehad hebt, zoals U Mij liefgehad hebt.", "Joh 4:36": "En wie maait, ontvangt loon, en verzamelt vrucht voor het eeuwige leven; opdat zij zich samen verblijden, zowel wie zaait als wie maait.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Joh 8:53": "Bent U meer dan onze vader Abraham, die gestorven is? En de profeten zijn gestorven; wie maakt U Uzelf?", "Hand 19:19": "Velen ook van hen die toverkunsten hadden beoefend, brachten de boeken bijeen en verbrandden ze voor het oog van allen; en zij berekenden de waarde daarvan, en kwamen tot vijftigduizend zilveren penningen.", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "2 Petr 3:16": "Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Luk 6:46-48": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg? Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt. Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "2 Petr 2:21": "Want het zou beter voor hen geweest zijn de weg van de gerechtigheid niet gekend te hebben, dan die gekend te hebben en zich weer af te keren van het heilige gebod dat hun overgeleverd was.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Matt 10:41": "Wie een profeet ontvangt in de naam van een profeet, zal het loon van een profeet ontvangen; en wie een rechtvaardige ontvangt in de naam van een rechtvaardige, zal het loon van een rechtvaardige ontvangen.", "Rom 16:20": "En de God van de vrede zal de satan spoedig onder uw voeten verpletteren. De genade van onze Heere Jezus Christus zij met u. Amen.", "2 Petr 2:1-3": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "1 Kor 16:22": "Als iemand de Heere Jezus Christus niet liefheeft, laat die een vervloeking zijn; Maran-atha!", "Spr 5:8": "Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "1 Joh 4:14": "En wij hebben het gezien, en getuigen dat de Vader Zijn Zoon gezonden heeft tot een Zaligmaker van de wereld.", "1 Tim 4:12": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid.", "Hebr 11:14": "Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Klaagl 2:14": "Nun. Uw profeten hebben u ijdelheid en ongerijmdheid gezien, en zij hebben u uw ongerechtigheid niet geopenbaard, om uw gevangenschap af te wenden, maar zij hebben voor u gezien ijdele lasten en uitstotingen.", "Hand 11:30": "En dat deden zij ook, en zonden het naar de oudsten, door de hand van Barnabas en Saulus.", "Gal 1:6-8": "Ik verwonder mij dat u zo snel, wijkend van hem die u in de genade van Christus geroepen heeft, overgebracht wordt naar een ander evangelie; terwijl er geen ander is; maar er zijn sommigen die u in verwarring brengen, en het Evangelie van Christus willen verdraaien. Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Matt 20:20-27": "Toen kwam de moeder van de zonen van Zebedeüs met haar zonen naar Hem toe, boog zich voor Hem neer, en vroeg Hem iets. En Hij zei tegen haar: Wat wilt u? Zij zei tegen Hem: Zeg dat deze twee zonen van mij mogen zitten, de een aan Uw rechterhand en de ander aan Uw linkerhand in Uw Koninkrijk. Maar Jezus antwoordde en zei: U weet niet wat u vraagt; kunt u de drinkbeker drinken die Ik drinken zal, en met de doop gedoopt worden waarmee Ik gedoopt word? Zij zeiden tegen Hem: Wij kunnen dat.", "1 Joh 5:1": "Ieder die gelooft dat Jezus de Christus is, is uit God geboren; en ieder die Hem liefheeft Die geboren heeft, heeft ook lief hem die uit Hem geboren is.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Ps 69:14": "Maar mij aangaande, mijn gebed is tot U, o HEERE; er is een tijd van het welbehagen, o God! Door de grootheid van Uw goedertierenheid; verhoor mij door de trouw van Uw heil.", "Ef 2:21": "op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere;", "2 Kor 13:7": "En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "Ezech 44:8": "En u hebt de wacht van Mijn heilige dingen niet in acht genomen; maar u hebt uzelf enigen tot wachters van Mijn wacht gesteld in Mijn heiligdom.", "1 Tim 1:7": "Zij willen leraars van de wet zijn, maar begrijpen niet wat zij zeggen, en ook niet waarover zij zo stellig spreken.", "Matt 25:13": "Waak dan; want u weet de dag niet, en ook het uur niet, waarop de Zoon des mensen komen zal.", "1 Tess 5:6": "Laten wij dan niet slapen, zoals de anderen, maar laten wij waken en nuchter zijn.", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Tit 3:14": "En laat ook de onzen leren goede werken voor te staan, voor de dingen die nodig zijn, opdat zij niet onvruchtbaar zijn.", "Kol 4:18": "De groet met mijn eigen hand, van Paulus. Denk aan mijn boeien. De genade zij met u. Amen. Geschreven vanuit Rome aan de Kolossenzen door bemiddeling van Tychikus en Onesimus.", "Ef 1:2": "Genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Matt 16:17": "En Jezus antwoordde en zei tegen hem: Zalig bent u, Simon, Bar-Jona! Want vlees en bloed heeft u dat niet geopenbaard, maar Mijn Vader, Die in de hemelen is.", "1 Kor 1:27": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen;", "Ps 119:59": "Ik heb mijn wegen bedacht, en heb mijn voeten gekeerd tot Uw getuigenissen.", "Gal 1:8": "Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "1 Joh 4:11": "Geliefden, als God ons zo lief heeft gehad, dan zijn ook wij verplicht elkaar lief te hebben.", "Deut 14:1": "U bent kinderen van de HEERE, uw God. U zult uzelf niet snijden, en geen kaalheid maken tussen uw ogen, over een dode.", "Joh 3:19": "En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht.", "Hebr 3:13": "Maar vermaan elkaar elke dag, zolang het heden genoemd wordt, opdat niemand van u verhard wordt door de misleiding van de zonde.", "Jes 55:12": "Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "1 Kon 2:3": "En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;", "Spr 23:26": "Mijn zoon! geef mij uw hart, en laat uw ogen mijn wegen behartigen.", "2 Kor 11:3": "Doch ik vrees dat, zoals de slang Eva door haar arglistigheid bedrogen heeft, zo ook uw gedachten op enigerlei wijze bedorven worden, om af te wijken van de eenvoudigheid die in Christus is.", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "1 Tess 3:11": "Moge nu onze God en Vader Zelf, en onze Heere Jezus Christus, onze weg naar u richten.", "Mark 15:39": "En de hoofdman over honderd, die daarbij tegenover Hem stond, zag dat Hij zo roepend de geest gegeven had, en zei: Werkelijk, deze Mens was Gods Zoon!", "Ps 84:8": "Zij gaan van kracht tot kracht; ieder van hen zal verschijnen voor God in Sion.", "Deut 18:13": "Oprecht zult u zijn met de HEERE, uw God.", "Ps 119:2": "Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;", "Hand 14:22": "en versterkten de harten van de discipelen, en vermaanden hen om te blijven in het geloof, en dat wij door veel verdrukkingen het Koninkrijk van God moeten binnengaan.", "Hand 2:42": "En zij bleven volharden in de leer van de apostelen, en in de gemeenschap, en in het breken van het brood, en in de gebeden.", "Luk 11:42": "Maar wee u, Farizeeën, want u geeft tienden van munt en wijnruit en van alle moeskruid, en u gaat voorbij aan het recht en de liefde van God. Dit moest men doen, en het andere niet nalaten.", "Lev 20:18": "En als een man gemeenschap heeft met een vrouw die ongesteld is, en haar schaamte ontdekt, haar bron blootlegt, en zij zelf de bron van haar bloed ontdekt heeft, zullen zij beiden uit het midden van hun volk uitgeroeid worden.", "1 Kor 3:8": "En hij die plant en hij die nat maakt, zijn één; maar ieder zal zijn loon ontvangen naar zijn arbeid.", "Mark 10:33": "En Hij zei: Zie, wij gaan op naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters, en aan de Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen, en Hem aan de heidenen overleveren;", "Zach 11:17": "Wee de nietige herder, die de kudde verlaat! Het zwaard zal over zijn arm zijn, en over zijn rechteroog; zijn arm zal helemaal verdorren, en zijn rechteroog zal helemaal donker worden.", "Jer 23:2": "Daarom zegt de HEERE, de God van Israël, zo van de herders, die Mijn volk weiden: U hebt Mijn schapen verstrooid, en hebt ze verdreven, en hebt niet naar hen omgezien; zie, Ik zal over u de boosheid van uw handelingen bezoeken, spreekt de HEERE.", "Rom 6:19-22": "Ik spreek op menselijke wijze, vanwege de zwakheid van uw vlees; want zoals u uw leden gesteld hebt om dienstbaar te zijn aan de onreinheid en de ongerechtigheid, tot ongerechtigheid, zo stel nu uw leden om dienstbaar te zijn aan de gerechtigheid, tot heiliging. Want toen u dienstknechten was van de zonde, was u vrij van de gerechtigheid. Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Hab 2:1": "Ik stond op mijn wachtpost, en ik ging op de vestingmuur staan, en ik hield wacht om te zien wat Hij tot mij spreken zou, en wat ik antwoorden zou op mijn bestraffing.", "1 Tim 1:2": "Aan Timotheüs, mijn oprechte zoon in het geloof; genade, barmhartigheid, vrede zij u van God, onze Vader, en Christus Jezus, onze Heere.", "Spr 25:26": "De rechtvaardige, wankelend voor het aangezicht van de goddeloze, is een beroerde bron, en een verdorven springader.", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "Matt 24:24": "Want er zullen valse christussen en valse profeten opstaan, en zij zullen grote tekenen en wonderen doen, zodat zij, als het mogelijk was, ook de uitverkorenen zouden misleiden.", "Hebr 5:8": "Hoewel Hij de Zoon was, heeft Hij toch gehoorzaamheid geleerd uit wat Hij geleden heeft.", "Ezech 22:28": "Haar profeten nu pleisteren hen met loze kalk; zij zien ijdelheid en voorzeggen hun leugen, en zeggen: Zo zegt de Heere HEERE! terwijl de HEERE niet gesproken heeft.", "Joz 23:6-13": "Zo weest zeer sterk, om te bewaren en om te doen alles, wat geschreven is in het wetboek van Mozes; opdat u daarvan niet afwijkt naar rechts noch naar links; Dat u niet ingaat tot deze volken: deze, die overgebleven zijn bij u; gedenkt ook niet aan de naam van hun goden, en laat er niet bij zweren, en dient hen niet, en buigt u voor hen niet; Maar de HEERE, uw God, zult u aanhangen, zoals u tot op deze dag gedaan hebt.", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Num 33:55": "Maar als u de inwoners van het land niet voor uw aangezicht uit hun bezit verdrijft, dan zal het gebeuren dat wie u van hen laat overblijven, tot doornen zullen zijn in uw ogen, en tot prikkels in uw zijden, en u zullen benauwen in het land waarin u woont.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Matt 5:45": "opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen.", "Ef 6:24": "De genade zij met allen die onze Heere Jezus Christus liefhebben in onvergankelijkheid. Amen. Vanuit Rome aan de Efeziërs geschreven, door bemiddeling van Tychikus.", "Joh 6:57": "Zoals de levende Vader Mij gezonden heeft, en Ik leef door de Vader; zo zal ook wie Mij eet, leven door Mij.", "Joh 8:13": "De Farizeeën zeiden dan tegen Hem: U getuigt van Uzelf; Uw getuigenis is niet waar.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Spr 14:14": "Wie afvallig van hart is, zal verzadigd worden van zijn eigen wegen; maar een goed man van zichzelf.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Openb 22:16": "Ik, Jezus, heb Mijn engel gezonden om u deze dingen te getuigen in de Gemeenten. Ik ben de Wortel en het geslacht van David, de blinkende Morgenster.", "Joh 5:27": "en Hij heeft Hem macht gegeven om ook gericht te houden, omdat Hij de Zoon des mensen is.", "Joh 15:8": "Hierin is Mijn Vader verheerlijkt, dat u veel vrucht draagt; en u zult Mijn discipelen zijn.", "Joh 1:48": "Jezus zag Nathanaël naar Zich toe komen, en zei van hem: Zie, waarlijk een Israëliet, in wie geen bedrog is.", "1 Joh 2:22-24": "Wie is de leugenaar, dan wie loochent, dat Jezus de Christus is? Deze is de antichrist, die de Vader en de Zoon loochent. Ieder, die de Zoon loochent, heeft ook de Vader niet; wie de Zoon belijdt, heeft ook de Vader. Wat u dan vanaf het begin gehoord hebt, laat dat in u blijven. Als in u blijft, wat u vanaf het begin gehoord hebt, dan zult u ook in de Zoon en in de Vader blijven.", "Fil 2:16": "Doordat u vasthoudt aan het woord van het leven, mij tot een roem tegen de dag van Christus, dat ik niet tevergeefs gelopen heb, en ook niet tevergeefs gearbeid heb.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "1 Joh 2:26": "Dit heb ik u geschreven over hen, die u verleiden.", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Hebr 2:14-18": "Omdat nu de kinderen deel hebben aan vlees en bloed, heeft Hij Zelf op dezelfde manier daaraan deelgenomen, opdat Hij door de dood hem teniet zou doen die de macht over de dood had, dat is: de duivel; en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren. Want inderdaad, Hij neemt niet de engelen aan, maar Hij neemt het nageslacht van Abraham aan.", "Gal 5:22": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.", "Jes 43:27": "Uw eerste vader heeft gezondigd, en uw uitleggers hebben tegen Mij overtreden.", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "Joh 10:18": "Niemand neemt het van Mij, maar Ik leg het zelf af; Ik heb macht om het af te leggen, en Ik heb macht om het opnieuw te nemen. Dit gebod heb Ik van Mijn Vader ontvangen.", "Matt 24:48-51": "Maar als die slechte dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg, en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards, dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "1 Tess 5:22": "Onthoud u van elke schijn van het kwaad.", "Joh 10:32": "Jezus antwoordde hun: Ik heb u veel goede werken getoond van Mijn Vader; om welk van die werken stenigt u Mij?", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Joh 15:1-8": "Ik ben de ware Wijnstok, en Mijn Vader is de Landman. Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt. U bent nu rein om het woord dat Ik tot u gesproken heb.", "2 Petr 1:9": "Want bij wie deze dingen niet aanwezig zijn, die is blind, kan niet ver zien, en is vergeten dat hij gereinigd is van zijn vroegere zonden.", "Gal 4:9": "en nu u God kent, ja, veelmeer door God gekend bent, hoe keert u zich weer tot de zwakke en arme beginselen, die u weer van voren af aan wilt dienen?", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "2 Kor 4:5": "Want wij prediken niet onszelf, maar Christus Jezus, de Heere; en onszelf als uw dienaars, om Jezus' wil.", "Spr 1:14": "U zult uw lot midden onder ons werpen; wij zullen allen één buidel hebben.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "1 Tim 6:12": "Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.", "Ps 37:31": "De wet van zijn God is in zijn hart; zijn gangen zullen niet uitglijden.", "1 Kor 10:16": "De drinkbeker der dankzegging, die wij zegenen met dankzegging, is die niet een gemeenschap met het bloed van Christus? Het brood dat wij breken, is dat niet een gemeenschap met het lichaam van Christus?", "1 Kor 2:12": "Maar wij hebben niet de geest van de wereld ontvangen, maar de Geest Die uit God is, opdat wij zouden weten de dingen die ons door God geschonken zijn;", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "3 Joh 1:13": "Ik had veel te schrijven, maar ik wil u niet schrijven met inkt en pen;", "2 Kron 19:7": "Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Tit 1:4": "aan Titus, mijn oprechte zoon, naar het gemeenschappelijke geloof: genade, barmhartigheid, vrede zij u van God de Vader, en de Heere Jezus Christus, onze Zaligmaker.", "Joh 19:7": "De Joden antwoordden hem: Wij hebben een wet, en naar onze wet moet Hij sterven, want Hij heeft Zichzelf Gods Zoon gemaakt.", "Joh 8:45-47": "Maar Mij, omdat Ik u de waarheid zeg, gelooft u niet. Wie van u overtuigt Mij van zonde? En als Ik de waarheid zeg, waarom gelooft u Mij dan niet? Wie uit God is, hoort de woorden van God; daarom hoort u niet, omdat u niet uit God bent.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "2 Kor 7:11": "Want zie, ditzelfde, dat u naar God bedroefd bent geworden, hoe grote naarstigheid heeft dat in u gewerkt? Ja, verantwoording, ja, onlust, ja, vrees, ja, verlangen, ja, ijver, ja, wraak; in alles hebt u uzelf bewezen rein te zijn in deze zaak.", "Hand 16:4": "En terwijl zij de steden doorreisden, gaven zij hun de verordeningen door die door de apostelen en de oudsten in Jeruzalem waren vastgesteld, om die te onderhouden.", "Matt 5:6": "Zalig zijn zij die hongeren en dorsten naar de gerechtigheid, want zij zullen verzadigd worden.", "Tit 2:11": "Want de genade van God die zaligmakend is, is verschenen aan alle mensen.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Ezra 9:1": "Toen deze dingen voltooid waren, kwamen de vorsten naar mij toe en zeiden: Het volk van Israël, en de priesters, en de Levieten, hebben zich niet afgezonderd van de volken van deze landen, naar hun gruwelen, namelijk van de Kanaänieten, de Hethieten, de Ferezieten, de Jebusieten, de Ammonieten, de Moabieten, de Egyptenaren en de Amorieten.", "2 Kor 3:3": "omdat u openbaar geworden bent als een brief van Christus, door onze bediening opgesteld, geschreven niet met inkt, maar door de Geest van de levende God, niet op stenen tafels, maar op tafels van vlees, van het hart.", "Kol 3:5-10": "Dood dan uw leden die op de aarde zijn: hoererij, onreinheid, schandelijke beweging, kwade begeerlijkheid, en de hebzucht, die afgodendienst is. Om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid. Daarin hebt ook u eertijds gewandeld, toen u daarin leefde.", "Rom 2:29": "Maar die is een Jood, die het in het verborgen is, en de besnijdenis van het hart, in de geest, niet in de letter, dat is de besnijdenis; wiens lof niet is uit de mensen, maar uit God.", "Joh 7:25-27": "Sommigen dan uit de inwoners van Jeruzalem zeiden: Is Dit niet Hij, die zij proberen te doden? En zie, Hij spreekt vrijmoedig en zij zeggen Hem niets. Zouden de leiders nu echt weten dat Deze werkelijk de Christus is? Maar van Hem weten wij van waar Hij is; maar de Christus, wanneer Hij komen zal, dan zal niemand weten van waar Hij is.", "Tit 3:11": "Wetend dat zo iemand verkeerd is, en zondigt, terwijl hij zichzelf veroordeelt.", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Joh 8:16": "En als Ik toch oordeel, is Mijn oordeel waar; want Ik ben niet alleen, maar Ik en de Vader, Die Mij gezonden heeft.", "Spr 2:9-12": "Dan zult u verstaan gerechtigheid, en recht, en wat recht is, en elk goed pad. Als de wijsheid in uw hart gekomen zal zijn, en de wetenschap voor uw ziel liefelijk zal zijn; Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden;", "Kol 2:6": "Zoals u dan Christus Jezus, de Heere, hebt aangenomen, wandel zo in Hem;", "Matt 5:3-10": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen. Zalig zijn zij die treuren, want zij zullen vertroost worden. Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "2 Tim 1:5": "Als ik mij in herinnering breng het ongeveinsde geloof, dat in u is, dat eerst gewoond heeft in uw grootmoeder Lois, en in uw moeder Eunice; en ik ben verzekerd, dat het ook in u woont.", "Hebr 13:21": "Hij volmaakt u in alle goed werk, opdat u Zijn wil mag doen; terwijl Hij in u werkt wat voor Hem welgevallig is, door Jezus Christus; aan Wie de heerlijkheid is, tot in alle eeuwigheid. Amen.", "Openb 2:26": "En wie overwint, en Mijn werken tot het einde toe bewaart, hem zal Ik macht geven over de heidenen;", "Joh 9:35-37": "Jezus hoorde dat zij hem eruit geworpen hadden, en toen Hij hem vond, zei Hij tegen hem: Gelooft u in de Zoon van God? Hij antwoordde en zei: Wie is Hij, Heere, opdat ik in Hem geloven kan? En Jezus zei tegen hem: U hebt Hem gezien, en Hij die met u spreekt, Die is het.", "Ps 119:31": "Ik kleef vast aan Uw getuigenissen; o HEERE! beschaam mij niet.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Joh 9:34": "Zij antwoordden en zeiden tegen hem: U bent helemaal in zonden geboren, en u leert ons? En zij wierpen hem eruit.", "1 Petr 4:1-16": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde; om niet meer naar de begeerten van de mensen, maar naar de wil van God de tijd te leven die nog over is in het vlees. Want het is ons genoeg dat wij in de voorgaande tijd van ons leven de wil van de heidenen volbracht hebben, en geleefd hebben in losbandigheid, begeerten, dronkenschap, zwelgpartijen, drinkgelagen en gruwelijke afgoderij;", "Deut 13:3": "dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "1 Joh 2:24": "Wat u dan vanaf het begin gehoord hebt, laat dat in u blijven. Als in u blijft, wat u vanaf het begin gehoord hebt, dan zult u ook in de Zoon en in de Vader blijven.", "1 Sam 12:20": "Toen zei Samuël tegen het volk: Vrees niet, u hebt al dit kwaad gedaan; maar wijk niet af van achter de HEERE, maar dien de HEERE met uw hele hart.", "Hebr 6:6": "en die afvallig worden, opnieuw te vernieuwen tot bekering, omdat zij voor zichzelf de Zoon van God opnieuw kruisigen en openlijk te schande maken.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "1 Kron 28:6": "En Hij heeft tegen mij gezegd: Uw zoon Salomo, die zal Mijn huis en Mijn voorhoven bouwen; want Ik heb hem voor Mij verkoren tot een zoon, en Ik zal hem tot een Vader zijn.", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "Ps 50:18": "Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.", "1 Tim 5:15": "Want sommigen hebben zich al afgewend, achter de satan aan.", "Micha 6:8": "Hij heeft u bekendgemaakt, o mens, wat goed is; en wat eist de HEERE van u, dan recht te doen, en weldadigheid lief te hebben, en ootmoedig te wandelen met uw God?", "1 Kor 5:1": "Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft.", "Luk 22:54-62": "En zij grepen Hem en leidden Hem weg, en brachten Hem naar het huis van de hogepriester. En Petrus volgde van veraf. En toen zij vuur ontstoken hadden in het midden van de binnenplaats, en samen gingen zitten, zat Petrus in hun midden. En een zekere dienstmeid zag hem bij het vuur zitten, en keek hem aandachtig aan, en zei: Ook deze was met Hem.", "Rom 9:31": "Maar Israël, dat de wet van de rechtvaardigheid zocht, is tot de wet van de rechtvaardigheid niet gekomen.", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Tit 2:15": "Spreek dit, en vermaan, en bestraf met alle ernst. Laat niemand u minachten.", "Luk 1:6": "En zij waren beiden rechtvaardig voor God, en wandelden onberispelijk in alle geboden en voorschriften van de Heere.", "Spr 11:6": "De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid.", "1 Joh 4:5": "Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen.", "Luk 1:38-56": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg. En Maria stond in diezelfde dagen op en reisde met haast naar het gebergte, naar een stad van Juda; en kwam in het huis van Zacharias, en groette Elizabet.", "Num 9:23": "Naar het bevel van de HEERE legerden zij zich, en naar het bevel van de HEERE trokken zij verder; zij namen de wacht van de HEERE waar, naar het bevel van de HEERE, door de hand van Mozes.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Tit 1:10-14": "Want er zijn ook veel ongeregelde mensen, mensen die zinloze praat verkondigen en misleiden, vooral zij die uit de besnijdenis zijn; hun moet men de mond snoeren, want zij brengen hele huizen in verwarring, en leren wat niet behoort, om het schandelijke gewin. Iemand uit hen, hun eigen profeet, heeft gezegd: De Kretenzers zijn altijd leugenachtig, kwade beesten, luie buiken.", "2 Joh 1:9-11": "Ieder die overtreedt en niet blijft in de leer van Christus, heeft God niet; die in de leer van Christus blijft, die heeft beiden, de Vader en de Zoon. Als iemand tot u komt en deze leer niet brengt, ontvang hem niet in huis, en zeg tegen hem niet: wees gegroet. Want die tegen hem zegt: wees gegroet, die heeft gemeenschap aan zijn slechte werken.", "Gal 2:17": "Maar als wij, die in Christus zoeken gerechtvaardigd te worden, ook zelf zondaars blijken te zijn, is Christus dan een dienaar van de zonde? Dat zij verre.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 4:14": "Omdat wij dan een grote Hogepriester hebben, Die door de hemelen heen gegaan is, namelijk Jezus, de Zoon van God, laat ons deze belijdenis vasthouden.", "Matt 22:45": "Als David Hem dan zijn Heere noemt, hoe is Hij dan zijn Zoon?", "Matt 11:25-27": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt. Ja, Vader! Want zo is het welbehagen geweest voor U. Alle dingen zijn Mij overgegeven door Mijn Vader; en niemand kent de Zoon dan de Vader, en niemand kent de Vader dan de Zoon, en wie het de Zoon wil openbaren.", "1 Kor 4:21": "Wat wilt u? Zal ik met de roede naar u toe komen, of in liefde en in de geest van zachtmoedigheid?", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Job 34:27": "Daarom dat zij van achter Hem afgeweken zijn, en geen van Zijn wegen verstaan hebben;", "Ef 5:8-11": "Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht. (Want de vrucht van de Geest bestaat in alle goedheid, en rechtvaardigheid, en waarheid), terwijl u beproeft wat de Heere welgevallig is.", "1 Tim 5:17-19": "De oudsten die goed leiding geven, moeten dubbele eer waardig geacht worden, vooral wie arbeiden in het Woord en de leer. Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard. Neem tegen een ouderling geen beschuldiging aan, dan alleen op grond van twee of drie getuigen.", "Gal 6:18": "De genade van onze Heere Jezus Christus zij met uw geest, broeders! Amen. Geschreven aan de Galaten vanuit Rome.", "Spr 12:26": "De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg van de goddelozen doet hen dwalen.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "1 Kor 10:1-13": "Ik wil niet, broeders, dat u onwetend bent van het volgende: onze vaders waren allen onder de wolk, en gingen allen door de zee heen; en zij zijn allen in Mozes gedoopt in de wolk en in de zee; en zij hebben allen hetzelfde geestelijke voedsel gegeten;", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "Mark 1:1": "Het begin van het Evangelie van JEZUS CHRISTUS, de Zoon van God.", "Gal 5:13": "Want u bent tot vrijheid geroepen, broeders, gebruik alleen de vrijheid niet als een aanleiding voor het vlees; maar dien elkaar door de liefde.", "1 Kor 4:20": "Want het Koninkrijk van God bestaat niet in woorden, maar in kracht.", "Hand 20:29": "Want dit weet ik, dat na mijn vertrek zware wolven onder u zullen komen, die de kudde niet sparen.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Rom 15:33": "En de God van de vrede zij met u allen. Amen.", "Joh 1:51": "Jezus antwoordde en zei tegen hem: Omdat Ik u gezegd heb: Ik zag u onder de vijgenboom, gelooft u; u zult grotere dingen zien dan deze.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Gal 5:6": "Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar het geloof, dat door de liefde werkt.", "Mark 9:33-35": "En Hij kwam in Kapernaüm, en toen Hij in huis was, vroeg Hij hun: Waarover had u het onderweg met elkaar? Maar zij zwegen; want zij hadden onderweg met elkaar getwist over wie de belangrijkste zou zijn. En Hij ging zitten, riep de twaalf, en zei tegen hen: Als iemand de eerste wil zijn, die zal de laatste van allen zijn, en de dienaar van allen.", "Hand 22:18": "en dat ik Hem zag, en Hij tegen mij zei: Haast u, en ga snel uit Jeruzalem weg; want zij zullen uw getuigenis over Mij niet aannemen.", "2 Tim 4:2": "Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs.", "Ex 34:12": "Wacht u ervoor dat u toch geen verbond maakt met de inwoner van het land, waarin u komen zult; dat hij misschien niet tot een valstrik wordt in uw midden.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jer 23:14-16": "Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra. Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen, en met gallewater drenken; want van de profeten van Jeruzalem is de huichelarij uitgegaan in het hele land. Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.", "Ps 112:4-8": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig. Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht. Caph. Zeker, hij zal in eeuwigheid niet wankelen; Lamed. de rechtvaardige zal in eeuwige gedachtenis zijn.", "Rom 14:1": "Neem hem aan die zwak is in het geloof, maar niet tot twistige samensprekingen.", "Hand 20:17": "Maar hij stuurde vanuit Milete iemand naar Efeze en ontbood de oudsten van de gemeente.", "Matt 26:36-45": "Toen ging Jezus met hen naar een plaats genaamd Gethsémané, en zei tegen de discipelen: Blijft hier zitten, totdat Ik weggegaan ben en daar gebeden heb. En Hij nam Petrus en de twee zonen van Zebedeüs met Zich mee, en begon droevig en zeer beangst te worden. Toen zei Hij tegen hen: Mijn ziel is zeer bedroefd, tot de dood toe; blijft hier en waakt met Mij.", "Hos 4:8-13": "Zij eten de zonde van Mijn volk, en verlangen, ieder met zijn ziel, naar hun ongerechtigheid. Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden. En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen in aantal; want zij hebben nagelaten de Heere in acht te nemen.", "2 Kor 6:14": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis?", "Job 28:28": "Maar tegen de mens heeft Hij gezegd: Zie, de vreze des Heeren, dat is de wijsheid, en van het kwade te wijken is het verstand.", "Jes 52:1": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen.", "Ps 26:5": "Ik haat de vergadering van de boosdoeners, en bij de goddelozen zit ik niet.", "Ps 119:44": "Zo zal ik Uw wet voortdurend onderhouden, eeuwig en altijd.", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Jer 23:11": "Want zowel profeten als priesters zijn huichelaars; zelfs in Mijn huis vind Ik hun boosheid, spreekt de HEERE.", "1 Kor 1:26": "Want u ziet uw roeping, broeders, dat u niet veel wijzen bent naar het vlees, niet veel machtigen, niet veel edelen.", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Luk 22:29": "En Ik ken u het Koninkrijk toe, zoals Mijn Vader dat Mij toegekend heeft;", "Matt 13:23": "Maar die in de goede aarde bezaaid is, dit is degene die het woord hoort en begrijpt, die ook vrucht draagt en voortbrengt, de een honderdvoud, de ander zestigvoud, en de ander dertigvoud.", "Ef 5:1": "Wees dan navolgers van God, als geliefde kinderen;", "Jak 5:16": "Belijd elkaar de misdaden, en bid voor elkaar, opdat u gezond wordt; een krachtig gebed van de rechtvaardige vermag veel.", "Joh 6:40": "En dit is de wil van Hem die Mij gezonden heeft: dat ieder die de Zoon aanschouwt en in Hem gelooft, het eeuwige leven heeft; en Ik zal hem opwekken op de laatste dag.", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "1 Joh 3:23": "En dit is Zijn gebod, dat wij geloven in de Naam van Zijn Zoon Jezus Christus, en elkaar liefhebben, zoals Hij ons een gebod gegeven heeft.", "Kol 2:19": "En hij houdt het Hoofd niet vast, van waaruit het hele lichaam, door de gewrichten en banden gevoed en samengevoegd, groeit met een goddelijke groei.", "Matt 26:69-75": "En Petrus zat buiten in de zaal; en een dienstmeisje kwam naar hem toe en zei: U was ook met Jezus, de Galileeër. Maar hij loochende het voor allen en zei: Ik weet niet wat u zegt. En toen hij naar de voorpoort ging, zag een ander dienstmeisje hem, en zei tegen hen die daar waren: Deze was ook met Jezus de Nazarener.", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u ges
