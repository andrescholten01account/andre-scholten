r niet brengt, ontvang hem niet in huis, en zeg tegen hem niet: wees gegroet.","11":"Want die tegen hem zegt: wees gegroet, die heeft gemeenschap aan zijn slechte werken.","12":"Ik heb veel aan u te schrijven, maar ik heb dat niet met papier en inkt gewild; maar ik hoop tot u te komen en van mond tot mond *met u* te spreken, zodat onze blijdschap volkomen mag zijn.","13":"U groeten de kinderen van uw zuster, de uitverkorene. Amen."},"SV":{"1":"De ouderling aan de uitverkoren vrouwe en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen, die de waarheid gekend hebben;","2":"Om der waarheid wil, die in ons blijft, en met ons zal zijn in der eeuwigheid:","3":"Genade, barmhartigheid, vrede zij met ulieden van God den Vader, en van den Heere Jezus Christus, den Zoon des Vaders, in waarheid en liefde.","4":"Ik ben zeer verblijd geweest, dat ik van uw kinderen gevonden heb, die in de waarheid wandelen, gelijk wij een gebod ontvangen hebben van den Vader.","5":"En nu bid ik u, *uitverkoren* vrouwe, niet als u schrijvende een nieuw gebod, maar hetgeen wij gehad hebben van den beginne, *namelijk* dat wij elkander liefhebben.","6":"En dit is de liefde, dat wij wandelen naar Zijn geboden. Dit is het gebod, gelijk gijlieden van den beginne gehoord hebt, dat gij in hetzelve zoudt wandelen.","7":"Want er zijn vele verleiders in de wereld gekomen, die niet belijden, dat Jezus Christus in het vlees gekomen is. Deze is de verleider en de antichrist.","8":"Ziet toe voor uzelven, dat wij niet verliezen, hetgeen wij gearbeid hebben, maar een vol loon mogen ontvangen.","9":"Een iegelijk, die overtreedt, en niet blijft in de leer van Christus, die heeft God niet; die in de leer van Christus blijft, deze heeft beiden den Vader en den Zoon.","10":"Indien iemand tot ulieden komt, en deze leer niet brengt, ontvangt hem niet in huis, en zegt tot hem niet: Zijt gegroet.","11":"Want die tot hem zegt: Zijt gegroet, die heeft gemeenschap aan zijn boze werken.","12":"Ik heb veel aan ulieden te schrijven, doch ik heb niet gewild door papier en inkt; maar ik hoop tot ulieden te komen, en mond tot mond *met* *u* te spreken, opdat onze blijdschap volkomen moge zijn.","13":"U groeten de kinderen van uw zuster, de uitverkorene. Amen."},"KJV":{"1":"The elder unto the elect lady and her children, whom I love in the truth; and not I only, but also all they that have known the truth;","2":"For the truth's sake, which dwelleth in us, and shall be with us for ever.","3":"Grace be with you, mercy, and peace, from God the Father, and from the Lord Jesus Christ, the Son of the Father, in truth and love.","4":"I rejoiced greatly that I found of thy children walking in truth, as we have received a commandment from the Father.","5":"And now I beseech thee, lady, not as though I wrote a new commandment unto thee, but that which we had from the beginning, that we love one another.","6":"And this is love, that we walk after his commandments. This is the commandment, That, as ye have heard from the beginning, ye should walk in it.","7":"For many deceivers are entered into the world, who confess not that Jesus Christ is come in the flesh. This is a deceiver and an antichrist.","8":"Look to yourselves, that ➔ we lose not those things which we have wrought, but that we receive a full reward.","9":"Whosoever transgresseth, and abideth not in the doctrine of Christ, hath not God. He that abideth in the doctrine of Christ, he hath both the Father and the Son.","10":"If ➔ there come any unto you, and bring not this doctrine, receive him not into your house, neither bid him God speed:","11":"For he that biddeth him God speed is partaker of his evil deeds.","12":"Having many things to write unto you, I would not write with paper and ink: but I trust to come unto you, and speak face to face, that our joy may be full.","13":"The children of thy elect sister greet thee. Amen."}},"tsk":{"1":[{"kopje":"oudste","refs":["1 Petr 5:1","3 Joh 1:1"]},{"kopje":"uitverkoren hat we love one another."}],"6":[{"catchword":null,"tekst":"And this is love, [That is, herein consists the true love of God and our neighbor, or hereby it showed] that we walk according to his commandments. This is the commandment, as ye have heard from the beginning, [when the doctrine of the Gospel was first preached unto you, 1 John. 2. 7.] that ye should walk in the same. [That is, so frame your life according thereunto.]"}],"7":[{"catchword":null,"tekst":"For there are many seducers come into the world, who confess not [See the annot. On 1 John 2. 22. And chap. 4. 2.] that Jesus Christ is come in flesh: [Gr. Jesus Christ coming in the flesh. See the like phrase 1 Joh. 4. 2.] this is a seducer and an Antichrist. [See also 1 Joh. 4. 3.]"}],"8":[{"catchword":null,"tekst":"Look to yourselves [That is, have regard to your own salvation, from which ye would fall, if ye should suffer yourselves to be seduced by them. See Acts 20. 28.] that we lose not that which ye have labored for, [that is, that we, namely, Apostles, who have brought you to the knowledge of the truth, lose not the fruit of our labour about you. Or that ye (as others read) namely, who have once received the true doctrine, and have framed your lives according to the same, lose not the fruit of your profession and conversation, which is eternal life, by seduction being brought to Apostacy] but may receive a full [that is, abundant] reward. [Namely, we Apostles, of our labour, as which shall not be bestowed upon you in vain. See Phil. 4. 1. 1 Thes. 2. 19. Or ye believers, if ye continue steadfast against seduction, in the true doctrine of the Gospel]"}],"9":[{"catchword":null,"tekst":"Every one that transgresseth, [Namely, by falling away from the doctrine of the Gospel, as the following words declare] and abideth not in the doctrine of Christ, he hath not God; [that is, he hath no communion with God] he that abideth in the doctrine of Christ, he hath both the father and the Son. [That is, hath communion with both. See 1 john 1. 3.]"}],"10":[{"catchword":null,"tekst":"If any man come unto you, [Namely, into your house, or otherwise, to teach and instruct you] and bringeth not [that is, teacheth and propoundeth] this doctrine, [namely, that Jesus Christ is come in the flesh, verse 7. And which we Apostles have taught you] receive him not into house, [that is, hold no brotherly communion, or intimate converse with him] and salute him not, [Gr. Chairein, i.e. to be joyful. See the annot. On James 1. 1.]"}],"11":[{"catchword":null,"tekst":"For he that saluteth him, he hath fellowship [That is, he heareth his false doctrine, whereby he seduceth men, and puts himself in danger to be seduced by him also; and gives offence to others, as if he consented to false doctrine , forasmuch as he holds such communion with false Teachers] by his wicked works. [Namely, which he doth in seducing men from the true doctrine.]"}],"12":[{"catchword":null,"tekst":"I have much [Namely, concerning these things] to write unto you, but I would not by paper and ink, [that is, by an Epistle, which is written with ink on paper. This he saith not because he had anything concerning salvation, which he would not entrust unto paper, for all these things he hath sufficiently written in his Gospel, John 20. 31. But because he hoped speedily to come unto them, and would declare these things unto them by word of mouth] but I hope to come unto you, and to speak (with you) mouth to mouth, [that is, being present with you. See the like 1 Cor. 13. 12.] that our joy [namely, which shall arise by my presence] may be complete. [Gr. Filled , i.e. abundant.]"}],"13":[{"catchword":null,"tekst":"The children of thy sister, the elect, [See ver. 1.] salute thee. Amen."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;

}
function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {

    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});

  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
