2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En meteen, vroeg in de morgen, hielden de overpriesters samen overleg, met de oudsten en Schriftgeleerden, en de hele Raad, en nadat zij Jezus gebonden hadden, brachten zij *Hem* weg, en gaven *Hem* aan Pilatus over.","2":"En Pilatus vroeg Hem: Bent U de Koning van de Joden? En Hij antwoordde en zei tegen hem: U zegt het.","3":"En de overpriesters beschuldigden Hem van veel *zaken*; maar Hij antwoordde niets.","4":"En Pilatus vroeg Hem weer: Antwoordt U niet? Zie, hoeveel *zaken* zij tegen U getuigen!","5":"En Jezus heeft niets meer geantwoord, zodat Pilatus zich verwonderde.","6":"En met het feest liet hij hun één gevangene los, wie zij ook begeerden.","7":"En er was iemand, genaamd Barabbas, gevangen met *andere* medeoproermakers, die tijdens het oproer een moord had gepleegd.","8":"En de menigte riep uit, en begon te vragen *dat hij deed*, zoals hij hun altijd gedaan had.","9":"En Pilatus antwoordde hun, en zei: Wilt u dat ik u de Koning van de Joden loslaat?","10":"(Want hij wist dat de overpriesters Hem uit afgunst overgeleverd hadden.)","11":"Maar de overpriesters brachten de menigte ertoe dat hij hun liever Barabbas zou loslaten.","12":"En Pilatus antwoordde en zei weer tegen hen: Wat wilt u dan dat ik *met Hem* zal doen, Die u een Koning van de Joden noemt?","13":"En zij riepen weer: Kruisig Hem.","14":"Maar Pilatus zei tegen hen: Wat heeft Hij dan voor kwaad gedaan? En zij riepen des te meer: Kruisig Hem!","15":"Pilatus nu, die de menigte tevreden wilde stellen, liet hun Barabbas los, en gaf Jezus over, nadat hij *Hem* gegeseld had, om gekruisigd te worden.","16":"En de soldaten leidden Hem naar binnen in de zaal, welke het rechthuis is, en riepen de hele afdeling samen;","17":"En zij deden Hem een purperen mantel aan, en nadat zij een doornenkroon gevlochten hadden, zetten zij Hem *die* op;","18":"en begonnen Hem te groeten, *en zeiden*: Wees gegroet, *U* Koning van de Joden!","19":"En zij sloegen Zijn hoofd met een rietstok, en bespuwden Hem, en vielen op de knieën, en aanbaden Hem.","20":"En toen zij Hem bespot hadden, deden zij Hem de purperen mantel af, en deden Hem Zijn eigen kleren aan, en leidden Hem naar buiten, om Hem te kruisigen.","21":"En zij dwongen iemand die *daar* voorbijkwam, Simon van Cyrene, die van de akker kwam, de vader van Alexander en Rufus, om Zijn kruis te dragen.","22":"En zij brachten Hem naar de plaats Golgotha, dat vertaald is: Schedelplaats.","23":"En zij gaven Hem wijn met mirre vermengd te drinken; maar Hij nam *die* niet aan.","24":"En toen zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, en wierpen het lot erover, wat ieder zou wegnemen.","25":"En het was het derde uur, en zij kruisigden Hem.","26":"En het opschrift van Zijn beschuldiging was boven Hem geschreven: DE KONING VAN DE JODEN.","27":"En zij kruisigden met Hem twee rovers, één aan *Zijn* rechter-, en één aan Zijn linker*zijde*.","28":"En de Schrift is vervuld die zegt: En Hij is met de misdadigers gerekend.","29":"En zij die voorbijkwamen, lasterden Hem, en schudden hun hoofden, en zeiden: Ha! U die de tempel afbreekt, en in drie dagen opbouwt,","30":"Red Uzelf, en kom van het kruis af.","31":"En evenzo zeiden ook de overpriesters, met de Schriftgeleerden, spottend tegen elkaar: Anderen heeft Hij verlost; Zichzelf kan Hij niet verlossen.","32":"De Christus, de Koning van Israël, moet nu van het kruis afkomen, opdat wij het zien en geloven. Ook zij die met Hem gekruisigd waren, hoonden Hem.","33":"En toen het zesde uur gekomen was, kwam er duisternis over de hele aarde, tot het negende uur toe.","34":"En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?","35":"En sommigen van hen die daarbij stonden, hoorden *dit*, en zeiden: Zie, Hij roept Elia.","36":"En er liep iemand, en vulde een spons met azijn, en stak die op een rietstok, en gaf Hem te drinken, en zei: Laat staan, laten we zien of Elia komt om Hem eraf te halen.","37":"En Jezus, nadat Hij een luide stem *van Zich* had gegeven, gaf de geest.","38":"En het voorhangsel van de tempel scheurde in tweeën, van boven tot beneden.","39":"En de hoofdman over honderd, die daarbij tegenover Hem stond, zag dat Hij zo roepend de geest gegeven had, en zei: Werkelijk, deze Mens was Gods Zoon!","40":"En er waren ook vrouwen die dit van verre aanschouwden, onder wie ook Maria Magdalena was, en Maria, de moeder van Jakobus de kleine, en van Joses, en Salome;","41":"die, toen Hij in Galilea was, Hem gevolgd waren, en Hem gediend hadden; en vele andere *vrouwen*, die met Hem naar Jeruzalem opgekomen waren.","42":"En toen het al avond geworden was, omdat het de voorbereiding was, dat is de dag voor de sabbat;","43":"kwam Jozef, die van Arimathea *was*, een eerbaar raadslid, dat ook zelf het Koninkrijk van God verwachtte, en hij waagde het en ging naar Pilatus, en vroeg om het lichaam van Jezus.","44":"En Pilatus verwonderde zich dat Hij al gestorven was; en hij riep de hoofdman over honderd bij zich, en vroeg hem of Hij al lang gestorven was.","45":"En toen hij het van de hoofdman over honderd vernomen had, schonk hij Jozef het lichaam.","46":"En hij kocht fijn linnen, en nadat hij Hem afgenomen had, wikkelde hij *Hem* in dat fijne linnen, en legde Hem in een graf, dat uit een rots gehouwen was; en hij rolde een steen voor de deur van het graf.","47":"En Maria Magdalena, en Maria, *de moeder* van Joses, keken toe waar Hij gelegd werd."},"SV":{"1":"En terstond, des morgens vroeg, hielden de overpriesters te zamen raad, met de ouderlingen en Schriftgeleerden, en den gehelen raad, en Jezus gebonden hebbende, brachten zij *Hem* heen, en gaven *Hem* aan Pilatus over.","2":"En Pilatus vraagde Hem: Zijt Gij de Koning der Joden? En Hij antwoordende, zeide tot hem: Gij zegt het.","3":"En de overpriesters beschuldigden Hem van vele *zaken*; maar Hij antwoordde niets.","4":"En Pilatus vraagde Hem wederom, zeggende: Antwoordt Gij niet? Zie, hoe vele *zaken* zij tegen U getuigen!","5":"En Jezus heeft niet meer geantwoord, zodat Pilatus zich verwonderde.","6":"En op het feest liet hij hun een gevangene los, wien zij ook begeerden.","7":"En er was een, genaamd Bar-abbas, gevangen met *andere* medeoproermakers, die in het oproer een doodslag gedaan had.","8":"En de schare riep uit, en begon te begeren, *dat* *hij* *deed*, gelijk hij hun altijd gedaan had.","9":"En Pilatus antwoordde hun, zeggende: Wilt gij, dat ik u den Koning der Joden loslate?","10":"( Want hij wist, dat de overpriesters Hem door nijd overgeleverd hadden.)","11":"Maar de overpriesters bewogen de schare, dat hij hun liever Bar-abbas zou loslaten.","12":"En Pilatus, antwoordende, zeide wederom tot hen: Wat wilt gij dan, dat ik *met* *Hem* doen zal, Dien gij een Koning der Joden noemt?","13":"En zij riepen wederom: Kruis Hem.","14":"Doch Pilatus zeide tot hen: Wat heeft Hij dan kwaads gedaan? En zij riepen te meer: Kruis Hem!","15":"Pilatus nu, willende der schare genoeg doen, heeft hun Bar-abbas losgelaten, en gaf Jezus over, als hij *Hem* gegeseld had, om gekruist te worden.","16":"En de krijgsknechten leidden Hem binnen in de zaal, welke is het rechthuis, en riepen de ganse bende samen;","17":"En deden Hem een purperen mantel aan, en een doornenkroon gevlochten hebbende, zetten Hem *die* op;","18":"En begonnen Hem te groeten, *zeggende*: Wees gegroet, *Gij* Koning der Joden!","19":"En sloegen Zijn hoofd met een rietstok, en bespogen Hem, en vallende op de knieën, aanbaden Hem.","20":"En als zij Hem bespot hadden, deden zij Hem den purperen mantel af, en deden Hem Zijn eigen klederen aan, en leidden Hem uit, om Hem te kruisigen.","21":"En zij dwongen een Simon van Cyrene, die *daar* voorbijging, komende van den akker, den vader van Alexander en Rufus, dat hij Zijn kruis droeg.","22":"En zij brachten Hem tot de plaats Golgotha, hetwelk is, overgezet zijnde, Hoofdschedelplaats.","23":"En zij gaven Hem gemirreden wijn te drinken; maar Hij nam *dien* niet.","24":"En als zij Hem gekruisigd hadden, verdeelden zij Zijn klederen, werpende het lot over dezelve, wat een iegelijk wegnemen zou.","25":"En het was de derde ure, en zij kruisigden Hem.","26":"En het opschrift Zijner beschuldiging was boven Hem geschreven: DE KONING DER JODEN.","27":"En zij kruisigden met Hem twee moordenaars, een aan *Zijn* rechter-, en een aan Zijn linker *zijde*.","28":"En de Schrift is vervuld geworden, die daar zegt: En Hij is met de misdadigers gerekend.","29":"En die voorbijgingen, lasterden Hem, schuddende hun hoofden, en zeggende: Ha! Gij, die den tempel afbreekt, en in drie dagen opbouwt,","30":"Behoud Uzelven, en kom af van het kruis.","31":"En insgelijks ook de overpriesters, met de Schriftgeleerden, zeiden tot elkander, al spottende: Hij heeft anderen verlost; Zichzelven kan Hij niet verlossen.","32":"De Christus, de Koning Israëls, kome nu af van het kruis, opdat wij het zien en geloven mogen. Ook die met Hem gekruist waren, smaadden Hem.","33":"En als de zesde ure gekomen was, werd er duisternis over de gehele aarde, tot de negende ure toe.","34":"En ter negender ure, riep Jezus met een grote stem, zeggende: ELOI, ELOI, LAMMA SABACHTANI, hetwelk is, overgezet zijnde: Mijn God, Mijn God! Waarom hebt Gij Mij verlaten?","35":"En sommigen van die daarbij stonden, *dit* horende, zeiden: Ziet, Hij roept Elias.","36":"En er liep een, en vulde een spons met edik, en stak ze op een rietstok, en gaf Hem te drinken, zeggende: Houdt stil, laat ons zien, of Elias komt, om Hem af te nemen.","37":"En Jezus, een grote stem van *Zich* gegeven hebbende, gaf den geest.","38":"En het voorhangsel des tempels scheurde in tweeën, van boven tot beneden.","39":"En de hoofdman over honderd, die daarbij tegenover Hem stond, ziende, dat Hij alzo roepende den geest gegeven had, zeide: Waarlijk, deze Mens was Gods Zoon!","40":"En er waren ook vrouwen, van verre *dit* aanschouwende, onder welke ook was Maria Magdalena, en Maria, de moeder van Jakobus, den kleine, en van Joses, en Salome;","41":"Welke ook, toen Hij in Galilea was, Hem waren gevolgd, en Hem gediend hadden; en vele andere *vrouwen*, die met Hem naar Jeruzalem opgekomen waren.","42":"En als het nu avond was geworden, dewijl het de voorbereiding was, welke is de voorsabbat;","43":"Kwam Jozef, die van Arimathea *was*, een eerlijk raadsheer, die ook zelf het Koninkrijk Gods was verwachtende, en zich verstoutende, ging hij in tot Pilatus, en begeerde het lichaam van Jezus.","44":"En Pilatus verwonderde zich, dat Hij alrede gestorven was; en den hoofdman over honderd tot zich geroepen hebbende, vraagde hem, of Hij lang gestorven was.","45":"En als hij het van den hoofdman over honderd verstaan had, schonk hij Jozef het lichaam.","46":"En hij kocht fijn lijnwaad, en Hem afgenomen hebbende, wond *Hem* in dat fijne lijnwaad, en leide Hem in een graf, hetwelk uit een steenrots gehouwen was; en hij wentelde een steen tegen de deur des grafs.","47":"En Maria Magdalena, en Maria, *de* *moeder* van Joses, aanschouwden, waar Hij gelegd werd."},"KJV":{"1":"And straightway in the morning the chief priests held a consultation with the elders and scribes and the whole council, and bound Jesus, and carried *him* away, and delivered *him* to Pilate.","2":"And Pilate asked him, Art thou the King of the Jews? And he answering said unto him, Thou sayest","3":"And the chief priests accused him of many things: but he answered nothing.","4":"And Pilate asked him again, saying, Answerest thou nothing? behold how many things they witness against thee.","5":"But Jesus yet answered nothing; so that Pilate marvelled.","6":"Now at *that* feast he released unto them one prisoner, whomsoever they desired.","7":"And there was *one* named Barabbas, *which lay* bound with them that had made insurrection with him, who had committed murder in the insurrection.","8":"And the multitude crying aloud began to desire *him to do* as he had ever done unto them.","9":"But Pilate answered them, saying, Will ye that I release unto you the King of the Jews?","10":"For he knew that the chief priests had delivered him for envy.","11":"But the chief priests moved the people, that he should rather release Barabbas unto them.","12":"And Pilate answered and said again unto them, What will ye then that I shall do *unto him* whom ye call the King of the Jews?","13":"And they cried out again, Crucify him.","14":"Then Pilate said unto them, Why, what evil hath he done? And they cried out the more exceedingly, Crucify him.","15":"And *so* Pilate, willing to content the people, released Barabbas unto them, and delivered Jesus, when he had scourged *him*, to be crucified.","16":"And the soldiers led him away into the hall, called Praetorium; and they call together the whole band.","17":"And they clothed him with purple, and platted a crown of thorns, and put it about his","18":"And began to salute him, Hail, King of the Jews!","19":"And they smote him on the head with a reed, and did spit upon him, and bowing *their* knees worshipped him.","20":"And when they had mocked him, they took off the purple from him, and put his own clothes on him, and led him out to crucify him.","21":"And they compel one Simon a Cyrenian, who passed by, coming out of the country, the father of Alexander and Rufus, to bear his cross.","22":"And they bring him unto the place Golgotha, which is, being interpreted, The place of a skull.","23":"And they gave him to drink wine mingled with myrrh: but he received *it* not.","24":"And when they had crucified him, they parted his garments, casting lots upon them, what every man should take.","25":"And it was the third hour, and they crucified him.","26":"And the superscription of his accusation was written over, THE KING OF THE JEWS.","27":"And with him they crucify two thieves; the one on his right hand, and the other on his left.","28":"And the scripture was fulfilled, which saith, And he was numbered with the transgressors.","29":"And they that passed by railed on him, wagging their heads, and saying, Ah, thou that destroyest the temple, and buildest *it* in three days,","30":"Save thyself, and come down from the cross.","31":"Likewise also the chief priests mocking said among themselves with the scribes, He saved others; himself he cannot save.","32":"Let Christ the King of Israel descend now from the cross, that we may see and believe. And they that were crucified with him reviled him.","33":"And when the sixth hour was come, there was darkness over the whole land until the ninth hour.","34":"And at the ninth hour Jesus cried with a loud voice, saying, Eloi, Eloi, lama sabachthani? which is, being interpreted, My God, my God, why hast thou forsaken me?","35":"And some of them that stood by, when they heard *it*, said, Behold, he calleth Elias.","36":"And one ran and filled a spunge full of vinegar, and put *it* on a reed, and gave him to drink, saying, Let alone; let us see whether Elias will come to take him down.","37":"And Jesus cried with a loud voice, and gave up the ghost.","38":"And the veil of the temple was rent in twain from the top to the bottom.","39":"And when the centurion, which stood over against him, saw that he so cried out, and gave up the ghost, he said, Truly this man was the Son of God.","40":"There were also women looking on afar off: among whom was Mary Magdalene, and Mary the mother of James the less and of Joses, and Salome;","41":"(Who also, when he was in Galilee, followed him, and ministered unto him;) and many other women which came up with him unto Jerusalem.","42":"And now when the even was come, because it was the preparation, that is, the day before the sabbath,","43":"Joseph of Arimathaea, an honourable counsellor, which also waited for the kingdom of God, came, and went in boldly unto Pilate, and craved the body of Jesus.","44":"And Pilate marvelled if he were already dead: and calling *unto him* the centurion, he asked him whether he had been any while dead.","45":"And when he knew *it* of the centurion, he gave the body to Joseph.","46":"And he bought fine linen, and took him down, and wrapped him in the linen, and laid him in a sepulchre which was hewn out of a rock, and rolled a stone unto the door of the sepulchre.","47":"And Mary Magdalene and Mary *the mother* of Joses beheld where he was laid."}},"tsk":{"1":[{"kopje":"meteen","refs":["Ps 2:2","Matt 27:1","Matt 27:2","Luk 22:66","Hand 4:5","Hand 4:6","Hand 4:25-28"]},{"kopje":"en gaven","refs":["Mark 10:33","Mark 10:34","Matt 20:18","Matt 20:19","Luk 18:32","Luk 18:33","Luk 23:1","Luk 23:2-5","Joh 18:28-38","Hand 3:13"]}],"3":[{"kopje":"de overpriesters","refs":["Matt 27:12","Luk 23:2-5","Joh 18:29-31","Joh 19:6","Joh 19:7","Joh 19:12"]},{"kopje":"maar","refs":["Mark 15:5","Mark 14:60","Mark 14:61","Jes 53:7"]}],"4":[{"kopje":"Antwoordt","refs":["Matt 26:62","Matt 27:13","Joh 19:10"]}],"5":[{"kopje":"Jezus","refs":["Jes 53:7","Joh 19:9"]},{"kopje":"Pilatus ata-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G2235\">now</span> when the <span class=\"wl wl-kjv\" data-code=\"G3798\">even</span> was <span class=\"wl wl-kjv\" data-code=\"G1096\">come,</span> <span class=\"wl wl-kjv\" data-code=\"G1893\">because</span> it <span class=\"wl wl-kjv\" data-code=\"G2258\">was</span> the <span class=\"wl wl-kjv\" data-code=\"G3904\">preparation,</span> <span class=\"wl wl-kjv\" data-code=\"G3603\">that</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is,</span> the day before the sabbath,","43":"<span class=\"wl wl-kjv\" data-code=\"G2501\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"G575\">of</span> <span class=\"wl wl-kjv\" data-code=\"G707\">Arimathaea,</span> an <span class=\"wl wl-kjv\" data-code=\"G2158\">honourable</span> <span class=\"wl wl-kjv\" data-code=\"G1010\">counsellor,</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> <span class=\"wl wl-kjv\" data-code=\"G4327\">waited</span> <span class=\"wl wl-kjv\" data-code=\"G2258\">for</span> the <span class=\"wl wl-kjv\" data-code=\"G932\">kingdom</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God,</span> <span class=\"wl wl-kjv\" data-code=\"G2064\">came,</span> and went <span class=\"wl wl-kjv\" data-code=\"G1525\">in</span> <span class=\"wl wl-kjv\" data-code=\"G5111\">boldly</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G4091\">Pilate,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G154\">craved</span> the <span class=\"wl wl-kjv\" data-code=\"G4983\">body</span> of Jesus.","44":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> <span class=\"wl wl-kjv\" data-code=\"G4091\">Pilate</span> <span class=\"wl wl-kjv\" data-code=\"G2296\">marvelled</span> <span class=\"wl wl-kjv\" data-code=\"G1487\">if</span> he <span class=\"wl wl-kjv\" data-code n</span> out <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> a <span class=\"wl wl-kjv\" data-code=\"G4073\">rock,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4351\">rolled</span> a <span class=\"wl wl-kjv\" data-code=\"G3037\">stone</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">unto</span> the <span class=\"wl wl-kjv\" data-code=\"G2374\">door</span> of the sepulchre.","47":"<span class=\"wl wl-kjv\" data-code=\"G1161\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3137\">Mary</span> <span class=\"wl wl-kjv\" data-code=\"G3094\">Magdalene</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3137\">Mary</span> the mother of <span class=\"wl wl-kjv\" data-code=\"G2500\">Joses</span> <span class=\"wl wl-kjv\" data-code=\"G2334\">beheld</span> <span class=\"wl wl-kjv\" data-code=\"G4226\">where</span> he was laid."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"gaven Hem aan Pilatus over","tekst":"De oorzaak waarom zij Hem Pilatus overleverden, zie Mat 27:2 ."}],"2":[{"catchword":"Gij zegt het","tekst":"Van deze wijze van spreken zie de aantekeningen Mat 26:25 ."}],"5":[{"catchword":"niet meer geantwoord,","tekst":"Grieks, niet meer iets; de reden van dit zwijgen zie Mat 27:14 ."}],"6":[{"catchword":"op het feest","tekst":"Of, op elk feest; namelijk van pasen; zie Joh 18:39 ."}],"8":[{"catchword":"gelijk hij hun altijd gedaan had","tekst":"Namelijk dat hij hun een gevangene losliet."}],"15":[{"catchword":"gaf Jezus over,","tekst":"Namelijk aan den hoofdman en de krijgsknechten."}],"16":[{"catchword":"het rechthuis,","tekst":"Grieks, Praitorion; waarmede uitgedrukt wordt het Latijnse woord Praetorium, hetwelk betekent de plaats waar de Romeinse stadhouders woonden en hun vierschaar hielden."}],"17":[{"catchword":"deden Hem een purperen mantel aan,","tekst":"Grieks, bekleedden Hem met purper; dat is met een purperen mantel. Zie hiervan breder de aantekeningen Mat 27:28 ."}],"19":[{"catchword":"aanbaden Hem","tekst":"Spottenderwijze Hem erende, gelijk de heidenen met ernst hunne koningen plachten te eren."}],"21":[{"catchword":"Alexander en Rufus,","tekst":"De namen van deze worden hier uitgedrukt, omdat zij daarna in de kerk Gods vermaarde lieden zijn geweest, van wie ook schijnt gewag gemaakt te worden Rom 16:13 ."},{"catchword":"Zijn kruis droeg","tekst":"Namelijk van Christus; de oorzaak zie op de aantekeningen Mat 27:32 ."}],"22":[{"catchword":"Hoofdschedelplaats","tekst":"Zie Mat 27:33 ."}],"23":[{"catchword":"gemirreden wijn te drinken;","tekst":"Hiervan zie Mat 27:34 ."}],"25":[{"catchword":"de derde ure,","tekst":"Deze uren moeten naar der Joden wijze gerekend worden, van den opgang der zon tot den ondergang; zie Mat 20:3 , en Joh 11:9 . En alzo pasen toen kwam omtrent den tijd dat de dagen en nachten even lang zijn, zo komt de derde ure overeen met ons negende, de zesde met ons twaalfde, en de negende met ons derde na den middag. Johannes zegt, Joh 19:14 , dat het was omtrent de zesde ure toen hij Hem voorbracht. Hoe dit overeenkomt zie de aantekeningen Joh 19:14 ."}],"27":[{"catchword":"moordenaars,","tekst":"Of, straatschenders."}],"31":[{"catchword":"Zichzelven kan Hij niet verlossen","tekst":"Anders, kan Hij zichzelven niet behouden?"}],"32":[{"catchword":"die met Hem gekruist waren,","tekst":"Namelijk een van dezen. Zie Mat 27:44 , en Luk 23:39 ."}],"33":[{"catchword":"duisternis over de gehele aarde,","tekst":"Van deze duisternis, zie Mat 27:45 , gelijk ook van al het volgende."}],"36":[{"catchword":"stak ze op een rietstok,","tekst":"Of, legde ze om."}],"38":[{"catchword":"het voorhangsel des tempels scheurde in tweeën,","tekst":"Zie hiervan Mat 27:51 ."}],"39":[{"catchword":"alzo roepende den geest gegeven had,","tekst":"Namelijk met zulk een sterke stem, Heb 5:7 , en dat Hij daarop zo terstond gestorven was, en daarbij ziende de wonderen, die daarop geschiedden, gelijk verhaald wordt, Mat 27:54 ."}],"40":[{"catchword":"Maria, de moeder van Jakobus,","tekst":"De huisvrouw van Alfeus; zie Mat 10:3 , en Mat 27:56 ."},{"catchword":"den kleine,","tekst":"Dat is, van den jongere, die alzo toegenaamd werd tot onderscheiding van een anderen Jakobus, die Zebedeus zoon was; of van zijn oom, den broeder van Alfeus, gelijk sommigen menen."},{"catchword":"Salóme;","tekst":"Deze is geweest de huisvrouw van Zebedeus, gelijk blijkt uit deze plaats, vergelijk met Mat 27:56 ."}],"42":[{"catchword":"avond was geworden,","tekst":"Namelijk op den dag vóór den sabbat."},{"catchword":"de voorbereiding was,","tekst":"Namelijk van het pascha, hetwelk de Joden voor ditmaal hadden uitgesteld tot op den sabbat. De redenen hiervan worden verhaald in de aantekeningen Mat 26:20 ."}],"43":[{"catchword":"het Koninkrijk Gods was verwachtende,","tekst":"Namelijk dat door den Messias zou opgericht worden, Luk 2:25 , Luk 2:38 ."}],"44":[{"catchword":"Hij alrede gestorven was;","tekst":"Grieks, of, indien."}],"46":[{"catchword":"uit een steenrots gehouwen was;","tekst":"Dat is, uitgehouwen in ene steenrots, gelijk staat Mat 27:60 ."}],"47":[{"catchword":"Maria Magdalena,","tekst":"Zie Mar 5:20 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And straight away early in the morning, the chief priests held consultations together, with the elders, and scribes, and the whole council, and having bound Jesus, they brought him away and delivered him to Pilate. [The cause wherefore they delivered him up to Pilate, see matth. 27.2.]"}],"2":[{"catchword":null,"tekst":"And Pilate asked him, art thou the King of the Jews? And he answering, said unto him, thou sayest it. [of this manner of speaking, see the annotations on Matth. 26.25.]"}],"3":[{"catchword":null,"tekst":"And the chief priests accused him of many things but be answered nothing."}],"4":[{"catchword":null,"tekst":"And Pilate asked him again, saying, answerest thou nothing? Behold how many things they witness against thee."}],"5":[{"catchword":null,"tekst":"And Jesus answered nothing more, [Gr. No more any thing. The reason of this silence, see Matth. 27.14] so that Pilate marveled."}],"6":[{"catchword":null,"tekst":"And on the feast [or, on every feast; namely, of the Passover, see Job 18:39.] he released one prisoner unto them, whomsoever they desired."}],"7":[{"catchword":null,"tekst":"And there was one called barabbas, imprisoned with other co-partners in roar, who had uproar, who had committed murder in the uproar."}],"8":[{"catchword":null,"tekst":"And the multitude cryed out and began to crave (that he would do) as he had always done to them, [Namely, that he would release one prisoner unto them.]"}],"9":[{"catchword":null,"tekst":"And Pilate answered them, saying, will ye that I release unto you the king of the Jews?"}],"10":[{"catchword":null,"tekst":"(for he knew that the chief priests had delivered him up through envy.)"}],"11":[{"catchword":null,"tekst":"But the chief priest stirred up the multitude, that he should rather release Barabbas unto them."}],"12":[{"catchword":null,"tekst":"And Pilate answering, said again unto them, what will ye then that I shall do (with him) whom ye call a king of the Jews?"}],"13":[{"catchword":null,"tekst":"And they cried again, crusifie him."}],"14":[{"catchword":null,"tekst":"But Pilate said unto them, what evil then hath he done? And they cryed the more, crusifie him."}],"15":[{"catchword":null,"tekst":"Now Pilate willing to satisfie the multitude, released Barabbas unto them, and delivered Jesus over, [Namely, to the captain and souldiers] having scouged him for to be crucified."}],"16":[{"catchword":null,"tekst":"And the souldiers led him into the hall, which is the judgement-house, [Gr. Praitotion, whereby is exprest the Latine word Praetorium, which signifies the place where the roman governours dwelt, and kept their Tribunal or Judgement-seat] and called the whole hand together."}],"17":[{"catchword":null,"tekst":"And put on h // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
