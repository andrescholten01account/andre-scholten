, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Ex 3:5-10": "En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land. Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien. En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "1 Joh 5:13": "Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Spr 24:18": "Opdat de HEERE het niet ziet, en het kwaad is in Zijn ogen en Hij Zijn toorn van hem afkeert.", "Rom 10:18": "Maar ik zeg: Hebben zij het niet gehoord? Zeker wel, hun geluid is over de hele aarde uitgegaan, en hun woorden tot de einden van de wereld.", "Neh 4:5": "Dek hun ongerechtigheid niet toe, en laat hun zonde niet uitgewist worden van voor Uw aangezicht, want zij hebben U getergd, tegenover de bouwers.", "Joh 7:30": "Zij probeerden Hem dan te grijpen; maar niemand sloeg de hand aan Hem, want Zijn uur was nog niet gekomen.", "Dan 9:21": "terwijl ik nog sprak in het gebed, kwam de man Gabriël, die ik in het begin in een visioen gezien had, snel gevlogen, en raakte mij aan, omtrent de tijd van het avondoffer.", "Matt 26:62": "En de hogepriester stond op en zei tegen Hem: Antwoordt U niets? Wat getuigen dezen tegen U?", "Joh 19:4": "Pilatus kwam dan weer naar buiten, en zei tegen hen: Zie, ik breng Hem naar buiten tot u, zodat u weet dat ik in Hem geen schuld vind.", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Hand 24:23": "En hij beval de hoofdman over honderd, dat Paulus bewaard zou worden, en verlichting zou hebben, en dat hij niemand van de zijnen zou beletten hem te dienen, of naar hem toe te komen.", "Matt 26:57-68": "Zij die Jezus gevangen hadden, leidden Hem weg naar Kajafas, de hogepriester, waar de Schriftgeleerden en oudsten samengekomen waren. En Petrus volgde Hem van veraf tot aan de zaal van de hogepriester, en ging naar binnen en zat bij de dienaren, om het einde te zien. En de overpriesters en de oudsten en de hele Grote Raad zochten valse getuigenis tegen Jezus, opdat zij Hem konden doden; en zij vonden niets.", "Matt 3:17": "En zie, een stem uit de hemelen zei: Deze is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!", "Matt 26:21": "En terwijl zij aten, zei Hij: Voorwaar, Ik zeg u dat één van u Mij zal verraden.", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Hand 6:11-14": "Toen zetten zij mannen op die zeiden: Wij hebben hem lasterlijke woorden horen spreken tegen Mozes en God. En zij hitsten het volk op, en de oudsten en de schriftgeleerden; en zij overvielen hem, grepen hem, en brachten hem voor de Raad; en zetten valse getuigen in, die zeiden: Deze man houdt niet op lasterlijke woorden te spreken tegen deze heilige plaats en de wet.", "Luk 7:34": "De Zoon des mensen is gekomen, en eet en drinkt wel; en u zegt: Zie, een vraat en wijnzuiper, een vriend van tollenaars en zondaars.", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "Joh 11:4": "En Jezus, dat horende, zei: Deze ziekte is niet tot de dood, maar tot heerlijkheid van God, opdat de Zoon van God erdoor verheerlijkt wordt.", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "Matt 27:60": "En hij legde het in zijn nieuwe graf, dat hij in een rots had uitgehouwen; en nadat hij een grote steen voor de ingang van het graf gerold had, ging hij weg.", "Matt 26:67": "Toen spuugden zij in Zijn gezicht en sloegen Hem met vuisten.", "Spr 14:17": "Wie haastig is tot toorn, zal dwaasheid doen; en een man met schandelijke plannen zal gehaat worden.", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Jer 10:24": "Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat U mij niet te niet maakt.", "Mark 16:4": "(En toen zij opkeken, zagen zij dat de steen afgewenteld was) want hij was zeer groot.", "Joh 8:49": "Jezus antwoordde: Ik heb de duivel niet; maar Ik eer Mijn Vader, en u onteert Mij.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Jak 1:21": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken.", "Hand 7:43": "Ja, u hebt de tent van Moloch opgenomen, en de ster van uw god Remfan, de beelden die u gemaakt hebt om die te aanbidden; en Ik zal u wegvoeren tot voorbij Babylon.", "Luk 4:12": "En Jezus antwoordde en zei tegen hem: Er is gezegd: U zult de Heere, uw God, niet verzoeken.", "Ps 35:1-3": "Een psalm van David. Twist, HEERE, met wie tegen mij twisten; strijd tegen wie tegen mij strijden. Grijp het schild en de rondas, en sta op tot mijn hulp. En breng de spies naar voren, en sluit de weg toe voor mijn vervolgers; zeg tegen mijn ziel: Ik ben uw Heil.", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Matt 26:64": "Jezus zei tegen hem: U hebt het gezegd. Maar Ik zeg u: van nu af aan zult u de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen op de wolken van de hemel.", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Matt 27:28-31": "En nadat zij Hem ontkleed hadden, deden zij Hem een purperen mantel om; en zij vlochten een kroon van doornen en zetten die op Zijn hoofd, en gaven Hem een rietstok in Zijn rechterhand; en zij vielen voor Hem op de knieën en bespotten Hem, en zeiden: Gegroet, Koning van de Joden! En zij spuugden op Hem, en namen de rietstok en sloegen Hem op Zijn hoofd.", "Mark 14:43-65": "En meteen, terwijl Hij nog sprak, kwam Judas eraan, één van de twaalf, en met hem een grote menigte, met zwaarden en stokken, gestuurd door de overpriesters, en de Schriftgeleerden, en de oudsten. En hij die Hem verried, had hun een teken gegeven, en gezegd: Degene die ik zal kussen, die is het; grijp Hem, en leid Hem veilig weg. En toen hij gekomen was, ging hij meteen naar Hem toe, en zei: Rabbi, en hij kuste Hem.", "Job 31:30": "(Ook heb ik mijn gehemelte niet toegelaten te zondigen, door een vloek zijn ziel te begeren).", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Joh 7:42": "Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?", "Joh 5:46": "Want als u Mozes geloofde, zou u Mij geloven; want hij heeft van Mij geschreven.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Hand 27:43": "Maar de hoofdman, die Paulus wilde redden, verhinderde hun dat plan, en beval dat wie kon zwemmen, zich eerst zou afwerpen om aan land te komen;", "Rom 9:12": "werd tot haar gezegd: De oudste zal de jongste dienen.", "Joh 15:23": "Die Mij haat, die haat ook Mijn Vader.", "Joh 18:19": "De hogepriester dan vroeg Jezus naar Zijn discipelen en naar Zijn onderricht.", "Joh 19:38": "En daarna vroeg Jozef van Arimathea (die een discipel van Jezus was, maar in het verborgene, uit vrees voor de Joden) Pilatus, of hij het lichaam van Jezus mocht wegnemen; en Pilatus stond het toe. Hij ging dan en nam het lichaam van Jezus weg.", "Ps 10:7": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.", "Luk 4:42": "En toen het dag werd, ging Hij weg en trok naar een woeste plaats; en de menigten zochten Hem, en kwamen naar Hem toe, en hielden Hem tegen, opdat Hij niet van hen weg zou gaan.", "Matt 27:13": "Toen zei Pilatus tegen Hem: Hoort U niet hoeveel zij tegen U getuigen?", "Joh 12:32-34": "En Ik, wanneer Ik van de aarde verhoogd zal zijn, zal allen tot Mij trekken. (En dit zei Hij, om aan te duiden wat voor dood Hij sterven zou.) De menigte antwoordde Hem: Wij hebben uit de wet gehoord dat de Christus blijft tot in eeuwigheid; en hoe zegt U dat de Zoon des mensen verhoogd moet worden? Wie is deze Zoon des mensen?", "Hand 23:17": "En Paulus riep een van de hoofdmannen over honderd bij zich en zei: Breng deze jongeman naar de aanvoerder, want hij heeft hem iets mee te delen.", "Spr 18:4": "De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.", "Ps 28:1": "Een psalm van David. Tot U roep ik, HEERE! Mijn Rotssteen, houd U niet als doof van mij af; anders, als U zich stil houdt voor mij, word ik gelijk aan degenen die in de kuil neerdalen.", "Luk 17:25": "Maar eerst moet Hij veel lijden, en verworpen worden door dit geslacht.", "Gen 21:10": "En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.", "Luk 12:50": "Maar Ik moet met een doop gedoopt worden; en hoe beklemd voel Ik Mij, totdat het volbracht is!", "Joh 8:42": "Jezus zei dan tegen hen: Als God uw Vader was, zou u Mij liefhebben; want Ik ben van God uitgegaan, en Ik kom van Hem. Want Ik ben ook niet uit Mijzelf gekomen, maar Hij heeft Mij gezonden.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Ps 56:7": "Zij rotten samen, zij versteken zich, zij letten op mijn hielen, zoals zij die op mijn ziel wachten.", "Gal 1:19": "En ik zag geen andere van de apostelen, dan Jakobus, de broer van de Heere.", "Job 30:8-12": "Zij waren kinderen van dwazen, en kinderen zonder naam; zij waren uit het land verjaagd. Maar nu ben ik hun een spotlied geworden, en ik ben hun tot een spreekwoord. Zij hebben een afschuw van mij, zij houden zich ver van mij, ja, zij weerhouden zich er niet van om voor mijn aangezicht te spugen.", "Mark 6:3": "Is Deze niet de timmerman, de zoon van Maria, en de broer van Jakobus en Joses, en van Judas en Simon? En zijn Zijn zusters niet hier bij ons? En zij namen aanstoot aan Hem.", "Joh 8:37": "Ik weet dat u Abrahams nageslacht bent; maar u probeert Mij te doden, want Mijn woord heeft in u geen plaats.", "Jes 53:4-6": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen. Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "Ps 119:41": "Vau. En dat mij Uw blijken van goedertierenheid overkomen, o HEERE! Uw heil, naar Uw toezegging;", "Matt 27:54": "En de hoofdman over honderd, en zij die met hem Jezus bewaakten, zagen de aardbeving en de dingen die gebeurd waren, en werden zeer bevreesd, en zeiden: Waarlijk, Deze was Gods Zoon!", "Ps 74:10": "Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?", "Rom 4:7": "En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn;", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Mark 14:53-66": "En zij leidden Jezus weg naar de hogepriester; en bij hem kwamen alle overpriesters, en de oudsten, en de Schriftgeleerden bijeen. En Petrus volgde Hem van verre, tot binnen in de zaal van de hogepriester, en hij zat bij de dienaren, en warmde zich bij het vuur. En de overpriesters, en de hele Raad, zochten getuigenis tegen Jezus, om Hem te doden, en vonden het niet.", "Est 3:2-5": "En alle knechten van de koning die in de poort van de koning waren, knielden en bogen zich neer voor Haman; want de koning had zo over hem bevolen; maar Mordechai knielde niet, en boog zich niet neer. Toen zeiden de knechten van de koning die in de poort van de koning waren, tegen Mordechai: Waarom overtreedt u het gebod van de koning? Het gebeurde nu, toen zij dit van dag tot dag tegen hem zeiden, en hij niet naar hen luisterde, dat zij het aan Haman lieten weten, om te zien of de woorden van Mordechai stand zouden houden; want hij had hun laten weten dat hij een Jood was.", "Ps 119:22": "Wentel van mij smaad en verachting, want ik heb Uw getuigenissen onderhouden.", "Rom 15:12": "En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "1 Kor 14:21": "In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en toch zullen zij Mij ook zo niet horen, zegt de Heere.", "Matt 8:1": "Toen Hij van de berg afgeklommen was, volgden vele menigten Hem.", "Ex 13:2": "Heilig voor Mij alle eerstgeborenen; wat er ook onder de kinderen van Israël de baarmoeder opent, van mensen en van dieren, dat is Mijn eigendom.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Klaagl 3:52": "Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.", "Joh 12:34": "De menigte antwoordde Hem: Wij hebben uit de wet gehoord dat de Christus blijft tot in eeuwigheid; en hoe zegt U dat de Zoon des mensen verhoogd moet worden? Wie is deze Zoon des mensen?", "Matt 27:27-31": "Toen namen de soldaten van de stadhouder Jezus mee naar het rechthuis, en verzamelden de hele legerafdeling om Hem heen. En nadat zij Hem ontkleed hadden, deden zij Hem een purperen mantel om; en zij vlochten een kroon van doornen en zetten die op Zijn hoofd, en gaven Hem een rietstok in Zijn rechterhand; en zij vielen voor Hem op de knieën en bespotten Hem, en zeiden: Gegroet, Koning van de Joden!", "Ex 20:15": "U zult niet stelen.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "1 Kor 15:45": "Zo staat er ook geschreven: De eerste mens Adam is geworden tot een levende ziel; de laatste Adam tot een levendmakende Geest.", "Spr 21:7": "De verwoesting van de goddelozen zal hen doorsnijden, omdat zij weigeren recht te doen.", "Hand 21:32": "Deze nam meteen soldaten en hoofdmannen over honderd mee, en snelde naar hen toe. Toen zij nu de leider en de soldaten zagen, hielden zij op Paulus te slaan.", "2 Kor 12:8": "Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Gen 15:13": "Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "Matt 17:11-13": "Jezus antwoordde en zei tegen hen: Elia zal inderdaad eerst komen en alles herstellen. Maar Ik zeg u dat Elia al gekomen is, en zij hebben hem niet erkend; maar zij hebben met hem gedaan wat zij wilden. Zo zal ook de Zoon des mensen door hen lijden. Toen begrepen de discipelen dat Hij tot hen over Johannes de Doper had gesproken.", "2 Kron 6:24-39": "En wanneer Uw volk Israël voor het aangezicht van de vijand geslagen zal worden, omdat zij tegen U gezondigd zullen hebben, en zich bekeren, en Uw Naam belijden, en voor Uw aangezicht in dit huis bidden en smeken zullen, Hoor U dan uit de hemel, en vergeef de zonden van Uw volk Israël, en breng hen terug in het land dat U hun en hun vaders gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben, en zij in deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Ps 55:12": "Enkel verderf is binnen in haar; en list en bedrog wijkt niet van haar straat.", "Luk 2:24": "En om een offer te geven, naar wat in de wet van de Heere gezegd is, een paar tortelduiven of twee jonge duiven.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Mark 8:11": "En de Farizeeën gingen naar buiten, en begonnen met Hem te twisten, en verlangden van Hem een teken uit de hemel, om Hem op de proef te stellen.", "Matt 6:19": "Verzamel voor uzelf geen schatten op de aarde, waar de mot en de roest ze verderven, en waar de dieven inbreken en stelen;", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Ps 55:2-18": "O God! neem mijn gebed ter ore, en verberg U niet voor mijn smeking. Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier; Om het geroep van de vijand, vanwege de beangstiging van de goddeloze; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.", "Mark 14:10": "En Judas Iskariot, een van de twaalf, ging naar de overpriesters, om Hem aan hen over te leveren.", "Luk 23:53": "En toen hij het afgenomen had, wikkelde hij het in fijn linnen, en legde het in een graf dat in de rots uitgehouwen was, waarin nog nooit iemand gelegen had.", "Klaagl 5:1": "Denk, HEERE, aan wat ons gebeurd is, kijk ernaar en zie onze smaad aan.", "Rom 3:15-17": "hun voeten zijn snel om bloed te vergieten; vernieling en ellende is op hun wegen; en de weg van de vrede hebben zij niet gekend.", "Ps 79:1": "Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt.", "Joh 19:18-30": "waar zij Hem kruisigden, en met Hem twee anderen, aan elke zijde één, en Jezus in het midden. En Pilatus schreef ook een opschrift, en zette dat op het kruis; en er stond geschreven: JEZUS DE NAZARENER, DE KONING VAN DE JODEN. Dit opschrift lazen dan velen van de Joden; want de plaats waar Jezus gekruisigd werd, was dicht bij de stad; en het was geschreven in het Hebreeuws, in het Grieks, en in het Latijn.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Hebr 13:13": "Laten wij dan naar Hem uitgaan, buiten de legerplaats, terwijl wij Zijn smaad dragen.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Hebr 7:3": "zonder vader, zonder moeder, zonder geslachtsregister, zonder begin van dagen of einde van leven, maar gelijk geworden aan de Zoon van God, blijft hij een priester voor eeuwig.", "Matt 12:14": "En de Farizeeën gingen naar buiten en beraadslaagden samen tegen Hem, hoe zij Hem konden doden.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Ps 62:11": "Vertrouw niet op onderdrukking, en word niet ijdel door roverij; als het vermogen overvloedig toeneemt, zet er het hart niet op.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Amos 8:9": "En het zal op die dag gebeuren, spreekt de Heere HEERE, dat Ik de zon op de middag zal doen ondergaan, en het land op klaarlichte dag zal verduisteren.", "Mark 14:27": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.", "2 Kor 1:5": "Want zoals het lijden van Christus overvloedig is in ons, zo is ook door Christus onze vertroosting overvloedig.", "Matt 27:4": "en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien.", "Ex 21:24": "oog voor oog, tand voor tand, hand voor hand, voet voor voet,", "Luk 23:3": "En Pilatus vroeg Hem: Bent U de Koning van de Joden? En Hij antwoordde hem en zei: U zegt het.", "Mark 2:15": "En het gebeurde, terwijl Hij in Zijn huis aanzat, dat er ook veel tollenaars en zondaars mee aanzaten met Jezus en Zijn discipelen; want er waren er velen, en zij waren Hem gevolgd.", "Ps 86:14": "O God! de hoogmoedigen staan tegen mij op, en de bijeenkomsten van de tirannen zoeken mijn ziel; en zij houden U niet voor ogen.", "Ps 119:170": "Laat mijn smeken voor Uw aanschijn komen, red mij naar Uw toezegging.", "Luk 1:35": "En de engel antwoordde en zei tegen haar: De Heilige Geest zal over u komen, en de kracht van de Allerhoogste zal u overschaduwen; daarom zal ook dat Heilige Dat uit u geboren zal worden, Gods Zoon genoemd worden.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Mark 15:9-15": "En Pilatus antwoordde hun, en zei: Wilt u dat ik u de Koning van de Joden loslaat? (Want hij wist dat de overpriesters Hem uit afgunst overgeleverd hadden.) Maar de overpriesters brachten de menigte ertoe dat hij hun liever Barabbas zou loslaten.", "Matt 5:27": "U hebt gehoord dat gezegd is: U zult geen overspel plegen.", "Luk 23:16": "Ik zal Hem dan kastijden en loslaten.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Ps 142:6-8": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden. Let op mijn geschrei, want ik ben zeer uitgeput; red mij van mijn vervolgers, want zij zijn sterker dan ik. Voer mijn ziel uit de gevangenis, om Uw Naam te loven; de rechtvaardigen zullen mij omringen, wanneer U goed voor mij zult zijn geweest.", "Ps 102:25": "Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht.", "Hand 8:32": "En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.", "Nahum 3:1": "Wee de bloedstad, die helemaal vol leugen en verscheuring is! De roof houdt niet op.", "Matt 27:57": "En toen het avond geworden was, kwam er een rijk man uit Arimathea, genaamd Jozef, die ook zelf een discipel van Jezus was.", "Joh 15:21": "Maar al deze dingen zullen zij u doen om Mijn Naam, omdat zij Hem niet kennen, Die Mij gezonden heeft.", "Ps 140:2-14": "Red mij, HEERE, van de kwade mens; behoed mij voor de man van geweld; Die veel kwaad in het hart bedenken, elke dag komen zij samen om te oorlogen. Zij scherpen hun tong als een slang; heet addervergif is onder hun lippen. Sela.", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "Mark 9:11-13": "En zij vroegen Hem: Waarom zeggen de Schriftgeleerden dat Elia eerst moet komen? En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en het zal gebeuren, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden. Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.", "Ps 35:15": "Maar toen ik hinkte, waren zij verblijd, en verzamelden zich; zij verzamelden zich tegen mij als geslagenen, en ik merkte niets; zij scheurden hun kleren, en zwegen niet stil.", "Luk 23:25": "En hij liet hem los die om oproer en doodslag in de gevangenis geworpen was, die zij geëist hadden; maar Jezus gaf hij over aan hun wil.", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Luk 23:36": "En ook de soldaten kwamen naar Hem toe en bespotten Hem, en brachten Hem azijn;", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Mark 11:8-10": "En velen spreidden hun kleren op de weg, en anderen hakten takken van de bomen, en spreidden ze op de weg. En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere! Gezegend zij het Koninkrijk van onze vader David, dat komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Matt 27:44": "En hetzelfde verweten Hem ook de rovers die met Hem gekruisigd waren.", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Matt 26:47": "En terwijl Hij nog sprak, zie, Judas, één van de twaalf, kwam, en met hem een grote menigte met zwaarden en stokken, gezonden door de overpriesters en oudsten van het volk.", "Matt 2:5": "Zij zeiden tegen hem: In Bethlehem, in Judea; want zo is geschreven door de profeet:", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "Jes 64:9-12": "HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting. Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Joh 19:38-42": "En daarna vroeg Jozef van Arimathea (die een discipel van Jezus was, maar in het verborgene, uit vrees voor de Joden) Pilatus, of hij het lichaam van Jezus mocht wegnemen; en Pilatus stond het toe. Hij ging dan en nam het lichaam van Jezus weg. En Nicodemus kwam ook (die eerst 's nachts naar Jezus toe was gekomen), en bracht een mengsel van mirre en aloë, ongeveer honderd pond van het gewicht. Zij namen dan het lichaam van Jezus, en bonden dat in linnen doeken met de specerijen, zoals de Joden de gewoonte hebben van begraven.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Deut 5:19": "En u zult niet stelen.", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Luk 19:36-38": "En terwijl Hij verder reisde, spreidden zij hun kleren op de weg. En toen Hij nu in de buurt kwam van de afdaling van de Olijfberg, begon heel de menigte van de discipelen zich te verblijden, en God te loven met luide stem, vanwege alle krachtige daden die zij gezien hadden, en zij zeiden: Gezegend is de Koning, Die komt in de Naam van de Heere! Vrede in de hemel, en heerlijkheid in de hoogste hemelen!", "Mark 7:37": "En zij waren bovenmate verbaasd, en zeiden: Hij heeft alles goed gedaan, en Hij maakt dat de doven horen, en de stommen spreken.", "Matt 21:16": "en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzelf lof toebereid?", "Matt 27:40": "en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af.", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Joh 13:19": "Van nu af zeg Ik het u, voordat het gebeurd is, opdat u, wanneer het gebeurd zal zijn, kunt geloven dat Ik het ben.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Matt 16:15-17": "Hij zei tegen hen: Maar u, wie zegt u dat Ik ben? En Simon Petrus antwoordde en zei: U bent de Christus, de Zoon van de levende God. En Jezus antwoordde en zei tegen hem: Zalig bent u, Simon, Bar-Jona! Want vlees en bloed heeft u dat niet geopenbaard, maar Mijn Vader, Die in de hemelen is.", "Joh 6:38": "Want Ik ben uit de hemel neergedaald, niet om Mijn eigen wil te doen, maar de wil van Hem die Mij gezonden heeft.", "Joh 12:41": "Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.", "2 Sam 12:22": "En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.", "Jes 32:6": "Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken.", "Matt 27:11-14": "En Jezus stond voor de stadhouder; en de stadhouder vroeg Hem: Bent U de Koning van de Joden? En Jezus zei tegen hem: U zegt het. En toen Hij door de overpriesters en de oudsten beschuldigd werd, antwoordde Hij niets. Toen zei Pilatus tegen Hem: Hoort U niet hoeveel zij tegen U getuigen?", "Gen 4:4-6": "En Abel bracht ook van de eerstgeborenen van zijn schapen, en van hun vet. En de HEERE zag Abel en zijn offer met welgevallen aan; maar Kaïn en zijn offer zag Hij niet met welgevallen aan. Toen ontstak Kaïn zeer, en zijn gezicht betrok. En de HEERE zei tegen Kaïn: Waarom bent u ontstoken, en waarom is uw gezicht betrokken?", "Matt 11:19": "De Zoon des mensen is gekomen, etend en drinkend, en zij zeggen: Zie daar, een Mens, Die een vraat en wijnzuiper is, een Vriend van tollenaars en zondaars. Maar de Wijsheid is gerechtvaardigd door haar kinderen.", "Joh 19:4-13": "Pilatus kwam dan weer naar buiten, en zei tegen hen: Zie, ik breng Hem naar buiten tot u, zodat u weet dat ik in Hem geen schuld vind. Jezus kwam dan naar buiten, met de doornenkroon en het purperen kleed. En Pilatus zei tegen hen: Zie, de Mens! Toen de overpriesters en de dienaars Hem dan zagen, riepen zij: Kruisig Hem, kruisig Hem! Pilatus zei tegen hen: Neemt u Hem en kruisigt Hem; want ik vind in Hem geen schuld.", "Hand 28:25-27": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders, Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken. Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "Openb 19:13": "En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God.", "Ps 18:50": "Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;", "Joh 20:11-13": "En Maria stond buiten bij het graf te huilen. Terwijl zij dan huilde, boog zij zich voorover naar het graf, en zag twee engelen in witte kleren zitten, een aan het hoofd en een aan de voeten, waar het lichaam van Jezus gelegen had. En zij zeiden tegen haar: Vrouw, waarom huilt u? Zij zei tegen hen: Omdat ze mijn Heere weggenomen hebben, en ik weet niet waar ze Hem hebben neergelegd.", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Hand 23:1-7": "En Paulus keek de raad recht aan en zei: Mannen broeders! Ik heb met een geheel goed geweten voor God geleefd tot op deze dag. Maar de hogepriester Ananias beval hun die bij hem stonden dat zij hem op de mond zouden slaan. Toen zei Paulus tegen hem: God zal u slaan, u witgepleisterde muur! Zit u daar om mij naar de wet te oordelen, en beveelt u, tegen de wet in, dat men mij zal slaan?", "Hand 5:29-32": "Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen. De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen. Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Matt 26:63": "Maar Jezus zweeg stil. En de hogepriester antwoordde en zei tegen Hem: Ik bezweer U bij de levende God dat U ons zegt of U de Christus bent, de Zoon van God.", "Joh 18:39": "Maar u hebt een gewoonte dat ik u met het pascha iemand loslaat. Wilt u dan dat ik u de Koning van de Joden loslaat?", "Ps 62:5": "Zij overleggen slechts om hem van zijn hoogheid te verstoten; zij hebben behagen in leugen; met hun mond zegenen zij, maar met hun binnenste vloeken zij. Sela.", "Matt 20:18": "Zie, wij gaan naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters en Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen;", "Joh 16:28": "Ik ben van de Vader uitgegaan, en ben in de wereld gekomen; opnieuw verlaat Ik de wereld, en ga heen tot de Vader.", "Luk 11:16": "En anderen, om Hem te verzoeken, verlangden van Hem een teken uit de hemel.", "Joh 20:17": "Jezus zei tegen haar: Raak Mij niet aan, want Ik ben nog niet opgevaren naar Mijn Vader; maar ga naar Mijn broeders, en zeg hun: Ik vaar op naar Mijn Vader en uw Vader, en naar Mijn God en uw God.", "Luk 21:25": "En er zullen tekenen zijn in de zon, en maan, en sterren, en op de aarde benauwdheid van de volken met radeloosheid, wanneer de zee en de watergolven groot geluid zullen geven;", "Ps 35:19-21": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten. Want zij spreken niet van vrede, maar zij bedenken bedrieglijke zaken tegen de stillen in het land. En zij sperren hun mond wijd open tegen mij; zij zeggen: Ha, ha, ons oog heeft het gezien!", "Ps 129:3": "Ploegers hebben op mijn rug geploegd; zij hebben hun voren lang uitgetrokken.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Spr 6:19": "een vals getuige, die leugens uitblaast; en wie ruzie zaait tussen broeders.", "1 Joh 4:10": "Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Jes 29:20": "Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Deut 25:4": "Een os zult u niet muilbanden, als hij graan dorst.", "Luk 7:13": "En de Heere, haar ziende, werd innerlijk met ontferming over haar bewogen, en zei tegen haar: Huil niet.", "Jes 40:6-8": "Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld. Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras. Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "1 Kon 19:14": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "Jes 50:4": "De Heere HEERE heeft Mij een tong van de geleerden gegeven, opdat Ik weet met de moede een woord op de juiste tijd te spreken; Hij wekt elke morgen, Hij wekt Mijn oor, opdat Ik hoor, zoals wie geleerd worden.", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "Matt 27:41-43": "En evenzo zeiden ook de overpriesters, met de schriftgeleerden en oudsten, en Farizeeën, terwijl zij Hem bespotten: Anderen heeft Hij verlost, Zichzelf kan Hij niet verlossen. Als Hij de Koning van Israël is, laat Hij nu van het kruis afkomen, en wij zullen Hem geloven. Hij heeft op God vertrouwd; laat God Hem nu verlossen, als Hij Hem tenminste wil hebben; want Hij heeft gezegd: Ik ben Gods Zoon.", "Matt 20:19": "en zij zullen Hem aan de heidenen overleveren, om Hem te bespotten en te geselen en te kruisigen; en op de derde dag zal Hij weer opstaan.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Joh 1:1": "In het begin was het Woord, en het Woord was bij God, en het Woord was God.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Ps 22:13-15": "Veel stieren hebben mij omsingeld, sterke stieren van Basan hebben mij omringd. Zij hebben hun mond tegen mij opgesperd, als een verscheurende en brullende leeuw. Ik ben uitgestort als water, en al mijn beenderen hebben zich vaneen gescheiden; mijn hart is als was, het is gesmolten in het midden van mijn ingewand.", "Jes 54:1": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.", "Gen 2:7": "En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.", "Hand 4:1-21": "Terwijl zij tot het volk spraken, kwamen de priesters, en de hoofdman van de tempel, en de Sadduceeën op hen af, Zeer ontevreden, omdat zij het volk leerden en in Jezus de opstanding uit de doden verkondigden. En zij sloegen de handen aan hen, en zetten ze gevangen tot de volgende dag; want het was al avond.", "Mark 9:44": "Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Ps 142:2": "Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem.", "Ps 21:12": "Want zij hebben kwaad tegen U aangelegd; zij hebben een schandelijke daad bedacht, doch zullen niets vermogen.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Luk 23:41": "En wij toch terecht; want wij ontvangen straf die past bij wat wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.", "Ps 7:15-17": "Zie, hij is zwanger van onrecht, en heeft moeite ontvangen, hij zal leugen baren. Hij heeft een kuil gegraven, en hem uitgegraven, maar hij is gevallen in de groeve, die hij gemaakt heeft. Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "Mark 15:1-5": "En meteen, vroeg in de morgen, hielden de overpriesters samen overleg, met de oudsten en Schriftgeleerden, en de hele Raad, en nadat zij Jezus gebonden hadden, brachten zij Hem weg, en gaven Hem aan Pilatus over. En Pilatus vroeg Hem: Bent U de Koning van de Joden? En Hij antwoordde en zei tegen hem: U zegt het. En de overpriesters beschuldigden Hem van veel zaken; maar Hij antwoordde niets.", "Joh 20:5": "En toen hij zich vooroverboog, zag hij de doeken liggen; toch ging hij er niet in.", "1 Kon 8:36-50": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt. Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn; elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Deut 17:9": "En u moet komen bij de Levitische priesters en bij de rechter die er in die dagen is; en u moet vragen, en zij zullen u de rechterlijke uitspraak bekendmaken.", "Hand 7:34": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "1 Joh 4:14": "En wij hebben het gezien, en getuigen dat de Vader Zijn Zoon gezonden heeft tot een Zaligmaker van de wereld.", "Mark 8:31": "En Hij begon hun te leren dat de Zoon des mensen veel moest lijden, en verworpen moest worden door de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en na drie dagen weer moest opstaan.", "Klaagl 1:12": "Lamed. Gaat het u niet aan, u allen, die over de weg gaat? Schouwt het aan en ziet, of er een smart is gelijk mijn smart, die mij aangedaan is, waarmee de HEERE mij bedroefd heeft ten dage van de gloed van Zijn toorn.", "Joz 7:25": "En Jozua zei: Hoe hebt u ons in het ongeluk gestort? De HEERE zal u op deze dag in het ongeluk storten! En heel Israël stenigde hem met stenen, en zij verbrandden hen met vuur, en overwierpen hen met stenen.", "Ps 74:11": "Waarom trekt U Uw hand, ja, Uw rechterhand terug? Trek haar uit het midden van Uw boezem; maak er een einde aan.", "Luk 6:11": "Maar zij werden vervuld met woede, en overlegden met elkaar wat zij Jezus zouden aandoen.", "Ps 119:39": "Wend mijn smaad af, die ik vrees, want Uw rechten zijn goed.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Jes 52:14": "Zoals velen zich over u ontzet hebben — zo misvormd was Zijn gelaat, meer dan van iemand anders, en Zijn gedaante, meer dan van andere mensenkinderen —", "Spr 17:15": "Wie de goddeloze rechtvaardigt, en de rechtvaardige veroordeelt, zijn de HEERE een gruwel, zij beiden.", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Luk 22:66-71": "En toen het dag geworden was, kwamen de oudsten van het volk samen, en de overpriesters en Schriftgeleerden, en brachten Hem in hun raad, en zeiden: Bent U de Christus, zeg het ons. En Hij zei tegen hen: Als Ik het u zeg, zult u het niet geloven; en als Ik u ook vraag, zult u Mij niet antwoorden, of Mij loslaten;", "2 Sam 22:7": "Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; en Hij hoorde mijn stem uit Zijn paleis, en mijn geroep kwam in Zijn oren.", "Ex 16:18": "Maar toen zij het met de gomer maten, had hij die veel verzameld had, niets over, en hem die weinig verzameld had, ontbrak niets; ieder verzamelde zoveel als hij eten kon.", "Ps 59:4": "Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "Hand 13:45": "Doch de Joden, die de menigten zagen, werden vervuld met afgunst, en weerspraken wat door Paulus gezegd werd, en tegenspraken en lasterden.", "Ps 4:3": "U, mannen, hoe lang zal mijn eer tot schande zijn? Hoe lang zult u de ijdelheid liefhebben, de leugen zoeken? Sela.", "Openb 8:12": "En de vierde engel heeft op de bazuin geblazen, en het derde deel van de zon werd getroffen, en het derde deel van de maan, en het derde deel van de sterren; zodat het derde deel daarvan verduisterd zou worden, en het derde deel van de dag niet zou lichten; en van de nacht evenzo.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "Matt 27:31-37": "En nadat zij Hem bespot hadden, deden zij Hem de mantel af, en deden Hem Zijn eigen kleren aan, en leidden Hem weg om Hem te kruisigen. En toen zij naar buiten gingen, vonden zij een man uit Cyrene, genaamd Simon; hem dwongen zij om Zijn kruis te dragen. En toen zij gekomen waren op de plaats die Golgotha genoemd wordt, dat wil zeggen: Hoofdschedelplaats,", "Luk 23:50": "En zie, een man met de naam Jozef, een raadsheer, een goed en rechtvaardig man,", "Jes 10:7": "Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Ps 22:7": "Maar ik ben een worm en geen man, een smaad van mensen, en veracht van het volk.", "Deut 24:15": "Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.", "Luk 23:39-43": "En een van de kwaaddoeners die daar hingen, lasterde Hem en zei: Als U de Christus bent, verlos Uzelf en ons. Maar de ander antwoordde en bestrafte hem: Vreest u ook God niet, terwijl u in hetzelfde oordeel bent? En wij toch terecht; want wij ontvangen straf die past bij wat wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.", "Ps 71:7": "Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "Ps 69:20": "U weet mijn smaad, en mijn schaamte, en mijn schande; al mijn belagers zijn voor U.", "Gal 4:27": "Want er is geschreven: Wees vrolijk, u onvruchtbare, die niet baart, breek uit en roep, u die geen weeën hebt, want de kinderen van de eenzame zijn veel meer dan van haar die de man heeft.", "1 Petr 2:25": "Want u was als dwalende schapen; maar u bent nu bekeerd tot de Herder en Opziener van uw zielen.", "Joh 8:59": "Toen namen zij stenen op om die op Hem te werpen. Maar Jezus verborg Zich, en ging de tempel uit, terwijl Hij door hun midden ging; en zo ging Hij weg.", "Ps 34:13-17": "Mem. Wie is de man die lust heeft ten leven, die dagen liefheeft om het goede te zien? Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog. Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Mark 15:23-38": "En zij gaven Hem wijn met mirre vermengd te drinken; maar Hij nam die niet aan. En toen zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, en wierpen het lot erover, wat ieder zou wegnemen. En het was het derde uur, en zij kruisigden Hem.", "Jes 8:23": "Maar het land dat beangstigd was, zal niet helemaal verduisterd worden; zoals Hij het in de eerste tijd verachtelijk gemaakt heeft, naar het land van Zebulon toe en naar het land van Nafthali toe, zo heeft Hij het in het laatste heerlijk gemaakt, naar de weg zeewaarts toe gelegen over de Jordaan, aan Galilea van de heidenen.", "Joh 12:14": "En Jezus vond een jonge ezel, en ging daarop zitten, zoals geschreven is:", "Ex 17:4": "Toen riep Mozes tot de HEERE en zei: Wat moet ik met dit volk doen? Het scheelt niet veel, of zij zullen mij stenigen.", "Job 15:35": "Zij ontvangen moeite, en baren ijdelheid, en hun buik richt bedrog aan.", "Hand 4:8-13": "Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël! Als wij vandaag ondervraagd worden over de weldaad aan een zieke mens gedaan, waardoor hij gezond geworden is; Laat het u allen bekend zijn, en het hele volk van Israël, dat door de Naam van Jezus Christus, de Nazarener, Die u gekruisigd hebt, Die God uit de doden heeft opgewekt, door Hem, zeg ik, staat deze man hier gezond voor u.", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Matt 27:32": "En toen zij naar buiten gingen, vonden zij een man uit Cyrene, genaamd Simon; hem dwongen zij om Zijn kruis te dragen.", "Matt 27:34-53": "gaven zij Hem azijn te drinken, gemengd met gal; en toen Hij dat geproefd had, wilde Hij niet drinken. Nadat zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, door het lot te werpen; opdat vervuld zou worden wat gezegd is door de profeet: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. En zij gingen zitten en bewaakten Hem daar.", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Ps 69:23": "Hun tafel moet voor hun gezicht tot een strik worden, en tot volle vergelding tot een valstrik.", "Mark 7:22": "diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid.", "Joh 2:18-22": "De Joden antwoordden dan en zeiden tegen Hem: Welk teken toont U ons, dat U deze dingen doet? Jezus antwoordde en zei tegen hen: Breek deze tempel af, en in drie dagen zal Ik hem oprichten. De Joden zeiden dan: Zesenveertig jaar is aan deze tempel gebouwd, en zult U hem in drie dagen oprichten?", "Matt 7:28": "En het gebeurde, toen Jezus deze woorden geëindigd had, dat de menigten versteld stonden over Zijn onderwijs;", "Lev 6:2-7": "Als een mens gezondigd heeft en tegen de HEERE door overtreding overtreden zal hebben, doordat hij tegen zijn naaste gelogen heeft over iets dat hem in bewaring gegeven was, of ter hand gesteld was, of over roof, of dat hij met geweld zijn naaste iets onthoudt; Of dat hij het verlorene gevonden heeft, en daarover gelogen heeft, en met valsheid gezworen zal hebben; over iets van alles dat de mens doet, waarin hij zo zondigt. Dan zal het gebeuren, omdat hij gezondigd heeft en schuldig geworden is, dat hij zal teruggeven de roof die hij geroofd heeft, of het onthoudene dat hij met geweld onthoudt, of het bewaarde dat bij hem te bewaren gegeven was, of het verlorene dat hij gevonden heeft;", "Spr 26:27": "Wie een kuil graaft, zal erin vallen, en wie een steen wentelt, op hem zal die terugkeren.", "Joh 7:31": "En velen uit de menigte geloofden in Hem en zeiden: Zal de Christus, wanneer Hij gekomen zal zijn, meer tekenen doen dan deze, die Deze gedaan heeft?", "Ruth 4:2-5": "En hij nam tien mannen van de oudsten van de stad en zei: Zet u hier neer; en zij zetten zich neer. Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht. En ik heb gezegd: Ik zal het voor uw oor bekendmaken en zeggen: Koop het in tegenwoordigheid van de inwoners en in tegenwoordigheid van de oudsten van mijn volk; als u het zult lossen, los het; en als men het niet zou lossen, verklaar het mij, zodat ik het weet; want er is niemand behalve u die het kan lossen, en ik na u. Toen zei hij: Ik zal het lossen.", "Mark 10:33": "En Hij zei: Zie, wij gaan op naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters, en aan de Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen, en Hem aan de heidenen overleveren;", "Fil 3:10": "Opdat ik Hem ken, en de kracht van Zijn opstanding, en de gemeenschap met Zijn lijden, gelijkvormig wordend aan Zijn dood;", "Hand 6:9": "En er stonden sommigen op uit de synagoge die de synagoge van de Vrijgelatenen genoemd wordt, en van de Cyreneeërs, en van de Alexandrijnen, en van hen die uit Cilicië en Azië waren, en zij redetwistten met Stefanus.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Spr 24:29": "Zeg niet: Zoals hij mij gedaan heeft, zo zal ik hem doen; ik zal ieder vergelden naar zijn werk.", "Matt 27:42": "Anderen heeft Hij verlost, Zichzelf kan Hij niet verlossen. Als Hij de Koning van Israël is, laat Hij nu van het kruis afkomen, en wij zullen Hem geloven.", "Matt 27:20": "Maar de overpriesters en de oudsten haalden de menigte over dat zij Barabbas zouden vragen, en Jezus zouden laten doden.", "2 Petr 2:22": "Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "Ps 119:153": "Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Neh 5:15": "En de vorige landvoogden, die vóór mij geweest zijn, hebben het volk bezwaard en van hen genomen aan brood en wijn, daarna veertig zilveren sikkels; ook heersten hun knechten over het volk; maar ik heb dat niet gedaan, om de vreze van God.", "Joh 7:51": "Oordeelt onze wet soms een mens, zonder dat zij hem eerst gehoord heeft en weet wat hij doet?", "Mark 6:33": "En de menigten zagen hen weggaan, en velen herkenden Hem, en liepen gezamenlijk te voet van alle steden daarheen, en kwamen hun voor, en kwamen samen naar Hem toe.", "Hebr 5:8": "Hoewel Hij de Zoon was, heeft Hij toch gehoorzaamheid geleerd uit wat Hij geleden heeft.", "Deut 24:1": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis.", "Ex 20:14": "U zult geen echtbreuk plegen.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Hand 19:34": "Maar toen zij begrepen dat hij een Jood was, kwam er van allen één stem, die ongeveer twee uur lang riep: Groot is de Diana van de Efezeërs!", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Luk 22:42": "en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.", "1 Petr 2:21-23": "Want hiertoe bent u geroepen, omdat ook Christus voor ons geleden heeft, ons een voorbeeld nalatend, opdat u Zijn voetstappen zou navolgen; Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden; Die, toen Hij uitgescholden werd, niet terugschold, en toen Hij leed, niet dreigde; maar het overgaf aan Hem Die rechtvaardig oordeelt;", "1 Joh 3:13-15": "Verwonder u niet, mijn broeders, als de wereld u haat. Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood. Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Ps 39:13": "Hoor, HEERE, mijn gebed, en neem mijn geroep ter ore; zwijg niet bij mijn tranen; want ik ben een vreemdeling bij U, een bijwoner, zoals al mijn vaders.", "Joh 6:57": "Zoals de levende Vader Mij gezonden heeft, en Ik leef door de Vader; zo zal ook wie Mij eet, leven door Mij.", "Ps 22:8": "Allen die mij zien, bespotten mij; zij steken de lip uit, zij schudden het hoofd en zeggen:", "Mark 8:12": "En Hij, zwaar zuchtend in Zijn geest, zei: Waarom verlangt dit geslacht een teken? Voorwaar, Ik zeg u: Aan dit geslacht zal geen teken gegeven worden!", "Hand 8:33": "In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.", "Rom 9:29": "En zoals Jesaja van tevoren gezegd heeft: Als de Heere Sebaoth ons geen nageslacht had overgelaten, dan waren wij geworden als Sodom, en gelijk gemaakt aan Gomorra.", "Hand 4:11": "Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is.", "Joh 11:3": "Zijn zusters dan zonden tot Hem, en zeiden: Heere, zie, hij die U liefhebt, is ziek.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Mark 12:11": "Dit is door de Heere gebeurd, en het is wonderlijk in onze ogen?", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Ps 126:4": "O HEERE, keer onze gevangenschap, zoals waterstromen in het zuiden.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "Mark 15:6-15": "En met het feest liet hij hun één gevangene los, wie zij ook begeerden. En er was iemand, genaamd Barabbas, gevangen met andere medeoproermakers, die tijdens het oproer een moord had gepleegd. En de menigte riep uit, en begon te vragen dat hij deed, zoals hij hun altijd gedaan had.", "Joh 5:27": "en Hij heeft Hem macht gegeven om ook gericht te houden, omdat Hij de Zoon des mensen is.", "Spr 20:22": "Zeg niet: Ik zal het kwaad vergelden; wacht op de HEERE, en Hij zal u verlossen.", "2 Kor 6:5": "in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "1 Joh 2:22-24": "Wie is de leugenaar, dan wie loochent, dat Jezus de Christus is? Deze is de antichrist, die de Vader en de Zoon loochent. Ieder, die de Zoon loochent, heeft ook de Vader niet; wie de Zoon belijdt, heeft ook de Vader. Wat u dan vanaf het begin gehoord hebt, laat dat in u blijven. Als in u blijft, wat u vanaf het begin gehoord hebt, dan zult u ook in de Zoon en in de Vader blijven.", "Jak 5:13-16": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen. Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere. En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Spr 2:6": "Want de HEERE geeft wijsheid; uit Zijn mond komt kennis en verstand.", "Jes 5:30": "En zij zullen op die dag tegen hen bruisen, als het bruisen van de zee. Als men dan naar het land kijkt, zie, dan is er duisternis en benauwdheid, en het licht zal verduisterd worden in de wolken erboven.", "Matt 19:4": "Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Joh 19:42": "Daar legden zij Jezus dan, vanwege de voorbereiding van de Joden, omdat het graf dichtbij was.", "Mark 15:15-20": "Pilatus nu, die de menigte tevreden wilde stellen, liet hun Barabbas los, en gaf Jezus over, nadat hij Hem gegeseld had, om gekruisigd te worden. En de soldaten leidden Hem naar binnen in de zaal, welke het rechthuis is, en riepen de hele afdeling samen; En zij deden Hem een purperen mantel aan, en nadat zij een doornenkroon gevlochten hadden, zetten zij Hem die op;", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "Matt 12:40": "Want zoals Jona drie dagen en drie nachten in de buik van de walvis was, zo zal de Zoon des mensen drie dagen en drie nachten in het hart van de aarde zijn.", "1 Kor 2:2": "Want ik had besloten niets te weten onder u, dan Jezus Christus, en Die gekruisigd.", "Matt 4:24": "En het nieuws over Hem verspreidde zich door heel Syrië; en men bracht bij Hem allen die er slecht aan toe waren, met allerlei ziekten en pijnen bevangen, en van de duivel bezetenen, en maanzieken en verlamden; en Hij genas hen.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Ps 22:2-22": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen? Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte. Doch U bent heilig, wonende onder de lofzangen van Israël.", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "Joh 7:1": "Na deze dingen trok Jezus rond in Galilea; want Hij wilde niet in Judea rondtrekken, omdat de Joden Hem probeerden te doden.", "Joh 10:18": "Niemand neemt het van Mij, maar Ik leg het zelf af; Ik heb macht om het af te leggen, en Ik heb macht om het opnieuw te nemen. Dit gebod heb Ik van Mijn Vader ontvangen.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Joh 19:14-16": "En het was de voorbereiding van het pascha, en ongeveer het zesde uur; en hij zei tegen de Joden: Zie, uw Koning! Maar zij riepen: Weg met Hem, weg met Hem, kruisig Hem! Pilatus zei tegen hen: Zal ik uw Koning kruisigen? De overpriesters antwoordden: Wij hebben geen koning dan de keizer. Toen gaf hij Hem dan aan hen over, opdat Hij gekruisigd zou worden. En zij namen Jezus, en leidden Hem weg.", "Matt 27:22": "Pilatus zei tegen hen: Wat zal ik dan doen met Jezus, Die Christus genoemd wordt? Zij zeiden allen tegen hem: Laat Hem gekruisigd worden.", "Matt 2:13": "Toen zij vertrokken waren, zie, de engel van de Heere verschijnt aan Jozef in de droom en zegt: Sta op, neem het Kindje en Zijn moeder tot u, en vlucht naar Egypte, en blijf daar totdat ik het u zeg; want Herodes zal het Kindje zoeken om Het te doden.", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Joh 12:42": "Toch geloofden ook zelfs velen van de leiders in Hem; maar om de Farizeeën beleden zij het niet, opdat zij niet uit de synagoge geworpen zouden worden.", "Luk 14:27": "En wie zijn kruis niet draagt en Mij navolgt, die kan Mijn discipel niet zijn.", "Deut 6:16": "U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Mark 1:37": "En toen zij Hem gevonden hadden, zeiden zij tegen Hem: Iedereen zoekt U.", "Fil 1:13": "Zodat mijn banden in Christus openbaar geworden zijn in het hele rechthuis, en aan alle anderen;", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Matt 26:38-45": "Toen zei Hij tegen hen: Mijn ziel is zeer bedroefd, tot de dood toe; blijft hier en waakt met Mij. En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt. En Hij kwam bij de discipelen en vond hen slapend, en zei tegen Petrus: Kunt u dan niet één uur met Mij waken?", "Mark 6:2": "En toen het sabbat geworden was, begon Hij in de synagoge te onderwijzen; en velen die Hem hoorden, waren verbaasd, en zeiden: Waar komen Deze deze dingen vandaan, en wat is dit voor wijsheid die Hem gegeven is, dat ook zulke krachten door Zijn handen gebeuren?", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Matt 26:61": "en zeiden: Deze heeft gezegd: Ik kan de tempel van God afbreken en in drie dagen weer opbouwen.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Matt 19:30": "Maar veel eersten zullen de laatsten zijn, en veel laatsten de eersten.", "Luk 4:19": "Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.", "Joh 19:7": "De Joden antwoordden hem: Wij hebben een wet, en naar onze wet moet Hij sterven, want Hij heeft Zichzelf Gods Zoon gemaakt.", "1 Petr 3:18": "Want Christus heeft ook eenmaal voor de zonden geleden, Hij, de Rechtvaardige, voor de onrechtvaardigen, opdat Hij ons tot God zou brengen; Hij is wel gedood in het vlees, maar levend gemaakt door de Geest;", "Matt 27:26": "Toen liet hij hun Barabbas los; maar nadat hij Jezus gegeseld had, gaf hij Hem over om gekruisigd te worden.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Luk 11:53": "En toen Hij deze dingen tegen hen zei, begonnen de Schriftgeleerden en Farizeeën Hem hevig aan te vallen, en Hem over veel dingen uit te horen;", "Matt 13:14": "En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Ezech 25:15": "Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap;", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Matt 27:12": "En toen Hij door de overpriesters en de oudsten beschuldigd werd, antwoordde Hij niets.", "Jes 29:21": "die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.", "Hand 4:27": "Want in waarheid zijn tegen Uw heilig Kind Jezus, Die U gezalfd hebt, bijeengekomen, zowel Herodes en Pontius Pilatus, met de heidenen en de volken van Israël;", "Matt 5:21": "U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Joh 8:16": "En als Ik toch oordeel, is Mijn oordeel waar; want Ik ben niet alleen, maar Ik en de Vader, Die Mij gezonden heeft.", "Hand 4:30": "Doordat U Uw hand uitstrekt tot genezing, en doordat er tekenen en wonderen gebeuren door de Naam van Uw heilig Kind Jezus.", "Deut 23:24": "Wanneer u in de wijngaard van uw naaste komt, dan mag u druiven eten naar uw lust, tot verzadiging; maar in uw vat zult u er niets van doen.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Ps 22:17": "Want honden hebben mij omsingeld; een vergadering van boosdoeners heeft mij omgeven; zij hebben mijn handen en mijn voeten doorgraven.", "Hand 7:52": "Wie van de profeten hebben uw vaders niet vervolgd? En zij hebben degenen gedood die van tevoren de komst van de Rechtvaardige verkondigd hebben, van Wie u nu verraders en moordenaars geworden bent.", "Spr 19:29": "Gerichten zijn voor de spotters bereid, en slagen voor de rug van de dwazen.", "Joh 9:35-37": "Jezus hoorde dat zij hem eruit geworpen hadden, en toen Hij hem vond, zei Hij tegen hem: Gelooft u in de Zoon van God? Hij antwoordde en zei: Wie is Hij, Heere, opdat ik in Hem geloven kan? En Jezus zei tegen hem: U hebt Hem gezien, en Hij die met u spreekt, Die is het.", "Hand 7:32": "die zei: Ik ben de God van uw vaders, de God van Abraham, en de God van Izak, en de God van Jakob. En Mozes begon hevig te beven, en durfde niet te kijken.", "Ps 22:12-22": "Wees dan niet ver van mij, want benauwdheid is nabij; want er is geen helper. Veel stieren hebben mij omsingeld, sterke stieren van Basan hebben mij omringd. Zij hebben hun mond tegen mij opgesperd, als een verscheurende en brullende leeuw.", "1 Kor 9:5": "Hebben wij geen macht om een vrouw, een zuster zijnde, met ons mee te nemen, zoals ook de andere apostelen, en de broeders van de Heere, en Cefas?", "Hand 13:1": "In Antiochië waren, in de gemeente die daar was, enkele profeten en leraars, namelijk Barnabas, en Simeon, genaamd Niger, en Lucius van Cyrene, en Manahen, die met Herodes de viervorst opgevoed was, en Saulus.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Joh 11:35": "Jezus weende.", "Hebr 6:6": "en die afvallig worden, opnieuw te vernieuwen tot bekering, omdat zij voor zichzelf de Zoon van God opnieuw kruisigen en openlijk te schande maken.", "Luk 4:28": "En zij werden allen in de synagoge met toorn vervuld, toen zij dit hoorden.", "Mark 14:9": "Voorwaar, Ik zeg u: Waar dit Evangelie ook gepredikt zal worden in de hele wereld, daar zal ook gesproken worden over wat zij gedaan heeft, tot haar gedachtenis.", "Mark 16:1-6": "En toen de sabbat voorbij was, hadden Maria Magdalena, en Maria, de moeder van Jakobus, en Salome specerijen gekocht, opdat zij zouden komen en Hem zalven. En heel vroeg op de eerste dag van de week, kwamen zij bij het graf, toen de zon opging; en zeiden tegen elkaar: Wie zal ons de steen van de deur van het graf afwentelen?", "Hand 7:26-28": "En de volgende dag liet hij zich aan hen zien, terwijl zij vochten; en hij drong hen tot vrede, en zei: Mannen, u bent broeders; waarom doet u elkaar onrecht aan? Maar die zijn naaste onrecht aandeed, stiet hem weg, en zei: Wie heeft u tot leider en rechter over ons gesteld? Wilt u mij ook ombrengen, zoals u gisteren de Egyptenaar hebt omgebracht?", "Luk 23:50-56": "En zie, een man met de naam Jozef, een raadsheer, een goed en rechtvaardig man, (Deze had niet ingestemd met hun raadsbesluit en handelwijze) van Arimathea, een stad van de Joden, en die ook zelf het Koninkrijk van God verwachtte; Deze ging naar Pilatus en vroeg om het lichaam van Jezus.", "Mark 6:52": "Want zij hadden het wonder van de broden niet begrepen; want hun hart was verhard.", "Hand 7:3": "en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal.", "Gen 43:28": "En zij zeiden: Het gaat goed met uw dienaar, onze vader, hij leeft nog; en zij neigden het hoofd en bogen zich neer.", "Ps 50:18": "Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.", "1 Petr 3:17": "Want het is beter, als het de wil van God is, dat u lijdt om het goeddoen, dan om het kwaaddoen.", "Ps 45:7": "Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.", "Ps 39:11": "Neem Uw plaag van mij weg; ik ben bezweken door de slagen van Uw hand.", "Ex 18:26": "zij oordeelden het volk te allen tijde, de moeilijke zaak brachten zij tot Mozes, maar alle kleine zaak oordeelden zij zelf.", "Joh 11:37": "En sommigen van hen zeiden: Kon Hij, Die de ogen van de blinde geopend heeft, niet maken dat ook deze niet gestorven was?", "Matt 27:57-66": "En toen het avond geworden was, kwam er een rijk man uit Arimathea, genaamd Jozef, die ook zelf een discipel van Jezus was. Deze ging naar Pilatus en vroeg om het lichaam van Jezus. Toen gaf Pilatus bevel dat het hem gegeven zou worden. En Jozef nam het lichaam en wikkelde het in een schoon, fijn linnen kleed.", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Rom 3:14": "Hun mond is vol vervloeking en bitterheid;", "Luk 23:56": "En zij keerden terug en bereidden specerijen en zalven; en op de sabbat rustten zij, volgens het gebod.", "Klaagl 1:9-11": "Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot. Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden. Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "Matt 26:3": "Toen kwamen de overpriesters en de Schriftgeleerden en de oudsten van het volk samen in de zaal van de hogepriester, die Kajafas genoemd werd;", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Jer 7:10": "en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Rom 1:29-32": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid; kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders; onverstandigen, verbondbrekers, zonder natuurlijke liefde, onverzoenlijken, onbarmhartigen;", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "Luk 22:23": "En zij begonnen elkaar te vragen wie van hen het toch zou zijn, die dat zou doen.", "Hebr 4:14": "Omdat wij dan een grote Hogepriester hebben, Die door de hemelen heen gegaan is, namelijk Jezus, de Zoon van God, laat ons deze belijdenis vasthouden.", "Jes 53:3-6": "Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht. Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Joh 20:25-29": "De andere discipelen zeiden dan tegen hem: Wij hebben de Heere gezien. Maar hij zei tegen hen: Als ik in Zijn handen niet het teken van de nagels zie, en mijn vinger niet in het teken van de nagels stop, en mijn hand niet in Zijn zijde stop, zal ik beslist niet geloven. En na acht dagen waren Zijn discipelen weer binnen, en Thomas met hen. Jezus kwam terwijl de deuren gesloten waren, en Hij stond in hun midden, en zei: Vrede zij u! Daarna zei Hij tegen Thomas: Breng uw vinger hier, en bekijk Mijn handen, en breng uw hand, en stop hem in Mijn zijde; en wees niet ongelovig, maar gelovig.", "Joh 18:13-28": "En zij leidden Hem weg, eerst naar Annas; want hij was de schoonvader van Kajafas, die dat jaar hogepriester was. Kajafas nu was degene die de Joden geadviseerd had dat het nuttig was dat één Mens sterven zou voor het volk. En Simon Petrus volgde Jezus, en ook een andere discipel.
