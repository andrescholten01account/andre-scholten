m Tyrus en Sidon, een grote menigte, die gehoord hadden hoe grote dingen Hij deed, kwamen naar Hem toe.","9":"En Hij zei tegen Zijn discipelen dat een scheepje voortdurend voor Hem klaar zou liggen, vanwege de menigte, opdat zij Hem niet zouden verdringen.","10":"Want Hij had er velen genezen, zodat allen die *enige* kwalen hadden, op Hem afkwamen om Hem aan te raken.","11":"En de onreine geesten vielen voor Hem neer wanneer zij Hem zagen, en riepen: U bent de Zoon van God!","12":"En Hij gebood hun streng dat zij Hem niet bekend zouden maken.","13":"En Hij ging de berg op, en riep tot Zich wie Hij wilde; en zij kwamen naar Hem toe.","14":"En Hij stelde er twaalf aan, opdat zij bij Hem zouden zijn, en opdat Hij hen zou uitzenden om te prediken;","15":"en om macht te hebben de ziekten te genezen, en de duivels uit te werpen.","16":"En aan Simon gaf Hij de *bij*naam Petrus;","17":"En Jakobus, de *zoon* van Zebedeüs, en Johannes, de broer van Jakobus; en Hij gaf hun de *bij*namen Boanerges, dat wil zeggen: zonen van de donder;","18":"En Andreas, en Filippus, en Bartholomeüs, en Mattheüs, en Thomas, en Jakobus, de *zoon* van Alfeüs, en Thaddeüs, en Simon de Kananiet,","19":"En Judas Iskariot, die Hem ook verraden heeft.","20":"En zij kwamen in huis; en daar kwam opnieuw een menigte samen, zodat zij zelfs niet konden eten.","21":"En toen zijn verwanten *dit* hoorden, gingen zij eropuit om Hem vast te houden; want zij zeiden: Hij is buiten zichzelf.","22":"En de Schriftgeleerden die van Jeruzalem gekomen waren, zeiden: Hij heeft Beëlzebul, en door de leider van de duivels drijft Hij de duivels uit.","23":"En Hij riep hen tot Zich, en zei tegen hen in gelijkenissen: Hoe kan de satan de satan uitdrijven?","24":"En als een koninkrijk tegen zichzelf verdeeld is, kan dat koninkrijk niet standhouden.","25":"En als een huis tegen zichzelf verdeeld is, kan dat huis niet standhouden.","26":"En als de satan tegen zichzelf opstaat en verdeeld is, kan hij niet standhouden, maar heeft een einde.","27":"Niemand kan het huis van een sterke man binnengaan en zijn bezittingen roven, als hij niet eerst de sterke man vastbindt; en dan pas zal hij zijn huis beroven.","28":"Voorwaar, Ik zeg u, dat alle zonden de mensenkinderen vergeven zullen worden, en alle lasteringen waarmee zij ook zullen hebben gelasterd;","29":"Maar wie zal lasteren tegen de Heilige Geest, die heeft geen vergeving in eeuwigheid, maar is schuldig aan een eeuwig oordeel.","30":"Want zij zeiden: Hij heeft een onreine geest.","31":"Toen kwamen Zijn broers en Zijn moeder; en terwijl zij buiten stonden, stuurden zij iemand naar Hem, en riepen Hem.","32":"En de menigte zat om Hem heen; en zij zeiden tegen Hem: Zie, Uw moeder en Uw broers zijn buiten en zoeken U.","33":"En Hij antwoordde hun: Wie is Mijn moeder, of Mijn broers?","34":"En terwijl Hij rondkeek naar hen die om Hem heen zaten, zei Hij: Zie, Mijn moeder en Mijn broers.","35":"Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder."},"SV":{"1":"En Hij ging wederom in de synagoge; en aldaar was een mens, hebbende een verdorde hand.","2":"En zij namen Hem waar, of Hij op den sabbat hem genezen zou, opdat zij Hem beschuldigen mochten.","3":"En Hij zeide tot den mens, die de verdorde hand had: Sta op in het midden.","4":"En Hij zeide tot hen: Is het geoorloofd op sabbatdagen goed te doen, of kwaad te doen, een mens te behouden, of te doden? En zij zwegen stil.","5":"En als Hij hen met toorn rondom aangezien had, meteen bedroefd zijnde over de verharding van hun hart, zeide Hij tot den mens: Strek uw hand uit. En hij strekte ze uit; en zijn hand werd hersteld, gezond gelijk de andere.","6":"En de Farizeën, uitgegaan zijnde, hebben terstond met de Herodeanen te zamen raad gehouden tegen Hem, hoe zij Hem doden zouden.","7":"En Jezus vertrok met Zijn discipelen naar de zee; en Hem volgde een grote menigte van Galilea, en van Judea,","8":"en van Jeruzalem, en van Idumea, en *van* over de Jordaan; en die *van* omtrent Tyrus en Sidon, een grote menigte, gehoord hebbende, hoe grote dingen Hij deed, kwamen tot Hem.","9":"En Hij zeide tot Zijn discipelen, dat een scheepje steeds omtrent Hem blijven zou, om der schare wil, opdat zij Hem niet zouden verdringen.","10":"Want Hij had er velen genezen, alzo dat Hem al degenen, die *enige* kwalen hadden, overvielen, opdat zij Hem mochten aanraken.","11":"En de onreine geesten, als zij Hem zagen, vielen voor Hem neder en riepen, zeggende: Gij zijt de Zone Gods!","12":"En Hij gebood hun scherpelijk dat zij Hem niet zouden openbaar maken.","13":"En Hij klom op den berg, en riep tot Zich, die Hij wilde; en zij kwamen tot Hem.","14":"En Hij stelde er twaalf, opdat zij met Hem zouden zijn, en opdat Hij dezelve zou uitzenden om te prediken;","15":"En om macht te hebben, de ziekten te genezen, en de duivelen uit te werpen.","16":"En Simon gaf Hij den *toe* naam Petrus;","17":"En Jakobus, den *zoon* van Zebedeüs, en Johannes, den broeder van Jakobus; en gaf hun *toe* namen, Boanerges, hetwelk is, zonen des donders;","18":"En Andreas, en Filippus, en Bartholomeüs, en Mattheus, en Thomas, en Jakobus, den *zoon* van Alfeüs, en Thaddeus, en Simon Kananites,","19":"En Judas Iskariot, die Hem ook verraden heeft.","20":"En zij kwamen in huis; en daar vergaderde wederom een schare, alzo dat zij ook zelfs niet konden brood eten.","21":"En als degenen, die Hem bestonden, *dit* hoorden, gingen zij uit, om Hem vast te houden; want zij zeiden: Hij is buiten Zijn zinnen.","22":"En de Schriftgeleerden, die van Jeruzalem afgekomen waren, zeiden: Hij heeft Beëlzebul, en door den overste der duivelen werpt Hij de duivelen uit.","23":"En hen tot Zich geroepen hebbende, zeide Hij tot hen in gelijkenissen: Hoe kan de satan den satan uitwerpen?","24":"En indien een koninkrijk tegen zichzelf verdeeld is, zo kan dat koninkrijk niet bestaan.","25":"En indien een huis tegen zichzelf verdeeld is, zo kan dat huis niet bestaan.","26":"En indien de satan tegen zichzelven opstaat, en verdeeld is, zo kan hij niet bestaan, maar heeft een einde.","27":"Er kan niemand in het huis eens sterken ingaan en zijn vaten ontroven, indien hij niet eerst den sterke bindt; en alsdan zal hij zijn huis beroven.","28":"Voorwaar, Ik zeg u, dat al de zonden den kinderen der mensen zullen vergeven worden, en allerlei lasteringen, waarmede zij zullen gelasterd hebben;","29":"Maar zo wie zal gelasterd hebben tegen den Heiligen Geest, die heeft geen vergeving in der eeuwigheid, maar hij is schuldig des eeuwigen oordeels.","30":"Want zij zeiden: Hij heeft een onreinen geest.","31":"Zo kwamen dan Zijn broeders en Zijn moeder; en buiten staande, zonden zij tot Hem, en riepen Hem.","32":"En de schare zat rondom Hem; en zij zeiden tot Hem: Zie, Uw moeder en Uw broeders daar buiten zoeken U.","33":"En Hij antwoordde hun, zeggende: Wie is Mijn moeder, of Mijn broeders?","34":"En rondom overzien hebbende, die om Hem zaten, zeide Hij: Ziet, Mijn moeder en Mijn broeders.","35":"Want zo wie den wil van God doet, die is Mijn broeder, en Mijn zuster, en moeder."},"KJV":{"1":"And he entered again into the synagogue; and there was a man there which had a withered hand.","2":"And they watched him, whether he would heal him on the sabbath day; that they might accuse him.","3":"And he saith unto the man which had the withered hand, Stand forth.","4":"And he saith unto them, Is it lawful to do good on the sabbath days, or to do evil? to save life, or to kill? But they held their peace.","5":"And when he had looked round about on them with anger, being grieved for the hardness of their hearts, he saith unto the man, Stretch forth thine hand. And he stretched *it* out: and his hand was restored whole as the other.","6":"And the Pharisees went forth, and straightway took counsel with the Herodians against him, how they might destroy him.","7":"But Jesus withdrew himself with his disciples to the sea: and a great multitude from Galilee followed him, and from Judaea,","8":"And from Jerusalem, and from Idumaea, and *from* beyond Jordan; and they about Tyre and Sidon, a great multitude, when they had heard what great things he did, came unto him.","9":"And he spake to his disciples, that a small ship should wait on him because of the multitude, lest they should throng him.","10":"For he had healed many; insomuch that they pressed upon him for to touch him, as many as had plagues.","11":"And unclean spirits, when they saw him, fell down before him, and cried, saying, Thou art the Son of God.","12":"And he straitly charged them that they should not make him known.","13":"And he goeth up into a mountain, and calleth *unto him* whom he would: and they came unto him.","14":"And he ordained twelve, that they should be with him, and that he might send them forth to preach,","15":"And to have power to heal sicknesses, and to cast out devils:","16":"And Simon he surnamed Peter;","17":"And James the *son* of Zebedee, and John the brother of James; and he surnamed them Boanerges, which is, The sons of thunder:","18":"And Andrew, and Philip, and Bartholomew, and Matthew, and Thomas, and James the *son* of Alphaeus, and Thaddaeus, and Simon the Canaanite,","19":"And Judas Iscariot, which also betrayed him: and they went into an house.","20":"And the multitude cometh together again, so that they could not so much as eat bread.","21":"And when his friends heard *of it*, they went out to lay hold on him: for they said, He is beside himself.","22":"And the scribes which came down from Jerusalem said, He hath Beelzebub, and by the prince of the devils casteth he out devils.","23":"And he called them *unto him*, and said unto them in parables, How can Satan cast out Satan?","24":"And if a kingdom be divided against itself, that kingdom cannot stand.","25":"And if a house be divided against itself, that house cannot stand.","26":"And if Satan rise up against himself, and be divided, he cannot stand, but hath an end.","27":"No man can enter into a strong man's house, and spoil his goods, except he will first bind the strong man; and then he will spoil his house.","28":"Verily I say unto you, All sins shall be forgiven unto the sons of men, and blasphemies wherewith soever they shall blaspheme:","29":"But he that shall blaspheme against the Holy Ghost hath never forgiveness, but is in danger of eternal damnation:","30":"Because they said, He hath an unclean spirit.","31":"There came then his brethren and his mother, and, standing without, sent unto him, calling him.","32":"And the multitude sat about him, and they said unto him, Behold, thy mother and thy brethren without seek for thee.","33":"And he answered them, saying, Who is my mother, or my brethren?","34":"And he looked round about on them which sat about him, and said, Behold my mother and my brethren!","35":"For whosoever shall do the will of God, the same is my brother, and my sister, and mother."}},"tsk":{"1":[{"kopje":"Hij ging","refs":["Mark 1:21","Matt 12:9-14","Luk 6:6-11"]},{"kopje":"verdorde","refs":["1 Kon 13:4","Joh 5:3"]}],"3":[{"kopje":"zei","refs":["Jes 42:4","Dan 6:11","Luk 6:8","Joh 9:4","1 Kor 15:58","Gal 6:9","Fil 1:14","Fil 1:28-30","1 Petr 4:1"]}],"4":[{"kopje":"Is het","refs":["Mark 2:27","Mark 2:28","Hos 6:6","Matt 12:10-12","Luk 6:9","Luk 13:13-17","Luk 14:1-5"]},{"kopje":"En","refs":["Mark 9:34"]}],"5":[{"kopje":"met toorn","refs":["Luk 6:10","Luk 13:15","Ef 4:26","Openb 6:16"]},{"kopje":"bedroefd","refs":["Gen 6:6","Richt 10:16","Neh 13:8","Ps 95:10","Jes 63:9","Jes 63:10","Luk 19:40-44","Ef 4:30","Hebr 3:10","Hebr 3:17"]},{"kopje":"verharding","refs":["Jes 6:9","Jes 6:10","Jes 42:18-20","Jes 44:18-20","Matt 13:14","Matt 13:15","Rom 11:7-10","Rom 11:25","2 Kor 3:14","Ef 4:18"]},{"kopje":"Strek","refs":["1 Kon 13:6","Matt 12:13","Luk 6:10","Luk 17:14","Joh 5:8","Joh 5:9","Joh 9:7","Hebr 5:9"]}],"6":[{"kopje":"Farizeeën","refs":["Ps 109:3","Ps 109:4","Matt 12:14","Luk 6:11","Luk 20:19","Luk 20:20","Luk 22:2","Joh 11:53"]},{"kopje":"Herodianen","refs":[   }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>

</html>
