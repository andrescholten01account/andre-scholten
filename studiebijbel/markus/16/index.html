niet.", "1 Kor 14:5-26": "En ik wil wel dat u allen in vreemde talen spreekt, maar meer, dat u profeteert; want wie profeteert, is meer dan wie vreemde talen spreekt, tenzij hij het uitlegt, opdat de Gemeente stichting mag ontvangen. En nu, broeders, als ik tot u kwam en vreemde talen sprak, wat nut zou ik u dan doen, als ik tot u niet sprak in openbaring, of in kennis, of in profetie, of in lering? Zelfs ook de levenloze dingen die geluid geven, hetzij fluit, hetzij citer, als zij geen onderscheid met hun klank geven, hoe zal bekend worden wat op de fluit of op de citer gespeeld wordt?", "Kol 1:27": "aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "Hebr 10:12": "Maar Deze, die één offer voor de zonden gebracht heeft, is voor eeuwig gaan zitten aan de rechterhand van God;", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Joh 16:10": "En van gerechtigheid, omdat Ik tot Mijn Vader heenga, en u Mij niet meer zult zien;", "Rom 1:5": "(Door Wie wij genade en het apostelschap hebben ontvangen, tot gehoorzaamheid van het geloof onder alle heidenen, voor Zijn Naam;", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "Ps 2:8": "Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting.", "Ps 123:1": "Een lied op Hammaäloth. Ik hef mijn ogen op tot U, Die in de hemelen zit.", "Joh 6:66": "Van toen af gingen velen van Zijn discipelen terug, en liepen niet meer met Hem mee.", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Matt 22:2-13": "Het Koninkrijk der hemelen is gelijk aan een zeker koning, die voor zijn zoon een bruiloft bereid had; En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen. Opnieuw zond hij andere dienstknechten uit, en zei: Zeg tegen de genode gasten: Zie, ik heb mijn middagmaal bereid; mijn ossen en het gemeste vee zijn geslacht, en alles is gereed; kom naar de bruiloft.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Hand 1:9-12": "En toen Hij dit gezegd had, werd Hij opgenomen, terwijl zij het zagen, en een wolk nam Hem weg van voor hun ogen. En terwijl zij hun ogen naar de hemel gericht hielden toen Hij wegvoer, zie, twee mannen stonden bij hen in witte kleding; die ook zeiden: Galilese mannen, wat staat u naar de hemel te kijken? Deze Jezus, Die van u opgenomen is in de hemel, zal op dezelfde manier komen als u Hem naar de hemel hebt zien gaan.", "Luk 24:44-50": "En Hij zei tegen hen: Dit zijn de woorden die Ik tot u sprak, toen Ik nog bij u was, namelijk dat alles moest vervuld worden wat over Mij geschreven is in de Wet van Mozes, en de Profeten, en de Psalmen. Toen opende Hij hun verstand, zodat zij de Schriften begrepen. En Hij zei tegen hen: Zo staat er geschreven, en zo moest de Christus lijden, en op de derde dag opstaan uit de doden.", "Luk 24:17": "En Hij zei tegen hen: Wat zijn dit voor gesprekken die u onderweg met elkaar voert, en waarom kijkt u zo droevig?", "Joh 4:1": "Toen de Heere dan begreep dat de Farizeeën gehoord hadden dat Jezus meer discipelen maakte en doopte dan Johannes,", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Hand 13:2-4": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb. Toen vastten en baden zij, en nadat zij hun de handen opgelegd hadden, lieten zij hen gaan. Zij dan, uitgezonden door de Heilige Geest, kwamen af naar Seleucië, en scheepten van daar af naar Cyprus.", "Matt 7:24": "Ieder dan die deze woorden van Mij hoort en ze doet, hem zal Ik vergelijken met een verstandig man, die zijn huis op een steenrots gebouwd heeft;", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Hand 13:27-29": "Want zij die in Jeruzalem wonen, en hun leiders, hebben Hem niet gekend, en hebben ook de stemmen van de profeten, die elke sabbat gelezen worden, vervuld door Hem te veroordelen; En hoewel zij geen reden voor de dood vonden, hebben zij van Pilatus gevraagd dat Hij gedood zou worden. En toen zij alles volbracht hadden wat over Hem geschreven was, namen zij Hem af van het hout, en legden Hem in het graf.", "2 Kor 6:11": "Onze mond is opengegaan tegen u, Korinthiërs, ons hart is verruimd.", "Gal 3:8": "En de Schrift, die van tevoren zag dat God de heidenen uit het geloof zou rechtvaardigen, heeft van tevoren aan Abraham het Evangelie verkondigd, en zei: In u zullen alle volken gezegend worden.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "2 Petr 2:5": "en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Luk 10:19": "Zie, Ik geef u de macht om op slangen en schorpioenen te treden, en over alle kracht van de vijand; en niets zal u ooit schaden.", "Joh 18:23": "Jezus antwoordde hem: Als Ik verkeerd gesproken heb, getuig dan van het kwade; en als Ik goed gesproken heb, waarom slaat u Mij?", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "1 Sam 16:2": "Maar Samuël zei: Hoe zou ik kunnen gaan? Saul zal het horen en mij doden. Toen zei de HEERE: Neem een kalf van de runderen met u mee, en zeg: Ik ben gekomen om de HEERE een offer te brengen.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Luk 24:4": "En het gebeurde, terwijl zij daarover in verwarring waren, zie, twee mannen stonden bij hen in blinkende kleren.", "Hand 2:8": "En hoe horen wij hen ieder in onze eigen taal, waarin wij geboren zijn?", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Matt 3:9": "En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Ps 135:6": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.", "Joh 20:1-18": "En op de eerste dag van de week ging Maria Magdalena vroeg, terwijl het nog donker was, naar het graf; en zij zag dat de steen van het graf was weggenomen. Zij liep dan snel en kwam bij Simon Petrus en bij de andere discipel, die Jezus liefhad, en zei tegen hen: Ze hebben de Heere weggenomen uit het graf, en wij weten niet waar ze Hem hebben neergelegd. Petrus dan ging naar buiten, en de andere discipel, en zij kwamen bij het graf.", "Jes 56:2": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen.", "Hebr 4:11": "Laat ons ons dan beijveren om die rust in te gaan, opdat niemand in hetzelfde voorbeeld van ongehoorzaamheid valt.", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "Hand 6:4": "Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.", "1 Tim 1:11": "Naar het Evangelie van de heerlijkheid van de zalige God, dat aan mij toevertrouwd is.", "Openb 8:1": "En toen Hij het zevende zegel geopend had, werd er een stilzwijgen in de hemel, ongeveer een half uur lang.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Hand 28:28": "Laat het u dan bekend zijn dat de zaligheid van God naar de heidenen gezonden is, en die zullen horen.", "1 Kon 8:49": "hoor dan in de hemel, de vaste plaats van Uw woning, hun gebed en hun smeking, en voer hun recht uit;", "Hand 5:20": "Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.", "Micha 7:2": "De goedertierene is verdwenen uit het land, en er is niemand oprecht onder de mensen; zij loeren allemaal op bloed, zij jagen, ieder op zijn broeder, met een jachtnet.", "Ex 20:8-11": "Gedenk de sabbatdag, dat u die heiligt. Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Luk 10:23": "En Hij keerde Zich naar de discipelen en zei alleen tegen hen: Zalig zijn de ogen die zien wat u ziet.", "Ps 98:2": "De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Matt 26:14-16": "Toen ging één van de twaalf, Judas Iskariot genaamd, naar de overpriesters, en zei: Wat wilt u mij geven, en ik zal Hem aan u overleveren? En zij hebben hem dertig zilveren munten toegezegd. En vanaf toen zocht hij een gelegenheid om Hem over te leveren.", "Hand 5:12-16": "En door de handen van de apostelen gebeurden veel tekenen en wonderen onder het volk; en zij waren allen eendrachtig in de zuilengang van Salomo. En van de anderen durfde niemand zich bij hen aansluiten; maar het volk hield hen in grote achting. En er werden steeds meer mensen toegevoegd, die de Heere geloofden, menigten zowel van mannen als van vrouwen;", "2 Petr 1:16": "Want wij hebben geen kunstig verzonnen fabels nagevolgd, toen wij u de kracht en toekomst van onze Heere Jezus Christus bekendmaakten, maar wij zijn ooggetuigen geweest van Zijn majesteit.", "Matt 26:32": "Maar nadat Ik zal opgestaan zijn, zal Ik u voorgaan naar Galilea.", "Luk 13:24-35": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen; namelijk nadat de heer des huizes zal zijn opgestaan en de deur zal hebben gesloten, en u buiten zult beginnen te staan en op de deur te kloppen, en zult zeggen: Heere, Heere, doe ons open! en Hij zal antwoorden en tegen u zeggen: Ik weet niet waar u vandaan komt. Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.", "Mark 11:18": "En de Schriftgeleerden en de overpriesters hoorden dat, en zochten hoe zij Hem konden doden; want zij waren bang voor Hem, omdat de hele menigte verbaasd was over Zijn onderwijs.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Ef 1:9": "Ons bekendgemaakt hebbend het geheimenis van Zijn wil, naar Zijn welbehagen, dat Hij voorgenomen had in Zichzelf.", "Luk 22:53": "Toen Ik dagelijks bij u was in de tempel, hebt u de handen tegen Mij niet uitgestoken; maar dit is uw uur, en de macht van de duisternis.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "2 Kor 3:6-11": "die ons ook bekwaam gemaakt heeft om dienaars te zijn van het Nieuwe Testament, niet van de letter, maar van de Geest; want de letter doodt, maar de Geest maakt levend. En als de bediening van de dood, die met letters in stenen gegraveerd was, in heerlijkheid is geweest, zodat de kinderen van Israël niet strak konden kijken naar het gezicht van Mozes vanwege de heerlijkheid van zijn gezicht, die teniet gedaan zou worden, hoe zal dan niet veel meer de bediening van de Geest in heerlijkheid zijn?", "Ps 91:13": "Op de felle leeuw en de adder zult u treden, u zult de jonge leeuw en de draak vertrappen.", "Hand 5:21": "Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Jes 50:6": "Ik geef Mijn rug aan hen die Mij slaan, en Mijn wangen aan hen die Mij het haar uitplukken; Mijn gezicht verberg Ik niet voor smaad en speeksel.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "Rom 5:1": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus;", "Joh 11:25": "Jezus zei tegen haar: Ik ben de Opstanding en het Leven; wie in Mij gelooft zal leven, ook al was hij gestorven;", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Luk 13:30": "En zie, er zijn laatsten die de eersten zullen zijn, en er zijn eersten die de laatsten zullen zijn.", "Hand 10:38-40": "namelijk dat Jezus van Nazareth, hoe God Hem gezalfd heeft met de Heilige Geest en met kracht; Die het land is doorgegaan, terwijl Hij goeddeed en allen genas die door de duivel overweldigd waren; want God was met Hem. En wij zijn getuigen van alles wat Hij gedaan heeft, zowel in het Joodse land als in Jeruzalem; Die zij gedood hebben door Hem aan het hout te hangen. Deze heeft God opgewekt op de derde dag, en gegeven dat Hij openbaar zou worden;", "Gal 1:1": "Paulus, een apostel, geroepen niet vanuit mensen, ook niet door een mens, maar door Jezus Christus, en God de Vader, Die Hem uit de doden heeft opgewekt,", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Hand 20:21": "Terwijl ik zowel Joden als Grieken heb betuigd de bekering tot God en het geloof in onze Heere Jezus Christus.", "Ezech 44:15": "Maar de Levitische priesters, de kinderen van Zadok, die de wacht van Mijn heiligdom in acht genomen hebben, toen de kinderen van Israël van Mij afdwaalden, die zullen tot Mij naderen om Mij te dienen; en zullen voor Mijn aangezicht staan om Mij het vette en het bloed te offeren, spreekt de Heere HEERE;", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Num 20:13": "Dit zijn de wateren van Meriba, waar de kinderen van Israël met de HEERE getwist hebben; en Hij werd aan hen geheiligd.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "Joh 20:20": "En toen Hij dit gezegd had, liet Hij hun Zijn handen en Zijn zijde zien. De discipelen dan verheugden zich toen zij de Heere zagen.", "Joh 17:8": "Want de woorden die U Mij gegeven hebt, heb Ik hun gegeven, en zij hebben ze ontvangen, en zij hebben werkelijk erkend dat Ik van U ben uitgegaan, en hebben geloofd dat U Mij gezonden hebt.", "Job 6:10": "Dat zou nog mijn troost zijn, en zou mij verkwikken in de weedom, zo Hij niet spaarde; want ik heb de redenen van de Heilige niet verborgen gehouden.", "1 Kor 15:3-7": "Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften; en dat Hij is begraven, en dat Hij is opgewekt op de derde dag, naar de Schriften; en dat Hij is gezien door Cefas, daarna door de twaalf.", "Hand 8:37": "En Filippus zei: Als u van ganser harte gelooft, is het geoorloofd. En hij antwoordde en zei: Ik geloof dat Jezus Christus de Zoon van God is.", "Hand 19:12": "zodat ook van zijn lijf op de zieken gedragen werden de zweetdoeken of gordeldoeken, en dat de ziekten van hen weken, en de boze geesten van hen uitvoeren.", "Spr 1:21": "Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad;", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "Luk 9:2": "En Hij zond hen erop uit om het Koninkrijk van God te prediken, en om de zieken gezond te maken.", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Hand 3:20": "En Hij Jezus Christus zal gezonden hebben, Die u van tevoren gepredikt is;", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Matt 22:9": "Ga daarom naar de kruispunten van de wegen, en roep zovelen als u er zult vinden, naar de bruiloft.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Micha 4:14": "Nu, verzamel u met benden, dochter van de bende, hij heeft een belegering tegen ons gelegd; zij zullen de rechter van Israël met de roede op het kinnebak slaan.", "Hebr 5:9": "En nadat Hij volmaakt gemaakt was, is Hij voor allen die Hem gehoorzaam zijn een oorzaak van eeuwige zaligheid geworden;", "Ef 1:12-14": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben. In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte; Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Ps 37:39": "Thau. Toch is het heil van de rechtvaardigen van de HEERE; hun Sterkte in de tijd van benauwdheid.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Matt 17:23": "en zij zullen Hem doden, en op de derde dag zal Hij worden opgewekt. En zij werden zeer bedroefd.", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "Luk 24:26": "Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan?", "2 Tess 2:12": "opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "1 Tim 4:6": "Als u deze dingen aan de broeders voorhoudt, zult u een goede dienaar van Jezus Christus zijn, gevoed door de woorden van het geloof en van de goede leer, die u gevolgd hebt.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Matt 13:58": "En Hij heeft daar niet veel krachten gedaan, vanwege hun ongeloof.", "Hebr 6:1": "Laten wij daarom het beginsel van de leer van Christus achterlaten en doorgaan tot de volmaaktheid; niet opnieuw het fundament leggend van de bekering van dode werken en van het geloof in God,", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Matt 28:3": "Zijn gedaante was als een bliksem, en zijn kleding wit als sneeuw.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "1 Kor 1:22": "Omdat de Joden een teken begeren, en de Grieken wijsheid zoeken;", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "Joh 15:24": "Als Ik de werken onder hen niet had gedaan, die niemand anders gedaan heeft, hadden zij geen zonde; maar nu hebben zij ze gezien, en hebben zowel Mij als Mijn Vader gehaat.", "1 Kor 15:24": "Daarna zal het einde zijn, wanneer Hij het Koninkrijk aan God en de Vader zal hebben overgegeven; wanneer Hij alle heerschappij, alle macht en kracht zal hebben tenietgedaan.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "Ps 95:8-11": "Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn; Waar uw vaders Mij verzochten, Mij beproefden, ook Mijn werk zagen. Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd: Zij zijn een volk dat dwaalt van hart, en zij kennen Mijn wegen niet.", "Num 20:12": "Daarom zei de HEERE tot Mozes en tot Aäron: Omdat u Mij niet geloofd hebt, door Mij te heiligen voor de ogen van de kinderen van Israël, daarom zult u deze gemeente niet brengen in het land, dat Ik hun gegeven heb.", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Matt 22:10": "En diezelfde dienstknechten gingen de wegen op en brachten allen bijeen die zij vonden, zowel slechten als goeden; en de bruiloft werd vervuld met gasten die aanzaten.", "Ef 6:21": "En opdat ook u mag weten hoe het met mij gaat; en wat ik doe, dat alles zal Tychikus u bekendmaken, de geliefde broeder en trouwe dienaar in de Heere;", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Matt 27:39-44": "En zij die voorbijgingen, beschimpten Hem en schudden hun hoofd, en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af. En evenzo zeiden ook de overpriesters, met de schriftgeleerden en oudsten, en Farizeeën, terwijl zij Hem bespotten:", "Joh 16:27": "Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Mark 3:14": "En Hij stelde er twaalf aan, opdat zij bij Hem zouden zijn, en opdat Hij hen zou uitzenden om te prediken;", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Hand 1:3": "Aan hen heeft Hij Zichzelf ook, nadat Hij geleden had, levend vertoond, met veel duidelijke bewijzen, gedurende veertig dagen door hen gezien, en sprekend over de dingen die het Koninkrijk van God aangaan.", "Jes 49:7": "Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft.", "Job 9:16": "Al zou ik roepen en Hij mij antwoorden, ik zou niet geloven dat Hij mijn stem ter ore genomen heeft.", "Kol 4:7-11": "Al mijn zaken zal Tychikus u bekendmaken, de geliefde broeder, en trouwe dienaar, en mededienstknecht in de Heere; hem heb ik met dit doel naar u toe gestuurd, opdat hij weet hoe het met u gaat, en uw harten troost; samen met Onesimus, de trouwe en geliefde broeder, die één van u is; zij zullen u alles bekendmaken wat hier gebeurt.", "1 Kor 16:2": "Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.", "2 Tim 1:11": "Waartoe ik gesteld ben als prediker, en apostel, en leraar van de heidenen;", "Hand 8:16": "(Want Hij was nog op niemand van hen gevallen, maar zij waren alleen gedoopt in de Naam van de Heere Jezus.)", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "Ezech 23:38": "Nog hebben zij Mij dit aangedaan: zij hebben Mijn heiligdom op diezelfde dag verontreinigd, en Mijn sabbatten ontheiligd.", "Dan 10:6": "En Zijn lichaam was als een turkoois, en Zijn gezicht als het uiterlijk van de bliksem, en Zijn ogen als vurige fakkels, en Zijn armen en Zijn voeten als de glans van gepolijst koper; en de stem van Zijn woorden was als de stem van een menigte.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Hebr 3:16-19": "Want sommigen, toen zij die gehoord hadden, hebben Hem verbitterd, maar niet allen die uit Egypte door Mozes weggetrokken zijn. Over wie nu is Hij veertig jaar lang vertoornd geweest? Was het niet over hen die gezondigd hadden, van wie de lichamen gevallen zijn in de woestijn? En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "Rom 10:7": "Of: wie zal in de afgrond neerdalen? Dat is: om Christus uit de doden op te brengen.", "Joh 7:13": "Toch sprak niemand vrijmoedig over Hem, uit vrees voor de Joden.", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "Jak 5:15": "En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Jak 5:14": "Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere.", "Mark 9:1": "En Hij zei tegen hen: Voorwaar, Ik zeg u, dat er sommigen zijn van hen die hier staan, die de dood niet zullen smaken, totdat zij gezien zullen hebben dat het Koninkrijk van God met kracht gekomen is.", "Luk 12:40-53": "Wees daarom ook u bereid; want op een moment dat u het niet verwacht, zal de Zoon des mensen komen. En Petrus zei tegen Hem: Heere, zegt U deze gelijkenis tegen ons, of ook tegen allen? En de Heere zei: Wie is dan de trouwe en verstandige huisbeheerder, die de heer over zijn dienstpersoneel zal aanstellen, om hun op de juiste tijd het bepaalde deel voedsel te geven?", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "Matt 10:15": "Voorwaar, Ik zeg u: het zal voor het land van Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Matt 9:29": "Toen raakte Hij hun ogen aan en zei: U geschiedt naar uw geloof.", "Num 11:21-23": "En Mozes zei: Zeshonderdduizend man te voet is dit volk, in wiens midden ik ben; en U hebt gezegd: Ik zal hun vlees geven, en zij zullen een hele maand eten! Zullen dan voor hen schapen en runderen geslacht worden, zodat het voor hen genoeg is? Zullen alle vissen van de zee voor hen verzameld worden, zodat het voor hen genoeg is? Maar de HEERE zei tegen Mozes: Zou dan de hand van de HEERE verkort zijn? U zult nu zien of Mijn woord u zal overkomen, of niet.", "Luk 9:1-5": "Jezus riep Zijn twaalf discipelen samen en gaf hun kracht en macht over alle duivelen, en om ziekten te genezen. En Hij zond hen erop uit om het Koninkrijk van God te prediken, en om de zieken gezond te maken. En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Mark 15:14": "Maar Pilatus zei tegen hen: Wat heeft Hij dan voor kwaad gedaan? En zij riepen des te meer: Kruisig Hem!", "Mark 15:42": "En toen het al avond geworden was, omdat het de voorbereiding was, dat is de dag voor de sabbat;", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Matt 28:2-4": "En zie, er kwam een grote aardbeving; want een engel van de Heere daalde neer uit de hemel, kwam erbij, rolde de steen van de deur af, en ging erop zitten. Zijn gedaante was als een bliksem, en zijn kleding wit als sneeuw. En uit angst voor hem beefden de wachters hevig, en werden als doden.", "2 Kor 6:1": "En wij, als medearbeiders, bidden u ook dat u de genade van God niet tevergeefs mag hebben ontvangen.", "Luk 4:31": "En Hij kwam af naar Kapernaüm, een stad van Galilea, en leerde hen op de sabbatdagen.", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Hand 7:49": "De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Luk 16:16": "De wet en de profeten zijn tot op Johannes; van die tijd af wordt het Koninkrijk van God verkondigd, en ieder doet geweld op datzelfde.", "Ef 4:13": "Totdat wij allen komen tot de eenheid van het geloof en van de kennis van de Zoon van God, tot een volwassen man, tot de maat van de grootte van de volheid van Christus;", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Matt 27:25-30": "En al het volk antwoordde en zei: Laat Zijn bloed komen over ons, en over onze kinderen. Toen liet hij hun Barabbas los; maar nadat hij Jezus gegeseld had, gaf hij Hem over om gekruisigd te worden. Toen namen de soldaten van de stadhouder Jezus mee naar het rechthuis, en verzamelden de hele legerafdeling om Hem heen.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Luk 24:50": "En Hij leidde hen naar buiten tot bij Bethanië, en hief Zijn handen op en zegende hen.", "Hand 13:40": "Kijk dan uit, dat over u niet komt wat gezegd is in de profeten:", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Ps 2:1-5": "Waarom woeden de heidenen, en bedenken de volken iets zinloos? De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen: Laat ons hun banden verscheuren, en hun touwen van ons afwerpen.", "2 Kron 6:33": "Hoor U dan uit de hemel, uit de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken der aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Joh 1:11": "Hij is gekomen tot het Zijne, en de Zijnen hebben Hem niet aangenomen.", "Hand 2:31": "Heeft hij, dit vooruitziend, gesproken over de opstanding van Christus, dat Zijn ziel niet verlaten is in het rijk van de dood, en Zijn vlees geen verderving heeft gezien.", "Joh 6:71": "En Hij zei dit over Judas, de zoon van Simon, Iskariot; want deze zou Hem verraden, hoewel hij een van de twaalf was.", "1 Sam 17:11": "Toen Saul en heel Israël deze woorden van de Filistijn hoorden, schrokken zij enorm, en vreesden zeer.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Hand 2:23": "Deze, door de bepaalde raad en voorkennis van God overgegeven, hebt u genomen en door de handen van onrechtvaardigen aan het kruis gehecht en gedood;", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Fil 1:12-18": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is; Zodat mijn banden in Christus openbaar geworden zijn in het hele rechthuis, en aan alle anderen; En dat het merendeel van de broeders in de Heere, doordat zij vertrouwen gekregen hebben door mijn banden, veel overvloediger het Woord onbevreesd durven spreken.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Matt 3:6": "en zij werden door hem gedoopt in de Jordaan, terwijl zij hun zonden beleden.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Joh 12:32": "En Ik, wanneer Ik van de aarde verhoogd zal zijn, zal allen tot Mij trekken.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Rom 10:14": "Hoe zullen zij Hem dan aanroepen, in Wie zij niet geloofd hebben? En hoe zullen zij in Hem geloven, van Wie zij niet gehoord hebben? En hoe zullen zij horen, zonder iemand die hun predikt?", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Hand 4:18-20": "En zij riepen hen en zeiden hun aan, dat zij helemaal niet meer zouden spreken, noch leren, in de Naam van Jezus. Maar Petrus en Johannes antwoordden hun: Oordeelt u zelf, of het recht is voor God, meer naar u te luisteren dan naar God. Want wij kunnen niet nalaten te spreken over wat wij gezien en gehoord hebben.", "Hand 13:33": "dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.", "Mark 14:29-31": "En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet doen. En Jezus zei tegen hem: Voorwaar, Ik zeg u, dat u heden, in deze nacht, voordat de haan tweemaal gekraaid zal hebben, Mij driemaal zult verloochenen. Maar hij zei des te heftiger: Al moest ik met U sterven, ik zal U geenszins verloochenen! En evenzo zeiden zij ook allen.", "Num 11:22": "Zullen dan voor hen schapen en runderen geslacht worden, zodat het voor hen genoeg is? Zullen alle vissen van de zee voor hen verzameld worden, zodat het voor hen genoeg is?", "1 Kron 16:23": "Zingt de HEERE, u, hele aarde, verkondigt Zijn heil van dag tot dag.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Hand 18:4": "En hij sprak op elke sabbat in de synagoge, en bracht Joden en Grieken tot geloof.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "Luk 14:21-23": "En toen die dienstknecht terugkwam, vertelde hij dit aan zijn heer. Toen werd de heer des huizes boos, en zei tegen zijn dienstknecht: Ga snel de straten en stegen van de stad in, en breng de armen, en verminkten, en kreupelen, en blinden hier naar binnen. En de dienstknecht zei: Heer, het is gebeurd zoals u bevolen hebt, en er is nog plaats. En de heer zei tegen de dienstknecht: Ga de wegen en heggen langs, en dwing hen binnen te komen, zodat mijn huis vol wordt.", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Ex 14:10-12": "Toen Farao dichtbij gekomen was, hieven de kinderen van Israël hun ogen op, en zie, de Egyptenaren trokken achter hen aan; en zij vreesden zeer; toen riepen de kinderen van Israël tot de HEERE. En zij zeiden tegen Mozes: Had u ons daarom, omdat er in Egypte helemaal geen graven waren, weggehaald, opdat wij in deze woestijn zouden sterven? Waarom heeft u ons dit aangedaan, dat u ons uit Egypte hebt weggevoerd? Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Hand 2:1": "En toen de dag van het Pinksterfeest vervuld werd, waren zij allen eendrachtig bijeen.", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "Hebr 3:18": "En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "1 Petr 2:8": "En een steen des aanstoots, en een rots der ergernis; namelijk voor hen die zich aan het Woord stoten, ongehoorzaam als zij zijn, waartoe zij ook bestemd zijn.", "Joh 2:19-22": "Jezus antwoordde en zei tegen hen: Breek deze tempel af, en in drie dagen zal Ik hem oprichten. De Joden zeiden dan: Zesenveertig jaar is aan deze tempel gebouwd, en zult U hem in drie dagen oprichten? Maar Hij sprak dit over de tempel van Zijn lichaam.", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "Joh 11:51": "En dit zei hij niet uit zichzelf; maar omdat hij dat jaar hogepriester was, profeteerde hij dat Jezus zou sterven voor het volk;", "Gal 3:1-29": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd. Dit alleen wil ik van u leren: hebt u de Geest ontvangen uit de werken van de wet, of uit de prediking van het geloof? Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Ex 16:23-30": "Hij dan zei tegen hen: Dit is het, wat de HEERE gesproken heeft: Morgen is de rustdag, de heilige sabbat van de HEERE! Wat u bakken wilt, bak dat, en kook wat u koken wilt; en al wat overblijft, legt dat voor uzelf weg in bewaring tot de morgen. En zij legden het weg tot de morgen, zoals Mozes geboden had; en het stonk niet, en er zat geen worm in. Toen zei Mozes: Eet dat vandaag, want vandaag is het de sabbat van de HEERE; vandaag zult u het op het veld niet vinden.", "1 Kor 15:3-8": "Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften; en dat Hij is begraven, en dat Hij is opgewekt op de derde dag, naar de Schriften; en dat Hij is gezien door Cefas, daarna door de twaalf.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "1 Joh 5:5": "Wie is het, die de wereld overwint, dan hij die gelooft dat Jezus de Zoon van God is?", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Hebr 12:3": "Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Joh 12:50": "En Ik weet dat Zijn gebod het eeuwige leven is. Wat Ik dan spreek, dat spreek Ik zoals de Vader Mij gezegd heeft.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Mark 6:7-11": "En Hij riep de twaalf tot Zich, en begon hen twee aan twee uit te zenden, en gaf hun macht over de onreine geesten; En Hij gebood hun dat zij niets zouden meenemen voor onderweg, dan alleen een staf: geen reistas, geen brood, geen geld in de gordel; maar dat zij sandalen zouden aanbinden, en niet met twee stel kleren gekleed zouden zijn.", "Joh 7:7": "De wereld kan u niet haten, maar Mij haat zij, omdat Ik van haar getuig dat haar werken slecht zijn.", "Joh 16:20-22": "Voorwaar, voorwaar, Ik zeg u: u zult huilen en klagen, maar de wereld zal zich verblijden; en u zult bedroefd zijn, maar uw droefheid zal tot blijdschap worden. Een vrouw heeft droefheid wanneer zij baart, omdat haar tijd gekomen is; maar wanneer zij het kind gebaard heeft, denkt zij niet meer aan de benauwdheid, vanwege de blijdschap dat er een mens ter wereld geboren is. En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Luk 9:22": "en Hij zei: De Zoon des mensen moet veel lijden, en verworpen worden door de oudsten, overpriesters en Schriftgeleerden, en gedood worden en op de derde dag opgewekt worden.", "1 Tess 1:5": "Want ons Evangelie is bij u niet alleen met woorden gekomen, maar ook met kracht, en met de Heilige Geest, en met veel zekerheid; zoals u weet wat voor mensen wij bij u geweest zijn, ter wille van u.", "Ef 6:15": "en de voeten geschoeid met bereidheid van het Evangelie van de vrede;", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "Kol 1:20-23": "en dat Hij, door Hem vrede gemaakt te hebben door het bloed van Zijn kruis, door Hem, zeg ik, alle dingen met Zichzelf verzoenen zou, hetzij de dingen die op de aarde, hetzij de dingen die in de hemelen zijn. En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend, in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "1 Joh 2:25": "En dit is de belofte, die Hij ons beloofd heeft, namelijk het eeuwige leven.", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Jes 51:5": "Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.", "Hand 13:41": "Zie, u verachters, verwonder u, en verdwijn; want Ik doe een werk in uw dagen, een werk dat u beslist niet zult geloven, ook al vertelt iemand het u.", "1 Kon 19:13-18": "En het gebeurde, toen Elia dat hoorde, dat hij zijn gezicht bedekte met zijn mantel, en naar buiten ging, en ging staan in de ingang van de grot. En zie, een stem kwam tot hem, die zei: Wat doet u hier, Elia? En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden. En de HEERE zei tegen hem: Ga, keer terug op uw weg, naar de woestijn van Damaskus; en als u daar aankomt, zalf dan Hazaël tot koning over Syrië.", "Job 22:12": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn.", "Mark 15:47": "En Maria Magdalena, en Maria, de moeder van Joses, keken toe waar Hij gelegd werd.", "Luk 10:4": "Neem geen buidel mee, geen reistas, geen schoenen; en groet niemand onderweg.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "2 Kor 4:10": "Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Ps 96:10": "Zegt onder de heidenen: De HEERE regeert; ook zal de wereld vaststaan, zij zal niet wankelen; Hij zal de volken oordelen in alle rechtvaardigheid.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Gen 12:1": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Rom 8:11": "En als de Geest van Hem, Die Jezus uit de doden opgewekt heeft, in u woont, zal Hij, Die Christus uit de doden opgewekt heeft, ook uw sterfelijke lichamen levend maken door Zijn Geest, Die in u woont.", "Luk 24:1-12": "En op de eerste dag van de week, heel vroeg in de morgenstond, gingen zij naar het graf, en droegen de specerijen die zij bereid hadden, en sommigen met hen. En zij vonden de steen afgewenteld van het graf. En toen zij naar binnen gegaan waren, vonden zij het lichaam van de Heere Jezus niet.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "Joh 5:24": "Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort en Hem gelooft Die Mij gezonden heeft, die heeft het eeuwige leven, en komt niet in het oordeel, maar is overgegaan uit de dood in het leven.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "2 Tess 3:2": "En opdat wij verlost mogen worden van de ongeschikte en boze mensen; want het geloof is niet ieders deel.", "1 Kor 2:14": "Maar de natuurlijke mens begrijpt niet de dingen die van de Geest van God zijn; want ze zijn hem dwaasheid, en hij kan ze niet verstaan, omdat ze geestelijk beoordeeld worden.", "1 Kor 12:30": "Hebben zij allemaal gaven van gezondmaking? Spreken zij allemaal met allerlei talen? Kunnen zij allemaal uitleggen?", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Jes 59:17": "Want Hij trok gerechtigheid aan als een pantser, en de helm van het heil zette Hij op Zijn hoofd, en de kleren van de wraak trok Hij aan als kleding, en Hij deed de ijver aan als een mantel.", "Hand 26:23": "Namelijk dat de Christus moest lijden, en dat Hij, als Eerste uit de opstanding van de doden, een licht zou verkondigen aan dit volk en aan de heidenen.", "Kol 2:7": "Geworteld en opgebouwd in Hem, en bevestigd in het geloof, zoals u geleerd bent, overvloedig zijnde daarin, met dankzegging.", "Mark 15:34": "En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Hand 1:8": "maar u zult de kracht van de Heilige Geest ontvangen, Die over u komen zal; en u zult Mijn getuigen zijn, zowel in Jeruzalem als in heel Judea en Samaria, en tot aan het uiterste van de aarde.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Ps 22:3": "Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte.", "Luk 18:33": "En nadat zij Hem gegeseld hebben, zullen zij Hem doden; en op de derde dag zal Hij weer opstaan.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Ps 24:7-10": "Heft uw hoofden op, poorten, en verhef u, eeuwige deuren, opdat de Koning der ere ingaat! Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat!", "Luk 24:6": "Hij is hier niet, maar Hij is opgestaan. Denk eraan hoe Hij tot u gesproken heeft, toen Hij nog in Galilea was,", "Joh 12:44": "En Jezus riep en zei: Wie in Mij gelooft, gelooft niet in Mij, maar in Hem Die Mij gezonden heeft.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Luk 14:1-6": "En het gebeurde, toen Hij in het huis van een van de leiders van de Farizeeën gekomen was, op de sabbat, om brood te eten, dat zij Hem in de gaten hielden. En zie, er was een zeker waterzuchtig mens voor Hem. En Jezus antwoordde en zei tegen de wetgeleerden en Farizeeën: Is het ook geoorloofd op de sabbat gezond te maken?", "Joh 12:48": "Wie Mij verwerpt en Mijn woorden niet ontvangt, heeft iemand die hem oordeelt; het woord dat Ik gesproken heb, dat zal hem oordelen op de laatste dag.", "Hand 10:46-48": "Want zij hoorden hen spreken in vreemde talen, en God groot maken. Toen antwoordde Petrus: Kan iemand soms het water weren, zodat dezen niet gedoopt zouden worden, die de Heilige Geest ontvangen hebben, evenals ook wij? En hij beval dat zij gedoopt zouden worden in de Naam van de Heere. Toen vroegen zij hem of hij enige dagen bij hen wilde blijven.", "Joh 18:22": "En toen Hij dit zei, gaf een van de dienaars die daarbij stond Jezus een klap in het gezicht en zei: Antwoordt U zo de hogepriester?", "1 Petr 5:12": "Door Silvanus, die u een trouwe broeder is, zoals ik meen, heb ik u in het kort geschreven, u vermanend en u ervan verzekerend dat dit de ware genade van God is, waarin u staat.", "Jak 1:7": "Want laat die mens niet menen dat hij iets ontvangen zal van de Heere.", "Joh 11:52": "en niet alleen voor dat volk, maar ook opdat Hij de kinderen van God die verstrooid waren, tot één zou samenbrengen.", "Joh 1:10": "Hij was in de wereld, en de wereld is door Hem gemaakt; en de wereld heeft Hem niet gekend.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Luk 13:31": "Op diezelfde dag kwamen er enige Farizeeën naar Hem toe, die zeiden: Ga weg en vertrek van hier, want Herodes wil U doden.", "1 Kron 16:31": "Laat de hemelen zich verblijden, en de aarde zich verheugen, en laat men onder de heidenen zeggen: De HEERE regeert.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Jes 57:18": "Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.", "Luk 2:32": "een licht tot verlichting van de heidenen, en tot heerlijkheid van Uw volk Israël.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Jer 3:23": "Waarlijk, tevergeefs verwacht men het van de heuvels en de menigte van bergen; waarlijk, in de HEERE, onze God, is het heil van Israël!", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Hand 10:44-46": "Terwijl Petrus deze woorden nog sprak, viel de Heilige Geest op allen die het Woord hoorden. En de gelovigen die uit de besnijdenis waren, zovelen als er met Petrus meegekomen waren, waren buiten zichzelf, omdat de gave van de Heilige Geest ook op de heidenen uitgestort werd. Want zij hoorden hen spreken in vreemde talen, en God groot maken. Toen antwoordde Petrus:", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Rom 15:19": "door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Hand 8:36-38": "En terwijl zij over de weg reisden, kwamen zij bij een zeker water; en de kamerling zei: Zie, hier is water; wat verhindert mij om gedoopt te worden? En Filippus zei: Als u van ganser harte gelooft, is het geoorloofd. En hij antwoordde en zei: Ik geloof dat Jezus Christus de Zoon van God is. En hij gebood de wagen stil te houden; en zij daalden beiden af in het water, zowel Filippus als de kamerling, en hij doopte hem.", "1 Petr 1:8": "Hem, Die u niet gezien hebt en toch liefhebt, in Wie u nu, hoewel u Hem niet ziet, maar gelooft, zich verheugt met een onuitsprekelijke en heerlijke vreugde;", "Rom 1:14": "Aan Grieken en barbaren, aan wijzen en onwijzen ben ik een schuldenaar.", "Joh 10:16": "Ik heb nog andere schapen, die niet van deze schaapskooi zijn; ook die moet Ik toebrengen; en zij zullen Mijn stem horen; en het zal worden één kudde, en één Herder.", "Mark 14:27-31": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden. Maar nadat Ik zal zijn opgestaan, zal Ik u voorgaan naar Galilea. En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet doen.", "Matt 26:4": "en zij beraadslaagden samen dat zij Jezus met listigheid vangen en doden zouden.", "Joh 10:21": "Anderen zeiden: Dit zijn geen woorden van iemand die bezeten is; kan een duivel soms de ogen van blinden openen?", "Matt 10:34": "Meent niet dat Ik gekomen ben om vrede te brengen op de aarde; Ik ben niet gekomen om vrede te brengen, maar het zwaard.", "1 Tess 2:13": "Daarom danken wij ook God zonder ophouden, dat u, toen u het Woord van de prediking van God van ons ontvangen had, dat aangenomen hebt niet als een woord van mensen, maar (zoals het werkelijk is) als het Woord van God, dat ook werkt in u die gelooft.", "Luk 24:23": "en toen zij Zijn lichaam niet vonden, kwamen zij en zeiden dat zij ook een verschijning van engelen gezien hadden, die zeggen dat Hij leeft.", "Hand 19:9": "Maar toen sommigen verhard werden en ongehoorzaam waren, en kwaadspraken van de weg des Heeren voor de menigte, ging hij bij hen weg, en zonderde de discipelen af, dagelijks sprekend in de school van een zekere Tyrannus.", "Mark 9:23": "En Jezus zei tegen hem: Als u kunt geloven, zijn alle dingen mogelijk voor hem die gelooft.", "Mark 6:7": "En Hij riep de twaalf tot Zich, en begon hen twee aan twee uit te zenden, en gaf hun macht over de onreine geesten;", "Gen 12:13": "Zeg toch: U bent mijn zuster; opdat het mij goed gaat om u, en ik in leven blijf om uwentwil.", "Ef 2:8": "Want uit genade bent u zalig geworden door het geloof; en dat niet uit u, het is Gods gave;", "Jer 13:17": "Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.", "Rom 4:20": "En hij heeft aan de belofte van God niet getwijfeld door ongeloof; maar is gesterkt geweest in het geloof, en heeft God de eer gegeven;", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "Hand 9:13": "En Ananias antwoordde: Heere, ik heb van velen gehoord over deze man, hoeveel kwaad hij Uw heiligen in Jeruzalem heeft aangedaan;", "Luk 24:22-24": "Maar ook enkele vrouwen uit ons midden hebben ons verbaasd, die vroeg in de morgenstond bij het graf geweest zijn; en toen zij Zijn lichaam niet vonden, kwamen zij en zeiden dat zij ook een verschijning van engelen gezien hadden, die zeggen dat Hij leeft. En sommigen van hen die met ons zijn, gingen naar het graf, en vonden het zo als de vrouwen ook gezegd hadden; maar Hem zagen zij niet.", "Matt 16:4": "Het slechte en overspelige geslacht verlangt een teken; en het zal geen teken gegeven worden, dan het teken van Jona, de profeet. En Hij verliet hen en ging weg.", "Matt 21:38-45": "Maar toen de landbouwers de zoon zagen, zeiden zij onder elkaar: Deze is de erfgenaam, kom, laten we hem doden en zijn erfenis voor onszelf houden. En zij grepen hem, wierpen hem de wijngaard uit, en doodden hem. Wanneer dan de heer van de wijngaard komt, wat zal hij die landbouwers doen?", "Luk 22:52": "En Jezus zei tegen de overpriesters, en de hoofdmannen van de tempel, en de oudsten, die tegen Hem gekomen waren: Bent u uitgegaan met zwaarden en stokken alsof tegen een rover?", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "2 Kor 4:3": "Maar als ons Evangelie ook bedekt is, dan is het bedekt bij hen die verloren gaan;", "Ex 6:11": "Doch Mozes sprak voor de HEERE en zei: Zie, de kinderen van Israël hebben naar mij niet geluisterd; hoe zou Farao dan naar mij luisteren? Bovendien ben ik onbesneden van lippen.", "Rom 5:2": "Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God.", "Mark 10:34": "en zij zullen Hem bespotten, en Hem geselen, en Hem bespuwen, en Hem doden; en op de derde dag zal Hij weer opstaan.", "Rom 6:5": "Want als wij met Hem één geworden zijn in de gelijkmaking van Zijn dood, dan zullen wij het ook zijn in de gelijkmaking van Zijn opstanding;", "Mark 14:72": "En de haan kraaide de tweede keer; en Petrus herinnerde zich het woord dat Jezus tegen hem gezegd had: Voordat de haan tweemaal gekraaid zal hebben, zult u Mij driemaal verloochenen. En hij, zich naar buiten begevend, huilde.", "2 Petr 2:12-17": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Rom 10:9": "namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden.", "Matt 4:23": "En Jezus trok rond door heel Galilea, en Hij onderwees in hun synagogen en predikte het Evangelie van het Koninkrijk, en genas alle ziekte en alle kwaal onder het volk.", "Joh 13:31": "Toen hij dan naar buiten gegaan was, zei Jezus: Nu is de Zoon des mensen verheerlijkt, en God is in Hem verheerlijkt.", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Matt 10:1": "Toen Hij Zijn twaalf discipelen bij Zich geroepen had, gaf Hij hun macht over de onreine geesten, om ze uit te werpen, en om alle ziekte en alle kwaal te genezen.", "Jes 52:15": "zo zal Hij veel heidenvolken besprenkelen; ja, koningen zullen hun mond over Hem dichthouden; want aan wie het niet verkondigd was, die zullen het zien, en wie het niet gehoord hebben, die zullen het begrijpen.", "Hos 2:10": "En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "Hand 5:15": "zodat zij de zieken uitdroegen op de straten, en legden hen op bedden en matten, opdat, als Petrus kwam, ook maar de schaduw iemand van hen zou mogen beschaduwen.", "Ps 109:6-19": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "Mark 3:21": "En toen zijn verwanten dit hoorden, gingen zij eropuit om Hem vast te houden; want zij zeiden: Hij is buiten zichzelf.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Luk 1:15-17": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot. En hij zal velen van de kinderen van Israël bekeren tot de Heere, hun God. En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Joh 17:7": "Nu weten zij, dat alles wat U Mij gegeven hebt, van U is.", "1 Kor 15:12-23": "Als nu van Christus gepredikt wordt dat Hij uit de doden opgewekt is, hoe zeggen sommigen onder u dat er geen opstanding van de doden is? En als er geen opstanding van de doden is, dan is Christus ook niet opgewekt. En als Christus niet opgewekt is, dan is onze prediking zonder inhoud, en is ook uw geloof zonder inhoud.", "Hebr 2:4": "terwijl God erbij getuigde door tekenen en wonderen, en allerlei krachten en gaven van de Heilige Geest, naar Zijn wil.", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "Jes 7:9": "Ondertussen zal Samaria het hoofd van Efraïm zijn, en de zoon van Remalia het hoofd van Samaria. Als u niet gelooft, zult u zeker niet standhouden.", "2 Tim 2:1": "U dan, mijn zoon, word gesterkt in de genade die in Christus Jezus is;", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "1 Tess 1:2-8": "Wij danken God altijd voor u allen, terwijl wij aan u denken in onze gebeden; Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader; Wij weten, geliefde broeders, dat u door God uitgekozen bent;", "1 Petr 1:25": "maar het Woord van de Heere blijft in eeuwigheid. En dit is het Woord dat onder u verkondigd is.", "Luk 11:23-26": "Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit. Wanneer de onreine geest van de mens is uitgevaren, gaat hij door dorre plaatsen, op zoek naar rust; en als hij die niet vindt, zegt hij: Ik zal terugkeren naar mijn huis, waar ik uit vandaan kwam. En als hij komt, vindt hij het schoongeveegd en op orde gebracht.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "2 Kron 6:27": "Hoor U dan in de hemel, en vergeef de zonden van Uw knechten en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben, waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Neh 9:27": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten.", "Hand 15:21": "Want Mozes heeft van oude tijden af in elke stad mensen die hem prediken, en hij wordt elke sabbat in de synagogen gelezen.", "Hand 2:34": "Want David is niet opgevaren naar de hemel; maar hij zegt zelf: De Heere heeft gesproken tot mijn Heere: Zit aan Mijn rechterhand,", "Ef 2:3-5": "onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen; Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden),", "Joh 10:20": "En velen van hen zeiden: Hij heeft een duivel, en is buiten zinnen; waarom luistert u naar Hem?", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Neh 13:15-22": "In diezelfde dagen zag ik in Juda mensen die persen traden op de sabbat, en die garven binnenbrachten, die zij op ezels laadden; alsook wijn, druiven en vijgen, en allerlei last, die zij op de sabbatdag naar Jeruzalem binnenbrachten; en ik waarschuwde hen op de dag dat zij eetwaren verkochten. Daar woonden ook Tyriërs binnen, die vis aanbrachten, en allerlei koopwaren, die zij op de sabbat verkochten aan de kinderen van Juda en in Jeruzalem. Zo twistte ik met de edelen van Juda, en zei tegen hen: Wat voor een slechte zaak is dit, die u doet, en waarmee u de sabbatdag ontheiligt?", "Jes 45:17": "Maar Israël wordt verlost door de HEERE, met een eeuwige verlossing; u zult niet beschaamd worden, ook niet tot schande worden, tot in alle eeuwigheden.", "Mark 8:18": "Ogen hebbend, ziet u niet? En oren hebbend, hoort u niet?", "1 Kor 15:25": "Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.", "Luk 22:69": "van nu af aan zal de Zoon des mensen gezeten zijn aan de rechterhand van de kracht van God.", "Hebr 7:26": "Want zo'n Hogepriester paste bij ons: heilig, onschuldig, onbesmet, afgescheiden van de zondaars, en hoger geworden dan de hemelen;", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Luk 1:30": "En de engel zei tegen haar: Wees niet bang, Maria, want u hebt genade bij God gevonden.", "Mark 14:48": "En Jezus antwoordde en zei tegen hen: Bent u uitgegaan met zwaarden en stok
