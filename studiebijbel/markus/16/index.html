<style>
  :root {
    /* huisstijl overgenomen van andre-scholten.nl (Quartz) */
    --light:#ffffff; --lightgray:#e5e5e5; --gray:#b3b3b3; --darkgray:#333333; --dark:#111111;
    --secondary:#1a1a1a; --tertiary:#757575; --highlight:#1a1a1a1f; --textHighlight:#e0e0e088;

    --bg-soft: #f5f5f5; --border: var(--lightgray); --tekst: var(--darkgray);
  }
  * { box-sizing: border-box; }
  body { font-family: var(--bodyFont); background: var(--bg); color: var(--tekst); margin: 0; line-height: 1.7; }
  .omslag { max-width: 900px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }

  @media (min-width: 801px) { .site-header { margin-top: 4.8rem; } }

  .page-title a:hover { color:var(--tertiary); }

  .site-nav { font-family:"Lora"; letter-spacing:.18em; text-transform:uppercase; border-top:1px solid var(--lightgray); border-bottom:1px solid var(--lightgray); margin:.8rem 0 2rem; padding:1rem 0; font-size:.82em; text-align:center; }

  .site-nav a:hover { color:var(--tertiary); text-decoration:underline; }
  .nav-sep { color:var(--gray); }
  .kruimel { font-family: "Lora"; font-size: .78rem; color: #999; margin: 1rem 0 .2rem; }
  .kruimel a { color: var(--accent); text-decoration: none; }
  h2.hfd { color: var(--dark); text-align: center; font-size: 1.75rem; font-weight: 700; margin: 2rem 0 0; }
  .ondertitel { text-align: center; color: #666666; font-style: italic; font-size: .95rem; margin-bottom: 1rem; }
  .hfdnav { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; font-family:"Lora"; font-size:.85rem; padding:.5rem 0; margin-bottom:1.1rem; }
  .navknop { color:var(--accent); text-decoration:none; padding:.25rem .3rem; white-space:nowrap; }
  .navknop:hover { color:var(--accent-donker); text-decoration:underline; }
  .navknop.uit { color:#ccc; pointer-events:none; }
  .hfdnav .midden { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem; color:#777; }
  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
  #bibliotheekknop { padding:.3rem .7rem; font-size:1rem; line-height:1; }
  /* mobiel (smal): natuurlijke DOM-volgorde boek→hoofdstuk→vertaling→lampje,
     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }
  #notenlijst { margin: 1.5rem 0 0 2.4rem; font-family: "Lora"; font-size: .82rem; color: #666; border-top: 1px solid var(--border); padding-top: .8rem; }
  #notenlijst h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-donker); margin: 0 0 .5rem; }
  #notenlijst .nootregel { margin: .25rem 0; }
  #notenlijst .nootregel .nn { color: var(--accent); font-weight: 700; margin-right: .35rem; }
  .kopieer { position: absolute; right: .4rem; top: .55rem; opacity: 0; border: none; background: none; cursor: pointer; color: var(--accent); font-size: .95rem; padding: .1rem .3rem; transition: opacity .15s; }
  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  /* naslagpaneel */
  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: "Lora"; font-size: 1rem; }
  .paneel.open { display: block; }
  .ntabs { display: flex; gap: .4rem; margin-bottom: .8rem; }
  .ntab { border: 1px solid var(--border); background: var(--bg-soft); border-radius: 6px 6px 0 0; padding: .28rem .95rem; cursor: pointer; font-size: .8rem; color: #666; }
  .ntab.actief { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ntab.leeg { opacity: .4; cursor: default; }
  .tsk-kop { font-weight: 700; color: var(--accent-donker); margin: .55rem 0 .3rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
  .verg-kop { font-family:"Lora"; font-weight: 700; color: var(--accent-donker); font-size: 1.05rem; margin: 0 0 .6rem; padding-bottom: .35rem; border-bottom: 2px solid var(--accent); }
  .bu-lijst { list-style: disc; margin: .2rem 0 0 1.2rem; padding: 0; }

  .uitleg-bron { border-bottom: 1px solid var(--bg-soft); padding: .3rem 0; }

  .opener { display: block; cursor: pointer; font-weight: 600; color: var(--accent-donker); padding: .2rem 0; }
  .opener:hover { color: var(--accent); }
  .opener::before { content: '▸ '; font-size: .75em; }
  .opener.open::before { content: '▾ '; }
  .smoothOpen { max-height: 0; overflow: hidden; transition: max-height .25s ease; }

  .tsk-sub { font-weight: 600; color: #444; margin: .5rem 0 .2rem; }

  .onderwerp { padding:.45rem 0; border-bottom:1px solid var(--bg-soft); }

  .onderwerp .naam { font-weight: 700; color: var(--accent-donker); }

  a.ondlink:hover { text-decoration: underline; }
  .ond-topic { margin: .7rem 0; }
  .ond-subs { margin: .25rem 0 0 1.2rem; padding-left: 1rem; list-style: disc; color: #333333; }
  .ond-subs .ond-subs { list-style: circle; }
  .ond-subs li { margin: .4rem 0; }
  .ond-label { color: #333333; }
  .ond-refs { margin: .3rem 0 0; }
  .ond-refs .alle { display: inline; }
  .ond-refs .alle summary { display: inline-block; cursor: pointer; color: var(--accent); font-size: .8rem; margin: .1rem 0; }
  .onderwerp .label { font-style: italic; color: #666; }
  .ondrefs { line-height:1.9; margin-top:.4rem; }
  .meer { font-size:.72rem; color:#999; margin-left:.3rem; }
  .schakelnav { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .schakelnav .pos { font-size:.75rem; color:#999; }
  .alle > summary { font-size:.75rem; color:var(--accent); cursor:pointer; margin-top:.35rem; list-style:none; }
  .alle > summary::-webkit-details-marker { display:none; }
  .alle > summary:hover { text-decoration:underline; }
  .bronregel { font-size:.72rem; color:#999; margin-top:.6rem; }

  #popup { position: absolute; display: none; max-width: 380px; background: #ffffff; border: 1px solid #cccccc; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: .7rem .9rem; font-size: .85rem; line-height: 1.55; z-index: 20; font-family: "Lora", serif; }
  #popup .pref { font-family: "Lora"; font-weight: 700; font-size: .72rem; color: var(--accent-donker); margin-bottom: .25rem; text-transform: uppercase; letter-spacing: .05em; }
  #popup .pklik { font-family: "Lora"; font-size: .68rem; color: #999; margin-top: .4rem; }

  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }
  .site-footer-col { display:flex; flex-direction:column; gap:.5rem; }
  .site-footer-mid { text-align:center; }
  .site-footer-right { text-align:right; }
  .site-footer a { color:var(--secondary); text-decoration:underline; }

  footer.site { margin-top: 2.5rem; margin-bottom: -3rem; border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; font-family: "Lora"; font-size: .72rem; color: #999; line-height: 1.7; }
  @media (max-width: 640px) { .omslag { padding: .6rem .7rem 3rem; } header.site h1 { font-size: 1.5rem; } }
</style>

uiten, en vluchtten van het graf, en beving en ontzetting hadden hen aangegrepen; en zij zeiden niemand iets; want zij waren bang.","9":"En toen *Jezus* was opgestaan, vroeg in de morgen, op de eerste *dag* van de week, verscheen Hij eerst aan Maria Magdalena, uit wie Hij zeven duivels had uitgeworpen.","10":"Zij ging heen, en vertelde het aan hen die met Hem geweest waren, die treurden en weenden.","11":"En toen dezen hoorden dat Hij leefde, en door haar gezien was, geloofden zij het niet.","12":"En daarna verscheen Hij in een andere gedaante aan twee van hen, terwijl zij liepen en naar het veld gingen.","13":"Ook dezen gingen heen, en vertelden het aan de anderen; *maar* zij geloofden ook die niet.","14":"Daarna verscheen Hij aan de elf, terwijl zij aanzaten, en verweet *hun* hun ongeloof en hardheid van hart, omdat zij hen die Hem gezien hadden nadat Hij opgestaan was, niet geloofd hadden.","15":"En Hij zei tegen hen: Ga heen in de hele wereld, predik het Evangelie aan alle schepselen.","16":"Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.","17":"En degenen die geloofd zullen hebben, zullen deze tekenen volgen: in Mijn Naam zullen zij duivels uitwerpen; met nieuwe tongen zullen zij spreken;","18":"slangen zullen zij oppakken; en al is het dat zij iets dodelijks zullen drinken, het zal hun niet schaden; op zieken zullen zij de handen leggen, en zij zullen gezond worden.","19":"De Heere dan, nadat Hij tot hen gesproken had, is opgenomen in de hemel, en zit aan de rechter*hand* van God.","20":"En zij gingen heen, en predikten overal, en de Heere werkte mee, en bevestigde het Woord door tekenen die daarop volgden. Amen."},"SV":{"1":"En als de sabbat voorbijgegaan was, hadden Maria Magdalena, en Maria, de *moeder* van Jakobus, en Salome specerijen gekocht, opdat zij kwamen en Hem zalfden.","2":"En zeer vroeg op den eersten *dag* der week, kwamen zij tot het graf, als de zon opging;","3":"En zeiden tot elkander: Wie zal ons den steen van de deur des grafs afwentelen?","4":"( En opziende zagen zij, dat de steen afgewenteld was) want hij was zeer groot.","5":"En in het graf ingegaan zijnde, zagen zij een jongeling, zittende ter rechter *zijde*, bekleed met een wit lang kleed, en werden verbaasd.","6":"Maar hij zeide tot haar: Zijt niet verbaasd; gij zoekt Jezus den Nazarener, Die gekruist was; Hij is opgestaan; Hij is hier niet; ziet de plaats, waar zij Hem gelegd hadden.","7":"Doch gaat heen, zegt Zijnen discipelen, en Petrus, dat Hij u voorgaat naar Galilea; aldaar zult gij Hem zien, gelijk Hij ulieden gezegd heeft.","8":"En zij, haastelijk uitgegaan zijnde, vloden van het graf, en beving en ontzetting had haar bevangen; en zij zeiden niemand iets; want zij waren bevreesd.","9":"En als *Jezus* opgestaan was, des morgens vroeg, op den eersten *dag* der week, verscheen Hij eerst aan Maria Magdalena, uit welke Hij zeven duivelen uitgeworpen had.","10":"Deze, heengaande, boodschapte het dengenen, die met Hem geweest waren, welke treurden en weenden.","11":"En als dezen hoorden, dat Hij leefde, en van haar gezien was, geloofden zij het niet.","12":"En na dezen is Hij geopenbaard in een andere gedaante, aan twee van hen, daar zij wandelden, en in het veld gingen.","13":"Dezen, ook heengaande, boodschapten het aan de anderen; *maar* zij geloofden ook die niet.","14":"Daarna is Hij geopenbaard aan de elven, daar zij aanzaten, en verweet *hun* hun ongelovigheid en hardigheid des harten, omdat zij niet geloofd hadden degenen, die Hem gezien hadden, nadat Hij opgestaan was.","15":"En Hij zeide tot hen: Gaat heen in de gehele wereld, predikt het Evangelie aan alle kreaturen.","16":"Die geloofd zal hebben, en gedoopt zal zijn, zal zalig worden; maar die niet zal geloofd hebben, zal verdoemd worden.","17":"En degenen, die geloofd zullen hebben, zullen deze tekenen volgen: in Mijn Naam zullen zij duivelen uitwerpen; met nieuwe tongen zullen zij spreken.","18":"Slangen zullen zij opnemen; en al is het, dat zij iets dodelijks zullen drinken, dat zal hun niet schaden; op kranken zullen zij de handen leggen, en zij zullen gezond worden.","19":"De Heere dan, nadat Hij tot hen gesproken had, is opgenomen in den hemel, en is gezeten aan de rechter *hand* Gods.","20":"En zij, uitgegaan zijnde, predikten overal, en de Heere wrocht mede, en bevestigde het Woord door tekenen, die daarop volgden. Amen."},"KJV":{"1":"And when the sabbath was past, Mary Magdalene, and Mary the *mother* of James, and Salome, had bought sweet spices, that they might come and anoint him.","2":"And very early in the morning the first *day* of the week, they came unto the sepulchre at the rising of the sun.","3":"And they said among themselves, Who shall roll us away the stone from the door of the sepulchre?","4":"And when they looked, they saw that the stone was rolled away: for it was very great.","5":"And entering into the sepulchre, they saw a young man sitting on the right side, clothed in a long white garment; and they were affrighted.","6":"And he saith unto them, Be not affrighted: Ye seek Jesus of Nazareth, which was crucified: he is risen; he is not here: behold the place where they laid him.","7":"But go your way, tell his disciples and Peter that he goeth before you into Galilee: there shall ye see him, as he said unto you.","8":"And they went out quickly, and fled from the sepulchre; for they trembled and were amazed: neither said they any thing to any *man*; for they were afraid.","9":"Now when *Jesus* was risen early the first *day* of the week, he appeared first to Mary Magdalene, out of whom he had cast seven devils.","10":"*And* she went and told them that had been with him, as they mourned and wept.","11":"And they, when they had heard that he was alive, and had been seen of her, believed not.","12":"After that he appeared in another form unto two of them, as they walked, and went into the country.","13":"And they went and told *it* unto the residue: neither believed they them.","14":"Afterward he appeared unto the eleven as they sat at meat, and upbraided them with their unbelief and hardness of heart, because they believed not them which had seen him after he was risen.","15":"And he said unto them, Go ye into all the world, and preach the gospel to every creature.","16":"He that believeth and is baptized shall be saved; but he that believeth not shall be damned.","17":"And these signs shall follow them that believe; In my name shall they cast out devils; they shall speak with new tongues;","18":"They shall take up serpents; and if they drink any deadly thing, it shall not hurt them; they shall lay hands on the sick, and they shall recover.","19":"So then after the Lord had spoken unto them, he was received up into heaven, and sat on the right hand of God.","20":"And they went forth, and preached every where, the Lord working with *them*, and confirming the word with signs following. Amen."}},"tsk":{"1":[{"kopje":"toen","refs":["Mark 15:42","Matt 28:1-10","Luk 23:54","Luk 23:56","Luk 24:1-12","Joh 19:31","Joh 20:1-10"]},{"kopje":"Maria Magdalena","refs":["Mark 15:40","Mark 15:47","Luk 24:10","Joh 19:25"]},{"kopje":"specerijen","refs":["Mark 14:3","Mark 14:8","2 Kron 16:14","Joh 19:40"]}],"3":[{"kopje":"Wie","refs":["Mark 15:46","Mark 15:47","Matt 27:60-66"]}],"4":[{"kopje":"zagen zij","refs":["Matt 28:2-4","Luk 24:2","Joh 20:1"]}],"5":[{"kopje":"ingingen","refs":["Luk 24:3","Joh 20:8"]},{"kopje":"een jongeman","refs":["Matt 28:1","Joh 20:11","Luk 24:4","Dan 10:5","Dan 10:6","Matt 28:3","Luk 24:4","Luk 24:5","Joh 20:11","Joh 20:12"]},{"kopje":"en zij","refs":["Mark 6:49","Mark 6:50","Dan 8:17","Dan 10:7-9","Dan 10:12","Luk 1:12","Luk 1:29","Luk 1:30"]}],"6":[{"kopje":"Wees niet","refs":["Matt 14:26","Matt 14:27","Matt 28:4","Matt 28:5","Openb 1:17","Openb 1:18"]},{"kopje":"u zoekt","refs":["Ps 105:3","Ps 105:4","Spr 8:17"]},{"kopje":"Jezus","refs":["Joh 19:19","Joh 19:20","Hand 2:22","Hand 2:23","Hand 4:10","H     if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
