<style>
  :root {
    /* huisstijl overgenomen van andre-scholten.nl (Quartz) */
    --light:#ffffff; --lightgray:#e5e5e5; --gray:#b3b3b3; --darkgray:#333333; --dark:#111111;

    --bg-soft: #f5f5f5; --border: var(--lightgray); --tekst: var(--darkgray);
  }
  * { box-sizing: border-box; }
  body { font-family: var(--bodyFont); background: var(--bg); color: var(--tekst); margin: 0; line-height: 1.7; }
  .omslag { max-width: 900px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }

  @media (min-width: 801px) { .site-header { margin-top: 4.8rem; } }

  .site-nav { font-family:"Lora"; letter-spacing:.18em; text-transform:uppercase; border-top:1px solid var(--lightgray); border-bottom:1px solid var(--lightgray); margin:.8rem 0 2rem; padding:1rem 0; font-size:.82em; text-align:center; }

  .site-nav a:hover { color:var(--tertiary); text-decoration:underline; }
  .nav-sep { color:var(--gray); }
  .kruimel { font-family: "Lora"; font-size: .78rem; color: #999; margin: 1rem 0 .2rem; }
  .kruimel a { color: var(--accent); text-decoration: none; }
  h2.hfd { color: var(--dark); text-align: center; font-size: 1.75rem; font-weight: 700; margin: 2rem 0 0; }
  .ondertitel { text-align: center; color: #666666; font-style: italic; font-size: .95rem; margin-bottom: 1rem; }
  .hfdnav { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; font-family:"Lora"; font-size:.85rem; padding:.5rem 0; margin-bottom:1.1rem; }
  .navknop { color:var(--accent); text-decoration:none; padding:.25rem .3rem; white-space:nowrap; }
  .navknop:hover { color:var(--accent-donker); text-decoration:underline; }
  .navknop.uit { color:#ccc; pointer-events:none; }
  .hfdnav .midden { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem; color:#777; }
  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
  #bibliotheekknop { padding:.3rem .7rem; font-size:1rem; line-height:1; }

     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }
  #notenlijst { margin: 1.5rem 0 0 2.4rem; font-family: "Lora"; font-size: .82rem; color: #666; border-top: 1px solid var(--border); padding-top: .8rem; }
  #notenlijst h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-donker); margin: 0 0 .5rem; }

  #notenlijst .nootregel .nn { color: var(--accent); font-weight: 700; margin-right: .35rem; }
  .kopieer { position: absolute; right: .4rem; top: .55rem; opacity: 0; border: none; background: none; cursor: pointer; color: var(--accent); font-size: .95rem; padding: .1rem .3rem; transition: opacity .15s; }
  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  /* naslagpaneel */
  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: "Lora"; font-size: 1rem; }
  .paneel.open { display: block; }
  .ntabs { display: flex; gap: .4rem; margin-bottom: .8rem; }

  .ntab.actief { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ntab.leeg { opacity: .4; cursor: default; }
  .tsk-kop { font-weight: 700; color: var(--accent-donker); margin: .55rem 0 .3rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
  .verg-kop { font-family:"Lora"; font-weight: 700; color: var(--accent-donker); font-size: 1.05rem; margin: 0 0 .6rem; padding-bottom: .35rem; border-bottom: 2px solid var(--accent); }

  .opener { display: block; cursor: pointer; font-weight: 600; color: var(--accent-donker); padding: .2rem 0; }
  .opener:hover { color: var(--accent); }
  .opener::before { content: '▸ '; font-size: .75em; }

  .onderwerp .naam { font-weight: 700; color: var(--accent-donker); }

  .ond-topic { margin: .7rem 0; }
  .ond-subs { margin: .25rem 0 0 1.2rem; padding-left: 1rem; list-style: disc; color: #333333; }
  .ond-subs .ond-subs { list-style: circle; }
  .ond-subs li { margin: .4rem 0; }
  .ond-label { color: #333333; }
  .ond-refs { margin: .3rem 0 0; }

  .ond-refs .alle summary { display: inline-block; cursor: pointer; color: var(--accent); font-size: .8rem; margin: .1rem 0; }
  .onderwerp .label { font-style: italic; color: #666; }
  .ondrefs { line-height:1.9; margin-top:.4rem; }
  .meer { font-size:.72rem; color:#999; margin-left:.3rem; }

  .schakelnav .pos { font-size:.75rem; color:#999; }
  .alle > summary { font-size:.75rem; color:var(--accent); cursor:pointer; margin-top:.35rem; list-style:none; }
  .alle > summary::-webkit-details-marker { display:none; }
  .alle > summary:hover { text-decoration:underline; }
  .bronregel { font-size:.72rem; color:#999; margin-top:.6rem; }

  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }
  .site-footer-col { display:flex; flex-direction:column; gap:.5rem; }
  .site-footer-mid { text-align:center; }
  .site-footer-right { text-align:right; }
  .site-footer a { color:var(--secondary); text-decoration:underline; }

  footer.site { margin-top: 2.5rem; margin-bottom: -3rem; border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; font-family: "Lora"; font-size: .72rem; color: #999; line-height: 1.7; }
  @media (max-width: 640px) { .omslag { padding: .6rem .7rem 3rem; } header.site h1 { font-size: 1.5rem; } }
</style>

 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het begin van het Evangelie van JEZUS CHRISTUS, de Zoon van God.","2":"Zoals geschreven is in de profeten: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg voor U heen bereiden zal.","3":"De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht.","4":"Johannes doopte in de woestijn en predikte de doop van bekering tot vergeving van de zonden.","5":"En het hele Joodse land ging naar hem uit, en die van Jeruzalem; en zij werden allen door hem gedoopt in de rivier de Jordaan, terwijl zij hun zonden beleden.","6":"En Johannes was gekleed met kameelhaar, en met een leren gordel om zijn middel, en at sprinkhanen en wilde honing.","7":"En hij predikte en zei: Na mij komt Hij Die sterker is dan ik, van Wie ik niet waard ben mij te bukken en de riem van Zijn schoenen los te maken.","8":"Ik heb u wel gedoopt met water, maar Hij zal u dopen met de Heilige Geest.","9":"En het gebeurde in diezelfde dagen dat Jezus kwam van Nazareth, *gelegen* in Galilea, en werd door Johannes gedoopt in de Jordaan.","10":"En meteen, toen Hij uit het water opklom, zag Hij de hemelen opengaan, en de Geest, als een duif, op Hem neerdalen.","11":"En er kwam een stem uit de hemelen: U bent Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!","12":"En meteen dreef de Geest Hem de woestijn in.","13":"En Hij was daar in de woestijn veertig dagen, beproefd door de satan; en Hij was bij de wilde dieren; en de engelen dienden Hem.","14":"En nadat Johannes overgeleverd was, kwam Jezus in Galilea, en predikte het Evangelie van het Koninkrijk van God,","15":"en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.","16":"En toen Hij langs de zee van Galilea liep, zag Hij Simon en Andreas, zijn broer, een net in de zee werpen (want zij waren vissers);","17":"En Jezus zei tegen hen: Volg Mij, en Ik zal maken dat u vissers van mensen wordt.","18":"En zij verlieten meteen hun netten en volgden Hem.","19":"En van daar iets verder gegaan, zag Hij Jakobus, de *zoon* van Zebedeüs, en Johannes, zijn broer, en hen in het schip terwijl zij hun netten in orde maakten.","20":"En meteen riep Hij hen; en zij lieten hun vader Zebedeüs met de huurlingen in het schip, en volgden Hem na.","21":"En zij kwamen in Kapernaüm; en meteen ging Hij op de sabbatdag naar de synagoge en onderwees Hij.","22":"En zij stonden versteld van Zijn onderwijs; want Hij onderwees hen als iemand die gezag heeft, en niet als de Schriftgeleerden.","23":"En er was in hun synagoge een man met een onreine geest, en hij riep uit,","24":"en zei: Laat af, wat hebben wij met U *te maken*, Jezus van Nazareth? Bent U gekomen om ons te vernietigen? Ik weet Wie U bent: *namelijk* de Heilige van God.","25":"En Jezus bestrafte hem en zei: Zwijg, en ga uit hem weg.","26":"En de onreine geest, terwijl hij hem heen en weer schudde en met luide stem riep, ging uit hem weg.","27":"En zij waren allen zo verbaasd, dat zij onder elkaar vroegen: Wat is dit? Wat is dit voor een nieuw onderwijs, dat Hij met gezag ook de onreine geesten gebiedt, en zij Hem gehoorzaam zijn?","28":"En Zijn faam verspreidde zich meteen door heel de omliggende streek van Galilea.","29":"En zodra zij uit de synagoge gegaan waren, kwamen zij in het huis van Simon en Andreas, met Jakobus en Johannes.","30":"En Simons schoonmoeder lag met koorts; en meteen vertelden zij Hem over haar.","31":"En Hij ging naar haar toe, pakte haar hand, en richtte haar op; en meteen verliet de koorts haar, en zij diende hen.","32":"Toen het nu avond geworden was, toen de zon onderging, brachten zij tot Hem allen die ziek waren en die door de duivel bezeten waren.","33":"En de hele stad was bijeengekomen bij de deur.","34":"En Hij genas er velen die door verschillende ziekten getroffen waren; en Hij dreef veel duivels uit, en liet de duivels niet toe om te spreken, omdat zij Hem kenden.","35":"En vroeg in de morgen, toen het nog diep in de nacht was, stond Hij op, ging naar buiten, en ging naar een eenzame plaats, en bad daar.","36":"En Simon, en zij die met hem *waren*, gingen Hem achterna.","37":"En toen zij Hem gevonden hadden, zeiden zij tegen Hem: Iedereen zoekt U.","38":"En Hij zei tegen hen: Laten wij naar de naburige plaatsen gaan, opdat Ik ook daar predik; want daarvoor ben Ik uitgegaan.","39":"En Hij predikte in hun synagogen, door heel Galilea, en dreef de duivels uit.","40":"En er kwam een melaatse tot Hem, die Hem smeekte, op de knieën viel voor Hem, en tegen Hem zei: Als U wilt, kunt U mij reinigen.","41":"En Jezus, met innerlijke ontferming bewogen, strekte Zijn hand uit, raakte hem aan, en zei tegen hem: Ik wil het, word gereinigd!","42":"En toen Hij *dit* gezegd had, verdween de melaatsheid meteen van hem, en hij werd gereinigd.","43":"En nadat Hij hem streng vermaand had, stuurde Hij hem meteen weg;","44":"en zei tegen hem: Zie erop toe dat u het niemand zegt; maar ga heen en laat uzelf aan de priester zien, en offer voor uw reiniging wat Mozes geboden heeft, hun tot een getuigenis.","45":"Maar hij, toen hij weggegaan was, begon vele dingen te verkondigen en dat woord te verspreiden, zodat Hij niet meer openlijk in de stad kon komen, maar buiten in eenzame plaatsen was; en zij kwamen van alle kanten tot Hem."},"SV":{"1":"Het begin des Evangelies van JEZUS CHRISTUS, den Zoon van God.","2":"Gelijk geschreven is in de profeten: Ziet, Ik zend Mijn engel voor Uw aangezicht, die Uw weg voor U heen bereiden zal.","3":"De stem des roependen in de woestijn: Bereidt den weg des Heeren, maakt Zijn paden recht.","4":"Johannes was dopende in de woestijn, en predikende den doop der bekering tot vergeving der zonden.","5":"En al het Joodse land ging tot hem uit, en die van Jeruzalem; en werden allen van hem gedoopt in de rivier de Jordaan, belijdende hun zonden.","6":"En Johannes was gekleed met kemelshaar, en met een lederen gordel om zijn lenden, en at sprinkhanen en wilde honig.","7":"En hij predikte, zeggende: Na mij komt, Die sterker is dan ik, Wien ik niet waardig ben, nederbukkende, den riem Zijner schoenen te ontbinden.","8":"Ik heb ulieden wel gedoopt met water, maar Hij zal u dopen met den Heiligen Geest.","9":"En het geschiedde in diezelfde dagen, dat Jezus kwam van Nazareth, *gelegen* in Galilea, en werd van Johannes gedoopt in de Jordaan.","10":"En terstond, als Hij uit het water opklom, zag Hij de hemelen opengaan, en den Geest, gelijk een duif, op Hem nederdalen.","11":"En er geschiedde een stem uit de hemelen: Gij zijt Mijn geliefde Zoon, in Denwelken Ik Mijn welbehagen heb!","12":"En terstond dreef Hem de Geest uit in de woestijn.","13":"En Hij was aldaar in de woestijn veertig dagen, verzocht van den satan; en was bij de wilde gedierten; en de engelen dienden Hem.","14":"En nadat Johannes overgeleverd was, kwam Jezus in Galilea, predikende het Evangelie van het Koninkrijk Gods.","15":"En zeggende: De tijd is vervuld, en het Koninkrijk Gods nabij gekomen; bekeert u, en gelooft, het Evangelie.","16":"En wandelende bij de Galilese zee, zag Hij Simon en Andreas, zijn broeder, werpende het net in de zee ( want zij waren vissers);","17":"En Jezus zeide tot hen: Volgt Mij na, en Ik zal maken, dat gij vissers der mensen zult worden.","18":"En zij, terstond hun netten verlatende, zijn Hem gevolgd.","19":"En van daar een weinig voortgegaan zijnde, zag Hij Jakobus, den *zoon* van Zebedeüs, en Johannes, zijn broeder, en dezelven in het schip hun netten vermakende.","20":"En terstond riep Hij hen; en zij, latende hun vader Zebedeüs in het schip, met de huurlingen, zijn Hem nagevolgd.","21":"En zij kwamen binnen Kapernaum; en terstond op den sabbatdag in de synagoge gegaan zijnde, leerde Hij.","22":"En zij versloegen zich over Zijn leer; want Hij leerde hen, als machthebbende, en niet als de Schriftgeleerden.","23":"En er was in hun synagoge een mens, met een onreinen geest, en hij riep uit,","24":"Zeggende: Laat af, wat hebben wij met U *te* *doen*, Gij Jezus Nazarener, zijt Gij gekomen om ons te verderven? Ik ken U, wie Gij zijt, *namelijk* de Heilige Gods.","25":"En Jezus bestrafte hem, zeggende: Zwijg stil, en ga uit van hem.","26":"En de onreine geest, hem scheurende, en roepende met een grote stem, ging uit van hem.","27":"En zij werden allen verbaasd, zodat zij onder elkander vraagden, zeggende: Wat is dit? Wat nieuwe leer is deze, dat Hij met macht ook den onreinen geesten gebiedt, en zij Hem gehoorzaam zijn!","28":"En Zijn gerucht ging terstond uit, in het gehele omliggende land van Galilea.","29":"En van stonde aan uit de synagoge gegaan zijnde, kwamen zij in het huis van Simon en Andreas, met Jakobus en Johannes.","30":"En Simons vrouws moeder lag met de koorts; en terstond zeiden zij Hem van haar.","31":"En Hij, tot haar gaande, vatte haar hand, en richtte ze op; en terstond verliet haar de koorts, en zij diende henlieden.","32":"Als het nu avond geworden was, toen de zon onderging, brachten zij tot Hem allen, die kwalijk gesteld, en van den duivel bezeten waren.","33":"En de gehele stad was bijeenvergaderd omtrent de deur.","34":"En Hij genas er velen, die door verscheidene ziekten kwalijk gesteld waren; en wierp vele duivelen uit, en liet de duivelen niet toe te spreken, omdat zij Hem kenden.","35":"En des morgens vroeg, als het nog diep in den nacht was, opgestaan zijnde, ging Hij uit, en ging henen in een woeste plaats, en bad aldaar.","36":"En Simon, en die met hem *waren*, zijn Hem nagevolgd.","37":"En zij Hem gevonden hebbende, zeiden tot Hem: Zij zoeken U allen.","38":"En Hij zeide tot hen: Laat ons in de bijliggende vlekken gaan, opdat Ik ook daar predike; want daartoe ben Ik uitgegaan.","39":"En Hij predikte in hun synagogen, door geheel Galilea, en wierp de duivelen uit.","40":"En tot Hem kwam een melaatse, biddende Hem, en vallende voor Hem op de knieën, en tot Hem zeggende: Indien Gij wilt, Gij kunt mij reinigen.","41":"En Jezus, met barmhartigheid innerlijk bewogen zijnde, strekte de hand uit, en raakte hem aan, en zeide tot hem: Ik wil, word gereinigd!","42":"En als Hij *dit* gezegd had, ging de melaatsheid terstond van hem, en hij werd gereinigd.","43":"En als Hij hem strengelijk verboden had, deed Hij hem terstond van Zich gaan;","44":"En zeide tot hem: Zie, dat gij niemand iets zegt; maar ga heen en vertoon uzelven den priester, en offer voor uw reiniging, hetgeen Mozes geboden heeft, hun tot een getuigenis.","45":"Maar hij uitgegaan zijnde, begon vele dingen te verkondigen, en dat woord te verbreiden, alzo dat Hij niet meer openbaar in de stad kon komen, maar was buiten in de woeste plaatsen; en zij kwamen tot Hem van alle kanten."},"KJV":{"1":"The beginning of the gospel of Jesus Christ, the Son of God;","2":"As it is written in the prophets, Behold, I send my messenger before thy face, which shall prepare thy way before thee.","3":"The voice of one crying in the wilderness, Prepare ye the way of the Lord, make his paths straight.","4":"John did baptize in the wilderness, and preach the baptism of repentance for the remission of sins.","5":"And there went out unto him all the land of Judaea, and they of Jerusalem, and were all baptized of him in the river of Jordan, confessing their sins.","6":"And John was clothed with camel's hair, and with a girdle of a skin about his loins; and he did eat locusts and wild honey;","7":"And preached, saying, There cometh one mightier than I after me, the latchet of whose shoes I am not worthy to stoop down and unloose.","8":"I indeed have baptized you with water: but he shall baptize you with the Holy Ghost.","9":"And it came to pass in those days, that Jesus came from Nazareth of Galilee, and was baptized of John in Jordan.","10":"And straightway coming up out of the water, he saw the heavens opened, and the Spirit like a dove descending upon him:","11":"And there came a voice from heaven, *saying*, Thou art my beloved Son, in whom I am well pleased.","12":"And immediately the Spirit driveth him into the wilderness.","13":"And he was there in the wilderness forty days, tempted of Satan; and was with the wild beasts; and the angels ministered unto him.","14":"Now after that John was put in prison, Jesus came into Galilee, preaching the gospel of the kingdom of God,","15":"And saying, The time is fulfilled, and the kingdom of God is at hand: repent ye, and believe the gospel.","16":"Now as he walked by the sea of Galilee, he saw Simon and Andrew his brother casting a net into the sea: for they were fishers.","17":"And Jesus said unto them, Come ye after me, and I will make you to become fishers of men.","18":"And straightway they forsook their nets, and followed him.","19":"And when he had gone a little further thence, he saw James the *son* of Zebedee, and John his brother, who also were in the ship mending their nets.","20":"And straightway he called them: and they left their father Zebedee in the ship with the hired servants, and went after him.","21":"And they went into Capernaum; and straightway on the sabbath day he entered into the synagogue, and taught.","22":"And they were astonished at his doctrine: for he taught them as one that had authority, and not as the scribes.","23":"And there was in their synagogue a man with an unclean spirit; and he cried out,","24":"Saying, Let *us* alone; what have we to do with thee, thou Jesus of Nazareth? art thou come to destroy us? I know thee who thou art, the Holy One of God.","25":"And Jesus rebuked him, saying, Hold thy peace, and come out of him.","26":"And when the unclean spirit had torn him, and cried with a loud voice, he came out of him.","27":"And they were all amazed, insomuch that they questioned among themselves, saying, What thing is this? what new doctrine *is* this? for with authority commandeth he even the unclean spirits, and they do obey him.","28":"And immediately his fame spread abroad throughout all the region round about Galilee.","29":"And forthwith, when they were come out of the synagogue, they entered into the house of Simon and Andrew, with James and John.","30":"But Simon's wife's mother lay sick of a fever, and anon they tell him of her.","31":"And he came and took her by the hand, and lifted her up; and immediately the fever left her, and she ministered unto them.","32":"And at even, when the sun did set, they brought unto him all that were diseased, and them that were possessed with devils.","33":"And all the city was gathered together at the door.","34":"And he healed many that were sick of divers diseases, and cast out many devils; and suffered not the devils to speak, because they knew him.","35":"And in the morning, rising up a great while before day, he went out, and departed into a solitary place, and there prayed.","36":"And Simon and they that were with him followed after him.","37":"And when they had found him, they said unto him, All *men* seek for thee.","38":"And he said unto them, Let us go into the next towns, that I may preach there also: for therefore came I forth.","39":"And he preached in their synagogues throughout all Galilee, and cast out devils.","40":"And there came a leper to him, beseeching him, and kneeling down to him, and saying unto him, If thou wilt, thou canst make me clean.","41":"And Jesus, moved with compassion, put forth *his* hand, and touched him, and saith unto him, I will; be thou clean.","42":"And as soon as he had spoken, immediately the leprosy departed from him, and he was cleansed.","43":"And he straitly charged him, and forthwith sent him away;","44":"And saith unto him, See thou say nothing to any man: but go thy way, shew thyself to the priest, and offer for thy cleansing those things which Moses commanded, for a testimony unto them.","45":"But he went out, and began to publish *it* much, and to blaze abroad the matter, insomuch that Jesus could no more openly enter into the city, but was without in desert places: and they came to him from every quarter."}},"tsk":{"1":[{"kopje":"begin","refs":["Luk 1:2","Luk 1:3","Luk 2:10","Luk 2:11","Hand 1:1","Hand 1:2"]},{"kopje":"CHRISTUS","refs":["Joh 20:31","Rom 1:1-4","1 Joh 1:1-3","1 Joh 5:11","1 Joh 5:12"]},{"kopje":"Zoon","refs":["Ps 2:7","Matt 3:17","Matt 14:33","Matt 17:5","Luk 1:35","Joh 1:14","Joh 1:34","Joh 1:50","Joh 3:16","Joh 6:69","Rom 8:3","Rom 8:32","Hebr 1:1","Hebr 1:2"]}],"2":[{"kopje":"geschreven","refs":["Ps 40:8","Matt 2:5","Matt 26:24","Matt 26:31","Luk 1:70","Luk 18:31"]},{"kopje":"Zie","refs":["Mal 3:1","Matt 11:10","Luk 1:15-17","Luk 1:76","Luk 7:27","Luk 7:28"]}],"4":[{"kopje":"doopte","refs":["Matt 3:1","Matt 3:2","Matt 3:6","Matt 3:11","Luk 3:2","Luk 3:3","Joh 3:23","Hand 10:37","Hand 13:24","Hand 13:25","Hand 19:3","Hand 19:4"]},{"kopje":"vergeving","refs":["Hand 22:16"]}],"5":[{"kopje":"uit","refs":["Matt 3:5","Matt 3:6","Matt 4:25"]},{"kopje":"gedoopt","refs":["Joh 1:28","Joh 3:23"]},{"kopje":"beleden","refs":["Lev 26:40-42","Joz 7:19","Ps 32:5","Spr 28:13","Hand 2:38","Hand 19:18","1 Joh 1:8-10"]}],"6":[{"kopj lass=\"wl wl-kjv\" data-code=\"G2512\">cleansing</span> those <span class=\"wl wl-kjv\" data-code=\"G3739\">things</span> which <span class=\"wl wl-kjv\" data-code=\"G3475\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"G4367\">commanded,</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">for</span> a <span class=\"wl wl-kjv\" data-code=\"G3142\">testimony</span> unto them.","45":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> he went <span class=\"wl wl-kjv\" data-code=\"G1831\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"G756\">began</span> to <span class=\"wl wl-kjv\" data-code=\"G2784\">publish</span> it <span class=\"wl wl-kjv\" data-code=\"G4183\">much,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> to blaze <span class=\"wl wl-kjv\" data-code=\"G1310\">abroad</span> the <span class=\"wl wl-kjv\" data-code=\"G3056\">matter,</span> insomuch <span class=\"wl wl-kjv\" data-code=\"G5620\">that</span> <span class=\"wl wl-kjv\" data-code=\"G846\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G1410\">could</span> no <span class=\"wl wl-kjv\" data-code=\"G3371\">more</span> <span class=\"wl wl-kjv\" data-code=\"G5320\">openly</span> <span class=\"wl wl-kjv\" data-code=\"G1525\">enter</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> the <span class=\"wl wl-kjv\" data-code=\"G4172\">city,</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> <span class=\"wl wl-kjv\" data-code=\"G2258\">was</span> <span class=\"wl wl-kjv\" data-code=\"G1854\">without</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G2048\">desert</span> <span class=\"wl wl-kjv\" data-code=\"G5117\">places:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> they <span class=\"wl wl-kjv\" data-code=\"G2064\">came</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">to</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> from every quarter."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"begin des Evangelies","tekst":"Markus begint zijn Evangelie, waar Maleachi zijne profetie eindigt, nemelijk van de komst des voorlopers van Christus, om alzo het Oude en Nieuwe Testament als aan elkander te hechten. Want al de profeten hebben tot op Johannes geprofeteerd, Mat 11:13 , die de eerste prediker des Evangelies in het Nieuwe Testament geweest is."}],"2":[{"catchword":"in de profeten","tekst":"Namelijk Isa 40:3 , en Mal 3:1 ; want deze beide profetieën worden hier bijeengevoegd."},{"catchword":"engel","tekst":"Of, zendbode. Want het Griekse woord angelos betekent een zendbode, Luk 7:24 , en wordt gemeenlijk den engelen des hemels toegeschreven; doch somwijlen ook den kerkdienaars, omdat zij van God als boden uitgezonden worden om den mensen Gods wil en geboden voor te dragen; Mal 2:7 ; Rev 2:1 , Rev 2:8 ."},{"catchword":"Uw aangezicht,","tekst":"Hier spreekt God de Vader tot zijn Zoon en bij Maleachi spreekt de Zoon zelf tot de gemeente, en zegt daarom: voor mijn aangezicht; dat is, voor mijne komst, die daarop terstond volgen zal."}],"3":[{"catchword":"recht","tekst":"Of, effen."}],"4":[{"catchword":"der bekering","tekst":"De doop wordt alzo genaamd omdat hij bediend werd aan derenen, die hunne zonden beleden en bekering beloofden, en om hun een teken en verzegeling te wezen, dat hun hunne zonden van God om Christus' wil vergeven waren; Rev 19:4 ; Rom 4:11 ."}],"6":[{"catchword":"Johannes was gekleed met kemelshaar,","tekst":"De verklaring van deze geschiedenis van Johannes, zie in de aantekening op Mat 3 waar die bijna met dezelfde woorden verhaald staat."},{"catchword":"wilde honig","tekst":"Dat is, die in het wild, of veld gevonden werd."}],"7":[{"catchword":"waardig ben,","tekst":"Grieks, bekwaam, of genoegzaam."}],"9":[{"catchword":"Názareth,","tekst":"Namelijk waar Hij opgevoed was en tot dien tijd gewoond had; zie Luk 2:51 , en Luk 4:16 ."}],"10":[{"catchword":"Hij de hemelen","tekst":"Namelijk Johannes de Doper."},{"catchword":"opengaan,","tekst":"Grieks, gescheurd, of gekloofd."},{"catchword":"op Hem nederdalen","tekst":"Namelijk op Jezus. Zie Joh 1:32-33 ."}],"12":[{"catchword":"Geest uit in de woestijn","tekst":"Namelijk de Heilige Geest. Zie Luk 4:1 ."}],"13":[{"catchword":"verzocht van den satan;","tekst":"Voornamelijk nadat Hij veertig dagen en nachten gevast had. Zie Mat 4:2 ."}],"14":[{"catchword":"overgeleverd was,","tekst":"Namelijk in de gevangenis. Waarvan zie breder Mat 14:3 ."},{"catchword":"predikende","tekst":"Hoewel Hij tevoren al had begonnen te prediken, Joh 3:24 , heeft Hij na Johannes' gevangenneming zijn prediktambt plechtig en volkomenlijk met zijne apostelen aangevangen."}],"15":[{"catchword":"tijd is vervuld,","tekst":"Namelijk die van God bestemd en van de profeten voorzegd was; Gal 4:4 ."}],"16":[{"catchword":"Simon en Andreas,","tekst":"Die van Christus toegenaamd werd Petrus; zie Mat 4:18 ."}],"17":[{"catchword":"vissers der mensen zult worden","tekst":"De predikatie des Evangelies wordt bij het vissen vergeleken. Mat 13:47 , dewijl de mensen daardoor uit de wereld getrokken en Christus toegebracht worden."}],"21":[{"catchword":"Kapernaüm;","tekst":"Waar Hij was komen wonen, nadat Hij van Nazareth gescheiden was, Mat 4:13 ."},{"catchword":"sabbatdag","tekst":"Grieks, sabbaten."}],"22":[{"catchword":"machthebbende,","tekst":"Zie Mat 7:29 ."}],"24":[{"catchword":"Laat af,","tekst":"Of, ei, ach."},{"catchword":"verderven?","tekst":"Namelijk voor den tijd. Zie Mat 8:29 ."},{"catchword":"namelijk de Heilige Gods","tekst":"Of, gij Heilige Gods; dat is, de ware Messias, want de hogepriester droeg dezen titel: de heiligheid des Heeren, aan zijn voorhoofd als een voorbeeld van Christus. Zie Exo 28:36 . Zie ook Luk 4:34 ."}],"25":[{"catchword":"Zwijg stil,","tekst":"Grieks, wordt gemuilband. Zie van dit woord Mat 8:29 . Dit zegt Christus omdat Hij door het getuiogenis des duivels, die de vader der leugenen is, de waarheid niet wil verbreid of bevestigd  kon komen,","tekst":"Namelijk Kapernaüm, gelijk blijkt uit het begin van het hoofdstuk Marcus 2, namelijk om den groten toeloop des volks."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The beginning of the gospel of Jesus Christ the son of God [ Mark begins his gospel where Malachi endeth his prophecy namely for the coming of Jesus Christ forerunner so as it were to conjoin the old and the new testament to one another for all the prophets prophesied until John Mat 11:13 who was the first preacher of the gospel in the new testament.]"}],"2":[{"catchword":null,"tekst":"As is written in the prophets [Namely Mal 3:1 and Esa 40.3 for both these prophets are here joined together.] behold I send mine Angels [or messenger for the Greek word Angelos signified a messenger Luke 7 verse 24 and is commonly ascribed to the Angels of Heaven. But sometimes also to the ministers of the church because they are sent forth from God as messengers to hold forth Gods will and commandment unto man Malachi 2verse 7 Rev 2:1.8] before thy face which shall prepare thy way before thee [here God the father speaks to his son and in Malachi the son himself speak to the church and therefore faith before my face that is before my coming which shall presently follow thereupon.]"}],"3":[{"catchword":null,"tekst":"The voice of the one crying in the wilderness prepares ye the way of the Lord make his paths straight or plain.]"}],"4":[{"catchword":null,"tekst":"John was baptized in the wilderness and preaching the baptism of repentance for the remission of sins were forgiven them by God for Christ sake Act 19:4 Rom 4:11."}],"5":[{"catchword":null,"tekst":"And all the land of Judea went out to him and those of Jerusalem and were all baptized of him in the river Jordan confessing their sins."}],"6":[{"catchword":null,"tekst":"And John was clothed with camels hair [the exposition of his history of John see the annotate on the third chapter of Matthew were it is related almost in the same words] 16":[{"catchword":null,"tekst":"And walking by the sea of Galilee he saw Simon [whom by Christ was surnamed Peter see Matthew4.18] and Andrew his brother casting their net into the sea for they were fishers."}],"17":[{"catchword":null,"tekst":"And Jesus said unto them follow after me and I shall make ye fishers of men [the preaching of gospel is compared to fishing Mat 13:47 seeing men are thereby drawn out of the world and brought to Christ. ]"}],"18":[{"catchword":null,"tekst":"And they straightway forsaking their nets followed him."}],"19":[{"catchword":null,"tekst":"And being gone a little further from then he saw James the son of Zebedee and John his brother and the same in the ship mending their nets ."}],"20":[{"catchword":null,"tekst":"And straightway he called them and they leaving their father Zebedee in the ship with the hirelings followed after him."}],"21":[{"catchword":null,"tekst":"And they came into Carpanaum [where he wasto dwell since he departed from Nazareth Mat 4:13] and straightway on the Sabbath day [Gr Sabbaths] being entered into the synagogue he taught."}],"22":[{"catchword":null,"tekst":"And they were astonished for his doctrine for he taught them as having power [see Mat 7:29] and not as the scribes."}],"23":[{"catchword":null,"tekst":"And there was in the synagogue a man with an unclean spirit and he cried out."}],"24":[{"catchword":null,"tekst":"Saying forebear [or O! Ah!] what have we to do with thee thou Jesus the Nazarite? art thou come to destroy us? [Namely before the time see Mat 8:29]I know thee who thou art namely the holy one of God [or thou holy one of God that is the true Messias for the high priest bare this title the boltness of the Lord on his forehead as a type of Christ see Exo 28:36see also Luk 4:34]"}],"25":[{"catchword":null,"tekst":"Jesus rebuked saying hold thy peace [Gr. be thou muzzled see this word Mat 22:12 this Christ faith because he would not have the truth spread abroad or confirmed by the testimony of the devil who is the father of lies as Paul also doth Act 16:18]and go out of him ."}],"26":[{"catchword":null,"tekst":"And the unclean spirit tearing him [that is drawing and throwing him thither as if he would tear him in pieces and yet not being able to hurt him see Luk 4:35] and crying with a great voice went forth out of him."}],"27":[{"catchword":null,"tekst":"They were all amazed so that they inquired one amongst another saying what is this? what new doctrine is this that with power be likewise commandeth the unclean spirit and they are obedient unto him ?"}],"28":[{"catchword":null,"tekst":"And his fame [that is the fame of him] went forth present that is into the whole land of Galilee lying round about."}],"29":[{"catchword":null,"tekst":"And straightway being gone out of the synagogue they came into the house of Simon and Andrew with James and John."}],"30":[{"catchword":null,"tekst":"And Simons wives mother [so then had a wife whom being become an apostle he did not forsake as appears here and 1 Corinthian 9.5] lay sick of the fever and by and by they told him of her."}],"31":[{"catchword":null,"tekst":"And going to her he took her by the hand and set her up and straightway the fever left her and she ministered unto them"}],"32":[{"catchword":null,"tekst":"Now when it was become evening when the sun went down [because it was on the Sabbath as appears out of verse 21 therefore they waited till the going down of the sun with which the Sabbath ended] they brought unto him all that were ill at ease and possessed of the devil."}],"33":[{"catchword":null,"tekst":"And the whole city was gathered together about the door."}],"34":[{"catchword":null,"tekst":"And he healed many which were ill of divers diseases and cast out of many devils to speak because they knew him [or suffered them not to say that they knew him namely because he would have no testimony from these lying spirits .]"}],"35":[{"catchword":null,"tekst":"And early in the morning while it was yet deep in the night being xisen he went out and went away into a waste place [or solitary place] and prayed there."}],"36":[{"catchword":null,"tekst":"And Simon and they that were with him [namely the other three apostles which are named verse 29 with many more of the people as appears Luk 4:42] followed after him."}],"37":[{"catchword":null,"tekst":"And having found him they said unto him they all seek thee."}],"38":[{"catchword":null,"tekst":"And he said unto them let us go into the towns adjoining them [Gr. village cities that is open unwalled town of which sort they were many in Galilee whereof Josephus testified that in each of them they were no less than ten thousand persons] that I may preach there also for therefore came I forth."}],"39":[{"catchword":null,"tekst":"And he preached in their synagogues throughout Galilee and cast out the devils"}],"40":[{"catchword":null,"tekst":"And there came leper beseeching him and falling on his knees before and saying unto him if thou wilt thou canst make me clean."}],"41":[{"catchword":null,"tekst":"And Jesus being inwardly moved with compassion stretched forth his hand touched him and said unto him I will be thou cleansed."}],"42":[{"catchword":null,"tekst":"And when he had said this immediately the leprosy departed from him mand he was cleansed."}],"43":[{"catchword":null,"tekst":"And when he had straightly forbidden him [or with threatening sharply forbidden namely to make this known] he made him presently to depart from him [Gr. drove him out that is caused him to go speedily away from him.]"}],"44":[{"catchword":null,"tekst":"And said unto him see that thou and say nothing to any man [see the cause hereof Mat 12:16] but go thy way shew thyself to the priest and cleanse thy that which Moses commanded for a testimony unto them."}],"45":[{"catchword":null,"tekst":"But he being forth began to publish many things [namely both what was done to him and what he had heard and seen of Christ besides] and to spread abroad that word [that is this thing ] so that he [ namely Jesus see Luke 5 verse 15,16 ]could no more openly come into the city [namely of Capernaum as appears in the beginning of the following chapter namely because of the great concourse of people ]but was without in desert places and they came to him from all quarters."}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
