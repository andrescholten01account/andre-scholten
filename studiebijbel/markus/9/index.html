l","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En Hij zei tegen hen: Voorwaar, Ik zeg u, dat er sommigen zijn van hen die hier staan, die de dood niet zullen smaken, totdat zij gezien zullen hebben dat het Koninkrijk van God met kracht gekomen is.","2":"En na zes dagen nam Jezus Petrus, en Jakobus, en Johannes met Zich mee, en bracht hen alleen op een hoge berg, apart; en Hij werd voor hen van gedaante veranderd.","3":"En Zijn kleren werden blinkend, zeer wit als sneeuw, zoals geen wolwasser op aarde ze *zo* wit kan maken.","4":"En aan hen verschenen Elia met Mozes, en zij spraken met Jezus.","5":"En Petrus antwoordde en zei tegen Jezus: Rabbi, het is goed dat wij hier zijn, en laten wij drie tenten maken, voor U een, en voor Mozes een, en voor Elia een.","6":"Want hij wist niet wat hij zei; want zij waren zeer bevreesd.","7":"En er kwam een wolk die hen overschaduwde, en er kwam een stem uit de wolk: Dit is Mijn geliefde Zoon, hoor Hem!","8":"En toen zij plotseling om zich heen keken, zagen zij niemand meer, dan Jezus alleen bij zich.","9":"En toen zij van de berg afkwamen, gebood Hij hun dat zij aan niemand zouden vertellen wat zij gezien hadden, totdat de Zoon des mensen uit de doden zou zijn opgestaan.","10":"En zij hielden dit woord bij zichzelf, en vroegen elkaar wat het betekende: uit de doden opstaan.","11":"En zij vroegen Hem: Waarom zeggen de Schriftgeleerden dat Elia eerst moet komen?","12":"En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en *het zal gebeuren*, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden.","13":"Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.","14":"En toen Hij bij de discipelen kwam, zag Hij een grote menigte om hen heen, en *enige* Schriftgeleerden die met hen aan het twisten waren.","15":"En meteen, toen de hele menigte Hem zag, was zij zeer verbaasd, en zij liepen naar Hem toe en groetten Hem.","16":"En Hij vroeg de Schriftgeleerden: Waarover twist u met hen?","17":"En iemand uit de menigte antwoordde: Meester, ik heb mijn zoon bij U gebracht, die een stomme geest heeft.","18":"En waar hij hem ook aangrijpt, werpt hij hem neer, en hij schuimt, en knarst met zijn tanden, en verstijft; en ik heb Uw discipelen gevraagd dat zij hem zouden uitdrijven, en zij hebben het niet gekund.","19":"En Hij antwoordde hem en zei: O ongelovig geslacht, hoelang zal Ik nog bij u zijn? Hoelang zal Ik u nog verdragen? Breng hem bij Mij.","20":"En zij brachten hem bij Hem; en toen hij Hem zag, deed de geest hem meteen stuiptrekken; en hij viel op de grond, en rolde zich schuimend om.","21":"En Hij vroeg zijn vader: Hoe lang is het al geleden dat hem dit overkomen is? En hij zei: Van *zijn* kindsheid af.","22":"En vaak heeft hij hem ook in het vuur en in het water geworpen, om hem te vernietigen; maar als U iets kunt, wees met ontferming over ons bewogen, en help ons.","23":"En Jezus zei tegen hem: Als u kunt geloven, zijn alle dingen mogelijk voor hem die gelooft.","24":"En meteen riep de vader van het kind met tranen: Ik geloof, Heere! Kom mijn ongeloof te hulp.","25":"En toen Jezus zag dat de menigte gezamenlijk toeliep, bestrafte Hij de onreine geest, en zei tegen hem: Stomme en dove geest, Ik gebied u, ga uit hem weg, en kom niet meer in hem.","26":"En hij, roepend en hem zeer heen en weer schuddend, ging uit hem weg; en *het kind* werd als dood, zodat velen zeiden dat het gestorven was.","27":"Maar Jezus pakte hem bij de hand en richtte hem op; en hij stond op.","28":"En toen Hij in huis gegaan was, vroegen Zijn discipelen Hem apart: Waarom konden wij hem niet uitdrijven?","29":"En Hij zei tegen hen: Dit soort kan nergens door uitgaan, dan door bidden en vasten.","30":"En zij vertrokken van daar, en reisden door Galilea; en Hij wilde niet dat iemand het wist.","31":"Want Hij onderwees Zijn discipelen, en zei tegen hen: De Zoon des mensen zal overgeleverd worden in de handen van mensen, en zij zullen Hem doden, en nadat Hij gedood is, zal Hij op de derde dag weer opstaan.","32":"Maar zij begrepen dat woord niet, en zij waren bang Hem te vragen.","33":"En Hij kwam in Kapernaüm, en toen Hij in huis was, vroeg Hij hun: Waarover had u het onderweg met elkaar?","34":"Maar zij zwegen; want zij hadden onderweg met elkaar getwist over wie de belangrijkste *zou zijn*.","35":"En Hij ging zitten, riep de twaalf, en zei tegen hen: Als iemand de eerste wil zijn, die zal de laatste van allen zijn, en de dienaar van allen.","36":"En Hij nam een kind, en zette het in hun midden, en omarmde het met Zijn armen, en zei tegen hen:","37":"Wie een van zulke kinderen in Mijn Naam ontvangt, die ontvangt Mij; en wie Mij ontvangt, die ontvangt niet Mij, maar Hem Die Mij gezonden heeft.","38":"En Johannes antwoordde Hem: Meester, wij hebben iemand gezien die duivels uitdreef in Uw Naam, die ons niet volgt; en wij hebben het hem verboden, omdat hij ons niet volgt.","39":"Maar Jezus zei: Verbied hem niet; want er is niemand die een kracht zal doen in Mijn Naam, die meteen daarna kwaad van Mij zal kunnen spreken.","40":"Want wie niet tegen ons is, die is voor ons.","41":"Want wie u een beker water te drinken zal geven in Mijn Naam, omdat u *discipelen* van Christus bent, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.","42":"En wie een van deze kleinen die in Mij geloven, doet struikelen, het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd, en dat hij in de zee geworpen werd.","43":"En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;","44":"Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.","45":"En als uw voet u doet struikelen, hak hem af; het is beter voor u kreupel het leven in te gaan, dan met twee voeten in de hel geworpen te worden, in het onblusbare vuur;","46":"Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.","47":"En als uw oog u doet struikelen, werp het uit; het is beter voor u met één oog het Koninkrijk van God in te gaan, dan met twee ogen in het helse vuur geworpen te worden;","48":"Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.","49":"Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.","50":"Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar."},"SV":{"1":"En Hij zeide tot hen: Voorwaar, Ik zeg u, dat er sommigen zijn van degenen, die hier staan, die den dood niet zullen smaken, totdat zij zullen hebben gezien, dat het Koninkrijk Gods met kracht gekomen is.","2":"En na zes dagen nam Jezus met Zich Petrus, en Jakobus, en Johannes, en bracht hen op een hogen berg bezijden alleen; en Hij werd voor hen van gedaante veranderd.","3":"En Zijn klederen werden blinkende, zeer wit als sneeuw, hoedanige geen voller op aarde *zo* wit maken kan.","4":"En van hen werd gezien Elias met Mozes, en zij spraken met Jezus.","5":"En Petrus, antwoordende, zeide tot Jezus: Rabbi, het is goed, dat wij hier zijn, en laat ons drie tabernakelen maken, voor U een, en voor Mozes een, en voor Elias een.","6":"Want hij wist niet, wat hij zeide; want zij waren zeer bevreesd.","7":"En er kwam een wolk, die hen overschaduwde, en een stem kwam uit de wolk, zeggende: Deze is Mijn geliefde Zoon, hoort Hem!","8":"En haastelijk rondom ziende, zagen zij niemand meer, dan Jezus alleen bij zich.","9":"En als zij van den berg afkwamen, gebood Hij hun, dat zij niemand verhalen zouden, hetgeen zij gezien hadden, dan wanneer de Zoon des mensen uit de doden zou opgestaan zijn.","10":"En zij behielden dit woord bij zichzelven, vragende onder elkander, wat het was, uit de doden opstaan.","11":"En zij vraagden Hem, zeggende: Waarom zeggen de Schriftgeleerden, dat Elias eerst komen moet?","12":"En Hij, antwoordende, zeide tot hen: Elias zal wel eerst komen, en alles weder oprichten; en *het* *zal* *geschieden*, gelijk geschreven is van den Zoon des mensen, dat Hij veel lijden zal en veracht worden.","13":"Maar Ik zeg u, dat ook Elias gekomen is, en zij hebben hem gedaan al wat zij gewild hebben, gelijk van hem geschreven is.","14":"En als Hij bij de discipelen gekomen was, zag Hij een grote schare rondom hen, en *enige* Schriftgeleerden met hen twistende.","15":"En terstond de gehele schare Hem ziende, werd verbaasd, en toelopende groetten zij Hem.","16":"En Hij vraagde den Schriftgeleerden: Wat twist gij met dezen?","17":"En een uit de schare, antwoordende, zeide: Meester, ik heb mijn zoon tot U gebracht, die een stommen geest heeft.","18":"En waar hij hem ook aangrijpt, zo scheurt hij hem, en schuimt, en knerst met zijn tanden, en verdort; en ik heb Uw discipelen gezegd dat zij hem zouden uitwerpen, en zij hebben niet gekund.","19":"En Hij antwoordden hem, en zeide: O ongelovig geslacht, hoe lang zal Ik nog bij ulieden zijn, hoe lang zal Ik u nog verdragen? Brengt hem tot Mij.","20":"En zij brachten denzelven tot Hem; en als hij Hem zag, scheurde hem terstond de geest; en hij vallende op de aarde, wentelde zich al schuimende.","21":"En Hij vraagde zijn vader: Hoe langen tijd is het, dat hem dit overkomen is? En hij zeide: Van *zijn* kindsheid af.","22":"En menigmaal heeft hij hem ook in het vuur en in het water geworpen, om hem te verderven; maar zo Gij iets kunt, wees met innerlijke ontferming over ons bewogen, en help ons.","23":"En Jezus zeide tot hem: Zo gij kunt geloven, alle dingen zijn mogelijk dengene, die gelooft.","24":"En terstond de vader des kinds, roepende met tranen, zeide: Ik geloof, Heere! kom mijn ongelovigheid te hulp.","25":"En Jezus ziende, dat de schare gezamenlijk toeliep, bestrafte den onreinen geest, zeggende tot hem: Gij stomme en dove geest! Ik beveel u, ga uit van hem, en kom niet meer in hem.","26":"En hij, roepende en hem zeer scheurende, ging uit; en *het* *kind* werd als dood, alzo dat velen zeiden, dat het gestorven was.","27":"En Jezus, hem bij de hand grijpende, richtte hem op; en hij stond op.","28":"En als Hij in huis gegaan was, vraagden Hem Zijn discipelen alleen: Waarom hebben wij hem niet kunnen uitwerpen?","29":"En Hij zeide tot hen: Dit geslacht kan nergens door uitgaan, dan door bidden en vasten.","30":"En van daar weggaande, reisden zij door Galilea; en Hij wilde niet, dat het iemand wist.","31":"Want Hij leerde Zijn discipelen, en zeide tot hen: De Zoon des mensen zal overgeleverd worden in de handen der mensen, en zij zullen Hem doden, en gedood zijnde, zal Hij ten derden dage wederopstaan.","32":"Maar zij verstonden dat woord niet, en zij vreesden Hem te vragen.","33":"En Hij kwam te Kapernaum, en in het huis gekomen zijnde, vraagde Hij hun: Waarvan hadt gij woorden onder elkander op den weg?","34":"Doch zij zwegen; want zij waren onder elkander in woorden geweest op den weg, wie de meeste *zou* *zijn*.","35":"En nedergezeten zijnde, riep Hij de twaalven, en zeide tot hen: Indien iemand wil de eerste zijn, die zal de laatste van allen zijn, en aller dienaar.","36":"En nemende een kindeken, stelde Hij dat midden onder hen, en omving het met Zijn armen, en zeide tot hen:","37":"Zo wie een van zodanige kinderkens zal ontvangen in Mijn Naam, die ontvangt Mij; en zo wie Mij zal ontvangen, die ontvangt Mij niet, maar Dien, Die Mij gezonden heeft.","38":"En Johannes antwoordde Hem, zeggende: Meester! wij hebben een gezien, die de duivelen uitwierp in Uw Naam, welke ons niet volgt; en wij hebben het hem verboden, omdat hij ons niet volgt.","39":"Doch Jezus zeide: Verbiedt hem niet; want er is niemand, die een kracht doen zal in Mijn Naam, en haastelijk van Mij zal kunnen kwalijk spreken.","40":"Want wie tegen ons niet is, die is voor ons.","41":"Want zo wie ulieden een beker water zal te drinken geven in Mijn Naam, omdat gij *discipelen* van Christus zijt, voorwaar zeg Ik u, hij zal zijn loon geenszins verliezen.","42":"En zo wie een van deze kleinen, die in Mij geloven, ergert, het ware hem beter, dat een molensteen om zijn hals gedaan ware, en dat hij in de zee geworpen ware.","43":"En indien uw hand u ergert, houwt ze af; het is u beter verminkt tot het leven in te gaan, dan de twee handen hebbende, heen te gaan in de hel, in het onuitblusselijk vuur;","44":"Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.","45":"En indien uw voet u ergert, houwt hem af; het is u beter kreupel tot het leven in te gaan, dan de twee voeten hebbende, geworpen te worden in de hel, in het onuitblusselijk vuur;","46":"Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.","47":"En indien uw oog u ergert, werpt het uit; het is u beter maar een oog hebbende in het Koninkrijk Gods in te gaan, dan twee ogen hebbende, in het helse vuur geworpen te worden;","48":"Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.","49":"Want een ieder zal met vuur gezouten worden, en iedere offerande zal met zout gezouten worden.","50":"Het zout is goed; maar indien het zout onzout wordt, waarmede zult gij dat smakelijk maken? Hebt zout in uzelven, en houdt vrede onder elkander."},"KJV":{"1":"And he said unto them, Verily I say unto you, That there be some of them that stand here, which shall not taste of death, till they have seen the kingdom of God come with power.","2":"And after six days Jesus taketh *with him* Peter, and James, and John, and leadeth them up into an high mountain apart by themselves: and he was transfigured before them.","3":"And his raiment became shining, exceeding white as snow; so as no fuller on earth can white","4":"And there appeared unto them Elias with Moses: and they were talking with Jesus.","5":"And Peter answered and said to Jesus, Master, it is good for us to be here: and let us make three tabernacles; one for thee, and one for Moses, and one for Elias.","6":"For he wist not what to say; for they were sore afraid.","7":"And there was a cloud that overshadowed them: and a voice came out of the cloud, saying, This is my beloved Son: hear him.","8":"And suddenly, when they had looked round about, they saw no man any more, save Jesus only with themselves.","9":"And as they came down from the mountain, he charged them that they should tell no man what things they had seen, till the Son of man were risen from the dead.","10":"And they kept that saying with themselves, questioning one with another what the rising from the dead should mean.","11":"And they asked him, saying, Why say the scribes that Elias must first come?","12":"And he answered and told them, Elias verily cometh first, and restoreth all things; and how it is written of the Son of man, that he must suffer many things, and be set at nought.","13":"But I say unto you, That Elias is indeed come, and they have done unto him whatsoever they listed, as it is written of him.","14":"And when he came to *his* disciples, he saw a great multitude about them, and the scribes questioning with them.","15":"And straightway all the people, when they beheld him, were greatly amazed, and running to *him* saluted him.","16":"And he asked the scribes, What question ye with them?","17":"And one of the multitude answered and said, Master, I have brought unto thee my son, which hath a dumb spirit;","18":"And wheresoever he taketh him, he teareth him: and he foameth, and gnasheth with his teeth, and pineth away: and I spake to thy disciples that they should cast him out; and they could not.","19":"He answereth him, and saith, O faithless generation, how long shall I be with you? how long shall I suffer you? bring him unto me.","20":"And they brought him unto him: and when he saw him, straightway the spirit tare him; and he fell on the ground, and wallowed foaming.","21":"And he asked his father, How long is it ago since this came unto him? And he said, Of a child.","22":"And ofttimes it hath cast him into the fire, and into the waters, to destroy him: but if thou canst do any thing, have compassion on us, and help us.","23":"Jesus said unto him, If thou canst believe, all things *are* possible to him that believeth.","24":"And straightway the father of the child cried out, and said with tears, Lord, I believe; help thou mine unbelief.","25":"When Jesus saw that the people came running together, he rebuked the foul spirit, saying unto him, *Thou* dumb and deaf spirit, I charge thee, come out of him, and enter no more into him.","26":"And *the spirit* cried, and rent him sore, and came out of him: and he was as one dead; insomuch that many said, He is dead.","27":"But Jesus took him by the hand, and lifted him up; and he arose.","28":"And when he was come into the house, his disciples asked him privately, Why could not we cast him out?","29":"And he said unto them, This kind can come forth by nothing, but by prayer and fasting.","30":"And they departed thence, and passed through Galilee; and he would not that any man should know","31":"For he taught his disciples, and said unto them, The Son of man is delivered into the hands of men, and they shall kill him; and after that he is killed, he shall rise the third day.","32":"But they understood not that saying, and were afraid to ask him.","33":"And he came to Capernaum: and being in the house he asked them, What was it that ye disputed among yourselves by the way?","34":"But they held their peace: for by the way they had disputed among themselves, who *should be* the greatest.","35":"And he sat down, and called the twelve, and saith unto them, If any man desire to be first, *the same* shall be last of all, and servant of all.","36":"And he took a child, and set him in the midst of them: and when he had taken him in his arms, he said unto them,","37":"Whosoever shall receive one of such children in my name, receiveth me: and whosoever shall receive me, receiveth not me, but him that sent me.","38":"And John answered him, saying, Master, we saw one casting out devils in thy name, and he followeth not us: and we forbad him, because he followeth not us.","39":"But Jesus said, Forbid him not: for there is no man which shall do a miracle in my name, that can lightly speak evil of me.","40":"For he that is not against us is on our part.","41":"For whosoever shall give you a cup of water to drink in my name, because ye belong to Christ, verily I say unto you, he shall not lose his reward.","42":"And whosoever shall offend one of *these* little ones that believe in me, it is better for him that a millstone were hanged about his neck, and he were cast into the sea.","43":"And if thy hand offend thee, cut it off: it is better for thee to enter into life maimed, than having two hands to go into hell, into the fire that never shall be quenched:","44":"Where their worm dieth not, and the fire is not quenched.","45":"And if thy foot offend thee, cut it off: it is better for thee to enter halt into life, than having two feet to be cast into hell, into the fire that never shall be quenched:","46":"Where their worm dieth not, and the fire is not quenched.","47":"And if thine eye offend thee, pluck it out: it is better for thee to enter into the kingdom of God with one eye, than having two eyes to be cast into hell fire:","48":"Where their worm dieth not, and the fire is not quenched.","49":"For every one shall be salted with fire, and every sacrifice shall be salted with salt.","50":"Salt *is* good: but if the salt have lost his saltness, wherewith will ye season it? Have salt in yourselves, and have peace one with another."}},"tsk":{"1":[{"kopje":"dat","refs":["Matt 16:28","Luk 9:27"]},{"kopje":"smaken","refs":["Luk 2:26","Joh 8:51","Joh 8:52","Hebr 2:9"]},{"kopje":"het Koninkrijk","refs":["Matt 24:30","Matt 25:31","Luk 22:18","Luk 22:30","Joh 21:23","Hand 1:6","Hand 1:7"]}],"2":[{"kopje":"na","refs":["Matt 17:11-13","Luk 9:28-36"]},{"kopje":"Petrus","refs":["Mark 5:37","Mark 14:33","2 Kor 13:1"]},{"kopje":"een hoge","refs":["Ex 24:13","1 Kon 18:42","1 Kon 18:33","Matt 14:13","Luk 6:12"]},{"kopje":"van gedaante veranderd","refs":["Mark 16:12","Ex 34:29-35","Jes 33:17","Jes 53:2","Matt 17:2","Luk 9:29","Joh 1:14","Rom 12:2","2 Kor 3:7-10","Fil 2:6-8","Fil 3:21","2 Petr 1:16-18","Openb 1:13-17","Openb 20:11"]}],"3":[{"kopje":"Zijn kleren","refs":["Ps 104:1","Ps 104:2","Dan 7:9","Matt 28:3","Hand 10:30"]},{"kopje":"zeer","refs":["Ps 51:9","Ps 68:15","Jes 1:18","Openb 7:9","Openb 7:14","Openb 19:18"]},{"kopje":"geen","refs":["Mal 3:2","Mal 3:3"]}],"4":[{"kopje":"verschenen","refs":["Matt 11:13","Matt 17:3","Matt 17:4","Luk 9:19","Luk 9:30","Luk 9:31","Luk 24:27","Luk 24:44","Joh 5:39","Joh 5:45-47","Hand 3:21-24","1 Petr 1:10-12","Openb 19:10"]},{"kopje":"Elia","refs":["2 Kon 2:11","2 Kon 2:12"]},{"kopje":"Mozes","refs":["Deut 34:5","Deut 34:6"]}],"5":[{"kopje":"het is","refs":["Ex 33:17-23","Ps 62:3","Ps 62:4","Ps 84:11","Joh 14:8","Joh 14:9","Joh 14:21-23","Fil 1:23","1 Joh 3:2","Openb 22:3","Openb 22:4"]}],"7":[{"kopje":"een wolk","refs":["Ex 40:34","1 Kon 8:10-12","Ps 97:2","Dan 7:13"," (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +

    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
