2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En het pascha, en *het feest* der ongezuurde *broden*, was na twee dagen. En de overpriesters en de Schriftgeleerden zochten hoe zij Hem door list konden grijpen en doden.","2":"Maar zij zeiden: Niet tijdens het feest, anders zou er misschien oproer onder het volk ontstaan.","3":"En toen Hij in Bethanië was, in het huis van Simon de melaatse, terwijl Hij aan *tafel* zat, kwam er een vrouw met een albasten fles zalf van onvervalste nardus, van grote waarde; en zij brak de albasten fles, en goot die uit over Zijn hoofd.","4":"En er waren sommigen die dit bij zichzelf zeer kwalijk namen, en zeiden: Waarom is deze verspilling van de zalf gebeurd?","5":"Want die had voor meer dan driehonderd penningen verkocht kunnen worden, en *dat geld* aan de armen gegeven kunnen worden; en zij verweten het haar bitter.","6":"Maar Jezus zei: Laat haar met rust; waarom valt u haar lastig? Zij heeft een goed werk aan Mij gedaan.","7":"Want de armen hebt u altijd bij u, en wanneer u wilt, kunt u hun goeddoen; maar Mij hebt u niet altijd.","8":"Zij heeft gedaan wat zij kon; zij is van tevoren gekomen om Mijn lichaam te zalven, *als voorbereiding* op de begrafenis.","9":"Voorwaar, Ik zeg u: Waar dit Evangelie ook gepredikt zal worden in de hele wereld, *daar* zal ook gesproken worden over wat zij gedaan heeft, tot haar gedachtenis.","10":"En Judas Iskariot, een van de twaalf, ging naar de overpriesters, om Hem aan hen over te leveren.","11":"En zij, die *dit* hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.","12":"En op de eerste dag van de ongezuurde *broden*, wanneer zij het pascha slachtten, zeiden Zijn discipelen tegen Hem: Waar wilt U dat wij heengaan en voorbereiden, dat U het pascha eet?","13":"En Hij stuurde twee van Zijn discipelen uit, en zei tegen hen: Ga de stad in, en er zal u een man tegemoetkomen die een kruik water draagt; volg hem;","14":"en waar hij ook naar binnen gaat, zeg tegen de heer van dat huis: De Meester zegt: Waar is de eetzaal, waar Ik het pascha met Mijn discipelen zal eten?","15":"En hij zal u een grote bovenzaal wijzen, ingericht *en* gereed; bereid het daar voor ons.","16":"En Zijn discipelen gingen weg, en kwamen in de stad, en vonden het zoals Hij hun gezegd had, en zij bereidden het pascha.","17":"En toen het avond geworden was, kwam Hij met de twaalf.","18":"En terwijl zij aanzaten en aten, zei Jezus: Voorwaar, Ik zeg u, dat een van u, die met Mij eet, Mij zal verraden.","19":"En zij begonnen bedroefd te worden, en de een na de ander tegen Hem te zeggen: Ben ik het? En een ander: Ben ik het?","20":"Maar Hij antwoordde en zei tegen hen: *Het is* één van de twaalf, die met Mij in de schotel indoopt.","21":"De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.","22":"En terwijl zij aten, nam Jezus brood, en nadat Hij gezegend had, brak Hij het, en gaf het hun, en zei: Neem, eet, dat is Mijn lichaam.","23":"En Hij nam de drinkbeker, en nadat Hij gedankt had, gaf Hij hun *die*; en zij dronken allen daaruit.","24":"En Hij zei tegen hen: Dat is Mijn bloed, het *bloed* van het nieuwe testament, dat voor velen vergoten wordt.","25":"Voorwaar, Ik zeg u, dat Ik niet meer zal drinken van de vrucht van de wijnstok, tot op die dag wanneer Ik die nieuw zal drinken in het Koninkrijk van God.","26":"En nadat zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.","27":"En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.","28":"Maar nadat Ik zal zijn opgestaan, zal Ik u voorgaan naar Galilea.","29":"En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet *doen*.","30":"En Jezus zei tegen hem: Voorwaar, Ik zeg u, dat u heden, in deze nacht, voordat de haan tweemaal gekraaid zal hebben, Mij driemaal zult verloochenen.","31":"Maar hij zei des te heftiger: Al moest ik met U sterven, ik zal U geenszins verloochenen! En evenzo zeiden zij ook allen.","32":"En zij kwamen op een plaats waarvan de naam Gethsémané was, en Hij zei tegen Zijn discipelen: Blijf hier zitten, totdat Ik gebeden zal hebben.","33":"En Hij nam Petrus, en Jakobus, en Johannes met Zich mee, en begon zeer ontsteld en angstig te worden;","34":"en Hij zei tegen hen: Mijn ziel is zeer bedroefd, tot de dood toe; blijf hier, en waak.","35":"En nadat Hij een stukje verder gegaan was, viel Hij op de grond, en bad dat, als het mogelijk was, dat uur van Hem zou voorbijgaan.","36":"En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U *wilt*.","37":"En Hij kwam, en vond hen slapend, en zei tegen Petrus: Simon, slaapt u? Kon u niet één uur waken?","38":"Waak en bid, opdat u niet in verzoeking komt; de geest *is* wel gewillig, maar het vlees is zwak.","39":"En Hij ging weer weg, en bad, en zei dezelfde woorden.","40":"En toen Hij terugkeerde, vond Hij hen weer slapend, want hun ogen waren zwaar; en zij wisten niet wat zij Hem moesten antwoorden.","41":"En Hij kwam voor de derde keer, en zei tegen hen: Slaap *nu* verder, en rust; het is genoeg, het uur is gekomen; zie, de Zoon des mensen wordt overgeleverd in de handen van de zondaars.","42":"Sta op, laten we gaan; zie, hij die Mij verraadt, is dichtbij.","43":"En meteen, terwijl Hij nog sprak, kwam Judas eraan, één van de twaalf, en met hem een grote menigte, met zwaarden en stokken, *gestuurd* door de overpriesters, en de Schriftgeleerden, en de oudsten.","44":"En hij die Hem verried, had hun een teken gegeven, en gezegd: Degene die ik zal kussen, die is het; grijp Hem, en leid Hem veilig weg.","45":"En toen hij gekomen was, ging hij meteen naar Hem toe, en zei: Rabbi, en hij kuste Hem.","46":"En zij sloegen hun handen aan Hem, en grepen Hem.","47":"En iemand van hen die daarbij stonden, trok het zwaard, en trof de dienaar van de hogepriester, en hakte hem zijn oor af.","48":"En Jezus antwoordde en zei tegen hen: Bent u uitgegaan met zwaarden en stokken, als tegen een rover, om Mij te grijpen?","49":"Dagelijks was Ik bij u in de tempel, en onderwees, en u hebt Mij niet gegrepen; maar *dit gebeurt*, opdat de Schriften vervuld zouden worden.","50":"En zij verlieten Hem, en vluchtten allen.","51":"En een zekere jongeman volgde Hem, gekleed in een linnen doek over zijn naakte *lichaam*, en de jongemannen grepen hem.","52":"Maar hij liet het linnen kleed achter, en vluchtte naakt van hen weg.","53":"En zij leidden Jezus weg naar de hogepriester; en bij hem kwamen alle overpriesters, en de oudsten, en de Schriftgeleerden bijeen.","54":"En Petrus volgde Hem van verre, tot binnen in de zaal van de hogepriester, en hij zat bij de dienaren, en warmde zich bij het vuur.","55":"En de overpriesters, en de hele Raad, zochten getuigenis tegen Jezus, om Hem te doden, en vonden het niet.","56":"Want velen getuigden vals tegen Hem, maar de getuigenissen kwamen niet overeen.","57":"En sommigen stonden op en getuigden vals tegen Hem, en zeiden:","58":"Wij hebben Hem horen zeggen: Ik zal deze tempel, die met handen gemaakt is, afbreken, en in drie dagen een andere, zonder handen gemaakt, bouwen.","59":"En ook zo kwam hun getuigenis niet overeen.","60":"En de hogepriester stond op in het midden, en vroeg Jezus: Antwoordt U niets? Wat getuigen dezen tegen U?","61":"Maar Hij zweeg stil, en antwoordde niets. Weer vroeg de hogepriester Hem, en zei tegen Hem: Bent U de Christus, de Zoon van de gezegende *God*?","62":"En Jezus zei: Ik ben het. En u zult de Zoon des mensen zien zitten aan de rechter*hand* van de kracht van *God*, en komen met de wolken van de hemel.","63":"En de hogepriester scheurde zijn kleren, en zei: Waarvoor hebben wij nog getuigen nodig?","64":"U hebt de *gods*lastering gehoord; wat denkt u? En zij allen veroordeelden Hem, schuldig te zijn aan de dood.","65":"En sommigen begonnen Hem te bespuwen, en Zijn gezicht te bedekken, en Hem met vuisten te slaan, en tegen Hem te zeggen: Profeteer! En de dienaars gaven Hem klappen in het gezicht.","66":"En terwijl Petrus beneden in de zaal was, kwam een van de dienstmeisjes van de hogepriester;","67":"en toen zij Petrus zag zich warmen, keek zij hem aan, en zei: U was ook met Jezus de Nazarener.","68":"Maar hij ontkende het, en zei: Ik ken *Hem* niet, en ik weet niet wat u zegt. En hij ging naar buiten, naar de voorhal, en de haan kraaide.","69":"En de dienstmeid zag hem weer, en begon te zeggen tegen hen die daarbij stonden: Dit is een van hen.","70":"Maar hij ontkende het weer. En kort daarna zeiden zij die daarbij stonden weer tegen Petrus: Werkelijk, u bent een van hen; want u bent ook een Galileeër, en uw spraak lijkt erop.","71":"En hij begon *zichzelf* te vervloeken en te zweren: Ik ken deze Mens niet, over Wie u het hebt.","72":"En de haan kraaide de tweede keer; en Petrus herinnerde zich het woord dat Jezus tegen hem gezegd had: Voordat de haan tweemaal gekraaid zal hebben, zult u Mij driemaal verloochenen. En hij, *zich* naar buiten begevend, huilde."},"SV":{"1":"En het pascha, en *het* *feest* der ongehevelde *broden* was na twee dagen. En de overpriesters en de Schriftgeleerden zochten, hoe zij Hem met listigheid vangen en doden zouden.","2":"Maar zij zeiden: Niet in het feest, opdat niet misschien oproer onder het volk worde.","3":"En als Hij te Bethanië was, in het huis van Simon, den melaatse, daar Hij aan *tafel* zat, kwam een vrouw, hebbende een albasten fles met zalf van onvervalsten nardus, van groten prijs; en de albasten fles gebroken hebbende, goot die op Zijn hoofd.","4":"En er waren sommigen, die dat zeer kwalijk namen bij zichzelven, en zeiden: Waartoe is dit verlies der zalf geschied?","5":"Want dezelve had kunnen boven de driehonderd penningen verkocht, en *die* den armen gegeven worden; en zij vergrimden tegen haar.","6":"Maar Jezus zeide: Laat af van haar; wat doet gij haar moeite aan? Zij heeft een goed werk aan Mij gewrocht.","7":"Want de armen hebt gij altijd met u, en wanneer gij wilt, kunt gij hun weldoen; maar Mij hebt gij niet altijd.","8":"Zij heeft gedaan, hetgeen zij konde; zij is voorgekomen, om Mijn lichaam te zalven, *tot* *een* *voorbereiding* ter begrafenis.","9":"Voorwaar zeg Ik u: Alwaar dit Evangelie gepredikt zal worden in de gehele wereld, *daar* zal ook tot haar gedachtenis gesproken worden, van hetgeen zij gedaan heeft.","10":"En Judas Iskariot, een van de twaalven, ging heen tot de overpriesters, opdat hij Hem hun zou overleveren.","11":"En zij, *dat* horende, waren verblijd, en beloofden hem geld te geven; en hij zocht, hoe hij Hem bekwamelijk overleveren zou.","12":"En op den eersten dag der ongehevelde *broden*, wanneer zij het pascha slachtten, zeiden Zijn discipelen tot Hem: Waar wilt Gij, dat wij heengaan, en bereiden, dat Gij het pascha eet?","13":"En Hij zond twee van Zijn discipelen uit, en zeide tot hen: Gaat henen in de stad, en u zal een mens ontmoeten, dragende een kruik water, volgt dien;","14":"En zo waar hij ingaat, zegt tot den heer des huizes: De Meester zegt: Waar is de eetzaal, daar Ik het pascha met Mijn discipelen eten zal?","15":"En hij zal u wijzen een grote opperzaal, toegerust *en* gereed; bereidt het ons aldaar.","16":"En Zijn discipelen gingen uit, en kwamen in de stad, en vonden het, gelijk Hij hun gezegd had, en bereidden het pascha.","17":"En als het avond geworden was, kwam Hij met de twaalven.","18":"En als zij aanzaten en aten, zeide Jezus: Voorwaar, Ik zeg u, dat een van u, die met Mij eet, Mij zal verraden.","19":"En zij begonnen bedroefd te worden, en de een na den ander tot Hem te zeggen: Ben ik het? En een ander: Ben ik het?","20":"Maar Hij antwoordde en zeide tot hen: *Het* *is* een uit de twaalven, die met Mij in den schotel indoopt.","21":"De Zoon des mensen gaat wel heen, gelijk van Hem geschreven is; maar wee dien mens, door welken de Zoon des mensen verraden wordt! Het ware hem goed, zo die mens niet geboren ware geweest.","22":"En als zij aten, nam Jezus brood, en als Hij gezegend had, brak Hij het, en gaf het hun, en zeide: Neemt, eet, dat is Mijn lichaam.","23":"En Hij nam den drinkbeker, en gedankt hebbende, gaf hun *dien*; en zij dronken allen uit denzelven.","24":"En Hij zeide tot hen: Dat is Mijn bloed, het *bloed* des Nieuwen Testaments, hetwelk voor velen vergoten wordt.","25":"Voorwaar, Ik zeg u, dat Ik niet meer zal drinken van de vrucht des wijnstoks, tot op dien dag, wanneer Ik dezelve nieuw zal drinken in het Koninkrijk Gods.","26":"En als zij den lofzang gezongen hadden, gingen zij uit naar den Olijfberg.","27":"En Jezus zeide tot hen: Gij zult in dezen nacht allen aan Mij geërgerd worden; want er is geschreven: Ik zal den Herder slaan, en de schapen zullen verstrooid worden.","28":"Maar nadat Ik zal opgestaan zijn, zal Ik u voorgaan naar Galilea.","29":"En Petrus zeide tot Hem: Of zij ook allen geërgerd wierden, zo zal ik toch niet *geërgerd* *worden*.","30":"En Jezus zeide tot hem: Voorwaar, Ik zeg u, dat heden in dezen nacht, eer de haan tweemaal gekraaid zal hebben, gij Mij driemaal zult verloochenen.","31":"Maar hij zeide nog des te meer: Al moest ik met U sterven, zo zal ik U geenszins verloochenen! En insgelijks zeiden zij ook allen.","32":"En zij kwamen in een plaats, welker naam was Gethsemane, en Hij zeide tot Zijn discipelen: Zit hier neder, totdat Ik gebeden zal hebben.","33":"En Hij nam met Zich Petrus, en Jakobus, en Johannes, en begon verbaasd en zeer beangst te worden;","34":"En zeide tot hen: Mijn ziel is geheel bedroefd tot den dood toe; blijft hier, en waakt.","35":"En een weinig voortgegaan zijnde, viel Hij op de aarde, en bad, zo het mogelijk ware, dat die ure van Hem voorbijginge.","36":"En Hij zeide: Abba, Vader! alle dingen zijn U mogelijk; neem dezen drinkbeker van Mij weg, doch niet wat Ik wil, maar wat Gij *wilt*.","37":"En Hij kwam, en vond hen slapende, en zeide tot Petrus: Simon! slaapt gij? Kunt gij niet een uur waken?","38":"Waakt en bidt, opdat gij niet in verzoeking komt; de geest *is* wel gewillig, maar het vlees is zwak.","39":"En wederom heengegaan zijnde, bad Hij, sprekende dezelfde woorden.","40":"En wedergekeerd zijnde, vond Hij hen wederom slapende, want hun ogen waren bezwaard; en zij wisten niet, wat zij Hem antwoorden zouden.","41":"En Hij kwam ten derden male, en zeide tot hen: Slaapt *nu* voort, en rust ; het is genoeg, de ure is gekomen; ziet, de Zoon des mensen wordt overgeleverd in de handen der zondaren.","42":"Staat op, laat ons gaan; ziet, die Mij verraadt, is nabij.","43":"En terstond, als Hij nog sprak, kwam Judas aan, die een was van de twaalven, en met hem een grote schare, met zwaarden en stokken, *gezonden* van de overpriesters, en de Schriftgeleerden, en de ouderlingen.","44":"En die Hem verried, had hun een gemeen teken gegeven, zeggende: Dien ik kussen zal, Die is het , grijpt Hem, en leidt Hem zekerlijk henen.","45":"En als hij gekomen was, ging hij terstond tot Hem, en zeide: Rabbi, en kuste Hem.","46":"En zij sloegen hun handen aan Hem, en grepen Hem.","47":"En een dergenen, die daarbij stonden, het zwaard trekkende, sloeg den dienstknecht des hogepriesters, en hieuw hem zijn oor af.","48":"En Jezus, antwoordende, zeide tot hen: Zijt gij uitgegaan, met zwaarden en stokken, als tegen een moordenaar, om Mij te vangen?","49":"Dagelijks was Ik bij ulieden in den tempel, lerende, en gij hebt Mij niet gegrepen; maar *dit* *geschiedt*, opdat de Schriften vervuld zouden worden.","50":"En zij, Hem verlatende, zijn allen gevloden.","51":"En een zeker jongeling volgde Hem, hebbende een lijnwaad omgedaan over het naakte *lijf*, en de jongelingen grepen hem.","52":"En hij, het lijnwaad verlatende, is naakt van hen gevloden.","53":"En zij leidden Jezus henen tot den hogepriester; en bij hem vergaderden al de overpriesters, en de ouderlingen, en de Schriftgeleerden.","54":"En Petrus volgde Hem van verre, tot binnen in de zaal des hogepriesters, en hij was mede zittende met de dienaren, en zich warmende bij het vuur.","55":"En de overpriesters, en de gehele raad, zochten getuigenis tegen Jezus, om Hem te doden, en vonden niet.","56":"Want velen getuigden valselijk tegen Hem, en de getuigenissen waren niet eenparig.","57":"En enigen, opstaande, getuigden valselijk tegen Hem, zeggende:","58":"Wij hebben Hem horen zeggen: Ik zal dezen tempel, die met handen gemaakt is, afbreken, en in drie dagen een anderen, zonder handen gemaakt, bouwen.","59":"En ook alzo was hun getuigenis niet eenparig.","60":"En de hogepriester, in het midden opstaande, vraagde Jezus, zeggende: Antwoordt Gij niets? Wat getuigen dezen tegen U;","61":"Maar Hij zweeg stil, en antwoordde niets. Wederom vraagde Hem de hogepriester, en zeide tot Hem: Zijt Gij de Christus, de Zoon des gezegenden *Gods*?","62":"En Jezus zeide: Ik ben het. En gijlieden zult den Zoon des mensen zien zitten ter rechter *hand* der kracht *Gods*, en komen met de wolken des hemels.","63":"En de hogepriester, verscheurende zijn klederen, zeide: Wat hebben wij nog getuigen van node?","64":"Gij hebt de *gods* lastering gehoord; wat dunkt ulieden? En zij allen veroordeelden Hem, des doods schuldig te zijn.","65":"En sommigen begonnen Hem te bespuwen, en Zijn aangezicht te bedekken, en met vuisten te slaan, en tot Hem te zeggen: Profeteer! En de dienaars gaven Hem kinnebakslagen.","66":"En als Petrus beneden in de zaal was, kwam een van de dienstmaagden des hogepriesters;","67":"En ziende Petrus zich warmende, zag zij hem aan, en zeide: Ook gij waart met Jezus den Nazarener.","68":"Maar hij heeft het geloochend, zeggende: Ik ken *Hem* niet, en ik weet niet wat gij zegt. En hij ging buiten in de voorzaal, en de haan kraaide.","69":"En de dienstmaagd, hem wederom ziende, begon te zeggen tot degenen, die daarbij stonden: Deze is een van die.","70":"Maar hij loochende het wederom. En een weinig daarna, die daarbij stonden, zeiden wederom tot Petrus: Waarlijk, gij zijt een van die; want gij zijt ook een Galileër, en uw spraak gelijkt.","71":"En hij begon *zichzelven* te vervloeken en te zweren: Ik ken dezen Mens niet, Dien gij zegt.","72":"En de haan kraaide de tweede maal; en Petrus werd indachtig het woord, hetwelk Jezus tot hem gezegd had: Eer de haan tweemaal gekraaid zal hebben, zult gij Mij driemaal verloochenen. En hij, *zich* van daar makende, weende."},"KJV":{"1":"After two days was *the feast of* the passover, and of unleavened bread: and the chief priests and the scribes sought how they might take him by craft, and put *him* to death.","2":"But they said, Not on the feast *day*, lest there be an uproar of the people.","3":"And being in Bethany in the house of Simon the leper, as he sat at meat, there came a woman having an alabaster box of ointment of spikenard very precious; and she brake the box, and poured *it* on his head.","4":"And there were some that had indignation within themselves, and said, Why was this waste of the ointment made?","5":"For it might have been sold for more than three hundred pence, and have been given to the poor. And they murmured against her.","6":"And Jesus said, Let her alone; why trouble ye her? she hath wrought a good work on me.","7":"For ye have the poor with you always, and whensoever ye will ye may do them good: but me ye have not always.","8":"She hath done what she could: she is come aforehand to anoint my body to the burying.","9":"Verily I say unto you, Wheresoever this gospel shall be preached throughout the whole world, *this* also that she hath done shall be spoken of for a memorial of her.","10":"And Judas Iscariot, one of the twelve, went unto the chief priests, to betray him unto them.","11":"And when they heard *it*, they were glad, and promised to give him money. And he sought how he might conveniently betray him.","12":"And the first day of unleavened bread, when they killed the passover, his disciples said unto him, Where wilt thou that we go and prepare that thou mayest eat the passover?","13":"And he sendeth forth two of his disciples, and saith unto them, Go ye into the city, and there shall meet you a man bearing a pitcher of water: follow him.","14":"And wheresoever he shall go in, say ye to the goodman of the house, The Master saith, Where is the guestchamber, where I shall eat the passover with my disciples?","15":"And he will shew you a large upper room furnished *and* prepared: there make ready for us.","16":"And his disciples went forth, and came into the city, and found as he had said unto them: and they made ready the passover.","17":"And in the evening he cometh with the twelve.","18":"And as they sat and did eat, Jesus said, Verily I say unto you, One of you which eateth with me shall betray me.","19":"And they began to be sorrowful, and to say unto him one by one, *Is* it I? and another *said, Is* it I?","20":"And he answered and said unto them, *It is* one of the twelve, that dippeth with me in the dish.","21":"The Son of man indeed goeth, as it is written of him: but woe to that man by whom the Son of man is betrayed! good were it for that man if he had never been born.","22":"And as they did eat, Jesus took bread, and blessed, and brake *it*, and gave to them, and said, Take, eat: this is my body.","23":"And he took the cup, and when he had given thanks, he gave *it* to them: and they all drank of it.","24":"And he said unto them, This is my blood of the new testament, which is shed for many.","25":"Verily I say unto you, I will drink no more of the fruit of the vine, until that day that I drink it new in the kingdom of God.","26":"And when they had sung an hymn, they went out into the mount of Olives.","27":"And Jesus saith unto them, All ye shall be offended because of me this night: for it is written, I will smite the shepherd, and the sheep shall be scattered.","28":"But after that I am risen, I will go before you into Galilee.","29":"But Peter said unto him, Although all shall be offended, yet *will* not I.","30":"And Jesus saith unto him, Verily I say unto thee, That this day, *even* in this night, before the cock crow twice, thou shalt deny me thrice.","31":"But he spake the more vehemently, If I should die with thee, I will not deny thee in any wise. Likewise also said they all.","32":"And they came to a place which was named Gethsemane: and he saith to his disciples, Sit ye here, while I shall pray.","33":"And he taketh with him Peter and James and John, and began to be sore amazed, and to be very heavy;","34":"And saith unto them, My soul is exceeding sorrowful unto death: tarry ye here, and watch.","35":"And he went forward a little, and fell on the ground, and prayed that, if it were possible, the hour might pass from him.","36":"And he said, Abba, Father, all things *are* possible unto thee; take away this cup from me: nevertheless not what I will, but what thou","37":"And he cometh, and findeth them sleeping, and saith unto Peter, Simon, sleepest thou? couldest not thou watch one hour?","38":"Watch ye and pray, lest ye enter into temptation. The spirit truly *is* ready, but the flesh *is* weak.","39":"And again he went away, and prayed, and spake the same words.","40":"And when he returned, he found them asleep again, (for their eyes were heavy,) neither wist they what to answer him.","41":"And he cometh the third time, and saith unto them, Sleep on now, and take *your* rest: it is enough, the hour is come; behold, the Son of man is betrayed into the hands of sinners.","42":"Rise up, let us go; lo, he that betrayeth me is at hand.","43":"And immediately, while he yet spake, cometh Judas, one of the twelve, and with him a great multitude with swords and staves, from the chief priests and the scribes and the elders.","44":"And he that betrayed him had given them a token, saying, Whomsoever I shall kiss, that same is he; take him, and lead *him* away safely.","45":"And as soon as he was come, he goeth straightway to him, and saith, Master, master; and kissed him.","46":"And they laid their hands on him, and took him.","47":"And one of them that stood by drew a sword, and smote a servant of the high priest, and cut off his ear.","48":"And Jesus answered and said unto them, Are ye come out, as against a thief, with swords and *with* staves to take me?","49":"I was daily with you in the temple teaching, and ye took me not: but the scriptures must be fulfilled.","50":"And they all forsook him, and fled.","51":"And there followed him a certain young man, having a linen cloth cast about *his* naked *body*; and the young men laid hold on him:","52":"And he left the linen cloth, and fled from them naked.","53":"And they led Jesus away to the high priest: and with him were assembled all the chief priests and the elders and the scribes.","54":"And Peter followed him afar off, even into the palace of the high priest: and he sat with the servants, and warmed himself at the fire.","55":"And the chief priests and all the council sought for witness against Jesus to put him to death; and found none.","56":"For many bare false witness against him, but their witness agreed not together.","57":"And there arose certain, and bare false witness against him, saying,","58":"We heard him say, I will destroy this temple that is made with hands, and within three days I will build another made without hands.","59":"But neither so did their witness agree together.","60":"And the high priest stood up in the midst, and asked Jesus, saying, Answerest thou nothing? what *is it which* these witness against thee?","61":"But he held his peace, and answered nothing. Again the high priest asked him, and said unto him, Art thou the Christ, the Son of the Blessed?","62":"And Jesus said, I am: and ye shall see the Son of man sitting on the right hand of power, and coming in the clouds of heaven.","63":"Then the high priest rent his clothes, and saith, What need we any further witnesses?","64":"Ye have heard the blasphemy: what think ye? And they all condemned him to be guilty of death.","65":"And some began to spit on him, and to cover his face, and to buffet him, and to say unto him, Prophesy: and the servants did strike him with the palms of their hands.","66":"And as Peter was beneath in the palace, there cometh one of the maids of the high priest:","67":"And when she saw Peter warming himself, she looked upon him, and said, And thou also wast with Jesus of Nazareth.","68":"But he denied, saying, I know not, neither understand I what thou sayest. And he went out into the porch; and the cock crew.","69":"And a maid saw him again, and began to say to them that stood by, This is *one* of them.","70":"And he denied it again. And a little after, they that stood by said again to Peter, Surely thou art *one* of them: for thou art a Galilaean, and thy speech agreeth","71":"But he began to curse and to swear, *saying*, I know not this man of whom ye speak.", // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
