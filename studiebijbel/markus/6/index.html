r zullen wij in de woestijn zoveel broden krijgen, dat wij zo'n grote menigte zouden verzadigen?", "Jak 4:8-10": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen! Gedraag u als ellendigen, en treur en ween; laat uw lachen veranderen in treuren, en uw blijdschap in verdriet. Verneder u voor de Heere, en Hij zal u verhogen.", "Matt 21:32": "Want Johannes is naar u toe gekomen op de weg van gerechtigheid, en u hebt hem niet geloofd; maar de tollenaars en de hoeren hebben hem geloofd; en u, terwijl u dat zag, hebt daarna geen berouw gehad om hem alsnog te geloven.", "Ps 122:6": "Bid om de vrede van Jeruzalem; het moet goed gaan met hen die u liefhebben.", "Num 15:32-36": "Toen de kinderen van Israël in de woestijn waren, vonden zij een man die hout las op de sabbatdag. En zij die hem hout zagen lezen, brachten hem tot Mozes en tot Aäron en tot de hele vergadering. En zij stelden hem in bewaring; want het was niet duidelijk gemaakt wat hem gedaan moest worden.", "Luk 13:34": "Jeruzalem, Jeruzalem! U die de profeten doodt en stenigt hen die naar u toe gezonden zijn, hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens onder haar vleugels verzamelt; en u hebt niet gewild?", "1 Joh 2:9": "Wie zegt, dat hij in het licht is, en zijn broeder haat, die is tot nu toe in de duisternis.", "Ezech 46:1": "Zo zegt de Heere HEERE: De poort van het binnenste voorhof, die naar het oosten kijkt, moet de zes werkdagen gesloten zijn; maar op de sabbatdag moet zij geopend worden; ook moet zij geopend worden op de dag van de nieuwe maan.", "Dan 9:11": "Maar heel Israël heeft Uw wet overtreden, door af te wijken, zodat zij Uw stem niet gehoorzaamden; daarom is over ons uitgestort die vloek en die eed, die geschreven is in de wet van Mozes, de knecht van God, omdat wij tegen Hem gezondigd hebben.", "Joh 15:20": "Denk aan het woord dat Ik u gezegd heb: Een dienstknecht is niet meer dan zijn heer. Als zij Mij vervolgd hebben, zullen zij ook u vervolgen; als zij Mijn woord bewaard hebben, zullen zij ook het uwe bewaren.", "Matt 14:5": "En hoewel hij hem wilde doden, vreesde hij het volk, omdat zij hem hielden voor een profeet.", "Rom 11:7": "Wat dan? Wat Israël zoekt, dat heeft het niet verkregen; maar de uitverkorenen hebben het verkregen, en de anderen zijn verhard geworden.", "Luk 2:34": "En Simeon zegende hen, en zei tegen Maria, Zijn moeder: Zie, Deze wordt gezet tot een val en opstanding van velen in Israël, en tot een teken dat weersproken zal worden.", "Tit 2:6": "Vermaan de jonge mannen eveneens dat zij matig zijn.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Luk 4:23-29": "En Hij zei tegen hen: U zult zonder twijfel dit spreekwoord tegen Mij zeggen: Dokter, genees Uzelf; al wat wij gehoord hebben dat in Kapernaüm gebeurd is, doe dat ook hier in Uw vaderland. En Hij zei: Voorwaar, Ik zeg u, dat geen profeet aangenaam is in zijn vaderland. Maar Ik zeg u naar waarheid: Er waren veel weduwen in Israël in de dagen van Elia, toen de hemel drie jaar en zes maanden gesloten was, zodat er grote hongersnood kwam over het hele land.", "Deut 4:29-31": "Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel. Wanneer u in angst zult zijn, en al deze dingen u zullen treffen, in de laatste dagen, dan zult u terugkeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn. Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Luk 3:3": "En hij kwam in heel het omliggende land van de Jordaan, en predikte de doop van bekering tot vergeving van zonden,", "Ps 94:16": "Wie zal voor mij opstaan tegen de kwaaddoeners? Wie zal zich voor mij stellen tegen de werkers van de ongerechtigheid?", "Gen 4:7": "Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.", "Matt 18:22": "Jezus zei tegen hem: Ik zeg u, niet tot zeven keer, maar tot zeventig maal zeven.", "Matt 14:34": "En toen zij overgevaren waren, kwamen zij in het land Gennesaret.", "Hos 2:19": "En Ik zal u aan Mij verloven in geloof; en u zult de Heere kennen.", "Luk 24:11": "En hun woorden leken hun als onzinnig gepraat, en zij geloofden hen niet.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Joh 6:14-21": "Toen de mensen dan het teken zagen dat Jezus gedaan had, zeiden zij: Deze is werkelijk de Profeet, Die in de wereld komen zou. Toen Jezus dan merkte dat zij zouden komen om Hem met geweld mee te nemen, om Hem koning te maken, trok Hij Zich weer terug op de berg, Hijzelf alleen. En toen het avond geworden was, gingen Zijn discipelen naar de zee.", "Luk 19:41": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,", "Deut 18:1": "De Levitische priesters, de hele stam van Levi, zullen geen deel of erfdeel hebben met Israël; de vuuroffers van de HEERE en Zijn erfdeel zullen zij eten.", "Hos 6:1-3": "Kom, laten wij terugkeren tot de Heere, want Hij heeft verscheurd, en Hij zal ons genezen; Hij heeft geslagen, en Hij zal ons verbinden. Hij zal ons na twee dagen levend maken; op de derde dag zal Hij ons doen opstaan, en wij zullen voor Zijn aangezicht leven. Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Fil 2:30": "Want om het werk van Christus is hij dicht bij de dood gekomen, terwijl hij zijn leven niet ontzag, opdat hij het gebrek van uw bediening aan mij zou aanvullen.", "Ps 69:8-10": "Want om Uwentwil draag ik smaad; schande heeft mijn gezicht bedekt. Ik ben mijn broeders vreemd geworden, en onbekend aan de kinderen van mijn moeder. Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.", "Mal 1:2": "Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad,", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "2 Sam 13:23-29": "En het gebeurde, na twee volle jaren, dat Absalom schaapscheerders had bij Baäl-Hazor, dat bij Efraïm ligt; en Absalom nodigde alle zonen van de koning uit. En Absalom kwam bij de koning, en zei: Zie, uw knecht heeft nu schaapscheerders; laat toch de koning en zijn knechten met uw knecht meegaan. Maar de koning zei tegen Absalom: Nee, mijn zoon, laten we toch niet allemaal samen gaan, opdat wij u niet tot last zijn; en hij drong bij hem aan, doch hij wilde niet gaan, maar zegende hem.", "Ex 34:21": "Zes dagen zult u werken, maar op de zevende dag zult u rusten; in de ploegtijd en in de oogst zult u rusten.", "Jer 50:6": "Mijn volk waren verloren schapen, hun herders hadden hen verleid, zij hadden hen naar de bergen gevoerd, zij gingen van berg tot heuvel, zij vergaten hun rustplaats.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "Hand 13:42": "En toen de Joden de synagoge uitgegaan waren, vroegen de heidenen of tegen de volgende sabbat dezelfde woorden tot hen gesproken zouden worden.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "1 Tim 3:2": "Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren;", "Num 6:23-26": "Spreek tot Aäron en zijn zonen en zeg: Zo zult u de kinderen van Israël zegenen, door tot hen te zeggen: De HEERE zegent u, en behoedt u! De HEERE doet Zijn aangezicht over u lichten, en is u genadig!", "Hand 2:40": "En met veel meer andere woorden getuigde hij, en vermaande hen, en zei: Laat u behouden van dit verkeerde geslacht!", "Ps 119:139": "Mijn ijver heeft mij doen vergaan, omdat mijn tegenstanders Uw woorden vergeten hebben.", "Luk 9:8": "en anderen, dat Elia verschenen was; en weer anderen, dat een van de profeten van vroeger was opgestaan.", "Ps 93:3": "De rivieren verheffen, o HEERE! de rivieren verheffen hun bruisen; de rivieren verheffen hun golfslag.", "Ef 5:14": "Daarom zegt Hij: Ontwaak, u die slaapt, en sta op uit de doden; en Christus zal over u lichten.", "Jer 24:7": "En Ik zal hun een hart geven om Mij te kennen, dat Ik de HEERE ben; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn; want zij zullen zich tot Mij bekeren met hun hele hart.", "Hand 16:13": "En op de dag van de sabbat gingen wij de stad uit, naar de rivier, waar men gewoonlijk bad; en wij gingen zitten en spraken tot de vrouwen die daar samengekomen waren.", "Matt 10:1-4": "Toen Hij Zijn twaalf discipelen bij Zich geroepen had, gaf Hij hun macht over de onreine geesten, om ze uit te werpen, en om alle ziekte en alle kwaal te genezen. De namen van de twaalf apostelen zijn deze: de eerste, Simon, genoemd Petrus, en Andreas, zijn broer; Jakobus, de zoon van Zebedeüs, en Johannes, zijn broer; Filippus en Bartholomeüs; Thomas en Mattheüs, de tollenaar; Jakobus, de zoon van Alfeüs, en Lebbeüs, bijgenaamd Thaddeüs;", "Gal 1:20": "Wat ik u nu schrijf, zie, ik getuig voor God, dat ik niet lieg!", "Ex 14:14": "De HEERE zal voor u strijden, en u zult stil zijn.", "Luk 14:16-24": "Maar Hij zei tegen hem: Een zeker mens bereidde een groot avondmaal, en nodigde er velen voor uit. En hij stuurde zijn dienstknecht op het uur van het avondmaal om tegen de genodigden te zeggen: Kom, want alles is nu klaar. En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd.", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Mal 1:7": "U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk.", "2 Kor 6:14-16": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Lev 26:34": "Dan zal het land aan zijn sabbatten een welgevallen hebben, al de dagen van de verwoesting, terwijl u in het land van uw vijanden bent; dan zal het land rusten, en aan zijn sabbatten een welgevallen hebben.", "Mark 6:14-16": "En koning Herodes hoorde dit (want Zijn Naam was bekend geworden), en zei: Johannes, die daar doopte, is opgewekt uit de doden, en daarom werken die krachten in Hem. Anderen zeiden: Hij is Elia; en anderen zeiden: Hij is een profeet, of als een van de profeten. Maar toen Herodes dit hoorde, zei hij: Dit is Johannes, die ik onthoofd heb; hij is opgewekt uit de doden.", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Deut 5:12-15": "Onderhoud de sabbatdag, dat u die heiligt, zoals de HEERE, uw God, u geboden heeft. Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw os, noch uw ezel, noch enig van uw vee, noch de vreemdeling die in uw poorten is; opdat uw dienstknecht en uw dienstmaagd rusten, net als u.", "1 Joh 4:17": "Hierin is de liefde bij ons volmaakt, opdat wij vrijmoedigheid mogen hebben in de dag van het oordeel, namelijk dat wij zijn zoals Hij is, in deze wereld.", "Gen 39:17-20": "Toen sprak zij tot hem met diezelfde woorden, en zei: De Hebreeuwse knecht die u ons hebt binnengebracht, is bij mij gekomen, om met mij te spotten. En het is gebeurd, toen ik mijn stem verhief en riep, dat hij zijn kleed bij mij liet, en naar buiten vluchtte. En het gebeurde, toen zijn heer de woorden van zijn vrouw hoorde, die zij tegen hem sprak en zei: Op deze manier heeft uw knecht mij gedaan, dat zijn woede oplaaide.", "Matt 14:1-12": "In diezelfde tijd hoorde Herodes, de viervorst, het gerucht van Jezus; en hij zei tegen zijn knechten: Deze is Johannes de Doper; hij is opgewekt van de doden, en daarom werken die krachten in Hem. Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer.", "Jer 37:21": "Toen gaf koning Zedekia bevel, en zij brachten Jeremia onder in het voorhof van de gevangenis, en men gaf hem dagelijks een bol brood uit de Bakkerstraat, totdat al het brood van de stad op was. Zo bleef Jeremia in het voorhof van de gevangenis.", "Joh 8:43": "Waarom begrijpt u Mijn spraak niet? Het is omdat u Mijn woord niet kunt horen.", "Hand 13:46": "Maar Paulus en Barnabas zeiden vrijmoedig: Het was nodig dat eerst tot u het Woord van God gesproken zou worden; doch aangezien u het verstoot, en uzelf het eeuwige leven niet waard oordeelt, zie, wij keren ons tot de heidenen.", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Num 27:18-23": "Toen zei de HEERE tegen Mozes: Neem Jozua, de zoon van Nun, een man in wie de Geest is, bij u; en leg uw hand op hem; En stel hem voor Eleazar, de priester, en voor de hele vergadering; en geef hem opdracht voor hun ogen; En leg iets van uw waardigheid op hem, opdat zij luisteren, namelijk de hele vergadering van de kinderen van Israël.", "Joh 7:40-44": "Velen dan uit de menigte, die dit woord hoorden, zeiden: Deze is werkelijk de Profeet. Anderen zeiden: Deze is de Christus. En anderen zeiden: Zal de Christus dan uit Galilea komen? Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?", "Mark 8:7": "En zij hadden een paar visjes; en nadat Hij gezegend had, zei Hij dat zij die ook zouden voorleggen.", "1 Tim 4:3": "die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen.", "Ps 34:19": "Koph. De HEERE is nabij de gebrokenen van hart, en Hij behoudt de verslagenen van geest.", "Ps 119:54": "Uw inzettingen zijn mij gezangen geweest, ter plaatse van mijn vreemdelingschap.", "Jes 50:7-10": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "1 Kor 11:11": "Toch is de man niet zonder de vrouw, en de vrouw niet zonder de man, in de Heere.", "Jer 31:25": "Want Ik heb de vermoeide ziel dronken gemaakt, en Ik heb elke treurige ziel vervuld.", "Ezech 16:61-63": "Dan zult u aan uw wegen denken en beschaamd zijn, wanneer u uw zusters, die groter zijn dan u, samen met hen die kleiner zijn dan u, aannemen zult; want Ik zal ze u geven tot dochters, maar niet op grond van uw verbond. Want Ik zal Mijn verbond met u oprichten, en u zult weten dat Ik de HEERE ben; opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Ezech 18:19-32": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven. De ziel die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid van de vader, en de vader zal niet dragen de ongerechtigheid van de zoon; de gerechtigheid van de rechtvaardige zal op hem zijn, en de goddeloosheid van de goddeloze zal op hem zijn. Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en recht en gerechtigheid doet, hij zal zeker leven, hij zal niet sterven.", "Matt 17:17": "Jezus antwoordde en zei: O ongelovig en verkeerd geslacht, hoe lang zal Ik nog bij u zijn, hoe lang zal Ik u nog verdragen? Breng hem hier bij Mij.", "Joël 2:12": "Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen.", "Lev 21:13-15": "Hij zal ook een vrouw in haar maagdelijkheid nemen. Een weduwe, of verstotene, of ontheiligde hoer, zo iemand zal hij niet nemen; maar een maagd uit zijn volken zal hij tot een vrouw nemen. En hij zal zijn nageslacht onder zijn volken niet ontheiligen; want Ik ben de HEERE, die hem heiligt!", "2 Petr 2:4": "Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden;", "Ezech 18:1-30": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Ps 94:17-19": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond. Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij. Toen mijn gedachten in mij talrijk werden, hebben Uw vertroostingen mijn ziel verkwikt.", "1 Kon 22:27": "En u zult zeggen: Zo zegt de koning: Zet deze man in de gevangenis, en geef hem brood van benauwdheid en water van benauwdheid, totdat ik in vrede terugkom.", "Joh 15:20-22": "Denk aan het woord dat Ik u gezegd heb: Een dienstknecht is niet meer dan zijn heer. Als zij Mij vervolgd hebben, zullen zij ook u vervolgen; als zij Mijn woord bewaard hebben, zullen zij ook het uwe bewaren. Maar al deze dingen zullen zij u doen om Mijn Naam, omdat zij Hem niet kennen, Die Mij gezonden heeft. Als Ik niet gekomen was, en tot hen gesproken had, hadden zij geen zonde; maar nu hebben zij geen voorwendsel voor hun zonde.", "Joz 13:14": "Alleen aan de stam Levi gaf hij geen erfenis. De vuuroffers van God, de HEERE van Israël, zijn zijn erfenis, zoals Hij tot hem gesproken had.", "Joh 7:3-5": "Zijn broers zeiden dan tegen Hem: Vertrek van hier en ga naar Judea, zodat ook Uw discipelen de werken kunnen zien die U doet. Want niemand doet iets in het verborgen als hij zelf zoekt om openlijk bekend te zijn. Als U deze dingen doet, laat Uzelf dan aan de wereld zien. Want ook Zijn broers geloofden niet in Hem.", "Jer 18:11": "Nu dan, spreek nu tot de mannen van Juda en tot de inwoners van Jeruzalem, en zeg: Zo zegt de HEERE: Zie, Ik formeer een kwaad tegen u, en denk tegen u een gedachte; bekeer u dan nu, ieder van zijn boze weg, en maak uw wegen en uw daden goed.", "Hand 23:11": "En de volgende nacht stond de Heere bij hem en zei: Heb goede moed, Paulus, want zoals u in Jeruzalem van Mij getuigd hebt, zo moet u ook in Rome getuigen.", "Matt 14:3-12": "Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer. Want Johannes zei tegen hem: Het is u niet geoorloofd haar te hebben. En hoewel hij hem wilde doden, vreesde hij het volk, omdat zij hem hielden voor een profeet.", "Ps 53:6": "Daar zijn zij met vervaardheid vervaard geworden, waar geen vervaardheid was; want God heeft de beenderen van hem die u belegerde, verstrooid; u hebt hen beschaamd gemaakt, want God heeft hen verworpen.", "Mark 14:5": "Want die had voor meer dan driehonderd penningen verkocht kunnen worden, en dat geld aan de armen gegeven kunnen worden; en zij verweten het haar bitter.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Luk 4:22": "En zij gaven Hem allen getuigenis, en verwonderden zich over de aangename woorden die uit Zijn mond kwamen; en zeiden: Is dit niet de zoon van Jozef?", "Luk 10:12-15": "En Ik zeg u dat het voor Sodom draaglijker zal zijn op die dag dan voor die stad. Wee u, Chorazin, wee u, Bethsaïda, want als in Tyrus en Sidon de krachten waren gebeurd die in u gebeurd zijn, zouden zij zich allang, in zak en as zittend, bekeerd hebben. Maar het zal voor Tyrus en Sidon draaglijker zijn in het oordeel dan voor u.", "Luk 4:16": "En Hij kwam in Nazareth, waar Hij was opgevoed, en ging, naar Zijn gewoonte, op de dag van de sabbat naar de synagoge; en stond op om te lezen.", "Matt 12:46": "En terwijl Hij nog tegen de menigten sprak, zie, Zijn moeder en broeders stonden buiten, en wilden Hem spreken.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "2 Tim 4:17": "Maar de Heere heeft mij bijgestaan en heeft mij kracht gegeven; opdat door mij de prediking ten volle bekend zou worden, en alle heidenen die zouden horen. En ik ben uit de muil van de leeuw verlost.", "Ps 92:2-16": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste! Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten; Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.", "Jes 53:4": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.", "Luk 4:15": "En Hij leerde in hun synagogen, en werd door allen geprezen.", "Luk 5:26": "En verbazing had hen allen overweldigd, en zij verheerlijkten God, en werden vervuld met vrees, en zeiden: Wij hebben vandaag ongelooflijke dingen gezien.", "1 Kon 8:31": "Wanneer iemand tegen zijn naaste zal gezondigd hebben, en hij hem een vloekeed opgelegd zal hebben, om zichzelf te vervloeken; en de vloekeed voor Uw altaar in dit huis komen zal;", "Jer 5:4": "Toch zei ik: Zeker, dit zijn de armen; zij handelen dwaas, omdat zij de weg van de HEERE, het recht van hun God, niet kennen.", "Matt 14:6-12": "Maar toen de verjaardag van Herodes gevierd werd, danste de dochter van Herodias in hun midden, en zij beviel Herodes. Daarom beloofde hij haar met een eed te geven wat zij ook zou vragen. En zij, van tevoren door haar moeder onderricht, zei: Geef mij hier op een schotel het hoofd van Johannes de Doper.", "Matt 12:38-45": "Toen antwoordden sommigen van de Schriftgeleerden en Farizeeën: Meester, wij willen graag een teken van U zien. Maar Hij antwoordde en zei tegen hen: Het slechte en overspelige geslacht verlangt een teken; en hun zal geen teken gegeven worden, dan het teken van de profeet Jona. Want zoals Jona drie dagen en drie nachten in de buik van de walvis was, zo zal de Zoon des mensen drie dagen en drie nachten in het hart van de aarde zijn.", "Gal 2:12": "Want voordat sommigen van Jakobus gekomen waren, at hij samen met de heidenen; maar toen zij gekomen waren, trok hij zich terug en zonderde zichzelf af, uit vrees voor hen die uit de besnijdenis waren.", "Jes 1:6": "Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "Job 11:16-19": "Want u zult de moeite vergeten, en er aan denken als aan water dat voorbijgegaan is. Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn. En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen;", "Jer 25:5": "En Hij zei: Bekeer u toch, ieder van zijn boze weg, en van de boosheid van uw daden, en woon in het land, dat de HEERE u en uw vaderen gegeven heeft, van eeuw tot in eeuw;", "Luk 24:30": "En het gebeurde, terwijl Hij met hen aan tafel zat, dat Hij het brood nam, en het zegende, en toen Hij het gebroken had, gaf Hij het hun.", "Joh 8:57": "De Joden zeiden dan tegen Hem: U bent nog geen vijftig jaar, en hebt U Abraham gezien?", "Joh 6:16-21": "En toen het avond geworden was, gingen Zijn discipelen naar de zee. En zij gingen in het schip, en voeren over de zee naar Kapernaüm. En het was al donker geworden, en Jezus was nog niet bij hen gekomen. En de zee werd onstuimig, doordat er een harde wind waaide.", "Joh 10:25": "Jezus antwoordde hun: Ik heb het u gezegd, en u gelooft het niet. De werken die Ik doe in de Naam van Mijn Vader, die getuigen van Mij.", "Mark 6:54-56": "En toen zij uit het schip gegaan waren, herkenden de mensen Hem meteen. En zij liepen het hele omliggende land door, en begonnen op draagbedden hen die ziek waren rond te dragen, naar de plaats waar zij hoorden dat Hij was. En waar Hij ook kwam, in dorpen, of steden, of gehuchten, daar legden zij de zieken op de markten, en smeekten Hem dat zij slechts de zoom van Zijn kleed mochten aanraken; en zovelen als Hem aanraakten, werden gezond.", "Mark 12:17": "En Jezus antwoordde en zei tegen hen: Geef dan aan de keizer wat van de keizer is, en aan God wat van God is. En zij verwonderden zich over Hem.", "Luk 3:1": "En in het vijftiende jaar van de regering van keizer Tiberius, toen Pontius Pilatus stadhouder was over Judea, en Herodes viervorst over Galilea, en Filippus, zijn broer, viervorst over Iturea en over het land Trachonitis, en Lysanias viervorst over Abilene;", "Hand 12:8": "En de engel zei tegen hem: Doe uw gordel om, en bind uw sandalen aan. En hij deed zo. En hij zei tegen hem: Sla uw mantel om, en volg mij.", "Joh 15:5": "Ik ben de Wijnstok, en u de ranken; die in Mij blijft, en Ik in hem, die draagt veel vrucht; want zonder Mij kunt u niets doen.", "Joh 6:24": "toen de menigte dan zag dat Jezus daar niet was, en Zijn discipelen ook niet, gingen zij ook in de schepen, en kwamen in Kapernaüm, op zoek naar Jezus.", "Gen 20:7": "Geef dan nu de vrouw van deze man terug, want hij is een profeet, en hij zal voor u bidden, zodat u blijft leven; maar als u haar niet teruggeeft, weet dan dat u zeker sterven zult, u en al wat van u is!", "Luk 13:17": "En toen Hij dit zei, werden allen die zich tegen Hem verzetten beschaamd; en heel de menigte verblijdde zich over al de heerlijke dingen die door Hem gebeurden.", "Luk 6:21-23": "Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen. Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen. Verblijd u op die dag, en wees vrolijk; want zie, uw loon is groot in de hemel; want hun vaders deden hetzelfde met de profeten.", "Spr 1:7": "De vrees van de HEERE is het beginsel van de wetenschap; de dwazen verachten wijsheid en tucht.", "Jes 24:2": "En zoals het met het volk zal gaan, zo zal het met de priester zijn; zoals met de knecht, zo met zijn heer; zoals met de dienstmaagd, zo met haar vrouw; zoals met de koper, zo met de verkoper; zoals met de lener, zo met de ontlener; zoals met de woekeraar, zo met hem van wie hij woeker ontvangt.", "Ex 32:9-14": "Verder zei de HEERE tegen Mozes: Ik heb dit volk gezien, en zie, het is een hardnekkig volk! En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken. Doch Mozes smeekte de HEERE zijn God, en zei: O HEERE, waarom zou Uw toorn ontsteken tegen Uw volk, dat Gij met grote kracht en met een sterke hand uit Egypteland hebt uitgevoerd?", "Luk 24:15-25": "En het gebeurde, terwijl zij samen spraken en elkaar ondervroegen, dat Jezus Zelf bij hen kwam, en met hen meeging. En hun ogen werden gehouden, zodat zij Hem niet herkenden. En Hij zei tegen hen: Wat zijn dit voor gesprekken die u onderweg met elkaar voert, en waarom kijkt u zo droevig?", "Matt 24:42-51": "Waak dan, want u weet niet in welk uur uw Heere komen zal. Maar weet dit, dat als de heer des huizes geweten had in welke nachtwake de dief komen zou, hij gewaakt zou hebben en niet zou hebben toegelaten dat zijn huis werd doorgraven. Daarom, wees ook u bereid, want op een uur dat u het niet verwacht, zal de Zoon des mensen komen.", "Luk 20:47": "die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen een des te zwaarder oordeel ontvangen.", "Jer 2:8": "De priesters zeiden niet: Waar is de HEERE? en die de wet hanteerden, kenden Mij niet; en de herders overtraden tegen Mij; en de profeten profeteerden door Baäl, en wandelden naar dingen die geen nut doen.", "Gen 31:42": "Als de God van mijn vader, de God van Abraham, en de Vreze van Izak, niet bij mij was geweest, dan had u mij zeker nu met lege handen weggezonden! God heeft mijn ellende, en de arbeid van mijn handen, gezien, en heeft u gisteravond bestraft.", "Ef 6:7": "terwijl u dient met goedwilligheid de Heere, en niet de mensen;", "Amos 6:5": "Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "Job 35:10": "Maar niemand zegt: Waar is God, mijn Maker, Die de lofzangen geeft in de nacht?", "Mark 3:13": "En Hij ging de berg op, en riep tot Zich wie Hij wilde; en zij kwamen naar Hem toe.", "Joh 4:32": "Maar Hij zei tegen hen: Ik heb voedsel om te eten dat u niet kent.", "Luk 24:38-41": "En Hij zei tegen hen: Waarom bent u ontsteld, en waarom komen zulke overleggingen op in uw hart? Zie Mijn handen en Mijn voeten; want Ik ben het Zelf; raak Mij aan, en zie; want een geest heeft geen vlees en beenderen, zoals u ziet dat Ik heb. En toen Hij dit gezegd had, toonde Hij hun de handen en de voeten.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Luk 23:47": "Toen de hoofdman over honderd zag wat er gebeurd was, verheerlijkte hij God en zei: Waarlijk, deze Mens was rechtvaardig.", "Mark 10:17-22": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God. U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "2 Kor 3:15": "Maar tot op de huidige dag, telkens als Mozes gelezen wordt, ligt er een deksel op hun hart.", "Deut 32:28": "Want zij zijn een volk, dat door raadslagen verloren gaat, en er is geen verstand in hen.", "Ezech 7:16": "En hun ontkomenen zullen wel ontkomen, maar zij zullen op de bergen zijn, zij allen zullen zijn als duiven van de dalen, kermend, ieder om zijn ongerechtigheid.", "Jer 2:11": "Heeft ook een volk de goden veranderd, hoewel die geen goden zijn? Toch heeft Mijn volk zijn Eer veranderd in iets dat geen nut doet.", "Luk 9:10-17": "En de apostelen keerden terug en vertelden Hem alles wat zij gedaan hadden. En Hij nam hen mee en trok Zich met hen alleen terug naar een eenzame plaats bij de stad die Bethsaïda heet. Maar de menigten kwamen dit te weten en volgden Hem; en Hij ontving hen, en sprak tot hen over het Koninkrijk van God; en Hij maakte hen gezond die genezing nodig hadden. En de dag begon te dalen; en de twaalf kwamen naar Hem toe en zeiden tegen Hem: Stuur de menigte weg, zodat zij naar de omliggende dorpen en gehuchten kunnen gaan om onderdak te vinden en voedsel, want hier zijn wij op een eenzame plaats.", "Rom 10:21": "Maar tegen Israël zegt Hij: De hele dag heb Ik Mijn handen uitgestrekt naar een ongehoorzaam en tegensprekend volk.", "Rom 11:30-32": "Want zoals ook u eertijds God ongehoorzaam geweest bent, maar nu barmhartigheid verkregen hebt door hun ongehoorzaamheid; Zo zijn ook dezen nu ongehoorzaam geweest, opdat ook zij door uw barmhartigheid barmhartigheid zouden verkrijgen. Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.", "Matt 10:10": "Ook geen reistas voor onderweg, geen twee stel kleren, geen schoenen, geen staf; want de arbeider is zijn voedsel waard.", "1 Tim 6:1-21": "Alle dienstknechten die onder het juk zijn, moeten hun eigen heren alle eer waardig achten, opdat de Naam van God en de leer niet gelasterd wordt. En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen. Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "1 Petr 2:5": "Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus.", "Hand 5:42": "En zij hielden niet op, elke dag, in de tempel en bij de huizen, te leren, en Jezus Christus te verkondigen.", "2 Kor 12:20": "Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;", "Rom 11:20": "Het is wel; zij zijn door ongeloof afgebroken, en u staat door het geloof. Wees niet hoogmoedig, maar vrees.", "Hebr 2:14": "Omdat nu de kinderen deel hebben aan vlees en bloed, heeft Hij Zelf op dezelfde manier daaraan deelgenomen, opdat Hij door de dood hem teniet zou doen die de macht over de dood had, dat is: de duivel;", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Joh 1:46": "Filippus vond Nathanaël en zei tegen hem: Wij hebben Hem gevonden, van Wie Mozes in de wet geschreven heeft, en de profeten, namelijk Jezus, de zoon van Jozef, van Nazareth.", "Rom 15:4": "Want al wat vroeger geschreven is, dat is tot onze lering geschreven, opdat wij, door lijdzaamheid en vertroosting van de Schriften, hoop zouden hebben.", "Est 7:2": "Zei de koning tegen Esther, ook op de tweede dag, op het maaltijd van de wijn: Wat is uw bede, koningin Esther? En zij zal u gegeven worden; en wat is uw verzoek? Het zal gebeuren, ook tot de helft van het koninkrijk.", "Luk 10:35": "En de volgende dag, toen hij wegging, haalde hij twee penningen tevoorschijn, gaf ze aan de waard en zei tegen hem: Zorg voor hem; en wat u meer aan hem ten koste zult leggen, zal ik u terugbetalen als ik terugkom.", "Joh 15:7-12": "Als u in Mij blijft, en Mijn woorden in u blijven, dan zult u vragen wat u wilt, en het zal u gebeuren. Hierin is Mijn Vader verheerlijkt, dat u veel vrucht draagt; en u zult Mijn discipelen zijn. Zoals de Vader Mij liefgehad heeft, heb Ik ook u liefgehad; blijft in deze Mijn liefde.", "Ezech 7:27": "De koning zal rouw bedrijven, en de vorsten zullen met verwoesting bekleed zijn, en de handen van het volk van het land zullen verschrikt zijn; Ik zal hun doen naar hun weg, en met hun rechten zal Ik ze richten; en zij zullen weten dat Ik de HEERE ben.", "Luk 24:47": "En in Zijn Naam moesten bekering en vergeving van de zonden gepredikt worden onder alle volken, te beginnen bij Jeruzalem.", "Jer 4:1-4": "Als u zich zult bekeren, Israël! spreekt de HEERE, bekeer u tot Mij; en als u uw afschuwelijke afgoden van Mijn aangezicht zult wegdoen, dwaal dan niet meer rond. Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen. Want zo zegt de HEERE tegen de mannen van Juda en tegen Jeruzalem: Braak voor uzelf een braakland, en zaai niet onder de doornen.", "1 Petr 5:2": "Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed;", "Luk 9:28": "En het gebeurde ongeveer acht dagen na deze woorden, dat Hij Petrus, Johannes en Jakobus meenam en de berg opklom om te bidden.", "Hand 13:2-5": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb. Toen vastten en baden zij, en nadat zij hun de handen opgelegd hadden, lieten zij hen gaan. Zij dan, uitgezonden door de Heilige Geest, kwamen af naar Seleucië, en scheepten van daar af naar Cyprus.", "Deut 33:27": "De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Jer 17:9": "Arglistig is het hart, meer dan enig ding, ja, dodelijk is het; wie zal het kennen?", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Matt 17:10": "En Zijn discipelen vroegen Hem: Waarom zeggen de Schriftgeleerden dan dat Elia eerst moet komen?", "Luk 10:10": "Maar in welke stad u ook binnengaat en zij u niet ontvangen, ga naar buiten op haar straten en zeg:", "Kol 1:13": "Die ons getrokken heeft uit de macht van de duisternis, en overgezet heeft in het Koninkrijk van de Zoon van Zijn liefde;", "Matt 21:11": "En de menigten zeiden: Deze is Jezus, de Profeet van Nazareth in Galilea.", "Matt 19:16-19": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb? En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden. Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "2 Kor 8:16-18": "Doch God zij dank, Die dezelfde naarstigheid voor u in het hart van Titus gegeven heeft; Dat hij de vermaning heeft aangenomen, en zeer naarstig zijnde, gewillig naar u toe gereisd is. En wij hebben ook met hem gezonden de broeder, die lof heeft in het Evangelie door alle gemeenten;", "Ezech 3:7": "Maar het huis Israëls wil naar u niet horen, omdat zij naar Mij niet willen horen; want het hele huis Israëls is stijf van voorhoofd, en hard van hart zijn zij.", "Joh 6:42": "En zij zeiden: Is dit niet Jezus, de zoon van Jozef, van wie wij de vader en moeder kennen? Hoe zegt Hij dan: Ik ben uit de hemel neergedaald?", "Jes 51:3-13": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang. Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken. Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.", "2 Kor 12:13-18": "Want wat is er, waarin u minder geweest bent dan de andere gemeenten, behalve dan dat ikzelf u niet lastig ben geweest? Vergeef mij dit onrecht. Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen. En ik zal zeer graag de kosten dragen, en voor uw zielen ten koste gegeven worden; hoewel ik, terwijl ik u overvloediger liefheb, minder bemind word.", "Joh 4:10": "Jezus antwoordde en zei tegen haar: Als u de gave van God kende, en Wie Hij is, Die tegen u zegt: Geef Mij te drinken, dan zou u van Hem hebben gevraagd, en Hij zou u levend water gegeven hebben.", "Matt 11:28": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven.", "Ezech 39:24": "Naar hun onreinheid en naar hun overtredingen heb Ik met hen gehandeld, en Ik heb Mijn aangezicht voor hen verborgen.", "Hebr 3:12": "Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "Jes 56:4-7": "Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond; Ik zal hun ook in Mijn huis en binnen Mijn muren een plaats en een naam geven, beter dan van zonen en dan van dochters; een eeuwige naam zal Ik ieder van hen geven, die niet uitgeroeid zal worden. En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden;", "Rom 1:19-22": "Omdat wat van God gekend kan worden, in hen openbaar is; want God heeft het hun geopenbaard. Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn. Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden;", "Lev 16:29-31": "En dit zal voor u een eeuwige inzetting zijn: u zult in de zevende maand, op de tiende van de maand, uzelf verootmoedigen, en geen enkel werk doen, of het nu een geboren Israëliet is of een vreemdeling die te midden van u verblijft. Want op die dag zal hij voor u verzoening doen, om u te reinigen; van al uw zonden zult u voor het aangezicht van de HEERE gereinigd worden. Dat zal voor u een sabbat van rust zijn, opdat u uzelf verootmoedigt; het is een eeuwige inzetting.", "Joh 6:60-62": "Velen van Zijn discipelen dan zeiden, toen zij dit hoorden: Dit is een harde uitspraak; wie kan dat aanhoren? Jezus, die bij Zichzelf wist dat Zijn discipelen daarover morden, zei tegen hen: Ergert dit u? Wat zou het dan zijn, als u de Zoon des mensen zag opvaren naar waar Hij eerder was?", "Luk 9:29": "En terwijl Hij bad, veranderde het aanzien van Zijn gezicht, en Zijn kleding werd wit en schitterend.", "Jes 63:17": "HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Joh 4:15": "De vrouw zei tegen Hem: Heere, geef mij dat water, zodat ik geen dorst meer krijg, en hier niet meer hoef te komen om te putten.", "Luk 12:57": "En waarom oordeelt u ook niet zelf wat recht is?", "Joh 5:46": "Want als u Mozes geloofde, zou u Mij geloven; want hij heeft van Mij geschreven.", "Joh 4:35": "Zegt u niet: Het zijn nog vier maanden, en dan komt de oogst? Zie, Ik zeg u: Sla uw ogen op en bekijk de velden; want ze zijn al wit om te oogsten.", "Ezech 12:3": "Daarom, mensenkind, maak u gereedschap voor een verhuizing, en vertrek bij dag voor hun ogen; en u zult vertrekken van uw plaats naar een andere plaats voor hun ogen; misschien zullen zij het opmerken, hoewel zij een opstandig huis zijn.", "Luk 4:42": "En toen het dag werd, ging Hij weg en trok naar een woeste plaats; en de menigten zochten Hem, en kwamen naar Hem toe, en hielden Hem tegen, opdat Hij niet van hen weg zou gaan.", "1 Tim 6:13": "Ik beveel u voor het aangezicht van God, Die alles levend maakt, en van Christus Jezus, Die onder Pontius Pilatus de goede belijdenis heeft afgelegd,", "Openb 3:2": "Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God.", "2 Petr 1:15": "Maar ik zal er ook mijn best voor doen, dat u bij elke gelegenheid, na mijn heengaan, hieraan kunt terugdenken.", "1 Sam 9:22": "Samuel dan nam Saul en zijn knecht, en bracht hen in de kamer; en hij gaf hun de voornaamste plaats onder de genodigden; die nu waren ongeveer dertig man.", "Luk 17:25": "Maar eerst moet Hij veel lijden, en verworpen worden door dit geslacht.", "Joh 3:11": "Voorwaar, voorwaar, Ik zeg u: Wij spreken wat Wij weten, en getuigen wat Wij gezien hebben; en u neemt Ons getuigenis niet aan.", "Ezech 36:31": "Dan zult u denken aan uw slechte wegen en uw handelingen, die niet goed waren; en u zult een walging van uzelf hebben over uw ongerechtigheden en over uw gruwelen.", "Luk 12:50": "Maar Ik moet met een doop gedoopt worden; en hoe beklemd voel Ik Mij, totdat het volbracht is!", "Joh 8:42": "Jezus zei dan tegen hen: Als God uw Vader was, zou u Mij liefhebben; want Ik ben van God uitgegaan, en Ik kom van Hem. Want Ik ben ook niet uit Mijzelf gekomen, maar Hij heeft Mij gezonden.", "Openb 2:9": "Ik weet uw werken, en verdrukking, en armoede (maar u bent rijk), en de lastering van hen die zeggen dat zij Joden zijn, en zijn het niet, maar zijn een synagoge van de satan.", "Gal 1:19": "En ik zag geen andere van de apostelen, dan Jakobus, de broer van de Heere.", "Mark 6:19-24": "En Herodias had het op hem voorzien, en wilde hem doden, maar kon het niet; want Herodes was bang voor Johannes, wetend dat hij een rechtvaardig en heilig man was, en hij beschermde hem; en wanneer hij hem hoorde, deed hij veel dingen, en hij luisterde graag naar hem. En toen er een gunstige dag gekomen was, toen Herodes op zijn verjaardag een maaltijd gaf voor zijn hoogwaardigheidsbekleders, en de aanvoerders over duizend, en de voornaamsten van Galilea;", "Klaagl 2:6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.", "2 Kron 22:4": "En hij deed wat kwaad was in de ogen van de HEERE, net als het huis van Achab; want zij waren zijn raadgevers, na de dood van zijn vader, tot zijn verderf.", "Luk 10:28-37": "En Hij zei tegen hem: U hebt juist geantwoord; doe dat, en u zult leven. Maar hij wilde zichzelf rechtvaardigen en zei tegen Jezus: En wie is mijn naaste? En Jezus antwoordde en zei: Een zeker mens ging van Jeruzalem naar Jericho, en viel in handen van rovers, die hem uitkleedden en daarbij zware slagen gaven, en weggingen en hem halfdood lieten liggen.", "Amos 5:15": "Haat het kwade, en heb het goede lief, en zorg voor recht in de poort; misschien zal de HEERE, de God van de heerscharen, aan het overblijfsel van Jozef genadig zijn.", "Deut 10:20": "De HEERE, uw God, zult u vrezen; Hem zult u dienen, en Hem zult u aanhangen, en bij Zijn Naam zweren.", "Matt 16:9-11": "Begrijpt u nog niet, en herinnert u zich niet de vijf broden van de vijfduizend mannen, en hoeveel korven u opnam? Ook niet de zeven broden van de vierduizend mannen, en hoeveel manden u opnam? Hoe komt het dat u niet begrijpt dat Ik u niet over brood gesproken heb, toen Ik zei dat u zich moest wachten voor de zuurdesem van de Farizeeën en Sadduceeën?", "Matt 27:54": "En de hoofdman over honderd, en zij die met hem Jezus bewaakten, zagen de aardbeving en de dingen die gebeurd waren, en werden zeer bevreesd, en zeiden: Waarlijk, Deze was Gods Zoon!", "Ps 74:10": "Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?", "Ps 115:2": "Waarom zouden de heidenen zeggen: Waar is nu hun God?", "1 Joh 2:23": "Ieder, die de Zoon loochent, heeft ook de Vader niet; wie de Zoon belijdt, heeft ook de Vader.", "Luk 13:32": "En Hij zei tegen hen: Ga en zeg tegen die vos: Zie, Ik drijf duivelen uit en maak gezond, vandaag en morgen, en op de derde dag kom Ik tot mijn einde.", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "Job 16:5": "Ik zou u versterken met mijn mond, en de beweging van mijn lippen zou de smart verzachten.", "Ezech 7:4": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben.", "Ezech 18:30-32": "Daarom zal Ik u richten, o huis van Israël, ieder naar zijn wegen, spreekt de Heere HEERE. Keer terug, en bekeer u van al uw overtredingen, zo zal de ongerechtigheid u niet tot een struikelblok worden. Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël? Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Matt 8:1": "Toen Hij van de berg afgeklommen was, volgden vele menigten Hem.", "Luk 10:16": "Wie naar u luistert, luistert naar Mij; en wie u verwerpt, verwerpt Mij; en wie Mij verwerpt, verwerpt Hem die Mij gezonden heeft.", "Joh 5:21": "Want zoals de Vader de doden opwekt en levend maakt, zo maakt ook de Zoon levend wie Hij wil.", "Spr 28:1": "De goddelozen vluchten, terwijl geen vervolger er is; maar elke rechtvaardige is moedig, als een jonge leeuw.", "Ps 56:9-11": "U hebt mijn omzwerven geteld; leg mijn tranen in Uw fles; staan zij niet in Uw register? Dan zullen mijn vijanden achterwaarts keren, ten dage dat ik roepen zal; dit weet ik, dat God met mij is. In God zal ik het woord prijzen; in de HEERE zal ik het woord prijzen.", "Joh 12:34": "De menigte antwoordde Hem: Wij hebben uit de wet gehoord dat de Christus blijft tot in eeuwigheid; en hoe zegt U dat de Zoon des mensen verhoogd moet worden? Wie is deze Zoon des mensen?", "Hebr 13:18": "Bid voor ons; want wij vertrouwen dat wij een goed geweten hebben, omdat wij in alles eerlijk willen wandelen.", "Matt 7:1-29": "Oordeel niet, opdat u niet geoordeeld wordt. Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden. En wat ziet u de splinter die in het oog van uw broeder is, maar merkt u de balk die in uw eigen oog is niet op?", "Joh 16:8": "En als Hij gekomen is, zal Hij de wereld overtuigen van zonde, en van gerechtigheid, en van oordeel:", "Hand 2:22": "Israëlitische mannen, hoor deze woorden: Jezus de Nazarener, een Man die door God aan u bewezen is door krachten, wonderen en tekenen, die God door Hem gedaan heeft in uw midden, zoals u ook zelf weet;", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Hebr 11:6": "Maar zonder geloof is het onmogelijk God te behagen. Want wie tot God komt, moet geloven dat Hij bestaat, en dat Hij Beloner is van hen die Hem zoeken.", "Jes 5:1-6": "Nu zal ik voor mijn Beminde een lied van mijn Liefste zingen, over Zijn wijngaard. Mijn Beminde heeft een wijngaard op een vruchtbare heuvel. En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht. Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.", "Hos 7:11": "Want Efraïm is als een domme duif, zonder verstand; zij roepen Egypte aan, zij gaan heen tot Assur.", "Gen 19:24-28": "Toen liet de HEERE zwavel en vuur over Sodom en Gomorra regenen, van de HEERE uit de hemel. En Hij keerde deze steden om, en die hele vlakte, en alle inwoners van deze steden, ook het gewas van het land. En zijn vrouw keek achter hem om; en zij werd een zoutpilaar.", "Mark 8:11": "En de Farizeeën gingen naar buiten, en begonnen met Hem te twisten, en verlangden van Hem een teken uit de hemel, om Hem op de proef te stellen.", "Jes 40:27": "Waarom zegt u dan, o Jakob! en spreekt, o Israël! mijn weg is voor de HEERE verborgen, en mijn recht gaat aan mijn God voorbij?", "Joh 16:3": "En deze dingen zullen zij u doen, omdat zij de Vader niet gekend hebben, en Mij ook niet.", "Job 21:14": "Toch zeggen zij tegen God: Ga weg van ons, want in de kennis van Uw wegen hebben wij geen behagen.", "Neh 5:13": "Ook schudde ik mijn boezem uit, en zei: Zo schudde God uit iedere man die dit woord niet zal nakomen, uit zijn huis en uit zijn arbeid, en hij worde zo uitgeschud en leeg. En de hele gemeente zei: Amen! En zij prezen de HEERE. En het volk deed volgens dit woord.", "Hos 3:5": "Daarna zullen de kinderen van Israël zich bekeren, en de Heere, hun God, zoeken, en David, hun Koning; en zij zullen vol ontzag komen tot de Heere en tot Zijn goedheid, in de laatste dagen.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Lev 20:14": "En wanneer een man een vrouw en haar moeder neemt, is het een schandelijke daad; men zal hem, en hen, met vuur verbranden, zodat er geen schandelijke daad in uw midden is.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Gen 27:8-11": "Nu dan, mijn zoon! luister naar mijn stem, in hetgeen ik u moet gebieden. Ga nu naar de kudde, en haal voor mij van daar twee goede geitenbokjes; en ik zal die voor uw vader klaarmaken tot smakelijke spijzen, zoals hij graag heeft. En u zult ze naar uw vader brengen, en hij zal eten, opdat hij u zegent voor zijn dood.", "Matt 14:22-33": "En meteen dwong Jezus Zijn discipelen om in het schip te gaan, en voor Hem uit te varen naar de andere kant, terwijl Hij de menigten van Zich zou laten gaan. En toen Hij de menigten van Zich had laten gaan, klom Hij de berg op, alleen, om te bidden. En toen het avond was geworden, was Hij daar alleen. En het schip was al midden op de zee, in nood door de golven; want de wind was hun tegen.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Ps 76:6": "De stouthartigen zijn beroofd; zij hebben hun slaap gesluimerd; en geen van de dappere mannen hebben hun handen gevonden.", "Lev 23:1-3": "Daarna sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tegen hen: De vaste feesttijden van de HEERE, die u uitroepen zult, zullen heilige samenkomsten zijn; deze zijn Mijn vaste feesttijden. Zes dagen zal men het werk doen, maar op de zevende dag is de sabbat van de rust, een heilige samenkomst; geen werk zult u doen; het is de sabbat van de HEERE, in al uw woningen.", "Matt 15:36": "En Hij nam de zeven broden en de vissen, en nadat Hij gedankt had, brak Hij ze, en gaf ze aan Zijn discipelen; en de discipelen gaven ze aan de menigte.", "2 Kon 6:31": "En hij zei: Zo doe God mij, en doe zo daartoe, als het hoofd van Elisa, de zoon van Safat, vandaag op hem zal blijven staan!", "1 Sam 17:26": "Toen zei David tegen de mannen die bij hem stonden: Wat zal men de man doen die deze Filistijn verslaat en de smaad van Israël wegneemt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van de levende God zou honen?", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Hand 11:24": "Want hij was een goed man, en vol van de Heilige Geest en van het geloof; en er werd een grote menigte aan de Heere toegevoegd.", "Est 5:3": "Toen zei de koning tegen haar: Wat is er, koningin Esther? Of wat is uw verzoek? Het zal u gegeven worden, ook tot de helft van het koninkrijk.", "Matt 27:4": "en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien.", "Ps 118:24": "Dit is de dag, die de HEERE gemaakt heeft; laten we ons daarover verheugen, en verblijd zijn.", "Joh 6:60": "Velen van Zijn discipelen dan zeiden, toen zij dit hoorden: Dit is een harde uitspraak; wie kan dat aanhoren?", "Mark 2:15": "En het gebeurde, terwijl Hij in Zijn huis aanzat, dat er ook veel tollenaars en zondaars mee aanzaten met Jezus en Zijn discipelen; want er waren er velen, en zij waren Hem gevolgd.", "Joh 13:35": "Hieraan zullen allen weten dat u Mijn discipelen bent, als u liefde hebt onder elkaar.", "Spr 31:4": "Het komt koningen niet toe, o Lemuël! Het komt koningen niet toe wijn te drinken, en prinsen niet, om sterke drank te begeren;", "Hos 4:9": "Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden.", "Num 16:46-50": "En Mozes zei tegen Aäron: Neem het wierookvat, en doe daar vuur in van het altaar, en leg reukwerk daarop, en ga haastig naar de vergadering, doe verzoening over hen; want er is grote toorn van voor het aangezicht van de HEERE uitgegaan, de plaag is begonnen. En Aäron nam het, zoals Mozes gesproken had, en liep midden in de gemeente, en zie, de plaag was al begonnen onder het volk; en hij legde reukwerk daarin, en deed verzoening over het volk. En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Jes 5:20": "Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!", "Hand 13:44": "En op de volgende sabbat kwam bijna de hele stad samen om het Woord van God te horen.", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "Joh 15:21": "Maar al deze dingen zullen zij u doen om Mijn Naam, omdat zij Hem niet kennen, Die Mij gezonden heeft.", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Ex 22:10": "Wanneer iemand aan zijn naaste een ezel, of os, of klein vee, of enig ander dier geeft om te bewaren, en het sterft, of het raakt gewond, of het wordt weggedreven, zonder dat iemand het ziet,", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "Luk 9:15": "En zij deden zo, en lieten hen allen neerzitten.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Jer 7:7": "dan zal Ik u in deze plaats, in het land dat Ik uw vaderen gegeven heb, laten wonen van eeuw tot eeuw.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "Matt 8:25-27": "En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan! En Hij zei tegen hen: Waarom bent u angstig, kleingelovigen? Toen stond Hij op, en bestrafte de winden en de zee; en er kwam een grote stilte. En de mensen verwonderden zich, en zeiden: Wat voor iemand is dit, dat zelfs de winden en de zee Hem gehoorzaam zijn!", "1 Petr 2:21-24": "Want hiertoe bent u geroepen, omdat ook Christus voor ons geleden heeft, ons een voorbeeld nalatend, opdat u Zijn voetstappen zou navolgen; Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden; Die, toen Hij uitgescholden werd, niet terugschold, en toen Hij leed, niet dreigde; maar het overgaf aan Hem Die rechtvaardig oordeelt;", "Gen 16:7-13": "En de Engel van de HEERE vond haar bij een waterbron in de woestijn, bij de bron op de weg naar Sur. En hij zei: Hagar, dienstmaagd van Sarai, waar komt u vandaan, en waar zult u heengaan? En zij zei: Ik vlucht van het aangezicht van mijn meesteres Sarai! Toen zei de Engel van de HEERE tegen haar: Keer terug naar uw meesteres, en verneder u onder haar handen.", "Mark 11:8-10": "En velen spreidden hun kleren op de weg, en anderen hakten takken van de bomen, en spreidden ze op de weg. En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere! Gezegend zij het Koninkrijk van onze vader David, dat komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Est 1:9": "De koningin Vasthi gaf ook een maaltijd voor de vrouwen in het koninklijk huis van de koning Ahasveros.", "Ezech 14:6": "Daarom, zeg tegen het huis van Israël: Zo zegt de Heere HEERE: Bekeer u, en keer u af van uw drekgoden, en keer uw aangezichten af van al uw gruwelen.", "Luk 24:36-45": "En terwijl zij over deze dingen spraken, stond Jezus Zelf in hun midden, en zei tegen hen: Vrede zij u! En zij schrokken en werden zeer bevreesd, en meenden dat zij een geest zagen. En Hij zei tegen hen: Waarom bent u ontsteld, en waarom komen zulke overleggingen op in uw hart?", "Matt 26:36": "Toen ging Jezus met hen naar een plaats genaamd Gethsémané, en zei tegen de discipelen: Blijft hier zitten, totdat Ik weggegaan ben en daar gebeden heb.", "Spr 21:19": "Het is beter te wonen in een woest land, dan bij een zeer kijfachtige en toornige vrouw.", "Ps 73:2-28": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Joh 11:46-48": "Maar sommigen van hen gingen naar de Farizeeën, en vertelden hun wat Jezus gedaan had. De overpriesters dan en de Farizeeën riepen de raad bijeen, en zeiden: Wat zullen wij doen? want deze Mens doet veel tekenen. Als wij Hem zo laten begaan, zullen zij allen in Hem geloven, en de Romeinen zullen komen en zowel onze plaats als ons volk wegnemen.", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Mark 4:24": "En Hij zei tegen hen: Let op wat u hoort. Met de maat waarmee u meet, zal u gemeten worden, en aan u die hoort, zal meer gegeven worden.", "Luk 19:36-38": "En terwijl Hij verder reisde, spreidden zij hun kleren op de weg. En toen Hij nu in de buurt kwam van de afdaling van de Olijfberg, begon heel de menigte van de discipelen zich te verblijden, en God te loven met luide stem, vanwege alle krachtige daden die zij gezien hadden, en zij zeiden: Gezegend is de Koning, Die komt in de Naam van de Heere! Vrede in de hemel, en heerlijkheid in de hoogste hemelen!", "Hebr 5:12": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.", "Jes 49:4": "Doch Ik zei: Ik heb tevergeefs gearbeid, Ik heb Mijn kracht nutteloos en tevergeefs besteed; zeker, Mijn recht is bij de HEERE, en Mijn loon is bij Mijn God.", "Jes 50:2": "Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst.", "Joh 11:34-38": "en Hij zei: Waar hebt u hem gelegd? Zij zeiden tegen Hem: Heere, kom en zie het. Jezus weende. De Joden dan zeiden: Zie, hoe lief Hij hem had!", "Ps 115:1": "Niet ons, o HEERE, niet ons, maar geef aan Uw Naam eer, om Uw goedertierenheid, om Uw waarheid.", "Jes 41:13": "Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.", "Mark 7:37": "En zij waren bovenmate verbaasd, en zeiden: Hij heeft alles goed gedaan, en Hij maakt dat de doven horen, en de stommen spreken.", "1 Kor 7:1-40": "Wat betreft de dingen waarover u mij geschreven hebt: het is goed voor een mens geen vrouw aan te raken. Maar om de hoererijen te vermijden zal ieder man zijn eigen vrouw hebben, en iedere vrouw zal haar eigen man hebben. De man zal aan de vrouw geven wat hij haar schuldig is aan genegenheid; en net zo ook de vrouw aan de man.", "Mark 4:16": "En dezen zijn evenzo zij die op de rotsachtige plaatsen bezaaid worden; die, wanneer zij het Woord gehoord hebben, het meteen met vreugde ontvangen.", "Amos 4:12": "Daarom zal Ik u zo doen, Israël! Omdat Ik u dan dit doen zal, maak u dan gereed, Israël, om uw God te ontmoeten.", "Ezech 3:8": "Zie, Ik heb uw gezicht stijf gemaakt tegen hun gezichten, en uw voorhoofd stijf tegen hun voorhoofd.", "Deut 14:27": "Maar de Leviet die in uw poorten is, zult u niet verlaten; want hij heeft geen deel noch erfdeel met u.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Mark 9:32": "Maar zij begrepen dat woord niet, en zij waren bang Hem te vragen.", "Jes 53:2": "Want Hij is als een jonge loot voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "Jes 53:1-4": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard? Want Hij is als een jonge loot voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben. Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.", "Hand 2:4": "En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Matt 18:11-13": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Joh 5:28": "Verwonder u hier niet over, want de tijd komt waarin allen die in de graven zijn Zijn stem zullen horen;", "Mark 1:4": "Johannes doopte in de woestijn en predikte de doop van bekering tot vergeving van de zonden.", "Ps 51:15": "Zo zal ik de overtreders Uw wegen leren; en de zondaars zullen zich tot U bekeren.", "1 Tim 5:1-22": "Bestraf een oudere man niet hard, maar vermaan hem als een vader; de jongeren als broeders; De oudere vrouwen als moeders; de jongeren als zusters, in alle reinheid. Eer de weduwen, die echt weduwen zijn.", "Joh 1:21": "En zij vroegen hem: Wat dan? Bent u Elia? En hij zei: Ik ben die niet. Bent u de profeet? En hij antwoordde: Nee.", "Luk 9:51": "En het gebeurde, toen de dagen van Zijn opneming vervuld werden, dat Hij vastbesloten Zijn gezicht richtte om naar Jeruzalem te reizen.", "Luk 22:41-44": "En Hij trok Zich van hen terug, ongeveer een steenworp ver, en knielde neer en bad, en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede. En van Hem werd een engel uit de hemel gezien, die Hem versterkte.", "Ex 4:1": "Toen antwoordde Mozes, en zei: Maar zie, zij zullen mij niet geloven, en niet naar mijn stem luisteren; want zij zullen zeggen: De HEERE is u niet verschenen!", "Hand 19:2": "zei hij tegen hen: Hebt u de Heilige Geest ontvangen, toen u tot geloof kwam? En zij zeiden tegen hem: Wij hebben zelfs niet gehoord of er een Heilige Geest is.", "Jes 66:23": "En het zal gebeuren, dat van de ene nieuwe maan tot de andere, en van de ene sabbat tot de andere, alle vlees zal komen om te aanbidden voor Mijn aangezicht, zegt de HEERE.", "Matt 17:20": "En Jezus zei tegen hen: Vanwege uw ongeloof; want voorwaar, Ik zeg u: als u een geloof had als een mosterdzaad, zou u tegen deze berg zeggen: Ga van hier daarheen, en hij zou gaan; en niets zou voor u onmogelijk zijn.", "Matt 13:56": "En Zijn zusters, zijn die niet allemaal bij ons? Waar komt dan bij Deze dit alles vandaan?", "Joh 6:1-14": "Hierna vertrok Jezus over de zee van Galilea, ook wel de zee van Tiberias genoemd. En een grote menigte volgde Hem, omdat zij Zijn tekenen zagen, die Hij deed aan de zieken. En Jezus ging de berg op, en zat daar neer met Zijn discipelen.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Ps 138:7": "Als ik wandel in het midden van de benauwdheid, maakt Gij mij levend; Uw hand strekt Gij uit tegen de toorn van mijn vijanden, en Uw rechterhand behoudt mij.", "Luk 9:7-9": "En Herodes, de viervorst, hoorde alles wat er door Hem gebeurde; en hij wist niet wat hij ervan moest denken, omdat sommigen zeiden dat Johannes uit de doden was opgestaan, en anderen, dat Elia verschenen was; en weer anderen, dat een van de profeten van vroeger was opgestaan. En Herodes zei: Johannes heb ik onthoofd; wie is Deze dan, van Wie ik zulke dingen hoor? En hij probeerde Hem te zien.", "1 Kor 14:22": "Zo dan, de vreemde talen zijn tot een teken niet voor hun die geloven, maar voor de ongelovigen; en de profetie niet voor de ongelovigen, maar voor hun die geloven.", "Hand 5:29-32": "Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen. De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen. Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Matt 26:63": "Maar Jezus zweeg stil. En de hogepriester antwoordde en zei tegen Hem: Ik bezweer U bij de levende God dat U ons zegt of U de Christus bent, de Zoon van God.", "Luk 11:16": "En anderen, om Hem te verzoeken, verlangden van Hem een teken uit de hemel.", "2 Kor 2:16": "voor de laatsten een geur van dood tot dood, maar voor de eersten een geur van leven tot leven. En wie is hiertoe bekwaam?", "Luk 3:18-20": "Hij vermaande dan ook nog met veel andere dingen, en verkondigde aan het volk het Evangelie. Maar toen Herodes, de viervorst, door hem bestraft werd vanwege Herodias, de vrouw van Filippus, zijn broer, en vanwege alle slechte dingen die Herodes gedaan had, voegde hij daar bovenop ook nog dit aan toe, dat hij Johannes in de gevangenis opsloot.", "Matt 10:9": "Verkrijgt u geen goud, geen zilver, geen koperen geld in uw gordels;", "Luk 6:19": "En de hele menigte probeerde Hem aan te raken; want er ging kracht van Hem uit, en Hij genas hen allen.", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "1 Tess 1:8": "Want vanuit u heeft het Woord van de Heere weerklonken, niet alleen in Macedonië en Achaje; maar ook op elke plaats is uw geloof, dat u op God hebt, bekend geworden, zodat wij het niet nodig hebben daar iets over te zeggen.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Ef 4:27": "En geef de duivel geen plaats.", "Luk 10:17": "En de tweeënzeventig keerden terug met blijdschap, en zeiden: Heere, ook de demonen onderwerpen zich aan ons in Uw Naam.", "Ezech 44:24": "En bij een rechtszaak zullen zij staan om te oordelen; naar Mijn rechten zullen zij hen oordelen; en zij zullen Mijn wetten en Mijn inzettingen op al Mijn vastgestelde hoogtijden houden, en Mijn sabbatten heiligen.", "Ezech 18:4-9": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven. Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert;", "Ps 78:21": "Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Ps 93:4": "Maar de HEERE in de hoogte is machtiger dan het bruisen van veel water, dan de machtige golven van de zee.", "Hand 28:27": "Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Ps 71:18": "Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij niet, o God, totdat ik aan dit geslacht Uw arm verkondig, aan alle nakomelingen Uw macht.", "Luk 7:13": "En de Heere, haar ziende, werd innerlijk met ontferming over haar bewogen, en zei tegen haar: Huil niet.", "Luk 9:10": "En de apostelen keerden terug en vertelden Hem alles wat zij gedaan hadden. En Hij nam hen mee en trok Zich met hen alleen terug naar een eenzame plaats bij de stad die Bethsaïda heet.", "Matt 17:11": "Jezus antwoordde en zei tegen hen: Elia zal inderdaad eerst komen en alles herstellen.", "Deut 9:19": "Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment.", "Jes 50:4": "De Heere HEERE heeft Mij een tong van de geleerden gegeven, opdat Ik weet met de moede een woord op de juiste tijd te spreken; Hij wekt elke morgen, Hij wekt Mijn oor, opdat Ik hoor, zoals wie geleerd worden.", "Deut 29:4": "Maar de HEERE heeft u geen hart gegeven om te verstaan, geen ogen om te zien, en geen oren om te horen, tot op deze dag.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "1 Kon 8:42": "(want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis;", "Hebr 6:18": "opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Hand 12:5": "Petrus dan werd in de gevangenis bewaakt; maar door de gemeente werd voortdurend tot God voor hem gebeden.", "Joh 4:36": "En wie maait, ontvangt loon, en verzamelt vrucht voor het eeuwige leven; opdat zij zich samen verblijden, zowel wie zaait als wie maait.", "1 Kor 14:18": "Ik dank mijn God, dat ik meer vreemde talen spreek dan u allen;", "Matt 19:13": "Toen werden kinderen tot Hem gebracht, opdat Hij de handen op hen zou leggen en bidden; en de discipelen bestraften hen.", "Jer 3:12-14": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden. Erken alleen uw ongerechtigheid, dat u tegen de HEERE, uw God, overtreden hebt, en uw wegen verspreid hebt naar de vreemden, onder elke groene boom, maar u bent Mijn stem niet gehoorzaam geweest, spreekt de HEERE. Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen.", "Gen 2:23": "Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "Joh 8:53": "Bent U meer dan onze vader Abraham, die gestorven is? En de profeten zijn gestorven; wie maakt U Uzelf?", "2 Kon 4:23": "En hij zei: Waarom gaat u vandaag naar hem toe? Het is geen nieuwe maan, en ook geen sabbat. En zij zei: Het zal goed zijn.", "Ps 37:12": "Zain. De goddeloze bedenkt listige plannen tegen de rechtvaardige, en knerst met zijn tanden over hem.", "2 Petr 3:16": "Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.", "Job 9:33": "Er is geen scheidsman tussen ons, die zijn hand op ons beiden leggen mocht.", "2 Petr 2:21": "Want het zou beter voor hen geweest zijn de weg van de gerechtigheid niet gekend te hebben, dan die gekend te hebben en zich weer af te keren van het heilige gebod dat hun overgeleverd was.", "Ezech 36:26": "En Ik zal u een nieuw hart geven, en zal een nieuwe geest geven in het binnenste van u; en Ik zal het stenen hart uit uw vlees wegnemen, en zal u een vlezen hart geven.", "Luk 15:10": "Zo, zeg Ik u, is er blijdschap voor de engelen van God over één zondaar die zich bekeert.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Matt 14:36": "en zij smeekten Hem dat zij alleen de zoom van Zijn kleed zouden mogen aanraken; en zovelen als Hem aanraakten, werden gezond.", "Luk 10:11": "Ook het stof dat uit uw stad aan ons kleeft, schudden wij af tegen u; toch moet u dit weten, dat het Koninkrijk van God dicht
