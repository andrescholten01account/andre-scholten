./../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "En Hij ging van daar weg, en kwam in Zijn vaderland, en Zijn discipelen volgden Hem.", "2": "En toen het sabbat geworden was, begon Hij in de synagoge te onderwijzen; en velen die *Hem* hoorden, waren verbaasd, en zeiden: Waar *komen* Deze deze dingen vandaan, en wat is dit voor wijsheid die Hem gegeven is, dat ook zulke krachten door Zijn handen gebeuren?", "3": "Is Deze niet de timmerman, de zoon van Maria, en de broer van Jakobus en Joses, en van Judas en Simon? En zijn Zijn zusters niet hier bij ons? En zij namen aanstoot aan Hem.", "4": "En Jezus zei tegen hen: Een profeet is niet zonder eer, behalve in zijn eigen vaderland en onder *zijn* verwanten en in zijn huis.", "5": "En Hij kon daar geen kracht doen; behalve dat Hij een paar zieken de handen oplegde en hen genas.", "6": "En Hij verwonderde Zich over hun ongeloof, en trok rond door de dorpen *daar* in de omgeving, terwijl Hij onderwees.", "7": "En Hij riep de twaalf tot Zich, en begon hen twee aan twee uit te zenden, en gaf hun macht over de onreine geesten;", "8": "En Hij gebood hun dat zij niets zouden meenemen voor onderweg, dan alleen een staf: geen reistas, geen brood, geen geld in de gordel;", "9": "maar dat zij sandalen zouden aanbinden, en niet met twee stel kleren gekleed zouden zijn.", "10": "En Hij zei tegen hen: Waar u ook een huis binnengaat, blijf daar totdat u van daar weggaat.", "11": "En als iemand u niet ontvangt, en niet naar u luistert, schud dan, wanneer u vandaar vertrekt, het stof van uw voeten af, hun tot een getuigenis. Voorwaar, Ik zeg u: Het zal voor Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "12": "En zij gingen uit, en predikten dat de mensen zich moesten bekeren.", "13": "En zij dreven veel duivels uit, en zalfden veel zieken met olie, en maakten hen gezond.", "14": "En koning Herodes hoorde dit (want Zijn Naam was bekend geworden), en zei: Johannes, die daar doopte, is opgewekt uit de doden, en daarom werken die krachten in Hem.", "15": "Anderen zeiden: Hij is Elia; en anderen zeiden: Hij is een profeet, of als een van de profeten.", "16": "Maar toen Herodes dit hoorde, zei hij: Dit is Johannes, die ik onthoofd heb; hij is opgewekt uit de doden.", "17": "Want Herodes zelf had *sommigen* uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had.", "18": "Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben.", "19": "En Herodias had het op hem voorzien, en wilde hem doden, maar kon het niet;", "20": "want Herodes was bang voor Johannes, wetend dat hij een rechtvaardig en heilig man was, en hij beschermde hem; en wanneer hij hem hoorde, deed hij veel dingen, en hij luisterde graag naar hem.", "21": "En toen er een gunstige dag gekomen was, toen Herodes op zijn verjaardag een maaltijd gaf voor zijn hoogwaardigheidsbekleders, en de aanvoerders over duizend, en de voornaamsten van Galilea;", "22": "en toen de dochter van deze Herodias binnenkwam en danste, en Herodes en hen die mee aanzaten behaagde, zei de koning tegen het meisje: Vraag mij wat u maar wilt, en ik zal het u geven.", "23": "En hij zwoer haar: Wat u mij ook zult vragen, ik zal het u geven, *zelfs* tot de helft van mijn koninkrijk!", "24": "En zij ging naar buiten en zei tegen haar moeder: Wat zal ik vragen? En die zei: Het hoofd van Johannes de Doper.", "25": "En zij ging meteen haastig naar de koning, en vroeg het, en zei: Ik wil dat u mij nu meteen op een schotel het hoofd van Johannes de Doper geeft.", "26": "En de koning werd zeer bedroefd, maar *toch*, vanwege de eden en degenen die mee aanzaten, wilde hij haar *dat* niet weigeren.", "27": "En de koning zond meteen een beul, en gebood zijn hoofd te brengen. Deze ging heen, en onthoofdde hem in de gevangenis;", "28": "en bracht zijn hoofd op een schotel, en gaf het aan het meisje, en het meisje gaf het aan haar moeder.", "29": "En toen zijn discipelen *dit* hoorden, gingen zij en namen zijn lichaam mee, en legden het in een graf.", "30": "En de apostelen kwamen *weer* bij Jezus, en vertelden Hem alles, zowel wat zij gedaan hadden, als wat zij geleerd hadden.", "31": "En Hij zei tegen hen: Kom zelf mee naar een eenzame plaats, alleen, en rust wat uit; want er waren velen die kwamen en gingen, en zij hadden zelfs geen tijd om te eten.", "32": "En zij vertrokken in een schip, naar een eenzame plaats, alleen.", "33": "En de menigten zagen hen weggaan, en velen herkenden Hem, en liepen gezamenlijk te voet van alle steden daarheen, en kwamen hun voor, en kwamen samen naar Hem toe.", "34": "En Jezus, naar buiten gaand, zag een grote menigte, en werd innerlijk met ontferming bewogen over hen; want zij waren als schapen die geen herder hebben; en Hij begon hun veel dingen te onderwijzen.", "35": "En toen het al laat op de dag geworden was, kwamen Zijn discipelen naar Hem toe, en zeiden: Dit is een eenzame plaats, en het is al laat op de dag;", "36": "Stuur hen weg, opdat zij naar de omliggende dorpen en plaatsen gaan en brood voor zichzelf kunnen kopen; want zij hebben niets om te eten.", "37": "Maar Hij antwoordde en zei tegen hen: Geeft u hun te eten. En zij zeiden tegen Hem: Zullen wij weggaan en voor tweehonderd penningen brood kopen, en hun te eten geven?", "38": "En Hij zei tegen hen: Hoeveel broden hebt u? Ga kijken *ernaar*. En toen zij het te weten waren gekomen, zeiden zij: Vijf, en twee vissen.", "39": "En Hij gebood hun dat zij hen allen in groepen zouden laten neerzitten op het groene gras.", "40": "En zij gingen zitten in groepen, bij honderd samen, en bij vijftig samen.", "41": "En toen Hij de vijf broden en de twee vissen genomen had, keek Hij op naar de hemel, zegende en brak de broden, en gaf ze aan Zijn discipelen om ze hun voor te leggen, en de twee vissen verdeelde Hij onder allen.", "42": "En zij aten allen, en werden verzadigd.", "43": "En zij verzamelden twaalf volle manden met stukken brood, en van de vissen.", "44": "En die van de broden gegeten hadden, waren ongeveer vijfduizend mannen.", "45": "En meteen dwong Hij Zijn discipelen om in het schip te gaan, en vooruit te varen naar de andere kant, tegen*over* Bethsaïda, terwijl Hij de menigte van Zich zou laten gaan.", "46": "En nadat Hij hun afscheid gegeven had, ging Hij de berg op om te bidden.", "47": "En toen het avond geworden was, was het schip midden op de zee, en Hij was alleen op het land.", "48": "En Hij zag dat zij zich zeer inspanden om *het schip* vooruit te krijgen; want de wind was hun tegen; en omstreeks de vierde nachtwake kwam Hij naar hen toe, lopend op de zee, en Hij wilde hen voorbijgaan.", "49": "Maar toen zij Hem op de zee zagen lopen, dachten zij dat het een spook was, en schreeuwden luid;", "50": "want zij zagen Hem allen, en werden verschrikt; en meteen sprak Hij met hen, en zei tegen hen: Heb goede moed, Ik ben het; vrees niet.", "51": "En Hij klom bij hen in het schip, en de wind ging liggen; en zij waren bovenmate zeer verbaasd in zichzelf, en verwonderd.", "52": "Want zij hadden *het wonder* van de broden niet begrepen; want hun hart was verhard.", "53": "En toen zij overgevaren waren, kwamen zij in het land Gennesareth, en meerden daar aan.", "54": "En toen zij uit het schip gegaan waren, herkenden de mensen Hem meteen.", "55": "*En* zij liepen het hele omliggende land door, en begonnen op draagbedden hen die ziek waren rond te dragen, naar de plaats waar zij hoorden dat Hij was.", "56": "En waar Hij ook kwam, in dorpen, of steden, of gehuchten, daar legden zij de zieken op de markten, en smeekten Hem dat zij slechts de zoom van Zijn kleed mochten aanraken; en zovelen als Hem aanraakten, werden gezond."}, "SV": {"1": "En Hij ging van daar weg, en kwam in Zijn vaderland, en Zijn discipelen volgden Hem.", "2": "En als het sabbat geworden was, begon Hij in de synagoge te leren; en velen, die *Hem* hoorden, ontzetten zich, zeggende: Van waar *komen* Dezen deze dingen, en wat wijsheid is dit, die Hem gegeven is, dat ook zulke krachten door Zijn handen geschieden?", "3": "Is deze niet de timmerman, de zoon van Maria, en de broeder van Jakobus en Joses, en van Judas en Simon, en zijn Zijn zusters niet hier bij ons? En zij werden aan Hem geërgerd.", "4": "En Jezus zeide tot hen: Een profeet is niet ongeëerd dan in zijn vaderland en onder *zijn* magen, en in zijn huis.", "5": "En Hij kon aldaar geen kracht doen; dan Hij legde weinigen zieken de handen op, en genas hen.", "6": "En Hij verwonderde Zich over hun ongeloof, en omging de vlekken *daar* rondom, lerende.", "7": "En Hij riep tot Zich de twaalven, en begon hen uit te zenden twee en twee, en gaf hun macht over de onreine geesten.", "8": "En Hij gebood hun, dat zij niets zouden nemen tot den weg, dan alleenlijk een staf, geen male, geen brood, geen geld in den gordel;", "9": "Maar dat zij schoenzolen zouden aanbinden, en met geen twee rokken gekleed zijn .", "10": "En Hij zeide tot hen: Zo waar gij in een huis zult ingaan, blijft daar, totdat gij van daar uitgaat.", "11": "En zo wie u niet zullen ontvangen, noch u horen, vertrekkende van daar, schudt het stof af, dat onder aan uw voeten is, hun tot een getuigenis. Voorwaar zeg Ik u: Het zal Sodom en Gomorra verdragelijker zijn in den dag des oordeels dan dezelve stad.", "12": "En uitgegaan zijnde, predikten zij, dat zij zich zouden bekeren.", "13": "En zij wierpen vele duivelen uit, en zalfden vele kranken met olie, en maakten hen gezond.", "14": "En de koning Herodes hoorde het ( want Zijn Naam was openbaar geworden), en zeide: Johannes, die daar doopte, is van de doden opgewekt, en daarom werken die krachten in Hem.", "15": "Anderen zeiden: Hij is Elias; en anderen zeiden: Hij is een profeet, of als een der profeten.", "16": "Maar als het Herodes hoorde, zeide hij: Deze is Johannes, dien ik onthoofd heb; die is van de doden opgewekt.", "17": "Want dezelve Herodes, *enigen* uitgezonden hebbende, had Johannes gevangen genomen, en hem in de gevangenis gebonden, uit oorzaak van Herodias, de huisvrouw van zijn broeder Filippus, omdat hij haar getrouwd had.", "18": "Want Johannes zeide tot Herodes: Het is u niet geoorloofd de huisvrouw uws broeders te hebben.", "19": "En Herodias legde op hem toe; en wilde hem doden, en konde niet;", "20": "Want Herodes vreesde Johannes, wetende, dat hij een rechtvaardig en heilig man was, en hield hem in waarde; en als hij hem hoorde, deed hij vele dingen, en hoorde hem gaarne.", "21": "En als er een welgelegen dag gekomen was, toen Herodes, op den dag zijner geboorte, een maaltijd aanrichtte, voor zijn groten, en de oversten over duizend, en de voornaamsten van Galilea;", "22": "En als de dochter van dezelve Herodias inkwam, en danste, en Herodes en dengenen, die mede aanzaten, behaagde, zo zeide de koning tot het dochtertje: Eis van mij, wat gij ook wilt, en ik zal het u geven.", "23": "En hij zwoer haar: Zo wat gij van mij zult eisen, zal ik u geven, *ook* tot de helft mijns koninkrijks!", "24": "En zij, uitgegaan zijnde, zeide tot haar moeder: Wat zal ik eisen? En die zeide: Het hoofd van Johannes den Doper.", "25": "En zij, terstond met haast ingaande tot den koning, heeft het geëist, zeggende: Ik wil, dat gij mij nu terstond, in een schotel, geeft het hoofd van Johannes den Doper.", "26": "En de koning, zeer bedroefd geworden zijnde, *nochtans* om de eden, en degenen, die mede aanzaten, wilde hij haar *hetzelve* niet afslaan.", "27": "En de koning zond terstond een scherprechter, en gebood zijn hoofd te brengen. Deze nu ging heen, en onthoofdde hem in de gevangenis;", "28": "En bracht zijn hoofd in een schotel, en gaf hetzelve het dochtertje, en het dochtertje gaf hetzelve harer moeder.", "29": "En als zijn discipelen *dit* hoorden, gingen zij en namen zijn dood lichaam weg, en legden dat in een graf.", "30": "En de apostelen kwamen *weder* tot Jezus, en boodschapten Hem alles, beide wat zij gedaan hadden, en wat zij geleerd hadden.", "31": "En Hij zeide tot hen: Komt gijlieden in een woeste plaats hier alleen, en rust een weinig; want er waren velen, die kwamen en die gingen, en zij hadden zelfs geen gelegen tijd om te eten.", "32": "En zij vertrokken in een schip, naar een woeste plaats, alleen.", "33": "En de scharen zagen hen heenvaren, en velen werden Hem kennende, en liepen gezamenlijk te voet van alle steden derwaarts, en kwamen hun voor, en gingen samen tot Hem.", "34": "En Jezus, uitgaande, zag een grote schare, en werd innerlijk met ontferming bewogen over hen; want zij waren als schapen, die geen herder hebben; en Hij begon hun vele dingen te leren.", "35": "En als het nu laat op den dag geworden was, kwamen Zijn discipelen tot Hem, en zeiden: Deze plaats is woest, en het is nu laat op den dag;", "36": "Laat ze van U, opdat zij heengaan in de omliggende dorpen en vlekken, en broden voor zichzelven mogen kopen; want zij hebben niet, wat zij eten zullen.", "37": "Maar Hij, antwoordende, zeide tot hen: Geeft gij hun te eten. En zij zeiden tot Hem: Zullen wij heengaan, en kopen voor tweehonderd penningen brood, en hun te eten geven?", "38": "En Hij zeide tot hen: Hoeveel broden hebt gij? Gaat heen en beziet *het*. En toen zij het vernomen hadden, zeiden zij: Vijf, en twee vissen.", "39": "En Hij gebood hun, dat zij hen allen zouden doen nederzitten bij waardschappen, op het groene gras.", "40": "En zij zaten neder in gedeelten bij honderd te zamen, en bij vijftig te zamen.", "41": "En als Hij de vijf broden en de twee vissen genomen had, zag Hij op naar den hemel, zegende en brak de broden, en gaf ze Zijn discipelen, opdat zij ze hun zouden voorleggen, en de twee vissen deelde Hij voor allen.", "42": "En zij aten allen, en zijn verzadigd geworden.", "43": "En zij namen op twaalf volle korven brokken, en van de vissen.", "44": "En die daar de broden gegeten hadden, waren omtrent vijf duizend mannen.", "45": "En terstond dwong Hij Zijn discipelen in het schip te gaan, en voor henen te varen aan de andere zijde tegen *over* Bethsaida, terwijl Hij de schare van Zich zou laten.", "46": "En als Hij aan dezelve hun afscheid gegeven had, ging Hij op den berg om te bidden.", "47": "En als het nu avond was geworden, zo was het schip in het midden van de zee, en Hij was alleen op het land.", "48": "En Hij zag, dat zij zich zeer pijnigden, om *het* *schip* voort te krijgen; want de wind was hun tegen; en omtrent de vierde wake des nachts, kwam Hij tot hen, wandelende op de zee, en wilde hen voorbijgaan.", "49": "En zij, ziende Hem wandelen op de zee, meenden, dat het een spooksel was, en schreeuwden zeer;", "50": "Want zij zagen Hem allen, en werden ontroerd; en terstond sprak Hij met hen, en zeide tot hen: Zijt welgemoed, Ik ben het; vreest niet.", "51": "En Hij klom tot hen in het schip, en de wind stilde; en zij ontzetten zich bovenmate zeer in zichzelven, en waren verwonderd.", "52": "Want zij hadden niet gelet op *het* *wonder* der broden; want hun hart was verhard.", "53": "En als zij overgevaren waren, kwamen zij in het land Gennesareth, en havenden aldaar.", "54": "En als zij uit het schip gegaan waren, terstond werden zij Hem kennende.", "55": "*En* het gehele omliggende land doorlopende, begonnen zij op beddekens degenen, die kwalijk gesteld waren, om te dragen, ter plaatse, waar zij hoorden, dat Hij was.", "56": "En zo waar Hij kwam, in vlekken, of steden, of dorpen, daar leiden zij de kranken op de markten, en baden Hem, dat zij maar den zoom Zijns kleeds aanraken mochten; en zovelen, als er Hem aanraakten, werden gezond."}, "KJV": {"1": "And he went out from thence, and came into his own country; and his disciples follow him.", "2": "And when the sabbath day was come, he began to teach in the synagogue: and many hearing *him* were astonished, saying, From whence hath this *man* these things? and what wisdom *is* this which is given unto him, that even such mighty works are wrought by his hands?", "3": "Is not this the carpenter, the son of Mary, the brother of James, and Joses, and of Juda, and Simon? and are not his sisters here with us? And they were offended at him.", "4": "But Jesus said unto them, A prophet is not without honour, but in his own country, and among his own kin, and in his own house.", "5": "And he could there do no mighty work, save that he laid his hands upon a few sick folk, and healed", "6": "And he marvelled because of their unbelief. And he went round about the villages, teaching.", "7": "And he called *unto him* the twelve, and began to send them forth by two and two; and gave them power over unclean spirits;", "8": "And commanded them that they should take nothing for *their* journey, save a staff only; no scrip, no bread, no money in *their* purse:", "9": "But *be* shod with sandals; and not put on two coats.", "10": "And he said unto them, In what place soever ye enter into an house, there abide till ye depart from that place.", "11": "And whosoever shall not receive you, nor hear you, when ye depart thence, shake off the dust under your feet for a testimony against them. Verily I say unto you, It shall be more tolerable for Sodom and Gomorrha in the day of judgment, than for that city.", "12": "And they went out, and preached that men should repent.", "13": "And they cast out many devils, and anointed with oil many that were sick, and healed", "14": "And king Herod heard *of him*; (for his name was spread abroad:) and he said, That John the Baptist was risen from the dead, and therefore mighty works do shew forth themselves in him.", "15": "Others said, That it is Elias. And others said, That it is a prophet, or as one of the prophets.", "16": "But when Herod heard *thereof*, he said, It is John, whom I beheaded: he is risen from the dead.", "17": "For Herod himself had sent forth and laid hold upon John, and bound him in prison for Herodias' sake, his brother Philip's wife: for he had married her.", "18": "For John had said unto Herod, It is not lawful for thee to have thy brother's wife.", "19": "Therefore Herodias had a quarrel against him, and would have killed him; but she could not:", "20": "For Herod feared John, knowing that he was a just man and an holy, and observed him; and when he heard him, he did many things, and heard him gladly.", "21": "And when a convenient day was come, that Herod on his birthday made a supper to his lords, high captains, and chief *estates* of Galilee;", "22": "And when the daughter of the said Herodias came in, and danced, and pleased Herod and them that sat with him, the king said unto the damsel, Ask of me whatsoever thou wilt, and I will give *it* thee.", "23": "And he sware unto her, Whatsoever thou shalt ask of me, I will give *it* thee, unto the half of my kingdom.", "24": "And she went forth, and said unto her mother, What shall I ask? And she said, The head of John the Baptist.", "25": "And she came in straightway with haste unto the king, and asked, saying, I will that thou give me by and by in a charger the head of John the Baptist.", "26": "And the king was exceeding sorry; *yet* for his oath's sake, and for their sakes which sat with him, he would not reject her.", "27": "And immediately the king sent an executioner, and commanded his head to be brought: and he went and beheaded him in the prison,", "28": "And brought his head in a charger, and gave it to the damsel: and the damsel gave it to her mother.", "29": "And when his disciples heard *of it*, they came and took up his corpse, and laid it in a tomb.", "30": "And the apostles gathered themselves together unto Jesus, and told him all things, both what they had done, and what they had taught.", "31": "And he said unto them, Come ye yourselves apart into a desert place, and rest a while: for there were many coming and going, and they had no leisure so much as to eat.", "32": "And they departed into a desert place by ship privately.", "33": "And the people saw them departing, and many knew him, and ran afoot thither out of all cities, and outwent them, and came together unto him.", "34": "And Jesus, when he came out, saw much people, and was moved with compassion toward them, because they were as sheep not having a shepherd: and he began to teach them many things.", "35": "And when the day was now far spent, his disciples came unto him, and said, This is a desert place, and now the time *is* far passed:", "36": "Send them away, that they may go into the country round about, and into the villages, and buy themselves bread: for they have nothing to eat.", "37": "He answered and said unto them, Give ye them to eat. And they say unto him, Shall we go and buy two hundred pennyworth of bread, and give them to eat?", "38": "He saith unto them, How many loaves have ye? go and see. And when they knew, they say, Five, and two fishes.", "39": "And he commanded them to make all sit down by companies upon the green grass.", "40": "And they sat down in ranks, by hundreds, and by fifties.", "41": "And when he had taken the five loaves and the two fishes, he looked up to heaven, and blessed, and brake the loaves, and gave *them* to his disciples to set before them; and the two fishes divided he among them all.", "42": "And they did all eat, and were filled.", "43": "And they took up twelve baskets full of the fragments, and of the fishes.", "44": "And they that did eat of the loaves were about five thousand men.", "45": "And straightway he constrained his disciples to get into the ship, and to go to the other side before unto Bethsaida, while he sent away the people.", "46": "And when he had sent them away, he departed into a mountain to pray.", "47": "And when even was come, the ship was in the midst of the sea, and he alone on the land.", "48": "And he saw them toiling in rowing; for the wind was contrary unto them: and about the fourth watch of the night he cometh unto them, walking upon the sea, and would have passed by them.", "49": "But when they saw him walking upon the sea, they supposed it had been a spirit, and cried out:", "50": "For they all saw him, and were troubled. And immediately he talked with them, and saith unto them, Be of good cheer: it is I; be not afraid.", "51": "And he went up unto them into the ship; and the wind ceased: and they were sore amazed in themselves beyond measure, and wondered.", "52": "For they considered not *the miracle* of the loaves: for their heart was hardened.", "53": "And when they had passed over, they came into the land of Gennesaret, and drew to the shore.", "54": "And when they were come out of the ship, straightway they knew him,", "55": "And ran through that whole region round about, and began to carry about in beds those that were sick, where they heard he was.", "56": "And whithersoever he entered, into villages, or cities, or country, they laid the sick in the streets, and besought him that they might touch if it were but the border of his garment: and as many as touched him were made whole."}}, "tsk": {"1": [{"kopje": "en kwam", "refs": ["Matt 13:54", "Luk 4:16-30"]}], "2": [{"kopje": "begon Hij", "refs": ["Mark 1:21", "Mark 1:22", "Mark 1:39", "Luk 4:15", "Luk 4:31", "Luk 4:32"]}, {"kopje": "komen", "refs": ["Joh 6:42", "Joh 7:15", "Hand 4:13", "Hand 4:14"]}], "3": [{"kopje": "Deze", "refs": ["Matt 13:55", "Matt 13:56", "Luk 4:22", "Joh 6:42"]}, {"kopje": "timmerman", "refs": ["Jes 49:7", "Jes 53:2", "Jes 53:3", "1 Petr 2:4"]}, {"kopje": "Jakobus", "refs": ["Mark 15:40", "Matt 12:46", "1 Kor 9:4", "Gal 1:19"]}, {"kopje": "Judas", "refs": ["Joh 14:22", "Judas 1:1"]}, {"kopje": "Simon", "refs": ["Mark 3:18", "Hand 1:13"]}, {"kopje": "namen aanstoot", "refs": ["Matt 11:6", "Matt 13:57", "Luk 2:34", "Luk 4:23-29", "Luk 7:23", "Joh 6:60", "Joh 6:61", "1 Kor 1:23"]}], "6": [{"kopje": "verwonderde Zich", "refs": ["Jes 59:16", "Jer 2:11", "Matt 8:10", "Joh 9:30"]}, {"kopje": "En trok rond", "refs": ["Matt 4:23", "Matt 9:35", "Luk 4:31", "Luk 4:44", "Luk 13:22", "Hand 10:38"]}], "7": [{"kopje": "de twaalf", "refs": ["Mark 3:13", "Mark 3:14", "Matt 10:1-4", "Luk 6:13-16", "Luk 9:1-6", "Luk 10:3-12"]}, {"kopje": "twee aan twee", "refs": ["Ex 4:14", "Ex 4:15", "Pred 4:9", "Pred 4:10", "Openb 11:3"]}, {"kopje": "macht", "refs": ["Mark 16:17", "Luk 10:17-20"]}], "8": [{"kopje": "meenemen", "refs": ["Matt 10:9", "Matt 10:10", "Luk 10:4", "Luk 22:35"]}, {"kopje": "geld", "refs": ["Matt 10:9", "Luk 9:3"]}], "9": [{"kopje": "sandalen zouden aanbinden", "refs": ["Ef 6:15"]}, {"kopje": "sandalen", "refs": ["Hand laid in the streets to receive advice from passers by", "href": "../../torrey/d/?hl=Mark.6.56#i4969", "refs": [{"disp": "Mark 6:56", "href": "../../markus/6/#v56", "ref": "Mark 6:56", "svLabel": null}, {"disp": "Hand 5:15", "href": "../../handelingen/5/#v15", "ref": "Hand 5:15", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Jer 50:5": "Zij zullen naar Sion vragen; op de weg hierheen zullen hun gezichten gericht zijn; zij zullen komen en zich bij de HEERE aansluiten, met een eeuwig verbond, dat niet zal worden vergeten.", "Joh 14:16": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid;", "Jer 5:5": "Ik zal naar de groten gaan, en met hen spreken, want die kennen de weg van de HEERE, het recht van hun God; maar zij hadden samen het juk verbroken, en de banden verscheurd.", "Ps 119:126": "Het is tijd voor de HEERE, dat Hij werkt, want zij hebben Uw wet verbroken.", "Joh 6:70": "Jezus antwoordde hun: Heb Ik u niet twaalf uitgekozen? En één van u is een duivel.", "Joh 6:36": "Maar Ik heb u gezegd dat u Mij ook gezien hebt, en toch gelooft u niet.", "2 Kor 4:16": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag.", "1 Kor 9:1-23": "Ben ik niet een apostel? Ben ik niet vrij? Heb ik niet Jezus Christus, onze Heere, gezien? Bent u niet mijn werk in de Heere? Als ik voor anderen geen apostel ben, ben ik het toch voor u; want het zegel van het apostelschap ben ik voor u in de Heere. Mijn verantwoording aan hen die onderzoek naar mij doen, is deze.", "Hand 20:18-21": "En toen zij bij hem gekomen waren, zei hij tegen hen: U weet, van de eerste dag af dat ik in Azië ben aangekomen, hoe ik de hele tijd bij u geweest ben; Terwijl ik de Heere diende met alle nederigheid, en veel tranen, en beproevingen, die mij overkwamen door de aanslagen van de Joden; Hoe ik niets heb achtergehouden van wat nuttig was, zodat ik het u niet zou verkondigd en u geleerd hebben, in het openbaar en in de huizen;", "1 Kron 9:32": "En uit de kinderen van de Kahathieten, uit hun broeders, waren enigen over de broden van de bereiding, om die elke sabbat te bereiden.", "Hand 12:2-4": "Hij doodde Jakobus, de broer van Johannes, met het zwaard. En toen hij zag dat dit de Joden aangenaam was, ging hij verder om ook Petrus te vangen (het waren de dagen van het ongezuurde brood); hem greep hij ook en zette hem in de gevangenis, en gaf hem over aan vier wachten, elk van vier soldaten, om hem te bewaken, want hij was van plan hem na het paasfeest voor het volk te brengen.", "Joh 6:4-10": "En het pascha, het feest van de Joden, was nabij. Toen Jezus dan Zijn ogen opsloeg en zag dat een grote menigte naar Hem toe kwam, zei Hij tegen Filippus: Waar zullen wij broden kopen, zodat dezen kunnen eten? (Maar dit zei Hij om hem te beproeven; want Hij wist Zelf wat Hij doen zou.)", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Ps 14:4": "Hebben dan alle werkers van de ongerechtigheid geen kennis, die mijn volk opeten alsof zij brood aten? Zij roepen de HEERE niet aan.", "Hos 14:2": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid.", "Ex 11:3": "En de HEERE gaf het volk genade in de ogen van de Egyptenaren; ook was de man Mozes zeer groot in Egypteland voor de ogen van Farao's knechten, en voor de ogen van het volk.)", "Matt 12:41": "De mannen van Ninevé zullen opstaan in het oordeel met dit geslacht, en zullen het veroordelen; want zij hebben zich bekeerd op de prediking van Jona; en zie, meer dan Jona is hier!", "Mark 6:45-56": "En meteen dwong Hij Zijn discipelen om in het schip te gaan, en vooruit te varen naar de andere kant, tegenover Bethsaïda, terwijl Hij de menigte van Zich zou laten gaan. En nadat Hij hun afscheid gegeven had, ging Hij de berg op om te bidden. En toen het avond geworden was, was het schip midden op de zee, en Hij was alleen op het land.", "Hand 2:43": "En er kwam vrees over ieder mens; en er gebeurden veel wonderen en tekenen door de apostelen.", "Matt 15:32": "En Jezus riep Zijn discipelen tot Zich en zei: Ik ben innerlijk met ontferming bewogen over de menigte, omdat zij nu al drie dagen bij Mij gebleven zijn, en niets hebben om te eten; en Ik wil hen niet nuchter van Mij laten gaan, zodat zij op de weg niet bezwijken.", "Luk 9:1": "Jezus riep Zijn twaalf discipelen samen en gaf hun kracht en macht over alle duivelen, en om ziekten te genezen.", "Job 31:19-22": "Als ik iemand heb zien omkomen, omdat hij zonder kleding was, en dat de nooddruftige geen deksel had; Als zijn lenden mij niet gezegend hebben, toen hij van de vellen van mijn lammeren verwarmd werd; Als ik mijn hand tegen de wees bewogen heb, omdat ik in de poort mijn hulp zag;", "Ex 16:5": "En het zal gebeuren op de zesde dag, dat zij klaarmaken wat zij ingebracht zullen hebben; dat zal dubbel zijn boven wat zij dagelijks verzamelen.", "Luk 7:31-35": "En de Heere zei: Waarmee zal Ik dan de mensen van dit geslacht vergelijken, en waaraan zijn zij gelijk? Zij zijn gelijk aan de kinderen die op de markt zitten en elkaar toeroepen en zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben klaagliederen voor u gezongen, en u hebt niet gehuild. Want Johannes de Doper is gekomen, en at geen brood en dronk geen wijn; en u zegt: Hij heeft een duivel.", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "Ps 106:7": "Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn de veelheid van Uw goedertierenheid niet gedachtig geweest; maar zij waren opstandig aan de zee, bij de Schelfzee.", "Jer 29:7": "En zoekt de vrede van de stad waarheen Ik u gevankelijk heb laten wegvoeren, en bidt voor haar tot de HEERE; want in haar vrede zult u vrede hebben.", "Hos 2:18": "En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.", "Ex 22:16": "Wanneer iemand een maagd verleidt die nog niet ondertrouwd is, en hij slaapt met haar, dan moet hij zonder uitstel een bruidsprijs voor haar betalen, zodat zij zijn vrouw wordt.", "Jak 5:8": "Wees ook u geduldig, versterk uw harten; want de komst van de Heere is nabij.", "Joh 15:22": "Als Ik niet gekomen was, en tot hen gesproken had, hadden zij geen zonde; maar nu hebben zij geen voorwendsel voor hun zonde.", "Luk 9:19": "En zij antwoordden en zeiden: Johannes de Doper; en anderen: Elia; en weer anderen: dat een van de profeten van vroeger is opgestaan.", "Joh 13:34": "Een nieuw gebod geef Ik u, dat u elkaar liefhebt; zoals Ik u liefgehad heb, dat u ook elkaar liefhebt.", "Hand 20:27": "Want ik heb niet nagelaten u heel de raad van God te verkondigen.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "1 Tim 4:3-5": "die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen. Want alles wat God geschapen heeft, is goed, en niets is verwerpelijk als het met dankzegging aangenomen wordt; want het wordt geheiligd door het Woord van God en door het gebed.", "Hand 8:2": "En godvruchtige mannen droegen Stefanus samen naar het graf en bedreven grote rouw over hem.", "Jes 62:6": "O Jeruzalem! Ik heb wachters op uw muren aangesteld, die voortdurend, de hele dag en de hele nacht, niet zullen zwijgen. U die de HEERE doet gedenken, laat geen stilzwijgen bij u zijn!", "Luk 18:10-14": "Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar. Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Joh 8:33": "Zij antwoordden Hem: Wij zijn Abrahams nageslacht, en hebben nog nooit iemand gediend; hoe kunt U dan zeggen: U zult vrij worden?", "Mark 2:27": "En Hij zei tegen hen: De sabbat is gemaakt om de mens, niet de mens om de sabbat.", "Ex 23:12": "Zes dagen zult u uw werk doen; maar op de zevende dag zult u rusten; opdat uw os en uw ezel rusten, en de zoon van uw dienstmaagd en de vreemdeling op adem komen.", "Mark 3:27": "Niemand kan het huis van een sterke man binnengaan en zijn bezittingen roven, als hij niet eerst de sterke man vastbindt; en dan pas zal hij zijn huis beroven.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Hand 17:2": "En Paulus ging, zoals hij gewoon was, bij hen naar binnen, en drie sabbatten lang sprak hij met hen uit de Schriften,", "Hand 1:13": "En toen zij binnengekomen waren, gingen zij naar boven, naar de bovenzaal, waar zij bleven, namelijk Petrus en Jakobus, en Johannes en Andreas, Filippus en Thomas, Bartholomeüs en Mattheüs, Jakobus, de zoon van Alfeüs, en Simon Zelotes, en Judas, de broer van Jakobus.", "Ps 119:158": "Ik heb gezien degenen, die trouweloos handelen, en het verdroot mij, dat zij Uw woord niet onderhielden.", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Gen 42:19": "Als u eerlijke mensen bent, laat dan één van uw broers gebonden blijven in het huis waar u gevangen zit; en gaat u heen, breng het koren voor de honger van uw huizen.", "Mal 3:7": "Vanaf de dag van uw vaderen af zijn jullie afgeweken van Mijn inzettingen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?", "Luk 13:1-5": "En er waren in diezelfde tijd enigen aanwezig, die Hem vertelden van de Galileeërs, van wie Pilatus het bloed met hun offers gemengd had. En Jezus antwoordde en zei tegen hen: Denkt u dat deze Galileeërs meer zondaars zijn geweest dan alle andere Galileeërs, omdat zij zulke dingen hebben geleden? Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Joh 12:21": "Dezen gingen dan naar Filippus, die van Bethsaïda in Galilea was, en vroegen hem: Heer, wij zouden Jezus graag zien.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "Ps 119:18": "Ontdek mijn ogen, dat ik aanschouw de wonderen van Uw wet.", "Matt 10:5-42": "Deze twaalf heeft Jezus uitgezonden, en Hij gaf hun bevel en zei: U moet niet heengaan op de weg van de heidenen, en u moet niet ingaan in enige stad van de Samaritanen. Maar ga veel meer heen naar de verloren schapen van het huis van Israël. En terwijl u heengaat, predikt en zeg: Het Koninkrijk der hemelen is nabijgekomen.", "Luk 10:34": "En hij ging naar hem toe, verbond zijn wonden en goot er olie en wijn op; en hij zette hem op zijn eigen rijdier, bracht hem naar de herberg en verzorgde hem.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "Matt 9:20": "(En zie, een vrouw die twaalf jaar bloedvloeiingen had gehad, kwam van achteren bij Hem en raakte de zoom van Zijn kleed aan;", "Spr 28:4": "Wie de wet verlaten, prijzen de goddelozen; maar wie de wet bewaren, gaan de strijd met hen aan.", "Matt 18:8-10": "Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden. Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Jes 59:16": "Omdat Hij zag dat er niemand was, ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Zijn arm Hem heil, en Zijn gerechtigheid ondersteunde Hem.", "Mark 3:15": "en om macht te hebben de ziekten te genezen, en de duivels uit te werpen.", "Luk 9:14": "Want er waren ongeveer vijfduizend mannen. Maar Hij zei tegen Zijn discipelen: Laat hen neerzitten in groepen van vijftig.", "Neh 10:31": "Ook als de volken van het land waren en alle koren op de sabbatdag ten verkoop zouden brengen, dat wij op de sabbat, of op een andere heilige dag, niets van hen zouden nemen; en dat wij het zevende jaar zouden vrij laten, alsook allerlei bezwaarnis.", "Mark 6:21-29": "En toen er een gunstige dag gekomen was, toen Herodes op zijn verjaardag een maaltijd gaf voor zijn hoogwaardigheidsbekleders, en de aanvoerders over duizend, en de voornaamsten van Galilea; en toen de dochter van deze Herodias binnenkwam en danste, en Herodes en hen die mee aanzaten behaagde, zei de koning tegen het meisje: Vraag mij wat u maar wilt, en ik zal het u geven. En hij zwoer haar: Wat u mij ook zult vragen, ik zal het u geven, zelfs tot de helft van mijn koninkrijk!", "Gen 2:24": "Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.", "Gen 26:17": "Toen ging Izak daarvandaan, en hij legerde zich in het dal van Gerar, en woonde daar.", "1 Petr 1:14": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had;", "Mark 8:3": "En als Ik hen nuchter naar hun huis laat gaan, zullen zij onderweg bezwijken; want sommigen van hen komen van ver.", "2 Kor 2:15": "Want wij zijn voor God een goede geur van Christus, onder hen die behouden worden, en onder hen die verloren gaan;", "Hos 2:13": "Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken.", "Num 28:10": "Het is het brandoffer van de sabbat op elke sabbat, boven het voortdurende brandoffer, en zijn drankoffer.", "Hand 6:10": "En zij konden niet opgewassen zijn tegen de wijsheid en de Geest, door Wie hij sprak.", "Luk 10:1-11": "En hierna wees de Heere nog tweeënzeventig anderen aan, en zond hen twee aan twee voor Zich uit, naar elke stad en plaats waar Hij komen zou. Hij zei dan tegen hen: De oogst is wel groot, maar de arbeiders zijn weinige; bid daarom de Heere van de oogst, dat Hij arbeiders in Zijn oogst uitstuurt. Ga heen; zie, Ik zend u als lammeren te midden van de wolven.", "Ps 69:34": "Want de HEERE hoort de behoeftigen, en Hij veracht Zijn gevangenen niet.", "Jes 1:3": "Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "Mal 2:13-16": "Dit tweede doet u ook: dat u het altaar van de HEERE bedekt met tranen, met wenen en met zuchten, zodat Hij niet meer naar het spijsoffer wil omzien, en het ook niet met welgevallen uit uw hand wil ontvangen. U zegt nu: Waarom? Omdat de HEERE een Getuige geweest is tussen u en de vrouw van uw jeugd, met wie u trouweloos handelt; terwijl zij toch uw metgezellin is, en de vrouw van uw verbond. Heeft Hij niet maar één gemaakt, hoewel Hij van de Geest overvloed had? En waarom die ene? Hij zocht een zaad van God. Daarom, wees op uw hoede met uw geest, en laat niemand trouweloos handelen tegen de vrouw van zijn jeugd.", "Mark 6:3-6": "Is Deze niet de timmerman, de zoon van Maria, en de broer van Jakobus en Joses, en van Judas en Simon? En zijn Zijn zusters niet hier bij ons? En zij namen aanstoot aan Hem. En Jezus zei tegen hen: Een profeet is niet zonder eer, behalve in zijn eigen vaderland en onder zijn verwanten en in zijn huis. En Hij kon daar geen kracht doen; behalve dat Hij een paar zieken de handen oplegde en hen genas.", "Ezech 7:3": "Nu is het einde over u; want Ik zal Mijn toorn tegen u zenden, en Ik zal u richten naar uw wegen, en Ik zal op u brengen al uw gruwelen.", "2 Kor 11:7-9": "Heb ik zonde gedaan, toen ik mijzelf vernederd heb opdat u verhoogd zou worden, omdat ik u het Evangelie van God om niet verkondigd heb? Ik heb andere gemeenten beroofd, doordat ik bezoldiging van hen nam om u te dienen; en toen ik bij u aanwezig was en gebrek had, ben ik niemand lastig gevallen. Want mijn gebrek hebben de broeders vervuld die van Macedonië kwamen; en ik heb mijzelf in alles gehouden zonder u te bezwaren, en ik zal mij nog zo houden.", "Ps 138:3": "Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.", "Micha 4:12": "Maar zij kennen de gedachten van de HEERE niet, en begrijpen Zijn raadsbesluit niet; dat Hij hen bijeengebracht heeft als schoven op de dorsvloer.", "Lev 20:21": "En wanneer een man de vrouw van zijn broer neemt, is het onreinheid; hij heeft de schaamte van zijn broer ontdekt; zij zullen zonder kinderen zijn.", "Matt 24:20": "Bid dat uw vlucht niet gebeurt in de winter, en ook niet op een sabbat.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "Joh 3:4": "Nicodemus zei tegen Hem: Hoe kan een mens geboren worden als hij al oud is? Kan hij soms voor de tweede keer in de buik van zijn moeder ingaan en geboren worden?", "Gen 26:33": "En hij noemde hem Seba; daarom is de naam van die stad Berseba, tot op deze dag.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Lev 21:1": "Daarna zei de HEERE tegen Mozes: Spreek tot de priesters, de zonen van Aäron, en zeg tegen hen: Over een dode zal een priester zich niet verontreinigen onder zijn volken.", "Matt 5:34-37": "Maar Ik zeg u: zweer helemaal niet, noch bij de hemel, omdat hij de troon van God is; noch bij de aarde, omdat zij de voetbank van Zijn voeten is; noch bij Jeruzalem, omdat zij de stad van de grote Koning is; noch zult u bij uw hoofd zweren, omdat u niet één haar wit of zwart kunt maken;", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "2 Tess 2:11": "En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven;", "Joh 15:17": "Dit gebied Ik u, zodat u elkaar liefhebt.", "Luk 10:1-16": "En hierna wees de Heere nog tweeënzeventig anderen aan, en zond hen twee aan twee voor Zich uit, naar elke stad en plaats waar Hij komen zou. Hij zei dan tegen hen: De oogst is wel groot, maar de arbeiders zijn weinige; bid daarom de Heere van de oogst, dat Hij arbeiders in Zijn oogst uitstuurt. Ga heen; zie, Ik zend u als lammeren te midden van de wolven.", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Matt 20:25-28": "En Jezus riep hen bij Zich, en zei: U weet dat de leiders van de volken heerschappij voeren over hen, en de groten macht uitoefenen over hen. Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn; en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "Ezech 20:13": "Maar het huis van Israël werd opstandig tegen Mij in de woestijn; zij wandelden niet in Mijn inzettingen, en verwierpen Mijn rechten, die, als een mens ze doet, hij daardoor zal leven; en zij ontheiligden Mijn sabbatten zeer, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten in de woestijn, om hen te verdelgen.", "Rom 1:21": "Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden;", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "Joh 1:45": "Filippus nu was van Bethsaida, uit de stad van Andreas en Petrus.", "Spr 7:7-23": "En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling; Die voorbijging op de straat, naast haar hoek, en hij trad op de weg naar haar huis. In de schemering, in de avond van de dag, in de zwarte nacht en de donkerheid;", "Job 33:26-28": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven. Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat; Maar God heeft mijn ziel verlost, dat zij niet voert in het verderf, zodat mijn leven het licht aanziet.", "Mark 6:30-44": "En de apostelen kwamen weer bij Jezus, en vertelden Hem alles, zowel wat zij gedaan hadden, als wat zij geleerd hadden. En Hij zei tegen hen: Kom zelf mee naar een eenzame plaats, alleen, en rust wat uit; want er waren velen die kwamen en gingen, en zij hadden zelfs geen tijd om te eten. En zij vertrokken in een schip, naar een eenzame plaats, alleen.", "Ezech 33:32": "En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.", "Deut 6:13": "U zult de HEERE, uw God, vrezen, en Hem dienen; en u zult bij Zijn Naam zweren.", "Joh 6:18-21": "En de zee werd onstuimig, doordat er een harde wind waaide. Toen zij dan ongeveer vijfentwintig of dertig stadiën gevaren hadden, zagen zij Jezus lopen op de zee en dicht bij het schip komen; en zij werden bang. Maar Hij zei tegen hen: Ik ben het; wees niet bang.", "Matt 14:3": "Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer.", "Luk 8:37": "En de hele menigte uit het omliggende land van de Gadarenen vroeg Hem van hen weg te gaan, want zij waren door grote vrees bevangen. En Hij ging in het schip en keerde terug.", "Matt 27:56": "Onder hen waren Maria Magdalena, en Maria, de moeder van Jakobus en Joses, en de moeder van de zonen van Zebedeüs.", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "Joh 12:18-21": "Daarom ging ook de menigte Hem tegemoet, omdat zij gehoord had dat Hij dat teken gedaan had. De Farizeeën zeiden dan tegen elkaar: Ziet u wel dat u niets bereikt? Zie, de hele wereld loopt Hem na. En er waren enkele Grieken onder hen die opgegaan waren om op het feest te aanbidden;", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Joh 5:47": "Maar als u zijn geschriften niet gelooft, hoe zult u Mijn woorden geloven?", "Joh 5:35": "Hij was een brandende en lichtende lamp; en u hebt u een korte tijd in zijn licht willen verheugen.", "Joh 17:1": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt.", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Hand 8:4": "Zij dan nu, die verstrooid waren, trokken het land door en verkondigden het Woord.", "Dan 5:17": "Toen antwoordde Daniël, en zei voor de koning: Houd uw gaven voor uzelf, en geef uw beloningen aan een ander; ik zal toch het schrift voor de koning lezen, en de uitleg zal ik hem bekendmaken.", "Ps 62:3": "Zeker, Hij is mijn Rots en mijn Heil, mijn Hoog Vertrek, ik zal niet erg wankelen.", "Jer 17:10": "Ik, de HEERE, doorgrond het hart, en proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.", "Hebr 12:1-4": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is; Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God. Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "Mark 10:13": "En zij brachten kinderen bij Hem, opdat Hij ze zou aanraken; maar de discipelen berispten hen die ze bij Hem brachten.", "Hebr 4:1-3": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Mark 7:32": "En zij brachten iemand bij Hem die doof was en zwaar sprak, en zij smeekten Hem dat Hij hem de hand zou opleggen.", "Fil 2:26": "Omdat hij zeer begerig was naar u allen, en zeer beangst was, omdat u had gehoord dat hij ziek was geweest.", "Ezech 16:48-51": "Zo waar Ik leef, spreekt de Heere HEERE, Sodom, uw zuster, heeft niet gedaan, zij en haar dochters niet, zoals u gedaan hebt, u en uw dochters! Zie, dit was de ongerechtigheid van uw zuster Sodom: hoogmoed, verzadiging van brood, en zorgeloze rust had zij en haar dochters; maar zij versterkte de hand van de arme en de behoeftige niet. En zij verhieven zich, en deden gruwelijkheid voor Mijn aangezicht; daarom deed Ik ze weg, nadat Ik het gezien had.", "Hand 27:35": "En toen hij dit gezegd had en brood genomen had, dankte hij God in aanwezigheid van allen; en nadat hij het gebroken had, begon hij te eten.", "Hand 23:13": "En het waren er meer dan veertig die deze eed samen hadden afgelegd.", "Ps 119:53": "Grote beroering heeft mij bevangen vanwege de goddelozen, die Uw wet verlaten.", "Num 11:29": "Maar Mozes zei tegen hem: Bent u ijverzuchtig voor mij? Och, was al het volk van de HEERE maar profeten, zodat de HEERE Zijn Geest over hen zou geven!", "Rom 3:15": "hun voeten zijn snel om bloed te vergieten;", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Openb 1:8": "Ik ben de Alfa en de Omega, het Begin en het Einde, zegt de Heere, Die is, en Die was, en Die komen zal, de Almachtige.", "Luk 6:46-49": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg? Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt. Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "Mark 6:16-29": "Maar toen Herodes dit hoorde, zei hij: Dit is Johannes, die ik onthoofd heb; hij is opgewekt uit de doden. Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had. Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben.", "Rom 15:2": "Laat dan ieder van ons zijn naaste behagen ten goede, tot opbouw.", "Jes 63:1": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen.", "Joh 2:19": "Jezus antwoordde en zei tegen hen: Breek deze tempel af, en in drie dagen zal Ik hem oprichten.", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "Matt 13:13-16": "Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken. Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Hos 5:4": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet.", "Luk 11:1": "En het gebeurde, toen Hij op een zekere plaats was en bad, dat, toen Hij ophield, een van Zijn discipelen tegen Hem zei: Heere, leer ons bidden, zoals ook Johannes zijn discipelen geleerd heeft.", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "Matt 6:6-8": "Maar u, wanneer u bidt, ga in uw binnenkamer, en sluit uw deur, en bid tot uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden. En als u bidt, gebruik dan geen zinloze herhaling van woorden, zoals de heidenen; want zij menen dat zij vanwege hun veelheid van woorden verhoord zullen worden. Word hun dan niet gelijk; want uw Vader weet wat u nodig hebt, voordat u het Hem vraagt.", "Amos 5:6": "Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Joh 9:30": "De man antwoordde en zei tegen hen: Hierin zit toch iets wonderlijks, dat u niet weet vanwaar Hij is, en Hij heeft toch mijn ogen geopend.", "Spr 12:14": "Ieder wordt van de vrucht van de mond met goed verzadigd; en de vergelding van de handen van de mens zal Hij hem terugbrengen.", "Mark 4:39": "En Hij, wakker geworden, bestrafte de wind, en zei tegen de zee: Zwijg, wees stil! En de wind ging liggen, en er kwam grote stilte.", "Matt 28:5": "Maar de engel antwoordde en zei tegen de vrouwen: Wees u niet bang; want ik weet dat u Jezus zoekt, Die gekruisigd was.", "Joh 12:12": "De volgende dag, toen een grote menigte, die naar het feest gekomen was, hoorde dat Jezus naar Jeruzalem kwam,", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Luk 8:12": "Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden.", "Joh 10:41": "En velen kwamen naar Hem toe, en zeiden: Johannes deed wel geen teken; maar alles wat Johannes over Deze gezegd heeft, was waar.", "Mark 1:35": "En vroeg in de morgen, toen het nog diep in de nacht was, stond Hij op, ging naar buiten, en ging naar een eenzame plaats, en bad daar.", "Joh 4:11": "De vrouw zei tegen Hem: Heere, U hebt niets om mee te putten, en de put is diep; waar hebt U dan het levende water vandaan?", "Ps 106:13": "Maar zij vergaten al snel Zijn werken, zij wachtten niet op Zijn raad.", "Amos 4:11": "Ik heb sommigen onder u omgekeerd, zoals God Sodom en Gomorra omkeerde, u, die was als een stuk brandhout, dat uit de brand gered is; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Lev 26:40-42": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "2 Kor 12:12": "De merktekenen van een apostel zijn onder u getoond in alle volharding, met tekenen, en wonderen, en krachten.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Joh 19:5": "Jezus kwam dan naar buiten, met de doornenkroon en het purperen kleed. En Pilatus zei tegen hen: Zie, de Mens!", "Jer 29:6": "Neemt vrouwen, en verwekt zonen en dochters, en neemt vrouwen voor uw zonen, en geeft uw dochters aan mannen, zodat zij zonen en dochters baren; en wordt daar talrijker, en wordt niet minder.", "Joh 21:12": "Jezus zei tegen hen: Kom hier, houd de maaltijd. En niemand van de discipelen durfde Hem te vragen: Wie bent U? want zij wisten dat het de Heere was.", "Luk 3:20": "voegde hij daar bovenop ook nog dit aan toe, dat hij Johannes in de gevangenis opsloot.", "1 Tess 3:1": "Daarom hebben wij, omdat we het verlangen niet langer konden verdragen, het goed gevonden om alleen in Athene achtergelaten te worden;", "Spr 17:16": "Waarom toch zou de dwaas geld in zijn hand hebben, om wijsheid te kopen, terwijl hij geen verstand heeft?", "Jer 9:3": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "Num 14:11-21": "En de HEERE zei tegen Mozes: Hoelang zal dit volk Mij tergen? En hoelang zullen zij niet aan Mij geloven, ondanks alle tekenen die Ik onder hen gedaan heb? Ik zal het met pest treffen, en Ik zal het onterven; en Ik zal u tot een groter en sterker volk maken dan dit is. En Mozes zei tegen de HEERE: Dan zullen de Egyptenaren het horen; want U hebt door Uw kracht dit volk uit hun midden doen optrekken;", "Matt 14:7": "Daarom beloofde hij haar met een eed te geven wat zij ook zou vragen.", "Fil 4:3": "En ik bid ook u, mijn oprechte metgezel, wees deze vrouwen behulpzaam, die met mij gestreden hebben in het Evangelie, ook met Clemens, en de andere medearbeiders van mij, van wie de namen in het boek van het leven staan.", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Lev 18:16": "U zult de schaamte van de vrouw van uw broer niet ontdekken; het is de schaamte van uw broer.", "Matt 13:2": "En er verzamelde zich een grote menigte bij Hem, zodat Hij in een schip ging en neerzat, en heel de menigte stond op de oever.", "Mark 9:42-50": "En wie een van deze kleinen die in Mij geloven, doet struikelen, het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd, en dat hij in de zee geworpen werd. En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur; Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.", "Joh 15:4": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Zef 3:18": "De bedroefden, om de bijeenkomst, zal Ik verzamelen, zij zijn uit u; de smaad is een last op haar.", "Jes 41:17": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten.", "Spr 19:3": "De dwaasheid van de mens verdraait zijn weg; en zijn hart is boos op de HEERE.", "Mark 8:21": "En Hij zei tegen hen: Hoe kan het dat u het niet begrijpt?", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Joh 10:26": "Maar u gelooft niet; want u bent niet van Mijn schapen, zoals Ik u gezegd heb.", "Ex 14:24": "En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "Hand 4:12": "En de zaligheid is in geen Ander; want er is ook onder de hemel geen andere Naam, die onder de mensen gegeven is, waardoor wij moeten zalig worden.", "Matt 7:29": "Want Hij onderwees hen als iemand die macht heeft, en niet als de schriftgeleerden.", "Jes 59:9-14": "Daarom is het recht ver van ons, en de gerechtigheid bereikt ons niet; wij wachten op het licht, maar zie, er is duisternis, op een grote glans, maar wij wandelen in het donker. Wij tasten naar de wand, zoals de blinden, en zoals wie geen ogen hebben, tasten wij; wij struikelen op de middag als in de schemering, wij zijn op woeste plaatsen als de doden. Wij brommen allen als de beren, en wij kirren voortdurend als de duiven; wij wachten op recht, maar er is geen, op heil, maar het is ver van ons.", "Matt 13:13-15": "Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken. Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Hand 2:38": "En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.", "Luk 12:38": "En als hij komt in de tweede nachtwake, of komt in de derde nachtwake, en hen zo aantreft, zalig zijn die dienstknechten.", "Matt 14:22-36": "En meteen dwong Jezus Zijn discipelen om in het schip te gaan, en voor Hem uit te varen naar de andere kant, terwijl Hij de menigten van Zich zou laten gaan. En toen Hij de menigten van Zich had laten gaan, klom Hij de berg op, alleen, om te bidden. En toen het avond was geworden, was Hij daar alleen. En het schip was al midden op de zee, in nood door de golven; want de wind was hun tegen.", "Jer 4:22": "Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "Matt 11:2": "En Johannes, die in de gevangenis gehoord had van de werken van Christus, zond twee van zijn discipelen;", "Matt 14:3-10": "Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer. Want Johannes zei tegen hem: Het is u niet geoorloofd haar te hebben. En hoewel hij hem wilde doden, vreesde hij het volk, omdat zij hem hielden voor een profeet.", "Hos 4:15": "Als u, Israël! wilt hoereren, laat Juda dan zeker niet schuldig worden; kom toch niet naar Gilgal, en ga niet op naar Beth-Aven, en zweer niet: Zo waarachtig als de Heere leeft.", "Matt 18:28": "Maar deze dienstknecht ging naar buiten en vond een van zijn mededienstknechten, die hem honderd penningen schuldig was; hij greep hem vast en greep hem bij de keel, en zei: Betaal mij wat u schuldig bent.", "Matt 11:21": "Wee u, Chorazin! Wee u, Bethsaïda! Want als in Tyrus en Sidon de krachten gebeurd waren die in u gebeurd zijn, zouden zij zich lang geleden in zak en as bekeerd hebben.", "Joz 18:7": "Want de Levieten hebben geen deel in uw midden; maar het priesterschap van de HEERE is hun erfdeel. Gad nu, en Ruben, en de halve stam van Manasse, hebben hun erfdeel genomen aan de overkant van de Jordaan, oostwaarts, dat Mozes, de knecht van de HEERE, hun gegeven heeft.", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "Matt 14:13-21": "Toen Jezus dit hoorde, vertrok Hij vandaar met een boot naar een eenzame plaats, alleen; en de menigten, die dat hoorden, zijn Hem te voet gevolgd, vanuit de steden. En toen Jezus naar buiten ging, zag Hij een grote menigte, en werd innerlijk met ontferming over hen bewogen, en genas hun zieken. Toen het nu avond werd, kwamen Zijn discipelen naar Hem toe, en zeiden: Deze plaats is eenzaam, en de tijd is nu voorbijgegaan; stuur de menigten weg, zodat zij naar de dorpen gaan en voor zichzelf voedsel kopen.", "Ps 10:5": "Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.", "Joh 7:24": "Oordeel niet naar het aanzien, maar oordeel een rechtvaardig oordeel.", "Luk 14:24": "Want ik zeg u, dat niemand van die mannen die genodigd waren, mijn avondmaal zal proeven.", "Matt 14:25": "Maar in de vierde nachtwake kwam Jezus naar hen toe, lopend op de zee.", "Matt 6:31-34": "Wees daarom niet bezorgd en zeg niet: Wat zullen wij eten, of wat zullen wij drinken, of waarmee zullen wij ons kleden? Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt. Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Matt 8:27": "En de mensen verwonderden zich, en zeiden: Wat voor iemand is dit, dat zelfs de winden en de zee Hem gehoorzaam zijn!", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Mark 6:16-28": "Maar toen Herodes dit hoorde, zei hij: Dit is Johannes, die ik onthoofd heb; hij is opgewekt uit de doden. Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had. Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben.", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "1 Kor 1:21": "Want omdat de wereld God, in de wijsheid van God, niet door de wijsheid heeft gekend, heeft het God behaagd om door de dwaasheid van de prediking zalig te maken hen die geloven;", "Jes 50:1-11": "Zo zegt de HEERE: Waar is de scheidbrief van uw moeder, waarmee Ik haar weggezonden heb? Of wie is er van Mijn schuldeisers, aan wie Ik u verkocht heb? Zie, om uw ongerechtigheden bent u verkocht, en om uw overtredingen is uw moeder weggezonden. Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst. Ik bekleed de hemel met zwartheid, en maak een zak tot zijn bedekking.", "Matt 20:34": "En Jezus, innerlijk bewogen met barmhartigheid, raakte hun ogen aan; en meteen konden hun ogen weer zien, en zij volgden Hem.", "Mark 12:1-12": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "Dan 4:18": "Deze droom heb ik, koning Nebukadnezar, gezien; u nu, Beltsazar, zeg mij de uitleg ervan, omdat al de wijzen van mijn koninkrijk mij de uitleg niet hebben kunnen bekendmaken; maar u kunt het wel, omdat de geest van de heilige goden in u is.", "Ps 34:20": "Resch. Veel is de tegenspoed van de rechtvaardige; maar uit dat alles redt de HEERE hem.", "Joh 9:16": "Sommigen van de Farizeeën zeiden dan: Deze Mens is niet van God, want Hij houdt de sabbat niet. Anderen zeiden: Hoe kan een mens die een zondaar is, zulke tekenen doen? En er was verdeeldheid onder hen.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "2 Kron 26:15": "Hij maakte ook te Jeruzalem kunstige werktuigen, bedacht door kunstige werkmeesters, om op de torens en op de hoeken te staan, om met pijlen en met grote stenen te schieten; zo ging zijn naam tot ver weg uit, want hij werd wonderlijk geholpen, totdat hij sterk was.", "Hand 4:2": "Zeer ontevreden, omdat zij het volk leerden en in Jezus de opstanding uit de doden verkondigden.", "Est 1:3-7": "in het derde jaar van zijn regering, dat hij een maaltijd gaf voor al zijn vorsten en zijn knechten; de machthebbers van Perzië en Medië, de grootste heren en de leiders van de landschappen waren voor hem aanwezig. Hij liet daarbij de rijkdom van de heerlijkheid van zijn koninkrijk zien, en de kostbaarheid van het sieraad van zijn grootheid, vele dagen lang: honderdtachtig dagen. Toen die dagen voorbij waren, gaf de koning een maaltijd voor heel het volk dat zich op de burcht Susan bevond, van de grootste tot de kleinste, zeven dagen lang, in het voorhof van de tuin van het koninklijk paleis.", "Jes 59:18": "Naar de werken, daarnaar zal Hij vergelden: grimmigheid aan Zijn tegenstanders, vergelding aan Zijn vijanden; aan de eilanden zal Hij het loon vergelden.", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Jes 53:1-3": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard? Want Hij is als een jonge loot voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben. Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.", "Jer 31:14": "En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "Mark 4:1": "En Hij begon opnieuw te onderwijzen bij de zee; en er kwam een grote menigte bij Hem samen, zodat Hij in het schip ging en op de zee ging zitten; en heel de menigte was op het land aan de zee.", "1 Tim 4:5": "want het wordt geheiligd door het Woord van God en door het gebed.", "Ezech 2:5-7": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is. En u, mensenkind! Wees niet bevreesd voor hen, en wees niet bevreesd voor hun woorden, hoewel er wederwillige mensen en doornen bij u zijn, en u bij schorpioenen woont; wees voor hun woorden niet bevreesd, en schrik niet voor hun gezicht, want zij zijn een opstandig huis. Maar u zult Mijn woorden tot hen spreken, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen; want zij zijn opstandig.", "Ps 37:14": "Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn.", "Mark 10:5": "En Jezus antwoordde en zei tegen hen: Vanwege de hardheid van uw hart heeft hij u dit gebod geschreven.", "Mark 1:22": "En zij stonden versteld van Zijn onderwijs; want Hij onderwees hen als iemand die gezag heeft, en niet als de Schriftgeleerden.", "Joh 5:45": "Denk niet dat Ik u zal aanklagen bij de Vader; hij die u aanklaagt, is Mozes, op wie u gehoopt hebt.", "Ezech 20:12": "Daarbij gaf Ik hun ook Mijn sabbatten, om een teken te zijn tussen Mij en hen, opdat zij zouden weten dat Ik de HEERE ben, Die hen heiligt.", "1 Kor 16:10": "Als Timotheüs nu komt, ziet erop dat hij zonder vrees bij u is; want hij doet het werk van de Heere, zoals ik ook.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Matt 12:1-8": "In die tijd ging Jezus, op een sabbatdag, door het gezaaide land, en Zijn discipelen kregen honger, en begonnen aren te plukken en te eten. En de Farizeeën zagen dat en zeiden tegen Hem: Kijk, Uw discipelen doen wat niet geoorloofd is te doen op de sabbat. Maar Hij zei tegen hen: Hebt u niet gelezen wat David deed, toen hij honger had, en zij die bij hem waren?", "Joh 14:1": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij.", "Luk 18:43": "En meteen kon hij weer zien, en hij volgde Hem, terwijl hij God verheerlijkte. En al het volk dat dit zag, gaf God lof.", "Joh 6:64": "Maar er zijn sommigen onder u die niet geloven. Want Jezus wist vanaf het begin wie het waren die niet geloofden, en wie het was die Hem zou verraden.", "Hebr 5:11": "Over hem hebben wij veel te zeggen, en het is moeilijk uit te leggen, omdat u traag geworden bent om te horen.", "Matt 25:34-36": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "Matt 9:8": "Toen de menigten dit zagen, verwonderden zij zich en verheerlijkten God, Die zo'n macht aan de mensen gegeven had.", "Jona 1:13": "Maar de mannen roeiden om het schip weer aan het droge te brengen, maar zij konden het niet; want de zee werd steeds onstuimiger tegen hen.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "1 Kor 15:34": "Word op de juiste manier wakker, en zondig niet. Want sommigen hebben geen kennis van God. Ik zeg dit tot uw schaamte.", "Openb 11:3": "En Ik zal Mijn twee getuigen macht geven, en zij zullen profeteren duizend tweehonderd zestig dagen, met zakken bekleed.", "1 Tess 2:5": "Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige!", "Luk 9:3": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Ps 51:3-6": "Wees mij genadig, o God! naar Uw goedertierenheid; delg mijn overtreding uit, naar de grootheid van Uw barmhartigheden. Was mij goed van mijn ongerechtigheid, en reinig mij van mijn zonde. Want ik ken mijn overtredingen, en mijn zonde staat mij steeds voor ogen.", "Hand 10:42": "En Hij heeft ons geboden aan het volk te prediken, en te betuigen dat Hij Degene is Die door God aangesteld is tot een Rechter van levenden en doden.", "1 Tim 4:1": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,", "Gal 6:2": "Draag elkaars lasten, en vervul zo de wet van Christus.", "2 Kron 18:16": "En hij zei: Ik zag heel Israël verstrooid op de bergen, als schapen die geen herder hebben; en de HEERE zei: Dezen hebben geen heer; ieder kee
