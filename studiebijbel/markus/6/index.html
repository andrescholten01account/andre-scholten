<style>

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }

  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }

  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }

  footer.site { margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; font-family: "Lora"; font-size: .72rem; color: #999; line-height: 1.7; }
  @media (max-width: 640px) { .omslag { padding: .6rem .7rem 3rem; } header.site h1 { font-size: 1.5rem; } }
</style>

el","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En Hij ging van daar weg, en kwam in Zijn vaderland, en Zijn discipelen volgden Hem.","2":"En toen het sabbat geworden was, begon Hij in de synagoge te onderwijzen; en velen die *Hem* hoorden, waren verbaasd, en zeiden: Waar *komen* Deze deze dingen vandaan, en wat is dit voor wijsheid die Hem gegeven is, dat ook zulke krachten door Zijn handen gebeuren?","3":"Is Deze niet de timmerman, de zoon van Maria, en de broer van Jakobus en Joses, en van Judas en Simon? En zijn Zijn zusters niet hier bij ons? En zij namen aanstoot aan Hem.","4":"En Jezus zei tegen hen: Een profeet is niet zonder eer, behalve in zijn eigen vaderland en onder *zijn* verwanten en in zijn huis.","5":"En Hij kon daar geen kracht doen; behalve dat Hij een paar zieken de handen oplegde en hen genas.","6":"En Hij verwonderde Zich over hun ongeloof, en trok rond door de dorpen *daar* in de omgeving, terwijl Hij onderwees.","7":"En Hij riep de twaalf tot Zich, en begon hen twee aan twee uit te zenden, en gaf hun macht over de onreine geesten;","8":"En Hij gebood hun dat zij niets zouden meenemen voor onderweg, dan alleen een staf: geen reistas, geen brood, geen geld in de gordel;","9":"maar dat zij sandalen zouden aanbinden, en niet met twee stel kleren gekleed zouden zijn.","10":"En Hij zei tegen hen: Waar u ook een huis binnengaat, blijf daar totdat u van daar weggaat.","11":"En als iemand u niet ontvangt, en niet naar u luistert, schud dan, wanneer u vandaar vertrekt, het stof van uw voeten af, hun tot een getuigenis. Voorwaar, Ik zeg u: Het zal voor Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.","12":"En zij gingen uit, en predikten dat de mensen zich moesten bekeren.","13":"En zij dreven veel duivels uit, en zalfden veel zieken met olie, en maakten hen gezond.","14":"En koning Herodes hoorde dit (want Zijn Naam was bekend geworden), en zei: Johannes, die daar doopte, is opgewekt uit de doden, en daarom werken die krachten in Hem.","15":"Anderen zeiden: Hij is Elia; en anderen zeiden: Hij is een profeet, of als een van de profeten.","16":"Maar toen Herodes dit hoorde, zei hij: Dit is Johannes, die ik onthoofd heb; hij is opgewekt uit de doden.","17":"Want Herodes zelf had *sommigen* uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had.","18":"Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben.","19":"En Herodias had het op hem voorzien, en wilde hem doden, maar kon het niet;","20":"want Herodes was bang voor Johannes, wetend dat hij een rechtvaardig en heilig man was, en hij beschermde hem; en wanneer hij hem hoorde, deed hij veel dingen, en hij luisterde graag naar hem.","21":"En toen er een gunstige dag gekomen was, toen Herodes op zijn verjaardag een maaltijd gaf voor zijn hoogwaardigheidsbekleders, en de aanvoerders over duizend, en de voornaamsten van Galilea;","22":"en toen de dochter van deze Herodias binnenkwam en danste, en Herodes en hen die mee aanzaten behaagde, zei de koning tegen het meisje: Vraag mij wat u maar wilt, en ik zal het u geven.","23":"En hij zwoer haar: Wat u mij ook zult vragen, ik zal het u geven, *zelfs* tot de helft van mijn koninkrijk!","24":"En zij ging naar buiten en zei tegen haar moeder: Wat zal ik vragen? En die zei: Het hoofd van Johannes de Doper.","25":"En zij ging meteen haastig naar de koning, en vroeg het, en zei: Ik wil dat u mij nu meteen op een schotel het hoofd van Johannes de Doper geeft.","26":"En de koning werd zeer bedroefd, maar *toch*, vanwege de eden en degenen die mee aanzaten, wilde hij haar *dat* niet weigeren.","27":"En de koning zond meteen een beul, en gebood zijn hoofd te brengen. Deze ging heen, en onthoofdde hem in de gevangenis;","28":"en bracht zijn hoofd op een schotel, en gaf het aan het meisje, en het meisje gaf het aan haar moeder.","29":"En toen zijn discipelen *dit* hoorden, gingen zij en namen zijn lichaam mee, en legden het in een graf.","30":"En de apostelen kwamen *weer* bij Jezus, en vertelden Hem alles, zowel wat zij gedaan hadden, als wat zij geleerd hadden.","31":"En Hij zei tegen hen: Kom zelf mee naar een eenzame plaats, alleen, en rust wat uit; want er waren velen die kwamen en gingen, en zij hadden zelfs geen tijd om te eten.","32":"En zij vertrokken in een schip, naar een eenzame plaats, alleen.","33":"En de menigten zagen hen weggaan, en velen herkenden Hem, en liepen gezamenlijk te voet van alle steden daarheen, en kwamen hun voor, en kwamen samen naar Hem toe.","34":"En Jezus, naar buiten gaand, zag een grote menigte, en werd innerlijk met ontferming bewogen over hen; want zij waren als schapen die geen herder hebben; en Hij begon hun veel dingen te onderwijzen.","35":"En toen het al laat op de dag geworden was, kwamen Zijn discipelen naar Hem toe, en zeiden: Dit is een eenzame plaats, en het is al laat op de dag;","36":"Stuur hen weg, opdat zij naar de omliggende dorpen en plaatsen gaan en brood voor zichzelf kunnen kopen; want zij hebben niets om te eten.","37":"Maar Hij antwoordde en zei tegen hen: Geeft u hun te eten. En zij zeiden tegen Hem: Zullen wij weggaan en voor tweehonderd penningen brood kopen, en hun te eten geven?","38":"En Hij zei tegen hen: Hoeveel broden hebt u? Ga kijken *ernaar*. En toen zij het te weten waren gekomen, zeiden zij: Vijf, en twee vissen.","39":"En Hij gebood hun dat zij hen allen in groepen zouden laten neerzitten op het groene gras.","40":"En zij gingen zitten in groepen, bij honderd samen, en bij vijftig samen.","41":"En toen Hij de vijf broden en de twee vissen genomen had, keek Hij op naar de hemel, zegende en brak de broden, en gaf ze aan Zijn discipelen om ze hun voor te leggen, en de twee vissen verdeelde Hij onder allen.","42":"En zij aten allen, en werden verzadigd.","43":"En zij verzamelden twaalf volle manden met stukken brood, en van de vissen.","44":"En die van de broden gegeten hadden, waren ongeveer vijfduizend mannen.","45":"En meteen dwong Hij Zijn discipelen om in het schip te gaan, en vooruit te varen naar de andere kant, tegen*over* Bethsaïda, terwijl Hij de menigte van Zich zou laten gaan.","46":"En nadat Hij hun afscheid gegeven had, ging Hij de berg op om te bidden.","47":"En toen het avond geworden was, was het schip midden op de zee, en Hij was alleen op het land.","48":"En Hij zag dat zij zich zeer inspanden om *het schip* vooruit te krijgen; want de wind was hun tegen; en omstreeks de vierde nachtwake kwam Hij naar hen toe, lopend op de zee, en Hij wilde hen voorbijgaan.","49":"Maar toen zij Hem op de zee zagen lopen, dachten zij dat het een spook was, en schreeuwden luid;","50":"want zij zagen Hem allen, en werden verschrikt; en meteen sprak Hij met hen, en zei tegen hen: Heb goede moed, Ik ben het; vrees niet.","51":"En Hij klom bij hen in het schip, en de wind ging liggen; en zij waren bovenmate zeer verbaasd in zichzelf, en verwonderd.","52":"Want zij hadden *het wonder* van de broden niet begrepen; want hun hart was verhard.","53":"En toen zij overgevaren waren, kwamen zij in het land Gennesareth, en meerden daar aan.","54":"En toen zij uit het schip gegaan waren, herkenden de mensen Hem meteen.","55":"*En* zij liepen het hele omliggende land door, en begonnen op draagbedden hen die ziek waren rond te dragen, naar de plaats waar zij hoorden dat Hij was.","56":"En waar Hij ook kwam, in dorpen, of steden, of gehuchten, daar legden zij de zieken op de markten, en smeekten Hem dat zij slechts de zoom van Zijn kleed mochten aanraken; en zovelen als Hem aanraakten, werden gezond."},"SV":{"1":"En Hij ging van daar weg, en kwam in Zijn vaderland, en Zijn discipelen volgden Hem.","2":"En als het sabbat geworden was, begon Hij in de synagoge te leren; en velen, die *Hem* hoorden, ontzetten zich, zeggende: Van waar *komen* Dezen deze dingen, en wat wijsheid is dit, die Hem gegeven is, dat ook zulke krachten door Zijn handen geschieden?","3":"Is deze niet de timmerman, de zoon van Maria, en de broeder van Jakobus en Joses, en van Judas en Simon, en zijn Zijn zusters niet hier bij ons? En zij werden aan Hem geërgerd.","4":"En Jezus zeide tot hen: Een profeet is niet ongeëerd dan in zijn vaderland en onder *zijn* magen, en in zijn huis.","5":"En Hij kon aldaar geen kracht doen; dan Hij legde weinigen zieken de handen op, en genas hen.","6":"En Hij verwonderde Zich over hun ongeloof, en omging de vlekken *daar* rondom, lerende.","7":"En Hij riep tot Zich de twaalven, en begon hen uit te zenden twee en twee, en gaf hun macht over de onreine geesten.","8":"En Hij gebood hun, dat zij niets zouden nemen tot den weg, dan alleenlijk een staf, geen male, geen brood, geen geld in den gordel;","9":"Maar dat zij schoenzolen zouden aanbinden, en met geen twee rokken gekleed zijn .","10":"En Hij zeide tot hen: Zo waar gij in een huis zult ingaan, blijft daar, totdat gij van daar uitgaat.","11":"En zo wie u niet zullen ontvangen, noch u horen, vertrekkende van daar, schudt het stof af, dat onder aan uw voeten is, hun tot een getuigenis. Voorwaar zeg Ik u: Het zal Sodom en Gomorra verdragelijker zijn in den dag des oordeels dan dezelve stad.","12":"En uitgegaan zijnde, predikten zij, dat zij zich zouden bekeren.","13":"En zij wierpen vele duivelen uit, en zalfden vele kranken met olie, en maakten hen gezond.","14":"En de koning Herodes hoorde het ( want Zijn Naam was openbaar geworden), en zeide: Johannes, die daar doopte, is van de doden opgewekt, en daarom werken die krachten in Hem.","15":"Anderen zeiden: Hij is Elias; en anderen zeiden: Hij is een profeet, of als een der profeten.","16":"Maar als het Herodes hoorde, zeide hij: Deze is Johannes, dien ik onthoofd heb; die is van de doden opgewekt.","17":"Want dezelve Herodes, *enigen* uitgezonden hebbende, had Johannes gevangen genomen, en hem in de gevangenis gebonden, uit oorzaak van Herodias, de huisvrouw van zijn broeder Filippus, omdat hij haar getrouwd had.","18":"Want Johannes zeide tot Herodes: Het is u niet geoorloofd de huisvrouw uws broeders te hebben.","19":"En Herodias legde op hem toe; en wilde hem doden, en konde niet;","20":"Want Herodes vreesde Johannes, wetende, dat hij een rechtvaardig en heilig man was, en hield hem in waarde; en als hij hem hoorde, deed hij vele dingen, en hoorde hem gaarne.","21":"En als er een welgelegen dag gekomen was, toen Herodes, op den dag zijner geboorte, een maaltijd aanrichtte, voor zijn groten, en de oversten over duizend, en de voornaamsten van Galilea;","22":"En als de dochter van dezelve Herodias inkwam, en danste, en Herodes en dengenen, die mede aanzaten, behaagde, zo zeide de koning tot het dochtertje: Eis van mij, wat gij ook wilt, en ik zal het u geven.","23":"En hij zwoer haar: Zo wat gij van mij zult eisen, zal ik u geven, *ook* tot de helft mijns koninkrijks!","24":"En zij, uitgegaan zijnde, zeide tot haar moeder: Wat zal ik eisen? En die zeide: Het hoofd van Johannes den Doper.","25":"En zij, terstond met haast ingaande tot den koning, heeft het geëist, zeggende: Ik wil, dat gij mij nu terstond, in een schotel, geeft het hoofd van Johannes den Doper.","26":"En de koning, zeer bedroefd geworden zijnde, *nochtans* om de eden, en degenen, die mede aanzaten, wilde hij haar *hetzelve* niet afslaan.","27":"En de koning zond terstond een scherprechter, en gebood zijn hoofd te brengen. Deze nu ging heen, en onthoofdde hem in de gevangenis;","28":"En bracht zijn hoofd in een schotel, en gaf hetzelve het dochtertje, en het dochtertje gaf hetzelve harer moeder.","29":"En als zijn discipelen *dit* hoorden, gingen zij en namen zijn dood lichaam weg, en legden dat in een graf.","30":"En de apostelen kwamen *weder* tot Jezus, en boodschapten Hem alles, beide wat zij gedaan hadden, en wat zij geleerd hadden.","31":"En Hij zeide tot hen: Komt gijlieden in een woeste plaats hier alleen, en rust een weinig; want er waren velen, die kwamen en die gingen, en zij hadden zelfs geen gelegen tijd om te eten.","32":"En zij vertrokken in een schip, naar een woeste plaats, alleen.","33":"En de scharen zagen hen heenvaren, en velen werden Hem kennende, en liepen gezamenlijk te voet van alle steden derwaarts, en kwamen hun voor, en gingen samen tot Hem.","34":"En Jezus, uitgaande, zag een grote schare, en werd innerlijk met ontferming bewogen over hen; want zij waren als schapen, die geen herder hebben; en Hij begon hun vele dingen te leren.","35":"En als het nu laat op den dag geworden was, kwamen Zijn discipelen tot Hem, en zeiden: Deze plaats is woest, en het is nu laat op den dag;","36":"Laat ze van U, opdat zij heengaan in de omliggende dorpen en vlekken, en broden voor zichzelven mogen kopen; want zij hebben niet, wat zij eten zullen.","37":"Maar Hij, antwoordende, zeide tot hen: Geeft gij hun te eten. En zij zeiden tot Hem: Zullen wij heengaan, en kopen voor tweehonderd penningen brood, en hun te eten geven?","38":"En Hij zeide tot hen: Hoeveel broden hebt gij? Gaat heen en beziet *het*. En toen zij het vernomen hadden, zeiden zij: Vijf, en twee vissen.","39":"En Hij gebood hun, dat zij hen allen zouden doen nederzitten bij waardschappen, op het groene gras.","40":"En zij zaten neder in gedeelten bij honderd te zamen, en bij vijftig te zamen.","41":"En als Hij de vijf broden en de twee vissen genomen had, zag Hij op naar den hemel, zegende en brak de broden, en gaf ze Zijn discipelen, opdat zij ze hun zouden voorleggen, en de twee vissen deelde Hij voor allen.","42":"En zij aten allen, en zijn verzadigd geworden.","43":"En zij namen op twaalf volle korven brokken, en van de vissen.","44":"En die daar de broden gegeten hadden, waren omtrent vijf duizend mannen.","45":"En terstond dwong Hij Zijn discipelen in het schip te gaan, en voor henen te varen aan de andere zijde tegen *over* Bethsaida, terwijl Hij de schare van Zich zou laten.","46":"En als Hij aan dezelve hun afscheid gegeven had, ging Hij op den berg om te bidden.","47":"En als het nu avond was geworden, zo was het schip in het midden van de zee, en Hij was alleen op het land.","48":"En Hij zag, dat zij zich zeer pijnigden, om *het* *schip* voort te krijgen; want de wind was hun tegen; en omtrent de vierde wake des nachts, kwam Hij tot hen, wandelende op de zee, en wilde hen voorbijgaan.","49":"En zij, ziende Hem wandelen op de zee, meenden, dat het een spooksel was, en schreeuwden zeer;","50":"Want zij zagen Hem allen, en werden ontroerd; en terstond sprak Hij met hen, en zeide tot hen: Zijt welgemoed, Ik ben het; vreest niet.","51":"En Hij klom tot hen in het schip, en de wind stilde; en zij ontzetten zich bovenmate zeer in zichzelven, en waren verwonderd.","52":"Want zij hadden niet gelet op *het* *wonder* der broden; want hun hart was verhard.","53":"En als zij overgevaren waren, kwamen zij in het land Gennesareth, en havenden aldaar.","54":"En als zij uit het schip gegaan waren, terstond werden zij Hem kennende.","55":"*En* het gehele omliggende land doorlopende, begonnen zij op beddekens degenen, die kwalijk gesteld waren, om te dragen, ter plaatse, waar zij hoorden, dat Hij was.","56":"En zo waar Hij kwam, in vlekken, of steden, of dorpen, daar leiden zij de kranken op de markten, en baden Hem, dat zij maar den zoom Zijns kleeds aanraken mochten; en zovelen, als er Hem aanraakten, werden gezond."},"KJV":{"1":"And he went out from thence, and came into his own country; and his disciples follow him.","2":"And when the sabbath day was come, he began to teach in the synagogue: and many hearing *him* were astonished, saying, From whence hath this *man* these things? and what wisdom *is* this which is given unto him, that even such mighty works are wrought by his hands?","3":"Is not this the carpenter, the son of Mary, the brother of James, and Joses, and of Juda, and Simon? and are not his sisters here with us? And they were offended at him.","4":"But Jesus said unto them, A prophet is not without honour, but in his own country, and among his own kin, and in his own house.","5":"And he could there do no mighty work, save that he laid his hands upon a few sick folk, and healed","6":"And he marvelled because of their unbelief. And he went round about the villages, teaching.","7":"And he called *unto him* the twelve, and began to send them forth by two and two; and gave them power over unclean spirits;","8":"And commanded them that they should take nothing for *their* journey, save a staff only; no scrip, no bread, no money in *their* purse:","9":"But *be* shod with sandals; and not put on two coats.","10":"And he said unto them, In what place soever ye enter into an house, there abide till ye depart from that place.","11":"And whosoever shall not receive you, nor hear you, when ye depart thence, shake off the dust under your feet for a testimony against them. Verily I say unto you, It shall be more tolerable for Sodom and Gomorrha in the day of judgment, than for that city.","12":"And they went out, and preached that men should repent.","13":"And they cast out many devils, and anointed with oil many that were sick, and healed","14":"And king Herod heard *of him*; (for his name was spread abroad:) and he said, That John the Baptist was risen from the dead, and therefore mighty works do shew forth themselves in him.","15":"Others said, That it is Elias. And others said, That it is a prophet, or as one of the prophets.","16":"But when Herod heard *thereof*, he said, It is John, whom I beheaded: he is risen from the dead.","17":"For Herod himself had sent forth and laid hold upon John, and bound him in prison for Herodias' sake, his brother Philip's wife: for he had married her.","18":"For John had said unto Herod, It is not lawful for thee to have thy brother's wife.","19":"Therefore Herodias had a quarrel against him, and would have killed him; but she could not:","20":"For Herod feared John, knowing that he was a just man and an holy, and observed him; and when he heard him, he did many things, and heard him gladly.","21":"And when a convenient day was come, that Herod on his birthday made a supper to his lords, high captains, and chief *estates* of Galilee;","22":"And when the daughter of the said Herodias came in, and danced, and pleased Herod and them that sat with him, the king said unto the damsel, Ask of me whatsoever thou wilt, and I will give *it* thee.","23":"And he sware unto her, Whatsoever thou shalt ask of me, I will give *it* thee, unto the half of my kingdom.","24":"And she went forth, and said unto her mother, What shall I ask? And she said, The head of John the Baptist.","25":"And she came in straightway with haste unto the king, and asked, saying, I will that thou give me by and by in a charger the head of John the Baptist.","26":"And the king was exceeding sorry; *yet* for his oath's sake, and for their sakes which sat with him, he would not reject her.","27":"And immediately the king sent an executioner, and commanded his head to be brought: and he went and beheaded him in the prison,","28":"And brought his head in a charger, and gave it to the damsel: and the damsel gave it to her mother.","29":"And when his disciples heard *of it*, they came and took up his corpse, and laid it in a tomb.","30":"And the apostles gathered themselves together unto Jesus, and told him all things, both what they had done, and what they had taught.","31":"And he said unto them, Come ye yourselves apart into a desert place, and rest a while: for there were many coming and going, and they had no leisure so much as to eat.","32":"And they departed into a desert place by ship privately.","33":"And the people saw them departing, and many knew him, and ran afoot thither out of all cities, and outwent them, and came together unto him.","34":"And Jesus, when he came out, saw much people, and was moved with compassion toward them, because they were as sheep not having a shepherd: and he began to teach them many things.","35":"And when the day was now far spent, his disciples came unto him, and said, This is a desert place, and now the time *is* far passed:","36":"Send them away, that they may go into the country round about, and into the villages, and buy themselves bread: for they have nothing to eat.","37":"He answered and said unto them, Give ye them to eat. And they say unto him, Shall we go and buy two hundred pennyworth of bread, and give them to eat?","38":"He saith unto them, How many loaves have ye? go and see. And when they knew, they say, Five, and two fishes.","39":"And he commanded them to make all sit down by companies upon the green grass.","40":"And they sat down in ranks, by hundreds, and by fifties.","41":"And when he had taken the five loaves and the two fishes, he looked up to heaven, and blessed, and brake the loaves, and gave *them* to his disciples to set before them; and the two fishes divided he among them all.","42":"And they did all eat, and were filled.","43":"And they took up twelve baskets full of the fragments, and of the fishes.","44":"And they that did eat of the loaves were about five thousand men.","45":"And straightway he constrained his disciples to get into the ship, and to go to the other side before unto Bethsaida, while he sent away the people.","46":"And when he had sent them away, he departed into a mountain to pray.","47":"And when even was come, the ship was in the midst of the sea, and he alone on the land.","48":"And he saw them toiling in rowing; for the wind was contrary unto them: and about the fourth watch of the night he cometh unto them, walking upon the sea, and would have passed by them.","49":"But when they saw him walking upon the sea, they supposed it had been a spirit, and cried out:","50":"For they all saw him, and were troubled. And immediately he talked with them, and saith unto them, Be of good cheer: it is I; be not afraid.","51":"And he went up unto them into the ship; and the wind ceased: and they were sore amazed in themselves beyond measure, and wondered.","52":"For they considered not *the miracle* of the loaves: for their heart was hardened.","53":"And when they had passed over, they came into the land of Gennesaret, and drew to the shore.","54":"And when they were come out of the ship, straightway they knew him,","55":"And ran through that whole region round about, and began to carry about in beds those that were sick, where they heard he was.","56":"And whithersoever he entered, into villages, or cities, or country, they laid the sick in the streets, and besought him that they might touch if it were but the border of his garment: and as many as touched him were made whole."}},"tsk":{"1":[{"kopje":"en kwam","refs":["Matt 13:54","Luk 4:16-30"]}],"2":[{"kopje":"begon Hij","refs":["Mark 1:21","Mark 1:22","Mark 1:39","Luk 4:15","Luk 4:31","Luk 4:32"]},{"kopje":"komen","refs":["Joh 6:42","Joh 7:15","Hand 4:13","Hand 4:14"]}],"3":[{"kopje":"Deze","refs":["Matt 13:55","Matt 13:56","Luk 4:22","Joh 6:42"]},{"kopje":"timmerman","refs":["J ook moeten ophouden."}],"14":[{"catchword":"Heródes hoorde het","tekst":"Zie van dezen Herodes en van deze gehele geschiedenis Mat 14:1 , enz."},{"catchword":"want Zijn Naam was openbaar geworden","tekst":"Namelijk de naam Jezus."},{"catchword":"werken die krachten in Hem","tekst":"Dat is, nu komt hij met meerder kracht dan tevoren, want Johannes had zelf gene wonderen gedaan; Joh 10:41 ."}],"15":[{"catchword":"der profeten","tekst":"Dat is, der oude afgestorven profeten."}],"20":[{"catchword":"hield hem in waarde;","tekst":"Of, bewaarde hem."},{"catchword":"hoorde hem gaarne","tekst":"Namelijk in het eerst, want daarna opgemaakt zijnde door Herodias, zocht hij hem te doden, hoewel hij zulks liet uit vrees voor het volk, totdat deze gelegenheid voorkwam; Mat 14:5 ."}],"21":[{"catchword":"een welgelegen dag gekomen was,","tekst":"Dat is bekwame tijd, waar Herodias op toelegde, om tot haar voornemen te komen."}],"22":[{"catchword":"inkwam, en danste,","tekst":"Namelijk in de zaal, waar de maaltijd gehouden werd, want het was bij de ouden niet veel gebruikelijk dat de vrouwen met de mannen in grote maaltijden aanzaten. Zie Est 1:11 ."}],"26":[{"catchword":"afslaan","tekst":"Grieks haar niet afzetten; dat is haar verzoek verwerpen."}],"27":[{"catchword":"scherprechter,","tekst":"Of, trawant, hellebardier, lijfwacht."}],"30":[{"catchword":"kwamen weder tot Jezus,","tekst":"Namelijk wederkomende van hunne reis, die zij, na de uitzending, twee en twee gedaan hadden door het Joodse land."}],"31":[{"catchword":"een woeste plaats","tekst":"Of, eenzame. Deze was bij Bethsaïda; Mat 14:13 ; Luk 9:10 ."},{"catchword":"hier alleen,","tekst":"Of, bezijden."}],"34":[{"catchword":"En Jezus,","tekst":"Zie van dit gehele wonder de aantekeningen Mat 14:15 , enz."}],"35":[{"catchword":"als het nu laat op den dag geworden was,","tekst":"Grieks, als nu de ure veel was geworden. Want de Joden rekenden de uren van den opgang der zon, en eindigden die met den avond; Mat 20:6 ."}],"36":[{"catchword":"dorpen en vlekken,","tekst":"Grieks, velden; dit is, landhuizen of dorpen."}],"37":[{"catchword":"tweehonderd penningen brood,","tekst":"Grieks denariën. Zie de waarde hiervan Mat 18:28 ."}],"38":[{"catchword":"vernomen hadden,","tekst":"Grieks verstaan hadden, of twisten."}],"39":[{"catchword":"bij waardschappen,","tekst":"Grieks, waardschappen, waardschappen, of maaltijden, maaltijden; een Hebreeuwse wijze van spreken; dat is, in verscheidene gezelschappen, gelijk in grote maaltijden of bruiloften het volk aan verscheidene tafels placht verdeeld te worden."}],"40":[{"catchword":"zaten neder","tekst":"Grieks, vielen."},{"catchword":"in gedeelten bij honderd te zamen,","tekst":"Grieks, hofbedden, hofbedden; dat is, onderscheiden, gelijk de kruidbedden in de hoven zijn, waaruit lichtelijk het getal kon afgerekend worden."}],"41":[{"catchword":"zegende en brak de broden,","tekst":"Namelijk met dankzegging. Zie Mat 14:19 ; Joh 6:11 ."}],"45":[{"catchword":"tegen -over Bethsáïda,","tekst":"Want Joh 6:17 staat dat zij naar Kapernaüm voeren, hetwelk tegenover Bethsaïda lag."}],"46":[{"catchword":"hun afscheid gegeven had,","tekst":"Of, van haar zijn afscheid genomen had; gelijk Act 18:21 ."}],"48":[{"catchword":"dat zij zich zeer pijnigden,","tekst":"Of, dat zij in nood waren in het roeien."},{"catchword":"vierde wake des nachts,","tekst":"Welke was de laatste. Zie Mat 14:25 ."}],"49":[{"catchword":"spooksel was,","tekst":"Dat is, een geest, verschijnende in lichamelijke gedaante."}],"51":[{"catchword":"bovenmate zeer in zichzelven,","tekst":"Grieks, zeer overvloediglijk."}],"52":[{"catchword":"niet gelet op het wonder der broden;","tekst":"Grieks, niet verstaan van, of door de broden; dat is, zij waren niet verstandiger geworden door hetgeen met de vijf broden geschied was; namelijk om daardoor van Christus' goddelijke kracht en zorg voor hen verzekerd te zijn. Zie Mar 8:17-21 ."},{"catchword":"verhard","tekst":"Grieks, vereeld, of verward; hetwelk niet is te verstaan van zulke hardigheid of verstoktheid des harten, gelijk in de hardnekkige Joden tevoren aangewezen en bestraft is, Mar 3:5 , maar van hun onverstand en traagheid om geestelijke dingen wel te begrijpen en te geloven. Zie dergelijke Mar 8:17 , en Mar 16:14 ; Luk 24:25 ."}],"54":[{"catchword":"terstond werden zij Hem kennende","tekst":"Namelijk de lieden van dat land."}],"56":[{"catchword":"dorpen,","tekst":"Grieks, velden."},{"catchword":"aanraken mochten;","tekst":"Van dit aanraken zie de reden in de aantekeningen Mat 14:36 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And he went away from thence and he came into his own country [namely to Nazareth which is called his country because he was brought up there and had dwelt there a long time with his parents see Matthew 13 verse 54 and Luke 4 verse 16]and his disciples followed him ."}],"2":[{"catchword":null,"tekst":"And when the Sabbath was come he began to teach in the Synagogue and many who heard him were astonished [Gr. were stricken] saying from whence come those things to his man? and what was one this which is given unto him that even such mighty works [that is miracles or wonderful signs see Mat 7:22]are done by his hands ?[that is by him an Hebrew phrase]"}],"3":[{"catchword":null,"tekst":"is not in the carpenter Mat 13:55 there it is like that Christ did help him in the hand crast until he entered upon his office of teaching which was also a part of humiliation Luk 2:51] the son of Mary and the brother of James and Joses and Judas and Simon? [That is their cousin see the annotate Mat 13:55] and are not his sister here with us? And they were offended at him."}],"4":[{"catchword":null,"tekst":"And Jesus said unto them a prophet is not disesteemed but in his own country and among his kinred and in his own house."}],"5":[{"catchword":null,"tekst":"And he could do no powerful work there [how this is to be understood see the annotations on Mat 13:58] but tat he laid the hands on a few sick and healed them."}],"6":[{"catchword":null,"tekst":"And marveled at their unbelief and went about the villages there round about teaching."}],"7":[{"catchword":null,"tekst":"And he called unto him the twelve [namely which he had chosen for his apostle Mark 3.13] and began to send them forth two and two and gave them power over unclean spirits [namely to be able to cast them out of the possessed]"}],"8":[{"catchword":null,"tekst":"And he commanded them that they should take nothing for the way but only a staff [namely to lean and rest upon in going but none to burden them on the way as is to be seen Matthew 10 verse 10] no scrip no bread no money [Gr brass because in former times money used much to be on brass also thereby may here be understood even the very least provision of money] in the girdle."}],"9":[{"catchword":null,"tekst":"But that they should tie on shoe soles [Gr. Sandalia which were certain fort of light shoes consisting of soles with shoe tie or latches to fasten them to the feet which were very usual in those hot country Act 12:8 of these they were to take no more than one pair for to travel for to take more shoes with them on the way was expressly forbidden them Mat 10:10] and not be cloathed with two coats [that is with more ten ye shall have on without carrying one coat more along with them for change ]"}],"10":[{"catchword":null,"tekst":"And he said unto them where so ever ye shall enter in the house abides there until ye go forth from thence."}],"11":[{"catchword":null,"tekst":"And whosoever shall not receive ye nor hear ye departing from thence shake off the dust that is under your feet [the reason hereof see Mat 10:14] for a testimony unto them verily I say unto ye it shall be more tolerable for Sodom and Gomorra in the day of judgment then for that city."}],"12":[{"catchword":null,"tekst":"And being gone forth they preached that they should repent."}],"13":[{"catchword":null,"tekst":"And they cast out many devils and anointed many that were sick with oil and made them whole [this anointing is also the laying in of hands touching and the like manner of doings which Christ and the apostles used in healing of disease did not give health but were out ward sign only that is miraculous healing was done by the divine power of Christ and the ministry of the apostles which signs were used as long as the gift of miraculous healing endured see Mark 16.18 Jas 5:14 and since that gift ceased these signs must cease likewise as serving for no further use ."}],"14":[{"catchword":null,"tekst":"And King Herod heard of it [see of this Herod and his whole history Mat 14:1 c] for his name [namely the name of Jesus] was made known and said John that baptized is raised from the dead and therefore those powers do work in him [that is now he cometh with greater power than before for John himself had done no miracle Joh 10:41]"}],"15":[{"catchword":null,"tekst":"Others said he is Elias and others said he is a prophet [that is of the old deceased prophet]"}],"16":[{"catchword":null,"tekst":"But when Herod heard it he said this is John whom I beheaded he is raised from the dead."}],"17":[{"catchword":null,"tekst":"For the same Herod having sent forth some had apprehended John and bound him in prison because of Herodias his brother Philip wife he having married her."}],"18":[{"catchword":null,"tekst":"For John said unto Herod it is not lawful for thee to have brother&acirc;&euro;&trade;s wife."}],"19":[{"catchword":null,"tekst":"And Herodias laid wait for him and would put him to death but could not."}],"20":[{"catchword":null,"tekst":"For Herod feared John knowing that he was a righteous and holy man and held him in esteem [or kept him] and when he heard him h did many things and heard him gladly [namely at first for afterwards being stirred up by Herodias he fought to kill him although he forbare it for fear of people until the opportunity happened Mat 14:5.]"}],"21":[{"catchword":null,"tekst":"And when a covenant day was come [that is a fit time which Herodias waited for to obtain her purpose] when Herod on his birthday prepared a feast for the great ones rulers over thousand and the chiefest of Galilee."}],"22":[{"catchword":null,"tekst":"And when the daughter of the said Herodias came in namely into the hall where the feast was kept for it was not very usual with ancient that the women sate down with man in great feast see Esthar1.11] and danced and pleased Herod and those that sate with him then the king said to the Damosel ask of me even what thou wilt and I will give it thee."}],"23":[{"catchword":null,"tekst":"And he swared unto her whatsoever thou shalt ask I will give it thee even to the half of the kingdom."}],"24":[{"catchword":null,"tekst":"And she being gone forth said unto her mother what shall I ask? And she said the head of John the Baptist."}],"25":[{"catchword":null,"tekst":"And she straightway with speed going in unto the king asked it saying I will that thou now straightway give me in a dish the head of John the Baptist."}],"26":[{"catchword":null,"tekst":"And the king being become very sorry nevertheless because of the oaths and those that sate with him he would not refuse her the same [Gr. not put her off that is not refuse the request.]"}],"27":[{"catchword":null,"tekst":"And the king immediately sent and executioner [or sergeant Halbardea one of the life guard] and commanded to bring his head thither now this fellow went away and beheaded him in the prison."}],"28":[{"catchword":null,"tekst":"And brought his head in a dish and gave the same to the Damosel and the Damosel gave the same to her mother."}],"29":[{"catchword":null,"tekst":"And when his disciples heard this they went and took away his dead body and lay in a grave."}],"30":[{"catchword":null,"tekst":"And the apostles came together again unto Jesus [namely returning from their journey which after their being sent forth two and two they had taken through the land of Judea ]and told him all things both what they had ompanies like as at great feast or weddings the people used to be divided by several tables ]on the green grass ."}],"40":[{"catchword":null,"tekst":"And they sate down [Gr. fell] in parties [Gr. garden beds that is distinguished as the beds of the herbs in gardens are whereby the number might easily be reckoned] by an hundred together and by an fifty together."}],"41":[{"catchword":null,"tekst":"And when he had taken the five loaves and two fishes he looked up to heaven blessed [namely with thanksgiving see Mat 14:19 Joh 6:11] and brake the loaves and gave them to his disciples that they should set them before them and the two fishes he divided to them all ."}],"42":[{"catchword":null,"tekst":"And they did all eat and were satisfied."}],"43":[{"catchword":null,"tekst":"And they took up twelve baskets full of fragments and of the fishes."}],"44":[{"catchword":null,"tekst":"And they that had eaten of the loaves were about five thousand men."}],"45":[{"catchword":null,"tekst":"And straightway he constrained his disciple to go into the ship and to pass before to the other side over against Bethsaida [for Joh 6:17] it is said tat they went towards Capernaum which lay over against Bethsaida ]while he dismissed the multitude."}],"46":[{"catchword":null,"tekst":"And when he had dismissed them [or taken his leave of them as Act 18:21] he went up into the mountain to pray."}],"47":[{"catchword":null,"tekst":"And when it was become evening now the ship was in the midst of the sea and he was alone on the land [or shore]"}],"48":[{"catchword":null,"tekst":"And he saw that they toiled much to advance the ship [or that they were distressed in rowing] for the wind was against them and about the forth watch of the night [which was the last see Mat 14:25] he came unto them walking upon the sea and would pass them by."}],"49":[{"catchword":null,"tekst":"And they seeing seeing him walk upon the sea thought that it was an apparition [or phantasm that is a spirit appearing in the bodily shape] and shrieked greatly."}],"50":[{"catchword":null,"tekst":"For they all saw him and were troubled and straightway he spake with them and said unto them be of good cheer it is I fear not."}],"51":[{"catchword":null,"tekst":"And he got them into the ship and the wind was still and they were astonished exceedingly themselves [Gr. very abundantly] and wondered."}],"52":[{"catchword":null,"tekst":"For they had not taken notice of the miracle of the loaves [Gr not understood of or by the loaves that is they were not become more understanding by that which was done with the five loaves namely to be assured thereby of Christ divine power and care for them see Mark 8verse 17,20,21] for their heart was hardened [Gr become brawny which is not to be understood of such a hardness and stupidity of heart as was before shewed and reproved in the stiff necked Jews chapter 3 verse 5 but of their want of understanding and slowness well to apprehend and believe spiritual things see the like Mark 8.17 and 16.14 Luk 24:15]"}],"53":[{"catchword":null,"tekst":"And when they were passed over they came into the land Gennesareth and took haven there"}],"54":[{"catchword":null,"tekst":"And when they were gone forth out of the ship they [namely the people of that land] presently knew him."}],"55":[{"catchword":null,"tekst":"And running all the adjacent country over they began to carry on little beds those that were ill at ease to the places where they heard that there was."}],"56":[{"catchword":null,"tekst":"And where so ever he came into towns or cities or villages [Gr fields ] there they laid the sick in the markets and prayed him that they might but touch the hem of the garments [see the reason of this touching in the annotations on Mat 14:36] And as many as touched him were made whole ."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];

    const id = `u-${b.key}-${n}`;

      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);

      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';

    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>

    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;

function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
