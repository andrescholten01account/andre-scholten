rt terug naar zijn huis in vrede.", "Luk 4:24": "En Hij zei: Voorwaar, Ik zeg u, dat geen profeet aangenaam is in zijn vaderland.", "Matt 9:27": "En toen Jezus vandaar verder ging, volgden Hem twee blinden, roepend en zeggend: Zoon van David, ontferm U over ons!", "2 Kron 22:3": "Hij wandelde ook in de wegen van het huis van Achab; want zijn moeder was zijn raadgeefster, om goddeloos te handelen.", "Job 4:14-16": "kwam er schrik en beving over mij, en het deed al mijn beenderen sidderen. Toen ging er een geest voorbij mijn gezicht; hij deed het haar van mijn lichaam overeind komen. Hij stond stil, maar ik herkende zijn gedaante niet; er was een beeltenis voor mijn ogen; er was stilte, en ik hoorde een stem, die zei:", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Jes 2:5": "Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.", "Joh 3:32": "En wat Hij gezien en gehoord heeft, dat getuigt Hij; en Zijn getuigenis neemt niemand aan.", "Luk 10:10-15": "Maar in welke stad u ook binnengaat en zij u niet ontvangen, ga naar buiten op haar straten en zeg: Ook het stof dat uit uw stad aan ons kleeft, schudden wij af tegen u; toch moet u dit weten, dat het Koninkrijk van God dicht bij u gekomen is. En Ik zeg u dat het voor Sodom draaglijker zal zijn op die dag dan voor die stad.", "Dan 12:7": "En ik hoorde die Man, gekleed in linnen, Die boven op het water van de rivier was, en Hij hief Zijn rechterhand en Zijn linkerhand op naar de hemel, en zwoer bij Hem Die eeuwig leeft, dat het na een bestemde tijd, bestemde tijden, en een helft zal zijn, en wanneer Hij voleindigd zal hebben het uiteenslaan van de macht van het heilige volk, al deze dingen voleindigd zullen worden.", "Pred 12:9": "En verder, omdat de prediker wijs geweest is, leerde hij het volk nog kennis, en lette hij op, en onderzocht hij; hij bracht veel spreuken in orde.", "Hebr 10:26-30": "Want als wij willens en wetens zondigen, nadat wij de kennis van de waarheid ontvangen hebben, blijft er geen offer meer over voor de zonden; maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "Mark 3:5": "En nadat Hij hen met toorn had aangekeken, bedroefd over de verharding van hun hart, zei Hij tegen de man: Strek uw hand uit. En hij strekte hem uit; en zijn hand werd hersteld, gezond als de andere.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Matt 6:23": "maar als uw oog slecht is, zal heel uw lichaam duister zijn. Als dan het licht dat in u is duisternis is, hoe groot is dan die duisternis!", "Jer 17:11": "Zoals een veldhoen eieren verzamelt, maar ze niet uitbroedt, zo is hij die rijkdom verzamelt, maar niet met recht; in de helft van zijn dagen zal hij die moeten verlaten, en in zijn laatste dagen een dwaas zijn.", "Num 7:13": "En zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Mark 2:28": "Zo is dan de Zoon des mensen ook Heere van de sabbat.", "Gen 43:34": "En hij liet hun gerechten brengen die voor hem stonden; maar het gerecht van Benjamin was vijf keer groter dan de gerechten van hen allen. En zij dronken, en zij werden vrolijk met hem.", "Luk 22:67": "en zeiden: Bent U de Christus, zeg het ons. En Hij zei tegen hen: Als Ik het u zeg, zult u het niet geloven;", "Joh 6:60-68": "Velen van Zijn discipelen dan zeiden, toen zij dit hoorden: Dit is een harde uitspraak; wie kan dat aanhoren? Jezus, die bij Zichzelf wist dat Zijn discipelen daarover morden, zei tegen hen: Ergert dit u? Wat zou het dan zijn, als u de Zoon des mensen zag opvaren naar waar Hij eerder was?", "Hand 18:24-28": "En een zekere Jood, met de naam Apollos, van geboorte een Alexandriër, een welsprekend man, kwam naar Efeze, machtig zoals hij was in de Schriften. Deze was onderwezen in de weg van de Heere; en omdat hij vurig was van geest, sprak en leerde hij nauwkeurig de zaken van de Heere, al kende hij alleen de doop van Johannes. En hij begon vrijmoedig te spreken in de synagoge. En toen Aquila en Priscilla hem gehoord hadden, namen zij hem tot zich, en legden hem de weg van God nauwkeuriger uit.", "Jer 5:2": "En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals.", "Jes 5:15": "Dan zal de gewone man neergebogen worden, en de aanzienlijke man zal vernederd worden, en de ogen van de hoogmoedigen zullen vernederd worden.", "Luk 16:18": "Ieder die zijn vrouw verlaat en een andere trouwt, doet overspel; en ieder die haar trouwt die door de man verlaten is, doet ook overspel.", "Joh 6:52": "De Joden streden dan onder elkaar en zeiden: Hoe kan Hij ons Zijn vlees te eten geven?", "Spr 31:5": "opdat hij niet drinkt en het vastgestelde vergeet, en de rechtszaak van alle verdrukten verandert.", "Jer 11:14": "U dan, bid niet voor dit volk, en hef geen geschrei of gebed voor hen op; want Ik zal niet horen, in de tijd dat zij vanwege hun kwaad tot Mij zullen roepen.", "Job 9:8": "Die alleen de hemelen uitbreidt, en treedt op de hoogten van de zee;", "Mark 5:20": "En hij ging weg, en begon in het gebied van Dekapolis te verkondigen wat grote dingen Jezus aan hem gedaan had; en zij verwonderden zich allen.", "Hand 18:6": "Maar toen zij hem weerstonden en lasterden, schudde hij zijn kleren af en zei tegen hen: Uw bloed zij op uw hoofd; ik ben rein; en van nu af aan zal ik naar de heidenen gaan.", "Matt 14:15-21": "Toen het nu avond werd, kwamen Zijn discipelen naar Hem toe, en zeiden: Deze plaats is eenzaam, en de tijd is nu voorbijgegaan; stuur de menigten weg, zodat zij naar de dorpen gaan en voor zichzelf voedsel kopen. Maar Jezus zei tegen hen: Het is voor hen niet nodig om weg te gaan, geeft u hun te eten. Maar zij zeiden tegen Hem: Wij hebben hier niets dan vijf broden en twee vissen.", "Jes 54:4": "Vrees niet, want u zult niet beschaamd worden, en word niet schaamrood, want u zult niet te schande worden; maar u zult de schaamte van uw jonkheid vergeten, en de smaad van het weduwschap zult u niet meer gedenken.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Luk 10:8": "En in welke stad u ook binnengaat en zij u ontvangen, eet wat u wordt voorgezet.", "Ex 28:38": "En zij zal op het voorhoofd van Aäron zijn, opdat Aäron de ongerechtigheid draagt van de heilige dingen die de kinderen van Israël geheiligd zullen hebben, in alle gaven van hun geheiligde dingen; en zij zal voortdurend aan zijn voorhoofd zijn, om hen voor het aangezicht van de HEERE aangenaam te maken.", "Matt 13:3-14": "En Hij sprak tot hen veel dingen door gelijkenissen en zei: Zie, een zaaier ging uit om te zaaien. En toen hij zaaide, viel een deel van het zaad bij de weg; en de vogels kwamen en aten dat op. En een ander deel viel op steenachtige plaatsen, waar het niet veel aarde had; en het kwam meteen op, omdat het geen diepte van aarde had.", "Matt 9:35": "En Jezus trok rond langs alle steden en dorpen, en onderwees in hun synagogen, en predikte het Evangelie van het Koninkrijk, en genas alle ziekte en alle kwaal onder het volk.", "Kol 2:16": "Laat dan niemand u oordelen over eten of drinken, of over een feestdag, nieuwe maan of sabbatten;", "Jer 12:16": "En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.", "Joh 12:28": "Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "Ps 71:17": "O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.", "Lev 26:35": "Al de dagen van de verwoesting zal het rusten, omdat het niet rustte in uw sabbatten, toen u daarin woonde.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Openb 11:10-13": "En zij die op de aarde wonen, die zullen zich verblijden over hen, en zullen vreugde bedrijven, en zullen elkaar geschenken zenden; omdat deze twee profeten hen die op de aarde wonen, gepijnigd hadden. En na die drie dagen en een halve is een geest van leven uit God in hen gegaan; en zij stonden op op hun voeten; en er is grote vrees gevallen op hen die hen aanschouwden. En zij hoorden een grote stem uit de hemel, die tegen hen zei: Kom hier boven. En zij voeren op naar de hemel, in de wolk; en hun vijanden aanschouwden hen.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Ezech 19:3": "Zij trok een van haar welpen groot; het werd een jonge leeuw, die leerde roof te roven, hij at mensen op.", "Hand 20:33": "Ik heb niemands zilver, of goud, of kleding begeerd.", "Joh 12:11": "Want om zijnentwil gingen velen van de Joden weg, en geloofden in Jezus.", "Joz 24:14-16": "En nu, vrees de HEERE, en dien Hem in oprechtheid en in waarheid; en doe de goden weg die uw vaders gediend hebben, aan de overkant van de rivier, en in Egypte; en dien de HEERE. Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen! Toen antwoordde het volk en zei: Het zij verre van ons, dat wij de HEERE zouden verlaten om andere goden te dienen.", "Hos 2:14": "En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland.", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Mark 16:1": "En toen de sabbat voorbij was, hadden Maria Magdalena, en Maria, de moeder van Jakobus, en Salome specerijen gekocht, opdat zij zouden komen en Hem zalven.", "Mark 10:14": "Maar Jezus zag dit, en nam het Hem zeer kwalijk, en zei tegen hen: Laat de kinderen bij Mij komen, en verhinder ze niet; want voor zulke is het Koninkrijk van God.", "1 Sam 7:5-8": "Verder zei Samuël: Verzamel heel Israël naar Mizpa, en ik zal de HEERE voor u bidden. En zij werden verzameld te Mizpa, en zij schepten water en goten het uit voor het aangezicht van de HEERE; en zij vastten die dag, en zeiden daar: Wij hebben tegen de HEERE gezondigd. Zo richtte Samuël de kinderen van Israël te Mizpa. Toen de Filistijnen hoorden dat de kinderen van Israël zich verzameld hadden te Mizpa, kwamen de leiders van de Filistijnen op tegen Israël. Toen de kinderen van Israël dat hoorden, werden zij bang voor de Filistijnen.", "Matt 23:16-24": "Wee u, blinde leidslieden, die zeggen: Wie ook zweert bij de tempel, dat is niets; maar wie zweert bij het goud van de tempel, die is verplicht zijn eed te houden. Dwazen en blinden, want wat is meer, het goud, of de tempel die het goud heiligt? En wie zweert bij het altaar, dat is niets; maar wie zweert bij de gave die daarop ligt, die is verplicht zijn eed te houden.", "Luk 7:39": "En de Farizeeër die Hem uitgenodigd had, zag dit en zei bij zichzelf: Als deze een profeet was, zou hij wel weten wat voor vrouw dit is die hem aanraakt; want zij is een zondares.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Hebr 5:7": "Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.", "Ps 9:20": "Sta op, HEERE, laat de mens zich niet versterken; laat de heidenen voor Uw aangezicht geoordeeld worden.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "2 Kor 1:14": "Zoals u ook ten dele ons erkend hebt, dat wij uw roem zijn, zoals u ook de onze bent, in de dag van de Heere Jezus.", "Mark 15:40": "En er waren ook vrouwen die dit van verre aanschouwden, onder wie ook Maria Magdalena was, en Maria, de moeder van Jakobus de kleine, en van Joses, en Salome;", "Jer 26:3": "Misschien zullen zij horen, en zich bekeren, ieder van zijn boze weg; zo zou Ik berouw hebben over het kwaad dat Ik hun denk te doen vanwege de boosheid van hun daden.", "Mark 1:27": "En zij waren allen zo verbaasd, dat zij onder elkaar vroegen: Wat is dit? Wat is dit voor een nieuw onderwijs, dat Hij met gezag ook de onreine geesten gebiedt, en zij Hem gehoorzaam zijn?", "1 Joh 4:3": "en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "Joh 12:37-40": "En hoewel Hij zoveel tekenen voor hen gedaan had, geloofden zij toch niet in Hem; Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard? Daarom konden zij niet geloven, omdat Jesaja opnieuw gezegd heeft:", "Matt 27:57-60": "En toen het avond geworden was, kwam er een rijk man uit Arimathea, genaamd Jozef, die ook zelf een discipel van Jezus was. Deze ging naar Pilatus en vroeg om het lichaam van Jezus. Toen gaf Pilatus bevel dat het hem gegeven zou worden. En Jozef nam het lichaam en wikkelde het in een schoon, fijn linnen kleed.", "Matt 16:21": "Van toen af begon Jezus Zijn discipelen te tonen dat Hij naar Jeruzalem moest gaan, en veel moest lijden van de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en op de derde dag moest opstaan.", "Ezech 20:21": "Maar die kinderen waren ook opstandig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet in acht om die te doen, die, als een mens ze doet, hij daardoor zal leven; zij ontheiligden Mijn sabbatten, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen in de woestijn.", "Spr 9:6": "Verlaat de dwaasheden, en leef; en treed in de weg van het verstand.", "Luk 21:1-4": "En toen Hij omhoogkeek, zag Hij de rijken hun gaven in de schatkist werpen. En Hij zag ook een zekere arme weduwe twee kleine penningen daarin werpen. En Hij zei: Waarlijk, Ik zeg u, dat deze arme weduwe meer dan allen heeft ingeworpen.", "Ezech 11:19": "En Ik zal hun één hart geven, en Ik zal een nieuwe geest in uw binnenste geven; en Ik zal het stenen hart uit hun vlees wegnemen, en zal hun een hart van vlees geven;", "Lev 26:2": "Mijn sabbatten zult u houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Hand 28:24": "En sommigen geloofden wel wat er gezegd werd, maar sommigen geloofden niet.", "Matt 4:25": "En grote menigten volgden Hem na, vanuit Galilea en Dekapolis, en Jeruzalem, en Judea, en van over de Jordaan.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Luk 8:25": "En Hij zei tegen hen: Waar is uw geloof? Maar zij werden bevreesd en verwonderden zich, en zeiden tegen elkaar: Wie is toch Deze, dat Hij ook de winden en het water gebiedt, en zij Hem gehoorzaam zijn?", "Luk 7:30-35": "Maar de Farizeeën en de wetgeleerden hebben het raadsbesluit van God tegen zichzelf verworpen, doordat zij zich niet door hem lieten dopen. En de Heere zei: Waarmee zal Ik dan de mensen van dit geslacht vergelijken, en waaraan zijn zij gelijk? Zij zijn gelijk aan de kinderen die op de markt zitten en elkaar toeroepen en zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben klaagliederen voor u gezongen, en u hebt niet gehuild.", "Richt 16:20": "En zij zei: De Filistijnen over u, Simson! En hij werd wakker uit zijn slaap, en zei: Ik zal ditmaal uitgaan, zoals de andere keren, en mij uitschudden; want hij wist niet, dat de HEERE van hem geweken was.", "Jer 9:1-3": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk. Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop. En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "Jes 6:8": "Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "Jer 5:12-14": "Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien. Ja, die profeten zullen tot wind worden, want het woord is niet bij hen; hun zelf zal zo gebeuren. Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.", "Est 3:7": "In de eerste maand (dat is de maand Nisan), in het twaalfde jaar van de koning Ahasveros, wierp men het Pur, dat is het lot, voor het aangezicht van Haman, van dag tot dag, en van maand tot maand, tot de twaalfde maand toe; dat is de maand Adar.", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "Matt 14:6": "Maar toen de verjaardag van Herodes gevierd werd, danste de dochter van Herodias in hun midden, en zij beviel Herodes.", "Jer 6:8": "Laat u tuchtigen, Jeruzalem! Opdat Mijn ziel niet van u afgetrokken wordt, opdat Ik u niet stel tot een woestheid, tot een onbewoond land.", "Gen 40:10": "en aan de wijnstok waren drie ranken; en het was alsof hij uitbotte, zijn bloesem kwam op, zijn trossen brachten rijpe druiven voort.", "Matt 16:22": "En Petrus nam Hem apart, en begon Hem te bestraffen en zei: Heere, dat zij verre van U! Dit zal U geenszins gebeuren.", "1 Joh 2:22": "Wie is de leugenaar, dan wie loochent, dat Jezus de Christus is? Deze is de antichrist, die de Vader en de Zoon loochent.", "Matt 13:57": "En zij namen aanstoot aan Hem. Maar Jezus zei tegen hen: Een profeet is niet ongeëerd, behalve in zijn vaderstad en in zijn huis.", "Ex 3:16": "Ga heen, en verzamel de oudsten van Israël, en zeg tegen hen: De HEERE, de God van uw vaderen, is mij verschenen, de God van Abraham, Izak en Jakob, en Hij zei: Ik heb u getrouw bezocht, en gezien wat u in Egypte is aangedaan;", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Rom 9:32": "Waarom? Omdat zij die niet uit het geloof zochten, maar als het ware uit de werken van de wet; want zij hebben zich gestoten aan de steen des aanstoots;", "Matt 28:18": "En Jezus kwam bij hen en sprak tot hen: Mij is gegeven alle macht in hemel en op aarde.", "Matt 19:25": "Zijn discipelen nu, toen zij dit hoorden, werden zeer verslagen, en zeiden: Wie kan dan behouden worden?", "Hab 1:3": "Waarom laat U mij ongerechtigheid zien, en aanschouwt U de kwelling? Want verwoesting en geweld is tegen mij, en er is twist, en men neemt gekijf op.", "1 Tess 4:13": "Maar, broeders, ik wil niet dat u onwetend bent over hen die ontslapen zijn, opdat u niet bedroefd bent, zoals ook de anderen, die geen hoop hebben.", "Ps 82:5": "Zij weten niet, en verstaan niet; zij wandelen steeds in duisternis; daardoor wankelen alle fundamenten van de aarde.", "Hand 4:33": "En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Luk 23:6": "Toen Pilatus dit over Galilea hoorde, vroeg hij of die Mens een Galileeër was.", "Rom 2:5-12": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God. Die ieder zal vergelden naar zijn werken: Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Matt 23:31-35": "Zo getuigt u tegen uzelf, dat u kinderen bent van hen die de profeten gedood hebben. Maak u dan ook de maat van uw vaderen vol! Slangen, addergebroed! Hoe zou u de helse verdoemenis ontvluchten?", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Matt 16:24": "Toen zei Jezus tegen Zijn discipelen: Als iemand achter Mij aan wil komen, laat hij zichzelf verloochenen, en zijn kruis opnemen, en Mij volgen.", "Dan 12:10": "Velen zullen gereinigd, wit gemaakt en gelouterd worden; maar de goddelozen zullen goddeloos handelen, en geen van de goddelozen zal het begrijpen, maar de verstandigen zullen het begrijpen.", "Joh 6:7": "Filippus antwoordde Hem: Voor tweehonderd penningen brood is voor hen niet genoeg, zodat ieder van hen een klein beetje krijgt.", "Luk 9:18": "En het gebeurde, terwijl Hij eens alleen aan het bidden was en de discipelen bij Hem waren, dat Hij hun vroeg: Wie zeggen de menigten dat Ik ben?", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Jes 62:7": "En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.", "Joh 6:66": "Van toen af gingen velen van Zijn discipelen terug, en liepen niet meer met Hem mee.", "Jes 40:1": "Troost, troost Mijn volk, zal uw God zeggen.", "Jes 42:6": "Ik, de HEERE, heb u geroepen in gerechtigheid, en Ik zal u bij uw hand grijpen; en Ik zal u behoeden, en Ik zal u geven tot een Verbond van het volk, tot een Licht van de heidenen.", "Matt 22:2-13": "Het Koninkrijk der hemelen is gelijk aan een zeker koning, die voor zijn zoon een bruiloft bereid had; En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen. Opnieuw zond hij andere dienstknechten uit, en zei: Zeg tegen de genode gasten: Zie, ik heb mijn middagmaal bereid; mijn ossen en het gemeste vee zijn geslacht, en alles is gereed; kom naar de bruiloft.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 92:7": "Een redeloos man weet er niet van, en een dwaas begrijpt dit niet;", "Joh 6:1": "Hierna vertrok Jezus over de zee van Galilea, ook wel de zee van Tiberias genoemd.", "Rom 12:3": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld.", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Jes 66:5": "Hoor het woord van de HEERE, u die voor Zijn woord beeft! Uw broeders, die u haten, die u ver wegsturen, om Mijn Naam, zeggen: Laat de HEERE heerlijk worden! Maar Hij zal verschijnen tot uw vreugde, zij daarentegen zullen beschaamd worden.", "Matt 6:1-4": "Let op dat u uw aalmoes niet doet voor de mensen, om door hen gezien te worden; anders hebt u geen loon bij uw Vader, Die in de hemelen is. Wanneer u dan aalmoes doet, laat het dan niet voor u uittrompetten, zoals de geveinsden doen in de synagogen en op de straten, opdat zij door de mensen geëerd worden. Voorwaar, Ik zeg u: zij hebben hun loon al ontvangen. Maar als u aalmoes doet, laat uw linkerhand dan niet weten wat uw rechterhand doet;", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Job 34:11": "Want naar het werk van de mens vergeldt Hij hem, en naar ieders weg doet Hij het hem vinden.", "Luk 7:16": "En vrees beving hen allen, en zij verheerlijkten God en zeiden: Een groot Profeet is onder ons opgestaan, en God heeft naar Zijn volk omgezien.", "2 Kor 6:11": "Onze mond is opengegaan tegen u, Korinthiërs, ons hart is verruimd.", "2 Petr 2:5": "en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "1 Tim 4:4": "Want alles wat God geschapen heeft, is goed, en niets is verwerpelijk als het met dankzegging aangenomen wordt;", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "2 Kon 4:42-44": "En er kwam een man van Baäl-Salisa, en bracht de man Gods brood van de eerstelingen, twintig gerstebroden, en groene aren in hun schillen; en hij zei: Geef aan het volk, zodat zij eten. Doch zijn dienaar zei: Wat, zou ik dit aan honderd mannen voorzetten? En hij zei: Geef aan het volk, zodat zij eten; want zo zegt de HEERE: Men zal eten en overhouden. Zo zette hij het hun voor, en zij aten, en zij hielden over, naar het woord van de HEERE.", "Hos 4:6": "Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.", "Openb 11:10": "En zij die op de aarde wonen, die zullen zich verblijden over hen, en zullen vreugde bedrijven, en zullen elkaar geschenken zenden; omdat deze twee profeten hen die op de aarde wonen, gepijnigd hadden.", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "2 Kor 7:9": "Nu verblijd ik mij, niet omdat u bedroefd bent geweest, maar omdat u bedroefd bent geweest tot bekering; want u bent bedroefd geweest naar God, zodat u in geen ding schade van ons geleden hebt.", "Ezech 18:27": "Maar als de goddeloze zich bekeert van zijn goddeloosheid, die hij gedaan heeft, en recht en gerechtigheid doet, die zal zijn ziel in het leven behouden;", "Luk 7:41": "Jezus zei: Een zekere schuldeiser had twee schuldenaars; de één was vijfhonderd penningen schuldig, en de ander vijftig;", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Jes 56:2": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen.", "Deut 24:1-5": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis. En als zij dan uit zijn huis is uitgegaan, zal zij heengaan en een andere man tot vrouw worden, en deze laatste man haar haat, en haar een scheidbrief schrijft, en die in haar hand geeft, en haar uit zijn huis laat gaan; of als deze laatste man, die haar voor zich tot vrouw genomen heeft, sterft;", "Hebr 4:11": "Laat ons ons dan beijveren om die rust in te gaan, opdat niemand in hetzelfde voorbeeld van ongehoorzaamheid valt.", "Hand 6:4": "Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.", "Mark 8:22": "En Hij kwam in Bethsaïda; en zij brachten een blinde bij Hem, en smeekten Hem dat Hij hem zou aanraken.", "Joh 11:42": "Maar Ik wist dat U Mij altijd hoort; maar vanwege de menigte die er omheen staat heb Ik dit gezegd, opdat zij geloven dat U Mij gezonden hebt.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "Ezech 37:23": "En zij zullen zich niet meer verontreinigen met hun drekgoden, en met hun afschuwelijkheden, en met al hun overtredingen; en Ik zal ze verlossen uit al hun woonplaatsen, waarin zij gezondigd hebben, en zal ze reinigen; zo zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Num 15:39": "En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert;", "Micha 7:2": "De goedertierene is verdwenen uit het land, en er is niemand oprecht onder de mensen; zij loeren allemaal op bloed, zij jagen, ieder op zijn broeder, met een jachtnet.", "Ex 20:8-11": "Gedenk de sabbatdag, dat u die heiligt. Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;", "Hand 8:22": "Bekeer u dan van deze slechtheid van u, en bid tot God, of misschien deze overweging van uw hart u vergeven wordt.", "Matt 14:35": "En toen de mannen van die plaats Hem herkenden, stuurden zij berichten naar dat hele omliggende gebied, en zij brachten naar Hem toe allen die ziek waren;", "Luk 13:33": "Maar Ik moet vandaag, morgen en de dag daarna verder reizen; want het kan niet dat een profeet omkomt buiten Jeruzalem.", "Joz 9:14": "Toen namen de mannen van hun reiskost; en zij vroegen het de mond van de HEERE niet.", "Hand 5:12-16": "En door de handen van de apostelen gebeurden veel tekenen en wonderen onder het volk; en zij waren allen eendrachtig in de zuilengang van Salomo. En van de anderen durfde niemand zich bij hen aansluiten; maar het volk hield hen in grote achting. En er werden steeds meer mensen toegevoegd, die de Heere geloofden, menigten zowel van mannen als van vrouwen;", "Joh 18:8": "Jezus antwoordde: Ik heb u gezegd dat Ik het ben. Als u dan Mij zoekt, laat dezen dan gaan.", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "2 Petr 1:16": "Want wij hebben geen kunstig verzonnen fabels nagevolgd, toen wij u de kracht en toekomst van onze Heere Jezus Christus bekendmaakten, maar wij zijn ooggetuigen geweest van Zijn majesteit.", "Joh 11:13": "Maar Jezus had gesproken van zijn dood; zij echter dachten dat Hij sprak van de rust van het slapen.", "Joh 7:46": "De dienaars antwoordden: Nooit heeft een mens zo gesproken, zoals deze Mens.", "Mark 11:18": "En de Schriftgeleerden en de overpriesters hoorden dat, en zochten hoe zij Hem konden doden; want zij waren bang voor Hem, omdat de hele menigte verbaasd was over Zijn onderwijs.", "Jak 2:12": "Spreek zo, en doe zo, als mensen die door de wet van de vrijheid geoordeeld zullen worden.", "Luk 9:13": "Maar Hij zei tegen hen: Geeft u hun te eten. En zij zeiden: Wij hebben niet meer dan vijf broden en twee vissen; of we zouden op pad moeten gaan om voor al dit volk voedsel te kopen.", "Gen 27:41": "En Ezau haatte Jakob om die zegen, waarmee zijn vader hem gezegend had; en Ezau zei in zijn hart: De dagen van rouw om mijn vader komen dichterbij, en ik zal mijn broer Jakob doden.", "Mark 15:35": "En sommigen van hen die daarbij stonden, hoorden dit, en zeiden: Zie, Hij roept Elia.", "Joh 20:9": "Want zij kenden de Schrift nog niet, dat Hij uit de doden moest opstaan.", "Matt 14:24": "En het schip was al midden op de zee, in nood door de golven; want de wind was hun tegen.", "Joh 10:42": "En velen geloofden daar in Hem.", "Luk 6:6": "En het gebeurde ook op een andere sabbat, dat Hij de synagoge inging en leerde. En daar was een man, en zijn rechterhand was verdord.", "Hand 5:21": "Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Ps 110:3": "Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "1 Kor 2:8": "Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben.", "Ef 4:18": "Verduisterd in het verstand, vervreemd van het leven van God, door de onwetendheid die in hen is, door de verharding van hun hart;", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Lev 21:7": "Zij zullen geen vrouw nemen, die een hoer of ontheiligde is, en ook geen vrouw nemen, die van haar man verstoten is; want hij is zijn God heilig.", "Matt 19:1": "En het gebeurde, toen Jezus deze woorden geëindigd had, dat Hij vertrok van Galilea, en kwam over de Jordaan, in de landstreken van Judea.", "Luk 6:21": "Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen.", "Luk 10:7": "En blijf in dat huis, etend en drinkend wat zij u geven; want de arbeider is zijn loon waard. Ga niet van het ene huis naar het andere.", "2 Tim 1:6-13": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen. Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid. Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Hand 20:21": "Terwijl ik zowel Joden als Grieken heb betuigd de bekering tot God en het geloof in onze Heere Jezus Christus.", "1 Sam 28:10": "Saul nu zwoer haar bij de HEERE en zei: Zo waarachtig als de HEERE leeft, u zal geen straf om deze zaak overkomen!", "Ezech 44:15": "Maar de Levitische priesters, de kinderen van Zadok, die de wacht van Mijn heiligdom in acht genomen hebben, toen de kinderen van Israël van Mij afdwaalden, die zullen tot Mij naderen om Mij te dienen; en zullen voor Mijn aangezicht staan om Mij het vette en het bloed te offeren, spreekt de Heere HEERE;", "Jes 31:6": "Bekeer u tot Hem, van Wie de kinderen van Israël diep afgeweken zijn.", "Ps 103:14": "Want Hij weet wat voor maaksel wij zijn, en Hij denkt eraan dat wij stof zijn.", "Joh 16:17": "Sommigen van Zijn discipelen zeiden dan tegen elkaar: Wat betekent dit, dat Hij tegen ons zegt: Nog een korte tijd, en u zult Mij niet zien; en opnieuw een korte tijd, en u zult Mij zien; en: Want Ik ga heen tot de Vader?", "Luk 12:1": "Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.", "2 Kor 1:15": "En op dit vertrouwen wilde ik eerder naar u toe komen, opdat u een tweede keer weldaad zou ontvangen;", "Num 20:13": "Dit zijn de wateren van Meriba, waar de kinderen van Israël met de HEERE getwist hebben; en Hij werd aan hen geheiligd.", "Mark 1:28": "En Zijn faam verspreidde zich meteen door heel de omliggende streek van Galilea.", "Hebr 10:27": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "Joh 20:20": "En toen Hij dit gezegd had, liet Hij hun Zijn handen en Zijn zijde zien. De discipelen dan verheugden zich toen zij de Heere zagen.", "Joh 9:41": "Jezus zei tegen hen: Als u blind was, zou u geen zonde hebben; maar nu zegt u: Wij zien; daarom blijft uw zonde.", "Job 6:10": "Dat zou nog mijn troost zijn, en zou mij verkwikken in de weedom, zo Hij niet spaarde; want ik heb de redenen van de Heilige niet verborgen gehouden.", "Luk 9:2": "En Hij zond hen erop uit om het Koninkrijk van God te prediken, en om de zieken gezond te maken.", "Mark 12:37": "David zelf noemt Hem dan zijn Heere, en hoe is Hij dan zijn Zoon? En de menigte hoorde Hem graag.", "1 Sam 11:11": "Het gebeurde nu de volgende dag, dat Saul het volk in drie groepen indeelde, en zij kwamen midden in het leger, tijdens de morgenwake, en zij versloegen Ammon, totdat de dag heet werd; en het gebeurde dat de overgeblevenen zo verstrooid werden, dat er onder hen geen twee samen bleven.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Luk 21:38": "En al het volk kwam 's morgens vroeg naar Hem toe in de tempel, om Hem te horen.", "Jes 29:10-12": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind. Daarom is voor u elk visioen geworden als de woorden van een verzegeld boek, dat men geeft aan iemand die lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet, want het is verzegeld. Of men geeft het boek aan iemand die niet lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet lezen.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "Rom 2:27": "En zal de voorhuid, die uit de natuur is, als zij de wet volbrengt, u niet oordelen, u die door de letter en besnijdenis een overtreder van de wet bent?", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Luk 24:26": "Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan?", "Mark 14:32-39": "En zij kwamen op een plaats waarvan de naam Gethsémané was, en Hij zei tegen Zijn discipelen: Blijf hier zitten, totdat Ik gebeden zal hebben. En Hij nam Petrus, en Jakobus, en Johannes met Zich mee, en begon zeer ontsteld en angstig te worden; en Hij zei tegen hen: Mijn ziel is zeer bedroefd, tot de dood toe; blijf hier, en waak.", "Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "2 Tess 2:12": "opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "Ef 4:7": "Maar aan ieder van ons is de genade gegeven, naar de maat van de gave van Christus.", "Mark 7:24": "En Hij stond op van daar, en ging weg naar het gebied van Tyrus en Sidon; en Hij ging een huis binnen, en wilde niet dat iemand het wist, maar Hij kon toch niet verborgen blijven.", "Matt 13:58": "En Hij heeft daar niet veel krachten gedaan, vanwege hun ongeloof.", "Hebr 6:1": "Laten wij daarom het beginsel van de leer van Christus achterlaten en doorgaan tot de volmaaktheid; niet opnieuw het fundament leggend van de bekering van dode werken en van het geloof in God,", "Gal 4:8": "Maar toen u God niet kende, diende u hen die van nature geen goden zijn;", "Jes 44:22": "Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer terug tot Mij, want Ik heb u verlost.", "Joh 12:16": "Dit begrepen Zijn discipelen eerst niet; maar toen Jezus verheerlijkt was, toen herinnerden zij zich dat dit van Hem geschreven was, en dat zij dit met Hem gedaan hadden.", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "2 Kron 26:8": "En de Ammonieten gaven Uzzia geschenken; en zijn naam ging tot aan de ingang van Egypte, want hij sterkte zich tot het uiterste.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "1 Kor 1:22": "Omdat de Joden een teken begeren, en de Grieken wijsheid zoeken;", "Joh 15:24": "Als Ik de werken onder hen niet had gedaan, die niemand anders gedaan heeft, hadden zij geen zonde; maar nu hebben zij ze gezien, en hebben zowel Mij als Mijn Vader gehaat.", "Mark 8:28": "En zij antwoordden: Johannes de Doper; en anderen: Elia; en anderen: Een van de profeten.", "Spr 10:21": "De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Ps 95:8-11": "Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn; Waar uw vaders Mij verzochten, Mij beproefden, ook Mijn werk zagen. Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd: Zij zijn een volk dat dwaalt van hart, en zij kennen Mijn wegen niet.", "Matt 15:31": "Zodat de menigten zich verwonderden, toen zij zagen dat de stommen spraken, de lammen gezond waren, de kreupelen liepen, en de blinden zagen; en zij verheerlijkten de God van Israël.", "Mark 4:11": "En Hij zei tegen hen: Aan u is het gegeven het geheimenis van het Koninkrijk van God te verstaan; maar aan hen die buiten zijn, gebeurt dit alles door gelijkenissen;", "Ezech 11:16": "Daarom, zeg: Zo zegt de Heere HEERE: Hoewel Ik hen ver onder de heidenvolken weggedaan heb, en hoewel Ik hen in de landen verstrooid heb, zal Ik hun toch een korte tijd tot een heiligdom zijn, in de landen waar zij naartoe gekomen zijn.", "Num 20:12": "Daarom zei de HEERE tot Mozes en tot Aäron: Omdat u Mij niet geloofd hebt, door Mij te heiligen voor de ogen van de kinderen van Israël, daarom zult u deze gemeente niet brengen in het land, dat Ik hun gegeven heb.", "Lev 20:19-21": "Verder zult u de schaamte van de zuster van uw moeder, en van de zuster van uw vader niet ontdekken; omdat hij zijn naaste bloedverwant ontbloot heeft, zullen zij hun ongerechtigheid dragen. Als ook een man gemeenschap heeft met de vrouw van zijn oom, heeft hij de schaamte van zijn oom ontdekt; zij zullen hun zonde dragen; zonder kinderen zullen zij sterven. En wanneer een man de vrouw van zijn broer neemt, is het onreinheid; hij heeft de schaamte van zijn broer ontdekt; zij zullen zonder kinderen zijn.", "Ef 6:21": "En opdat ook u mag weten hoe het met mij gaat; en wat ik doe, dat alles zal Tychikus u bekendmaken, de geliefde broeder en trouwe dienaar in de Heere;", "Ps 45:4-6": "Gord Uw zwaard aan de heup, o Held! Uw Majesteit en Uw heerlijkheid. En rijd voorspoedig in Uw heerlijkheid, op het woord van de waarheid en rechtvaardige zachtmoedigheid; en Uw rechterhand zal U ontzagwekkende dingen leren. Uw pijlen zijn scherp; volken zullen onder U vallen; zij treffen in het hart van de vijanden van de Koning.", "Matt 8:3": "En Jezus, de hand uitstrekkend, raakte hem aan, en zei: Ik wil, word gereinigd! En meteen werd hij van zijn melaatsheid gereinigd.", "Joh 14:22": "Judas, niet de Iskariot, zei tegen Hem: Heere, hoe komt het dat U Uzelf aan ons zult openbaren, en niet aan de wereld?", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Luk 5:19": "En toen zij vanwege de menigte geen manier vonden om hem naar binnen te brengen, klommen zij op het dak en lieten hem met het draagbed door de dakpannen naar beneden, midden voor Jezus.", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "Joh 6:15-21": "Toen Jezus dan merkte dat zij zouden komen om Hem met geweld mee te nemen, om Hem koning te maken, trok Hij Zich weer terug op de berg, Hijzelf alleen. En toen het avond geworden was, gingen Zijn discipelen naar de zee. En zij gingen in het schip, en voeren over de zee naar Kapernaüm. En het was al donker geworden, en Jezus was nog niet bij hen gekomen.", "Jes 25:4": "Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed tegen een wand.", "Matt 15:23": "Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na.", "Mark 3:14": "En Hij stelde er twaalf aan, opdat zij bij Hem zouden zijn, en opdat Hij hen zou uitzenden om te prediken;", "Luk 7:16-18": "En vrees beving hen allen, en zij verheerlijkten God en zeiden: Een groot Profeet is onder ons opgestaan, en God heeft naar Zijn volk omgezien. En dit gerucht over Hem verspreidde zich in heel Judea, en in heel het omliggende land. En de discipelen van Johannes berichtten hem over al deze dingen.", "2 Kor 1:3-5": "Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting; Die ons vertroost in al onze verdrukking, opdat wij zouden kunnen vertroosten degenen die in allerlei verdrukking zijn, door de vertroosting waarmee wij zelf door God vertroost worden. Want zoals het lijden van Christus overvloedig is in ons, zo is ook door Christus onze vertroosting overvloedig.", "Joh 10:6": "Deze gelijkenis zei Jezus tegen hen; maar zij begrepen niet wat het was dat Hij tegen hen sprak.", "Luk 24:28": "En zij kwamen dichtbij het dorp waar zij naartoe gingen; en Hij deed alsof Hij verder zou gaan.", "Jes 49:7": "Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft.", "Ef 5:8": "Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht.", "Job 36:10": "En Hij opent hun oor voor de tucht, en zegt dat zij zich van de ongerechtigheid moeten bekeren.", "Klaagl 3:31-33": "Caph. Want de Heere zal niet verstoten in eeuwigheid. Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid. Caph. Want Hij plaagt of bedroeft de kinderen van de mensen niet van harte.", "Kol 4:7-11": "Al mijn zaken zal Tychikus u bekendmaken, de geliefde broeder, en trouwe dienaar, en mededienstknecht in de Heere; hem heb ik met dit doel naar u toe gestuurd, opdat hij weet hoe het met u gaat, en uw harten troost; samen met Onesimus, de trouwe en geliefde broeder, die één van u is; zij zullen u alles bekendmaken wat hier gebeurt.", "Deut 29:23": "Dat zijn hele aarde zwavel en zout is van de verbranding; die niet bezaaid zal zijn, en geen spruit zal voortgebracht hebben, en geen kruid daarin zal opgekomen zijn; zoals de omkering van Sodom en Gomorra, Adama en Zeboïm, die de HEERE heeft omgekeerd in Zijn toorn en in Zijn grimmigheid;", "Matt 14:6-11": "Maar toen de verjaardag van Herodes gevierd werd, danste de dochter van Herodias in hun midden, en zij beviel Herodes. Daarom beloofde hij haar met een eed te geven wat zij ook zou vragen. En zij, van tevoren door haar moeder onderricht, zei: Geef mij hier op een schotel het hoofd van Johannes de Doper.", "Hand 3:22": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.", "Matt 14:19": "En Hij beval de menigten neer te zitten op het gras, en nam de vijf broden en de twee vissen, en Hij keek op naar de hemel, zegende ze; en toen Hij ze gebroken had, gaf Hij de broden aan de discipelen, en de discipelen aan de menigten.", "Spr 1:30": "Zij hebben in Mijn raad niet toegestemd; al Mijn bestraffingen hebben zij versmaad;", "Ezech 23:38": "Nog hebben zij Mij dit aangedaan: zij hebben Mijn heiligdom op diezelfde dag verontreinigd, en Mijn sabbatten ontheiligd.", "Ps 15:2": "Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt;", "Ezech 3:14": "Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.", "Gen 21:17": "En God hoorde de stem van de jongen; en de Engel van God riep Hagar toe uit de hemel, en zei tegen haar: Wat is er met u, Hagar? Wees niet bang; want God heeft naar de stem van de jongen geluisterd, op de plaats waar hij is.", "2 Kron 30:6-9": "De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië. En wees niet als uw vaders en als uw broeders, die tegen de HEERE, de God van hun vaderen, ontrouw geweest zijn; daarom heeft Hij hen overgegeven tot verwoesting, zoals u ziet. Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Joh 16:20": "Voorwaar, voorwaar, Ik zeg u: u zult huilen en klagen, maar de wereld zal zich verblijden; en u zult bedroefd zijn, maar uw droefheid zal tot blijdschap worden.", "Hebr 3:16-19": "Want sommigen, toen zij die gehoord hadden, hebben Hem verbitterd, maar niet allen die uit Egypte door Mozes weggetrokken zijn. Over wie nu is Hij veertig jaar lang vertoornd geweest? Was het niet over hen die gezondigd hadden, van wie de lichamen gevallen zijn in de woestijn? En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Spr 1:29": "Omdat zij de wetenschap gehaat hebben, en de vrees van de HEERE niet hebben verkozen.", "Rom 10:7": "Of: wie zal in de afgrond neerdalen? Dat is: om Christus uit de doden op te brengen.", "Joh 7:13": "Toch sprak niemand vrijmoedig over Hem, uit vrees voor de Joden.", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "Jak 5:15": "En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Matt 14:15": "Toen het nu avond werd, kwamen Zijn discipelen naar Hem toe, en zeiden: Deze plaats is eenzaam, en de tijd is nu voorbijgegaan; stuur de menigten weg, zodat zij naar de dorpen gaan en voor zichzelf voedsel kopen.", "Job 34:31": "Zeker heeft hij tot God gezegd: Ik heb Uw straf verdragen, ik zal het niet verderven.", "Deut 10:9": "Daarom heeft Levi geen deel, en ook geen erfdeel met zijn broeders; de HEERE is zijn erfdeel, zoals de HEERE, uw God, tegen hem gesproken heeft.", "Joh 8:27": "Zij begrepen niet dat Hij tot hen over de Vader sprak.", "Jak 5:14": "Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere.", "2 Kon 6:21": "En de koning van Israël zei tegen Elisa, toen hij hen zag: Zal ik hen doden? Zal ik hen doden, mijn vader?", "1 Petr 5:7": "Werp al uw bekommernis op Hem, want Hij zorgt voor u.", "1 Kor 9:4": "Hebben wij geen macht om te eten en te drinken?", "Matt 28:9": "En terwijl zij heengingen om het aan Zijn discipelen te vertellen, zie, Jezus ontmoette hen en zei: Wees gegroet! En zij kwamen naar Hem toe, grepen Zijn voeten, en aanbaden Hem.", "Ps 23:4": "Al ging ik ook in een dal van de schaduw van de dood, ik zou geen kwaad vrezen, want U bent met mij; Uw stok en Uw staf, die troosten mij.", "Matt 10:15": "Voorwaar, Ik zeg u: het zal voor het land van Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Mark 5:27": "Zij had over Jezus gehoord, en kwam van achteren tussen de menigte door, en raakte Zijn kleed aan;", "Num 11:21-23": "En Mozes zei: Zeshonderdduizend man te voet is dit volk, in wiens midden ik ben; en U hebt gezegd: Ik zal hun vlees geven, en zij zullen een hele maand eten! Zullen dan voor hen schapen en runderen geslacht worden, zodat het voor hen genoeg is? Zullen alle vissen van de zee voor hen verzameld worden, zodat het voor hen genoeg is? Maar de HEERE zei tegen Mozes: Zou dan de hand van de HEERE verkort zijn? U zult nu zien of Mijn woord u zal overkomen, of niet.", "Luk 9:1-5": "Jezus riep Zijn twaalf discipelen samen en gaf hun kracht en macht over alle duivelen, en om ziekten te genezen. En Hij zond hen erop uit om het Koninkrijk van God te prediken, en om de zieken gezond te maken. En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Joh 1:5": "En het Licht schijnt in de duisternis, en de duisternis heeft het niet begrepen.", "Deut 9:25-29": "En ik wierp mij neer voor het aangezicht van de HEERE, die veertig dagen en veertig nachten waarin ik mij neerwierp, omdat de HEERE gezegd had dat Hij u verdelgen zou. En ik bad tot de HEERE, en zei: Heere, HEERE, verderf Uw volk en Uw erfdeel niet, dat U door Uw grootheid verlost hebt; dat U uit Egypte door een sterke hand hebt uitgevoerd. Denk aan Uw knechten, Abraham, Izak en Jakob; zie niet op de hardheid van dit volk, noch op zijn goddeloosheid, noch op zijn zonde;", "Luk 4:37": "En het gerucht over Hem verspreidde zich naar alle plaatsen van het omliggende land.", "Matt 8:24": "En zie, er ontstond een grote storm op de zee, zodat het schip door de golven bedekt werd; maar Hij sliep.", "1 Kor 11:24": "en toen Hij gedankt had, brak Hij het, en zei: Neemt, eet, dit is Mijn lichaam, dat voor u gebroken wordt; doe dat tot Mijn gedachtenis.", "Mark 6:7-13": "En Hij riep de twaalf tot Zich, en begon hen twee aan twee uit te zenden, en gaf hun macht over de onreine geesten; En Hij gebood hun dat zij niets zouden meenemen voor onderweg, dan alleen een staf: geen reistas, geen brood, geen geld in de gordel; maar dat zij sandalen zouden aanbinden, en niet met twee stel kleren gekleed zouden zijn.", "Luk 5:17": "En het gebeurde op een van die dagen, terwijl Hij aan het lesgeven was, dat er Farizeeën en leraars van de wet zaten die uit alle dorpen van Galilea en Judea en Jeruzalem gekomen waren; en de kracht van de Heere was er om hen te genezen.", "2 Kor 1:7": "En onze hoop voor u is vast, omdat wij weten dat u, zoals u deel hebt aan het lijden, ook zo deel hebt aan de vertroosting.", "Matt 8:10": "Toen Jezus dit hoorde, verwonderde Hij Zich, en zei tegen hen die Hem volgden: Voorwaar, Ik zeg u, Ik heb zelfs in Israël zo'n groot geloof niet gevonden.", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Luk 19:48": "En zij vonden niet wat zij konden doen, want al het volk hing aan Hem en luisterde naar Hem.", "Deut 32:32": "Want hun wijnstok is uit de wijnstok van Sodom, en uit de velden van Gomorra; hun wijndruiven zijn vergiftige wijndruiven; zij hebben bittere druiventrossen.", "Pred 7:25": "Ik keerde mij om, en mijn hart, om te weten, en om na te sporen, en te zoeken wijsheid en een verklaring; en om te weten de goddeloosheid van de dwaasheid, en de onzinnigheid van de waanzin.", "Matt 14:4": "Want Johannes zei tegen hem: Het is u niet geoorloofd haar te hebben.", "Tit 2:7": "Laat uzelf in alles zien als een voorbeeld van goede werken, in de leer onvervalstheid, deftigheid, oprechtheid;", "Matt 13:54": "En toen Hij in Zijn vaderstad gekomen was, leerde Hij hen in hun synagoge, zodat zij versteld stonden en zeiden: Waar komt bij Deze die wijsheid en die krachten vandaan?", "Mark 13:33-37": "Let op, waak en bid; want u weet niet wanneer de tijd is. Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken; Waak dan (want u weet niet wanneer de heer des huizes zal komen, laat in de avond, of te middernacht, of bij het hanengekraai, of in de ochtend);", "Luk 4:31": "En Hij kwam af naar Kapernaüm, een stad van Galilea, en leerde hen op de sabbatdagen.", "Matt 3:2-12": "en zei: Bekeer u; want het Koninkrijk der hemelen is nabij gekomen. Want deze is het, van wie gesproken is door Jesaja, de profeet, toen hij zei: De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht! En dezelfde Johannes had zijn kleding van kameelhaar, en een leren gordel om zijn middel; en zijn voedsel was sprinkhanen en wilde honing.", "Jes 60:2": "Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden.", "Jer 26:13": "Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Hos 4:1": "Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is;", "2 Tim 3:7": "vrouwtjes die altijd leren, en nooit tot kennis van de waarheid kunnen komen.", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "Mark 9:12": "En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en het zal gebeuren, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden.", "Hand 13:40": "Kijk dan uit, dat over u niet komt wat gezegd is in de profeten:", "Jer 14:11": "Verder zei de HEERE tegen mij: Bid niet voor dit volk ten goede.", "Jer 9:6": "Uw woning is in het midden van bedrog; door bedrog weigeren zij Mij te kennen, spreekt de HEERE.", "Luk 23:34": "En Jezus zei: Vader, vergeef het hun; want zij weten niet wat zij doen. En zij verdeelden Zijn kleren en wierpen erom het lot.", "Spr 1:23": "Keert u tot Mijn bestraffing; ziet, Ik zal Mijn Geest overvloedig over u uitstorten; Ik zal Mijn woorden u bekendmaken.", "Luk 2:49": "En Hij zei tegen hen: Waarom hebt u Mij gezocht? Wist u niet dat Ik moet zijn in de dingen van Mijn Vader?", "2 Kron 6:33": "Hoor U dan uit de hemel, uit de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken der aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Joh 1:11": "Hij is gekomen tot het Zijne, en de Zijnen hebben Hem niet aangenomen.", "2 Tim 2:26": "en zij weer mochten ontwaken uit de strik van de duivel, door wie zij gevangen waren om diens wil te doen.", "Joh 6:71": "En Hij zei dit over Judas, de zoon van Simon, Iskariot; want deze zou Hem verraden, hoewel hij een van de twaalf was.", "Mark 14:22": "En terwijl zij aten, nam Jezus brood, en nadat Hij gezegend had, brak Hij het, en gaf het hun, en zei: Neem, eet, dat is Mijn lichaam.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Fil 1:12-18": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is; Zodat mijn banden in Christus openbaar geworden zijn in het hele rechthuis, en aan alle anderen; En dat het merendeel van de broeders in de Heere, doordat zij vertrouwen gekregen hebben door mijn banden, veel overvloediger het Woord onbevreesd durven spreken.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Ps 147:3": "Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "Joh 8:54": "Jezus antwoordde: Als Ik Mijzelf eer, is Mijn eer niets; Mijn Vader is het, Die Mij eert, van Wie u zegt dat Hij uw God is.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Deut 21:10-14": "Wanneer u uittrekt ten strijde tegen uw vijanden, en de HEERE, uw God, hen in uw hand gegeven heeft, zodat u hun gevangenen gevankelijk wegvoert; En u onder de gevangenen een vrouw ziet die mooi is van uiterlijk, en u naar haar verlangt, zodat u haar tot vrouw wilt nemen; Dan zult u haar in uw huis brengen; en zij zal haar hoofd scheren en haar nagels knippen.", "Rom 10:14": "Hoe zullen zij Hem dan aanroepen, in Wie zij niet geloofd hebben? En hoe zullen zij in Hem geloven, van Wie zij niet gehoord hebben? En hoe zullen zij horen, zonder iemand die hun predikt?", "Ps 15:4": "In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Mark 4:15": "En dezen zijn zij die langs de weg bezaaid worden, waarin het Woord gezaaid wordt; en wanneer zij het gehoord hebben, komt de satan meteen, en neemt het Woord weg, dat in hun hart gezaaid was.", "Hand 4:18-20": "En zij riepen hen en zeiden hun aan, dat zij helemaal niet meer zouden spreken, noch leren, in de Naam van Jezus. Maar Petrus en Johannes antwoordden hun: Oordeelt u zelf, of het recht is voor God, meer naar u te luisteren dan naar God. Want wij kunnen niet nalaten te spreken over wat wij gezien en gehoord hebben.", "Mark 14:29-31": "En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet doen. En Jezus zei tegen hem: Voorwaar, Ik zeg u, dat u heden, in deze nacht, voordat de haan tweemaal gekraaid zal hebben, Mij driemaal zult verloochenen. Maar hij zei des te heftiger: Al moest ik met U sterven, ik zal U geenszins verloochenen! En evenzo zeiden zij ook allen.", "Ps 119:92": "Indien Uw wet niet was geweest al mijn vermaking, was ik in mijn druk al lang vergaan.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Luk 9:12-17": "En de dag begon te dalen; en de twaalf kwamen naar Hem toe en zeiden tegen Hem: Stuur de menigte weg, zodat zij naar de omliggende dorpen en gehuchten kunnen gaan om onderdak te vinden en voedsel, want hier zijn wij op een eenzame plaats. Maar Hij zei tegen hen: Geeft u hun te eten. En zij zeiden: Wij hebben niet meer dan vijf broden en twee vissen; of we zouden op pad moeten gaan om voor al dit volk voedsel te kopen. Want er waren ongeveer vijfduizend mannen. Maar Hij zei tegen Zijn discipelen: Laat hen neerzitten in groepen van vijftig.", "Hand 18:4": "En hij sprak op elke sabbat in de synagoge, en bracht Joden en Grieken tot geloof.", "Ezech 3:18": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen.", "Jes 54:11": "U verdrukte, door onweer voortgedrevene, ongetrooste! Zie, Ik zal uw stenen helemaal sierlijk leggen, en Ik zal u op saffieren grondvesten.", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Ps 34:21": "Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken.", "Mark 1:38": "En Hij zei tegen hen: Laten wij naar de naburige plaatsen gaan, opdat Ik ook daar predik; want daarvoor ben Ik uitgegaan.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Openb 10:5": "En de engel die ik zag staan op de zee en op de aarde, hief zijn hand op naar de hemel.", "1 Petr 2:8": "En een steen des aanstoots, en een rots der ergernis; namelijk voor hen die zich aan het Woord stoten, ongehoorzaam als zij zijn, waartoe zij ook bestemd zijn.", "Hand 13:50": "Maar de Joden zetten de godsdienstige en aanzienlijke vrouwen op, en de voornaamsten van de stad, en verwekten vervolging tegen Paulus en Barnabas, en verdreven hen uit hun gebied.", "Joh 8:30": "Toen Hij deze dingen sprak, geloofden velen in Hem.", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "2 Kron 24:16": "En zij begroeven hem in de stad van David, bij de koningen; want hij had goed gedaan in Israël, zowel aan God als aan Zijn huis.", "Matt 12:36": "Maar Ik zeg u, dat van elk nutteloos woord dat de mensen zullen hebben gesproken, zij daarvan rekenschap zullen geven op de dag van het oordeel.", "Luk 8:56": "En haar ouders stonden versteld; en Hij beval hun aan niemand te vertellen wat er gebeurd was.", "2 Tim 2:1-26": "U dan, mijn zoon, word gesterkt in de genade die in Christus Jezus is; en wat u van mij gehoord hebt onder veel getuigen, vertrouw dat toe aan trouwe mensen, die bekwaam zullen zijn om ook anderen te leren. Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus.", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Ex 16:23-30": "Hij dan zei tegen hen: Dit is het, wat de HEERE gesproken heeft: Morgen is de rustdag, de heilige sabbat van de HEERE! Wat u bakken wilt, bak dat, en kook wat u koken wilt; en al wat overblijft, legt dat voor uzelf weg in bewaring tot de morgen. En zij legden het weg tot de morgen, zoals Mozes geboden had; en het stonk niet, en er zat geen worm in. Toen zei Mozes: Eet dat vandaag, want vandaag is het de sabbat van de HEERE; vandaag zult u het op het veld niet vinden.", "Luk 5:16": "Maar Hij trok Zich terug in de woestijnen en bad daar.", "Ex 3:7": "En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "Joh 14:24": "Wie Mij niet liefheeft, bewaart Mijn woorden niet; en het woord dat u hoort, is niet het Mijne, maar dat van de Vader, Die Mij gezonden heeft.", "Ezech 18:21-23": "Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en recht en gerechtigheid doet, hij zal zeker leven, hij zal niet sterven. Al zijn overtredingen, die hij gedaan heeft, zullen hem niet aangerekend worden; door zijn gerechtigheid, die hij gedaan heeft, zal hij leven. Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "Joh 1:25": "En zij vroegen hem en zeiden tegen hem: Waarom doopt u dan, als u de Christus niet bent, ook Elia niet, en ook de profeet niet?", "Mark 16:20": "En zij gingen heen, en predikten overal, en de Heere werkte mee, en bevestigde het Woord door tekenen die daarop volgden. Amen.", "Luk 10:13": "Wee u, Chorazin, wee u, Bethsaïda, want als in Tyrus en Sidon de krachten waren gebeurd die in u gebeurd zijn, zouden zij zich allang, in zak en as zittend, bekeerd hebben.", "2 Kron 16:10": "Doch Asa werd toornig tegen de ziener, en zette hem in de gevangenis; want hij was hierover tegen hem ontstemd; daarbij onderdrukte Asa sommigen uit het volk op dezelfde tijd.", "Ps 103:13": "Zoals een vader zich ontfermt over zijn kinderen, ontfermt de HEERE Zich over hen die Hem vrezen.", "Mark 6:7-11": "En Hij riep de twaalf tot Zich, en begon hen twee aan twee uit te zenden, en gaf hun macht over de onreine geesten; En Hij gebood hun dat zij niets zouden meenemen voor onderweg, dan alleen een staf: geen reistas, geen brood, geen geld in de gordel; maar dat zij sandalen zouden aanbinden, en niet met twee stel kleren gekleed zouden zijn.", "Fil 3:20": "Maar onze wandel is in de hemelen, waaruit wij ook de Zaligmaker verwachten, namelijk de Heere Jezus Christus;", "1 Joh 4:8": "Wie niet liefheeft, kent God niet; want God is liefde.", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Ps 41:4": "De HEERE zal hem ondersteunen op het ziekbed; in zijn ziekte verandert U zijn hele leger.", "Luk 12:48": "Maar wie het niet geweten heeft, en dingen gedaan heeft die slagen verdienen, die zal met weinig slagen geslagen worden. En ieder aan wie veel gegeven is, van hem zal veel geëist worden; en aan wie men veel toevertrouwd heeft, van hem zal men des te meer eisen.", "Luk 13:10": "En Hij gaf onderwijs op de sabbat in een van de synagogen.", "2 Sam 5:11": "En Hiram, de koning van Tyrus, zond boden naar David, en cederhout, en timmerlieden, en metselaars; en zij bouwden David een huis.", "Ef 6:15": "en de voeten geschoeid met bereidheid van het Evangelie van de vrede;", "Ps 119:50": "Dit is mijn troost in mijn ellende, want Uw toezegging heeft mij levend gemaakt.", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Matt 23:26": "Blinde Farizeeër, reinig eerst wat binnen in de drinkbeker en de schotel is, opdat ook de buitenkant daarvan rein wordt.", "Jer 31:9": "Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "Luk 9:1-6": "Jezus riep Zijn twaalf discipelen samen en gaf hun kracht en macht over alle duivelen, en om ziekten te genezen. En Hij zond hen erop uit om het Koninkrijk van God te prediken, en om de zieken gezond te maken. En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Jes 27:11": "Als haar takken verdord zijn, zullen ze afgebroken worden, en de vrouwen zullen komen en ze aansteken; want het is een volk zonder enig verstand; daarom zal Hij, Die het gemaakt heeft, Zich niet over hen ontfermen, en Die het geformeerd heeft, zal hun geen genade bewijzen.", "1 Petr 5:3": "ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.", "Openb 5:12": "die met een luide stem zeiden: Het Lam, Dat geslacht is, is waard te ontvangen de kracht, en rijkdom, en wijsheid, en sterkte, en eer, en heerlijkheid, en dankzegging.", "Hand 13:41": "Zie, u verachters, verwonder u, en verdwijn; want Ik doe een werk in uw dagen, een werk dat u beslist niet zult geloven, ook al vertelt iemand het u.", "Mark 3:7": "En Jezus vertrok met Zijn discipelen naar de zee; en een grote menigte volgde Hem, van Galilea en van Judea,", "Ps 145:14": "Samech. De HEERE ondersteunt allen die vallen, en Hij richt op alle gebogenen.", "Pred 7:9": "Wees niet haastig in uw geest om te toornen; want de toorn rust in de boezem van de dwazen.", "Joh 6:61": "Jezus, die bij Zichzelf wist dat Zijn discipelen daarover morden, zei tegen hen: Ergert dit u?", "Luk 22:35": "En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.", "Mark 15:47": "En Maria Magdalena, en Maria, de moeder van Joses, keken toe waar Hij gelegd werd.", "Luk 10:4": "Neem geen buidel mee, geen reistas, geen schoenen; en groet niemand onderweg.", "Spr 18:22": "Wie een vrouw gevonden heeft, heeft iets goeds gevonden, en hij heeft welgevallen verkregen van de HEERE.", "Mark 9:31": "Want Hij onderwees Zijn discipelen, en zei tegen hen: De Zoon des mensen zal overgeleverd worden in de handen van mensen, en zij zullen Hem doden, en nadat Hij gedood is, zal Hij op de derde dag weer opstaan.", "2 Kon 3:13": "Maar Elisa zei tegen de koning van Israël: Wat heb ik met u te doen? Ga naar de profeten van uw vader, en naar de profeten van uw moeder. Doch de koning van Israël zei tegen hem: Nee, want de HEERE heeft deze drie koningen bij elkaar geroepen, om hen in de hand van de Moabieten te geven.", "Luk 15:7": "Ik zeg u, dat er zo blijdschap zal zijn in de hemel over één zondaar die zich bekeert, meer dan over negenennegentig rechtvaardigen, die de bekering niet nodig hebben.", "Hand 1:1": "Het eerste boek heb ik gemaakt, o Theofilus, over alles wat Jezus begonnen heeft te doen en te leren,", "Mark 16:15": "En Hij zei tegen hen: Ga heen in de hele wereld, predik het Evangelie aan alle schepselen.", "Joh 17:1-26": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt. Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft. En dit is het eeuwige leven, dat zij U kennen, de enige waarachtige God, en Jezus Christus, Die U gezonden hebt.", "1 Tim 3:1-16": "Dit is een betrouwbaar woord: als iemand ernaar verlangt opziener te worden, begeert hij een voortreffelijk werk. Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren; niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "Luk 9:5": "En wie u niet zullen ontvangen, schud bij het weggaan uit die stad het stof van uw voeten af, tot een getuigenis tegen hen.", "2 Tess 3:2": "En opdat wij verlost mogen worden van de ongeschikte en boze mensen; want het geloof is niet ieders deel.", "1 Kor 2:14": "Maar de natuurlijke mens begrijpt niet de dingen die van de Geest van God zijn; want ze zijn hem dwaasheid, en hij kan ze niet verstaan, omdat ze geestelijk beoordeeld worden.", "2 Tess 3:7-9": "Want u zelf weet hoe men ons behoort na te volgen; want wij hebben ons niet ongeregeld gedragen onder u; En wij hebben geen brood bij iemand gegeten voor niets, maar in arbeid en moeite, nacht en dag werkend, opdat wij niemand van u lastig zouden zijn; Niet dat wij de macht niet hebben, maar opdat wij onszelf u zouden geven tot een voorbeeld, om ons na te volgen.", "Matt 5:33-37": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden. Maar Ik zeg u: zweer helemaal niet, noch bij de hemel, omdat hij de troon van God is; noch bij de aarde, omdat zij de voetbank van Zijn voeten is; noch bij Jeruzalem, omdat zij de stad van de grote Koning is;", "Joh 2:23": "En toen Hij te Jeruzalem was, op het Pascha, tijdens het feest, geloofden velen in Zijn Naam, omdat zij Zijn tekenen zagen die Hij deed.", "2 Kor 7:6": "Doch God, Die de nederigen vertroost, heeft ons getroost door de komst van Titus.", "Jes 59:17": "Want Hij trok gerechtigheid aan als een pantser, en de helm van het heil zette Hij op Zijn hoofd, en de kleren van de wraak trok Hij aan als kleding, en Hij deed de ijver aan als een mantel.", "Mark 8:34": "En Hij riep de menigte tot Zich, samen met Zijn discipelen, en zei tegen hen: Wie achter Mij aan wil komen, die verloochent zichzelf, en neemt zijn kruis op, en volgt Mij.", "Ex 3:5": "En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land.", "Luk 13:6-9": "En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit? En hij antwoordde en zei tegen hem: Heer, laat hem ook dit jaar nog staan, totdat ik om hem heen gegraven en mest gelegd zal hebben;", "Luk 9:44": "Neem deze woorden ter harte: want de Zoon des mensen zal overgeleverd worden in de handen van mensen.", "1 Tim 4:2": "door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;", "2 Tim 2:25": "met zachtmoedigheid onderwijzend hen die tegenstand bieden; of God hun misschien op enig moment bekering zou geven tot erkenning van de waarheid;", "Tit 1:16": "Zij belijden dat zij God kennen, maar zij verloochenen Hem met hun werken, omdat zij verfoeilijk zijn en ongehoorzaam, en voor
