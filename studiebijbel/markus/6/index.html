 elk goed werk ongeschikt.", "Joh 6:2": "En een grote menigte volgde Hem, omdat zij Zijn tekenen zagen, die Hij deed aan de zieken.", "Matt 11:26": "Ja, Vader! Want zo is het welbehagen geweest voor U.", "Jer 8:7-9": "Zelfs een ooievaar aan de hemel kent zijn vaste tijden, en een tortelduif, en kraanvogel, en zwaluw, nemen de tijd van hun aankomst waar; maar Mijn volk kent het recht van de HEERE niet. Hoe zegt u dan: Wij zijn wijs en de wet van de HEERE is bij ons! Zie, waarlijk, tevergeefs werkt de valse pen van de schriftgeleerden. De wijzen zijn beschaamd, verschrikt en gevangen; zie, zij hebben het woord van de HEERE verworpen; wat wijsheid zouden zij dan hebben?", "Matt 14:2": "en hij zei tegen zijn knechten: Deze is Johannes de Doper; hij is opgewekt van de doden, en daarom werken die krachten in Hem.", "Hos 10:12": "Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.", "Jes 46:8": "Denk hieraan, en wees kloek, breng het weer in het hart, o overtreders!", "1 Tim 3:12": "Laat de diakenen mannen van één vrouw zijn, die hun kinderen en hun eigen huizen goed besturen.", "Luk 14:1-6": "En het gebeurde, toen Hij in het huis van een van de leiders van de Farizeeën gekomen was, op de sabbat, om brood te eten, dat zij Hem in de gaten hielden. En zie, er was een zeker waterzuchtig mens voor Hem. En Jezus antwoordde en zei tegen de wetgeleerden en Farizeeën: Is het ook geoorloofd op de sabbat gezond te maken?", "Joh 12:48": "Wie Mij verwerpt en Mijn woorden niet ontvangt, heeft iemand die hem oordeelt; het woord dat Ik gesproken heb, dat zal hem oordelen op de laatste dag.", "Mark 10:9": "Wat God dan samengevoegd heeft, laat de mens dat niet scheiden.", "Matt 5:15": "Ook steekt men geen kaars aan om die onder een korenmaat te zetten, maar op een kandelaar, en zij schijnt voor allen die in het huis zijn.", "Hand 3:19": "Kom dus tot inkeer en bekeer u, opdat uw zonden uitgewist worden, wanneer de tijden van verkwikking gekomen zijn van het aangezicht van de Heere,", "Matt 26:42": "Opnieuw, voor de tweede keer, ging Hij heen en bad, en zei: Mijn Vader! Als deze drinkbeker niet aan Mij voorbij kan gaan zonder dat Ik hem drink, laat Uw wil dan gebeuren!", "Job 34:32": "Behalve wat ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "Hebr 2:15": "en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren.", "Mal 4:5": "Zie, Ik zend u de profeet Elia, voordat die grote en vreselijke dag van de HEERE komt.", "Jak 1:7": "Want laat die mens niet menen dat hij iets ontvangen zal van de Heere.", "Jes 30:19": "Want het volk zal in Sion wonen, te Jeruzalem; u zult helemaal niet wenen; zeker zal Hij u genadig zijn op de stem van uw geroep; zodra Hij het horen zal, zal Hij u antwoorden.", "Joh 4:44": "want Jezus heeft Zelf getuigd dat een profeet in zijn eigen vaderland geen eer heeft.", "Hebr 6:4-8": "Want het is onmogelijk om hen die eens verlicht zijn geweest, en de hemelse gave geproefd hebben, en deelgenoot geworden zijn van de Heilige Geest, en het goede woord van God geproefd hebben, en de krachten van de toekomende eeuw, en die afvallig worden, opnieuw te vernieuwen tot bekering, omdat zij voor zichzelf de Zoon van God opnieuw kruisigen en openlijk te schande maken.", "1 Tess 4:4": "Dat ieder van u weet zijn eigen lichaam te bezitten in heiliging en eer;", "Joh 1:10": "Hij was in de wereld, en de wereld is door Hem gemaakt; en de wereld heeft Hem niet gekend.", "Joh 6:21": "Zij namen Hem dan gewillig in het schip; en meteen kwam het schip aan bij het land waar zij naartoe voeren.", "Luk 13:31": "Op diezelfde dag kwamen er enige Farizeeën naar Hem toe, die zeiden: Ga weg en vertrek van hier, want Herodes wil U doden.", "Luk 9:16": "En Hij nam de vijf broden en de twee vissen, keek op naar de hemel, zegende ze, brak ze, en gaf ze aan de discipelen om ze aan de menigte voor te leggen.", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "Ezech 11:18-20": "En zij zullen daarheen komen, en al de verfoeiselen daarvan en al de gruwelen daarvan van daar wegdoen. En Ik zal hun één hart geven, en Ik zal een nieuwe geest in uw binnenste geven; en Ik zal het stenen hart uit hun vlees wegnemen, en zal hun een hart van vlees geven; Opdat zij wandelen in Mijn inzettingen, en Mijn rechten bewaren en die doen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Ps 119:52": "Ik heb gedacht, o HEERE! aan Uw oordelen van oudsher, en heb mij getroost.", "Jes 49:13": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Gal 6:6": "En wie onderwezen wordt in het Woord, moet delen van alle goederen met hem die hem onderwijst.", "Est 2:18": "Toen maakte de koning een grote maaltijd voor al zijn vorsten en zijn knechten, de maaltijd van Esther; en hij gaf de landschappen rust, en hij gaf geschenken naar het vermogen van de koning.", "Mark 14:27-31": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden. Maar nadat Ik zal zijn opgestaan, zal Ik u voorgaan naar Galilea. En Petrus zei tegen Hem: Al zouden zij allen aanstoot nemen, ik zal het toch niet doen.", "Joh 8:15": "U oordeelt naar het vlees; Ik oordeel niemand.", "Hebr 2:17": "Daarom moest Hij in alles aan Zijn broeders gelijk worden, opdat Hij een barmhartig en getrouw Hogepriester zou zijn in de dingen die bij God gedaan moeten worden, om de zonden van het volk te verzoenen.", "Joh 10:21": "Anderen zeiden: Dit zijn geen woorden van iemand die bezeten is; kan een duivel soms de ogen van blinden openen?", "2 Kor 8:9": "Want u kent de genade van onze Heere Jezus Christus, dat Hij om uwentwil arm geworden is, terwijl Hij rijk was, opdat u door Zijn armoede rijk zou worden.", "2 Petr 2:20": "Want als zij, nadat zij door de kennis van de Heere en Zaligmaker Jezus Christus aan de besmettingen van de wereld ontkomen zijn, daar opnieuw in verstrikt raken en erdoor overwonnen worden, dan is voor hen het laatste erger geworden dan het eerste.", "Lev 20:17": "En als een man zijn zuster, de dochter van zijn vader, of de dochter van zijn moeder, neemt, en hij haar schaamte ziet, en zij zijn schaamte ziet, is het een schandvlek; daarom zullen zij voor de ogen van de kinderen van hun volk uitgeroeid worden; hij heeft de schaamte van zijn zuster ontdekt, hij zal zijn ongerechtigheid dragen.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Hand 19:9": "Maar toen sommigen verhard werden en ongehoorzaam waren, en kwaadspraken van de weg des Heeren voor de menigte, ging hij bij hen weg, en zonderde de discipelen af, dagelijks sprekend in de school van een zekere Tyrannus.", "Joh 12:9": "Een grote menigte van de Joden merkte dan dat Hij daar was; en zij kwamen niet alleen om Jezus, maar ook om Lazarus te zien, die Hij uit de doden had opgewekt.", "Matt 12:29": "Of hoe kan iemand het huis van een sterke man binnengaan en zijn bezittingen roven, als hij niet eerst de sterke man vastbindt? En dan pas zal hij zijn huis beroven.", "1 Joh 1:6": "Als wij zeggen dat wij gemeenschap met Hem hebben, en wij in de duisternis wandelen, dan liegen wij, en doen de waarheid niet.", "Jer 13:17": "Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.", "Ex 28:12": "En u zult de twee stenen aan de schouderbanden van de efod zetten, als stenen ter gedachtenis voor de kinderen van Israël; en Aäron zal hun namen op zijn beide schouders dragen, ter gedachtenis, voor het aangezicht van de HEERE.", "Matt 21:26": "En als wij zeggen: Van de mensen, dan zijn wij bang voor de menigte, want zij houden Johannes allemaal voor een profeet.", "Rom 4:20": "En hij heeft aan de belofte van God niet getwijfeld door ongeloof; maar is gesterkt geweest in het geloof, en heeft God de eer gegeven;", "Jes 14:32": "Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben.", "Ps 62:2": "Zeker, mijn ziel is stil bij God; van Hem is mijn heil.", "Matt 21:38-45": "Maar toen de landbouwers de zoon zagen, zeiden zij onder elkaar: Deze is de erfgenaam, kom, laten we hem doden en zijn erfenis voor onszelf houden. En zij grepen hem, wierpen hem de wijngaard uit, en doodden hem. Wanneer dan de heer van de wijngaard komt, wat zal hij die landbouwers doen?", "Ps 95:8": "Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn;", "Joh 14:18": "Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Matt 12:23": "En alle menigten waren buiten zichzelf, en zeiden: Is dit niet de Zoon van David?", "2 Kor 4:3": "Maar als ons Evangelie ook bedekt is, dan is het bedekt bij hen die verloren gaan;", "Klaagl 3:57": "Koph. U bent tot mij genaderd op de dag dat ik U aanriep; U hebt gezegd: Vrees niet!", "Neh 1:9": "Maar als u zich tot Mij bekeert, en Mijn geboden houdt, en die doet; al waren uw verdrevenen aan het einde van de hemel, Ik zal hen vandaar verzamelen, en zal ze brengen naar de plaats die Ik gekozen heb om Mijn Naam daar te doen wonen.", "Matt 13:53-58": "En het gebeurde, toen Jezus deze gelijkenissen geëindigd had, dat Hij vandaar vertrok. En toen Hij in Zijn vaderstad gekomen was, leerde Hij hen in hun synagoge, zodat zij versteld stonden en zeiden: Waar komt bij Deze die wijsheid en die krachten vandaan? Is Dit niet de zoon van de timmerman? Heet Zijn moeder niet Maria, en Zijn broers Jakobus en Joses, en Simon en Judas?", "Num 18:20": "Ook zei de HEERE tegen Aäron: U zult in hun land niet erven, en u zult geen deel te midden van hen hebben; Ik ben uw deel en uw erfenis, te midden van de kinderen van Israël.", "Matt 4:23": "En Jezus trok rond door heel Galilea, en Hij onderwees in hun synagogen en predikte het Evangelie van het Koninkrijk, en genas alle ziekte en alle kwaal onder het volk.", "Joh 3:20": "Want ieder die kwaad doet, haat het licht en komt niet tot het licht, opdat zijn werken niet bestraft worden.", "Matt 10:1": "Toen Hij Zijn twaalf discipelen bij Zich geroepen had, gaf Hij hun macht over de onreine geesten, om ze uit te werpen, en om alle ziekte en alle kwaal te genezen.", "Matt 12:37": "Want uit uw woorden zult u gerechtvaardigd worden, en uit uw woorden zult u veroordeeld worden.", "Jes 44:18-20": "Zij weten niet, en begrijpen niet, want het heeft hun ogen dichtgesmeerd, zodat zij niet zien, en hun harten, zodat zij niet begrijpen. En niemand van hen brengt het in zijn hart, en er is geen kennis en geen verstand, zodat hij zou zeggen: De helft daarvan heb ik verbrand in het vuur, ja, ook op de kolen daarvan heb ik brood gebakken, ik heb vlees daarbij gebraden, en heb het gegeten; en zou ik het overblijfsel daarvan tot een gruwel maken, zou ik neerknielen voor iets dat van een boom gekomen is? Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?", "Matt 14:13": "Toen Jezus dit hoorde, vertrok Hij vandaar met een boot naar een eenzame plaats, alleen; en de menigten, die dat hoorden, zijn Hem te voet gevolgd, vanuit de steden.", "Hos 2:10": "En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "Matt 15:14": "Laat hen gaan; zij zijn blinde leiders van blinden. Als nu de blinde de blinde leidt, zullen zij beiden in de gracht vallen.", "Luk 11:49-51": "Daarom zegt ook de wijsheid van God: Ik zal profeten en apostelen naar hen toe zenden, en van hen zullen zij sommigen doden en sommigen vervolgen; Opdat van dit geslacht opgeëist wordt het bloed van al de profeten, dat vergoten is vanaf de grondlegging van de wereld. Van het bloed van Abel tot het bloed van Zacharia, die omgekomen is tussen het altaar en het huis van God; ja, Ik zeg u, het zal opgeëist worden van dit geslacht!", "Hand 5:15": "zodat zij de zieken uitdroegen op de straten, en legden hen op bedden en matten, opdat, als Petrus kwam, ook maar de schaduw iemand van hen zou mogen beschaduwen.", "Mark 3:21": "En toen zijn verwanten dit hoorden, gingen zij eropuit om Hem vast te houden; want zij zeiden: Hij is buiten zichzelf.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Matt 3:2": "en zei: Bekeer u; want het Koninkrijk der hemelen is nabij gekomen.", "1 Kon 13:29": "Toen nam de profeet het dode lichaam van de man van God op, en legde het op de ezel, en bracht het terug; zo kwam de oude profeet in de stad om rouw te bedrijven en hem te begraven.", "Luk 1:15-17": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot. En hij zal velen van de kinderen van Israël bekeren tot de Heere, hun God. En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Deut 5:5": "(ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei:", "1 Tess 2:9": "Want u herinnert zich, broeders, onze inspanning en moeite; want terwijl wij nacht en dag werkten, om niemand van u tot last te zijn, hebben wij het Evangelie van God onder u gepredikt.", "Ezech 33:10-12": "Daarom, mensenkind! Zeg tegen het huis van Israël: U spreekt zo en zegt: Omdat onze overtredingen en onze zonden op ons zijn, en wij daarin wegkwijnen, hoe zouden wij dan leven? Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël? U dan, o mensenkind! Zeg tegen de kinderen van uw volk: De gerechtigheid van de rechtvaardige zal hem niet redden op de dag van zijn overtreding; en wat de goddeloosheid van de goddeloze betreft, hij zal er niet om vallen op de dag dat hij zich van zijn goddeloosheid bekeert; en de rechtvaardige zal niet kunnen leven door zijn gerechtigheid, op de dag dat hij zondigt.", "Mark 15:36": "En er liep iemand, en vulde een spons met azijn, en stak die op een rietstok, en gaf Hem te drinken, en zei: Laat staan, laten we zien of Elia komt om Hem eraf te halen.", "Ps 69:21": "De smaad heeft mijn hart gebroken, en ik ben zeer zwak; en ik heb gewacht op medelijden, maar er is geen; en op vertroosters, maar heb ze niet gevonden.", "1 Kon 8:32": "hoor Ú dan in de hemel, en doe, en oordeel Uw dienaren, veroordeel de onrechtvaardige door zijn weg op zijn hoofd te leggen, en verklaar de rechtvaardige rechtvaardig door hem te geven naar zijn gerechtigheid.", "Joh 11:41": "Zij namen dan de steen weg, waar de gestorvene lag. En Jezus hief de ogen omhoog, en zei: Vader, Ik dank U dat U Mij gehoord hebt.", "Matt 14:33": "Zij die in het schip waren, kwamen en aanbaden Hem, en zeiden: Werkelijk, U bent Gods Zoon!", "Jes 7:9": "Ondertussen zal Samaria het hoofd van Efraïm zijn, en de zoon van Remalia het hoofd van Samaria. Als u niet gelooft, zult u zeker niet standhouden.", "1 Tess 1:2-8": "Wij danken God altijd voor u allen, terwijl wij aan u denken in onze gebeden; Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader; Wij weten, geliefde broeders, dat u door God uitgekozen bent;", "Luk 11:23-26": "Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit. Wanneer de onreine geest van de mens is uitgevaren, gaat hij door dorre plaatsen, op zoek naar rust; en als hij die niet vindt, zegt hij: Ik zal terugkeren naar mijn huis, waar ik uit vandaan kwam. En als hij komt, vindt hij het schoongeveegd en op orde gebracht.", "Hand 20:34": "En u weet zelf, dat deze handen gediend hebben voor mijn behoeften, en voor die van hen die met mij waren.", "Hand 15:21": "Want Mozes heeft van oude tijden af in elke stad mensen die hem prediken, en hij wordt elke sabbat in de synagogen gelezen.", "Joh 10:20": "En velen van hen zeiden: Hij heeft een duivel, en is buiten zinnen; waarom luistert u naar Hem?", "Hand 13:51": "Doch zij schudden het stof van hun voeten tegen hen af, en kwamen te Ikonium.", "Neh 13:15-22": "In diezelfde dagen zag ik in Juda mensen die persen traden op de sabbat, en die garven binnenbrachten, die zij op ezels laadden; alsook wijn, druiven en vijgen, en allerlei last, die zij op de sabbatdag naar Jeruzalem binnenbrachten; en ik waarschuwde hen op de dag dat zij eetwaren verkochten. Daar woonden ook Tyriërs binnen, die vis aanbrachten, en allerlei koopwaren, die zij op de sabbat verkochten aan de kinderen van Juda en in Jeruzalem. Zo twistte ik met de edelen van Juda, en zei tegen hen: Wat voor een slechte zaak is dit, die u doet, en waarmee u de sabbatdag ontheiligt?", "Mark 8:18": "Ogen hebbend, ziet u niet? En oren hebbend, hoort u niet?", "Matt 21:33-36": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland. Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen. En de landbouwers grepen zijn dienstknechten en sloegen de een, en doodden een ander, en stenigden een derde.", "Ex 28:29": "Zo zal Aäron de namen van de zonen van Israël dragen aan de borstlap van het gericht, op zijn hart, als hij in het heilige zal gaan, ter gedachtenis voor het aangezicht van de HEERE, voortdurend.", "Openb 10:6": "En hij zwoer bij Hem Die leeft in alle eeuwigheid, Die de hemel geschapen heeft en wat daarin is, en de aarde en wat daarin is, en de zee en wat daarin is, dat er geen tijd meer zal zijn;", "Matt 6:16-25": "En wanneer u vast, toon dan geen droevig gezicht, zoals de geveinsden; want zij mismaken hun gezicht, opdat zij door de mensen gezien worden als zij vasten. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben. Maar u, als u vast, zalf dan uw hoofd en was uw gezicht; opdat het niet door de mensen gezien wordt dat u vast, maar door uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.", "Luk 22:51": "En Jezus antwoordde en zei: Laat het hierbij; en Hij raakte zijn oor aan en genas hem.", "Joh 3:31": "Wie van boven komt, is boven allen; wie uit de aarde is voortgekomen, die is uit de aarde en spreekt uit de aarde. Wie uit de hemel komt, is boven allen.", "2 Kron 6:36-39": "Wanneer zij tegen U gezondigd zullen hebben (want er is geen mens die niet zondigt), en U tegen hen vertoornd zult zijn, en hen zult overleveren aan de vijand, zodat degenen die hen gevangen hebben, hen gevankelijk wegvoeren naar een land dat ver weg of nabij is; En zij in het land waar zij gevankelijk weggevoerd zijn, tot inkeer komen, en zich bekeren, en tot U smeken in het land van hun gevangenschap, en zeggen: Wij hebben gezondigd, verkeerd gedaan, en goddeloos gehandeld; En zij zich tot U bekeren, met hun gehele hart en met hun gehele ziel, in het land van hun gevangenschap, waarheen zij hen gevankelijk weggevoerd hebben, en bidden zullen in de richting van hun land, dat U hun vaderen gegeven hebt, en naar deze stad die U verkoren hebt, en naar dit huis dat ik voor Uw Naam gebouwd heb;", "Num 5:19-24": "En de priester zal haar beëdigen, en zal tegen die vrouw zeggen: Als niemand bij u gelegen heeft, en als u, onder uw man zijnde, niet afgeweken bent tot onreinheid, wees vrij van dit bittere water dat de vloek meebrengt! Maar als u, onder uw man zijnde, afgeweken bent, en als u onrein geworden bent, doordat een man bij u gelegen heeft, behalve uw man: (Dan zal de priester die vrouw met de eed van de vervloeking beëdigen, en de priester zal tegen die vrouw zeggen:) De HEERE stelt u tot een vloek en tot een eed, in het midden van uw volk, doordat de HEERE uw heup laat vervallen, en uw buik laat zwellen;", "Matt 22:34-40": "En toen de Farizeeën hoorden dat Hij de Sadduceeën de mond gestopt had, werden zij bijeengebracht. En een van hen, een wetgeleerde, stelde Hem een vraag om Hem op de proef te stellen, en zei: Meester! Welk gebod is het grootste in de wet?", "Deut 18:2": "Daarom zal hij geen erfdeel hebben tussen zijn broeders; de HEERE is zijn Erfdeel, zoals Hij tot hem gesproken heeft.", "1 Joh 3:6": "Ieder die in Hem blijft, zondigt niet; ieder die zondigt, heeft Hem niet gezien en heeft Hem niet gekend.", "Matt 21:8-11": "En de meeste van de menigte spreidden hun kleren op de weg, en anderen hakten takken van de bomen en spreidden ze op de weg. En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen! En toen Hij Jeruzalem binnenkwam, raakte de hele stad in opschudding en men zei: Wie is Deze?", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "Joh 15:18": "Als de wereld u haat, weet dan, dat zij Mij eerder dan u gehaat heeft.", "Jes 8:14": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.", "Matt 26:31-35": "Toen zei Jezus tegen hen: U zult allen deze nacht aan Mij geërgerd worden; want er is geschreven: Ik zal de Herder slaan, en de schapen van de kudde zullen verstrooid worden. Maar nadat Ik zal opgestaan zijn, zal Ik u voorgaan naar Galilea. Doch Petrus antwoordde en zei tegen Hem: Al werden zij ook allen aan U geërgerd, ik zal nooit geërgerd worden.", "2 Kor 3:14": "Maar hun gedachten zijn verhard geworden; want tot op deze huidige dag blijft datzelfde deksel bij het lezen van het Oude Testament, zonder weggenomen te worden, dat door Christus teniet gedaan wordt.", "Openb 3:7": "En schrijf aan de engel van de gemeente die in Filadelfia is: Dit zegt de Heilige, de Waarachtige, Die de sleutel van David heeft; Die opent, en niemand sluit, en Hij sluit, en niemand opent:", "Rom 2:16": "Op de dag waarop God de verborgen dingen van de mensen zal oordelen door Jezus Christus, naar mijn Evangelie.", "Mark 5:42": "En meteen stond het meisje op, en liep; want zij was twaalf jaar oud; en zij ontzetten zich met grote ontzetting.", "Joh 1:47": "En Nathanaël zei tegen hem: Kan uit Nazareth iets goeds komen? Filippus zei tegen hem: Kom en zie.", "Matt 5:32": "Maar Ik zeg u, dat ieder die zijn vrouw verlaat, anders dan vanwege hoererij, maakt dat zij overspel doet; en wie haar die verlaten is trouwt, doet overspel.", "Joh 8:24-30": "Ik heb u dan gezegd, dat u in uw zonden zult sterven; want als u niet gelooft dat Ik Die ben, zult u in uw zonden sterven. Zij zeiden dan tegen Hem: Wie bent U? En Jezus zei tegen hen: Wat Ik van het begin af aan u al zeg. Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld.", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Num 10:29": "Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.", "Deut 31:7": "En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven.", "Zach 1:3": "Daarom zeg tegen hen: Zo zegt de HEERE van de heerscharen: Keer terug tot Mij, spreekt de HEERE van de heerscharen, zo zal Ik weer tot u terugkeren, zegt de HEERE van de heerscharen.", "Deut 30:1-3": "Verder zal het gebeuren, wanneer al deze dingen over u gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult u het weer ter harte nemen, onder alle volken, waarheen de HEERE, uw God, u gedreven heeft; En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.", "Mark 8:17": "En Jezus, die dit besefte, zei tegen hen: Waarom overlegt u, dat u geen brood hebt? Merkt u het nog niet, en begrijpt u het niet? Is uw hart nog verhard?", "Joh 9:17": "Zij zeiden opnieuw tegen de blinde: U, wat zegt u van Hem, omdat Hij uw ogen geopend heeft? En hij zei: Hij is een Profeet.", "Joh 2:17": "En Zijn discipelen herinnerden zich dat er geschreven is: De ijver voor Uw huis heeft mij verslonden.", "Mark 4:13": "En Hij zei tegen hen: Begrijpt u deze gelijkenis niet, en hoe zult u dan alle gelijkenissen begrijpen?", "Hand 13:27": "Want zij die in Jeruzalem wonen, en hun leiders, hebben Hem niet gekend, en hebben ook de stemmen van de profeten, die elke sabbat gelezen worden, vervuld door Hem te veroordelen;", "Matt 8:16": "En toen het avond geworden was, brachten zij velen die door de duivel bezeten waren naar Hem toe, en Hij dreef de boze geesten uit met het woord, en Hij genas allen die ziek waren;", "Ezech 33:14-16": "Als Ik ook tegen de goddeloze zeg: U zult zeker sterven! en hij zich van zijn zonde bekeert en recht en gerechtigheid doet; Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven. Aan al zijn zonden die hij gezondigd heeft, zal niet meer gedacht worden; hij heeft recht en gerechtigheid gedaan, hij zal zeker leven.", "2 Kon 7:2": "Maar een hoofdman, op wiens hand de koning leunde, antwoordde de man Gods, en zei: Zie, al zou de HEERE vensters in de hemel maken, zou die zaak dan kunnen gebeuren? En hij zei: Zie, u zult het met uw ogen zien, maar daarvan niet eten.", "Luk 19:47": "En Hij onderwees dagelijks in de tempel; en de overpriesters, en de schriftgeleerden, en de leiders van het volk probeerden Hem te doden.", "Mark 5:21": "En toen Jezus opnieuw met het schip overgevaren was naar de andere kant, kwam er een grote menigte bij Hem samen; en Hij was bij de zee.", "Hand 8:12": "Maar toen zij Filippus geloofden, die het Evangelie van het Koninkrijk van God en van de Naam van Jezus Christus verkondigde, werden zij gedoopt, zowel mannen als vrouwen.", "Luk 15:25": "En zijn oudste zoon was op het veld; en toen hij kwam en het huis naderde, hoorde hij het gezang en het gedans,", "Luk 4:16-30": "En Hij kwam in Nazareth, waar Hij was opgevoed, en ging, naar Zijn gewoonte, op de dag van de sabbat naar de synagoge; en stond op om te lezen. En Hem werd het boek van de profeet Jesaja gegeven; en toen Hij het boek opengedaan had, vond Hij de plaats waar geschreven was: De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Mark 14:66-72": "En terwijl Petrus beneden in de zaal was, kwam een van de dienstmeisjes van de hogepriester; en toen zij Petrus zag zich warmen, keek zij hem aan, en zei: U was ook met Jezus de Nazarener. Maar hij ontkende het, en zei: Ik ken Hem niet, en ik weet niet wat u zegt. En hij ging naar buiten, naar de voorhal, en de haan kraaide.", "Hos 12:7": "U dan, bekeer u tot uw God, bewaar goedertierenheid en recht, en wacht voortdurend op uw God.", "Mark 3:10": "Want Hij had er velen genezen, zodat allen die enige kwalen hadden, op Hem afkwamen om Hem aan te raken.", "Joh 16:32": "Zie, de tijd komt, en is nu gekomen, dat u verstrooid zult worden, ieder naar het zijne, en u Mij alleen zult laten; en toch ben Ik niet alleen, want de Vader is met Mij.", "1 Tim 4:1-16": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen, door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid; die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen.", "Hand 8:30": "En Filippus liep erheen en hoorde hem de profeet Jesaja lezen, en zei: Begrijpt u ook wat u leest?", "Ps 140:13": "Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Rom 9:1-3": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest), dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "Ps 27:5": "Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.", "Joh 3:12": "Als Ik u de aardse dingen gezegd heb en u gelooft niet, hoe zult u geloven als Ik u de hemelse dingen zou zeggen?", "1 Sam 15:24-26": "Toen zei Saul tegen Samuël: Ik heb gezondigd, omdat ik het bevel van de HEERE en uw woorden overtreden heb; want ik heb het volk gevreesd en naar hun stem geluisterd. Nu dan, vergeef mij toch mijn zonde, en keer met mij terug, dat ik de HEERE aanbid. Doch Samuël zei tegen Saul: Ik zal niet met u terugkeren; omdat u het woord van de HEERE verworpen hebt, zo heeft de HEERE u verworpen, dat u geen koning over Israël meer zult zijn.", "Luk 5:1": "En het gebeurde, toen de menigte op Hem aandrong om het Woord van God te horen, dat Hij bij het meer Gennesareth stond.", "Joh 15:14": "U bent Mijn vrienden, als u doet wat Ik u gebied.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Hand 11:18": "En toen zij dit hoorden, waren zij tevreden, en verheerlijkten God, en zeiden: Zo heeft God dan ook aan de heidenen de bekering gegeven tot leven!", "Matt 14:28-32": "En Petrus antwoordde Hem, en zei: Heere! Als U het bent, gebied mij dan tot U te komen op het water. En Hij zei: Kom. En Petrus klom uit het schip, en liep op het water, om naar Jezus toe te komen. Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij!", "Luk 6:27-42": "Maar Ik zeg u die luistert: Heb uw vijanden lief; doe goed aan hen die u haten. Zegen hen die u vervloeken, en bid voor hen die u geweld aandoen. Wie u op de ene wang slaat, biedt hem ook de andere aan; en wie u de mantel afneemt, weerhoud hem niet ook uw hemd te nemen.", "Matt 8:18": "Toen Jezus vele menigten om Zich heen zag, gaf Hij bevel om naar de andere kant over te varen.", "Num 15:38": "Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten.", "Ps 31:8": "Ik zal mij verheugen en verblijden in Uw goedertierenheid, omdat U mijn ellende hebt aangezien, en mijn ziel in benauwdheden gekend hebt;", "Hand 23:12": "En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben.", "Spr 1:22": "U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?", "Num 36:8": "Verder zal elke dochter die een erfenis erft, van de stammen van de kinderen van Israël, de vrouw worden van iemand uit het geslacht van de stam van haar vader; opdat de kinderen van Israël erfelijk bezitten, ieder de erfenis van zijn vaderen.", "Luk 4:40": "En toen de zon onderging, brachten allen die zieken hadden, met verschillende ziekten, hen naar Hem toe, en Hij legde ieder van hen de handen op, en genas hen.", "Matt 4:12": "Toen Jezus gehoord had dat Johannes overgeleverd was, keerde Hij terug naar Galilea;", "Jer 23:14": "Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra.", "Mark 14:23": "En Hij nam de drinkbeker, en nadat Hij gedankt had, gaf Hij hun die; en zij dronken allen daaruit.", "Mark 12:24": "En Jezus antwoordde en zei tegen hen: Dwaalt u niet daarom, omdat u de Schriften niet kent, en ook de kracht van God niet?", "2 Petr 1:13": "En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken;", "Joh 3:7": "Verwonder u niet dat Ik u gezegd heb: U moet opnieuw geboren worden.", "Hand 1:6": "Zij dan, die samengekomen waren, vroegen Hem: Heere, zult U in deze tijd het Koninkrijk voor Israël weer oprichten?", "Luk 11:32": "De mannen van Ninevé zullen opstaan in het oordeel samen met dit geslacht, en het veroordelen; want zij hebben zich bekeerd op de prediking van Jona; en zie, meer dan Jona is hier!", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "Spr 28:5": "De kwade mensen begrijpen het recht niet; maar wie de HEERE zoeken, begrijpen alles.", "Gen 32:26": "En Hij zei: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zei: Ik zal U niet laten gaan, tenzij U mij zegent.", "Joël 1:14": "Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE.", "Joh 14:11": "Geloof Mij, dat Ik in de Vader ben en de Vader in Mij is; en zo niet, geloof Mij dan om de werken zelf.", "Jer 7:16": "U dan, bid niet voor dit volk, en hef geen geschrei of gebed voor hen op, en dring niet bij Mij aan; want Ik zal u niet horen.", "Joh 7:28": "Jezus riep dan in de tempel, terwijl Hij leerde, en zei: U kent Mij, en u weet van waar Ik ben; en Ik ben niet uit Mijzelf gekomen, maar Hij die Mij gezonden heeft, is waarachtig, Hem kent u niet.", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Ex 22:11": "dan zal er tussen hen beiden een eed bij de HEERE zijn, of hij zijn hand niet aan de bezittingen van zijn naaste geslagen heeft; en de eigenaar van het dier zal dat aanvaarden, en hij hoeft het niet te vergoeden.", "Mark 2:2": "En meteen kwamen er daar velen bijeen, zodat zelfs de plaatsen bij de deur hen niet meer konden bevatten; en Hij sprak het woord tot hen.", "Jes 28:24-28": "Ploegt de ploeger de hele dag om te zaaien? Opent en egt hij zijn land de hele dag? Is het niet zo? Wanneer hij het bovenste ervan gelijk gemaakt heeft, dan strooit hij wikken, en spreidt komijn uit, of hij werpt er de beste tarwe in, of uitgelezen gerst, of spelt, elk op zijn plaats. En zijn God onderricht hem over de juiste wijze, Hij leert het hem.", "Joh 5:40": "En u wilt niet tot Mij komen, opdat u het leven zou hebben.", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "Matt 28:10": "Toen zei Jezus tegen hen: Wees niet bang; ga heen, vertel Mijn broeders dat zij naar Galilea moeten gaan, en daar zullen zij Mij zien.", "Luk 3:7-9": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn? Breng dan vruchten voort die de bekering waardig zijn; en begin niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen Abraham kinderen kan verwekken. En de bijl ligt ook al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "Matt 20:2": "En toen hij met de arbeiders overeengekomen was voor een penning per dag, stuurde hij hen naar zijn wijngaard.", "Matt 4:9": "en zei tegen Hem: Dit alles zal ik U geven, als U neervalt en mij aanbidt.", "Spr 4:19": "De weg van de goddelozen is als donkerheid; zij weten niet, waarover zij zullen struikelen.", "Luk 5:32": "Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Ezech 3:4": "En Hij zei tot mij: Mensenkind, ga heen, kom tot het huis Israëls, en spreek tot hen met Mijn woorden.", "Joh 6:15-17": "Toen Jezus dan merkte dat zij zouden komen om Hem met geweld mee te nemen, om Hem koning te maken, trok Hij Zich weer terug op de berg, Hijzelf alleen. En toen het avond geworden was, gingen Zijn discipelen naar de zee. En zij gingen in het schip, en voeren over de zee naar Kapernaüm. En het was al donker geworden, en Jezus was nog niet bij hen gekomen.", "Hand 19:6": "En toen Paulus hun de handen opgelegd had, kwam de Heilige Geest op hen; en zij spraken met vreemde talen, en profeteerden.", "Ps 107:28-30": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij voerde hen uit hun angsten. Hij doet de storm stilstaan, zodat hun golven zwijgen. Dan zijn zij verblijd, omdat zij tot rust gekomen zijn, en omdat Hij hen naar de haven van hun verlangen geleid heeft.", "Hebr 12:25": "Zie erop toe dat u Hem, Die spreekt, niet verwerpt; want als dezen niet ontkomen zijn, die hem verwierpen die op aarde Goddelijke antwoorden gaf, hoeveel te meer zullen wij niet ontkomen, als wij ons afkeren van Hem Die van de hemelen is;", "Luk 11:20-22": "Maar als Ik door de vinger van God de demonen uitdrijf, dan is het Koninkrijk van God tot u gekomen. Wanneer een sterke, gewapende man zijn eigen woning bewaakt, dan is alles wat hij heeft in vrede. Maar als iemand die sterker is dan hij, hem overvalt en hem overwint, dan neemt die zijn hele wapenrusting weg, waarop hij vertrouwde, en deelt zijn buit uit.", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Joh 8:2": "En 's morgens vroeg kwam Hij weer in de tempel, en al het volk kwam naar Hem toe; en Hij ging zitten en leerde hen.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "Jer 39:17": "Maar Ik zal u op die dag redden, spreekt de HEERE; en u zult niet overgegeven worden in de hand van de mannen, voor wier aangezicht u vreest.", "Joh 1:13": "Die niet uit bloed, niet uit de wil van het vlees, en niet uit de wil van een man, maar uit God geboren zijn.", "Pred 4:10": "Want als zij vallen, richt de een zijn metgezel op; maar wee de ene die gevallen is, want er is geen tweede om hem op te helpen.", "Mark 11:22": "En Jezus antwoordde en zei tegen hen: Heb geloof in God.", "Mark 3:20": "En zij kwamen in huis; en daar kwam opnieuw een menigte samen, zodat zij zelfs niet konden eten.", "Luk 7:23": "En zalig is hij die aan Mij niet geërgerd zal worden.", "Hand 4:31": "En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.", "2 Tim 4:1-8": "Ik roep u dus dringend op, voor het aangezicht van God en de Heere Jezus Christus, Die de levenden en doden zal oordelen bij Zijn verschijning en in Zijn Koninkrijk: Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs. Want er zal een tijd komen dat zij de gezonde leer niet zullen verdragen, maar doordat hun oren jeuken, zullen zij zich naar hun eigen begeerten leraars in menigte bijeenzoeken;", "1 Petr 4:12-14": "Geliefden, houd u niet vreemd over de hitte van de verdrukking onder u, die u overkomt tot beproeving, alsof u iets vreemds overkwam; maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen. Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.", "Ps 94:7": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Mark 1:33": "En de hele stad was bijeengekomen bij de deur.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Num 11:13": "Waar zou ik het vlees vandaan halen, om al dit volk te geven? Want zij wenen tegen mij en zeggen: Geef ons vlees, dat wij eten!", "Hand 26:20": "Maar heb eerst aan hen die te Damaskus waren, en te Jeruzalem, en in het gehele land Judea, en aan de heidenen verkondigd dat zij zich zouden bekeren en zich tot God bekeren, en werken zouden doen die de bekering waardig zijn.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Hebr 10:26": "Want als wij willens en wetens zondigen, nadat wij de kennis van de waarheid ontvangen hebben, blijft er geen offer meer over voor de zonden;", "Mark 6:18-28": "Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben. En Herodias had het op hem voorzien, en wilde hem doden, maar kon het niet; want Herodes was bang voor Johannes, wetend dat hij een rechtvaardig en heilig man was, en hij beschermde hem; en wanneer hij hem hoorde, deed hij veel dingen, en hij luisterde graag naar hem.", "Ezech 19:9": "En zij zetten hem gevangen met haken, opdat zij hem naar de koning van Babel zouden brengen; zij brachten hem in vestingen, opdat zijn stem niet meer gehoord zou worden op de bergen van Israël.", "Matt 17:19": "Toen kwamen de discipelen apart naar Jezus toe en zeiden: Waarom konden wij hem niet uitdrijven?", "Neh 9:13": "En U bent neergedaald op de berg Sinaï, en hebt met hen gesproken uit de hemel; en U hebt hun rechtmatige rechten gegeven, en getrouwe wetten, goede inzettingen en geboden.", "Ps 37:13": "De Heere belacht hem, want Hij ziet dat zijn dag komt.", "Job 15:21": "Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over.", "Hagg 1:7": "Zo zegt de HEERE van de heerscharen: Let goed op uw wegen.", "Jes 53:3": "Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.", "Jes 10:21": "Het overblijfsel zal terugkeren, het overblijfsel van Jakob, tot de sterke God!", "Luk 20:9-18": "En Hij begon tegen het volk deze gelijkenis te vertellen: Een zeker mens plantte een wijngaard, en verhuurde die aan landbouwers, en ging voor lange tijd naar het buitenland. En toen het de tijd was, stuurde hij een dienstknecht naar de landbouwers, opdat zij hem van de vrucht van de wijngaard zouden geven; maar de landbouwers sloegen hem, en stuurden hem met lege handen weg. En opnieuw stuurde hij nog een andere dienstknecht; maar ook die sloegen zij en behandelden hem schandelijk, en stuurden hem met lege handen weg.", "1 Joh 5:12": "Wie de Zoon heeft, die heeft het leven; wie de Zoon van God niet heeft, die heeft het leven niet.", "Matt 25:14-30": "Want het is net als bij een mens, die naar het buitenland reisde, zijn dienstknechten riep, en hun zijn bezittingen toevertrouwde. En aan de één gaf hij vijf talenten, en aan de ander twee, en aan de derde één, ieder naar zijn vermogen, en hij vertrok meteen. Hij nu die de vijf talenten ontvangen had, ging op weg, en handelde daarmee, en verdiende er andere vijf talenten bij.", "Jer 50:4": "In die dagen en op die tijd, spreekt de HEERE, zullen de kinderen van Israël komen, zij en de kinderen van Juda samen; wandelend en wenend zullen zij heengaan, en de HEERE, hun God, zoeken.", "Jer 17:21": "Zo zegt de HEERE: Wacht u voor uw zielen, en draag geen last op de sabbatdag, en breng die niet in door de poorten van Jeruzalem.", "Joh 5:43": "Ik ben gekomen in de Naam van Mijn Vader, en u neemt Mij niet aan; als een ander komt in zijn eigen naam, die zult u aannemen.", "Luk 4:32": "En zij waren verbaasd over Zijn leer, want Zijn woord was met macht.", "1 Joh 1:8": "Als wij zeggen dat wij geen zonde hebben, dan verleiden wij ons zelf, en de waarheid is niet in ons.", "1 Kor 11:12": "Want zoals de vrouw uit de man is, zo is ook de man door de vrouw; maar alle dingen zijn uit God.", "Matt 14:1": "In diezelfde tijd hoorde Herodes, de viervorst, het gerucht van Jezus;", "Gen 19:2": "En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten.", "Job 5:6-27": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde; Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen. Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Num 28:9": "Maar op de sabbatdag twee volkomen eenjarige lammeren, en twee tienden meelbloem, als spijsoffer, met olie gemengd, alsook zijn drankoffer.", "Ezech 22:30": "Ik zocht nu onder hen een man die de muur zou kunnen toemuren, en voor Mijn aangezicht in de brest zou kunnen staan voor het land, zodat Ik het niet zou hoeven te verderven; maar Ik vond niemand.", "Mark 7:34": "En Hij keek op naar de hemel, zuchtte, en zei tegen hem: Effatha! Dat is: word geopend!", "Mark 6:17-28": "Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had. Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben. En Herodias had het op hem voorzien, en wilde hem doden, maar kon het niet;", "Mark 5:19": "Maar Jezus stond hem dat niet toe, maar zei tegen hem: Ga naar uw huis, naar de uwen, en vertel hun wat grote dingen de Heere aan u gedaan heeft, en hoe Hij Zich over u ontfermd heeft.", "Mark 8:2": "Ik word innerlijk met ontferming bewogen over de menigte; want zij zijn nu drie dagen bij Mij gebleven, en hebben niets om te eten.", "Joh 10:38": "maar als Ik ze doe, en u Mij niet gelooft, geloof dan de werken; opdat u mag weten en geloven dat de Vader in Mij is, en Ik in Hem.", "1 Tim 1:18-20": "Dit gebod beveel ik u, mijn zoon Timotheüs, dat u naar de profetieën die eerder over u uitgesproken zijn, daarmee de goede strijd strijdt; Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben; Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Micha 7:1": "Ai mij! Want ik ben als wanneer de zomervruchten zijn ingezameld; als wanneer de nalezingen in de wijnoogst gebeurd zijn; er is geen druif om te eten; mijn ziel begeert vroegrijpe vrucht.", "Joh 8:9": "Maar zij, dit horend, en door hun geweten overtuigd, gingen weg, de een na de ander, te beginnen bij de oudsten tot de laatsten toe; en Jezus bleef alleen achter, met de vrouw die in het midden stond.", "Joh 9:24": "Zij riepen dan voor de tweede maal de man die blind geweest was, en zeiden tegen hem: Geef God de eer; wij weten dat deze Mens een zondaar is.", "Hand 11:19": "Degenen nu die verstrooid waren door de verdrukking die over Stefanus gebeurd was, trokken het land door tot Fenicië toe, en Cyprus, en Antiochië, en spraken tot niemand het Woord dan alleen tot de Joden.", "Ps 78:32": "Boven dit alles zondigden zij nog, en geloofden niet, ondanks Zijn wonderen.", "Joz 1:1-9": "Het gebeurde nu, na de dood van Mozes, de knecht van de HEERE, dat de HEERE tegen Jozua, de zoon van Nun, de dienaar van Mozes, sprak en zei: Mijn knecht Mozes is gestorven; maak u nu op, trek deze Jordaan over, u en al dit volk, naar het land dat Ik hun, de kinderen van Israël, geef. Elke plaats waarop uw voetzool treden zal, heb Ik u gegeven, zoals Ik tegen Mozes gesproken heb.", "2 Tim 3:1-17": "En weet dit, dat in de laatste dagen zware tijden zullen aanbreken. Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig, zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede,", "Dan 4:27": "Daarom, o koning, laat mijn raad u behagen, en breek uw zonden af door gerechtigheid, en uw ongerechtigheden door genade te bewijzen aan de ellendigen, of er misschien verlenging van uw vrede mocht zijn.", "1 Joh 5:16": "Als iemand zijn broeder een zonde ziet doen die niet tot de dood is, die zal God bidden en Hij zal hem het leven geven, aan hen namelijk die zondigen niet tot de dood. Er is een zonde tot de dood; voor die zonde zeg ik niet dat hij moet bidden.", "1 Joh 2:11": "Maar wie zijn broeder haat, is in de duisternis, en wandelt in de duisternis, en weet niet, waar hij heengaat; want de duisternis heeft zijn ogen verblind.", "Matt 11:20": "Toen begon Hij de steden te verwijten waarin Zijn krachten meest gebeurd waren, omdat zij zich niet bekeerd hadden.", "Mark 10:12": "En als een vrouw haar man verlaat, en met een ander trouwt, pleegt zij overspel.", "Joh 7:12": "En er was veel gemurmel over Hem onder de menigten. Sommigen zeiden: Hij is goed; en anderen zeiden: Nee, maar Hij verleidt de menigte.", "1 Tess 4:5": "Niet in kwade hartstocht van begeerte, zoals ook de heidenen, die God niet kennen.", "Spr 13:18": "Armoede en schande is voor hem die de tucht verwerpt; maar die de bestraffing ter harte neemt, zal geëerd worden.", "Luk 9:45": "Maar zij begrepen dit woord niet, en het was voor hen verborgen, zodat zij het niet doorhadden; en zij waren bang Hem naar dat woord te vragen.", "Spr 1:16": "Want hun voeten lopen tot het kwade; en zij haasten zich om bloed te storten.", "Joz 13:33": "Maar aan de stam van Levi gaf Mozes geen erfdeel; de HEERE, de God van Israël, is Zelf hun Erfdeel, zoals Hij tot hen gesproken heeft.", "Hebr 9:14": "hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Lev 19:3": "Want ieder zal zijn moeder en zijn vader vrezen, en Mijn sabbatten houden; Ik ben de HEERE, uw God!", "Matt 11:24": "Maar Ik zeg u, dat het het land van Sodom draaglijker zal zijn op de dag van het oordeel, dan u.", "Rom 1:11": "Want ik verlang ernaar u te zien, opdat ik u enige geestelijke gave zou mogen meedelen, opdat u versterkt zou worden;", "Zef 2:9": "Daarom, zo waarachtig als Ik leef, spreekt de HEERE van de heerscharen, de God van Israël: Moab zal zeker zijn als Sodom, en de kinderen van Ammon als Gomorra, een netelveld, en een zoutgroeve, en een verwoesting tot in eeuwigheid! De overigen van Mijn volk zullen hen beroven, en het overige van Mijn volk zal hen erfelijk bezitten.", "Joh 3:9-12": "Nicodemus antwoordde en zei tegen Hem: Hoe kunnen deze dingen gebeuren? Jezus antwoordde en zei tegen hem: Bent u een leraar van Israël, en weet u deze dingen niet? Voorwaar, voorwaar, Ik zeg u: Wij spreken wat Wij weten, en getuigen wat Wij gezien hebben; en u neemt Ons getuigenis niet aan.", "Mark 3:18": "En Andreas, en Filippus, en Bartholomeüs, en Mattheüs, en Thomas, en Jakobus, de zoon van Alfeüs, en Thaddeüs, en Simon de Kananiet,", "Ex 31:13-17": "Spreek u nu tot de kinderen van Israël: U zult zeker Mijn sabbatten onderhouden; want dit is een teken tussen Mij en u, bij uw geslachten; opdat men weet, dat Ik de HEERE ben, Die u heilig maakt. Onderhoud dan de sabbat, omdat hij u heilig is! Wie hem ontheiligt, zal zeker gedood worden; want ieder die daarop enig werk doet, die ziel zal uitgeroeid worden uit het midden van haar volken. Zes dagen zal men het werk doen; maar op de zevende dag is de sabbat van de rust, een heiligheid van de HEERE! Wie op de sabbatdag arbeid doet, zal zeker gedood worden.", "Deut 10:16": "Besnijd dan de voorhuid van uw hart, en verhard uw nek niet meer.", "Lev 18:6-18": "Niemand zal tot enige nabestaande van het eigen vlees naderen, om de schaamte te ontdekken; Ik ben de HEERE! U zult de schaamte van uw vader en de schaamte van uw moeder niet ontdekken; zij is uw moeder; u zult haar schaamte niet ontdekken. U zult de schaamte van de vrouw van uw vader niet ontdekken; het is de schaamte van uw vader.", "Klaagl 1:7": "Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "Ezech 3:9": "Uw voorhoofd heb Ik gemaakt als een diamant, harder dan een rots; vrees hen niet, en wees niet ontzet voor hun gezichten, omdat zij een opstandig huis zijn.", "Hand 3:17": "En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.", "1 Kor 3:12-15": "En als iemand op dit fundament bouwt: goud, zilver, kostbare stenen, hout, hooi, stoppels; Ieders werk zal openbaar worden; want de dag zal het aan het licht brengen, omdat het door vuur ontdekt wordt; en hoedanig ieders werk is, zal het vuur beproeven. Als iemands werk blijft, dat hij daarop gebouwd heeft, die zal loon ontvangen.", "Job 15:24": "Angst en benauwdheid verschrikken hem; zij overweldigt hem, als een koning die bereid is ten strijde.", "Ezech 44:28": "Dit nu zal hun tot erfenis zijn: Ik ben hun Erfenis; daarom zult u hun geen bezitting geven in Israël; Ik ben hun Bezitting.", "Rom 15:3": "Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "1 Tess 2:6": "Wij hebben ook geen eer gezocht bij mensen, niet bij u, en ook niet bij anderen; hoewel wij u tot last hadden kunnen zijn als apostelen van Christus;", "Luk 1:27": "naar een maagd die ondertrouwd was met een man wiens naam Jozef was, uit het huis van David; en de naam van de maagd was Maria.", "Joh 8:21": "Jezus zei dan weer tegen hen: Ik ga heen, en u zult Mij zoeken, en in uw zonden zult u sterven; waar Ik heenga, kunt u niet komen.", "Jes 28:13": "Zo zal het woord van de HEERE voor hen zijn: gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig; opdat zij heengaan, en achterwaarts vallen, en gebroken, en verstrikt en gevangen worden.", "Joh 6:23": "(maar er kwamen andere scheepjes van Tiberias, dicht bij de plaats waar zij het brood gegeten hadden nadat de Heere gedankt had) —", "Hand 5:25": "En er kwam iemand, en berichtte hun, en zei: Zie, de mannen die u in de gevangenis gezet hebt, staan in de tempel, en leren het volk.", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Mark 6:2-6": "En toen het sabbat geworden was, begon Hij in de synagoge te onderwijzen; en velen die Hem hoorden, waren verbaasd, en zeiden: Waar komen Deze deze dingen vandaan, en wat is dit voor wijsheid die Hem gegeven is, dat ook zulke krachten door Zijn handen gebeuren? Is Deze niet de timmerman, de zoon van Maria, en de broer van Jakobus en Joses, en van Judas en Simon? En zijn Zijn zusters niet hier bij ons? En zij namen aanstoot aan Hem. En Jezus zei tegen hen: Een profeet is niet zonder eer, behalve in zijn eigen vaderland en onder zijn verwanten en in zijn huis.", "Jes 53:1": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard?", "Matt 5:27-48": "U hebt gehoord dat gezegd is: U zult geen overspel plegen. Maar Ik zeg u, dat ieder die naar een vrouw kijkt om haar te begeren, al overspel met haar gepleegd heeft in zijn hart. Als dan uw rechteroog u ergert, ruk het uit en werp het van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.", "Joh 8:22": "De Joden zeiden dan: Zal Hij zichzelf soms doden, omdat Hij zegt: Waar Ik heenga, kunt u niet komen?", "Rom 10:1": "Broeders, de toegenegenheid van mijn hart en het gebed dat ik tot God doe voor Israël, is tot hun zaligheid.", "Jes 1:9": "Als de HEERE van de heerscharen ons niet nog een klein overblijfsel had gelaten, zouden wij als Sodom geworden zijn; wij zouden Gomorra gelijk zijn geworden.", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "Hand 4:13": "Toen zij nu de vrijmoedigheid van Petrus en Johannes zagen, en merkten dat zij ongeleerde en eenvoudige mensen waren, verwonderden zij zich, en herkenden hen, dat zij met Jezus geweest waren.", "Joh 12:37": "En hoewel Hij zoveel tekenen voor hen gedaan had, geloofden zij toch niet in Hem;", "Dan 3:18": "Maar als dat niet zo is, laat het u bekend zijn, o koning, dat wij uw goden niet zullen eren, en ook het gouden beeld, dat u hebt opgericht, niet zullen aanbidden.", "Luk 23:54": "En het was de dag van de voorbereiding, en de sabbat brak aan.", "Matt 26:27": "En Hij nam de drinkbeker, en na de dankzegging gaf Hij die aan hen en zei: Drinkt allen daaruit;", "1 Tess 4:16-18": "Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan; Daarna zullen wij, die levend overgebleven zijn, samen met hen opgenomen worden in de wolken, de Heere tegemoet, in de lucht; en zo zullen wij altijd bij de Heere zijn. Zo dan, vertroost elkaar met deze woorden.", "Joh 14:15": "Als u Mij liefhebt, bewaar dan Mijn geboden.", "Deut 30:8-10": "U dan zult zich bekeren, en de stem van de HEERE gehoorzaam zijn, en u zult doen al Zijn geboden, die ik u heden gebied. En de HEERE, uw God, zal u overvloed geven in al het werk van uw hand, in de vrucht van uw buik, en in de vrucht van uw vee, en in de vrucht van uw land, ten goede; want de HEERE zal Zich weer verblijden over u ten goede, zoals Hij Zich over uw vaderen verblijd heeft; wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, door Zijn geboden en Zijn inzettingen te houden, die in dit boek van de wet geschreven zijn; wanneer u zich zult bekeren tot de HEERE, uw God, met uw ganse hart en met uw ganse ziel.", "Luk 24:21": "En wij hoopten dat Hij Degene was Die Israël verlossen zou. Maar toch, ook naast dit alles, is het vandaag de derde dag sinds deze dingen gebeurd zijn.", "Mark 4:41": "En zij vreesden met grote vrees, en zeiden tegen elkaar: Wie is Deze toch, dat zelfs de wind en de zee Hem gehoorzaam zijn?", "Num 18:1-7": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen. En ook zult u uw broeders, de stam van Levi, de stam van uw vader, met u laten naderen, zodat zij u worden bijgevoegd, en u dienen; maar u, en uw zonen met u, zult voor de tent der getuigenis zijn. En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u.", "1 Kor 2:15": "Maar de geestelijke mens beoordeelt wel alle dingen, maar hijzelf wordt door niemand beoordeeld.", "Luk 23:27": "En een grote menigte van volk en van vrouwen volgde Hem, die ook weenden en Hem beklaagden.", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Deut 5:11": "U zult de Naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal hem die Zijn Naam ijdel gebruikt, niet onschuldig houden.", "Matt 10:14": "En als iemand u niet ontvangt, en uw woorden niet hoort, schudt dan bij het verlaten van dat huis of die stad het stof van uw voeten af.", "Hand 23:12-14": "En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben. En het waren er meer dan veertig die deze eed samen hadden afgelegd. Zij gingen naar de overpriesters en de oudsten en zeiden: Wij hebben onszelf met een vervloeking vervloekt om niets te nuttigen totdat wij Paulus gedood zullen hebben.", "1 Tim 5:14": "Ik wil dan dat de jonge weduwen trouwen, kinderen krijgen, het huis besturen, en geen aanleiding tot smaad geven aan de tegenpartij.", "Spr 27:3": "Een steen is zwaar, en het zand gewichtig; maar de toorn van de dwaas is zwaarder dan die beide.", "Luk 8:44": "kwam van achteren naar Hem toe en raakte de zoom van Zijn kleed aan; en meteen hield haar bloedvloeiing op.", "Matt 14:11": "En zijn hoofd werd op een schotel gebracht, en aan het meisje gegeven; en zij bracht het naar haar moeder.", "Jes 40:21": "Weet u het niet? Hoort u het niet? Is het u van het begin af aan niet bekendgemaakt? Hebt u niet gelet op de grondvesten van de aarde?", "Joh 2:11": "Dit begin van de tekenen heeft Jezus gedaan te Kana in Galilea, en heeft Zijn heerlijkheid geopenbaard; en Zijn discipelen geloofden in Hem.", "Ps 69:10": "Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.", "1 Kor 10:30": "En als ik door genade deel heb aan het voedsel, waarom word ik dan belasterd over iets waarvoor ik dank?", "Jes 40:29": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft.", "Joh 10:24": "De Joden dan omringden Hem, en zeiden tegen Hem: Hoe lang houdt U ons nog in het onzekere? Als U de Christus bent, zeg het ons ronduit.", "Job 42:8-10": "Daarom neemt nu voor u zeven jonge stieren en zeven rammen, en gaat heen naar Mijn knecht Job, en offert een brandoffer voor u, en laat Mijn knecht Job voor u bidden; want zeker, Ik zal zijn aangezicht aannemen, opdat Ik aan u niet doe naar uw dwaasheid; want u hebt niet recht van Mij gesproken, zoals Mijn knecht Job. Toen gingen Elifaz, de Themaniet, en Bildad, de Suhiet, en Zofar, de Naämathiet, heen, en deden, zoals de HEERE tot hen gesproken had; en de HEERE nam het aangezicht van Job aan. En de HEERE wendde de gevangenis van Job, toen hij gebeden had voor zijn vrienden; en de HEERE vermeerderde alles wat Job gehad had tot het dubbele.", "Luk 13:22": "En Hij reisde van de ene stad en dorp naar de andere, terwijl Hij onderwijs gaf en op weg was naar Jeruzalem.", "Luk 24:37-39": "En zij schrokken en werden zeer bevreesd, en meenden dat zij een geest zagen. En Hij zei tegen hen: Waarom bent u ontsteld, en waarom komen zulke overleggingen op in uw hart? Zie Mijn handen en Mijn voeten; want Ik ben het Zelf; raak Mij aan, en zie; want een geest heeft geen vlees en beenderen, zoals u ziet dat Ik heb.", "Matt 19:2": "En veel menigten volgden Hem, en Hij genas ze daar.", "Matt 11:6": "En gelukkig is hij, die aan Mij niet geërgerd zal worden.", "Matt 11:16-19": "Maar waarbij zal Ik dit geslacht vergelijken? Het is gelijk aan de kinderen, die op de markten zitten, en hun vrienden toeroepen, En zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben u klaagliederen gezongen, en u hebt niet geweend. Want Johannes is gekomen, niet etend, niet drinkend, en zij zeggen: Hij heeft de duivel.", "Ps 22:28": "Alle einden van de aarde zullen het gedenken, en zich tot de HEERE bekeren; en alle geslachten van de heidenen zullen voor Uw aangezicht aanbidden.", "Hos 4:14": "Ik zal over uw dochters geen straf² brengen, omdat zij hoereren, en over uw bruiden, omdat zij overspel plegen; want zij zelf zonderen zich af met de hoeren, en offeren met de snoodste hoeren; het volk dan, dat geen verstand heeft, zal ten onder gaan.", "Luk 22:19": "En Hij nam brood, en toen Hij gedankt had, brak Hij het en gaf het hun, en zei: Dat is Mijn lichaam, dat voor u gegeven wordt; doe dat tot Mijn gedachtenis.", "Joh 20:19": "Toen het dan avond was op die eerste dag van de week, en de deuren gesloten waren waar de discipelen bijeen waren uit vrees voor de Joden, kwam Jezus en stond in hun midden, en zei tegen hen: Vrede zij u!", "Jer 26:12-15": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt; Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft. Maar ik, zie, ik ben in uw handen; doe met mij zoals het goed en recht is in uw ogen;", "Ps 119:143": "Benauwdheid en angst hebben mij getroffen, doch Uw geboden zijn mijn vermakingen.", "Mark 9:39": "Maar Jezus zei: Verbied hem niet; want er is niemand die een kracht zal doen in Mijn Naam, die meteen daarna kwaad van Mij zal kunnen spreken.", "Joh 12:47": "En als iemand Mijn woorden gehoord heeft en niet gelooft, oordeel Ik hem niet; want Ik ben niet gekomen om de wereld te oordelen, maar om de wereld zalig te maken.", "Ps 46:2": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.", "Joh 14:27": "Vrede laat Ik u na, Mijn vrede geef Ik u; niet zoals de wereld die geeft, geef Ik hem u. Laat uw hart niet ontroerd worden en niet bevreesd zijn.", "Ex 23:1": "U zult geen vals gerucht verspreiden; en u zult uw hand niet bij de goddeloze leggen, om een getuige te zijn tot geweld.", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Joh 20:27": "Daarna zei Hij tegen Thomas: Breng uw vinger hier, en bekijk Mijn handen, en breng uw hand, en stop hem in Mijn zijde; en wees niet ongelovig, maar gelovig.", "Zach 1:6": "Nochtans Mijn woorden en Mijn inzettingen, die Ik Mijn knechten, de profeten, geboden had, hebben die uw vaders niet getroffen? Zodat zij terugkerend zeiden: Zoals de HEERE van de heerscharen Zich voorgenomen had ons te doen, naar onze wegen en naar onze daden, zo heeft Hij met ons gedaan.", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "Jer 7:8": "Zie, u vertrouwt op valse woorden, die geen nut doen.", "2 Kor 4:8-10": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig; Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven; Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Joh 10:28": "En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken.", "Pred 12:10": "De prediker zocht aangename woorden te vinden, en wat er geschreven is, is recht: woorden van de waarheid.", "Mark 10:11": "En Hij zei tegen hen: Wie zijn vrouw verlaat, en een ander trouwt, pleegt overspel tegen haar.", "Luk 11:52": "Wee u, wetgeleerden, want u hebt de sleutel van de kennis weggenomen; u zelf bent niet naar binnen gegaan, en hen die naar binnen gingen, hebt u tegengehouden.", "Ps 51:9-16": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw. Doe mij vreugde en blijdschap horen; laat de beenderen zich verheugen die U verbrijzeld hebt. Verberg Uw aangezicht van mijn zonden, en delg al mijn ongerechtigheden uit.", "Matt 5:22-24": "Maar Ik zeg u: ieder die zonder reden toornig is op zijn broeder, die zal strafbaar zijn voor het gericht; en wie tegen zijn broeder zegt: Raka! die zal strafbaar zijn voor de grote raad; maar wie zegt: Dwaas! die zal strafbaar zijn voor het helse vuur. Als u dan uw gave op het altaar offert, en u daar herinnert dat uw broeder iets tegen u heeft, laat uw gave daar voor het altaar, en ga heen; verzoen u eerst met uw broeder, en kom dan en offer uw gave.", "1 Tess 3:2": "en wij hebben Timotheüs gezonden, onze broeder en Gods dienaar en onze medearbeider in het Evangelie van Christus, om u te versterken en u te vermanen aangaande uw geloof;", "Luk 10:17-20": "En de tweeënzeventig keerden terug met blijdschap, en zeiden: Heere, ook de demonen onderwerpen zich aan ons in Uw Naam. En Hij zei tegen hen: Ik zag de satan als een bliksem uit de hemel vallen. Zie, Ik geef u de macht om op slangen en schorpioenen te treden, en over alle kracht van de vijand; en niets zal u ooit schaden.", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Joh 7:27": "Maar van Hem weten wij van waar Hij is; maar de Christus, wanneer Hij komen zal, dan zal niemand weten van waar Hij is.", "1 Tim 2:1-15": "Ik vermaan dan voor alle dingen, dat er smekingen, gebeden, voorbiddingen en dankzeggingen gedaan worden voor alle mensen; voor koningen en allen die in hoge positie zijn, opdat wij een rustig en stil leven kunnen leiden in alle godsvrucht en eerbaarheid. Want dat is goed en aangenaam voor God, onze Zaligmaker;", "Matt 12:38": "Toen antwoordden sommigen van de Schriftgeleerden en Farizeeën: Meester, wij willen graag een teken van U zien.", "Ps 74:18-23": "Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd. Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig. Zie naar het verbond; want de duistere plaatsen van het land zijn vol woningen van geweld.", "Rom 15:18-21": "Want ik zou niet durven iets zeggen dat Christus niet door mij gewerkt heeft, tot gehoorzaamheid van de heidenen, met woorden en werken; door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb. En zo zeer begerig geweest ben om het Evangelie te verkondigen, niet waar Christus genoemd was, opdat ik niet op eens anders fundament zou bouwen;", "Ps 2:1-3": "Waarom woeden de heidenen, en bedenken de volken iets zinloos? De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen: Laat ons hun banden verscheuren, en hun touwen van ons afwerpen.", "1 Kon 8:43": "hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Joh 6:5-14": "Toen Jezus dan Zijn ogen opsloeg en zag dat een grote menigte naar Hem toe kwam, zei Hij tegen Filippus: Waar zullen wij broden kopen, zodat dezen kunnen eten? (Maar dit zei Hij om hem te beproeven; want Hij wist Zelf wat Hij doen zou.) Filippus antwoordde Hem: Voor tweehonderd penningen brood is voor hen niet genoeg, zodat ieder van hen een klein beetje krijgt.", "Mark 9:9": "En toen zij van de berg afkwamen, gebood Hij hun dat zij aan niemand zouden vertellen wat zij gezien hadden, totdat de Zoon des mensen uit de doden zou zijn opgestaan.", "Hand 8:40": "Maar Filippus werd gevonden te Azote; en terwijl hij het land doortrok, verkondigde hij het Evangelie in alle steden, totdat hij in Cesarea kwam.", "Ps 37:33": "Maar de HEERE laat hem niet in zijn hand; en Hij veroordeelt hem niet, als hij geoordeeld wordt.", "1 Tim 2:1": "Ik vermaan dan voor alle dingen, dat er smekingen, gebeden, voorbiddingen en dankzeggingen gedaan worden voor alle mensen;", "Joh 7:40": "Velen dan uit de menigte, die dit woord hoorden, zeiden: Deze is werkelijk de Profeet.", "Ps 37:24": "Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand.", "Ex 32:32": "Nu dan, als Gij hun zonde wilt vergeven! Maar zo niet, delg mij dan nu uit Uw boek, dat Gij geschreven hebt.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Joh 9:29": "Wij weten dat God tot Mozes gesproken heeft; maar van Deze weten wij niet vanwaar Hij is.", "Mark 1:45": "Maar hij, toen hij weggegaan was, begon vele dingen te verkondigen en dat woord te verspreiden, zodat Hij niet meer openlijk in de stad kon komen, maar buiten in eenzame plaatsen was; en zij kwamen van alle kanten tot Hem.", "Mark 9:13": "Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.", "Mark 16:14": "Daarna verscheen Hij aan de elf, terwijl zij aanzaten, en verweet hun hun ongeloof en hardheid van hart, omdat zij hen die Hem gezien hadden nadat Hij opgestaan was, niet geloofd hadden.", "Jes 5:13": "Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Matt 14:3-11": "Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer. Want Johannes zei tegen hem: Het is u niet geoorloofd haar te hebben. En hoewel hij hem wilde doden, vreesde hij het volk, omdat zij hem hielden voor een profeet.", "Jes 42:18-20": "Hoort, u doven! En kijkt toe, u blinden, om te zien. Wie is er blind als Mijn knecht, en doof, zoals Mijn bode, die Ik zend? Wie is blind, zoals de volmaakte, en blind, zoals de knecht van de HEERE? U ziet wel veel dingen, maar u bewaart ze niet; en al doet hij de oren open, toch hoort hij niet.", "2 Petr 1:12": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt.", "Jes 5:16": "Doch de HEERE van de heerscharen zal verhoogd worden door het recht; en God, die Heilige, zal geheiligd worden door gerechtigheid.", "Dan 5:1-4": "De koning Belsazar maakte een grote maaltijd voor zijn duizend leiders, en hij dronk wijn ten overstaan van die duizend. Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken. Toen bracht men de gouden vaten, die men uit de tempel van het huis van God, die te Jeruzalem geweest was, weggevoerd had; en de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen dronken daaruit.", "Ezech 3:19": "Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd.", "Joh 1:41-43": "Andreas, de broer van Simon Petrus, was een van de twee die het van Johannes gehoord hadden, en Hem gevolgd waren. Deze vond eerst zijn broer Simon, en zei tegen hem: Wij hebben de Messias gevonden, wat vertaald betekent: de Christus. En hij bracht hem tot Jezus. En Jezus keek hem aan, en zei: U bent Simon, de zoon van Jona; u zult Cefas genoemd worden, wat vertaald wordt als Petrus.", "Hand 24:24-26": "En na enige dagen kwam Felix daar met Drusilla, zijn vrouw, die een Jodin was, en hij liet Paulus halen, en hoorde hem over het geloof in Christus. En toen hij sprak over rechtvaardigheid, en zelfbeheersing, en over het komende oordeel, werd Felix zeer bevreesd, en antwoordde: Voor nu kunt u gaan; en wanneer ik een geschikte tijd zal hebben, zal ik u weer bij mij roepen. En tegelijk ook hopend, dat hem door Paulus geld gegeven zou worden, opdat hij hem zou vrijlaten; daarom ontbood hij hem ook vaak, en sprak met hem.", "Matt 23:18-22": "En wie zweert bij het altaar, dat is niets; maar wie zweert bij de gave die daarop ligt, die is verplicht zijn eed te houden. Dwazen en blinden, want wat is meer, de gave, of het altaar dat de gave heiligt? Daarom, wie zweert bij het altaar, die zweert bij hetzelf, en bij alles wat daarop is.", "Hand 11:20": "En er waren enige mannen uit Cyprus en Cyrene onder hen, die naar Antiochië gekomen waren en tot de Grieken spraken, terwijl zij de Heere Jezus verkondigden.", "Ezech 20:24": "Omdat zij Mijn rechten niet gedaan hadden, maar Mijn inzettingen verworpen en Mijn sabbatten ontheiligd hadden, en hun ogen achter de drekgoden van hun vaderen aan gingen.", "Luk 13:5": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Ex 28:30": "U zult ook in de borstlap van het gericht de Urim en de Thummim zetten, zodat zij op het hart van Aäron zijn, als hij voor het aangezicht van de HEERE ingaan zal; zo zal Aäron dat gericht van de kinderen van Israël voortdurend op zijn hart dragen, voor het aangezicht van de HEERE.", "Joh 10:17": "Daarom heeft de Vader Mij lief, omdat Ik Mijn leven afleg, opdat Ik het opnieuw neem.", "Matt 15:33": "En Zijn discipelen zeiden tegen Hem: Waa
