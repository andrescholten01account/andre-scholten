t *ene* koninkrijk tegen het *andere* koninkrijk; en er zullen op verschillende plaatsen aardbevingen zijn, en er zullen hongersnoden zijn, en onrust. Deze dingen zijn *pas* het begin van de weeën.","9":"Maar let u zelf op; want zij zullen u overleveren aan de raadsvergaderingen, en aan de synagogen; u zult geslagen worden, en u zult voor stadhouders en koningen gebracht worden, omwille van Mij, hun tot een getuigenis.","10":"En het Evangelie moet eerst gepredikt worden onder alle volken.","11":"Maar wanneer zij u zullen wegleiden om u over te leveren, maak u dan niet vooraf bezorgd over wat u zult spreken, en bedenk het niet van tevoren; maar wat u in dat uur gegeven zal worden, spreek dat; want u bent het niet die spreekt, maar de Heilige Geest.","12":"En de *ene* broer zal de *andere* overleveren tot de dood, en de vader het kind; en de kinderen zullen opstaan tegen de ouders, en hen doden.","13":"En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.","14":"Wanneer u dan de gruwel van de verwoesting zult zien, waarvan door de profeet Daniël gesproken is, staande waar het niet behoort (wie dit leest, laat hij daarop letten!), laten dan zij die in Judea zijn, vluchten naar de bergen.","15":"En wie op het dak is, moet niet naar beneden gaan in het huis, en niet naar binnen gaan, om iets uit zijn huis weg te halen.","16":"En wie op de akker is, moet niet teruggaan om zijn kleed te halen.","17":"Maar wee de zwangere *vrouwen* en de zogende in die dagen!","18":"Maar bid dat uw vlucht niet in de winter gebeurt.","19":"Want die dagen zullen zo'n verdrukking zijn, zoals er niet geweest is vanaf het begin van de schepping die God geschapen heeft, tot nu toe, en er ook niet meer zal zijn.","20":"En als de Heere de dagen niet verkort had, zou geen vlees behouden worden; maar omwille van de uitverkorenen, die Hij uitverkoren heeft, heeft Hij de dagen verkort.","21":"En dan, als iemand tegen u zal zeggen: Zie, hier is de Christus; of: Zie, Hij is daar; geloof het niet.","22":"Want er zullen valse christussen, en valse profeten opstaan, en zij zullen tekenen en wonderen doen, om te misleiden, indien het mogelijk zou zijn, ook de uitverkorenen.","23":"Maar u, let op; zie, Ik heb u alles van tevoren gezegd!","24":"Maar in die dagen, na die verdrukking, zal de zon verduisterd worden, en de maan zal haar licht niet geven.","25":"En de sterren van de hemel zullen daaruit vallen, en de krachten die in de hemelen *zijn*, zullen bewogen worden.","26":"En dan zullen zij de Zoon des mensen zien komen in de wolken, met grote kracht en heerlijkheid.","27":"En dan zal Hij Zijn engelen uitzenden, en Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het uiterste van de aarde, tot het uiterste van de hemel.","28":"En leer van de vijgenboom deze gelijkenis; wanneer zijn tak nu teder wordt, en de bladeren uitspruiten, dan weet u dat de zomer nabij is.","29":"Zo ook u, wanneer u deze dingen zult zien gebeuren, weet dan dat *het* nabij is, voor de deur.","30":"Voorwaar, Ik zeg u, dat dit geslacht niet zal voorbijgaan, totdat al deze dingen gebeurd zullen zijn.","31":"De hemel en de aarde zullen voorbijgaan; maar Mijn woorden zullen geenszins voorbijgaan.","32":"Maar van die dag en dat uur weet niemand, ook de engelen in de hemel niet, en ook de Zoon niet, maar alleen de Vader.","33":"Let op, waak en bid; want u weet niet wanneer de tijd is.","34":"Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken;","35":"Waak dan (want u weet niet wanneer de heer des huizes zal komen, laat *in de avond*, of te middernacht, of bij het hanengekraai, of in de ochtend);","36":"opdat hij niet onverwacht komt, en u slapend vindt.","37":"En wat Ik u zeg, *dat* zeg Ik allen: Waak."},"SV":{"1":"En als Hij uit den tempel ging, zeide een van Zijn discipelen tot Hem: Meester, zie, hoedanige stenen, en hoedanige gebouwen!","2":"En Jezus, antwoordende, zeide tot hem: Ziet gij deze grote gebouwen? Er zal niet *een* steen op den *anderen* steen gelaten worden, die niet afgebroken zal worden.","3":"En als Hij gezeten was op den Olijfberg, tegen den tempel over, vraagden Hem Petrus, en Jakobus, en Johannes, en Andreas, alleen:","4":"Zeg ons, wanneer zullen deze dingen zijn? En welk is het teken, wanneer deze dingen allen voleindigd zullen worden?","5":"En Jezus, hun antwoordende, begon te zeggen: Ziet toe, dat u niemand verleide.","6":"Want velen zullen komen onder Mijn Naam, zeggende: Ik ben *de* *Christus*; en zullen velen verleiden.","7":"En wanneer gij zult horen van oorlogen, en geruchten van oorlogen, zo wordt niet verschrikt; want *dit* moet geschieden; maar nog is het einde niet.","8":"Want het *ene* volk zal tegen het *andere* volk opstaan, en het *ene* koninkrijk tegen het *andere* koninkrijk; en er zullen aardbevingen zijn in verscheidene plaatsen, en er zullen hongersnoden wezen, en beroerten. Deze dingen zijn *maar* beginselen der smarten.","9":"Maar ziet gij voor uzelven toe; want zij zullen u overleveren in de raadsvergaderingen, en in de synagogen; gij zult geslagen worden, en voor stadhouders en koningen zult gij gesteld worden , om Mijnentwil, hun tot een getuigenis.","10":"En het Evangelie moet eerst gepredikt worden onder al de volken.","11":"Doch wanneer zij u leiden zullen, om u over te leveren, zo zijt te voren niet bezorgd, wat gij spreken zult, en bedenkt het niet; maar zo wat u in die ure gegeven zal worden, spreekt dat; want gij zijt het niet, die spreekt, maar de Heilige Geest.","12":"En de *ene* broeder zal den *anderen* overleveren tot den dood, en de vader het kind; en de kinderen zullen opstaan tegen de ouders, en zullen hen doden.","13":"En gij zult gehaat worden van allen, om Mijns Naams wil; maar wie volharden zal tot het einde, die zal zalig worden.","14":"Wanneer gij dan zult zien den gruwel der verwoesting, waarvan door den profeet Daniël gesproken is, staande waar het niet behoort, (die het leest, die merke daarop!) alsdan, die in Judea zijn, dat zij vlieden op de bergen.","15":"En die op het dak is, kome niet af in het huis, en ga niet in, om iets uit zijn huis weg te nemen.","16":"En die op den akker is, kere niet weder terug, om zijn kleed te nemen.","17":"Maar wee den bevruchten en den zogenden *vrouwen* in die dagen!","18":"Doch bidt, dat uw vlucht niet geschiede des winters.","19":"Want die dagen zullen zulke verdrukking zijn, welker gelijke niet geweest is van het begin der schepselen, die God geschapen heeft, tot nu toe, en ook niet zijn zal.","20":"En indien de Heere de dagen niet verkort had, geen vlees zou behouden worden; maar om der uitverkorenen wil, die Hij heeft uitverkoren, heeft Hij de dagen verkort.","21":"En alsdan, zo iemand tot ulieden zal zeggen: Ziet, hier is de Christus; of ziet, Hij is daar; gelooft het niet.","22":"Want er zullen valse christussen, en valse profeten opstaan, en zullen tekenen en wonderen doen, om te verleiden, indien het mogelijk ware, ook de uitverkorenen.","23":"Maar gijlieden ziet toe; ziet, Ik heb u alles voorzegd!","24":"Maar in die dagen, na die verdrukking, zal de zon verduisterd worden, en de maan zal haar schijnsel niet geven.","25":"En de sterren des hemels zullen daaruit vallen, en de krachten, die in de hemelen *zijn*, zullen bewogen worden.","26":"En alsdan zullen zij den Zoon des mensen zien, komende in de wolken, met grote kracht en heerlijkheid.","27":"En alsdan zal Hij Zijn engelen uitzenden, en zal Zijn uitverkorenen bijeenvergaderen uit de vier winden, van het uiterste der aarde, tot het uiterste des hemels.","28":"En leert van den vijgeboom deze gelijkenis; wanneer nu zijn tak teder wordt, en de bladeren uitspruiten, zo weet gij, dat de zomer nabij is.","29":"Alzo ook gij, wanneer gij deze dingen zult zien geschieden, zo weet, dat *het* nabij, voor de deur is.","30":"Voorwaar, Ik zeg u, dat dit geslacht niet zal voorbijgaan, totdat al deze dingen zullen geschied zijn.","31":"De hemel en de aarde zullen voorbijgaan; maar Mijn woorden zullen geenszins voorbijgaan.","32":"Maar van dien dag en die ure weet niemand, noch de engelen, die in den hemel zijn, noch de Zoon, dan de Vader.","33":"Ziet toe, waakt en bidt; want gij weet niet, wanneer de tijd is.","34":"Gelijk een mens, buiten 's lands reizende, zijn huis verliet, en zijn dienstknechten macht gaf, en elk zijn werk, en den deurwachter gebood, dat hij zou waken;","35":"Zo waakt dan ( want gij weet niet, wanneer de heer des huizes komen zal, *des* *avonds* laat, of ter middernacht, of met het hanengekraai, of in den morgenstond);","36":"Opdat hij niet onvoorziens kome, en u slapende vinde.","37":"En hetgeen Ik u zeg, *dat* zeg Ik allen: Waakt."},"KJV":{"1":"And as he went out of the temple, one of his disciples saith unto him, Master, see what manner of stones and what buildings","2":"And Jesus answering said unto him, Seest thou these great buildings? there shall not be left one stone upon another, that shall not be thrown down.","3":"And as he sat upon the mount of Olives over against the temple, Peter and James and John and Andrew asked him privately,","4":"Tell us, when shall these things be? and what *shall be* the sign when all these things shall be fulfilled?","5":"And Jesus answering them began to say, Take heed lest any *man* deceive you:","6":"For many shall come in my name, saying, I am *Christ*; and shall deceive many.","7":"And when ye shall hear of wars and rumours of wars, be ye not troubled: for *such things* must needs be; but the end *shall* not *be* yet.","8":"For nation shall rise against nation, and kingdom against kingdom: and there shall be earthquakes in divers places, and there shall be famines and troubles: these *are* the beginnings of sorrows.","9":"But take heed to yourselves: for they shall deliver you up to councils; and in the synagogues ye shall be beaten: and ye shall be brought before rulers and kings for my sake, for a testimony against them.","10":"And the gospel must first be published among all nations.","11":"But when they shall lead *you*, and deliver you up, take no thought beforehand what ye shall speak, neither do ye premeditate: but whatsoever shall be given you in that hour, that speak ye: for it is not ye that speak, but the Holy Ghost.","12":"Now the brother shall betray the brother to death, and the father the son; and children shall rise up against *their* parents, and shall cause them to be put to death.","13":"And ye shall be hated of all *men* for my name's sake: but he that shall endure unto the end, the same shall be saved.","14":"But when ye shall see the abomination of desolation, spoken of by Daniel the prophet, standing where it ought not, (let him that readeth understand,) then let them that be in Judaea flee to the mountains:","15":"And let him that is on the housetop not go down into the house, neither enter *therein*, to take any thing out of his house:","16":"And let him that is in the field not turn back again for to take up his garment.","17":"But woe to them that are with child, and to them that give suck in those days!","18":"And pray ye that your flight be not in the winter.","19":"For *in* those days shall be affliction, such as was not from the beginning of the creation which God created unto this time, neither shall be.","20":"And except that the Lord had shortened those days, no flesh should be saved: but for the elect's sake, whom he hath chosen, he hath shortened the days.","21":"And then if any man shall say to you, Lo, here *is* Christ; or, lo, *he is* there; believe *him* not:","22":"For false Christs and false prophets shall rise, and shall shew signs and wonders, to seduce, if *it were* possible, even the elect.","23":"But take ye heed: behold, I have foretold you all things.","24":"But in those days, after that tribulation, the sun shall be darkened, and the moon shall not give her light,","25":"And the stars of heaven shall fall, and the powers that are in heaven shall be shaken.","26":"And then shall they see the Son of man coming in the clouds with great power and glory.","27":"And then shall he send his angels, and shall gather together his elect from the four winds, from the uttermost part of the earth to the uttermost part of heaven.","28":"Now learn a parable of the fig tree; When her branch is yet tender, and putteth forth leaves, ye know that summer is near:","29":"So ye in like manner, when ye shall see these things come to pass, know that it is nigh, *even* at the doors.","30":"Verily I say unto you, that this generation shall not pass, till all these things be done.","31":"Heaven and earth shall pass away: but my words shall not pass away.","32":"But of that day and *that* hour knoweth no man, no, not the angels which are in heaven, neither the Son, but the Father.","33":"Take ye heed, watch and pray: for ye know not when the time is.","34":"*For the Son of man is* as a man taking a far journey, who left his house, and gave authority to his servants, and to every man his work, and commanded the porter to watch.","35":"Watch ye therefore: for ye know not when the master of the house cometh, at even, or at midnight, or at the cockcrowing, or in the morning:","36":"Lest coming suddenly he find you sleeping.","37":"And what I say unto you I say unto all, Watch."}},"tsk":{"1":[{"kopje":"toen Hij","refs":["Matt 24:1","Matt 24:2","Luk 21:5-7"]},{"kopje":"uitging","refs":["Ezech 7:20-22","Ezech 8:6","Ezech 10:4","Ezech 10:19","Ezech 11:22","Ezech 11:23","Mal 3:1","Mal 3:2"]}],"2":[{"kopje":"Er","refs":["1 Kon 9:7","1 Kon 9:8","2 Kron 7:20","2 Kron 7:21","Jer 26:18","Micha 3:12","Matt 24:2","Luk 19:41-44","Luk 21:6","Hand 6:14","Openb 11:2"]}],"3":[{"kopje":"tegenover","refs":["Matt 24:3"]},{"kopje":"Petrus","refs":["Mark 1:16-19","Mark 5:37","Mark 9:2","Mark 10:35","Mark 14:33","Joh 1:41","Joh 1:42"]},{"kopje":"apart","refs":["Mark 4:34","Matt 13:10","Matt 13:36"]}],"5":[{"kopj (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

  }
  if (tab === 'bijbeluitleg') {

  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];

    }

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
