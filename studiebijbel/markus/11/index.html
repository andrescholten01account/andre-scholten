<style>

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }

  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }

  .bronregel { font-size:.72rem; color:#999; margin-top:.6rem; }

  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }

  footer.site { margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; font-family: "Lora"; font-size: .72rem; color: #999; line-height: 1.7; }

</style>

spreidden ze op de weg.","9":"En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend *is* Hij Die komt in de Naam van de Heere!","10":"Gezegend *zij* het Koninkrijk van onze vader David, dat komt in de Naam van de Heere! Hosanna in de hoogste *hemelen*!","11":"En Jezus kwam Jeruzalem binnen, en in de tempel; en nadat Hij alles rondom bekeken had, en het al avond aan het worden was, ging Hij naar Bethanië met de twaalf.","12":"En de volgende dag, toen zij uit Bethanië gingen, kreeg Hij honger.","13":"En toen Hij van verre een vijgenboom zag die bladeren had, ging Hij *kijken* of Hij er misschien iets aan zou vinden; en toen Hij erbij gekomen was, vond Hij niets dan bladeren; want het was de tijd van de vijgen nog niet.","14":"En Jezus antwoordde en zei tegen hem: Laat niemand ooit meer *enige* vrucht van u eten, in eeuwigheid! En Zijn discipelen hoorden het.","15":"En zij kwamen in Jeruzalem; en Jezus ging de tempel in, en begon hen die in de tempel verkochten en kochten uit te drijven; en de tafels van de wisselaars, en de stoelen van hen die de duiven verkochten, keerde Hij om;","16":"en Hij liet niet toe dat iemand enig voorwerp door de tempel droeg.","17":"En Hij onderwees hen, en zei: Staat er niet geschreven: Mijn huis zal een huis van gebed genoemd worden voor alle volken? Maar u hebt het *tot* een rovershol gemaakt.","18":"En de Schriftgeleerden en de overpriesters hoorden *dat*, en zochten hoe zij Hem konden doden; want zij waren bang voor Hem, omdat de hele menigte verbaasd was over Zijn onderwijs.","19":"En toen het avond geworden was, ging Hij de stad uit.","20":"En 's morgens vroeg, toen zij voorbijkwamen, zagen zij dat de vijgenboom verdord was, van de wortels af.","21":"En Petrus, die zich *dit* herinnerde, zei tegen Hem: Rabbi, zie, de vijgenboom die U vervloekt hebt, is verdord.","22":"En Jezus antwoordde en zei tegen hen: Heb geloof in God.","23":"Want voorwaar, Ik zeg u, dat wie tegen deze berg zal zeggen: Word opgeheven en in de zee geworpen; en niet zal twijfelen in zijn hart, maar zal geloven dat wat hij zegt, zal gebeuren, het zal hem gebeuren, wat hij ook zegt.","24":"Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.","25":"En wanneer u staat om te bidden, vergeef als u iets tegen iemand hebt; opdat ook uw Vader, Die in de hemelen is, u uw overtredingen vergeeft.","26":"Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.","27":"En zij kwamen weer in Jeruzalem. En terwijl Hij in de tempel liep, kwamen de overpriesters, en de Schriftgeleerden, en de oudsten naar Hem toe.","28":"en zeiden tegen Hem: Door welke macht doet U deze dingen? En wie heeft U deze macht gegeven, dat U deze dingen zou doen?","29":"Maar Jezus antwoordde en zei tegen hen: Ik zal u ook één ding vragen; antwoord Mij ook, en dan zal Ik u zeggen door welke macht Ik deze dingen doe:","30":"De doop van Johannes, was die uit de hemel, of uit de mensen? Antwoord Mij.","31":"En zij overlegden onder elkaar, en zeiden: Als wij zeggen: Uit de hemel, dan zal Hij zeggen: Waarom hebt u hem dan niet geloofd?","32":"Maar als wij zeggen: Uit de mensen; dan zijn wij bang voor het volk; want zij hielden allen Johannes voor een echte profeet.","33":"En zij antwoordden en zeiden tegen Jezus: Wij weten het niet. En Jezus antwoordde en zei tegen hen: Dan zeg Ik u ook niet door welke macht Ik deze dingen doe."},"SV":{"1":"En toen zij Jeruzalem genaakten, te Beth-fage en Bethanië, aan den Olijfberg, zond Hij twee van Zijn discipelen uit,","2":"En zeide tot hen: Gaat heen in het vlek, dat tegen u over is; en terstond als gij in hetzelve komt, zult gij vinden een veulen gebonden, op hetwelk geen mens gezeten heeft, ontbindt het, en brengt het.","3":"En indien iemand tot u zegt: Waarom doet gij dat? Zo zegt, dat de Heere hetzelve van node heeft; en hij zal het terstond herwaarts zenden.","4":"En zij gingen heen, en vonden het veulen gebonden bij de deur, buiten aan de wegscheiding, en zij ontbonden hetzelve.","5":"En sommigen van degenen, die aldaar stonden, zeiden tot hen: Wat doet gij, dat gij het veulen ontbindt?","6":"Doch zij zeiden tot hen, gelijk Jezus bevolen had; en zij lieten ze gaan.","7":"En zij brachten het veulen tot Jezus, en wierpen hun klederen daarop; en Hij zat op hetzelve.","8":"En velen spreidden hun klederen op den weg, en anderen hieuwen meien van de bomen, en spreidden ze op den weg.","9":"En die voorgingen en die volgden riepen, zeggende: Hosanna! gezegend *is* Hij, Die komt in den Naam des Heeren!","10":"Gezegend *zij* het Koninkrijk van onzen vader David, hetwelk komt in den Naam des Heeren! Hosanna in de hoogste *hemelen*!","11":"En Jezus kwam binnen Jeruzalem, en in den tempel; en als Hij alles rondom bezien had, en het nu avondstond was, ging Hij uit naar Bethanië met de twaalven.","12":"En des anderen daags, als zij uit Bethanië gingen, hongerde Hem.","13":"En ziende van verre een vijgeboom, die bladeren had, ging Hij *om* *te* *zien*, of Hij ook iets op denzelven zou vinden; en daarbij gekomen zijnde, vond Hij niet dan bladeren; want het was de tijd der vijgen niet.","14":"En Jezus, antwoordende, zeide tot denzelven: Niemand ete *enige* vrucht meer van u in der eeuwigheid! En Zijn discipelen hoorden het.","15":"En zij kwamen te Jeruzalem; en Jezus, in den tempel gegaan zijnde, begon degenen, die in den tempel verkochten en kochten, uit te drijven; en de tafelen der wisselaars, en de zitstoelen dergenen, die de duiven verkochten, keerde Hij om;","16":"En liet niet toe, dat iemand enig vat door den tempel droeg.","17":"En Hij leerde, zeggende tot hen: Is er niet geschreven: Mijn huis zal een huis des gebeds genaamd worden allen volken? Maar gij hebt dat *tot* een kuil der moordenaren gemaakt.","18":"En de Schriftgeleerden en de overpriesters hoorden *dat*, en zochten, hoe zij Hem doden zouden; want zij vreesden Hem, omdat de ganse schare ontzet was over Zijn leer.","19":"En als het nu laat geworden was, ging Hij uit buiten de stad.","20":"En des morgens vroeg voorbijgaande, zagen zij, dat de vijgeboom verdord was, van de wortelen af.","21":"En Petrus, *zulks* indachtig geworden zijnde, zeide tot Hem: Rabbi! zie, de vijgeboom, dien Gij vervloekt hebt, is verdord.","22":"En Jezus, antwoordende, zeide tot hen: Hebt geloof op God.","23":"Want voorwaar zeg Ik u, dat, zo wie tot dezen berg zal zeggen: Word opgeheven en in de zee geworpen; en niet zal twijfelen in zijn hart, maar zal geloven, dat hetgeen hij zegt, geschieden zal, het zal hem geworden, zo wat hij zegt.","24":"Daarom zeg Ik u: Alle dingen, die gij biddende begeert, gelooft, dat gij ze ontvangen zult, en zij zullen u geworden.","25":"En wanneer gij staat om te bidden, vergeeft, indien gij iets hebt tegen iemand; opdat ook uw Vader, Die in de hemelen is, ulieden uw misdaden vergeve.","26":"Maar indien gij niet vergeeft, zo zal uw Vader, Die in de hemelen is, ook uw misdaden niet vergeven.","27":"En zij kwamen wederom te Jeruzalem. En als Hij in den tempel wandelde, kwamen tot Hem de overpriesters, en de Schriftgeleerden, en de ouderlingen.","28":"En zeiden tot Hem: Door wat macht doet Gij deze dingen? En wie heeft U deze macht gegeven, dat Gij deze dingen doen zoudt?","29":"Maar Jezus, antwoordende, zeide tot hen: Ik zal u ook een woord vragen; antwoordt Mij ook, en zo zal Ik u zeggen, door wat macht Ik deze dingen doe:","30":"De doop van Johannes, was die uit den hemel, of uit de mensen? Antwoordt Mij.","31":"En zij overlegden onder zich, zeggende: Indien wij zeggen: Uit den hemel, zo zal Hij zeggen: Waarom hebt gij hem dan niet geloofd?","32":"Maar indien wij zeggen: Uit de mensen; zo vrezen wij het volk; want zij hielden allen van Johannes, dat hij waarlijk een profeet was.","33":"En, antwoordende, zeiden zij tot Jezus: Wij weten het niet. En Jezus, antwoordende, zeide tot hen: Zo zeg Ik u ook niet, door wat macht Ik deze dingen doe."},"KJV":{"1":"And when they came nigh to Jerusalem, unto Bethphage and Bethany, at the mount of Olives, he sendeth forth two of his disciples,","2":"And saith unto them, Go your way into the village over against you: and as soon as ye be entered into it, ye shall find a colt tied, whereon never man sat; loose him, and bring","3":"And if any man say unto you, Why do ye this? say ye that the Lord hath need of him; and straightway he will send him hither.","4":"And they went their way, and found the colt tied by the door without in a place where two ways met; and they loose him.","5":"And certain of them that stood there said unto them, What do ye, loosing the colt?","6":"And they said unto them even as Jesus had commanded: and they let them go.","7":"And they brought the colt to Jesus, and cast their garments on him; and he sat upon him.","8":"And many spread their garments in the way: and others cut down branches off the trees, and strawed *them* in the way.","9":"And they that went before, and they that followed, cried, saying, Hosanna; Blessed *is* he that cometh in the name of the Lord:","10":"Blessed *be* the kingdom of our father David, that cometh in the name of the Lord: Hosanna in the highest.","11":"And Jesus entered into Jerusalem, and into the temple: and when he had looked round about upon all things, and now the eventide was come, he went out unto Bethany with the twelve.","12":"And on the morrow, when they were come from Bethany, he was hungry:","13":"And seeing a fig tree afar off having leaves, he came, if haply he might find any thing thereon: and when he came to it, he found nothing but leaves; for the time of figs was not","14":"And Jesus answered and said unto it, No man eat fruit of thee hereafter for ever. And his disciples heard","15":"And they come to Jerusalem: and Jesus went into the temple, and began to cast out them that sold and bought in the temple, and overthrew the tables of the moneychangers, and the seats of them that sold doves;","16":"And would not suffer that any man should carry *any* vessel through the temple.","17":"And he taught, saying unto them, Is it not written, My house shall be called of all nations the house of prayer? but ye have made it a den of thieves.","18":"And the scribes and chief priests heard *it*, and sought how they might destroy him: for they feared him, because all the people was astonished at his doctrine.","19":"And when even was come, he went out of the city.","20":"And in the morning, as they passed by, they saw the fig tree dried up from the roots.","21":"And Peter calling to remembrance saith unto him, Master, behold, the fig tree which thou cursedst is withered away.","22":"And Jesus answering saith unto them, Have faith in God.","23":"For verily I say unto you, That whosoever shall say unto this mountain, Be thou removed, and be thou cast into the sea; and shall not doubt in his heart, but shall believe that those things which he saith shall come to pass; he shall have whatsoever he saith.","24":"Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive *them*, and ye shall have","25":"And when ye stand praying, forgive, if ye have ought against any: that your Father also which is in heaven may forgive you your trespasses.","26":"But if ye do not forgive, neither will your Father which is in heaven forgive your trespasses.","27":"And they come again to Jerusalem: and as he was walking in the temple, there come to him the chief priests, and the scribes, and the elders,","28":"And say unto him, By what authority doest thou these things? and who gave thee this authority to do these things?","29":"And Jesus answered and said unto them, I will also ask of you one question, and answer me, and I will tell you by what authority I do these things.","30":"The baptism of John, was *it* from heaven, or of men? answer me.","31":"And they reasoned with themselves, saying, If we shall say, From heaven; he will say, Why then did ye not believe him?","32":"But if we shall say, Of men; they feared the people: for all *men* counted John, that he was a prophet indeed.","33":"And they answered and said unto Jesus, We cannot tell. And Jesus answering saith unto them, Neither do I tell you by what authority I do these things."}},"tsk":{"1":[{"kopje":"toen","refs":["Matt 21:1-11","Luk 19:29-40","Joh 12:14-19"]},{"kopje":"bij","refs":["Mark 13:3","2 Sam 15:30","Zach 14:4","Matt 24:3","Matt 26:30","Joh 8:1","Hand 1:12"]},{"kopje":"twee","refs":["Mark 6:7","Mark 14:13"]}],"3":[{"kopje":"dat","refs":["Ps 24:1","Hand 10:36","Hand 17:25","2 Kor 8:9","Hebr 2:7-9"]},{"kopje":"en hij zal het meteen","refs":["Mark 14:15","1 Kron 29:12-18","Ps 110:3","Hand 1:24"]}],"4":[{"kopje":"en vonden","refs":["Matt 21:6","Matt 21:7","Matt 26:19","Luk 19:32-34","Joh 2:5","Hebr 11:8"]}],"7":[{"kopje":"het veulen","refs":["Zach 9:9","Matt 21:4","Matt 21:5","Luk 19:35"]},{"kopje":"en wierpen","refs":["2 Kon 9:13","Matt 21:7","Matt 21:8","Luk 19:36","Joh 12:12-16"]}],"8":[{"kopje":"hakten","refs":["Lev 23:40"]}],"9":[{"kopje":"Hosanna","refs":["Ps 118:25","Ps 118:26","Matt 21:9","Matt 23:39","Luk 19:37","Luk 19:38","Joh 12:13","Joh 19:15"]}],"10":[{"kopje":"het Koninkrijk","refs":["Jes 9:5","Jes 9:6","Jer 33:15-17","Jer 33:26","Ezech 34:23","Ezech 34:24","Ezech 37:24","Ezech 37:25","Hos 3:5","Amos 9:11","Amos 9:12","Luk 1:31-33"]},{"kopje":"in de Naam","refs":["Ps 148:1","Luk 2:14","Luk 19:38-40"]}],"11":[{"kopje":"Jezus","refs":["Mal 3:1","Matt 21:10-16","Luk 19:41-45"]},{"kopje":"nadat","refs":["Ezech 8:9","Zef 1:12"]},{"kopje":"ging Hij","refs":["Matt 21:17","Luk 21:37","Luk 21:38","Joh 8:1","Joh 8:2"]}],"12":[{"kopje":"de volgende","refs":["Matt 21:18-22"]},{"kopje":"kreeg Hij honger","refs":["Matt 4:2","Luk 4:2","Joh 4:6","Joh 4:7","Joh 4:31-33","Joh 19:28","Hebr 2:17"]}],"13":[{"kopje":"zag","refs":["Matt 21:19","Luk 13:6-9"]},{"kopje":"misschien","refs":["Ruth 2:3","1 Sam 6:9","Luk 10:31","Luk 12:6","Luk 12:7"]},{"kopje":"vond Hij","refs":["Jes 5:7"]}],"14":[{" catchword":null,"tekst":"And the next day as they went out of Bethany he was hungry."}],"13":[{"catchword":null,"tekst":"And seeing a fig tree afar off which had leaves he went to see it perhaps he might find anything upon the same and being come to it he found nothing but leaves for it was not the time of figs [that is the right for ordinary fig-tree to have their full and ripe fruit although in those hot countries the fig tree-tree I even out of the season bear also some untimely fruits which used to be eaten by the common people and such it seems Christ thought to have found thereon ]"}],"14":[{"catchword":null,"tekst":"And Jesus answering said unto the seme [The word answer according to the Hebrew phrase signifies often to begin to speak as here clearly appears] let no man eat any fruit of thee forever and his disciples heard it."}],"15":[{"catchword":null,"tekst":"And they came to Jerusalem and Jesus being gone into the temple he began to drive out them that sold and bought in the temple and overturned the table of the changers and the chairs of them that sold doves."}],"16":[{"catchword":null,"tekst":"And suffered not that any man should carry any vessel [namely not belonging to the service of God] through the temple."}],"17":[{"catchword":null,"tekst":"And he taught saying unto them is it not written my house shall be called [that is be and be accounted] an house of prayer to all nations? But ye have made it a den of murderers."}],"18":[{"catchword":null,"tekst":"And the Scribes and the chief priests heard that and sought how they might put him to death [Gr destroy and ruine him] for they feared him because the whole multitude was astonished at his doctrine [or was striken namely through admiration and therefore they feared that all people would adhere to his doctrine and fall away from them]"}],"19":[{"catchword":null,"tekst":"And when it was now grown late he went forth without the city."}],"20":[{"catchword":null,"tekst":"And early in the morning passing by they saw that fig-tree has withered from the very roots."}],"21":[{"catchword":null,"tekst":"And Peter calli9ng this to mind [namely that which was said before by Christ verse 14] aid unto him Rabbi behold the fig-tree they which thou curseth is withered."}],"22":[{"catchword":null,"tekst":"And Jesus answering said unto them have faith in God [Gr have the faith of God that is which firmly relies and trusts on God and his promises]"}],"23":[{"catchword":null,"tekst":"For verily I say unto you that whosoever shall say to this mountain be lifted up and cast into the sea and shall not doubt inhis heart but shall believe that which h saith shall come to pass it shall happen to him according to what he saith."}],"24":[{"catchword":null,"tekst":"Therefore I say unto you all things which ye desire praying [namely according to the will of God see 1Jn 5:14] believe that ye shall receive them [Gr do receive] and they shall happen unto ye."}],"25":[{"catchword":null,"tekst":"And when ye stand [that is appear before God and present yourself there to pray for howsoever the ews sometimes prayed standing Job 30:20 Jer 15:1 Luk 18:13 yet for the most part they prayed n their knees 2 Chronicles 6.13 Dan 6:10 Act 9:40 and 20.36] for to pray [Gr praying] forgive if ye have ought against any man that your father also which is in heaven may forgive ye your trespasses."}],"26":[{"catchword":null,"tekst":"But if ye forgive not neither shall your father who is in heaven forgive your trespasses."}],"27":[{"catchword":null,"tekst":"And they came again to Jerusalem and as they walked in the temple there came to him the chief priests the Scribes and the elders [that is the rulers of the eldest of the people who together the chief priest and the scribes made up a great council of the Jews at that time]"}],"28":[{"catchword":null,"tekst":"And said unto him by what authority [Gr in what authority] doth thou these things? And who gave thee the authority that thou shouldst do those things?"}],"29":[{"catchword":null,"tekst":"But Jesus answering said unto them I will also ask ye one word [that is one thing Hebrew] and answer me and I will tell ye by what authority I do those things."}],"30":[{"catchword":null,"tekst":"The baptism of John [that is the doctrine of John confirmed by baptism as appears by the following verse] was that out of heaven or of men? Answer me."}],"31":[{"catchword":null,"tekst":"And they reasoned among themselves saying if we say out of heaven then he will say why then did ye not believe him?"}],"32":[{"catchword":null,"tekst":"But if we say of men then we fear the people [Gr they feared it is an imperfect manner of speaking whereby their disturbance and reasoning are briefly exprest] for they held concerning John that he was a prophet indeed."}],"33":[{"catchword":null,"tekst":"And answering they said unto Jesus we know it is not And Jesus answering said unto them neither do I tell ye by what authority I do these things."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
