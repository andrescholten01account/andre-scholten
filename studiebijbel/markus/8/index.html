 hart, zei Hij tegen de man: Strek uw hand uit. En hij strekte hem uit; en zijn hand werd hersteld, gezond als de andere.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Gal 5:24": "Maar wie van Christus zijn, hebben het vlees gekruisigd met zijn hartstochten en begeerten.", "Jer 7:8-10": "Zie, u vertrouwt op valse woorden, die geen nut doen. Zult u stelen, doodslaan en overspel bedrijven, en vals zweren, en voor Baäl reukwerk branden, en andere goden nawandelen, die u niet kent, en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.", "Joh 18:11": "Jezus dan zei tegen Petrus: Steek uw zwaard in de schede. Zou Ik de drinkbeker die de Vader Mij gegeven heeft, niet drinken?", "Jer 5:2": "En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "2 Kor 6:3": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt.", "1 Petr 1:2-5": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd. Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden. Tot een onvergankelijke, onbevlekte en onverwelkbare erfenis, die in de hemelen bewaard is voor u.", "Matt 16:4-12": "Het slechte en overspelige geslacht verlangt een teken; en het zal geen teken gegeven worden, dan het teken van Jona, de profeet. En Hij verliet hen en ging weg. En toen Zijn discipelen naar de overkant gekomen waren, waren zij vergeten brood mee te nemen. En Jezus zei tegen hen: Kijk uit, en wacht u voor de zuurdesem van de Farizeeën en Sadduceeën.", "1 Petr 2:11": "Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel;", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Luk 12:2": "Er is niets bedekt, dat niet onthuld zal worden, en niets verborgen, dat niet bekend zal worden.", "Zach 14:5": "Dan zult u vluchten door de vallei van Mijn bergen (want deze vallei van de bergen zal reiken tot Azal), en u zult vluchten, zoals u vluchtte voor de aardbeving in de dagen van Uzzia, de koning van Juda; dan zal de HEERE, mijn God, komen, en al de heiligen met U, o Heere!", "Openb 4:8-11": "En de vier dieren hadden ieder voor zichzelf zes vleugels rondom, en waren van binnen vol ogen; en zij hebben geen rust, dag en nacht, en zeggen: Heilig, heilig, heilig is de Heere God, de Almachtige, Die was, en Die is, en Die komen zal. En wanneer de dieren heerlijkheid, en eer, en dankzegging gaven aan Hem Die op de troon zat, Die leeft tot in alle eeuwigheid, dan vielen de vierentwintig oudsten neer voor Hem Die op de troon zat, en aanbaden Hem Die leeft tot in alle eeuwigheid, en wierpen hun kronen voor de troon, en zeiden:", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "1 Kor 9:18": "Wat loon heb ik dan? Namelijk dat ik, terwijl ik het Evangelie verkondig, het Evangelie van Christus kosteloos aanbied, om mijn macht in het Evangelie niet te misbruiken.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Matt 25:19": "En na lange tijd kwam de heer van die dienstknechten, en hield afrekening met hen.", "Matt 13:38-42": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Matt 17:13": "Toen begrepen de discipelen dat Hij tot hen over Johannes de Doper had gesproken.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "1 Kor 1:24": "Maar voor hen die geroepen zijn, zowel Joden als Grieken, prediken wij Christus, de kracht van God, en de wijsheid van God.", "Hagg 2:5": "Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen;", "Ezech 1:4-25": "Toen zag ik, en zie, een stormwind kwam van het noorden af, een grote wolk, en een vuur dat zichzelf omvatte, en een glans was rondom die wolk; en uit het midden daarvan was iets als de kleur van amber, uit het midden van het vuur. En uit het midden daarvan kwam de gelijkenis van vier levende wezens; en dit was hun gedaante: zij hadden de gelijkenis van een mens; En elk had vier gezichten; ook had elk van hen vier vleugels.", "Kol 1:18": "en Hij is het Hoofd van het lichaam, namelijk van de Gemeente, Hij, Die het Begin is, de Eerstgeborene uit de doden, opdat Hij in alles de Eerste zou zijn.", "Luk 13:26": "Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Matt 13:44-46": "Opnieuw, het Koninkrijk der hemelen is gelijk aan een schat, verborgen in de akker, die een mens vond en verborg, en van blijdschap daarover gaat hij heen, en verkoopt alles wat hij heeft, en koopt die akker. Opnieuw, het Koninkrijk der hemelen is gelijk aan een koopman, die mooie parels zoekt; Die, toen hij één parel van grote waarde gevonden had, heenging en alles verkocht wat hij had, en die kocht.", "Joh 12:11": "Want om zijnentwil gingen velen van de Joden weg, en geloofden in Jezus.", "Joh 12:26-28": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren. Nu is Mijn ziel ontroerd; en wat zal Ik zeggen? Vader, verlos Mij uit dit uur! Maar hierom ben Ik tot dit uur gekomen. Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Mark 10:14": "Maar Jezus zag dit, en nam het Hem zeer kwalijk, en zei tegen hen: Laat de kinderen bij Mij komen, en verhinder ze niet; want voor zulke is het Koninkrijk van God.", "Spr 26:23-26": "Brandende lippen en een kwaadaardig hart zijn als een potscherf overtrokken met een laagje zilverschuim. Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.", "Matt 21:33-39": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland. Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen. En de landbouwers grepen zijn dienstknechten en sloegen de een, en doodden een ander, en stenigden een derde.", "Spr 21:21": "Wie rechtvaardigheid en weldadigheid najaagt, zal het leven, rechtvaardigheid en eer vinden.", "1 Kon 17:14-16": "Want zo zegt de HEERE, de God van Israël: Het meel van de kruik zal niet verteerd worden, en de olie van de fles zal niet ontbreken, tot op de dag dat de HEERE regen op de aardbodem geven zal. En zij ging heen, en deed naar het woord van Elia; zo at zij, en hij, en haar huis, vele dagen. Het meel van de kruik werd niet verteerd, en de olie van de fles ontbrak niet, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Elia.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Jes 56:2-8": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen. En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom. Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond;", "Luk 18:29": "En Hij zei tegen hen: Voorwaar, Ik zeg u, er is niemand die huis, of ouders, of broers, of vrouw, of kinderen heeft verlaten om het Koninkrijk van God,", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Ef 3:14": "Om deze reden buig ik mijn knieën voor de Vader van onze Heere Jezus Christus,", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.", "Klaagl 3:3": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Mark 1:27": "En zij waren allen zo verbaasd, dat zij onder elkaar vroegen: Wat is dit? Wat is dit voor een nieuw onderwijs, dat Hij met gezag ook de onreine geesten gebiedt, en zij Hem gehoorzaam zijn?", "Matt 16:21": "Van toen af begon Jezus Zijn discipelen te tonen dat Hij naar Jeruzalem moest gaan, en veel moest lijden van de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en op de derde dag moest opstaan.", "Rom 3:27": "Waar is dan de roem? Hij is uitgesloten. Door welke wet? Van de werken? Nee, maar door de wet van het geloof.", "Job 31:34": "Zeker, ik kon wel een grote menigte geweldig onderdrukt hebben; maar de verachtste van de huisgezinnen zou mij afgeschrikt hebben; zodat ik gewezen zou hebben, en bij de deur niet uitgegaan zijn.", "Matt 15:32-39": "En Jezus riep Zijn discipelen tot Zich en zei: Ik ben innerlijk met ontferming bewogen over de menigte, omdat zij nu al drie dagen bij Mij gebleven zijn, en niets hebben om te eten; en Ik wil hen niet nuchter van Mij laten gaan, zodat zij op de weg niet bezwijken. En Zijn discipelen zeiden tegen Hem: Waar zullen wij in de woestijn zoveel broden krijgen, dat wij zo'n grote menigte zouden verzadigen? En Jezus zei tegen hen: Hoeveel broden hebt u? Zij zeiden: Zeven, en een paar visjes.", "Job 10:14": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.", "1 Tess 1:3": "Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader;", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Openb 16:2-21": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.", "Openb 12:11": "En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "Matt 4:25": "En grote menigten volgden Hem na, vanuit Galilea en Dekapolis, en Jeruzalem, en Judea, en van over de Jordaan.", "Job 8:4-7": "Als uw kinderen tegen Hem gezondigd hebben, dan heeft Hij hen ook overgegeven aan de macht van hun overtreding. Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt; als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Job 36:7-12": "Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven. En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben;", "1 Petr 4:1": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde;", "Mark 8:22-26": "En Hij kwam in Bethsaïda; en zij brachten een blinde bij Hem, en smeekten Hem dat Hij hem zou aanraken. En nadat Hij de hand van de blinde genomen had, leidde Hij hem de plaats uit, en nadat Hij in zijn ogen gespuwd had, legde Hij de handen op hem, en vroeg hem of hij iets zag. En hij, opkijkend, zei: Ik zie de mensen, want ik zie hen als bomen lopen.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "2 Sam 24:24": "Doch de koning zei tegen Arauna: Nee, maar ik zal het zeker van u kopen voor de prijs; want ik zal de HEERE, mijn God, geen brandoffers offeren die mij niets kosten. Zo kocht David de dorsvloer en de runderen voor vijftig zilveren sikkels.", "2 Tim 3:13": "Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.", "Job 17:8": "De oprechten zullen hierover verbaasd zijn, en de onschuldige zal zich tegen de huichelaar opmaken;", "Spr 26:19": "zo is een man die zijn naaste bedriegt, en zegt: Maakte ik geen grapje?", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Rom 8:35": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard?", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Matt 16:22": "En Petrus nam Hem apart, en begon Hem te bestraffen en zei: Heere, dat zij verre van U! Dit zal U geenszins gebeuren.", "Luk 12:15": "En Hij zei tegen hen: Kijk uit en wees op uw hoede voor hebzucht; want het leven van iemand hangt niet af van de overvloed van zijn bezittingen.", "Hand 7:53": "U, die de wet ontvangen hebt door bemiddeling van engelen, en die niet gehouden hebt!", "Mark 2:14": "En terwijl Hij voorbijging, zag Hij Levi, de zoon van Alfeüs, in het tolhuis zitten, en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Matt 19:25": "Zijn discipelen nu, toen zij dit hoorden, werden zeer verslagen, en zeiden: Wie kan dan behouden worden?", "Joh 5:37": "En de Vader, Die Mij gezonden heeft, Die heeft Zelf van Mij getuigd. U hebt Zijn stem nooit gehoord, en Zijn gedaante ook niet gezien.", "Mark 6:41-44": "En toen Hij de vijf broden en de twee vissen genomen had, keek Hij op naar de hemel, zegende en brak de broden, en gaf ze aan Zijn discipelen om ze hun voor te leggen, en de twee vissen verdeelde Hij onder allen. En zij aten allen, en werden verzadigd. En zij verzamelden twaalf volle manden met stukken brood, en van de vissen.", "Joh 12:7": "Jezus dan zei: Laat haar met rust; zij heeft dit bewaard voor de dag van Mijn begrafenis.", "Job 4:15-19": "Toen ging er een geest voorbij mijn gezicht; hij deed het haar van mijn lichaam overeind komen. Hij stond stil, maar ik herkende zijn gedaante niet; er was een beeltenis voor mijn ogen; er was stilte, en ik hoorde een stem, die zei: Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker?", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Joh 14:1-3": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij. In het huis van Mijn Vader zijn veel woningen; anders zou Ik het u gezegd hebben. Ik ga heen om u plaats te bereiden. En wanneer Ik heen zal zijn gegaan en u plaats zal hebben bereid, kom Ik terug en zal u tot Mij nemen, opdat u ook mag zijn waar Ik ben.", "Luk 9:55": "Maar Hij keerde Zich om, bestrafte hen en zei: U weet niet wat voor geest u hebt.", "Hand 4:33": "En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.", "Mark 14:58": "Wij hebben Hem horen zeggen: Ik zal deze tempel, die met handen gemaakt is, afbreken, en in drie dagen een andere, zonder handen gemaakt, bouwen.", "Ps 101:7": "Wie bedrog pleegt, zal binnen mijn huis niet blijven; die leugens spreekt, zal voor mijn ogen niet bevestigd worden.", "Jer 2:35": "Nog zegt u: Zeker, ik ben onschuldig; Zijn toorn is immers van mij afgekeerd. Zie, Ik zal met u rechten, omdat u zegt: Ik heb niet gezondigd.", "Luk 10:10-14": "Maar in welke stad u ook binnengaat en zij u niet ontvangen, ga naar buiten op haar straten en zeg: Ook het stof dat uit uw stad aan ons kleeft, schudden wij af tegen u; toch moet u dit weten, dat het Koninkrijk van God dicht bij u gekomen is. En Ik zeg u dat het voor Sodom draaglijker zal zijn op die dag dan voor die stad.", "1 Tess 3:12": "En moge de Heere u doen toenemen en overvloedig maken in de liefde tot elkaar en tot allen, zoals wij ook zijn tot u,", "Ef 4:6": "Eén God en Vader van allen, Die boven allen is, en door allen, en in u allen.", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Matt 16:24": "Toen zei Jezus tegen Zijn discipelen: Als iemand achter Mij aan wil komen, laat hij zichzelf verloochenen, en zijn kruis opnemen, en Mij volgen.", "Openb 22:9": "En hij zei tegen mij: Zie toe, doe dat niet; want ik ben uw mededienstknecht, en van uw broeders de profeten, en van hen die de woorden van dit boek bewaren; aanbid God.", "Hebr 1:4": "Zoveel voortreffelijker geworden dan de engelen, als Hij een uitnemender Naam boven hen geërfd heeft.", "1 Tim 6:10": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.", "Joh 16:10": "En van gerechtigheid, omdat Ik tot Mijn Vader heenga, en u Mij niet meer zult zien;", "Luk 9:18": "En het gebeurde, terwijl Hij eens alleen aan het bidden was en de discipelen bij Hem waren, dat Hij hun vroeg: Wie zeggen de menigten dat Ik ben?", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "1 Kor 6:3": "Weet u niet, dat wij de engelen zullen oordelen? Hoeveel te meer de zaken die dit leven aangaan?", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "Joh 16:23": "En op die dag zult u Mij niets vragen. Voorwaar, voorwaar, Ik zeg u: alles wat u de Vader zult bidden in Mijn Naam, zal Hij u geven.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Job 22:21-30": "Gewen u toch aan Hem, en heb vrede; daardoor zal het goede u overkomen. Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart. Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 125:1-3": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid. Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid. Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "Ezech 23:35": "Daarom, zo zegt de Heere HEERE: Omdat u Mij vergeten hebt, en Mij achter uw rug geworpen hebt, daarom draagt u ook uw schandelijkheid en uw hoererijen.", "Matt 8:4": "En Jezus zei tegen hem: Zie dat u dit aan niemand zegt; maar ga heen, toon uzelf aan de priester, en offer de gave die Mozes geboden heeft, hun tot een getuigenis.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Gal 5:11": "Maar ik, broeders! Als ik nog de besnijdenis predik, waarom word ik dan nog vervolgd? Dan is de ergernis van het kruis verdwenen.", "Mark 5:27-29": "Zij had over Jezus gehoord, en kwam van achteren tussen de menigte door, en raakte Zijn kleed aan; Want zij zei: Als ik maar Zijn kleren mag aanraken, zal ik gezond worden. En meteen droogde de bron van haar bloed op, en zij voelde aan haar lichaam dat zij van die kwaal genezen was.", "Luk 24:7": "en zei: De Zoon des mensen moet overgeleverd worden in de handen van zondige mensen, en gekruisigd worden, en op de derde dag weer opstaan.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "1 Joh 2:15-17": "Heb de wereld niet lief, en ook niet wat in de wereld is; als iemand de wereld liefheeft, is de liefde van de Vader niet in hem. Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld. En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "Jes 58:2-5": "Hoewel zij Mij dagelijks zoeken en een lust hebben aan de kennis van Mijn wegen, als een volk dat gerechtigheid doet en het recht van zijn God niet verlaat, vragen zij Mij naar de rechten van de gerechtigheid; zij hebben een lust om tot God te naderen; En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid. Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "Matt 6:1-4": "Let op dat u uw aalmoes niet doet voor de mensen, om door hen gezien te worden; anders hebt u geen loon bij uw Vader, Die in de hemelen is. Wanneer u dan aalmoes doet, laat het dan niet voor u uittrompetten, zoals de geveinsden doen in de synagogen en op de straten, opdat zij door de mensen geëerd worden. Voorwaar, Ik zeg u: zij hebben hun loon al ontvangen. Maar als u aalmoes doet, laat uw linkerhand dan niet weten wat uw rechterhand doet;", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Job 20:4-29": "Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft, Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken;", "Luk 18:12": "Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "2 Kon 4:42-44": "En er kwam een man van Baäl-Salisa, en bracht de man Gods brood van de eerstelingen, twintig gerstebroden, en groene aren in hun schillen; en hij zei: Geef aan het volk, zodat zij eten. Doch zijn dienaar zei: Wat, zou ik dit aan honderd mannen voorzetten? En hij zei: Geef aan het volk, zodat zij eten; want zo zegt de HEERE: Men zal eten en overhouden. Zo zette hij het hun voor, en zij aten, en zij hielden over, naar het woord van de HEERE.", "Luk 2:35": "(En ook een zwaard zal door uw eigen ziel gaan) opdat de gedachten uit veel harten geopenbaard worden.", "Hebr 2:5": "Want Hij heeft de toekomende wereld, waar wij van spreken, niet aan de engelen onderworpen.", "Matt 27:1": "Toen het morgen geworden was, hebben alle overpriesters en de oudsten van het volk samen een besluit genomen tegen Jezus, om Hem te doden.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Matt 24:31": "En Hij zal Zijn engelen uitzenden met een bazuin van groot geluid, en zij zullen Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het ene uiterste van de hemel tot het andere uiterste daarvan.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Joh 17:11": "En Ik ben niet meer in de wereld, maar dezen zijn in de wereld, en Ik kom tot U, Heilige Vader, bewaar hen in Uw Naam, die U Mij gegeven hebt, opdat zij één zijn, zoals Wij.", "Mark 10:32-34": "En zij waren onderweg, op weg naar Jeruzalem; en Jezus liep voor hen uit; en zij waren verbaasd, en terwijl zij Hem volgden, waren zij bang. En Hij nam de twaalf weer apart, en begon hun te vertellen wat Hem zou overkomen; En Hij zei: Zie, wij gaan op naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters, en aan de Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen, en Hem aan de heidenen overleveren; en zij zullen Hem bespotten, en Hem geselen, en Hem bespuwen, en Hem doden; en op de derde dag zal Hij weer opstaan.", "1 Petr 4:13": "maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Gal 5:17": "Want het vlees begeert tegen de Geest, en de Geest tegen het vlees; en die staan tegenover elkaar, zodat u niet doet wat u zou willen.", "Joh 20:1-18": "En op de eerste dag van de week ging Maria Magdalena vroeg, terwijl het nog donker was, naar het graf; en zij zag dat de steen van het graf was weggenomen. Zij liep dan snel en kwam bij Simon Petrus en bij de andere discipel, die Jezus liefhad, en zei tegen hen: Ze hebben de Heere weggenomen uit het graf, en wij weten niet waar ze Hem hebben neergelegd. Petrus dan ging naar buiten, en de andere discipel, en zij kwamen bij het graf.", "Matt 16:27": "Want de Zoon des mensen zal komen in de heerlijkheid van Zijn Vader, met Zijn engelen, en dan zal Hij ieder vergelden naar zijn daden.", "Spr 11:9": "De huichelaar verderft zijn naaste door de mond; maar door kennis worden de rechtvaardigen bevrijd.", "Hebr 4:11": "Laat ons ons dan beijveren om die rust in te gaan, opdat niemand in hetzelfde voorbeeld van ongehoorzaamheid valt.", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "Spr 13:7": "Er is iemand die zichzelf rijk maakt, en toch niets heeft, en iemand die zichzelf arm maakt, en toch veel goed heeft.", "Ps 41:2": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads.", "Ps 22:14": "Zij hebben hun mond tegen mij opgesperd, als een verscheurende en brullende leeuw.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "2 Tim 2:11-13": "Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven; als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen; als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Matt 13:43": "Dan zullen de rechtvaardigen stralen als de zon, in het Koninkrijk van hun Vader. Wie oren heeft om te horen, laat hij horen.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Joh 21:20": "En Petrus keerde zich om, en zag de discipel volgen die Jezus liefhad, die ook tijdens het avondmaal op Zijn borst gevallen was, en gezegd had: Heere! Wie is het die U zal verraden?", "Matt 4:10": "Toen zei Jezus tegen hem: Ga weg, satan, want er staat geschreven: De Heere, uw God, zult u aanbidden, en Hem alleen dienen.", "Matt 14:35": "En toen de mannen van die plaats Hem herkenden, stuurden zij berichten naar dat hele omliggende gebied, en zij brachten naar Hem toe allen die ziek waren;", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Joz 9:14": "Toen namen de mannen van hun reiskost; en zij vroegen het de mond van de HEERE niet.", "Kol 2:10": "En u bent in Hem volmaakt, Die het Hoofd is van alle overheid en macht;", "2 Kor 10:17": "Maar wie roemt, laat die roemen in de Heere.", "Joh 18:8": "Jezus antwoordde: Ik heb u gezegd dat Ik het ben. Als u dan Mij zoekt, laat dezen dan gaan.", "2 Petr 1:16": "Want wij hebben geen kunstig verzonnen fabels nagevolgd, toen wij u de kracht en toekomst van onze Heere Jezus Christus bekendmaakten, maar wij zijn ooggetuigen geweest van Zijn majesteit.", "1 Petr 3:9-12": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven. Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Spr 21:2": "Elke weg van een mens is recht in zijn eigen ogen; maar de HEERE weegt de harten.", "Matt 26:32": "Maar nadat Ik zal opgestaan zijn, zal Ik u voorgaan naar Galilea.", "Joh 11:13": "Maar Jezus had gesproken van zijn dood; zij echter dachten dat Hij sprak van de rust van het slapen.", "Joh 7:46": "De dienaars antwoordden: Nooit heeft een mens zo gesproken, zoals deze Mens.", "Mark 11:18": "En de Schriftgeleerden en de overpriesters hoorden dat, en zochten hoe zij Hem konden doden; want zij waren bang voor Hem, omdat de hele menigte verbaasd was over Zijn onderwijs.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Luk 9:13": "Maar Hij zei tegen hen: Geeft u hun te eten. En zij zeiden: Wij hebben niet meer dan vijf broden en twee vissen; of we zouden op pad moeten gaan om voor al dit volk voedsel te kopen.", "Joh 20:9": "Want zij kenden de Schrift nog niet, dat Hij uit de doden moest opstaan.", "Jer 31:32": "Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE;", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Joh 13:18-27": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven. Van nu af zeg Ik het u, voordat het gebeurd is, opdat u, wanneer het gebeurd zal zijn, kunt geloven dat Ik het ben. Voorwaar, voorwaar, Ik zeg u: Als Ik iemand zend, wie hem ontvangt, die ontvangt Mij, en wie Mij ontvangt, die ontvangt Hem Die Mij gezonden heeft.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Luk 9:46-48": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn. Maar Jezus, die de gedachte van hun hart zag, nam een kind en zette dat naast Zich, en zei tegen hen: Wie dit kind ontvangt in Mijn Naam, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem Die Mij gezonden heeft. Want wie de minste is onder u allen, die zal groot zijn.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Luk 22:21": "Maar zie, de hand van hem die Mij verraadt, is met Mij aan de tafel.", "Matt 5:13": "U bent het zout der aarde; maar als het zout smakeloos wordt, waarmee zal het gezouten worden? Het deugt nergens meer toe dan om buiten geworpen en door de mensen vertrapt te worden.", "Joh 10:42": "En velen geloofden daar in Hem.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Spr 30:13": "Een geslacht wiens ogen hoogmoedig zijn, en wiens oogleden verheven zijn;", "Jes 50:6": "Ik geef Mijn rug aan hen die Mij slaan, en Mijn wangen aan hen die Mij het haar uitplukken; Mijn gezicht verberg Ik niet voor smaad en speeksel.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "Mark 6:38-44": "En Hij zei tegen hen: Hoeveel broden hebt u? Ga kijken ernaar. En toen zij het te weten waren gekomen, zeiden zij: Vijf, en twee vissen. En Hij gebood hun dat zij hen allen in groepen zouden laten neerzitten op het groene gras. En zij gingen zitten in groepen, bij honderd samen, en bij vijftig samen.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "Matt 22:34": "En toen de Farizeeën hoorden dat Hij de Sadduceeën de mond gestopt had, werden zij bijeengebracht.", "Matt 19:1": "En het gebeurde, toen Jezus deze woorden geëindigd had, dat Hij vertrok van Galilea, en kwam over de Jordaan, in de landstreken van Judea.", "Zach 11:13": "Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze in het huis van de HEERE, voor de pottenbakker.", "1 Sam 8:20": "en wij zullen ook zijn zoals alle volken; en onze koning zal ons richten, en hij zal voor ons uit gaan, en hij zal onze oorlogen voeren.", "Gal 1:1": "Paulus, een apostel, geroepen niet vanuit mensen, ook niet door een mens, maar door Jezus Christus, en God de Vader, Die Hem uit de doden heeft opgewekt,", "Joh 16:17": "Sommigen van Zijn discipelen zeiden dan tegen elkaar: Wat betekent dit, dat Hij tegen ons zegt: Nog een korte tijd, en u zult Mij niet zien; en opnieuw een korte tijd, en u zult Mij zien; en: Want Ik ga heen tot de Vader?", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Luk 12:1": "Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.", "Hebr 10:27": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden.", "Openb 7:14": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam.", "Joh 14:9": "Jezus zei tegen hem: Ben Ik zo lange tijd bij u, en hebt u Mij niet gekend, Filippus? Wie Mij gezien heeft, heeft de Vader gezien; en hoe zegt u dan: Toon ons de Vader?", "1 Petr 4:4": "waarin zij het vreemd vinden dat u niet meeloopt naar dezelfde uitspatting van losbandigheid, en u belasteren;", "Hos 12:9": "Nog zegt Efraïm: Toch ben ik rijk geworden, ik heb voor mij groot goed verkregen; in al mijn arbeid zullen zij mij geen ongerechtigheid vinden, die zonde zou zijn.", "Hand 8:37": "En Filippus zei: Als u van ganser harte gelooft, is het geoorloofd. En hij antwoordde en zei: Ik geloof dat Jezus Christus de Zoon van God is.", "Matt 18:8": "Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Ps 103:21": "Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet!", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "Spr 3:25": "Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt.", "Tit 2:13": "Verwachtend de zalige hoop en verschijning van de heerlijkheid van de grote God en onze Zaligmaker Jezus Christus;", "Mark 12:37": "David zelf noemt Hem dan zijn Heere, en hoe is Hij dan zijn Zoon? En de menigte hoorde Hem graag.", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Hand 3:20": "En Hij Jezus Christus zal gezonden hebben, Die u van tevoren gepredikt is;", "Ps 28:8": "De HEERE is hun Sterkte, en Hij is de Sterkheid van de verlossingen van Zijn Gezalfde.", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Openb 22:4": "En zij zullen Zijn aangezicht zien, en Zijn Naam zal op hun voorhoofden zijn.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Micha 4:14": "Nu, verzamel u met benden, dochter van de bende, hij heeft een belegering tegen ons gelegd; zij zullen de rechter van Israël met de roede op het kinnebak slaan.", "Luk 21:38": "En al het volk kwam 's morgens vroeg naar Hem toe in de tempel, om Hem te horen.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Rom 10:3": "Want omdat zij de rechtvaardigheid van God niet kennen en hun eigen gerechtigheid proberen op te richten, hebben zij zich aan de rechtvaardigheid van God niet onderworpen.", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Openb 20:11-15": "En ik zag een grote witte troon, en Hem Die daarop zat, van Wiens aangezicht de aarde en de hemel wegvloden, en er werd geen plaats voor hen gevonden. En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken. En de zee gaf de doden, die in haar waren; en de dood en het rijk van de dood gaven de doden, die in hen waren; en zij werden geoordeeld, ieder naar zijn werken.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Matt 17:23": "en zij zullen Hem doden, en op de derde dag zal Hij worden opgewekt. En zij werden zeer bedroefd.", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Joh 11:33-38": "Toen Jezus haar dan zag wenen, en de Joden die met haar meekwamen, ook zag wenen, werd Hij zeer bewogen in de geest, en raakte Hij ontroerd; en Hij zei: Waar hebt u hem gelegd? Zij zeiden tegen Hem: Heere, kom en zie het. Jezus weende.", "Luk 24:26": "Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan?", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Spr 15:8": "Het offer van de goddelozen is de HEERE een gruwel; maar het gebed van de oprechten is Zijn welgevallen.", "Zach 6:5": "En de Engel antwoordde, en zei tegen mij: Deze zijn de vier winden van de hemel, die uitgaan van waar zij stonden voor de Heere van de hele aarde.", "Matt 25:41-45": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is. Want Ik ben hongerig geweest, en u hebt Mij niet te eten gegeven; Ik ben dorstig geweest, en u hebt Mij niet te drinken gegeven; Ik was een vreemdeling; en u hebt Mij geen onderkomen gegeven; naakt, en u hebt Mij niet gekleed; ziek, en in de gevangenis, en u hebt Mij niet bezocht.", "Matt 10:37-39": "Wie vader of moeder liefheeft boven Mij, is Mij niet waard; en wie zoon of dochter liefheeft boven Mij, is Mij niet waard. En wie zijn kruis niet op zich neemt, en Mij navolgt, is Mij niet waard. Wie zijn ziel vindt, zal die verliezen; en wie zijn ziel verloren zal hebben om Mij, zal die vinden.", "Ps 73:18-20": "Zeker, U zet hen op gladde plaatsen; U doet hen vallen in verwoestingen. Hoe worden zij als in een ogenblik tot verwoesting, komen zij aan hun einde, gaan zij te niet van verschrikkingen! Als een droom na het ontwaken! Als U opwaakt, o Heere, dan zult U hun beeld verachten.", "Joh 12:16": "Dit begrepen Zijn discipelen eerst niet; maar toen Jezus verheerlijkt was, toen herinnerden zij zich dat dit van Hem geschreven was, en dat zij dit met Hem gedaan hadden.", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "1 Kor 1:22": "Omdat de Joden een teken begeren, en de Grieken wijsheid zoeken;", "Matt 26:45": "Toen kwam Hij bij Zijn discipelen en zei tegen hen: Slaapt nu maar door en rust; zie, het uur is nabij gekomen, en de Zoon des mensen wordt overgeleverd in de handen van de zondaars.", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "Joh 15:24": "Als Ik de werken onder hen niet had gedaan, die niemand anders gedaan heeft, hadden zij geen zonde; maar nu hebben zij ze gezien, en hebben zowel Mij als Mijn Vader gehaat.", "Hebr 4:1": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn.", "1 Kor 15:24": "Daarna zal het einde zijn, wanneer Hij het Koninkrijk aan God en de Vader zal hebben overgegeven; wanneer Hij alle heerschappij, alle macht en kracht zal hebben tenietgedaan.", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "Matt 15:31": "Zodat de menigten zich verwonderden, toen zij zagen dat de stommen spraken, de lammen gezond waren, de kreupelen liepen, en de blinden zagen; en zij verheerlijkten de God van Israël.", "Hand 6:9-15": "En er stonden sommigen op uit de synagoge die de synagoge van de Vrijgelatenen genoemd wordt, en van de Cyreneeërs, en van de Alexandrijnen, en van hen die uit Cilicië en Azië waren, en zij redetwistten met Stefanus. En zij konden niet opgewassen zijn tegen de wijsheid en de Geest, door Wie hij sprak. Toen zetten zij mannen op die zeiden: Wij hebben hem lasterlijke woorden horen spreken tegen Mozes en God.", "Mark 4:11": "En Hij zei tegen hen: Aan u is het gegeven het geheimenis van het Koninkrijk van God te verstaan; maar aan hen die buiten zijn, gebeurt dit alles door gelijkenissen;", "Luk 16:1-13": "En Hij zei ook tegen Zijn discipelen: Er was een zeker rijk mens, die een rentmeester had; en deze werd bij hem beschuldigd, dat hij zijn goederen verkwistte. En hij riep hem en zei tegen hem: Hoe hoor ik dit van u? Geef rekenschap van uw rentmeesterschap; want u zult niet meer rentmeester kunnen zijn. En de rentmeester zei bij zichzelf: Wat zal ik doen, omdat mijn heer dit rentmeesterschap van mij afneemt? Graven kan ik niet; te bedelen schaam ik mij.", "Matt 6:8": "Word hun dan niet gelijk; want uw Vader weet wat u nodig hebt, voordat u het Hem vraagt.", "Luk 21:34": "En let op uzelf, dat uw harten niet op enig moment bezwaard worden met brasserij en dronkenschap, en zorgen van dit leven, en dat die dag u niet onvoorzien overkomt.", "2 Kor 6:4": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden,", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Ezech 18:20": "De ziel die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid van de vader, en de vader zal niet dragen de ongerechtigheid van de zoon; de gerechtigheid van de rechtvaardige zal op hem zijn, en de goddeloosheid van de goddeloze zal op hem zijn.", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "Hos 8:3": "Israël heeft het goede verstoten; de vijand zal hem vervolgen.", "Matt 8:3": "En Jezus, de hand uitstrekkend, raakte hem aan, en zei: Ik wil, word gereinigd! En meteen werd hij van zijn melaatsheid gereinigd.", "2 Tim 4:6-8": "Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij. Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden; Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Joh 14:22": "Judas, niet de Iskariot, zei tegen Hem: Heere, hoe komt het dat U Uzelf aan ons zult openbaren, en niet aan de wereld?", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Joh 8:38": "Ik spreek wat Ik bij Mijn Vader gezien heb; en u doet dan ook wat u bij uw vader gezien hebt.", "2 Tess 2:5": "Herinnert u zich niet, dat ik, toen ik nog bij u was, u deze dingen gezegd heb?", "Joh 6:26": "Jezus antwoordde hun en zei: Voorwaar, voorwaar, Ik zeg u: u zoekt Mij niet omdat u tekenen gezien hebt, maar omdat u van de broden gegeten hebt en verzadigd bent.", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "Luk 5:19": "En toen zij vanwege de menigte geen manier vonden om hem naar binnen te brengen, klommen zij op het dak en lieten hem met het draagbed door de dakpannen naar beneden, midden voor Jezus.", "Mal 2:13": "Dit tweede doet u ook: dat u het altaar van de HEERE bedekt met tranen, met wenen en met zuchten, zodat Hij niet meer naar het spijsoffer wil omzien, en het ook niet met welgevallen uit uw hand wil ontvangen.", "1 Kor 10:6": "En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben.", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Matt 15:23": "Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na.", "Luk 7:16-18": "En vrees beving hen allen, en zij verheerlijkten God en zeiden: Een groot Profeet is onder ons opgestaan, en God heeft naar Zijn volk omgezien. En dit gerucht over Hem verspreidde zich in heel Judea, en in heel het omliggende land. En de discipelen van Johannes berichtten hem over al deze dingen.", "Jes 24:7-11": "De most treurt, de wijnstok kwijnt weg, allen die blijhartig waren, zuchten. De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houdt op, de vreugde van de harp rust. Zij zullen geen wijn drinken met gezang; de sterke drank zal bitter zijn voor hen die hem drinken.", "Deut 33:2": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen.", "Joh 10:6": "Deze gelijkenis zei Jezus tegen hen; maar zij begrepen niet wat het was dat Hij tegen hen sprak.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Hand 1:3": "Aan hen heeft Hij Zichzelf ook, nadat Hij geleden had, levend vertoond, met veel duidelijke bewijzen, gedurende veertig dagen door hen gezien, en sprekend over de dingen die het Koninkrijk van God aangaan.", "Jer 12:2": "U hebt hen geplant, zij zijn ook ingeworteld, zij groeien, ook dragen zij vrucht; U bent wel nabij in hun mond, maar ver van hun nieren.", "Matt 7:8": "Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden.", "1 Sam 25:18": "Toen haastte Abigaïl zich, en nam tweehonderd broden, en twee lederzakken wijn, en vijf toebereide schapen, en vijf maten geroosterd koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en legde die op ezels.", "Matt 6:2": "Wanneer u dan aalmoes doet, laat het dan niet voor u uittrompetten, zoals de geveinsden doen in de synagogen en op de straten, opdat zij door de mensen geëerd worden. Voorwaar, Ik zeg u: zij hebben hun loon al ontvangen.", "Joh 15:8-10": "Hierin is Mijn Vader verheerlijkt, dat u veel vrucht draagt; en u zult Mijn discipelen zijn. Zoals de Vader Mij liefgehad heeft, heb Ik ook u liefgehad; blijft in deze Mijn liefde. Als u Mijn geboden bewaart, dan zult u in Mijn liefde blijven; zoals Ik de geboden van Mijn Vader bewaard heb, en blijf in Zijn liefde.", "Matt 26:18": "En Hij zei: Ga de stad in, naar zo iemand, en zeg hem: De Meester zegt: Mijn tijd is nabij, Ik zal bij u het Pascha houden met Mijn discipelen.", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "2 Kron 15:2-4": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten. Israël nu is vele dagen geweest zonder de ware God, en zonder een lerende priester, en zonder de wet. Maar toen zij zich in hun nood bekeerden tot de HEERE, de God van Israël, en Hem zochten, werd Hij door hen gevonden.", "Matt 14:19": "En Hij beval de menigten neer te zitten op het gras, en nam de vijf broden en de twee vissen, en Hij keek op naar de hemel, zegende ze; en toen Hij ze gebroken had, gaf Hij de broden aan de discipelen, en de discipelen aan de menigten.", "Job 21:11-15": "Hun jonge kinderen zenden zij uit als een kudde, en hun kinderen huppelen. Zij heffen op met de trommel en de harp, en verblijden zich bij het geluid van de fluit. In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Ps 89:27": "Hij zal Mij noemen: Gij zijt mijn Vader! mijn God, en de Rotssteen van mijn heil!", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Joh 13:21": "Toen Jezus dit gezegd had, werd Hij ontroerd in de geest, en betuigde en zei: Voorwaar, voorwaar, Ik zeg u, dat een van u Mij zal verraden.", "1 Petr 4:12-16": "Geliefden, houd u niet vreemd over de hitte van de verdrukking onder u, die u overkomt tot beproeving, alsof u iets vreemds overkwam; maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen. Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.", "Spr 23:2": "En zet een mes op uw keel, als u een gulzig mens bent;", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Joh 16:20": "Voorwaar, voorwaar, Ik zeg u: u zult huilen en klagen, maar de wereld zal zich verblijden; en u zult bedroefd zijn, maar uw droefheid zal tot blijdschap worden.", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "Jes 51:18": "Er is niemand van al de kinderen, die zij gebaard heeft, die haar zachtjes leidt; en niemand van al de kinderen, die zij opgevoed heeft, die haar bij de hand grijpt.", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Joh 8:27": "Zij begrepen niet dat Hij tot hen over de Vader sprak.", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "Job 13:16": "Ook zal Hij mij tot heil zijn; maar een huichelaar zal voor Zijn aangezicht niet komen.", "Matt 8:15": "En Hij raakte haar hand aan, en de koorts verliet haar; en zij stond op, en diende hen.", "Mark 9:1": "En Hij zei tegen hen: Voorwaar, Ik zeg u, dat er sommigen zijn van hen die hier staan, die de dood niet zullen smaken, totdat zij gezien zullen hebben dat het Koninkrijk van God met kracht gekomen is.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Matt 19:29": "En al wie huizen zal verlaten hebben, of broeders, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers, om Mijn Naam, die zal honderdvoud ontvangen, en het eeuwige leven beërven.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "1 Petr 5:7": "Werp al uw bekommernis op Hem, want Hij zorgt voor u.", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "Ps 37:23-29": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg. Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand. Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "Mark 6:41": "En toen Hij de vijf broden en de twee vissen genomen had, keek Hij op naar de hemel, zegende en brak de broden, en gaf ze aan Zijn discipelen om ze hun voor te leggen, en de twee vissen verdeelde Hij onder allen.", "Zach 7:6": "Of als u at, en als u dronk, was dat niet voor uzelf, u die daar at, en u die daar dronk?", "Rom 6:22": "Maar nu, vrijgemaakt van de zonde, en dienstbaar gemaakt aan God, hebt u uw vrucht tot heiliging, en het einde het eeuwige leven.", "Matt 10:15": "Voorwaar, Ik zeg u: het zal voor het land van Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Luk 5:30": "En hun Schriftgeleerden en de Farizeeën morden tegen Zijn discipelen en zeiden: Waarom eet en drinkt u met tollenaars en zondaars?", "Matt 7:7": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Matt 9:29": "Toen raakte Hij hun ogen aan en zei: U geschiedt naar uw geloof.", "Num 11:21-23": "En Mozes zei: Zeshonderdduizend man te voet is dit volk, in wiens midden ik ben; en U hebt gezegd: Ik zal hun vlees geven, en zij zullen een hele maand eten! Zullen dan voor hen schapen en runderen geslacht worden, zodat het voor hen genoeg is? Zullen alle vissen van de zee voor hen verzameld worden, zodat het voor hen genoeg is? Maar de HEERE zei tegen Mozes: Zou dan de hand van de HEERE verkort zijn? U zult nu zien of Mijn woord u zal overkomen, of niet.", "Luk 4:37": "En het gerucht over Hem verspreidde zich naar alle plaatsen van het omliggende land.", "1 Kor 11:24": "en toen Hij gedankt had, brak Hij het, en zei: Neemt, eet, dit is Mijn lichaam, dat voor u gebroken wordt; doe dat tot Mijn gedachtenis.", "Luk 5:17": "En het gebeurde op een van die dagen, terwijl Hij aan het lesgeven was, dat er Farizeeën en leraars van de wet zaten die uit alle dorpen van Galilea en Judea en Jeruzalem gekomen waren; en de kracht van de Heere was er om hen te genezen.", "Jak 5:5": "U hebt lekker geleefd op de aarde, en wellust nagejaagd; u hebt uw harten gevoed als op een dag van slachting.", "Joh 19:36": "Want deze dingen zijn gebeurd, opdat de Schrift vervuld wordt: Geen been van Hem zal verbroken worden.", "Job 33:8": "Zeker, u hebt gezegd voor mijn oren, en ik heb de stem der woorden gehoord;", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Jes 26:3": "Het is een vast voornemen: U zult allerlei vrede bewaren, want men heeft op U vertrouwd.", "Luk 19:48": "En zij vonden niet wat zij konden doen, want al het volk hing aan Hem en luisterde naar Hem.", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "2 Sam 19:22": "Maar David zei: Wat heb ik met u te maken, zonen van Zeruja, dat u mij vandaag tot tegenstander zou willen zijn? Zou er vandaag iemand gedood moeten worden in Israël? Want weet ik niet dat ik vandaag koning geworden ben over Israël?", "Matt 13:54": "En toen Hij in Zijn vaderstad gekomen was, leerde Hij hen in hun synagoge, zodat zij versteld stonden en zeiden: Waar komt bij Deze die wijsheid en die krachten vandaan?", "Joh 15:6": "Als iemand in Mij niet blijft, die is buiten geworpen, zoals de rank, en is verdord; en men verzamelt ze, en men werpt ze in het vuur, en zij worden verbrand.", "Mark 13:33-37": "Let op, waak en bid; want u weet niet wanneer de tijd is. Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken; Waak dan (want u weet niet wanneer de heer des huizes zal komen, laat in de avond, of te middernacht, of bij het hanengekraai, of in de ochtend);", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Matt 25:1-13": "Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen. En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Joh 10:27-29": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij. En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken. Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Matt 16:23": "Maar Hij keerde Zich om en zei tegen Petrus: Ga weg, achter Mij, satan! U bent Mij een struikelblok, want u bedenkt niet de dingen die van God zijn, maar die van de mensen zijn.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "1 Tess 5:9-11": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus. Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven. Daarom, vermaan elkaar en bouw de één de ander op, zoals u ook doet.", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Hand 2:19-21": "En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm. De zon zal veranderd worden in duisternis, en de maan in bloed, voordat de grote en luisterrijke dag van de Heere komt. En het zal gebeuren dat ieder die de Naam van de Heere zal aanroepen, behouden zal worden.", "Luk 14:26": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn.", "2 Kor 1:20-22": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons. Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God; Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Jak 2:1-4": "Mijn broeders, houd het geloof van onze Heere Jezus Christus, de Heere der heerlijkheid, niet met aanneming van de persoon. Want als er in uw samenkomst een man binnenkomt met een gouden ring aan de vinger, in sierlijke kleding, en er komt ook een arme man binnen met slechte kleding; en u zou opzien tegen hem die de sierlijke kleding draagt, en tegen hem zeggen: Ga hier op een goede plaats zitten; en zou tegen de arme zeggen: Ga daar staan, of: Ga hier onder mijn voetbank zitten;", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Joh 19:17": "En Hij droeg Zijn kruis, en ging uit naar de plaats genaamd Hoofdschedelplaats, die in het Hebreeuws Golgotha genoemd wordt;", "Spr 27:2": "Laat een vreemde u prijzen, en niet uw mond; een onbekende, en niet uw lippen.", "Job 21:30": "Dat de boze gespaard wordt op de dag van het verderf; dat zij op de dag van de verbolgenheden weggevoerd worden.", "1 Petr 5:6": "Verneder u dan onder de krachtige hand van God, opdat Hij u verhoogt op Zijn tijd.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Luk 23:34": "En Jezus zei: Vader, vergeef het hun; want zij weten niet wat zij doen. En zij verdeelden Zijn kleren en wierpen erom het lot.", "Jes 65:3-5": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt; Zittend bij de graven, zo overnachten zij bij de bewaarde plaatsen, etend zwijnenvlees, en er is sap van gruwelijke dingen in hun vaten. Die daar zeggen: Houd u tot uzelf, en kom niet bij mij, want ik ben heiliger dan u. Deze zijn een rook in Mijn neus, een vuur, dat de hele dag brandt.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Jes 66:3-5": "Wie een os slacht, slaat een man; wie een lam offert, breekt een hond de hals; wie spijsoffer offert, is als die zwijnenbloed offert; wie wierook brandt tot een gedenkoffer, is als die een afgod zegent. Dezen kiezen ook hun eigen wegen, en hun ziel heeft plezier in hun verfoeisels. Ik zal ook hun loon kiezen naar hun handelingen, en hun angsten zal Ik over hen doen komen, omdat Ik geroepen heb, en niemand antwoordde, Ik gesproken heb en zij niet luisterden, maar deden wat kwaad is in Mijn ogen, en kozen wat Ik niet wilde. Hoor het woord van de HEERE, u die voor Zijn woord beeft! Uw broeders, die u haten, die u ver wegsturen, om Mijn Naam, zeggen: Laat de HEERE heerlijk worden! Maar Hij zal verschijnen tot uw vreugde, zij daarentegen zullen beschaamd worden.", "Joh 13:37": "Petrus zei tegen Hem: Heere, waarom kan ik U nu niet volgen? Ik zal mijn leven voor U geven.", "Luk 2:49": "En Hij zei tegen hen: Waarom hebt u Mij gezocht? Wist u niet dat Ik moet zijn in de dingen van Mijn Vader?", "Joh 21:8": "En de andere discipelen kwamen met het scheepje (want zij waren niet ver van het land, maar ongeveer tweehonderd el), en sleepten het net met de vissen mee.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Hand 2:31": "Heeft hij, dit vooruitziend, gesproken over de opstanding van Christus, dat Zijn ziel niet verlaten is in het rijk van de dood, en Zijn vlees geen verderving heeft gezien.", "Mark 1:41": "En Jezus, met innerlijke ontferming bewogen, strekte Zijn hand uit, raakte hem aan, en zei tegen hem: Ik wil het, word gereinigd!", "Dan 7:13": "Verder zag ik in de nachtgezichten, en zie, er kwam Een met de wolken van de hemel, als eens mensen zoon, en Hij kwam tot de Oude van dagen, en men liet Hem voor Hem naderen.", "Matt 27:2": "En nadat zij Hem gebonden hadden, leidden zij Hem weg en gaven Hem over aan Pontius Pilatus, de stadhouder.", "Mark 14:22": "En terwijl zij aten, nam Jezus brood, en nadat Hij gezegend had, brak Hij het, en gaf het hun, en zei: Neem, eet, dat is Mijn lichaam.", "Joh 16:30": "Nu weten wij dat U alle dingen weet, en het niet nodig hebt dat iemand U vraagt. Hierom geloven wij dat U van God bent uitgegaan.", "Matt 24:3": "En toen Hij op de Olijfberg zat, kwamen de discipelen alleen bij Hem en zeiden: Zeg ons, wanneer zullen deze dingen gebeuren? En wat zal het teken zijn van Uw komst en van het einde van de wereld?", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Joh 14:26": "Maar de Trooster, de Heilige Geest, Die de Vader zal zenden in Mijn Naam, Die zal u alles leren, en zal u alles laten herinneren wat Ik u gezegd heb.", "Joh 21:17": "Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Luk 12:9": "Maar wie Mij verloochenen zal voor de mensen, die zal verloochend worden voor de engelen van God.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Ps 44:22": "Zou God dat niet onderzoeken? Want Hij kent de verborgenheden van het hart.", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "Mark 5:43": "En Hij gebood hun dringend, dat niemand dit zou weten; en Hij zei dat men haar te eten zou geven.", "Matt 6:16": "En wanneer u vast, toon dan geen droevig gezicht, zoals de geveinsden; want zij mismaken hun gezicht, opdat zij door de mensen gezien worden als zij vasten. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "1 Tim 5:20": "Bestraf hen die zondigen in aanwezigheid van allen, opdat ook de anderen ontzag mogen hebben.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Openb 21:3-7": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn. En God zal alle tranen van hun ogen afvegen; en de dood zal niet meer zijn; noch rouw, noch geroep, noch moeite zal er meer zijn; want de eerste dingen zijn weggegaan. En Die op de troon zat, zei: Zie, Ik maak alle dingen nieuw. En Hij zei tegen mij: Schrijf, want deze woorden zijn waarachtig en betrouwbaar.", "Matt 24:1-51": "En Jezus ging weg en vertrok van de tempel; en Zijn discipelen kwamen bij Hem om Hem de gebouwen van de tempel te tonen. En Jezus zei tegen hen: Ziet u niet al deze dingen? Voorwaar, Ik zeg u: hier zal geen steen op de andere steen gelaten worden, die niet zal worden afgebroken. En toen Hij op de Olijfberg zat, kwamen de discipelen alleen bij Hem en zeiden: Zeg ons, wanneer zullen deze dingen gebeuren? En wat zal het teken zijn van Uw komst en van het einde van de wereld?", "Openb 11:12": "En zij hoorden een grote stem uit de hemel,
