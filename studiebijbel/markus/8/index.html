","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In diezelfde dagen, toen er een heel grote menigte was, en zij niets hadden om te eten, riep Jezus Zijn discipelen tot Zich, en zei tegen hen:","2":"Ik word innerlijk met ontferming bewogen over de menigte; want zij zijn nu drie dagen bij Mij gebleven, en hebben niets om te eten.","3":"En als Ik hen nuchter naar hun huis laat gaan, zullen zij onderweg bezwijken; want sommigen van hen komen van ver.","4":"En Zijn discipelen antwoordden Hem: Waar zou iemand deze mensen hier in de woestijn met brood kunnen verzadigen?","5":"En Hij vroeg hun: Hoeveel broden hebt u? En zij zeiden: Zeven.","6":"En Hij gebood de menigte op de grond te gaan zitten; en Hij nam de zeven broden, en nadat Hij gedankt had, brak Hij ze, en gaf ze aan Zijn discipelen, opdat zij ze zouden voorleggen; en zij legden ze de menigte voor.","7":"En zij hadden een paar visjes; en nadat Hij gezegend had, zei Hij dat zij die ook zouden voorleggen.","8":"En zij aten, en werden verzadigd, en zij verzamelden het overschot van de stukken, zeven manden.","9":"Zij die nu gegeten hadden, waren ongeveer vierduizend; en Hij liet hen gaan.","10":"En meteen, nadat Hij met Zijn discipelen in het schip gegaan was, kwam Hij in de omgeving van Dalmanutha.","11":"En de Farizeeën gingen naar buiten, en begonnen met Hem te twisten, en verlangden van Hem een teken uit de hemel, om Hem op de proef te stellen.","12":"En Hij, zwaar zuchtend in Zijn geest, zei: Waarom verlangt dit geslacht een teken? Voorwaar, Ik zeg u: Aan dit geslacht zal geen teken gegeven worden!","13":"En Hij verliet hen, en ging weer in het schip, en voer weg naar de andere kant.","14":"En Zijn discipelen waren vergeten brood mee te nemen, en hadden niet meer dan één brood bij zich in het schip.","15":"En Hij gebood hun: Kijk uit, wees op uw hoede voor het zuurdeeg van de Farizeeën, en voor het zuurdeeg van Herodes.","16":"En zij overlegden onder elkaar, en zeiden: *Dit is* omdat wij geen brood hebben.","17":"En Jezus, die *dit* besefte, zei tegen hen: Waarom overlegt u, dat u geen brood hebt? Merkt u het nog niet, en begrijpt u het niet? Is uw hart nog verhard?","18":"Ogen hebbend, ziet u niet? En oren hebbend, hoort u niet?","19":"En herinnert u zich niet, toen Ik de vijf broden brak onder de vijfduizend mannen, hoeveel volle manden met stukken u opraapte? Zij zeiden tegen Hem: Twaalf.","20":"En toen Ik de zeven *brak* onder de vierduizend mannen, hoeveel volle manden met stukken u opraapte? En zij zeiden: Zeven.","21":"En Hij zei tegen hen: Hoe kan het dat u het niet begrijpt?","22":"En Hij kwam in Bethsaïda; en zij brachten een blinde bij Hem, en smeekten Hem dat Hij hem zou aanraken.","23":"En nadat Hij de hand van de blinde genomen had, leidde Hij hem de plaats uit, en nadat Hij in zijn ogen gespuwd had, legde Hij de handen op hem, en vroeg hem of hij iets zag.","24":"En hij, opkijkend, zei: Ik zie de mensen, want ik zie hen als bomen lopen.","25":"Daarna legde Hij de handen weer op zijn ogen, en liet hem opkijken. En hij werd hersteld, en zag hen allen helder en duidelijk.","26":"En Hij stuurde hem naar zijn huis, en zei: Ga niet het dorp in, en vertel het niemand in het dorp.","27":"En Jezus ging weg, en Zijn discipelen, naar de dorpen van Cesarea Filippi. En onderweg vroeg Hij Zijn discipelen: Wie zeggen de mensen dat Ik ben?","28":"En zij antwoordden: Johannes de Doper; en anderen: Elia; en anderen: Een van de profeten.","29":"En Hij zei tegen hen: Maar u, wie zegt u dat Ik ben? En Petrus antwoordde en zei tegen Hem: U bent de Christus.","30":"En Hij gebood hun streng, dat zij het niemand zouden zeggen over Hem.","31":"En Hij begon hun te leren dat de Zoon des mensen veel moest lijden, en verworpen moest worden door de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en na drie dagen weer moest opstaan.","32":"En Hij sprak dit woord openlijk; en Petrus nam Hem apart, en begon Hem te bestraffen;","33":"Maar Hij, Zich omkerend, en Zijn discipelen aankijkend, bestrafte Petrus, en zei: Ga weg, achter Mij, satan, want u denkt niet aan de dingen van God, maar aan de dingen van de mensen.","34":"En Hij riep de menigte tot Zich, samen met Zijn discipelen, en zei tegen hen: Wie achter Mij aan wil komen, die verloochent zichzelf, en neemt zijn kruis op, en volgt Mij.","35":"Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen, omwille van Mij, en *omwille* van het Evangelie, die zal het behouden.","36":"Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?","37":"Of wat zal een mens geven, als losprijs voor zijn ziel?","38":"Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen."},"SV":{"1":"In dezelfde dagen, als er een geheel grote schare was, en zij niet hadden, wat zij eten zouden, riep Jezus Zijn discipelen tot Zich, en zeide tot hen:","2":"Ik word innerlijk met ontferming bewogen over de schare; want zij zijn nu drie dagen bij Mij gebleven, en hebben niet, wat zij eten zouden.","3":"En indien Ik hen nuchteren naar hun huis laat gaan, zo zullen zij op den weg bezwijken; want sommigen van hen komen van verre.","4":"En Zijn discipelen antwoordden Hem: Van waar zal iemand dezen met broden hier in de woestijn kunnen verzadigen?","5":"En Hij vraagde hun: Hoeveel broden hebt gij? En zij zeiden: Zeven.","6":"En Hij gebood de schare neder te zitten op de aarde, en Hij nam de zeven broden, en gedankt hebbende, brak Hij ze, en gaf ze Zijn discipelen, opdat zij ze zouden voorleggen; en zij leiden ze der schare voor.","7":"En zij hadden weinige visjes; en als Hij gezegend had, zeide Hij, dat zij ook die zouden voorleggen.","8":"En zij hebben gegeten, en zijn verzadigd geworden, en zij namen het overschot der brokken op, zeven manden.","9":"Die nu gegeten hadden, waren omtrent vier duizend; en Hij liet hen gaan.","10":"En terstond in het schip gegaan zijnde met Zijn discipelen, is Hij gekomen in de delen van Dalmanutha.","11":"En de Farizeën gingen uit, en begonnen met Hem te twisten, begerende van Hem een teken van den hemel, Hem verzoekende.","12":"En Hij, zwaarlijk zuchtende in Zijn geest, zeide: Wat begeert dit geslacht een teken? Voorwaar, Ik zeg u: Zo aan dit geslacht een teken gegeven zal worden!","13":"En Hij verliet hen, en wederom in het schip gegaan zijnde, voer Hij weg naar de andere zijde.","14":"En Zijn discipelen hadden vergeten brood mede te nemen, en hadden niet dan een brood met zich in het schip.","15":"En Hij gebood hun, zeggende: Ziet toe, wacht u van den zuurdesem der Farizeën, en van den zuurdesem van Herodes.","16":"En zij overleiden onder elkander, zeggende: *Het* *is*, omdat wij geen broden hebben.","17":"En Jezus, *dat* bekennende, zeide tot hen: Wat overlegt gij, dat gij geen broden hebt? Bemerkt gij nog niet, en verstaat gij niet, hebt gij nog uw verharde hart?","18":"Ogen hebbende, ziet gij niet? En oren hebbende, hoort gij niet?","19":"En gedenkt gij niet, toen Ik de vijf broden brak onder de vijf duizend mannen, hoeveel volle korven met brokken gij opnaamt? Zij zeiden Hem: Twaalf.","20":"En toen Ik de zeven *brak* onder de vier duizend mannen, hoeveel volle manden met brokken gij opnaamt? En zij zeiden: Zeven.","21":"En Hij zeide tot hen: Hoe verstaat gij niet?","22":"En Hij kwam te Bethsaida; en zij brachten tot Hem een blinde, en baden Hem, dat Hij hem aanraakte.","23":"En de hand des blinden genomen hebbende, leidde Hij hem uit buiten het vlek, en spoog in zijn ogen, en leide de handen op hem, en vraagde hem, of hij iets zag.","24":"En hij, opziende, zeide: Ik zie de mensen, want ik zie hen, als bomen, wandelen.","25":"Daarna leide Hij de handen wederom op zijn ogen, en deed hem opzien. En hij werd hersteld, en zag hen allen ver en klaar.","26":"En Hij zond hem naar zijn huis, zeggende: Ga niet in het vlek, en zeg het niemand in het vlek.","27":"En Jezus ging uit en Zijn discipelen naar de vlekken van Cesarea Filippi. En op den weg vraagde Hij Zijn discipelen, zeggende tot hen: Wie zeggen de mensen, dat Ik ben?","28":"En zij antwoordden: Johannes de Doper; en anderen: Elias; en anderen: Een van de profeten.","29":"En Hij zeide tot hen: Maar gijlieden, wie zegt gij dat Ik ben? En Petrus, antwoordende, zeide tot Hem: Gij zijt de Christus.","30":"En Hij gebood hun scherpelijk, dat zij het niemand zouden zeggen van Hem.","31":"En Hij begon hun te leren, dat de Zoon des mensen veel moest lijden, en verworpen worden van de ouderlingen, en overpriesters, en Schriftgeleerden, en gedood worden, en na drie dagen wederom opstaan.","32":"En dit woord sprak Hij vrij uit; en Petrus, Hem tot zich genomen hebbende, begon Hem te bestraffen;","33":"Maar Hij, Zich omkerende, en Zijn discipelen aanziende, bestrafte Petrus, zeggende: Ga heen, achter Mij, satanas, want gij verzint niet de dingen, die Gods zijn, maar die der mensen zijn.","34":"En tot Zich geroepen hebbende de schare met Zijn discipelen, zeide Hij tot hen: Zo wie achter Mij wil komen, die verloochene zichzelven, en neme zijn kruis op, en volge Mij.","35":"Want zo wie zijn leven zal willen behouden, die zal hetzelve verliezen; maar zo wie zijn leven zal verliezen, om Mijnentwil, en *om* des Evangelies *wil*, die zal hetzelve behouden.","36":"Want wat zou het den mens baten zo hij de gehele wereld won, en zijner ziele schade leed?","37":"Of wat zal een mens geven, tot lossing van zijn ziel?","38":"Want zo wie zich Mijns en Mijner woorden zal geschaamd hebben, in dit overspelig en zondig geslacht, diens zal Zich de Zoon des mensen ook schamen, wanneer Hij zal komen in de heerlijkheid Zijns Vaders, met de heilige engelen."},"KJV":{"1":"In those days the multitude being very great, and having nothing to eat, Jesus called his disciples *unto him*, and saith unto them,","2":"I have compassion on the multitude, because they have now been with me three days, and have nothing to eat:","3":"And if I send them away fasting to their own houses, they will faint by the way: for divers of them came from far.","4":"And his disciples answered him, From whence can a man satisfy these *men* with bread here in the wilderness?","5":"And he asked them, How many loaves have ye? And they said, Seven.","6":"And he commanded the people to sit down on the ground: and he took the seven loaves, and gave thanks, and brake, and gave to his disciples to set before *them*; and they did set *them* before the people.","7":"And they had a few small fishes: and he blessed, and commanded to set them also before","8":"So they did eat, and were filled: and they took up of the broken *meat* that was left seven baskets.","9":"And they that had eaten were about four thousand: and he sent them away.","10":"And straightway he entered into a ship with his disciples, and came into the parts of Dalmanutha.","11":"And the Pharisees came forth, and began to question with him, seeking of him a sign from heaven, tempting him.","12":"And he sighed deeply in his spirit, and saith, Why doth this generation seek after a sign? verily I say unto you, There shall no sign be given unto this generation.","13":"And he left them, and entering into the ship again departed to the other side.","14":"Now *the disciples* had forgotten to take bread, neither had they in the ship with them more than one loaf.","15":"And he charged them, saying, Take heed, beware of the leaven of the Pharisees, and *of* the leaven of Herod.","16":"And they reasoned among themselves, saying, *It is* because we have no bread.","17":"And when Jesus knew *it*, he saith unto them, Why reason ye, because ye have no bread? perceive ye not yet, neither understand? have ye your heart yet hardened?","18":"Having eyes, see ye not? and having ears, hear ye not? and do ye not remember?","19":"When I brake the five loaves among five thousand, how many baskets full of fragments took ye up? They say unto him, Twelve.","20":"And when the seven among four thousand, how many baskets full of fragments took ye up? And they said, Seven.","21":"And he said unto them, How is it that ye do not understand?","22":"And he cometh to Bethsaida; and they bring a blind man unto him, and besought him to touch him.","23":"And he took the blind man by the hand, and led him out of the town; and when he had spit on his eyes, and put his hands upon him, he asked him if he saw ought.","24":"And he looked up, and said, I see men as trees, walking.","25":"After that he put *his* hands again upon his eyes, and made him look up: and he was restored, and saw every man clearly.","26":"And he sent him away to his house, saying, Neither go into the town, nor tell *it* to any in the town.","27":"And Jesus went out, and his disciples, into the towns of Caesarea Philippi: and by the way he asked his disciples, saying unto them, Whom do men say that I am?","28":"And they answered, John the Baptist: but some *say*, Elias; and others, One of the prophets.","29":"And he saith unto them, But whom say ye that I am? And Peter answereth and saith unto him, Thou art the Christ.","30":"And he charged them that they should tell no man of him.","31":"And he began to teach them, that the Son of man must suffer many things, and be rejected of the elders, and *of* the chief priests, and scribes, and be killed, and after three days rise again.","32":"And he spake that saying openly. And Peter took him, and began to rebuke him.","33":"But when he had turned about and looked on his disciples, he rebuked Peter, saying, Get thee behind me, Satan: for thou savourest not the things that be of God, but the things that be of men.","34":"And when he had called the people *unto him* with his disciples also, he said unto them, Whosoever will come after me, let him deny himself, and take up his cross, and follow me.","35":"For whosoever will save his life shall lose it; but whosoever shall lose his life for my sake and the gospel's, the same shall save it.","36":"For what shall it profit a man, if he shall gain the whole world, and lose his own soul?","37":"Or what shall a man give in exchange for his soul?","38":"Whosoever therefore shall be ashamed of me and of my words in this adulterous and sinful generation; of him also shall the Son of man be ashamed, when he cometh in the glory of his Father with the holy angels."}},"tsk":{"2":[{"kopje":"ontferming","refs":["Mark 1:41","Mark 5:19","Mark 6:34","Mark 9:22","Ps 103:13","Ps 145:8","Ps 145:15","Micha 7:19","Matt 9:36","Matt 14:14","Matt 20:34","Luk 7:13","Luk 15:20","Hebr 2:17","Hebr 4:15","Hebr 5:2"]},{"kopje":"en hebben","refs":["Matt 4:2-4","Matt 6:32","Matt 6:33","Joh 4:6-8","Joh 4:30-34"]}],"4":[{"kopje":"Waar","refs":["Mark 6:36","Mark 6:37","Mark 6:52","Num 11:21-23","2 Kon 4:42-44","2 Kon 7:2","Ps 78:19","Ps 78:20","Matt 15:33","Joh 6:7-9"]}],"5":[{"kopje":"Hoeveel","refs":["Mark 6:38","Matt 14:15-17","Matt 15:34"," // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +

  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
