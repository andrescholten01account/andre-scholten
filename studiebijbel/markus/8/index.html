 die tegen hen zei: Kom hier boven. En zij voeren op naar de hemel, in de wolk; en hun vijanden aanschouwden hen.", "Joh 14:12-21": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, de werken die Ik doe, zal hij ook doen, en zal grotere doen dan deze, want Ik ga heen tot Mijn Vader. En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt. Als u iets zult vragen in Mijn Naam, Ik zal het doen.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "1 Joh 3:16": "Hieraan hebben wij de liefde gekend, dat Hij Zijn leven voor ons gesteld heeft; en wij zijn schuldig het leven te stellen voor de broeders.", "Matt 10:39": "Wie zijn ziel vindt, zal die verliezen; en wie zijn ziel verloren zal hebben om Mij, zal die vinden.", "Matt 7:22": "Velen zullen op die dag tegen Mij zeggen: Heere, Heere! Hebben wij niet in Uw Naam geprofeteerd, en in Uw Naam demonen uitgeworpen, en in Uw Naam veel krachten gedaan?", "Mark 1:13": "En Hij was daar in de woestijn veertig dagen, beproefd door de satan; en Hij was bij de wilde dieren; en de engelen dienden Hem.", "2 Tess 1:2": "Genade zij u, en vrede, van God, onze Vader, en de Heere Jezus Christus.", "Luk 9:12-17": "En de dag begon te dalen; en de twaalf kwamen naar Hem toe en zeiden tegen Hem: Stuur de menigte weg, zodat zij naar de omliggende dorpen en gehuchten kunnen gaan om onderdak te vinden en voedsel, want hier zijn wij op een eenzame plaats. Maar Hij zei tegen hen: Geeft u hun te eten. En zij zeiden: Wij hebben niet meer dan vijf broden en twee vissen; of we zouden op pad moeten gaan om voor al dit volk voedsel te kopen. Want er waren ongeveer vijfduizend mannen. Maar Hij zei tegen Zijn discipelen: Laat hen neerzitten in groepen van vijftig.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "2 Kor 6:8-10": "door eer en oneer, door kwaad gerucht en goed gerucht; als verleiders, en toch waarachtig; als onbekenden, en toch bekend; als stervenden, en zie, wij leven; als getuchtigd, en niet gedood; als treurend, maar altijd blij; als arm, maar velen rijk makend; als niets hebbend, en toch alles bezittend.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "Joh 13:3": "Jezus, die wist dat de Vader Hem alle dingen in de handen gegeven had, en dat Hij van God uitgegaan was en tot God heenging,", "Matt 10:29": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader.", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Mark 12:15": "Maar Hij, die hun huichelarij kende, zei tegen hen: Waarom stelt u Mij op de proef? Breng Mij een penning, zodat Ik hem kan zien.", "Ps 34:21": "Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken.", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "Lev 26:6": "Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "1 Petr 1:12": "Aan hen is geopenbaard dat zij niet zichzelf, maar ons dienden met deze dingen, die u nu aangekondigd zijn door hen die u het Evangelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "Openb 7:9-17": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen. En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam. En alle engelen stonden rond de troon, en rond de oudsten en de vier dieren; en zij vielen voor de troon neer op hun gezicht, en aanbaden God,", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Hand 21:13": "Maar Paulus antwoordde: Wat doet u, dat u weent en mijn hart week maakt? Want ik ben bereid niet alleen gebonden te worden, maar ook te sterven te Jeruzalem, voor de Naam van de Heere Jezus.", "Joh 8:30": "Toen Hij deze dingen sprak, geloofden velen in Hem.", "Micha 2:10": "Maak u dan op en ga heen; want dit land zal de rust niet zijn; omdat het verontreinigd is, zal het u verderven, en dat met een hevige verderving.", "Matt 26:23": "En Hij antwoordde en zei: Die de hand met Mij in de schotel indoopt, die zal Mij verraden.", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Luk 8:56": "En haar ouders stonden versteld; en Hij beval hun aan niemand te vertellen wat er gebeurd was.", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "Matt 12:36": "Maar Ik zeg u, dat van elk nutteloos woord dat de mensen zullen hebben gesproken, zij daarvan rekenschap zullen geven op de dag van het oordeel.", "Hebr 8:9": "Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere.", "Mark 15:29-32": "En zij die voorbijkwamen, lasterden Hem, en schudden hun hoofden, en zeiden: Ha! U die de tempel afbreekt, en in drie dagen opbouwt, Red Uzelf, en kom van het kruis af. En evenzo zeiden ook de overpriesters, met de Schriftgeleerden, spottend tegen elkaar: Anderen heeft Hij verlost; Zichzelf kan Hij niet verlossen.", "Mark 4:22": "Want er is niets verborgen, dat niet openbaar zal worden; en er is niets gebeurd om verborgen te blijven, maar opdat het openbaar zou worden.", "1 Kor 15:3-8": "Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften; en dat Hij is begraven, en dat Hij is opgewekt op de derde dag, naar de Schriften; en dat Hij is gezien door Cefas, daarna door de twaalf.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Ps 33:19": "Om hun ziel van de dood te redden, en om hen bij het leven te houden in de honger.", "Ps 22:18-22": "Al mijn beenderen zou ik kunnen tellen; zij schouwen het aan, zij zien op mij. Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad. Maar U, HEERE! Wees niet ver; mijn Sterkte! Haast U tot mijn hulp.", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Hebr 12:3": "Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "Joh 14:24": "Wie Mij niet liefheeft, bewaart Mijn woorden niet; en het woord dat u hoort, is niet het Mijne, maar dat van de Vader, Die Mij gezonden heeft.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Mark 13:1-37": "En toen Hij de tempel uitging, zei een van Zijn discipelen tegen Hem: Meester, kijk, wat voor stenen, en wat voor gebouwen! En Jezus antwoordde en zei tegen hem: Ziet u deze grote gebouwen? Er zal niet één steen op de andere steen gelaten worden, die niet afgebroken zal worden. En toen Hij op de Olijfberg zat, tegenover de tempel, vroegen Petrus, en Jakobus, en Johannes, en Andreas Hem apart:", "Matt 18:19": "Verder zeg Ik u: als twee van u het op de aarde over enige zaak eens worden waar zij om zouden vragen, dat zal hun gebeuren van Mijn Vader, Die in de hemelen is.", "Joh 12:50": "En Ik weet dat Zijn gebod het eeuwige leven is. Wat Ik dan spreek, dat spreek Ik zoals de Vader Mij gezegd heeft.", "2 Tim 1:8": "Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Luk 10:13": "Wee u, Chorazin, wee u, Bethsaïda, want als in Tyrus en Sidon de krachten waren gebeurd die in u gebeurd zijn, zouden zij zich allang, in zak en as zittend, bekeerd hebben.", "Ps 103:13": "Zoals een vader zich ontfermt over zijn kinderen, ontfermt de HEERE Zich over hen die Hem vrezen.", "Matt 10:20": "Want u bent het niet die spreekt, maar het is de Geest van uw Vader, Die in u spreekt.", "Joh 19:23": "De soldaten dan namen, toen zij Jezus gekruisigd hadden, Zijn kleren (en maakten er vier delen van, voor elke soldaat een deel) en de onderkleding. De onderkleding nu was zonder naad, van boven af helemaal geweven.", "Mark 6:7-11": "En Hij riep de twaalf tot Zich, en begon hen twee aan twee uit te zenden, en gaf hun macht over de onreine geesten; En Hij gebood hun dat zij niets zouden meenemen voor onderweg, dan alleen een staf: geen reistas, geen brood, geen geld in de gordel; maar dat zij sandalen zouden aanbinden, en niet met twee stel kleren gekleed zouden zijn.", "Ps 68:6": "Hij is een Vader van de wezen, en een Rechter van de weduwen; God, in de woonplaats van Zijn heiligheid.", "Fil 3:20": "Maar onze wandel is in de hemelen, waaruit wij ook de Zaligmaker verwachten, namelijk de Heere Jezus Christus;", "Luk 9:22": "en Hij zei: De Zoon des mensen moet veel lijden, en verworpen worden door de oudsten, overpriesters en Schriftgeleerden, en gedood worden en op de derde dag opgewekt worden.", "Matt 25:31": "En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en alle heilige engelen met Hem, dan zal Hij zitten op de troon van Zijn heerlijkheid.", "Spr 7:10-21": "En zie, een vrouw ontmoette hem in hoerenversiersel, en met het hart op haar hoede; Deze was druk en opstandig, haar voeten bleven in haar huis niet; Nu buiten, dan op de straten zijnde, en bij alle hoeken loerend;", "Mark 14:62": "En Jezus zei: Ik ben het. En u zult de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen met de wolken van de hemel.", "Matt 16:9": "Begrijpt u nog niet, en herinnert u zich niet de vijf broden van de vijfduizend mannen, en hoeveel korven u opnam?", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "2 Tim 4:10": "Want Demas heeft mij verlaten, omdat hij de tegenwoordige wereld heeft liefgekregen, en is naar Thessalonica gereisd; Krescens naar Galatië, Titus naar Dalmatië.", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "Matt 6:25-34": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding? Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven? Wie van u kan, door bezorgd te zijn, één el aan zijn lengte toevoegen?", "1 Joh 2:25": "En dit is de belofte, die Hij ons beloofd heeft, namelijk het eeuwige leven.", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Jak 2:5": "Luister, mijn geliefde broeders, heeft God niet de armen van deze wereld uitverkoren, om rijk te zijn in het geloof, en erfgenamen van het Koninkrijk, dat Hij belooft aan hen die Hem liefhebben?", "Openb 5:12": "die met een luide stem zeiden: Het Lam, Dat geslacht is, is waard te ontvangen de kracht, en rijkdom, en wijsheid, en sterkte, en eer, en heerlijkheid, en dankzegging.", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "Mark 3:7": "En Jezus vertrok met Zijn discipelen naar de zee; en een grote menigte volgde Hem, van Galilea en van Judea,", "Pred 7:18": "Het is goed dat u daaraan vasthoudt, en trek ook uw hand van dit niet af; want wie God vreest, die ontgaat dat allemaal.", "2 Tim 2:14": "Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders.", "Gal 6:3": "Want als iemand denkt iets te zijn, terwijl hij niets is, bedriegt hij zichzelf in zijn gemoed.", "Ps 50:16": "Maar tegen de goddeloze zegt God: Wat hebt u Mijn inzettingen te vertellen, en neemt u Mijn verbond in uw mond?", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Mark 9:31": "Want Hij onderwees Zijn discipelen, en zei tegen hen: De Zoon des mensen zal overgeleverd worden in de handen van mensen, en zij zullen Hem doden, en nadat Hij gedood is, zal Hij op de derde dag weer opstaan.", "2 Kor 4:10": "Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Luk 13:24-29": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen; namelijk nadat de heer des huizes zal zijn opgestaan en de deur zal hebben gesloten, en u buiten zult beginnen te staan en op de deur te kloppen, en zult zeggen: Heere, Heere, doe ons open! en Hij zal antwoorden en tegen u zeggen: Ik weet niet waar u vandaan komt. Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.", "Luk 24:41": "En toen zij het van blijdschap nog niet geloofden, en zich verwonderden, zei Hij tegen hen: Hebt u hier iets te eten?", "Luk 15:25-32": "En zijn oudste zoon was op het veld; en toen hij kwam en het huis naderde, hoorde hij het gezang en het gedans, en hij riep één van de knechten tot zich, en vroeg wat dat te betekenen had. En deze zei tegen hem: Uw broer is gekomen, en uw vader heeft het gemeste kalf geslacht, omdat hij hem gezond en wel heeft teruggekregen.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Rom 8:11": "En als de Geest van Hem, Die Jezus uit de doden opgewekt heeft, in u woont, zal Hij, Die Christus uit de doden opgewekt heeft, ook uw sterfelijke lichamen levend maken door Zijn Geest, Die in u woont.", "Luk 15:7": "Ik zeg u, dat er zo blijdschap zal zijn in de hemel over één zondaar die zich bekeert, meer dan over negenennegentig rechtvaardigen, die de bekering niet nodig hebben.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "Joh 5:24": "Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort en Hem gelooft Die Mij gezonden heeft, die heeft het eeuwige leven, en komt niet in het oordeel, maar is overgegaan uit de dood in het leven.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Matt 4:2-4": "En toen Hij veertig dagen en veertig nachten gevast had, kreeg Hij ten laatste honger. En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden. Maar Hij antwoordde en zei: Er is geschreven: De mens zal niet van brood alleen leven, maar van elk woord dat uit de mond van God komt.", "Joh 2:23": "En toen Hij te Jeruzalem was, op het Pascha, tijdens het feest, geloofden velen in Zijn Naam, omdat zij Zijn tekenen zagen die Hij deed.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Hand 26:23": "Namelijk dat de Christus moest lijden, en dat Hij, als Eerste uit de opstanding van de doden, een licht zou verkondigen aan dit volk en aan de heidenen.", "Deut 32:15-30": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil. Zij hebben Hem tot ijver verwekt door vreemde goden; door gruwelen hebben zij Hem tot toorn verwekt. Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.", "Luk 9:44": "Neem deze woorden ter harte: want de Zoon des mensen zal overgeleverd worden in de handen van mensen.", "Matt 18:20": "Want waar twee of drie in Mijn Naam bijeengekomen zijn, daar ben Ik in hun midden.", "1 Tim 4:2": "door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;", "Tit 1:16": "Zij belijden dat zij God kennen, maar zij verloochenen Hem met hun werken, omdat zij verfoeilijk zijn en ongehoorzaam, en voor elk goed werk ongeschikt.", "Joh 6:2": "En een grote menigte volgde Hem, omdat zij Zijn tekenen zagen, die Hij deed aan de zieken.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Luk 17:32": "Denk aan de vrouw van Lot.", "Openb 3:5": "Wie overwint, die zal bekleed worden met witte kleren; en Ik zal zijn naam beslist niet uitwissen uit het boek van het leven, en Ik zal zijn naam belijden voor Mijn Vader en voor Zijn engelen.", "Luk 18:33": "En nadat zij Hem gegeseld hebben, zullen zij Hem doden; en op de derde dag zal Hij weer opstaan.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Job 34:30": "Opdat de huichelachtige mens niet meer regeert, en geen strikken van het volk zijn.", "Luk 22:37": "Want Ik zeg u, dat nog dit, wat geschreven is, in Mij vervuld moet worden, namelijk: En Hij is met de misdadigers gerekend. Want ook wat over Mij geschreven is, heeft een einde.", "Matt 16:10": "Ook niet de zeven broden van de vierduizend mannen, en hoeveel manden u opnam?", "Luk 24:6": "Hij is hier niet, maar Hij is opgestaan. Denk eraan hoe Hij tot u gesproken heeft, toen Hij nog in Galilea was,", "Rom 8:12": "Dus, broeders, wij zijn het niet aan het vlees verschuldigd om naar het vlees te leven.", "Hebr 2:7": "U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen;", "1 Kor 13:9-12": "Want wij kennen ten dele, en wij profeteren ten dele; Maar wanneer het volmaakte gekomen zal zijn, dan zal wat ten dele is, tot niets gemaakt worden. Toen ik een kind was, sprak ik als een kind, was ik gezind als een kind, overlegde ik als een kind; maar toen ik een man geworden ben, heb ik wat bij een kind hoort tot niets gemaakt.", "Matt 14:2": "en hij zei tegen zijn knechten: Deze is Johannes de Doper; hij is opgewekt van de doden, en daarom werken die krachten in Hem.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "1 Joh 4:15": "Wie beleden zal hebben dat Jezus de Zoon van God is, God blijft in hem, en hij in God.", "Mark 11:23": "Want voorwaar, Ik zeg u, dat wie tegen deze berg zal zeggen: Word opgeheven en in de zee geworpen; en niet zal twijfelen in zijn hart, maar zal geloven dat wat hij zegt, zal gebeuren, het zal hem gebeuren, wat hij ook zegt.", "Joh 12:48": "Wie Mij verwerpt en Mijn woorden niet ontvangt, heeft iemand die hem oordeelt; het woord dat Ik gesproken heb, dat zal hem oordelen op de laatste dag.", "Mark 10:9": "Wat God dan samengevoegd heeft, laat de mens dat niet scheiden.", "Matt 26:42": "Opnieuw, voor de tweede keer, ging Hij heen en bad, en zei: Mijn Vader! Als deze drinkbeker niet aan Mij voorbij kan gaan zonder dat Ik hem drink, laat Uw wil dan gebeuren!", "Hebr 2:15": "en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren.", "Mal 4:5": "Zie, Ik zend u de profeet Elia, voordat die grote en vreselijke dag van de HEERE komt.", "1 Kor 8:6": "toch hebben wij maar één God, de Vader, uit Wie alle dingen zijn, en wij tot Hem; en maar één Heere, Jezus Christus, door Wie alle dingen zijn, en wij door Hem.", "Hebr 6:4-8": "Want het is onmogelijk om hen die eens verlicht zijn geweest, en de hemelse gave geproefd hebben, en deelgenoot geworden zijn van de Heilige Geest, en het goede woord van God geproefd hebben, en de krachten van de toekomende eeuw, en die afvallig worden, opnieuw te vernieuwen tot bekering, omdat zij voor zichzelf de Zoon van God opnieuw kruisigen en openlijk te schande maken.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Jes 28:20": "Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Gal 1:3": "Genade zij u en vrede van God de Vader, en onze Heere Jezus Christus;", "Joh 7:48": "Heeft iemand van de leiders in Hem geloofd, of van de Farizeeën?", "Luk 9:16": "En Hij nam de vijf broden en de twee vissen, keek op naar de hemel, zegende ze, brak ze, en gaf ze aan de discipelen om ze aan de menigte voor te leggen.", "Job 38:7": "Toen de morgensterren samen vrolijk zongen, en al de kinderen van God juichten.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Matt 9:30": "En hun ogen werden geopend. En Jezus verbood hun streng, en zei: Zorg dat niemand het weet.", "Hebr 2:17": "Daarom moest Hij in alles aan Zijn broeders gelijk worden, opdat Hij een barmhartig en getrouw Hogepriester zou zijn in de dingen die bij God gedaan moeten worden, om de zonden van het volk te verzoenen.", "1 Joh 2:17": "En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "2 Kor 8:9": "Want u kent de genade van onze Heere Jezus Christus, dat Hij om uwentwil arm geworden is, terwijl Hij rijk was, opdat u door Zijn armoede rijk zou worden.", "2 Petr 2:20": "Want als zij, nadat zij door de kennis van de Heere en Zaligmaker Jezus Christus aan de besmettingen van de wereld ontkomen zijn, daar opnieuw in verstrikt raken en erdoor overwonnen worden, dan is voor hen het laatste erger geworden dan het eerste.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Gal 4:11": "Ik ben bang voor u, dat ik niet misschien tevergeefs onder u gearbeid heb.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Joh 12:9": "Een grote menigte van de Joden merkte dan dat Hij daar was; en zij kwamen niet alleen om Jezus, maar ook om Lazarus te zien, die Hij uit de doden had opgewekt.", "Mark 7:36": "En Hij gebood hun dat zij het niemand zouden zeggen; maar hoe meer Hij het hun ook gebood, des te meer verkondigden zij het.", "1 Joh 1:6": "Als wij zeggen dat wij gemeenschap met Hem hebben, en wij in de duisternis wandelen, dan liegen wij, en doen de waarheid niet.", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "Matt 16:4": "Het slechte en overspelige geslacht verlangt een teken; en het zal geen teken gegeven worden, dan het teken van Jona, de profeet. En Hij verliet hen en ging weg.", "Mark 16:7": "Maar ga heen, zeg tegen Zijn discipelen, en Petrus, dat Hij u voorgaat naar Galilea; daar zult u Hem zien, zoals Hij u gezegd heeft.", "2 Tim 2:4": "Niemand die als soldaat dient, wikkelt zich in de zaken van het dagelijks leven, opdat hij hem kan behagen die hem tot soldaat heeft aangenomen.", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Joh 14:18": "Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Matt 12:23": "En alle menigten waren buiten zichzelf, en zeiden: Is dit niet de Zoon van David?", "Mal 4:3": "En u zult de goddelozen vertreden, want zij zullen as worden onder de zolen van uw voeten, op die dag die Ik maken zal, zegt de HEERE van de heerscharen.", "Ef 6:23": "Vrede zij de broeders, en liefde met geloof, van God de Vader, en de Heere Jezus Christus.", "Luk 8:14": "En wat tussen de dorens valt, dat zijn zij die gehoord hebben, en gaandeweg verstikt worden door de zorgen en rijkdom en genietingen van het leven, en geen rijpe vrucht voortbrengen.", "Spr 20:6": "Elk van de menigte van de mensen roept zijn eigen weldadigheid uit; maar wie zal een echt trouwe man vinden?", "Micha 7:5": "Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.", "Mark 10:34": "en zij zullen Hem bespotten, en Hem geselen, en Hem bespuwen, en Hem doden; en op de derde dag zal Hij weer opstaan.", "Luk 22:61": "En de Heere keerde Zich om en keek Petrus aan; en Petrus herinnerde zich het woord van de Heere, hoe Hij hem gezegd had: Voordat de haan gekraaid zal hebben, zult u Mij driemaal verloochenen.", "Rom 6:5": "Want als wij met Hem één geworden zijn in de gelijkmaking van Zijn dood, dan zullen wij het ook zijn in de gelijkmaking van Zijn opstanding;", "Joh 8:41": "U doet de werken van uw vader. Zij zeiden dan tegen Hem: Wij zijn niet uit hoererij geboren; wij hebben één Vader, namelijk God.", "2 Petr 2:12-17": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "1 Kor 10:23": "Alle dingen zijn mij geoorloofd, maar niet alle dingen zijn nuttig; alle dingen zijn mij geoorloofd, maar niet alle dingen bouwen op.", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Rom 10:9": "namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden.", "Hand 1:4": "En toen Hij met hen vergaderd was, beval Hij hun dat zij niet uit Jeruzalem weg zouden gaan, maar de belofte van de Vader verwachten, die u, zei Hij, van Mij gehoord hebt.", "Hebr 1:6": "En als Hij de Eerstgeborene opnieuw in de wereld inbrengt, zegt Hij: En dat alle engelen van God Hem aanbidden.", "Joz 24:20-27": "Als u de HEERE verlaat en vreemde goden dient, dan zal Hij Zich omkeren, en Hij zal u kwaad doen, en Hij zal u vernietigen, nadat Hij u goed gedaan heeft. Toen zei het volk tegen Jozua: Nee, want wij zullen de HEERE dienen. Jozua nu zei tegen het volk: U bent getuigen tegen uzelf, dat u de HEERE gekozen hebt om Hem te dienen. En zij zeiden: Wij zijn getuigen.", "Ps 91:9-12": "Want U, HEERE, bent mijn Toevlucht! De Allerhoogste hebt u gesteld tot uw Vertrek; U zal geen kwaad overkomen, en geen plaag zal uw tent naderen. Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.", "Matt 22:23": "Diezelfde dag kwamen de Sadduceeën naar Hem toe, die zeggen dat er geen opstanding is, en vroegen Hem,", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Zach 13:6": "En als iemand tegen hem zegt: Wat zijn deze wonden in uw handen? dan zal hij zeggen: Het zijn de wonden waarmee ik geslagen ben, in het huis van mijn liefhebbers.", "Matt 12:37": "Want uit uw woorden zult u gerechtvaardigd worden, en uit uw woorden zult u veroordeeld worden.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Matt 14:13": "Toen Jezus dit hoorde, vertrok Hij vandaar met een boot naar een eenzame plaats, alleen; en de menigten, die dat hoorden, zijn Hem te voet gevolgd, vanuit de steden.", "Hebr 11:15": "En als zij aan dat vaderland gedacht hadden waar zij uit weggegaan waren, zouden zij de tijd gehad hebben om terug te keren;", "Mark 3:21": "En toen zijn verwanten dit hoorden, gingen zij eropuit om Hem vast te houden; want zij zeiden: Hij is buiten zichzelf.", "Ps 109:6-19": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "1 Kor 15:12-23": "Als nu van Christus gepredikt wordt dat Hij uit de doden opgewekt is, hoe zeggen sommigen onder u dat er geen opstanding van de doden is? En als er geen opstanding van de doden is, dan is Christus ook niet opgewekt. En als Christus niet opgewekt is, dan is onze prediking zonder inhoud, en is ook uw geloof zonder inhoud.", "Hebr 13:2": "Vergeet de herbergzaamheid niet; want hierdoor hebben sommigen zonder het te weten engelen geherbergd.", "Ps 69:21": "De smaad heeft mijn hart gebroken, en ik ben zeer zwak; en ik heb gewacht op medelijden, maar er is geen; en op vertroosters, maar heb ze niet gevonden.", "Hos 9:4": "Zij zullen de Heere geen drankoffers doen van wijn, en die zouden Hem ook niet aangenaam zijn; hun offers zouden voor hen zijn als treurbrood; allen die daarvan zouden eten, zouden onrein worden; want hun brood zal voor henzelf zijn, het zal niet in het huis van de Heere komen.", "2 Tess 1:1": "Paulus, en Silvanus, en Timotheüs, aan de Gemeente van de Thessalonicenzen, die is in God, onze Vader, en de Heere Jezus Christus:", "Hagg 1:6": "U zaait veel, maar brengt weinig binnen; u eet, maar niet tot verzadiging; u drinkt, maar wordt niet dronken; u kleedt u, maar niet tot uw verwarming, en wie loon ontvangt, ontvangt dat loon in een doorgeboorde buidel.", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "Luk 18:27-30": "En Hij zei: De dingen die onmogelijk zijn bij de mensen, zijn mogelijk bij God. En Petrus zei: Zie, wij hebben alles verlaten en zijn U gevolgd. En Hij zei tegen hen: Voorwaar, Ik zeg u, er is niemand die huis, of ouders, of broers, of vrouw, of kinderen heeft verlaten om het Koninkrijk van God,", "Luk 21:27": "En dan zullen zij de Zoon des mensen zien komen in een wolk, met grote kracht en heerlijkheid.", "Matt 14:33": "Zij die in het schip waren, kwamen en aanbaden Hem, en zeiden: Werkelijk, U bent Gods Zoon!", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "Joh 6:10": "En Jezus zei: Laat de mensen neerzitten. Er was namelijk veel gras op die plaats. De mannen gingen dan neerzitten, ongeveer vijfduizend in getal.", "Matt 15:39": "En nadat Hij de menigten had laten gaan, ging Hij in het schip, en kwam in de omgeving van Magdala.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "1 Kor 1:8": "Die God u ook zal bevestigen tot het einde toe, om onberispelijk te zijn in de dag van onze Heere Jezus Christus.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Dan 9:21-23": "terwijl ik nog sprak in het gebed, kwam de man Gabriël, die ik in het begin in een visioen gezien had, snel gevlogen, en raakte mij aan, omtrent de tijd van het avondoffer. En hij onderrichtte mij en sprak met mij, en zei: Daniël! nu ben ik uitgegaan, om u het inzicht te doen verstaan. In het begin van uw smekingen is het woord uitgegaan, en ik ben gekomen om het u bekend te maken; want u bent een zeer geliefde man; versta dan dit woord, en let op dit visioen.", "Hebr 2:16": "Want inderdaad, Hij neemt niet de engelen aan, maar Hij neemt het nageslacht van Abraham aan.", "Jes 11:6-9": "En de wolf zal bij het lam wonen, en de luipaard zal bij de geitenbok neerliggen; en het kalf, en de jonge leeuw, en het mestvee samen, en een klein jongetje zal ze drijven. De koe en de berin zullen samen weiden, hun jongen zullen samen neerliggen, en de leeuw zal stro eten, net als de os. En een zuigeling zal zich vermaken bij het hol van een adder; en een gespeend kind zal zijn hand uitsteken naar de kuil van de basilisk.", "Hebr 12:9": "Verder, wij hebben de vaders van ons vlees wel als kastijders gehad, en wij hadden ontzag voor hen; zullen wij dan niet veel meer onderworpen zijn aan de Vader van de geesten, en leven?", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "Matt 6:16-25": "En wanneer u vast, toon dan geen droevig gezicht, zoals de geveinsden; want zij mismaken hun gezicht, opdat zij door de mensen gezien worden als zij vasten. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben. Maar u, als u vast, zalf dan uw hoofd en was uw gezicht; opdat het niet door de mensen gezien wordt dat u vast, maar door uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.", "Matt 7:21-23": "Niet ieder die tegen Mij zegt: Heere, Heere! zal ingaan in het Koninkrijk der hemelen, maar wie de wil doet van Mijn Vader, Die in de hemelen is. Velen zullen op die dag tegen Mij zeggen: Heere, Heere! Hebben wij niet in Uw Naam geprofeteerd, en in Uw Naam demonen uitgeworpen, en in Uw Naam veel krachten gedaan? En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Matt 22:34-40": "En toen de Farizeeën hoorden dat Hij de Sadduceeën de mond gestopt had, werden zij bijeengebracht. En een van hen, een wetgeleerde, stelde Hem een vraag om Hem op de proef te stellen, en zei: Meester! Welk gebod is het grootste in de wet?", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Mark 13:27": "En dan zal Hij Zijn engelen uitzenden, en Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het uiterste van de aarde, tot het uiterste van de hemel.", "Matt 21:8-11": "En de meeste van de menigte spreidden hun kleren op de weg, en anderen hakten takken van de bomen en spreidden ze op de weg. En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen! En toen Hij Jeruzalem binnenkwam, raakte de hele stad in opschudding en men zei: Wie is Deze?", "Ps 69:22": "Ja, zij hebben mij gal tot mijn spijs gegeven; en in mijn dorst hebben zij mij azijn te drinken gegeven.", "Ps 89:32": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "1 Kor 4:9-13": "Want ik denk dat God ons, de laatste apostelen, ten toon heeft gesteld als tot de dood veroordeeld; want wij zijn een schouwspel geworden voor de wereld, en voor de engelen, en voor de mensen. Wij zijn dwazen om Christus' wil, maar u bent wijzen in Christus; wij zijn zwakken, maar u sterken; u bent heerlijke mensen, maar wij worden veracht. Tot op dit huidige uur lijden wij honger, en lijden wij dorst, en zijn naakt, en worden met vuisten geslagen, en hebben geen vaste woonplaats;", "Luk 18:31-33": "En Hij nam de twaalf bij Zich en zei tegen hen: Zie, wij gaan op naar Jeruzalem, en alles wat door de profeten geschreven is over de Zoon des mensen, zal volbracht worden. Want Hij zal aan de heidenen overgeleverd worden, en Hij zal bespot worden, en smadelijk behandeld worden, en bespuwd worden. En nadat zij Hem gegeseld hebben, zullen zij Hem doden; en op de derde dag zal Hij weer opstaan.", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Luk 22:52-71": "En Jezus zei tegen de overpriesters, en de hoofdmannen van de tempel, en de oudsten, die tegen Hem gekomen waren: Bent u uitgegaan met zwaarden en stokken alsof tegen een rover? Toen Ik dagelijks bij u was in de tempel, hebt u de handen tegen Mij niet uitgestoken; maar dit is uw uur, en de macht van de duisternis. En zij grepen Hem en leidden Hem weg, en brachten Hem naar het huis van de hogepriester. En Petrus volgde van veraf.", "Hand 10:40": "Deze heeft God opgewekt op de derde dag, en gegeven dat Hij openbaar zou worden;", "Mark 13:4": "Zeg ons, wanneer zullen deze dingen gebeuren? En wat is het teken wanneer al deze dingen voltooid zullen worden?", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Matt 16:1-4": "En de Farizeeën en Sadduceeën kwamen bij Hem, en om Hem te verzoeken vroegen zij Hem dat Hij hun een teken uit de hemel zou tonen. Maar Hij antwoordde en zei tegen hen: Als het avond geworden is, zegt u: Mooi weer; want de hemel is rood; en 's morgens: Vandaag onweer; want de hemel is somber rood. Huichelaars! Het uiterlijk van de hemel weet u wel te onderscheiden, maar kunt u de tekenen van de tijden niet onderscheiden?", "Amos 6:13": "U, die blij bent over een nietig ding; u, die zegt: Hebben wij niet door onze eigen kracht hoorns voor onszelf verkregen?", "Rom 9:6": "Maar ik zeg dit niet alsof het woord van God vervallen zou zijn; want niet allen die uit Israël zijn, zijn Israël.", "Joh 1:52": "En Hij zei tegen hem: Voorwaar, voorwaar, Ik zeg u: Van nu af aan zult u de hemel geopend zien, en de engelen van God opklimmen en neerdalen op de Zoon des mensen.", "1 Kor 15:31": "Ik sterf elke dag, dat verzeker ik u bij de roem over u die ik heb in Christus Jezus, onze Heere.", "2 Tess 1:5-9": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Mark 5:42": "En meteen stond het meisje op, en liep; want zij was twaalf jaar oud; en zij ontzetten zich met grote ontzetting.", "Jes 51:11": "Zo zullen de vrijgekochte van de HEERE terugkeren, en met gejuich naar Sion komen; en eeuwige blijdschap zal op hun hoofd zijn; vreugde en blijdschap zullen zij aangrijpen, treuring en zuchten zullen wegvluchten.", "Joh 21:19": "En dit zei Hij, om aan te duiden met wat voor dood hij God verheerlijken zou. En toen Hij dit gezegd had, zei Hij tegen hem: Volg Mij.", "Matt 7:11": "Als u dan, die slecht bent, uw kinderen goede gaven weet te geven, hoeveel te meer zal uw Vader, Die in de hemelen is, goede gaven geven aan hen die ze van Hem vragen!", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "2 Petr 1:4": "Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Spr 28:25": "Wie hoogmoedig van hart is, verwekt ruzie; maar wie op de HEERE vertrouwt, zal welvarend worden.", "Spr 11:5-8": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Pred 12:14": "Want God zal ieder werk in het gericht brengen, met alles wat verborgen is, hetzij goed, of hetzij kwaad.", "Jes 65:17-25": "Want zie, Ik schep nieuwe hemelen en een nieuwe aarde; en de vorige dingen zullen niet meer gedacht worden, en zullen in het hart niet opkomen. Maar wees u vrolijk, en verheug u tot in eeuwigheid over hetgeen Ik schep; want zie, Ik schep Jeruzalem een verheuging, en haar volk een vrolijkheid. En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem van het wenen, noch de stem van het geschreeuw.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Luk 12:8": "En Ik zeg u: ieder die Mij belijden zal voor de mensen, die zal ook de Zoon des mensen belijden voor de engelen van God.", "Spr 25:27": "Veel honig eten is niet goed; maar het onderzoeken van de eigen eer is geen eer.", "Luk 12:54-56": "En Hij zei ook tegen de menigten: Wanneer u een wolk ziet opkomen vanuit het westen, zegt u meteen: Er komt regen; en zo gebeurt het. En wanneer u de zuidenwind ziet waaien, zegt u: Er zal hitte komen; en het gebeurt. Huichelaars, het aanzien van de aarde en de hemel weet u te beoordelen; hoe komt het dan dat u deze tijd niet weet te beoordelen?", "Joh 9:17": "Zij zeiden opnieuw tegen de blinde: U, wat zegt u van Hem, omdat Hij uw ogen geopend heeft? En hij zei: Hij is een Profeet.", "Mark 4:13": "En Hij zei tegen hen: Begrijpt u deze gelijkenis niet, en hoe zult u dan alle gelijkenissen begrijpen?", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Ezech 3:20": "Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Matt 16:20": "Toen verbood Hij Zijn discipelen dat zij iemand zouden zeggen dat Hij Jezus, de Christus, was.", "Matt 8:16": "En toen het avond geworden was, brachten zij velen die door de duivel bezeten waren naar Hem toe, en Hij dreef de boze geesten uit met het woord, en Hij genas allen die ziek waren;", "2 Kon 7:2": "Maar een hoofdman, op wiens hand de koning leunde, antwoordde de man Gods, en zei: Zie, al zou de HEERE vensters in de hemel maken, zou die zaak dan kunnen gebeuren? En hij zei: Zie, u zult het met uw ogen zien, maar daarvan niet eten.", "Luk 19:47": "En Hij onderwees dagelijks in de tempel; en de overpriesters, en de schriftgeleerden, en de leiders van het volk probeerden Hem te doden.", "Mark 5:21": "En toen Jezus opnieuw met het schip overgevaren was naar de andere kant, kwam er een grote menigte bij Hem samen; en Hij was bij de zee.", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "Rom 9:7": "Ook zijn zij niet allen kinderen omdat zij nageslacht van Abraham zijn; maar: In Izaak zal uw nageslacht genoemd worden.", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Joh 16:32": "Zie, de tijd komt, en is nu gekomen, dat u verstrooid zult worden, ieder naar het zijne, en u Mij alleen zult laten; en toch ben Ik niet alleen, want de Vader is met Mij.", "Spr 13:21": "Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.", "Spr 2:17": "Die de leidsman van haar jeugd verlaat, en het verbond van haar God vergeet;", "Ps 69:27": "Want zij vervolgen hem die U geslagen hebt; en maken een praat van de smart van Uw verwonden.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "2 Kor 5:10": "Want wij moeten allen geopenbaard worden voor de rechterstoel van Christus, opdat ieder ontvangt wat door het lichaam gedaan is, naarmate hij gedaan heeft, hetzij goed, hetzij kwaad.", "1 Petr 3:21": "Waarvan het tegenbeeld, de doop, ons nu ook behoudt — niet als het afleggen van de vuiligheid van het lichaam, maar als de vraag van een goed geweten aan God — door de opstanding van Jezus Christus;", "Matt 24:38": "Want zoals zij waren in de dagen voor de zondvloed, etend en drinkend, terwijl zij trouwden en ten huwelijk gaven, tot de dag toe waarop Noach in de ark ging;", "1 Kor 6:12": "Alle dingen zijn mij toegestaan, maar niet alle dingen zijn nuttig; alle dingen zijn mij toegestaan, maar ik zal mij door niets onder de macht laten brengen.", "Luk 5:1": "En het gebeurde, toen de menigte op Hem aandrong om het Woord van God te horen, dat Hij bij het meer Gennesareth stond.", "1 Petr 5:4": "En als de opperste Herder verschenen zal zijn, zult u de onverwelkbare kroon van de heerlijkheid ontvangen.", "Joh 15:14": "U bent Mijn vrienden, als u doet wat Ik u gebied.", "Hos 9:11": "Wat Efraïm aangaat, hun heerlijkheid zal wegvluchten als een vogel; vanaf de geboorte, en vanaf de moederschoot, en vanaf de ontvangenis af.", "Matt 17:22": "En toen zij in Galilea verbleven, zei Jezus tegen hen: De Zoon des mensen zal worden overgeleverd in de handen van mensen;", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "1 Kor 10:24": "Niemand zoekt zijn eigen belang, maar ieder zoekt dat van de ander.", "Mark 6:37": "Maar Hij antwoordde en zei tegen hen: Geeft u hun te eten. En zij zeiden tegen Hem: Zullen wij weggaan en voor tweehonderd penningen brood kopen, en hun te eten geven?", "Joh 19:34": "Maar een van de soldaten doorstak Zijn zijde met een speer, en meteen kwam er bloed en water uit.", "Luk 6:46": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg?", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Jer 2:13": "Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Luk 6:27-42": "Maar Ik zeg u die luistert: Heb uw vijanden lief; doe goed aan hen die u haten. Zegen hen die u vervloeken, en bid voor hen die u geweld aandoen. Wie u op de ene wang slaat, biedt hem ook de andere aan; en wie u de mantel afneemt, weerhoud hem niet ook uw hemd te nemen.", "Jak 1:5": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Spr 12:15": "De weg van de dwaas is recht in zijn eigen ogen; maar wie naar raad hoort, is wijs.", "Mark 2:6-11": "En sommigen van de Schriftgeleerden zaten daar, en overdachten in hun hart: Waarom spreekt Deze zo godslasteringen? Wie kan de zonden vergeven, dan God alleen? En Jezus, die meteen in Zijn geest besefte dat zij zo bij zichzelf overdachten, zei tegen hen: Waarom overdenkt u deze dingen in uw hart?", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Mark 7:1": "En bij Hem verzamelden zich de Farizeeën, en sommigen van de Schriftgeleerden, die van Jeruzalem gekomen waren;", "Openb 2:4": "Maar Ik heb tegen u, dat u uw eerste liefde hebt verlaten.", "Matt 25:1-46": "Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen. En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Zef 3:11": "Op die dag zult u niet beschaamd zijn vanwege al uw handelingen, waarmee u tegen Mij overtreden hebt; want dan zal Ik uit uw midden wegnemen wie van vreugde opspringen over uw hoogmoed, en u zult zich voortaan niet meer verheffen om Mijn heilige berg.", "Mark 14:23": "En Hij nam de drinkbeker, en nadat Hij gedankt had, gaf Hij hun die; en zij dronken allen daaruit.", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "Luk 24:49": "En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte.", "Hand 1:6": "Zij dan, die samengekomen waren, vroegen Hem: Heere, zult U in deze tijd het Koninkrijk voor Israël weer oprichten?", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Luk 11:32": "De mannen van Ninevé zullen opstaan in het oordeel samen met dit geslacht, en het veroordelen; want zij hebben zich bekeerd op de prediking van Jona; en zie, meer dan Jona is hier!", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "1 Kor 13:10-12": "Maar wanneer het volmaakte gekomen zal zijn, dan zal wat ten dele is, tot niets gemaakt worden. Toen ik een kind was, sprak ik als een kind, was ik gezind als een kind, overlegde ik als een kind; maar toen ik een man geworden ben, heb ik wat bij een kind hoort tot niets gemaakt. Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.", "Kol 2:2": "Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus;", "Joh 14:11": "Geloof Mij, dat Ik in de Vader ben en de Vader in Mij is; en zo niet, geloof Mij dan om de werken zelf.", "1 Kron 29:10": "Daarom loofde David de HEERE voor de ogen van de hele gemeente; en David zei: Geloofd bent U, HEERE, God van onze vader Israël, van eeuwigheid tot in eeuwigheid!", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Mark 2:2": "En meteen kwamen er daar velen bijeen, zodat zelfs de plaatsen bij de deur hen niet meer konden bevatten; en Hij sprak het woord tot hen.", "Mark 2:16": "En de Schriftgeleerden en de Farizeeën zagen dat Hij at met de tollenaars en zondaars, en zeiden tegen Zijn discipelen: Wat betekent het, dat Hij met de tollenaars en zondaars eet en drinkt?", "Joh 5:40": "En u wilt niet tot Mij komen, opdat u het leven zou hebben.", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "Matt 6:6": "Maar u, wanneer u bidt, ga in uw binnenkamer, en sluit uw deur, en bid tot uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.", "Luk 20:45-47": "En terwijl al het volk luisterde, zei Hij tegen Zijn discipelen: Wacht u voor de Schriftgeleerden, die graag rondlopen in lange gewaden, en die de begroetingen op de markten graag hebben, en de voorste plaatsen in de synagogen, en de ereplaatsen bij de maaltijden; die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen een des te zwaarder oordeel ontvangen.", "Spr 21:12": "De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.", "1 Kor 9:25-27": "En ieder die om de prijs strijdt, onthoudt zich in alles. Zij doen dit wel, opdat zij een vergankelijke krans zouden ontvangen, maar wij een onvergankelijke. Ik loop dan zo, niet als op het onzekere; ik strijd zo, niet als iemand die de lucht slaat; Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Matt 16:28": "Voorwaar, Ik zeg u: Er zijn sommigen van hen die hier staan, die de dood niet zullen smaken, totdat zij de Zoon des mensen zullen hebben zien komen in Zijn Koninkrijk.", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Spr 28:26": "Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "1 Tess 5:23": "En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "Matt 10:22": "En u zult door allen gehaat worden om Mijn Naam; maar wie volhardt tot het einde, die zal behouden worden.", "Joh 8:2": "En 's morgens vroeg kwam Hij weer in de tempel, en al het volk kwam naar Hem toe; en Hij ging zitten en leerde hen.", "Joh 9:1-7": "Toen Hij voorbijging, zag Hij een man die blind was van zijn geboorte af. En Zijn discipelen vroegen Hem: Rabbi, wie heeft er gezondigd, deze man of zijn ouders, dat hij blind geboren zou worden? Jezus antwoordde: Deze man heeft niet gezondigd, en zijn ouders ook niet, maar dit is gebeurd, opdat de werken van God in hem openbaar zouden worden.", "Matt 9:27-30": "En toen Jezus vandaar verder ging, volgden Hem twee blinden, roepend en zeggend: Zoon van David, ontferm U over ons! En toen Hij het huis binnengegaan was, kwamen de blinden bij Hem. En Jezus zei tegen hen: Gelooft u dat Ik dit kan doen? Zij zeiden tegen Hem: Ja, Heere! Toen raakte Hij hun ogen aan en zei: U geschiedt naar uw geloof.", "Ps 55:20": "God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Matt 22:15": "Toen gingen de Farizeeën heen en overlegden samen hoe zij Hem in Zijn woorden konden verstrikken.", "Mark 2:3": "En er kwamen sommigen naar Hem toe, die een verlamde brachten, die door vier mannen gedragen werd.", "Matt 22:2-6": "Het Koninkrijk der hemelen is gelijk aan een zeker koning, die voor zijn zoon een bruiloft bereid had; En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen. Opnieuw zond hij andere dienstknechten uit, en zei: Zeg tegen de genode gasten: Zie, ik heb mijn middagmaal bereid; mijn ossen en het gemeste vee zijn geslacht, en alles is gereed; kom naar de bruiloft.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Mark 15:28": "En de Schrift is vervuld die zegt: En Hij is met de misdadigers gerekend.", "Hos 9:15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "Matt 27:63": "en zeiden: Heer, wij herinneren ons dat deze verleider, toen Hij nog leefde, gezegd heeft: Na drie dagen zal Ik opstaan.", "Jes 10:3": "Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Hand 2:33": "Hij dan, door de rechterhand van God verhoogd, en de belofte van de Heilige Geest ontvangen hebbend van de Vader, heeft dit uitgestort, wat u nu ziet en hoort.", "Jes 32:3": "En de ogen van hen die zien, zullen niet terugzien, en de oren van hen die horen, zullen opmerken.", "Mark 11:22": "En Jezus antwoordde en zei tegen hen: Heb geloof in God.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Mark 3:20": "En zij kwamen in huis; en daar kwam opnieuw een menigte samen, zodat zij zelfs niet konden eten.", "Joh 6:68": "Simon Petrus antwoordde Hem: Heere, naar wie zouden wij heengaan? U hebt de woorden van het eeuwige leven.", "Joh 4:42": "en zij zeiden tegen de vrouw: Wij geloven niet meer om wat u zei; want wij hebben Hem zelf gehoord, en weten dat Deze werkelijk de Christus is, de Zaligmaker van de wereld.", "Mark 7:33": "En Hij nam hem apart, weg van de menigte, en stak Zijn vingers in zijn oren, en nadat Hij gespuwd had, raakte Hij zijn tong aan;", "Luk 10:25-37": "En zie, een wetgeleerde stond op, om Hem op de proef te stellen, en zei: Meester, wat moet ik doen om het eeuwige leven te beërven? En Hij zei tegen hem: Wat staat er in de wet geschreven? Hoe leest u het? En hij antwoordde: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw kracht, en met heel uw verstand; en uw naaste als uzelf.", "Jak 4:9": "Gedraag u als ellendigen, en treur en ween; laat uw lachen veranderen in treuren, en uw blijdschap in verdriet.", "Dan 4:13": "Ik zag verder in de visioenen van mijn hoofd, op mijn bed; en zie, een wachter, namelijk een heilige, kwam neer uit de hemel,", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Jer 17:5": "Zo zegt de HEERE: Vervloekt is de man die op een mens vertrouwt, en vlees tot zijn arm stelt, en wiens hart van de HEERE afwijkt!", "1 Kor 15:48-57": "Zoals de aardse is, zo zijn ook de aardsen; en zoals de Hemelse is, zo zijn ook de hemelsen. En zoals wij het beeld van de aardse gedragen hebben, zo zullen wij ook het beeld van de Hemelse dragen. Maar dit zeg ik, broeders, dat vlees en bloed het Koninkrijk van God niet kunnen beërven, en de vergankelijkheid beërft de onvergankelijkheid niet.", "Mark 1:33": "En de hele stad was bijeengekomen bij de deur.", "Ps 75:9": "Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Joh 14:28": "U hebt gehoord dat Ik tot u gezegd heb: Ik ga heen, en kom weer naar u toe. Als u Mij liefhad, zou u zich verblijden, omdat Ik gezegd heb: Ik ga heen tot de Vader; want Mijn Vader is meer dan Ik.", "Ps 78:20": "Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden?", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Matt 13:12": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft.", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "Joh 10:11": "Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Tit 1:13": "Deze getuigenis is waar. Daarom, bestraf hen scherp, opdat zij gezond mogen zijn in het geloof.", "Spr 15:29": "De HEERE is ver van de goddelozen; maar het gebed van de rechtvaardigen zal Hij verhoren.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Jak 4:4": "Overspelers en overspeleressen, weet u niet dat de vriendschap met de wereld vijandschap tegen God is? Wie dan ook een vriend van de wereld wil zijn, wordt daarmee een vijand van God.", "1 Tess 4:15-17": "Want dit zeggen wij u door het Woord van de Heere, dat wij, die levend overblijven tot de komst van de Heere, hen die ontslapen zijn niet zullen voorgaan. Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan; Daarna zullen wij, die levend overgebleven zijn, samen met hen opgenomen worden in de wolken, de Heere tegemoet, in de lucht; en zo zullen wij altijd bij de Heere zijn.", "Joh 14:6-13": "Jezus zei tegen hem: Ik ben de Weg, en de Waarheid, en het Leven. Niemand komt tot de Vader dan door Mij. Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien. Filippus zei tegen Hem: Heere, toon ons de Vader, en het is ons genoeg.", "Mal 3:12": "En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "Ps 28:5": "Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.", "Jes 53:3": "Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.", "Judas 1:15": "Om over allen gericht te houden, en alle goddelozen onder hen te straffen, vanwege al hun goddeloze werken, die zij goddeloos gedaan hebben, en vanwege alle harde woorden die de goddeloze zondaars tegen Hem gesproken hebben.", "Luk 10:20": "Maar verblijd u daar niet in, dat de geesten zich aan u onderwerpen; verblijd u veel meer dat uw namen opgeschreven zijn in de hemelen.", "Deut 11:26": "Zie, ik stel u heden voor: zegen en vloek:", "Hebr 4:13": "En er is geen schepsel onzichtbaar voor Hem; maar alle dingen zijn naakt en geopend voor de ogen van Hem, met Wie wij te maken hebben.", "Kol 3:4": "Wanneer nu Christus geopenbaard zal zijn, Die ons leven is, dan zult ook u met Hem geopenbaard worden in heerlijkheid.", "Openb 2:11": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, zal van de tweede dood geen schade lijden.", "Luk 9:22-24": "en Hij zei: De Zoon des mensen moet veel lijden, en verworpen worden door de oudsten, overpriesters en Schriftgeleerden, en gedood worden en op de derde dag opgewekt worden. En Hij zei tegen allen: Als iemand achter Mij aan wil komen, laat hij zichzelf verloochenen en dagelijks zijn kruis opnemen, en Mij volgen. Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden.", "Joh 5:43": "Ik ben gekomen in de Naam van Mijn Vader, en u neemt Mij niet aan; als een ander komt in zijn eigen naam, die zult u aannemen.", "Luk 4:32": "En zij waren verbaasd over Zijn leer, want Zijn woord was met macht.", "Rom 2:17-29": "Zie, u wordt een Jood genoemd en rust op de wet, en roemt in God, En u kent Zijn wil, en beoordeelt wat daarvan verschilt, want u bent onderwezen uit de wet; En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn,", "Ezech 18:24": "Maar als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, en handelt naar al de gruwelen die de goddeloze doet, zou die leven? Al zijn gerechtigheden, die hij gedaan heeft, zullen niet aangerekend worden; door zijn overtreding, waardoor hij overtreden heeft, en door zijn zonde, die hij gezondigd heeft, daardoor zal hij sterven.", "Luk 10:40": "Maar Martha had het erg druk met veel dienen, en zij kwam erbij staan en zei: Heere, kan het U niet schelen dat mijn zuster mij alleen laat dienen? Zeg dan tegen haar dat zij mij helpt.", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Mark 7:34": "En Hij keek op naar de hemel, zuchtte, en zei tegen hem: Effatha! Dat is: word geopend!", "Mark 5:19": "Maar Jezus stond hem dat niet toe, maar zei tegen hem: Ga naar uw huis, naar de uwen, en vertel hun wat grote dingen de Heere aan u gedaan heeft, en hoe Hij Zich over u ontfermd heeft.", "Hand 17:3": "En legde ze uit, en toonde aan dat de Christus moest lijden en opstaan uit de doden, en dat deze Jezus de Christus is, Die ik, zei hij, u verkondig.", "Joh 1:14": "En het Woord is vlees geworden, en heeft onder ons gewoond (en wij hebben Zijn heerlijkheid aanschouwd, een heerlijkheid als van de Eniggeborene van de Vader), vol van genade en waarheid.", "Jes 6:5-7": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien. Maar een van de serafs vloog naar mij toe, en had een gloeiende kool in zijn hand, die hij met de tang van het altaar genomen had. En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Jona 1:17": "De HEERE nu beschikte een grote vis om Jona in te slokken; en Jona was in de buik van de vis, drie dagen en drie nachten.", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "Joh 9:24": "Zij riepen dan voor de tweede maal de man die blind geweest was, en zeiden tegen hem: Geef God de eer; wij weten dat deze Mens een zondaar is.", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Job 13:13": "Houd u stil van mij, opdat ik spreek, en laat over mij komen wat het ook zij.", "Jer 44:23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "1 Kor 9:23": "En dit doe ik om het Evangelie, opdat ik daar mede deelachtig aan zou worden.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Gal 1:4": "Die Zichzelf gegeven heeft voor onze zonden, opdat Hij ons zou trekken uit deze tegenwoordige boze wereld, naar de wil van onze God en Vader;", "Mark 10:12": "En als een vrouw haar man verlaat, en met een ander trouwt, pleegt zij overspel.", "Luk 10:22": "Alle dingen zijn Mij door Mijn Vader overgegeven; en niemand weet wie de Zoon is dan de Vader; en wie de Vader is dan de Zoon, en hij aan wie de Zoon het wil openbaren.", "Joh 7:34": "U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.", "Luk 18:30": "die niet veel meer terug zal ontvangen in deze tijd, en in de toekomende eeuw het eeuwige leven.", "2 Kor 10:18": "Want niet wie zichzelf prijst, die is beproefd, maar wie de Heere prijst.", "Luk 9:45": "Maar zij begrepen dit woord niet, en het was voor hen verborgen, zodat zij het niet doorhadden; en zij waren bang Hem naar dat woord te vragen.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Luk 14:33": "Zo kan dan ieder van u die niet alles opgeeft wat hij heeft, Mijn discipel niet zijn.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "Ps 37:18": "Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Ps 104:35": "De zondaars zullen van de aarde weggevaagd worden, en de goddelozen zullen niet meer zijn. Loof de HEERE, mijn ziel! Hallelujah!", "Jes 9:17": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook.", "Fil 1:2": "Genade zij u en vrede van God, onze Vader, en van de Heere Jezus Christus.", "Spr 29:25": "De angst voor mensen legt een strik; maar wie op de HEERE vertrouwt, zal veilig gesteld worden.", "Ezech 14:4": "Daarom, spreek met hen en zeg tegen hen: Zo zegt de Heere HEERE: Ieder man uit het huis van Israël die de drekgoden in zijn hart opzet, en de aanstoot van zijn ongerechtigheid recht voor zijn aangezicht zet, en komt tot de profeet, Ik, de HEERE, zal hem antwoorden als hij komt, naar de veelheid van zijn drekgoden;", "Jer 2:34": "Ja, het bloed van de zielen van de onschuldige behoeftigen is in uw zomen gevonden; Ik heb dat niet door opgraven gevonden, maar aan dat alles.", "Luk 11:10": "Want ieder die bid
