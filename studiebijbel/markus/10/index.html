amuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En Hij stond op van daar, en ging naar het gebied van Judea, door de overkant van de Jordaan; en de menigten kwamen weer bij Hem samen, en zoals Hij gewoon was, onderwees Hij hen weer.","2":"En de Farizeeën kwamen naar Hem toe, en vroegen Hem of het een man geoorloofd is *zijn* vrouw te verlaten, om Hem op de proef te stellen.","3":"Maar Hij antwoordde en zei tegen hen: Wat heeft Mozes u geboden?","4":"En zij zeiden: Mozes heeft toegestaan een scheidbrief te schrijven, en *haar* te verlaten.","5":"En Jezus antwoordde en zei tegen hen: Vanwege de hardheid van uw hart heeft hij u dit gebod geschreven.","6":"Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt.","7":"Daarom zal een man zijn vader en zijn moeder verlaten, en zich aan zijn vrouw hechten;","8":"en die twee zullen tot één vlees zijn, zodat zij niet meer twee zijn, maar één vlees.","9":"Wat God dan samengevoegd heeft, laat de mens dat niet scheiden.","10":"En in huis vroegen Zijn discipelen Hem hier weer naar.","11":"En Hij zei tegen hen: Wie zijn vrouw verlaat, en een ander trouwt, pleegt overspel tegen haar.","12":"En als een vrouw haar man verlaat, en met een ander trouwt, pleegt zij overspel.","13":"En zij brachten kinderen bij Hem, opdat Hij ze zou aanraken; maar de discipelen berispten hen die ze bij Hem brachten.","14":"Maar Jezus zag *dit*, en nam het Hem zeer kwalijk, en zei tegen hen: Laat de kinderen bij Mij komen, en verhinder ze niet; want voor zulke is het Koninkrijk van God.","15":"Voorwaar, Ik zeg u: Wie het Koninkrijk van God niet ontvangt als een kind, die zal er geenszins ingaan.","16":"En Hij omarmde ze met Zijn armen, *en* Hij legde de handen op hen, en zegende hen.","17":"En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven?","18":"En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, *namelijk* God.","19":"U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.","20":"Maar hij antwoordde en zei tegen Hem: Meester, al deze dingen heb ik onderhouden van mijn jeugd af.","21":"En Jezus keek hem aan en had hem lief, en zei tegen hem: Eén ding ontbreekt u; ga heen, verkoop alles wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom, neem het kruis op, en volg Mij.","22":"Maar hij werd bedroefd over dat woord, en ging treurig weg; want hij had veel bezittingen.","23":"En Jezus keek rond, en zei tegen Zijn discipelen: Hoe moeilijk zullen zij die rijkdom hebben in het Koninkrijk van God binnengaan!","24":"En de discipelen waren verbaasd over deze woorden van Hem. Maar Jezus antwoordde weer en zei tegen hen: Kinderen, hoe moeilijk is het voor hen die op rijkdom vertrouwen, om het Koninkrijk van God binnen te gaan!","25":"Het is gemakkelijker dat een kameel door het oog van een naald gaat, dan dat een rijke het Koninkrijk van God binnengaat.","26":"En zij waren nog meer verbaasd, en zeiden tegen elkaar: Wie kan dan behouden worden?","27":"Maar Jezus keek hen aan, en zei: Bij de mensen is het onmogelijk, maar niet bij God; want bij God zijn alle dingen mogelijk.","28":"En Petrus begon tegen Hem te zeggen: Zie, wij hebben alles verlaten, en zijn U gevolgd.","29":"En Jezus antwoordde en zei: Voorwaar, Ik zeg u: Er is niemand die huis, of broers, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers verlaten heeft, omwille van Mij en *omwille* van het Evangelie,","30":"of hij ontvangt honderdvoud, nu in deze tijd, huizen, en broers, en zusters, en moeders, en kinderen, en akkers, met vervolgingen, en in de toekomende tijd het eeuwige leven.","31":"Maar vele eersten zullen de laatsten zijn, en *velen* die de laatsten *zijn*, de eersten.","32":"En zij waren onderweg, op weg naar Jeruzalem; en Jezus liep voor hen uit; en zij waren verbaasd, en terwijl zij Hem volgden, waren zij bang. En Hij nam de twaalf weer apart, en begon hun te vertellen wat Hem zou overkomen;","33":"*En Hij zei*: Zie, wij gaan op naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters, en aan de Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen, en Hem aan de heidenen overleveren;","34":"en zij zullen Hem bespotten, en Hem geselen, en Hem bespuwen, en Hem doden; en op de derde dag zal Hij weer opstaan.","35":"En Jakobus en Johannes, de zonen van Zebedeüs, kwamen naar Hem toe, en zeiden: Meester, wij zouden *graag* willen dat U voor ons deed wat wij ook zullen vragen.","36":"En Hij zei tegen hen: Wat wilt u dat Ik voor u doe?","37":"En zij zeiden tegen Hem: Geef ons dat wij mogen zitten, de één aan Uw rechterhand, en de ander aan Uw linker*hand*, in Uw heerlijkheid.","38":"Maar Jezus zei tegen hen: U weet niet wat u vraagt. Kunt u de drinkbeker drinken die Ik drink, en gedoopt worden met de doop waarmee Ik gedoopt word?","39":"En zij zeiden tegen Hem: Wij kunnen het. Maar Jezus zei tegen hen: De drinkbeker die Ik drink, zult u inderdaad drinken, en met de doop gedoopt worden waarmee Ik gedoopt word;","40":"maar het zitten aan Mijn rechter- en aan Mijn linker*hand* staat niet aan Mij te geven; maar *het zal gegeven worden* aan hen voor wie het bereid is.","41":"En toen de *andere* tien *dit* hoorden, begonnen zij het Jakobus en Johannes zeer kwalijk te nemen.","42":"Maar Jezus riep hen tot Zich, en zei tegen hen: U weet dat zij die geacht worden leiders van de volken te zijn, heerschappij over hen voeren, en hun hoogwaardigheidsbekleders macht over hen uitoefenen.","43":"Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die zal uw dienaar zijn.","44":"En wie van u de eerste wil worden, die zal ieders dienstknecht zijn.","45":"Want ook de Zoon des mensen is niet gekomen om gediend te worden, maar om te dienen, en Zijn leven te geven *als* losprijs voor velen.","46":"En zij kwamen in Jericho. En toen Hij met Zijn discipelen, en een grote menigte, uit Jericho vertrok, zat de zoon van Timeüs, Bartimeüs, de blinde, bedelend langs de weg.","47":"En toen hij hoorde dat het Jezus de Nazarener was, begon hij te roepen en te zeggen: Jezus, Zoon van David! Ontferm U over mij.","48":"En velen bestraften hem, opdat hij zou zwijgen; maar hij riep des te meer: Zoon van David! Ontferm U over mij.","49":"En Jezus bleef *stil* staan, en zei dat men hem zou roepen; en zij riepen de blinde, en zeiden tegen hem: Heb goede moed; sta op; Hij roept u.","50":"En hij wierp zijn mantel af, stond op, en kwam naar Jezus toe.","51":"En Jezus antwoordde en zei tegen hem: Wat wilt u dat Ik voor u doe? En de blinde zei tegen Hem: Rabboni, dat ik weer kan zien.","52":"En Jezus zei tegen hem: Ga heen, uw geloof heeft u behouden. En meteen kon hij weer zien, en volgde Jezus op de weg."},"SV":{"1":"En van daar opgestaan zijnde, ging Hij naar de landpalen van Judea, door de overzijde van de Jordaan; en de scharen kwamen wederom samen bij Hem, en gelijk Hij gewoon was, leerde Hij hen wederom.","2":"En de Farizeën, tot Hem komende, vraagden Hem, of het een man geoorloofd is, *zijn* vrouw te verlaten, Hem verzoekende.","3":"Maar Hij antwoordende, zeide tot hen: Wat heeft u Mozes geboden?","4":"En zij zeiden: Mozes heeft toegelaten een scheidbrief te schrijven, en *haar* te verlaten.","5":"En Jezus, antwoordende, zeide tot hen: Vanwege de hardigheid uwer harten heeft hij ulieden dat gebod geschreven.","6":"Maar van het begin der schepping heeft ze God man en vrouw gemaakt.","7":"Daarom zal een mens zijn vader en zijn moeder verlaten, en zal zijn vrouw aanhangen;","8":"En die twee zullen tot een vlees zijn, alzo dat zij niet meer twee zijn, maar een vlees.","9":"Hetgeen dan God samengevoegd heeft, scheide de mens niet.","10":"En in het huis vraagden Hem Zijn discipelen wederom van hetzelve.","11":"En Hij zeide tot hen: Zo wie zijn vrouw verlaat, en een andere trouwt, die doet overspel tegen haar.","12":"En indien een vrouw haar man zal verlaten, en met een anderen trouwen, die doet overspel.","13":"En zij brachten kinderkens tot Hem, opdat Hij ze aanraken zou; en de discipelen bestraften degenen, die ze tot Hem brachten.","14":"Maar Jezus, *dat* ziende, nam het zeer kwalijk, en zeide tot hen: Laat de kinderkens tot Mij komen, en verhindert ze niet; want derzulken is het Koninkrijk Gods.","15":"Voorwaar zeg Ik u: Zo wie het Koninkrijk Gods niet ontvangt, gelijk een kindeken, die zal in hetzelve geenszins ingaan.","16":"En Hij omving ze met Zijn armen, *en* de handen op hen gelegd hebbende, zegende Hij dezelve.","17":"En als Hij uitging op den weg, liep een tot Hem, en voor Hem op de knieën vallende, vraagde Hem: Goede Meester! wat zal ik doen, opdat ik het eeuwige leven beerve?","18":"En Jezus zeide tot hem: Wat noemt gij Mij goed? Niemand is goed, dan Een, *namelijk* God.","19":"Gij weet de geboden: Gij zult geen overspel doen; gij zult niet doden; gij zult niet stelen; gij zult geen valse getuigenis geven; gij zult niemand te kort doen; eer uw vader en uw moeder.","20":"Doch hij, antwoordende, zeide tot Hem: Meester! al deze dingen heb ik onderhouden van mijn jonkheid af.","21":"En Jezus, hem aanziende, beminde hem, en zeide tot hem: Een ding ontbreekt u; ga heen, verkoop alles, wat gij hebt, en geef het den armen, en gij zult een schat hebben in den hemel; en kom herwaarts, neem het kruis op, en volg Mij.","22":"Maar hij, treurig geworden zijnde over dat woord, ging bedroefd weg; want hij had vele goederen.","23":"En Jezus rondom ziende, zeide tot Zijn discipelen: Hoe bezwaarlijk zullen degenen, die goed hebben, in het Koninkrijk Gods inkomen!","24":"En de discipelen werden verbaasd over deze Zijn woorden. Maar Jezus wederom antwoordende, zeide tot hen: Kinderen! Hoe zwaar is het, dat degenen, die op het goed hun betrouwen zetten, in het Koninkrijk Gods ingaan!","25":"Het is lichter, dat een kemel ga door het oog van een naald, dan dat een rijke in het Koninkrijk Gods inga.","26":"En zij werden nog meer verslagen, zeggende tot elkander: Wie kan dan zalig worden?","27":"Doch Jezus, hen aanziende, zeide: Bij de mensen is het onmogelijk, maar niet bij God; want alle dingen zijn mogelijk bij God.","28":"En Petrus begon tot Hem te zeggen: Zie, wij hebben alles verlaten, en zijn U gevolgd.","29":"En Jezus, antwoordende, zeide: Voorwaar zeg Ik ulieden: Er is niemand, die verlaten heeft huis, of broeders, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers, om Mijnentwil en des Evangelies *wil*,","30":"Of hij ontvangt honderdvoud, nu in dezen tijd, huizen, en broeders, en zusters, en moeders, en kinderen, en akkers, met de vervolgingen, en in de toekomende eeuw het eeuwige leven.","31":"Maar vele eersten zullen de laatsten zijn, en *velen*, die de laatsten *zijn*, de eersten.","32":"En zij waren op den weg, gaande op naar Jeruzalem; en Jezus ging voor hen; en zij waren verbaasd, en Hem volgende, waren zij bevreesd. En de twaalven wederom tot Zich nemende, begon Hij hun te zeggen de dingen, die Hem overkomen zouden;","33":"*Zeggende*: Ziet, wij gaan op naar Jeruzalem, en de Zoon des mensen zal den overpriesteren, en den Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen, en Hem den heidenen overleveren;","34":"En zij zullen Hem bespotten, en Hem geselen, en Hem bespuwen, en Hem doden; en ten derden dage zal Hij weder opstaan.","35":"En tot Hem kwamen Jakobus en Johannes, de zonen van Zebedeüs, zeggende: Meester! wij wilden *wel*, dat Gij ons deedt, zo wat wij begeren zullen.","36":"En Hij zeide tot hen: Wat wilt gij, dat Ik u doe?","37":"En zij zeiden tot Hem: Geef ons, dat wij mogen zitten, de een aan Uw rechter-, en de ander aan Uw linker *hand* in Uw heerlijkheid.","38":"Maar Jezus zeide tot hen: Gij weet niet, wat gij begeert. Kunt gij den drinkbeker drinken, dien Ik drink, en met den doop gedoopt worden, daar Ik mede gedoopt word?","39":"En zij zeiden tot Hem: Wij kunnen. Doch Jezus zeide tot hen: Den drinkbeker, dien Ik drink, zult gij wel drinken, en met den doop gedoopt worden, daar Ik mede gedoopt word;","40":"Maar het zitten tot Mijn rechter- en tot Mijn linker *hand* staat bij Mij niet te geven; maar *het* *zal* *gegeven* *worden* dien het bereid is.","41":"En als de *andere* tien *dit* hoorden, begonnen zij het van Jakobus en Johannes zeer kwalijk te nemen.","42":"Maar Jezus, hen tot Zich geroepen hebbende, zeide tot hen: Gij weet, dat degenen, die geacht worden oversten te zijn der volken, heerschappij voeren over hen, en hun groten gebruiken macht over hen.","43":"Doch alzo zal het onder u niet zijn; maar zo wie onder u groot zal willen worden, die zal uw dienaar zijn.","44":"En zo wie van u de eerste zal willen worden, die zal aller dienstknecht zijn.","45":"Want ook de Zoon des mensen is niet gekomen om gediend te worden, maar om te dienen, en Zijn ziel te geven *tot* een rantsoen voor velen.","46":"En zij kwamen te Jericho. En als Hij en Zijn discipelen, en een grote schare van Jericho uitging, zat de zoon van Timeüs, Bar-timeus, de blinde, aan den weg, bedelende.","47":"En horende, dat het Jezus de Nazarener was, begon hij te roepen en te zeggen: Jezus, Gij Zone Davids! ontferm U mijner.","48":"En velen bestraften hem, opdat hij zwijgen zou; maar hij riep zoveel temeer: Gij Zone Davids! ontferm U mijner.","49":"En Jezus, *stil* staande, zeide, dat men hem roepen zou; en zij riepen den blinde, zeggende tot hem: Heb goeden moed; sta op; Hij roept u.","50":"En hij, zijn mantel afgeworpen hebbende, stond op, en kwam tot Jezus.","51":"En Jezus, antwoordende, zeide tot hem: Wat wilt gij, dat Ik u doen zal? En de blinde zeide tot Hem: Rabboni! dat ik ziende mag worden.","52":"En Jezus zeide tot hem: Ga heen, uw geloof heeft u behouden. En terstond werd hij ziende, en volgde Jezus op den weg."},"KJV":{"1":"And he arose from thence, and cometh into the coasts of Judaea by the farther side of Jordan: and the people resort unto him again; and, as he was wont, he taught them again.","2":"And the Pharisees came to him, and asked him, Is it lawful for a man to put away *his* wife? tempting him.","3":"And he answered and said unto them, What did Moses command you?","4":"And they said, Moses suffered to write a bill of divorcement, and to put *her* away.","5":"And Jesus answered and said unto them, For the hardness of your heart he wrote you this precept.","6":"But from the beginning of the creation God made them male and female.","7":"For this cause shall a man leave his father and mother, and cleave to his wife;","8":"And they twain shall be one flesh: so then they are no more twain, but one flesh.","9":"What therefore God hath joined together, let not man put asunder.","10":"And in the house his disciples asked him again of the same","11":"And he saith unto them, Whosoever shall put away his wife, and marry another, committeth adultery against her.","12":"And if a woman shall put away her husband, and be married to another, she committeth adultery.","13":"And they brought young children to him, that he should touch them: and *his* disciples rebuked those that brought","14":"But when Jesus saw *it*, he was much displeased, and said unto them, Suffer the little children to come unto me, and forbid them not: for of such is the kingdom of God.","15":"Verily I say unto you, Whosoever shall not receive the kingdom of God as a little child, he shall not enter therein.","16":"And he took them up in his arms, put *his* hands upon them, and blessed them.","17":"And when he was gone forth into the way, there came one running, and kneeled to him, and asked him, Good Master, what shall I do that I may inherit eternal life?","18":"And Jesus said unto him, Why callest thou me good? *there is* none good but one, *that is*, God.","19":"Thou knowest the commandments, Do not commit adultery, Do not kill, Do not steal, Do not bear false witness, Defraud not, Honour thy father and mother.","20":"And he answered and said unto him, Master, all these have I observed from my youth.","21":"Then Jesus beholding him loved him, and said unto him, One thing thou lackest: go thy way, sell whatsoever thou hast, and give to the poor, and thou shalt have treasure in heaven: and come, take up the cross, and follow me.","22":"And he was sad at that saying, and went away grieved: for he had great possessions.","23":"And Jesus looked round about, and saith unto his disciples, How hardly shall they that have riches enter into the kingdom of God!","24":"And the disciples were astonished at his words. But Jesus answereth again, and saith unto them, Children, how hard is it for them that trust in riches to enter into the kingdom of God!","25":"It is easier for a camel to go through the eye of a needle, than for a rich man to enter into the kingdom of God.","26":"And they were astonished out of measure, saying among themselves, Who then can be saved?","27":"And Jesus looking upon them saith, With men *it is* impossible, but not with God: for with God all things are possible.","28":"Then Peter began to say unto him, Lo, we have left all, and have followed thee.","29":"And Jesus answered and said, Verily I say unto you, There is no man that hath left house, or brethren, or sisters, or father, or mother, or wife, or children, or lands, for my sake, and the gospel's,","30":"But he shall receive an hundredfold now in this time, houses, and brethren, and sisters, and mothers, and children, and lands, with persecutions; and in the world to come eternal life.","31":"But many *that are* first shall be last; and the last first.","32":"And they were in the way going up to Jerusalem; and Jesus went before them: and they were amazed; and as they followed, they were afraid. And he took again the twelve, and began to tell them what things should happen unto him,","33":"*Saying*, Behold, we go up to Jerusalem; and the Son of man shall be delivered unto the chief priests, and unto the scribes; and they shall condemn him to death, and shall deliver him to the Gentiles:","34":"And they shall mock him, and shall scourge him, and shall spit upon him, and shall kill him: and the third day he shall rise again.","35":"And James and John, the sons of Zebedee, come unto him, saying, Master, we would that thou shouldest do for us whatsoever we shall desire.","36":"And he said unto them, What would ye that I should do for you?","37":"They said unto him, Grant unto us that we may sit, one on thy right hand, and the other on thy left hand, in thy glory.","38":"But Jesus said unto them, Ye know not what ye ask: can ye drink of the cup that I drink of? and be baptized with the baptism that I am baptized with?","39":"And they said unto him, We can. And Jesus said unto them, Ye shall indeed drink of the cup that I drink of; and with the baptism that I am baptized withal shall ye be baptized:","40":"But to sit on my right hand and on my left hand is not mine to give; but *it shall be given to them* for whom it is prepared.","41":"And when the ten heard *it*, they began to be much displeased with James and John.","42":"But Jesus called them *to him*, and saith unto them, Ye know that they which are accounted to rule over the Gentiles exercise lordship over them; and their great ones exercise authority upon them.","43":"But so shall it not be among you: but whosoever will be great among you, shall be your minister:","44":"And whosoever of you will be the chiefest, shall be servant of all.","45":"For even the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many.","46":"And they came to Jericho: and as he went out of Jericho with his disciples and a great number of people, blind Bartimaeus, the son of Timaeus, sat by the highway side begging.","47":"And when he heard that it was Jesus of Nazareth, he began to cry out, and say, Jesus, *thou* Son of David, have mercy on me.","48":"And many charged him that he should hold his peace: but he cried the more a great deal, *Thou* Son of David, have mercy on me.","49":"And Jesus stood still, and commanded him to be called. And they call the blind man, saying unto him, Be of good comfort, rise; he calleth thee.","50":"And he, casting away his garment, rose, and came to Jesus.","51":"And Jesus answered and said unto him, What wilt thou that I should do unto thee? The blind man said unto him, Lord, that I might receive my sight.","52":"And Jesus said unto him, Go thy way; thy faith hath made thee whole. And immediately he received his sight, and followed Jesus in the way."}},"tsk":{"1":[{"kopje":"stond op","refs":["Matt 19:1-12"]},{"kopje":"door","refs":["Joh 10:40","Joh 11:7"]},{"kopje":"onderwees Hij","refs":["Pred 12:9","Jer 32:33","Joh 18:20"]}],"2":[{"kopje":"de Farizeeën","refs":["Mark 8:15","Matt 9:34","Matt 15:12","Matt 23:13","Luk 5:30","Luk 6:7","Luk 7:30","Luk 11:39","Luk 11:53","Luk 11:54","Luk 16:14","Joh 7:32","Joh 7:48","Joh 11:47","J (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
