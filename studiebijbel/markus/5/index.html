<style>

    --bg-soft: #f2ead8; --border: var(--lightgray); --tekst: var(--darkgray);

  .hfdnav { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; font-family:sans-serif; font-size:.85rem; padding:.5rem 0; margin-bottom:1.1rem; }

  .hfdnav select { font-family:sans-serif; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:sans-serif; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #f0e2bd; } 100% { background: var(--bg-soft); } }
  .vnr { color: #b3a184; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: sans-serif; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:sans-serif; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  .ntab.leeg { opacity: .4; cursor: default; }

  .ond-refs { margin: .3rem 0 0; }

  .bronregel { font-size:.72rem; color:#999; margin-top:.6rem; }

  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }

  @media (max-width: 640px) { .omslag { padding: .6rem .7rem 3rem; } header.site h1 { font-size: 1.5rem; } }
</style>

el","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En zij kwamen aan de overkant van de zee, in het land van de Gadarenen.","2":"En toen Hij uit het schip gegaan was, kwam meteen iemand Hem tegemoet uit de graven, een man met een onreine geest;","3":"die *zijn* woonplaats in de graven had, en niemand kon hem binden, zelfs niet met ketenen.","4":"Want hij was vaak met boeien en ketenen gebonden geweest, en de ketenen waren door hem in stukken getrokken, en de boeien verbrijzeld, en niemand was sterk genoeg om hem te temmen.","5":"En hij was altijd, nacht en dag, op de bergen en in de graven, roepend en zichzelf met stenen slaand.","6":"Toen hij nu Jezus van verre zag, rende hij *ernaartoe*, en aanbad Hem.","7":"En met luide stem roepend, zei hij: Wat heb ik met U *te maken*, Jezus, Zoon van God, de Allerhoogste? Ik bezweer U bij God, dat U mij niet pijnigt!","8":"(Want Hij zei tegen hem: Kom uit de man, onreine geest!)","9":"En Hij vroeg hem: Wat is uw naam? En hij antwoordde: Mijn naam is Legioen; want wij zijn met velen.","10":"En hij smeekte Hem dringend dat Hij hen niet uit het land zou wegzenden.","11":"En daar bij de bergen was een grote kudde zwijnen aan het grazen.","12":"En alle duivels smeekten Hem: Zend ons in die zwijnen, opdat wij daarin mogen gaan.","13":"En Jezus stond het hun meteen toe. En de onreine geesten gingen uit hem weg en voeren in de zwijnen; en de kudde stortte van de steilte af in de zee (er waren er ongeveer tweeduizend), en zij verdronken in de zee.","14":"En zij die de zwijnen weidden, vluchtten, en vertelden *dit* in de stad en op het land. En zij gingen eropuit om te zien wat er gebeurd was.","15":"En zij kwamen bij Jezus, en zagen de bezetene zitten, gekleed, en goed bij zijn verstand, *namelijk* hij die het legioen gehad had, en zij werden bevreesd.","16":"En zij die het gezien hadden, vertelden hun wat er met de bezetene gebeurd was, en *ook* over de zwijnen.","17":"En zij begonnen Hem te smeken dat Hij uit hun gebied zou weggaan.","18":"En toen Hij in het schip ging, smeekte hij die bezeten was geweest Hem, dat hij bij Hem mocht zijn.","19":"Maar Jezus stond hem *dat* niet toe, maar zei tegen hem: Ga naar uw huis, naar de uwen, en vertel hun wat grote *dingen* de Heere aan u gedaan heeft, en *hoe* Hij Zich over u ontfermd heeft.","20":"En hij ging weg, en begon in het *gebied* van Dekapolis te verkondigen wat grote dingen Jezus aan hem gedaan had; en zij verwonderden zich allen.","21":"En toen Jezus opnieuw met het schip overgevaren was naar de andere kant, kwam er een grote menigte bij Hem samen; en Hij was bij de zee.","22":"En zie, er kwam een van de leiders van de synagoge, van wie de naam Jaïrus was; en toen hij Hem zag, viel hij aan Zijn voeten,","23":"en smeekte Hem dringend: Mijn dochtertje ligt op sterven; *ik smeek U*, kom en leg de handen op haar, opdat zij behouden wordt, en zij zal leven.","24":"En Hij ging met hem mee; en een grote menigte volgde Hem, en zij verdrongen Hem.","25":"En een zekere vrouw, die twaalf jaar lang aan bloedvloeiingen geleden had,","26":"en veel geleden had van vele artsen, en al wat zij had *daaraan* ten koste gelegd had, en geen baat gevonden had, maar met wie het juist erger geworden was;","27":"*Zij* had over Jezus gehoord, en kwam van achteren tussen de menigte door, en raakte Zijn kleed aan;","28":"Want zij zei: Als ik maar Zijn kleren mag aanraken, zal ik gezond worden.","29":"En meteen droogde de bron van haar bloed op, en zij voelde aan haar lichaam dat zij van die kwaal genezen was.","30":"En Jezus, die meteen in Zichzelf besefte dat er kracht van Hem uitgegaan was, keerde Zich om in de menigte, en zei: Wie heeft Mijn kleren aangeraakt?","31":"En Zijn discipelen zeiden tegen Hem: U ziet dat de menigte U verdringt, en zegt U: Wie heeft Mij aangeraakt?","32":"En Hij keek rond om haar te zien die dit gedaan had.","33":"En de vrouw, angstig en bevend, wetend wat er met haar gebeurd was, kwam en viel voor Hem neer, en vertelde Hem de hele waarheid.","34":"En Hij zei tegen haar: Dochter, uw geloof heeft u behouden; ga heen in vrede, en wees genezen van deze kwaal van u.","35":"Terwijl Hij nog sprak, kwamen er *enigen* van *het huis* van de leider van de synagoge, die zeiden: Uw dochter is gestorven; waarom valt u de Meester nog lastig?","36":"En Jezus, die meteen het woord hoorde dat er gesproken werd, zei tegen de leider van de synagoge: Vrees niet; geloof alleen.","37":"En Hij liet niemand toe om Hem te volgen, dan Petrus, en Jakobus, en Johannes, de broer van Jakobus;","38":"En Hij kwam in het huis van de leider van de synagoge; en zag de opschudding, *en degenen* die zeer weenden en huilden.","39":"En toen Hij naar binnen gegaan was, zei Hij tegen hen: Waarom maakt u zo'n opschudding, en *waarom* weent u? Het kind is niet gestorven, maar het slaapt.","40":"En zij lachten Hem uit; maar Hij stuurde hen allen naar buiten, en nam de vader en de moeder van het kind mee, en degenen die met Hem *waren*, en ging naar binnen waar het kind lag.","41":"En Hij pakte de hand van het kind, en zei tegen haar: Talitha koemi! Dat is, vertaald: Meisje (Ik zeg u), sta op.","42":"En meteen stond het meisje op, en liep; want zij was twaalf jaar *oud*; en zij ontzetten zich met grote ontzetting.","43":"En Hij gebood hun dringend, dat niemand dit zou weten; en Hij zei dat men haar te eten zou geven."},"SV":{"1":"En zij kwamen over op de andere zijde der zee, in het land der Gadarenen.","2":"En zo Hij uit het schip gegaan was, terstond ontmoette Hem, uit de graven, een mens met een onreinen geest;","3":"Dewelke *zijn* woning in de graven had, en niemand kon hem binden, ook zelfs niet met ketenen.","4":"Want hij was menigmaal met boeien en ketenen gebonden geweest, en de ketenen waren van hem in stukken getrokken, en de boeien verbrijzeld, en niemand was machtig om hem te temmen.","5":"En hij was altijd, nacht en dag, op de bergen en in de graven, roepende en slaande zichzelven met stenen.","6":"Als hij nu Jezus van verre zag, liep hij *toe*, en aanbad Hem.","7":"En met een grote stem roepende, zeide hij: Wat heb ik met U *te* *doen*, Jezus, Gij Zone Gods, des Allerhoogsten? Ik bezweer U bij God, dat Gij mij niet pijnigt!","8":"( Want Hij zeide tot hem: Gij onreine geest, ga uit van den mens!)","9":"En Hij vraagde hem: Welke is uw naam? En hij antwoordde, zeggende: Mijn naam is Legio; want wij zijn velen.","10":"En hij bad Hem zeer, dat Hij hen buiten het land niet wegzond.","11":"En aldaar aan de bergen was een grote kudde zwijnen, weidende.","12":"En al de duivelen baden Hem, zeggende: Zend ons in die zwijnen, opdat wij in dezelve mogen varen.","13":"En Jezus liet het hun terstond toe. En de onreine geesten, uitgevaren zijnde, voeren in de zwijnen; en de kudde stortte van de steilte af in de zee (daar waren er nu omtrent twee duizend), en versmoorden in de zee.","14":"En die de zwijnen weidden zijn gevlucht, en boodschapten *zulks* in de stad en op het land. En zij gingen uit, om te zien, wat het was, dat er geschied was.","15":"En zij kwamen tot Jezus, en zagen den bezetene zittende, en gekleed, en wel bij zijn verstand, *namelijk* die het legioen gehad had, en zij werden bevreesd.","16":"En die het gezien hadden, vertelden hun, wat den bezetene geschied was, en *ook* van de zwijnen.","17":"En zij begonnen Hem te bidden, dat Hij van hun landpalen wegging.","18":"En als Hij in het schip ging, bad Hem degene, die bezeten was geweest, dat hij met Hem mocht zijn.","19":"Doch Jezus liet hem *dat* niet toe, maar zeide tot hem: Ga heen naar uw huis tot de uwen, en boodschap hun, wat grote *dingen* u de Heere gedaan heeft, en *hoe* Hij Zich uwer ontfermd heeft.","20":"En hij ging heen, en begon te verkondigen in het *land* van Dekapolis, wat grote dingen hem Jezus gedaan had; en zij verwonderden zich allen.","21":"En als Jezus wederom in het schip overgevaren was aan de andere zijde, vergaderde een grote schare bij Hem; en Hij was bij de zee.","22":"En ziet, er kwam een van de oversten der synagoge, met name Jaïrus; en Hem ziende, viel hij aan Zijn voeten,","23":"En bad Hem zeer, zeggende: Mijn dochtertje is in haar uiterste; *ik* *bid* *U*, dat Gij komt en de handen op haar legt, opdat zij behouden worde, en zij zal leven.","24":"En Hij ging met hem; en een grote schare volgde Hem, en zij verdrongen Hem.","25":"En een zekere vrouw, die twaalf jaren den vloed des bloeds gehad had,","26":"En veel geleden had van vele medicijnmeesters, en al het hare *daaraan* ten koste gelegd en geen baat gevonden had, maar met welke het veeleer erger geworden was;","27":"*Deze* van Jezus horende, kwam onder de schare van achteren, en raakte Zijn kleed aan;","28":"Want zij zeide: Indien ik maar Zijn klederen mag aanraken, zal ik gezond worden.","29":"En terstond is de fontein haars bloeds opgedroogd, en zij gevoelde aan haar lichaam, dat zij van die kwaal genezen was.","30":"En terstond Jezus, bekennende in Zichzelven de kracht, die van Hem uitgegaan was, keerde Zich om in de schare, en zeide: Wie heeft Mijn klederen aangeraakt?","31":"En Zijn discipelen zeiden tot Hem: Gij ziet, dat de schare U verdringt, en zegt Gij: Wie heeft Mij aangeraakt?","32":"En Hij zag rondom om haar te zien, die dat gedaan had.","33":"En de vrouw, vrezende en bevende, wetende, wat aan haar geschied was, kwam en viel voor Hem neder, en zeide Hem al de waarheid.","34":"En Hij zeide tot haar: Dochter, uw geloof heeft u behouden; ga heen in vrede, en zijt genezen van deze uw kwaal.","35":"Terwijl Hij nog sprak, kwamen *enigen* van *het* *huis* des oversten der synagoge, zeggende: Uw dochter is gestorven; wat zijt gij den Meester nog moeilijk?","36":"En Jezus, terstond gehoord hebbende het woord, dat er gesproken werd, zeide tot den overste der synagoge: Vrees niet; geloof alleenlijk.","37":"En Hij liet niemand toe Hem te volgen, dan Petrus, en Jakobus, en Johannes, den broeder van Jakobus;","38":"En kwam in het huis des oversten der synagoge; en zag de beroerte *en* *degenen*, die zeer weenden en huilden.","39":"En ingegaan zijnde, zeide Hij tot hen: Wat maakt gij beroerte, en *wat* weent gij? Het kind is niet gestorven, maar het slaapt.","40":"En zij belachten Hem; maar Hij, als Hij hen allen had uitgedreven, nam bij Zich den vader en de moeder des kinds, en degenen die met Hem *waren*, en ging binnen, waar het kind lag.","41":"En Hij vatte de hand des kinds, en zeide tot haar: Talitha kumi! hetwelk is, zijnde overgezet: Gij dochtertje (Ik zeg u), sta op.","42":"En terstond stond het dochtertje op, en wandelde; want het was twaalf jaren *oud*; en zij ontzetten zich met grote ontzetting.","43":"En Hij gebood hun zeer, dat niemand datzelve zou weten; en zeide, dat men haar zou te eten geven."},"KJV":{"1":"And they came over unto the other side of the sea, into the country of the Gadarenes.","2":"And when he was come out of the ship, immediately there met him out of the tombs a man with an unclean spirit,","3":"Who had *his* dwelling among the tombs; and no man could bind him, no, not with chains:","4":"Because that he had been often bound with fetters and chains, and the chains had been plucked asunder by him, and the fetters broken in pieces: neither could any *man* tame him.","5":"And always, night and day, he was in the mountains, and in the tombs, crying, and cutting himself with stones.","6":"But when he saw Jesus afar off, he ran and worshipped him,","7":"And cried with a loud voice, and said, What have I to do with thee, Jesus, *thou* Son of the most high God? I adjure thee by God, that thou torment me not.","8":"For he said unto him, Come out of the man, *thou* unclean spirit.","9":"And he asked him, What *is* thy name? And he answered, saying, My name *is* Legion: for we are many.","10":"And he besought him much that he would not send them away out of the country.","11":"Now there was there nigh unto the mountains a great herd of swine feeding.","12":"And all the devils besought him, saying, Send us into the swine, that we may enter into them.","13":"And forthwith Jesus gave them leave. And the unclean spirits went out, and entered into the swine: and the herd ran violently down a steep place into the sea, (they were about two thousand;) and were choked in the sea.","14":"And they that fed the swine fled, and told *it* in the city, and in the country. And they went out to see what it was that was done.","15":"And they come to Jesus, and see him that was possessed with the devil, and had the legion, sitting, and clothed, and in his right mind: and they were afraid.","16":"And they that saw *it* told them how it befell to him that was possessed with the devil, and *also* concerning the swine.","17":"And they began to pray him to depart out of their coasts.","18":"And when he was come into the ship, he that had been possessed with the devil prayed him that he might be with him.","19":"Howbeit Jesus suffered him not, but saith unto him, Go home to thy friends, and tell them how great things the Lord hath done for thee, and hath had compassion on thee.","20":"And he departed, and began to publish in Decapolis how great things Jesus had done for him: and all *men* did marvel.","21":"And when Jesus was passed over again by ship unto the other side, much people gathered unto him: and he was nigh unto the sea.","22":"And, behold, there cometh one of the rulers of the synagogue, Jairus by name; and when he saw him, he fell at his feet,","23":"And besought him greatly, saying, My little daughter lieth at the point of death: *I pray thee*, come and lay thy hands on her, that she may be healed; and she shall live.","24":"And *Jesus* went with him; and much people followed him, and thronged him.","25":"And a certain woman, which had an issue of blood twelve years,","26":"And had suffered many things of many physicians, and had spent all that she had, and was nothing bettered, but rather grew worse,","27":"When she had heard of Jesus, came in the press behind, and touched his garment.","28":"For she said, If I may touch but his clothes, I shall be whole.","29":"And straightway the fountain of her blood was dried up; and she felt in *her* body that she was healed of that plague.","30":"And Jesus, immediately knowing in himself that virtue had gone out of him, turned him about in the press, and said, Who touched my clothes?","31":"And his disciples said unto him, Thou seest the multitude thronging thee, and sayest thou, Who touched me?","32":"And he looked round about to see her that had done this thing.","33":"But the woman fearing and trembling, knowing what was done in her, came and fell down before him, and told him all the truth.","34":"And he said unto her, Daughter, thy faith hath made thee whole; go in peace, and be whole of thy plague.","35":"While he yet spake, there came from the ruler of the synagogue's *house certain* which said, Thy daughter is dead: why troublest thou the Master any further?","36":"As soon as Jesus heard the word that was spoken, he saith unto the ruler of the synagogue, Be not afraid, only believe.","37":"And he suffered no man to follow him, save Peter, and James, and John the brother of James.","38":"And he cometh to the house of the ruler of the synagogue, and seeth the tumult, and them that wept and wailed greatly.","39":"And when he was come in, he saith unto them, Why make ye this ado, and weep? the damsel is not dead, but sleepeth.","40":"And they laughed him to scorn. But when he had put them all out, he taketh the father and the mother of the damsel, and them that were with him, and entereth in where the damsel was lying.","41":"And he took the damsel by the hand, and said unto her, Talitha cumi; which is, being interpreted, Damsel, I say unto thee, arise.","42":"And straightway the damsel arose, and walked; for she was *of the age* of twelve years. And they were astonished with a great astonishment.","43":"And he charged them straitly that no man should know it; and commanded that something should be given her to eat."}},"tsk":{"2":[{"kopje":"uit","refs":["Jes 65:4","Luk 8:27"]},{"kopje":"met","refs":["Mark 5:8","Mark 1:23","Mark 1:26","Mark 3:30","Mark 7:25","Luk 9:42"]}],"4":[{"kopje":"temmen","refs":["Jak 3:7","Jak 3:8"]}],"5":[{"kopje":"roepend","refs":["1 Kon 18:28","Job 2:7","Job 2:8","Joh 8:44"]}],"6":[{"kopje":"rende hij ernaartoe","refs":["Ps 66:3","Ps 72:9","Luk 4:41","Hand 16:17","Jak 2:19"]}],"7":[{"kopje":"Wat","refs":["Mark 1:24","Hos 14:9","Matt 8:29","Luk 4:34"]},{"kopje":"Zoon","refs":["Mark 3:11","Mark 14:61","Matt 16:16","Joh 20:31","Hand 8:37","Hand 16:17"]},{"kopje":"Ik bezweer U","refs":["1 Kon 22:16","Matt 26:63","Hand 19:13"]},{"kopje":"dat","refs":["Gen 3:15","Matt 8:29","Luk 8:28","Rom 16:20","Hebr 2:14","2 Petr 2:4","1 Joh 3:8","Judas 1:6","Openb 12:12","Openb 20:1-3"]}],"9":[{"kopje":"Wat","refs":["Luk 8:30","Luk 11:21-26"]},{"kopje":"Legioen","refs":["Matt 12:45","Matt 26:53"]}],"11":[{"kopje":"kudde","refs":["Lev 11:7","Lev 11:8","Deut 14:8","Jes 65:4","Jes 66:3","Matt 8:30","Luk 8:32"]}],"13":[{"kopje /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
