","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En Hij begon opnieuw te onderwijzen bij de zee; en er kwam een grote menigte bij Hem samen, zodat Hij in het schip ging en op de zee ging zitten; en heel de menigte was op het land aan de zee.","2":"En Hij onderwees hun veel dingen door gelijkenissen, en Hij zei in Zijn onderwijs tegen hen:","3":"Luister: Zie, een zaaier ging uit om te zaaien.","4":"En het gebeurde bij het zaaien, dat het ene *deel zaad* langs de weg viel; en de vogels van de hemel kwamen en aten het op.","5":"En het andere viel op de rotsachtige grond, waar het niet veel aarde had; en het kwam meteen op, omdat het geen diepte van aarde had.","6":"Maar toen de zon opgegaan was, verschroeide het, en omdat het geen wortel had, verdorde het.","7":"En het andere viel tussen de dorens, en de dorens groeiden op, en verstikten het, en het gaf geen vrucht.","8":"En het andere viel in de goede aarde, en gaf vrucht, die opkwam en groeide; en het ene bracht dertig-, en het andere zestig-, en het andere honderd*voud* voort.","9":"En Hij zei tegen hen: Wie oren heeft om te horen, laat hij horen.","10":"En toen Hij nu alleen was, vroegen zij die om Hem heen *waren*, met de twaalf, Hem naar de gelijkenis.","11":"En Hij zei tegen hen: Aan u is het gegeven het geheimenis van het Koninkrijk van God te verstaan; maar aan hen die buiten zijn, gebeurt dit alles door gelijkenissen;","12":"opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.","13":"En Hij zei tegen hen: Begrijpt u deze gelijkenis niet, en hoe zult u dan alle gelijkenissen begrijpen?","14":"De zaaier *is degene die* het Woord zaait.","15":"En dezen zijn zij die langs de weg *bezaaid worden*, waarin het Woord gezaaid wordt; en wanneer zij het gehoord hebben, komt de satan meteen, en neemt het Woord weg, dat in hun hart gezaaid was.","16":"En dezen zijn evenzo zij die op de rotsachtige *plaatsen* bezaaid worden; die, wanneer zij het Woord gehoord hebben, het meteen met vreugde ontvangen.","17":"En zij hebben geen wortel in zichzelf, maar houden het voor een tijd vol; daarna, wanneer er verdrukking of vervolging komt omwille van het Woord, worden zij meteen afvallig.","18":"En dezen zijn zij die tussen de dorens gezaaid worden; *namelijk* zij die het Woord horen;","19":"en de zorgen van deze wereld, en de verleiding van de rijkdom, en de begeerten naar de andere dingen komen binnen en verstikken het Woord, en het wordt onvruchtbaar.","20":"En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderd*voud*.","21":"En Hij zei tegen hen: Wordt de lamp soms binnengebracht om onder de korenmaat of onder het bed gezet te worden? *Is het* niet om op de standaard gezet te worden?","22":"Want er is niets verborgen, dat niet openbaar zal worden; en er is niets gebeurd *om verborgen te blijven*, maar opdat het openbaar zou worden.","23":"Als iemand oren heeft om te horen, laat hij horen.","24":"En Hij zei tegen hen: Let op wat u hoort. Met de maat waarmee u meet, zal u gemeten worden, en aan u die hoort, zal *meer* gegeven worden.","25":"Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.","26":"En Hij zei: Zo is het Koninkrijk van God, alsof een mens het zaad in de aarde wierp;","27":"en *vervolgens* sliep en opstond, nacht en dag; en het zaad ontkiemde en groeide op, terwijl hij zelf niet wist hoe.","28":"Want de aarde brengt uit zichzelf vruchten voort: eerst het kruid, daarna de aar, daarna het volle koren in de aar.","29":"En wanneer de vrucht zich vertoont, zendt hij meteen de sikkel erin, omdat de oogst er is.","30":"En Hij zei: Waarmee zullen wij het Koninkrijk van God vergelijken, of met welke gelijkenis zullen wij het vergelijken?","31":"*Namelijk* met een mosterdzaad, dat, wanneer het in de aarde gezaaid wordt, het kleinste is van alle zaden die op de aarde *zijn*.","32":"En wanneer het gezaaid is, komt het op, en wordt het groter dan alle tuinkruiden, en maakt het grote takken, zodat de vogels van de hemel onder zijn schaduw kunnen nestelen.","33":"En door veel van zulke gelijkenissen sprak Hij het Woord tot hen, naarmate zij het konden horen.","34":"En zonder gelijkenis sprak Hij niet tot hen; maar Hij verklaarde alles apart aan Zijn discipelen.","35":"En op diezelfde dag, toen het avond geworden was, zei Hij tegen hen: Laten wij oversteken naar de andere kant.","36":"En zij lieten de menigte gaan en namen Hem mee, zoals Hij in het schip was; en er waren nog andere scheepjes bij Hem.","37":"En er kwam een grote storm van wind, en de golven sloegen over in het schip, zodat het al vol werd.","38":"En Hij lag in het achterschip te slapen op een kussen; en zij maakten Hem wakker, en zeiden tegen Hem: Meester, kan het U niet schelen dat wij vergaan?","39":"En Hij, wakker geworden, bestrafte de wind, en zei tegen de zee: Zwijg, wees stil! En de wind ging liggen, en er kwam grote stilte.","40":"En Hij zei tegen hen: Waarom bent u zo angstig? Hoe kan het dat u geen geloof hebt?","41":"En zij vreesden met grote vrees, en zeiden tegen elkaar: Wie is Deze toch, dat zelfs de wind en de zee Hem gehoorzaam zijn?"},"SV":{"1":"En Hij begon wederom te leren omtrent de zee; en er vergaderde een grote schare bij Hem, alzo dat Hij, in het schip gegaan zijnde, nederzat op de zee; en de gehele schare was op het land aan de zee.","2":"En Hij leerde hun veel dingen door gelijkenissen, en Hij zeide in Zijn lering tot hen:","3":"Hoort toe: ziet, een zaaier ging uit om te zaaien.","4":"En het geschiedde in het zaaien, dat het ene *deel* *zaads* viel bij den weg; en de vogelen des hemels kwamen, en aten het op.","5":"En het andere viel op het steenachtige, waar het niet veel aarde had; en het ging terstond op, omdat het geen diepte van aarde had.","6":"Maar als de zon opgegaan was, zo is het verbrand geworden, en omdat het geen wortel had, zo is het verdord.","7":"En het andere viel in de doornen, en de doornen wiesen op, en verstikten hetzelve, en het gaf geen vrucht.","8":"En het andere viel in de goede aarde, en gaf vrucht, die opging en wies; en het ene droeg dertig-, en het andere zestig-, en het andere honderd *voud*.","9":"En Hij zeide tot hen: Wie oren heeft om te horen, die hore.","10":"En als Hij nu alleen was, vraagden Hem degenen, die omtrent Hem *waren*, met de twaalven, naar de gelijkenis.","11":"En Hij zeide tot hen: Het is u gegeven te verstaan de verborgenheid van het Koninkrijk Gods; maar dengenen, die buiten zijn, geschieden al deze dingen door gelijkenissen;","12":"Opdat zij ziende zien, en niet bemerken, en horende horen, en niet verstaan; opdat zij zich niet te eniger tijd, bekeren en hun de zonden vergeven worden.","13":"En Hij zeide tot hen: Weet gij deze gelijkenis niet, en hoe zult gij al de gelijkenissen verstaan?","14":"De zaaier *is*, *die* het Woord zaait.","15":"En dezen zijn, die bij den weg *bezaaid* *worden*, waarin het Woord gezaaid wordt; en als zij het gehoord hebben, zo komt de satan terstond, en neemt het Woord weg, hetwelk in hun harten gezaaid was.","16":"En dezen zijn desgelijks, die op de steenachtige *plaatsen* bezaaid worden; welke, als zij het Woord gehoord hebben, terstond hetzelve met vreugde ontvangen.","17":"En hebben geen wortel in zichzelven, maar zijn voor een tijd; daarna, als verdrukking of vervolging komt om des Woords wil, zo worden zij terstond geërgerd.","18":"En dezen zijn, die in de doornen bezaaid worden; *namelijk* degenen, die het Woord horen;","19":"En de zorgvuldigheden dezer wereld, en de verleiding des rijkdoms en de begeerlijkheden omtrent de andere dingen, inkomende, verstikken het Woord, en het wordt onvruchtbaar.","20":"En dezen zijn, die in de goede aarde bezaaid zijn, welke het Woord horen en aannemen, en dragen vruchten, het ene dertig-, en het andere zestig-, en het andere honderd *voud*.","21":"En Hij zeide tot hen: Komt ook de kaars, opdat zij onder de koornmaat of onder het bed gezet worde? *Is* *het* niet, opdat zij op den kandelaar gezet worde?","22":"Want er is niets verborgen, dat niet geopenbaard zal worden; en er is niets geschied, *om* verborgen *te* *zijn*, maar opdat het in het openbaar zou komen.","23":"Zo iemand oren heeft om te horen, die hore.","24":"En Hij zeide tot hen: Ziet, wat gij hoort. Met wat mate gij meet, zal u gemeten worden, en u, die hoort, zal *meer* toegelegd worden.","25":"Want zo wie heeft, dien zal gegeven worden; en wie niet heeft, van dien zal genomen worden, ook dat hij heeft.","26":"En Hij zeide: Alzo is het Koninkrijk Gods, gelijk of een mens het zaad in de aarde wierp;","27":"En *voorts* sliep, en opstond, nacht en dag; en het zaad uitsproot en lang werd, dat hij zelf niet wist, hoe.","28":"Want de aarde brengt van zelve vruchten voort: eerst het kruid, daarna de aar, daarna het volle koren in de aar.","29":"En als de vrucht *zich* voordoet, terstond zendt hij de sikkel daarin, omdat de oogst daar is.","30":"En Hij zeide: Waarbij zullen wij het Koninkrijk Gods vergelijken, of met wat gelijkenis zullen wij hetzelve vergelijken?","31":"*Namelijk* bij een mosterdzaad, hetwelk, wanneer het in de aarde gezaaid wordt, het minste is van al de zaden, die op de aarde *zijn*.","32":"En wanneer het gezaaid is, gaat het op, en wordt het meeste van al de moeskruiden, en maakt grote takken, alzo dat de vogelen des hemels onder zijn schaduw kunnen nestelen.","33":"En door vele zulke gelijkenissen sprak Hij tot hen het Woord, naardat zij het horen konden.","34":"En zonder gelijkenis sprak Hij tot hen niet; maar Hij verklaarde alles Zijn discipelen in het bijzonder.","35":"En op denzelfden dag, als het nu avond geworden was, zeide Hij tot hen: Laat ons overvaren aan de andere zijde.","36":"En zij, de schare gelaten hebbende, namen Hem mede, gelijk Hij in het schip was; en er waren nog andere scheepjes met Hem.","37":"En er werd een grote storm van wind, en de baren sloegen over in het schip, alzo dat het nu vol werd.","38":"En Hij was in het achterschip, slapende op een oorkussen; en zij wekten Hem op, en zeiden tot Hem: Meester, bekommert het U niet, dat wij vergaan?","39":"En Hij opgewekt zijnde, bestrafte den wind, en zeide tot de zee: Zwijg, wees stil! En de wind ging liggen, en er werd grote stilte.","40":"En Hij zeide tot hen: Wat zijt gij zo vreesachtig? Hebt gij geen geloof?","41":"En zij vreesden met grote vreze, en zeiden tot elkander: Wie is toch Deze, dat ook de wind en de zee Hem gehoorzaam zijn?"},"KJV":{"1":"And he began again to teach by the sea side: and there was gathered unto him a great multitude, so that he entered into a ship, and sat in the sea; and the whole multitude was by the sea on the land.","2":"And he taught them many things by parables, and said unto them in his doctrine,","3":"Hearken; Behold, there went out a sower to sow:","4":"And it came to pass, as he sowed, some fell by the way side, and the fowls of the air came and devoured it up.","5":"And some fell on stony ground, where it had not much earth; and immediately it sprang up, because it had no depth of earth:","6":"But when the sun was up, it was scorched; and because it had no root, it withered away.","7":"And some fell among thorns, and the thorns grew up, and choked it, and it yielded no fruit.","8":"And other fell on good ground, and did yield fruit that sprang up and increased; and brought forth, some thirty, and some sixty, and some an hundred.","9":"And he said unto them, He that hath ears to hear, let him hear.","10":"And when he was alone, they that were about him with the twelve asked of him the parable.","11":"And he said unto them, Unto you it is given to know the mystery of the kingdom of God: but unto them that are without, all *these* things are done in parables:","12":"That seeing they may see, and not perceive; and hearing they may hear, and not understand; lest at any time they should be converted, and *their* sins should be forgiven them.","13":"And he said unto them, Know ye not this parable? and how then will ye know all parables?","14":"The sower soweth the word.","15":"And these are they by the way side, where the word is sown; but when they have heard, Satan cometh immediately, and taketh away the word that was sown in their hearts.","16":"And these are they likewise which are sown on stony ground; who, when they have heard the word, immediately receive it with gladness;","17":"And have no root in themselves, and so endure but for a time: afterward, when affliction or persecution ariseth for the word's sake, immediately they are offended.","18":"And these are they which are sown among thorns; such as hear the word,","19":"And the cares of this world, and the deceitfulness of riches, and the lusts of other things entering in, choke the word, and it becometh unfruitful.","20":"And these are they which are sown on good ground; such as hear the word, and receive *it*, and bring forth fruit, some thirtyfold, some sixty, and some an hundred.","21":"And he said unto them, Is a candle brought to be put under a bushel, or under a bed? and not to be set on a candlestick?","22":"For there is nothing hid, which shall not be manifested; neither was any thing kept secret, but that it should come abroad.","23":"If any man have ears to hear, let him hear.","24":"And he said unto them, Take heed what ye hear: with what measure ye mete, it shall be measured to you: and unto you that hear shall more be given.","25":"For he that hath, to him shall be given: and he that hath not, from him shall be taken even that which he hath.","26":"And he said, So is the kingdom of God, as if a man should cast seed into the ground;","27":"And should sleep, and rise night and day, and the seed should spring and grow up, he knoweth not how.","28":"For the earth bringeth forth fruit of herself; first the blade, then the ear, after that the full corn in the ear.","29":"But when the fruit is brought forth, immediately he putteth in the sickle, because the harvest is come.","30":"And he said, Whereunto shall we liken the kingdom of God? or with what comparison shall we compare it?","31":"*It is* like a grain of mustard seed, which, when it is sown in the earth, is less than all the seeds that be in the earth:","32":"But when it is sown, it groweth up, and becometh greater than all herbs, and shooteth out great branches; so that the fowls of the air may lodge under the shadow of it.","33":"And with many such parables spake he the word unto them, as they were able to hear","34":"But without a parable spake he not unto them: and when they were alone, he expounded all things to his disciples.","35":"And the same day, when the even was come, he saith unto them, Let us pass over unto the other side.","36":"And when they had sent away the multitude, they took him even as he was in the ship. And there were also with him other little ships.","37":"And there ar (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
