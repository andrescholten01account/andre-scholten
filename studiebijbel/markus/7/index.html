","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En bij Hem verzamelden zich de Farizeeën, en sommigen van de Schriftgeleerden, die van Jeruzalem gekomen waren;","2":"En toen zij zagen dat sommigen van Zijn discipelen met onreine, dat wil zeggen, met ongewassen handen brood aten, berispten zij *hen*.","3":"Want de Farizeeën en alle Joden eten niet, tenzij zij *eerst* de handen dikwijls wassen, en zo de overleveringen van de ouden vasthouden.","4":"En wanneer zij van de markt *komen*, eten zij niet, tenzij zij *eerst* gewassen zijn. En er zijn nog vele andere dingen, die zij aangenomen hebben om vast te houden, *namelijk* het wassen van drinkbekers, en kannen, en koperen vaten, en bedden.","5":"Daarna vroegen de Farizeeën en de Schriftgeleerden Hem: Waarom leven Uw discipelen niet volgens de overlevering van de ouden, maar eten zij het brood met ongewassen handen?","6":"Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij.","7":"Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen *die* geboden *zijn* van mensen;","8":"Want u laat het gebod van God los, en houdt vast aan de overleveringen van mensen, *namelijk* het wassen van kannen en drinkbekers; en vele andere dergelijke dingen doet u.","9":"En Hij zei tegen hen: U doet *inderdaad* het gebod van God volledig teniet, opdat u uw overleveringen zou onderhouden.","10":"Want Mozes heeft gezegd: Eer uw vader en uw moeder; en: Wie vader of moeder vervloekt, die zal zeker sterven.","11":"Maar u zegt: Als iemand tegen zijn vader of moeder zegt: *Het is* korban (dat *wil zeggen*, een gave), wat u ook van mij zou kunnen krijgen, *dan bent u vrij*.","12":"laat u hem niet meer toe iets voor zijn vader of zijn moeder te doen;","13":"*Zo* maakt u Gods woord krachteloos door uw overlevering, die u heeft ingesteld; en vele dergelijke dingen doet u.","14":"En Hij riep de hele menigte tot Zich, en zei tegen hen: Hoor Mij allen, en versta.","15":"Er is niets van buiten de mens dat in hem ingaat, dat hem kan verontreinigen; maar de dingen die van hem uitgaan, die zijn het die de mens verontreinigen.","16":"Als iemand oren heeft om te horen, laat hij horen.","17":"En toen Hij van de menigte in huis gekomen was, vroegen Zijn discipelen Hem naar de gelijkenis.","18":"En Hij zei tegen hen: Bent ook u zo onwetend? Begrijpt u niet dat alles wat van buiten in de mens ingaat, hem niet kan verontreinigen?","19":"Want het gaat niet in zijn hart, maar in de buik, en gaat naar de heimelijke plaats uit, waardoor al het voedsel gereinigd wordt.","20":"En Hij zei: Wat uit de mens komt, dat verontreinigt de mens.","21":"Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden,","22":"diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid.","23":"Al deze boze dingen komen van binnenuit voort, en verontreinigen de mens.","24":"En Hij stond op van daar, en ging weg naar het gebied van Tyrus en Sidon; en Hij ging een huis binnen, en wilde niet dat iemand het wist, maar Hij kon *toch* niet verborgen blijven.","25":"Want een vrouw, van wie het dochtertje een onreine geest had, had over Hem gehoord, en kwam en viel neer aan Zijn voeten.","26":"Deze vrouw nu was een Griekse, afkomstig uit Syro-Fenicië; en zij smeekte Hem dat Hij de duivel uit haar dochter zou uitdrijven.","27":"Maar Jezus zei tegen haar: Laat eerst de kinderen verzadigd worden; want het is niet gepast om het brood van de kinderen te nemen, en het naar de hondjes te werpen.","28":"Maar zij antwoordde en zei tegen Hem: Ja, Heere, maar ook de hondjes eten onder de tafel van de kruimels van de kinderen.","29":"En Hij zei tegen haar: Vanwege dit woord, ga heen; de duivel is uit uw dochter weggegaan.","30":"En toen zij in haar huis kwam, vond zij dat de duivel weggegaan was, en de dochter op het bed liggend.","31":"En Hij ging weer weg van het gebied van Tyrus en Sidon, en kwam bij de zee van Galilea, midden door het gebied van Dekapolis.","32":"En zij brachten iemand bij Hem die doof was en zwaar sprak, en zij smeekten Hem dat Hij hem de hand zou opleggen.","33":"En Hij nam hem apart, weg van de menigte, en stak Zijn vingers in zijn oren, en nadat Hij gespuwd had, raakte Hij zijn tong aan;","34":"En Hij keek op naar de hemel, zuchtte, en zei tegen hem: Effatha! Dat is: word geopend!","35":"En meteen werden zijn oren geopend, en de band van zijn tong werd los, en hij sprak goed.","36":"En Hij gebood hun dat zij het niemand zouden zeggen; maar hoe meer Hij het hun ook gebood, des te meer verkondigden zij het.","37":"En zij waren bovenmate verbaasd, en zeiden: Hij heeft alles goed gedaan, en Hij maakt dat de doven horen, en de stommen spreken."},"SV":{"1":"En tot Hem vergaderden de Farizeën, en sommigen der Schriftgeleerden, die van Jeruzalem gekomen waren;","2":"En ziende, dat sommigen van Zijn discipelen met onreine, dat is, met ongewassen handen brood aten, berispten zij *hen*.","3":"Want de Farizeën en al de Joden eten niet, tenzij dat zij *eerst* de handen dikmaals wassen, houdende de inzettingen der ouden.","4":"En van de markt *komende*, eten zij niet, tenzij dat zij *eerst* gewassen zijn. En vele andere dingen zijn er, die zij aangenomen hebben te houden, *als* *namelijk* de wassingen der drinkbekers, en kannen, en koperen vaten, en bedden.","5":"Daarna vraagden Hem de Farizeën en de Schriftgeleerden: Waarom wandelen Uw discipelen niet naar de inzetting der ouden, maar eten het brood met ongewassen handen?","6":"Maar Hij antwoordde en zeide tot hen: Wel heeft Jesaja, van u, geveinsden, geprofeteerd, gelijk geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich verre van Mij.","7":"Doch tevergeefs eren zij Mij, lerende leringen, *die* geboden *zijn* der mensen;","8":"Want, nalatende het gebod Gods, houdt gij de inzettingen der mensen, *als* *namelijk* wassingen der kannen en drinkbekers; en andere dergelijke dingen doet gij vele.","9":"En Hij zeide tot hen: Gij doet *zeker* Gods gebod wel te niet, opdat gij uw inzettingen zoudt onderhouden.","10":"Want Mozes heeft gezegd: Eer uw vader en uw moeder; en: wie vader of moeder vloekt, die zal den dood sterven.","11":"Maar gijlieden zegt: Zo een mens tot vader of moeder zegt: *Het* *is* korban ( dat is *te* *zeggen*, een gave), zo wat u van mij zou kunnen ten nutte komen, *die* *voldoet*.","12":"En gij laat hem niet meer toe, iets aan zijn vader of zijn moeder te doen;","13":"Makende *alzo* Gods woord krachteloos door uw inzetting, die gij ingezet hebt; en vele dergelijke dingen doet gij.","14":"En tot Zich de ganse schare geroepen hebbende, zeide Hij tot hen: Hoort Mij allen en verstaat.","15":"Er is niets van buiten den mens in hem ingaande, hetwelk hem kan ontreinigen; maar de dingen, die van hem uitgaan, die zijn het, welke den mens ontreinigen.","16":"Zo iemand oren heeft om te horen, die hore.","17":"En toen Hij van de schare in huis gekomen was, vraagden Hem Zijn discipelen van de gelijkenis.","18":"En Hij zeide tot hen: Zijt ook gij alzo onwetende? Verstaat gij niet, dat al wat van buiten in den mens ingaat, hem niet kan ontreinigen?","19":"Want het gaat niet in zijn hart, maar in den buik, en gaat in de heimelijkheid uit, reinigende al de spijzen.","20":"En Hij zeide: Hetgeen uitgaat uit den mens, dat ontreinigt den mens.","21":"Want van binnen uit het hart der mensen komen voort kwade gedachten, overspelen, hoererijen, doodslagen,","22":"Dieverijen, gierigheden, boosheden, bedrog, ontuchtigheid, een boos oog, lastering, hovaardij, onverstand.","23":"Al deze boze dingen komen voort van binnen, en ontreinigen den mens.","24":"En van daar opstaande, ging Hij weg naar de landpalen van Tyrus en Sidon; en in een huis gegaan zijnde, wilde Hij niet , dat het iemand wist, en Hij kon *nochtans* niet verborgen zijn.","25":"Want een vrouw, welker dochtertje een onreinen geest had, van Hem gehoord hebbende, kwam en viel neder aan Zijn voeten.","26":"Deze nu was een Griekse vrouw, van geboorte uit Syro-fenicië; en zij bad Hem, dat Hij den duivel uitwierp uit haar dochter.","27":"Maar Jezus zeide tot haar: Laat eerst de kinderen verzadigd worden; want het is niet betamelijk dat men het brood der kinderen neme, en den hondekens *voor* werpe.","28":"Maar zij antwoordde en zeide tot Hem: Ja, Heere, doch ook de hondekens eten onder de tafel van de kruimkens der kinderen.","29":"En Hij zeide tot haar: Om dezes woords wil ga heen, de duivel is uit uw dochter uitgevaren.","30":"En als zij in haar huis kwam, vond zij, dat de duivel uitgevaren was, en de dochter liggende op het bed.","31":"En Hij wederom weggegaan zijnde van de landpalen van Tyrus en Sidon, kwam aan de zee van Galilea, door het midden der landpalen van Dekapolis.","32":"En zij brachten tot Hem een dove, die zwaarlijk sprak, en baden Hem, dat Hij de hand op hem legde.","33":"En hem van de schare alleen genomen hebbende, stak Hij Zijn vingeren in zijn oren, en gespogen hebbende, raakte Hij zijn tong aan;","34":"En opwaarts ziende naar den hemel, zuchtte Hij, en zeide tot hem: Effatha! dat is: wordt geopend!","35":"En terstond werden zijn oren geopend, en de band zijner tong werd los, en hij sprak recht.","36":"En Hij gebood hunlieden, dat zij het niemand zeggen zouden; maar wat Hij hun ook gebood, zo verkondigden zij het des te meer.","37":"En zij ontzetten zich bovenmate zeer, zeggende: Hij heeft alles wel gedaan, en Hij maakt, dat de doven horen, en de stommen spreken."},"KJV":{"1":"Then came together unto him the Pharisees, and certain of the scribes, which came from Jerusalem.","2":"And when they saw some of his disciples eat bread with defiled, that is to say, with unwashen, hands, they found fault.","3":"For the Pharisees, and all the Jews, except they wash *their* hands oft, eat not, holding the tradition of the elders.","4":"And *when they come* from the market, except they wash, they eat not. And many other things there be, which they have received to hold, *as* the washing of cups, and pots, brasen vessels, and of tables.","5":"Then the Pharisees and scribes asked him, Why walk not thy disciples according to the tradition of the elders, but eat bread with unwashen hands?","6":"He answered and said unto them, Well hath Esaias prophesied of you hypocrites, as it is written, This people honoureth me with *their* lips, but their heart is far from me.","7":"Howbeit in vain do they worship me, teaching *for* doctrines the commandments of men.","8":"For laying aside the commandment of God, ye hold the tradition of men, *as* the washing of pots and cups: and many other such like things ye do.","9":"And he said unto them, Full well ye reject the commandment of God, that ye may keep your own tradition.","10":"For Moses said, Honour thy father and thy mother; and, Whoso curseth father or mother, let him die the death:","11":"But ye say, If a man shall say to his father or mother, *It is* Corban, that is to say, a gift, by whatsoever thou mightest be profited by me;","12":"And ye suffer him no more to do ought for his father or his mother;","13":"Making the word of God of none effect through your tradition, which ye have delivered: and many such like things do ye.","14":"And when he had called all the people *unto him*, he said unto them, Hearken unto me every one *of you*, and understand:","15":"There is nothing from without a man, that entering into him can defile him: but the things which come out of him, those are they that defile the man.","16":"If any man have ears to hear, let him hear.","17":"And when he was entered into the house from the people, his disciples asked him concerning the parable.","18":"And he saith unto them, Are ye so without understanding also? Do ye not perceive, that whatsoever thing from without entereth into the man, *it* cannot defile him;","19":"Because it entereth not into his heart, but into the belly, and goeth out into the draught, purging all meats?","20":"And he said, That which cometh out of the man, that defileth the man.","21":"For from within, out of the heart of men, proceed evil thoughts, adulteries, fornications, murders,","22":"Thefts, covetousness, wickedness, deceit, lasciviousness, an evil eye, blasphemy, pride, foolishness:","23":"All these evil things come from within, and defile the man.","24":"And from thence he arose, and went into the borders of Tyre and Sidon, and entered into an house, and would have no man know *it*: but he could not be hid.","25":"For a *certain* woman, whose young daughter had an unclean spirit, heard of him, and came and fell at his feet:","26":"The woman was a Greek, a Syrophenician by nation; and she besought him that he would cast forth the devil out of her daughter.","27":"But Jesus said unto her, Let the children first be filled: for it is not meet to take the children's bread, and to cast *it* unto the dogs.","28":"And she answered and said unto him, Yes, Lord: yet the dogs under the table eat of the children's crumbs.","29":"And he said unto her, For this saying go thy way; the devil is gone out of thy daughter.","30":"And when she was come to her house, she found the devil gone out, and her daughter laid upon the bed.","31":"And again, departing from the coasts of Tyre and Sidon, he came unto the sea of Galilee, through the midst of the coasts of Decapolis.","32":"And they bring unto him one that was deaf, and had an impediment in his speech; and they beseech him to put his hand upon him.","33":"And he took him aside from the multitude, and put his fingers into his ears, and he spit, and touched his tongue;","34":"And looking up to heaven, he sighed, and saith unto him, Ephphatha, that is, Be opened.","35":"And straightway his ears were opened, and the string of his tongue was loosed, and he spake plain.","36":"And he charged them that they should tell no man: but the more he charged them, so much the more a great deal they published","37":"And were beyond measure astonished, saying, He hath done all things well: he maketh both the deaf to hear, and the dumb to speak."}},"tsk":{"1":[{"kopje":"de Farizeeën","refs":["Mark 3:22","Matt 15:1","Luk 5:17","Luk 11:53","Luk 11:54"]}],"2":[{"kopje":"onreine","refs":["Hand 10:14","Hand 10:15","Hand 10:28"]},{"kopje":"berispten zij hen","refs":["Dan 6:5","Dan 6:6","Matt 7:3-5","Matt 23:23-25"]}],"3":[{"kopje":"de overleveringen","refs":["Mark 7:7-10","Mark 7:13","Matt 15:2-6","Gal 1:14","Kol 2:8","Kol 2:21-23","1 Petr 1:18"]}],"4":[{"kopje":"tenzij","refs":["Job 9:30","Job 9:31","Ps 26:6","Jes 1:16","Jer 4:14","Matt 27:24","Luk 11:38","Luk 11:39","Joh 2:6","Joh 3:25","Hebr 9:10","Jak 4:8","1 Joh 1:7"]}],"6":[{"kopje":"Terecht","refs":["Jes 29:13","Matt 15:7-9","Hand 28:25"]},{"kopje":"huichelaars","refs":["Matt 23:13-15","Luk 11:39-44"]},{"kopje":"eert","refs":["Ezech 33:31","Hos 8:2","Hos 8:3","Joh 5:42","Joh 8:41","Joh 8:42","Joh 8:54","Joh 8:55","Joh 15:24","2 Tim 3:5"," (function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
