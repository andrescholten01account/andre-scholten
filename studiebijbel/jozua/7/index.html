"href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël.","2":"Toen Jozua mannen zond van Jericho naar Ai, dat bij Beth-aven ligt, ten oosten van Beth-el, sprak hij tot hen: Trek op en verken het land. Die mannen trokken op en verkenden Ai.","3":"Daarna keerden zij terug naar Jozua, en zeiden tegen hem: Laat niet het hele volk optrekken; laat er ongeveer tweeduizend man, of ongeveer drieduizend man, optrekken om Ai te verslaan; vermoei daar niet het hele volk mee, want zij zijn met weinigen.","4":"Zo trokken van het volk ongeveer drieduizend man daarheen op; en zij vluchtten voor de mannen van Ai.","5":"En de mannen van Ai versloegen van hen ongeveer zesendertig man, en achtervolgden hen vanaf de poort tot Schebarim toe, en versloegen hen bij de afgang. Toen versmolt het hart van het volk, en het werd tot water.","6":"Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd.","7":"En Jozua zei: Ach, Heere HEERE! Waarom hebt U dit volk ooit de Jordaan laten oversteken, om ons te geven in de hand van de Amorieten, om ons te vernietigen? Was het toch maar zo dat wij tevreden waren geweest en gebleven waren aan de overkant van de Jordaan!","8":"Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd?","9":"Als de Kanaänieten en alle inwoners van het land dit horen, zullen zij ons omsingelen, en onze naam van de aarde uitroeien; wat zult U dan doen voor Uw grote Naam?","10":"Toen zei de HEERE tegen Jozua: Sta op; waarom ligt u zo neer op uw gezicht?","11":"Israël heeft gezondigd; en zij hebben ook Mijn verbond, dat Ik hun geboden had, overtreden; en ook hebben zij van het verbannene genomen, en ook gestolen, en ook gelogen, en hebben het ook onder hun eigen spullen gelegd.","12":"Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt.","13":"Sta op, heilig het volk, en zeg: Heilig uzelf tegen morgen; want zo zegt de HEERE, de God van Israël: Er is een ban in uw midden, Israël! U zult niet kunnen standhouden voor het aangezicht van uw vijanden, totdat u de ban uit uw midden wegdoet.","14":"U zult dan in de morgen aankomen naar uw stammen; en het zal gebeuren: de stam die de HEERE aanwijst, die zal aankomen naar de geslachten, en welk geslacht de HEERE aanwijst, dat zal aankomen bij huisgezinnen, en welk huisgezin de HEERE aanwijst, dat zal aankomen man voor man.","15":"En het zal gebeuren: wie aangewezen wordt met de ban, die zal met vuur verbrand worden, hij en alles wat hij heeft; omdat hij het verbond van de HEERE overtreden heeft, en omdat hij dwaasheid in Israël gedaan heeft.","16":"Toen stond Jozua 's morgens vroeg op, en liet Israël aankomen naar zijn stammen; en de stam van Juda werd aangewezen.","17":"Toen hij het geslacht van Juda liet aankomen, wees hij het geslacht van Zarchi aan. Toen hij het geslacht van Zarchi liet aankomen, man voor man, werd Zabdi aangewezen;","18":"Diens huisgezin liet hij aankomen, man voor man, en Achan werd aangewezen, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda.","19":"Toen zei Jozua tegen Achan: Mijn zoon! Geef toch de HEERE, de God van Israël, de eer, en leg voor Hem een belijdenis af; en vertel mij toch wat u gedaan hebt, verberg het niet voor mij.","20":"Achan antwoordde Jozua, en zei: Voorwaar, ik heb tegen de HEERE, de God van Israël, gezondigd, en heb zo en zo gedaan.","21":"Want ik zag onder de buit een mooi, sierlijk Babylonisch overkleed, en tweehonderd sikkelen van het zilver, en een gouden staaf, met een gewicht van vijftig sikkelen; en ik kreeg er lust naar, en ik nam ze; en zie, ze zijn verborgen in de aarde, midden in mijn tent, en het zilver daaronder.","22":"Toen zond Jozua boden weg, die naar de tent liepen; en zie, het lag verborgen in zijn tent, en het zilver daaronder.","23":"Zij namen die dingen dan uit het midden van de tent, en brachten ze naar Jozua en naar alle kinderen van Israël; en zij spreidden ze uit voor het aangezicht van de HEERE.","24":"Toen nam Jozua, en heel Israël met hem, Achan, de zoon van Zerah, en het zilver, en het sierlijke overkleed, en de gouden staaf, en zijn zonen, en zijn dochters, en zijn ossen, en zijn ezels, en zijn vee, en zijn tent, en alles wat hij had; en zij brachten ze naar het dal Achor.","25":"En Jozua zei: Hoe hebt u ons in het ongeluk gestort? De HEERE zal u op deze dag in het ongeluk storten! En heel Israël stenigde hem met stenen, en zij verbrandden hen met vuur, en overwierpen hen met stenen.","26":"En zij richtten over hem een grote steenhoop op, die er tot op deze dag nog is. Zo keerde de HEERE zich af van de gloed van Zijn toorn. Daarom noemde men de naam van die plaats het dal van Achor, tot op deze dag toe."},"SV":{"1":"Maar de kinderen Israëls overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, den zoon van Zabdi, den zoon van Zerah, uit den stam van Juda, nam van het verbannene. Toen ontstak de toorn des HEEREN tegen de kinderen Israëls.","2":"Als Jozua mannen zond van Jericho naar Ai, dat bij Beth-aven ligt, aan het oosten van Beth-el, zo sprak hij tot hen, zeggende: Trekt opwaarts en bespiedt het land. Die mannen nu trokken op en bespiedden Ai.","3":"Daarna keerden zij weder naar Jozua, en zeiden tot hem: Dat het ganse volk niet optrekke, dat er omtrent twee duizend mannen, of omtrent drie duizend mannen optrekken, om Ai te slaan; vermoei daarheen al het volk niet; want zij zijn weinige.","4":"Alzo trokken derwaarts op van het volk omtrent drie duizend man; dewelke vloden voor het aangezicht der mannen van Ai.","5":"En de mannen van Ai sloegen van dezelven omtrent zes en dertig man, en vervolgden hen *van* voor de poort tot Schebarim toe, en sloegen hen in een afgang. Toen versmolt het hart des volks, en het werd tot water.","6":"Toen verscheurde Jozua zijn klederen, en viel op zijn aangezicht ter aarde, voor de ark des HEEREN, tot den avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd.","7":"En Jozua zeide: Ach, Heere HEERE! waarom hebt Gij dit volk door de Jordaan ooit doen gaan, om ons te geven in de hand der Amorieten, om ons te verderven? Och, dat wij toch tevreden geweest en gebleven waren aan gene zijde van de Jordaan!","8":"Och, Heere! wat zal ik zeggen, nademaal dat Israël voor het aangezicht zijner vijanden den nek gekeerd heeft?","9":"Als het de Kanaänieten, en alle inwoners des lands horen zullen, zo zullen zij ons omsingelen, en onzen naam uitroeien van de aarde; wat zult Gij dan Uw groten Naam doen?","10":"Toen zeide de HEERE tot Jozua: Sta op; waarom ligt gij dus neder op uw aangezicht?","11":"Israël heeft gezondigd; en zij hebben ook Mijn verbond, hetwelk Ik hun geboden had, overtreden; en ook hebben zij van het verbannene genomen, en ook gestolen, en ook gelogen, en hebben het ook onder hun gereedschap gelegd.","12":"Daarom zullen de kinderen Israëls niet kunnen bestaan voor het aangezicht hunner vijanden; zij zullen den nek voor het aangezicht hunner vijanden keren; want zij zijn in den ban. Ik zal voortaan niet meer met ulieden zijn, tenzij gij den ban uit het midden van ulieden verdelgt.","13":"Sta op, heilig het volk, en zeg: Heiligt u tegen morgen; want alzo zegt de HEERE, de God van Israël: Er is een ban in het midden van u, Israël! gij zult niet kunnen bestaan voor het aangezicht uwer vijanden, totdat gij den ban wegdoet uit het midden van u.","14":"Gij zult dan in den morgenstond aankomen naar uw stammen; en het zal geschieden, de stam, welken de HEERE geraakt zal hebben, die zal aankomen naar de geslachten, en welk geslacht de HEERE geraakt zal hebben, dat zal aankomen bij huisgezinnen, en welk huisgezin de HEERE geraakt zal hebben, dat zal aankomen man voor man.","15":"En het zal geschieden, die geraakt zal worden met den ban, die zal met vuur verbrand worden, hij en al wat hij heeft; omdat hij het verbond des HEEREN overtreden heeft, en omdat hij dwaasheid in Israël gedaan heeft.","16":"Toen maakte zich Jozua des morgens vroeg op, en deed Israël aankomen naar zijn stammen; en de stam van Juda werd geraakt.","17":"Als hij het geslacht van Juda deed aankomen, zo raakte hij het geslacht van Zarchi. Toen hij het geslacht van Zarchi deed aankomen, man voor man, zo werd Zabdi geraakt;","18":"Welks huisgezin als hij deed aankomen, man voor man, zo werd Achan geraakt, de zoon van Charmi, den zoon van Zabdi, den zoon van Zerah, uit den stam van Juda.","19":"Toen zeide Jozua tot Achan: Mijn zoon! Geef toch den HEERE, den God van Israël, de eer, en doe voor Hem belijdenis; en geef mij toch te kennen, wat gij gedaan hebt, verberg het voor mij niet.","20":"Achan nu antwoordde Jozua, en zeide: Voorwaar, ik heb tegen den HEERE, den God Israëls, gezondigd, en heb alzo en alzo gedaan.","21":"Want ik zag onder den roof een schoon sierlijk Babylonisch overkleed, en tweehonderd sikkelen zilvers, en een gouden tong, welker gewicht was vijftig sikkelen; en ik kreeg lust daartoe, en ik nam ze; en zie, zij zijn verborgen in de aarde, in het midden mijner tent, en het zilver daaronder.","22":"Toen zond Jozua boden henen, die tot de tent liepen; en ziet, het lag verborgen in zijn tent, en het zilver daaronder.","23":"Zij dan namen die dingen uit het midden der tent, en zij brachten ze tot Jozua en tot al de kinderen Israëls; en zij stortten ze uit voor het aangezicht des HEEREN.","24":"Toen nam Jozua, en gans Israël met hem, Achan, den zoon van Zerah, en het zilver, en het sierlijk overkleed, en de gouden tong, en zijn zonen, en zijn dochteren, en zijn ossen, en zijn ezelen, en zijn vee, en zijn tent, en alles wat hij had; en zij voerden ze naar het dal Achor.","25":"En Jozua zeide: Hoe hebt gij ons beroerd? De HEERE zal u beroeren te dezen dage! En gans Israël stenigde hem met stenen, en zij verbrandden hen met vuur, en zij overwierpen hen met stenen.","26":"En zij richtten over een groten steenhoop, zijnde tot op dezen dag. Alzo keerde zich de HEERE van de hittigheid Zijns toorns. Daarom noemde men den naam dier plaats het dal van Achor, tot dezen dag toe."},"KJV":{"1":"But the children of Israel committed a trespass in the accursed thing: for Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, took of the accursed thing: and the anger of the LORD was kindled against the children of Israel.","2":"And Joshua sent men from Jericho to Ai, which *is* beside Bethaven, on the east side of Bethel, and spake unto them, saying, Go up and view the country. And the men went up and viewed Ai.","3":"And they returned to Joshua, and said unto him, Let not all the people go up; but let about two or three thousand men go up and smite Ai; *and* make not all the people to labour thither; for they *are but* few.","4":"So there went up thither of the people about three thousand men: and they fled before the men of Ai.","5":"And the men of Ai smote of them about thirty and six men: for they chased them *from* before the gate *even* unto Shebarim, and smote them in the going down: wherefore the hearts of the people melted, and became as water.","6":"And Joshua rent his clothes, and fell to the earth upon his face before the ark of the LORD until the eventide, he and the elders of Israel, and put dust upon their heads.","7":"And Joshua said, Alas, O Lord GOD, wherefore hast thou at all brought this people over Jordan, to deliver us into the hand of the Amorites, to destroy us? would to God we had been content, and dwelt on the other side Jordan!","8":"O Lord, what shall I say, when Israel turneth their backs before their enemies!","9":"For the Canaanites and all the inhabitants of the land shall hear *of it*, and shall environ us round, and cut off our name from the earth: and what wilt thou do unto thy great name?","10":"And the LORD said unto Joshua, Get thee up; wherefore liest thou thus upon thy face?","11":"Israel hath sinned, and they have also transgressed my covenant which I commanded them: for they have even taken of the accursed thing, and have also stolen, and dissembled also, and they have put *it* even among their own stuff.","12":"Therefore the children of Israel could not stand before their enemies, *but* turned *their* backs before their enemies, because they were accursed: neither will I be with you any more, except ye destroy the accursed from among","13":"Up, sanctify the people, and say, Sanctify yourselves against to morrow: for thus saith the LORD God of Israel, *There is* an accursed thing in the midst of thee, O Israel: thou canst not stand before thine enemies, until ye take away the accursed thing from among","14":"In the morning therefore ye shall be brought according to your tribes: and it shall be, *that* the tribe which the LORD taketh shall come according to the families *thereof*; and the family which the LORD shall take shall come by households; and the household which the LORD shall take shall come man by man.","15":"And it shall be, *that* he that is taken with the accursed thing shall be burnt with fire, he and all that he hath: because he hath transgressed the covenant of the LORD, and because he hath wrought folly in Israel.","16":"So Joshua rose up early in the morning, and brought Israel by their tribes; and the tribe of Judah was taken:","17":"And he brought the family of Judah; and he took the family of the Zarhites: and he brought the family of the Zarhites man by man; and Zabdi was taken:","18":"And he brought his household man by man; and Achan, the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Judah, was taken.","19":"And Joshua said unto Achan, My son, give, I pray thee, glory to the LORD God of Israel, and make confession unto him; and tell me now what thou hast done; hide","20":"And Achan answered Joshua, and said, Indeed I have sinned against the LORD God of Israel, and thus and thus have I done:","21":"When I saw among the spoils a goodly Babylonish garment, and two hundred shekels of silver, and a wedge of gold of fifty shekels weight, then I coveted them, and took them; and, behold, they *are* hid in the earth in the midst of my tent, and the silver","22":"So Joshua sent messengers, and they ran unto the tent; and, behold, *it was* hid in his tent, and the silver","23":"And they took them out of the midst of the tent, and de=\"H4549\">melted,</span> and became as water.","6":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> his <span class=\"wl wl-kjv\" data-code=\"H8071\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> upon his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> until the <span class=\"wl wl-kjv\" data-code=\"H6153\">eventide,</span> he and the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">put</span> <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> upon their heads.","7":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Alas, <span class=\"wl wl-kjv\" data-code=\"H162\">O</span> <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> wherefore hast thou at <span class=\"wl wl-kjv\" data-code=\"H5674\">all</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">brought</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> us into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> to <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> us? would to <span class=\"wl wl-kjv\" data-code=\"H3863\">God</span> we had been <span class=\"wl wl-kjv\" data-code=\"H2974\">content,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> on the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> Jordan!","8":"<span class=\"wl wl-kjv\" data-code=\"H994\">O</span> <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> what shall I <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">when</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2015\">turneth</span> their <span class=\"wl wl-kjv\" data-code=\"H6203\">backs</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> their enemies!","9":"For the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> of it, and shall environ us <span class=\"wl wl-kjv\" data-code=\"H5437\">round,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> our <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> and what wilt thou <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> name?","10":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> Get thee <span class=\"wl wl-kjv\" data-code=\"H6965\">up;</span> wherefore <span class=\"wl wl-kjv\" data-code=\"H5307\">liest</span> thou thus upon thy face?","11":"<span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> hath <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned,</span> and they have also <span class=\"wl wl-kjv\" data-code=\"H5674\">transgressed</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> which I <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them: for they have even <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> of the accursed <span class=\"wl wl-kjv\" data-code=\"H2764\">thing,</span> and have also <span class=\"wl wl-kjv\" data-code=\"H1589\">stolen,</span> and <span class=\"wl wl-kjv\" data-code=\"H3584\">dissembled</span> also, and they have <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> it even among their own stuff.","12":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H6965\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> but <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> their <span class=\"wl wl-kjv\" data-code=\"H6203\">backs</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> because they were <span class=\"wl wl-kjv\" data-code=\"H2764\">accursed:</span> neither will I be with you any <span class=\"wl wl-kjv\" data-code=\"H3254\">more,</span> <span class=\"wl wl-kjv\" data-code=\"H3808\">except</span> ye <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H2764\">accursed</span> from among","13":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Up,</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">Sanctify</span> yourselves against to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow:</span> for thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> There is an accursed <span class=\"wl wl-kjv\" data-code=\"H2764\">thing</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of thee, O <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> thou <span class=\"wl wl-kjv\" data-code=\"H3201\">canst</span> not <span class=\"wl wl-kjv\" data-code=\"H6965\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> until ye take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the accursed <span class=\"wl wl-kjv\" data-code=\"H2764\">thing</span> from among","14":"In the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> therefore ye shall be <span class=\"wl wl-kjv\" data-code=\"H7126\">brought</span> according to your <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes:</span> and it shall be, that the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3920\">taketh</span> shall <span class=\"wl wl-kjv\" data-code=\"H7126\">come</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> thereof; and the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> shall <span class=\"wl wl-kjv\" data-code=\"H7126\">come</span> by <span class=\"wl wl-kjv\" data-code=\"H1004\">households;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">household</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> shall <span class=\"wl wl-kjv\" data-code=\"H7126\">come</span> <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> by man.","15":"And it shall be, that he that is <span class=\"wl wl-kjv\" data-code=\"H3920\">taken</span> with the accursed <span class=\"wl wl-kjv\" data-code=\"H2764\">thing</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> he and all that he hath: because he hath <span class=\"wl wl-kjv\" data-code=\"H5674\">transgressed</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and because he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> <span class=\"wl wl-kjv\" data-code=\"H5039\">folly</span> in Israel.","16":"So <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H7126\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> by their <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes;</span> and the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> was taken:","17":"And he <span class=\"wl wl-kjv\" data-code=\"H7126\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> and he <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H2227\">Zarhites:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7126\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H2227\">Zarhites</span> <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> by <span class=\"wl wl-kjv\" data-code=\"H1397\">man;</span> and <span class=\"wl wl-kjv\" data-code=\"H2067\">Zabdi</span> was taken:","18":"And he <span class=\"wl wl-kjv\" data-code=\"H7126\">brought</span> his <span class=\"wl wl-kjv\" data-code=\"H1004\">household</span> <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> by <span class=\"wl wl-kjv\" data-code=\"H1397\">man;</span> and <span class=\"wl wl-kjv\" data-code=\"H5912\">Achan,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3756\">Carmi,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2067\">Zabdi,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2226\">Zerah,</span> of the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> was taken.","19":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H5912\">Achan,</span> My <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">give,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> <span class=\"wl wl-kjv\" data-code=\"H8426\">confession</span> unto him; and <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me now what thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done;</span> hide","20":"And <span class=\"wl wl-kjv\" data-code=\"H5912\">Achan</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H546\">Indeed</span> I have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and thus and thus have I done:","21":"When I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> among the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoils</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">goodly</span> <span class=\"wl wl-kjv\" data-code=\"H8152\">Babylonish</span> <span class=\"wl wl-kjv\" data-code=\"H155\">garment,</span> and two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H3956\">wedge</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> of <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> <span class=\"wl wl-kjv\" data-code=\"H4948\">weight,</span> then I <span class=\"wl wl-kjv\" data-code=\"H2530\">coveted</span> them, and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> them; and, behold, they are <span class=\"wl wl-kjv\" data-code=\"H2934\">hid</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of my <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and the silver","22":"So <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers,</span> and they <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> unto the <span class=\"wl wl-kjv\" data-code=\"H168\">tent;</span> and, behold, it was <span class=\"wl wl-kjv\" data-code=\"H2934\">hid</span> in his <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and the silver","23":"And they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> them out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> and unto all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and laid them <span class=\"wl wl-kjv\" data-code=\"H3332\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD.","24":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with him, <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H5912\">Achan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2226\">Zerah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and the <span class=\"wl wl-kjv\" data-code=\"H155\">garment,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3956\">wedge</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7794\">oxen,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2543\">asses,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and his <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and all that he had: and they <span class=\"wl wl-kjv\" data-code=\"H5927\">br {"catchword":"man voor man,","tekst":"Hebreeuws, bij mannen; dat is, naar de huisgezinnen der vaderen, niet hoofd bij hoofd, iedereen, gelijk vs.18."}],"19":[{"catchword":"Geef toch den HEERE,","tekst":"Hebreeuws, stel. Toen Achan zijn begane misdaad beleed, zo gaf hij God de eer, dat Hij hem recht getroffen had."}],"20":[{"catchword":"alzo en alzo gedaan","tekst":"Te weten, gelijk de Heere gesproken heeft, vs.11."}],"21":[{"catchword":"schoon","tekst":"Hebreeuws, goed"},{"catchword":"Babylonisch overkleed,","tekst":"Hebreeuws, een mantel van Sinear. Zie Gen 10:10."},{"catchword":"tweehonderd sikkelen zilvers,","tekst":"Dit is de helft van den prijs, waarvoor Abraham de dubbele spelonk van Efron gekocht heeft, doende de twee honderd gemene sikkelen vijftig rijksdaalders."},{"catchword":"tong,","tekst":"Een langwerpig en breedachtig stuk goud, hebbende het fatsoen van een tong, het zij wat het ook moge geweest zijn."},{"catchword":"daaronder","tekst":"Te weten, onder den Babylonischen mantel."}],"22":[{"catchword":"het lag verborgen","tekst":"Te weten, het goed. Of hij, te weten, de mantel."}],"23":[{"catchword":"voor het aangezicht des HEEREN","tekst":"Dat is, voor de tent der samenkomst, waar de ark, een heilig teken der tegenwoordigheid des Heeren was; want deze ganse handeling is in een algemene samenkomst des volks geschied."}],"24":[{"catchword":"den zoon van Zerah,","tekst":"Dat is, neEf. Zie vs.1."},{"catchword":"het dal Achor","tekst":"Dat is, het dal der beroerte; naderhand alzo genaamd, vanwege deze geschiedenis, vs.26."}],"25":[{"catchword":"beroerd?","tekst":"Van het woord beroeren, zie 1Ki 18:17."},{"catchword":"hem met stenen,","tekst":"Te weten, Achan; versta hierbij ook al de zijnen, gelijk vs.26."}],"26":[{"catchword":"noemde men den naam dier plaats","tekst":"Anders, noemde; te weten, Jozua."},{"catchword":"het dal van Achor,","tekst":"Dat is, het dal der beroerte; omdat het ganse volk van Israël hier beroerd en bedroefd was geworden vanwege Achans diefstal, en omdat hij ook door deze schrikkelijke straf daarin was beroerd, vs.25."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But the children of Israel [Understand one of the children of Israel , viz. Achan. Compare Judges 12. on verse 7.] transgressed , by transgressing with the banned (thing :) [ viz. against the Law of God , touching the banned things ] for Achan [ 1 Chron. 2.7. he is called Achar , i.e. the troubler ]the son of Charmi , the son of Zabdi ; [ he is also called Simri, 1 Chron.2.6.] the son of Zerah, of the Tribe of Juda, took of the banned (thing) [see above chap.6.18,19.] then the anger of the LORD kindled against the children of Israel . [ for one mans sinne God is incensed against the whole Congregation of the Israelites. See Jos. 22,20.]"}],"2":[{"catchword":null,"tekst":"When Josua sent men fron Jericho to Ai, [ Ai was seated upon a hill three leagues westward from Jericho , , in that part of the Land of Canaan , which fell to the Tribe of Benjamin . There was likewise another Ai, in the Tribe of Gad , which the Amminites had taken , against which Jeremy prophesieth , chap.49.3.] which lieth by Beth-aven , on the East of Bethel , he spake unto them , saying, Go up, and spie out the land : so these men went up and spied out Ai."}],"3":[{"catchword":null,"tekst":"Afterward they returned unto Josua , and said unto him , Let not all the people go up , let about two thousand men, or about three thousand men go up to smite Ai, do not tire all the people thither , for they are few ."}],"4":[{"catchword":null,"tekst":"So there went up thither from the people about three thousand men , which fled before the face of the men at Ai."}],"5":[{"catchword":null,"tekst":"And the men at Ai smote of them about six and thirtie men , and pursued them ( from ) before the gate unto Schebarm , [ This place was first so called from this defeat of the Israelites . Sheborum signifieth breakings , or, shiverings , because the Israelites Army was there broken and hewen asunder ] and smote them in a descent : then the heart of the people melted , and it became water ."}],"6":[{"catchword":null,"tekst":"Then Josua rent his clothes [ In token of great grief and anguish of heart , see Gen 37:29.] and fell to the earth upon his face before the Ark of the LORD , untill the evening , he and the eldest of Israel ; and they cast dust upon their head .[ this the Israelites were wont to doe in token of sorrow and astonishment , 1 Sam . 4.12. and 2 Sam 13.19. Jon. 3.6. Mic 1:10.]"}],"7":[{"catchword":null,"tekst":"And Josua said , Ah, Lord LORD wherefore hast thou ever made this people go through Jordan , [ Heb. passing made pass . Here Josua seemeth somewhat to start aside through humane fraitie by reason of the damage sustained ] to deliver us into the hands of the Amorites ; [ understand here under all the seven Nations that possessed the land which the LORD had promised to give unto the Israelites ] to destroy us ? [oth. that we had been content , and remained on the other side of Jordan .]"}],"8":[{"catchword":null,"tekst":"O LORD ! [ Heb. in me Lord , see Gen 43.on v.20.] what shall I say, seeing that israel hath turned the neck before the face of his enemies ?"}],"9":[{"catchword":null,"tekst":"When the Canaanites and all the Inhabitants of the Land shall hear it , they will surround us and destroy our name from the earth : What wilt thou then do to thy great Name ? [ As if he had said , how wilt thou preserve thy great and glorious Name, when the Canaanites shall say that thou hast not now any more the power to defend us , and to subdue them , as thou in times past hast done ]"}],"10":[{"catchword":null,"tekst":"Then the LORD said unto Josua , Arise : wherefore liest thou thus down upon thy face ? [ Heb. properly art thou falling down .]"}],"11":[{"catchword":null,"tekst":"Israel hath sinned [ i.e. one among the Israelites , viz Achan ] and have likewise transgressed my covenant , [ i.e. my commandment , whereunto they have obliged themselves in the covenant , to observe the same . See above chap.6.18.] which I commanded them : and they have also taken of the banned (thing ,) [ which I commanded to be banned , chap. 6.24. ]and likewise stollen , [viz. that which ought to have been brought into the Treasury of the Lord , above chap.6.19. ] and likewise lied [ Oth. denyed , disavouched ] and have likewise put it among their stuff ."}],"12":[{"catchword":null,"tekst":"Therefore the children of Israel shall not be able to subsist before the face of their enemies , they shall turn the neck before the face of their enemies , for they are in the ban [ i.e. they are fallen into the punishment or judgement which I intended to bring those banned nations , because they have transgressesd in the banned thing ]I will henceforward be no more with you , unlesse you put away the ban [ i.e. him that hath deserved to be banned , because he hath transgressed in the thing . So also below 13.13.] from the midst of you."}],"13":[{"catchword":null,"tekst":"Arise, hallow the people , [ i.e. cause the people to purifie themselves unto holinesse , by the ceremonies appointed by God , Exo 19:10.] and say, hallow your selves against to morrow : for thus saith the God of Israel , here is a ban in the midst of thee Israel , thou shalt not be able to subsist before the face of thine enemies , untill you put away the ban out of the midst of you."}],"14":[{"catchword":null,"tekst":"In the morning therefore shall ye come on according to your tribes : and it shall come to passe , that the tribe whom the LORDshall have hit [ Heb. caught or taken , viz. by the lot, which the LORD directeth or disposeth , Prov. 16.33. See 1 Sam.14.41. Jon.1.7.] the same shall come on according to the families , and the family which the LORD shall have hit , the same shall come on by housholds, [ Heb. houses ] and the houshold which the LORD shall have hit , the same shall come on man to man .[Heb. with men.]"}],"15":[{"catchword":null,"tekst":"And it shall come to passe , that whosoever shall be hit with the ban , [ i.e. with the banned thing , or stolen goods ] the same shall be burned with fire , [viz.after that he shal have been stoned to death . See Num 15:30,35.] he, and all that he hath : because he hath transgressed the covenant of the LORD , and because he hath committed folly in In Israel .[i.e. notorious crime , or abomination .Thus the rape of Dina was called , Gen. 34.7. and the abusing of the Levites wife , Exo 20:6.]"}],"16":[{"catchword":null,"tekst":"Then Josua rose up early in the morning , and caised Israel to come on according to their tribes , and the tribe of Judah was hit ."}],"17":[{"catchword":null,"tekst":"Then he caused the family [i.e. the Tribe , or each family thereof ] of Juda to come on , he hit the family of Zarhi : When he caused the family of Zarhi to come on man for man , [ Heb. by men ; i.e. according to the housholds of the fathers , head by head, every one as v.18.] Zabdi was hit ."}],"18":[{"catchword":null,"tekst":"Whose houshold when he caused to come on man for man, then was hit Achan the son of Carmi, the son of Zabdi, the son of Zerah, of the tribe of Juda."}],"19":[{"catchword":null,"tekst":"Then Josua said unto Achan , My son , Give , ( I pray) the honnor unto the LORD, the God of Israel , and make confession before him : [ Heb. put etc. When Achan confessed his trespasse committed, he gave the honor to God , that he had hit him right .] and tell me ( I pray ) what thou hast done , and hide it not before me."}],"20":[{"catchword":null,"tekst":"Now Achan answered Josua , and said , Verily I have sinned against the LORD , the God of Israel, and have done thus and thus . [ viz. as the LORD hath spoken , v.11.]"}],"21":[{"catchword":null,"tekst":"And I saw among the prey a beautifull [ Heb. good ]stately Babylonish upper garment , [Heb. a cloak of Sineor . See Gen.10.v.10.] and two hundred shekels of Silver , [ this is the moiety of the price, for which Abraham bought the double cave of Ephron, 200 . common shekels making 50 Ryx-dollers ] and a golden tongue ( or wedge ) [ a long and broad piece of gold , in fashion of a tongue , whatever it was ] whose weight was fifty shekels , and I coveted it , and took it , and behold , they are hid in the earth in the midst of my tent , and the silver under it. [ viz. under the Babylonish garment.]"}],"23":[{"catchword":null,"tekst":"They took those things out of the midst of the tent , and they brought them unto Josua , and to all the children of Israel , and poured them out before the face of the LORD , [ i.e. before the Tent of the congregation where the ark ( which was the holy place of Gods presence ) was : for this whole consecration was made in a generall assembly of the people .]"}],"24":[{"catchword":null,"tekst":"Then Josua , and all Israel with him , took Achan ,the son of Zerah , [ i.e. great grand-childe. See v.1.] and the silver , and the stately upper garment , and the golden tongue , and his sons and his daughters , and his oxen and his asses , and all that he had , and carried them unto the valley of Achor . [ i.e. the valley of trouble , afterwards so called , from this history v.26. ]"}],"25":[{"catchword":null,"tekst":"And josua said , thou hast troubled us : [ Of the word to trouble , see 1 Kings 18. on v. 17.] the LORD shall this day trouble thee : and all Israel stoned him [ viz. Achan ; understand hereby also all his , as v.26 ] with stones , and they burned them with fire , and they cast them all over with stones ."}],"26":[{"catchword":null,"tekst":"And they raised over him a great heap of stones being unto this day : thus the LORD turned himself from the heat of his wrath : therefore they called [ Oth. he called , viz. Josua ] the name of the place , The valley of Achor . [ i.e. the valley of trouble , because all the people of Israel were here troubled and grieved for Achans theft : and because he also was therein troubled by a terrible judgement (function bouwHfdnav() {

  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +

  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
