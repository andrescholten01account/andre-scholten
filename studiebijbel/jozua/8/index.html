Abraham zei tegen hem: Zij hebben Mozes en de profeten, laat zij die horen.", "Jer 22:29": "O land, land, land! hoor het woord van de HEERE!", "Ps 71:13": "Laat hen beschaamd worden, laat hen verteerd worden, die mijn ziel tegenstaan; laat hen met smaad en schande overdekt worden, die mijn kwaad zoeken.", "2 Kor 8:10": "En ik geef in dezen mijn mening; want dit is nuttig voor u, u die niet alleen het doen, maar ook het willen al een jaar geleden begonnen bent.", "Ps 9:17": "De HEERE is bekend geworden; Hij heeft recht gedaan; de goddeloze is verstrikt in het werk van zijn handen! Higgajon, Sela.", "Deut 27:1-26": "En Mozes gebood, samen met de oudsten van Israël, het volk: Houd al deze geboden die ik u vandaag gebied. Het zal dan gebeuren, op de dag dat u de Jordaan overgestoken bent naar het land dat de HEERE, uw God, u geven zal, dat u grote stenen zult oprichten en ze met kalk bestrijken; en u zult daarop alle woorden van deze wet schrijven, wanneer u overgestoken bent; opdat u komt in het land dat de HEERE, uw God, u geven zal, een land dat overvloeit van melk en honing, zoals de HEERE, de God van uw vaderen, u beloofd heeft.", "Spr 6:21": "Bind ze voortdurend aan uw hart, hecht ze aan uw hals.", "Klaagl 1:22": "Thau. Laat al hun kwaad voor Uw aangezicht komen, en doe hun, zoals Gij mij gedaan hebt vanwege al mijn overtredingen; want mijn zuchtingen zijn veel, en mijn hart is mat.", "Matt 20:15": "Of mag ik met het mijne niet doen wat ik wil? Of is uw oog boos, omdat ik goed ben?", "Ex 4:29-31": "Toen ging Mozes en Aäron, en zij verzamelden al de oudsten van de kinderen van Israël. En Aäron sprak al de woorden, die de HEERE tot Mozes gesproken had; en hij deed de tekenen voor de ogen van het volk. En het volk geloofde, en zij hoorden, dat de HEERE de kinderen van Israël bezocht had, en dat Hij hun verdrukking gezien had, en zij bogen hun hoofden, en aanbaden.", "Ps 119:70": "Hun hart is vet als smeer; maar ik heb vermaak in Uw wet.", "Matt 20:1-16": "Want het Koninkrijk der hemelen is gelijk aan een heer des huizes, die 's morgens vroeg uitging om arbeiders te huren voor zijn wijngaard. En toen hij met de arbeiders overeengekomen was voor een penning per dag, stuurde hij hen naar zijn wijngaard. En hij ging uit, omtrent het derde uur, en zag anderen werkloos staan op de markt.", "Gen 40:19-22": "Binnen nog drie dagen zal Farao uw hoofd van u verheffen, en hij zal u aan een paal hangen, en het gevogelte zal uw vlees van u eten. En het gebeurde op de derde dag, de dag van Farao's geboorte, dat hij voor al zijn dienaren een maaltijd maakte; en hij verhief het hoofd van de leider van de schenkers, en het hoofd van de leider van de bakkers, te midden van zijn dienaren. En hij liet de leider van de schenkers terugkeren tot zijn schenkambt, zodat hij de beker in Farao's hand gaf.", "Ps 119:167": "Mijn ziel onderhoudt Uw getuigenissen, en ik heb ze zeer lief.", "Hebr 6:5": "en het goede woord van God geproefd hebben, en de krachten van de toekomende eeuw,", "2 Kron 17:7-9": "In het derde jaar van zijn regering nu zond hij naar zijn vorsten, naar Ben-chaïl, en naar Obadja, en naar Zecharja, en naar Nathaneël, en naar Michaja, om te leren in de steden van Juda. En met hen de Levieten, Semaja en Nethanja, en Zebadja, en Asaël, en Semiramoth, en Jonathan, en Adonia, en Tobia, en Tob-adonia, de Levieten, en met hen de priesters Elisama en Joram. En zij leerden in Juda, en het wetboek van de HEERE was bij hen; en zij gingen rond in alle steden van Juda, en leerden onder het volk.", "Neh 5:13": "Ook schudde ik mijn boezem uit, en zei: Zo schudde God uit iedere man die dit woord niet zal nakomen, uit zijn huis en uit zijn arbeid, en hij worde zo uitgeschud en leeg. En de hele gemeente zei: Amen! En zij prezen de HEERE. En het volk deed volgens dit woord.", "Lev 25:18": "En doe Mijn inzettingen, en houd Mijn rechten, en doe die; dan zult u zeker wonen in het land.", "1 Tim 6:3": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Luk 6:35": "Maar heb uw vijanden lief, en doe goed, en leen, zonder iets terug te hopen; en uw loon zal groot zijn, en u zult kinderen van de Allerhoogste zijn; want Hij is goedertieren over de ondankbaren en de bozen.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Num 11:16-18": "En de HEERE zei tegen Mozes: Verzamel voor Mij zeventig mannen uit de oudsten van Israël, van wie u weet dat zij de oudsten van het volk en zijn opzichters zijn; en u zult hen brengen naar de tent van de samenkomst, en zij zullen zich daar bij u opstellen. Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt. En tegen het volk zult u zeggen: Heilig u tegen morgen, en u zult vlees eten; want u hebt voor de oren van de HEERE geweend en gezegd: Wie zal ons vlees te eten geven? Want het ging ons goed in Egypte! Daarom zal de HEERE u vlees geven, en u zult eten.", "Dan 10:21": "Doch Ik zal u bekendmaken wat opgetekend is in het geschrift van de waarheid; en er is niemand die zich met Mij sterk maakt tegen dezen, dan uw vorst Michaël.", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "1 Petr 3:9-12": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven. Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Richt 20:29": "Toen stelde Israël hinderlagen op tegen Gibea rondom.", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "Gen 14:14": "Toen Abram hoorde dat zijn broeder gevangen was genomen, wapende hij zijn geoefende mannen, geboren in zijn eigen huis, driehonderd achttien, en hij achtervolgde hen tot Dan toe.", "Ps 144:6": "Bliksem met bliksem, en verstrooi hen; zend Uw pijlen uit, en vernietig hen.", "Num 27:18": "Toen zei de HEERE tegen Mozes: Neem Jozua, de zoon van Nun, een man in wie de Geest is, bij u; en leg uw hand op hem;", "Jer 22:3": "Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "Klaagl 3:64-66": "Thau. HEERE! geef hun de vergelding terug, naar het werk van hun handen. Thau. Geef hun een verharding van het hart; Uw vloek zij over hen! Thau. Vervolg hen met toorn, en verdelg hen van onder de hemel van de HEERE.", "2 Petr 1:19-21": "En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten. Weet dit eerst, dat geen enkele profetie van de Schrift een eigen uitlegging heeft; Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Mark 13:13": "En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "Deut 31:9-13": "En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël. En Mozes gebood hun: Aan het einde van elke zeven jaar, op de vastgestelde tijd van het jaar van de vrijlating, op het feest van de loofhutten, wanneer heel Israël zal komen om te verschijnen voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen, zult u deze wet voorlezen voor heel Israël, ten aanhoren van hen;", "Num 24:9": "Hij heeft zich gekromd, hij heeft zich neergelegd, als een leeuw, en als een oude leeuw; wie zal hem doen opstaan? Wie u zegent, die zij gezegend, en vervloekt zij wie u vervloekt!", "Ps 76:6": "De stouthartigen zijn beroofd; zij hebben hun slaap gesluimerd; en geen van de dappere mannen hebben hun handen gevonden.", "Ex 17:14-16": "Toen zei de HEERE tegen Mozes: Schrijf dit ter gedachtenis in een boek, en prent het in de oren van Jozua, dat Ik de gedachtenis van Amalek geheel zal uitwissen van onder de hemel. En Mozes bouwde een altaar; en hij noemde het: De HEERE is mijn Banier! En hij zei: Omdat de hand op de troon van de HEERE is, zal er oorlog van de HEERE tegen Amalek zijn, van geslacht tot geslacht!", "Deut 11:13-16": "En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel; Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt. En Ik zal gras geven op uw veld voor uw dieren; en u zult eten en verzadigd worden.", "Matt 24:39": "en zij merkten het niet, totdat de zondvloed kwam en hen allen wegnam; zo zal ook de komst van de Zoon des mensen zijn.", "Spr 7:1-4": "Mijn zoon, bewaar mijn woorden, en leg mijn geboden bij u weg. Bewaar mijn geboden, en leef, en mijn wet als de appel van uw ogen. Bind ze aan uw vingers, schrijf ze op de tafel van uw hart.", "Ps 119:74": "Die U vrezen, zullen mij aanzien, en zich verblijden, omdat ik op Uw woord gehoopt heb.", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "2 Kon 5:1": "Naäman nu, de legeraanvoerder van de koning van Syrië, was een groot man voor het aangezicht van zijn heer, en van hoog aanzien; want door hem had de HEERE de Syriërs verlossing gegeven; zo was deze man een strijdbaar held, doch melaats.", "Ps 119:35": "Doe mij treden op het pad van Uw geboden, want daarin heb ik lust.", "Deut 20:14": "Behalve de vrouwen, en de kinderen, en de dieren, en al wat in de stad zijn zal, alle buit ervan zult u voor uzelf roven; en u zult eten van de buit van uw vijanden, die de HEERE, uw God, u gegeven heeft.", "2 Kon 22:8": "Toen zei de hogepriester Hilkia tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE; en Hilkia gaf dat boek aan Safan, die het las.", "Deut 34:9": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had.", "Matt 5:17": "Denk niet dat Ik gekomen ben om de wet of de profeten af te schaffen; Ik ben niet gekomen om die af te schaffen, maar om te vervullen.", "Deut 27:12-26": "Dezen zullen staan om het volk te zegenen op de berg Gerizim, wanneer u over de Jordaan gegaan bent: Simeon, en Levi, en Juda, en Issaschar, en Jozef, en Benjamin. En dezen zullen staan voor de vervloeking op de berg Ebal: Ruben, Gad en Aser, Zebulon, Dan en Naftali. En de Levieten zullen zich uitspreken en zeggen tegen alle mannen van Israël, met verheven stem:", "Kol 4:16": "En wanneer deze brief bij u gelezen is, zorg ervoor dat hij ook in de gemeente van de Laodicenzen gelezen wordt, en dat ook u de brief leest die uit Laodicea komt.", "Ps 78:1-8": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Joz 8:30-34": "Toen bouwde Jozua een altaar voor de HEERE, de God van Israël, op de berg Ebal; zoals Mozes, de knecht van de HEERE, de kinderen van Israël geboden had, overeenkomstig wat geschreven staat in het wetboek van Mozes: een altaar van gehele stenen, waarover men geen ijzer bewogen had; en daarop offerden zij de HEERE brandoffers; ook offerden zij dankoffers. Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël.", "2 Tess 2:15": "Welnu dan, broeders, staat vast en houdt vast aan de overleveringen, die u geleerd zijn, hetzij door ons woord, hetzij door onze brief.", "Num 15:29": "Voor de inboorling van de kinderen van Israël en de vreemdeling die in hun midden als vreemdeling verblijft, zal één wet gelden, voor hem die het door afdwaling doet.", "Ps 58:8": "Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren.", "Rom 10:17": "Zo is dan het geloof uit het gehoor, en het gehoor door het Woord van God,", "Deut 11:20": "En schrijf ze op de posten van uw huis, en aan uw poorten;", "Joz 24:1": "Daarna verzamelde Jozua al de stammen van Israël te Sichem, en hij riep de oudsten van Israël, en hun hoofden, en hun rechters, en hun opzichters; en zij stelden zich voor het aangezicht van God.", "Jer 46:27": "Maar u, Mijn knecht Jakob! Vrees niet, en wees niet ontzet, Israël! Want zie, Ik zal u verlossen uit verre landen, en uw nageslacht uit het land van hun gevangenschap; en Jakob zal wederkomen, en stil en gerust zijn, en niemand zal hem verschrikken.", "Ps 109:7": "Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden.", "Num 31:22": "Alleen het goud en het zilver, het koper, het ijzer, het tin en het lood;", "Ps 119:113": "Samech. Ik haat de kwade ranken, maar heb Uw wet lief.", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Openb 19:18": "Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten.", "Gal 1:9": "Zoals wij al eerder gezegd hebben, zeg ik het nu ook weer: als iemand u een evangelie verkondigt naast wat u ontvangen hebt, laat hij vervloekt zijn.", "Deut 24:19": "Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen.", "Deut 32:46": "Zei hij tegen hen: Zet uw hart op al de woorden, die ik heden onder u betuig, dat u ze uw kinderen gebieden zult, dat zij nauwlettend zullen doen al de woorden van deze wet.", "Luk 24:32": "En zij zeiden tegen elkaar: Was ons hart niet brandend in ons, toen Hij onderweg tot ons sprak, en toen Hij ons de Schriften opende?", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Joël 1:3": "Vertel uw kinderen daarvan, en laat het uw kinderen hun kinderen vertellen, en van die kinderen aan een ander geslacht.", "Lev 25:19": "En het land zal zijn vrucht geven, en u zult eten tot verzadiging toe; en u zult zeker daarin wonen.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "Deut 27:1": "En Mozes gebood, samen met de oudsten van Israël, het volk: Houd al deze geboden die ik u vandaag gebied.", "Ex 20:25": "Maar als u Mij een stenen altaar zult maken, dan zult u dit niet bouwen van gehouwen steen; want als u uw houwijzer daarover heft, zult u het ontheiligen.", "Neh 8:14": "En op de tweede dag verzamelden de hoofden van de families van heel het volk, de priesters en de Levieten, zich bij Ezra, de schriftgeleerde, om inzicht te krijgen in de woorden van de wet.", "Joh 2:22": "Daarom, toen Hij opgestaan was uit de doden, herinnerden Zijn discipelen zich dat Hij dit tegen hen had gezegd, en zij geloofden de Schrift en het woord dat Jezus gesproken had.", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Joz 11:11": "En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur.", "Joz 8:2-22": "U nu zult aan Ai en haar koning doen, zoals u aan Jericho en haar koning gedaan hebt; behalve dat u haar roof en haar vee voor uzelf roven zult; leg een hinderlaag tegen de stad, van achter haar. Toen maakte Jozua zich klaar, en al het krijgsvolk, om op te trekken naar Ai. En Jozua koos dertigduizend mannen, strijdbare helden, en hij stuurde hen 's nachts erop uit, en gebood hun: Let op, u zult de stad in een hinderlaag lokken van achter de stad; houd u niet al te ver van de stad, en wees allen gereed.", "Num 31:2": "Neem wraak voor de kinderen van Israël op de Midianieten; daarna zult u verzameld worden tot uw volken.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "Lev 9:1": "Het gebeurde op de achtste dag, dat Mozes Aäron en zijn zonen riep, en de oudsten van Israël;", "Joz 10:2-40": "Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei: Kom op tot mij, en help mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen van Israël.", "Joh 17:8": "Want de woorden die U Mij gegeven hebt, heb Ik hun gegeven, en zij hebben ze ontvangen, en zij hebben werkelijk erkend dat Ik van U ben uitgegaan, en hebben geloofd dat U Mij gezonden hebt.", "Jer 15:15": "O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.", "Ps 56:5": "In God zal ik Zijn woord prijzen; ik vertrouw op God, ik zal niet vrezen; wat zou vlees mij doen?", "Joh 8:31": "Jezus zei dan tegen de Joden die in Hem geloofden: Als u in Mijn woord blijft, bent u werkelijk Mijn discipelen;", "Joz 1:1-9": "Het gebeurde nu, na de dood van Mozes, de knecht van de HEERE, dat de HEERE tegen Jozua, de zoon van Nun, de dienaar van Mozes, sprak en zei: Mijn knecht Mozes is gestorven; maak u nu op, trek deze Jordaan over, u en al dit volk, naar het land dat Ik hun, de kinderen van Israël, geef. Elke plaats waarop uw voetzool treden zal, heb Ik u gegeven, zoals Ik tegen Mozes gesproken heb.", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Ps 119:45-52": "En ik zal wandelen in de ruimte, omdat ik Uw bevelen gezocht heb. Ook zal ik voor koningen spreken van Uw getuigenissen, en mij niet schamen. En ik zal mij vermaken in Uw geboden, die ik liefheb.", "Ex 14:3": "Farao dan zal zeggen van de kinderen van Israël: Zij zijn verward in het land; die woestijn heeft hen ingesloten.", "Deut 5:6-21": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb. U zult geen andere goden voor Mijn aangezicht hebben. U zult u geen gesneden beeld maken, noch enige gelijkenis, van wat boven in de hemel is, of onder op de aarde is, of in het water onder de aarde is;", "Joh 8:32": "En u zult de waarheid kennen, en de waarheid zal u vrijmaken.", "Deut 31:13": "En opdat hun kinderen, die het niet geweten hebben, horen en leren, om de HEERE, uw God, te vrezen, alle dagen dat u leeft op het land waarheen u de Jordaan overtrekt om het te erven.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "Jes 19:11": "Zeker, de vorsten van Zoan zijn dwazen, de raad van de wijzen, van de raadgevers van Farao, is redeloos geworden; hoe kunt u dan tegen Farao zeggen: Ik ben een zoon van de wijzen, een zoon van de oude koningen?", "1 Sam 15:32": "Toen zei Samuël: Breng Agag, de koning van de Amalekieten, hier bij mij. Agag nu ging vol vertrouwen naar hem toe; en Agag zei: Voorwaar, de bitterheid van de dood is geweken!", "Ps 43:3": "Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Joh 19:38-42": "En daarna vroeg Jozef van Arimathea (die een discipel van Jezus was, maar in het verborgene, uit vrees voor de Joden) Pilatus, of hij het lichaam van Jezus mocht wegnemen; en Pilatus stond het toe. Hij ging dan en nam het lichaam van Jezus weg. En Nicodemus kwam ook (die eerst 's nachts naar Jezus toe was gekomen), en bracht een mengsel van mirre en aloë, ongeveer honderd pond van het gewicht. Zij namen dan het lichaam van Jezus, en bonden dat in linnen doeken met de specerijen, zoals de Joden de gewoonte hebben van begraven.", "1 Tess 5:20": "Veracht de profetieën niet.", "Richt 21:11": "Doch dit is de zaak die u doen zult: al wat mannelijk is, en alle vrouwen die gemeenschap met een man gehad hebben, zult u met de ban slaan.", "Spr 28:20": "Een geheel getrouw man zal overvloedig zijn in zegeningen; maar wie zich haast om rijk te worden, zal niet onschuldig blijven.", "Deut 4:8": "En welk groot volk is er, dat zulke rechtvaardige inzettingen en rechten heeft als deze hele wet, die ik vandaag voor u leg?", "Ps 79:12": "En geef onze buren zevenvoudig terug in hun schoot hun smaad, waarmee zij U, o Heere, gesmaad hebben.", "Ps 48:7": "Beving greep hen daar aan, smart als van een barende vrouw.", "2 Sam 13:28": "Absalom nu gebood zijn knechten: Let er nu op, wanneer Amnons hart vrolijk is van de wijn, en ik tegen u zeg: Sla Amnon neer, dan zult u hem doden; wees niet bang; heb ik het u niet geboden? Wees sterk en wees dapper.", "Joz 5:13": "Vervolgens gebeurde het, toen Jozua bij Jericho was, dat hij zijn ogen opsloeg en toekeek, en zie, er stond een Man tegenover hem, Die een getrokken zwaard in Zijn hand had. En Jozua ging naar Hem toe, en zei tegen Hem: Bent U van ons, of van onze vijanden?", "Job 27:7": "Mijn vijand zij als de goddeloze, en die zich tegen mij opmaakt, als de verkeerde.", "Ezra 10:1": "Terwijl Ezra zo bad en deze belijdenis deed, huilend en zich voor het huis van God neerwerpend, verzamelde zich bij hem uit Israël een zeer grote gemeente van mannen, vrouwen en kinderen; want het volk huilde met groot geween.", "Hand 5:18": "en zij sloegen hun handen aan de apostelen, en zetten hen in de gemeenschappelijke gevangenis.", "Deut 3:2": "Toen zei de HEERE tegen mij: Wees niet bang voor hem, want Ik heb hem, en al zijn volk, en zijn land, in uw hand gegeven; en u zult hem doen, zoals u met Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt.", "Ps 119:133": "Maak mijn voetstappen vast in Uw Woord, en laat geen ongerechtigheid over mij heersen.", "Hand 4:3": "En zij sloegen de handen aan hen, en zetten ze gevangen tot de volgende dag; want het was al avond.", "Hebr 2:1-3": "Daarom moeten wij ons des te meer houden aan wat wij gehoord hebben, opdat wij het niet op enig moment laten wegglijden. Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft, hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Hand 22:3": "Ik ben een Joodse man, geboren te Tarsen in Cilicië, maar opgevoed in deze stad, aan de voeten van Gamaliël onderwezen naar de nauwkeurigste wijze van de wet van de vaderen, en ik was een ijveraar voor God, zoals u allen heden bent.", "Dan 12:9": "En Hij zei: Ga heen, Daniël! want deze woorden zijn toegesloten en verzegeld tot de tijd van het einde.", "2 Petr 2:3": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H559\">Toen</span> zei <span class=\"wl\" data-l=\"L2\" data-code=\"H413\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H413\">HEERE</span> tegen <span class=\"wl\" data-l=\"L3\" data-code=\"H3091\">Jozua</span>: Wees <span class=\"wl\" data-l=\"L4\" data-code=\"H408\">niet</span> bang, <span class=\"wl\" data-l=\"L5\" data-code=\"H2865\">en</span> wees <span class=\"wl\" data-l=\"L6\" data-code=\"H408\">niet</span> ontmoedigd; <span class=\"wl\" data-l=\"L7\" data-code=\"H3947\">neem</span> <span class= </span> thereof, shall ye take for a <span class=\"wl wl-kjv\" data-code=\"H962\">prey</span> unto yourselves: <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> thee an <span class=\"wl wl-kjv\" data-code=\"H693\">ambush</span> for the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> behind", "3": "So <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> to go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai:</span> and <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> chose <span class=\"wl wl-kjv\" data-code=\"H977\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour,</span> and sent them <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> by night.", "4": "And he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">Behold,</span> ye shall lie in <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> against the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> even <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> <span class=\"wl wl-kjv\" data-code=\"H7368\">go</span> not <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> but be ye all ready:", "5": "And I, and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that are with me, will <span class=\"wl wl-kjv\" data-code=\"H7126\">approach</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and it shall come to pass, when they come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> us, as at the <span class=\"wl wl-kjv\" data-code=\"H7223\">first,</span> that we will <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> before", "6": "(For they will come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> us) till we have <span class=\"wl wl-kjv\" data-code=\"H5423\">drawn</span> them from the <span class=\"wl wl-kjv\" data-code=\"H5892\">city;</span> for they will <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> They <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> us, as at the <span class=\"wl wl-kjv\" data-code=\"H7223\">first:</span> therefore we will <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> before", "7": "Then ye shall rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> from the <span class=\"wl wl-kjv\" data-code=\"H693\">ambush,</span> and <span class=\"wl wl-kjv\" data-code=\"H3423\">seize</span> upon the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> will <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it into your hand.", "8": "And it shall be, when ye have <span class=\"wl wl-kjv\" data-code=\"H8610\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> that ye shall <span class=\"wl wl-kjv\" data-code=\"H3341\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> on <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H6213\">do.</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">See,</span> I have commanded", "9": "<span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> therefore sent them <span class=\"wl wl-kjv\" data-code=\"H7971\">forth:</span> and they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to lie in <span class=\"wl wl-kjv\" data-code=\"H3993\">ambush,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> between <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> and <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai,</span> on the west <span class=\"wl wl-kjv\" data-code=\"H3220\">side</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai:</span> but <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H3885\">lodged</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the people.", "10": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> he and the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to Ai.", "11": "And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> even the people of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> that were with him, went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and drew <span class=\"wl wl-kjv\" data-code=\"H5066\">nigh,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> before the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> on the north <span class=\"wl wl-kjv\" data-code=\"H6828\">side</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai:</span> now there was a <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> between them and Ai.", "12": "And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> about <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> them to lie in <span class=\"wl wl-kjv\" data-code=\"H693\">ambush</span> between <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> and <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai,</span> on the west <span class=\"wl wl-kjv\" data-code=\"H3220\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H5857\">city.</span>", "13": "And when they had <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> even all the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> that was on the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and their liers in <span class=\"wl wl-kjv\" data-code=\"H6119\">wait</span> on the <span class=\"wl wl-kjv\" data-code=\"H3220\">west</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> into the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the valley.", "14": "And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> it, that they <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted</span> and rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early,</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> he and all his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> at a time <span class=\"wl wl-kjv\" data-code=\"H4150\">appointed,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H6160\">plain;</span> but he <span class=\"wl wl-kjv\" data-code=\"H3045\">wist</span> not that there were liers in <span class=\"wl wl-kjv\" data-code=\"H693\">ambush</span> against him <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> the city.", "15": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> made as if they were <span class=\"wl wl-kjv\" data-code=\"H5060\">beaten</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the wilderness.", "16": "And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were in <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> were <span class=\"wl wl-kjv\" data-code=\"H2199\">called</span> together to <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them: and they <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> and were drawn <span class=\"wl wl-kjv\" data-code=\"H5423\">away</span> from the city.", "17": "And there was not a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> in <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> or <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> that went not <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">open,</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> after Israel.", "18": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> Stretch <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H3591\">spear</span> that is in thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> toward <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai;</span> for I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span> And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H3591\">spear</span> that he had in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> toward the city.", "19": "And the <span class=\"wl wl-kjv\" data-code=\"H693\">ambush</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> <span class=\"wl wl-kjv\" data-code=\"H4120\">quickly</span> out of their <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and they <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> as soon as he had stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> it, and <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted</span> and <span class=\"wl wl-kjv\" data-code=\"H3341\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> on fire.", "20": "And when the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">looked</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> them, they <span class=\"wl wl-kjv\" data-code=\"H7200\">saw,</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H6227\">smoke</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> ascended <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and they had no <span class=\"wl wl-kjv\" data-code=\"H3027\">power</span> to <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> this way or that <span class=\"wl wl-kjv\" data-code=\"H2008\">way:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> to the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> turned <span class=\"wl wl-kjv\" data-code=\"H2015\">back</span> upon the pursuers.", "21": "And when <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that the <span class=\"wl wl-kjv\" data-code=\"H693\">ambush</span> had <span class=\"wl wl-kjv\" data-code=\"H3920\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and that the <span class=\"wl wl-kjv\" data-code=\"H6227\">smoke</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">ascended,</span> then they turned <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of Ai.", "22": "And the <span class=\"wl wl-kjv\" data-code=\"H428\">other</span> issued <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> them; so they were in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> some on this side, and some on that side: and they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them, so <span class=\"wl wl-kjv\" data-code=\"H5704\">that</span> they <span class=\"wl wl-kjv\" data-code=\"H7604\">let</span> none of them <span class=\"wl wl-kjv\" data-code=\"H8300\">remain</span> or escape.", "23": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> they <span class=\"wl wl-kjv\" data-code=\"H8610\">took</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">alive,</span> and <span class=\"wl wl-kjv\" data-code=\"H7126\">brought</span> him to Joshua.", "24": "And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H2026\">slaying</span> all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> wherein they <span class=\"wl wl-kjv\" data-code=\"H7291\">chased</span> them, and when they were all <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> on the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> until they were <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed,</span> that all the <span class=\"wl wl-kjv\" data-code=\"H3478\">Israelites</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> it with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the sword.", "25": "And so it was, that all that <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> both of <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> were <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> even all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of Ai.", "26": "For <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">drew</span> not his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">back,</span> wherewith he stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H3591\">spear,</span> until he had utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed</span> all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of Ai.", "27": "Only the <span class=\"wl wl-kjv\" data-code=\"H929\">cattle</span> and the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of that <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> took for a <span class=\"wl wl-kjv\" data-code=\"H962\">prey</span> unto themselves, according unto the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> which he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Joshua.", "28": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> it an <span class=\"wl wl-kjv\" data-code=\"H8510\">heap</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> even a <span class=\"wl wl-kjv\" data-code=\"H8077\">desolation</span> unto this day.", "29": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> he <span class=\"wl wl-kjv\" data-code=\"H8518\">hanged</span> on a <span class=\"wl wl-kjv\" data-code=\"H6086\">tree</span> until <span class=\"wl wl-kjv\" data-code=\"H6256\">eventide:</span> and as soon as the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">down,</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> that they should <span class=\"wl wl-kjv\" data-code=\"H3381\">take</span> his <span class=\"wl wl-kjv\" data-code=\"H5038\">carcase</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from the <span class=\"wl wl-kjv\" data-code=\"H6086\">tree,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> it at the <span class=\"wl wl-kjv\" data-code=\"H6607\">entering</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H6965\">raise</span> thereon a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1530\">heap</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> that remaineth unto this day.", "30": "Then <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Ebal,", "31": "As <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> as it is <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of <span class=\"wl wl-kjv\" data-code=\"H8003\">whole</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> over which no man hath lift <span class=\"wl wl-kjv\" data-code=\"H5130\">up</span> any <span class=\"wl wl-kjv\" data-code=\"H1270\">iron:</span> and they <span class=\"wl wl-kjv\" da /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
