/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Toen zei de HEERE tegen Jozua: Wees niet bang, en wees niet ontmoedigd; neem al het krijgsvolk met u mee, en maak u klaar, trek op naar Ai; zie, Ik heb de koning van Ai, en zijn volk, en zijn stad, en zijn land in uw hand gegeven.", "2": "U nu zult aan Ai en haar koning doen, zoals u aan Jericho en haar koning gedaan hebt; behalve dat u haar roof en haar vee voor uzelf roven zult; leg een hinderlaag tegen de stad, van achter haar.", "3": "Toen maakte Jozua zich klaar, en al het krijgsvolk, om op te trekken naar Ai. En Jozua koos dertigduizend mannen, strijdbare helden, en hij stuurde hen 's nachts erop uit,", "4": "en gebood hun: Let op, u zult de stad in een hinderlaag lokken van achter de stad; houd u niet al te ver van de stad, en wees allen gereed.", "5": "Ik nu, en al het volk dat bij mij is, zullen de stad naderen; en het zal gebeuren, wanneer zij ons tegemoet uittrekken zoals eerst, dat wij voor hen zullen vluchten.", "6": "Laat hen dan achter ons aan komen, totdat wij hen van de stad weggetrokken hebben; want zij zullen zeggen: Zij vluchten voor ons, zoals eerst; zo zullen wij voor hen vluchten.", "7": "Dan zult u opstaan uit de hinderlaag, en u zult de stad innemen; want de HEERE, uw God, zal ze in uw hand geven.", "8": "En het zal gebeuren, wanneer u de stad ingenomen hebt, dat u de stad met vuur aansteekt; naar het woord van de HEERE zult u doen; kijk, ik heb het u geboden.", "9": "Zo stuurde Jozua hen erop uit, en zij gingen naar de hinderlaag, en zij bleven tussen Beth-el en Ai, ten westen van Ai; maar Jozua overnachtte die nacht te midden van het volk.", "10": "En Jozua maakte zich 's morgens vroeg op, en hij monsterde het volk; en hij trok op, hij en de oudsten van Israël, voor het volk uit, naar Ai.", "11": "Ook trok al het krijgsvolk op dat bij hem was; en zij naderden en kwamen tegenover de stad, en zij legerden zich ten noorden van Ai; en er was een dal tussen hem en Ai.", "12": "Hij nam ook omtrent vijfduizend man, en hij legde hen in een hinderlaag tussen Beth-el en Ai, ten westen van de stad.", "13": "En zij stelden het volk op, het hele leger dat ten noorden van de stad was, en de hinderlaag lag ten westen van de stad. En Jozua ging die nacht midden in het dal.", "14": "En het gebeurde, toen de koning van Ai dat zag, dat zij zich haastten en zich vroeg opmaakten, en de mannen van de stad kwamen naar buiten, Israël tegemoet, ten strijde, hij en al zijn volk, op de vastgestelde tijd, voor het vlakke veld; want hij wist niet dat men hem een hinderlaag had gelegd van achter de stad.", "15": "Jozua dan, en heel Israël, deed alsof zij voor hen verslagen werden; en zij vluchtten via de weg naar de woestijn.", "16": "Daarom werd al het volk dat in de stad was, samengeroepen om hen na te jagen; en zij joegen Jozua na, en werden van de stad weggetrokken.", "17": "En er bleef geen man over in Ai of Beth-el, die niet uittrok, Israël na; en zij lieten de stad openstaan, en joegen Israël achterna.", "18": "Toen sprak de HEERE tegen Jozua: Strek de speer uit die in uw hand is, naar Ai, want Ik zal hen in uw hand geven. Toen strekte Jozua de speer die in zijn hand was, naar de stad uit.", "19": "Toen kwam de hinderlaag snel omhoog van haar plaats, en zij liepen erheen, zodra hij zijn hand had uitgestrekt, en kwamen bij de stad, en zij namen haar in, en zij haastten zich, en staken de stad in brand.", "20": "Toen de mannen van Ai zich omkeerden, zagen zij, en zie, de rook van de stad steeg op naar de hemel; en zij hadden geen mogelijkheid om deze of gene kant op te vluchten; want het volk dat naar de woestijn vluchtte, keerde zich om tegen hen die hen achtervolgden.", "21": "En Jozua en heel Israël, ziende dat de hinderlaag de stad had ingenomen, en dat de rook van de stad opsteeg, keerden zich om, en sloegen de mannen van Ai.", "22": "Ook kwamen zij die uit de stad kwamen, hun tegemoet, zodat zij midden tussen de Israëlieten waren, dezen van hier en genen van daar; en zij sloegen hen, totdat er niemand van hen overbleef, noch iemand ontkwam.", "23": "Doch de koning van Ai grepen zij levend, en zij brachten hem naar Jozua.", "24": "En het gebeurde, toen de Israëlieten een einde gemaakt hadden aan het doden van alle inwoners van Ai, op het veld, in de woestijn, waarin zij hen nagejaagd hadden, en dat zij allen door de scherpte van het zwaard gevallen waren, totdat zij allen vernietigd waren; toen keerde heel Israël zich naar Ai, en zij sloegen haar met de scherpte van het zwaard.", "25": "En het gebeurde dat allen die op die dag vielen, zowel mannen als vrouwen, twaalfduizend waren, allemaal mensen van Ai.", "26": "Jozua trok zijn hand niet terug, die hij met de speer had uitgestrekt, totdat hij alle inwoners van Ai met de ban had geslagen.", "27": "Alleen roofden de Israëlieten voor zichzelf het vee en de buit van die stad, naar het woord van de HEERE, dat Hij Jozua geboden had.", "28": "Jozua nu verbrandde Ai, en hij maakte het tot een eeuwige puinhoop, tot een verwoesting, tot op deze dag.", "29": "En de koning van Ai hing hij aan een paal, tot de avond; en omtrent het ondergaan van de zon gebood Jozua dat men zijn dode lichaam van de paal zou afnemen; en zij wierpen het bij de ingang van de stadspoort, en richtten daarop een grote steenhoop op, die er is tot op deze dag.", "30": "Toen bouwde Jozua een altaar voor de HEERE, de God van Israël, op de berg Ebal;", "31": "zoals Mozes, de knecht van de HEERE, de kinderen van Israël geboden had, overeenkomstig wat geschreven staat in het wetboek van Mozes: een altaar van gehele stenen, waarover men geen ijzer bewogen had; en daarop offerden zij de HEERE brandoffers; ook offerden zij dankoffers.", "32": "Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël.", "33": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen.", "34": "En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.", "35": "Er was geen woord van alles wat Mozes geboden had, dat Jozua niet hardop voorlas voor de hele gemeente van Israël, en de vrouwen, en de kleine kinderen, en de vreemdelingen die in hun midden woonden."}, "SV": {"1": "Toen zeide de HEERE tot Jozua: Vrees niet, en ontzet u niet; neem met u al het krijgsvolk, en maak u op, trek op naar Ai; zie, Ik heb den koning van Ai, en zijn volk, en zijn stad, en zijn land in uw hand gegeven.", "2": "Gij nu zult aan Ai en haar koning doen, gelijk als gij aan Jericho en haar koning gedaan hebt; behalve dat gij haar roof en haar vee voor ulieden roven zult; stel u een achterlage tegen de stad, van achter dezelve.", "3": "Toen maakte zich Jozua op, en al het krijgsvolk, om op te trekken naar Ai. En Jozua verkoos dertig duizend mannen, strijdbare helden, en hij zond hen bij nacht uit,", "4": "En gebood hun, zeggende: Ziet toe, gijlieden zult der stad lagen leggen van achter de stad; houdt u niet zeer verre van de stad, en weest gij allen bereid.", "5": "Ik nu, en al het volk, dat bij mij is, zullen tot de stad naderen; en het zal geschieden, wanneer zij ons tegemoet zullen uitgaan, gelijk als in het eerst, zo zullen wij voor hun aangezicht vlieden.", "6": "Laat hen dan uitkomen achter ons, totdat wij hen van de stad aftrekken; want zij zullen zeggen: Zij vlieden voor onze aangezichten, gelijk als in het eerst; zo zullen wij vlieden voor hun aangezichten.", "7": "Dan zult gijlieden opstaan uit de achterlage, en gij zult de stad innemen; want de HEERE, uw God, zal ze in uw hand geven.", "8": "En het zal geschieden, wanneer gij de stad ingenomen hebt, zo zult gij de stad met vuur aansteken; naar het woord des HEEREN zult gijlieden doen; ziet, ik heb het ulieden geboden.", "9": "Alzo zond Jozua hen heen, en zij gingen naar de achterlage, en zij bleven tussen Beth-el en tussen Ai, tegen het westen van Ai; maar Jozua overnachtte dien nacht in het midden des volks.", "10": "En Jozua maakte zich des morgens vroeg op, en hij monsterde het volk; en hij trok op, hij en de oudsten van Israël, voor het aangezicht des volks, naar Ai.", "11": "Ook trok al het krijgsvolk op, dat bij hem was; en zij naderden en kwamen tegenover de stad, en zij legerden zich tegen het noorden van Ai; en er was een dal tussen hem en tussen Ai.", "12": "Hij nam ook omtrent vijf duizend man, en hij stelde hen tot een achterlage tussen Beth-el en tussen Ai, aan het westen der stad.", "13": "En zij stelden het volk, het ganse leger, dat aan het noorden der stad was, en zijn lage was aan het westen der stad. En Jozua ging in denzelven nacht in het midden des dals.", "14": "En het geschiedde, toen de koning van Ai *dat* zag, zo haastten zij en maakten zich vroeg op, en de mannen der stad kwamen uit, Israël tegemoet, ten strijde, hij en al zijn volk, ter bestemder tijd, voor het vlakke veld; want hij wist niet, dat hem iemand een achterlage leide van achter de stad.", "15": "Jozua dan, en gans Israël, werd geslagen voor hun aangezichten; en zij vloden door den weg der woestijn.", "16": "Daarom werd samengeroepen al het volk, dat in de stad was, om hen na te jagen; en zij joegen Jozua na, en werden van de stad afgetrokken.", "17": "En er werd niet een man overgelaten, in Ai, noch Beth-el, die niet uittrokken, Israël na; en zij lieten de stad openstaan, en joegen Israël achterna.", "18": "Toen sprak de HEERE tot Jozua: Strek de spies uit, die in uw hand is, naar Ai, want Ik zal hen in uw hand geven. Toen strekte Jozua de spies, die in zijn hand was, naar de stad aan.", "19": "Toen rees de achterlage haastelijk op van haar plaats, en zij liepen toe, met dat hij zijn hand uitgestrekt had, en kwamen aan de stad, en zij namen ze in, en zij haastten zich, en staken de stad aan met vuur.", "20": "Als de mannen van Ai zich achterom keerden, zo zagen zij, en ziet, de rook der stad ging op naar den hemel; en zij hadden geen ruimte, om herwaarts of derwaarts te vlieden; want het volk, dat naar de woestijn vluchtte, keerde zich tegen degenen, die *hen* najoegen.", "21": "En Jozua en gans Israël, ziende, dat de achterlage de stad ingenomen had, en dat de rook der stad opging, zo keerden zij zich om, en sloegen de mannen van Ai.", "22": "Ook kwamen die uit de stad hun tegemoet, zodat zij in het midden der Israëlieten waren, deze van hier en gene van daar; en zij sloegen hen, totdat geen overige onder hen overbleef, noch die ontkwam.", "23": "Doch den koning van Ai grepen zij levend, en zij brachten hem tot Jozua.", "24": "En het geschiedde, toen de Israëlieten een einde gemaakt hadden van al de inwoners van Ai te doden, op het veld, in de woestijn, in dewelke zij hen nagejaagd hadden, en dat zij allen door de scherpte des zwaards gevallen waren, totdat zij allen vernield waren; zo keerde zich gans Israël naar Ai, en zij sloegen ze met de scherpte des zwaards.", "25": "En het geschiedde, dat allen, die te dien dage vielen, zo mannen als vrouwen, waren twaalf duizend, al te zamen lieden van Ai.", "26": "Jozua trok ook zijn hand niet terug, die hij met de spies had uitgestrekt, totdat hij al de inwoners van Ai verbannen had.", "27": "Alleenlijk roofden de Israëlieten voor zichzelven het vee en den buit derzelver stad, naar het woord des HEEREN, dat Hij Jozua geboden had.", "28": "Jozua nu verbrandde Ai, en hij stelde haar tot een eeuwigen hoop, ter verwoesting, tot op dezen dag.", "29": "En den koning van Ai hing hij aan een hout, tot aan den avondstond; en omtrent den ondergang der zon gebood Jozua, dat men zijn dood lichaam van het hout afname; en zij wierpen het aan de deur der stadspoort, en richtten daarop een groten steenhoop, zijnde tot op dezen dag.", "30": "Toen bouwde Jozua een altaar den HEERE, den God van Israël, op den berg Ebal;", "31": "Gelijk als Mozes, de knecht des HEEREN, den kinderen Israëls geboden had, achtereenvolgens hetgeen geschreven is in het wetboek van Mozes: een altaar van gehele stenen, over dewelke men geen ijzer bewogen had; en daarop offerden zij den HEERE brandofferen; ook offerden zij dankofferen.", "32": "Aldaar schreef hij ook op stenen een dubbel van de wet van Mozes, hetwelk hij geschreven heeft voor het aangezicht der kinderen Israëls.", "33": "En gans Israël met zijn oudsten, en ambtlieden, en zijn rechters, stonden aan deze en aan gene zijde der ark, voor de Levietische priesteren, die de ark des verbonds des HEEREN droegen, zo vreemdelingen als inboorlingen, een helft daarvan tegenover den berg Gerizim, en een helft daarvan tegenover den berg Ebal, gelijk als Mozes, de knecht des HEEREN, bevolen had; om het volk van Israël in het eerst te zegenen.", "34": "En daarna las hij overluid al de woorden der wet, de zegening en den vloek, naar alles, wat in het wetboek geschreven staat.", "35": "Daar was niet een woord van al hetgeen Mozes geboden had, dat Jozua niet overluid las voor de gehele gemeente van Israël, en de vrouwen, en de kleine kinderen, en de vreemdelingen, die in het midden van hen wandelden."}, "KJV": {"1": "And the LORD said unto Joshua, Fear not, neither be thou dismayed: take all the people of war with thee, and arise, go up to Ai: see, I have given into thy hand the king of Ai, and his people, and his city, and his land:", "2": "And thou shalt do to Ai and her king as thou didst unto Jericho and her king: only the spoil thereof, and the cattle thereof, shall ye take for a prey unto yourselves: lay thee an ambush for the city behind", "3": "So Joshua arose, and all the people of war, to go up against Ai: and Joshua chose out thirty thousand mighty men of valour, and sent them away by night.", "4": "And he commanded them, saying, Behold, ye shall lie in wait against the city, *even* behind the city: go not very far from the city, but be ye all ready:", "5": "And I, and all the people that *are* with me, will approach unto the city: and it shall come to pass, when they come out against us, as at the first, that we will flee before", "6": "(For they will come out after us) till we have drawn them from the city; for they will say, They flee before us, as at the first: therefore we will flee before", "7": "Then ye shall rise up from the ambush, and seize upon the city: for the LORD your God will deliver it into your hand.", "8": "And it shall be, when ye have taken the city, *that* ye shall set the city on fire: according to the commandment of the LORD shall ye do. See, I have commanded", "9": "Joshua therefore sent them forth: and they went to lie in ambush, and abode between Bethel and Ai, on the west side of Ai: but Joshua lodged that night among the people.", "10": "And Joshua rose up early in the morning, and numbered the people, and went up, he and the elders of Israel, before the people to Ai.", "11": "And all the people, *even the people* of war that *were* with him, went up, and drew nigh, and came before the city, and pitched on the north side of Ai: now *there was* a valley between them and Ai.", "12": "And he took about five thousand men, and set them to lie in ambush between Bethel and Ai, on the west side of the city.", "13": "And when they had set the people, *even* all the host that *was* on the north of the city, and their liers in wait on the west of the city, Joshua went that night into the midst of the valley.", "14": "And it came to pass, when the king of Ai saw *it*, that they hasted and rose up early, and the men of the city went out against Israel to battle, he and all his people, at a time appointed, before the plain; but he wist not that *there were* liers in ambush against him behind the city.", "15": "And Joshua and all Israel made as if they were beaten before them, and fled by the way of the wilderness.", "16": "And all the people that *were* in Ai were called together to pursue after them: and they pursued after Joshua, and were drawn away from the city.", "17": "And there was not a man left in Ai or Bethel, that went not out after Israel: and they left the city open, and pursued after Israel.", "18": "And the LORD said unto Joshua, Stretch out the spear that *is* in thy hand toward Ai; for I will give it into thine hand. And Joshua stretched out the spear that *he had* in his hand toward the city.", "19": "And the ambush arose quickly out of their place, and they ran as soon as he had stretched out his hand: and they entered into the city, and took it, and hasted and set the city on fire.", "20": "And when the men of Ai looked behind them, they saw, and, behold, the smoke of the city ascended up to heaven, and they had no power to flee this way or that way: and the people that fled to the wilderness turned back upon the pursuers.", "21": "And when Joshua and all Israel saw that the ambush had taken the city, and that the smoke of the city ascended, then they turned again, and slew the men of Ai.", "22": "And the other issued out of the city against them; so they were in the midst of Israel, some on this side, and some on that side: and they smote them, so that they let none of them remain or escape.", "23": "And the king of Ai they took alive, and brought him to Joshua.", "24": "And it came to pass, when Israel had made an end of slaying all the inhabitants of Ai in the field, in the wilderness wherein they chased them, and when they were all fallen on the edge of the sword, until they were consumed, that all the Israelites returned unto Ai, and smote it with the edge of the sword.", "25": "And *so* it was, *that* all that fell that day, both of men and women, *were* twelve thousand, *even* all the men of Ai.", "26": "For Joshua drew not his hand back, wherewith he stretched out the spear, until he had utterly destroyed all the inhabitants of Ai.", "27": "Only the cattle and the spoil of that city Israel took for a prey unto themselves, according unto the word of the LORD which he commanded Joshua.", "28": "And Joshua burnt Ai, and made it an heap for ever, *even* a desolation unto this day.", "29": "And the king of Ai he hanged on a tree until eventide: and as soon as the sun was down, Joshua commanded that they should take his carcase down from the tree, and cast it at the entering of the gate of the city, and raise thereon a great heap of stones, *that remaineth* unto this day.", "30": "Then Joshua built an altar unto the LORD God of Israel in mount Ebal,", "31": "As Moses the servant of the LORD commanded the children of Israel, as it is written in the book of the law of Moses, an altar of whole stones, over which no man hath lift up *any* iron: and they offered thereon burnt offerings unto the LORD, and sacrificed peace offerings.", "32": "And he wrote there upon the stones a copy of the law of Moses, which he wrote in the presence of the children of Israel.", "33": "And all Israel, and their elders, and officers, and their judges, stood on this side the ark and on that side before the priests the Levites, which bare the ark of the covenant of the LORD, as well the stranger, as he that was born among them; half of them over against mount Gerizim, and half of them over against mount Ebal; as Moses the servant of the LORD had commanded before, that they should bless the people of Israel.", "34": "And afterward he read all the words of the law, the blessings and cursings, according to all that is written in the book of the law.", "35": "There was not a word of all that Moses commanded, which Joshua read not before all the congregation of Israel, with the women, and the little ones, and the strangers that were conversant among"}}, "tsk": {"1": [{"kopje": "Wees niet bang", "refs": ["Joz 1:9", "Joz 7:6", "Joz 7:7", "Joz 7:9", "Deut 1:21", "Deut 7:18", "Deut 31:8", "Ps 27:1", "Ps 46:12", "Jes 12:2", "Jes 41:10-16", "Jes 43:2", "Jer 46:27", "Matt 8:26"]}, {"kopje": "neem al", "refs": ["Joz 8:12", "Joz 8:25"]}, {"kopje": "Ik heb", "refs": ["Joz 6:2", "Ps 44:4", "Dan 2:21", "Dan 2:37", "Dan 2:38", "Dan 4:25", "Dan nderen": []}]}, {"topic": "Women", "href": "../../nave/w/#t-women", "kinderen": [{"label": "Required to attend to the reading of the law of Moses", "href": "../../nave/w/?hl=Josh.8.35#i22096", "refs": [{"disp": "Deut 31:12", "href": "../../deuteronomium/31/#v12", "ref": "Deut 31:12", "svLabel": null}, {"disp": "Joz 8:35", "href": "../../jozua/8/#v35", "ref": "Joz 8:35", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Law Of Moses, The", "href": "../../torrey/l/#t-law-of-moses-the", "kinderen": [{"label": "Publicly Read", "href": "../../torrey/l/?hl=Josh.8.35#i11330", "refs": [], "kinderen": [{"label": "By Joshua", "href": "../../torrey/l/?hl=Josh.8.35#i11332", "refs": [{"disp": "Joz 8:34", "href": "../../jozua/8/#v34", "ref": "Joz 8:34", "svLabel": null}, {"disp": "Joz 8:35", "href": "../../jozua/8/#v35", "ref": "Joz 8:35", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Woman", "href": "../../torrey/w/#t-woman", "kinderen": [{"label": "Were required to hear and obey the law", "href": "../../torrey/w/?hl=Josh.8.35#i23551", "refs": [{"disp": "Joz 8:35", "href": "../../jozua/8/#v35", "ref": "Joz 8:35", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ps 119:60": "Ik heb gehaast, en niet vertraagd Uw geboden te onderhouden.", "Joz 3:3": "En zij geboden het volk: Wanneer u de ark van het verbond van de HEERE, uw God, ziet, en de Levitische priesters die dragende, verreis dan ook u van uw plaats, en volg haar na;", "Jes 55:11": "Zo zal Mijn woord, dat uit Mijn mond uitgaat, ook zijn, het zal niet leeg naar Mij terugkeren; maar het zal doen wat Mij behaagt, en het zal voorspoedig zijn in wat, waartoe Ik het zend.", "1 Tim 4:6": "Als u deze dingen aan de broeders voorhoudt, zult u een goede dienaar van Jezus Christus zijn, gevoed door de woorden van het geloof en van de goede leer, die u gevolgd hebt.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "2 Sam 18:17": "En zij namen Absalom en wierpen hem in het woud, in een grote kuil, en legden op hem een zeer grote steenhoop; en heel Israël vluchtte, ieder naar zijn tent.", "Richt 7:25": "En zij vingen twee vorsten van de Midianieten, Oreb en Zeëb, en doodden Oreb op de rots Oreb, en Zeëb doodden zij bij de perskuip van Zeëb, en achtervolgden de Midianieten; en zij brachten de hoofden van Oreb en Zeëb naar Gideon, aan de overkant van de Jordaan.", "Neh 7:32": "De mannen van Beth-El en Ai, honderddrieëntwintig;", "Deut 32:47": "Want dat is geen leeg woord voor u; maar het is uw leven; en door ditzelfde woord zult u de dagen verlengen op het land, waar u over de Jordaan naartoe gaat, om dat te erven.", "Ps 59:16": "Laat hen zelfs omzwerven om eten; en laat hen vernachten, ook al zijn zij niet verzadigd.", "Jer 8:9": "De wijzen zijn beschaamd, verschrikt en gevangen; zie, zij hebben het woord van de HEERE verworpen; wat wijsheid zouden zij dan hebben?", "Neh 13:1": "Op die dag werd er gelezen in het boek van Mozes, voor de oren van het volk; en daarin werd geschreven gevonden, dat de Ammonieten en Moabieten niet zouden komen in de gemeente van God, tot in eeuwigheid;", "1 Joh 2:8": "Opnieuw schrijf ik u een nieuw gebod: wat waar is in Hem, is ook waar in u; want de duisternis gaat voorbij, en het waarachtige licht schijnt nu.", "Deut 31:9": "En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël.", "Richt 16:28": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.", "Deut 27:13": "En dezen zullen staan voor de vervloeking op de berg Ebal: Ruben, Gad en Aser, Zebulon, Dan en Naftali.", "Joz 20:1-6": "Verder sprak de HEERE tot Jozua en zei: Spreek tot de kinderen van Israël en zeg: Geef voor u de vrijsteden aan, waarvan Ik met u gesproken heb door de dienst van Mozes. Zodat daarheen kan vluchten de doodslager, die iemand door een vergissing, niet met opzet, doodt; opdat zij u tot een toevlucht zijn voor de bloedwreker.", "Num 31:1": "En de HEERE sprak tot Mozes en zei:", "Job 27:17": "Hij zal ze bereiden, maar de rechtvaardige zal ze aantrekken, en de onschuldige zal het zilver delen.", "Ex 8:5": "Verder zei de HEERE tegen Mozes: Zeg tegen Aäron: Strek uw hand uit met uw staf, over de stromen, en over de rivieren, en over de poelen; en laat kikkers opkomen over Egypteland.", "2 Kron 20:13": "En heel Juda stond voor het aangezicht van de HEERE, ook hun kinderen, hun vrouwen en hun zonen.", "Deut 21:10": "Wanneer u uittrekt ten strijde tegen uw vijanden, en de HEERE, uw God, hen in uw hand gegeven heeft, zodat u hun gevangenen gevankelijk wegvoert;", "Joh 20:31": "maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam.", "Amos 2:14-16": "Zodat de snelle niet zal ontvlieden, en de sterke zijn kracht niet zal versterken, en een held zijn ziel niet zal bevrijden. En die de boog hanteert, zal niet bestaan, en die licht is op zijn voeten, zal zich niet bevrijden; ook zal, die te paard rijdt, zijn ziel niet bevrijden. En de kloekhartigste onder de helden zal op die dag naakt heenvlieden, spreekt de HEERE.", "Ps 119:165": "Die Uw wet beminnen, hebben grote vrede, en zij hebben geen aanstoot.", "Joz 11:11-23": "En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur. En Jozua nam al de steden van deze koningen in, en al hun koningen, en hij sloeg hen met de scherpte van het zwaard, hen met de ban treffend, zoals Mozes, de dienaar van de HEERE, geboden had. Alleen verbrandden de Israëlieten geen steden die op hun heuvels stonden, behalve Hazor alleen; dat verbrandde Jozua.", "Ps 119:61": "De goddeloze hopen hebben mij beroofd; nochtans heb ik Uw wet niet vergeten.", "Luk 16:17": "En het is lichter dat de hemel en de aarde voorbijgaan, dan dat één tittel van de wet valt.", "1 Joh 1:5": "En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is.", "2 Petr 3:10": "Maar de dag van de Heere zal komen als een dief in de nacht; op die dag zullen de hemelen met een enorm gedruis voorbijgaan, en de elementen zullen brandend vergaan, en de aarde en de werken die daarop zijn, zullen verbranden.", "Jer 17:18": "Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen de dag van het kwaad, en verbreek hen met een dubbele verbreking.", "Deut 27:5": "en u zult daar de HEERE, uw God, een altaar bouwen, een altaar van stenen; u zult er geen ijzer over bewegen.", "Ps 109:29": "Laat mijn tegenstanders met schande bekleed worden, en laat hen zich met hun schande bedekken, als met een mantel.", "Ps 119:12": "HEERE! U bent gezegend; leer mij Uw inzettingen.", "Ps 69:29": "Laat hen uitgedelgd worden uit het boek van het leven, en met de rechtvaardigen niet aangeschreven worden.", "Jer 22:4": "Want als u deze zaak ernstig zult doen, dan zullen door de poorten van dit huis koningen binnengaan, zittend op de troon van David, rijdend op wagens en op paarden, hij, en zijn dienaren, en zijn volk.", "2 Kron 20:22": "Toen zij nu begonnen met vreugdegeroep en lofzang, stelde de HEERE hinderlagen tegen de kinderen van Ammon, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden verslagen.", "Ps 39:7": "Zeker, de mens wandelt als in een beeld, zeker, zij maken zich druk voor niets; men brengt bijeen, en men weet niet, wie het naar zich toe zal halen.", "Jes 28:13": "Zo zal het woord van de HEERE voor hen zijn: gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig; opdat zij heengaan, en achterwaarts vallen, en gebroken, en verstrikt en gevangen worden.", "Lev 26:7": "En u zult uw vijanden vervolgen; en zij zullen voor uw aangezicht door het zwaard vallen.", "Deut 6:4-9": "Hoor, Israël! De HEERE, onze God, is een enig HEERE! Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht. En deze woorden, die ik u heden gebied, zullen in uw hart zijn.", "Deut 11:29": "En het zal gebeuren, als de HEERE, uw God, u zal hebben binnengebracht in het land, waar u naartoe gaat, om dat te erven; dan zult u de zegen uitspreken op de berg Gerizim, en de vloek op de berg Ebal.", "Ps 78:1": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond.", "Deut 20:13": "En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard;", "Gal 1:11": "Maar ik maak u bekend, broeders, dat het Evangelie dat door mij verkondigd is, niet naar de mens is.", "1 Kor 15:3": "Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften;", "Hand 5:9": "En Petrus zei tot haar: Wat is het, dat u onderling hebt afgesproken om de Geest van de Heere te verzoeken? Zie, de voeten van hen die uw man begraven hebben, zijn voor de deur, en zullen u uitdragen.", "Jes 15:1": "De last die op Moab rust. Zeker, in de nacht is Ar-Moab verwoest, zij is uitgeroeid; zeker, in de nacht is Kir-Moab verwoest, zij is uitgeroeid!", "1 Sam 27:8-11": "David nu trok op met zijn mannen, en zij overvielen de Gesurieten, en de Girzieten, en de Amalekieten (want dezen zijn van oude tijden af de inwoners van het land geweest), op de weg naar Sur, tot aan Egypteland. En David sloeg dat land, en liet geen man en geen vrouw in leven; ook nam hij de schapen en runderen, en de ezels, en kamelen, en kleren, en keerde terug en kwam bij Achis. Toen Achis zei: Waar zijn u vandaag ingevallen? zei David: Tegen het zuiden van Juda, en tegen het zuiden van de Jerahmeelieten, en tegen het zuiden van de Kenieten.", "Ps 85:9": "Ik zal horen wat God, de HEERE, spreken zal; want Hij zal tot Zijn volk en tot Zijn gunstgenoten van vrede spreken; maar laat hen niet weer tot dwaasheid terugkeren.", "Gen 12:7": "Toen verscheen de HEERE aan Abram, en zei: Aan uw nageslacht zal Ik dit land geven. Toen bouwde hij daar een altaar voor de HEERE, Die hem verschenen was.", "1 Tess 1:8": "Want vanuit u heeft het Woord van de Heere weerklonken, niet alleen in Macedonië en Achaje; maar ook op elke plaats is uw geloof, dat u op God hebt, bekend geworden, zodat wij het niet nodig hebben daar iets over te zeggen.", "2 Petr 3:2": "Opdat u de woorden gedenkt die van tevoren gesproken zijn door de heilige profeten, en het gebod van ons, de apostelen van de Heere en Zaligmaker;", "Ps 119:72": "De wet van Uw mond is mij beter, dan duizenden van goud of zilver.", "1 Kor 7:6": "Maar dit zeg ik als toegeving, niet als bevel.", "Ex 12:26": "En het zal gebeuren, wanneer uw kinderen tegen u zullen zeggen: Wat betekent deze dienst voor u?", "Joz 7:4": "Zo trokken van het volk ongeveer drieduizend man daarheen op; en zij vluchtten voor de mannen van Ai.", "Rom 16:26": "maar nu geopenbaard is, en door de profetische Schriften, naar het bevel van de eeuwige God, tot gehoorzaamheid aan het geloof, onder alle heidenen bekendgemaakt is;", "Jer 17:24-26": "Het zal dan gebeuren, als u vlijtig naar Mij zult horen, spreekt de HEERE, dat u geen last door de poorten van deze stad op de sabbatdag inbrengt, en u de sabbatdag heiligt, dat u geen werk daarop doet; Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid. En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Deut 11:30": "Zijn zij niet aan de overkant van de Jordaan, achter de weg van de ondergang van de zon, in het land van de Kanaänieten, die in het vlakke veld wonen, tegenover Gilgal, bij de eikenbossen van More?", "1 Kron 14:16": "David nu deed zoals God hem geboden had; en zij sloegen het leger van de Filistijnen van Gibeon af tot aan Gezer.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Gen 19:28": "En hij keek uit naar Sodom en Gomorra, en naar het hele land van die vlakte; en hij zag, en zie, er steeg rook op van het land, als de rook van een oven.", "Richt 1:2": "En de HEERE zei: Juda zal optrekken; zie, Ik heb dat land in zijn hand gegeven.", "Hand 20:27": "Want ik heb niet nagelaten u heel de raad van God te verkondigen.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Ps 147:19": "Hij maakt aan Jakob Zijn woorden bekend, aan Israël Zijn inzettingen en Zijn rechten.", "Deut 4:9": "Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.", "Neh 8:19": "En men las uit het wetboek van God, dag na dag, van de eerste dag tot de laatste dag. En zij vierden het feest zeven dagen, en op de achtste dag hielden zij een verbodsdag, naar het voorschrift.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Ps 119:81-83": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt. Mijn ogen zijn bezweken van verlangen naar Uw toezegging, terwijl ik zei: Wanneer zult U mij vertroosten? Want ik ben geworden als een lederen zak in de rook; doch Uw inzettingen heb ik niet vergeten.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "Ps 55:10": "Verslind hen, Heere! verdeel hun tong; want ik zie geweld en twist in de stad.", "2 Kron 13:13": "Maar Jerobeam liet een hinderlaag omtrekken, om van achteren bij hen te komen; zo stonden zij vóór Juda, en de hinderlaag was achter hen.", "Joh 17:19": "En Ik heilig Mijzelf voor hen, opdat ook zij geheiligd mogen zijn in waarheid.", "Deut 27:12": "Dezen zullen staan om het volk te zegenen op de berg Gerizim, wanneer u over de Jordaan gegaan bent: Simeon, en Levi, en Juda, en Issaschar, en Jozef, en Benjamin.", "Deut 11:26-29": "Zie, ik stel u heden voor: zegen en vloek: De zegen, wanneer u zult horen naar de geboden van de HEERE, uw God, die ik u heden gebied; Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Hebr 11:3": "Door het geloof begrijpen wij dat de wereld door het woord van God gemaakt is, zodat de dingen die men ziet niet ontstaan zijn uit dingen die zichtbaar zijn.", "Deut 27:2-6": "Het zal dan gebeuren, op de dag dat u de Jordaan overgestoken bent naar het land dat de HEERE, uw God, u geven zal, dat u grote stenen zult oprichten en ze met kalk bestrijken; en u zult daarop alle woorden van deze wet schrijven, wanneer u overgestoken bent; opdat u komt in het land dat de HEERE, uw God, u geven zal, een land dat overvloeit van melk en honing, zoals de HEERE, de God van uw vaderen, u beloofd heeft. Het zal dan gebeuren, als u over de Jordaan gegaan bent, dat u diezelfde stenen, die ik u vandaag gebied, zult oprichten op de berg Ebal, en u zult ze met kalk bestrijken;", "Ps 119:148": "Mijn ogen komen de nachtwaken voor, om Uw rede te betrachten.", "Matt 15:9": "Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "1 Kor 11:2": "En ik prijs u, broeders, dat u in alles aan mij denkt, en de inzettingen behoudt, zoals ik die u overgegeven heb.", "Jer 18:21-23": "Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd. Laat er een geschrei uit hun huizen gehoord worden, wanneer U snel een bende over hen brengt; omdat zij een kuil gegraven hebben om mij te vangen, en strikken verborgen hebben voor mijn voeten. Doch U, HEERE, weet al hun plannen tegen mij, om mij te doden; maak geen verzoening over hun ongerechtigheid, en delg hun zonde niet uit van voor Uw aangezicht; maar laat hen neergeveld worden voor Uw aangezicht; handel zo met hen, in de tijd van Uw toorn.", "Richt 7:16-23": "En hij deelde de driehonderd man in drie groepen; en hij gaf ieder een bazuin in zijn hand, en lege kruiken, en fakkels in het midden van de kruiken. En hij zei tegen hen: Kijk naar mij en doe hetzelfde; en zie, wanneer ik aan het uiterste van het leger kom, zal het zo zijn: zoals ik zal doen, zo zult u doen. Als ik met de bazuin blaas, ik en allen die met mij zijn, dan zult ook u met de bazuin blazen, rondom het hele leger, en u zult zeggen: Voor de HEERE en voor Gideon!", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Joh 5:39": "Onderzoek de Schriften; want u meent daarin het eeuwige leven te hebben; en die zijn het, die van Mij getuigen.", "Ps 10:2": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben.", "Neh 8:3": "En Ezra, de priester, bracht de wet voor de gemeente, zowel mannen als vrouwen, en allen die het konden begrijpen als zij het hoorden, op de eerste dag van de zevende maand.", "Ex 20:24": "Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen.", "Ex 17:5": "Toen zei de HEERE tegen Mozes: Ga voor het volk uit, en neem enkele van de oudsten van Israël met u mee; en neem uw staf, waarmee u de rivier sloeg, in uw hand, en ga op weg.", "Luk 6:23": "Verblijd u op die dag, en wees vrolijk; want zie, uw loon is groot in de hemel; want hun vaders deden hetzelfde met de profeten.", "Deut 27:2": "Het zal dan gebeuren, op de dag dat u de Jordaan overgestoken bent naar het land dat de HEERE, uw God, u geven zal, dat u grote stenen zult oprichten en ze met kalk bestrijken;", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "2 Petr 3:16": "Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.", "Ps 78:5-8": "Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen; En dat zij hun hoop op God zouden stellen, en Gods daden niet vergeten, maar Zijn geboden bewaren;", "Gen 40:22": "Maar de leider van de bakkers hing hij op, zoals Jozef hun had uitgelegd.", "1 Tim 4:13": "Houd aan met het voorlezen, met het vermanen, met het onderwijzen, totdat ik kom.", "1 Joh 1:4": "En deze dingen schrijven wij u, opdat uw blijdschap vervuld is.", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Ps 119:119": "U doet alle goddelozen van de aarde weg als schuim, daarom heb ik Uw getuigenissen lief.", "Joz 23:2": "Zo riep Jozua heel Israël, hun oudsten, en hun hoofden, en hun rechters, en hun opzichters, en hij zei tegen hen: Ik ben oud geworden, en wel bedaagd;", "Hand 5:21-41": "Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen. Maar toen de dienaars daar kwamen, vonden zij hen niet in de gevangenis, maar keerden terug, en berichtten dit, en zeiden: Wij vonden de kerker met alle zorgvuldigheid gesloten, en de wachters buiten staand voor de deuren; maar toen wij die geopend hadden, vonden wij niemand daarbinnen.", "Deut 29:11": "Uw kinderen, uw vrouwen, en uw vreemdeling, die in het midden van uw kamp is, van uw houthakker tot uw waterputter toe;", "Luk 12:21": "Zo gaat het met wie voor zichzelf schatten verzamelt, en niet rijk is in God.", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Joz 24:24": "En het volk zei tegen Jozua: Wij zullen de HEERE, onze God, dienen, en wij zullen Zijn stem gehoorzamen.", "Kol 1:5": "Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "Zach 8:17": "En denk niet, de een over de ander, kwaad in uw hart; en heb een valse eed niet lief; want al deze dingen zijn wat Ik haat, spreekt de HEERE.", "Deut 4:10": "Denk aan de dag dat u voor de HEERE, uw God, bij Horeb stond, toen de HEERE tegen mij zei: Verzamel dit volk voor Mij, en Ik zal hun Mijn woorden laten horen, die zij zullen leren, om Mij te vrezen al de dagen dat zij op de aardbodem leven, en zij zullen ze hun kinderen leren;", "Ps 119:28": "Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "1 Sam 15:33": "Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.", "Ef 6:1-3": "U kinderen, wees uw ouders gehoorzaam in de Heere; want dat is recht. Eer uw vader en moeder (dat is het eerste gebod met een belofte), opdat het u goed gaat, en u lang leeft op de aarde.", "1 Sam 17:45": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt.", "Hebr 10:7": "Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "1 Joh 2:12": "Ik schrijf u, kinderen, want de zonden zijn u vergeven omwille van Zijn Naam.", "Openb 1:2": "die het woord van God betuigd heeft, en de getuigenis van Jezus Christus, en alles wat hij gezien heeft.", "Deut 2:30": "Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.", "Deut 1:13-15": "Neem voor u wijze, verstandige en ervaren mannen, uit uw stammen, zodat ik hen tot uw hoofden stel. Toen antwoordde u mij, en zei: Dit woord dat u gesproken hebt, is goed om te doen. Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen.", "Ps 35:4": "Laat hen beschaamd worden en te schande, die mijn ziel zoeken; laat hen achterwaarts gedreven worden en schaamrood, die kwaad tegen mij bedenken.", "Openb 19:19-21": "En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers. En het beest werd gegrepen, en met hem de valse profeet, die de tekenen in de tegenwoordigheid van hem gedaan had, waardoor hij verleid had hen die het merkteken van het beest ontvangen hadden, en die zijn beeld aanbaden. Deze twee zijn levend geworpen in de poel van het vuur, die met sulfer brandt. En de overigen werden gedood met het zwaard van Hem Die op het paard zat, dat uit Zijn mond ging; en alle vogels werden verzadigd van hun vlees.", "Ex 13:14-16": "Wanneer het zal gebeuren dat uw zoon u later zal vragen en zegt: Wat is dat, dan moet u tegen hem zeggen: De HEERE heeft ons door een sterke hand uit Egypte, uit het diensthuis, uitgevoerd. Want het gebeurde, toen de farao zich verhardde om ons te laten gaan, dat de HEERE alle eerstgeborenen in Egypteland doodde, van de eerstgeborene van de mens af tot de eerstgeborene van het vee; daarom offer ik aan de HEERE de mannetjes van alles wat de baarmoeder opent; maar alle eerstgeborenen van mijn zonen koop ik vrij. En het zal tot een teken zijn op uw hand, en tot voorhoofdsbanden tussen uw ogen; want de HEERE heeft ons door een sterke hand uit Egypte uitgevoerd.", "Hand 17:11": "En dezen waren edeler dan die te Thessalonica, want zij ontvingen het woord met alle bereidwilligheid, en onderzochten dagelijks de Schriften of deze dingen zo waren.", "1 Petr 2:3": "Als u tenminste geproefd hebt dat de Heere goedertieren is.", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Joz 8:1-19": "Toen zei de HEERE tegen Jozua: Wees niet bang, en wees niet ontmoedigd; neem al het krijgsvolk met u mee, en maak u klaar, trek op naar Ai; zie, Ik heb de koning van Ai, en zijn volk, en zijn stad, en zijn land in uw hand gegeven. U nu zult aan Ai en haar koning doen, zoals u aan Jericho en haar koning gedaan hebt; behalve dat u haar roof en haar vee voor uzelf roven zult; leg een hinderlaag tegen de stad, van achter haar. Toen maakte Jozua zich klaar, en al het krijgsvolk, om op te trekken naar Ai. En Jozua koos dertigduizend mannen, strijdbare helden, en hij stuurde hen 's nachts erop uit,", "Num 31:6": "En Mozes zond hen ten strijde, duizend van elke stam, hen en Pinehas, de zoon van Eleazar, de priester, ten strijde, met de heilige voorwerpen en de trompetten om te schallen in zijn hand.", "Hos 6:5": "Daarom heb Ik hen gehakt door de profeten; Ik heb hen gedood door de woorden van Mijn mond; en uw oordelen zullen voortkomen als het licht.", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "Deut 15:9-11": "Wacht ervoor dat er in uw hart geen verdorven gedachte is, om te zeggen: Het zevende jaar, het jaar van de vrijlating, komt dichtbij; zodat uw oog kwaadaardig is tegen uw broeder die arm is, en dat u hem niets geeft; en hij over u roept tot de HEERE, en er zonde in u is. U zult hem zeker geven, en uw hart zal niet kwaad zijn als u hem geeft; want om deze reden zal de HEERE, uw God, u zegenen in al uw werk, en in alles waar u uw hand aan slaat. Want de arme zal niet ophouden te bestaan in het land; daarom gebied ik u en zeg: U zult uw hand mild opendoen voor uw broeder, voor uw bedrukten en voor uw armen in uw land.", "Deut 30:15-20": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade. Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven. Maar als uw hart zich zal afwenden, en u niet horen zult, en u gedreven wordt om u voor andere goden te buigen, en die te dienen;", "Pred 12:10": "De prediker zocht aangename woorden te vinden, en wat er geschreven is, is recht: woorden van de waarheid.", "Ps 119:93": "Ik zal Uw bevelen in de eeuwigheid niet vergeten, want daardoor hebt U mij levend gemaakt.", "Jer 9:11": "En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner.", "Num 11:27-29": "Toen liep een jongen heen, en berichtte het aan Mozes, en zei: Eldad en Medad profeteren in het leger. En Jozua, de zoon van Nun, de dienaar van Mozes, één van zijn uitgelezen jongemannen, antwoordde en zei: Mijn heer Mozes, verbied hun dat! Maar Mozes zei tegen hem: Bent u ijverzuchtig voor mij? Och, was al het volk van de HEERE maar profeten, zodat de HEERE Zijn Geest over hen zou geven!", "Jes 28:9": "Aan wie zou Hij dan de kennis leren, en aan wie zou Hij het gehoorde te verstaan geven? Aan hen die van de melk gespeend zijn, die van de borsten weggehaald zijn?", "Joz 8:24-26": "En het gebeurde, toen de Israëlieten een einde gemaakt hadden aan het doden van alle inwoners van Ai, op het veld, in de woestijn, waarin zij hen nagejaagd hadden, en dat zij allen door de scherpte van het zwaard gevallen waren, totdat zij allen vernietigd waren; toen keerde heel Israël zich naar Ai, en zij sloegen haar met de scherpte van het zwaard. En het gebeurde dat allen die op die dag vielen, zowel mannen als vrouwen, twaalfduizend waren, allemaal mensen van Ai. Jozua trok zijn hand niet terug, die hij met de speer had uitgestrekt, totdat hij alle inwoners van Ai met de ban had geslagen.", "Deut 31:21": "En het zal gebeuren, wanneer veel kwaad en benauwdheden hen zullen treffen, dan zal dit lied voor hun aangezicht antwoorden tot getuige; want het zal uit de mond van hun nageslacht niet vergeten worden; omdat Ik hun gedachten ken, die het nu al maakt, voordat Ik het breng in het land dat Ik gezworen heb.", "Ezech 3:3": "En Hij zei tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honing, vanwege de zoetheid.", "Joz 1:16": "Toen antwoordden zij Jozua: Alles wat u ons geboden hebt, zullen wij doen, en overal waar u ons zenden zult, zullen wij gaan.", "Ps 119:9": "Beth. Waarmee zal de jongeling zijn pad zuiver houden? Als hij dat houdt naar Uw woord.", "Ps 119:140-144": "Uw woord is zeer gelouterd, en Uw knecht heeft het lief. Ik ben klein en veracht, doch Uw bevelen vergeet ik niet. Uw gerechtigheid is gerechtigheid in eeuwigheid, en Uw wet is de waarheid.", "Deut 13:16": "En al haar buit zult u verzamelen midden op haar straat, en de stad en al haar buit geheel met vuur verbranden voor de HEERE, uw God; en zij zal een puinhoop zijn voor eeuwig, zij zal niet opnieuw gebouwd worden.", "2 Sam 15:32-34": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd. En David zei tegen hem: Als u met mij meegaat, zult u mij tot een last zijn; maar als u teruggaat naar de stad, en tegen Absalom zegt: Uw knecht, ik zal van de koning zijn; ik ben eerder wel de knecht van uw vader geweest, maar nu zal ik uw knecht zijn; dan zou u voor mij de raad van Achitofel teniet doen.", "Joz 7:16": "Toen stond Jozua 's morgens vroeg op, en liet Israël aankomen naar zijn stammen; en de stam van Juda werd aangewezen.", "Deut 2:34": "En wij namen in die tijd al zijn steden in, en wij verbanden alle steden, mannen, en vrouwen, en kinderen; wij lieten niemand overblijven.", "Jer 39:6": "En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda.", "Rom 4:23": "Nu is het niet alleen om zijnentwil geschreven, dat het hem toegerekend is;", "Deut 28:1-68": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.", "Richt 20:29-43": "Toen stelde Israël hinderlagen op tegen Gibea rondom. En de kinderen van Israël trokken op, op de derde dag, tegen de kinderen van Benjamin; en zij schikten de strijd tegen Gibea, zoals de andere keren. Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.", "Ps 25:3": "Gimel. Ja, allen die U verwachten, zullen niet beschaamd worden; zij zullen beschaamd worden, die trouweloos handelen zonder oorzaak.", "Jer 51:12": "Verhef de banier op de muren van Babel, versterk de wacht, stel wachters op, bereid de hinderlagen; want zoals de HEERE heeft voorgenomen, zo heeft Hij gedaan, wat Hij over de inwoners van Babel gesproken heeft.", "Richt 20:31-33": "Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël. Toen zeiden de kinderen van Benjamin: Zij zijn voor ons aangezicht geslagen, zoals eerst; maar de kinderen van Israël zeiden: Laat ons vluchten, en hen van de stad aftrekken naar de wegen. Toen maakten alle mannen van Israël zich op uit hun plaatsen, en schikten de strijd te Baäl-thamar; ook brak Israëls hinderlaag op uit haar plaats, vanuit de open plek bij Gibea.", "Matt 25:34-46": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Micha 2:7": "O u, die het huis van Jakob genoemd wordt! Is de Geest van de HEERE dan verkort? Zijn dat Zijn werken? Doen Mijn woorden geen goed bij wie oprecht wandelt?", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Jes 41:10-16": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid. Zie, zij zullen beschaamd worden en te schande gemaakt, allen die tegen u in woede ontstoken zijn; zij zullen worden als niets, en de mensen die met u twisten, zullen vergaan. U zult hen zoeken, maar zult hen niet vinden, de mensen die met u kijven; zij zullen worden als niets, en de mensen die met u oorlogen, als een nietig ding.", "Joh 15:3": "U bent nu rein om het woord dat Ik tot u gesproken heb.", "Deut 31:28": "Verzamel bij mij alle oudsten van uw stammen, en uw opzichters; opdat ik ten aanhoren van hen deze woorden spreek, en tegen hen de hemel en de aarde tot getuigen neem.", "Hab 2:2": "Toen antwoordde de HEERE mij, en zei: Schrijf het visioen op, en zet het duidelijk op tafels, zodat wie voorbijloopt het kan lezen.", "Joh 17:14": "Ik heb hun Uw woord gegeven; en de wereld heeft hen gehaat, omdat zij niet van de wereld zijn, zoals Ik niet van de wereld ben.", "2 Sam 22:31": "Gods weg is volmaakt; het woord van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Job 22:22": "Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart.", "Dan 2:37": "U, o koning, bent een koning der koningen; want de God van de hemel heeft u een koninkrijk, macht, sterkte en eer gegeven;", "Gal 1:8": "Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "2 Kon 19:25": "Hebt u niet gehoord dat Ik dit lang van tevoren gedaan heb, en het van oude dagen af gevormd heb? Nu heb Ik het laten komen, dat u de versterkte steden zou verstoren tot puinhopen.", "Deut 27:4-7": "Het zal dan gebeuren, als u over de Jordaan gegaan bent, dat u diezelfde stenen, die ik u vandaag gebied, zult oprichten op de berg Ebal, en u zult ze met kalk bestrijken; en u zult daar de HEERE, uw God, een altaar bouwen, een altaar van stenen; u zult er geen ijzer over bewegen. Van gehele stenen zult u het altaar van de HEERE, uw God, bouwen, en u zult de HEERE, uw God, daarop brandoffers offeren.", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Ps 54:7": "Hij zal dit kwaad aan mijn belagers vergelden; roei hen uit door Uw waarheid.", "Ps 119:138": "U hebt de gerechtigheid van Uw getuigenissen, en de waarheid ten zeerste geboden.", "Deut 17:18": "Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;", "Richt 9:44": "Want Abimelech en de groep die bij hem was overvielen hen, en bleven staan bij de ingang van de stadspoort; en de twee andere groepen overvielen allen die in het veld waren, en sloegen hen.", "Ps 70:4": "Laat hen terugkeren tot loon van hun beschaming, die daar zeggen: Ha, ha!", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "2 Tim 4:15": "Wees ook u voor hem op uw hoede, want hij heeft onze woorden sterk tegengestaan.", "Luk 6:22": "Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen.", "1 Kon 18:31": "En Elia nam twaalf stenen, naar het getal van de stammen van de kinderen van Jakob, tot wie het woord van de HEERE gekomen was: Israël zal uw naam zijn.", "Jes 8:16": "Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.", "Ps 119:111": "Ik heb Uw getuigenissen genomen tot een eeuwige erve, want zij zijn de vrolijkheid van mijn hart.", "2 Sam 4:12": "En David gaf zijn knechten bevel, en zij doodden hen, en hakten hun handen en hun voeten af, en hingen ze op bij de vijver te Hebron; maar het hoofd van Isboseth namen zij en begroeven het in Abners graf te Hebron.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "Deut 6:3": "Hoor dan, Israël! en let erop dat u ze doet, opdat het u goed gaat, en opdat u zeer vermenigvuldigt (zoals de HEERE, de God van uw vaderen, u gesproken heeft) in het land, dat overvloeit van melk en honing.", "Ex 12:27": "Dan zult u zeggen: Dit is voor de HEERE een paasoffer, Die voor de huizen van de kinderen van Israël voorbijging in Egypte, toen Hij de Egyptenaren sloeg, en onze huizen bevrijdde! Toen boog het volk zich en aanbad.", "Ps 119:157-163": "Mijn vervolgers en mijn tegenstanders zijn vele, maar van Uw getuigenissen wijk ik niet. Ik heb gezien degenen, die trouweloos handelen, en het verdroot mij, dat zij Uw woord niet onderhielden. Zie aan, dat ik Uw bevelen liefheb, o HEERE! maak mij levend naar Uw goedertierenheid.", "Jes 19:11-13": "Zeker, de vorsten van Zoan zijn dwazen, de raad van de wijzen, van de raadgevers van Farao, is redeloos geworden; hoe kunt u dan tegen Farao zeggen: Ik ben een zoon van de wijzen, een zoon van de oude koningen? Waar zijn nu uw wijzen? Laat zij u nu te kennen geven of vernemen, wat de HEERE van de heerscharen beraadslaagd heeft tegen Egypte. De vorsten van Zoan zijn zot geworden, de vorsten van Nof zijn bedrogen; zij hebben ook Egypte doen dwalen, tot de uiterste hoek van zijn stammen.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Matt 21:15": "Toen nu de overpriesters en Schriftgeleerden de wonderen zagen die Hij deed, en de kinderen die in de tempel riepen: Hosanna, de Zoon van David!, namen zij dat zeer kwalijk,", "Luk 2:46": "En het gebeurde na drie dagen, dat zij Hem vonden in de tempel, zittend te midden van de leraren, terwijl Hij naar hen luisterde en hun vragen stelde.", "2 Sam 8:2": "Ook sloeg hij de Moabieten, en mat hen met een snoer, en liet hen op de aarde neerliggen; en hij mat met twee snoeren om te doden, en met een vol snoer om in het leven te laten. Zo werden de Moabieten David tot knechten, en zij brachten geschenken.", "Openb 18:9": "En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien;", "Ex 17:11": "En het gebeurde: terwijl Mozes zijn hand ophief, was Israël de sterkste; maar terwijl hij zijn hand neerliet, was Amalek de sterkste.", "Ps 111:8": "Samech. Ze zijn ondersteund voor altijd en in eeuwigheid; Ain. gedaan in waarheid en oprechtheid.", "Ex 24:1": "Daarna zei Hij tegen Mozes: Klim op tot de HEERE, u en Aäron, Nadab en Abihu, en zeventig van de oudsten van Israël; en buig u neer van verre!", "Joz 10:1": "Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren;", "Ps 119:23-25": "Als zelfs de vorsten zittend tegen mij gesproken hebben, heeft Uw knecht Uw inzettingen betracht. Ook zijn Uw getuigenissen mijn vermakingen, en mijn raadslieden. Daleth. Mijn ziel kleeft aan het stof; maak mij levend naar Uw woord.", "2 Kron 35:12": "En zij namen het brandoffer daar af, opdat zij het naar de verdelingen van de vaderlijke huizen, aan het volk geven mochten, om de HEERE te offeren, zoals geschreven is in het boek van Mozes; en zo ook met de runderen.", "Ps 5:11": "Verklaar hen schuldig, o God; laat hen vervallen van hun raadslagen; drijf hen weg om de veelheid van hun overtredingen, want zij zijn opstandig tegen U.", "Ps 69:25": "Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Richt 4:6": "En zij zond heen en riep Barak, de zoon van Abinoam, van Kedes-nafthali; en zij zei tegen hem: Heeft de HEERE, de God van Israël, niet geboden: Ga heen en trek op naar de berg Thabor, en neem met u tienduizend man, van de kinderen van Nafthali en van de kinderen van Zebulon?", "Joz 10:15-40": "Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal. Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda.", "Ps 119:30": "Ik heb gekozen de weg van de waarheid, Uw rechten heb ik mij voorgesteld.", "2 Kor 3:6": "die ons ook bekwaam gemaakt heeft om dienaars te zijn van het Nieuwe Testament, niet van de letter, maar van de Geest; want de letter doodt, maar de Geest maakt levend.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Ps 35:8": "De verwoesting overkomt hem, zodat hij het niet weet, en zijn net, dat hij verborgen heeft, vangt hemzelf; hij valt daarin met verwoesting.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Deut 27:14-26": "En de Levieten zullen zich uitspreken en zeggen tegen alle mannen van Israël, met verheven stem: Vervloekt is de man die een gesneden of gegoten beeld, een gruwel voor de HEERE, een werk van vakmansen handen, maakt en in het verborgene neerzet! En heel het volk zal antwoorden en zeggen: Amen. Vervloekt is hij die zijn vader of zijn moeder veracht! En heel het volk zal zeggen: Amen.", "Ef 3:3-5": "Dat Hij mij door openbaring deze verborgenheid heeft bekendgemaakt (zoals ik met weinig woorden eerder geschreven heb; waaraan u, als u dit leest, mijn inzicht in deze verborgenheid van Christus kunt bemerken), die in andere eeuwen aan de kinderen van de mensen niet bekendgemaakt is, zoals zij nu geopenbaard is aan Zijn heilige apostelen en profeten, door de Geest;", "1 Kor 3:8": "En hij die plant en hij die nat maakt, zijn één; maar ieder zal zijn loon ontvangen naar zijn arbeid.", "Joz 8:32-35": "Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël. En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen. En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.", "Ps 119:151-153": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid. Van oudsher heb ik geweten van Uw getuigenissen, dat U ze in eeuwigheid gegrond hebt. Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Ps 48:6": "Zoals zij het zagen, zo waren zij verwonderd; zij werden verschrikt, zij haastten weg.", "2 Kon 14:6": "maar de kinderen van de moordenaars doodde hij niet; zoals geschreven staat in het wetboek van Mozes, waar de HEERE geboden heeft: De vaders zullen niet gedood worden voor de kinderen, en de kinderen zullen niet gedood worden voor de vaders; maar ieder zal om zijn eigen zonde gedood worden.", "Matt 4:4": "Maar Hij antwoordde en zei: Er is geschreven: De mens zal niet van brood alleen leven, maar van elk woord dat uit de mond van God komt.", "Rom 3:2": "Veel, in alle opzichten; want dit is wel het eerste, dat hun de woorden van God zijn toevertrouwd.", "1 Joh 2:21": "Ik heb u niet geschreven, omdat u de waarheid niet weet, maar omdat u die weet, en omdat geen leugen uit de waarheid is.", "Richt 20:29-33": "Toen stelde Israël hinderlagen op tegen Gibea rondom. En de kinderen van Israël trokken op, op de derde dag, tegen de kinderen van Benjamin; en zij schikten de strijd tegen Gibea, zoals de andere keren. Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.", "Dan 4:31": "Dit woord was nog in de mond van de koning, toen er een stem uit de hemel viel: U, koning Nebukadnezar, wordt gezegd: Het koninkrijk is van u weggegaan.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Spr 3:4": "En vind gunst en goed verstand, in de ogen van God en van de mensen.", "Jes 40:8": "Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "Neh 9:3": "Want toen zij opgestaan waren op hun standplaats, lazen zij in het wetboek van de HEERE, hun God, een vierde deel van de dag; en op een ander vierde deel beleden zij, en aanbaden de HEERE, hun God.", "Ps 119:92": "Indien Uw wet niet was geweest al mijn vermaking, was ik in mijn druk al lang vergaan.", "Rom 9:4": "die Israëlieten zijn, van wie de aanneming tot kinderen is, en de heerlijkheid, en de verbonden, en de wetgeving, en de dienst van God, en de beloften;", "Job 39:26": "Tegen hem ratelt de pijlkoker, het vlammig ijzer van de speer en van de lans.", "Richt 7:5": "En hij liet het volk afgaan naar het water. Toen zei de HEERE tegen Gideon: Ieder die met zijn tong uit het water zal lekken, zoals een hond zou lekken, hem zult u apart zetten; evenzo ieder die op zijn knieën zal bukken om te drinken.", "1 Tess 4:1": "Verder dan, broeders, wij bidden en vermanen u in de Heere Jezus, zoals u van ons ontvangen hebt hoe u moet wandelen en God behagen, dat u daarin meer overvloedig wordt.", "Jer 50:26": "Kom tegen haar aan van het uiterste, open haar schuren, vertreed haar als korenhopen, en verban haar; laat haar geen overblijfsel hebben.", "Hand 12:23": "En meteen sloeg hem een engel van de Heere, omdat hij God de eer niet gaf; en hij werd door de wormen opgegeten, en gaf de geest.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "2 Kon 23:2": "En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was.", "Joh 21:15": "Toen zij dan de maaltijd gehouden hadden, zei Jezus tegen Simon Petrus: Simon, zoon van Jonas, hebt u Mij meer lief dan dezen? Hij zei tegen Hem: Ja, Heere! U weet dat ik U liefheb. Hij zei tegen hem: Weid Mijn lammeren.", "Pred 7:19": "De wijsheid versterkt de wijze meer dan tien heersers die in een stad zijn.", "Joh 17:20": "En Ik bid niet alleen voor dezen, maar ook voor hen die door hun woord in Mij geloven zullen.", "1 Sam 17:41": "De Filistijn ging ook op weg, en kwam dichterbij naar David toe, en zijn schilddrager ging voor hem uit.", "1 Kon 6:7": "Het huis nu werd, toen het gebouwd werd, gebouwd met volmaakte steen, zoals die aangevoerd was; zodat geen hamer, noch bijl, noch enig ijzeren gereedschap gehoord werd in het huis, toen het gebouwd werd.", "Jer 23:36": "Maar de last van de HEERE zult u niet meer noemen; want ieders eigen woord zal hem een last zijn, omdat u de woorden verkeert van de levende God, de HEERE van de heerscharen, onze God.", "Spr 20:7": "De rechtvaardige wandelt steeds in zijn oprechtheid; gelukkig zijn zijn kinderen na hem.", "Ps 119:115": "Wijkt van mij, u boosdoeners! dat ik de geboden van mijn God moge bewaren.", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "Jer 12:3": "Maar U, HEERE, kent mij, U ziet mij, en proeft mijn hart, dat het met U is. Ruk hen uit als schapen ter slachting, en heilig hen tot de dag van de doding.", "Richt 8:21": "Toen zeiden Zebah en Tsalmuna: Sta zelf op en val ons aan, want zoals de man is, zo is zijn kracht. Toen stond Gideon op en doodde Zebah en Tsalmuna, en nam de maantjes die aan de halzen van hun kamelen zaten.", "Job 23:12": "Het gebod van Zijn lippen heb ik ook niet weggedaan; de woorden van Zijn mond heb ik meer weggelegd dan mijn bescheiden deel.", "Mark 10:21": "En Jezus keek hem aan en had hem lief, en zei tegen hem: Eén ding ontbreekt u; ga heen, verkoop alles wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom, neem het kruis op, en volg Mij.", "2 Tim 3:15-17": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is. Heel de Schrift is door God ingegeven, en is nuttig tot lering, tot weerlegging, tot verbetering, tot onderwijzing die in de rechtvaardigheid is; opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "1 Sam 17:6": "En een koperen scheenharnas boven zijn voeten, en een koperen schild tussen zijn schouders.", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Openb 16:14": "Want het zijn geesten van duivelen, die tekenen doen, die uitgaan naar de koningen van de aarde en van de hele wereld, om hen te verzamelen voor de strijd van die grote dag van de Almachtige God.", "Ps 12:7": "De woorden van de HEERE zijn reine woorden, zilver, gelouterd in een aarden smeltkroes, gezuiverd zevenmaal.", "Jer 6:5": "Maakt u op, en laat ons optrekken in de nacht, en haar paleizen verderven!", "Num 31:9-20": "Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit. Verder verbrandden zij al hun steden met hun woonplaatsen, en al hun burchten, met vuur. En zij namen alle buit en alle roof, van mensen en van beesten.", "Joz 8:30-32": "Toen bouwde Jozua een altaar voor de HEERE, de God van Israël, op de berg Ebal; zoals Mozes, de knecht van de HEERE, de kinderen van Israël geboden had, overeenkomstig wat geschreven staat in het wetboek van Mozes: een altaar van gehele stenen, waarover men geen ijzer bewogen had; en daarop offerden zij de HEERE brandoffers; ook offerden zij dankoffers. Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël.", "Joz 6:24": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Ps 107:40": "Hij stort verachting uit over de prinsen, en doet hen dwalen in het woeste, waar geen weg is.", "Ps 1:2": "Maar zijn vreugde is in de wet van de HEERE, en hij overdenkt Zijn wet dag en nacht.", "Jer 11:4": "Dat Ik uw vaderen geboden heb, op de dag dat Ik hen uit Egypteland, uit de ijzeroven, uitvoerde, en Ik zei: Wees Mijn stem gehoorzaam, en doe die, naar alles wat Ik u gebied; zo zult u Mij tot een volk zijn, en Ik zal u tot een God zijn;", "Openb 22:18": "Want ik betuig aan ieder die de woorden van de profetie van dit boek hoort: Als iemand iets aan deze dingen toevoegt, zal God hem de plagen toevoegen die in dit boek geschreven zijn.", "Ps 93:5": "Uw getuigenissen zijn heel betrouwbaar; de heiligheid sierlijk Uw huis, HEERE! tot in lengte van dagen.", "Ps 119:11": "Ik heb Uw rede in mijn hart verborgen, opdat ik tegen U niet zondigen zou.", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "2 Sam 5:25": "En David deed zo, zoals de HEERE hem geboden had; en hij versloeg de Filistijnen van Geba af, tot waar u bij Gezer komt.", "Deut 29:29": "De verborgen dingen zijn voor de HEERE, onze God; maar de geopenbaarde dingen zijn voor ons en voor onze kinderen, tot in eeuwigheid, om al de woorden van deze wet te doen.", "Deut 3:6": "En wij verbanden ze, zoals wij met Sihon, de koning van Hesbon, gedaan hadden, waarbij wij alle steden verbanden: mannen, vrouwen en kinderen.", "2 Tim 2:8": "Houd in gedachtenis dat Jezus Christus uit de doden is opgewekt, Die uit het nageslacht van David is, naar mijn Evangelie;", "Ps 78:8": "En dat zij niet zouden worden zoals hun vaders, een opstandig en weerspannig geslacht; een geslacht dat zijn hart niet richtte, en waarvan de geest niet trouw was met God.", "Joh 10:35": "Als de wet hen goden genoemd heeft, tot wie het woord van God gekomen is, en de Schrift niet gebroken kan worden,", "Dan 8:26": "Het gezicht nu van de avond en de morgen, dat verteld is, is waar; en u, houd dit gezicht geheim, want er zijn nog veel dagen tot die tijd.", "Hand 10:15": "En er kwam opnieuw een stem, voor de tweede keer, tot hem: Wat God gereinigd heeft, moet u niet gewoon noemen.", "1 Tess 5:1-3": "Maar broeders, over de tijden en de gelegenheden hebt u niet nodig dat men u schrijft. Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht. Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Joz 5:14": "En Hij zei: Nee, maar Ik ben de Vorst van het leger van de HEERE: Ik ben nu gekomen! Toen viel Jozua op zijn aangezicht ter aarde en aanbad, en zei tegen Hem: Wat spreekt mijn Heere tegen Zijn knecht?", "Ps 68:2": "God zal opstaan, Zijn vijanden
