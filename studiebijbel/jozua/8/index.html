zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "Ps 143:12": "En roei mijn vijanden uit, om Uw goedertierenheid, en breng hen om, allen die mijn ziel beangstigen; want ik ben Uw knecht.", "Richt 20:32": "Toen zeiden de kinderen van Benjamin: Zij zijn voor ons aangezicht geslagen, zoals eerst; maar de kinderen van Israël zeiden: Laat ons vluchten, en hen van de stad aftrekken naar de wegen.", "Fil 2:16": "Doordat u vasthoudt aan het woord van het leven, mij tot een roem tegen de dag van Christus, dat ik niet tevergeefs gelopen heb, en ook niet tevergeefs gearbeid heb.", "1 Joh 2:7": "Broeders! Ik schrijf u geen nieuw gebod, maar een oud gebod, dat u vanaf het begin gehad hebt; dit oude gebod is het woord, dat u vanaf het begin gehoord hebt.", "Joz 4:10": "De priesters nu, die de ark droegen, stonden midden in de Jordaan, totdat alles volbracht was wat de HEERE Jozua geboden had het volk aan te zeggen, naar alles wat Mozes Jozua geboden had. En het volk haastte zich, en trok over.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Rom 6:17": "Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;", "2 Tim 1:13": "Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "Joz 3:1": "Jozua stond dus 's morgens vroeg op, en zij vertrokken van Sittim en kwamen tot aan de Jordaan, hij en al de kinderen van Israël; en zij overnachtten daar, voordat zij overtrokken.", "Ex 13:9": "En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft.", "Joz 6:3": "U dan allen, die krijgslieden bent, zult rondom de stad gaan, de stad omringend eenmaal; zo zult u doen, zes dagen lang.", "Ps 119:86": "Al Uw geboden zijn waarheid; zij vervolgen mij met leugen, help mij.", "Num 16:25": "Toen stond Mozes op, en ging naar Dathan en Abiram; en achter hem gingen de oudsten van Israël.", "Deut 6:6-9": "En deze woorden, die ik u heden gebied, zullen in uw hart zijn. En u zult ze uw kinderen inscherpen, en daarover spreken, als u in uw huis zit, en als u onderweg bent, en als u neerligt, en als u opstaat. Ook zult u ze als een teken op uw hand binden, en zij zullen u tot voorhoofdsbanden zijn tussen uw ogen.", "Lev 26:3-45": "Als u in Mijn inzettingen wandelt, en Mijn geboden houdt, en die doet; Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen.", "Deut 27:2-8": "Het zal dan gebeuren, op de dag dat u de Jordaan overgestoken bent naar het land dat de HEERE, uw God, u geven zal, dat u grote stenen zult oprichten en ze met kalk bestrijken; en u zult daarop alle woorden van deze wet schrijven, wanneer u overgestoken bent; opdat u komt in het land dat de HEERE, uw God, u geven zal, een land dat overvloeit van melk en honing, zoals de HEERE, de God van uw vaderen, u beloofd heeft. Het zal dan gebeuren, als u over de Jordaan gegaan bent, dat u diezelfde stenen, die ik u vandaag gebied, zult oprichten op de berg Ebal, en u zult ze met kalk bestrijken;", "Joz 11:12": "En Jozua nam al de steden van deze koningen in, en al hun koningen, en hij sloeg hen met de scherpte van het zwaard, hen met de ban treffend, zoals Mozes, de dienaar van de HEERE, geboden had.", "Mark 13:31": "De hemel en de aarde zullen voorbijgaan; maar Mijn woorden zullen geenszins voorbijgaan.", "Deut 4:40": "En u zult Zijn inzettingen en Zijn geboden houden, die ik u vandaag gebied, opdat het u en uw kinderen na u goed gaat, en opdat u de dagen verlengt in het land dat de HEERE, uw God, u geeft, voor altijd.", "Joz 6:6": "Toen riep Jozua, de zoon van Nun, de priesters, en zei tegen hen: Draagt de ark van het verbond, en laat zeven priesters zeven ramsbazuinen dragen, voor de ark van de HEERE.", "1 Tess 1:5": "Want ons Evangelie is bij u niet alleen met woorden gekomen, maar ook met kracht, en met de Heilige Geest, en met veel zekerheid; zoals u weet wat voor mensen wij bij u geweest zijn, ter wille van u.", "Ps 102:19": "Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven;", "2 Sam 17:1": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna.", "Richt 20:31": "Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.", "Openb 2:25-28": "Maar wat u hebt, houd dat vast, totdat Ik zal komen. En wie overwint, en Mijn werken tot het einde toe bewaart, hem zal Ik macht geven over de heidenen; En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Num 24:10": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend!", "Pred 9:16": "Toen zei ik: Wijsheid is beter dan kracht, hoewel de wijsheid van de arme veracht wordt, en zijn woorden niet gehoord worden.", "Num 11:30": "Daarna verzamelde Mozes zich met het leger, hij en de oudsten van Israël.", "Hebr 4:12": "Want het Woord van God is levend en krachtig, en scherper dan enig tweesnijdend zwaard, en gaat door tot de verdeling van ziel en geest, en van de gewrichten en het merg, en is een beoordelaar van de gedachten en overleggingen van het hart.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Matt 25:6": "En te middernacht kwam er een geroep: Zie, de bruidegom komt, ga hem tegemoet!", "Ps 119:76-78": "Laat toch Uw goedertierenheid zijn om mij te troosten, naar Uw toezegging aan Uw knecht. Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking. Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Ps 19:8-12": "De wet van de HEERE is volmaakt, en zet de ziel om; de getuigenis van de HEERE is betrouwbaar, en geeft de eenvoudigen wijsheid. De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen. De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Matt 7:25": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangevallen, en het is niet gevallen, want het was op de steenrots gegrond.", "Ps 109:9-20": "Laat zijn kinderen wezen worden, en zijn vrouw weduwe. En laat zijn kinderen hier en daar omzwerven, en bedelen, en de nooddruft uit hun verwoeste plaatsen zoeken. Laat de schuldeiser aanslaan al wat hij heeft, en laat de vreemden zijn arbeid roven.", "Ps 119:127-131": "Daarom heb ik Uw geboden lief, meer dan goud, ja, meer dan het fijnste goud. Daarom heb ik al Uw bevelen, van alles, voor recht gehouden; maar elk vals pad heb ik gehaat. Pe. Uw getuigenissen zijn wonderbaar, daarom bewaart ze mijn ziel.", "Ps 119:14-16": "Ik ben vrolijker in de weg van Uw getuigenissen, dan over alle rijkdom. Ik zal Uw bevelen overdenken, en op Uw paden letten. Ik zal mijzelf vermaken in Uw inzettingen; Uw woord zal ik niet vergeten.", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "Ps 34:12": "Lamed. Komt, kinderen! Hoort naar mij! Ik zal u de vreze van de HEERE leren.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Num 15:16": "Eén wet en één recht zal er zijn voor u en voor de vreemdeling die bij u als vreemdeling verblijft.", "Joël 2:16": "Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer.", "Ex 19:7": "En Mozes kwam en riep de oudsten van het volk, en legde hun al deze woorden voor, die de HEERE hem geboden had.", "Hebr 12:1": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is;", "Mark 7:7": "Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen;", "Deut 27:5-7": "en u zult daar de HEERE, uw God, een altaar bouwen, een altaar van stenen; u zult er geen ijzer over bewegen. Van gehele stenen zult u het altaar van de HEERE, uw God, bouwen, en u zult de HEERE, uw God, daarop brandoffers offeren. Ook zult u dankoffers offeren, en u zult daar eten en vrolijk zijn voor het aangezicht van de HEERE, uw God.", "Joz 7:26": "En zij richtten over hem een grote steenhoop op, die er tot op deze dag nog is. Zo keerde de HEERE zich af van de gloed van Zijn toorn. Daarom noemde men de naam van die plaats het dal van Achor, tot op deze dag toe.", "Joz 3:14": "En het gebeurde, toen het volk uit zijn tenten vertrok om de Jordaan over te trekken, dat de priesters de ark van het verbond voor het volk uit droegen.", "Joz 6:2": "Toen zei de HEERE tegen Jozua: Zie, Ik heb Jericho met haar koning en strijdbare helden in uw hand gegeven.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Joz 4:18": "En het gebeurde, toen de priesters, die de ark van het verbond van de HEERE droegen, uit het midden van de Jordaan opgeklommen waren, en de voetzolen van de priesters op het droge gezet waren, keerden de wateren van de Jordaan terug naar hun plaats, en stroomden als voorheen over al haar oevers.", "Deut 29:21": "En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "Ex 3:18": "En zij zullen naar uw stem luisteren; en u zult gaan, u en de oudsten van Israël, naar de koning van Egypte, en u zult tegen hem zeggen: De HEERE, de God van de Hebreeën, is ons ontmoet; zo laat ons nu toch gaan, drie dagreizen ver de woestijn in, opdat wij de HEERE, onze God, offeren!", "Dan 2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Richt 20:36": "En de kinderen van Benjamin zagen dat zij geslagen waren; want de mannen van Israël gaven de Benjaminieten plaats, omdat zij vertrouwden op de hinderlaag die zij tegen Gibea gesteld hadden.", "Joh 5:24": "Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort en Hem gelooft Die Mij gezonden heeft, die heeft het eeuwige leven, en komt niet in het oordeel, maar is overgegaan uit de dood in het leven.", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Ps 37:31": "De wet van zijn God is in zijn hart; zijn gangen zullen niet uitglijden.", "Ex 20:3-17": "U zult geen andere goden voor Mijn aangezicht hebben. U zult zich geen gesneden beeld maken, of enige gelijkenis van hetgeen boven in de hemel is, of van hetgeen beneden op de aarde is, of van hetgeen in het water onder de aarde is. U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Jer 23:28": "De profeet, bij wie een droom is, vertelt de droom; en bij wie Mijn woord is, spreekt Mijn woord waarachtig; wat heeft het stro met het koren te maken? spreekt de HEERE.", "1 Kor 10:11": "En al deze dingen zijn hun overkomen tot voorbeelden; en ze zijn beschreven tot waarschuwing voor ons, over wie het einde van de eeuwen gekomen is.", "Job 3:1-10": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Openb 7:14-17": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam. Daarom zijn zij voor de troon van God, en dienen Hem dag en nacht in Zijn tempel; en Die op de troon zit, zal hen overschaduwen. Zij zullen niet meer hongeren, en zullen niet meer dorsten, en de zon zal niet meer op hen vallen, of enige hitte.", "2 Tim 2:15": "Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt.", "Spr 22:6": "Leer de jongen de eerste beginselen naar de eis van zijn weg; ook als hij oud geworden is, zal hij daar niet van afwijken.", "Num 16:15": "Toen ontstak Mozes zeer, en hij zei tegen de HEERE: Zie hun offer niet aan! Ik heb niet één ezel van hen genomen, en niemand van hen kwaad gedaan.", "2 Kon 23:1-3": "Toen zond de koning boden, en tot hem verzamelden zich alle oudsten van Juda en Jeruzalem. En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was. De koning nu stond bij de pilaar, en sloot een verbond voor het aangezicht van de HEERE, om de HEERE na te wandelen, en Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen met heel zijn hart en met heel zijn ziel te houden, om de woorden van dit verbond te bevestigen, die in dit boek geschreven zijn. En heel het volk stond in dit verbond.", "Deut 27:6": "Van gehele stenen zult u het altaar van de HEERE, uw God, bouwen, en u zult de HEERE, uw God, daarop brandoffers offeren.", "Lev 26:8": "Vijf uit u zullen honderd vervolgen, en honderd uit u zullen tienduizend vervolgen; en uw vijanden zullen voor uw aangezicht door het zwaard vallen.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Joz 11:4": "Dezen nu trokken uit, en al hun legers met hen; veel volk, als het zand dat aan de oever van de zee is, in aantal; en heel veel paarden en wagens.", "Ps 78:7": "En dat zij hun hoop op God zouden stellen, en Gods daden niet vergeten, maar Zijn geboden bewaren;", "1 Tess 4:2": "Want u weet, wat bevelen wij u gegeven hebben door de Heere Jezus.", "Ef 6:4": "En u vaders, verwek uw kinderen niet tot toorn, maar voed hen op in de lering en vermaning van de Heere.", "Num 23:7": "Toen begon hij zijn spreuk, en zei: Uit Syrië heeft Balak, de koning van de Moabieten, mij laten halen, van het gebergte in het oosten, en zei: Kom, vervloek Jakob voor mij, en kom, scheld Israël uit!", "Num 31:7-17": "En zij streden tegen de Midianieten, zoals de HEERE Mozes geboden had, en zij doodden alles wat mannelijk was. Daarbij doodden zij, behalve hun overige gesneuvelden, de koningen van de Midianieten: Evi, en Rekem, en Zur, en Hur, en Reba, vijf koningen van de Midianieten; ook doodden zij met het zwaard Bileam, de zoon van Beor. Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit.", "Jes 28:10": "Want het is gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig.", "1 Petr 2:2": "En verlang als pasgeboren kinderen naar de zuivere melk van het Woord, opdat u daardoor mag groeien;", "Joz 7:7": "En Jozua zei: Ach, Heere HEERE! Waarom hebt U dit volk ooit de Jordaan laten oversteken, om ons te geven in de hand van de Amorieten, om ons te vernietigen? Was het toch maar zo dat wij tevreden waren geweest en gebleven waren aan de overkant van de Jordaan!", "2 Kron 15:3": "Israël nu is vele dagen geweest zonder de ware God, en zonder een lerende priester, en zonder de wet.", "1 Kor 2:13": "Die dingen spreken wij ook, niet met woorden die de menselijke wijsheid leert, maar met woorden die de Heilige Geest leert, terwijl wij geestelijke dingen met geestelijke vergelijken.", "Ps 119:54": "Uw inzettingen zijn mij gezangen geweest, ter plaatse van mijn vreemdelingschap.", "Deut 31:26": "Neem dit wetboek, en leg het aan de zijde van de ark van het verbond van de HEERE, uw God, opdat het daar tot getuige zij tegen u.", "Ps 119:89": "Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen.", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "Ps 59:12": "Dood hen niet, opdat mijn volk het niet vergeet; laat hen omzwerven door Uw macht, en werp hen neer, o Heere, ons Schild!", "Ps 46:12": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Joz 11:20": "Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.", "Pred 8:11": "Omdat het oordeel over de boze daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen.", "Ex 17:12": "Maar de handen van Mozes werden zwaar; daarom namen zij een steen, en legden die onder hem, zodat hij daarop kon zitten; en Aäron en Hur ondersteunden zijn handen, de een aan de ene kant, de ander aan de andere kant; zo bleven zijn handen standvastig, totdat de zon onderging.", "Joz 8:4-22": "en gebood hun: Let op, u zult de stad in een hinderlaag lokken van achter de stad; houd u niet al te ver van de stad, en wees allen gereed. Ik nu, en al het volk dat bij mij is, zullen de stad naderen; en het zal gebeuren, wanneer zij ons tegemoet uittrekken zoals eerst, dat wij voor hen zullen vluchten. Laat hen dan achter ons aan komen, totdat wij hen van de stad weggetrokken hebben; want zij zullen zeggen: Zij vluchten voor ons, zoals eerst; zo zullen wij voor hen vluchten.", "2 Kon 8:12": "Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden.", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Hebr 10:28": "Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "Num 22:6-11": "En nu, kom toch, vervloek voor mij dit volk, want het is machtiger dan ik; misschien kan ik het dan verslaan, of uit het land verdrijven; want ik weet dat wie u zegent, gezegend is, en wie u vervloekt, vervloekt is. Toen gingen de oudsten van Moab en de oudsten van Midian, met het loon voor de waarzeggerij in hun hand; zo kwamen zij bij Bileam, en spraken tot hem de woorden van Balak. Hij zei toen tegen hen: Overnacht hier deze nacht, dan zal ik u een antwoord terugbrengen, zoals de HEERE tot mij zal gesproken hebben. Toen bleven de vorsten van Moab bij Bileam.", "Jak 1:18": "Naar Zijn wil heeft Hij ons gebaard door het Woord van de waarheid, opdat wij zouden zijn als eerstelingen van Zijn schepselen.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Matt 12:26": "En als de satan de satan uitwerpt, dan is hij tegen zichzelf verdeeld; hoe zal zijn rijk dan standhouden?", "Ps 147:20": "Zo heeft Hij met geen enkel volk gedaan; en Zijn rechten, die kennen zij niet. Hallelujah!", "2 Petr 3:1": "Deze tweede brief, geliefden, schrijf ik nu aan u; in beide brieven wek ik door herinnering uw oprechte gemoed op;", "Ps 119:31": "Ik kleef vast aan Uw getuigenissen; o HEERE! beschaam mij niet.", "Gen 32:7": "Toen werd Jakob erg bang en benauwd; en hij verdeelde het volk dat bij hem was, en de schapen, en de runderen, en de kamelen, in twee legers;", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "Joz 3:6": "Zo sprak Jozua ook tot de priesters: Neem de ark van het verbond op, en ga voor het volk uit. Zij namen dan de ark van het verbond op, en zij gingen voor het volk uit.", "Ps 33:4": "Want het woord van de HEERE is recht, en al Zijn werk is trouw.", "Neh 8:4": "En hij las eruit voor op het plein dat voor de Waterpoort is, vanaf het morgenlicht tot de middag, ten overstaan van de mannen en vrouwen en hen die het konden begrijpen; en de oren van heel het volk waren gericht op het wetboek.", "Deut 30:11-14": "Want dit gebod, dat ik u heden gebied, dat is voor u niet verborgen, en dat is niet ver weg. Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen?", "Ps 31:18": "HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.", "Ps 140:11": "Vurige kolen moeten op hen geschud worden; Hij doet hen vallen in het vuur, in diepe kuilen, zodat zij niet meer opstaan.", "Ezech 3:10": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren.", "1 Joh 2:14": "Ik heb u geschreven, vaders, want u hebt Hem gekend, Die er vanaf het begin is. Ik heb u geschreven, jongemannen, want u bent sterk, en het Woord van God blijft in u, en u hebt de boze overwonnen.", "Deut 7:2": "en de HEERE, uw God, hen aan u zal hebben overgegeven, zodat u hen verslaat, dan moet u hen helemaal met de ban vernietigen; u zult geen verbond met hen maken, en hun ook niet genadig zijn.", "Spr 1:1": "De spreuken van Salomo, de zoon van David, de koning van Israël,", "Ex 24:14": "En hij zei tegen de oudsten: Blijft u hier voor ons, totdat wij weer tot u komen; en zie, Aäron en Hur zijn bij u; wie een zaak heeft, moet naar hen toe gaan.", "Ps 31:19": "Laat de valse lippen stom worden, die hard spreken tegen de rechtvaardige, in hoogmoed en verachting.", "Luk 4:22": "En zij gaven Hem allen getuigenis, en verwonderden zich over de aangename woorden die uit Zijn mond kwamen; en zeiden: Is dit niet de zoon van Jozef?", "Hebr 1:2": "Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft;", "Luk 4:16": "En Hij kwam in Nazareth, waar Hij was opgevoed, en ging, naar Zijn gewoonte, op de dag van de sabbat naar de synagoge; en stond op om te lezen.", "Job 27:16": "Zo hij zilver opgehoopt zal hebben als stof, en kleding bereid als leem;", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Openb 1:3": "Zalig is hij die leest, en zij die horen de woorden van deze profetie, en die bewaren wat daarin geschreven is; want de tijd is nabij.", "Ef 1:12": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.", "Ps 140:10": "Wat het hoofd betreft van hen die mij omringen, de overlast van hun lippen overdekt hen.", "1 Tess 5:27": "Ik bezweer u bij de Heere, dat deze brief aan alle heilige broeders voorgelezen wordt.", "Joz 8:30-35": "Toen bouwde Jozua een altaar voor de HEERE, de God van Israël, op de berg Ebal; zoals Mozes, de knecht van de HEERE, de kinderen van Israël geboden had, overeenkomstig wat geschreven staat in het wetboek van Mozes: een altaar van gehele stenen, waarover men geen ijzer bewogen had; en daarop offerden zij de HEERE brandoffers; ook offerden zij dankoffers. Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Num 23:8": "Wat zal ik vervloeken, wie God niet vervloekt; en wat zal ik uitschelden, wie de HEERE niet uitscheldt?", "Ex 10:2": "En opdat u voor de oren van uw kinderen en uw kleinkinderen kunt vertellen wat Ik in Egypte gedaan heb, en Mijn tekenen, die Ik onder hen gedaan heb; opdat u weet dat Ik de HEERE ben.", "Joz 23:3": "En u hebt gezien alles, wat de HEERE, uw God, gedaan heeft aan al deze volken voor uw aangezicht; want de HEERE, uw God, Zelf, is het, Die voor u gestreden heeft.", "Ex 17:9": "Mozes zei toen tegen Jozua: Kies mannen voor ons uit, en trek eropuit, strijd tegen Amalek; morgen zal ik op de top van de heuvel staan, met de staf van God in mijn hand.", "Joz 8:3-25": "Toen maakte Jozua zich klaar, en al het krijgsvolk, om op te trekken naar Ai. En Jozua koos dertigduizend mannen, strijdbare helden, en hij stuurde hen 's nachts erop uit, en gebood hun: Let op, u zult de stad in een hinderlaag lokken van achter de stad; houd u niet al te ver van de stad, en wees allen gereed. Ik nu, en al het volk dat bij mij is, zullen de stad naderen; en het zal gebeuren, wanneer zij ons tegemoet uittrekken zoals eerst, dat wij voor hen zullen vluchten.", "Rom 4:24": "Maar ook om onzentwil, aan wie het zal toegerekend worden, namelijk aan hen die geloven in Hem, Die Jezus, onze Heere, uit de doden opgewekt heeft;", "Ps 119:96-100": "In alle volmaaktheid heb ik een einde gezien; maar Uw gebod is zeer wijd. Mem. Hoe lief heb ik Uw wet! Zij is mijn betrachting de hele dag. Zij maakt mij door Uw geboden wijzer, dan mijn vijanden zijn, want zij is in eeuwigheid bij mij.", "Jes 57:8": "En achter de deur en de posten zet u uw gedenkteken; want u wendt u van Mij af, ontdekt uzelf en klimt op; u maakt uw slaapplaats wijd, en sluit een verbond met sommigen van hen; u hebt hun leger lief, in elke plaats die u ziet.", "1 Tim 4:5": "want het wordt geheiligd door het Woord van God en door het gebed.", "Joz 24:25": "Zo sloot Jozua op die dag een verbond met het volk; en hij stelde het hun tot een inzetting en recht te Sichem.", "Lev 4:15": "En de oudsten van de gemeenschap zullen hun handen op het hoofd van de var leggen, voor het aangezicht van de HEERE; en men zal de var slachten voor het aangezicht van de HEERE.", "Hebr 12:2": "Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God.", "1 Tess 2:13": "Daarom danken wij ook God zonder ophouden, dat u, toen u het Woord van de prediking van God van ons ontvangen had, dat aangenomen hebt niet als een woord van mensen, maar (zoals het werkelijk is) als het Woord van God, dat ook werkt in u die gelooft.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Deut 27:7": "Ook zult u dankoffers offeren, en u zult daar eten en vrolijk zijn voor het aangezicht van de HEERE, uw God.", "Luk 17:26-30": "En zoals het gebeurde in de dagen van Noach, zo zal het ook zijn in de dagen van de Zoon des mensen. Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf. Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "Deut 27:11-13": "En Mozes gebood het volk op diezelfde dag: Dezen zullen staan om het volk te zegenen op de berg Gerizim, wanneer u over de Jordaan gegaan bent: Simeon, en Levi, en Juda, en Issaschar, en Jozef, en Benjamin. En dezen zullen staan voor de vervloeking op de berg Ebal: Ruben, Gad en Aser, Zebulon, Dan en Naftali.", "Ps 40:15": "Laat hen samen beschaamd en schaamrood worden, die mijn ziel zoeken om die te vernielen; laat hen achterwaarts gedreven worden, en te schande worden, die lust hebben aan mijn kwaad.", "Matt 21:23": "En toen Hij in de tempel gekomen was, kwamen de overpriesters en de oudsten van het volk naar Hem toe terwijl Hij onderwees, en zeiden: Door welke macht doet U deze dingen? En wie heeft U deze macht gegeven?", "2 Tim 2:9": "waarvoor ik verdrukkingen lijd tot aan boeien toe, als een misdadiger; maar het Woord van God is niet gebonden.", "Matt 16:24-27": "Toen zei Jezus tegen Zijn discipelen: Als iemand achter Mij aan wil komen, laat hij zichzelf verloochenen, en zijn kruis opnemen, en Mij volgen. Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen om Mijnentwil, die zal het vinden. Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Joz 4:1-9": "Het gebeurde nu, toen al het volk geëindigd had over de Jordaan te trekken, dat de HEERE tegen Jozua sprak en zei: Neem u twaalf mannen uit het volk, uit elke stam een man. En gebied hun en zeg: Neem voor u op, van hier uit het midden van de Jordaan, uit de standplaats van de voeten van de priesters, en bereid twaalf stenen, en breng ze met u over, en zet ze neer in het nachtleger, waar u deze nacht zult overnachten.", "Joz 8:33-35": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen. En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat. Er was geen woord van alles wat Mozes geboden had, dat Jozua niet hardop voorlas voor de hele gemeente van Israël, en de vrouwen, en de kleine kinderen, en de vreemdelingen die in hun midden woonden.", "Job 15:25": "Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.", "Joz 7:10-15": "Toen zei de HEERE tegen Jozua: Sta op; waarom ligt u zo neer op uw gezicht? Israël heeft gezondigd; en zij hebben ook Mijn verbond, dat Ik hun geboden had, overtreden; en ook hebben zij van het verbannene genomen, en ook gestolen, en ook gelogen, en hebben het ook onder hun eigen spullen gelegd. Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt.", "Luk 11:28": "Maar Hij zei: Ja, gelukkiger zijn zij die het Woord van God horen, en het bewaren.", "Openb 19:3": "En zij zeiden ten tweeden maal: Halleluja! En haar rook gaat op in alle eeuwigheid.", "Ps 6:11": "Al mijn vijanden zullen zeer beschaamd en verbaasd worden; zij zullen terugkeren, zij zullen in een ogenblik beschaamd worden.", "Joz 10:30-41": "En de HEERE gaf haar ook in de hand van Israël, met haar koning; en hij sloeg haar met de scherpte van het zwaard, en elke ziel die daarin was; hij liet daarin niemand overblijven; en hij deed haar koning zoals hij de koning van Jericho gedaan had. Toen trok Jozua verder, en heel Israël met hem, van Libna naar Lachis; en hij belegerde haar en streed tegen haar. En de HEERE gaf Lachis in de hand van Israël; en hij nam haar in op de tweede dag, en hij sloeg haar met de scherpte van het zwaard, en elke ziel die daarin was, naar alles wat hij Libna gedaan had.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Ps 119:66": "Leer mij een goede zin en wetenschap, want ik heb aan Uw geboden geloofd.", "Ef 5:26": "opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord,", "1 Kron 16:15": "Gedenkt tot in eeuwigheid van Zijn verbond, van het woord dat Hij ingesteld heeft tot in het duizendste geslacht;", "Deut 4:14": "Ook gebood de HEERE mij in diezelfde tijd dat ik u inzettingen en rechten zou leren; opdat u die deed in het land waar u naar toe trekt, om het in bezit te nemen.", "Num 21:24": "Maar Israël sloeg hem met de scherpte van het zwaard, en nam zijn land in erfelijk bezit, van de Arnon af tot de Jabbok toe, tot aan de kinderen van Ammon; want het gebied van de kinderen van Ammon was sterk.", "Dan 2:38": "En overal waar mensenkinderen wonen, heeft Hij de dieren van het veld en de vogels van de hemel in uw hand gegeven; en Hij heeft u aangesteld als heerser over hen allen; u bent dat gouden hoofd.", "2 Tim 4:14": "Alexander, de kopersmid, heeft mij veel kwaad aangedaan; de Heere zal hem vergelden naar zijn werken.", "Mark 4:20": "En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.", "Ps 111:7": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar.", "Richt 20:34-36": "En tienduizend uitgelezen mannen van heel Israël kwamen tegenover Gibea, en de strijd werd zwaar; doch zij wisten niet dat het kwaad hen treffen zou. Toen sloeg de HEERE Benjamin voor Israëls aangezicht; zodat de kinderen van Israël op die dag van Benjamin vijfentwintigduizend en honderd man velden; die allen trokken het zwaard uit. En de kinderen van Benjamin zagen dat zij geslagen waren; want de mannen van Israël gaven de Benjaminieten plaats, omdat zij vertrouwden op de hinderlaag die zij tegen Gibea gesteld hadden.", "Luk 6:48": "Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Gen 32:8": "want hij zei: Als Ezau op het ene leger afkomt en het verslaat, dan zal het overgebleven leger ontkomen.", "Hand 5:10": "En zij viel meteen neer voor zijn voeten, en gaf de geest. En de jongelingen kwamen binnen, vonden haar dood, en droegen haar uit, en begroeven haar bij haar man.", "Est 7:9": "En Charbona, een van de kamerlingen, die voor het aanschijn van de koning stond, zei: Ook zie, de galg, die Haman gemaakt heeft voor Mordechai, die goed voor de koning gesproken heeft, staat bij Hamans huis, vijftig el hoog. Toen zei de koning: Hang hem daaraan.", "Jes 34:16": "Zoek in het boek van de HEERE, en lees; niet één van deze zal ontbreken, de één noch de ander zal men missen; want Mijn mond Zelf heeft het geboden, en Zijn Geest Zelf zal ze samenbrengen.", "Deut 31:12": "verzamel het volk, de mannen, en de vrouwen, en de kinderen, en uw vreemdelingen die in uw poorten zijn; opdat zij horen, en opdat zij leren, en de HEERE, uw God, vrezen, en nauwlettend doen alle woorden van deze wet.", "Deut 25:15": "U zult een volkomen en eerlijk gewicht hebben; u zult een volkomen en eerlijke efa hebben; opdat uw dagen verlengd worden in het land, dat de HEERE, uw God, u geven zal.", "Spr 1:4": "Om de eenvoudigen kloekzinnigheid te geven, de jongeling wetenschap en bedachtzaamheid.", "Ex 24:4": "Mozes nu beschreef al de woorden van de HEERE, en hij maakte zich 's morgens vroeg op, en hij bouwde een altaar onder aan de berg, en twaalf kolommen, naar de twaalf stammen van Israël.", "Zach 7:7": "Zijn dit niet de woorden die de HEERE uitriep door de dienst van de vorige profeten, toen Jeruzalem bewoond en welvarend was, en haar steden rondom haar; en toen het zuiden en de laagte bewoond waren?", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Gen 8:20": "En Noach bouwde de HEERE een altaar; en hij nam van al het reine vee, en van al het rein gevogelte, en offerde brandoffers op dat altaar.", "Neh 8:2-9": "verzamelde het hele volk zich als één man op het plein voor de Waterpoort; en zij zeiden tegen Ezra, de schriftgeleerde, dat hij het boek van de wet van Mozes zou halen, die de HEERE aan Israël geboden had. En Ezra, de priester, bracht de wet voor de gemeente, zowel mannen als vrouwen, en allen die het konden begrijpen als zij het hoorden, op de eerste dag van de zevende maand. En hij las eruit voor op het plein dat voor de Waterpoort is, vanaf het morgenlicht tot de middag, ten overstaan van de mannen en vrouwen en hen die het konden begrijpen; en de oren van heel het volk waren gericht op het wetboek.", "Deut 31:10-12": "En Mozes gebood hun: Aan het einde van elke zeven jaar, op de vastgestelde tijd van het jaar van de vrijlating, op het feest van de loofhutten, wanneer heel Israël zal komen om te verschijnen voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen, zult u deze wet voorlezen voor heel Israël, ten aanhoren van hen; verzamel het volk, de mannen, en de vrouwen, en de kinderen, en uw vreemdelingen die in uw poorten zijn; opdat zij horen, en opdat zij leren, en de HEERE, uw God, vrezen, en nauwlettend doen alle woorden van deze wet.", "Ps 107:20": "Hij zond Zijn woord uit, en genas hen, en rukte hen uit hun kuilen.", "Deut 7:18": "wees niet bevreesd voor hen; denk goed terug aan wat de HEERE, uw God, aan de farao en aan alle Egyptenaren gedaan heeft;", "Gen 14:15": "En hij verdeelde zich tegen hen 's nachts, hij en zijn knechten, en versloeg hen; en hij achtervolgde hen tot Hoba toe, dat ten noorden van Damaskus ligt.", "Matt 11:15": "Wie oren heeft om te horen, die hoort.", "Jes 1:16-20": "Was u, reinig u, doe de boosheid van uw handelingen van voor Mijn ogen weg, houd op met kwaad te doen. Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe. Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Luk 8:11-15": "Dit is nu de gelijkenis: het zaad is het Woord van God. Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden. En zij die op de rots bezaaid worden, zijn zij die, wanneer zij het gehoord hebben, het Woord met vreugde ontvangen; en dezen hebben geen wortel: zij geloven maar voor een tijd, en in de tijd van verzoeking wijken zij af.", "Jer 23:29": "Is Mijn woord niet zo, als een vuur? spreekt de HEERE, en als een hamer, die een steenrots verbrijzelt?", "Hand 23:21": "Geloof hen dan niet; want meer dan veertig mannen van hen leggen hem een hinderlaag, die zichzelf met een vervloeking verbonden hebben om niet te eten of te drinken totdat zij hem gedood zullen hebben; en zij zijn nu gereed en wachten op uw toezegging.", "Jer 17:11": "Zoals een veldhoen eieren verzamelt, maar ze niet uitbroedt, zo is hij die rijkdom verzamelt, maar niet met recht; in de helft van zijn dagen zal hij die moeten verlaten, en in zijn laatste dagen een dwaas zijn.", "1 Kor 7:12": "Maar tegen de anderen zeg ik, niet de Heere: als een broeder een ongelovige vrouw heeft, en zij ermee tevreden is bij hem te wonen, laat hij haar niet verlaten;", "Jes 3:10": "Zegt de rechtvaardige, dat het hem goed zal gaan; dat zij de vrucht van hun werken zullen eten.", "Zach 7:9": "Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander;", "Joz 10:26-28": "En Jozua sloeg hen daarna, en doodde ze, en hing ze aan vijf bomen; en zij hingen aan de bomen tot de avond. En het gebeurde, ten tijde dat de zon onderging, dat Jozua beval dat men hen van de bomen afnam, en zij wierpen hen in de grot, waar zij verborgen geweest waren; en zij legden grote stenen voor de opening van de grot, die daar zijn tot op deze zelfde dag. Op diezelfde dag nam Jozua ook Makkeda in, en sloeg haar met de scherpte van het zwaard; daartoe verbande hij haar koning, hen en elke ziel die daarin was; hij liet niemand overblijven; en hij deed de koning van Makkeda zoals hij de koning van Jericho gedaan had.", "Joz 10:33": "Toen trok Horam, de koning van Gezer, op om Lachis te helpen; maar Jozua sloeg hem en zijn volk, totdat hij hem niemand overliet.", "Ps 119:172-174": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid. Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen. O HEERE! ik verlang naar Uw heil, en Uw wet is al mijn vermaking.", "Jes 34:10": "Het zal 's nachts of overdag niet uitgeblust worden, tot in eeuwigheid zal zijn rook opstijgen; van geslacht tot geslacht zal het woest zijn, tot in alle eeuwigheid zal niemand daar doorheen trekken.", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "Deut 6:18": "En u zult doen, wat recht en goed is in de ogen van de HEERE; opdat het u goed gaat, en dat u erin komt, en het goede land erft, dat de HEERE aan uw vaderen gezworen heeft;", "Ex 15:9": "De vijand zei: Ik zal vervolgen, ik zal achterhalen, ik zal de buit delen, mijn ziel zal van hen vervuld worden, ik zal mijn zwaard trekken, mijn hand zal hen uitroeien.", "2 Kron 13:15": "En de mannen van Juda maakten een alarmgeschreeuw; en het gebeurde, toen de mannen van Juda een alarmgeschreeuw maakten, dat God Jerobeam en heel Israël sloeg vóór Abia en Juda.", "Joz 10:30": "En de HEERE gaf haar ook in de hand van Israël, met haar koning; en hij sloeg haar met de scherpte van het zwaard, en elke ziel die daarin was; hij liet daarin niemand overblijven; en hij deed haar koning zoals hij de koning van Jericho gedaan had.", "Ps 40:9": "Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Ezra 8:21": "Toen riep ik daar een vasten uit bij de rivier Ahava, opdat wij ons zouden verootmoedigen voor het aangezicht van onze God, om van Hem te verzoeken een rechte weg, voor ons, en voor onze kinderen, en voor al onze have.", "Joz 10:28": "Op diezelfde dag nam Jozua ook Makkeda in, en sloeg haar met de scherpte van het zwaard; daartoe verbande hij haar koning, hen en elke ziel die daarin was; hij liet niemand overblijven; en hij deed de koning van Makkeda zoals hij de koning van Jericho gedaan had.", "Joz 4:9": "Jozua richtte ook twaalf stenen op, midden in de Jordaan, op de standplaats van de voeten van de priesters die de ark van het verbond droegen; en zij zijn daar tot op deze dag.", "1 Sam 15:3-9": "Ga nu heen, en sla Amalek, en verban alles wat hij heeft, en verschoon hem niet; maar dood van de man af tot de vrouw toe, van de kinderen tot de zuigelingen, van de ossen tot de schapen, van de kamelen tot de ezels toe. Dit verkondigde Saul aan het volk, en hij telde hen te Telaïm, tweehonderdduizend man van het voetvolk, en tienduizend man van Juda. Toen Saul tot aan de stad Amalek kwam, legde hij een hinderlaag in het dal.", "Num 31:5": "Zo werden geleverd uit de duizenden van Israël, duizend van elke stam, twaalfduizend toegeruste strijders.", "Deut 31:11-13": "wanneer heel Israël zal komen om te verschijnen voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen, zult u deze wet voorlezen voor heel Israël, ten aanhoren van hen; verzamel het volk, de mannen, en de vrouwen, en de kinderen, en uw vreemdelingen die in uw poorten zijn; opdat zij horen, en opdat zij leren, en de HEERE, uw God, vrezen, en nauwlettend doen alle woorden van deze wet. En opdat hun kinderen, die het niet geweten hebben, horen en leren, om de HEERE, uw God, te vrezen, alle dagen dat u leeft op het land waarheen u de Jordaan overtrekt om het te erven.", "Joz 7:2-4": "Toen Jozua mannen zond van Jericho naar Ai, dat bij Beth-aven ligt, ten oosten van Beth-el, sprak hij tot hen: Trek op en verken het land. Die mannen trokken op en verkenden Ai. Daarna keerden zij terug naar Jozua, en zeiden tegen hem: Laat niet het hele volk optrekken; laat er ongeveer tweeduizend man, of ongeveer drieduizend man, optrekken om Ai te verslaan; vermoei daar niet het hele volk mee, want zij zijn met weinigen. Zo trokken van het volk ongeveer drieduizend man daarheen op; en zij vluchtten voor de mannen van Ai.", "Ex 24:3": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen.", "Ps 119:84": "Hoeveel zullen de dagen van Uw knecht zijn? Wanneer zult U recht doen over mijn vervolgers?", "Matt 13:23": "Maar die in de goede aarde bezaaid is, dit is degene die het woord hoort en begrijpt, die ook vrucht draagt en voortbrengt, de een honderdvoud, de ander zestigvoud, en de ander dertigvoud.", "Ps 129:5": "Laat hen beschaamd worden en achteruitgedreven, allen die Sion haten.", "Joz 6:21": "En zij verbanden alles wat in de stad was, van de man tot de vrouw toe, van het kind tot de oude, en tot de os, en het kleinvee, en de ezel, door de scherpte van het zwaard.", "Joz 7:2": "Toen Jozua mannen zond van Jericho naar Ai, dat bij Beth-aven ligt, ten oosten van Beth-el, sprak hij tot hen: Trek op en verken het land. Die mannen trokken op en verkenden Ai.", "1 Petr 1:23-25": "u die opnieuw geboren bent, niet uit vergankelijk, maar uit onvergankelijk zaad, door het levende en eeuwig blijvende Woord van God. Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af; maar het Woord van de Heere blijft in eeuwigheid. En dit is het Woord dat onder u verkondigd is.", "Ps 119:18-20": "Ontdek mijn ogen, dat ik aanschouw de wonderen van Uw wet. Ik ben een vreemdeling op de aarde, verberg Uw geboden voor mij niet. Mijn ziel is verbroken vanwege het verlangen naar Uw oordelen te aller tijd.", "Hebr 11:26": "en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "Joz 23:6": "Zo weest zeer sterk, om te bewaren en om te doen alles, wat geschreven is in het wetboek van Mozes; opdat u daarvan niet afwijkt naar rechts noch naar links;", "Spr 22:21": "om u de zekerheid van de woorden van de waarheid bekend te maken, opdat u de woorden van de waarheid kunt beantwoorden aan hen die u zenden?", "Rom 15:4": "Want al wat vroeger geschreven is, dat is tot onze lering geschreven, opdat wij, door lijdzaamheid en vertroosting van de Schriften, hoop zouden hebben.", "Deut 21:22": "Verder, wanneer iemand een zonde heeft begaan die de doodstraf verdient, zodat hij gedood wordt, en u hem aan het hout hebt opgehangen;", "Deut 29:10-15": "U staat heden allen voor het aangezicht van de HEERE, uw God: uw hoofden van uw stammen, uw oudsten, en uw opzichters, alle mannen van Israël; Uw kinderen, uw vrouwen, en uw vreemdeling, die in het midden van uw kamp is, van uw houthakker tot uw waterputter toe; Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;", "Jes 19:13": "De vorsten van Zoan zijn zot geworden, de vorsten van Nof zijn bedrogen; zij hebben ook Egypte doen dwalen, tot de uiterste hoek van zijn stammen.", "Pred 12:11": "De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.", "Deut 33:11": "Zegen, HEERE! zijn vermogen, en laat U het werk van zijn handen goed bevallen; versla de lenden van hen die tegen hem opstaan en hem haten, zodat zij niet weer opstaan!", "Richt 9:25": "En de burgers van Sichem legden mannen in hinderlaag op de toppen van de bergen, en al wie voorbij hen langs de weg trok, beroofden zij; en het werd Abimelech verteld.", "1 Joh 5:13": "Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Ps 69:28": "Doe misdaad bij hun misdaad, en laat hen niet komen tot Uw gerechtigheid.", "Mark 10:14": "Maar Jezus zag dit, en nam het Hem zeer kwalijk, en zei tegen hen: Laat de kinderen bij Mij komen, en verhinder ze niet; want voor zulke is het Koninkrijk van God.", "Ezech 38:11-22": "en zult zeggen: Ik zal optrekken naar dat dorpland, ik zal komen tot hen die in rust zijn, die veilig wonen, die allemaal wonen zonder muur, en geen grendel of deuren hebben. Om buit te buiten, en om roof te roven; om uw hand te wenden tegen de woeste plaatsen, die nu bewoond zijn, en tegen een volk, dat uit de heidenen verzameld is, dat vee en have verkregen heeft, wonend in het midden van het land. Scheba, en Dedan, en de kooplieden van Tarsis, en al hun jonge leeuwen zullen tegen u zeggen: Komt u, om buit te buiten? Hebt u uw verzameling verzameld, om roof te roven? Om zilver en goud weg te voeren, om vee en have weg te nemen, om een grote buit te buiten?", "Openb 22:12": "En zie, Ik kom haastig, en Mijn loon is met Mij, om ieder te vergelden zoals zijn werk zal zijn.", "Deut 1:21": "Zie, de HEERE, uw God, heeft dat land aan u gegeven; trek op, bezit het erfelijk, zoals de HEERE, de God van uw vaderen, tot u gesproken heeft; wees niet bang, en wees niet ontmoedigd.", "Neh 4:5": "Dek hun ongerechtigheid niet toe, en laat hun zonde niet uitgewist worden van voor Uw aangezicht, want zij hebben U getergd, tegenover de bouwers.", "Jer 20:12": "Gij dan, o HEERE van de heerscharen, Die de rechtvaardige beproeft, Die de nieren en het hart ziet, laat mij Uw wraak op hen zien, want ik heb U mijn rechtszaak voorgelegd.", "Matt 10:32": "Ieder dan die Mij belijden zal voor de mensen, die zal Ik ook belijden voor Mijn Vader, Die in de hemelen is.", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "Ex 19:8": "Toen antwoordde al het volk gezamenlijk en zei: Al wat de HEERE gesproken heeft, zullen wij doen! En Mozes bracht de woorden van het volk terug naar de HEERE.", "Deut 27:3": "en u zult daarop alle woorden van deze wet schrijven, wanneer u overgestoken bent; opdat u komt in het land dat de HEERE, uw God, u geven zal, een land dat overvloeit van melk en honing, zoals de HEERE, de God van uw vaderen, u beloofd heeft.", "Pred 9:12": "Want ook de mens kent zijn tijd niet: zoals de vissen die gevangen worden met een kwaadaardig net, en zoals de vogels die gevangen worden met de strik, zo worden de mensenkinderen verstrikt, op een kwade tijd, wanneer die plotseling over hen valt.", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Hand 21:5": "Toen het nu gebeurde dat wij deze dagen hadden doorgebracht, gingen wij weg en reisden verder; en zij begeleidden ons allen, met vrouwen en kinderen, tot buiten de stad; en wij knielden neer aan de oever en baden.", "Ex 12:21": "Mozes riep dan alle oudsten van Israël, en zei tegen hen: Kiest en neemt lammeren voor uw huisgezinnen, en slacht het pascha.", "Deut 31:19": "En nu, schrijf u dit lied, en leer het de kinderen van Israël; leg het in hun mond; opdat dit lied Mij tot getuige zij tegen de kinderen van Israël.", "Ps 119:109": "Mijn ziel is voortdurend in mijn hand; nochtans vergeet ik Uw wet niet.", "Spr 6:20-23": "Mijn zoon, bewaar het gebod van uw vader, en verlaat de wet van uw moeder niet. Bind ze voortdurend aan uw hart, hecht ze aan uw hals. Als u wandelt, zal dat u leiden; als u neerligt, zal het over u de wacht houden; als u wakker wordt, zal het met u spreken.", "Deut 11:18-21": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen; En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat; En schrijf ze op de posten van uw huis, en aan uw poorten;", "Rom 9:6": "Maar ik zeg dit niet alsof het woord van God vervallen zou zijn; want niet allen die uit Israël zijn, zijn Israël.", "Hebr 4:2": "Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was.", "Ex 18:12": "Toen nam Jethro, de schoonvader van Mozes, voor God een brandoffer en slachtoffers; en Aäron kwam, en al de leiders van Israël, om brood te eten met de schoonvader van Mozes, voor het aangezicht van God.", "Mark 7:9": "En Hij zei tegen hen: U doet inderdaad het gebod van God volledig teniet, opdat u uw overleveringen zou onderhouden.", "Spr 30:5": "Elk woord van God is doorlouterd; Hij is een Schild voor hen die op Hem vertrouwen.", "Ex 13:8-10": "En u moet uw zoon op die dag laten weten en zeggen: Dit doe ik om wat de HEERE mij gedaan heeft, toen ik uit Egypte uittrok. En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft. Houd daarom deze inzetting op de vastgestelde tijd, van jaar tot jaar.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Neh 8:14-19": "En op de tweede dag verzamelden de hoofden van de families van heel het volk, de priesters en de Levieten, zich bij Ezra, de schriftgeleerde, om inzicht te krijgen in de woorden van de wet. En zij vonden in de wet geschreven, dat de HEERE door de hand van Mozes geboden had, dat de kinderen van Israël in loofhutten zouden wonen op het feest in de zevende maand; en dat zij het bekend zouden maken en een boodschap zouden laten doorgaan door al hun steden en in Jeruzalem, en zeggen: Ga het gebergte in, en haal takken van olijfbomen, en takken van andere olieachtige bomen, en takken van mirtebomen, en takken van palmbomen, en takken van andere dichtbebladerde bomen, om loofhutten te maken, zoals er geschreven staat.", "Num 25:4": "En de HEERE zei tot Mozes: Neem alle hoofden van het volk, en hang hen op voor de HEERE tegen de zon, zo zal de gloed van de toorn van de HEERE gekeerd worden van Israël.", "Ps 69:24": "Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.", "Deut 4:6": "Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk!", "Amos 8:11-13": "Zie, de dagen komen, spreekt de Heere HEERE, dat Ik een honger in het land zal zenden; niet een honger naar brood, en geen dorst naar water, maar om de woorden van de HEERE te horen. En zij zullen zwerven van zee tot zee, en van het noorden tot het oosten; zij zullen rondlopen om het woord van de HEERE te zoeken, maar zullen het niet vinden. Op die dag zullen de mooie jonkvrouwen en de jongemannen van dorst versmachten;", "Jer 15:16": "Toen Uw woorden gevonden werden, heb ik ze opgegeten, en Uw woord is mij geweest tot vreugde en tot blijdschap van mijn hart; want ik ben naar Uw Naam genoemd, o HEERE, God van de heerscharen!", "Job 20:5": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik?", "2 Petr 1:4": "Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "1 Sam 15:2": "Zo zegt de HEERE van de heerscharen: Ik heb bezocht wat Amalek aan Israël gedaan heeft, hoe hij zich tegen hem gesteld heeft op de weg, toen hij uit Egypte opkwam.", "Deut 4:2": "U mag aan dit woord, dat ik u gebied, niets toevoegen, en er ook niets van afdoen; opdat u de geboden bewaart van de HEERE, uw God, die ik u gebied.", "Joz 10:27": "En het gebeurde, ten tijde dat de zon onderging, dat Jozua beval dat men hen van de bomen afnam, en zij wierpen hen in de grot, waar zij verborgen geweest waren; en zij legden grote stenen voor de opening van de grot, die daar zijn tot op deze zelfde dag.", "1 Kon 18:32": "En hij bouwde met die stenen het altaar in de Naam van de HEERE; daarna maakte hij een geul rondom het altaar, zo breed als voor twee maten zaaigoed nodig is.", "Luk 12:8": "En Ik zeg u: ieder die Mij belijden zal voor de mensen, die zal ook de Zoon des mensen belijden voor de engelen van God.", "Hand 5:17": "En de hogepriester stond op, en allen die met hem waren (dat was de sekte van de Sadduceeën), en werden vervuld met nijd;", "Deut 17:19": "En het moet bij hem blijven, en hij moet daarin lezen al de dagen van zijn leven; opdat hij de HEERE, zijn God, leert vrezen, om al de woorden van deze wet en deze inzettingen te bewaren en te doen;", "Ps 107:19": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Ex 24:5": "En hij zond de jongelingen van de kinderen Israëls, die brandoffers offerden, en de HEERE dankoffers offerden, van jonge ossen.", "Hand 13:27": "Want zij die in Jeruzalem wonen, en hun leiders, hebben Hem niet gekend, en hebben ook de stemmen van de profeten, die elke sabbat gelezen worden, vervuld door Hem te veroordelen;", "2 Tim 3:15": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is.", "Deut 29:10": "U staat heden allen voor het aangezicht van de HEERE, uw God: uw hoofden van uw stammen, uw oudsten, en uw opzichters, alle mannen van Israël;", "Joz 8:3-7": "Toen maakte Jozua zich klaar, en al het krijgsvolk, om op te trekken naar Ai. En Jozua koos dertigduizend mannen, strijdbare helden, en hij stuurde hen 's nachts erop uit, en gebood hun: Let op, u zult de stad in een hinderlaag lokken van achter de stad; houd u niet al te ver van de stad, en wees allen gereed. Ik nu, en al het volk dat bij mij is, zullen de stad naderen; en het zal gebeuren, wanneer zij ons tegemoet uittrekken zoals eerst, dat wij voor hen zullen vluchten.", "Joz 11:10-14": "En Jozua keerde op datzelfde moment terug, en hij nam Hazor in, en haar koning sloeg hij met het zwaard; want Hazor was voorheen het hoofd van al deze koninkrijken. En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur. En Jozua nam al de steden van deze koningen in, en al hun koningen, en hij sloeg hen met de scherpte van het zwaard, hen met de ban treffend, zoals Mozes, de dienaar van de HEERE, geboden had.", "Joh 17:17": "Heilig hen in Uw waarheid; Uw woord is de waarheid.", "Matt 11:13": "Want al de profeten en de wet hebben tot Johannes toe geprofeteerd.", "Matt 13:33": "Een andere gelijkenis sprak Hij tot hen: Het Koninkrijk der hemelen is gelijk aan zuurdesem, die een vrouw nam en verborg in drie maten van het meel, totdat het geheel gezuurd was.", "Lev 26:1-46": "U zult voor uzelf geen afgoden maken; ook geen gesneden beeld of opgericht beeld zult u zich stellen, en geen gebeelde steen zult u in uw land zetten, om u daarvoor te buigen; want Ik ben de HEERE, uw God! Mijn sabbatten zult u houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE! Als u in Mijn inzettingen wandelt, en Mijn geboden houdt, en die doet;", "Jes 17:1": "De last van Damaskus. Zie, Damaskus zal weggenomen worden, zodat het geen stad meer is, maar het zal een vervallen steenhoop zijn.", "Jes 25:2": "Want U hebt van de stad een steenhoop gemaakt; de vaste stad tot een vervallen hoop; het paleis van de vreemdelingen, dat het geen stad meer is, in eeuwigheid zal het niet herbouwd worden.", "Ef 6:17": "En neem de helm van de zaligheid, en het zwaard van de Geest, dat is het Woord van God.", "1 Kor 9:10": "Of zegt Hij dat helemaal om onzentwil? Want om onzentwil is dat geschreven; omdat wie ploegt, moet ploegen op hoop, en wie op hoop dorst, moet ook zijn hoop deelachtig worden.", "Num 31:26": "Neem de som op van de buit die gevangen is, van mensen en van beesten; u en Eleazar, de priester, en de hoofden van de families van de vergadering.", "Hebr 10:36": "Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Lev 24:22": "Eén recht zult u hebben; zo zal het gelden voor de vreemdeling als voor de geboren Israëliet; want Ik ben de HEERE, uw God!", "Ex 12:49": "Eén wet zal er zijn voor de ingeborene, en voor de vreemdeling die als vreemdeling in uw midden verblijft.", "Openb 19:17": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God;", "Spr 3:3": "Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Ex 3:16": "Ga heen, en verzamel de oudsten van Israël, en zeg tegen hen: De HEERE, de God van uw vaderen, is mij verschenen, de God van Abraham, Izak en Jakob, en Hij zei: Ik heb u getrouw bezocht, en gezien wat u in Egypte is aangedaan;", "Joz 18:12": "En hun gebied was aan de kant noordwaarts van de Jordaan; en dit gebied gaat omhoog aan de zijde van Jericho vanuit het noorden, en gaat omhoog door het gebergte westwaarts, en de uiteinden ervan zijn aan de woestijn van Beth-aven.", "1 Tim 6:4": "is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens,", "Deut 22:7": "U zult de moeder zeker laten gaan; maar de jongen mag u voor uzelf nemen; opdat het u goed gaat, en u de dagen verlengt.", "Joz 3:9": "Toen zei Jozua tegen de kinderen van Israël: Kom hier, en hoor de woorden van de HEERE, uw God.", "Joz 7:5": "En de mannen van Ai versloegen van hen ongeveer zesendertig man, en achtervolgden hen vanaf de poort tot Schebarim toe, en versloegen hen bij de afgang. Toen versmolt het hart van het volk, en het werd tot water.", "Deut 11:19": "En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat;", "Ezra 6:18": "En zij stelden de priesters aan in hun onderscheidingen, en de Levieten in hun verdelingen, tot de dienst van God, Die te Jeruzalem is, naar het voorschrift van het boek van Mozes.", "Joz 6:2-5": "Toen zei de HEERE tegen Jozua: Zie, Ik heb Jericho met haar koning en strijdbare helden in uw hand gegeven. U dan allen, die krijgslieden bent, zult rondom de stad gaan, de stad omringend eenmaal; zo zult u doen, zes dagen lang. En zeven priesters zullen zeven ramsbazuinen dragen, voor de ark; en u zult op de zevende dag de stad zevenmaal omgaan; en de priesters zullen met de bazuinen blazen.", "Ps 94:12": "Gelukkig is de man, o HEERE! die Gij tuchtigt, en die Gij leert uit Uw wet,", "Spr 30:6": "Voeg niets toe aan Zijn woorden, opdat Hij u niet bestraft, en u leugenachtig wordt bevonden.", "2 Sam 16:10-12": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd. Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "Jes 55:10": "Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter;", "Neh 12:43": "En zij offerden op die dag grote slachtoffers, en waren vrolijk; want God had hen vrolijk gemaakt met grote vrolijkheid; en ook de vrouwen en de kinderen waren vrolijk; zodat de vrolijkheid van Jeruzalem tot van verre gehoord werd.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Luk 4:17": "En Hem werd het boek van de profeet Jesaja gegeven; en toen Hij het boek opengedaan had, vond Hij de plaats waar geschreven was:", "Gen 12:8": "En hij brak vandaar op naar het gebergte, ten oosten van Beth-el, en hij sloeg zijn tent op, met Beth-el naar het westen, en Ai naar het oosten; en hij bouwde daar een altaar voor de HEERE, en riep de Naam van de HEERE aan.", "Matt 8:26": "En Hij zei tegen hen: Waarom bent u angstig, kleingelovigen? Toen stond Hij op, en bestrafte de winden en de zee; en er kwam een grote stilte.", "Rom 3:1": "Wat is dan het voordeel van de Jood? Of wat is het nut van de besnijdenis?", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "Richt 20:33": "Toen maakten alle mannen van Israël zich op uit hun plaatsen, en schikten de strijd te Baäl-thamar; ook brak Israëls hinderlaag op uit haar plaats, vanuit de open plek bij Gibea.", "Richt 7:6": "Toen was het aantal van hen die met hun hand naar hun mond gelekt hadden, driehonderd man; maar alle overigen van het volk hadden op hun knieën gebukt om water te drinken.", "Richt 20:36-39": "En de kinderen van Benjamin zagen dat zij geslagen waren; want de mannen van Israël gaven de Benjaminieten plaats, omdat zij vertrouwden op de hinderlaag die zij tegen Gibea gesteld hadden. En de hinderlaag haastte zich, en brak voorwaarts naar Gibea toe; ja, de hinderlaag trok recht door, en sloeg de hele stad met de scherpte van het zwaard. En de mannen van Israël hadden een afgesproken teken met de hinderlaag, dat zij een grote verheffing van rook uit de stad zouden laten opgaan.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Richt 21:16-25": "En de oudsten van de vergadering zeiden: Wat zullen wij doen, als het gaat om vrouwen voor hen die overgebleven zijn? Want de vrouwen zijn uit Benjamin uitgeroeid. Verder zeiden zij: De erfenis van hen die ontkomen zijn, is van Benjamin, en er moet geen stam uit Israël weggevaagd worden. Maar wij zullen hun geen vrouwen van onze dochters kunnen geven; want de kinderen van Israël hebben gezworen: Vervloekt is hij die aan de Benjaminieten een vrouw geeft!", "Ps 50:10": "Want al het gedierte van het woud is Mijn, de dieren op duizend bergen.", "Ps 119:33": "He. HEERE! leer mij de weg van Uw inzettingen, en ik zal hem houden tot het einde toe.", "Ps 83:14-18": "Mijn God! Maak hen als een wervelwind, als stoppels voor de wind. Zoals het vuur een woud verbrandt, en zoals de vlam de bergen in brand steekt; vervolg hen zo met Uw onweer, en verschrik hen met Uw storm.", "Ps 109:28": "Laat hen vloeken, maar zegen Ú; laat hen opstaan, maar laat hen beschaamd worden; maar laat Uw knecht zich verblijden.", "Ezra 2:28": "De mannen van Beth-el en Ai, tweehonderddrieëntwintig.", "Deut 31:25": "dat Mozes de Levieten gebood, die de ark van het verbond van de HEERE droegen:", "Jak 1:21-25": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken. En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel;", "Mark 12:24": "En Jezus antwoordde en zei tegen hen: Dwaalt u niet daarom, omdat u de Schriften niet kent, en ook de kracht van God niet?", "Mark 7:13": "Zo maakt u Gods woord krachteloos door uw overlevering, die u heeft ingesteld; en vele dergelijke dingen doet u.", "Ps 79:10": "Waarom zouden de heidenen zeggen: Waar is hun God? Laat de wraak van het vergoten bloed van Uw knechten onder de heidenen voor onze ogen bekend worden.", "Joz 6:12": "Daarna stond Jozua 's morgens vroeg op, en de priesters droegen de ark van de HEERE.", "Neh 8:3-9": "En Ezra, de priester, bracht de wet voor de gemeente, zowel mannen als vrouwen, en allen die het konden begrijpen als zij het hoorden, op de eerste dag van de zevende maand. En hij las eruit voor op het plein dat voor de Waterpoort is, vanaf het morgenlicht tot de middag, ten overstaan van de mannen en vrouwen en hen die het konden begrijpen; en de oren van heel het volk waren gericht op het wetboek. En Ezra, de schriftgeleerde, stond op een hoge houten stoel, die zij voor die gelegenheid gemaakt hadden; en naast hem stonden Mattithja, Sema, Anaja, Uria, Hilkia en Maaseja, aan zijn rechterhand; en aan zijn linkerhand Pedaja, Misael, Malchia, Hasum, Hasbaddana, Zacharja en Mesullam.", "2 Kron 31:16": "(Behalve degenen die opgenomen waren in het geslachtsregister van de mannen, van drie jaar oud en ouder) allen die in het huis van de HEERE gingen, voor het dagelijkse werk op elke dag, voor hun dienst, in hun taken, naar hun verdelingen.", "Hand 13:15": "En na het lezen van de wet en de profeten, zonden de leiders van de synagoge iemand naar hen toe, en zeiden: Mannen broeders, als er enig woord van bemoediging voor het volk in u is, spreek dan.", "Pred 4:17": "Let op uw voet, als u naar het huis van God gaat, en wees liever bereid om te horen, dan om het offer van dwazen te geven; want zij weten niet dat zij kwaad doen.", "Ps 55:16": "Laat de dood hen overvallen als een schuldeiser, laat hen levend in het dodenrijk neerdalen; want boosheden zijn in hun woning, in hun binnenste.", "Ex 17:6": "Zie, Ik zal daar voor u op de rots bij Horeb staan; en u zult op de rots slaan, dan zal er water uit komen, zodat het volk kan drinken. Mozes deed dat voor de ogen van de oudsten van Israël.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Joz 7:9": "Als de Kanaänieten en alle inwoners van het land dit horen, zullen zij ons omsingelen, en onze naam van de aarde uitroeien; wat zult U dan doen voor Uw grote Naam?", "Ps 119:41": "Vau. En dat mij Uw blijken van goedertierenheid overkomen, o HEERE! Uw heil, naar Uw toezegging;", "Deut 27:8": "En u zult op deze stenen alle woorden van deze wet schrijven, die goed uitdrukkend.", "Matt 7:24": "Ieder dan die deze woorden van Mij hoort en ze doet, hem zal Ik vergelijken met een verstandig man, die zijn huis op een steenrots gebouwd heeft;", "Ps 119:103-105": "Hoe zoet zijn Uw redenen voor mijn gehemelte geweest, meer dan honing voor mijn mond! Uit Uw bevelen krijg ik verstand, daarom haat ik alle leugenpaden. Nun. Uw woord is een lamp voor mijn voet, en een licht voor mijn pad.", "Ps 40:16": "Laat hen verwoest worden tot loon van hun beschaming, die van mij zeggen: Ha, ha!", "Luk 6:47": "Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt.", "Jer 49:2": "Daarom, zie, de dagen komen, spreekt de HEERE, dat Ik over Rabba van de kinderen van Ammon een krijgsgeschreeuw zal doen horen, en zij zal tot een woeste hoop worden, en haar onderhorige plaatsen zullen met vuur aangestoken worden; en Israël zal erven van hen die hem geërfd hadden, zegt de HEERE.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "2 Kron 25:4": "Doch hun kinderen doodde hij niet, maar hij deed zoals in de wet, in het boek van Mozes, geschreven is, waar de HEERE geboden heeft en zei: De vaders zullen niet sterven om de kinderen, en de kinderen zullen niet sterven om de vaders; maar ieder zal om zijn eigen zonde sterven.", "Spr 6:20": "Mijn zoon, bewaar het gebod van uw vader, en verlaat de wet van uw moeder niet.", "Deut 5:23": "En het gebeurde, toen u die stem uit het midden van de duisternis hoorde, terwijl de berg van vuur brandde, dat u tot mij naderde, alle hoofden van uw stammen, en uw oudsten,", "Luk 24:45": "Toen opende Hij hun verstand, zodat zij de Schriften begrepen.", "Ex 24:7": "En hij nam het boek van het verbond, en hij las het voor de oren van het volk; en zij zeiden: Al wat de HEERE gesproken heeft, zullen wij doen en gehoorzamen.", "Gen 32:21": "Zo ging dat geschenk voor hem uit; maar hijzelf overnachtte diezelfde nacht in het leger.", "Matt 15:3": "Maar Hij antwoordde en zei tegen hen: Waarom overtreedt u ook het gebod van God, door uw overlevering?", "1 Kor 7:10": "Maar de getrouwden gebied ik niet, maar de Heere, dat de vrouw niet van de man scheidt.", "1 Sam 15:5": "Toen Saul tot aan de stad Amalek kwam, legde hij een hinderlaag in het dal.", "Gal 1:12": "Want ik heb het ook niet van een mens ontvangen, ook niet geleerd, maar door de openbaring van Jezus Christus.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "Ps 35:26": "Laat hen beschaamd worden en samen schaamrood, die zich in mijn kwaad verblijden; laat hen met schaamte en schande bekleed worden, die zich tegen mij groot maken.", "Deut 20:13-18": "En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard; Behalve de vrouwen, en de kinderen, en de dieren, en al wat in de stad zijn zal, alle buit ervan zult u voor uzelf roven; en u zult eten van de buit van uw vijanden, die de HEERE, uw God, u gegeven heeft. Zo zult u aan alle steden doen die zeer ver van u zijn, die niet zijn van de steden van deze volken.", "1 Kron 15:11-15": "En David riep de priesters Zadok en Abjathar, en de Levieten Uriël, Asaja en Joël, Semaja, en Eliël, en Amminadab. En hij zei tegen hen: U bent hoofden van de families onder de Levieten; heilig uzelf, u en uw broers, zodat u de ark van de HEERE, de God van Israël, opbrengt naar de plaats, die ik voor haar bereid heb. Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "Ps 147:15": "Hij zendt Zijn bevel over de aarde; Zijn woord loopt zeer snel.", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "Deut 2:33": "En de HEERE, onze God, gaf hem aan ons over; en wij versloegen hem, en zijn zonen, en al zijn volk.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Joh 6:63": "De Geest is het Die levend maakt; het vlees heeft geen nut. De woorden die Ik tot u spreek, zijn geest en zijn leven.", "Jes 51:7": "Hoor naar Mij, u die de gerechtigheid kent, u volk, in wiens hart Mijn wet is! Vrees niet de smaad van de mens, en voor hun smaadredenen hoeft u niet ontzet te zijn.", "Joz 7:6": "Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd.", "Ps 78:1-7": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Dan 4:25": "Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Deut 29:20": "De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen.", "Ex 20:24-26": "Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen. Maar als u Mij een stenen altaar zult maken, dan zult u dit niet bouwen van gehouwen steen; want als u uw houwijzer daarover heft, zult u het ontheiligen. U zult ook niet met trappen naar Mijn altaar opklimmen, opdat uw schaamte daarover niet ontdekt wordt.", "2 Sam 21:12": "Toen ging David heen, en nam de beenderen van Saul, en de beenderen van Jonathan, zijn zoon, van de burgers van Jabes in Gilead, die ze gestolen hadden van de straat van Beth-San, waar de Filistijnen ze hadden opgehangen, op de dag dat de Filistijnen Saul sloegen op Gilboa.", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "Ps 17:4": "Wat de handelingen van de mensen betreft, ik heb mij, naar het woord van Uw lippen, gewacht voor de paden van de inbreker;", "Luk 16:29": "
