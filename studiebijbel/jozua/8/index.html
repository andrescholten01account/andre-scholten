","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen zei de HEERE tegen Jozua: Wees niet bang, en wees niet ontmoedigd; neem al het krijgsvolk met u mee, en maak u klaar, trek op naar Ai; zie, Ik heb de koning van Ai, en zijn volk, en zijn stad, en zijn land in uw hand gegeven.","2":"U nu zult aan Ai en haar koning doen, zoals u aan Jericho en haar koning gedaan hebt; behalve dat u haar roof en haar vee voor uzelf roven zult; leg een hinderlaag tegen de stad, van achter haar.","3":"Toen maakte Jozua zich klaar, en al het krijgsvolk, om op te trekken naar Ai. En Jozua koos dertigduizend mannen, strijdbare helden, en hij stuurde hen 's nachts erop uit,","4":"en gebood hun: Let op, u zult de stad in een hinderlaag lokken van achter de stad; houd u niet al te ver van de stad, en wees allen gereed.","5":"Ik nu, en al het volk dat bij mij is, zullen de stad naderen; en het zal gebeuren, wanneer zij ons tegemoet uittrekken zoals eerst, dat wij voor hen zullen vluchten.","6":"Laat hen dan achter ons aan komen, totdat wij hen van de stad weggetrokken hebben; want zij zullen zeggen: Zij vluchten voor ons, zoals eerst; zo zullen wij voor hen vluchten.","7":"Dan zult u opstaan uit de hinderlaag, en u zult de stad innemen; want de HEERE, uw God, zal ze in uw hand geven.","8":"En het zal gebeuren, wanneer u de stad ingenomen hebt, dat u de stad met vuur aansteekt; naar het woord van de HEERE zult u doen; kijk, ik heb het u geboden.","9":"Zo stuurde Jozua hen erop uit, en zij gingen naar de hinderlaag, en zij bleven tussen Beth-el en Ai, ten westen van Ai; maar Jozua overnachtte die nacht te midden van het volk.","10":"En Jozua maakte zich 's morgens vroeg op, en hij monsterde het volk; en hij trok op, hij en de oudsten van Israël, voor het volk uit, naar Ai.","11":"Ook trok al het krijgsvolk op dat bij hem was; en zij naderden en kwamen tegenover de stad, en zij legerden zich ten noorden van Ai; en er was een dal tussen hem en Ai.","12":"Hij nam ook omtrent vijfduizend man, en hij legde hen in een hinderlaag tussen Beth-el en Ai, ten westen van de stad.","13":"En zij stelden het volk op, het hele leger dat ten noorden van de stad was, en de hinderlaag lag ten westen van de stad. En Jozua ging die nacht midden in het dal.","14":"En het gebeurde, toen de koning van Ai dat zag, dat zij zich haastten en zich vroeg opmaakten, en de mannen van de stad kwamen naar buiten, Israël tegemoet, ten strijde, hij en al zijn volk, op de vastgestelde tijd, voor het vlakke veld; want hij wist niet dat men hem een hinderlaag had gelegd van achter de stad.","15":"Jozua dan, en heel Israël, deed alsof zij voor hen verslagen werden; en zij vluchtten via de weg naar de woestijn.","16":"Daarom werd al het volk dat in de stad was, samengeroepen om hen na te jagen; en zij joegen Jozua na, en werden van de stad weggetrokken.","17":"En er bleef geen man over in Ai of Beth-el, die niet uittrok, Israël na; en zij lieten de stad openstaan, en joegen Israël achterna.","18":"Toen sprak de HEERE tegen Jozua: Strek de speer uit die in uw hand is, naar Ai, want Ik zal hen in uw hand geven. Toen strekte Jozua de speer die in zijn hand was, naar de stad uit.","19":"Toen kwam de hinderlaag snel omhoog van haar plaats, en zij liepen erheen, zodra hij zijn hand had uitgestrekt, en kwamen bij de stad, en zij namen haar in, en zij haastten zich, en staken de stad in brand.","20":"Toen de mannen van Ai zich omkeerden, zagen zij, en zie, de rook van de stad steeg op naar de hemel; en zij hadden geen mogelijkheid om deze of gene kant op te vluchten; want het volk dat naar de woestijn vluchtte, keerde zich om tegen hen die hen achtervolgden.","21":"En Jozua en heel Israël, ziende dat de hinderlaag de stad had ingenomen, en dat de rook van de stad opsteeg, keerden zich om, en sloegen de mannen van Ai.","22":"Ook kwamen zij die uit de stad kwamen, hun tegemoet, zodat zij midden tussen de Israëlieten waren, dezen van hier en genen van daar; en zij sloegen hen, totdat er niemand van hen overbleef, noch iemand ontkwam.","23":"Doch de koning van Ai grepen zij levend, en zij brachten hem naar Jozua.","24":"En het gebeurde, toen de Israëlieten een einde gemaakt hadden aan het doden van alle inwoners van Ai, op het veld, in de woestijn, waarin zij hen nagejaagd hadden, en dat zij allen door de scherpte van het zwaard gevallen waren, totdat zij allen vernietigd waren; toen keerde heel Israël zich naar Ai, en zij sloegen haar met de scherpte van het zwaard.","25":"En het gebeurde dat allen die op die dag vielen, zowel mannen als vrouwen, twaalfduizend waren, allemaal mensen van Ai.","26":"Jozua trok zijn hand niet terug, die hij met de speer had uitgestrekt, totdat hij alle inwoners van Ai met de ban had geslagen.","27":"Alleen roofden de Israëlieten voor zichzelf het vee en de buit van die stad, naar het woord van de HEERE, dat Hij Jozua geboden had.","28":"Jozua nu verbrandde Ai, en hij maakte het tot een eeuwige puinhoop, tot een verwoesting, tot op deze dag.","29":"En de koning van Ai hing hij aan een paal, tot de avond; en omtrent het ondergaan van de zon gebood Jozua dat men zijn dode lichaam van de paal zou afnemen; en zij wierpen het bij de ingang van de stadspoort, en richtten daarop een grote steenhoop op, die er is tot op deze dag.","30":"Toen bouwde Jozua een altaar voor de HEERE, de God van Israël, op de berg Ebal;","31":"zoals Mozes, de knecht van de HEERE, de kinderen van Israël geboden had, overeenkomstig wat geschreven staat in het wetboek van Mozes: een altaar van gehele stenen, waarover men geen ijzer bewogen had; en daarop offerden zij de HEERE brandoffers; ook offerden zij dankoffers.","32":"Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël.","33":"En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen.","34":"En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.","35":"Er was geen woord van alles wat Mozes geboden had, dat Jozua niet hardop voorlas voor de hele gemeente van Israël, en de vrouwen, en de kleine kinderen, en de vreemdelingen die in hun midden woonden."},"SV":{"1":"Toen zeide de HEERE tot Jozua: Vrees niet, en ontzet u niet; neem met u al het krijgsvolk, en maak u op, trek op naar Ai; zie, Ik heb den koning van Ai, en zijn volk, en zijn stad, en zijn land in uw hand gegeven.","2":"Gij nu zult aan Ai en haar koning doen, gelijk als gij aan Jericho en haar koning gedaan hebt; behalve dat gij haar roof en haar vee voor ulieden roven zult; stel u een achterlage tegen de stad, van achter dezelve.","3":"Toen maakte zich Jozua op, en al het krijgsvolk, om op te trekken naar Ai. En Jozua verkoos dertig duizend mannen, strijdbare helden, en hij zond hen bij nacht uit,","4":"En gebood hun, zeggende: Ziet toe, gijlieden zult der stad lagen leggen van achter de stad; houdt u niet zeer verre van de stad, en weest gij allen bereid.","5":"Ik nu, en al het volk, dat bij mij is, zullen tot de stad naderen; en het zal geschieden, wanneer zij ons tegemoet zullen uitgaan, gelijk als in het eerst, zo zullen wij voor hun aangezicht vlieden.","6":"Laat hen dan uitkomen achter ons, totdat wij hen van de stad aftrekken; want zij zullen zeggen: Zij vlieden voor onze aangezichten, gelijk als in het eerst; zo zullen wij vlieden voor hun aangezichten.","7":"Dan zult gijlieden opstaan uit de achterlage, en gij zult de stad innemen; want de HEERE, uw God, zal ze in uw hand geven.","8":"En het zal geschieden, wanneer gij de stad ingenomen hebt, zo zult gij de stad met vuur aansteken; naar het woord des HEEREN zult gijlieden doen; ziet, ik heb het ulieden geboden.","9":"Alzo zond Jozua hen heen, en zij gingen naar de achterlage, en zij bleven tussen Beth-el en tussen Ai, tegen het westen van Ai; maar Jozua overnachtte dien nacht in het midden des volks.","10":"En Jozua maakte zich des morgens vroeg op, en hij monsterde het volk; en hij trok op, hij en de oudsten van Israël, voor het aangezicht des volks, naar Ai.","11":"Ook trok al het krijgsvolk op, dat bij hem was; en zij naderden en kwamen tegenover de stad, en zij legerden zich tegen het noorden van Ai; en er was een dal tussen hem en tussen Ai.","12":"Hij nam ook omtrent vijf duizend man, en hij stelde hen tot een achterlage tussen Beth-el en tussen Ai, aan het westen der stad.","13":"En zij stelden het volk, het ganse leger, dat aan het noorden der stad was, en zijn lage was aan het westen der stad. En Jozua ging in denzelven nacht in het midden des dals.","14":"En het geschiedde, toen de koning van Ai *dat* zag, zo haastten zij en maakten zich vroeg op, en de mannen der stad kwamen uit, Israël tegemoet, ten strijde, hij en al zijn volk, ter bestemder tijd, voor het vlakke veld; want hij wist niet, dat hem iemand een achterlage leide van achter de stad.","15":"Jozua dan, en gans Israël, werd geslagen voor hun aangezichten; en zij vloden door den weg der woestijn.","16":"Daarom werd samengeroepen al het volk, dat in de stad was, om hen na te jagen; en zij joegen Jozua na, en werden van de stad afgetrokken.","17":"En er werd niet een man overgelaten, in Ai, noch Beth-el, die niet uittrokken, Israël na; en zij lieten de stad openstaan, en joegen Israël achterna.","18":"Toen sprak de HEERE tot Jozua: Strek de spies uit, die in uw hand is, naar Ai, want Ik zal hen in uw hand geven. Toen strekte Jozua de spies, die in zijn hand was, naar de stad aan.","19":"Toen rees de achterlage haastelijk op van haar plaats, en zij liepen toe, met dat hij zijn hand uitgestrekt had, en kwamen aan de stad, en zij namen ze in, en zij haastten zich, en staken de stad aan met vuur.","20":"Als de mannen van Ai zich achterom keerden, zo zagen zij, en ziet, de rook der stad ging op naar den hemel; en zij hadden geen ruimte, om herwaarts of derwaarts te vlieden; want het volk, dat naar de woestijn vluchtte, keerde zich tegen degenen, die *hen* najoegen.","21":"En Jozua en gans Israël, ziende, dat de achterlage de stad ingenomen had, en dat de rook der stad opging, zo keerden zij zich om, en sloegen de mannen van Ai.","22":"Ook kwamen die uit de stad hun tegemoet, zodat zij in het midden der Israëlieten waren, deze van hier en gene van daar; en zij sloegen hen, totdat geen overige onder hen overbleef, noch die ontkwam.","23":"Doch den koning van Ai grepen zij levend, en zij brachten hem tot Jozua.","24":"En het geschiedde, toen de Israëlieten een einde gemaakt hadden van al de inwoners van Ai te doden, op het veld, in de woestijn, in dewelke zij hen nagejaagd hadden, en dat zij allen door de scherpte des zwaards gevallen waren, totdat zij allen vernield waren; zo keerde zich gans Israël naar Ai, en zij sloegen ze met de scherpte des zwaards.","25":"En het geschiedde, dat allen, die te dien dage vielen, zo mannen als vrouwen, waren twaalf duizend, al te zamen lieden van Ai.","26":"Jozua trok ook zijn hand niet terug, die hij met de spies had uitgestrekt, totdat hij al de inwoners van Ai verbannen had.","27":"Alleenlijk roofden de Israëlieten voor zichzelven het vee en den buit derzelver stad, naar het woord des HEEREN, dat Hij Jozua geboden had.","28":"Jozua nu verbrandde Ai, en hij stelde haar tot een eeuwigen hoop, ter verwoesting, tot op dezen dag.","29":"En den koning van Ai hing hij aan een hout, tot aan den avondstond; en omtrent den ondergang der zon gebood Jozua, dat men zijn dood lichaam van het hout afname; en zij wierpen het aan de deur der stadspoort, en richtten daarop een groten steenhoop, zijnde tot op dezen dag.","30":"Toen bouwde Jozua een altaar den HEERE, den God van Israël, op den berg Ebal;","31":"Gelijk als Mozes, de knecht des HEEREN, den kinderen Israëls geboden had, achtereenvolgens hetgeen geschreven is in het wetboek van Mozes: een altaar van gehele stenen, over dewelke men geen ijzer bewogen had; en daarop offerden zij den HEERE brandofferen; ook offerden zij dankofferen.","32":"Aldaar schreef hij ook op stenen een dubbel van de wet van Mozes, hetwelk hij geschreven heeft voor het aangezicht der kinderen Israëls.","33":"En gans Israël met zijn oudsten, en ambtlieden, en zijn rechters, stonden aan deze en aan gene zijde der ark, voor de Levietische priesteren, die de ark des verbonds des HEEREN droegen, zo vreemdelingen als inboorlingen, een helft daarvan tegenover den berg Gerizim, en een helft daarvan tegenover den berg Ebal, gelijk als Mozes, de knecht des HEEREN, bevolen had; om het volk van Israël in het eerst te zegenen.","34":"En daarna las hij overluid al de woorden der wet, de zegening en den vloek, naar alles, wat in het wetboek geschreven staat.","35":"Daar was niet een woord van al hetgeen Mozes geboden had, dat Jozua niet overluid las voor de gehele gemeente van Israël, en de vrouwen, en de kleine kinderen, en de vreemdelingen, die in het midden van hen wandelden."},"KJV":{"1":"And the LORD said unto Joshua, Fear not, neither be thou dismayed: take all the people of war with thee, and arise, go up to Ai: see, I have given into thy hand the king of Ai, and his people, and his city, and his land:","2":"And thou shalt do to Ai and her king as thou didst unto Jericho and her king: only the spoil thereof, and the cattle thereof, shall ye take for a prey unto yourselves: lay thee an ambush for the city behind","3":"So Joshua arose, and all the people of war, to go up against Ai: and Joshua chose out thirty thousand mighty men of valour, and sent them away by night.","4":"And he commanded them, saying, Behold, ye shall lie in wait against the city, *even* behind the city: go not very far from the city, but be ye all ready:","5":"And I, and all the people that *are* with me, will approach unto the city: and it shall come to pass, when they come out against us, as at the first, that we will flee before","6":"(For they will come out after us) till we have drawn them from the city; for they will say, They flee before us, as at the first: therefore we will flee before","7":"Then ye shall rise up from the ambush, and seize upon the city: for the LORD your God will deliver it into your hand.","8":"And it shall be, when ye have taken the city, *that* ye shall set the city on fire: according to the commandment of the LORD shall ye do. See, I have commanded","9":"Joshua therefore sent them forth: and they went to lie in ambush, and abode between Bethel and Ai, on the west side of Ai: but Joshua lodged that night among the people.","10":"And Joshua rose up early in the morning, and numbered the people, and went up, he and the elders of Israel, before the people to Ai.","11":"And all the people, *even the people* of war that *were* with him, went up, and drew nigh, and came before the city, and pitched on the north side of Ai: now *there was* a valley between them and Ai.","12":"And he took about five thousand men, and set them to lie in ambush between Bethel and Ai, on the west side of the city.","13":"And when they had set the people, *even* all the host that *was* on the north of the city, and their liers in wait on the west of the city, Joshua went that night into the midst of the valley.","14":"And it came to pass, when the king of Ai saw *it*, that they hasted and rose up early, and the men of the city went out against Israel to battle, he and all his people, at a time appointed, before the plain; but he wist not that *there were* liers in ambush against him behind the city.","15":"And Joshua and all Israel made as if they were beaten before them, and fled by the way of the wilderness.","16":"And all the people that *were* in Ai were called together to pursue after them: and they pursued after Joshua, and were drawn away from the city.","17":"And there was not a man left in Ai or Bethel, that went not out after Israel: and they left the city open, and pursued after Israel.","18":"And the LORD said unto Joshua, Stretch out the spear that *is* in thy hand toward Ai; for I will give it into thine hand. And Joshua stretched out the spear that *he had* in his hand toward the city.","19":"And the ambush arose quickly out of their place, and they ran as soon as he had stretched out his hand: and they entered into the city, and took it, and hasted and set the city on fire.","20":"And when the men of Ai looked behind them, they saw, and, behold, the smoke of the city ascended up to heaven, and they had no power to flee this way or that way: and the people that fled to the wilderness turned back upon the pursuers.","21":"And when Joshua and all Israel saw that the ambush had taken the city, and that the smoke of the city ascended, then they turned again, and slew the men of Ai.","22":"And the other issued out of the city against them; so they were in the midst of Israel, some on this side, and some on that side: and they smote them, so that they let none of them remain or escape.","23":"And the king of Ai they took alive, and brought him to Joshua.","24":"And it came to pass, when Israel had made an end of slaying all the inhabitants of Ai in the field, in the wilderness wherein they chased them, and when they were all fallen on the edge of the sword, until they were consumed, that all the Israelites returned unto Ai, and smote it with the edge of the sword.","25":"And *so* it was, *that* all that fell that day, both of men and women, *were* twelve thousand, *even* all the men of Ai.","26":"For Joshua drew not his hand back, wherewith he stretched out the spear, until he had utterly destroyed all the inhabitants of Ai.","27":"Only the cattle and the spoil of that city Israel took for a prey unto themselves, according unto the word of the LORD which he commanded Joshua.","28":"And Joshua burnt Ai, and made it an heap for ever, *even* a desolation unto this day.","29":"And the king of Ai he hanged on a tree until eventide: and as soon as the sun was down, Joshua commanded that they should take his carcase down from the tree, and cast it at the entering of the gate of the city, and raise thereon a great heap of stones, *that remaineth* unto this day.","30":"Then Joshua built an altar unto the LORD God of Israel in mount Ebal,","31":"As Moses the servant of the LORD commanded the children of Israel, as it is written in the book of the law of Moses, an altar of whole stones, over which no man hath lift up *any* iron: and they offered thereon burnt offerings unto the LORD, and sacrificed peace offerings.","32":"And he wrote there ata-code=\"H6965\">arise,</span> go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai:</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> into thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and his land:","2":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> to <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> and her <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> as thou <span class=\"wl wl-kjv\" data-code=\"H6213\">didst</span> unto <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho</span> and her <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> only the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H929\">cattle</span> thereof, shall ye take for a <span class=\"wl wl-kjv\" data-code=\"H962\">prey</span> unto yourselves: <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> thee an <span class=\"wl wl-kjv\" data-code=\"H693\">ambush</span> for the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> behind","3":"So <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> to go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai:</span> and <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> chose <span class=\"wl wl-kjv\" data-code=\"H977\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour,</span> and sent them <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> by night.","4":"And he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">Behold,</span> ye shall lie in <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> against the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> even <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> <span class=\"wl wl-kjv\" data-code=\"H7368\">go</span> not <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> but be ye all ready:","5":"And I, and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that are with me, will <span class=\"wl wl-kjv\" data-code=\"H7126\">approach</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and it shall come to pass, when they come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> us, as at the <span class=\"wl wl-kjv\" data-code=\"H7223\">first,</span> that we will <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> before","6":"(For they will come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> us) till we have <span class=\"wl wl-kjv\" data-code=\"H5423\">drawn</span> them from the <span class=\"wl wl-kjv\" data-code=\"H5892\">city;</span> for they will <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> They <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> us, as at the <span class=\"wl wl-kjv\" data-code=\"H7223\">first:</span> therefore we will <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> before","7":"Then ye shall rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> from the <span class=\"wl wl-kjv\" data-code=\"H693\">ambush,</span> and <span class=\"wl wl-kjv\" data-code=\"H3423\">seize</span> upon the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> will <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it into your hand.","8":"And it shall be, when ye have <span class=\"wl wl-kjv\" data-code=\"H8610\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> that ye shall <span class=\"wl wl-kjv\" data-code=\"H3341\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> on <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H6213\">do.</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">See,</span> I have commanded","9":"<span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> therefore sent them <span class=\"wl wl-kjv\" data-code=\"H7971\">forth:</span> and they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to lie in <span class=\"wl wl-kjv\" data-code=\"H3993\">ambush,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> between <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> and <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai,</span> on the west <span class=\"wl wl-kjv\" data-code=\"H3220\">side</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai:</span> but <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H3885\">lodged</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the people.","10":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> he and the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to Ai.","11":"And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> even the people of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> that were with him, went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and drew <span class=\"wl wl-kjv\" data-code=\"H5066\">nigh,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> before the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> on the north <span class=\"wl wl-kjv\" data-code=\"H6828\">side</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai:</span> now there was a <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> between them and Ai.","12":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> about <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> them to lie in <span class=\"wl wl-kjv\" data-code=\"H693\">ambush</span> between <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> and <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai,</span> on the west <span class=\"wl wl-kjv\" data-code=\"H3220\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H5857\">city.</span>","13":"And when they had <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> even all the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> that was on the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and their liers in <span class=\"wl wl-kjv\" data-code=\"H6119\">wait</span> on the <span class=\"wl wl-kjv\" data-code=\"H3220\">west</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> into the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the valley.","14":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> it, that they <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted</span> and rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early,</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> he and all his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> at a time <span class=\"wl wl-kjv\" data-code=\"H4150\">appointed,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H6160\">plain;</span> but he <span class=\"wl wl-kjv\" data-code=\"H3045\">wist</span> not that there were liers in <span class=\"wl wl-kjv\" data-code=\"H693\">ambush</span> against him <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> the city.","15":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> made as if they were <span class=\"wl wl-kjv\" data-code=\"H5060\">beaten</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the wilderness.","16":"And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were in <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> were <span class=\"wl wl-kjv\" data-code=\"H2199\">called</span> together to <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them: and they <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> and were drawn <span class=\"wl wl-kjv\" data-code=\"H5423\">away</span> from the city.","17":"And there was not a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> in <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> or <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> that went not <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">open,</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> after Israel.","18":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> Stretch <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H3591\">spear</span> that is in thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> toward <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai;</span> for I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span> And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H3591\">spear</span> that he had in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> toward the city.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H693\">ambush</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> <span class=\"wl wl-kjv\" data-code=\"H4120\">quickly</span> out of their <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and they <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> as soon as he had stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> it, and <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted</span> and <span class=\"wl wl-kjv\" data-code=\"H3341\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> on fire.","20":"And when the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">looked</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> them, they <span class=\"wl wl-kjv\" data-code=\"H7200\">saw,</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H6227\">smoke</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> ascended <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and they had no <span class=\"wl wl-kjv\" data-code=\"H3027\">power</span> to <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> this way or that <span class=\"wl wl-kjv\" data-code=\"H2008\">way:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> to the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> turned <span class=\"wl wl-kjv\" data-code=\"H2015\">back</span> upon the pursuers.","21":"And when <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that the <span class=\"wl wl-kjv\" data-code=\"H693\">ambush</span> had <span class=\"wl wl-kjv\" data-code=\"H3920\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and that the <span class=\"wl wl-kjv\" data-code=\"H6227\">smoke</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">ascended,</span> then they turned <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of Ai.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H428\">other</span> issued <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> them; so they were in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> some on this side, and some on that side: and they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them, so <span class=\"wl wl-kjv\" data-code=\"H5704\">that</span> they <span class=\"wl wl-kjv\" data-code=\"H7604\">let</span> none of them <span class=\"wl wl-kjv\" data-code=\"H8300\">remain</span> or escape.","23":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> they <span class=\"wl wl-kjv\" data-code=\"H8610\">took</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">alive,</span> and <span class=\"wl wl-kjv\" data-code=\"H7126\">brought</span> him to Joshua.","24":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H2026\">slaying</span> all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> wherein they <span class=\"wl wl-kjv\" data-code=\"H7291\">chased</span> them, and when they were all <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> on the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> until they were <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed,</span> that all the <span class=\"wl wl-kjv\" data-code=\"H3478\">Israelites</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> it with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the sword.","25":"And so it was, that all that <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> both of <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> were <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> even all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of Ai.","26":"For <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">drew</span> not his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">back,</span> wherewith he stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H3591\">spear,</span> until he had utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed</span> all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of Ai.","27":"Only the <span class=\"wl wl-kjv\" data-code=\"H929\">cattle</span> and the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of that <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> took for a <span class=\"wl wl-kjv\" data-code=\"H962\">prey</span> unto themselves, according unto the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> which he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Joshua.","28":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\" /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],

).join('');

function paneelInhoud(n, tab) {

  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
