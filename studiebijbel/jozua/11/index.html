rwijl zij zich gelegerd hadden aan de zee; met alle paarden, de wagens van Farao en zijn ruiters, en zijn leger; bij Pi-hachiroth, voor Baäl-zefon.", "Deut 4:2": "U mag aan dit woord, dat ik u gebied, niets toevoegen, en er ook niets van afdoen; opdat u de geboden bewaart van de HEERE, uw God, die ik u gebied.", "Joz 18:26": "En Mizpe, en Chefira, en Moza,", "Deut 34:2": "En het hele Naftali, en het land van Efraïm en Manasse, en het hele land van Juda, tot aan de verste zee;", "Joz 12:7-24": "Dit zijn nu de koningen van het land, die Jozua versloeg, samen met de kinderen van Israël, aan deze kant van de Jordaan naar het westen, vanaf Baäl-gad in het dal van de Libanon, tot aan de kale berg die naar Seïr toe oploopt; en Jozua gaf het aan de stammen van Israël tot erfelijk bezit, naar hun afdelingen: Wat op het gebergte, en in de laagte, en in de vlakte, en op de hellingen bij de waterbronnen, en in de woestijn, en in het zuiderland lag: de Hethieten, de Amorieten, en Kanaänieten, de Ferezieten, de Hevieten, en de Jebusieten. De koning van Jericho, één; de koning van Ai, dat aan de zijde van Beth-el ligt, één;", "Job 23:14": "Want Hij zal volbrengen wat over mij bepaald is; en dergelijke dingen zijn er veel bij Hem.", "Ps 33:10": "De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.", "Joz 10:1-5": "Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren; Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:", "Deut 20:17": "Maar u zult ze helemaal verbannen: de Hethieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, de Hevieten, en de Jebusieten, zoals de HEERE, uw God, u geboden heeft;", "2 Kron 20:16": "Trek morgen tegen hen af; zie, zij komen op bij de weg naar Ziz; en u zult hen vinden aan het einde van het dal, voor de woestijn van Jeruël.", "Jes 8:9-12": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden! Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons! Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Ps 149:6-9": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand, om wraak te doen over de heidenvolken, en bestraffingen over de volken, om hun koningen te binden met ketenen, en hun aanzienlijken met ijzeren boeien,", "Jer 46:9": "Trekt op, paarden! En raast, wagens! En laat de helden uittrekken: de Moren, en de Puteeërs, die het schild hanteren, en de Lydiërs, die de boog hanteren en spannen.", "Jes 13:3-5": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid. Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger. Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.", "Joz 13:6": "Allen die op het gebergte wonen, van de Libanon af tot Misrefoth-maim toe, alle Sidoniërs; Ik zal hen verdrijven van voor de kinderen van Israël; zorg alleen dat het door het lot aan Israël als erfdeel valt, zoals Ik u geboden heb.", "Joz 8:24": "En het gebeurde, toen de Israëlieten een einde gemaakt hadden aan het doden van alle inwoners van Ai, op het veld, in de woestijn, waarin zij hen nagejaagd hadden, en dat zij allen door de scherpte van het zwaard gevallen waren, totdat zij allen vernietigd waren; toen keerde heel Israël zich naar Ai, en zij sloegen haar met de scherpte van het zwaard.", "Num 34:2-13": "Gebied de kinderen van Israël, en zeg tegen hen: Wanneer u in het land Kanaän komt, dan zal dit het land zijn dat u ter erfenis toevalt, het land Kanaän, met zijn grenzen. De zuiderkant nu zal voor u zijn vanaf de woestijn Zin, langs de zijden van Edom; en de zuidergrens zal voor u zijn vanaf het einde van de Zoutzee, in het oosten; En deze grens zal voor u omgaan van het zuiden naar de opgang van Akrabbim, en doorgaan naar Zin; en haar uiteinden zullen zijn, vanaf het zuiden naar Kades-Barnea; en zij zal uitgaan naar Hazar-Addar, en doorgaan naar Azmon.", "Jer 30:18": "Zo zegt de HEERE: Ziet, Ik zal de gevangenschap van de tenten van Jakob wenden, en Mij ontfermen over hun woningen; en de stad zal herbouwd worden op haar eigen hoop, en het paleis zal staan naar zijn eigen wijze.", "Joz 10:3": "Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:", "1 Kor 2:7": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;", "2 Sam 8:4": "En David nam hem duizend wagens af, en zevenhonderd ruiters, en twintigduizend man voetvolk; en David sneed de pezen door van alle wagenpaarden, en hield daarvan honderd wagens over.", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "1 Kon 12:15": "Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Joh 21:23": "Dit woord ging dan uit onder de broeders, dat deze discipel niet zou sterven. En Jezus had tegen hem niet gezegd dat hij niet zou sterven, maar: Als Ik wil dat hij blijft totdat Ik kom, wat gaat het u aan?", "Ps 46:10": "Die de oorlogen doet ophouden tot aan het einde van de aarde, de boog verbreekt, en de speer in tweeën slaat, de wagens met vuur verbrandt.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "1 Sam 17:4": "Toen ging er een kampvechter uit het leger van de Filistijnen naar buiten; zijn naam was Goliath, uit Gath; zijn hoogte was zes ellen en een span.", "Hand 7:9": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem,", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Gen 32:3": "En Jakob zond boden voor zich uit naar Ezau, zijn broer, naar het land Seir, de landstreek van Edom.", "Nahum 2:3": "De schilden van zijn helden zijn rood gemaakt, de dappere mannen zijn scharlakengekleurd; de wagens zijn in het vuur van de fakkels, ten dage als hij zich klaarmaakt; en de spiesen worden geschud.", "Jes 44:7": "En wie zal, zoals Ik, roepen en het verkondigen, en het op orde voor Mij zetten, sinds Ik een eeuwig volk gesteld heb? En laat ze de toekomstige dingen, en die komen zullen, hun verkondigen.", "2 Kron 26:6": "Want hij trok uit, en streed tegen de Filistijnen, en brak de muur van Gath af, en de muur van Jabne, en de muur van Asdod; daartoe bouwde hij steden in Asdod, en onder de Filistijnen.", "Joz 11:1-5": "Het gebeurde daarna, toen Jabin, de koning van Hazor, dit hoorde, dat hij een boodschap stuurde naar Jobab, de koning van Madon, en naar de koning van Simron, en naar de koning van Achsaf, En naar de koningen die tegen het noorden op het gebergte, en op het vlakke, tegen het zuiden van Cinneroth, en in de laagte, en in Nafoth-dor, aan de zee waren; Tot de Kanaänieten tegen het oosten en tegen het westen, en de Amorieten, en de Hethieten, en de Ferezieten; en de Jebusieten op het gebergte, en de Hevieten onder aan Hermon, in het land van Mizpa.", "Jer 41:14": "En al het volk dat Ismaël van Mizpa gevankelijk had weggevoerd, wendde zich om; en zij keerden zich en gingen over naar Johanan, de zoon van Kareah.", "Ps 27:2": "Toen de bozen, mijn tegenpartijen en mijn vijanden, tegen mij naar mij toe kwamen om mijn vlees te eten, stieten zij zelf aan en vielen.", "Pred 3:10": "Ik heb de bezigheid gezien, die God aan de kinderen van de mensen gegeven heeft, om zichzelf daarmee te bekommeren.", "Joz 22:4": "En nu heeft de HEERE, uw God, uw broeders rust gegeven, zoals Hij hun toegezegd had; keert dan nu terug, en gaat u naar uw tenten, naar het land van uw bezitting, dat Mozes, de dienaar van de HEERE, u gegeven heeft aan de andere zijde van de Jordaan.", "Deut 2:1": "Daarna keerden wij ons, en reisden naar de woestijn, de weg van de Schelfzee, zoals de HEERE tot mij gesproken had, en wij trokken om het gebergte Seir, veel dagen.", "Ps 33:12": "Gelukkig is het volk wiens God de HEERE is; het volk, dat Hij Zich als erfdeel heeft uitgekozen.", "Richt 4:2": "Zo verkocht de HEERE hen in de hand van Jabin, koning van de Kanaänieten, die te Hazor regeerde; en zijn legeraanvoerder was Sisera; hij woonde in Haroseth der heidenen.", "Joz 21:45": "Er viel niet één woord weg van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam allemaal uit.", "Jes 48:15": "Ik, Ik heb het gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn op zijn weg.", "1 Kron 19:7": "zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde.", "Joz 24:12": "En Ik zond horzels voor u uit; die dreven hen voor u weg, zoals de beide koningen van de Amorieten, niet door uw zwaard, en ook niet door uw boog.", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "Nahum 2:4": "De wagens razen door de wijken, zij lopen heen en weer op de straten; hun verschijning is als die van fakkels, zij lopen door elkaar heen als de bliksems.", "2 Kron 16:2-9": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei: Er is een verbond tussen mij en u, en tussen mijn vader en uw vader; zie, ik zend u zilver en goud; ga heen, verbreek uw verbond met Baësa, de koning van Israël, zodat hij van tegen mij aftrekt. En Benhadad hoorde naar de koning Asa, en zond de aanvoerders van de legers die hij had, tegen de steden van Israël, en zij sloegen Ijon, en Dan, en Abel-Maim, en alle schatsteden van Naftali.", "Ps 20:8": "Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Zach 9:2": "En ook zal Hij Hamath ermee grenzen; Tyrus en Sidon, hoewel zij zeer wijs is;", "1 Sam 15:1-3": "Toen zei Samuël tegen Saul: De HEERE heeft mij gezonden om u tot koning te zalven over Zijn volk, over Israël; hoor dan nu naar de stem van de woorden van de HEERE. Zo zegt de HEERE van de heerscharen: Ik heb bezocht wat Amalek aan Israël gedaan heeft, hoe hij zich tegen hem gesteld heeft op de weg, toen hij uit Egypte opkwam. Ga nu heen, en sla Amalek, en verban alles wat hij heeft, en verschoon hem niet; maar dood van de man af tot de vrouw toe, van de kinderen tot de zuigelingen, van de ossen tot de schapen, van de kamelen tot de ezels toe.", "Jes 10:5-7": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "2 Sam 10:15": "Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich weer samen.", "Matt 22:14": "Want velen zijn geroepen, maar weinigen uitverkoren.", "2 Sam 10:6": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Joz 11:15-18": "Zoals de HEERE Mozes, Zijn dienaar, geboden had, zo gebood Mozes aan Jozua; en zo deed Jozua; hij liet niets achterwege van alles wat de HEERE Mozes geboden had. Zo nam Jozua al dat land in, het gebergte, en heel het zuiden, en heel het land van Gosen, en de laagte, en het vlakke veld, en het gebergte van Israël, en zijn laagte. Van de kale berg, die opwaarts naar Seïr gaat, tot Baäl-gad toe, in het dal van de Libanon, onder aan de berg Hermon; al hun koningen nam hij ook, en sloeg hen, en doodde hen.", "Joz 12:3": "En over de vlakte tot aan de zee van Cinneroth naar het oosten, en tot aan de zee van de vlakte, de Zoutzee, naar het oosten, op de weg naar Beth-jesimoth; en vanuit het zuiden, beneden Asdoth-pisga.", "Tit 1:1": "Paulus, een dienstknecht van God, en een apostel van Jezus Christus, naar het geloof van de uitverkorenen van God, en de kennis van de waarheid die naar de godzaligheid is;", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Joz 15:50": "en Anab, en Estemo, en Anim,", "2 Kron 12:3": "met duizend tweehonderd wagens, en met zestigduizend ruiters; en van het volk dat met hem uit Egypte kwam was geen getal: Libiërs, Sukkieten en Cusjieten.", "Deut 20:13-18": "En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard; Behalve de vrouwen, en de kinderen, en de dieren, en al wat in de stad zijn zal, alle buit ervan zult u voor uzelf roven; en u zult eten van de buit van uw vijanden, die de HEERE, uw God, u gegeven heeft. Zo zult u aan alle steden doen die zeer ver van u zijn, die niet zijn van de steden van deze volken.", "Richt 1:11": "En vandaar was hij heengetrokken tegen de inwoners van Debir; de naam van Debir was voorheen Kirjath-sefer.", "Deut 2:33": "En de HEERE, onze God, gaf hem aan ons over; en wij versloegen hem, en zijn zonen, en al zijn volk.", "Joz 1:7": "Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Luk 1:39": "En Maria stond in diezelfde dagen op en reisde met haast naar het gebergte, naar een stad van Juda;", "Hos 14:4": "Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "2 Kron 30:12": "Ook was de hand van God in Juda, die hun één hart gaf, om het gebod van de koning en van de leiders te doen, naar het woord van de HEERE.", "Dan 4:1": "Koning Nebukadnezar aan alle volken, natiën en talen, die op de hele aardbodem wonen: uw vrede moet vermenigvuldigd worden!", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Joz 1:6": "Wees sterk en heb goede moed! Want u zult dit volk dat land als erfelijk bezit doen verkrijgen, dat Ik hun vaderen gezworen heb hun te geven.", "2 Sam 10:16": "En Hadad-Ezer zond heen, en liet de Syriërs uitkomen, die aan de overzijde van de rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-Ezers legeraanvoerder, trok voor hun aangezicht heen.", "2 Kron 22:5": "Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.", "Richt 1:27": "En Manasse verdreef Beth-sean niet, noch de bijbehorende plaatsen, noch Thaanach met de bijbehorende plaatsen, noch de inwoners van Dor met de bijbehorende plaatsen, noch de inwoners van Jibleam met de bijbehorende plaatsen, noch de inwoners van Megiddo met de bijbehorende plaatsen; en de Kanaänieten wilden in dat land blijven wonen.", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "1 Sam 12:9": "Maar zij vergaten de HEERE, hun God; zo verkocht Hij hen in de hand van Sisera, de legeraanvoerder van Hazor, en in de hand van de Filistijnen, en in de hand van de koning van de Moabieten, die tegen hen streden.", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "Gen 15:18-21": "Op dezelfde dag maakte de HEERE een verbond met Abram, en Hij zei: Aan uw nageslacht heb Ik dit land gegeven, van de rivier van Egypte af, tot aan die grote rivier, de rivier de Eufraat: De Kenieten, en de Kenizzieten, en de Kadmonieten, En de Hethieten, en de Ferezieten, en de Refaïeten,", "Ps 78:70-72": "En Hij verkoos Zijn knecht David, en nam hem van de schaapskooien; Van achter de zogende schapen liet Hij hem komen, om Jakob te weiden, Zijn volk, en Israël, Zijn erfenis. Ook heeft hij hen geweid naar de oprechtheid van zijn hart, en heeft hen geleid met een zeer verstandig beleid van zijn handen.", "2 Kron 28:16": "In diezelfde tijd zond koning Achaz tot de koningen van Assyrië, dat zij hem zouden helpen.", "Neh 13:23": "Ook zag ik in die dagen Joden die Asdodische, Ammonietische en Moabietische vrouwen bij zich hadden laten wonen.", "Jer 51:20": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.", "Rom 9:23": "en opdat Hij de rijkdom van Zijn heerlijkheid bekend zou maken over de vaten van de barmhartigheid, die Hij van tevoren klaargemaakt heeft tot heerlijkheid?", "Joz 9:1": "En het gebeurde, toen alle koningen die aan deze kant van de Jordaan waren dit hoorden, op het gebergte, en in de laagte, en aan alle havens van de grote zee, tegenover de Libanon: de Hethieten, en de Amorieten, de Kanaänieten, de Ferezieten, de Hevieten, en de Jebusieten;", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Richt 7:12": "En de Midianieten, en Amalekieten, en al de mensen van het oosten, lagen in het dal, als een menigte sprinkhanen, en hun kamelen waren niet te tellen, als het zand dat aan de oever van de zee ligt, in menigte.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Joz 9:7": "Toen zeiden de mannen van Israël tegen de Hevieten: Misschien woont u wel te midden van ons, hoe zullen wij dan een verbond met u maken?", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "Openb 19:11-21": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid. En Zijn ogen waren als een vlam van het vuur, en op Zijn hoofd waren veel koninklijke hoeden; en Hij had een naam geschreven, die niemand wist, dan Hij Zelf. En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God.", "Micha 5:9": "En het zal op die dag gebeuren, spreekt de HEERE, dat Ik uw paarden uit uw midden zal uitroeien, en Ik zal uw wagens vernietigen.", "Joz 12:20": "De koning van Simron-meron, één; de koning van Achsaf, één;", "Dan 6:2-4": "En het leek Darius goed dat hij over het koninkrijk honderdtwintig stadhouders aanstelde, die over het hele koninkrijk zouden zijn; en boven hen drie vorsten, van wie Daniël de eerste zou zijn, aan wie die stadhouders zelf rekenschap moesten geven, zodat de koning geen schade leed. Toen overtrof deze Daniël die vorsten en die stadhouders, omdat er een voortreffelijke geest in hem was; en de koning dacht hem aan te stellen over het hele koninkrijk.", "Ezra 6:22": "En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.", "Deut 11:23-25": "Dan zal de HEERE al deze volken voor uw aangezicht uit hun bezit verdrijven, en u zult in bezit nemen grotere en machtigere volken dan u bent. Elke plaats, waar uw voetzool op treedt, zal de uwe zijn; van de woestijn en de Libanon, van de rivier, de rivier de Eufraat, tot aan de verste zee, zal uw gebied zijn. Niemand zal voor uw aangezicht standhouden; de HEERE, uw God, zal de schrik en de vrees voor u geven over heel het land, waarop u treden zult, zoals Hij tot u gesproken heeft.", "2 Kron 12:2": "Daarom gebeurde het, in het vijfde jaar van koning Rehabeam, dat Sisak, de koning van Egypte, tegen Jeruzalem optrok (want zij hadden tegen de HEERE overtreden),", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "Rom 11:5": "Zo is er dan ook in deze tegenwoordige tijd een overblijfsel geworden, naar de verkiezing van de genade.", "1 Kron 19:6": "Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba;", "Richt 14:4": "Zijn vader nu en zijn moeder wisten niet dat dit van de HEERE was, dat hij een gelegenheid zocht tegen de Filistijnen; want de Filistijnen heersten in die tijd over Israël.", "1 Sam 15:9": "Doch Saul en het hele volk verschoonden Agag, en de beste schapen, en runderen, en het naastbeste, en de lammeren, en alles wat goed was, en zij wilden dat niet verbannen; maar alles wat minderwaardig was en waardeloos, dat verbanden zij.", "Jes 45:13": "Ik heb hem verwekt in gerechtigheid, en al zijn wegen zal Ik recht maken; hij zal Mijn stad bouwen, en hij zal Mijn gevangenen loslaten, niet voor prijs, en ook niet voor geschenk, zegt de HEERE van de heerscharen.", "Ex 14:25": "En Hij stootte de raderen van hun wagens weg, en deed ze zwaar voortgaan. Toen zeiden de Egyptenaren: Laten wij vluchten van voor Israël, want de HEERE strijdt voor hen tegen de Egyptenaren.", "Rom 1:10": "altijd in mijn gebeden biddend, of het mij misschien nog op een gegeven moment door de wil van God gegeven zou worden om naar u te komen.", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Deut 20:14": "Behalve de vrouwen, en de kinderen, en de dieren, en al wat in de stad zijn zal, alle buit ervan zult u voor uzelf roven; en u zult eten van de buit van uw vijanden, die de HEERE, uw God, u gegeven heeft.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Ps 127:2": "Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap.", "Jes 54:16": "Zie, Ik heb de smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik de verderver geschapen om te vernielen.", "1 Kron 18:1": "Het gebeurde nu hierna, dat David de Filistijnen sloeg, en hen onderwierp; en hij nam Gath en haar onderhorige plaatsen af van de Filistijnen.", "Fil 1:12": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is;", "2 Kon 15:29": "In de dagen van Pekah, de koning van Israël, kwam Tiglath-Pilezer, de koning van Assyrië, en nam Ijon in, en Abel-Beth-Maächa, en Janoah, en Kedes, en Hazor, en Gilead, en Galilea, het hele land van Nafthali; en hij voerde hen weg naar Assyrië.", "Matt 24:41": "Er zullen twee vrouwen malen bij de molen: de één zal aangenomen worden, en de ander zal achtergelaten worden.", "Joz 8:31": "zoals Mozes, de knecht van de HEERE, de kinderen van Israël geboden had, overeenkomstig wat geschreven staat in het wetboek van Mozes: een altaar van gehele stenen, waarover men geen ijzer bewogen had; en daarop offerden zij de HEERE brandoffers; ook offerden zij dankoffers.", "Luk 10:20": "Maar verblijd u daar niet in, dat de geesten zich aan u onderwerpen; verblijd u veel meer dat uw namen opgeschreven zijn in de hemelen.", "Joz 10:41": "En Jozua sloeg hen van Kades-Barnea tot Gaza toe; ook het hele land Gosen, en tot Gibeon toe.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "2 Kron 18:1": "Josafat had rijkdom en eer in overvloed; en hij verzwagerde zich aan Achab.", "Ef 1:4": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde;", "Joz 10:37": "En zij namen haar in, en sloegen haar met de scherpte van het zwaard, zowel haar koning als al haar steden, en elke ziel die daarin was; hij liet niemand in leven overblijven, naar alles wat hij Eglon gedaan had; en hij verbande haar, en elke ziel die daarin was.", "Ef 1:5": "Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Joz 23:1": "En het gebeurde na veel dagen, nadat de HEERE Israël rust gegeven had van al zijn vijanden rondom, en Jozua oud geworden en wel bedaagd was;", "Deut 9:2": "Een groot en lang volk, kinderen van de Enakieten, die u kent, en waarvan u gehoord hebt: Wie zou standhouden voor het aangezicht van de kinderen van Enak?", "Hand 4:28": "Om te doen alles wat Uw hand en Uw raad van tevoren bepaald hadden dat zou gebeuren.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Neh 11:33": "Hazor, Rama, Gitthaim,", "Joz 10:2-40": "Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei: Kom op tot mij, en help mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen van Israël.", "Deut 34:3": "En het zuiden, en het vlakke veld van de vallei van Jericho, de palmstad, tot Zoar toe.", "Jer 47:3": "Vanwege het geluid van het geklater van de hoeven van zijn sterke paarden, vanwege het geraas van zijn wagens, en het bulderen van zijn raderen; de vaders zien niet om naar de kinderen, vanwege de slapheid van de handen;", "Rom 8:28-30": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn. Want die Hij van tevoren gekend heeft, die heeft Hij ook van tevoren bestemd om gelijkvormig te zijn aan het beeld van Zijn Zoon, opdat Hij de Eerstgeborene zou zijn onder veel broeders. En die Hij van tevoren bestemd heeft, die heeft Hij ook geroepen; en die Hij geroepen heeft, die heeft Hij ook gerechtvaardigd; en die Hij gerechtvaardigd heeft, die heeft Hij ook verheerlijkt.", "Ezech 29:20": "Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.", "1 Kor 1:26-29": "Want u ziet uw roeping, broeders, dat u niet veel wijzen bent naar het vlees, niet veel machtigen, niet veel edelen. Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen; En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken;", "Ps 135:4": "Want de HEERE heeft Zich Jakob verkoren, Israël tot Zijn eigendom.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Joz 12:8": "Wat op het gebergte, en in de laagte, en in de vlakte, en op de hellingen bij de waterbronnen, en in de woestijn, en in het zuiderland lag: de Hethieten, de Amorieten, en Kanaänieten, de Ferezieten, de Hevieten, en de Jebusieten.", "Jes 43:5-7": "Vrees niet, want Ik ben met u; Ik zal uw nageslacht van de opgang brengen, en Ik zal u verzamelen van de ondergang. Ik zal zeggen tot het noorden: Geef; en tot het zuiden: Houd niet terug; breng Mijn zonen van verre, en Mijn dochters van het einde der aarde; ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Richt 20:28": "En Pinehas, de zoon van Eleazar, de zoon van Aäron, stond voor Zijn aangezicht in die dagen, en zei: Zal ik nog meer uittrekken ten strijde tegen de kinderen van Benjamin, mijn broeder, of zal ik ophouden? En de HEERE zei: Trek op, want morgen zal Ik hem in uw hand geven.", "Rom 8:33": "Wie zal een beschuldiging inbrengen tegen de uitverkorenen van God? God is het Die rechtvaardigt.", "1 Sam 15:32": "Toen zei Samuël: Breng Agag, de koning van de Amalekieten, hier bij mij. Agag nu ging vol vertrouwen naar hem toe; en Agag zei: Voorwaar, de bitterheid van de dood is geweken!", "Richt 21:11": "Doch dit is de zaak die u doen zult: al wat mannelijk is, en alle vrouwen die gemeenschap met een man gehad hebben, zult u met de ban slaan.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Gen 14:2": "dat zij oorlog voerden met Bera, koning van Sodom, en met Birsa, koning van Gomorra, Sinab, koning van Adama, en Semeber, koning van Zeboim, en de koning van Bela, dat is Zoar.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "2 Kon 18:19-21": "En Rabsake zei tot hen: Zeg nu tot Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat vertrouwen is dit, waarmee u vertrouwt? U zegt (doch het is een woord der lippen): Er is raad en macht tot de oorlog; op wie vertrouwt u nu, dat u tegen mij rebelleert? Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Richt 3:3": "Vijf vorsten van de Filistijnen, en al de Kanaänieten, en de Sidoniërs, en de Hevieten, die woonden in het gebergte van de Libanon, van de berg Baäl-Hermon tot waar men bij Hamath komt.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "1 Kon 22:1-4": "En zij bleven drie jaar stil, zodat er geen oorlog was tussen Syrië en Israël. En het gebeurde in het derde jaar, dat Josafat, de koning van Juda, naar de koning van Israël afkwam. Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Jes 45:1-6": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "Gen 21:13": "Maar Ik zal ook de zoon van deze slavin tot een volk maken, omdat hij uw nageslacht is.", "1 Sam 12:22": "Want de HEERE zal Zijn volk niet verlaten, omwille van Zijn grote Naam, omdat het de HEERE behaagd heeft, u tot een volk voor Zichzelf te maken.", "Deut 20:16": "Maar van de steden van deze volken, die de HEERE, uw God, u als erfdeel geeft, zult u niets laten leven dat adem heeft.", "Num 21:1-3": "Toen de Kanaäniet, de koning van Harad, die woonde in het zuiden, hoorde dat Israël door de weg van de verspieders kwam, streed hij tegen Israël, en hij voerde enige gevangenen uit hen gevankelijk weg. Toen beloofde Israël de HEERE een gelofte en zei: Als U dit volk geheel in mijn hand geeft, zal ik hun steden verbannen. De HEERE dan verhoorde de stem van Israël, en gaf de Kanaänieten over; en Israël verbande hen en hun steden; en men noemde de naam van die plaats Horma."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">Het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">gebeurde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2985\">daarna</span>, toen <span class=\"wl\" data-l=\"L2\" data-code=\"H2985\">Jabin</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H2985\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4428\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2674\">Hazor</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H8085\">dit</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8085\">hoorde</span>, dat <span class=\"wl\" data-l=\"L6\" data-code=\"H7971\">hij</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7971\">een</span> boodschap stuurde <span class=\"wl\" data-l=\"L8\" data-code=\"H3103\">naar</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3103\"> -l=\"L12\" data-code=\"H8252\">van</span> de oorlog."}, "koppeling_kjv": {"1": "And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H2985\">Jabin</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2674\">Hazor</span> had <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> those things, that he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H3103\">Jobab</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4068\">Madon,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H8110\">Shimron,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Achshaph,", "2": "And to the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> that were on the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H6160\">plains</span> <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> of <span class=\"wl wl-kjv\" data-code=\"H3672\">Chinneroth,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H8219\">valley,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5299\">borders</span> of <span class=\"wl wl-kjv\" data-code=\"H1756\">Dor</span> on the west,", "3": "And to the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanite</span> on the <span class=\"wl wl-kjv\" data-code=\"H4217\">east</span> and on the <span class=\"wl wl-kjv\" data-code=\"H3220\">west,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6522\">Perizzite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusite</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H2340\">Hivite</span> under <span class=\"wl wl-kjv\" data-code=\"H2768\">Hermon</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Mizpeh.", "4": "And they went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> they and all their <span class=\"wl wl-kjv\" data-code=\"H4264\">hosts</span> with them, <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> even as the <span class=\"wl wl-kjv\" data-code=\"H2344\">sand</span> that is upon the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">shore</span> in <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude,</span> with <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> and <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> many.", "5": "And when all these <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> were met <span class=\"wl wl-kjv\" data-code=\"H3259\">together,</span> they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> at the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of <span class=\"wl wl-kjv\" data-code=\"H4792\">Merom,</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against Israel.", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> Be not <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of them: for to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> about this <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> will I deliver them <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> all <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H6131\">hough</span> their <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> their <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots</span> with fire.", "7": "So <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> with him, against them by the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of <span class=\"wl wl-kjv\" data-code=\"H4792\">Merom</span> <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly;</span> and they fell upon", "8": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> who <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them, and <span class=\"wl wl-kjv\" data-code=\"H7291\">chased</span> them unto <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6721\">Zidon,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H4956\">Misrephothmaim,</span> and unto the <span class=\"wl wl-kjv\" data-code=\"H1237\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H4708\">Mizpeh</span> <span class=\"wl wl-kjv\" data-code=\"H4217\">eastward;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them, until they <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> them none remaining.", "9": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto them as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">bade</span> him: he <span class=\"wl wl-kjv\" data-code=\"H6131\">houghed</span> their <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> their <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots</span> with fire.", "10": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> turned <span class=\"wl wl-kjv\" data-code=\"H7725\">back,</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> <span class=\"wl wl-kjv\" data-code=\"H2674\">Hazor,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> thereof with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> for <span class=\"wl wl-kjv\" data-code=\"H2674\">Hazor</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">beforetime</span> was the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of all those kingdoms.", "11": "And they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> all the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> that were therein with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroying</span> them: there was not any <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> to <span class=\"wl wl-kjv\" data-code=\"H5397\">breathe:</span> and he <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> <span class=\"wl wl-kjv\" data-code=\"H2674\">Hazor</span> with fire.", "12": "And all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of those <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of them, did <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H3920\">take,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and he utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed</span> them, as <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> commanded.", "13": "But as for the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> that <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> still in their <span class=\"wl wl-kjv\" data-code=\"H8510\">strength,</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> none of them, <span class=\"wl wl-kjv\" data-code=\"H2108\">save</span> <span class=\"wl wl-kjv\" data-code=\"H2674\">Hazor</span> only; that did <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> burn.", "14": "And all the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of these <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and the <span class=\"wl wl-kjv\" data-code=\"H929\">cattle,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> took for a <span class=\"wl wl-kjv\" data-code=\"H962\">prey</span> unto themselves; but every <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> until they had <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> them, neither <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> they any to breathe.", "15": "As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> so did <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> and so <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua;</span> he <span class=\"wl wl-kjv\" data-code=\"H5493\">left</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">nothing</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">undone</span> of all that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses.", "16": "So <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> all that <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> the <span class=\"wl wl-kjv\" data-code=\"H2022\">hills,</span> and all the south <span class=\"wl wl-kjv\" data-code=\"H5045\">country,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1657\">Goshen,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8219\">valley,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6160\">plain,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and the valley", "17": "Even from the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl ta-code=\"H4421\">battle,</span> that he might destroy them <span class=\"wl wl-kjv\" data-code=\"H2763\">utterly,</span> and that they might have no <span class=\"wl wl-kjv\" data-code=\"H8467\">favour,</span> but that he might <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> them, as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses.", "21": "And at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H6062\">Anakims</span> from the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> from <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> from <span class=\"wl wl-kjv\" data-code=\"H1688\">Debir,</span> from <span class=\"wl wl-kjv\" data-code=\"H6024\">Anab,</span> and from all the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and from all the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> destroyed them <span class=\"wl wl-kjv\" data-code=\"H2763\">utterly</span> with their cities.", "22": "There was none of the <span class=\"wl wl-kjv\" data-code=\"H6062\">Anakims</span> <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> only in <span class=\"wl wl-kjv\" data-code=\"H5804\">Gaza,</span> in <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> and in <span class=\"wl wl-kjv\" data-code=\"H795\">Ashd /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
