ngen kwamen samen, en trokken op en legerden zich samen aan de wateren van Merom, om tegen Israël te strijden.","6":"En de HEERE zei tegen Jozua: Wees niet bang voor hen; want morgen omtrent deze tijd zal Ik hen allemaal verslagen geven voor het aangezicht van Israël; hun paarden zult u verlammen, en hun wagens met vuur verbranden.","7":"En Jozua, en al het krijgsvolk met hem, kwam snel over hen aan de wateren van Merom, en zij overvielen hen.","8":"En de HEERE gaf hen in de hand van Israël, en zij versloegen hen, en achtervolgden hen tot aan groot Sidon toe, en tot Misrefoth-maim, en tot het dal Mizpa tegen het oosten; en zij versloegen hen, totdat zij niemand van hen lieten overblijven.","9":"Jozua nu deed hun zoals de HEERE hem gezegd had; hun paarden verlamde hij, en hun wagens verbrandde hij met vuur.","10":"En Jozua keerde op datzelfde moment terug, en hij nam Hazor in, en haar koning sloeg hij met het zwaard; want Hazor was voorheen het hoofd van al deze koninkrijken.","11":"En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur.","12":"En Jozua nam al de steden van deze koningen in, en al hun koningen, en hij sloeg hen met de scherpte van het zwaard, hen met de ban treffend, zoals Mozes, de dienaar van de HEERE, geboden had.","13":"Alleen verbrandden de Israëlieten geen steden die op hun heuvels stonden, behalve Hazor alleen; dat verbrandde Jozua.","14":"En alle buit van deze steden, en het vee, roofden de kinderen van Israël voor zichzelf; alleen sloegen zij alle mensen met de scherpte van het zwaard, totdat zij hen vernietigden; zij lieten niemand overblijven die adem had.","15":"Zoals de HEERE Mozes, Zijn dienaar, geboden had, zo gebood Mozes aan Jozua; en zo deed Jozua; hij liet niets achterwege van alles wat de HEERE Mozes geboden had.","16":"Zo nam Jozua al dat land in, het gebergte, en heel het zuiden, en heel het land van Gosen, en de laagte, en het vlakke veld, en het gebergte van Israël, en zijn laagte.","17":"Van de kale berg, die opwaarts naar Seïr gaat, tot Baäl-gad toe, in het dal van de Libanon, onder aan de berg Hermon; al hun koningen nam hij ook, en sloeg hen, en doodde hen.","18":"Vele dagen voerde Jozua oorlog tegen al deze koningen.","19":"Er was geen stad die vrede maakte met de kinderen van Israël, behalve de Hevieten, inwoners van Gibeon; die namen zij allemaal in door oorlog.","20":"Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.","21":"In diezelfde tijd nu kwam Jozua, en roeide de Enakieten uit, van het gebergte, van Hebron, van Debir, van Anab, en van heel het gebergte van Juda, en van heel het gebergte van Israël; Jozua trof hen met de ban, met hun steden.","22":"Er bleef niemand van de Enakieten over in het land van de kinderen van Israël; alleen bleven zij over in Gaza, in Gath, en in Asdod.","23":"Zo nam Jozua heel dat land in, naar alles wat de HEERE tot Mozes gesproken had; en Jozua gaf het aan Israël als erfdeel, naar hun afdelingen, naar hun stammen. En het land rustte van de oorlog."},"SV":{"1":"Het geschiedde daarna, als Jabin, de koning van Hazor, dit hoorde, zo zond hij tot Jobab, den koning van Madon, en tot den koning van Simron, en tot den koning van Achsaf,","2":"En tot de koningen, die tegen het noorden op het gebergte, en op het vlakke, tegen het zuiden van Cinneroth, en in de laagte, en in Nafoth-dor, aan de zee waren;","3":"Tot de Kanaänieten tegen het oosten en tegen het westen, en de Amorieten, en de Hethieten, en de Ferezieten; en de Jebusieten op het gebergte, en de Hevieten onder aan Hermon, in het land van Mizpa.","4":"Dezen nu togen uit, en al hun heirlegers met hen; veel volks, als het zand, dat aan den oever der zee is, in veelheid; en zeer vele paarden en wagens.","5":"Al deze koningen werden vergaderd, en kwamen en legerden zich samen aan de wateren van Merom, om tegen Israël te krijgen.","6":"En de HEERE zeide tot Jozua: Vrees niet voor hun aangezichten; want morgen omtrent dezen tijd zal Ik hen altegader verslagen geven voor het aangezicht van Israël; hun paarden zult gij verlammen, en hun wagenen met vuur verbranden.","7":"En Jozua, en al het krijgsvolk met hem, kwam snellijk over hen aan de wateren van Merom, en zij overvielen hen.","8":"En de HEERE gaf hen in de hand van Israël, en zij sloegen hen, en joegen hen na tot groot Sidon toe, en tot Misrefoth-maim, en tot het dal Mizpa tegen het oosten; en zij sloegen hen, totdat zij geen overigen onder hen overlieten.","9":"Jozua nu deed hun, gelijk hem de HEERE gezegd had; hun paarden verlamde hij, en hun wagenen verbrandde hij met vuur.","10":"En Jozua keerde weder ter zelver tijd, en hij nam Hazor in, en haar koning sloeg hij met het zwaard; want Hazor was te voren het hoofd van al deze koninkrijken.","11":"En zij sloegen alle ziel, die daarin was, met de scherpte des zwaards, die verbannende; er bleef niets over, dat adem had; en Hazor verbrandde hij met vuur.","12":"En Jozua nam al de steden dezer koningen in, en al haar koningen, en hij sloeg hen met de scherpte des zwaards, hen verbannende, gelijk als Mozes, de knecht des HEEREN geboden had.","13":"Alleenlijk verbrandden de Israëlieten geen steden, die op haar heuvelen stonden, behalve Hazor alleen; dat verbrandde Jozua.","14":"En al den roof dezer steden, en het vee, roofden de kinderen Israëls voor zich; alleenlijk sloegen zij al de mensen met de scherpte des zwaards, totdat zij hen verdelgden; zij lieten niet overblijven wat adem had.","15":"Gelijk als de HEERE Mozes, Zijn knecht, geboden had, alzo gebood Mozes aan Jozua; en alzo deed Jozua; hij deed er niet een woord af van alles, wat de HEERE Mozes geboden had.","16":"Alzo nam Jozua al dat land in, het gebergte, en al het zuiden, en al het land van Gosen, en de laagte, en het vlakke veld, en het gebergte Israëls, en zijn laagte.","17":"Van den kalen berg, die opwaarts naar Seir gaat, tot Baäl-gad toe, in het dal van den Libanon, onder aan den berg Hermon; al hun koningen nam hij ook, en sloeg hen, en doodde hen.","18":"Vele dagen voerde Jozua krijg tegen al deze koningen.","19":"Er was geen stad, die vrede maakte met de kinderen Israëls, behalve de Hevieten, inwoners van Gibeon; zij namen ze allen in door krijg.","20":"Want het was van den HEERE, hun harten te verstokken, dat zij Israël met oorlog tegemoet gingen, opdat hij hen verbannen zoude, dat hun geen genade geschiedde, maar opdat hij hen verdelgen zoude, gelijk als de HEERE Mozes geboden had.","21":"Te dier tijde nu kwam Jozua, en roeide de Enakieten uit, van het gebergte, van Hebron, van Debir, van Anab, en van het ganse gebergte van Juda, en van het ganse gebergte van Israël; Jozua verbande hen met hun steden.","22":"Er bleef niemand van de Enakieten over in het land der kinderen Israëls; alleenlijk bleven zij over te Gaza, te Gath, en te Asdod.","23":"Alzo nam Jozua al dat land in, naar alles, wat de HEERE tot Mozes gesproken had; en Jozua gaf het Israël ten erve, naar hun afdelingen, naar hun stammen. En het land rustte van den krijg."},"KJV":{"1":"And it came to pass, when Jabin king of Hazor had heard *those things*, that he sent to Jobab king of Madon, and to the king of Shimron, and to the king of Achshaph,","2":"And to the kings that *were* on the north of the mountains, and of the plains south of Chinneroth, and in the valley, and in the borders of Dor on the west,","3":"*And to* the Canaanite on the east and on the west, and *to* the Amorite, and the Hittite, and the Perizzite, and the Jebusite in the mountains, and *to* the Hivite under Hermon in the land of Mizpeh.","4":"And they went out, they and all their hosts with them, much people, even as the sand that *is* upon the sea shore in multitude, with horses and chariots very many.","5":"And when all these kings were met together, they came and pitched together at the waters of Merom, to fight against Israel.","6":"And the LORD said unto Joshua, Be not afraid because of them: for to morrow about this time will I deliver them up all slain before Israel: thou shalt hough their horses, and burn their chariots with fire.","7":"So Joshua came, and all the people of war with him, against them by the waters of Merom suddenly; and they fell upon","8":"And the LORD delivered them into the hand of Israel, who smote them, and chased them unto great Zidon, and unto Misrephothmaim, and unto the valley of Mizpeh eastward; and they smote them, until they left them none remaining.","9":"And Joshua did unto them as the LORD bade him: he houghed their horses, and burnt their chariots with fire.","10":"And Joshua at that time turned back, and took Hazor, and smote the king thereof with the sword: for Hazor beforetime was the head of all those kingdoms.","11":"And they smote all the souls that *were* therein with the edge of the sword, utterly destroying *them*: there was not any left to breathe: and he burnt Hazor with fire.","12":"And all the cities of those kings, and all the kings of them, did Joshua take, and smote them with the edge of the sword, *and* he utterly destroyed them, as Moses the servant of the LORD commanded.","13":"But *as for* the cities that stood still in their strength, Israel burned none of them, save Hazor only; *that* did Joshua burn.","14":"And all the spoil of these cities, and the cattle, the children of Israel took for a prey unto themselves; but every man they smote with the edge of the sword, until they had destroyed them, neither left they any to breathe.","15":"As the LORD commanded Moses his servant, so did Moses command Joshua, and so did Joshua; he left nothing undone of all that the LORD commanded Moses.","16":"So Joshua took all that land, the hills, and all the south country, and all the land of Goshen, and the valley, and the plain, and the mountain of Israel, and the valley","17":"*Even* from the mount Halak, that goeth up to Seir, even unto Baalgad in the valley of Lebanon under mount Hermon: and all their kings he took, and smote them, and slew","18":"Joshua made war a long time with all those kings.","19":"There was not a city that made peace with the children of Israel, save the Hivites the inhabitants of Gibeon: all *other* they took in battle.","20":"For it was of the LORD to harden their hearts, that they should come against Israel in battle, that he might destroy them utterly, *and* that they might have no favour, but that he might destroy them, as the LORD commanded Moses.","21":"And at that time came Joshua, and cut off the Anakims from the mountains, from Hebron, from Debir, from Anab, and from all the mountains of Judah, and from all the mountains of Israel: Joshua destroyed them utterly with their cities.","22":"There was none of the Anakims left in the land of the children of Israel: only in Gaza, in Gath, and in Ashdod, there remained.","23":"So Joshua took the whole land, according to all that the LORD said unto Moses; and Joshua gave it for an inheritance unto Israel according to their divisions by their tribes. And the land rested from war."}},"tsk":{"1":[{"kopje":"Jabin","refs":["Joz 11:10","Joz 12:19","Joz 19:36","Richt 4:2","Richt 4:17"]},{"kopje":"stuurde","refs":["Joz 10:3","Joz 10:4","Ps 2:1-4","Ps 83:2-4","Jes 26:11","Jes 43:2","Jes 43:5-7"]},{"kopje":"Madon","refs":["Joz 12:19","Joz 12:20","Joz 19:15","Joz 19:25"]},{"kopje":"Achsaf","refs":["Joz 19:25","Joz 19:29"]}],"2":[{"kopje":"tegen het noorden","refs":["Joz 11:21","Joz 10:6","Joz 10:40","Luk 1:39"]},{"kopje":"Cinneroth","refs":["Joz 12:3"]},{"kopje":"Nafoth-dor","refs":["Joz 12:23","Joz 17:11","Richt 1:27","1 Kon 4:11"]}],"3":[{"kopje":"de Jebusieten","refs":["Joz 15:63","Num 13:29","2 Sam 24:16"]},{"kopje":"de Hevieten","refs":["Richt 3:3"]},{"kopje":"Hermon","refs":["Joz 13:11","Deut 4:48","Ps 89:13","Ps 133:3" e Tribes of Israel ( Juda excepted. ) Those of the Tribe of Juda had their own mountains or hilly countrey , as appeareth v.21. ] and the vale thereof ."}],"17":[{"catchword":null,"tekst":"From the bald mountain ; [ So is this mountain called , because it was bald , or without trees , grass or herbs . Other retain the Hebrew word Halak , as being a proper name ] that goeth up to Seir , unto Baal-Gad, in the valley of Libanon , beneath mount Hermon : he took all their Kings and smote them, and slew them ."}],"18":[{"catchword":null,"tekst":"Many dayes [ Somewhat more than six years , as may be gathered from Calbs age , when he requested of Josua a land of inheritance , Jos.14.7.] did Josua make war against all these Kings."}],"19":[{"catchword":null,"tekst":"There was no Citie that made peace with the children of Israel , save the Hivites inhabitants of Gibeon : they took them all by war . [ i.e. all the above named Cities , or all the Cities that Josua approached unto ; otherwise it is certain , that there were yet long after that , viz. in the time of the Judges , many cities which the Israelites had not as yet subdued .]"}],"20":[{"catchword":null,"tekst":"For it was of the LORD , to harden theiir hearts that they went forth to war against Israel , that he might ban them ( or devote them to destruction ) that no favour might be shewed them , but that he might destroy them according as the LORD had commanded Moseh."}],"21":[{"catchword":null,"tekst":"Now at that time Josua came and destroyed the Enakims ; [ See Num 13:23. Deut.1.18. ] from the mountains , from Hebron , from Debir , from Anob, and from all the mountains of Juda, and from all the mountains of Israel ; Josua banned them with their Cities ."}],"22":[{"catchword":null,"tekst":"There was none of the Enakims left in the land of the children of Israel ; onely they remained at Gaza , at Gath , [ There dwelt in after times the giant Goliath , 1 Sam. 17.4.] and at Asdod ."}],"23":[{"catchword":null,"tekst":"S (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;

        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
