; en de grens, aan de kant tegen het noorden, zal zijn van de tong van de zee, van het uiterste van de Jordaan.","6":"En deze grens zal opgaan tot Beth-hogla, en zal doorgaan van het noorden naar Beth-araba; en deze grens zal opgaan tot de steen van Bohan, de zoon van Ruben.","7":"Verder zal deze grens opgaan naar Debir, van het dal van Achor, en zal noordwaarts zien naar Gilgal, dat tegenover de opgang van Adummim is, die aan het zuiden van de beek is. Daarna zal deze grens doorgaan tot het water van En-semes, en haar uitgangen zullen zijn te En-rogel.","8":"En deze grens zal opgaan door het dal van de zoon van Hinnom, aan de kant van de Jebusiet van het zuiden, dat is Jeruzalem; en deze grens zal opwaarts gaan tot de top van de berg, die voor het dal van Hinnom is, westwaarts, wat in het uiterste van het dal van de Refaïeten is, tegen het noorden.","9":"Daarna zal deze grens zich uitstrekken van de top van de berg tot aan de waterbron Nefthoah, en uitgaan tot de steden van het gebergte Efron. Verder zal deze grens zich uitstrekken naar Baäla; dat is Kirjath-jearim.","10":"Daarna zal deze grens zich omkeren van Baäla tegen het westen, naar het gebergte Seïr, en zal doorgaan aan de kant van de berg Jearim van het noorden; dat is Chesalon; en zij zal afkomen naar Beth-semes, en door Timna gaan.","11":"Verder zal deze grens uitgaan aan de kant van Ekron, noordwaarts, en deze grens zal zich uitstrekken naar Sichron aan, en over de berg Baäla gaan, en uitgaan te Jabneël; en de uitgangen van deze grens zullen zijn naar de zee.","12":"De grens nu tegen het westen zal zijn tot de grote zee en het gebied daarvan. Dit is het gebied van de kinderen van Juda rondom heen, naar hun huisgezinnen.","13":"Doch Kaleb, de zoon van Jefunne, had hij een deel gegeven te midden van de kinderen van Juda, naar het bevel van de HEERE tot Jozua, de stad van Arba, vader van Enak, dat is Hebron.","14":"En Kaleb verdreef vandaar de drie zonen van Enak, Sesai, en Ahiman, en Talmai, geboren uit Enak.","15":"En vandaar trok hij op naar de inwoners van Debir (de naam van Debir was voorheen Kirjath-sefer).","16":"En Kaleb zei: Wie Kirjath-sefer zal verslaan en innemen, aan hem zal ik mijn dochter Achsa tot vrouw geven.","17":"Othniël nu, de zoon van Kenaz, de broer van Kaleb, nam het in; en hij gaf hem Achsa, zijn dochter, tot vrouw.","18":"En het gebeurde, toen zij bij hem kwam, dat zij hem aanspoorde om een veld van haar vader te vragen; en zij sprong van de ezel af; toen zei Kaleb tegen haar: Wat wilt u?","19":"En zij zei: Geef mij een zegen; omdat u mij een dor land gegeven hebt, geef mij ook waterbronnen. Toen gaf hij haar de hoge waterbronnen en de lage waterbronnen.","20":"Dit is het erfdeel van de stam van de kinderen van Juda, naar hun huisgezinnen.","21":"De steden nu, van het uiterste van de stam van de kinderen van Juda tot het gebied van Edom, tegen het zuiden, zijn: Kabzeel, en Eder, en Jagur,","22":"en Kina, en Dimona, en Adada,","23":"en Kedes, en Hazor, en Jithnan,","24":"Zif, en Telem, en Bealoth,","25":"en Hazor-hadattha, en Kerioth-hezron (dat is Hazor).","26":"Amam, en Sema, en Molada,","27":"en Hazar-gadda, en Hesmon, en Beth-palet,","28":"en Hazar-sual, en Beër-seba, en Biz-jotheja,","29":"Baäla, en Ijim, en Azem,","30":"en Eltholad, en Chesil, en Horma,","31":"en Ziklag, en Madmanna, en Sanzanna,","32":"en Lebaoth, en Silhim, en Aïn, en Rimmon. Al deze steden zijn negenentwintig, met haar dorpen.","33":"In de laagte zijn: Esthaol, en Zora, en Asna,","34":"en Zanoah, en En-gannim, Tappuah, en Enam,","35":"Jarmuth, en Adullam, Socho en Azeka,","36":"en Saaraim, en Adithaim, en Gedera, en Gederothaim; veertien steden en haar dorpen.","37":"Zenan, en Hadasa, en Migdal-gad,","38":"en Dilan, en Mizpa, en Jokteël,","39":"Lachis, en Bozkath, en Eglon,","40":"en Chabbon, en Lahmas, en Chitlis,","41":"en Gederoth, Beth-dagon, en Naäma, en Makkeda; zestien steden en haar dorpen.","42":"Libna, en Ether, en Asan,","43":"en Jiftah, en Asna, en Nezib,","44":"en Kehila, en Achzib, en Mareza; negen steden en haar dorpen;","45":"Ekron, en haar onderhorige plaatsen, en haar dorpen.","46":"Van Ekron, en naar de zee toe; alle plaatsen die aan de kant van Asdod zijn, en haar dorpen;","47":"Asdod, haar onderhorige plaatsen en haar dorpen; Gaza, haar onderhorige plaatsen en haar dorpen, tot aan de rivier van Egypte; en de grote zee, en haar gebied.","48":"Op het gebergte nu: Samir, en Jatthir, en Socho,","49":"en Danna, en Kirjath-sanna, dat is Debir,","50":"en Anab, en Estemo, en Anim,","51":"en Gosen, en Holon, en Gilo; elf steden en haar dorpen.","52":"Arab, en Duma, en Esan,","53":"en Janum, en Beth-tappuah, en Afeka,","54":"en Humta, en Kirjath-arba, dat is Hebron, en Zior; negen steden en haar dorpen.","55":"Maon, Karmel, en Zif, en Juta,","56":"en Jizreël, en Jokdeam, en Zanoah,","57":"Kaïn, Gibea, en Timna; tien steden en haar dorpen.","58":"Halhul, Beth-zur, en Gedor,","59":"en Maarath, en Beth-anoth, en Eltekon; zes steden en haar dorpen.","60":"Kirjath-baal, dat is Kirjath-jearim, en Rabba; twee steden en haar dorpen.","61":"In de woestijn: Beth-araba, Middin en Sechacha,","62":"en Nibsan, en de Zoutstad, en Engedi; zes steden en haar dorpen.","63":"Maar de kinderen van Juda konden de Jebusieten, inwoners van Jeruzalem, niet verdrijven; zo woonden de Jebusieten bij de kinderen van Juda te Jeruzalem, tot op deze dag."},"SV":{"1":"En het lot voor den stam der kinderen van Juda, naar hun huisgezinnen, was: aan de landpale van Edom, de woestijn Zin, zuidwaarts, was het uiterste tegen het zuiden;","2":"Zodat hun landpale, tegen het zuiden, het uiterste van de Zoutzee was; van de tong af, die tegen het zuiden ziet;","3":"En zij gaat uit naar het zuiden tot den opgang van Akrabbim, en gaat door naar Zin, en gaat op van het zuiden naar Kades-barnea, en gaat door Hezron, en gaat op naar Adar, en gaat om Karkaa;","4":"En gaat door naar Azmon, en komt uit aan de beek van Egypte; en de uitgangen dezer landpale zullen naar de zee zijn. Dit zal uw landpale tegen het zuiden zijn.","5":"De landpale nu tegen het oosten zal de Zoutzee zijn, tot aan het uiterste van de Jordaan; en de landpale, aan de zijde tegen het noorden, zal zijn van de tong der zee, van het uiterste van de Jordaan.","6":"En deze landpale zal opgaan tot Beth-hogla, en zal doorgaan van het noorden naar Beth-araba; en deze landpale zal opgaan tot den steen van Bohan, den zoon van Ruben.","7":"Verder zal deze landpale opgaan naar Debir, van het dal van Achor, en zal noordwaarts zien naar Gilgal, hetwelk tegen den opgang van Adummim is, die aan het zuiden der beek is. Daarna zal deze landpale doorgaan tot het water van En-semes, en haar uitgangen zullen wezen te En-rogel.","8":"En deze landpale zal opgaan door het dal van den zoon van Hinnom, aan de zijde van den Jebusiet van het zuiden, dezelve is Jeruzalem; en deze landpale zal opwaarts gaan tot de spits van den berg, die voor aan het dal van Hinnom is, westwaarts, hetwelk in het uiterste van het dal der Refaieten is, tegen het noorden.","9":"Daarna zal deze landpale strekken van de hoogte des bergs tot aan de waterfontein Nefthoah, en uitgaan tot de steden van het gebergte Efron. Verder zal deze landpale strekken naar Baäla; deze is Kirjath-jearim.","10":"Daarna zal deze landpale zich omkeren van Baäla tegen het westen, naar het gebergte Seir, en zal doorgaan aan de zijde van den berg Jearim van het noorden; deze is Chesalon; en zij zal afkomen naar Beth-semes, en door Timna gaan.","11":"Verder zal deze landpale uitgaan aan de zijde van Ekron, noordwaarts, en deze landpale zal strekken naar Sichron aan, en over den berg Baäla gaan, en uitgaan te Jabneel; en de uitgangen dezer landpale zullen zijn naar de zee.","12":"De landpale nu tegen het westen zal zijn tot de grote zee en *derzelver* landpale. Dit is de landpale der kinderen van Juda rondom heen, naar hun huisgezinnen.","13":"Doch Kaleb, den zoon van Jefunne, had hij een deel gegeven in het midden der kinderen van Juda, naar den mond des HEEREN tot Jozua, de stad van Arba, vader van Enak, dat is Hebron.","14":"En Kaleb verdreef van daar de drie zonen van Enak, Sesai, en Ahiman, en Talmai, geboren van Enak.","15":"En daar daar toog hij opwaarts tot de inwoners van Debir (de naam van Debir nu was te voren Kirjath-sefer).","16":"En Kaleb zeide: Wie Kirjath-sefer zal slaan, en nemen haar in, dien zal ik ook mijn dochter Achsa tot een vrouw geven.","17":"Othniël nu, de zoon van Kenaz, den broeder van Kaleb, nam haar in; en hij gaf hem Achsa, zijn dochter, tot een vrouw.","18":"En het geschiedde, als zij *tot* *hem* kwam, zo porde zij hem aan, om een veld van haar vader te begeren; en zij sprong van den ezel af; toen sprak Kaleb tot haar: Wat is u?","19":"En zij zeide: Geef mij een zegen; dewijl gij mij een dor land gegeven hebt, geef mij ook waterwellingen. Toen gaf hij haar hoge waterwellingen en lage waterwellingen.","20":"Dit is het erfdeel van den stam der kinderen van Juda, naar hun huisgezinnen.","21":"De steden nu, van het uiterste van den stam der kinderen van Juda tot de landpale van Edom, tegen het zuiden, zijn: Kabzeel, en Eder, en Jagur,","22":"En Kina, en Dimona, en Adada,","23":"En Kedes, en Hazor, en Jithnan,","24":"Zif, en Telem, en Bealoth,","25":"En Hazor-hadattha, en Kerioth-hezron, (dat is Hazor).","26":"Amam, en Sema, en Molada,","27":"En Hazar-gadda, en Hesmon, en Beth-palet,","28":"En Hazar-sual, en Beer-seba, en Biz-jotheja,","29":"Baäla, en Ijim, en Azem,","30":"En Eltholad, en Chesil, en Horma,","31":"En Ziklag, en Madmanna, en Sanzanna,","32":"En Lebaoth, en Silhim, en Ain, en Rimmon. Al deze steden zijn negen en twintig en haar dorpen.","33":"In de laagte zijn: Esthaol, en Zora, en Asna,","34":"En Zanoah, en En-gannim, Tappuah, en Enam,","35":"Jarmuth, en Adullam, Socho en Azeka,","36":"En Saaraim, en Adithaim, en Gedera, en Gederothaim; veertien steden en haar dorpen.","37":"Zenan, en Hadasa, en Migdal-gad,","38":"En Dilan, en Mizpa, en Jokteel,","39":"Lachis, en Bozkath, en Eglon,","40":"En Chabbon, en Lahmas, en Chitlis,","41":"En Gederoth, Beth-dagon, en Naäma, en Makkeda; zestien steden en haar dorpen.","42":"Libna, en Ether, en Asan,","43":"En Jiftah, en Asna, en Nezib,","44":"En Kehila, en Achzib, en Mareza; negen steden en haar dorpen;","45":"Ekron, en haar onderhorige plaatsen, en haar dorpen.","46":"Van Ekron, en naar de zee toe; alle, die aan de zijde van Asdod zijn, en haar dorpen;","47":"Asdod, haar onderhorige plaatsen en haar dorpen; Gaza, haar onderhorige plaatsen en haar dorpen, tot aan de rivier van Egypte; en de grote zee, en *haar* landpale.","48":"Op het gebergte nu: Samir, en Jatthir, en Socho,","49":"En Danna, en Kirjath-sanna, die is Debir,","50":"En Anab, en Estemo, en Anim,","51":"En Gosen, en Holon, en Gilo; elf steden en haar dorpen.","52":"Arab, en Duma, en Esan,","53":"En Janum, en Beth-tappuah, en Afeka,","54":"En Humta, en Kirjath-arba, die is Hebron, en Zior; negen steden en haar dorpen.","55":"Maon, Karmel, en Zif, en Juta,","56":"En Jizreël, en Jokdeam, en Zanoah,","57":"Kaïn, Gibea, en Timna; tien steden en haar dorpen.","58":"Halhul, Beth-zur, en Gedor,","59":"En Maarath, en Beth-anoth, en Eltekon; zes steden en haar dorpen.","60":"Kirjath-baal, die is Kirjath-jearim, en Rabba; twee steden en haar dorpen.","61":"In de woestijn: Beth-araba, Middin en Sechacha,","62":"En Nibsan, en de Zoutstad, en Engedi; zes steden en haar dorpen.","63":"Maar de kinderen van Juda konden de Jebusieten, inwoners van Jeruzalem, niet verdrijven; alzo woonden de Jebusieten bij de kinderen van Juda te Jeruzalem, tot dezen dag toe."},"KJV":{"1":"*This* then was the lot of the tribe of the children of Judah by their families; *even* to the border of Edom the wilderness of Zin southward *was* the uttermost part of the south coast.","2":"And their south border was from the shore of the salt sea, from the bay that looketh southward:","3":"And it went out to the south side to Maalehacrabbim, and passed along to Zin, and ascended up on the south side unto Kadeshbarnea, and passed along to Hezron, and went up to Adar, and fetched a compass to Karkaa:","4":"*From thence* it passed toward Azmon, and went out unto the river of Egypt; and the goings out of that coast were at the sea: this shall be your south coast.","5":"And the east border *was* the salt sea, *even* unto the end of Jordan. And *their* border in the north quarter *was* from the bay of the sea at the uttermost part of Jordan:","6":"And the border went up to Bethhogla, and passed along by the north of Betharabah; and the border went up to the stone of Bohan the son of Reuben:","7":"And the border went up toward Debir from the valley of Achor, and so northward, looking toward Gilgal, that *is* before the going up to Adummim, which *is* on the south side of the river: and the border passed toward the waters of Enshemesh, and the goings out thereof were at Enrogel:","8":"And the border went up by the valley of the son of Hinnom unto the south side of the Jebusite; the same *is* Jerusalem: and the border went up to the top of the mountain that *lieth* before the valley of Hinnom westward, which *is* at the end of the valley of the giants northward:","9":"And the border was drawn from the top of the hill unto the fountain of the water of Nephtoah, and went out to the cities of mount Ephron; and the border was drawn to Baalah, which *is* Kirjathjearim:","10":"And the border compassed from Baalah westward unto mount Seir, and passed along unto the side of mount Jearim, which *is* Chesalon, on the north side, and went down to Bethshemesh, and passed on to Timnah:","11":"And the border went out unto the side of Ekron northward: and the border was drawn to Shicron, and passed along to mount Baalah, and went out unto Jabneel; and the goings out of the border were at the sea.","12":"And the west border *was* to the great sea, and the coast *thereof*. This *is* the coast of the children of Judah round about according to their families.","13":"And unto Caleb the son of Jephunneh he gave a part among the children of Judah, according to the commandment of the LORD to Joshua, *even* the city of Arba the father of Anak, which *city is* Hebron.","14":"And Caleb drove thence the three sons of Anak, Sheshai, and Ahiman, and Talmai, the children of Anak.","15":"And he went up thence to the inhabitants of Debir: and the name of Debir before *was* Kirjathsepher.","16":"And Caleb said, He that smiteth Kirjathsepher, and taketh it, to him will I give Achsah my daughter to wife.","17":"And Othniel the son of Kenaz, the brother of Caleb, took it: and he gave him Achsah his daughter to wife.","18":"And it came to pass, as she came *unto him*, that she moved him to ask of her father a field: and she lighted off *her* ass; and Caleb said","19":"Who answered, Give me a blessing; for thou hast given me a south land; give me also springs of water. And he gave her the upper springs, and the nether springs.","20":"This *is* the inheritance of the tribe of the children of Judah according to their families.","21":"And the uttermost cities of the tribe of the children of Judah toward the coast of Edom southward were Kabzeel, and Eder, and Jagur,","22":"And Kinah, and Dimonah, and Adadah,","23":"And Kedesh, and Hazor, and Ithnan,","24":"Ziph, and Telem, and Bealoth,","25":"And Hazor, Hadattah, and Kerioth, *and* Hezron, which *is* Hazor,","26":"Amam, and Shema, and Moladah,","27":"And Hazargaddah, and Heshmon, and Bethpalet,","28":"And Hazarshual, and Beersheba, and Bizjothjah,","29":"Baalah, and Iim, and Azem,","30":"And Eltolad, and Chesil, and Hormah,","31":"And Ziklag, and Madmannah, and Sansannah,","32":"And Lebaoth, and Shilhim, and Ain, and Rimmon: all the cities *are* twenty and nine, with their villages:","33":"*And* in the valley, Eshtaol, and Zoreah, and Ashnah,","34":"And Zanoah, and Engannim, Tappuah, and Enam,","35":"Jarmuth, and Adullam, Socoh, and Azekah,","36":"And Sharaim, and Adithaim, and Gederah, and Gederothaim; fourteen cities with their villages:","37":"Zenan, and Hadashah, and Migdalgad,","38":"And Dilean, and Mizpeh, and Joktheel,","39":"Lachish, and Bozkath, and Eglon,","40":"And Cabbon, and Lahmam, and Kithlish,","41":"And Gederoth, Bethdagon, and Naamah, and Makkedah; sixteen cities with their villages:","42":"Libnah, and Ether, and Ashan,","43":"And Jiphtah, and Ashnah, and Nezib,","44":"And Keilah, and Achzib, and Mareshah; nine cities with their villages:","45":"Ekron, with her towns and her villages:","46":"From Ekron even unto the sea, all that *lay* near Ashdod, with their villages:","47":"Ashdod with her towns and her villages, Gaza with her towns and her villages, unto the river of Egypt, and the great sea, and the border","48":"And in the mountains, Shamir, and Jattir, and Socoh,","49":"And Dannah, and Kirjathsannah, which *is* Debir,","50":"And Anab, and Eshtemoh, and Anim,","51":"And Goshen, and Holon, and Giloh; eleven cities with their villages:","52":"Arab, and Dumah, and Eshean,","53":"And Janum, and Bethtappuah, and Aphekah,","54":"And Humtah, and Kirjatharba, which *is* Hebron, and Zior; nine cities with their villages:","55":"Maon, Carmel, and Ziph, and Juttah,","56":"And Jezreel, and Jokdeam, and Zanoah,","57":"Cain, Gibeah, and Timnah; ten cities with their villages:","58":"Halhul, Bethzur, and Gedor,","59":"And Maarath, and Bethanoth, and Eltekon; six cities with their villages:","60":"Kirjathbaal, which *is* Kirjathjearim, and Rabbah; two cities with their villages:","61":"In the wilderness, Betharabah, Middin, and Secacah,","62":"And Nibshan, and the city of Salt, and Engedi; six cities with their villages.","63":"As for the Jebusites the inhabitants of Jerusalem, the children of Judah could not drive them out: but the Jebusites dwell with the children of Judah at Jerusalem unto this day."}},"tsk":{"1":[{"kopje":"Het lot","refs":["Joz 14:2","Num 26:55","Num 26:56"]},{"kopje":"tot aan het","refs":["Num 33:36","Num 33:37" ioenen waren, want het Hebreeuwse woord betekent scorpioenen. Zie Deu 8:15."},{"catchword":"Zin,","tekst":"Het schijnt de naam ener plaat te zijn, in die tijden vermaard, waarvan de woestijn Zin haar naam bekomen heeft."}],"4":[{"catchword":"beek van Egypte;","tekst":"Anders, rivier, genaamd Sichor. Zie Jos 13:3. Anders, dal, alsook onder, vs.7 en elders."}],"5":[{"catchword":"tot aan het uiterste","tekst":"Te weten, waar zij in de Zoutzee valt."}],"6":[{"catchword":"Bohan,","tekst":"De stam van Juda had geen land aan die zijde der Jordaan. Het schijnt dat die plaats den naam van Bohan, een Rubeniet, gekregen heeft, vanwege enige gedenkwaardige zaak aldaar bedreven door hem, of hem aangaande."}],"7":[{"catchword":"Gilgal,","tekst":"Onder, Jos 18:17, genoemd Geliloth"},{"catchword":"te En-rógel","tekst":"Anders, aan de fontein Rogel; dat is, de fontein des volders. Zie 1Ki 1:9."}],"8":[{"catchword":"den Jebusiet","tekst":"Jeruzalem wordt Jebus of de stad des Jebusiets genaamd, omdat het de hoofdstad der Jebusieten was, en nog door hen bewoond was; onder, Jos 18:28; Jdg 19:10."}],"10":[{"catchword":"het gebergte Seïr,","tekst":"Dit gebergte lag in het land van Juda. Er was een ander Seïr, in het land Edom, waar dit land den naam van had."},{"catchword":"Beth-sémes,","tekst":"Dat is, het huis der zon. Het is een stad geweest in den stam van Juda gelegen, 2Ki 14:11, doch den Levieten tot hun woning gegeven, Jos 21:16. Zij moet onderscheiden zijn van dat Beth-Semes, hetwelk in den stam van Issaschar gelegen is; Jos 19:22. In deze stad werd de ark des verbonds eerst gebracht, nadat zij zeven maanden in der Filistijnen land geweest was; 1Sa 6:12."}],"11":[{"catchword":"naar de zee","tekst":"Te weten, naar de Middellandse zee, welke vs.12 genoemd wordt de Grote zee."}],"13":[{"catchword":"hij een deel gegeven","tekst":"Te weten, Jozua."},{"catchword":"den mond des HEEREN","tekst":"Dat is, achtervolgens het gebod en uitdrukkelijk bevel des Heeren."},{"catchword":"stad van Arba,","tekst":"Doorgaans genoemd Kiriath-Arba."}],"15":[{"catchword":"hij opwaarts","tekst":"Te weten, Kaleb, wien hier deze krijgstocht wordt toegeschreven, omdat hij hem ten gevalle geschied is. Daarom belooft hij ook hem, die Kiriath-Sefer slaan zou, zijn dochter, vs.16. Doch Jozua en gans Israël zijn met hem opgetrokken, Jos 10:36."}],"16":[{"catchword":"Kaleb zeide","tekst":"Zie het breder verhaal hiervan Jdg 1:11."}],"17":[{"catchword":"den broeder van Kaleb,","tekst":"Anders, neef, dat is, een van de nakomelingen van Kenaz; zie 1Ch 4:13."}],"18":[{"catchword":"Hem","tekst":"kwam,] Te weten, Othniël haar man."},{"catchword":"hem aan,","tekst":"Te weten, Othniël."},{"catchword":"zij sprong van den ezel af;","tekst":"Te weten, om haar vader met eerbied aan te spreken. Zie de aantekeningen Gen 24:64, en 1Sa 25:23."}],"19":[{"catchword":"zegen;","tekst":"Dat is, een gave, of geschenk. Zie Gen 33:11."},{"catchword":"een dor land gegeven hebt,","tekst":"Hebreeuws eigenlijk, zuidland"},{"catchword":"waterwellingen","tekst":"Anders, waterfonteinen, of waterspringen."}],"21":[{"catchword":"Kábzeël,","tekst":"Neh 11:25 wordt het Jekabzeël genoemd."}],"22":[{"catchword":"Dimóna,","tekst":"Anders, Dibon genoemd, Neh 11:25."}],"25":[{"catchword":"Hazor,","tekst":"Dit is de stad Hazor, die in het begin van dit vs. genoemd staat; en zij is Hezron genoemd geworden, om haar te onderscheiden van dat Hazor, hetwelk bij Kades ligt, van hetwelk vs.23 gesproken wordt."}],"26":[{"catchword":"Semá,","tekst":"Jos 19:2 wordt deze stad genoemd Seba."}],"30":[{"catchword":"Horma,","tekst":"Zie de aantekeningen op Jdg 1:17."}],"32":[{"catchword":"negen en twintig","tekst":"Er zijn er zes en dertig genoemd; maar dewijl enige derzelve aan den stam van Simeon gekomen zijn, gelijk blijkt Jos 19:2, zo telt hij er hier maar negen en twintig, die aan den stam van Juda gebleven zijn. Ook zijn enige derzelve den stam van Juda en den stam van Simeon gemeen gebleven."}],"36":[{"catchword":"veertien steden","tekst":"Er staan er vijftien genoemd, vs.33-36; enigen menen dat Gedera en Gederothaïm een en dezelfde stad is. En zo zou het woordje en zoveel zijn als dat is."}],"38":[{"catchword":"Jókteël,","tekst":"Zie 2Ki 14:7."}],"39":[{"catchword":"Lachis,","tekst":"Zie Jos 10:31, en 2Ki 14:19."}],"42":[{"catchword":"Libna,","tekst":"Zie Jos 10:29."}],"45":[{"catchword":"onderhorige plaatsen,","tekst":"Hebreeuws, dochters; dat is, de kleine steden daaronder behorende; alzo vs.47, en elders meer."}],"46":[{"catchword":"aan de zijde","tekst":"Hebreeuws, op de hand."}],"47":[{"catchword":"de grote zee,","tekst":"Zie Num 34:6."}],"51":[{"catchword":"Gosen,","tekst":"Zie Jos 10:41."}],"55":[{"catchword":"Maon,","tekst":"Van deze stad heeft de woestijn, daarbij gelegen, haar naam gekregen; en David heeft zich in dezelve verborgen, voor Saul vluchtende, 1Sa 23:25, het was een bosachtige plaats, waar vele spelonken in waren. Zij was de geboorteplaats van Nabal, den man van Abigaïl; 1Sa 25:2."}],"60":[{"catchword":"Kirjath-baäl,","tekst":"Dat is, Kiriath-Baäl; het heet anders Kiriath-Jearim."}],"62":[{"catchword":"Zoutstad,","tekst":"Eenigen stellen de Hebreeuwse woord Ir-Hammelach in den tekst als een eigennaam van een stad."}],"63":[{"catchword":"konden de Jebusieten,","tekst":"Zie Jdg 2:20 de oorzaak hiervan."},{"catchword":"tot dezen dag toe","tekst":"Versta hier, den dag, in welken dit boek geschreven is, want naderhand zijn de Jebusieten door David overwonnen en daaruit verdreven geweest; 2Sa 5:6. Ook was tevoren een deel dezer stad door Juda ingenomen; Jdg 1:8."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the lot for the tribe of the children of Juda according to their families , was : on the border of Edom , the wilderness of Zin Southward , was the utmost toward the South :"}],"2":[{"catchword":null,"tekst":"So their border [ viz. the South-border ]toward the South, was utmost of the salt-sea , from the tongue [ It&rsquo;s thought , it was some arm or creek , which from the land did extend into the Salt-sea, in the form and shape of a Tongue ; as also Isa 11:15. or some nook of the Sea , like a Tongue entring into the land ] that looketh toward the South ."}],"3":[{"catchword":null,"tekst":"And goeth out to the south , to the ascent of Alcrabbim [ See Judg.1. v. 36. It seemeth that this place was so called , because there were so many Serpents and Scorpions : See Deut. 8.15. ] and passeth on to Zin [ which seemeth to be the name of a place of note in those times , whereof the wilderness of Zin had its denomination ] and ascendeth from the South unto Kardes-barnea ; and passeth through Hesron, and goeth up to Adar , and encompasseth Karkaa :"}],"4":[{"catchword":null,"tekst":"And passeth through unto Azmon , and cometh out at the brook of Egypt , [ Oth. River, called Sichor : See Jos.13.3. Oth. Valley ; as also below v.7. and elsewhere ]and the going out of this border shall be to the Sea : This shall be your border toward the south ."}],"5":[{"catchword":null,"tekst":"Now the border toward the east , shall be the Salt-sea, unto the utmost of Jordan : [ viz. where it falleth into the Salt -sea ] and the border on the side toward the north , shall be from the tongue of the sea , from the utmost of Jordan ."}],"6":[{"catchword":null,"tekst":"And this border shall go up unto Bethogla , and shall pass thorow from the north of Betharaba : and this border shall go up to the ston of Bohan the son of Reuben : [ The tribe of Reuben had no land on that side of Jordan ; it seemeth , that that place had the name from Bohan a Reubenite , in regard of some memorable Act there done by him , or concerning him .]"}],"7":[{"catchword":null,"tekst":"Moreover, this border shall go up to Debir , from the valley of Achor , and shall look northward toward Gilgal , [ Below Chap. 18.17. called Geliloth ] which is toward the ascent of Adummim, on the south of the brook : Then this border shall pass on to the water of Ensemes , and their goings out shall be at En-rogel. [ Oth. at the fountain of Rogel ; i.e. the fountain of the Fuller .See 1 Kings 1.9.]"}],"8":[{"catchword":null,"tekst":"And this border shall go up through the valley of the son of Hinnom , on the side of the Jebusites , from the south , the same is Jerusalem : [ Jerusalem is called Jebus , or the City of the Jebusites , because it was the Metropolis or chief City of the Jebusites , and was yet inhabited by them Judg. 18.28. and 19.10. ] and this border shall go up to the top of the Hill , that is before the valley of Hinnom westward , which is in the utmost of the valley of the Rephaites , toward the north."}],"9":[{"catchword":null,"tekst":"Then shall this border reach from the height of the mountain , unto the water-fountain of Nephthoa , and go out to the cities of mount Ephron : Further this border shall reach to Baala , this is Kiriath-jearim ."}],"10":[{"catchword":null,"tekst":"Then this border shall turn about from Baala , toward the west , to mount Seir , [ This mount lay in the land of Juda . There was another Seir in Edom , from whence this land had its name ] and shall pass through on the side of mount Jearim , from the north : this is Chesalon , and it shall descend to Beth-semes , [ i.e. the house of the Sun . &rsquo; T was a Cty situate in the tribe of Juda , 2 Kings 14.11. but given to the Levites for their habitation , Jos. 21.16. It must be distinguished from that Beth-seme which lieth in the tribe of Issachar , Jos. 19.22. Into this city was the Ark of the Covenant first brought , after it had been seven moneths in the Philistines country, 1 Sam. 6.12.] and pass thorow Timna ."}],"11":[{"catchword":null,"tekst":"Moreover , this border shall go out on the side of Ekron northward ; and his border shall reach unto Sichron , and pass over the mountain Baala , and go out to Jabneel : and the goings out of this border , shall be to the sea . [ viz. To the Midland-sea , which v.12.is called the great Sea.]"}],"12":[{"catc // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

  }
  if (tab === 'verwijzingen') {

    }

    if (engels && engels.length) {

        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';

    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
