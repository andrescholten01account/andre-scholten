en van Simeon ligt binnen het gebied van de kinderen van Juda; want het erfdeel van de kinderen van Juda was te groot voor hen; daarom erfden de kinderen van Simeon in het midden van hun erfdeel.","10":"Daarna kwam het derde lot op voor de kinderen van Zebulon, naar hun huisgezinnen; en de grens van hun erfdeel liep tot aan Sarid.","11":"En hun grens gaat omhoog naar het westen en Mar-ala, en reikt tot Dabbaseth, en reikt tot aan de beek die vóór Jokneam ligt.","12":"En zij keert zich van Sarid oostwaarts naar de opgang van de zon, tot de grens van Chisloth-thabor, en zij komt uit bij Dobrath, en gaat omhoog naar Jafia.","13":"En vandaar gaat zij oostwaarts door naar de opgang, naar Gath-hefer, naar Eth-kazin, en zij komt uit bij Rimmon-methoar, dat is Nea.","14":"En deze grens keert zich om naar het noorden naar Hannathon, en haar uiteinden zijn het dal van Jiftah-el.","15":"En Kattath, en Nahalal, en Simron, en Jidala, en Bethlehem; twaalf steden en hun dorpen.","16":"Dit is het erfdeel van de kinderen van Zebulon, naar hun huisgezinnen; deze steden en hun dorpen.","17":"Het vierde lot kwam uit voor Issaschar, voor de kinderen van Issaschar, naar hun huisgezinnen.","18":"En hun grens was Jizreëla, en Chesulloth, en Sunem,","19":"En Hafaraim, en Sion, en Anacharath,","20":"En Rabbith, en Kisjon, en Ebez,","21":"En Remeth, en En-gannim, en En-hadda, en Beth-pazzez.","22":"En deze grens reikt aan Thabor, en Sahazima, en Beth-semes; en de uiteinden van hun grens liggen aan de Jordaan; zestien steden en hun dorpen.","23":"Dit is het erfdeel van de stam van de kinderen van Issaschar, naar hun huisgezinnen, de steden en hun dorpen.","24":"Toen kwam het vijfde lot uit voor de stam van de kinderen van Aser, naar hun huisgezinnen.","25":"En hun grens was Helkath, en Hali, en Beten, en Achsaf,","26":"En Allammelech, en Am-ad, en Mis-al; en zij reikt aan Karmel westwaarts, en aan Sichor-libnath;","27":"En keert zich naar de opgang van de zon naar Beth-dagon, en reikt aan Zebulon, en aan het dal Jiftha-el noordwaarts naar Beth-emek, en Nehiel, en komt uit bij Kabul, ter linkerhand;","28":"En Ebron, en Rehob, en Hammon, en Kana, tot aan het grote Sidon.","29":"En deze grens keert zich naar Rama, en tot aan de vaste stad Tyrus; dan keert deze grens naar Hosa, en haar uiteinden zijn aan de zee, vanaf het gebied dat naar Achzib strekt,","30":"En Umma, en Afek, en Rehob; tweeëntwintig steden en hun dorpen.","31":"Dit is het erfdeel van de stam van de kinderen van Aser, naar hun huisgezinnen, deze steden en hun dorpen.","32":"Het zesde lot kwam uit voor de kinderen van Nafthali, voor de kinderen van Nafthali, naar hun huisgezinnen.","33":"En hun grens loopt van Helef, van Allon tot Zaanannim, en Adami-nekeb, en Jabneel, tot Lakkum; en haar uiteinden zijn aan de Jordaan.","34":"En deze grens keert zich westwaarts naar Asnoth-thabor, en vandaar gaat zij verder naar Hukkok, en zij reikt aan Zebulon tegen het zuiden, en aan Aser reikt zij tegen het westen, en aan Juda aan de Jordaan tegen de opgang van de zon.","35":"De vaste steden nu zijn: Ziddim, Zer en Hammath, Rakkath en Cinnereth,","36":"En Adama, en Rama, en Hazor,","37":"En Kedes, en Edrei, en En-hazor,","38":"En Jiron, en Migdal-el, Horem en Beth-anath, en Beth-semes; negentien steden en hun dorpen.","39":"Dit is het erfdeel van de stam van de kinderen van Nafthali, naar hun huisgezinnen, de steden en hun dorpen.","40":"Het zevende lot kwam uit voor de stam van de kinderen van Dan, naar hun huisgezinnen.","41":"En het gebied van hun erfdeel was: Zora, en Esthaol, en Ir-semes,","42":"En Saalabbin, en Ajalon, en Jithla,","43":"En Elon, en Timnatha, en Ekron,","44":"En Elteke, en Gibbethon, en Baälath,","45":"En Jehud, en Bene-berak, en Gath-rimmon,","46":"En Me-jarkon, en Rakkon, met het gebied tegenover Jafo.","47":"Doch het gebied van de kinderen van Dan was voor hen te klein uitgekomen; daarom trokken de kinderen van Dan op, en streden tegen Lesem, en namen haar in, en sloegen haar met de scherpte van het zwaard, en erfden haar, en woonden daarin; en zij noemden Lesem Dan, naar de naam van hun vader Dan.","48":"Dit is het erfdeel van de stam van de kinderen van Dan, naar hun huisgezinnen, deze steden en hun dorpen.","49":"Toen zij nu klaar waren met het land erfelijk te verdelen, naar zijn grenzen, gaven de kinderen van Israël aan Jozua, de zoon van Nun, een erfdeel in hun midden.","50":"Naar het bevel van de HEERE gaven zij hem die stad die hij vroeg, Thimnath-serah, op het gebergte van Efraïm; en hij bouwde die stad, en woonde daarin.","51":"Dit zijn de erfdelen die Eleazar, de priester, en Jozua, de zoon van Nun, en de hoofden van de vaders van de stammen van de kinderen van Israël door het lot erfelijk uitdeelden te Silo, voor het aangezicht van de HEERE, aan de deur van de tent van de samenkomst. Zo maakten zij een einde aan het uitdelen van het land."},"SV":{"1":"Daarna ging het tweede lot uit voor Simeon, voor den stam der kinderen van Simeon, naar hun huisgezinnen; en hun erfdeel was in het midden van het erfdeel der kinderen van Juda.","2":"En zij hadden in hun erfdeel: Beer-seba, en Seba, en Molada,","3":"En Hazar-sual, en Bala, en Azem,","4":"En Eltholad, en Bethul, en Horma,","5":"En Ziklag, en Beth-hammerchaboth, en Hazar-suza,","6":"En Beth-lebaoth, en Saruhen; dertien steden en haar dorpen.","7":"Ain, Rimmon, en Ether, en Asan; vier steden en haar dorpen;","8":"En al de dorpen, die rondom deze steden waren, tot Baälath-beer, *dat* *is* Ramath tegen het zuiden. Dit is het erfdeel van den stam der kinderen van Simeon, naar hun huisgezinnen.","9":"Het erfdeel der kinderen van Simeon is onder het snoer der kinderen van Juda; want het erfdeel der kinderen van Juda was te groot voor hen; daarom erfden de kinderen van Simeon in het midden van hun erfdeel.","10":"Daarna kwam het derde lot op voor de kinderen van Zebulon, naar hun huisgezinnen; en de landpale van hun erfdeel was tot aan Sarid.","11":"En hun landpale gaat opwaarts naar het westen en Mar-ala, en reikt tot Dabbaseth, en reikt tot aan de beek, die voor aan Jokneam is.","12":"En zij wendt zich van Sarid oostwaarts tegen den opgang der zon, tot de landpale van Chisloth-thabor, en zij komt uit te Dobrath, en gaat opwaarts naar Jafia.","13":"En van daar gaat zij oostwaarts door naar den opgang, naar Gath-hefer, te Eth-kazin, en zij komt uit te Rimmon-methoar, hetwelk is Nea.","14":"En deze landpale keert zich om tegen het noorden naar Hannathon, en haar uitgangen zijn het dal van Jiftah-el.","15":"En Kattath, en Nahalal, en Simron, en Jidala, en Bethlehem; twaalf steden en haar dorpen.","16":"Dit is het erfdeel der kinderen van Zebulon, naar hun huisgezinnen; deze steden en haar dorpen.","17":"Het vierde lot ging uit voor Issaschar, voor de kinderen van Issaschar, naar hun huisgezinnen.","18":"En hun landpale was Jizreëla, en Chesulloth, en Sunem,","19":"En Hafaraim, en Sion, en Anacharath,","20":"En Rabbith, en Kisjon, en Ebez,","21":"En Remeth, en En-gannim, en En-hadda, en Beth-pazzez.","22":"En deze landpale reikt aan Thabor, en Sahazima, en Beth-semes; en de uitgangen van hun landpale zijn aan de Jordaan; zestien steden en haar dorpen.","23":"Dit is het erfdeel van den stam der kinderen van Issaschar, naar hun huisgezinnen, de steden en haar dorpen.","24":"Toen ging het vijfde lot voor den stam der kinderen van Aser uit, naar hun huisgezinnen.","25":"En hun landpale was Helkath, en Hali, en Beten, en Achsaf,","26":"En Allammelech, en Am-ad, en Mis-al; en zij reikt aan Karmel westwaarts, en aan Sichor-libnath;","27":"En wendt zich tegen den opgang der zon naar Beth-dagon, en reikt aan Zebulon, en aan het dal Jiftha-el noordwaarts naar Beth-emek, en Nehiel, en komt uit tot Kabul ter linkerhand;","28":"En Ebron, en Rehob, en Hammon, en Kana, tot aan groot Sidon.","29":"En deze landpale wendt zich naar Rama, en tot aan de vaste stad Tyrus; dan keert deze landpale naar Hosa, en haar uitgangen zijn aan de zee, van het landsnoer *strekkende* naar Achzib,","30":"En Umma, en Afek, en Rehob; twee en twintig steden en haar dorpen.","31":"Dit is het erfdeel van den stam der kinderen van Aser, naar hun huisgezinnen, deze steden en haar dorpen.","32":"Het zesde lot ging uit voor de kinderen van Nafthali, voor de kinderen van Nafthali, naar hun huisgezinnen.","33":"En hun landpale is van Helef, van Allon tot Zaanannim, en Adami-nekeb, en Jabneel, tot Lakkum; en haar uitgangen zijn aan de Jordaan.","34":"En deze landpale wendt zich westwaarts naar Asnoth-thabor, en van daar gaat zij voort naar Hukkok, en zij reikt aan Zebulon tegen het zuiden, en aan Aser reikt zij tegen het westen, en aan Juda aan de Jordaan tegen den opgang der zon.","35":"De vaste steden nu zijn: Ziddim, Zer en Hammath, Rakkath en Cinnereth,","36":"En Adama, en Rama, en Hazor,","37":"En Kedes, en Edrei, en En-hazor,","38":"En Jiron, en Migdal-el, Horem en Beth-anath, en Beth-semes; negentien steden en haar dorpen.","39":"Dit is het erfdeel van den stam der kinderen van Nafthali, naar hun huisgezinnen, de steden en haar dorpen.","40":"Het zevende lot ging uit voor den stam der kinderen van Dan, naar hun huisgezinnen.","41":"En de landpale van hun erfdeel was: Zora, en Esthaol, en Ir-semes,","42":"En Saalabbin, en Ajalon, en Jithla,","43":"En Elon, en Timnatha, en Ekron,","44":"En Elteke, en Gibbethon, en Baälath,","45":"En Jehud, en Bene-berak, en Gath-rimmon,","46":"En Me-jarkon, en Rakkon, met de landpale tegenover Jafo.","47":"Doch de landpale der kinderen van Dan was hun te klein uitgekomen; daarom togen de kinderen van Dan op, en krijgden tegen Lesem, en namen haar in, en sloegen haar met de scherpte des zwaards, en erfden haar, en woonden daarin; en zij noemden Lesem Dan, naar den naam van hun vader Dan.","48":"Dit is het erfdeel van den stam der kinderen van Dan, naar hun huisgezinnen, deze steden en haar dorpen.","49":"Toen zij nu geëindigd hadden het land erfelijk te delen, naar zijn landpalen, zo gaven de kinderen Israëls aan Jozua, den zoon van Nun, een erfdeel in het midden van hen.","50":"Naar den mond des HEEREN gaven zij hem die stad, welke hij begeerde, Thimnath-serah, op het gebergte van Efraïm; en hij bouwde die stad, en woonde in dezelve.","51":"Dit zijn de erfdelen, welke Eleazar, de priester, en Jozua, de zoon van Nun, en de hoofden der vaderen van de stammen, door het lot aan de kinderen Israëls erfelijk uitdeelden te Silo, voor het aangezicht des HEEREN, aan de deur van de tent der samenkomst. Aldus maakten zij een einde van het uitdelen des lands."},"KJV":{"1":"And the second lot came forth to Simeon, *even* for the tribe of the children of Simeon according to their families: and their inheritance was within the inheritance of the children of Judah.","2":"And they had in their inheritance Beersheba, or Sheba, and Moladah,","3":"And Hazarshual, and Balah, and Azem,","4":"And Eltolad, and Bethul, and Hormah,","5":"And Ziklag, and Bethmarcaboth, and Hazarsusah,","6":"And Bethlebaoth, and Sharuhen; thirteen cities and their villages:","7":"Ain, Remmon, and Ether, and Ashan; four cities and their villages:","8":"And all the villages that *were* round about these cities to Baalathbeer, Ramath of the south. This *is* the inheritance of the tribe of the children of Simeon according to their families.","9":"Out of the portion of the children of Judah *was* the inheritance of the children of Simeon: for the part of the children of Judah was too much for them: therefore the children of Simeon had their inheritance within the inheritance","10":"And the third lot came up for the children of Zebulun according to their families: and the border of their inheritance was unto Sarid:","11":"And their border went up toward the sea, and Maralah, and reached to Dabbasheth, and reached to the river that *is* before Jokneam;","12":"And turned from Sarid eastward toward the sunrising unto the border of Chislothtabor, and then goeth out to Daberath, and goeth up to Japhia,","13":"And from thence passeth on along on the east to Gittahhepher, to Ittahkazin, and goeth out to Remmonmethoar to Neah;","14":"And the border compasseth it on the north side to Hannathon: and the outgoings thereof are in the valley of Jiphthahel:","15":"And Kattath, and Nahallal, and Shimron, and Idalah, and Bethlehem: twelve cities with their villages.","16":"This *is* the inheritance of the children of Zebulun according to their families, these cities with their villages.","17":"*And* the fourth lot came out to Issachar, for the children of Issachar according to their families.","18":"And their border was toward Jezreel, and Chesulloth, and Shunem,","19":"And Hapharaim, and Shion, and Anaharath,","20":"And Rabbith, and Kishion, and Abez,","21":"And Remeth, and Engannim, and Enhaddah, and Bethpazzez;","22":"And the coast reacheth to Tabor, and Shahazimah, and Bethshemesh; and the outgoings of their border were at Jordan: sixteen cities with their villages.","23":"This *is* the inheritance of the tribe of the children of Issachar according to their families, the cities and their villages.","24":"And the fifth lot came out for the tribe of the children of Asher according to their families.","25":"And their border was Helkath, and Hali, and Beten, and Achshaph,","26":"And Alammelech, and Amad, and Misheal; and reacheth to Carmel westward, and to Shihorlibnath;","27":"And turneth toward the sunrising to Bethdagon, and reacheth to Zebulun, and to the valley of Jiphthahel toward the north side of Bethemek, and Neiel, and goeth out to Cabul on the left hand,","28":"And Hebron, and Rehob, and Hammon, and Kanah, *even* unto great Zidon;","29":"And *then* the coast turneth to Ramah, and to the strong city Tyre; and the coast turneth to Hosah; and the outgoings thereof are at the sea from the coast to Achzib:","30":"Ummah also, and Aphek, and Rehob: twenty and two cities with their villages.","31":"This *is* the inheritance of the tribe of the children of Asher according to their families, these cities with their villages.","32":"The sixth lot came out to the children of Naphtali, *even* for the children of Naphtali according to their families.","33":"And their coast was from Heleph, from Allon to Zaanannim, and Adami, Nekeb, and Jabneel, unto Lakum; and the outgoings thereof were at Jordan:","34":"And *then* the coast turneth westward to Aznothtabor, and goeth out from thence to Hukkok, and reacheth to Zebulun on the south side, and reacheth to Asher on the west side, and to Judah upon Jordan toward the sunrising.","35":"And the fenced cities *are* Ziddim, Zer, and Hammath, Rakkath, and Chinnereth,","36":"And Adamah, and Ramah, and Hazor,","37":"And Kedesh, and Edrei, and Enhazor,","38":"And Iron, and Migdalel, Horem, and Bethanath, and Bethshemesh; nineteen cities with their villages.","39":"This *is* the inheritance of the tribe of the children of Naphtali according to their families, the cities and their villages.","40":"*And* the seventh lot came out for the tribe of the children of Dan according to their families.","41":"And the coast of their inheritance was Zorah, and Eshtaol, and Irshemesh,","42":"And Shaalabbin, and Ajalon, and Jethlah,","43":"And Elon, and Thimnathah, and Ekron,","44":"And Eltekeh, and Gibbethon, and Baalath,","45":"And Jehud, and Beneberak, and Gathrimmon,","46":"And Mejarkon, and Rakkon, with the border before Japho.","47":"And the coast of the children of Dan went out *too little* for them: therefore the children of Dan went up to fight against Leshem, and took it, and smote it with the edge of the sword, and possessed it, and dwelt therein, and called Leshem, Dan, after the name of Dan their father.","48":"This *is* the inheritance of the tribe of the children of Dan according to their families, these cities with their villages.","49":"When they had made an end of dividing the land for inheritance by their coasts, the children of Israel gave an inheritance to Joshua the son of Nun among","50":"According to the word of the LORD they gave function md(t) {  // *cursief* -> <em>, noot [n] -> sup

    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
