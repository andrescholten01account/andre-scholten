eeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Toen riep Jozua de Rubenieten, en de Gadieten, en de halve stam van Manasse,", "2": "En hij zei tegen hen: U hebt alles onderhouden wat Mozes, de dienaar van de HEERE, u geboden heeft; en u bent mijn stem gehoorzaam geweest in alles wat ik u geboden heb.", "3": "U hebt uw broeders niet verlaten, nu al deze tijd, tot op deze dag toe; maar u hebt de onderhouding van de geboden van de HEERE, uw God, waargenomen.", "4": "En nu heeft de HEERE, uw God, uw broeders rust gegeven, zoals Hij hun toegezegd had; keert dan nu terug, en gaat u naar uw tenten, naar het land van uw bezitting, dat Mozes, de dienaar van de HEERE, u gegeven heeft aan de andere zijde van de Jordaan.", "5": "Neem alleen nauwgezet in acht om te doen het gebod en de wet, die Mozes, de dienaar van de HEERE, u geboden heeft: dat u de HEERE, uw God, liefhebt, en dat u wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat u Hem dient met uw hele hart en met uw hele ziel.", "6": "Zo zegende Jozua hen, en liet hen gaan; en zij gingen naar hun tenten.", "7": "Want aan de helft van de stam van Manasse had Mozes een erfdeel gegeven in Basan; maar aan de andere helft daarvan gaf Jozua een erfdeel bij hun broeders, aan deze zijde van de Jordaan westwaarts. Verder ook, toen Jozua hen liet vertrekken naar hun tenten, zegende hij hen ook.", "8": "En hij sprak tot hen, en zei: Keert terug naar uw tenten met veel rijkdom, en met heel veel vee, met zilver, en met goud, en met koper, en met ijzer, en met heel veel kleding; deelt de buit van uw vijanden met uw broeders.", "9": "Zo keerden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse terug, en trokken weg van de kinderen van Israël, van Silo, dat in het land Kanaän is, om te gaan naar het land van Gilead, naar het land van hun bezitting, waarin zij bezitters gemaakt waren, naar het bevel van de HEERE, door de dienst van Mozes.", "10": "Toen zij aankwamen bij de grenzen van de Jordaan, die in het land Kanaän zijn, bouwden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse daar een altaar bij de Jordaan, een altaar groot van aanzien.", "11": "En de kinderen van Israël hoorden zeggen: Zie, de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse hebben een altaar gebouwd, tegenover het land Kanaän, aan de grenzen van de Jordaan, aan de zijde van de kinderen van Israël.", "12": "Toen de kinderen van Israël dit hoorden, verzamelde de hele vergadering van de kinderen van Israël zich te Silo, om tegen hen op te trekken met een leger.", "13": "En de kinderen van Israël zonden naar de kinderen van Ruben, en naar de kinderen van Gad, en naar de halve stam van Manasse, in het land Gilead, Pinehas, de zoon van Eleazar, de priester;", "14": "En tien leiders met hem, van elk vaderlijk huis één leider, uit al de stammen van Israël; en zij waren elk een hoofd van het huis van hun vaderen over de duizenden van Israël.", "15": "Toen zij bij de kinderen van Ruben, en bij de kinderen van Gad, en bij de halve stam van Manasse aankwamen, in het land Gilead, spraken zij met hen, en zeiden:", "16": "Zo spreekt de hele gemeente van de HEERE: Wat is dit voor een overtreding, waarmee u overtreden hebt tegen de God van Israël, doordat u vandaag afkeert van achter de HEERE, door voor u een altaar te bouwen, om vandaag opstandig te zijn tegen de HEERE?", "17": "Is de ongerechtigheid van Peor ons te weinig, waarvan wij niet gereinigd zijn tot op deze dag, hoewel de plaag in de vergadering van de HEERE geweest is?", "18": "Nu u zich vandaag afkeert van achter de HEERE, zal het gebeuren, als u vandaag opstandig bent tegen de HEERE, dat Hij Zich morgen zeer zal vertoornen tegen de hele gemeente van Israël.", "19": "Maar toch, als het land van uw bezitting onrein is, komt dan over naar het land van de bezitting van de HEERE, waar de tabernakel van de HEERE woont, en neemt bezit in het midden van ons; maar wees niet opstandig tegen de HEERE, en wees ook niet opstandig tegen ons, door voor u een altaar te bouwen, naast het altaar van de HEERE, onze God.", "20": "Heeft Achan, de zoon van Zerah, geen overtreding begaan met het verbannene[1], en kwam er niet een verbolgenheid over de hele vergadering van Israël? En die man stierf niet alleen in zijn ongerechtigheid.", "21": "Toen antwoordden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse, en zij spraken met de hoofden van de duizenden van Israël:", "22": "De God der goden, de HEERE, de God der goden, de HEERE, Die weet het; Israël zelf zal het ook weten! Is het door weerspannigheid, of is het door overtreding tegen de HEERE, dan behoedt Hij ons vandaag niet;", "23": "Dat wij voor ons een altaar zouden gebouwd hebben, om ons van achter de HEERE af te keren, of om brandoffer en spijsoffer daarop te offeren, of om dankoffer daarop te doen, dan eist het de Heere Zelf.", "24": "En als wij dit niet uit zorg vanwege deze zaak gedaan hebben, en zeiden: Morgen zouden uw kinderen tot onze kinderen kunnen spreken, en zeggen: Wat hebt u met de HEERE, de God van Israël, te doen?", "25": "De HEERE heeft immers[2] de Jordaan tot grens gezet tussen ons en tussen u, u, kinderen van Ruben, en u, kinderen van Gad! U hebt geen deel aan de HEERE. Zo zouden uw kinderen onze kinderen kunnen doen ophouden de HEERE te vrezen.", "26": "Daarom zeiden wij: Laten wij toch voor ons een altaar maken, door het te bouwen, niet voor brandoffer, en ook niet voor offer.", "27": "Maar dat het een getuige zij tussen ons en tussen u, en tussen onze geslachten na ons, opdat wij de dienst van de HEERE voor Zijn aangezicht mogen dienen met onze brandoffers, en met onze slachtoffers, en met onze dankoffers; en dat uw kinderen tot onze kinderen morgen niet zeggen: U hebt geen deel aan de HEERE.", "28": "Daarom zeiden wij: Wanneer het gebeurt, dat zij morgen zo tot ons en tot onze geslachten zullen zeggen, dan zullen wij zeggen: Ziet de vorm van het altaar van de HEERE, dat onze vaderen gemaakt hebben, niet voor brandoffer, en ook niet voor offer; maar het is een getuige tussen ons en tussen u.", "29": "Het zij verre van ons, dat wij opstandig zouden zijn tegen de HEERE, of dat wij ons vandaag van achter de HEERE zouden afkeren, door een altaar te bouwen voor brandoffer, spijsoffer, of slachtoffer, buiten het altaar van de HEERE, onze God, dat vóór Zijn tabernakel is.", "30": "Toen de priester Pinehas, en de leiders van de vergadering, en de hoofden van de duizenden van Israël, die met hem waren, de woorden hoorden, die de kinderen van Ruben, en de kinderen van Gad, en de kinderen van Manasse gesproken hadden, was het goed in hun ogen.", "31": "En Pinehas, de zoon van de priester Eleazar, zei tegen de kinderen van Ruben, en tegen de kinderen van Gad, en tegen de kinderen van Manasse: Vandaag weten wij, dat de HEERE in het midden van ons is, omdat u deze overtreding tegen de HEERE niet begaan hebt; nu hebt u de kinderen van Israël verlost uit de hand van de HEERE.", "32": "En Pinehas, de zoon van de priester Eleazar, keerde terug met de leiders van de kinderen van Ruben, en van de kinderen van Gad, uit het land Gilead, naar het land Kanaän, naar de kinderen van Israël; en zij brachten hun antwoord terug;", "33": "Het antwoord nu was goed in de ogen van de kinderen van Israël, en de kinderen van Israël loofden God, en zeiden niet meer dat zij tegen hen op wilden trekken met een leger, om het land te verderven, waarin de kinderen van Ruben en de kinderen van Gad woonden.", "34": "En de kinderen van Ruben en de kinderen van Gad noemden dat altaar: Getuige, want het zij een getuige tussen ons, dat de HEERE God is."}, "SV": {"1": "Toen riep Jozua de Rubenieten, en de Gadieten, en den halven stam van Manasse,", "2": "En hij zeide tot hen: Gijlieden hebt onderhouden alles, wat u Mozes, de knecht des HEEREN, geboden heeft; en gij zijt mijner stem gehoorzaam geweest in alles, wat ik u geboden heb.", "3": "Gij hebt uw broederen niet verlaten nu langen tijd, tot op dezen dag toe; maar gij hebt waargenomen de onderhouding der geboden van den HEERE, uw God.", "4": "En nu, de HEERE, uw God, heeft uw broederen rust gegeven, gelijk Hij hun toegezegd had; keert dan nu wederom, en gaat gij naar uw tenten, naar het land uwer bezitting, hetwelk u Mozes, de knecht des HEEREN, gegeven heeft op gene zijde van de Jordaan.", "5": "Alleenlijk neemt naarstiglijk waar te doen het gebod en de wet, die u Mozes, de knecht des HEEREN, geboden heeft, dat gij den HEERE, uw God, liefhebt, en dat gij wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat gij Hem dient met uw ganse hart en met uw ganse ziel.", "6": "Alzo zegende hen Jozua, en hij liet hen gaan; en zij gingen naar hun tenten.", "7": "Want aan de helft van den stam van Manasse had Mozes *een* *erfdeel* gegeven in Bazan; maar aan *de* *andere* helft van denzelven gaf Jozua *een* *erfdeel* bij hun broederen, aan deze zijde van de Jordaan westwaarts. Verder ook als Jozua hen liet trekken naar hun tenten, zo zegende hij hen.", "8": "En hij sprak tot hen, zeggende: Keert weder tot uw tenten met veel rijkdom, en met zeer veel vee, met zilver, en met goud, en met koper, en met ijzer, en met zeer veel klederen; deelt den roof uwer vijanden met uw broederen.", "9": "Alzo keerden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse wederom, en togen van de kinderen Israëls, van Silo, dat in het land Kanaän is, om te gaan naar het land van Gilead, naar het land hunner bezitting, in hetwelk zij bezitters gemaakt waren, naar den mond des HEEREN, door den dienst van Mozes.", "10": "Toen zij kwamen aan de grenzen van de Jordaan, die in het land Kanaän zijn, zo bouwden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse aldaar een altaar aan de Jordaan, een altaar groot in het aanzien.", "11": "En de kinderen Israëls hoorden zeggen: Ziet, de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse hebben een altaar gebouwd, tegenover het land Kanaän, aan de grenzen van de Jordaan, aan de zijde der kinderen Israëls.", "12": "Als de kinderen Israëls *dit* hoorden, zo verzamelde de ganse vergadering der kinderen Israëls te Silo, dat zij tegen hen optogen met een heir.", "13": "En de kinderen Israëls zonden aan de kinderen van Ruben, en aan de kinderen van Gad, en aan den halven stam van Manasse, in het land Gilead, Pinehas, den zoon van Eleazar, den priester;", "14": "En tien vorsten met hem, van ieder vaderlijk huis een vorst, uit al de stammen van Israël; en zij waren een ieder een hoofd van het huis hunner vaderen over de duizenden van Israël.", "15": "Toen zij tot de kinderen van Ruben, en tot de kinderen van Gad, en tot den halven stam van Manasse kwamen, in het land Gilead, zo spraken zij met hen, zeggende:", "16": "Alzo spreekt de ganse gemeente des HEEREN: Wat overtreding is dit, waarmede gijlieden overtreden hebt tegen den God van Israël, heden afkerende van achter den HEERE, mits dat gij een altaar voor u gebouwd hebt, om heden tegen den HEERE wederspannig te zijn?", "17": "Is ons de ongerechtigheid van Peor te weinig, van dewelke wij niet gereinigd zijn tot op dezen dag, hoewel de plaag in de vergadering des HEEREN geweest is?", "18": "Dewijl gij u heden van achter den HEERE afkeert, het zal dan geschieden, als gij heden wederspannig zijt tegen den HEERE, zo zal Hij Zich morgen grotelijks vertoornen tegen de ganse gemeente van Israël.", "19": "Maar toch, indien het land uwer bezitting onrein is, komt over in het land van de bezitting des HEEREN, waar de tabernakel des HEEREN woont, en neemt bezitting in het midden van ons; maar zijt niet wederspannig tegen den HEERE, en zijt ook niet wederspannig tegen ons, een altaar voor u bouwende, behalve het altaar van den HEERE, onzen God.", "20": "Heeft niet Achan, de zoon van Zerah, overtreding begaan met het verbannene, en kwam er niet een verbolgenheid over de ganse vergadering van Israël? En die man stierf niet alleen in zijn ongerechtigheid.", "21": "Toen antwoordden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse, en zij spraken met de hoofden der duizenden van Israël:", "22": "De God der goden, de HEERE, de God der goden, de HEERE, Die weet het; Israël zelf zal het ook weten! Is het door wederspannigheid, of is het door overtreding tegen den HEERE, zo behoudt ons heden niet;", "23": "Dat wij ons een altaar zouden gebouwd hebben, om ons van achter den HEERE af te keren, of om brandoffer en spijsoffer daarop te offeren, of om dankoffer daarop te doen, zo eise het de Heere.", "24": "En zo wij dit niet uit zorg vanwege *deze* zaak gedaan hebben, zeggende: Morgen mochten uw kinderen tot onze kinderen spreken, zeggende: Wat hebt gij met den HEERE, den God van Israël, te doen?", "25": "De HEERE heeft immers de Jordaan tot landpale gezet tussen ons en tussen ulieden, gij, kinderen van Ruben, en gij, kinderen van Gad! gij hebt geen deel aan den HEERE. Zo mochten uw kinderen onze kinderen doen ophouden, dat zij den HEERE niet vreesden.", "26": "Daarom zeiden wij: Laat ons toch voor ons maken, bouwende een altaar, niet ten brandoffer, noch ten offer.", "27": "Maar dat het een getuige zij tussen ons en tussen ulieden, en tussen onze geslachten na ons, opdat wij den dienst des HEEREN voor Zijn aangezicht dienen mochten met onze brandofferen, en met onze slachtofferen, en met onze dankofferen; en dat uw kinderen tot onze kinderen morgen niet zeggen: Gijlieden hebt geen deel aan den HEERE.", "28": "Daarom zeiden wij: Wanneer het geschiedt, dat zij morgen *alzo* tot ons en tot onze geslachten zeggen zullen; zo zullen wij zeggen: Ziet de gedaante van het altaar des HEEREN, hetwelk onze vaderen gemaakt hebben, niet ten brandoffer, noch ten offer; maar het is een getuige tussen ons en tussen ulieden.", "29": "Het zij verre van ons, dat wij zouden wederspannig zijn tegen den HEERE, of dat wij te dezen dage ons van achter den HEERE afkeren zouden, bouwende een altaar ten brandoffer, ten spijsoffer, of ten slachtoffer, behalve het altaar van den HEERE, onzen God, dat voor Zijn tabernakel is.", "30": "Toen de priester Pinehas, en de oversten der vergadering, en de hoofden der duizenden van Israël, die bij hem waren, de woorden hoorden, die de kinderen van Ruben, en de kinderen van Gad, en de kinderen van Manasse gesproken hadden, zo was het goed in hun ogen.", "31": "En Pinehas, de zoon van den priester Eleazar, zeide tot de kinderen van Ruben, en tot de kinderen van Gad, en tot de kinderen van Manasse: Heden weten wij, dat de HEERE in het midden van ons is, dewijl gij deze overtreding tegen den HEERE niet begaan hebt; toen hebt gijlieden de kinderen Israëls verlost uit de hand des HEEREN.", "32": "En Pinehas, de zoon van den priester Eleazar, keerde wederom met de oversten van de kinderen van Ruben, en van de kinderen van Gad, uit het land Gilead, naar het land Kanaän, tot de kinderen Israëls; en zij brachten hun antwoord weder;", "33": "Het antwoord nu was goed in de ogen van de kinderen Israëls, en de kinderen Israëls loofden God, en zeiden niet *meer* van tegen hen op te trekken met een heir, om het land te verderven, waarin de kinderen van Ruben en de kinderen van Gad woonden.", "34": "En de kinderen van Ruben en de kinderen van Gad noemden dat altaar: Dat het een getuige zij tussen ons, dat de HEERE God is."}, "KJV": {"1": "Then Joshua called the Reubenites, and the Gadites, and the half tribe of Manasseh,", "2": "And said unto them, Ye have kept all that Moses the servant of the LORD commanded you, and have obeyed my voice in all that I commanded", "3": "Ye have not left your brethren these many days unto this day, but have kept the charge of the commandment of the LORD your God.", "4": "And now the LORD your God hath given rest unto your brethren, as he promised them: therefore now return ye, and get you unto your tents, *and* unto the land of your possession, which Moses the servant of the LORD gave you on the other side Jordan.", "5": "But take diligent heed to do the commandment and the law, which Moses the servant of the LORD charged you, to love the LORD your God, and to walk in all his ways, and to keep his commandments, and to cleave unto him, and to serve him with all your heart and with all your soul.", "6": "So Joshua blessed them, and sent them away: and they went unto their tents.", "7": "Now to the *one* half of the tribe of Manasseh Moses had given *possession* in Bashan: but unto the *other* half thereof gave Joshua among their brethren on this side Jordan westward. And when Joshua sent them away also unto their tents, then he blessed", "8": "And he spake unto them, saying, Return with much riches unto your tents, and with very much cattle, with silver, and with gold, and with brass, and with iron, and with very much raiment: divide the spoil of your enemies with your brethren.", "9": "And the children of Reuben and the children of Gad and the half tribe of Manasseh returned, and departed from the children of Israel out of Shiloh, which *is* in the land of Canaan, to go unto the country of Gilead, to the land of their possession, whereof they were possessed, according to the word of the LORD by the hand of Moses.", "10": "And when they came unto the borders of Jordan, that *are* in the land of Canaan, the children of Reuben and the children of Gad and the half tribe of Manasseh built there an altar by Jordan, a great altar to see to.", "11": "And the children of Israel heard say, Behold, the children of Reuben and the children of Gad and the half tribe of Manasseh have built an altar over against the land of Canaan, in the borders of Jordan, at the passage of the children of Israel.", "12": "And when the children of Israel heard *of it*, the whole congregation of the children of Israel gathered themselves together at Shiloh, to go up to war", "13": "And the children of Israel sent unto the children of Reuben, and to the children of Gad, and to the half tribe of Manasseh, into the land of Gilead, Phinehas the son of Eleazar the priest,", "14": "And with him ten princes, of each chief house a prince throughout all the tribes of Israel; and each one *was* an head of the house of their fathers among the thousands of Israel.", "15": "And they came unto the children of Reuben, and to the children of Gad, and to the half tribe of Manasseh, unto the land of Gilead, and they spake with them, saying,", "16": "Thus saith the whole congregation of the LORD, What trespass *is* this that ye have committed against the God of Israel, to turn away this day from following the LORD, in that ye have builded you an altar, that ye might rebel this day against the LORD?", "17": "*Is* the iniquity of Peor too little for us, from which we are not cleansed until this day, although there was a plague in the congregation of the LORD,", "18": "But that ye must turn away this day from following the LORD? and it will be, *seeing* ye rebel to day against the LORD, that to morrow he will be wroth with the whole congregation of Israel.", "19": "Notwithstanding, if the land of your possession *be* unclean, *then* pass ye over unto the land of the possession of the LORD, wherein the LORD'S tabernacle dwelleth, and take possession among us: but rebel not against the LORD, nor rebel against us, in building you an altar beside the altar of the LORD our God.", "20": "Did not Achan the son of Zerah commit a trespass in the accursed thing, and wrath fell on all the congregation of Israel? and that man perished not alone in his iniquity.", "21": "Then the children of Reuben and the children of Gad and the half tribe of Manasseh answered, and said unto the heads of the thousands of Israel,", "22": "The LORD God of gods, the LORD God of gods, he knoweth, and Israel he shall know; if *it be* in rebellion, or if in transgression against the LORD, (save us not this day,)", "23": "That we have built us an altar to turn from following the LORD, or if to offer thereon burnt offering or meat offering, or if to offer peace offerings thereon, let the LORD himself require", "24": "And if we have not *rather* done it for fear of *this* thing, saying, In time to come your children might speak unto our children, saying, What have ye to do with the LORD God of Israel?", "25": "For the LORD hath made Jordan a border between us and you, ye children of Reuben and children of Gad; ye have no part in the LORD: so shall your children make our children cease from fearing the LORD.", "26": "Therefore we said, Let us now prepare to build us an altar, not for burnt offering, nor for sacrifice:", "27": "But *that* it *may be* a witness between us, and you, and our generations after us, that we might do the service of the LORD before him with our burnt offerings, and with our sacrifices, and with our peace offerings; that your children may not say to our children in time to come, Ye have no part in the LORD.", "28": "Therefore said we, that it shall be, when they should *so* say to us or to our generations in time to come, that we may say *again*, Behold the pattern of the altar of the LORD, which our fathers made, not for burnt offerings, nor for sacrifices; but it *is* a witness", "29": "God forbid that we should rebel against the LORD, and turn this day from following the LORD, to build an altar for burnt offerings, for meat offerings, or for sacrifices, beside the altar of the LORD our God that *is* before his tabernacle.", "30": "And when Phinehas the priest, and the princes of the congregation and heads of the thousands of Israel which *were* with him, heard the words that the children of Reuben and the children of Gad and the children of Manasseh spake, it pleased", "31": "And Phinehas the son of Eleazar the priest said unto the children of Reuben, and to the children of Gad, and to the children of Manasseh, This day we perceive that the LORD *is* among us, because ye have not committed this trespass against the LORD: now ye have delivered the children of Israel out of the hand of the LORD.", "32": "And Phinehas the son of Eleazar the priest, and the princes, returned from the children of Reuben, and from the children of Gad, out of the land of Gilead, unto the land of Canaan, to the children of Israel, and brought them word again.", "33": "And the thing pleased the children of Israel; and the children of Israel blessed God, and did not intend to go up against them in battle, to destroy the land wherein the children of Reuben and Gad dwelt.", "34": "And the children of Reuben and the children of Gad called the altar *Ed*: for it *shall be* a witness between us that the LORD *is* God."}}, "tsk": {"1": [{"kopje": "Jozua", "refs": ["Num 32:18-33", "Deut 29:7", "Deut 29:8"]}], "2": [{"kopje": "U hebt", "refs": ["Num 32:20-29", "Deut 3:16-20"]}, {"kopje": "gehoorzaam geweest", "refs": ["Joz 1:12-18"]}], "4": [{"kopje": "rust gegeven", "refs": ["Joz 21:43", "Joz 21:44", "Deut 12:9"]}, {"kopje": "gaat", "refs": ["Joz 13:8", "Joz 13:15-33", "Joz 14:1-5", "Num 32:33-42", "Deut 3:1-17", "Deut 29:8"]}], "5": [{"kopje": "Neem", "refs": ["Ex 15:26", "Deut 4:1", "Deut 4:2", "Deut 4:6", "Deut 4:9", "Deut 6:6-9", "Deut 6:17", "Deut 11:22", "1 Kron 28:7", "1 Kron 28:8", "Ps 106:3", "Ps 119:4-6", "Spr 4:23", "Jes 55:2", "Jer 12:16", "Hebr 6:11", "Hebr 6:12", "Hebr 12:15", "2 Petr 1:5-10"]}, {"kopje": "liefhebt", "refs": ["Ex 20:6", "Deut 6:5", "Deut 10:12", "Deut 10:13", "Deut 11:1", "Deut 11:13", "Matt 22:37", "Joh 14:15", "Joh 14:21-23", "Joh 21:15-17", "Rom 8:28", "Jak 1:12", "Jak 2:5", "1 Joh 5:2", "1 Joh 5:3"]}, {"kopje": "aanhangt", "refs": ["Joz 23:8", "Deut 4:4", "Deut 10:20", "Deut 13:4", "Hand 11:23", "Rom 12:9"]}, {"kopje": "dient", "refs": ["Joz 24:14", "Joz 24:15", "1 Sam 7:3", "1 Sam 12:20", "1 Sam 12:24", "Matt 4:10", "Matt 6:24", "Luk 1:74", "Joh 12:26", "Hand 27:23", "Rom 1:9"]}], "8": [{"kopje": "Keert terug", "refs": ["Deut 8:9-14", "Deut 8:17", "Deut 8:18", "2 Kron 17:5", "2 Kron 32:27", "Spr 3:16", "1 Kor 15:58", "Hebr 11:26"]}, {"kopje": "deelt", "refs": ["Num 31:27", "1 Sam 30:24", "Ps 68:13"]}], "9": [{"kopje": "het land van Gilead", "refs": ["Joz 13:11", "Joz 13:25", "Joz 13:31", "Num 32:1", "Num 32:26", "Num 32:29", "Num 32:39", "Num 32:40 2 Kron 23:16", "href": "../../2-kronieken/23/#v16", "ref": "2 Kron 23:16", "svLabel": null}, {"disp": "2 Kron 29:10", "href": "../../2-kronieken/29/#v10", "ref": "2 Kron 29:10", "svLabel": null}, {"disp": "Ezra 10:3-44", "href": "../../ezra/10/#v3", "ref": "Ezra 10:3-44", "svLabel": null}, {"disp": "Neh 9:38", "href": "../../nehemia/9/#v38", "ref": "Neh 9:38", "svLabel": null}, {"disp": "Neh 10:1-39", "href": "../../nehemia/10/#v1", "ref": "Neh 10:1-39", "svLabel": null}, {"disp": "Ps 50:5", "href": "../../psalmen/50/#v5", "ref": "Ps 50:5", "svLabel": null}, {"disp": "Jer 34:15", "href": "../../jeremia/34/#v15", "ref": "Jer 34:15", "svLabel": null}, {"disp": "Jer 42:5", "href": "../../jeremia/42/#v5", "ref": "Jer 42:5", "svLabel": null}, {"disp": "Jer 42:6", "href": "../../jeremia/42/#v6", "ref": "Jer 42:6", "svLabel": null}, {"disp": "Jer 50:5", "href": "../../jeremia/50/#v5", "ref": "Jer 50:5", "svLabel": null}, {"disp": "Hos 11:12", "href": "../../hosea/12/#v1", "ref": "Hos 12:1", "svLabel": "SV 12:1"}], "kinderen": []}]}]}, {"topic": "Ed", "href": "../../nave/e/#t-ed", "kinderen": [{"label": "Name of the altar, erected by the tribes, Reuben, Gad, and Manasseh at the fords of the Jordan River", "href": "../../nave/e/?hl=Josh.22.34#i5815", "refs": [{"disp": "Joz 22:34", "href": "../../jozua/22/#v34", "ref": "Joz 22:34", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"1 Kon 12:16": "Toen heel Israël zag dat de koning niet naar hen hoorde, gaf het volk de koning antwoord terug en zei: Wat deel hebben wij aan David? Ja, wij hebben geen erfdeel aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten.", "Ps 119:60": "Ik heb gehaast, en niet vertraagd Uw geboden te onderhouden.", "Ps 96:5": "Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemel gemaakt.", "Micha 7:9": "Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "Deut 8:1-6": "Alle geboden die ik u vandaag gebied, moet u nauwkeurig opvolgen, opdat u leeft en meer wordt, en het land binnengaat en erft, dat de HEERE aan uw vaderen gezworen heeft. En u zult denken aan heel de weg, die de HEERE, uw God, u deze veertig jaar in de woestijn geleid heeft; opdat Hij u verootmoedigt, om u te beproeven, om te weten wat in uw hart was, of u Zijn geboden zou houden, of niet. En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Joz 22:25-28": "De HEERE heeft immers de Jordaan tot grens gezet tussen ons en tussen u, u, kinderen van Ruben, en u, kinderen van Gad! U hebt geen deel aan de HEERE. Zo zouden uw kinderen onze kinderen kunnen doen ophouden de HEERE te vrezen. Daarom zeiden wij: Laten wij toch voor ons een altaar maken, door het te bouwen, niet voor brandoffer, en ook niet voor offer. Maar dat het een getuige zij tussen ons en tussen u, en tussen onze geslachten na ons, opdat wij de dienst van de HEERE voor Zijn aangezicht mogen dienen met onze brandoffers, en met onze slachtoffers, en met onze dankoffers; en dat uw kinderen tot onze kinderen morgen niet zeggen: U hebt geen deel aan de HEERE.", "2 Petr 1:19": "En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten.", "Joz 13:8": "samen met wie de Rubenieten en Gadieten hun erfenis ontvangen hebben; die Mozes hun gaf aan de overkant van de Jordaan naar het oosten toe, zoals Mozes, de knecht van de HEERE, hun gegeven had:", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Jer 50:5": "Zij zullen naar Sion vragen; op de weg hierheen zullen hun gezichten gericht zijn; zij zullen komen en zich bij de HEERE aansluiten, met een eeuwig verbond, dat niet zal worden vergeten.", "2 Kron 11:17": "Zo versterkten zij het koninkrijk van Juda, en maakten Rehabeam, de zoon van Salomo, drie jaar lang sterk; want drie jaar lang wandelden zij op de weg van David en Salomo.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Joh 6:38": "Want Ik ben uit de hemel neergedaald, niet om Mijn eigen wil te doen, maar de wil van Hem die Mij gezonden heeft.", "Num 16:2": "En zij stonden op voor het aangezicht van Mozes, alsook tweehonderd en vijftig mannen uit de kinderen van Israël, leiders van de vergadering, de geroepenen van de samenkomst, mannen van naam.", "Deut 12:18": "Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt.", "Hebr 4:1": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn.", "Ps 119:168": "Ik onderhoud Uw bevelen en Uw getuigenissen, want al mijn wegen zijn voor U.", "Spr 14:34": "Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Neh 3:19": "Aan zijn hand verbeterde Ezer, de zoon van Jesua, de leider van Mizpa, een ander stuk; tegenover de opgang naar het wapenhuis, aan de hoek.", "1 Sam 7:3": "Toen sprak Samuël tot heel het huis van Israël en zei: Als u zich met heel uw hart tot de HEERE bekeert, doe dan de vreemde goden uit uw midden weg, ook de Astharoths; en richt uw hart op de HEERE, en dien Hem alleen, dan zal Hij u uit de hand van de Filistijnen rukken.", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Jer 10:6": "Omdat niemand U gelijk is, o HEERE! zo bent U groot, en groot is Uw Naam in macht.", "Neh 1:5": "En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Neh 9:38": "En om dit alles maken wij een vast verbond en schrijven het; en onze vorsten, onze Levieten en onze priesters zullen het verzegelen.", "1 Joh 4:12": "Niemand heeft ooit God gezien; als wij elkaar liefhebben, blijft God in ons, en Zijn liefde is in ons volmaakt.", "Deut 8:9": "Een land waarin u brood zult eten zonder gebrek, waarin u niets ontbreken zal; een land waarvan de stenen ijzer zijn, en uit welks bergen u koper zult uithouwen.", "Luk 3:10-14": "En de menigten vroegen hem: Wat zullen wij dan doen? En hij antwoordde en zei tegen hen: Wie twee stukken kleding heeft, moet delen met wie er geen heeft; en wie voedsel heeft, moet hetzelfde doen. En er kwamen ook tollenaars om gedoopt te worden, en zeiden tegen hem: Meester, wat zullen wij doen?", "Ex 18:21-25": "Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien. Laat hen dit volk te allen tijde oordelen; doch laat het zo zijn dat zij alle grote zaken bij u brengen, maar dat zij alle kleine zaken zelf oordelen; verlicht zo uzelf, en laat hen met u meedragen. Als u deze zaak doet, en God het u gebiedt, zult u het kunnen volhouden; zo zal ook al dit volk in vrede naar zijn plaats gaan.", "2 Tim 1:7": "Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid.", "Ps 106:28": "Ook hebben zij zich gekoppeld aan Baäl-peor, en zij hebben de offers van de doden gegeten.", "Joz 7:21": "Want ik zag onder de buit een mooi, sierlijk Babylonisch overkleed, en tweehonderd sikkelen van het zilver, en een gouden staaf, met een gewicht van vijftig sikkelen; en ik kreeg er lust naar, en ik nam ze; en zie, ze zijn verborgen in de aarde, midden in mijn tent, en het zilver daaronder.", "Kol 3:9-17": "Lieg niet tegen elkaar, omdat u de oude mens met zijn werken hebt uitgedaan, en de nieuwe mens hebt aangedaan, die vernieuwd wordt tot kennis, naar het evenbeeld van Hem die hem geschapen heeft; waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar en Scyth, dienstknecht en vrije; maar Christus is alles en in allen.", "2 Kon 25:13-16": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden het koper daarvan naar Babel. Zij namen ook de potten, en de schoffels, en de gaffels, en de rookschalen, en al de koperen voorwerpen, waarmee men de dienst verrichtte. En de aanvoerder van de lijfwacht nam de wierookvaten en de sprenkelschalen weg, wat geheel goud en wat geheel zilver was.", "Richt 21:12": "En zij vonden onder de inwoners van Jabes in Gilead vierhonderd jonge maagden, die geen man bekend hadden in gemeenschap met een man; en zij brachten hen naar het leger te Silo, dat in het land Kanaän is.", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "Deut 6:1-25": "Dit zijn dan de geboden, de inzettingen en de rechten, die de HEERE, uw God, geboden heeft om u te leren; opdat u ze doet in het land, waar u naartoe gaat, om het te bezitten; Opdat u de HEERE, uw God, vreest, om al Zijn inzettingen en Zijn geboden te houden, die ik u gebied; u, en uw kind, en kindskind, al de dagen van uw leven; en opdat uw dagen verlengd worden. Hoor dan, Israël! en let erop dat u ze doet, opdat het u goed gaat, en opdat u zeer vermenigvuldigt (zoals de HEERE, de God van uw vaderen, u gesproken heeft) in het land, dat overvloeit van melk en honing.", "2 Tim 4:6-8": "Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij. Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden; Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Ps 18:45": "Zo gauw als hun oor van mij hoorde, hebben zij mij gehoorzaamd; vreemden hebben zich mij geveinsd onderworpen.", "Deut 10:12": "Nu dan, Israël! Wat vraagt de HEERE, uw God, van u, dan de HEERE, uw God, te vrezen, in al Zijn wegen te wandelen, en Hem lief te hebben, en de HEERE, uw God, te dienen, met heel uw hart en met heel uw ziel;", "Joh 13:17": "Als u deze dingen weet, gelukkig bent u als u ze doet.", "Deut 29:8": "En wij hebben hun land ingenomen, en dat als erfelijk bezit gegeven aan de Rubenieten en Gadieten, alsook aan de halve stam van de Manassieten.", "Openb 13:6": "En het opende zijn mond tot lastering tegen God, om Zijn Naam te lasteren, en Zijn tabernakel, en hen die in de hemel wonen.", "1 Sam 26:19": "En nu, laat mijn heer de koning toch luisteren naar de woorden van zijn dienaar. Als de HEERE u tegen mij opzet, laat Hem dan het spijsoffer ruiken; maar als het mensenkinderen zijn, dan zijn zij vervloekt voor het aangezicht van de HEERE, omdat zij mij vandaag verjaagd hebben, zodat ik niet vast verbonden kan blijven aan het erfdeel van de HEERE, en zeggen: Ga heen, dien andere goden.", "Openb 2:3": "En u hebt verdragen, en hebt geduld; en u hebt om Mijn Naam gearbeid, en bent niet moe geworden.", "Joh 10:27": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij.", "1 Kor 8:3": "Maar als iemand God liefheeft, die is door Hem gekend.", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "Ps 76:3": "En in Salem is Zijn hut, en Zijn woning in Sion.", "Joz 13:11": "En Gilead, en het gebied van de Gezurieten en van de Maachathieten, en de hele berg Hermon, en heel Bazan, tot Salcha toe;", "Deut 5:27": "Nader u, en hoor alles wat de HEERE, onze God, zeggen zal; en spreek u tot ons alles wat de HEERE, onze God, tot u spreken zal, en wij zullen het horen en doen.", "Ps 119:72": "De wet van Uw mond is mij beter, dan duizenden van goud of zilver.", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Deut 11:13-28": "En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel; Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt. En Ik zal gras geven op uw veld voor uw dieren; en u zult eten en verzadigd worden.", "Num 10:4": "Maar als zij met de ene zullen blazen, dan zullen tot u verzameld worden de leiders, de hoofden van de duizenden van Israël.", "Ps 18:2": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte!", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Deut 12:9": "Want u bent tot nu toe niet gekomen in de rust en in de erfenis die de HEERE, uw God, u geven zal.", "2 Kron 32:27": "Jehizkia had zeer veel rijkdom en eer; en hij maakte zich schatkamers voor zilver, en voor goud, en voor kostbaar gesteente, en voor specerijen, en voor schilden, en voor allerlei begeerlijk gereedschap;", "Joh 14:15": "Als u Mij liefhebt, bewaar dan Mijn geboden.", "Gen 30:33": "Zo zal mijn rechtvaardigheid morgen voor mij getuigen, als u komt over mijn loon, voor uw gezicht; alles wat niet gespikkeld en geplekt is onder de geiten en bruin onder de lammeren, dat zal bij mij als gestolen gelden.", "Gen 31:48": "Toen zei Laban: Deze hoop zij vandaag een getuige tussen mij en tussen u! Daarom noemde men zijn naam Gilead,", "Ps 99:7": "Hij sprak tot hen in een wolkkolom; zij hebben Zijn getuigenissen onderhouden, en de inzettingen die Hij hun gegeven had.", "Gen 17:9": "Verder zei God tegen Abraham: U dan zult Mijn verbond houden, u en uw nageslacht na u, in hun geslachten.", "1 Tim 5:9": "Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Ezech 33:6": "Wanneer daarentegen de wachter het zwaard ziet komen, en niet op de bazuin blaast, zodat het volk niet gewaarschuwd wordt; en het zwaard komt en neemt iemand van hen weg, dan is die wel om zijn eigen ongerechtigheid weggenomen, maar zijn bloed zal Ik van de hand van de wachter eisen.", "1 Kon 2:28": "Toen het bericht Joab bereikte (want Joab had zich achter Adonia geschaard, hoewel hij zich niet achter Absalom had geschaard), vluchtte Joab naar de tent van de HEERE, en greep de hoornen van het altaar vast.", "1 Tim 5:10": "Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd.", "Deut 4:9": "Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.", "1 Joh 3:18": "Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid.", "Neh 3:18": "Na hem verbeterden hun broeders, Bavai, de zoon van Henadad, de leider van het andere halve deel van Kehila.", "Luk 17:10": "Zo ook u: wanneer u alles gedaan hebt wat u bevolen is, zeg dan: Wij zijn onnutte dienstknechten; want wij hebben alleen maar gedaan wat wij verplicht waren te doen.", "Num 27:2": "En zij gingen staan voor Mozes, en voor Eleazar, de priester, en voor de leiders, en de hele vergadering, bij de deur van de tent van de samenkomst, en zeiden:", "Ps 119:8": "Ik zal Uw inzettingen bewaren; verlaat mij niet al te zeer.", "Ps 48:5-8": "Want zie, de koningen waren verzameld; zij waren samen doorgetrokken. Zoals zij het zagen, zo waren zij verwonderd; zij werden verschrikt, zij haastten weg. Beving greep hen daar aan, smart als van een barende vrouw.", "Jes 46:9": "Denk aan de vorige dingen van oude tijden af, dat Ik God ben, en er is geen God meer, en er is niets gelijk Ik;", "Joz 24:27": "En Jozua zei tegen het hele volk: Zie, deze steen zal ons tot een getuigenis zijn; want hij heeft al de woorden van de HEERE gehoord, die Hij tot ons gesproken heeft; ja, hij zal tot een getuigenis tegen u zijn, opdat u uw God niet verloochent.", "1 Tess 5:4": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.", "2 Sam 8:8": "Daartoe nam de koning David zeer veel koper uit Betach en uit Berothai, steden van Hadad-Ezer.", "Num 7:18": "Op de tweede dag offerde Nethaneel, de zoon van Zuar, de leider van Issaschar.", "2 Kon 17:36": "Maar de HEERE, Die u uit het land Egypte met grote kracht en met een uitgestrekte arm opgevoerd heeft, Hem zult u vrezen, en voor Hem zult u zich buigen, en Hem zult u offers brengen;", "1 Tim 4:16": "Let op uzelf en op de leer; volhard daarin; want als u dat doet, zult u zowel uzelf behouden als hen die u horen.", "Amos 7:17": "Daarom zegt de HEERE zo: Uw vrouw zal in de stad hoereren, en uw zonen en uw dochters zullen door het zwaard vallen, en uw land zal met het meetsnoer verdeeld worden; en u zult in een onrein land sterven, en Israël zal zeker uit zijn land gevankelijk worden weggevoerd.", "Ps 119:129": "Pe. Uw getuigenissen zijn wonderbaar, daarom bewaart ze mijn ziel.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Hand 8:21": "U hebt geen deel en geen aandeel in dit woord, want uw hart is niet recht voor God.", "Ezech 18:5-9": "Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert; En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "Deut 18:19": "En het zal gebeuren: de man die niet luistert naar Mijn woorden, die Hij in Mijn Naam zal spreken, van hem zal Ik het opeisen.", "Deut 26:17": "Heden hebt u de HEERE laten zeggen dat Hij u tot een God zal zijn, en dat u zult wandelen in Zijn wegen, en Zijn inzettingen houden, en Zijn geboden, en Zijn rechten, en dat u Zijn stem zult gehoorzamen.", "Matt 26:40": "En Hij kwam bij de discipelen en vond hen slapend, en zei tegen Petrus: Kunt u dan niet één uur met Mij waken?", "Gen 9:4": "Maar het vlees met zijn ziel, dat is zijn bloed, zult u niet eten.", "1 Sam 25:32": "Toen zei David tegen Abigaïl: Gezegend zij de HEERE, de God van Israël, Die u vandaag mij tegemoet gezonden heeft!", "Hand 19:19": "Velen ook van hen die toverkunsten hadden beoefend, brachten de boeken bijeen en verbrandden ze voor het oog van allen; en zij berekenden de waarde daarvan, en kwamen tot vijftigduizend zilveren penningen.", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "Kol 3:3": "Want u bent gestorven, en uw leven is met Christus verborgen in God.", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "1 Kron 29:20": "Daarna zei David tegen de hele gemeente: Looft nu de HEERE, uw God! Toen loofde de hele gemeente de HEERE, de God van hun vaderen; en zij bogen hun hoofd, en zij bogen zich neer voor de HEERE, en voor de koning.", "Luk 6:46-48": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg? Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt. Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "Ps 24:3-5": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Hand 10:14": "Maar Petrus zei: Geenszins, Heere! Want ik heb nog nooit iets gegeten dat gewoon of onrein was.", "Rom 9:14": "Wat zullen wij dan zeggen? Is er onrechtvaardigheid bij God? Dat zij verre.", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Ef 4:17": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed.", "Richt 20:1-11": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa. En de leiders van heel het volk stelden zich op, alle stammen van Israël, in de vergadering van het volk van God, vierhonderdduizend man te voet, die het zwaard uittrokken. (De kinderen van Benjamin nu hoorden dat de kinderen van Israël opgetrokken waren naar Mizpa.) En de kinderen van Israël zeiden: Vertel ons, hoe is dit kwaad gebeurd?", "Ps 7:4": "HEERE, mijn God, als ik dat gedaan heb, als er onrecht in mijn handen is;", "Joz 24:24": "En het volk zei tegen Jozua: Wij zullen de HEERE, onze God, dienen, en wij zullen Zijn stem gehoorzamen.", "Hand 5:29": "Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen.", "Gal 3:12": "Maar de wet is niet uit het geloof; maar de mens die deze dingen doet, zal daardoor leven.", "Ps 86:10": "Want Gij zijt groot, en doet wonderwerken; Gij alleen zijt God.", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Matt 19:29": "En al wie huizen zal verlaten hebben, of broeders, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers, om Mijn Naam, die zal honderdvoud ontvangen, en het eeuwige leven beërven.", "Joz 4:13": "Ongeveer veertigduizend toegeruste krijgsmannen trokken voor het aangezicht van de HEERE ten strijde, naar de vlakke velden van Jericho.", "Hebr 10:7": "Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Fil 1:9": "En dit bid ik God, dat uw liefde nog meer en meer overvloedig wordt in kennis en alle inzicht;", "1 Kon 8:25": "En nu, HEERE, God van Israël, houd Uw dienaar, mijn vader David, wat U tot hem gesproken hebt, en zei: Er zal u geen man van voor Mijn aangezicht afgesneden worden, die op de troon van Israël zit; alleen als uw zonen hun weg bewaren, om te wandelen voor Mijn aangezicht, zoals u gewandeld hebt voor Mijn aangezicht.", "2 Petr 1:5-9": "En span daarom ook alle inspanning in om, naast uw geloof, ook deugd te voegen, en naast de deugd kennis, En naast de kennis matigheid, en naast de matigheid volharding, en naast de volharding godsvrucht, En naast de godsvrucht broederlijke liefde, en naast de broederlijke liefde, liefde jegens allen.", "1 Petr 1:14": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had;", "1 Joh 5:2": "Hieraan weten wij, dat wij de kinderen van God liefhebben, wanneer wij God liefhebben, en Zijn geboden bewaren.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Deut 8:17": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven.", "Hand 11:30": "En dat deden zij ook, en zonden het naar de oudsten, door de hand van Barnabas en Saulus.", "Deut 32:12": "Zo leidde de HEERE hem alleen, en er was geen vreemde god met hem.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "2 Kron 6:14": "En hij zei: HEERE, God van Israël, er is geen God gelijk U, in de hemel noch op de aarde, Die het verbond en de goedertierenheid houdt aan Uw knechten, die voor Uw aangezicht met hun gehele hart wandelen;", "Lev 18:25-28": "Zodat het land onrein is, en Ik over hen zijn ongerechtigheid bezoek, en het land zijn inwoners uitspuwt. Maar u zult Mijn inzettingen en Mijn rechten onderhouden, en van al die gruwelen niets doen, inboorling noch vreemdeling, die te midden van u als vreemdeling verkeert. Want de mensen van dit land, die vóór u geweest zijn, hebben al deze gruwelen gedaan; en het land is onrein geworden.", "Kol 1:15": "Die het Beeld is van de onzienlijke God, de Eerstgeborene van alle schepselen.", "Num 14:24": "Maar Mijn dienaar Kaleb, omdat een andere geest met hem geweest is, en hij Mij trouw is blijven volgen, zal Ik hem brengen tot het land waarin hij gekomen was, en zijn nageslacht zal het erfelijk bezitten.", "1 Kor 8:4-6": "Wat betreft dan het eten van de dingen die aan de afgoden geofferd zijn: wij weten dat een afgod niets is in de wereld, en dat er geen andere God is dan Eén. Want al zijn er ook die goden genoemd worden, hetzij in de hemel, hetzij op de aarde (zoals er veel goden en veel heren zijn), toch hebben wij maar één God, de Vader, uit Wie alle dingen zijn, en wij tot Hem; en maar één Heere, Jezus Christus, door Wie alle dingen zijn, en wij door Hem.", "Num 17:2": "Spreek tot de kinderen van Israël, en neem van hen voor elk vaderlijk huis een staf, van al hun leiders, naar het huis van hun vaderen, twaalf staven; ieders naam zult u schrijven op zijn staf.", "Deut 30:15-20": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade. Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven. Maar als uw hart zich zal afwenden, en u niet horen zult, en u gedreven wordt om u voor andere goden te buigen, en die te dienen;", "Kol 1:12": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht;", "Job 31:5-8": "Als ik met ijdelheid omgegaan heb, en mijn voet gesneld heeft tot bedriegerij; Hij weegt mij op, in een rechte weegschaal, en God zal mijn oprechtheid weten. Als mijn gang uit de weg geweken is, en mijn hart mijn ogen nagevolgd is, en aan mijn handen iets aankleeft;", "Joz 22:13-32": "En de kinderen van Israël zonden naar de kinderen van Ruben, en naar de kinderen van Gad, en naar de halve stam van Manasse, in het land Gilead, Pinehas, de zoon van Eleazar, de priester; En tien leiders met hem, van elk vaderlijk huis één leider, uit al de stammen van Israël; en zij waren elk een hoofd van het huis van hun vaderen over de duizenden van Israël. Toen zij bij de kinderen van Ruben, en bij de kinderen van Gad, en bij de halve stam van Manasse aankwamen, in het land Gilead, spraken zij met hen, en zeiden:", "Ps 76:12": "Doe geloften en betaal ze de HEERE, uw God, u allen, die rondom Hem zijn! Laat men Hem, Die te vrezen is, geschenken brengen;", "Ps 119:9": "Beth. Waarmee zal de jongeling zijn pad zuiver houden? Als hij dat houdt naar Uw woord.", "1 Joh 3:17-24": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem? Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid. En hieraan weten wij dat wij uit de waarheid zijn, en wij zullen ons hart verzekeren voor Hem.", "Matt 25:13": "Waak dan; want u weet de dag niet, en ook het uur niet, waarop de Zoon des mensen komen zal.", "Pred 12:13": "Van alles wat gehoord is, is dit de slotsom: Vrees God, en houd Zijn geboden, want dit is de hele plicht van de mens.", "1 Tess 5:6": "Laten wij dan niet slapen, zoals de anderen, maar laten wij waken en nuchter zijn.", "Ex 23:13": "In alles wat Ik tegen u gezegd heb, zult u op uw hoede zijn; en de naam van andere goden zult u niet noemen; uit uw mond zal hij niet gehoord worden!", "Joz 22:11-34": "En de kinderen van Israël hoorden zeggen: Zie, de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse hebben een altaar gebouwd, tegenover het land Kanaän, aan de grenzen van de Jordaan, aan de zijde van de kinderen van Israël. Toen de kinderen van Israël dit hoorden, verzamelde de hele vergadering van de kinderen van Israël zich te Silo, om tegen hen op te trekken met een leger. En de kinderen van Israël zonden naar de kinderen van Ruben, en naar de kinderen van Gad, en naar de halve stam van Manasse, in het land Gilead, Pinehas, de zoon van Eleazar, de priester;", "Rom 6:2": "Dat zij verre. Wij die aan de zonde gestorven zijn, hoe zullen wij nog daarin leven?", "Ps 119:112": "Ik heb mijn hart geneigd, om Uw inzettingen eeuwig te doen, tot het einde toe.", "Neh 3:12": "En aan zijn hand verbeterde Sallum, de zoon van Lohes, leider van het andere halve deel van Jeruzalem, hij en zijn dochters.", "Num 7:2": "Dat de leiders van Israël, de hoofden van het huis van hun vaderen, offerden; dit waren de leiders van de stammen, die over de getelden stonden.", "Joz 21:44": "En de HEERE gaf hun rust rondom, naar alles wat Hij hun vaderen gezworen had; en er stond niet één man van al hun vijanden voor hen staande; al hun vijanden gaf de HEERE in hun hand.", "Deut 28:1-68": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.", "2 Kon 17:21": "Want Hij scheurde Israël af van het huis van David, en zij maakten Jerobeam, de zoon van Nebat, koning; en Jerobeam dreef Israël weg van achter de HEERE vandaan, en liet hen een grote zonde zondigen.", "Tit 3:14": "En laat ook de onzen leren goede werken voor te staan, voor de dingen die nodig zijn, opdat zij niet onvruchtbaar zijn.", "1 Sam 20:16": "Zo sloot Jonathan een verbond met het huis van David, en zei: Dat de HEERE het eist van de hand van de vijanden van David!", "Ps 119:97": "Mem. Hoe lief heb ik Uw wet! Zij is mijn betrachting de hele dag.", "1 Kon 8:60": "Opdat alle volken van de aarde weten, dat de HEERE die God is, niemand anders.", "Deut 11:1": "Daarom zult u de HEERE, uw God, liefhebben, en u zult altijd onderhouden Zijn bevel, en Zijn inzettingen, en Zijn rechten, en Zijn geboden.", "Jer 26:13": "Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft.", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Ps 119:56": "Dat is mij gebeurd, omdat ik Uw bevelen bewaard heb.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Deut 11:16": "Wacht uzelf, dat uw hart niet verleid wordt, dat u afwijkt, en andere goden dient, en u voor die buigt;", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "1 Tess 5:21": "Beproef alle dingen; behoud het goede.", "Ps 119:59": "Ik heb mijn wegen bedacht, en heb mijn voeten gekeerd tot Uw getuigenissen.", "Hand 11:8": "Maar ik zei: Geenszins, Heere, want nooit is iets dat gewoon of onrein was in mijn mond binnengegaan.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Joh 15:12": "Dit is Mijn gebod, dat u elkaar liefhebt, zoals Ik u liefgehad heb.", "Spr 8:17": "Ik heb hen lief die Mij liefhebben; en die Mij vroeg zoeken, zullen Mij vinden.", "Ef 6:6-8": "niet uit ogendienst, als mensenbehagers, maar als dienstknechten van Christus, terwijl u de wil van God doet van harte; terwijl u dient met goedwilligheid de Heere, en niet de mensen; wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Mark 3:35": "Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Rom 3:29": "Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen;", "Matt 18:15": "Maar als uw broeder tegen u gezondigd heeft, ga naar hem toe en wijs hem terecht tussen u en hem alleen; als hij naar u luistert, hebt u uw broeder gewonnen.", "1 Kon 9:6": "Maar als u zich helemaal afkeert, u en uw kinderen, van Mij, om Mij niet meer te volgen, en Mijn geboden en Mijn inzettingen, die Ik voor uw aangezicht gegeven heb, niet houdt, maar heengaat en andere goden dient, en u voor hen neerbuigt;", "2 Petr 3:17": "U dan, geliefden, omdat u dit van tevoren weet, wees op uw hoede, dat u niet mede weggesleept wordt door de dwaling van de verdorven mensen, en afvalt van uw eigen standvastigheid;", "Ps 141:3": "HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "Rom 10:2": "Want ik geef hun getuigenis, dat zij een ijver voor God hebben, maar niet met verstand.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Hebr 12:15": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.", "Num 14:41-43": "Maar Mozes zei: Waarom overtreedt u zo het bevel van de HEERE? Want dat zal niet voorspoedig zijn. Trek niet op, want de HEERE zal niet in uw midden zijn; anders wordt u verslagen voor het aangezicht van uw vijanden. Want de Amalekieten en de Kanaänieten zijn daar vóór u, en u zult door het zwaard vallen; want omdat u zich hebt afgekeerd van de HEERE, zal de HEERE niet met u zijn.", "1 Kon 2:3": "En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;", "Jes 55:12": "Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "Jer 38:20": "En Jeremia zei: Zij zullen u niet overgeven; wees toch gehoorzaam aan de stem van de HEERE, die ik tot u spreek; zo zal het u goed gaan, en zal uw leven behouden blijven.", "Gal 3:20": "En de Middelaar is niet Middelaar van één, maar God is één.", "Fil 1:11": "Vervuld met vruchten van de gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en lof van God.", "Spr 23:26": "Mijn zoon! geef mij uw hart, en laat uw ogen mijn wegen behartigen.", "Ps 51:8": "Zie, U hebt lust tot waarheid in het binnenste, en in het verborgene maakt U mij wijsheid bekend.", "1 Joh 5:1-3": "Ieder die gelooft dat Jezus de Christus is, is uit God geboren; en ieder die Hem liefheeft Die geboren heeft, heeft ook lief hem die uit Hem geboren is. Hieraan weten wij, dat wij de kinderen van God liefhebben, wanneer wij God liefhebben, en Zijn geboden bewaren. Want dit is de liefde van God, dat wij Zijn geboden bewaren; en Zijn geboden zijn niet zwaar.", "Tit 2:12": "En onderwijst ons dat wij, doordat we de goddeloosheid en de wereldse begeerten verzaken, matig en rechtvaardig en godvruchtig zouden leven in deze tegenwoordige wereld;", "Lev 17:8": "Zeg dan tegen hen: Ieder van het huis van Israël, en van de vreemdelingen, die in hun midden als vreemdelingen verkeren, die een brandoffer of slachtoffer zal offeren,", "Deut 4:4": "U daarentegen, die de HEERE, uw God, aanhing, u bent vandaag allemaal nog in leven.", "Joz 4:12": "En de kinderen van Ruben, en de kinderen van Gad, alsook de halve stam van Manasse, trokken gewapend voor de ogen van de kinderen van Israël, zoals Mozes tegen hen gesproken had.", "Deut 26:16-18": "Op deze dag gebiedt de HEERE, uw God, u deze inzettingen en rechten te doen; houd ze dan en doe ze, met heel uw hart en met heel uw ziel. Heden hebt u de HEERE laten zeggen dat Hij u tot een God zal zijn, en dat u zult wandelen in Zijn wegen, en Zijn inzettingen houden, en Zijn geboden, en Zijn rechten, en dat u Zijn stem zult gehoorzamen. En de HEERE heeft u heden laten zeggen dat u Hem tot een volk van het eigendom zult zijn, zoals Hij u gesproken heeft, en dat u al Zijn geboden zult houden;", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Ps 73:25": "Aan wie heb ik behalve U iets in de hemel? Behalve U verlang ik ook niets op de aarde!", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "Openb 2:19": "Ik weet uw werken, en liefde, en dienst, en geloof, en uw lijdzaamheid, en uw werken, en dat de laatste meer zijn dan de eerste.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Hebr 6:12": "opdat u niet traag wordt, maar navolgers bent van hen die door geloof en geduld de beloften beërven.", "Lev 19:37": "Daarom zult u al Mijn inzettingen en al Mijn rechten onderhouden, en zult ze doen; Ik ben de HEERE!", "Joh 21:17": "Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Deut 13:4": "De HEERE, uw God, zult u navolgen, en Hem vrezen, en Zijn geboden zult u houden, en Zijn stem gehoorzaam zijn, en Hem dienen, en Hem aanhangen.", "Ps 119:2": "Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;", "Ps 119:15": "Ik zal Uw bevelen overdenken, en op Uw paden letten.", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ps 119:30": "Ik heb gekozen de weg van de waarheid, Uw rechten heb ik mij voorgesteld.", "Ps 44:22": "Zou God dat niet onderzoeken? Want Hij kent de verborgenheden van het hart.", "Ex 15:26": "en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!", "Deut 4:23": "Wacht u ervoor dat u het verbond van de HEERE, uw God, dat Hij met u gesloten heeft, vergeet, zodat u een gesneden beeld zou maken, de gelijkenis van iets dat de HEERE, uw God, u verboden heeft.", "Luk 11:42": "Maar wee u, Farizeeën, want u geeft tienden van munt en wijnruit en van alle moeskruid, en u gaat voorbij aan het recht en de liefde van God. Dit moest men doen, en het andere niet nalaten.", "Neh 3:9": "En aan hun hand verbeterde Refaja, de zoon van Hur, leider van het halve deel van Jeruzalem.", "Ex 32:8": "Zij zijn snel afgeweken van de weg die Ik hun geboden had; zij hebben zich een gegoten kalf gemaakt, zich daarvoor neergebogen, er offers aan gebracht, en gezegd: Dit zijn uw goden, Israël, die u uit Egypteland hebben opgevoerd.", "Gal 4:17": "Zij ijveren niet oprecht om u; maar zij willen u uitsluiten, opdat u zou ijveren om hen.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Hebr 6:11": "Maar wij verlangen ernaar dat ieder van u dezelfde ijver bewijst, tot de volle zekerheid van de hoop, tot het einde toe;", "Mark 13:32-37": "Maar van die dag en dat uur weet niemand, ook de engelen in de hemel niet, en ook de Zoon niet, maar alleen de Vader. Let op, waak en bid; want u weet niet wanneer de tijd is. Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken;", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Jes 56:7": "Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.", "Joz 23:7": "Dat u niet ingaat tot deze volken: deze, die overgebleven zijn bij u; gedenkt ook niet aan de naam van hun goden, en laat er niet bij zweren, en dient hen niet, en buigt u voor hen niet;", "1 Joh 5:1-5": "Ieder die gelooft dat Jezus de Christus is, is uit God geboren; en ieder die Hem liefheeft Die geboren heeft, heeft ook lief hem die uit Hem geboren is. Hieraan weten wij, dat wij de kinderen van God liefhebben, wanneer wij God liefhebben, en Zijn geboden bewaren. Want dit is de liefde van God, dat wij Zijn geboden bewaren; en Zijn geboden zijn niet zwaar.", "Ps 136:2": "Loof de God der goden; want Zijn goedertierenheid is voor eeuwig.", "Joh 5:42": "maar Ik ken u, dat u de liefde van God niet in uzelf hebt.", "Jer 17:10": "Ik, de HEERE, doorgrond het hart, en proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.", "Neh 8:6": "En Ezra opende het boek voor de ogen van heel het volk, want hij stond boven al het volk; en toen hij het opende, ging heel het volk staan.", "Ezech 18:19": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven.", "Ezech 43:11": "En indien zij schaamrood worden vanwege alles wat zij gedaan hebben, maak hun dan bekend de vorm van het huis, en zijn gestalte, en zijn uitgangen, en zijn ingangen, en al zijn vormen, en al zijn ordinantiën, ja, al zijn vormen en al zijn wetten; en schrijf het voor hun ogen, opdat zij zijn hele vorm en al zijn ordinantiën bewaren, en die doen.", "Num 34:18-29": "Verder zult u uit elke stam één leider nemen, om het land ter erfenis uit te delen. En dit zijn de namen van deze mannen: van de stam van Juda, Kaleb, zoon van Jefunne; En van de stam der kinderen van Simeon, Semuël, zoon van Ammihud;", "Ps 50:5": "Verzamelt Mij Mijn gunstgenoten¹, die Mijn verbond maken met een offer!", "1 Petr 3:14": "Maar als u ook lijdt om de gerechtigheid, dan bent u gelukkig te prijzen; en wees niet bang voor hun dreiging, en raak niet in verwarring;", "Rom 6:19-22": "Ik spreek op menselijke wijze, vanwege de zwakheid van uw vlees; want zoals u uw leden gesteld hebt om dienstbaar te zijn aan de onreinheid en de ongerechtigheid, tot ongerechtigheid, zo stel nu uw leden om dienstbaar te zijn aan de gerechtigheid, tot heiliging. Want toen u dienstknechten was van de zonde, was u vrij van de gerechtigheid. Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Hab 2:1": "Ik stond op mijn wachtpost, en ik ging op de vestingmuur staan, en ik hield wacht om te zien wat Hij tot mij spreken zou, en wat ik antwoorden zou op mijn bestraffing.", "Job 10:7": "Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlost.", "1 Kon 21:11-13": "En de mannen van zijn stad, die oudsten en die edelen, die in zijn stad woonden, deden zoals Izebel hun gezonden had; zoals geschreven was in de brieven die zij hun gezonden had. Zij riepen een vasten uit; en zij zetten Naboth vooraan onder het volk. Toen kwamen de twee mannen, zonen van Belial, en gingen tegenover hem zitten; en de mannen van Belial getuigden tegen hem, tegen Naboth, voor het volk, en zeiden: Naboth heeft God en de koning gevloekt. En zij voerden hem de stad uit, en stenigden hem met stenen, zodat hij stierf.", "Neh 10:1-39": "Wat betreft de verzegelingen: het waren Nehemia, de Tirsatha, zoon van Hachalja, en Zidkia, Seraja, Azarja, Jeremia, Pashur, Amarja, Malchia,", "Joz 24:14": "En nu, vrees de HEERE, en dien Hem in oprechtheid en in waarheid; en doe de goden weg die uw vaders gediend hebben, aan de overkant van de rivier, en in Egypte; en dien de HEERE.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Ex 18:25": "En Mozes koos bekwame mannen, uit heel Israël, en stelde hen aan tot hoofden over het volk; leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien;", "Num 32:2": "Toen kwamen de kinderen van Gad en de kinderen van Ruben en spraken tot Mozes, tot Eleazar de priester, en tot de leiders van de vergadering, en zeiden:", "Jer 12:3": "Maar U, HEERE, kent mij, U ziet mij, en proeft mijn hart, dat het met U is. Ruk hen uit als schapen ter slachting, en heilig hen tot de dag van de doding.", "Joh 8:47": "Wie uit God is, hoort de woorden van God; daarom hoort u niet, omdat u niet uit God bent.", "Joz 13:31": "En het halve Gilead, en Astharoth, en Edrei, steden van het koninkrijk van Og in Bazan, waren voor de kinderen van Machir, de zoon van Manasse, namelijk voor de helft van de kinderen van Machir, naar hun huisgezinnen.", "Ps 103:20": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord.", "Ezech 3:18": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen.", "Ex 25:40": "Zie er dan op toe dat u het maakt naar hun voorbeeld, dat u op de berg getoond is.", "Job 23:10": "Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Ezech 33:8": "Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen.", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Jes 58:6-14": "Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt? Is het niet dit, dat u de hongerige uw brood meedeelt, en de armen, verdrevenen, in huis brengt? Als u een naakte ziet, dat u hem dekt, en dat u zich voor uw eigen vlees niet verbergt? Dan zal uw licht voortbreken als de dageraad, en uw genezing zal snel uitspruiten; en uw gerechtigheid zal voor uw aangezicht heengaan, en de heerlijkheid van de HEERE zal uw achterhoede zijn.", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "2 Kor 11:11": "Waarom? Is het omdat ik u niet liefheb? God weet het!", "Ef 5:15": "Kijk dan goed hoe u voorzichtig wandelt, niet als onwijzen, maar als wijzen,", "Joz 3:10": "Verder zei Jozua: Hieraan zult u weten dat de levende God in uw midden is, en dat Hij helemaal voor uw aangezicht zal verdrijven de Kanaänieten, en de Hethieten, en de Hevieten, en de Ferezieten, en de Girgazieten, en de Amorieten en de Jebusieten.", "Kol 3:5": "Dood dan uw leden die op de aarde zijn: hoererij, onreinheid, schandelijke beweging, kwade begeerlijkheid, en de hebzucht, die afgodendienst is.", "2 Kor 5:11": "Wij dan, die de schrik van de Heere kennen, bewegen de mensen tot het geloof, en wij zijn openbaar geworden voor God; en ik hoop dat wij ook in uw gewetens geopenbaard zijn geworden.", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Ps 1:2": "Maar zijn vreugde is in de wet van de HEERE, en hij overdenkt Zijn wet dag en nacht.", "1 Kon 18:39": "Toen heel het volk dat zag, vielen zij op hun gezicht, en zeiden: De HEERE is God, de HEERE is God!", "Spr 4:26": "Weeg de gang van uw voet, en laat al uw wegen vast staan.", "Ps 106:3": "Gelukkig zijn zij die het recht onderhouden, die te allen tijde gerechtigheid doen.", "Deut 12:6": "En daarheen zult u brengen uw brandoffers, en uw slachtoffers, en uw tienden, en het hefoffer van uw hand, en uw geloften, en uw vrijwillige offers, en de eerstgeboorte van uw runderen en van uw schapen.", "Spr 1:33": "Maar die naar Mij hoort, zal zeker wonen, en hij zal gerust zijn van de vrees voor het kwaad.", "2 Kon 17:38": "En het verbond dat Ik met u gemaakt heb, zult u niet vergeten; en u zult geen andere goden vrezen.", "Num 1:44": "Dezen zijn de getelden, die Mozes geteld heeft, en Aäron, en de leiders van Israël; twaalf mannen waren het, elk over het huis van zijn vaderen.", "Ps 95:3": "Want de HEERE is een grote God; ja, een groot Koning boven alle goden;", "Jer 7:23": "Maar deze zaak heb Ik hun geboden, en Ik zei: Hoor naar Mijn stem, dan zal Ik u tot een God zijn, en u zult Mij tot een volk zijn; en wandel in heel de weg die Ik u gebieden zal, opdat het u goed gaat.", "Num 7:3": "En zij brachten hun offergave voor het aangezicht van de HEERE: zes overdekte wagens en twaalf runderen; een wagen voor twee leiders, en een os voor ieder een; en zij brachten ze voor de tabernakel.", "Lev 19:36": "U zult een eerlijke weegschaal hebben, eerlijke gewichten, een eerlijke efa, en een eerlijke hin; Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb!", "Joh 14:21-23": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren. Judas, niet de Iskariot, zei tegen Hem: Heere, hoe komt het dat U Uzelf aan ons zult openbaren, en niet aan de wereld? Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Deut 11:9": "En opdat u de dagen verlengt in het land, dat de HEERE aan uw vaderen gezworen heeft, aan hen en aan hun nageslacht te geven; een land, vloei
