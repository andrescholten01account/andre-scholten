baring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen riep Jozua de Rubenieten, en de Gadieten, en de halve stam van Manasse,","2":"En hij zei tegen hen: U hebt alles onderhouden wat Mozes, de dienaar van de HEERE, u geboden heeft; en u bent mijn stem gehoorzaam geweest in alles wat ik u geboden heb.","3":"U hebt uw broeders niet verlaten, nu al deze tijd, tot op deze dag toe; maar u hebt de onderhouding van de geboden van de HEERE, uw God, waargenomen.","4":"En nu heeft de HEERE, uw God, uw broeders rust gegeven, zoals Hij hun toegezegd had; keert dan nu terug, en gaat u naar uw tenten, naar het land van uw bezitting, dat Mozes, de dienaar van de HEERE, u gegeven heeft aan de andere zijde van de Jordaan.","5":"Neem alleen nauwgezet in acht om te doen het gebod en de wet, die Mozes, de dienaar van de HEERE, u geboden heeft: dat u de HEERE, uw God, liefhebt, en dat u wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat u Hem dient met uw hele hart en met uw hele ziel.","6":"Zo zegende Jozua hen, en liet hen gaan; en zij gingen naar hun tenten.","7":"Want aan de helft van de stam van Manasse had Mozes een erfdeel gegeven in Basan; maar aan de andere helft daarvan gaf Jozua een erfdeel bij hun broeders, aan deze zijde van de Jordaan westwaarts. Verder ook, toen Jozua hen liet vertrekken naar hun tenten, zegende hij hen ook.","8":"En hij sprak tot hen, en zei: Keert terug naar uw tenten met veel rijkdom, en met heel veel vee, met zilver, en met goud, en met koper, en met ijzer, en met heel veel kleding; deelt de buit van uw vijanden met uw broeders.","9":"Zo keerden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse terug, en trokken weg van de kinderen van Israël, van Silo, dat in het land Kanaän is, om te gaan naar het land van Gilead, naar het land van hun bezitting, waarin zij bezitters gemaakt waren, naar het bevel van de HEERE, door de dienst van Mozes.","10":"Toen zij aankwamen bij de grenzen van de Jordaan, die in het land Kanaän zijn, bouwden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse daar een altaar bij de Jordaan, een altaar groot van aanzien.","11":"En de kinderen van Israël hoorden zeggen: Zie, de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse hebben een altaar gebouwd, tegenover het land Kanaän, aan de grenzen van de Jordaan, aan de zijde van de kinderen van Israël.","12":"Toen de kinderen van Israël dit hoorden, verzamelde de hele vergadering van de kinderen van Israël zich te Silo, om tegen hen op te trekken met een leger.","13":"En de kinderen van Israël zonden naar de kinderen van Ruben, en naar de kinderen van Gad, en naar de halve stam van Manasse, in het land Gilead, Pinehas, de zoon van Eleazar, de priester;","14":"En tien leiders met hem, van elk vaderlijk huis één leider, uit al de stammen van Israël; en zij waren elk een hoofd van het huis van hun vaderen over de duizenden van Israël.","15":"Toen zij bij de kinderen van Ruben, en bij de kinderen van Gad, en bij de halve stam van Manasse aankwamen, in het land Gilead, spraken zij met hen, en zeiden:","16":"Zo spreekt de hele gemeente van de HEERE: Wat is dit voor een overtreding, waarmee u overtreden hebt tegen de God van Israël, doordat u vandaag afkeert van achter de HEERE, door voor u een altaar te bouwen, om vandaag opstandig te zijn tegen de HEERE?","17":"Is de ongerechtigheid van Peor ons te weinig, waarvan wij niet gereinigd zijn tot op deze dag, hoewel de plaag in de vergadering van de HEERE geweest is?","18":"Nu u zich vandaag afkeert van achter de HEERE, zal het gebeuren, als u vandaag opstandig bent tegen de HEERE, dat Hij Zich morgen zeer zal vertoornen tegen de hele gemeente van Israël.","19":"Maar toch, als het land van uw bezitting onrein is, komt dan over naar het land van de bezitting van de HEERE, waar de tabernakel van de HEERE woont, en neemt bezit in het midden van ons; maar wees niet opstandig tegen de HEERE, en wees ook niet opstandig tegen ons, door voor u een altaar te bouwen, naast het altaar van de HEERE, onze God.","20":"Heeft Achan, de zoon van Zerah, geen overtreding begaan met het verbannene[1], en kwam er niet een verbolgenheid over de hele vergadering van Israël? En die man stierf niet alleen in zijn ongerechtigheid.","21":"Toen antwoordden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse, en zij spraken met de hoofden van de duizenden van Israël:","22":"De God der goden, de HEERE, de God der goden, de HEERE, Die weet het; Israël zelf zal het ook weten! Is het door weerspannigheid, of is het door overtreding tegen de HEERE, dan behoedt Hij ons vandaag niet;","23":"Dat wij voor ons een altaar zouden gebouwd hebben, om ons van achter de HEERE af te keren, of om brandoffer en spijsoffer daarop te offeren, of om dankoffer daarop te doen, dan eist het de Heere Zelf.","24":"En als wij dit niet uit zorg vanwege deze zaak gedaan hebben, en zeiden: Morgen zouden uw kinderen tot onze kinderen kunnen spreken, en zeggen: Wat hebt u met de HEERE, de God van Israël, te doen?","25":"De HEERE heeft immers[2] de Jordaan tot grens gezet tussen ons en tussen u, u, kinderen van Ruben, en u, kinderen van Gad! U hebt geen deel aan de HEERE. Zo zouden uw kinderen onze kinderen kunnen doen ophouden de HEERE te vrezen.","26":"Daarom zeiden wij: Laten wij toch voor ons een altaar maken, door het te bouwen, niet voor brandoffer, en ook niet voor offer.","27":"Maar dat het een getuige zij tussen ons en tussen u, en tussen onze geslachten na ons, opdat wij de dienst van de HEERE voor Zijn aangezicht mogen dienen met onze brandoffers, en met onze slachtoffers, en met onze dankoffers; en dat uw kinderen tot onze kinderen morgen niet zeggen: U hebt geen deel aan de HEERE.","28":"Daarom zeiden wij: Wanneer het gebeurt, dat zij morgen zo tot ons en tot onze geslachten zullen zeggen, dan zullen wij zeggen: Ziet de vorm van het altaar van de HEERE, dat onze vaderen gemaakt hebben, niet voor brandoffer, en ook niet voor offer; maar het is een getuige tussen ons en tussen u.","29":"Het zij verre van ons, dat wij opstandig zouden zijn tegen de HEERE, of dat wij ons vandaag van achter de HEERE zouden afkeren, door een altaar te bouwen voor brandoffer, spijsoffer, of slachtoffer, buiten het altaar van de HEERE, onze God, dat vóór Zijn tabernakel is.","30":"Toen de priester Pinehas, en de leiders van de vergadering, en de hoofden van de duizenden van Israël, die met hem waren, de woorden hoorden, die de kinderen van Ruben, en de kinderen van Gad, en de kinderen van Manasse gesproken hadden, was het goed in hun ogen.","31":"En Pinehas, de zoon van de priester Eleazar, zei tegen de kinderen van Ruben, en tegen de kinderen van Gad, en tegen de kinderen van Manasse: Vandaag weten wij, dat de HEERE in het midden van ons is, omdat u deze overtreding tegen de HEERE niet begaan hebt; nu hebt u de kinderen van Israël verlost uit de hand van de HEERE.","32":"En Pinehas, de zoon van de priester Eleazar, keerde terug met de leiders van de kinderen van Ruben, en van de kinderen van Gad, uit het land Gilead, naar het land Kanaän, naar de kinderen van Israël; en zij brachten hun antwoord terug;","33":"Het antwoord nu was goed in de ogen van de kinderen van Israël, en de kinderen van Israël loofden God, en zeiden niet meer dat zij tegen hen op wilden trekken met een leger, om het land te verderven, waarin de kinderen van Ruben en de kinderen van Gad woonden.","34":"En de kinderen van Ruben en de kinderen van Gad noemden dat altaar: Getuige, want het zij een getuige tussen ons, dat de HEERE God is."},"SV":{"1":"Toen riep Jozua de Rubenieten, en de Gadieten, en den halven stam van Manasse,","2":"En hij zeide tot hen: Gijlieden hebt onderhouden alles, wat u Mozes, de knecht des HEEREN, geboden heeft; en gij zijt mijner stem gehoorzaam geweest in alles, wat ik u geboden heb.","3":"Gij hebt uw broederen niet verlaten nu langen tijd, tot op dezen dag toe; maar gij hebt waargenomen de onderhouding der geboden van den HEERE, uw God.","4":"En nu, de HEERE, uw God, heeft uw broederen rust gegeven, gelijk Hij hun toegezegd had; keert dan nu wederom, en gaat gij naar uw tenten, naar het land uwer bezitting, hetwelk u Mozes, de knecht des HEEREN, gegeven heeft op gene zijde van de Jordaan.","5":"Alleenlijk neemt naarstiglijk waar te doen het gebod en de wet, die u Mozes, de knecht des HEEREN, geboden heeft, dat gij den HEERE, uw God, liefhebt, en dat gij wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat gij Hem dient met uw ganse hart en met uw ganse ziel.","6":"Alzo zegende hen Jozua, en hij liet hen gaan; en zij gingen naar hun tenten.","7":"Want aan de helft van den stam van Manasse had Mozes *een* *erfdeel* gegeven in Bazan; maar aan *de* *andere* helft van denzelven gaf Jozua *een* *erfdeel* bij hun broederen, aan deze zijde van de Jordaan westwaarts. Verder ook als Jozua hen liet trekken naar hun tenten, zo zegende hij hen.","8":"En hij sprak tot hen, zeggende: Keert weder tot uw tenten met veel rijkdom, en met zeer veel vee, met zilver, en met goud, en met koper, en met ijzer, en met zeer veel klederen; deelt den roof uwer vijanden met uw broederen.","9":"Alzo keerden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse wederom, en togen van de kinderen Israëls, van Silo, dat in het land Kanaän is, om te gaan naar het land van Gilead, naar het land hunner bezitting, in hetwelk zij bezitters gemaakt waren, naar den mond des HEEREN, door den dienst van Mozes.","10":"Toen zij kwamen aan de grenzen van de Jordaan, die in het land Kanaän zijn, zo bouwden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse aldaar een altaar aan de Jordaan, een altaar groot in het aanzien.","11":"En de kinderen Israëls hoorden zeggen: Ziet, de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse hebben een altaar gebouwd, tegenover het land Kanaän, aan de grenzen van de Jordaan, aan de zijde der kinderen Israëls.","12":"Als de kinderen Israëls *dit* hoorden, zo verzamelde de ganse vergadering der kinderen Israëls te Silo, dat zij tegen hen optogen met een heir.","13":"En de kinderen Israëls zonden aan de kinderen van Ruben, en aan de kinderen van Gad, en aan den halven stam van Manasse, in het land Gilead, Pinehas, den zoon van Eleazar, den priester;","14":"En tien vorsten met hem, van ieder vaderlijk huis een vorst, uit al de stammen van Israël; en zij waren een ieder een hoofd van het huis hunner vaderen over de duizenden van Israël.","15":"Toen zij tot de kinderen van Ruben, en tot de kinderen van Gad, en tot den halven stam van Manasse kwamen, in het land Gilead, zo spraken zij met hen, zeggende:","16":"Alzo spreekt de ganse gemeente des HEEREN: Wat overtreding is dit, waarmede gijlieden overtreden hebt tegen den God van Israël, heden afkerende van achter den HEERE, mits dat gij een altaar voor u gebouwd hebt, om heden tegen den HEERE wederspannig te zijn?","17":"Is ons de ongerechtigheid van Peor te weinig, van dewelke wij niet gereinigd zijn tot op dezen dag, hoewel de plaag in de vergadering des HEEREN geweest is?","18":"Dewijl gij u heden van achter den HEERE afkeert, het zal dan geschieden, als gij heden wederspannig zijt tegen den HEERE, zo zal Hij Zich morgen grotelijks vertoornen tegen de ganse gemeente van Israël.","19":"Maar toch, indien het land uwer bezitting onrein is, komt over in het land van de bezitting des HEEREN, waar de tabernakel des HEEREN woont, en neemt bezitting in het midden van ons; maar zijt niet wederspannig tegen den HEERE, en zijt ook niet wederspannig tegen ons, een altaar voor u bouwende, behalve het altaar van den HEERE, onzen God.","20":"Heeft niet Achan, de zoon van Zerah, overtreding begaan met het verbannene, en kwam er niet een verbolgenheid over de ganse vergadering van Israël? En die man stierf niet alleen in zijn ongerechtigheid.","21":"Toen antwoordden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse, en zij spraken met de hoofden der duizenden van Israël:","22":"De God der goden, de HEERE, de God der goden, de HEERE, Die weet het; Israël zelf zal het ook weten! Is het door wederspannigheid, of is het door overtreding tegen den HEERE, zo behoudt ons heden niet;","23":"Dat wij ons een altaar zouden gebouwd hebben, om ons van achter den HEERE af te keren, of om brandoffer en spijsoffer daarop te offeren, of om dankoffer daarop te doen, zo eise het de Heere.","24":"En zo wij dit niet uit zorg vanwege *deze* zaak gedaan hebben, zeggende: Morgen mochten uw kinderen tot onze kinderen spreken, zeggende: Wat hebt gij met den HEERE, den God van Israël, te doen?","25":"De HEERE heeft immers de Jordaan tot landpale gezet tussen ons en tussen ulieden, gij, kinderen van Ruben, en gij, kinderen van Gad! gij hebt geen deel aan den HEERE. Zo mochten uw kinderen onze kinderen doen ophouden, dat zij den HEERE niet vreesden.","26":"Daarom zeiden wij: Laat ons toch voor ons maken, bouwende een altaar, niet ten brandoffer, noch ten offer.","27":"Maar dat het een getuige zij tussen ons en tussen ulieden, en tussen onze geslachten na ons, opdat wij den dienst des HEEREN voor Zijn aangezicht dienen mochten met onze brandofferen, en met onze slachtofferen, en met onze dankofferen; en dat uw kinderen tot onze kinderen morgen niet zeggen: Gijlieden hebt geen deel aan den HEERE.","28":"Daarom zeiden wij: Wanneer het geschiedt, dat zij morgen *alzo* tot ons en tot onze geslachten zeggen zullen; zo zullen wij zeggen: Ziet de gedaante van het altaar des HEEREN, hetwelk onze vaderen gemaakt hebben, niet ten brandoffer, noch ten offer; maar het is een getuige tussen ons en tussen ulieden.","29":"Het zij verre van ons, dat wij zouden wederspannig zijn tegen den HEERE, of dat wij te dezen dage ons van achter den HEERE afkeren zouden, bouwende een altaar ten brandoffer, ten spijsoffer, of ten slachtoffer, behalve het altaar van den HEERE, onzen God, dat voor Zijn tabernakel is.","30":"Toen de priester Pinehas, en de oversten der vergadering, en de hoofden der duizenden van Israël, die bij hem waren, de woorden hoorden, die de kinderen van Ruben, en de kinderen van Gad, en de kinderen van Manasse gesproken hadden, zo was het goed in hun ogen.","31":"En Pinehas, de zoon van den priester Eleazar, zeide tot de kinderen van Ruben, en tot de kinderen van Gad, en tot de kinderen van Manasse: Heden weten wij, dat de HEERE in het midden van ons is, dewijl gij deze overtreding tegen den HEERE niet begaan hebt; toen hebt gijlieden de kinderen Israëls verlost uit de hand des HEEREN.","32":"En Pinehas, de zoon van den priester Eleazar, keerde wederom met de oversten van de kinderen van Ruben, en van de kinderen van Gad, uit het land Gilead, naar het land Kanaän, tot de kinderen Israëls; en zij brachten hun antwoord weder;","33":"Het antwoord nu was goed in de ogen van de kinderen Israëls, en de kinderen Israëls loofden God, en zeiden niet *meer* van tegen hen op te trekken met een heir, om het land te verderven, waarin de kinderen van Ruben en de kinderen van Gad woonden.","34":"En de kinderen van Ruben en de kinderen van Gad noemden dat altaar: Dat het een getuige zij tussen ons, dat de HEERE God is."},"KJV":{"1":"Then Joshua called the Reubenites, and the Gadites, and the half tribe of Manasseh,","2":"And said unto them, Ye have kept all that Moses the servant of the LORD commanded you, and have obeyed my voice in all that I commanded","3":"Ye have not left your brethren these many days unto this day, but have kept the charge of the commandment of the LORD your God.","4":"And now the LORD your God hath given rest unto your brethren, as he promised them: therefore now return ye, and get you unto your tents, *and* unto the land of your possession, which Moses the servant of the LORD gave you on the other side Jordan.","5":"But take diligent heed to do the commandment and the law, which Moses the servant of the LORD charged you, to love the LORD your God, and to walk in all his ways, and to keep his commandments, and to cleave unto him, and to serve him with all your heart and with all your soul.","6":"So Joshua blessed them, and sent them away: and they went unto their tents.","7":"Now to the *one* half of the tribe of Manasseh Moses had given *possession* in Bashan: but unto the *other* half thereof gave Joshua among their brethren on this side Jordan westward. And when Joshua sent them away also unto their tents, then he blessed","8":"And he spake unto them, saying, Return with much riches unto your tents, and with very much cattle, with silver, and with gold, and with brass, and with iron, and with very much raiment: divide the spoil of your enemies with your brethren.","9":"And the children of Reuben and the children of Gad and the half tribe of Manasseh returned, and departed from the children of Israel out of Shiloh, which *is* in the land of Canaan, to go unto the country of Gilead, to the land of their possession, whereof they were possessed, according to the word of the LORD by the hand of Moses.","10":"And when they came unto the borders of Jordan, that *are* in the land of Canaan, the children of Reuben and the children of Gad and the half tribe of Manasseh built there an altar by Jordan, a great altar to see to.","11":"And the children of Israel heard say, Behold, the children of Reuben and the children of Gad and the half tribe of Manasseh have built an altar over against the land of Canaan, in the borders of Jordan, at the passage of the children of Israel.","12":"And when the children of Israel heard *of it*, the whole congregation of the children of Israel gathered themselves together at Shiloh, to go up to war","13":"And the children of Israel sent unto the children of Reuben, and to the children of Gad, and to the half tribe of Manasseh, into the land of Gilead, Phinehas the son of Eleazar the priest,","14":"And with him ten princes, of each chief house a prince throughout all the tribes of Israel; and each one *was* an head of the house of their fathers among the thousands of Israel.","15":"And they came unto the children of Reuben, and to the children of Gad, and to the half tribe of Manasseh, unto the land of Gilead, and they spake with them, saying,","16":"Thus saith the whole congregation of the LORD, What trespass *is* this that ye have committed against the God of Israel, to turn away this day from following the LORD, in that ye have builded you an altar, that ye might rebel this day against the LORD?","17":"*Is* the iniquity of Peor too little for us, from which we are not cleansed until this day, although there was a plague in the congregation of the LORD,","18":"But that ye must turn away this day from following the LORD? and it will be, *seeing* ye rebel to day against the LORD, that to morrow he will be wroth with the whole congregation of Israel.","19":"Notwithstanding, if the land of your possession *be* unclean, *then* pass ye over unto the land of the possession of the LORD, wherein the LORD'S tabernacle dwelleth, and take possession among us: but rebel not against the LORD, nor rebel against us, in building you an altar beside the altar of the LORD our God.","20":"Did not Achan the son of Zerah commit a trespass in the accursed thing, and wrath fell on all the congregation of Israel? and that man perished not alone in his iniquity.","21":"Then the children of Reuben and the children of Gad and the half tribe of Manasseh answered, and said unto the heads of the thousands of Israel,","22":"The LORD God of gods, the LORD God of gods, he knoweth, and Israel he shall know; if *it be* in rebellion, or if in transgression against the LORD, (save us not this day,)","23":"That we have built us an altar to turn from following the LORD, or if to offer thereon burnt offering or meat offering, or if to offer peace offerings thereon, let the LORD himself require","24":"And if we have not *rather* done it for fear of *this* thing, saying, In time to come your children might speak unto our children, saying, What have ye to do with the LORD God of Israel?","25":"For the LORD hath made Jordan a border between us and you, ye children of Reuben and children of Gad; ye have no part in the LORD: so shall your children make our children cease from fearing the LORD.","26":"Therefore we said, Let us now prepare to build us an altar, not for burnt offering, nor for sacrifice:","27":"But *that* it *may be* a witness between us, and you, and our generations after us, that we might do the service of the LORD before him with our burnt offerings, and with our sacrifices, and with our peace offerings; that your children may not say to our children in time to come, Ye have no part in the LORD.","28":"Therefore said we, that it shall be, when they should *so* say to us or to our generations in time to come, that we may say *again*, Behold the pattern of the altar of the LORD, which our fathers made, not for burnt offerings, nor for sacrifices; but it *is* a witness","29":"God forbid that we should rebel against the LORD, and turn this day from following the LORD, to build an altar for burnt offerings, for meat offerings, or for sacrifices, beside the altar of the LORD our God that *is* before his tabernacle.","30":"And when Phinehas the priest, and the princes of the congregation and heads of the thousands of Israel which *were* with him, heard the words that the children of Reuben and the children of Gad and the children of Manasseh spake, it pleased","31":"And Phinehas the son of Eleazar the priest said unto the children of Reuben, and to the children of Gad, and to the children of Manasseh, This day we perceive that the LORD *is* among us, because ye have not committed this trespass against the LORD: now ye have delivered the children of Israel out of the hand of the LORD.","32":"And Phinehas the son of Eleazar the priest, and the princes, returned from the children of Reuben, and from the children of Gad, out of the land of Gilead, unto the land of Canaan, to the children of Israel, and brought them word again.","33":"And the thing pleased the children of Israel; and the children of Israel blessed God, and did not intend to go up against them in battle, to destroy the land wherein the children of Reuben and Gad dwelt.","34":"And the children of Reuben and the children of Gad called the altar *Ed*: for it *shall be* a witness between us that the LORD *is* God."}},"tsk":{"1":[{"kopje":"Jozua","refs":["Num 32:18-33","Deut 29:7","Deut 29:8"]}],"2":[{"kopje":"U hebt","refs":["Num 32:20-29","Deut 3:16-20"]},{"kopje":"gehoorzaam geweest","refs":["Joz 1:12-18"]}],"4":[{"kopje":"rust gegeven","refs":["Joz 21:43","Joz 21:44","Deut 12:9"]},{"kopje":"gaat","refs":["Joz 13:8","Joz 13:15-33  <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> you on the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> Jordan.","5":"But take <span class=\"wl wl-kjv\" data-code=\"H3966\">diligent</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> and the <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> which <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> you, to <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in all his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> and to <span class=\"wl wl-kjv\" data-code=\"H1692\">cleave</span> unto him, and to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him with all your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> and with all your soul.","6":"So <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> them, and sent them <span class=\"wl wl-kjv\" data-code=\"H7971\">away:</span> and they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> unto their tents.","7":"Now to the one <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> possession in <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan:</span> but unto the other <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> thereof <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H5973\">among</span> their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> on this <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">westward.</span> And when <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> sent them <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> also unto their <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> then he blessed","8":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> with <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H5233\">riches</span> unto your <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> and with <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle,</span> with <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and with <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and with <span class=\"wl wl-kjv\" data-code=\"H5178\">brass,</span> and with <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> and with <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">much</span> <span class=\"wl wl-kjv\" data-code=\"H8008\">raiment:</span> <span class=\"wl wl-kjv\" data-code=\"H2505\">divide</span> the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> with your brethren.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad</span> and the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> from the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of their <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> whereof they were <span class=\"wl wl-kjv\" data-code=\"H270\">possessed,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H6310\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of Moses.","10":"And when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1552\">borders</span> of <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> that are in the <span class=\"wl wl-kjv\" data-code 3\">Jordan,</span> at the <span class=\"wl wl-kjv\" data-code=\"H5676\">passage</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","12":"And when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of it, the whole <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6950\">together</span> at <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh,</span> to go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to war","13":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> <span class=\"wl wl-kjv\" data-code=\"H6372\">Phinehas</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the priest,","14":"And with him <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H5387\">princes,</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">each</span> <span class=\"wl wl-kjv\" data-code=\"H5387\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> a <span class=\"wl wl-kjv\" data-code=\"H1\">prince</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and each <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> was an <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> among the <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> of Israel.","15":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> and they <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> with them, saying,","16":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the whole <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> What <span class=\"wl wl-kjv\" data-code=\"H4604\">trespass</span> is this that ye have <span class=\"wl wl-kjv\" data-code=\"H4603\">committed</span> against the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> this <span class=\"wl wl-kjv\" const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
