n die om Hem heen zaten, zei Hij: Zie, Mijn moeder en Mijn broers. Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Joz 14:1-5": "Dit is nu wat de kinderen van Israël geërfd hebben in het land Kanaän: wat de priester Eleazar, en Jozua, de zoon van Nun, en de hoofden van de vaderen van de stammen van de kinderen van Israël, hun hebben doen erven; Door het lot van hun erfenis, zoals de HEERE door de dienst van Mozes geboden had, aangaande de negen stammen en de halve stam. Want aan de twee stammen en de halve stam had Mozes een erfdeel gegeven aan de overkant van de Jordaan; maar aan de Levieten had hij geen erfdeel onder hen gegeven.", "1 Sam 12:23": "Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.", "Richt 7:11": "En u zult horen wat zij zullen zeggen, en daarna zullen uw handen gesterkt worden, zodat u naar het leger zult aftrekken. Toen ging hij af, met Pura, zijn knecht, tot aan het uiterste van de gewapende mannen die in het leger waren.", "Tit 2:2": "Dat de oude mannen nuchter zijn, stemmig, bezonnen, gezond in het geloof, in de liefde, in de volharding.", "Hand 4:19": "Maar Petrus en Johannes antwoordden hun: Oordeelt u zelf, of het recht is voor God, meer naar u te luisteren dan naar God.", "Joz 24:15": "Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen!", "Deut 10:20": "De HEERE, uw God, zult u vrezen; Hem zult u dienen, en Hem zult u aanhangen, en bij Zijn Naam zweren.", "1 Joh 3:22": "en wat wij ook bidden, ontvangen wij van Hem, omdat wij Zijn geboden bewaren en doen wat welgevallig is voor Hem.", "Luk 2:28": "nam hij Hem in zijn armen, en loofde God, en zei:", "Ps 119:22": "Wentel van mij smaad en verachting, want ik heb Uw getuigenissen onderhouden.", "Ps 119:87": "Zij hebben mij bijna vernietigd op de aarde, maar ik heb Uw bevelen niet verlaten.", "2 Kron 30:4": "En deze zaak was goed in de ogen van de koning, en in de ogen van de hele gemeente.", "Openb 3:11": "Zie, Ik kom haastig; houd vast wat u hebt, opdat niemand uw kroon neemt.", "Matt 23:9": "En u zult niemand op aarde uw vader noemen; want Eén is uw Vader, namelijk Die in de hemelen is.", "Ex 24:7": "En hij nam het boek van het verbond, en hij las het voor de oren van het volk; en zij zeiden: Al wat de HEERE gesproken heeft, zullen wij doen en gehoorzamen.", "Est 1:21": "Dit woord nu vond de koning en de vorsten goed; en de koning deed naar het woord van Memuchan.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "1 Joh 2:3-6": "En hieraan weten wij, dat wij Hem gekend hebben, als wij Zijn geboden bewaren. Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet; Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "Deut 29:7": "Toen u nu kwam aan deze plaats, trok Sihon, de koning van Hesbon, uit, en Og, de koning van Bazan, ons tegemoet, ten strijde; en wij versloegen hen.", "Joz 2:7": "Die mannen dan achtervolgden hen op de weg naar de Jordaan, tot aan de doorwaadbare plaatsen; en men sloot de poort dicht, nadat zij naar buiten gegaan waren die hen achtervolgden.", "Ps 7:4-6": "HEERE, mijn God, als ik dat gedaan heb, als er onrecht in mijn handen is; Als ik kwaad vergolden heb aan hem die vrede met mij had; (ja, ik heb hem gered, die mij zonder reden benauwde!) Laat dan de vijand mijn ziel vervolgen, en achterhaalt haar, en vertreedt mijn leven ter aarde, en mijn eer in het stof doet wonen! Sela.", "Deut 6:20": "Wanneer uw zoon u morgen zal vragen: Wat zijn dat voor getuigenissen, en inzettingen, en rechten, die de HEERE, onze God, u geboden heeft?", "Jes 32:16-18": "En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid. En mijn volk zal in een woonplaats van vrede wonen, en in welverzekerde woningen, en in stille geruste plaatsen.", "Hand 25:11": "Want als ik onrecht doe en iets gedaan heb dat de dood verdient, weiger ik niet te sterven; maar als er niets waar is van wat dezen mij beschuldigen, kan niemand mij uit gunst aan hen overgeven. Ik beroep mij op de keizer.", "Ex 34:14": "(Want u zult zich niet buigen voor een andere god; want de Naam van de HEERE is IJveraar! Een ijverig God is Hij!)", "Hand 11:4": "Maar Petrus begon en verhaalde het hun stap voor stap, en zei:", "Deut 8:18": "Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "Joh 4:34": "Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.", "Openb 21:3": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn.", "Spr 28:26": "Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.", "Deut 12:5-7": "Maar naar de plaats die de HEERE, uw God, uit al uw stammen zal uitkiezen om Zijn Naam daar te vestigen, naar Zijn woning zult u vragen, en daarheen zult u komen; En daarheen zult u brengen uw brandoffers, en uw slachtoffers, en uw tienden, en het hefoffer van uw hand, en uw geloften, en uw vrijwillige offers, en de eerstgeboorte van uw runderen en van uw schapen. En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "Deut 28:9": "De HEERE zal u voor Zichzelf tot een heilig volk bevestigen, zoals Hij u gezworen heeft, wanneer u de geboden van de HEERE, uw God, houdt, en in Zijn wegen wandelt.", "Joz 24:16": "Toen antwoordde het volk en zei: Het zij verre van ons, dat wij de HEERE zouden verlaten om andere goden te dienen.", "Num 32:18-33": "Wij zullen niet terugkeren naar onze huizen, totdat de kinderen van Israël elk hun erfdeel in bezit genomen hebben. Want wij zullen met hen niet erven aan de andere zijde van de Jordaan en verder weg, omdat onze erfenis ons toegekomen is aan deze zijde van de Jordaan, naar het oosten. Toen zei Mozes tegen hen: Als u deze zaak doen zult, als u zich voor het aangezicht van de HEERE toerust ten strijde,", "Ps 119:4-6": "Heere! U hebt geboden, dat men Uw bevelen zeer bewaren zal. Och, dat mijn wegen gericht werden, om Uw inzettingen te bewaren! Dan zou ik niet beschaamd worden, wanneer ik letten zou op al Uw geboden.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "2 Kor 13:5": "Onderzoek uzelf, of u in het geloof bent, beproef uzelf. Of weet u zelf niet, dat Jezus Christus in u is? Tenzij u op de een of andere manier verwerpelijk bent.", "Lev 22:31": "Daarom zult u Mijn geboden houden, en die doen; Ik ben de HEERE!", "Richt 20:12": "En de stammen van Israël zonden mannen door de hele stam van Benjamin, en zeiden: Wat voor een kwaad is dit, dat onder u gebeurd is?", "Gal 5:23": "Tegen zulke mensen is de wet niet.", "Jes 43:10": "U bent Mijn getuigen, spreekt de HEERE, en Mijn knecht, die Ik uitverkoren heb; opdat u het weet, en Mij gelooft, en verstaat, dat Ik Dezelfde ben, dat er vóór Mij geen God geformeerd is, en na Mij geen zijn zal.", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "Mark 12:33": "en Hem lief te hebben uit heel het hart, en uit heel het verstand, en uit heel de ziel, en uit heel de kracht; en de naaste lief te hebben als zichzelf, is meer dan alle brandoffers en slachtoffers.", "Job 36:18-21": "Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen. Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht? Verlang niet naar die nacht, wanneer de volken van hun plaats worden weggenomen.", "Num 17:6": "Mozes dan sprak tot de kinderen van Israël, en al hun leiders gaven hem een staf, voor elke leider één staf, naar het huis van hun vaderen, twaalf staven; Aärons staf was ook onder hun staven.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Num 32:40": "Zo gaf Mozes Gilead aan Machir, de zoon van Manasse; en hij woonde daarin.", "1 Kon 14:16": "En Hij zal Israël overgeven, vanwege de zonden van Jerobeam, die gezondigd heeft, en die Israël heeft doen zondigen.", "1 Kor 15:58": "Daarom, mijn geliefde broeders! Wees standvastig, onwankelbaar, altijd overvloedig in het werk van de Heere, in de wetenschap dat uw arbeid niet tevergeefs is in de Heere.", "Ex 6:24": "En Eleazar, de zoon van Aäron, nam voor zich een van de dochters van Putiel tot een vrouw; en zij baarde hem Pinehas. Dit zijn de hoofden van de vaderen van de Levieten, naar hun huisgezinnen.", "Deut 12:11": "Dan zal er een plaats zijn die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; daarheen zult u brengen alles wat ik u gebied: uw brandoffers, en uw slachtoffers, uw tienden, en het hefoffer van uw hand, en alle beste keuze van uw geloften, die u de HEERE beloven zult.", "1 Kron 21:1": "Toen stond de satan op tegen Israël, en hij porde David aan, dat hij Israël telde.", "Joz 7:11": "Israël heeft gezondigd; en zij hebben ook Mijn verbond, dat Ik hun geboden had, overtreden; en ook hebben zij van het verbannene genomen, en ook gestolen, en ook gelogen, en hebben het ook onder hun eigen spullen gelegd.", "Deut 12:26": "Doch uw heilige dingen die u hebben zult, en uw geloften, zult u meenemen en komen naar de plaats die de HEERE zal uitkiezen;", "Matt 16:6": "En Jezus zei tegen hen: Kijk uit, en wacht u voor de zuurdesem van de Farizeeën en Sadduceeën.", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Hand 1:24": "En zij baden en zeiden: U, Heere! U, Kenner van de harten van allen, wijs van deze twee er één aan, die U uitverkoren hebt,", "Ps 116:1": "Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen;", "Deut 12:5": "Maar naar de plaats die de HEERE, uw God, uit al uw stammen zal uitkiezen om Zijn Naam daar te vestigen, naar Zijn woning zult u vragen, en daarheen zult u komen;", "Num 16:22": "Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?", "Matt 22:21": "Zij zeiden tegen Hem: Van de keizer. Toen zei Hij tegen hen: Geef dan aan de keizer wat van de keizer is, en aan God wat van God is.", "Ezech 43:10": "U, mensenkind, wijs het huis van Israël dit huis, opdat zij schaamrood worden vanwege hun ongerechtigheden, en laat ze het patroon afmeten.", "Ezech 33:15": "Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven.", "Ezra 10:3-44": "Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet. Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het. Toen stond Ezra op en liet de leiders van de priesters, de Levieten en heel Israël zweren dat zij zouden doen naar dit woord; en zij zwoeren.", "Matt 4:10": "Toen zei Jezus tegen hem: Ga weg, satan, want er staat geschreven: De Heere, uw God, zult u aanbidden, en Hem alleen dienen.", "Deut 7:4": "Want zij zouden uw zonen van Mij doen afwijken, zodat zij andere goden zouden dienen; en de toorn van de HEERE zou tegen u ontsteken, en u snel verdelgen.", "Deut 12:27": "En u zult uw brandoffers, het vlees en het bloed, bereiden op het altaar van de HEERE, uw God; en het bloed van uw slachtoffers zal op het altaar van de HEERE, uw God, worden uitgegoten; maar het vlees zult u eten.", "Ps 119:167": "Mijn ziel onderhoudt Uw getuigenissen, en ik heb ze zeer lief.", "Gen 28:8": "en dat Ezau zag dat de dochters van Kanaän slecht waren in de ogen van Izak, zijn vader;", "1 Kor 12:3": "Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest.", "Mark 13:9-23": "Maar let u zelf op; want zij zullen u overleveren aan de raadsvergaderingen, en aan de synagogen; u zult geslagen worden, en u zult voor stadhouders en koningen gebracht worden, omwille van Mij, hun tot een getuigenis. En het Evangelie moet eerst gepredikt worden onder alle volken. Maar wanneer zij u zullen wegleiden om u over te leveren, maak u dan niet vooraf bezorgd over wat u zult spreken, en bedenk het niet van tevoren; maar wat u in dat uur gegeven zal worden, spreek dat; want u bent het niet die spreekt, maar de Heilige Geest.", "Jes 55:13": "Voor een doorn zal een dennenboom opgaan, voor een distel zal een mirteboom opgaan; en het zal de HEERE wezen tot een naam, tot een eeuwig teken, dat niet uitgeroeid zal worden.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Jak 3:11-18": "Welt er ook uit een fontein, uit een en dezelfde ader, het zoete en het bittere? Kan ook, mijn broeders, een vijgenboom olijven voortbrengen, of een wijnstok vijgen? Zo kan ook geen fontein zout en zoet water voortbrengen. Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.", "Fil 4:11-13": "Niet dat ik dit zeg vanwege gebrek; want ik heb geleerd tevreden te zijn in de omstandigheden waarin ik ben. En ik weet vernederd te worden, ik weet ook overvloed te hebben; in alle opzichten en in alles ben ik ingewijd, zowel verzadigd te zijn als honger te lijden, zowel overvloed te hebben als gebrek te lijden. Ik kan alle dingen door Christus, Die mij kracht geeft.", "Ezra 1:3": "Wie is er onder u van al Zijn volk? Zijn God zij met hem, en hij trekt op naar Jeruzalem, dat in Juda is, en hij bouwt het huis van de HEERE, de God van Israël; Hij is de God, Die te Jeruzalem woont.", "Mark 12:30": "En u zult de Heere, uw God, liefhebben uit heel uw hart, en uit heel uw ziel, en uit heel uw verstand, en uit heel uw kracht. Dit is het eerste gebod.", "1 Sam 30:24": "Wie zou u toch in deze zaak horen? Want zoals het deel is van hen die mee de strijd in zijn getrokken, zo zal ook het deel zijn van hen die bij de spullen gebleven zijn; zij zullen gelijk delen.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "2 Petr 1:5-10": "En span daarom ook alle inspanning in om, naast uw geloof, ook deugd te voegen, en naast de deugd kennis, En naast de kennis matigheid, en naast de matigheid volharding, en naast de volharding godsvrucht, En naast de godsvrucht broederlijke liefde, en naast de broederlijke liefde, liefde jegens allen.", "Ps 119:100-102": "Ik ben voorzichtiger dan de ouden, omdat ik Uw bevelen bewaard heb. Ik heb mijn voeten geweerd van alle kwade paden, opdat ik Uw woord zou onderhouden. Ik ben niet geweken van Uw rechten, want U hebt mij geleerd.", "Hand 11:2-18": "En toen Petrus naar Jeruzalem opgegaan was, twistten degenen die uit de besnijdenis waren tegen hem, en zeiden: U bent bij mannen die de voorhuid hebben binnengegaan, en hebt met hen gegeten. Maar Petrus begon en verhaalde het hun stap voor stap, en zei:", "Num 32:1": "De nakomelingen van Ruben en de nakomelingen van Gad hadden veel vee, heel veel; en zij bekeken het land Jaezer en het land Gilead, en zie, deze plaats was een plaats geschikt voor vee.", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "2 Kor 9:10": "Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid;", "2 Kron 15:12": "En zij sloten een verbond, dat zij de HEERE, de God van hun vaderen, zouden zoeken met hun hele hart en met hun hele ziel.", "Hos 12:1": "Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.", "Fil 3:12-14": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben. Broeders, ik acht niet dat ik het zelf al gegrepen heb. Maar één ding doe ik: ik vergeet wat achter is, en strek mij uit naar wat voor is, en jaag naar het doel, naar de prijs van de roeping van God van boven in Christus Jezus.", "Spr 25:13": "Een trouwe gezant is voor hen die hem zenden, als de koelte van sneeuw op de dag van de oogst; want hij verkwikt de ziel van zijn heer.", "Gen 31:46-52": "En Jakob zei tegen zijn broeders: Verzamel stenen! En zij namen stenen, en maakten een hoop; en zij aten daar op die hoop. En Laban noemde hem Jegar-Sahadutha; maar Jakob noemde hem Gilead. Toen zei Laban: Deze hoop zij vandaag een getuige tussen mij en tussen u! Daarom noemde men zijn naam Gilead,", "Matt 13:8": "En een ander deel viel in de goede aarde, en gaf vrucht, het ene honderdvoud, het andere zestigvoud, en het andere dertigvoud.", "Luk 21:4": "Want die allen hebben van hun overvloed geworpen tot de gaven van God; maar deze heeft van haar gebrek, alle middelen van bestaan die zij had, daarin geworpen.", "Hand 11:2": "En toen Petrus naar Jeruzalem opgegaan was, twistten degenen die uit de besnijdenis waren tegen hem,", "Joz 9:15-21": "En Jozua sloot vrede met hen, en hij sloot een verbond met hen, dat hij hen in leven zou laten; en de leiders van de vergadering zwoeren het hun. En het gebeurde na verloop van drie dagen, nadat zij het verbond met hen gesloten hadden, dat zij hoorden dat zij hun naburen waren, en dat zij te midden van hen woonden. Want toen de kinderen van Israël verder trokken, kwamen zij op de derde dag bij hun steden aan; hun steden nu waren Gibeon, en Chefira, en Beeroth, en Kirjath-jearim.", "Deut 4:1": "Israël! hoor naar de inzettingen en de rechten die ik u leer te doen, opdat u leeft, en het land binnentrekt en in bezit neemt dat de HEERE, de God van uw vaderen, u geeft.", "Joz 13:25": "dat hun gebied was Jaezer, en alle steden van Gilead, en het halve land van de kinderen van Ammon, tot Aroer toe, die voor aan Rabba ligt;", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Num 7:10": "En de leiders offerden ter inwijding van het altaar, op de dag dat het gezalfd werd; de leiders dan offerden hun offergaven voor het altaar.", "Matt 26:41": "Waakt en bidt, opdat u niet in verzoeking komt; de geest is wel gewillig, maar het vlees is zwak.", "Joz 22:9-34": "Zo keerden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse terug, en trokken weg van de kinderen van Israël, van Silo, dat in het land Kanaän is, om te gaan naar het land van Gilead, naar het land van hun bezitting, waarin zij bezitters gemaakt waren, naar het bevel van de HEERE, door de dienst van Mozes. Toen zij aankwamen bij de grenzen van de Jordaan, die in het land Kanaän zijn, bouwden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse daar een altaar bij de Jordaan, een altaar groot van aanzien. En de kinderen van Israël hoorden zeggen: Zie, de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse hebben een altaar gebouwd, tegenover het land Kanaän, aan de grenzen van de Jordaan, aan de zijde van de kinderen van Israël.", "Hand 15:12": "En heel de menigte zweeg stil, en zij hoorden Barnabas en Paulus vertellen wat grote tekenen en wonderen God door hen onder de heidenen gedaan had.", "Ps 143:10": "Leer mij Uw welbehagen doen, want Gij zijt mijn God; Uw goede Geest leidt mij in een effen land.", "Gal 6:1": "Broeders, als een mens door een misdaad vervallen is, moet u, die geestelijk bent, hem die zo is terechtbrengen met een geest van zachtmoedigheid; en let daarbij op uzelf, zodat ook u niet in verzoeking komt.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "2 Kron 29:10": "Nu is het mijn hartsverlangen om een verbond te sluiten met de HEERE, de God van Israël, opdat de hitte van Zijn toorn van ons afkeert.", "1 Kor 16:13": "Waakt, staat vast in het geloof, houdt u mannelijk, weest sterk.", "1 Kon 12:27-30": "Als dit volk zal opgaan om offers te brengen in het huis van de HEERE te Jeruzalem, dan zal het hart van dit volk terugkeren naar hun heer, naar Rehabeam, de koning van Juda; ja, zij zullen mij doden, en terugkeren naar Rehabeam, de koning van Juda. Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zei tegen hen: Het is voor u teveel om naar Jeruzalem op te gaan; zie uw goden, o Israël, die u uit het land Egypte hebben opgevoerd. En hij zette het ene te Beth-el, en het andere plaatste hij te Dan.", "Joh 13:35": "Hieraan zullen allen weten dat u Mijn discipelen bent, als u liefde hebt onder elkaar.", "Deut 6:25": "En het zal ons gerechtigheid zijn, als wij ernaar streven al deze geboden te doen, voor het aangezicht van de HEERE, onze God, zoals Hij ons geboden heeft.", "Rom 7:4-6": "Zo dan, mijn broeders, u bent ook voor de wet gedood door het lichaam van Christus, opdat u zou toebehoren aan een Ander, namelijk aan Hem Die van de doden opgewekt is, opdat wij voor God vruchten zouden dragen. Want toen wij in het vlees waren, werkten de hartstochten van de zonden, die door de wet geprikkeld worden, in onze leden, om vruchten te dragen voor de dood. Maar nu zijn wij vrijgemaakt van de wet, omdat wij gestorven zijn aan datgene waaronder wij vastgehouden werden; zodat wij dienen in nieuwheid van de Geest, en niet in de oudheid van de letter.", "2 Kron 15:15": "En heel Juda was verblijd over deze eed; want zij hadden met hun hele hart gezworen, en met hun hele wil Hem gezocht; en Hij werd door hen gevonden, en de HEERE gaf hun rust van rondom.", "Spr 4:25": "Laat uw ogen recht vooruit zien, en uw oogleden zich recht voor u heen richten.", "Deut 32:46": "Zei hij tegen hen: Zet uw hart op al de woorden, die ik heden onder u betuig, dat u ze uw kinderen gebieden zult, dat zij nauwlettend zullen doen al de woorden van deze wet.", "Jer 34:15": "U nu was heden weer teruggekeerd, en had gedaan wat recht is in Mijn ogen, vrijheid uitroepend, ieder voor zijn naaste; en u had een verbond gemaakt voor Mijn aangezicht, in het huis dat naar Mijn Naam genoemd is.", "Gen 28:18": "Toen stond Jakob 's morgens vroeg op, en hij nam de steen die hij als hoofdkussen gelegd had, en zette hem op als een opgericht teken, en goot er olie boven op.", "Hebr 4:13": "En er is geen schepsel onzichtbaar voor Hem; maar alle dingen zijn naakt en geopend voor de ogen van Hem, met Wie wij te maken hebben.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Spr 3:16": "Lengte van dagen is in haar rechterhand, in haar linkerhand rijkdom en eer.", "Deut 13:14": "dan zult u onderzoeken, en naspeuren, en goed navragen; en zie, als het de waarheid is, de zaak zeker vaststaat, zo'n gruwel in uw midden gedaan is;", "Ps 63:6": "Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen.", "Jes 44:8": "Schrik niet, en wees niet bang; heb Ik het u van toen af niet doen horen en verkondigd? Want u bent Mijn getuigen: is er ook een God behalve Mij? Zeker, er is geen andere rotssteen: Ik ken er geen.", "Ps 10:13": "Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?", "Num 25:3": "Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Joh 12:26": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren.", "2 Kon 16:10": "Toen ging koning Achaz Tiglath-pilezer, de koning van Assyrië, tegemoet, naar Damaskus; en toen hij een altaar zag dat in Damaskus was, zond koning Achaz aan de priester Uria de tekening van het altaar, en de afbeelding ervan, naar heel zijn maaksel.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "1 Petr 4:7": "En het einde van alle dingen is nabij; wees dan nuchter en waak in de gebeden.", "Num 32:16-32": "Toen traden zij naar hem toe en zeiden: Wij zullen hier schaapskooien bouwen voor ons vee, en steden voor onze kinderen. Maar wij zelf zullen ons toerusten en vooroplopen voor de kinderen van Israël, totdat wij hen naar hun plaats gebracht zullen hebben; en onze kinderen zullen blijven in de versterkte steden, vanwege de inwoners van het land. Wij zullen niet terugkeren naar onze huizen, totdat de kinderen van Israël elk hun erfdeel in bezit genomen hebben.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Neh 8:7": "En Ezra loofde de HEERE, de grote God; en heel het volk antwoordde: Amen, amen! met opgeheven handen, en zij bogen zich neer en aanbaden de HEERE, met de gezichten ter aarde.", "Num 32:33-42": "Zo gaf Mozes hun, de kinderen van Gad, en de kinderen van Ruben, en de halve stam van Manasse, de zoon van Jozef, het koninkrijk van Sihon, koning van de Amorieten, en het koninkrijk van Og, koning van Bazan; het land met de steden ervan, binnen de grenzen, de steden van het land rondom. En de kinderen van Gad bouwden Dibon, en Ataroth, en Aroer, en Atroth-Sofan, en Jaezer, en Jogbeha,", "1 Kor 13:1-13": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn. En al zou het zo zijn dat ik de gave van de profetie had, en al de verborgenheden en al de wetenschap wist; en al zou het zo zijn dat ik al het geloof had, zodat ik bergen verzette, en de liefde niet had, dan zou ik niets zijn. En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud van de armen, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.", "Jer 42:5": "Toen zeiden zij tegen Jeremia: De HEERE zij tussen ons tot een waarachtig en betrouwbaar Getuige: als wij niet handelen naar elk woord waarmee de HEERE, uw God, u naar ons toe zal zenden!", "Joz 18:1": "En de hele gemeenschap van de kinderen van Israël verzamelde zich te Silo, en zij richtten daar de tent van de samenkomst op, nadat het land aan hen onderworpen was.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "1 Kron 2:7": "En de kinderen van Charmi waren Achan, de beroerder van Israël, die zich aan het verbannene vergreep.", "2 Tim 4:5": "Maar u, wees waakzaam in alles, verdraag verdrukkingen, doe het werk van een evangelist, vervul uw dienst ten volle.", "Deut 4:39": "Zo zult u vandaag weten, en in uw hart overdenken, dat de HEERE die God is, boven in de hemel en beneden op de aarde, niemand anders!", "Jak 2:10-12": "Want wie de hele wet houdt, en in één ding struikelt, die is schuldig geworden aan alle geboden. Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden. Spreek zo, en doe zo, als mensen die door de wet van de vrijheid geoordeeld zullen worden.", "Joh 14:9": "Jezus zei tegen hem: Ben Ik zo lange tijd bij u, en hebt u Mij niet gekend, Filippus? Wie Mij gezien heeft, heeft de Vader gezien; en hoe zegt u dan: Toon ons de Vader?", "Ps 101:3": "Ik zal geen slechte zaak voor mijn ogen stellen; ik haat het doen van de afvalligen, het zal mij niet aankleven.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 103:18": "Over hen die Zijn verbond houden, en die aan Zijn bevelen denken, om die te doen.", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Joh 14:21-24": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren. Judas, niet de Iskariot, zei tegen Hem: Heere, hoe komt het dat U Uzelf aan ons zult openbaren, en niet aan de wereld? Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Ps 103:21": "Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet!", "1 Petr 5:8": "Wees nuchter en waakzaam; want uw tegenstander, de duivel, gaat rond als een brullende leeuw, op zoek naar wie hij zou kunnen verslinden.", "Ps 60:9": "Gilead is van mij, en Manasse is van mij, en Efraïm is de sterkte van mijn hoofd; Juda is mijn wetgever.", "Jes 33:15-17": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet; Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis. Uw ogen zullen de Koning zien in Zijn schoonheid; zij zullen een ver gelegen land zien.", "Spr 29:7": "De rechtvaardige neemt kennis van de rechtszaak van de armen; maar de goddeloze begrijpt die kennis niet.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Jes 37:16": "O HEERE van de heerscharen¹, God van Israël, Die tussen de cherubs² woont! U Zelf, U alleen bent de God van alle koninkrijken van de aarde; U hebt de hemel en de aarde gemaakt!", "1 Kon 4:24": "Want hij had heerschappij over alles wat aan deze kant van de rivier was, van Thifsah tot aan Gaza toe, over alle koningen aan deze kant van de rivier; en hij had vrede van al zijn zijden rondom.", "Richt 20:28": "En Pinehas, de zoon van Eleazar, de zoon van Aäron, stond voor Zijn aangezicht in die dagen, en zei: Zal ik nog meer uittrekken ten strijde tegen de kinderen van Benjamin, mijn broeder, of zal ik ophouden? En de HEERE zei: Trek op, want morgen zal Ik hem in uw hand geven.", "Ps 45:11": "Hoor, o Dochter! en zie, en neig uw oor; en vergeet uw volk en het huis van uw vader.", "Joz 23:11": "Daarom bewaart uw zielen zorgvuldig, dat u de HEERE, uw God, liefhebt.", "Spr 11:14": "Als er geen wijs beleid is, valt het volk; maar de behoudenis is in de veelheid van raadslieden.", "Ps 37:6": "En Hij zal uw gerechtigheid doen voortkomen als het licht, en uw recht als de middag.", "Deut 29:12": "Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;", "Num 32:39": "En de kinderen van Machir, de zoon van Manasse, gingen naar Gilead, en namen het in, en zij verdreven de Amorieten die daarin waren, uit hun bezit.", "Ezra 4:2": "kwamen zij naar Zerubbabel en naar de hoofden van de families toe en zeiden tegen hen: Laat ons met u bouwen, want wij zoeken uw God net als u; ook offeren wij aan Hem sinds de dagen van Esar-Haddon, de koning van Assur, die ons hierheen heeft laten optrekken.", "Spr 20:18": "Elke gedachte wordt door raad bevestigd, voer daarom oorlog met wijze raadslagen.", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "Jes 43:11": "Ik, Ik ben de HEERE, en er is geen Heiland behalve Mij.", "1 Joh 2:11": "Maar wie zijn broeder haat, is in de duisternis, en wandelt in de duisternis, en weet niet, waar hij heengaat; want de duisternis heeft zijn ogen verblind.", "1 Petr 1:13": "Omgord daarom de lenden van uw verstand, wees nuchter, en hoop volkomen op de genade die u gebracht wordt bij de openbaring van Jezus Christus.", "Matt 9:9": "En toen Jezus vandaar verder ging, zag Hij een man in het tolhuis zitten, genaamd Mattheüs; en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Mark 4:24": "En Hij zei tegen hen: Let op wat u hoort. Met de maat waarmee u meet, zal u gemeten worden, en aan u die hoort, zal meer gegeven worden.", "1 Sam 25:33": "En gezegend zij uw raad, en gezegend bent u, dat u mij vandaag ervan weerhouden hebt te komen met bloedvergieten, en dat mijn hand mij verlost zou hebben!", "1 Sam 15:22": "Doch Samuël zei: Heeft de HEERE evenveel behagen in brandoffers en slachtoffers, als in het gehoorzamen aan de stem van de HEERE? Zie, gehoorzamen is beter dan slachtoffer, opmerken beter dan het vet van rammen.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Deut 27:9": "Vervolgens sprak Mozes, samen met de Levitische priesters, tot heel Israël: Luister toe en hoor, o Israël! Op deze dag bent u het volk van de HEERE, uw God, geworden.", "Ps 39:2": "Ik zei: Ik zal op mijn wegen letten, dat ik niet zondig met mijn tong; ik zal mijn mond met een breidel in toom houden, terwijl de goddeloze nog tegenover mij is.", "Spr 10:16": "Het werk van de rechtvaardige leidt tot leven; de opbrengst van de goddeloze leidt tot zonde.", "Luk 8:15": "En wat in de goede aarde valt, dat zijn zij die het Woord gehoord hebben en het in een eerlijk en goed hart bewaren, en met volharding vruchten voortbrengen.", "1 Kor 11:28": "Maar laat de mens zichzelf beproeven, en laat hij zo van het brood eten, en van de drinkbeker drinken.", "Num 7:24": "Op de derde dag offerde de leider van de zonen van Zebulon, Eliab, de zoon van Helon.", "Spr 25:9-13": "Voer uw geschil met uw naaste; maar openbaar het geheim van een ander niet; Opdat hij die het hoort, u niet smaadt; want uw kwade reputatie zou niet worden afgewend. Een woord, op zijn tijd gesproken, is als gouden appels in zilveren gebeelde schalen."}, "noten": {"1": "D.i. wat door de ban onherroepelijk aan de HEERE gewijd is.", "2": "Immers betekent hier: zeker, voorzeker."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H227\">Toen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7121\">riep</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3091\">Jozua</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3091\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7206\">Rubenieten</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H2677\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1425\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1425\">Gadieten</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H1425\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1425\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2677\">halve</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4294\">stam</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4294\">van</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4519\">Manasse</span>,", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H559\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H559\">hij</span> zei tegen <span class=\"wl\" data-l=\"L2\" data-code=\"H859\">hen</span>: U <span class=\"wl\" data-l=\"L3\" data-code=\"H8104\">hebt</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3605\">alles</span> <span cla et</span> you unto your <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> and unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of your <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> which <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> you on the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> Jordan.", "5": "But take <span class=\"wl wl-kjv\" data-code=\"H3966\">diligent</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> and the <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> which <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> you, to <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in all his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> his <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> and to <span class=\"wl wl-kjv\" data-code=\"H1692\">cleave</span> unto him, and to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him with all your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> and with all your soul.", "6": "So <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> them, and sent them <span class=\"wl wl-kjv\" data-code=\"H7971\">away:</span> and they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> unto their tents.", "7": "Now to the one <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> possession in <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan:</span> but unto the other <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> thereof <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H5973\">among</span> their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> on this <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">westward.</span> And when <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> sent them <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> also unto their <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> then he blessed", "8": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> with <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H5233\">riches</span> unto your <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> and with <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle,</span> with <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and with <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and with <span class=\"wl wl-kjv\" data-code=\"H5178\">brass,</span> and with <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> and with <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">much</span> <span class=\"wl wl-kjv\" data-code=\"H8008\">raiment:</span> <span class=\"wl wl-kjv\" data-code=\"H2505\">divide</span> the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> with your brethren.", "9": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad</span> and the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> from the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of their <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> whereof they were <span class=\"wl wl-kjv\" data-code=\"H270\">possessed,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H6310\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of Moses.", "10": "And when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1552\">borders</span> of <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> that are in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad</span> and the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> there an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> by <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> to see to.", "11": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad</span> and the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> have <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> over <span class=\"wl wl-kjv\" data-code=\"H4136\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> in the <span class=\"wl wl-kjv\" data-code=\"H1552\">borders</span> of <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> at the <span class=\"wl wl-kjv\" data-code=\"H5676\">passage</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.", "12": "And when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of it, the whole <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6950\">together</span> at <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh,</span> to go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to war", "13": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> <span class=\"wl wl-kjv\" data-code=\"H6372\">Phinehas</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the priest,", "14": "And with him <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H5387\">princes,</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">each</span> <span class=\"wl wl-kjv\" data-code=\"H5387\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> a <span class=\"wl wl-kjv\" data-code=\"H1\">prince</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and each <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> was an <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> among the <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> of Israel.", "15": "And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> and they <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> with them, saying,", "16": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the whole <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> What <span class=\"wl wl-kjv\" data-code=\"H4604\">trespass</span> is this that ye have <span class=\"wl wl-kjv\" data-code=\"H4603\">committed</span> against the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">following</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> in that ye have <span class=\"wl wl-kjv\" data-code=\"H1129\">builded</span> you an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> that ye might <span class=\"wl wl-kjv\" data-code=\"H4775\">rebel</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> against the LORD?", "17": "Is the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of <span class=\"wl wl-kjv\" data-code=\"H6465\">Peor</span> too <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> for us, from which we are not <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed</span> until this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> although there was a <span class=\"wl wl-kjv\" data-code=\"H5063\">plague</span> in the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the LORD,", "18": "But that ye must turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">following</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span> and it will be, seeing ye <span class=\"wl wl-kjv\" data-code=\"H4775\">rebel</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> he will be <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth</span> with the whole <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of Israel.", "19": "<span class=\"wl wl-kjv\" data-code=\"H389\">Notwithstanding,</span> if the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of your <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> be <span class=\"wl wl-kjv\" data-code=\"H2931\">unclean,</span> then pass ye <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> wherein the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> <span class=\"wl wl-kjv\" data-code=\"H7931\">dwelleth,</span> and take <span class=\"wl wl-kjv\" data-code=\"H270\">possession</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> us: but <span class=\"wl wl-kjv\" data-code=\"H4775\">rebel</span> not against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H408\">nor</span> <span class=\"wl wl-kjv\" data-code=\"H4775\">rebel</span> against us, in <span class=\"wl wl-kjv\" data-code=\"H1129\">building</span> you an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> <span class=\"wl wl-kjv\" data-code=\"H1107\">beside</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our God.", "20": "Did not <span class=\"wl wl-kjv\" data-code=\"H5912\">Achan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2226\">Zerah</span> <span class=\"wl wl-kjv\" data-code=\"H4603\">commit</span> a <span class=\"wl wl-kjv\" data-code=\"H4604\">trespass</span> in the accursed <span class=\"wl wl-kjv\" data-code=\"H2764\">thing,</span> and <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> <span class=\"wl wl-kjv\" data-code=\"H1961\">fell</span> on all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> and that <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H1478\">perished</span> not <span class=\"wl wl-kjv\" data-code=\"H259\">alone</span> in his iniquity.", "21": "Then the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad</span> and the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> of the <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> of Israel,", "22": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> he <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> he shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know;</span> if it be in <span class=\"wl wl-kjv\" data-code=\"H4777\">rebellion,</span> or if in <span class=\"wl wl-kjv\" data-code=\"H4604\">transgression</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data- /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
