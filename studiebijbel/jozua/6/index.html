","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"(Jericho sloot nu de poorten stevig, en was gesloten, voor het aangezicht van de kinderen van Israël; er ging niemand uit, en er ging niemand in.)","2":"Toen zei de HEERE tegen Jozua: Zie, Ik heb Jericho met haar koning *en* strijdbare helden in uw hand gegeven.","3":"U dan allen, die krijgslieden bent, zult rondom de stad gaan, de stad omringend eenmaal; zo zult u doen, zes dagen lang.","4":"En zeven priesters zullen zeven ramsbazuinen dragen, voor de ark; en u zult op de zevende dag de stad zevenmaal omgaan; en de priesters zullen met de bazuinen blazen.","5":"En het zal gebeuren, als men langzaam op de ramshoorn blaast, als u het geluid van de bazuin hoort, dan zal heel het volk juichen met een groot gejuich; dan zal de stadsmuur onder zich vallen, en het volk zal daarin klimmen, ieder tegenover zich.","6":"Toen riep Jozua, de zoon van Nun, de priesters, en zei tegen hen: Draagt de ark van het verbond, en laat zeven priesters zeven ramsbazuinen dragen, voor de ark van de HEERE.","7":"En tegen het volk zei hij: Trekt door en gaat rondom deze stad; en wie toegerust is, die trekke door voor de ark van de HEERE.","8":"En het gebeurde, zoals Jozua tegen het volk gesproken had, dat de zeven priesters, die zeven ramsbazuinen droegen, gingen voor het aangezicht van de HEERE; zij trokken door en bliezen op de bazuinen; en de ark van het verbond van de HEERE volgde hen na;","9":"En wie toegerust was, ging voor het aangezicht van de priesters, die de bazuinen bliezen; en de achtertocht volgde de ark na, terwijl men ging en blies op de bazuinen.","10":"Jozua nu had het volk geboden en gezegd: U zult niet juichen, ja, u zult uw stem niet laten horen, en er zal geen woord uit uw mond uitgaan, tot op de dag waarop ik tegen u zal zeggen: Juicht! dan zult u juichen.","11":"En hij liet de ark van de HEERE rondom de stad gaan, die eenmaal omringend; toen kwamen zij weer in het leger, en overnachtten in het leger.","12":"Daarna stond Jozua 's morgens vroeg op, en de priesters droegen de ark van de HEERE.","13":"En de zeven priesters, die de zeven ramsbazuinen droegen voor de ark van de HEERE, gingen voort, en bliezen op de bazuinen; en de toegerusten gingen voor hun aangezichten, en de achtertocht volgde de ark van de HEERE na, terwijl men ging en blies op de bazuinen.","14":"Zo gingen zij eenmaal rondom de stad op de tweede dag; en zij keerden weer terug in het leger. Zo deden zij zes dagen lang.","15":"En het gebeurde op de zevende dag, dat zij zich vroeg opmaakten, bij het opgaan van de dageraad, en zij gingen rondom de stad, op dezelfde wijze, zevenmaal; alleen op die dag gingen zij zevenmaal rondom de stad.","16":"En het gebeurde de zevende maal, toen de priesters op de bazuinen bliezen, dat Jozua tegen het volk sprak: Juicht, want de HEERE heeft u de stad gegeven!","17":"Doch deze stad zal de HEERE verbannen zijn[1], zij en al wat daarin is; alleen zal de hoer Rachab levend blijven, zij en allen die met haar in het huis zijn, omdat zij de boden, die wij uitgezonden hadden, verborgen heeft.","18":"Alleen dat u zich wacht voor het verbannene, opdat u zich niet misschien verbant, door van het verbannene te nemen, en het leger van Israël niet tot een ban stelt, noch dat verstoort.","19":"Maar al het zilver en goud, en de koperen en ijzeren voorwerpen, zullen de HEERE heilig zijn; naar de schat van de HEERE zullen zij komen.","20":"Het volk dan juichte, toen zij op de bazuinen bliezen; en het gebeurde, toen het volk het geluid van de bazuin hoorde, dat het volk juichte met een groot gejuich; en de muur viel onder zich, en het volk klom in de stad, ieder tegenover zich, en zij namen de stad in.","21":"En zij verbanden alles wat in de stad was, van de man tot de vrouw toe, van het kind tot de oude, en tot de os, en het kleinvee, en de ezel, door de scherpte van het zwaard.","22":"Jozua nu zei tegen de twee mannen, de verspieders van het land: Gaat in het huis van de vrouw, de hoer, en brengt die vrouw vandaar uit, met alles wat zij heeft, zoals u haar gezworen hebt.","23":"Toen gingen de jongelingen, de verspieders, daarin en brachten Rachab eruit, en haar vader, en haar moeder, en haar broeders, en alles wat zij had; ook brachten zij al haar huisgezinnen uit, en zij stelden hen buiten het leger van Israël.","24":"De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.","25":"Dus liet Jozua de hoer Rachab leven, en het huisgezin van haar vader, en alles wat zij had; en zij heeft gewoond in het midden van Israël tot op deze dag, omdat zij de boden verborgen had, die Jozua gezonden had om Jericho te verspieden.","26":"En terzelfder tijd bezwoer Jozua hen, en zei: Vervloekt zij die man voor het aangezicht van de HEERE, die zich opmaakt en deze stad Jericho bouwen zal; dat hij haar grondvest op zijn eerstgeboren zoon, en haar poorten stelt op zijn jongste zoon!","27":"Zo was de HEERE met Jozua; en zijn faam ging door heel het land."},"SV":{"1":"( Jericho nu sloot *de* *poorten* toe, en was gesloten, voor het aangezicht van de kinderen Israëls; er ging niemand uit, en er ging niemand in.)","2":"Toen zeide de HEERE tot Jozua: Zie, Ik heb Jericho met haar koning *en* strijdbare helden in uw hand gegeven.","3":"Gij dan allen, die krijgslieden zijt, zult rondom de stad gaan, de stad omringende eenmaal; alzo zult gij doen zes dagen lang.","4":"En zeven priesters zullen zeven ramsbazuinen dragen, voor de ark; en gijlieden zult op den zevenden dag de stad zevenmaal omgaan; en de priesters zullen met de bazuinen blazen.","5":"En het zal geschieden, als men langzaam met den ramshoorn blaast, als gijlieden het geluid der bazuin hoort, zo zal al het volk juichen met een groot gejuich; dan zal de stadsmuur onder zich vallen, en het volk zal daarin klimmen, een iegelijk tegenover zich.","6":"Toen riep Jozua, de zoon van Nun, de priesters, en zeide tot hen: Draagt de ark des verbonds, en dat zeven priesters zeven ramsbazuinen dragen, voor de ark des HEEREN.","7":"En tot het volk zeide hij: Trekt door en gaat rondom deze stad; en wie toegerust is, die ga door voor de ark des HEEREN.","8":"En het geschiedde, gelijk Jozua tot het volk gesproken had, zo gingen de zeven priesters, dragende zeven ramsbazuinen, voor het aangezicht des HEEREN; zij trokken door en bliezen met de bazuinen; en de ark des verbonds des HEEREN volgde hen na;","9":"En wie toegerust was, ging voor het aangezicht der priesteren, die de bazuinen bliezen ; en de achtertocht volgde de ark na, terwijl men ging en blies met de bazuinen.","10":"Jozua nu had het volk geboden, zeggende: Gij zult niet juichen, ja, gij zult uw stem niet laten horen, en geen woord zal er uit uw mond uitgaan, tot op den dag, wanneer ik tot ulieden zeggen zal: Juicht! dan zult gij juichen.","11":"En hij deed de ark des HEEREN rondom de stad gaan, omringende *dezelve* eenmaal; toen kwamen zij *weder* in het leger, en vernachtten in het leger.","12":"Daarna stond Jozua des morgens vroeg op, en de priesters droegen de ark des HEEREN.","13":"En de zeven priesters, dragende de zeven ramsbazuinen voor de ark des HEEREN, gingen voort, en bliezen met de bazuinen; en de toegerusten gingen voor hun aangezichten, en de achtertocht volgde de ark des HEEREN na, terwijl men ging en blies met de bazuinen.","14":"Alzo gingen zij eenmaal rondom de stad op den tweeden dag; en zij keerden weder in het leger. Alzo deden zij zes dagen lang.","15":"En het geschiedde op den zevenden dag, dat zij zich vroeg opmaakten, met het opgaan des dageraads, en zij gingen rondom de stad, naar dezelve wijze, zevenmaal; alleenlijk op dien dag gingen zij zevenmaal rondom de stad.","16":"En het geschiedde ten zevenden male, als de priesters met de bazuinen bliezen, dat Jozua tot het volk sprak: Juicht, want de HEERE heeft ulieden de stad gegeven!","17":"Doch deze stad zal den HEERE verbannen zijn, zij en al wat daarin is; alleenlijk zal de hoer Rachab levend blijven, zij en allen, die met haar in het huis zijn, omdat zij de boden, die wij uitgezonden hadden, verborgen heeft.","18":"Alleenlijk dat gijlieden u wacht van het verbannene, opdat gij u misschien niet verbant, mits nemende van het verbannene, en het leger van Israël niet stelt tot een ban, noch datzelve beroert.","19":"Maar al het zilver en goud, en de koperen en ijzeren vaten, zullen den HEERE heilig zijn; tot den schat des HEEREN zullen zij komen.","20":"Het volk dan juichte, als zij met de bazuinen bliezen; en het geschiedde, als het volk het geluid der bazuin hoorde, zo juichte het volk met een groot gejuich; en de muur viel onder zich, en het volk klom in de stad, een ieder tegenover zich, en zij namen de stad in.","21":"En zij verbanden alles, wat in de stad was, van den man tot de vrouw toe, van het kind tot den oude, en tot den os, en het klein vee, en den ezel, door de scherpte des zwaards.","22":"Jozua nu zeide tot de twee mannen, de verspieders des lands: Gaat in het huis der vrouw, der hoer, en brengt die vrouw van daar uit, met al wat zij heeft, gelijk als gij haar gezworen hebt.","23":"Toen gingen de jongelingen, de verspieders, daarin en brachten er Rachab uit, en haar vader, en haar moeder, en haar broeders, en al wat zij had; ook brachten zij uit al haar huisgezinnen, en zij stelden hen buiten het leger van Israël.","24":"De stad nu verbrandden zij met vuur, en al wat daarin was; alleenlijk het zilver en goud, mitsgaders de koperen en ijzeren vaten, gaven zij tot den schat van het huis des HEEREN.","25":"Dus liet Jozua de hoer Rachab leven, en het huisgezin haars vaders, en al wat zij had; en zij heeft gewoond in het midden van Israël tot op dezen dag, omdat zij de boden verborgen had, die Jozua gezonden had, om Jericho te verspieden.","26":"En ter zelver tijd bezwoer hen Jozua, zeggende: Vervloekt zij die man voor het aangezicht des HEEREN, die zich opmaken en deze stad Jericho bouwen zal; dat hij ze grondveste op zijn eerstgeborenen zoon, en haar poorten stelle op zijn jongsten zoon!","27":"Alzo was de HEERE met Jozua; en zijn gerucht liep door het ganse land."},"KJV":{"1":"Now Jericho was straitly shut up because of the children of Israel: none went out, and none came in.","2":"And the LORD said unto Joshua, See, I have given into thine hand Jericho, and the king thereof, *and* the mighty men of valour.","3":"And ye shall compass the city, all *ye* men of war, *and* go round about the city once. Thus shalt thou do six days.","4":"And seven priests shall bear before the ark seven trumpets of rams' horns: and the seventh day ye shall compass the city seven times, and the priests shall blow with the trumpets.","5":"And it shall come to pass, that when they make a long *blast* with the ram's horn, *and* when ye hear the sound of the trumpet, all the people shall shout with a great shout; and the wall of the city shall fall down flat, and the people shall ascend up every man","6":"And Joshua the son of Nun called the priests, and said unto them, Take up the ark of the covenant, and let seven priests bear seven trumpets of rams' horns before the ark of the LORD.","7":"And he said unto the people, Pass on, and compass the city, and let him that is armed pass on before the ark of the LORD.","8":"And it came to pass, when Joshua had spoken unto the people, that the seven priests bearing the seven trumpets of rams' horns passed on before the LORD, and blew with the trumpets: and the ark of the covenant of the LORD followed them.","9":"And the armed men went before the priests that blew with the trumpets, and the rereward came after the ark, *the priests* going on, and blowing with the trumpets.","10":"And Joshua had commanded the people, saying, Ye shall not shout, nor make any noise with your voice, neither shall *any* word proceed out of your mouth, until the day I bid you shout; then shall ye shout.","11":"So the ark of the LORD compassed the city, going about *it* once: and they came into the camp, and lodged in the camp.","12":"And Joshua rose early in the morning, and the priests took up the ark of the LORD.","13":"And seven priests bearing seven trumpets of rams' horns before the ark of the LORD went on continually, and blew with the trumpets: and the armed men went before them; but the rereward came after the ark of the LORD, *the priests* going on, and blowing with the trumpets.","14":"And the second day they compassed the city once, and returned into the camp: so they did six days.","15":"And it came to pass on the seventh day, that they rose early about the dawning of the day, and compassed the city after the same manner seven times: only on that day they compassed the city seven times.","16":"And it came to pass at the seventh time, when the priests blew with the trumpets, Joshua said unto the people, Shout; for the LORD hath given you the city.","17":"And the city shall be accursed, *even* it, and all that *are* therein, to the LORD: only Rahab the harlot shall live, she and all that *are* with her in the house, because she hid the messengers that we sent.","18":"And ye, in any wise keep *yourselves* from the accursed thing, lest ye make *yourselves* accursed, when ye take of the accursed thing, and make the camp of Israel a curse, and trouble","19":"But all the silver, and gold, and vessels of brass and iron, *are* consecrated unto the LORD: they shall come into the treasury of the LORD.","20":"So the people shouted when *the priests* blew with the trumpets: and it came to pass, when the people heard the sound of the trumpet, and the people shouted with a great shout, that the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city.","21":"And they utterly destroyed all that *was* in the city, both man and woman, young and old, and ox, and sheep, and ass, with the edge of the sword.","22":"But Joshua had said unto the two men that had spied out the country, Go into the harlot's house, and bring out thence the woman, and all that she hath, as ye sware","23":"And the young men that were spies went in, and brought out Rahab, and her father, and her mother, and her brethren, and all that she had; and they brought out all her kindred, and left them without the camp of Israel.","24":"And they burnt the city with fire, and all that *was* therein: only the silver, and the gold, and the vessels of brass and of iron, they put into the treasury of the house of the LORD.","25":"And Joshua saved Rahab the harlot alive, and her father's household, and all that she had; and she dwelleth in Israel *even* unto this day; because she hid the messengers, which Joshua sent to spy out Jericho.","26":"And Joshua adjured *them* at that time, saying, ,"7":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Pass <span class=\"wl wl-kjv\" data-code=\"H5674\">on,</span> and <span class=\"wl wl-kjv\" data-code=\"H5437\">compass</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and let him that is <span class=\"wl wl-kjv\" data-code=\"H2502\">armed</span> pass <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the LORD.","8":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">spoken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">bearing</span> the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets</span> of rams' <span class=\"wl wl-kjv\" data-code=\"H3104\">horns</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> with the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets:</span> and the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">followed</span> them.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H2502\">armed</span> men <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> that <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> with the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets,</span> and the <span class=\"wl wl-kjv\" data-code=\"H622\">rereward</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">came</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark,</span> the priests going <span class=\"wl wl-kjv\" data-code=\"H1980\">on,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">blowing</span> with the trumpets.","10":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye shall not <span class=\"wl wl-kjv\" data-code=\"H7321\">shout,</span> nor make any <span class=\"wl wl-kjv\" data-code=\"H8085\">noise</span> with your <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> neither shall any <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">proceed</span> out of your <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> until the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> I <span class=\"wl wl-kjv\" data-code=\"H559\">bid</span> you <span class=\"wl wl-kjv\" data-code=\"H7321\">shout;</span> then shall ye shout.","11":"So the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> going <span class=\"wl wl-kjv\" data-code=\"H5362\">about</span> it <span class=\"wl wl-kjv\" data-code=\"H6471\">once:</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> and <span class=\"wl wl-kjv\" data-code=\"H3885\">lodged</span> in the camp.","12":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> rose <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> took <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the LORD.","13":"And <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">bearing</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets</span> of rams' <span class=\"wl wl-kjv\" data-code=\"H3104\">horns</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> went <span class=\"wl wl-kjv\" data-code=\"H1980\">on</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">continually,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> with the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets:</span> and the armed <span class=\"wl wl-kjv\" data-code=\"H2502\">men</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them; but the <span class=\"wl wl-kjv\" data-code=\"H622\">rereward</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">came</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the priests going <span class=\"wl wl-kjv\" data-code=\"H1980\">on,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">blowing</span> with the trumpets.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> they <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">once,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> into the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp:</span> so they <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> days.","15":"And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that they rose <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> about the <span class=\"wl wl-kjv\" data-code=\"H5927\">dawning</span> of the <span class=\"wl wl-kjv\" data-code=\"H7837\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> after the same <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times:</span> only on that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> they <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> times.","16":"And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">time,</span> when the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> with the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets,</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H7321\">Shout;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you the city.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2764\">accursed,</span> even it, and all that are therein, to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> only <span class=\"wl wl-kjv\" data-code=\"H7343\">Rahab</span> the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> shall <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> she and all that are with her in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> because she <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> that we sent.","18":"And ye, in any <span class=\"wl wl-kjv\" data-code=\"H7535\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> yourselves from the accursed <span class=\"wl wl-kjv\" data-code=\"H2764\">thing,</span> lest ye make yourselves <span class=\"wl wl-kjv\" data-code=\"H2763\">accursed,</span> when ye <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the accursed <span class=\"wl wl-kjv\" data-code=\"H2764\">thing,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> a <span class=\"wl wl-kjv\" data-code=\"H2764\">curse,</span> and trouble","19":"But all the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> and <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> are <span class=\"wl wl-kjv\" data-code=\"H6944\">consecrated</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> they shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H214\">treasury</span> of the LORD.","20":"So the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7321\">shouted</span> when the priests <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> with the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets:</span> and it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7321\">shouted</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8643\">shout,</span> that the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> fell down <span class=\"wl wl-kjv\" data-code=\"H5307\">flat,</span> so that the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> straight before him, and they <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> the city.","21":"And they utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed</span> all that was in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> both <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> <span class=\"wl wl-kjv\" data-code=\"H5288\">young</span> and <span class=\"wl wl-kjv\" data-code=\"H2205\">old,</span> and <span class=\"wl wl-kjv\" data-code=\"H7794\">ox,</span> and <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the sword.","22":"But <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that had spied <span class=\"wl wl-kjv\" data-code=\"H7270\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Go</span> into the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and bring <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> thence the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> and all that she hath, as ye sware","23":"And the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> that were <span class=\"wl wl-kjv\" data-code=\"H7270\">spies</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and brought <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7343\">Rahab,</span> and her <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and her <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and her <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and all that she had; and they brought <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> all her <span class=\"wl wl-kjv\" data-code=\"H4940\">kindred,</span> and <span class=\"wl wl-kjv\" data-code=\"H3240\">left</span> them <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of Israel.","24":"And they <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and all that was therein: only the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> and of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> they <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> into the <span class=\"wl wl-kjv\" data-code=\"H214\">treasury</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the LORD.","25":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">saved</span> <span class=\"wl wl-kjv\" data-code=\"H7343\">Rahab</span> the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">alive,</span> and her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and all that she had; and she <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">in</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> even unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> because she <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers,</span> which <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to spy <span class=\"wl wl-kjv\" data-code=\"H7270\">out</span> Jericho.","26":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">adjured</span> them at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> <span class=\"wl /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
