heid over de hele vergadering van Israël? En die man stierf niet alleen in zijn ongerechtigheid.", "Deut 31:25": "dat Mozes de Levieten gebood, die de ark van het verbond van de HEERE droegen:", "2 Kon 12:16": "Het geld van het schuldoffer en het geld van de zondoffers werd niet naar het huis van de HEERE gebracht; het was voor de priesters.", "Jes 27:13": "En het zal op die dag gebeuren, dat er met een grote bazuin geblazen zal worden; dan zullen zij komen die verloren dreigden te gaan in het land van Assur, en de weggejaagden in het land van Egypte; en zij zullen de HEERE aanbidden op de heilige berg te Jeruzalem.", "1 Kon 18:43": "En hij zei tegen zijn knecht: Ga nu op, en kijk uit naar de zee. Toen ging hij op, en keek uit, en zei: Er is niets. Toen zei hij: Ga weer terug, zevenmaal.", "1 Sam 2:30": "Daarom spreekt de HEERE, de God van Israël: Ik had wel duidelijk gezegd: Uw huis en het huis van uw vader zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden.", "Luk 24:49": "En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte.", "1 Kon 3:1": "En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.", "2 Sam 5:24": "En het zal gebeuren, als u het geluid van een gang hoort in de toppen van de moerbeibomen, dat u zich dan haast; want dan is de HEERE voor uw aangezicht uitgegaan, om het leger van de Filistijnen te verslaan.", "Joz 2:22": "Zij dan gingen weg, en kwamen op het gebergte, en bleven daar drie dagen, totdat de achtervolgers teruggekeerd waren; want de achtervolgers hadden hen op heel de weg gezocht, maar niet gevonden.", "2 Kon 11:18": "Daarna ging al het volk van het land naar het huis van Baäl en brak dat af; zijn altaren en zijn beelden verbraken zij helemaal; en Mattan, de priester van Baäl, sloegen zij dood voor de altaren. De priester stelde toen ambtsdragers aan over het huis van de HEERE.", "1 Sam 4:4": "Het volk zond dan naar Silo, en men bracht vandaar de ark van het verbond van de HEERE van de heerscharen, die tussen de cherubs† woont; en de twee zonen van Eli, Hofni en Pinehas, waren daar bij de ark van het verbond van God.", "1 Kon 15:15": "En hij bracht in het huis van de HEERE de geheiligde dingen van zijn vader, en zijn eigen geheiligde dingen: zilver, en goud, en vaten.", "2 Sam 12:20": "Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "Joz 5:13-15": "Vervolgens gebeurde het, toen Jozua bij Jericho was, dat hij zijn ogen opsloeg en toekeek, en zie, er stond een Man tegenover hem, Die een getrokken zwaard in Zijn hand had. En Jozua ging naar Hem toe, en zei tegen Hem: Bent U van ons, of van onze vijanden? En Hij zei: Nee, maar Ik ben de Vorst van het leger van de HEERE: Ik ben nu gekomen! Toen viel Jozua op zijn aangezicht ter aarde en aanbad, en zei tegen Hem: Wat spreekt mijn Heere tegen Zijn knecht? Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Ezra 10:8": "En ieder die niet binnen drie dagen kwam, naar de raad van de vorsten en de oudsten, al zijn bezit zou verbeurd worden; en hijzelf zou afgezonderd worden van de gemeente van de weggevoerden.", "Ps 122:1": "Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar het huis van de HEERE gaan.", "1 Joh 5:21": "Kinderen, bewaar uzelf voor de afgoden. Amen.", "1 Sam 15:18": "En de HEERE heeft u op weg gezonden, en gezegd: Ga heen en verban de zondaars, de Amalekieten, en strijd tegen hen, totdat u hen vernietigt.", "1 Kor 14:8": "Want ook als de bazuin een onzeker geluid geeft, wie zal zich dan voorbereiden op de strijd?", "2 Kron 33:15": "En hij nam de vreemde goden en die gelijkenis weg uit het huis van de HEERE, alsook alle altaren die hij gebouwd had op de berg van het huis van de HEERE, en te Jeruzalem; en hij wierp ze buiten de stad.", "Deut 20:13-18": "En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard; Behalve de vrouwen, en de kinderen, en de dieren, en al wat in de stad zijn zal, alle buit ervan zult u voor uzelf roven; en u zult eten van de buit van uw vijanden, die de HEERE, uw God, u gegeven heeft. Zo zult u aan alle steden doen die zeer ver van u zijn, die niet zijn van de steden van deze volken.", "2 Kron 26:21": "Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land.", "Joz 2:7": "Die mannen dan achtervolgden hen op de weg naar de Jordaan, tot aan de doorwaadbare plaatsen; en men sloot de poort dicht, nadat zij naar buiten gegaan waren die hen achtervolgden.", "Jer 29:26": "De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.", "Jes 2:2": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien.", "1 Kon 7:40": "Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:", "Joz 6:22-25": "Jozua nu zei tegen de twee mannen, de verspieders van het land: Gaat in het huis van de vrouw, de hoer, en brengt die vrouw vandaar uit, met alles wat zij heeft, zoals u haar gezworen hebt. Toen gingen de jongelingen, de verspieders, daarin en brachten Rachab eruit, en haar vader, en haar moeder, en haar broeders, en alles wat zij had; ook brachten zij al haar huisgezinnen uit, en zij stelden hen buiten het leger van Israël. De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.", "Deut 2:33": "En de HEERE, onze God, gaf hem aan ons over; en wij versloegen hem, en zijn zonen, en al zijn volk.", "2 Kon 11:15": "Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.", "2 Kron 20:23": "Want de kinderen van Ammon en Moab stonden op tegen de inwoners van het gebergte Seir, om hen met de ban te treffen en te vernietigen; en toen zij een einde gemaakt hadden aan de inwoners van Seir, hielpen zij elkaar in het verderf.", "1 Kon 10:5": "en het voedsel van zijn tafel, en het zitten van zijn knechten, en het staan van zijn dienaren, en hun kleding, en zijn schenkers, en zijn opgang waarlangs hij naar boven ging in het huis van de HEERE, toen was er in haar geen geest meer.", "Richt 7:7": "En de HEERE zei tegen Gideon: Door deze driehonderd mannen die gelekt hebben, zal Ik u verlossen, en de Midianieten in uw hand geven; laat daarom al het andere volk weggaan, ieder naar zijn eigen plaats.", "Richt 7:8": "En het volk nam de teerkost in hun hand, en hun bazuinen; en hij liet alle andere mannen van Israël gaan, ieder naar zijn tent, maar die driehonderd man hield hij bij zich. En het leger van de Midianieten lag beneden hem in het dal.", "Joz 2:9": "En zij sprak tot die mannen: Ik weet dat de HEERE u dit land gegeven heeft, en dat de schrik voor u op ons gevallen is, en dat alle inwoners van dit land voor u vergaan zijn van angst.", "Joz 8:1": "Toen zei de HEERE tegen Jozua: Wees niet bang, en wees niet ontmoedigd; neem al het krijgsvolk met u mee, en maak u klaar, trek op naar Ai; zie, Ik heb de koning van Ai, en zijn volk, en zijn stad, en zijn land in uw hand gegeven.", "Jes 25:12": "En Hij zal de hoge vesten van uw muren buigen, vernederen, ja, Hij zal ze tot de aarde toe, tot het stof toe, doen reiken.", "Matt 25:40": "En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.", "Matt 1:5": "en Salmon verwekte Boaz bij Rachab, en Boaz verwekte Obed bij Ruth, en Obed verwekte Isaï;", "Zach 4:2": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie, en zie, een geheel gouden kandelaar, en een oliekruikje boven op zijn hoofd, en zijn zeven lampen daarop; die lampen hadden zeven en zeven pijpen, die boven op zijn hoofd waren;", "1 Kron 26:28": "Ook alles wat Samuël, de ziener, geheiligd had, en Saul, de zoon van Kis, en Abner, de zoon van Ner, en Joab, de zoon van Zeruja; al wat iemand geheiligd had, was onder de hand van Selomith en zijn broers.", "Joz 7:11": "Israël heeft gezondigd; en zij hebben ook Mijn verbond, dat Ik hun geboden had, overtreden; en ook hebben zij van het verbannene genomen, en ook gestolen, en ook gelogen, en hebben het ook onder hun eigen spullen gelegd.", "Lev 19:24": "Maar in het vierde jaar zal al zijn vrucht een heilig ding zijn, tot lofzegging voor de HEERE.", "2 Kon 11:3": "En hij was met haar verborgen in het huis van de HEERE, zes jaar; en Athalia regeerde over het land.", "Joz 6:4-20": "En zeven priesters zullen zeven ramsbazuinen dragen, voor de ark; en u zult op de zevende dag de stad zevenmaal omgaan; en de priesters zullen met de bazuinen blazen. En het zal gebeuren, als men langzaam op de ramshoorn blaast, als u het geluid van de bazuin hoort, dan zal heel het volk juichen met een groot gejuich; dan zal de stadsmuur onder zich vallen, en het volk zal daarin klimmen, ieder tegenover zich. Toen riep Jozua, de zoon van Nun, de priesters, en zei tegen hen: Draagt de ark van het verbond, en laat zeven priesters zeven ramsbazuinen dragen, voor de ark van de HEERE.", "Ps 134:1": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!", "Ef 2:12": "dat u in die tijd was zonder Christus, vervreemd van het burgerschap van Israël, en vreemdelingen van de verbonden van de belofte, geen hoop hebbend, en zonder God in de wereld.", "Joz 9:1": "En het gebeurde, toen alle koningen die aan deze kant van de Jordaan waren dit hoorden, op het gebergte, en in de laagte, en aan alle havens van de grote zee, tegenover de Libanon: de Hethieten, en de Amorieten, de Kanaänieten, de Ferezieten, de Hevieten, en de Jebusieten;", "Gen 39:2": "En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, de Egyptenaar.", "Hand 10:28": "En hij zei tegen hen: U weet hoe het een Joodse man niet toegestaan is zich aan te sluiten bij of naar een vreemde toe te gaan; maar God heeft mij getoond dat ik geen mens gewoon of onrein zou noemen.", "Joz 9:9": "Zij nu zeiden tegen hem: Uw knechten zijn uit een zeer ver land gekomen, om de Naam van de HEERE, uw God; want wij hebben van Hem horen spreken, en alles wat Hij in Egypte gedaan heeft;", "Joh 2:5-8": "Zijn moeder zei tegen de dienaars: Wat Hij u ook zal zeggen, doe dat. En daar stonden zes stenen watervaten, volgens het reinigingsgebruik van de Joden, elk met een inhoud van twee of drie metreten. Jezus zei tegen hen: Vul de watervaten met water. En zij vulden ze tot boven toe.", "Ex 25:14": "En steek de handbomen in de ringen die aan de zijde van de ark zijn, zodat men de ark daarmee draagt.", "Num 10:25": "Toen trok de banier van het leger van de kinderen van Dan op, als achterhoede van al de legers, naar hun legers; en over zijn leger was Ahiëzer, de zoon van Ammisaddai.", "2 Kron 8:5": "Ook bouwde hij het hoge Beth-Horon en het lage Beth-Horon, vaste steden met muren, deuren en grendels;", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "1 Sam 15:6": "En Saul liet de Kenieten zeggen: Ga weg, wijk, trek weg uit het midden van de Amalekieten, opdat ik u niet met hen wegruim; want u hebt barmhartigheid gedaan aan al de kinderen van Israël, toen zij uit Egypte optrokken. Zo weken de Kenieten uit het midden van de Amalekieten.", "Ex 17:14-16": "Toen zei de HEERE tegen Mozes: Schrijf dit ter gedachtenis in een boek, en prent het in de oren van Jozua, dat Ik de gedachtenis van Amalek geheel zal uitwissen van onder de hemel. En Mozes bouwde een altaar; en hij noemde het: De HEERE is mijn Banier! En hij zei: Omdat de hand op de troon van de HEERE is, zal er oorlog van de HEERE tegen Amalek zijn, van geslacht tot geslacht!", "2 Kon 17:4": "Maar de koning van Assyrië ontdekte een samenzwering bij Hosea, doordat hij boden gezonden had naar So, de koning van Egypte, en het geschenk aan de koning van Assyrië niet meer, zoals voorheen, van jaar tot jaar bracht; daarom sloot de koning van Assyrië hem op en bond hem vast in de gevangenis.", "2 Kon 24:13": "En hij bracht van daar al de schatten van het huis van de HEERE, en de schatten van het huis van de koning; en hij hakte alle gouden vaten stuk die Salomo, de koning van Israël, in de tempel van de HEERE gemaakt had, zoals de HEERE gesproken had.", "Joz 2:12-14": "Nu dan, zweer mij toch bij de HEERE, omdat ik goedheid aan u bewezen heb, dat u ook goedheid zult bewijzen aan het huis van mijn vader, en geef mij een betrouwbaar teken, Dat u mijn vader en mijn moeder in leven zult laten, ook mijn broers en mijn zussen, met alles wat zij hebben; en dat u onze levens van de dood zult redden. Toen zeiden die mannen tegen haar: Ons leven voor het uwe, als u deze zaak van ons niet verraadt; het zal dan gebeuren, wanneer de HEERE ons dit land geeft, dat wij aan u goedheid en trouw zullen bewijzen.", "Joz 2:17-20": "Ook zeiden die mannen tegen haar: Wij zullen vrij zijn van deze eed die u ons hebt laten zweren; Kijk, wanneer wij in het land komen, zult u dit snoer van scharlaken draad aan het venster binden, waardoor u ons zult hebben neergelaten; en u zult uw vader, uw moeder, uw broers en het hele huisgezin van uw vader bij u in huis verzamelen. Dan zal het gebeuren: iedereen die door de deuren van uw huis naar buiten gaat, diens bloed komt op zijn eigen hoofd, en wij zullen vrij zijn; maar iedereen die bij u in huis zal zijn, diens bloed komt op ons hoofd, als er een hand tegen hem zal zijn.", "Joz 2:4-6": "Maar die vrouw had die beide mannen genomen, en zij had hen verborgen; en zei: Er zijn mannen naar mij toe gekomen, maar ik wist niet waar zij vandaan waren. En het gebeurde, toen men de poort zou sluiten, toen het donker was, dat die mannen naar buiten gingen; ik weet niet waarheen die mannen gegaan zijn; jaag hen snel na, want u zult ze inhalen. Maar zij had hen op het dak laten klimmen, en zij had hen verstopt onder de vlasstoppels, die zij op het dak had klaargelegd.", "Pred 9:18": "De wijsheid is beter dan oorlogswapens, maar één zondaar verderft veel goeds.", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Matt 10:42": "En wie een van deze kleinen slechts een beker koud water te drinken geeft, in de naam van een discipel, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "1 Kon 14:26": "En hij nam de schatten van het huis van de HEERE, en de schatten van het huis van de koning weg, ja, hij nam alles weg; hij nam ook al de gouden schilden weg die Salomo gemaakt had.", "Deut 7:3": "U zult zich ook niet met hen verzwageren; uw dochters zult u niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen.", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "1 Kon 22:16": "En de koning zei tegen hem: Tot hoeveel keer zal ik u bezweren, dat u tegen mij niet anders spreekt dan de waarheid, in de Naam van de HEERE?", "1 Sam 4:5": "En het gebeurde, toen de ark van het verbond van de HEERE in het leger kwam, dat heel Israël juichte met een groot gejuich, zodat de aarde dreunde.", "Jer 38:14": "Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij.", "Joz 2:1-24": "Jozua, de zoon van Nun, had twee mannen die stiekem zouden verspieden, gestuurd vanuit Sittim, en hij zei: Ga op weg, bekijk het land en Jericho. Zij dan gingen op weg en kwamen bij het huis van een vrouw, een hoer, wier naam was Rachab, en zij sliepen daar. Toen werd aan de koning in Jericho gemeld: Kijk, in deze nacht zijn hier mannen gekomen van de kinderen van Israël, om dit land te doorzoeken. Daarom stuurde de koning van Jericho mensen naar Rachab, en zei: Breng de mannen naar buiten die naar u toe gekomen zijn, die bij u in huis gekomen zijn; want zij zijn gekomen om het hele land te doorzoeken.", "Matt 14:1": "In diezelfde tijd hoorde Herodes, de viervorst, het gerucht van Jezus;", "Joz 6:2-20": "Toen zei de HEERE tegen Jozua: Zie, Ik heb Jericho met haar koning en strijdbare helden in uw hand gegeven. U dan allen, die krijgslieden bent, zult rondom de stad gaan, de stad omringend eenmaal; zo zult u doen, zes dagen lang. En zeven priesters zullen zeven ramsbazuinen dragen, voor de ark; en u zult op de zevende dag de stad zevenmaal omgaan; en de priesters zullen met de bazuinen blazen.", "1 Kron 2:7": "En de kinderen van Charmi waren Achan, de beroerder van Israël, die zich aan het verbannene vergreep.", "Num 31:2": "Neem wraak voor de kinderen van Israël op de Midianieten; daarna zult u verzameld worden tot uw volken.", "Joz 10:2-40": "Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei: Kom op tot mij, en help mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen van Israël.", "Deut 3:5": "Al die steden waren met hoge muren, poorten en grendels versterkt, behalve heel veel onbemuurde steden.", "Micha 4:13": "Maak u op en dors, dochter van Sion! Want Ik zal uw hoorn ijzer maken, en uw hoeven koper maken, en u zult veel volken verpletteren; en Ik zal hun winst aan de HEERE toewijden, en hun bezit aan de Heere van de hele aarde.", "1 Kon 7:51": "Zo werd al het werk voltooid dat koning Salomo voor het huis van de HEERE maakte. Daarna bracht Salomo de geheiligde dingen van zijn vader David: het zilver, het goud, en de voorwerpen legde hij bij de schatten van het huis van de HEERE.", "Richt 19:18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "Joz 6:17-25": "Doch deze stad zal de HEERE verbannen zijn, zij en al wat daarin is; alleen zal de hoer Rachab levend blijven, zij en allen die met haar in het huis zijn, omdat zij de boden, die wij uitgezonden hadden, verborgen heeft. Alleen dat u zich wacht voor het verbannene, opdat u zich niet misschien verbant, door van het verbannene te nemen, en het leger van Israël niet tot een ban stelt, noch dat verstoort. Maar al het zilver en goud, en de koperen en ijzeren voorwerpen, zullen de HEERE heilig zijn; naar de schat van de HEERE zullen zij komen.", "Num 21:2": "Toen beloofde Israël de HEERE een gelofte en zei: Als U dit volk geheel in mijn hand geeft, zal ik hun steden verbannen.", "Joz 1:1-9": "Het gebeurde nu, na de dood van Mozes, de knecht van de HEERE, dat de HEERE tegen Jozua, de zoon van Nun, de dienaar van Mozes, sprak en zei: Mijn knecht Mozes is gestorven; maak u nu op, trek deze Jordaan over, u en al dit volk, naar het land dat Ik hun, de kinderen van Israël, geef. Elke plaats waarop uw voetzool treden zal, heb Ik u gegeven, zoals Ik tegen Mozes gesproken heb.", "Num 5:2": "Gebied de kinderen van Israël dat zij uit het leger wegzenden alle melaatsen, en alle vloeiende, en allen die onrein zijn van een dode.", "2 Kron 34:15": "En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.", "Joh 6:11": "En Jezus nam de broden, en nadat Hij gedankt had, deelde Hij ze uit aan de discipelen, en de discipelen aan hen die neergezeten waren; evenzo ook van de visjes, zoveel als zij wilden.", "2 Kon 20:8": "Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?", "2 Kon 11:19": "En hij nam de leiders van honderd, en de hoofdmannen, en de lijfwacht, en al het volk van het land; en zij brachten de koning af uit het huis van de HEERE, en kwamen door de weg van de poort van de lijfwacht naar het huis van de koning, en hij zat op de troon der koningen.", "Deut 13:17": "Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "2 Kron 13:12": "Zie daarom, God is met ons aan het hoofd, en Zijn priesters met de trompetten van het geschal, om alarm tegen u te laten klinken; o kinderen van Israël, strijd niet tegen de HEERE, de God van uw vaderen, want u zult geen voorspoed hebben.", "Deut 20:16": "Maar van de steden van deze volken, die de HEERE, uw God, u als erfdeel geeft, zult u niets laten leven dat adem heeft.", "Matt 27:6": "En de overpriesters namen de zilverstukken en zeiden: Het is niet toegestaan die in de offerkist te leggen, omdat het een prijs van bloed is.", "Jes 30:25": "En er zullen op elke hoge berg, en op elke hoge heuvel, beekjes en watervlieten zijn, op de dag van de grote slachting, wanneer de torens vallen zullen."}, "noten": {"1": "D.i. onherroepelijk aan de HEERE gewijd om vernietigd te worden."}, "koppeling": {"1": "(<span class=\"wl\" data-l=\"L1\" data-code=\"H3405\">Jericho</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5462\">sloot</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5462\">nu</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5462\">de</span> poorten stevig, <span class=\"wl\" data-l=\"L2\" data-code=\"H5462\">en</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5462\">was</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5462\">gesloten</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H5462\">voor</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6440\">het</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6440\">aangezicht</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6440\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H112 v": {"1": "Now <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho</span> was <span class=\"wl wl-kjv\" data-code=\"H5462\">straitly</span> shut <span class=\"wl wl-kjv\" data-code=\"H5462\">up</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> none went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and none came in.", "2": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">See,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> thereof, and the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> of valour.", "3": "And ye shall <span class=\"wl wl-kjv\" data-code=\"H5437\">compass</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> all ye <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> and go round <span class=\"wl wl-kjv\" data-code=\"H5362\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">once.</span> Thus shalt thou <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> days.", "4": "And <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</ ">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets</span> of rams' <span class=\"wl wl-kjv\" data-code=\"H3104\">horns</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> with the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets:</span> and the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">followed</span> them.", "9": "And the <span class=\"wl wl-kjv\" data-code=\"H2502\">armed</span> men <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> that <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> with the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets,</span> and the <span class=\"wl wl-kjv\" data-code=\"H622\">rereward</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">came</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark,</span> the priests going <span class=\"wl wl-kjv\" data-code=\"H1980\">on,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">blowing</span> with the trumpets.", "10": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye shall not <span class=\"wl wl-kjv\" data-code=\"H7321\">shout,</span> nor make any <span class=\"wl wl-kjv\" data-code=\"H8085\">noise</span> with your <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> neither shall any <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">proceed</span> out of your <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> until the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> I <span class=\"wl wl-kjv\" data-code=\"H559\">bid</span> you <span class=\"wl wl-kjv\" data-code=\"H7321\">shout;</span> then shall ye shout.", "11": "So the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> going <span class=\"wl wl-kjv\" data-code=\"H5362\">about</span> it <span class=\"wl wl-kjv\" data-code=\"H6471\">once:</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> and <span class=\"wl wl-kjv\" data-code=\"H3885\">lodged</span> in the camp.", "12": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> rose <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> took <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the LORD.", "13": "And <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">bearing</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets</span> of rams' <span class=\"wl wl-kjv\" data-code=\"H3104\">horns</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> went <span class=\"wl wl-kjv\" data-code=\"H1980\">on</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">continually,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> with the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets:</span> and the armed <span class=\"wl wl-kjv\" data-code=\"H2502\">men</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them; but the <span class=\"wl wl-kjv\" data-code=\"H622\">rereward</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">came</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the priests going <span class=\"wl wl-kjv\" data-code=\"H1980\">on,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">blowing</span> with the trumpets.", "14": "And the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> they <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">once,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> into the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp:</span> so they <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> days.", "15": "And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that they rose <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> about the <span class=\"wl wl-kjv\" data-code=\"H5927\">dawning</span> of the <span class=\"wl wl-kjv\" data-code=\"H7837\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> after the same <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times:</span> only on that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> they <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> times.", "16": "And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">time,</span> when the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> with the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets,</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H7321\">Shout;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you the city.", "17": "And the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2764\">accursed,</span> even it, and all that are therein, to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> only <span class=\"wl wl-kjv\" data-code=\"H7343\">Rahab</span> the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> shall <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> she and all that are with her in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> because she <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> that we sent.", "18": "And ye, in any <span class=\"wl wl-kjv\" data-code=\"H7535\">wise</span> <span c great</span> <span class=\"wl wl-kjv\" data-code=\"H8643\">shout,</span> that the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> fell down <span class=\"wl wl-kjv\" data-code=\"H5307\">flat,</span> so that the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> straight before him, and they <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> the city.", "21": "And they utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed</span> all that was in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> both <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> <span class=\"wl wl-kjv\" data-code=\"H5288\">young</span> and <span class=\"wl wl-kjv\" data-code=\"H2205\">old,</span> and <span class=\"wl wl-kjv\" data-code=\"H7794\">ox,</span> and <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the sword.", "22": "But <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that had spied <span class=\"wl wl-kjv\" data-code=\"H7270\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Go</span> into the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and bring <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> thence the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> and all that she hath, as ye sware", "23": "And the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> that were <span class=\"wl wl-kjv\" data-code=\"H7270\">spies</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and brought <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7343\">Rahab,</span> and her <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and her <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and her <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and all that she had; and they brought <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> all her <span class=\"wl wl-kjv\" data-code=\"H4940\">kindred,</span> and <span class=\"wl wl-kjv\" data-code=\"H3240\">left</span> them <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of Israel.", "24": "And they <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and all that was therein: only the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> and of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> they <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> into the <span class=\"wl wl-kjv\" data-code=\"H214\">treasury</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the LORD.", "25": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">saved</span> <span class=\"wl wl-kjv\" data-code=\"H7343\">Rahab</span> the <span class=\"wl wl-kjv\" data-code=\"H2181\">harlot</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">alive,</span> and her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and all that she had; and she <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">in</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> even unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> because she <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers,</span> which <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to spy <span class=\"wl wl-kjv\" data-code=\"H7270\">out</span> Jericho.", "26": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">adjured</span> them at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> be the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that riseth <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">buildeth</span> this <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho:</span> he shall lay the <span class=\"wl wl-kjv\" data-code=\"H3245\">foundation</span> thereof in his <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> and in his <span class=\"wl wl-kjv\" data-code=\"H6810\">youngest</span> son shall he set <span class=\"wl wl-kjv\" data-code=\"H5324\">up</span> the gates", "27": "So the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was with <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua;</span> and his <span class=\"wl wl-kjv\" data-code=\"H8089\">fame</span> was noised throughout all the country."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Matthew Henry-verklaring']],
  ['Geloofsbelijdenissen', ['1689 Baptist Confession', 'Westminster Confession']],
  ['Boeken', ['Institutie — Calvijn', 'A Body of Divinity — Watson']],
  ['Preken', ['Spurgeon']],
  ['Devotionals', ['Spurgeon']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
