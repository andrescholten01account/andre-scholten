","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En het gebeurde, toen alle koningen van de Amorieten, die aan deze zijde van de Jordaan naar het westen woonden, en alle koningen van de Kanaänieten, die aan de zee woonden, hoorden dat de HEERE de wateren van de Jordaan had uitgedroogd voor de kinderen van Israël, totdat wij daardoor gegaan waren, dat hun hart versmolt, en er was geen moed meer in hen, vanwege de kinderen van Israël.","2":"In die tijd zei de HEERE tegen Jozua: Maak u stenen messen, en besnijd de kinderen van Israël opnieuw, voor de tweede keer.","3":"Toen maakte Jozua zich stenen messen, en besneed de kinderen van Israël op de heuvel van de voorhuiden.","4":"Dit nu was de oorzaak waarom Jozua hen besneed: al het volk dat uit Egypte getrokken was, de manspersonen, alle krijgslieden, waren gestorven in de woestijn, op de weg, nadat zij uit Egypte getrokken waren.","5":"Want al het volk dat eruit trok, was besneden; maar al het volk dat geboren was in de woestijn op de weg, nadat zij uit Egypte getrokken waren, hadden zij niet besneden.","6":"Want de kinderen van Israël wandelden veertig jaar in de woestijn, totdat heel het volk van de krijgslieden die uit Egypte getrokken waren, verdwenen was; zij waren de stem van de HEERE niet gehoorzaam geweest, aan wie de HEERE gezworen had dat Hij hen het land niet zou laten zien, dat de HEERE hun vaderen gezworen had ons te zullen geven, een land dat overvloeit van melk en honing.","7":"Maar hun zonen heeft Hij in hun plaats gesteld; die heeft Jozua besneden, omdat zij de voorhuid hadden; want men had hen op de weg niet besneden.","8":"En het gebeurde, toen men een einde gemaakt had met het besnijden van al dat volk, dat zij op hun plaats in het leger bleven, totdat zij genezen waren.","9":"Verder zei de HEERE tegen Jozua: Vandaag heb Ik de smaad van Egypte van u afgewenteld; daarom noemde men de naam van die plaats Gilgal, tot op deze dag.","10":"Terwijl de kinderen van Israël te Gilgal gelegerd lagen, hielden zij het pascha op de veertiende dag van die maand, in de avond, op de vlakke velden van Jericho.","11":"En zij aten van het overjarige koren van het land, de dag na het pascha, ongezuurde broden en gebrande aren, op diezelfde dag.","12":"En het manna hield op de dag na deze, nadat zij van het overjarige koren van het land gegeten hadden; en de kinderen van Israël hadden geen manna meer, maar zij aten in dat jaar van de opbrengst van het land Kanaän.","13":"Vervolgens gebeurde het, toen Jozua bij Jericho was, dat hij zijn ogen opsloeg en toekeek, en zie, er stond een Man tegenover hem, Die een getrokken zwaard in Zijn hand had. En Jozua ging naar Hem toe, en zei tegen Hem: Bent U van ons, of van onze vijanden?","14":"En Hij zei: Nee, maar Ik ben de Vorst van het leger van de HEERE: Ik ben nu gekomen! Toen viel Jozua op zijn aangezicht ter aarde en aanbad, en zei tegen Hem: Wat spreekt mijn Heere tegen Zijn knecht?","15":"Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo."},"SV":{"1":"En het geschiedde, toen al de koningen der Amorieten, die aan deze zijde van de Jordaan westwaarts, en al de koningen der Kanaänieten, die aan de zee *waren*, hoorden, dat de HEERE de wateren van de Jordaan had uitgedroogd, voor het aangezicht der kinderen Israëls, totdat wij daardoor gegaan waren; zo versmolt hun hart, en er was geen moed meer in hen, voor het aangezicht der kinderen Israëls.","2":"Te dier tijd sprak de HEERE tot Jozua: Maak u stenen messen, en besnijd wederom de kinderen Israëls ten tweeden maal.","3":"Toen maakte zich Jozua stenen messen, en besneed de kinderen Israëls op den heuvel der voorhuiden.","4":"Dit nu was de oorzaak, waarom hen Jozua besneed: al het volk, dat uit Egypte getogen was, de manspersonen, alle krijgslieden, waren gestorven in de woestijn, op den weg, nadat zij uit Egypte getogen waren.","5":"Want al het volk, dat er uittoog, was besneden; maar al het volk, dat geboren was in de woestijn op den weg, nadat zij uit Egypte getrokken waren, hadden zij niet besneden.","6":"Want de kinderen Israëls wandelden veertig jaren in de woestijn, totdat vergaan was het ganse volk der krijgslieden, die uit Egypte gegaan waren; die de stem des HEEREN niet gehoorzaam geweest waren, denwelken de HEERE gezworen had, dat Hij hun niet zoude laten zien het land, hetwelk de HEERE hun vaderen gezworen had ons te zullen geven, een land vloeiende van melk en honig.","7":"Maar hun zonen heeft Hij aan hun plaats gesteld; die heeft Jozua besneden, omdat zij de voorhuid hadden; want zij hadden hen op den weg niet besneden.","8":"En het geschiedde, als men een einde gemaakt had van al dat volk te besnijden, zo bleven zij in hun plaats in het leger, totdat zij genezen waren.","9":"Verder sprak de HEERE tot Jozua: Heden heb Ik den smaad van Egypte van ulieden afgewenteld; daarom noemde men den naam dier plaats Gilgal, tot op dezen dag.","10":"Terwijl de kinderen Israëls te Gilgal gelegerd lagen, zo hielden zij het pascha op den veertienden dag derzelver maand, in den avond, op de vlakke velden van Jericho.","11":"En zij aten van het overjarige koren des lands, des anderen daags van het pascha, ongezuurde broden en verzengde aren, even op dienzelven dag.","12":"En het Manna hield op des anderen daags, nadat zij van des lands overjarige koren gegeten hadden; en de kinderen Israëls hadden geen Manna meer, maar zij aten in hetzelve jaar van de inkomst des lands Kanaän.","13":"Voorts geschiedde het, als Jozua bij Jericho was, dat hij zijn ogen ophief, en zag toe, en ziet, er stond een Man tegenover hem, Die een uitgetogen zwaard in Zijn hand had. En Jozua ging tot Hem, en zeide tot Hem: Zijt Gij van ons, of van onze vijanden?","14":"En Hij zeide: Neen, maar Ik ben de Vorst van het heir des HEEREN: Ik ben nu gekomen! Toen viel Jozua op zijn aangezicht ter aarde en aanbad, en zeide tot Hem: Wat spreekt mijn Heere tot Zijn knecht?","15":"Toen zeide de Vorst van het heir des HEEREN tot Jozua: Trek uw schoenen af van uw voeten; want de plaats, waarop gij staat, is heilig. En Jozua deed alzo."},"KJV":{"1":"And it came to pass, when all the kings of the Amorites, which *were* on the side of Jordan westward, and all the kings of the Canaanites, which *were* by the sea, heard that the LORD had dried up the waters of Jordan from before the children of Israel, until we were passed over, that their heart melted, neither was there spirit in them any more, because of the children of Israel.","2":"At that time the LORD said unto Joshua, Make thee sharp knives, and circumcise again the children of Israel the second time.","3":"And Joshua made him sharp knives, and circumcised the children of Israel at the hill of the foreskins.","4":"And this *is* the cause why Joshua did circumcise: All the people that came out of Egypt, *that were* males, *even* all the men of war, died in the wilderness by the way, after they came out of Egypt.","5":"Now all the people that came out were circumcised: but all the people *that were* born in the wilderness by the way as they came forth out of Egypt, *them* they had not circumcised.","6":"For the children of Israel walked forty years in the wilderness, till all the people *that were* men of war, which came out of Egypt, were consumed, because they obeyed not the voice of the LORD: unto whom the LORD sware that he would not shew them the land, which the LORD sware unto their fathers that he would give us, a land that floweth with milk and honey.","7":"And their children, *whom* he raised up in their stead, them Joshua circumcised: for they were uncircumcised, because they had not circumcised them by the way.","8":"And it came to pass, when they had done circumcising all the people, that they abode in their places in the camp, till they were whole.","9":"And the LORD said unto Joshua, This day have I rolled away the reproach of Egypt from off you. Wherefore the name of the place is called Gilgal unto this day.","10":"And the children of Israel encamped in Gilgal, and kept the passover on the fourteenth day of the month at even in the plains of Jericho.","11":"And they did eat of the old corn of the land on the morrow after the passover, unleavened cakes, and parched *corn* in the selfsame day.","12":"And the manna ceased on the morrow after they had eaten of the old corn of the land; neither had the children of Israel manna any more; but they did eat of the fruit of the land of Canaan that year.","13":"And it came to pass, when Joshua was by Jericho, that he lifted up his eyes and looked, and, behold, there stood a man over against him with his sword drawn in his hand: and Joshua went unto him, and said unto him, *Art* thou for us, or for our adversaries?","14":"And he said, Nay; but *as* captain of the host of the LORD am I now come. And Joshua fell on his face to the earth, and did worship, and said unto him, What saith my lord unto his servant?","15":"And the captain of the LORD'S host said unto Joshua, Loose thy shoe from off thy foot; for the place whereon thou standest *is* holy. And Joshua did"}},"tsk":{"1":[{"kopje":"alle koningen","refs":["Joz 12:9-24","Joz 24:15","Gen 10:15-19","Gen 15:18-21","Gen 48:22","Richt 11:23","2 Sam 21:2","Ezech 16:3","Amos 2:9"]},{"kopje":"Kanaänieten","refs":["Joz 17:12","Joz 17:18","Gen 12:6","Ex 23:28","Richt 1:1","Richt 4:2","Ezra 9:1","Ps 135:11"]},{"kopje":"die aan de zee woonden","refs":["Num 13:29","Richt 3:3","Zef 2:4-6"]},{"kopje":"hoorden","refs":["Joz 2:9-11","Ex 15:14","Ex 15:15","Ps 48:5-7","Openb 18:10"]},{"kopje":"en er was geen","refs":["1 Sam 25:37","1 Kon 10:5","Jes 13:6-8","Ezech 21:7","Dan 5:6"]}],"2":[{"kopje":"besnijd","refs":["Gen 17:10-14","Deut 10:16","Deut 30:6","Rom 2:29","Rom 4:11","Kol 2:11"]}],"3":[{"kopje":"Jozua","refs":["Gen 17:23-27","Matt 16:24"]}],"4":[{"kopje":"al het volk","refs":["Num 14:22","Num 26:64","Num 26:65","Deut 2:16","1 Kor 10:5","Hebr 3:17-19"]}],"5":[{"kopje":"hadden zij niet","refs":["Deut 12:8","Deut 12:9","Hos 6:6","Hos 6:7","Matt 12:7","Rom 2:26","1 Kor 7:19","Gal 5:6","Gal 6:15"]}],"6":[{"kopje":"wandelden","refs":["Num 14:32-34","Deut 1:3","Deut 2:7","Deut 2:14","Deut 8:4","Ps 95:10","Ps 95:11","Jer 2:2"]},{"kopje":"gezworen had","refs":["Num 14:23","Hebr 3:11"]},{"kopje":"een land","refs":["Ex 3:8","Ex 3:17","Ezech 20:6","Ezech 20:15","Joël 3:18"]}],"7":[{"kopje":"hun zonen","refs":["Num 14:31","Deut 1:39"]}],"8":[{"kopje":"totdat zij genezen waren","refs":["Gen 34:25"]}],"9":[{"kopje":"heb Ik afgewenteld","refs":["Joz 24:14","Gen 34:14","Lev 24:14","1 Sam 14:6","1 Sam 17:26","1 Sam 17:36","Ps 119:39","Jer 9:25","Ezech 20:7","Ezech 20:8","Ezech 23:3","Ezech 23:8","Ef 2:11","Ef 2:12"]},{"kopje":"Gilgal","refs":["Joz 4:19"]}],"10":[ ata-code=\"H5414\">give</span> us, a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that <span class=\"wl wl-kjv\" data-code=\"H2100\">floweth</span> with <span class=\"wl wl-kjv\" data-code=\"H2461\">milk</span> and honey.","7":"And their <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> whom he raised <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> in their stead, them <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H4135\">circumcised:</span> for they were <span class=\"wl wl-kjv\" data-code=\"H6189\">uncircumcised,</span> because they had not <span class=\"wl wl-kjv\" data-code=\"H4135\">circumcised</span> them by the way.","8":"And it came to pass, when they had <span class=\"wl wl-kjv\" data-code=\"H8552\">done</span> <span class=\"wl wl-kjv\" data-code=\"H4135\">circumcising</span> all the <span class=\"wl wl-kjv\" data-code=\"H1471\">people,</span> that they <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> in their places in the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> till they were whole.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> This <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> have I rolled <span class=\"wl wl-kjv\" data-code=\"H1556\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> from off you. Wherefore the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> is <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal</span> unto this day.","10":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Isra -kjv\" data-code=\"H3667\">Canaan</span> that year.","13":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> was by <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho,</span> that he lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and, behold, there <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> over against him with his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H8025\">drawn</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Art thou for us, or for our adversaries?","14":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Nay; but as <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> am I now <span class=\"wl wl-kjv\" data-code=\"H935\">come.</span> And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> on his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and did <span class=\"wl wl-kjv\" data-code=\"H7812\">worship,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, What <span class=\"wl wl-kjv\" data-code=\"H1696\">saith</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> unto his servant?","15":"And the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> <span class=\"wl wl-kjv\" data-code=\"H5394\">Loose</span> thy <span class=\"wl wl-kjv\" data-code=\"H5275\">shoe</span> from off thy <span class=\"wl wl-kjv\" data-code=\"H7272\">foot;</span> for the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> whereon thou <span class=\"wl wl-kjv\" data-code=\"H5975\">standest</span> is <span class=\"wl wl-kjv\" data-code=\"H6944\">holy.</span> And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> did"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"westwaarts,","tekst":"Dat is, aan de westzijde wonende, in het land Kanaän."},{"catchword":"zo versmolt hun hart,","tekst":"Dat is, zij zijn versaagd geworden. Zie Jos 2:9, Jos 2:24."}],"2":[{"catchword":"stenen messen,","tekst":"Anders, scherpe messen. Hebreeuws, zwaarden, of messen van rotsen, gelijk Exo 4:25."},{"catchword":"besnijd wederom","tekst":"Hebreeuws, keer weder, besnijd; dat is, besnijd wederom; een Hebreeuwse manier van spreken. Zie Num 11:4; Psa 85:7; Eze 8:6. De besnijdenis is eerst bevolen aan Abraham en zijn zaad, en daarin gecontinueerd tot in Egypte, waar diegenen welken uit Egypte getogen zijn, ook waren besneden. Maar alzo aan diegenen, die in de woestijn geboren zijn, de besnijdenis niet was geschied, zo wordt hierdoor Gods bevel aan dezen hervat."}],"3":[{"catchword":"besneed","tekst":"Te weten, diegenen, die nog niet besneden waren, welke zij waren, die in de woestijn geboren waren."},{"catchword":"heuvel der voorhuiden","tekst":"Eenigen behouden het Hebreeuwse woord Araloth in den tekst, betekende voorhuiden, omdat de voorhuiden van de kinderen Israëls daar besneden waren."}],"5":[{"catchword":"zij niet besneden","tekst":"Te weten, de ouders. Dit is nagebleven, of door sloffigheid en onachtzaamheid; of omdat zij niet wisten wanneer zij voortreizen zouden, en het den pas-besnedenen zwaar zou gevallen hebben, ja ook gevaarlijk, voort te reizen."}],"7":[{"catchword":"Hij","tekst":"Te weten, God de Heere."}],"8":[{"catchword":"totdat zij genezen waren","tekst":"Hebreeuws, totdat zij leefden; gelijk Num 21:8."}],"9":[{"catchword":"den smaad","tekst":"Alzo noemt hij de voorhuid, die de Israëlieten aan hun kinderen gelaten hadden, hierin meer het exempel der oubesneden Egyptenaars navolgende dan het bevel Gods. Zie Jer 9:25-26. Sommigen verstaan door den smaad van Egypte, den smaad, dien de Egyptenaars God en zijn volk zouden opgelegd en nagezegd hebben, indien zij buiten het land Kanaän hadden moeten blijven. Zie Deu 9:28."},{"catchword":"van ulieden afgewenteld;","tekst":"Hebreeuws, van op ulieden; dat is, die op ulieden lag."},{"catchword":"Gilgal,","tekst":"Dat is, rolling, afwenteling; omdat door de besnijdenis de schande van de Israëlieten afgewenteld is."},{"catchword":"tot op dezen dag","tekst":"Te weten, blijft deze naam, of houdt die plaats dezen naam."}],"10":[{"catchword":"hielden zij het pascha","tekst":"Hebreeuws, maakten zij. Het houden van pasen is ook in de woestijn nagelaten geweest, uitgenomen in het tweede jaar na den uittocht, zie Num 9:1."},{"catchword":"derzelver maand,","tekst":"Te weten, op den veertienden dag der eerste maand van het jaar; gelijk blijkt Jos 4:19."}],"13":[{"catchword":"een Man","tekst":"Dit was de Heere Christus in de gedaante eens mans, gelijk af te nemen is uit Jos 6:2."},{"catchword":"uitgetogen zwaard","tekst":"Te weten, om Jozua daarmede te verkloeken, hem te kennen gevende dat Hij met hem zou zijn, en strijden tegen de Kanaänieten, en hem de victorie zou doen hebben."}],"14":[{"catchword":"Neen,","tekst":"Te weten, Ik behoor uw vijanden niet toe."},{"catchword":"de Vorst","tekst":"Te weten, Christus, die over het leger der Israëlieten, welke des Heeren volk zijn, zorg draagt."},{"catchword":"aanbad,","tekst":"Want hij kende Hem te zijn de ware God. Indien dit maar een geschapen engel geweest ware, Hij zou niet geleden ehbben dat men hem alzo zou geëerd hebben, gelijk te zien is Rev 19:10, en Rev 22:9."}],"15":[{"catchword":"Trek uw schoenen af","tekst":"Dit heeft ook God Mozes bevolen Exo 3:5. Zie ook Act 7:33."},{"catchword":"heilig","tekst":"Hebreeuws, heiligheid. Waarom was deze plaats heilig? Omdat de Heere haar door zijn bijzondere tegenwoordigheid geheiligd had. Zie Exo 3:5, en de aantekeningen aldaar."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to passe , when all the Kings of the Amorites , which (were) on this side of Jordan west-ward , [i.e. inhabiting the West part , in the land of Canaan ] and all the Kings of the Canaanites , which (were) by the Sea, heard that the LORD had dried up the waters of Jordan before the face of the children of Israel , untill we were passed it : Their heart melted , [ i.e. they fainted ; see chap. 2.9, 24.] there was no more courage in them , before the face of the children of Israel ."}],"2":[{"catchword":null,"tekst":"At that time the LORD spake unto Josua , Make thee stone knives , [ Oth. sharp knives . Heb. swords , or knives of rocks, as Exo 4:25.] and circumcise again [Heb. return circumcise ; i.e. circumcise again , an Hebrew manner of speaking , see Numb. 11. on v.4. Psal.85.7. Ezech.8.6. The circumcision was first enjoyned unto Abraham and his seed , and was afterward continued till in Egypt , where those who were come out of Egypt were also circumcised : but for as much as circumcision was not administered unto those that were born in the wildernesse , therefore the same is here again by Gods command re-assumed ] the children of Israel the second time ."}],"3":[{"catchword":null,"tekst":"Then Josua made him stone-knives , and circumcised the children of Israel , [ viz. those, who as yet were not circumcised , which were those that were born in the wildernesse ] upon the hill of the foreskins . [ some keep the Hebrew word Areloth used in the text , which signifieth foreskins , because the foreskins of the children of Israel weren there circumcised.]"}],"4":[{"catchword":null,"tekst":"Now this was the cause wherefore Josua circumcised them : all the people that went out of Egypt , the males , all the men of war , died in the wildernesse by the way , after they came out of Egypt ."}],"5":[{"catchword":null,"tekst":"For all the people that came out thence were circumcised ; but all the people that were born in the wildernesse by the way , after they came forth out of Egypt , ( them) they [ To wit, the Parents ] had not circumcised . [ this was omitted, either through negligence and heedlessenesse , or because they knew not the precise time when they were to march ; and it would be very troublesom , yea doubtless prove exceeding dangerous to those that were but newly circumcised , immediately to march upon it .]"}],"7":[{"catchword":null,"tekst":"But he [viz. the Lord God ] hath put their sons in their stead , those did Joshua circumcise , because they had the foreskin , for they had not circumcised them by the way."}],"8":[{"catchword":null,"tekst":"And it came to passe , when they had made an end of circumcising all the people , that they abode in their place in the camp, untill they were healed . [ Heb. untill they lived , as Numb.21,8.]"}],"9":[{"catchword":null,"tekst":"Moreover the LORD spake unto Josua , This day have I called away the reproach of Egypt [ So he calleth the foreskin , which the Israelites had left on their children , herein rather following the example of uncircumcised Egyptians , then the command of God . See Jer 9:25,26 . Some understand by the reproach of Egypt , the reproach, or aspersion , which the Egyptians would have cast upon God and his people , if they should have been excluded out of the land of Canaan : See Deut.9.26. ] from you : [ Heb. from upon you ; i.e. which lay upon you] therefore the name of the place was called Gilgal, [ i.e. rolling , rolling away , because by circumcision the shame or reproach of the Israelites was as it were rolled away ] unto this day . [ viz. keepeth the name , or that place beareth his name ]"}],"10":[{"catchword":null,"tekst":"While the children of Israel lay encamped at Gilgal , they kept the passeover [ Heb. they made, & c, The celebrating of the passeover was likewise in the wilderness , save in the second year after their going out of Egypt , intermitted ; see Num 9:1.] on the fourteenth day of the same moneth . [ viz. on the fourteenth day of the first moneth of the year , as appearrth, Jos. 4.19.] in the evening , on the plain fields of Jericho."}],"11":[{"catchword":null,"tekst":"And they did eat of the ladt yeare s corn of the land , the second day of the Passeover , unleavened bread , and parched eares , even the same day."}],"12":[{"catchword":null,"tekst":"And the Manna ceased the next day , after they had eaten of the last yeare s corn of the land , and the children of Israel had no more Manna , but they did eat of the revenue of the land of Canaan , the self-same year ."}],"13":[{"catchword":null,"tekst":"Moreover, it came to passe when Josua was by Jericho , that he lift up his eyes , and looked , there stood a man over against him , [ This was the Lord Christ in the shape of a man , as may be gathered from chap.6.2.] which had a drawn sword in his hand : [ viz. thereby to encourage Josua , giving him to understand , that he would be with him , and fight on his side against the Canaanites, and cause him to have the victory ] And Josua went unto him , and said , art thou ours , or our enemies?"}],"14":[{"catchword":null,"tekst":"And he said , NO, [ i.e. I belong not to your enemies ] but I am the Prince of the host of the LORD , [ viz. Christ, taking care of the camp of the Israelites, which are the Lords people ] I am now come : then Josua fell on his face to the earth , and worshipped , [ for he knew him to be the true God . If this had been but a created Angel , he would not have suffered himself to be honored thus , as may be seen , Revel. 19.20. and 22.6.] and said unto him , what speaketh my Lord unto his servant ?"}],"15":[{"catchword":null,"tekst":"Then said the Prince of the host of the LORD unto Josua , Pluck off thy shoes from thy feet , [ This God likewise commanded Moseh , Exo 3:5. see also Act. 7.33. for the place whereon thou standest , is holy : [ Heb. holinesse . Wherefore was this place holy ? because the Lord had hallowed it by his special presence . See Exo 3:5. And the annotat. there ] and Josua did so."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;

    rij.className = 'vers'; rij.id = 'v' + n;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
