ing","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren;","2":"Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk.","3":"Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:","4":"Kom op tot mij, en help mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen van Israël.","5":"Toen werden de vijf koningen van de Amorieten verzameld en trokken op, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en streden tegen haar.","6":"De mannen van Gibeon nu stuurden tot Jozua, in het leger van Gilgal, en zeiden: Trek uw handen niet terug van uw knechten, kom haastig tot ons op, en verlos ons, en help ons; want al de koningen van de Amorieten, die op het gebergte wonen, hebben zich tegen ons verzameld.","7":"Toen trok Jozua op van Gilgal, hij en al het krijgsvolk met hem, en alle strijdbare helden.","8":"Want de HEERE had tot Jozua gezegd: Vrees niet voor hen, want Ik heb ze in uw hand gegeven; niemand van hen zal voor uw aangezicht standhouden.","9":"Zo kwam Jozua snel tot hen; de hele nacht door was hij van Gilgal opgetrokken.","10":"En de HEERE bracht hen in verwarring voor het aangezicht van Israël; en hij sloeg hen met een grote slag te Gibeon, en vervolgde hen op de weg waar men naar Beth-horon opgaat, en sloeg hen tot Azeka en tot Makkeda toe.","11":"Het gebeurde nu, toen zij voor het aangezicht van Israël vluchtten, terwijl ze in de afdaling van Beth-horon waren, dat de HEERE grote stenen op hen wierp van de hemel, tot Azeka toe, zodat zij stierven; er waren er meer die van de hagelstenen stierven, dan die de kinderen van Israël met het zwaard doodden.","12":"Toen sprak Jozua tot de HEERE, op de dag toen de HEERE de Amorieten voor het aangezicht van de kinderen van Israël overgaf, en hij zei voor de ogen van de Israëlieten: Zon, sta stil te Gibeon, en u, maan, in het dal van Ajalon!","13":"En de zon stond stil, en de maan bleef staan, totdat het volk zich op zijn vijanden gewroken had. Is dit niet geschreven in het boek van de oprechten? De zon nu stond stil in het midden van de hemel, en haastte zich niet om onder te gaan, ongeveer een volle dag.","14":"En er was geen dag aan deze gelijk, ervoor of erna, dat de HEERE de stem van een man zó verhoorde; want de HEERE streed voor Israël.","15":"Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal.","16":"Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda.","17":"En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda.","18":"Toen zei Jozua: Rol grote stenen voor de opening van de grot, en zet mannen ervoor om hen te bewaken.","19":"Maar sta u zelf niet stil, jaag uw vijanden achterna, en sla hen in de achterhoede; laat hen niet in hun steden komen; want de HEERE, uw God, heeft ze in uw hand gegeven.","20":"En het gebeurde, toen Jozua en de kinderen van Israël klaar waren met hen te slaan met een zeer grote slag, totdat zij vernietigd waren, en dat de overgeblevenen, die van hen overgebleven waren, in de versterkte steden gekomen waren;","21":"Zo keerde al het volk terug tot Jozua in het leger, bij Makkeda, in vrede; niemand had zijn tong tegen de kinderen van Israël geroerd.","22":"Daarna zei Jozua: Open de mond van de grot, en breng tot mij die vijf koningen uit die grot.","23":"Zij nu deden zo, en brachten tot hem die vijf koningen uit de grot: de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon.","24":"En het gebeurde, toen zij die koningen uitgebracht hadden tot Jozua, dat Jozua al de mannen van Israël riep, en hij zei tot de aanvoerders van het krijgsvolk, die met hem opgetrokken waren: Treed toe, zet uw voeten op de nekken van deze koningen. En zij traden toe, en zetten hun voeten op hun nekken.","25":"Toen zei Jozua tot hen: Vrees niet en wees niet ontsteld, wees sterk en heb goede moed; want zo zal de HEERE aan al uw vijanden doen, tegen wie u strijdt.","26":"En Jozua sloeg hen daarna, en doodde ze, en hing ze aan vijf bomen; en zij hingen aan de bomen tot de avond.","27":"En het gebeurde, ten tijde dat de zon onderging, dat Jozua beval dat men hen van de bomen afnam, en zij wierpen hen in de grot, waar zij verborgen geweest waren; en zij legden grote stenen voor de opening van de grot, *die* *daar* *zijn* tot op deze zelfde dag.","28":"Op diezelfde dag nam Jozua ook Makkeda in, en sloeg haar met de scherpte van het zwaard; daartoe verbande hij haar koning, hen en elke ziel die daarin was; hij liet niemand overblijven; en hij deed de koning van Makkeda zoals hij de koning van Jericho gedaan had.","29":"Toen trok Jozua door, en heel Israël met hem, van Makkeda naar Libna, en hij streed tegen Libna.","30":"En de HEERE gaf haar ook in de hand van Israël, met haar koning; en hij sloeg haar met de scherpte van het zwaard, en elke ziel die daarin was; hij liet daarin niemand overblijven; en hij deed haar koning zoals hij de koning van Jericho gedaan had.","31":"Toen trok Jozua verder, en heel Israël met hem, van Libna naar Lachis; en hij belegerde haar en streed tegen haar.","32":"En de HEERE gaf Lachis in de hand van Israël; en hij nam haar in op de tweede dag, en hij sloeg haar met de scherpte van het zwaard, en elke ziel die daarin was, naar alles wat hij Libna gedaan had.","33":"Toen trok Horam, de koning van Gezer, op om Lachis te helpen; maar Jozua sloeg hem en zijn volk, totdat hij hem niemand overliet.","34":"En Jozua trok verder van Lachis naar Eglon, en heel Israël met hem; en zij belegerden haar en streden tegen haar.","35":"En zij namen haar in op diezelfde dag, en sloegen haar met de scherpte van het zwaard, en elke ziel die daarin was, verbande hij op diezelfde dag, naar alles wat hij aan Lachis gedaan had.","36":"Daarna trok Jozua op, en heel Israël met hem, van Eglon naar Hebron, en zij streden tegen haar.","37":"En zij namen haar in, en sloegen haar met de scherpte van het zwaard, zowel haar koning als al haar steden, en elke ziel die daarin was; hij liet niemand in leven overblijven, naar alles wat hij Eglon gedaan had; en hij verbande haar, en elke ziel die daarin was.","38":"Toen keerde Jozua terug, en heel Israël met hem, naar Debir, en hij streed tegen haar.","39":"En hij nam haar in, met haar koning, en al haar steden, en zij sloegen haar met de scherpte van het zwaard, en verbanden elke ziel die daarin was; hij liet niemand overblijven; zoals hij aan Hebron gedaan had, zo deed hij aan Debir en haar koning, en zoals hij aan Libna en haar koning gedaan had;","40":"Zo sloeg Jozua het hele land, het gebergte, en het zuiden, en de laagte, en de hellingen van de wateren, en al hun koningen; hij liet niemand overblijven; ja, hij verbande alles wat adem had, zoals de HEERE, de God van Israël, geboden had.","41":"En Jozua sloeg hen van Kades-Barnea tot Gaza toe; ook het hele land Gosen, en tot Gibeon toe.","42":"En Jozua nam al deze koningen en hun land in één keer in; want de HEERE, de God van Israël, streed voor Israël.","43":"Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal."},"SV":{"1":"Het geschiedde nu, toen Adoni-zedek, de koning van Jeruzalem, gehoord had, dat Jozua Ai ingenomen, en haar verbannen had, *en* aan Ai en haar koning alzo gedaan had, gelijk als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in derzelver midden waren;","2":"Zo vreesden zij zeer; want Gibeon was een grote stad, als een der koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk.","3":"Daarom zond Adoni-zedek, koning van Jeruzalem, tot Hoham, den koning van Hebron, en tot Pir-am, den koning van Jarmuth, en tot Jafia, den koning van Lachis, en tot Debir, den koning van Eglon, zeggende:","4":"Komt op tot mij, en helpt mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen Israëls.","5":"Toen werden verzameld en kwamen op, vijf koningen der Amorieten, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en krijgden tegen haar.","6":"De mannen nu van Gibeon zonden tot Jozua, in het leger van Gilgal, zeggende: Trek uw handen niet af van uw knechten, kom haastelijk tot ons op, en verlos ons, en help ons; want al de koningen der Amorieten, die op het gebergte wonen, hebben zich tegen ons vergaderd.","7":"Toen toog Jozua op van Gilgal, hij en al het krijgsvolk met hem, en alle strijdbare helden.","8":"Want de HEERE had tot Jozua gezegd: Vrees u niet voor hen, want Ik heb ze in uw hand gegeven; niemand van hen zal voor uw aangezicht bestaan.","9":"Alzo kwam Jozua snellijk tot hen; den gansen nacht over was hij van Gilgal opgetrokken.","10":"En de HEERE verschrikte hen voor het aangezicht van Israël; en hij sloeg hen met een groten slag te Gibeon, en vervolgde hen op den weg, waar men naar Beth-horon opgaat, en sloeg hen tot Azeka en tot Makkeda toe.","11":"Het geschiedde nu, toen zij voor het aangezicht van Israël vluchtten, zijnde in den afgang van Beth-horon, zo wierp de HEERE grote stenen op hen van den hemel, tot Azeka toe, dat zij stierven; daar waren er meer, die van de hagelstenen stierven, dan die die kinderen Israëls met het zwaard doodden.","12":"Toen sprak Jozua tot den HEERE, ten dage als de HEERE de Amorieten voor het aangezicht der kinderen Israëls overgaf, en zeide voor de ogen der Israëlieten: Zon, sta stil te Gibeon, en gij, maan, in het dal van Ajalon!","13":"En de zon stond stil, en de maan bleef staan, totdat zich het volk aan zijn vijanden gewroken had. Is dit niet geschreven in het boek des oprechten? De zon nu stond stil in het midden des hemels, en haastte niet onder te gaan omtrent een volkomen dag.","14":"En er was geen dag aan dezen gelijk, voor hem noch na hem, dat de HEERE de stem eens mans *alzo* verhoorde; want de HEERE streed voor Israël.","15":"Toen keerde Jozua weder, en gans Israël met hem, naar het leger te Gilgal.","16":"Maar die vijf koningen waren gevloden, en hadden zich verborgen in de spelonk bij Makkeda.","17":"En aan Jozua werd geboodschapt, mits te zeggen: Die vijf koningen zijn gevonden, verborgen in de spelonk bij Makkeda.","18":"Zo zeide Jozua: Wentelt grote stenen voor den mond der spelonk, en stelt mannen daarvoor om hen te bewaren.","19":"Maar staat gijlieden niet stil, jaagt uw vijanden achterna, en slaat hen in den staart; laat hen in hun steden niet komen; want de HEERE, uw God, heeft ze in uw hand gegeven.","20":"En het geschiedde, toen Jozua en de kinderen Israëls geëindigd hadden hen met een zeer groten slag te slaan, totdat zij vernield waren, en dat de overgeblevenen, die van hen overgebleven waren, in de vaste steden gekomen waren;","21":"Zo keerde al het volk tot Jozua in het leger, bij Makkeda, in vrede; niemand had zijn tong tegen de kinderen Israëls geroerd.","22":"Daarna zeide Jozua: Opent den mond der spelonk, en brengt tot mij uit die vijf koningen, uit die spelonk.","23":"Zij nu deden alzo, en brachten tot hem uit die vijf koningen, uit de spelonk: den koning van Jeruzalem, den koning van Hebron, den koning van Jarmuth, den koning van Lachis, den koning van Eglon.","24":"En het geschiedde, als zij die koningen uitgebracht hadden tot Jozua, zo riep Jozua, al de mannen van Israël, en hij zeide tot de oversten des krijgsvolks, die met hem getogen waren: Treedt toe, zet uw voeten op de halzen dezer koningen. En zij traden toe, en zetten hun voeten op hun halzen.","25":"Toen zeide Jozua tot hen: Vreest niet en ontzet u niet, zijt sterk en hebt goeden moed; want alzo zal de HEERE aan al uw vijanden doen, tegen dewelke gijlieden strijdt.","26":"En Jozua sloeg hen daarna, en doodde ze, en hing ze aan vijf houten; en zij hingen aan de houten tot den avond.","27":"En het geschiedde, ten tijde als de zon onderging, beval Jozua, dat men hen van de houten afname, en zij wierpen hen in de spelonk, alwaar zij verborgen geweest waren; en zij leiden grote stenen voor den mond der spelonk, *die* *daar* *zijn* tot op dezen zelven dag.","28":"Op denzelven dag nam ook Jozua Makkeda in, en sloeg haar met de scherpte des zwaards; daartoe verbande hij derzelver koning, henlieden en alle ziel die daarin was; hij liet geen overigen overblijven; en hij deed den koning van Makkeda, gelijk als hij den koning van Jericho gedaan had.","29":"Toen toog Jozua door, en gans Israël met hem, van Makkeda naar Libna, en hij krijgde tegen Libna.","30":"En de HEERE gaf dezelve ook in de hand van Israël, met haar koning; en hij sloeg haar met de scherpte des zwaards, en alle ziel, die daarin was; hij liet daarin geen overigen overblijven; en hij deed derzelver koning, gelijk als hij den koning van Jericho gedaan had.","31":"Toen toog Jozua voort, en gans Israël met hem, van Libna naar Lachis; en hij belegerde haar en krijgde tegen haar.","32":"En de HEERE gaf Lachis in de hand van Israël; en hij nam haar in op den tweeden dag, en hij sloeg haar met de scherpte des zwaards, en alle ziel, die daarin was, naar alles, wat hij Libna gedaan had.","33":"Toen trok Horam, de koning van Gezer, op, om Lachis te helpen; maar Jozua sloeg hem en zijn volk, totdat hij hem geen overigen overliet.","34":"En Jozua trok voort van Lachis naar Eglon, en gans Israël met hem; en zij belegerden haar en krijgden tegen haar.","35":"En zij namen haar in ten zelven dage, en sloegen haar met de scherpte des zwaards, en alle ziel, die daarin was, verbande hij op denzelven dag, naar alles, wat hij aan Lachis gedaan had.","36":"Daarna toog Jozua op, en gans Israël met hem; van Eglon naar Hebron, en zij krijgden tegen haar.","37":"En zij namen haar in, en sloegen haar met de scherpte des zwaards, zo haar koning als al haar steden, en alle ziel, die daarin was; hij liet niemand in het leven overblijven, naar alles, wat hij Eglon gedaan had; en hij verbande haar, en alle ziel, die daarin was.","38":"Toen keerde Jozua, en gans Israël met hem, naar Debir, en hij krijgde tegen haar.","39":"En hij nam haar in, met haar koning, en al haar steden, en zij sloegen haar met de scherpte des zwaards, en verbanden alle ziel, die daarin was; hij liet geen overigen overblijven; gelijk als hij aan Hebron gedaan had, alzo deed hij aan Debir en haar koning, en gelijk als hij aan Libna en haar koning gedaan had;","40":"Alzo sloeg Jozua het ganse land, het gebergte, en het zuiden, en de laagte, en de aflopingen der wateren, en al hun koningen; hij liet geen overigen overblijven; ja, hij verbande alles, wat adem had, gelijk als de HEERE, de God Israëls, geboden had.","41":"En Jozua sloeg hen van Kades-barnea en tot Gaza toe; ook het ganse land Gosen, en tot Gibeon toe.","42":"En Jozua nam al deze koningen en hun land op eenmaal; want de HEERE, de God Israëls, streed voor Israël.","43":"Toen keerde Jozua weder, en gans Israël met hem, naar het leger te Gilgal."},"KJV":{"1":"Now it came to pass, when Adonizedek king of Jerusalem had heard how Joshua had taken Ai, and had utterly destroyed it; as he had done to Jericho and her king, so he had done to Ai and her king; and how the inhabitants of Gibeon had made peace with Israel, and were among","2":"That they feared greatly, because Gibeon *was* a great city, as one of the royal cities, and because it *was* greater than Ai, and all the men thereof *were* mighty.","3":"Wherefore Adonizedek king of Jerusalem sent unto Hoham king of Hebron, and unto Piram king of Jarmuth, and unto Japhia king of Lachish, and unto Debir king of Eglon, saying,","4":"Come up unto me, and help me, that we may smite Gibeon: for it hath made peace with Joshua and with the children of Israel.","5":"Therefore the five kings of the Amorites, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, the king of Eglon, gathered themselves together, and went up, they and all their hosts, and encamped before Gibeon, and made war","6":"And the men of Gibeon sent unto Joshua to the camp to Gilgal, saying, Slack not thy hand from thy servants; come up to us quickly, and save us, and help us: for all the kings of the Amorites that dwell in the mountains are gathered together","7":"So Joshua ascended from Gilgal, he, and all the people of war with him, and all the mighty men of valour.","8":"And the LORD said unto Joshua, Fear them not: for I have delivered them into thine hand; there shall not a man of them stand before","9":"Joshua therefore came unto them suddenly, *and* went up from Gilgal all night.","10":"And the LORD discomfited them before Israel, and slew them with a great slaughter at Gibeon, and chased them along the way that goeth up to Bethhoron, and smote them to Azekah, and unto Makkedah.","11":"And it came to pass, as they fled from before Israel, *and* were in the going down to Bethhoron, that the LORD cast down great stones from heaven upon them unto Azekah, and they died: *they were* more which died with hailstones than *they* whom the children of Israel slew with the sword.","12":"Then spake Joshua to the LORD in the day when the LORD delivered up the Amorites before the children of Israel, and he said in the sight of Israel, Sun, stand thou still upon Gibeon; and thou, Moon, in the valley of Ajalon.","13":"And the sun stood still, and the moon stayed, until the people had avenged themselves upon their enemies. *Is* not this written in the book of Jasher? So the sun stood still in the midst of heaven, and hasted not to go down about a whole day.","14":"And there was no day like that before it or after it, that the LORD hearkened unto the voice of a man: for the LORD fought for Israel.","15":"And Joshua returned, and all Israel with him, unto the camp to Gilgal.","16":"But these five kings fled, and hid themselves in a cave at Makkedah.","17":"And it was told Joshua, saying, The five kings are found hid in a cave at Makkedah.","18":"And Joshua said, Roll great stones upon the mouth of the cave, and set men by it for to keep","19":"And stay ye not, *but* pursue after your enemies, and smite the hindmost of them; suffer them not to enter into their cities: for the LORD your God hath delivered them into your hand.","20":"And it came to pass, when Joshua and the children of Israel had made an end of slaying them with a very great slaughter, till they were consumed, that the rest *which* remained of them entered into fenced cities.","21":"And all the people returned to the camp to Joshua at Makkedah in peace: none moved his tongue against any of the children of Israel.","22":"Then said Joshua, Open the mouth of the cave, and bring out those five kings unto me out of the cave.","23":"And they did so, and brought forth those five kings unto him out of the cave, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, *and* the king of Eglon.","24":"And it came to pass, when they brought out those kings unto Joshua, that Joshua called for all the men of Israel, and said unto the captains of the men of war which went with him, Come near, put your feet upon the necks of these kings. And they came near, and put their feet upon the necks","25":"And Joshua said unto them, Fear not, nor be dismayed, be strong and of good courage: for thus shall the LORD do to all your enemies against whom ye fight.","26":"And afterward Joshua smote them, and slew them, and hanged them on five trees: and they were hanging upon the trees until the evening.","27":"And it came to pass at the time of the going down of the sun, *that* Joshua commanded, and they took them down off the trees, and cast them into the cave wherein they had been hid, and laid great stones in the cave's mouth, *which remain* until this very day.","28":"And that day Joshua took Makkedah, and smote it with the edge of the sword, and the king thereof he utterly destroyed, them, and all the souls that *were* therein; he let none remain: and he did to the king of Makkedah as he did unto the king of Jericho.","29":"Then Joshua passed from Makkedah, and all Israel with him, unto Libnah, and fought against Libnah:","30":"And the LORD delivered it also, and the king thereof, into the hand of Israel; and he smote it with the edge of the sword, and all the souls that *were* therein; he let none remain in it; but did unto the king thereof as he did unto the king of Jericho.","31":"And Joshua passed from Libnah, and all Israel with him, unto Lachish, and encamped against it, and fought","32":"And the LORD delivered Lachish into the hand of Israel, which took it on the second day, and smote it with the edge of the sword, and all the souls that *were* therein, according to all that he had done to Libnah.","33":"Then Horam king of Gezer came up to help Lachish; and Joshua smote him and his people, until he had left him none remaining.","34":"And from Lachish Joshua passed unto Eglon, and all Israel with him; and they encamped against it, and fought","35":"And they took it on that day, and smote it with the edge of the sword, and all the souls that *were* therein he utterly destroyed that day, according to all that he had done to Lachish.","36":"And Joshua went up from Eglon, and all Israel with him, unto Hebron; and they fought","37":"And they took it, and smote it with the edge of the sword, and the king thereof, and all the cities thereof, and all the souls that *were* therein; he left none remaining, according to all that he had done to Eglon; but destroyed it utterly, and all the souls","38":"And Joshua returned, and all Israel with him, to Debir; and fought","39":"And he took it, and the king thereof, and all the cities thereof; and they smote them with the edge of the sword, and utterly destroyed all the souls that *were* therein; he left none remaining: as he had done to Hebron, so he did to Debir, and to the king thereof; as he had done also to Libnah, and to her king.","40":"So Joshua smote all the country of the hills, and of the south, and of the vale, and of the springs, and all their kings: he left none remaining, but utterly destroyed all that breathed, as the LORD God of Israel commanded.","41":"And Joshua smote them from Kadeshbarnea even unto Gaza, and all the country of Goshen, even unto Gibeon.","42":"And all these kings and their land did Joshua take at one time, because the LORD God of Israel fought for Israel.","43":"And Joshua returned, and all Israel with him, unto the camp to Gilgal."}},"tsk":{"1":[{"kopje":"als hij aan","refs":["Joz 6:21","Joz 8:2","Joz 8:22-29"]},{"kopje":"dat Jozua","refs":["Joz 9:15-27","Joz 11:19","Joz 11:20"]}],"2":[{"kopje":"vreesden zij zeer","refs":["Joz 2:9-13","Joz 2:24","Ex 15:14-16","Deut 11:25","Deut 28:10","Ps 48:5-7","Spr 1:26","Spr 1:27","Spr 10:24","Hebr 10:27","Hebr 10:31","Openb 6:15-17"]},{"kopje":"de koninklijke steden","refs":["1 Sam 27:5","2 Sam 12:26"]}],"3":[{"kopje":"koning van Jeruzalem","refs":["Joz 10:1","Joz 10:5","Joz 12:10-13","Joz 15:35-39","Joz 15:54","Joz 15:63","Joz 18:28"]},{"kopje":"Hebron","refs":["Joz 14:15","Gen 23:2","Gen 37:14","Num 13:22","2 Sam 2:11"]},{"kopje":"Lachis","refs":["2 Kon 18:14","2 Kon 18:17","2 Kron 11:9","Micha 1:13"]}],"4":[{"kopje":"en help","refs":["Jes 8:9","Jes 8:10","Jes 41:5-7","Hand 9:24-27","Hand 21:28","Openb 16:14","Openb 20:8-10"]},{"kopje":"dat wij","refs":["Joz 10:1","Joz 9:15","Matt 16:24","Joh 15:19","Joh 16:2","Joh 16:3","Hand 9:23","2 Tim 3:12","Jak 4:4","1 Petr 4:4"]}],"6":[{"kopje":"het leger","refs":["Joz 5:10","Joz 9:6"]},{"kopje":"Trek ... terug","refs":["2 Kon 4:24"]},{"kopje":"van uw","refs":["Joz 9:15","Joz 9:24","Joz 9:25","Jes 33:22"]},{"kopje":"gebergte","refs":["Joz 21:11","Deut 1:15","Ps 125:2","Luk 1:39"]}],"9":[{"kopje":"de hele nacht","refs":["1 Sam 11:9-11","Spr 22:29","Spr 24:11","Spr 24:12","Pred 9:10","2 Tim 2:3","2 Tim 4:2"]}],"10":[{"kopje":"de HEERE","refs":["Joz 11:8","Richt 4:15","1 Sam 7:10-12","2 Kron 14:12","Ps 18:15","Ps 44:4","Ps 78:55"]},{"kopje":"te Gibeon","refs":["Jes 28:21"]},{"kopje":"Beth-horon","refs":["Joz 16:3","Joz 16:5","Joz 21:22","1 Sam 13:18"]},{"kopje":"Azeka","refs":["Joz 10:11","Joz 15:35","Jer 34:7"]},{"kopje":"Makkeda","refs":["Joz 10:28","Joz 12:16","Joz 15:41"]}],"11":[{"kopje":"d ss=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3412\">Jarmuth,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H3309\">Japhia</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H1688\">Debir</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H5700\">Eglon,</span> saying,","4":"Come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto me, and <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> me, that we may <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon:</span> for it hath made <span class=\"wl wl-kjv\" data-code=\"H7999\">peace</span> with <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> and with the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","5":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3412\">Jarmuth,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H5700\">Eglon,</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> they and all their <span class=\"wl wl-kjv\" data-code=\"H4264\">hosts,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> before <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon,</span> and made war","6":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> to the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> to <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7503\">Slack</span> not thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> from thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants;</span> come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to us <span class=\"wl wl-kjv\" data-code=\"H4120\">quickly,</span> and <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> us, and <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> us: for all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> are gathered together","7":"So <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">ascended</span> from <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal,</span> he, and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> with him, and all the <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> men of valour.","8":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> them not: for I have <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> there shall not a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of them <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> before","9":"<span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> therefore <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto them <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal</span> all night.","10":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2000\">discomfited</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> them with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter</span> at <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon,</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">chased</span> them along the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that goeth <span class=\"wl wl-kjv\" data-code=\"H4608\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H1032\">Bethhoron,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them to <span class=\"wl wl-kjv\" data-code=\"H5825\">Azekah,</span> and unto Makkedah.","11":"And it came to pass, as they <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and were in the going <span class=\"wl wl-kjv\" data-code=\"H4174\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H1032\">Bethhoron,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> cast <span class=\"wl wl-kjv\" data-code=\"H7993\">down</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> upon them unto <span class=\"wl wl-kjv\" data-code=\"H5825\">Azekah,</span> and they <span class=\"wl wl-kjv\" data-code=\"H4191\">died:</span> they were <span class=\"wl wl-kjv\" data-code=\"H7227\">more</span> which <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> with <span class=\"wl wl-kjv\" data-code=\"H1259\">hailstones</span> than they <span class=\"wl wl-kjv\" data-code=\"H834\">whom</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> with the sword.","12":"Then <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> delivered <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H8121\">Sun,</span> stand thou <span class=\"wl wl-kjv\" data-code=\"H1826\">still</span> upon <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon;</span> and thou, <span class=\"wl wl-kjv\" data-code=\"H3394\">Moon,</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of Ajalon.","13":"And the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> stood <span class=\"wl wl-kjv\" data-code=\"H1826\">still,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stayed,</span> until the <span class=\"wl wl-kjv\" data-code=\"H1471\">people</span> had <span class=\"wl wl-kjv\" data-code=\"H5358\">avenged</span> themselves upon their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies.</span> Is not <span class=\"wl wl-kjv\" data-code=\"H1931\">this</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of <span class=\"wl wl-kjv\" data-code=\"H3477\">Jasher?</span> So the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> stood <span class=\"wl wl-kjv\" data-code=\"H5975\">still</span> in the <span class=\"wl wl-kjv\" data-code=\"H2677\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H213\">hasted</span> not to go <span class=\"wl wl-kjv\" data-code=\"H935\">down</span> about a <span class=\"wl wl-kjv\" data-code=\"H8549\">whole</span> day.","14":"And there was no <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> like that <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> it or <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> it, that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of a <span class=\"wl wl-kjv\" data-code=\"H376\">man:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> for Israel.","15":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with him, unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> to Gilgal.","16":"But these <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled,</span> and <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> themselves in a <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> at Makkedah.","17":"And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> are <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> in a <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> at Makkedah.","18":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1556\">Roll</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave,</span> and <span class=\"wl wl-kjv\" data-code=\"H6485\">set</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> by it for to keep","19":"And <span class=\"wl wl-kjv\" data-code=\"H5975\">stay</span> ye not, but <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and smite the <span class= (function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
