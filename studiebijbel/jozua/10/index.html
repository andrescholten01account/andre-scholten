een/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren;", "2": "Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk.", "3": "Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:", "4": "Kom op tot mij, en help mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen van Israël.", "5": "Toen werden de vijf koningen van de Amorieten verzameld en trokken op, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en streden tegen haar.", "6": "De mannen van Gibeon nu stuurden tot Jozua, in het leger van Gilgal, en zeiden: Trek uw handen niet terug van uw knechten, kom haastig tot ons op, en verlos ons, en help ons; want al de koningen van de Amorieten, die op het gebergte wonen, hebben zich tegen ons verzameld.", "7": "Toen trok Jozua op van Gilgal, hij en al het krijgsvolk met hem, en alle strijdbare helden.", "8": "Want de HEERE had tot Jozua gezegd: Vrees niet voor hen, want Ik heb ze in uw hand gegeven; niemand van hen zal voor uw aangezicht standhouden.", "9": "Zo kwam Jozua snel tot hen; de hele nacht door was hij van Gilgal opgetrokken.", "10": "En de HEERE bracht hen in verwarring voor het aangezicht van Israël; en hij sloeg hen met een grote slag te Gibeon, en vervolgde hen op de weg waar men naar Beth-horon opgaat, en sloeg hen tot Azeka en tot Makkeda toe.", "11": "Het gebeurde nu, toen zij voor het aangezicht van Israël vluchtten, terwijl ze in de afdaling van Beth-horon waren, dat de HEERE grote stenen op hen wierp van de hemel, tot Azeka toe, zodat zij stierven; er waren er meer die van de hagelstenen stierven, dan die de kinderen van Israël met het zwaard doodden.", "12": "Toen sprak Jozua tot de HEERE, op de dag toen de HEERE de Amorieten voor het aangezicht van de kinderen van Israël overgaf, en hij zei voor de ogen van de Israëlieten: Zon, sta stil te Gibeon, en u, maan, in het dal van Ajalon!", "13": "En de zon stond stil, en de maan bleef staan, totdat het volk zich op zijn vijanden gewroken had. Is dit niet geschreven in het boek van de oprechten? De zon nu stond stil in het midden van de hemel, en haastte zich niet om onder te gaan, ongeveer een volle dag.", "14": "En er was geen dag aan deze gelijk, ervoor of erna, dat de HEERE de stem van een man zó verhoorde; want de HEERE streed voor Israël.", "15": "Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal.", "16": "Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda.", "17": "En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda.", "18": "Toen zei Jozua: Rol grote stenen voor de opening van de grot, en zet mannen ervoor om hen te bewaken.", "19": "Maar sta u zelf niet stil, jaag uw vijanden achterna, en sla hen in de achterhoede; laat hen niet in hun steden komen; want de HEERE, uw God, heeft ze in uw hand gegeven.", "20": "En het gebeurde, toen Jozua en de kinderen van Israël klaar waren met hen te slaan met een zeer grote slag, totdat zij vernietigd waren, en dat de overgeblevenen, die van hen overgebleven waren, in de versterkte steden gekomen waren;", "21": "Zo keerde al het volk terug tot Jozua in het leger, bij Makkeda, in vrede; niemand had zijn tong tegen de kinderen van Israël geroerd.", "22": "Daarna zei Jozua: Open de mond van de grot, en breng tot mij die vijf koningen uit die grot.", "23": "Zij nu deden zo, en brachten tot hem die vijf koningen uit de grot: de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon.", "24": "En het gebeurde, toen zij die koningen uitgebracht hadden tot Jozua, dat Jozua al de mannen van Israël riep, en hij zei tot de aanvoerders van het krijgsvolk, die met hem opgetrokken waren: Treed toe, zet uw voeten op de nekken van deze koningen. En zij traden toe, en zetten hun voeten op hun nekken.", "25": "Toen zei Jozua tot hen: Vrees niet en wees niet ontsteld, wees sterk en heb goede moed; want zo zal de HEERE aan al uw vijanden doen, tegen wie u strijdt.", "26": "En Jozua sloeg hen daarna, en doodde ze, en hing ze aan vijf bomen; en zij hingen aan de bomen tot de avond.", "27": "En het gebeurde, ten tijde dat de zon onderging, dat Jozua beval dat men hen van de bomen afnam, en zij wierpen hen in de grot, waar zij verborgen geweest waren; en zij legden grote stenen voor de opening van de grot, *die* *daar* *zijn* tot op deze zelfde dag.", "28": "Op diezelfde dag nam Jozua ook Makkeda in, en sloeg haar met de scherpte van het zwaard; daartoe verbande hij haar koning, hen en elke ziel die daarin was; hij liet niemand overblijven; en hij deed de koning van Makkeda zoals hij de koning van Jericho gedaan had.", "29": "Toen trok Jozua door, en heel Israël met hem, van Makkeda naar Libna, en hij streed tegen Libna.", "30": "En de HEERE gaf haar ook in de hand van Israël, met haar koning; en hij sloeg haar met de scherpte van het zwaard, en elke ziel die daarin was; hij liet daarin niemand overblijven; en hij deed haar koning zoals hij de koning van Jericho gedaan had.", "31": "Toen trok Jozua verder, en heel Israël met hem, van Libna naar Lachis; en hij belegerde haar en streed tegen haar.", "32": "En de HEERE gaf Lachis in de hand van Israël; en hij nam haar in op de tweede dag, en hij sloeg haar met de scherpte van het zwaard, en elke ziel die daarin was, naar alles wat hij Libna gedaan had.", "33": "Toen trok Horam, de koning van Gezer, op om Lachis te helpen; maar Jozua sloeg hem en zijn volk, totdat hij hem niemand overliet.", "34": "En Jozua trok verder van Lachis naar Eglon, en heel Israël met hem; en zij belegerden haar en streden tegen haar.", "35": "En zij namen haar in op diezelfde dag, en sloegen haar met de scherpte van het zwaard, en elke ziel die daarin was, verbande hij op diezelfde dag, naar alles wat hij aan Lachis gedaan had.", "36": "Daarna trok Jozua op, en heel Israël met hem, van Eglon naar Hebron, en zij streden tegen haar.", "37": "En zij namen haar in, en sloegen haar met de scherpte van het zwaard, zowel haar koning als al haar steden, en elke ziel die daarin was; hij liet niemand in leven overblijven, naar alles wat hij Eglon gedaan had; en hij verbande haar, en elke ziel die daarin was.", "38": "Toen keerde Jozua terug, en heel Israël met hem, naar Debir, en hij streed tegen haar.", "39": "En hij nam haar in, met haar koning, en al haar steden, en zij sloegen haar met de scherpte van het zwaard, en verbanden elke ziel die daarin was; hij liet niemand overblijven; zoals hij aan Hebron gedaan had, zo deed hij aan Debir en haar koning, en zoals hij aan Libna en haar koning gedaan had;", "40": "Zo sloeg Jozua het hele land, het gebergte, en het zuiden, en de laagte, en de hellingen van de wateren, en al hun koningen; hij liet niemand overblijven; ja, hij verbande alles wat adem had, zoals de HEERE, de God van Israël, geboden had.", "41": "En Jozua sloeg hen van Kades-Barnea tot Gaza toe; ook het hele land Gosen, en tot Gibeon toe.", "42": "En Jozua nam al deze koningen en hun land in één keer in; want de HEERE, de God van Israël, streed voor Israël.", "43": "Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal."}, "SV": {"1": "Het geschiedde nu, toen Adoni-zedek, de koning van Jeruzalem, gehoord had, dat Jozua Ai ingenomen, en haar verbannen had, *en* aan Ai en haar koning alzo gedaan had, gelijk als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in derzelver midden waren;", "2": "Zo vreesden zij zeer; want Gibeon was een grote stad, als een der koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk.", "3": "Daarom zond Adoni-zedek, koning van Jeruzalem, tot Hoham, den koning van Hebron, en tot Pir-am, den koning van Jarmuth, en tot Jafia, den koning van Lachis, en tot Debir, den koning van Eglon, zeggende:", "4": "Komt op tot mij, en helpt mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen Israëls.", "5": "Toen werden verzameld en kwamen op, vijf koningen der Amorieten, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en krijgden tegen haar.", "6": "De mannen nu van Gibeon zonden tot Jozua, in het leger van Gilgal, zeggende: Trek uw handen niet af van uw knechten, kom haastelijk tot ons op, en verlos ons, en help ons; want al de koningen der Amorieten, die op het gebergte wonen, hebben zich tegen ons vergaderd.", "7": "Toen toog Jozua op van Gilgal, hij en al het krijgsvolk met hem, en alle strijdbare helden.", "8": "Want de HEERE had tot Jozua gezegd: Vrees u niet voor hen, want Ik heb ze in uw hand gegeven; niemand van hen zal voor uw aangezicht bestaan.", "9": "Alzo kwam Jozua snellijk tot hen; den gansen nacht over was hij van Gilgal opgetrokken.", "10": "En de HEERE verschrikte hen voor het aangezicht van Israël; en hij sloeg hen met een groten slag te Gibeon, en vervolgde hen op den weg, waar men naar Beth-horon opgaat, en sloeg hen tot Azeka en tot Makkeda toe.", "11": "Het geschiedde nu, toen zij voor het aangezicht van Israël vluchtten, zijnde in den afgang van Beth-horon, zo wierp de HEERE grote stenen op hen van den hemel, tot Azeka toe, dat zij stierven; daar waren er meer, die van de hagelstenen stierven, dan die die kinderen Israëls met het zwaard doodden.", "12": "Toen sprak Jozua tot den HEERE, ten dage als de HEERE de Amorieten voor het aangezicht der kinderen Israëls overgaf, en zeide voor de ogen der Israëlieten: Zon, sta stil te Gibeon, en gij, maan, in het dal van Ajalon!", "13": "En de zon stond stil, en de maan bleef staan, totdat zich het volk aan zijn vijanden gewroken had. Is dit niet geschreven in het boek des oprechten? De zon nu stond stil in het midden des hemels, en haastte niet onder te gaan omtrent een volkomen dag.", "14": "En er was geen dag aan dezen gelijk, voor hem noch na hem, dat de HEERE de stem eens mans *alzo* verhoorde; want de HEERE streed voor Israël.", "15": "Toen keerde Jozua weder, en gans Israël met hem, naar het leger te Gilgal.", "16": "Maar die vijf koningen waren gevloden, en hadden zich verborgen in de spelonk bij Makkeda.", "17": "En aan Jozua werd geboodschapt, mits te zeggen: Die vijf koningen zijn gevonden, verborgen in de spelonk bij Makkeda.", "18": "Zo zeide Jozua: Wentelt grote stenen voor den mond der spelonk, en stelt mannen daarvoor om hen te bewaren.", "19": "Maar staat gijlieden niet stil, jaagt uw vijanden achterna, en slaat hen in den staart; laat hen in hun steden niet komen; want de HEERE, uw God, heeft ze in uw hand gegeven.", "20": "En het geschiedde, toen Jozua en de kinderen Israëls geëindigd hadden hen met een zeer groten slag te slaan, totdat zij vernield waren, en dat de overgeblevenen, die van hen overgebleven waren, in de vaste steden gekomen waren;", "21": "Zo keerde al het volk tot Jozua in het leger, bij Makkeda, in vrede; niemand had zijn tong tegen de kinderen Israëls geroerd.", "22": "Daarna zeide Jozua: Opent den mond der spelonk, en brengt tot mij uit die vijf koningen, uit die spelonk.", "23": "Zij nu deden alzo, en brachten tot hem uit die vijf koningen, uit de spelonk: den koning van Jeruzalem, den koning van Hebron, den koning van Jarmuth, den koning van Lachis, den koning van Eglon.", "24": "En het geschiedde, als zij die koningen uitgebracht hadden tot Jozua, zo riep Jozua, al de mannen van Israël, en hij zeide tot de oversten des krijgsvolks, die met hem getogen waren: Treedt toe, zet uw voeten op de halzen dezer koningen. En zij traden toe, en zetten hun voeten op hun halzen.", "25": "Toen zeide Jozua tot hen: Vreest niet en ontzet u niet, zijt sterk en hebt goeden moed; want alzo zal de HEERE aan al uw vijanden doen, tegen dewelke gijlieden strijdt.", "26": "En Jozua sloeg hen daarna, en doodde ze, en hing ze aan vijf houten; en zij hingen aan de houten tot den avond.", "27": "En het geschiedde, ten tijde als de zon onderging, beval Jozua, dat men hen van de houten afname, en zij wierpen hen in de spelonk, alwaar zij verborgen geweest waren; en zij leiden grote stenen voor den mond der spelonk, *die* *daar* *zijn* tot op dezen zelven dag.", "28": "Op denzelven dag nam ook Jozua Makkeda in, en sloeg haar met de scherpte des zwaards; daartoe verbande hij derzelver koning, henlieden en alle ziel die daarin was; hij liet geen overigen overblijven; en hij deed den koning van Makkeda, gelijk als hij den koning van Jericho gedaan had.", "29": "Toen toog Jozua door, en gans Israël met hem, van Makkeda naar Libna, en hij krijgde tegen Libna.", "30": "En de HEERE gaf dezelve ook in de hand van Israël, met haar koning; en hij sloeg haar met de scherpte des zwaards, en alle ziel, die daarin was; hij liet daarin geen overigen overblijven; en hij deed derzelver koning, gelijk als hij den koning van Jericho gedaan had.", "31": "Toen toog Jozua voort, en gans Israël met hem, van Libna naar Lachis; en hij belegerde haar en krijgde tegen haar.", "32": "En de HEERE gaf Lachis in de hand van Israël; en hij nam haar in op den tweeden dag, en hij sloeg haar met de scherpte des zwaards, en alle ziel, die daarin was, naar alles, wat hij Libna gedaan had.", "33": "Toen trok Horam, de koning van Gezer, op, om Lachis te helpen; maar Jozua sloeg hem en zijn volk, totdat hij hem geen overigen overliet.", "34": "En Jozua trok voort van Lachis naar Eglon, en gans Israël met hem; en zij belegerden haar en krijgden tegen haar.", "35": "En zij namen haar in ten zelven dage, en sloegen haar met de scherpte des zwaards, en alle ziel, die daarin was, verbande hij op denzelven dag, naar alles, wat hij aan Lachis gedaan had.", "36": "Daarna toog Jozua op, en gans Israël met hem; van Eglon naar Hebron, en zij krijgden tegen haar.", "37": "En zij namen haar in, en sloegen haar met de scherpte des zwaards, zo haar koning als al haar steden, en alle ziel, die daarin was; hij liet niemand in het leven overblijven, naar alles, wat hij Eglon gedaan had; en hij verbande haar, en alle ziel, die daarin was.", "38": "Toen keerde Jozua, en gans Israël met hem, naar Debir, en hij krijgde tegen haar.", "39": "En hij nam haar in, met haar koning, en al haar steden, en zij sloegen haar met de scherpte des zwaards, en verbanden alle ziel, die daarin was; hij liet geen overigen overblijven; gelijk als hij aan Hebron gedaan had, alzo deed hij aan Debir en haar koning, en gelijk als hij aan Libna en haar koning gedaan had;", "40": "Alzo sloeg Jozua het ganse land, het gebergte, en het zuiden, en de laagte, en de aflopingen der wateren, en al hun koningen; hij liet geen overigen overblijven; ja, hij verbande alles, wat adem had, gelijk als de HEERE, de God Israëls, geboden had.", "41": "En Jozua sloeg hen van Kades-barnea en tot Gaza toe; ook het ganse land Gosen, en tot Gibeon toe.", "42": "En Jozua nam al deze koningen en hun land op eenmaal; want de HEERE, de God Israëls, streed voor Israël.", "43": "Toen keerde Jozua weder, en gans Israël met hem, naar het leger te Gilgal."}, "KJV": {"1": "Now it came to pass, when Adonizedek king of Jerusalem had heard how Joshua had taken Ai, and had utterly destroyed it; as he had done to Jericho and her king, so he had done to Ai and her king; and how the inhabitants of Gibeon had made peace with Israel, and were among", "2": "That they feared greatly, because Gibeon *was* a great city, as one of the royal cities, and because it *was* greater than Ai, and all the men thereof *were* mighty.", "3": "Wherefore Adonizedek king of Jerusalem sent unto Hoham king of Hebron, and unto Piram king of Jarmuth, and unto Japhia king of Lachish, and unto Debir king of Eglon, saying,", "4": "Come up unto me, and help me, that we may smite Gibeon: for it hath made peace with Joshua and with the children of Israel.", "5": "Therefore the five kings of the Amorites, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, the king of Eglon, gathered themselves together, and went up, they and all their hosts, and encamped before Gibeon, and made war", "6": "And the men of Gibeon sent unto Joshua to the camp to Gilgal, saying, Slack not thy hand from thy servants; come up to us quickly, and save us, and help us: for all the kings of the Amorites that dwell in the mountains are gathered together", "7": "So Joshua ascended from Gilgal, he, and all the people of war with him, and all the mighty men of valour.", "8": "And the LORD said unto Joshua, Fear them not: for I have delivered them into thine hand; there shall not a man of them stand before", "9": "Joshua therefore came unto them suddenly, *and* went up from Gilgal all night.", "10": "And the LORD discomfited them before Israel, and slew them with a great slaughter at Gibeon, and chased them along the way that goeth up to Bethhoron, and smote them to Azekah, and unto Makkedah.", "11": "And it came to pass, as they fled from before Israel, *and* were in the going down to Bethhoron, that the LORD cast down great stones from heaven upon them unto Azekah, and they died: *they were* more which died with hailstones than *they* whom the children of Israel slew with the sword.", "12": "Then spake Joshua to the LORD in the day when the LORD delivered up the Amorites before the children of Israel, and he said in the sight of Israel, Sun, stand thou still upon Gibeon; and thou, Moon, in the valley of Ajalon.", "13": "And the sun stood still, and the moon stayed, until the people had avenged themselves upon their enemies. *Is* not this written in the book of Jasher? So the sun stood still in the midst of heaven, and hasted not to go down about a whole day.", "14": "And there was no day like that before it or after it, that the LORD hearkened unto the voice of a man: for the LORD fought for Israel.", "15": "And Joshua returned, and all Israel with him, unto the camp to Gilgal.", "16": "But these five kings fled, and hid themselves in a cave at Makkedah.", "17": "And it was told Joshua, saying, The five kings are found hid in a cave at Makkedah.", "18": "And Joshua said, Roll great stones upon the mouth of the cave, and set men by it for to keep", "19": "And stay ye not, *but* pursue after your enemies, and smite the hindmost of them; suffer them not to enter into their cities: for the LORD your God hath delivered them into your hand.", "20": "And it came to pass, when Joshua and the children of Israel had made an end of slaying them with a very great slaughter, till they were consumed, that the rest *which* remained of them entered into fenced cities.", "21": "And all the people returned to the camp to Joshua at Makkedah in peace: none moved his tongue against any of the children of Israel.", "22": "Then said Joshua, Open the mouth of the cave, and bring out those five kings unto me out of the cave.", "23": "And they did so, and brought forth those five kings unto him out of the cave, the king of Jerusalem, the king of Hebron, the king of Jarmuth, the king of Lachish, *and* the king of Eglon.", "24": "And it came to pass, when they brought out those kings unto Joshua, that Joshua called for all the men of Israel, and said unto the captains of the men of war which went with him, Come near, put your feet upon the necks of these kings. And they came near, and put their feet upon the necks", "25": "And Joshua said unto them, Fear not, nor be dismayed, be strong and of good courage: for thus shall the LORD do to all your enemies against whom ye fight.", "26": "And afterward Joshua smote them, and slew them, and hanged them on five trees: and they were hanging upon the trees until the evening.", "27": "And it came to pass at the time of the going down of the sun, *that* Joshua commanded, and they took them down off the trees, and cast them into the cave wherein they had been hid, and laid great stones in the cave's mouth, *which remain* until this very day.", "28": "And that day Joshua took Makkedah, and smote it with the edge of the sword, and the king thereof he utterly destroyed, them, and all the souls that *were* therein; he let none remain: and he did to the king of Makkedah as he did unto the king of Jericho.", "29": "Then Joshua passed from Makkedah, and all Israel with him, unto Libnah, and fought against Libnah:", "30": "And the LORD delivered it also, and the king thereof, into the hand of Israel; and he smote it with the edge of the sword, and all the souls that *were* therein; he let none remain in it; but did unto the king thereof as he did unto the king of Jericho.", "31": "And Joshua passed from Libnah, and all Israel with him, unto Lachish, and encamped against it, and fought", "32": "And the LORD delivered Lachish into the hand of Israel, which took it on the second day, and smote it with the edge of the sword, and all the souls that *were* therein, according to all that he had done to Libnah.", "33": "Then Horam king of Gezer came up to help Lachish; and Joshua smote him and his people, until he had left him none remaining.", "34": "And from Lachish Joshua passed unto Eglon, and all Israel with him; and they encamped against it, and fought", "35": "And they took it on that day, and smote it with the edge of the sword, and all the souls that *were* therein he utterly destroyed that day, according to all that he had done to Lachish.", "36": "And Joshua went up from Eglon, and all Israel with him, unto Hebron; and they fought", "37": "And they took it, and smote it with the edge of the sword, and the king thereof, and all the cities thereof, and all the souls that *were* therein; he left none remaining, according to all that he had done to Eglon; but destroyed it utterly, and all the souls", "38": "And Joshua returned, and all Israel with him, to Debir; and fought", "39": "And he took it, and the king thereof, and all the cities thereof; and they smote them with the edge of the sword, and utterly destroyed all the souls that *were* therein; he left none remaining: as he had done to Hebron, so he did to Debir, and to the king thereof; as he had done also to Libnah, and to her king.", "40": "So Joshua smote all the country of the hills, and of the south, and of the vale, and of the springs, and all their kings: he left none remaining, but utterly destroyed all that breathed, as the LORD God of Israel commanded.", "41": "And Joshua smote them from Kadeshbarnea even unto Gaza, and all the country of Goshen, even unto Gibeon.", "42": "And all these kings and their land did Joshua take at one time, because the LORD God of Israel fought for Israel.", "43": "And Joshua returned, and all Israel with him, unto the camp to Gilgal."}}, "tsk": {"1": [{"kopje": "als hij aan", "refs": ["Joz 6:21", "Joz 8:2", "Joz 8:22-29"]}, {"kopje": "dat Jozua", "refs": ["Joz 9:15-27", "Joz 11:19", "Joz 11:20"]}], "2": [{"kopje": "vreesden zij zeer", "refs": ["Joz 2:9-13", "Joz 2:24", "Ex 15:14-16", "Deut 11:25", "Deut 28:10", "Ps 48:5-7", "Spr 1:26", "Spr 1:27", "Spr 10:24", "Hebr 10:27", "Hebr 10:31", "Openb 6:15-17"]}, {"kopje": "de koninklijke steden", "refs": ["1 Sam 27:5", "2 Sam 12:26"]}], "3": [{"kopje": "koning van Jeruzalem", "refs": ["Joz 10:1", "Joz 10:5", "Joz 12:10-13", "Joz 15:35-39", "Joz 15:54", "Joz 15:63", "Joz 18:28"]}, {"kopje": "Hebron", "refs": ["Joz 14:15", "Gen 23:2", "Gen 37:14", "Num 13:22", "2 Sam 2:11"]}, {"kopje": "Lachis", "refs": ["2 Kon 18:14", "2 Kon 18:17", "2 Kron 11:9", "Micha 1:13"]}], "4": [{"kopje": "en help", "refs": ["Jes 8:9", "Jes 8:10", "Jes 41:5-7", "Hand 9:24-27", "Hand 21:28", "Openb 16:14", "Openb 20:8-10"]}, {"kopje": "dat wij", "refs": ["Joz 10:1", "Joz 9:15", "Matt 16:24 kken; want de HEERE zal u tot een eeuwig licht zijn, en de dagen van uw treuren zullen een einde nemen.", "Deut 31:23": "En Hij gebood Jozua, de zoon van Nun, en zei: Wees sterk en heb goede moed, want u zult de kinderen van Israël brengen in het land, dat Ik hun gezworen heb; en Ik zal met u zijn.", "2 Sam 18:17": "En zij namen Absalom en wierpen hem in het woud, in een grote kuil, en legden op hem een zeer grote steenhoop; en heel Israël vluchtte, ieder naar zijn tent.", "Richt 7:25": "En zij vingen twee vorsten van de Midianieten, Oreb en Zeëb, en doodden Oreb op de rots Oreb, en Zeëb doodden zij bij de perskuip van Zeëb, en achtervolgden de Midianieten; en zij brachten de hoofden van Oreb en Zeëb naar Gideon, aan de overkant van de Jordaan.", "Ps 48:5-7": "Want zie, de koningen waren verzameld; zij waren samen doorgetrokken. Zoals zij het zagen, zo waren zij verwonderd; zij werden verschrikt, zij haastten weg. Beving greep hen daar aan, smart als van een barende vrouw.", "Joz 10:1-11": "Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren; Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:", "Jes 60:12": "Want het volk en het koninkrijk die u niet zullen dienen, die zullen vergaan; en die volken zullen helemaal verwoest worden.", "Ps 77:12": "Ik zal de daden van de HEERE gedenken; ja, ik zal Uw wonderen van vroeger gedenken;", "Matt 27:25": "En al het volk antwoordde en zei: Laat Zijn bloed komen over ons, en over onze kinderen.", "Richt 16:28": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.", "Ps 37:40": "En de HEERE zal hen helpen, en zal hen bevrijden; Hij zal hen bevrijden van de goddelozen, en zal hen behouden; want zij vertrouwen op Hem.", "Joz 14:15": "De naam van Hebron was vroeger Kirjath-Arba; die Arba een groot man geweest is onder de Enakieten. En het land had rust van de oorlog.", "Deut 1:15": "Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen.", "Deut 9:1": "Hoor, Israël! U zult vandaag over de Jordaan gaan, om binnen te komen bij volken om die te erven, die groter en sterker zijn dan u; steden die groot zijn en tot in de hemel versterkt;", "Deut 21:10": "Wanneer u uittrekt ten strijde tegen uw vijanden, en de HEERE, uw God, hen in uw hand gegeven heeft, zodat u hun gevangenen gevankelijk wegvoert;", "2 Sam 12:29": "Toen verzamelde David al het volk, en trok naar Rabba; en hij streed tegen haar, en nam haar in.", "Joz 12:16": "De koning van Makkeda, één; de koning van Beth-el, één;", "Joz 11:19": "Er was geen stad die vrede maakte met de kinderen van Israël, behalve de Hevieten, inwoners van Gibeon; die namen zij allemaal in door oorlog.", "Joz 14:6": "Toen naderden de kinderen van Juda tot Jozua, te Gilgal, en Kaleb, de zoon van Jefunne, de Keneziet, zei tegen hem: U weet het woord dat de HEERE tot Mozes, de man van God, gesproken heeft te Kades-Barnea, vanwege mij, en vanwege u.", "Ps 83:2-13": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "Joz 11:11-23": "En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur. En Jozua nam al de steden van deze koningen in, en al hun koningen, en hij sloeg hen met de scherpte van het zwaard, hen met de ban treffend, zoals Mozes, de dienaar van de HEERE, geboden had. Alleen verbrandden de Israëlieten geen steden die op hun heuvels stonden, behalve Hazor alleen; dat verbrandde Jozua.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "2 Petr 3:10": "Maar de dag van de Heere zal komen als een dief in de nacht; op die dag zullen de hemelen met een enorm gedruis voorbijgaan, en de elementen zullen brandend vergaan, en de aarde en de werken die daarop zijn, zullen verbranden.", "Joz 9:6": "En zij gingen naar Jozua in het leger te Gilgal, en zij zeiden tegen hem en tegen de mannen van Israël: Wij zijn gekomen uit een ver land, sluit dan nu een verbond met ons.", "Joz 15:39": "Lachis, en Bozkath, en Eglon,", "Num 32:36": "en Beth-Nimra, en Beth-Haran, versterkte steden en schaapskooien.", "Joz 15:41": "en Gederoth, Beth-dagon, en Naäma, en Makkeda; zestien steden en haar dorpen.", "Joz 9:24": "Zij dan antwoordden Jozua, en zeiden: Omdat aan uw knechten zeker verteld was, dat de HEERE, uw God, Zijn knecht Mozes geboden heeft dat Hij u dit hele land zou geven, en al de inwoners van het land voor uw ogen zou uitroeien, daarom vreesden wij zeer voor ons leven vanwege u; daarom hebben wij deze zaak gedaan.", "Zach 2:13": "Zwijg, alle vlees, voor het aangezicht van de HEERE! want Hij is ontwaakt uit Zijn heilige woning.", "1 Kon 20:1": "En Benhadad, de koning van Syrië, verzamelde al zijn leger; en twee en dertig koningen waren met hem, en paarden en wagens; en hij trok op, en belegerde Samaria en streed tegen haar.", "Deut 7:19": "de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.", "Deut 20:13": "En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard;", "1 Kon 20:21": "En de koning van Israël trok uit, en sloeg paarden en wagens, zodat hij een grote slag aan de Syriërs toebracht.", "Est 8:13": "De inhoud van dit geschrift was: dat er een wet zou worden gegeven in alle landschappen, openbaar bekendgemaakt aan alle volken; en dat de Joden gereed zouden zijn tegen die dag, om zich te wreken op hun vijanden.", "Joz 9:15": "En Jozua sloot vrede met hen, en hij sloot een verbond met hen, dat hij hen in leven zou laten; en de leiders van de vergadering zwoeren het hun.", "Deut 28:10": "En alle volken van de aarde zullen zien dat de Naam van de HEERE over u uitgeroepen is, en zij zullen voor u vrezen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Joz 16:5": "Het gebied nu van de kinderen van Efraïm, naar hun huisgezinnen, is dit: namelijk, de grens van hun erfdeel was oostwaarts Atroth-addar tot aan het bovenste Beth-horon.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "1 Sam 27:8-11": "David nu trok op met zijn mannen, en zij overvielen de Gesurieten, en de Girzieten, en de Amalekieten (want dezen zijn van oude tijden af de inwoners van het land geweest), op de weg naar Sur, tot aan Egypteland. En David sloeg dat land, en liet geen man en geen vrouw in leven; ook nam hij de schapen en runderen, en de ezels, en kamelen, en kleren, en keerde terug en kwam bij Achis. Toen Achis zei: Waar zijn u vandaag ingevallen? zei David: Tegen het zuiden van Juda, en tegen het zuiden van de Jerahmeelieten, en tegen het zuiden van de Kenieten.", "Luk 21:25": "En er zullen tekenen zijn in de zon, en maan, en sterren, en op de aarde benauwdheid van de volken met radeloosheid, wanneer de zee en de watergolven groot geluid zullen geven;", "Joz 15:21-63": "De steden nu, van het uiterste van de stam van de kinderen van Juda tot het gebied van Edom, tegen het zuiden, zijn: Kabzeel, en Eder, en Jagur, en Kina, en Dimona, en Adada, en Kedes, en Hazor, en Jithnan,", "Deut 20:4": "Want het is de HEERE, uw God, Die met u meegaat, om voor u te strijden tegen uw vijanden, om u te verlossen.", "Openb 2:27": "En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.", "Joz 15:42": "Libna, en Ether, en Asan,", "Gen 14:1": "En het gebeurde in de dagen van Amrafel, de koning van Sinear, van Arioch, de koning van Ellasar, van Kedor-laomer, de koning van Elam, en van Tideal, de koning van de volken;", "Richt 1:29": "Ook verdreef Efraïm de Kanaänieten niet die in Gezer woonden; maar de Kanaänieten woonden in zijn midden te Gezer.", "Joz 15:54": "en Humta, en Kirjath-arba, dat is Hebron, en Zior; negen steden en haar dorpen.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Jes 26:5": "Want Hij buigt de hooggezetenen neer, de verheven stad; Hij vernedert haar, Hij vernedert haar tot de aarde toe, Hij doet haar tot aan het stof reiken.", "Ezech 32:8": "Alle lichtende lichten aan de hemel, die zal Ik om uwentwil zwart maken; en Ik zal een duisternis over uw land brengen, spreekt de Heere HEERE.", "Deut 33:29": "Gelukkig bent u, o Israël! wie is u gelijk? u bent een volk, verlost door de HEERE, het Schild van uw hulp, en Die een Zwaard is van uw hoogheid; daarom zullen uw vijanden zich geveinsd aan u onderwerpen, en u zult op hun hoogten treden!", "Openb 13:13": "En het doet grote tekenen, zodat het zelfs vuur uit de hemel laat neerkomen op de aarde, voor de ogen van de mensen.", "Joz 4:19": "Het volk nu was op de tiende dag van de eerste maand uit de Jordaan opgeklommen; en zij legerden zich te Gilgal, aan het oosteinde van Jericho.", "Joz 10:6-10": "De mannen van Gibeon nu stuurden tot Jozua, in het leger van Gilgal, en zeiden: Trek uw handen niet terug van uw knechten, kom haastig tot ons op, en verlos ons, en help ons; want al de koningen van de Amorieten, die op het gebergte wonen, hebben zich tegen ons verzameld. Toen trok Jozua op van Gilgal, hij en al het krijgsvolk met hem, en alle strijdbare helden. Want de HEERE had tot Jozua gezegd: Vrees niet voor hen, want Ik heb ze in uw hand gegeven; niemand van hen zal voor uw aangezicht standhouden.", "Luk 12:22-32": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u: wees niet bezorgd voor uw leven, wat u eten zult, en ook niet voor het lichaam, waarmee u zich kleden zult. Het leven is meer dan het voedsel, en het lichaam meer dan de kleding. Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard?", "Matt 21:21": "Maar Jezus antwoordde en zei tegen hen: Voorwaar, Ik zeg u: Als u geloof hebt en niet twijfelt, zult u niet alleen doen wat er met de vijgenboom gebeurd is, maar ook, als u tegen deze berg zegt: Word opgeheven en in de zee geworpen! zal het gebeuren.", "Deut 26:17": "Heden hebt u de HEERE laten zeggen dat Hij u tot een God zal zijn, en dat u zult wandelen in Zijn wegen, en Zijn inzettingen houden, en Zijn geboden, en Zijn rechten, en dat u Zijn stem zult gehoorzamen.", "Jes 2:19-22": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken. Op die dag zal de mens zijn zilveren afgoden, en zijn gouden afgoden, die zij zich gemaakt hadden, om zich daarvoor neer te buigen, wegwerpen voor de mollen en de vleermuizen; Gaande in de reten van de rotsen, en in de kloven van de steenrotsen, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde geweldig te verschrikken.", "Obadja 1:18": "En het huis van Jakob zal een vuur zijn, en het huis van Jozef een vlam, en het huis van Ezau tot een stoppel; en zij zullen tegen hen ontbranden en hen verteren, zodat het huis van Ezau geen overgeblevene zal hebben; want de HEERE heeft het gesproken.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Deut 31:6-8": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten. En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven. De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Ps 139:7-10": "Waar zou ik heengaan voor Uw Geest, en waar zou ik heenvlieden voor Uw aangezicht? Als ik opvaar naar de hemel, U bent daar; of maak ik mijn bed in het rijk van de dood, zie, U bent daar. Nam ik vleugels van de dageraad, woonde ik aan het uiterste van de zee;", "Gen 37:14": "En hij zei tegen hem: Ga toch heen, zie naar het welzijn van uw broers en naar het welzijn van de kudde, en breng mij een woord terug. Zo zond hij hem uit het dal Hebron, en hij kwam te Sichem.", "Joz 10:24-27": "En het gebeurde, toen zij die koningen uitgebracht hadden tot Jozua, dat Jozua al de mannen van Israël riep, en hij zei tot de aanvoerders van het krijgsvolk, die met hem opgetrokken waren: Treed toe, zet uw voeten op de nekken van deze koningen. En zij traden toe, en zetten hun voeten op hun nekken. Toen zei Jozua tot hen: Vrees niet en wees niet ontsteld, wees sterk en heb goede moed; want zo zal de HEERE aan al uw vijanden doen, tegen wie u strijdt. En Jozua sloeg hen daarna, en doodde ze, en hing ze aan vijf bomen; en zij hingen aan de bomen tot de avond.", "Openb 9:1": "En de vijfde engel heeft op de bazuin geblazen, en ik zag een ster, gevallen uit de hemel op de aarde, en haar werd de sleutel gegeven van de put van het afgrond.", "Jes 28:21": "Want de HEERE zal Zich opmaken, zoals op de berg Perazim, Hij zal beroerd zijn, zoals in het dal van Gibeon, om Zijn werk te doen, Zijn werk zal vreemd zijn; en om Zijn daad te doen, Zijn daad zal vreemd zijn!", "Rom 16:20": "En de God van de vrede zal de satan spoedig onder uw voeten verpletteren. De genade van onze Heere Jezus Christus zij met u. Amen.", "Jes 35:3": "Versterkt de slappe handen, en maakt de struikelende knieën vast.", "1 Sam 15:33": "Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Ps 46:2": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.", "Amos 9:2": "Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen.", "Ezech 32:7": "En als Ik u zal uitblussen, zal Ik de hemel bedekken en zijn sterren zwart maken; Ik zal de zon met wolken bedekken, en de maan zal haar licht niet laten schijnen.", "Joz 10:28-43": "Op diezelfde dag nam Jozua ook Makkeda in, en sloeg haar met de scherpte van het zwaard; daartoe verbande hij haar koning, hen en elke ziel die daarin was; hij liet niemand overblijven; en hij deed de koning van Makkeda zoals hij de koning van Jericho gedaan had. Toen trok Jozua door, en heel Israël met hem, van Makkeda naar Libna, en hij streed tegen Libna. En de HEERE gaf haar ook in de hand van Israël, met haar koning; en hij sloeg haar met de scherpte van het zwaard, en elke ziel die daarin was; hij liet daarin niemand overblijven; en hij deed haar koning zoals hij de koning van Jericho gedaan had.", "2 Sam 12:26": "Joab nu streed tegen Rabba van de kinderen van Ammon; en hij nam de koninklijke stad in.", "Ps 62:9": "Vertrouw op Hem te allen tijde, o volk! Stort uw hart uit voor Zijn aangezicht; God is ons een Toevlucht. Sela.", "Richt 5:2": "Looft de HEERE, om het wreken van de wraken in Israël, om dat het volk zich gewillig heeft aangeboden.", "1 Sam 27:11": "En David liet geen man en geen vrouw in leven om naar Gath te brengen, en hij zei: Anders zouden zij misschien over ons vertellen en zeggen: Zo heeft David gedaan! En zo was zijn gewoonte, al de dagen dat hij in het land van de Filistijnen gewoond heeft.", "2 Sam 1:18": "toen hij gezegd had dat men de kinderen van Juda de boog moest leren; kijk, het is geschreven in het boek van de Oprechten.", "Ps 18:38-42": "Ik vervolgde mijn vijanden, en trof hen aan; en ik keerde niet weer, totdat ik hen verdaan had. Ik doorstak hen, zodat zij niet weer konden opstaan; zij vielen onder mijn voeten. Want U omgordde mij met kracht ten strijde; U deed onder mij nederbukken die tegen mij opstonden.", "Hand 9:24-27": "Maar hun plan werd Saulus bekend; en zij bewaakten de poorten, zowel overdag als 's nachts, om hem te kunnen doden. Maar de discipelen namen hem 's nachts en lieten hem neer door de muur, door hem in een mand te laten zakken. Toen Saulus in Jeruzalem gekomen was, probeerde hij zich bij de discipelen te voegen; maar zij waren allemaal bang voor hem, omdat zij niet geloofden dat hij een discipel was.", "Jer 42:11": "Vrees niet voor het aangezicht van de koning van Babel, voor wie u vreest; vrees niet voor hem, spreekt de HEERE; want Ik zal met u zijn, om u te behouden en u van zijn hand te redden.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "Jes 26:6": "De voet zal haar vertreden, de voeten van de ellendigen, de treden van de armen.", "Joz 8:29": "En de koning van Ai hing hij aan een paal, tot de avond; en omtrent het ondergaan van de zon gebood Jozua dat men zijn dode lichaam van de paal zou afnemen; en zij wierpen het bij de ingang van de stadspoort, en richtten daarop een grote steenhoop op, die er is tot op deze dag.", "2 Kon 19:6": "En Jesaja zei tegen hen: Zo zult u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bevreesd voor de woorden die u gehoord hebt, waarmee de dienaars van de koning van Assyrië Mij gelasterd hebben.", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Ps 74:17": "U hebt al de grenzen van de aarde gesteld; zomer en winter, die hebt U gevormd.", "Deut 2:34": "En wij namen in die tijd al zijn steden in, en wij verbanden alle steden, mannen, en vrouwen, en kinderen; wij lieten niemand overblijven.", "Jer 39:6": "En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda.", "Est 2:23": "Toen men de zaak onderzocht, werd het zo bevonden, en zij beiden werden aan een galg gehangen; en het werd in de kronieken geschreven voor het aangezicht van de koning.", "Openb 8:12": "En de vierde engel heeft op de bazuin geblazen, en het derde deel van de zon werd getroffen, en het derde deel van de maan, en het derde deel van de sterren; zodat het derde deel daarvan verduisterd zou worden, en het derde deel van de dag niet zou lichten; en van de nacht evenzo.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Hand 2:20": "De zon zal veranderd worden in duisternis, en de maan in bloed, voordat de grote en luisterrijke dag van de Heere komt.", "2 Kon 8:22": "De Edomieten bleven echter in opstand tegen het gezag van Juda, tot op deze dag; ook Libna kwam in dezelfde tijd in opstand.", "Joz 8:22-29": "Ook kwamen zij die uit de stad kwamen, hun tegemoet, zodat zij midden tussen de Israëlieten waren, dezen van hier en genen van daar; en zij sloegen hen, totdat er niemand van hen overbleef, noch iemand ontkwam. Doch de koning van Ai grepen zij levend, en zij brachten hem naar Jozua. En het gebeurde, toen de Israëlieten een einde gemaakt hadden aan het doden van alle inwoners van Ai, op het veld, in de woestijn, waarin zij hen nagejaagd hadden, en dat zij allen door de scherpte van het zwaard gevallen waren, totdat zij allen vernietigd waren; toen keerde heel Israël zich naar Ai, en zij sloegen haar met de scherpte van het zwaard.", "2 Kron 15:7": "Daarom, wees u sterk, en laat uw handen niet verslappen; want er is loon naar uw werk.", "2 Tim 2:3": "Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus.", "2 Kron 28:20": "En Tiglath-Pilneser, de koning van Assyrië, kwam tot hem; maar hij benauwde hem, en versterkte hem niet.", "Num 21:21-30": "Toen zond Israël boden tot Sihon, de koning van de Amorieten, en zei: Laat mij door uw land trekken. Wij zullen niet afwijken naar de akkers, noch naar de wijngaarden; wij zullen het water van de putten niet drinken; wij zullen op de koninklijke weg gaan, totdat wij uw grondgebied doorgetrokken zijn. Doch Sihon liet Israël niet toe door zijn gebied te trekken; maar Sihon verzamelde al zijn volk, en hij ging uit, Israël tegemoet, naar de woestijn, en hij kwam te Jahza, en streed tegen Israël;", "Jes 7:1-9": "Het gebeurde nu in de dagen van Achaz, de zoon van Jotham, de zoon van Uzzia, de koning van Juda, dat Rezin, de koning van Syrië, en Pekah, de zoon van Remalia, de koning van Israël, optrokken naar Jeruzalem, ten oorlog tegen haar; maar hij kon met strijden niet tegen haar op. Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind. En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller;", "Joz 10:28-40": "Op diezelfde dag nam Jozua ook Makkeda in, en sloeg haar met de scherpte van het zwaard; daartoe verbande hij haar koning, hen en elke ziel die daarin was; hij liet niemand overblijven; en hij deed de koning van Makkeda zoals hij de koning van Jericho gedaan had. Toen trok Jozua door, en heel Israël met hem, van Makkeda naar Libna, en hij streed tegen Libna. En de HEERE gaf haar ook in de hand van Israël, met haar koning; en hij sloeg haar met de scherpte van het zwaard, en elke ziel die daarin was; hij liet daarin niemand overblijven; en hij deed haar koning zoals hij de koning van Jericho gedaan had.", "Ps 115:11": "U die de HEERE vreest! vertrouw op de HEERE; Hij is hun Hulp en hun Schild.", "Num 21:14": "(Daarom wordt gezegd in het boek van de oorlogen van de HEERE: Tegen Waheb, in een wervelwind, en tegen de beken van Arnon,", "Jer 52:1": "Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, van Libna.", "Joz 10:3-26": "Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei: Kom op tot mij, en help mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen van Israël. Toen werden de vijf koningen van de Amorieten verzameld en trokken op, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en streden tegen haar.", "2 Kron 17:2": "En hij legde krijgsvolk in alle versterkte steden van Juda, en legde bezettingen in het land van Juda, en in de steden van Efraïm, die zijn vader Asa had ingenomen.", "2 Sam 10:19": "Toen nu alle koningen die knechten van Hadad-Ezer waren, zagen dat zij voor Israëls aangezicht geslagen waren, sloten zij vrede met Israël, en dienden hen; en de Syriërs vreesden de kinderen Ammons niet meer te verlossen.", "Ps 19:5": "Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.", "2 Sam 8:2": "Ook sloeg hij de Moabieten, en mat hen met een snoer, en liet hen op de aarde neerliggen; en hij mat met twee snoeren om te doden, en met een vol snoer om in het leven te laten. Zo werden de Moabieten David tot knechten, en zij brachten geschenken.", "Deut 3:8": "Zo namen wij in die tijd het land uit de hand van de twee koningen van de Amorieten, die aan deze kant van de Jordaan waren, van de beek Arnon tot de berg Hermon toe;", "2 Kon 20:10": "Toen zei Hizkia: Het is voor de schaduw makkelijk om tien graden naar beneden te gaan; nee, maar dat de schaduw tien graden achterwaarts keert.", "2 Kon 19:7": "Zie, Ik zal een geest in hem geven, zodat hij een gerucht zal horen en weer naar zijn land zal terugkeren; en Ik zal hem door het zwaard vellen in zijn land.", "Joël 2:21": "Vrees niet, o land! verheug u, en wees blijde; want de HEERE heeft grote dingen gedaan.", "1 Kron 7:24": "Zijn dochter nu was Seëra, die het lage en het hoge Beth-horon bouwde, en Uzzen-seëra.", "Jes 34:4": "En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.", "Joz 10:15-40": "Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal. Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda.", "Neh 4:14": "En ik zag toe, stond op, en zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Wees niet bang voor hen; denk aan die grote en ontzagwekkende Heere, en strijd voor uw broeders, uw zonen en uw dochters, uw vrouwen en uw huizen.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Ex 9:22-26": "Toen zei de HEERE tegen Mozes: Strek uw hand uit naar de hemel, en er zal hagel komen in heel Egypteland; over de mensen, en over het vee, en over al het gewas van het veld in Egypteland. Toen strekte Mozes zijn staf uit naar de hemel; en de HEERE gaf donder en hagel, en het vuur schoot naar de aarde; en de HEERE liet hagel regenen over Egypteland. En er was hagel, en vuur dat zich vermengde met de hagel; het was zeer zwaar; zoiets is in heel Egypteland nooit geweest, sinds het een volk geworden is.", "2 Sam 15:9": "Toen zei de koning tegen hem: Ga in vrede. Zo stond hij op, en ging naar Hebron.", "2 Kron 20:15": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.", "Joël 2:10": "De aarde is beroerd voor hun aangezicht, de hemel beeft; de zon en maan worden zwart, en de sterren trekken hun glans in.", "Jes 23:11": "Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Ef 6:10": "Vervolgens, mijn broeders, word krachtig in de Heere, en in de sterkte van Zijn macht.", "Openb 21:1": "En ik zag een nieuwe hemel en een nieuwe aarde; want de eerste hemel en de eerste aarde waren voorbijgegaan, en de zee was er niet meer.", "Hebr 10:31": "Vreselijk is het te vallen in de handen van de levende God.", "Num 13:22": "En zij trokken op in het zuiden, en kwamen tot Hebron toe, en daar waren Ahiman, Sesai en Talmai, kinderen van Enak; Hebron nu was zeven jaar eerder gebouwd dan Zoan in Egypte.", "2 Kon 4:24": "Toen zadelde zij de ezelin, en zei tegen haar knecht: Drijf aan, en ga voort; houd mij niet op met rijden, tenzij ik het u zeg.", "1 Kon 18:4": "Want het gebeurde, toen Izebel de profeten van de HEERE uitroeide, dat Obadja honderd profeten nam, en ze verborg bij vijftig man in een grot, en hen onderhield met brood en water.", "Openb 12:4": "En zijn staart trok het derde deel van de sterren van de hemel, en wierp die op de aarde. En de draak stond voor de vrouw, die baren zou, opdat hij haar kind zou verslinden, wanneer zij het gebaard zou hebben.", "Joz 2:9-13": "En zij sprak tot die mannen: Ik weet dat de HEERE u dit land gegeven heeft, en dat de schrik voor u op ons gevallen is, en dat alle inwoners van dit land voor u vergaan zijn van angst. Want wij hebben gehoord dat de HEERE het water van de Schelfzee heeft laten opdrogen voor u, toen u uit Egypte trok; en wat u gedaan hebt aan de twee koningen van de Amorieten, Sihon en Og, die aan de overkant van de Jordaan waren, die u met de ban geslagen hebt. Toen wij dat hoorden, versmolt ons hart, en er bleef geen moed meer over in iemand, vanwege uw aanwezigheid; want de HEERE, uw God, is een God boven in de hemel, en beneden op de aarde.", "Richt 8:21": "Toen zeiden Zebah en Tsalmuna: Sta zelf op en val ons aan, want zoals de man is, zo is zijn kracht. Toen stond Gideon op en doodde Zebah en Tsalmuna, en nam de maantjes die aan de halzen van hun kamelen zaten.", "Jes 9:13": "Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Spr 1:26": "Zo zal Ik ook in uw verderf lachen; Ik zal spotten, wanneer uw vrees komt.", "Openb 16:14": "Want het zijn geesten van duivelen, die tekenen doen, die uitgaan naar de koningen van de aarde en van de hele wereld, om hen te verzamelen voor de strijd van die grote dag van de Almachtige God.", "1 Kron 12:28": "En Zadok was een jongeman, een kloeke held; en uit zijn vaders huis waren tweeëntwintig leiders;", "Joz 14:14": "Daarom werd Hebron aan Kaleb, de zoon van Jefunne, de Keneziet, tot erfdeel tot op deze dag; omdat hij had volhard in het navolgen van de HEERE, de God van Israël.", "Num 21:34": "De HEERE nu zei tegen Mozes: Vrees hem niet; want Ik heb hem in uw hand gegeven, en al zijn volk, ook zijn land; en u zult hem doen, zoals u Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt.", "Spr 3:24-26": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn. Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt. Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.", "Matt 5:45": "opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen.", "Num 31:9-20": "Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit. Verder verbrandden zij al hun steden met hun woonplaatsen, en al hun burchten, met vuur. En zij namen alle buit en alle roof, van mensen en van beesten.", "Richt 1:10": "En Juda was heengetrokken tegen de Kanaänieten die in Hebron woonden (de naam van Hebron was voorheen Kirjath-arba), en zij versloegen Sesai, Ahiman, en Thalmai.", "Joz 6:24": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.", "Ps 107:40": "Hij stort verachting uit over de prinsen, en doet hen dwalen in het woeste, waar geen weg is.", "Joz 19:42": "En Saalabbin, en Ajalon, en Jithla,", "1 Kon 9:17": "Zo bouwde Salomo Gezer, en het lage Beth-horon.", "Ps 74:16": "De dag is van U, ook is de nacht van U; U hebt het licht en de zon bereid.", "2 Kron 20:17": "U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Job 9:7": "Die de zon gebiedt, en zij gaat niet op; en verzegelt de sterren;", "Deut 3:6": "En wij verbanden ze, zoals wij met Sihon, de koning van Hesbon, gedaan hadden, waarbij wij alle steden verbanden: mannen, vrouwen en kinderen.", "Joz 5:10": "Terwijl de kinderen van Israël te Gilgal gelegerd lagen, hielden zij het pascha op de veertiende dag van die maand, in de avond, op de vlakke velden van Jericho.", "Joz 18:21-28": "De steden nu van de stam van de kinderen van Benjamin, naar hun huisgezinnen, zijn: Jericho, en Beth-hogla, en Emek-keziz, En Beth-araba, en Zemaraim, en Beth-el, En Haavvim, en Para, en Ofra,", "Deut 1:7": "Keer u om, vertrek, en ga naar het gebergte van de Amorieten, en naar al hun buren, in het vlakke veld, op het gebergte, en in de laagte, en in het zuiden, en aan de kust van de zee; het land van de Kanaänieten, en de Libanon, tot aan die grote rivier, de rivier de Eufraat.", "Joz 19:40-48": "Het zevende lot kwam uit voor de stam van de kinderen van Dan, naar hun huisgezinnen. En het gebied van hun erfdeel was: Zora, en Esthaol, en Ir-semes, En Saalabbin, en Ajalon, en Jithla,", "Richt 1:36": "En het gebied van de Amorieten liep van de pas van Akrabbim, van de rots, en verder omhoog.", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "2 Kron 13:17": "Abia dan, en zijn volk, sloeg hen met een grote slag; want uit Israël vielen er vijfhonderdduizend gesneuvelde, uitgelezen mannen.", "2 Sam 21:6": "Laat ons zeven mannen van zijn zonen gegeven worden, zodat wij hen voor de HEERE ophangen te Gibea van Saul, o, u verkorene van de HEERE! En de koning zei: Ik zal hen geven.", "Openb 19:11-14": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid. En Zijn ogen waren als een vlam van het vuur, en op Zijn hoofd waren veel koninklijke hoeden; en Hij had een naam geschreven, die niemand wist, dan Hij Zelf. En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God.", "Deut 3:9": "(De Sidoniërs noemen Hermon Sirjon; maar de Amorieten noemen hem Senir.)", "1 Sam 13:18": "en een groep sloeg de weg in naar Beth-horon; en een groep sloeg de weg in naar het gebied dat uitziet op het dal Zeboim, naar de woestijn toe.", "Ps 37:5": "Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Mark 13:24": "Maar in die dagen, na die verdrukking, zal de zon verduisterd worden, en de maan zal haar licht niet geven.", "1 Kon 15:20": "En Benhadad luisterde naar de koning Asa, en zond de leiders van de legers die hij had tegen de steden van Israël; en sloeg Ijon, en Dan, en Abel-Beth-Maächa, en het gehele Cinneroth, met het gehele land Nafthali.", "Joz 11:15": "Zoals de HEERE Mozes, Zijn dienaar, geboden had, zo gebood Mozes aan Jozua; en zo deed Jozua; hij liet niets achterwege van alles wat de HEERE Mozes geboden had.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "1 Kon 3:5": "Te Gibeon verscheen de HEERE aan Salomo in een droom 's nachts, en God zei: Vraag wat Ik u geven zal.", "Joz 8:27": "Alleen roofden de Israëlieten voor zichzelf het vee en de buit van die stad, naar het woord van de HEERE, dat Hij Jozua geboden had.", "2 Kron 18:3": "Want Achab, de koning van Israël, zei tegen Josafat, de koning van Juda: Zult u met mij meegaan naar Ramoth in Gilead? En hij zei tegen hem: Ik zal zijn zoals u bent, en zoals uw volk is, zo zal mijn volk zijn, en wij zullen met u zijn in deze strijd.", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Spr 3:5": "Vertrouw op de HEERE met heel uw hart, en steun op uw eigen verstand niet.", "Matt 6:25-34": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding? Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven? Wie van u kan, door bezorgd te zijn, één el aan zijn lengte toevoegen?", "Jes 43:4": "Van toen af, dat u kostbaar bent geweest in Mijn ogen, bent u verheerlijkt geweest, en Ik heb u liefgehad; daarom heb Ik mensen in uw plaats gegeven, en volken in plaats van uw ziel.", "Gen 40:19": "Binnen nog drie dagen zal Farao uw hoofd van u verheffen, en hij zal u aan een paal hangen, en het gevogelte zal uw vlees van u eten.", "Ex 14:14": "De HEERE zal voor u strijden, en u zult stil zijn.", "2 Sam 21:9": "En hij gaf hen in de hand van de Gibeonieten, die hen ophingen op de berg voor het aangezicht van de HEERE; en die zeven vielen tegelijk; en zij werden gedood in de dagen van de oogst, in de eerste dagen, in het begin van de gersteoogst.", "Joz 10:12-14": "Toen sprak Jozua tot de HEERE, op de dag toen de HEERE de Amorieten voor het aangezicht van de kinderen van Israël overgaf, en hij zei voor de ogen van de Israëlieten: Zon, sta stil te Gibeon, en u, maan, in het dal van Ajalon! En de zon stond stil, en de maan bleef staan, totdat het volk zich op zijn vijanden gewroken had. Is dit niet geschreven in het boek van de oprechten? De zon nu stond stil in het midden van de hemel, en haastte zich niet om onder te gaan, ongeveer een volle dag. En er was geen dag aan deze gelijk, ervoor of erna, dat de HEERE de stem van een man zó verhoorde; want de HEERE streed voor Israël.", "Jes 24:23": "En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Jer 8:14": "Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.", "Joz 7:26": "En zij richtten over hem een grote steenhoop op, die er tot op deze dag nog is. Zo keerde de HEERE zich af van de gloed van Zijn toorn. Daarom noemde men de naam van die plaats het dal van Achor, tot op deze dag toe.", "1 Kron 20:3": "Hij bracht ook al het volk dat daarin was naar buiten, en hij zaagde hen met de zaag, en met ijzeren dorswagens, en met bijlen; en zo deed David met al de steden van de kinderen Ammons. Toen keerde David met al het volk terug naar Jeruzalem.", "Jes 2:10-12": "Ga in de rotssteen, en verberg u in het stof, vanwege de schrik van de HEERE, en om de heerlijkheid van Zijn majesteit. De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn. Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt;", "Deut 7:17-21": "Als u in uw hart zei: Deze volken zijn groter dan ik; hoe zou ik hen uit hun bezit kunnen verdrijven? — wees niet bevreesd voor hen; denk goed terug aan wat de HEERE, uw God, aan de farao en aan alle Egyptenaren gedaan heeft; de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.", "Openb 11:19": "En de tempel van God in de hemel is geopend, en de ark van het verbond is gezien in Zijn tempel; en er kwamen bliksems, en stemmen, en donderslagen, en aardbeving, en grote hagel.", "Joz 9:25": "En nu, zie, wij zijn in uw hand; doe met ons zoals het goed en recht is in uw ogen om te doen.", "Joël 2:31": "De zon zal veranderd worden in duisternis, en de maan in bloed, voordat die grote en vreselijke dag van de HEERE komt.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Richt 1:3": "Toen zei Juda tegen zijn broeder Simeon: Trek met mij op in mijn lot, en laten we tegen de Kanaänieten strijden, dan zal ik ook met u optrekken in uw lot. Zo ging Simeon met hem mee.", "2 Sam 2:11": "Het getal nu van de dagen dat David koning geweest is te Hebron, over het huis van Juda, is zeven jaar en zes maanden.", "1 Sam 7:10-12": "En het gebeurde, terwijl Samuël dat brandoffer offerde, dat de Filistijnen naderden ten strijde tegen Israël; en de HEERE donderde die dag met een grote donder over de Filistijnen, en Hij bracht hen in verwarring, zodat zij verslagen werden voor het aangezicht van Israël. En de mannen van Israël trokken uit vanuit Mizpa, en vervolgden de Filistijnen, en zij sloegen hen tot onder Beth-kar. Samuël nam toen een steen, en zette die tussen Mizpa en Sen, en noemde hem Eben-haezer; en hij zei: Tot hiertoe heeft de HEERE ons geholpen.", "Job 31:27": "En mijn hart verlokt is geweest in het verborgen, dat mijn hand mijn mond gekust heeft;", "Ex 15:14-16": "De volken hebben het gehoord, zij zullen sidderen; angst heeft de inwoners van Palestina bevangen. Dan zullen de vorsten van Edom verbaasd zijn; beving zal de machtigen van de Moabieten bevangen; alle inwoners van Kanaän zullen wegsmelten! Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Zach 9:5": "Askelon zal het zien, en zal vrezen; evenzo Gaza, en zal grote smart hebben, alsook Ekron, omdat hetgeen waar zij op zagen, hen te schande heeft gemaakt; en de koning van Gaza zal vergaan, en Askelon zal niet bewoond worden.", "Ezech 13:11": "Zeg tegen hen die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en u, grote hagelstenen, zult vallen, en een grote stormwind zal hem splijten.", "Ex 11:7": "Maar bij alle kinderen van Israël zal geen hond zijn tong bewegen, van de mensen af tot de beesten toe; opdat u weet dat de HEERE tussen de Egyptenaren en tussen de Israëlieten een afzondering maakt.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Joh 15:19": "Als u van de wereld was, zou de wereld het hare liefhebben; maar omdat u van de wereld niet bent, maar Ik u uit de wereld heb uitverkoren, daarom haat de wereld u.", "Num 31:7-17": "En zij streden tegen de Midianieten, zoals de HEERE Mozes geboden had, en zij doodden alles wat mannelijk was. Daarbij doodden zij, behalve hun overige gesneuvelden, de koningen van de Midianieten: Evi, en Rekem, en Zur, en Hur, en Reba, vijf koningen van de Midianieten; ook doodden zij met het zwaard Bileam, de zoon van Beor. Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit.", "2 Tim 3:12": "En ook allen die godzalig willen leven in Christus Jezus, die zullen vervolgd worden.", "2 Kon 18:17": "Evenwel zond de koning van Assyrië Tartan, en Rabsaris, en Rabsake, van Lachis naar de koning Hizkia, met een zwaar leger naar Jeruzalem; en zij trokken op, en kwamen naar Jeruzalem. En toen zij optrokken en gekomen waren, bleven zij staan bij de watergang van de opperste vijver, die bij de hoge weg van het veld der vollers is.", "Jes 41:5-7": "De eilanden zagen het, en zij vreesden; de einden van de aarde beefden; zij naderden en kwamen toe. De een hielp de ander, en zei tegen zijn metgezel: Wees sterk! En de werkmeester versterkte de goudsmid; hij die met de hamer glad maakt, hem die op het aambeeld slaat, en zei van het soldeersel: Het is goed; daarna maakt hij het vast met spijkers, zodat het niet wankelt.", "Ps 46:12": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Joz 11:20": "Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.", "2 Kon 8:12": "Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden.", "Matt 21:22": "En alles wat u in het gebed zult vragen, in geloof, zult u ontvangen.", "Ps 78:55": "En Hij verdreef voor hun aangezicht de heidenen, en liet hen vallen in het snoer van hun erfenis, en liet de stammen van Israël in hun tenten wonen.", "2 Sam 5:1-5": "Toen kwamen alle stammen van Israël naar David in Hebron, en zij zeiden: Zie, wij zijn uw gebeente en uw vlees. Ook al eerder, toen Saul koning over ons was, was u het die Israël uitleidde en terugbracht; ook heeft de HEERE tegen u gezegd: U zult Mijn volk Israël weiden, en u zult een leider zijn over Israël. Zo kwamen alle oudsten van Israël naar de koning in Hebron; en koning David sloot met hen een verbond in Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël.", "Ex 23:31-33": "En Ik zal uw grenzen vaststellen van de Schelfzee tot aan de zee van de Filistijnen, en van de woestijn tot aan de rivier; want Ik zal de inwoners van dat land in uw hand geven, zodat u hen voor uw aangezicht wegjaagt. U zult met hen, noch met hun goden, een verbond sluiten. Zij zullen in uw land niet wonen, opdat zij u niet tegen Mij laten zondigen; als u hun goden dient, zal het u zeker tot een valstrik zijn.", "2 Sam 12:31": "Het volk dat daarin was, voerde hij naar buiten, en zette hen aan het werk met zagen, en met ijzeren dorswagens, en met ijzeren bijlen, en liet hen door de steenoven gaan; en zo deed hij met alle steden van de kinderen van Ammon. Daarna keerde David, met heel het volk, terug naar Jeruzalem.", "Hand 21:28": "En riepen: Israëlitische mannen, kom te hulp! Dit is de man die overal iedereen leert tegen het volk, en de wet, en deze plaats; en bovendien heeft hij ook Grieken de tempel binnengebracht, en heeft deze heilige plaats ontheiligd.", "Jes 35:4": "Zegt tegen de onbedachtzamen van hart: Wees sterk, en vrees niet; zie, uw God zal ter wrake komen met de vergelding van God. Hij zal komen en u verlossen.", "Openb 2:26": "En wie overwint, en Mijn werken tot het einde toe bewaart, hem zal Ik macht geven over de heidenen;", "Richt 8:20": "En hij zei tegen Jether, zijn eerstgeborene: Sta op, dood hen; maar de jongeman trok zijn zwaard niet, want hij was bang, omdat hij nog een jongeman was.", "Num 13:29": "De Amalekieten wonen in het land van het zuiden; maar de Hethieten, en de Jebusieten, en de Amorieten wonen op het gebergte; en de Kanaänieten wonen aan de zee, en aan de oever van de Jordaan.", "Joz 15:63": "Maar de kinderen van Juda konden de Jebusieten, inwoners van Jeruzalem, niet verdrijven; zo woonden de Jebusieten bij de kinderen van Juda te Jeruzalem, tot op deze dag.", "Jes 60:11": "En uw poorten zullen steeds openstaan, zij zullen overdag of 's nachts niet gesloten worden, opdat men bij u het leger van de heidenen inbrengt, en hun koningen naar u toe geleid worden.", "Deut 7:2": "en de HEERE, uw God, hen aan u zal hebben overgegeven, zodat u hen verslaat, dan moet u hen helemaal met de ban vernietigen; u zult geen verbond met hen maken, en hun ook niet genadig zijn.", "Richt 16:1": "Simson ging weg naar Gaza; en hij zag daar een vrouw, die een hoer was; en hij ging naar haar toe.", "Num 34:4": "En deze grens zal voor u omgaan van het zuiden naar de opgang van Akrabbim, en doorgaan naar Zin; en haar uiteinden zullen zijn, vanaf het zuiden naar Kades-Barnea; en zij zal uitgaan naar Hazar-Addar, en doorgaan naar Azmon.", "Spr 24:11": "Red hen die ter dood gegrepen zijn; want zij wankelen ter doding, als u zich onthoudt.", "1 Sam 11:9-11": "Toen zeiden zij tegen de boden die gekomen waren: Zo zult u tegen de mannen van Jabes in Gilead zeggen: Morgen, als de zon heet is geworden, zal aan u verlossing gebeuren. Toen de boden kwamen en dit aan de mannen van Jabes verkondigden, werden zij blij. En de mannen van Jabes zeiden: Morgen zullen wij naar u uitgaan, en u zult met ons doen naar alles wat goed is in uw ogen. Het gebeurde nu de volgende dag, dat Saul het volk in drie groepen indeelde, en zij kwamen midden in het leger, tijdens de morgenwake, en zij versloegen Ammon, totdat de dag heet werd; en het gebeurde dat de overgeblevenen zo verstrooid werden, dat er onder hen geen twee samen bleven.", "Joz 12:13": "De koning van Debir, één; de koning van Geder, één;", "Joz 2:24": "En zij zeiden tegen Jozua: Zeker, de HEERE heeft dat hele land in onze handen gegeven; want ook alle inwoners van het land zijn voor ons vergaan van angst.", "Ps 31:25": "Wees sterk, en Hij zal uw hart versterken, allen u, die op de HEERE hoopt!", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Ps 149:8": "om hun koningen te binden met ketenen, en hun aanzienlijken met ijzeren boeien,", "Joz 10:15-26": "Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal. Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda.", "1 Sam 17:1": "En de Filistijnen verzamelden hun leger ten strijde, en verzamelden zich te Socho, dat in Juda ligt; en zij legerden zich tussen Socho en Azeka, aan het einde van Dammim.", "1 Kron 20:4": "En het gebeurde daarna, toen de oorlog met de Filistijnen bij Gezer opstond, dat Sibchai, de Husathiet, toen Sippai versloeg, die van de kinderen van Rafa was; en zij werden onderworpen.", "Luk 23:45": "En de zon werd verduisterd, en het voorhangsel van de tempel scheurde middendoor.", "2 Kon 10:11": "Daartoe sloeg Jehu al de overgeblevenen van het huis van Achab te Jizreël, en al zijn groten, en zijn bekenden, en zijn priesters; totdat hij hem geen overigen liet overblijven.", "2 Tim 4:17": "Maar de Heere heeft mij bijgestaan en heeft mij kracht gegeven; opdat door mij de prediking ten volle bekend zou worden, en alle heidenen die zouden horen. En ik ben uit de muil van de leeuw verlost.", "1 Sam 11:14": "Verder zei Samuël tegen het volk: Komt, laten wij naar Gilgal gaan, en het koninkrijk daar vernieuwen.", "Joz 23:3": "En u hebt gezien alles, wat de HEERE, uw God, gedaan heeft aan al deze volken voor uw aangezicht; want de HEERE, uw God, Zelf, is het, Die voor u gestreden heeft.", "1 Kron 11:7": "David nu woonde op de burcht; daarom noemt men die de stad van David.", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Mark 13:25": "En de sterren van de hemel zullen daaruit vallen, en de krachten die in de hemelen zijn, zullen bewogen worden.", "Joz 15:35": "Jarmuth, en Adullam, Socho en Azeka,", "Joz 12:10-13": "De koning van Jeruzalem, één; de koning van Hebron, één; De koning van Jarmuth, één; de koning van Lachis, één; De koning van Eglon, één; de koning van Gezer, één;", "2 Kron 20:1": "Het gebeurde nu hierna, dat de kinderen van Moab, en de kinderen van Ammon, en met hen anderen naast de Ammonieten, tegen Josafat kwamen om te strijden.", "2 Kron 11:10-12": "En Zora, en Ajalon, en Hebron; dit waren de vaste steden in Juda en in Benjamin. En hij versterkte deze vestingen, en stelde er leiders in aan, en voorraden voedsel, en olie, en wijn; En in elke stad rondassen en speren, en hij versterkte ze buitengewoon; zo waren Juda en Benjamin van hem.", "Joz 21:13": "Zo gaven zij aan de kinderen van de priester Aäron de vrijstad voor de doodslager, Hebron en haar voorsteden, en Libna en haar voorsteden;", "2 Kron 11:9": "En Adoraim, en Lachis, en Azeka,", "Joz 10:16-18": "Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda.
