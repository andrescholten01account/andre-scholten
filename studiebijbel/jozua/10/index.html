En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda. Toen zei Jozua: Rol grote stenen voor de opening van de grot, en zet mannen ervoor om hen te bewaken.", "Joz 18:13": "En vandaar gaat het gebied door naar Luz, aan de zijde van Luz (dat is Beth-el), zuidwaarts; en dit gebied gaat af naar Atroth-addar, aan de berg, die aan de zuidzijde van het benedenste Beth-horon is.", "Matt 24:29": "En meteen na de verdrukking van die dagen zal de zon verduisterd worden, en de maan zal haar licht niet geven, en de sterren zullen van de hemel vallen, en de krachten van de hemelen zullen beven.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Zef 3:16": "Op die dag zal tegen Jeruzalem gezegd worden: Vrees niet, o Sion! Laat uw handen niet slap worden.", "Mal 4:3": "En u zult de goddelozen vertreden, want zij zullen as worden onder de zolen van uw voeten, op die dag die Ik maken zal, zegt de HEERE van de heerscharen.", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "Joz 12:11": "De koning van Jarmuth, één; de koning van Lachis, één;", "Openb 6:12": "En ik zag, toen Het het zesde zegel geopend had, en zie, er werd een grote aardbeving; en de zon werd zwart als een haren zak, en de maan werd als bloed.", "2 Kron 17:19": "Dezen waren in dienst van de koning; behalve degenen die de koning in de versterkte steden door heel Juda gezet had.", "Spr 1:27": "Wanneer uw vrees komt als een verwoesting, en uw verderf aankomt als een wervelwind; wanneer benauwdheid en angst u overkomt;", "Num 13:26": "En zij gingen heen, en kwamen tot Mozes en tot Aäron, en tot de hele vergadering van de kinderen van Israël, in de woestijn van Paran, naar Kades; en brachten hun bescheid terug, aan hen en aan de hele vergadering, en lieten hun de vrucht van het land zien.", "Job 35:14": "Dat u ook gezegd hebt: U zult Hem niet aanschouwen; er is toch een oordeel voor Zijn aangezicht, wacht u dan op Hem.", "Est 7:9": "En Charbona, een van de kamerlingen, die voor het aanschijn van de koning stond, zei: Ook zie, de galg, die Haman gemaakt heeft voor Mordechai, die goed voor de koning gesproken heeft, staat bij Hamans huis, vijftig el hoog. Toen zei de koning: Hang hem daaraan.", "Hand 8:26": "En een engel van de Heere sprak tot Filippus en zei: Sta op, en ga naar het zuiden, op de weg die van Jeruzalem afdaalt naar Gaza, die woest is.", "Hos 14:1": "Samaria zal woest worden, want zij is opstandig geweest tegen haar God; zij zullen door het zwaard vallen, hun kinderen zullen verpletterd, en hun zwangere vrouwen zullen opengesneden worden.", "Hand 9:23": "En toen er veel dagen verlopen waren, spanden de Joden samen om hem te doden.", "Jer 34:7": "Toen het leger van de koning van Babel streed tegen Jeruzalem, en tegen alle overgebleven steden van Juda, tegen Lachis en tegen Azeka; want deze, zijnde vaste steden, waren overgebleven onder de steden van Juda.", "Gen 19:24": "Toen liet de HEERE zwavel en vuur over Sodom en Gomorra regenen, van de HEERE uit de hemel.", "Joz 8:25": "En het gebeurde dat allen die op die dag vielen, zowel mannen als vrouwen, twaalfduizend waren, allemaal mensen van Ai.", "Ps 125:2": "Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid.", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Matt 17:18-20": "En Jezus bestrafte hem, en de duivel ging uit hem weg, en het kind werd vanaf dat moment genezen. Toen kwamen de discipelen apart naar Jezus toe en zeiden: Waarom konden wij hem niet uitdrijven? En Jezus zei tegen hen: Vanwege uw ongeloof; want voorwaar, Ik zeg u: als u een geloof had als een mosterdzaad, zou u tegen deze berg zeggen: Ga van hier daarheen, en hij zou gaan; en niets zou voor u onmogelijk zijn.", "Amos 1:13": "Zo zegt de HEERE: Om drie overtredingen van de kinderen van Ammon, en om vier zal Ik dat niet afwenden; omdat zij de zwangere vrouwen van Gilead hebben opengesneden, om hun grondgebied te vergroten.", "Richt 16:21": "Toen grepen de Filistijnen hem, en groeven zijn ogen uit; en zij voerden hem af naar Gaza, en bonden hem met twee koperen ketenen, en hij moest malen in de gevangenis.", "Num 32:8": "Zo deden uw vaders, toen ik hen van Kades-Barnea zond om dit land te bezien.", "2 Tim 4:2": "Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs.", "Deut 1:19": "Toen vertrokken wij van Horeb, en trokken door die hele grote en vreselijke woestijn, die u gezien hebt, op de weg van het gebergte van de Amorieten, zoals de HEERE, onze God, ons geboden had; en wij kwamen bij Kades-Barnea.", "Neh 11:30": "Zanoah, Adullam en haar dorpen, Lachis en haar akkers, Azeka en haar onderhorige plaatsen; en zij legerden zich van Berseba af tot aan het dal Hinnom.", "Job 19:10": "Hij heeft mij van rondom afgebroken, zodat ik heenga, en heeft mijn verwachting als een boom weggerukt.", "Ex 34:12": "Wacht u ervoor dat u toch geen verbond maakt met de inwoner van het land, waarin u komen zult; dat hij misschien niet tot een valstrik wordt in uw midden.", "Zach 4:7": "Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!", "Deut 9:23": "Verder, toen de HEERE u zond uit Kades-barnea en zei: Ga op en erf dat land dat Ik u gegeven heb; toen was u opstandig tegen het bevel van de HEERE, uw God, en geloofde Hem niet, en was Zijn stem niet gehoorzaam.", "1 Kon 19:9": "En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?", "2 Tim 4:18": "En de Heere zal mij verlossen van alle slecht werk, en bewaren tot Zijn hemels Koninkrijk; aan Hem zij de heerlijkheid, tot in alle eeuwigheid. Amen.", "Openb 6:12-14": "En ik zag, toen Het het zesde zegel geopend had, en zie, er werd een grote aardbeving; en de zon werd zwart als een haren zak, en de maan werd als bloed. En de sterren van de hemel vielen op de aarde, zoals een vijgenboom zijn onrijpe vijgen afwerpt, als hij door een grote wind geschud wordt. En de hemel is weggeweken, als een boek, dat opgerold wordt; en alle bergen en eilanden zijn bewogen uit hun plaatsen.", "Openb 20:8-10": "En hij zal uitgaan om de volken te verleiden, die in de vier hoeken van de aarde zijn, Gog en Magog, om hen te verzamelen tot de strijd; hun aantal is als het zand aan de zee. En zij kwamen op over de breedte van de aarde, en omringden de legerplaats van de heiligen, en de geliefde stad; en er kwam vuur neer van God uit de hemel, en heeft hen verslonden. En de duivel, die hen verleidde, werd geworpen in de poel van het vuur en sulfer, waar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.", "Richt 1:11-15": "En vandaar was hij heengetrokken tegen de inwoners van Debir; de naam van Debir was voorheen Kirjath-sefer. En Kaleb zei: Wie Kirjath-sefer verslaat, en het inneemt, aan hem zal ik mijn dochter Achsa tot vrouw geven. Toen nam Othniël het in, de zoon van Kenaz, broeder van Kaleb, die jonger was dan hij; en Kaleb gaf hem Achsa, zijn dochter, tot vrouw.", "1 Sam 6:17": "Dit nu zijn de gouden gezwellen die de Filistijnen aan de HEERE als schuldoffer teruggegeven hebben: voor Asdod één, voor Gaza één, voor Askelon één, voor Gath één, voor Ekron één.", "Joz 19:1-8": "Daarna kwam het tweede lot uit voor Simeon, voor de stam van de kinderen van Simeon, naar hun huisgezinnen; en hun erfdeel was in het midden van het erfdeel van de kinderen van Juda. En zij hadden in hun erfdeel: Beer-seba, en Seba, en Molada, En Hazar-sual, en Bala, en Azem,", "Joz 14:12": "En nu, geef mij dit gebergte, waarvan de HEERE op die dag gesproken heeft; want u hebt op diezelfde dag gehoord dat de Enakieten daar waren, en dat er grote versterkte steden waren; misschien is de HEERE met mij, zodat ik hen verdrijf, zoals de HEERE gesproken heeft.", "1 Sam 27:5": "En David zei tegen Achis: Als ik nu genade gevonden heb in uw ogen, laat men mij een plaats geven in een van de steden van het land, zodat ik daar kan wonen; want waarom zou uw knecht bij u in de koninklijke stad wonen?", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Deut 7:16": "U zult dan al die volken verteren, die de HEERE, uw God, u geven zal; uw oog zal hen niet ontzien, en u zult hun goden niet dienen; want dat zou u een valstrik zijn.", "Joz 4:9": "Jozua richtte ook twaalf stenen op, midden in de Jordaan, op de standplaats van de voeten van de priesters die de ark van het verbond droegen; en zij zijn daar tot op deze dag.", "Openb 12:3": "En er werd een ander teken gezien in de hemel; en zie, er was een grote rode draak, met zeven hoofden en tien horens, en op zijn hoofden zeven koninklijke kronen.", "Micha 1:13": "Span de snelle dieren aan de wagen, u inwoners van Lachis! (Deze is van de dochter van Sion het beginsel van de zonde) want in u zijn Israëls overtredingen gevonden.", "1 Sam 15:3-9": "Ga nu heen, en sla Amalek, en verban alles wat hij heeft, en verschoon hem niet; maar dood van de man af tot de vrouw toe, van de kinderen tot de zuigelingen, van de ossen tot de schapen, van de kamelen tot de ezels toe. Dit verkondigde Saul aan het volk, en hij telde hen te Telaïm, tweehonderdduizend man van het voetvolk, en tienduizend man van Juda. Toen Saul tot aan de stad Amalek kwam, legde hij een hinderlaag in het dal.", "Ps 80:4": "O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden.", "Num 33:20": "En zij vertrokken van Rimmon-perez, en legerden zich in Libna.", "Jer 50:30": "Daarom zullen haar jongelingen vallen op haar straten, en al haar krijgslieden zullen op die dag uitgeroeid worden, spreekt de HEERE.", "Gen 14:7": "Daarna keerden zij terug en kwamen bij En-mispat, dat is Kades, en versloegen heel het land van de Amalekieten, en ook de Amoriet, die te Hazezon-thamar woonde.", "2 Kon 19:8": "Zo kwam Rabsake terug en trof de koning van Assyrië aan, strijdend tegen Libna; want hij had gehoord dat hij uit Lachis vertrokken was.", "Ps 77:19": "Het geluid van uw donder was rondom; de bliksemen verlichtten de wereld; de aarde werd beroerd en daverde.", "Joz 10:11-14": "Het gebeurde nu, toen zij voor het aangezicht van Israël vluchtten, terwijl ze in de afdaling van Beth-horon waren, dat de HEERE grote stenen op hen wierp van de hemel, tot Azeka toe, zodat zij stierven; er waren er meer die van de hagelstenen stierven, dan die de kinderen van Israël met het zwaard doodden. Toen sprak Jozua tot de HEERE, op de dag toen de HEERE de Amorieten voor het aangezicht van de kinderen van Israël overgaf, en hij zei voor de ogen van de Israëlieten: Zon, sta stil te Gibeon, en u, maan, in het dal van Ajalon! En de zon stond stil, en de maan bleef staan, totdat het volk zich op zijn vijanden gewroken had. Is dit niet geschreven in het boek van de oprechten? De zon nu stond stil in het midden van de hemel, en haastte zich niet om onder te gaan, ongeveer een volle dag.", "2 Kon 20:11": "En Jesaja, de profeet, riep de HEERE aan; en Hij deed de schaduw tien graden achterwaarts keren, in de graden waarin zij naar beneden gegaan was, op de zonnewijzer van Achaz.", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "Joz 6:21": "En zij verbanden alles wat in de stad was, van de man tot de vrouw toe, van het kind tot de oude, en tot de os, en het kleinvee, en de ezel, door de scherpte van het zwaard.", "1 Kor 15:25": "Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.", "Klaagl 3:34": "Lamed. Dat men al de gevangenen van de aarde onder Zijn voeten verbrijzelt;", "Deut 21:22": "Verder, wanneer iemand een zonde heeft begaan die de doodstraf verdient, zodat hij gedood wordt, en u hem aan het hout hebt opgehangen;", "Micha 7:17": "Zij zullen het stof lekken, als de slang; als kruipende dieren van de aarde, zullen zij sidderend tevoorschijn komen uit hun schuilhoeken; zij zullen met vervaardheid komen tot de HEERE, onze God, en zullen voor U vrezen.", "Joz 15:51": "en Gosen, en Holon, en Gilo; elf steden en haar dorpen.", "2 Sam 17:13": "En als hij zich in een stad terugtrekt, zal heel Israël koorden naar die stad brengen, en wij zullen hem tot in de beek neertrekken, totdat ook niet een steentje daar meer gevonden wordt.", "Openb 8:10-12": "En de derde engel heeft op de bazuin geblazen, en er is een grote ster, brandend als een fakkel, uit de hemel gevallen, en zij is gevallen op het derde deel van de rivieren, en op de bronnen van het water. En de naam van de ster wordt Alsem genoemd; en het derde deel van het water werd tot alsem; en veel mensen zijn gestorven van het water, want het was bitter geworden. En de vierde engel heeft op de bazuin geblazen, en het derde deel van de zon werd getroffen, en het derde deel van de maan, en het derde deel van de sterren; zodat het derde deel daarvan verduisterd zou worden, en het derde deel van de dag niet zou lichten; en van de nacht evenzo.", "Joz 10:29-32": "Toen trok Jozua door, en heel Israël met hem, van Makkeda naar Libna, en hij streed tegen Libna. En de HEERE gaf haar ook in de hand van Israël, met haar koning; en hij sloeg haar met de scherpte van het zwaard, en elke ziel die daarin was; hij liet daarin niemand overblijven; en hij deed haar koning zoals hij de koning van Jericho gedaan had. Toen trok Jozua verder, en heel Israël met hem, van Libna naar Lachis; en hij belegerde haar en streed tegen haar.", "Ps 21:9": "Uw hand zal alle vijanden vinden; uw rechterhand zal uw haters vinden.", "Spr 22:29": "Hebt u een man gezien die vaardig is in zijn werk? Hij zal voor koningen komen te staan; hij zal niet voor onaanzienlijke mensen staan.", "1 Kon 19:13": "En het gebeurde, toen Elia dat hoorde, dat hij zijn gezicht bedekte met zijn mantel, en naar buiten ging, en ging staan in de ingang van de grot. En zie, een stem kwam tot hem, die zei: Wat doet u hier, Elia?", "Richt 3:13": "En hij verzamelde bij zich de kinderen van Ammon en de Amalekieten, en hij trok op en sloeg Israël, en zij namen de Palmstad in bezit.", "Job 9:6-9": "Die de aarde beweegt uit haar plaats, zodat haar pilaren schudden; Die de zon gebiedt, en zij gaat niet op; en verzegelt de sterren; Die alleen de hemelen uitbreidt, en treedt op de hoogten van de zee;", "2 Kon 16:9": "Zo luisterde de koning van Assyrië naar hem; want de koning van Assyrië trok op tegen Damaskus, en nam het in, en voerde de bevolking gevankelijk weg naar Kir, en hij doodde Rezin.", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "Job 31:26": "Als ik het licht aangezien heb, wanneer het scheen, of de maan heerlijk voortgaande;", "Ps 136:7-9": "Hem, Die de grote lichten heeft gemaakt; want Zijn goedertierenheid is voor eeuwig. De zon om te heersen op de dag; want Zijn goedertierenheid is voor eeuwig. De maan en sterren om te heersen in de nacht; want Zijn goedertierenheid is voor eeuwig.", "Joz 11:8": "En de HEERE gaf hen in de hand van Israël, en zij versloegen hen, en achtervolgden hen tot aan groot Sidon toe, en tot Misrefoth-maim, en tot het dal Mizpa tegen het oosten; en zij versloegen hen, totdat zij niemand van hen lieten overblijven.", "Richt 1:1-36": "En het gebeurde na de dood van Jozua, dat de Israëlieten de HEERE vroegen: Wie zal onder ons het eerst optrekken naar de Kanaänieten, om tegen hen te strijden? En de HEERE zei: Juda zal optrekken; zie, Ik heb dat land in zijn hand gegeven. Toen zei Juda tegen zijn broeder Simeon: Trek met mij op in mijn lot, en laten we tegen de Kanaänieten strijden, dan zal ik ook met u optrekken in uw lot. Zo ging Simeon met hem mee.", "Richt 6:2": "Toen de hand van de Midianieten sterk werd over Israël, maakten de Israëlieten voor zichzelf, vanwege de Midianieten, de holen die in de bergen zijn, en de spelonken, en de vestingen.", "Spr 16:3": "Wentel uw werken op de HEERE, en uw gedachten zullen bevestigd worden.", "Num 25:4": "En de HEERE zei tot Mozes: Neem alle hoofden van het volk, en hang hen op voor de HEERE tegen de zon, zo zal de gloed van de toorn van de HEERE gekeerd worden van Israël.", "Joz 6:17": "Doch deze stad zal de HEERE verbannen zijn, zij en al wat daarin is; alleen zal de hoer Rachab levend blijven, zij en allen die met haar in het huis zijn, omdat zij de boden, die wij uitgezonden hadden, verborgen heeft.", "Joz 15:13": "Doch Kaleb, de zoon van Jefunne, had hij een deel gegeven te midden van de kinderen van Juda, naar het bevel van de HEERE tot Jozua, de stad van Arba, vader van Enak, dat is Hebron.", "Jes 50:10": "Wie is er onder u, die de HEERE vreest, die naar de stem van Zijn Knecht luistert? Als hij in de duisternis wandelt, en geen licht heeft, laat hij vertrouwen op de Naam van de HEERE en steunen op zijn God.", "Neh 11:29": "En te En-rimmon, en te Zora, en te Jarmuth,", "Joz 9:2": "Zo verzamelden zij zich samen, om tegen Jozua en tegen Israël te strijden, eensgezind.", "Joz 10:1-5": "Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren; Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:", "Deut 20:17": "Maar u zult ze helemaal verbannen: de Hethieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, de Hevieten, en de Jebusieten, zoals de HEERE, uw God, u geboden heeft;", "Jes 24:22": "En zij zullen bijeengebracht worden, zoals gevangenen in een put, en zij zullen opgesloten worden in een gevangenis, maar na veel dagen weer bezocht worden.", "2 Sam 20:6": "Toen zei David tegen Abisai: Nu zal Seba, de zoon van Bichri, ons meer kwaad doen dan Absalom; neem u de knechten van uw heer, en jaag hem achterna, opdat hij niet misschien vaste steden voor zich vindt, en zich aan onze ogen onttrekt.", "Joz 12:15": "De koning van Libna, één; de koning van Adullam, één;", "Jes 8:9-12": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden! Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons! Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "2 Sam 15:10": "Absalom nu had verspieders uitgezonden naar alle stammen van Israël, om te zeggen: Zodra u het geluid van de bazuin hoort, moet u zeggen: Absalom is koning geworden te Hebron.", "Joz 8:24": "En het gebeurde, toen de Israëlieten een einde gemaakt hadden aan het doden van alle inwoners van Ai, op het veld, in de woestijn, waarin zij hen nagejaagd hadden, en dat zij allen door de scherpte van het zwaard gevallen waren, totdat zij allen vernietigd waren; toen keerde heel Israël zich naar Ai, en zij sloegen haar met de scherpte van het zwaard.", "Num 21:13": "Van daar reisden zij, en legerden zich aan deze zijde van de Arnon, die in de woestijn is, uitgaande uit het gebied van de Amorieten; want de Arnon is de grens van Moab, tussen Moab en de Amorieten.", "1 Sam 11:1": "Toen trok Nahas, de Ammoniet, op en belegerde Jabes in Gilead. En alle mannen van Jabes zeiden tegen Nahas: Sluit een verbond met ons, en wij zullen u dienen.", "Jes 37:6": "En Jesaja zei tegen hen: Zo moet u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bang voor de woorden die u gehoord hebt, waarmee de knechten van de koning van Assyrië Mij gelasterd hebben.", "Rom 8:37": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Deut 3:3": "En de HEERE, onze God, gaf ook Og, de koning van Bazan, en al zijn volk, in onze hand, zodat wij hem sloegen, totdat wij hem niemand lieten overblijven.", "Ps 18:41": "En U gaf mij de nek van mijn vijanden, en mijn haters, die vernielde ik.", "1 Kron 6:67": "Want zij gaven hun van de vrijsteden, Sichem en haar voorsteden op het gebergte van Efraïm, en Gezer en haar voorsteden,", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Ps 63:10": "Maar zij die mijn ziel zoeken om die te verwoesten, zullen komen in de onderste plaatsen van de aarde.", "Joz 15:15": "En vandaar trok hij op naar de inwoners van Debir (de naam van Debir was voorheen Kirjath-sefer).", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "Jes 38:8": "Zie, Ik zal de schaduw van de graden, die met de zon in de graden van de zonnewijzer van Achaz omlaag gegaan is, tien graden achterwaarts doen keren. Zo is de zon tien graden teruggekeerd, in de graden die zij omlaag gegaan was.", "Richt 12:12": "En Elon, de Zebuloniet, stierf, en werd begraven te Ajalon, in het land van Zebulon.", "Luk 23:44": "En het was ongeveer het zesde uur, en er kwam duisternis over de hele aarde, tot het negende uur toe.", "Joz 11:1-5": "Het gebeurde daarna, toen Jabin, de koning van Hazor, dit hoorde, dat hij een boodschap stuurde naar Jobab, de koning van Madon, en naar de koning van Simron, en naar de koning van Achsaf, En naar de koningen die tegen het noorden op het gebergte, en op het vlakke, tegen het zuiden van Cinneroth, en in de laagte, en in Nafoth-dor, aan de zee waren; Tot de Kanaänieten tegen het oosten en tegen het westen, en de Amorieten, en de Hethieten, en de Ferezieten; en de Jebusieten op het gebergte, en de Hevieten onder aan Hermon, in het land van Mizpa.", "Joz 12:12": "De koning van Eglon, één; de koning van Gezer, één;", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "Richt 1:35": "Ook wilden de Amorieten wonen op het gebergte van Heres, te Ajalon, en te Saalbim; maar de hand van het huis van Jozef werd zwaar, zodat zij dienstbaar werden.", "Richt 11:22": "En zij namen het hele gebied van de Amorieten in erfelijk bezit, van de Arnon af tot aan de Jabbok, en van de woestijn tot aan de Jordaan.", "Jes 43:1": "Maar nu, zo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! Vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, u bent van Mij.", "Joz 8:2": "U nu zult aan Ai en haar koning doen, zoals u aan Jericho en haar koning gedaan hebt; behalve dat u haar roof en haar vee voor uzelf roven zult; leg een hinderlaag tegen de stad, van achter haar.", "Ps 130:7": "Israël, hoop op de HEERE; want bij de HEERE is goedertierenheid, en bij Hem is veel verlossing.", "Matt 16:24": "Toen zei Jezus tegen Zijn discipelen: Als iemand achter Mij aan wil komen, laat hij zichzelf verloochenen, en zijn kruis opnemen, en Mij volgen.", "Deut 3:22": "Wees niet bang voor hen; want de HEERE, uw God, strijdt voor u.", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "Ps 37:7": "Daleth. Zwijg voor de HEERE, en verwacht Hem; wind u niet op over hem die voorspoedig is op zijn weg; over een man die listige plannen uitvoert.", "1 Sam 13:6": "Toen de mannen van Israël zagen dat zij in nood waren (want het volk was benauwd), verborg het volk zich in de holen, en in de doornstruiken, en in de rotsen, en in de vestingen, en in de putten.", "1 Kron 19:7": "zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde.", "Deut 1:4": "nadat hij Sihon, de koning van de Amorieten, die in Hesbon woonde, verslagen had, en Og, de koning van Bazan, die in Astharoth woonde, bij Edreï.", "Ps 148:3": "Looft Hem, zon en maan! Looft Hem, alle lichtende sterren!", "Joz 9:15-27": "En Jozua sloot vrede met hen, en hij sloot een verbond met hen, dat hij hen in leven zou laten; en de leiders van de vergadering zwoeren het hun. En het gebeurde na verloop van drie dagen, nadat zij het verbond met hen gesloten hadden, dat zij hoorden dat zij hun naburen waren, en dat zij te midden van hen woonden. Want toen de kinderen van Israël verder trokken, kwamen zij op de derde dag bij hun steden aan; hun steden nu waren Gibeon, en Chefira, en Beeroth, en Kirjath-jearim.", "2 Kron 14:12": "En de HEERE plaagde de Moren voor Asa en voor Juda; en de Moren vluchtten.", "2 Sam 18:7": "En het volk van Israël werd daar door Davids knechten verslagen; en daar gebeurde die dag een grote slachting, van twintigduizend man.", "2 Kron 32:7": "Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.", "Jes 36:1": "En het gebeurde in het veertiende jaar van koning Hizkia, dat Sanherib, de koning van Assyrië, optrok tegen alle versterkte steden van Juda, en ze innam.", "Richt 8:10": "Zebah nu en Tsalmuna waren in Karkor, en hun legers met hen, ongeveer vijftienduizend man, alles wat er over was van het hele leger van de mensen uit het oosten; en de gesneuvelden waren honderdtwintigduizend man, die het zwaard hanteerden.", "2 Kron 16:2-9": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei: Er is een verbond tussen mij en u, en tussen mijn vader en uw vader; zie, ik zend u zilver en goud; ga heen, verbreek uw verbond met Baësa, de koning van Israël, zodat hij van tegen mij aftrekt. En Benhadad hoorde naar de koning Asa, en zond de aanvoerders van de legers die hij had, tegen de steden van Israël, en zij sloegen Ijon, en Dan, en Abel-Maim, en alle schatsteden van Naftali.", "Deut 11:25": "Niemand zal voor uw aangezicht standhouden; de HEERE, uw God, zal de schrik en de vrees voor u geven over heel het land, waarop u treden zult, zoals Hij tot u gesproken heeft.", "Jes 26:4": "Vertrouw op de HEERE tot in eeuwigheid; want in de HEERE HEERE is een eeuwige rots.", "Joz 10:5-23": "Toen werden de vijf koningen van de Amorieten verzameld en trokken op, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en streden tegen haar. De mannen van Gibeon nu stuurden tot Jozua, in het leger van Gilgal, en zeiden: Trek uw handen niet terug van uw knechten, kom haastig tot ons op, en verlos ons, en help ons; want al de koningen van de Amorieten, die op het gebergte wonen, hebben zich tegen ons verzameld. Toen trok Jozua op van Gilgal, hij en al het krijgsvolk met hem, en alle strijdbare helden.", "Joz 10:3-27": "Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei: Kom op tot mij, en help mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen van Israël. Toen werden de vijf koningen van de Amorieten verzameld en trokken op, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en streden tegen haar.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Gen 10:19": "En het gebied van de Kanaänieten was van Sidon, in de richting van Gerar tot aan Gaza toe; in de richting van Sodom en Gomorra, en Adama, en Zoboim, tot aan Lasa toe.", "Joz 14:13": "Toen zegende Jozua hem, en hij gaf Kaleb, de zoon van Jefunne, Hebron als erfdeel.", "2 Sam 10:15": "Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich weer samen.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Joz 21:22": "En Kibzaim en haar voorsteden, en Beth-horon en haar voorsteden: vier steden.", "2 Sam 10:6": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man.", "Joz 16:3": "En het gaat af tegen het westen naar het gebied van Jafleti, tot aan het gebied van het benedenste Beth-horon, en tot Gezer; en de uiteinden ervan zijn aan de zee.", "Richt 4:15": "En de HEERE versloeg Sisera, met al zijn wagens, en het hele leger, door de scherpte van het zwaard, voor Barak; zodat Sisera van de wagen afklom, en te voet vluchtte.", "Joz 11:16": "Zo nam Jozua al dat land in, het gebergte, en heel het zuiden, en heel het land van Gosen, en de laagte, en het vlakke veld, en het gebergte van Israël, en zijn laagte.", "Joz 12:3": "En over de vlakte tot aan de zee van Cinneroth naar het oosten, en tot aan de zee van de vlakte, de Zoutzee, naar het oosten, op de weg naar Beth-jesimoth; en vanuit het zuiden, beneden Asdoth-pisga.", "1 Kon 9:16": "Want Farao, de koning van Egypte, was opgekomen, en had Gezer ingenomen, en het met vuur verbrand, en de Kanaänieten, die in de stad woonden, gedood, en had het aan zijn dochter, de vrouw van Salomo, tot een geschenk gegeven.", "2 Kon 19:35": "Het gebeurde toen in diezelfde nacht, dat de Engel van de HEERE uittrok en in het leger van Assyrië honderdvijfentachtigduizend man sloeg. En toen zij zich 's morgens vroeg opmaakten, zie, dat waren allemaal dode lichamen.", "Mark 11:22-24": "En Jezus antwoordde en zei tegen hen: Heb geloof in God. Want voorwaar, Ik zeg u, dat wie tegen deze berg zal zeggen: Word opgeheven en in de zee geworpen; en niet zal twijfelen in zijn hart, maar zal geloven dat wat hij zegt, zal gebeuren, het zal hem gebeuren, wat hij ook zegt. Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "1 Kon 15:29": "Het gebeurde nu, toen hij koning werd, dat hij het gehele huis van Jerobeam sloeg; hij liet niets van Jerobeam over wat adem had, totdat hij hem verdelgd had, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn knecht Ahia, de Siloniet;", "Ex 17:13": "Zo versloeg Jozua Amalek en zijn volk, met de scherpte van het zwaard.", "Jes 37:8": "Zo keerde Rabsaké terug, en hij trof de koning van Assyrië aan, strijdend tegen Libna; want hij had gehoord dat hij van Lachis vertrokken was.", "Num 21:26": "Want Hesbon was de stad van Sihon, de koning van de Amorieten; en hij had gestreden tegen de vorige koning van de Moabieten, en hij had al zijn land uit zijn hand genomen, tot aan de Arnon.", "Deut 20:13-18": "En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard; Behalve de vrouwen, en de kinderen, en de dieren, en al wat in de stad zijn zal, alle buit ervan zult u voor uzelf roven; en u zult eten van de buit van uw vijanden, die de HEERE, uw God, u gegeven heeft. Zo zult u aan alle steden doen die zeer ver van u zijn, die niet zijn van de steden van deze volken.", "Ps 4:6": "Offer offeranden van gerechtigheid, en vertrouw op de HEERE.", "1 Kron 12:23": "En dit zijn de aantallen van de aanvoerders van hen die toegerust waren voor het leger, die naar David te Hebron kwamen om het koninkrijk van Saul aan hem over te dragen, naar het woord van de HEERE:", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Joz 16:10": "En zij verdreven de Kanaänieten niet, die in Gezer woonden; zo woonden die Kanaänieten in het midden van de Efraïmieten tot op deze dag; maar zij moesten wel dwangarbeid verrichten.", "Joz 14:7": "Ik was veertig jaar oud, toen Mozes, de dienaar van de HEERE, mij uitgezonden heeft van Kades-Barnea om het land te verkennen, en ik hem antwoord bracht, zoals het in mijn hart was.", "Openb 6:15": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen;", "Deut 2:33": "En de HEERE, onze God, gaf hem aan ons over; en wij versloegen hem, en zijn zonen, en al zijn volk.", "Ps 44:4-9": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had. U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob. Door U zullen wij onze tegenstanders met hoorns stoten; in Uw Naam zullen wij vertrappen die tegen ons opstaan.", "Openb 16:8": "En de vierde engel goot zijn schaal uit op de zon; en haar is macht gegeven om de mensen te verhitten met vuur.", "2 Tess 1:7-9": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht; Met vlammend vuur, wraak oefenend over hen die God niet kennen, en over hen die het Evangelie van onze Heere Jezus Christus niet gehoorzaam zijn. Die zullen tot straf het eeuwige verderf ondergaan, weg van het aangezicht van de Heere, en van de heerlijkheid van Zijn sterkte,", "Joz 12:2": "Sihon, de koning van de Amorieten, die in Hesbon woonde; die heerste vanaf Aroer, dat aan de oever van de beek Arnon ligt, en over het midden van de beek, en de helft van Gilead, tot aan de beek Jabbok, het grensgebied van de kinderen van Ammon;", "Luk 1:39": "En Maria stond in diezelfde dagen op en reisde met haast naar het gebergte, naar een stad van Juda;", "2 Kor 1:10": "Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "Zach 9:12": "Keert u weer tot de sterkte, gebondenen, die daar hopen! Ook heden verkondig Ik, dat Ik u dubbel zal wedergeven;", "Hand 2:19": "En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "2 Sam 10:16": "En Hadad-Ezer zond heen, en liet de Syriërs uitkomen, die aan de overzijde van de rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-Ezers legeraanvoerder, trok voor hun aangezicht heen.", "2 Kron 22:5": "Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.", "Jes 43:10": "U bent Mijn getuigen, spreekt de HEERE, en Mijn knecht, die Ik uitverkoren heb; opdat u het weet, en Mij gelooft, en verstaat, dat Ik Dezelfde ben, dat er vóór Mij geen God geformeerd is, en na Mij geen zijn zal.", "Jes 57:4": "Over wie maakt u zich vrolijk, tegen wie sperrt u de mond wijd open en steekt u de tong lang uit? Bent u geen kinderen van de overtreding, een nageslacht van de valsheid?", "Deut 4:19": "Dat u ook uw ogen niet opheft naar de hemel, en de zon aanziet, en de maan, en de sterren, heel het leger van de hemel; en zich laat verleiden om u daarvoor te buigen en ze te dienen; die de HEERE, uw God, aan alle volken onder de hele hemel heeft toebedeeld.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Gen 13:18": "En Abram sloeg zijn tenten op, en kwam en woonde bij de eikenbossen van Mamre, die bij Hebron zijn; en hij bouwde daar de HEERE een altaar.", "Ps 18:13-15": "Van de glans die voor Hem was, dreven Zijn wolken daarheen, hagel en vurige kolen. En de HEERE donderde in de hemel, en de Allerhoogste gaf Zijn stem, hagel en vurige kolen. En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Lev 26:44": "En hierboven is dit ook: als zij in het land van hun vijanden zullen zijn, zal Ik hen niet verwerpen, en ook niet van hen walgen, om een einde aan hen te maken en Mijn verbond met hen te vernietigen; want Ik ben de HEERE, hun God!", "Jes 9:14": "(De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.)", "Jes 43:5": "Vrees niet, want Ik ben met u; Ik zal uw nageslacht van de opgang brengen, en Ik zal u verzamelen van de ondergang.", "Jes 26:20": "Ga heen, mijn volk, ga in uw binnenkamers, en sluit uw deuren achter u toe; verberg u voor een klein ogenblik, totdat de gramschap voorbijgaat.", "2 Kron 28:16": "In diezelfde tijd zond koning Achaz tot de koningen van Assyrië, dat zij hem zouden helpen.", "Rom 8:31-37": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn? Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken? Wie zal een beschuldiging inbrengen tegen de uitverkorenen van God? God is het Die rechtvaardigt.", "Joh 16:3": "En deze dingen zullen zij u doen, omdat zij de Vader niet gekend hebben, en Mij ook niet.", "Joz 10:16-27": "Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda. Toen zei Jozua: Rol grote stenen voor de opening van de grot, en zet mannen ervoor om hen te bewaken.", "Joz 10:15-17": "Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal. Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda.", "Matt 27:45": "En van het zesde uur af kwam er duisternis over het hele land, tot het negende uur toe.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "Jer 49:11": "Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.", "Richt 5:20": "Vanuit de hemel streden zij, de sterren uit hun loopplaatsen streden tegen Sisera.", "Deut 20:1": "Wanneer u zult uittrekken tot de strijd tegen uw vijanden, en zult zien paarden en wagens, een volk, groter dan u, dan zult u voor hen niet vrezen; want de HEERE, uw God, is met u, Die u uit Egypteland heeft opgevoerd.", "Joz 5:1": "En het gebeurde, toen alle koningen van de Amorieten, die aan deze zijde van de Jordaan naar het westen woonden, en alle koningen van de Kanaänieten, die aan de zee woonden, hoorden dat de HEERE de wateren van de Jordaan had uitgedroogd voor de kinderen van Israël, totdat wij daardoor gegaan waren, dat hun hart versmolt, en er was geen moed meer in hen, vanwege de kinderen van Israël.", "Deut 3:21": "Ook gebood ik Jozua in die tijd: Uw ogen hebben alles gezien wat de HEERE, uw God, aan deze twee koningen gedaan heeft; zo zal de HEERE doen aan alle koninkrijken waar u doorheen trekt.", "Pred 1:5": "Ook rijst de zon op, en de zon gaat onder, en zij haast zich naar haar plaats, waar zij weer opkomt.", "Ps 115:9": "Israël! vertrouw jij op de HEERE; Hij is hun Hulp en hun Schild.", "1 Kron 19:6": "Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba;", "2 Kron 8:5": "Ook bouwde hij het hoge Beth-Horon en het lage Beth-Horon, vaste steden met muren, deuren en grendels;", "Hab 2:20": "Maar de HEERE is in Zijn heilige tempel. Zwijg voor Zijn aangezicht, heel de aarde!", "Deut 1:21-31": "Zie, de HEERE, uw God, heeft dat land aan u gegeven; trek op, bezit het erfelijk, zoals de HEERE, de God van uw vaderen, tot u gesproken heeft; wees niet bang, en wees niet ontmoedigd. Toen kwam u allen dichterbij mij, en zei: Laten wij mannen voor ons uit sturen, die het land voor ons verkennen, en ons bericht terugbrengen, welke weg wij daarin op moeten trekken, en tot welke steden wij zullen komen. Deze zaak nu was goed in mijn ogen; zo nam ik uit u twaalf mannen, van elke stam een man.", "Joz 15:35-39": "Jarmuth, en Adullam, Socho en Azeka, en Saaraim, en Adithaim, en Gedera, en Gederothaim; veertien steden en haar dorpen. Zenan, en Hadasa, en Migdal-gad,", "Amos 8:9": "En het zal op die dag gebeuren, spreekt de Heere HEERE, dat Ik de zon op de middag zal doen ondergaan, en het land op klaarlichte dag zal verduisteren.", "Ex 14:25": "En Hij stootte de raderen van hun wagens weg, en deed ze zwaar voortgaan. Toen zeiden de Egyptenaren: Laten wij vluchten van voor Israël, want de HEERE strijdt voor hen tegen de Egyptenaren.", "Joz 1:5-9": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten. Wees sterk en heb goede moed! Want u zult dit volk dat land als erfelijk bezit doen verkrijgen, dat Ik hun vaderen gezworen heb hun te geven. Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "1 Sam 17:37": "Verder zei David: De HEERE, Die mij gered heeft uit de klauw van de leeuw en uit de klauw van de beer, Die zal mij redden uit de hand van deze Filistijn. Toen zei Saul tegen David: Ga heen, en de HEERE zij met u!", "Ps 91:13": "Op de felle leeuw en de adder zult u treden, u zult de jonge leeuw en de draak vertrappen.", "Jes 30:30": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.", "Richt 6:14-16": "Toen keerde de HEERE Zich tot hem, en zei: Ga heen in deze kracht van u, en u zult Israël uit de hand van de Midianieten verlossen; heb Ik u niet gezonden? En hij zei tegen Hem: Och, mijn Heere! Waarmee zal ik Israël verlossen? Zie, mijn geslacht is het armste in Manasse, en ik ben de kleinste in mijn vaders huis. En de HEERE zei tegen hem: Omdat Ik met u zal zijn, zult u de Midianieten verslaan alsof het één man was.", "Ps 31:20": "O, hoe groot is Uw goed, dat U weggelegd hebt voor hen die U vrezen; dat U gewrocht hebt voor hen die op U vertrouwen, in de tegenwoordigheid van de mensenkinderen!", "Ps 149:9": "om het geschreven recht over hen te voltrekken. Dit zal de eer van al Zijn gunstgenoten zijn. Halleluja!", "Jak 4:4": "Overspelers en overspeleressen, weet u niet dat de vriendschap met de wereld vijandschap tegen God is? Wie dan ook een vriend van de wereld wil zijn, wordt daarmee een vijand van God.", "Joz 21:21": "En zij gaven hun Sichem, een vrijstad voor de doodslager, en haar voorsteden, op het gebergte van Efraïm, en Gezer en haar voorsteden;", "2 Kron 20:20": "En zij stonden 's morgens vroeg op en trokken naar de woestijn van Thekoa; en toen zij optrokken, stond Josafat en zei: Hoor mij, o Juda, en u, inwoners van Jeruzalem! Geloof in de HEERE, uw God, dan zult u standhouden; geloof Zijn profeten, dan zult u voorspoedig zijn.", "Deut 17:3": "Doordat hij heengaat en andere goden dient, en zich voor die buigt, of voor de zon, of voor de maan, of voor het hele leger van de hemel, wat ik niet geboden heb;", "Jes 28:2": "Zie, de Heere heeft een sterke en machtige, er is als een hagelvloed, een verwoestende storm; als een vloed van sterk, overstromend water zal Hij ze met de hand ter aarde neerwerpen.", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "1 Sam 24:9": "Daarna maakte David zich ook op, en ging uit de spelonk, en hij riep Saul achterna en zei: Mijn heer koning! Toen keek Saul achter zich om, en David boog zich met het gezicht ter aarde en boog zich neer.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "2 Kron 18:1": "Josafat had rijkdom en eer in overvloed; en hij verzwagerde zich aan Achab.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "2 Kron 21:3": "En hun vader had hun veel geschenken gegeven van zilver, van goud en van kostbaarheden, alsook versterkte steden in Juda; maar het koninkrijk gaf hij aan Joram, omdat hij de eerstgeborene was.", "Jes 44:8": "Schrik niet, en wees niet bang; heb Ik het u van toen af niet doen horen en verkondigd? Want u bent Mijn getuigen: is er ook een God behalve Mij? Zeker, er is geen andere rotssteen: Ik ken er geen.", "Joz 21:15": "En Holon en haar voorsteden, en Debir en haar voorsteden;", "Deut 7:2-16": "en de HEERE, uw God, hen aan u zal hebben overgegeven, zodat u hen verslaat, dan moet u hen helemaal met de ban vernietigen; u zult geen verbond met hen maken, en hun ook niet genadig zijn. U zult zich ook niet met hen verzwageren; uw dochters zult u niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen. Want zij zouden uw zonen van Mij doen afwijken, zodat zij andere goden zouden dienen; en de toorn van de HEERE zou tegen u ontsteken, en u snel verdelgen.", "1 Sam 24:4": "En hij kwam bij de schaapskooien aan de weg, waar een spelonk was; en Saul ging daarin, om zijn voeten te bedekken. David nu en zijn mannen zaten aan de zijkanten van de spelonk.", "Openb 9:2": "En zij heeft de put van het afgrond geopend; en er is rook opgegaan uit de put, als rook van een grote oven; en de zon en de lucht is verduisterd geworden van de rook van de put.", "1 Kon 18:13": "Is mijn heer niet verteld wat ik gedaan heb, toen Izebel de profeten van de HEERE doodde? Dat ik van de profeten van de HEERE honderd man heb verborgen, elk vijftig man in een grot, en hen met brood en water heb onderhouden?", "Hebr 10:27": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden.", "2 Kon 18:14": "Toen zond Hizkia, de koning van Juda, tot de koning van Assyrië, naar Lachis, en zei: Ik heb gezondigd, keer af van mij; wat u mij oplegt, zal ik dragen. Toen legde de koning van Assyrië Hizkia, de koning van Juda, driehonderd talenten van het zilver en dertig talenten van het goud op.", "Matt 24:35": "De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.", "Richt 11:33": "En hij versloeg hen van Aroer af tot waar u komt bij Minnith, twintig steden, en tot aan Abel-Keramim, met een zeer grote slag. Zo werden de kinderen van Ammon onderworpen voor het aangezicht van de kinderen van Israël.", "Joz 11:11": "En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur.", "Num 31:2": "Neem wraak voor de kinderen van Israël op de Midianieten; daarna zult u verzameld worden tot uw volken.", "Joz 10:2-40": "Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei: Kom op tot mij, en help mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen van Israël.", "1 Petr 4:4": "waarin zij het vreemd vinden dat u niet meeloopt naar dezelfde uitspatting van losbandigheid, en u belasteren;", "Openb 10:1": "En ik zag een andere sterke engel neerkomen uit de hemel, bekleed met een wolk; en een regenboog was boven zijn hoofd; en zijn gezicht was als de zon, en zijn voeten waren als pilaren van vuur.", "Hab 3:11": "De zon en de maan stonden stil in hun woning; met het licht gingen Uw pijlen daarheen, met glans Uw bliksemende speer.", "Joël 3:15": "De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Joz 10:3-39": "Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei: Kom op tot mij, en help mij, dat wij Gibeon slaan; omdat zij vrede gemaakt heeft met Jozua en met de kinderen van Israël. Toen werden de vijf koningen van de Amorieten verzameld en trokken op, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en streden tegen haar.", "Joz 21:11": "Zo gaven zij hun de stad van Arba, de vader van Anok (dat is Hebron), op het gebergte van Juda, en de voorsteden rondom haar.", "Joz 10:1-27": "Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren; Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:", "Luk 17:6": "En de Heere zei: Als u een geloof had als een mosterdzaad, zou u tegen deze moerbeiboom zeggen: Word ontworteld en in de zee geplant, en hij zou u gehoorzaam zijn.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "1 Sam 15:32": "Toen zei Samuël: Breng Agag, de koning van de Amalekieten, hier bij mij. Agag nu ging vol vertrouwen naar hem toe; en Agag zei: Voorwaar, de bitterheid van de dood is geweken!", "Joz 18:28": "En Zela, Elef en Jebusi (dat is Jeruzalem), Gibath, Kirjath: veertien steden alsook de bijbehorende dorpen. Dit is het erfdeel van de kinderen van Benjamin, naar hun huisgezinnen.", "Richt 21:11": "Doch dit is de zaak die u doen zult: al wat mannelijk is, en alle vrouwen die gemeenschap met een man gehad hebben, zult u met de ban slaan.", "Ps 37:39": "Thau. Toch is het heil van de rechtvaardigen van de HEERE; hun Sterkte in de tijd van benauwdheid.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Gen 14:2": "dat zij oorlog voerden met Bera, koning van Sodom, en met Birsa, koning van Gomorra, Sinab, koning van Adama, en Semeber, koning van Zeboim, en de koning van Bela, dat is Zoar.", "2 Kon 18:19-21": "En Rabsake zei tot hen: Zeg nu tot Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat vertrouwen is dit, waarmee u vertrouwt? U zegt (doch het is een woord der lippen): Er is raad en macht tot de oorlog; op wie vertrouwt u nu, dat u tegen mij rebelleert? Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Gen 23:2": "Sara stierf te Kiriath-arba, dat is Hebron, in het land Kanaän; en Abraham kwam om Sara te beklagen en haar te bewenen.", "Joz 15:49": "en Danna, en Kirjath-sanna, dat is Debir,", "Ps 77:18": "De dikke wolken goten water uit; de bovenste wolken gaven geluid; ook gingen Uw pijlen daarheen.", "1 Kon 22:1-4": "En zij bleven drie jaar stil, zodat er geen oorlog was tussen Syrië en Israël. En het gebeurde in het derde jaar, dat Josafat, de koning van Juda, naar de koning van Israël afkwam. Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.", "Deut 3:2": "Toen zei de HEERE tegen mij: Wees niet bang voor hem, want Ik heb hem, en al zijn volk, en zijn land, in uw hand gegeven; en u zult hem doen, zoals u met Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt.", "Jes 41:13": "Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.", "2 Kon 25:7": "En zij slachtten de zonen van Zedekia voor zijn ogen, en men verblindde Zedekia's ogen, en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Ps 2:8-12": "Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting. U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat. Nu dan, koningen, handelt verstandig; laat u onderwijzen, rechters van de aarde!", "Deut 20:16": "Maar van de steden van deze volken, die de HEERE, uw God, u als erfdeel geeft, zult u niets laten leven dat adem heeft.", "2 Kron 32:8": "Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.", "Openb 10:2": "En hij had in zijn hand een boekje, dat geopend was; en hij zette zijn rechtervoet op de zee, en de linker op de aarde."}, "noten": {}, "koppeling": {"1": "Het gebeurde <span class=\"wl\" data-l=\"L2\" data-code=\"H139\">nu</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H139\">toen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H139\">Adoni</span>-<span class=\"wl\" data-l=\"L2\" data-code=\"H139\">Zedek</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H139\">de</span> <span class=\"wl\" data-l=\"L3\" d
