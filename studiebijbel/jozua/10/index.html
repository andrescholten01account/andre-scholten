">nam</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3605\">al</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H428\">deze</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4428\">koningen</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H776\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H776\">hun</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H776\">land</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H776\">in</span> één keer <span class=\"wl\" data-l=\"L7\" data-code=\"H3588\">in</span>; <span class=\"wl\" data-l=\"L7\" data-code=\"H3588\">want</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3588\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H430\">HEERE</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H430\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H430\">God</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H430\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3478\">Israël</span>, <span class=\"wl\" data-l=\"L10\" data-code=\"H3898\">streed</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3898\">voor</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H3478\">Israël</span>.", "43": "<span class=\"wl\" data-l=\"L1\" data-code=\"H7725\">Toen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7725\">keerde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3091\">Jozua</span> terug, <span class=\"wl\" data-l=\"L3\" data-code=\"H3605\">en</span> heel <span class=\"wl\" data-l=\"L4\" data-code=\"H3478\">Israël</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3478\">met</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H413\">hem</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H413\">naar</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4264\">het</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4264\">leger</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4264\">te</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1537\">Gilgal</span>."}, "koppeling_kjv": {"1": "Now it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H139\">Adonizedek</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> had <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">how</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> had <span class=\"wl wl-kjv\" data-code=\"H3920\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai,</span> and had utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed</span> it; as he had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho</span> and her <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> so he had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai</span> and her <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> and how the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon</span> had made <span class=\"wl wl-kjv\" data-code=\"H7999\">peace</span> with <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and were among", "2": "That they <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly,</span> because <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon</span> was a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> as <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H4467\">royal</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and because it was <span class=\"wl wl-kjv\" data-code=\"H1419\">greater</span> than <span class=\"wl wl-kjv\" data-code=\"H5857\">Ai,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> thereof were mighty.", "3": "Wherefore <span class=\"wl wl-kjv\" data-code=\"H139\">Adonizedek</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto <span class=\"wl wl-kjv\" data-code=\"H1944\">Hoham</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H6502\">Piram</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3412\">Jarmuth,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H3309\">Japhia</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H1688\">Debir</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H5700\">Eglon,</span> saying,", "4": "Come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto me, and <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> me, that we may <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon:</span> for it hath made <span class=\"wl wl-kjv\" data-code=\"H7999\">peace</span> with <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> and with the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.", "5": "Therefore the <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3412\">Jarmuth,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H5700\">Eglon,</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> they and all their <span class=\"wl wl-kjv\" data-code=\"H4264\">hosts,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> before <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon,</span> and made war", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> to the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> to <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7503\">Slack</span> not thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> from thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants;</span> come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to us <span class=\"wl wl-kjv\" data-code=\"H4120\">quickly,</span> and <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> us, and <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> us: for all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> are gathered together", "7": "So <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">ascended</span> from <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal,</span> he, and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> with him, and all the <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> men of valour.", "8": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> them not: for I have <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> there shall not a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of them <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> before", "9": "<span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> therefore <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto them <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal</span> all night.", "10": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2000\">discomfited</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> them with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter</span> at <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon,</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">chased</span> them along the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> that goeth <span class=\"wl wl-kjv\" data-code=\"H4608\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H1032\">Bethhoron,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them to <span class=\"wl wl-kjv\" data-code=\"H5825\">Azekah,</span> and unto Makkedah.", "11": "And it came to pass, as they <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and were in the going <span class=\"wl wl-kjv\" data-code=\"H4174\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H1032\">Bethhoron,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> cast <span class=\"wl wl-kjv\" data-code=\"H7993\">down</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> upon them unto <span class=\"wl wl-kjv\" data-code=\"H5825\">Azekah,</span> and they <span class=\"wl wl-kjv\" data-code=\"H4191\">died:</span> they were <span class=\"wl wl-kjv\" data-code=\"H7227\">more</span> which <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> with <span class=\"wl wl-kjv\" data-code=\"H1259\">hailstones</span> than they <span class=\"wl wl-kjv\" data-code=\"H834\">whom</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> with the sword.", "12": "Then <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> delivered <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H8121\">Sun,</span> stand thou <span class=\"wl wl-kjv\" data-code=\"H1826\">still</span> upon <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon;</span> and thou, <span class=\"wl wl-kjv\" data-code=\"H3394\">Moon,</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of Ajalon.", "13": "And the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> stood <span class=\"wl wl-kjv\" data-code=\"H1826\">still,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stayed,</span> until the <span class=\"wl wl-kjv\" data-code=\"H1471\">people</span> had <span class=\"wl wl-kjv\" data-code=\"H5358\">avenged</span> themselves upon their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies.</span> Is not <span class=\"wl wl-kjv\" data-code=\"H1931\">this</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of <span class=\"wl wl-kjv\" data-code=\"H3477\">Jasher?</span> So the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> stood <span class=\"wl wl-kjv\" data-code=\"H5975\">still</span> in the <span class=\"wl wl-kjv\" data-code=\"H2677\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H213\">hasted</span> not to go <span class=\"wl wl-kjv\" data-code=\"H935\">down</span> about a <span class=\"wl wl-kjv\" data-code=\"H8549\">whole</span> day.", "14": "And there was no <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> like that <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> it or <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> it, that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of a <span class=\"wl wl-kjv\" data-code=\"H376\">man:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> for Israel.", "15": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with him, unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> to Gilgal.", "16": "But these <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled,</span> and <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> themselves in a <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> at Makkedah.", "17": "And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> are <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> in a <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> at Makkedah.", "18": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1556\">Roll</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave,</span> and <span class=\"wl wl-kjv\" data-code=\"H6485\">set</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> by it for to keep", "19": "And <span class=\"wl wl-kjv\" data-code=\"H5975\">stay</span> ye not, but <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and smite the <span class=\"wl wl-kjv\" data-code=\"H2179\">hindmost</span> of them; <span class=\"wl wl-kjv\" data-code=\"H5414\">suffer</span> them not to <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into your hand.", "20": "And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H5221\">slaying</span> them with a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter,</span> till they were <span class=\"wl wl-kjv\" data-code=\"H8552\">consumed,</span> that the <span class=\"wl wl-kjv\" data-code=\"H8300\">rest</span> which <span class=\"wl wl-kjv\" data-code=\"H8277\">remained</span> of them <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into <span class=\"wl wl-kjv\" data-code=\"H4013\">fenced</span> cities.", "21": "And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> to <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> at <span class=\"wl wl-kjv\" data-code=\"H4719\">Makkedah</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace:</span> none <span class=\"wl wl-kjv\" data-code=\"H2782\">moved</span> his <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> against <span class=\"wl wl-kjv\" data-code=\"H376\">any</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.", "22": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">Open</span> the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave,</span> and bring <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> those <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> unto me out of the cave.", "23": "And they <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> so, and brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> those <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> unto him out of the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3412\">Jarmuth,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Eglon.", "24": "And it came to pass, when they brought <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> those <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> that <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7101\">captains</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> which <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> with him, Come <span class=\"wl wl-kjv\" data-code=\"H7126\">near,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> your <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6677\">necks</span> of these <span class=\"wl wl-kjv\" data-code=\"H4428\">kings.</span> And they came <span class=\"wl wl-kjv\" data-code=\"H7126\">near,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> their <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> upon the necks", "25": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not, nor be <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed,</span> be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> and of good <span class=\"wl wl-kjv\" data-code=\"H553\">courage:</span> for thus shall the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> to all your <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> against whom ye fight.", "26": "And <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them, and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> them, and <span class=\"wl wl-kjv\" data-code=\"H8518\">hanged</span> them on <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees:</span> and they were <span class=\"wl wl-kjv\" data-code=\"H8518\">hanging</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> until the evening.", "27": "And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of the going <span class=\"wl wl-kjv\" data-code=\"H935\">down</span> of the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun,</span> that <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded,</span> and they took them <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> off the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> them into the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> wherein they had been <span class=\"wl wl-kjv\" data-code=\"H2244\">hid,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> in the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> which remain until this <span class=\"wl wl-kjv\" data-code=\"H6106\">very</span> day.", "28": "And that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> <span class=\"wl wl-kjv\" data-code=\"H4719\">Makkedah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> it with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> thereof he utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed,</span> them, and all the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> that were therein; he <span class=\"wl wl-kjv\" data-code=\"H7604\">let</span> none <span class=\"wl wl-kjv\" data-code=\"H8300\">remain:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4719\">Makkedah</span> as he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Jericho.", "29": "Then <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> from <span class=\"wl wl-kjv\" data-code=\"H4719\">Makkedah,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with him, unto <span class=\"wl wl-kjv\" data-code=\"H3841\">Libnah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against Libnah:", "30": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> it also, and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> thereof, into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> it with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> that were therein; he <span class=\"wl wl-kjv\" data-code=\"H7604\">let</span> none <span class=\"wl wl-kjv\" data-code=\"H8300\">remain</span> in it; but <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> thereof as he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Jericho.", "31": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> from <span class=\"wl wl-kjv\" data-code=\"H3841\">Libnah,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with him, unto <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> against it, and fought", "32": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> it on the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> it with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> that were therein, according to all that he had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to Libnah.", "33": "Then <span class=\"wl wl-kjv\" data-code=\"H2036\">Horam</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H1507\">Gezer</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish;</span> and <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him and his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> until he had <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> him none remaining.", "34": "And from <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish</span> <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> unto <span class=\"wl wl-kjv\" data-code=\"H5700\">Eglon,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with him; and they <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> against it, and fought", "35": "And they <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> it on that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> it with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> that were therein he utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> according to all that he had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to Lachish.", "36": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H5700\">Eglon,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with him, unto <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron;</span> and they fought", "37": "And they <span class=\" (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

const concordCache = {};

  } catch (e) { cache[code] = null; }

}

      const chips = w.plaatsen.slice(0, 10).map(chip).join('');

      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;

}
const BIJBELUITLEG_HTML = [

function paneelInhoud(n, tab) {

  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
