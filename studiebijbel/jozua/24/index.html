"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Daarna verzamelde Jozua al de stammen van Israël te Sichem, en hij riep de oudsten van Israël, en hun hoofden, en hun rechters, en hun opzichters; en zij stelden zich voor het aangezicht van God.","2":"Toen zei Jozua tegen het hele volk: Zo zegt de HEERE, de God van Israël: Aan de overkant van de rivier hebben uw vaders vanouds gewoond, *namelijk* Terah, de vader van Abraham, en de vader van Nahor; en zij hebben andere goden gediend.","3":"Toen nam Ik uw vader Abraham van de overkant van de rivier, en liet hem door heel het land Kanaän trekken; Ik vermeerderde ook zijn nageslacht en gaf hem Izak.","4":"En aan Izak gaf Ik Jakob en Ezau; en Ik gaf aan Ezau het gebergte Seïr, om dat te bezitten; maar Jakob en zijn kinderen trokken naar Egypte.","5":"Toen zond Ik Mozes en Aäron, en Ik trof Egypte met plagen, zoals Ik in hun midden gedaan heb; en daarna leidde Ik u daaruit.","6":"Toen Ik uw vaders uit Egypte geleid had, kwam u bij de zee, en de Egyptenaars achtervolgden uw vaders met wagens en met ruiters, tot aan de Schelfzee.","7":"Zij nu riepen tot de HEERE, en Hij bracht duisternis tussen u en de Egyptenaars, en Hij liet de zee over hen komen en bedekte hen; en uw ogen hebben gezien wat Ik in Egypte gedaan heb. Daarna hebt u lange tijd in de woestijn gewoond.","8":"Toen bracht Ik u in het land van de Amorieten, die aan de overkant van de Jordaan woonden, die tegen u streden; maar Ik gaf hen in uw hand, en u nam hun land in bezit, en Ik vernietigde hen voor uw aangezicht.","9":"Ook maakte Balak zich op, de zoon van Zippor, de koning van de Moabieten, en hij streed tegen Israël; en hij zond heen, en liet Bileam, de zoon van Beor, roepen, opdat hij u vervloeken zou.","10":"Maar Ik wilde niet naar Bileam luisteren; daarom zegende hij u steeds opnieuw, en Ik verloste u uit zijn hand.","11":"Toen u over de Jordaan getrokken was, en bij Jericho kwam, streden de burgers van Jericho tegen u, de Amorieten, en de Ferezieten, en de Kanaänieten, en de Hethieten, en de Girgazieten, de Hevieten en de Jebusieten; doch Ik gaf hen in uw hand.","12":"En Ik zond horzels voor u uit; die dreven hen voor u weg, *zoals* de beide koningen van de Amorieten, niet door uw zwaard, en ook niet door uw boog.","13":"Dus heb Ik u een land gegeven, waarvoor u niet gewerkt hebt, en steden die u niet gebouwd hebt, en u woont erin; u eet van de wijngaarden en olijfbomen die u niet geplant hebt.","14":"En nu, vrees de HEERE, en dien Hem in oprechtheid en in waarheid; en doe de goden weg die uw vaders gediend hebben, aan de overkant van de rivier, en in Egypte; en dien de HEERE.","15":"Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen!","16":"Toen antwoordde het volk en zei: Het zij verre van ons, dat wij de HEERE zouden verlaten om andere goden te dienen.","17":"Want de HEERE is onze God; Hij is het die ons en onze vaderen uit het land Egypte, uit het diensthuis, heeft opgevoerd, en die deze grote tekenen voor onze ogen gedaan heeft, en ons bewaard heeft op heel de weg waarlangs wij getrokken zijn, en onder alle volken door wier midden wij getrokken zijn.","18":"En de HEERE heeft voor ons aangezicht al die volken uitgestoten, zelfs de Amoriet, inwoner van het land. Wij zullen ook de HEERE dienen, want Hij is onze God.","19":"Toen zei Jozua tegen het volk: U zult de HEERE niet kunnen dienen, want Hij is een heilig God; Hij is een na-ijverig God; Hij zal uw overtredingen en uw zonden niet vergeven.","20":"Als u de HEERE verlaat en vreemde goden dient, dan zal Hij Zich omkeren, en Hij zal u kwaad doen, en Hij zal u vernietigen, nadat Hij u goed gedaan heeft.","21":"Toen zei het volk tegen Jozua: Nee, want wij zullen de HEERE dienen.","22":"Jozua nu zei tegen het volk: U bent getuigen tegen uzelf, dat u de HEERE gekozen hebt om Hem te dienen. En zij zeiden: Wij zijn getuigen.","23":"En nu, doe de vreemde goden weg die in uw midden zijn, en neig uw hart tot de HEERE, de God van Israël.","24":"En het volk zei tegen Jozua: Wij zullen de HEERE, onze God, dienen, en wij zullen Zijn stem gehoorzamen.","25":"Zo sloot Jozua op die dag een verbond met het volk; en hij stelde het hun tot een inzetting en recht te Sichem.","26":"En Jozua schreef deze woorden in het wetboek van God; en hij nam een grote steen, en hij richtte die daar op onder de eik, die bij het heiligdom van de HEERE was.","27":"En Jozua zei tegen het hele volk: Zie, deze steen zal ons tot een getuigenis zijn; want hij heeft al de woorden van de HEERE gehoord, die Hij tot ons gesproken heeft; ja, hij zal tot een getuigenis tegen u zijn, opdat u uw God niet verloochent.","28":"Toen zond Jozua het volk weg, ieder naar zijn erfdeel.","29":"En het gebeurde na deze dingen, dat Jozua, de zoon van Nun, de knecht van de HEERE, stierf, honderdtien jaar oud.","30":"En zij begroeven hem in het gebied van zijn erfdeel, te Timnath-Serah, dat op een berg van Efraïm ligt, ten noorden van de berg Gaäs.","31":"Israël nu diende de HEERE al de dagen van Jozua, en al de dagen van de oudsten die lang na Jozua leefden, en die al het werk van de HEERE kenden, dat Hij aan Israël gedaan had.","32":"Zij begroeven ook de beenderen van Jozef, die de kinderen van Israël uit Egypte hadden meegebracht, te Sichem, in dat stuk veld dat Jakob gekocht had van de kinderen van Hemor, de vader van Sichem, voor honderd stukken geld, want zij waren aan de kinderen van Jozef als erfelijk bezit toegevallen.","33":"Ook stierf Eleazar, de zoon van Aäron; en zij begroeven hem op de heuvel van Pinehas, zijn zoon, die hem gegeven was op het gebergte van Efraïm."},"SV":{"1":"Daarna verzamelde Jozua al de stammen van Israël te Sichem, en hij riep de oudsten van Israël, en deszelfs hoofden, en deszelfs richters, en deszelfs ambtlieden; en zij stelden zich voor het aangezicht van God.","2":"Toen zeide Jozua tot het ganse volk: Alzo zegt de HEERE, de God Israëls: Over gene zijde der rivier hebben uw vaders van ouds gewoond, *namelijk* Terah, de vader van Abraham, en de vader van Nahor; en zij hebben andere goden gediend.","3":"Toen nam Ik uw vader Abraham van gene zijde der rivier, en deed hem wandelen door het ganse land Kanaän; Ik vermeerderde ook zijn zaad en gaf hem Izak.","4":"En aan Izak gaf Ik Jakob en Ezau; en Ik gaf aan Ezau het gebergte Seir, om dat erfelijk te bezitten; maar Jakob en zijn kinderen togen af in Egypte.","5":"Toen zond Ik Mozes en Aäron, en Ik plaagde Egypte, gelijk als Ik in deszelfs midden gedaan heb; en daarna leidde Ik u daaruit.","6":"Als Ik uw vaders uit Egypte gevoerd had, zo kwaamt gij aan de zee, en de Egyptenaars jaagden uw vaderen na met wagens en met ruiters, tot de Schelfzee.","7":"Zij nu riepen tot den HEERE, en Hij stelde een duisternis tussen u en tussen de Egyptenaars, en Hij bracht de zee over hen, en bedekte hen; en uw ogen hebben gezien, wat Ik in Egypte gedaan heb. Daarna hebt gij vele dagen in de woestijn gewoond.","8":"Toen bracht Ik u in het land der Amorieten, die over gene zijde van de Jordaan woonden, die streden tegen u; maar Ik gaf hen in uw hand, en gij bezat hun land erfelijk, en Ik verdelgde hen voor ulieder aangezicht.","9":"Ook maakte zich Balak op, de zoon van Zippor, de koning der Moabieten, en hij streed tegen Israël; en hij zond heen, en deed Bileam, den zoon van Beor, roepen, opdat hij u vervloeken zou.","10":"Maar Ik wilde Bileam niet horen; dies zegende hij u gestadig, en Ik verloste u uit zijn hand.","11":"Toen gij over de Jordaan getrokken waart, en te Jericho kwaamt, zo krijgden de burgers van Jericho tegen u, de Amorieten, en de Ferezieten, en de Kanaänieten, en de Hethieten, en de Girgazieten, de Hevieten en de Jebusieten; doch Ik gaf hen in ulieder hand.","12":"En Ik zond horzelen voor u heen; die dreven hen weg van ulieder aangezicht, *gelijk* de beide koningen der Amorieten, niet door uw zwaard, noch door uw boog.","13":"Dus heb Ik u een land gegeven, waaraan gij niet gearbeid hebt, en steden, die gij niet gebouwd hebt, en gij woont in dezelve; gij eet van de wijngaarden en olijfbomen, die gij niet geplant hebt.","14":"En nu, vreest den HEERE, en dient Hem in oprechtheid en in waarheid; en doet weg de goden, die uw vaders gediend hebben, aan gene zijde der rivier, en in Egypte; en dient den HEERE.","15":"Doch zo het kwaad is in uw ogen den HEERE te dienen, kiest u heden, wien gij dienen zult; hetzij de goden, welke uw vaders, die aan de andere zijde der rivier waren, gediend hebben, of de goden der Amorieten, in welker land gij woont; maar aangaande mij, en mijn huis, wij zullen den HEERE dienen!","16":"Toen antwoordde het volk en zeide: Het zij verre van ons, dat wij den HEERE verlaten zouden, om andere goden te dienen.","17":"Want de HEERE is onze God; Hij is het, Die ons en onze vaderen uit het land van Egypte, uit het diensthuis heeft opgebracht, en Die deze grote tekenen voor onze ogen gedaan heeft, en ons bewaard heeft op al den weg, door welken wij getogen zijn, en onder alle volken, door welker midden wij getrokken zijn.","18":"En de HEERE heeft voor ons aangezicht uitgestoten al die volken, zelfs den Amoriet, inwoner des lands. Wij zullen ook den HEERE dienen, want Hij is onze God.","19":"Toen zeide Jozua tot het volk: Gij zult den HEERE niet kunnen dienen, want Hij is een heilig God; Hij is een ijverig God; Hij zal uw overtredingen en uw zonden niet vergeven.","20":"Indien gij den HEERE verlaten en vreemde goden dienen zult, zo zal Hij Zich omkeren, en Hij zal u kwaad doen, en Hij zal u verdoen, naar dat Hij u goed gedaan zal hebben.","21":"Toen zeide het volk tot Jozua: Neen, maar wij zullen den HEERE dienen.","22":"Jozua nu zeide tot het volk: Gij zijt getuigen over uzelven, dat gij u den HEERE verkoren hebt, om Hem te dienen. En zij zeiden: Wij zijn getuigen.","23":"En nu, doet de vreemde goden weg, die in het midden van u zijn, en neigt uw harten tot den HEERE, den God van Israël.","24":"En het volk zeide tot Jozua: Wij zullen den HEERE, onzen God, dienen, en wij zullen Zijner stem gehoorzamen.","25":"Alzo maakte Jozua op dienzelven dag een verbond met het volk; en hij stelde het hun tot een inzetting en recht te Sichem.","26":"En Jozua schreef deze woorden in het wetboek Gods; en hij nam een groten steen, en hij richtte dien daar op onder den eik, die bij het heiligdom des HEEREN was.","27":"En Jozua zeide tot het ganse volk: Ziet, deze steen zal ons tot een getuigenis zijn; want hij heeft gehoord al de redenen des HEEREN, die Hij tot ons gesproken heeft; ja, hij zal tot een getuigenis tegen ulieden zijn, opdat gij uw God niet liegt.","28":"Toen zond Jozua het volk weg, een ieder naar zijn erfdeel.","29":"En het geschiedde na deze dingen, dat Jozua, de zoon van Nun, de knecht des HEEREN, stierf, oud zijnde honderd en tien jaren.","30":"En zij begroeven hem in de landpale zijns erfdeels, te Timnath-serah, welke is op een berg van Efraïm, aan het noorden van den berg Gaas.","31":"Israël nu diende den HEERE al de dagen van Jozua, en al de dagen van de oudsten, die lang na Jozua leefden, en die al het werk des HEEREN wisten, hetwelk Hij aan Israël gedaan had.","32":"Zij begroeven ook de beenderen van Jozef, die de kinderen Israëls uit Egypte opgebracht hadden, te Sichem, in dat stuk velds, hetwelk Jakob gekocht had van de kinderen van Hemor, den vader van Sichem, voor honderd stukken gelds, want zij waren aan de kinderen van Jozef ter erfenis geworden.","33":"Ook stierf Eleazar, de zoon van Aäron; en zij begroeven hem op den heuvel van Pinehas, zijn zoon, die hem gegeven was geweest op het gebergte van Efraïm."},"KJV":{"1":"And Joshua gathered all the tribes of Israel to Shechem, and called for the elders of Israel, and for their heads, and for their judges, and for their officers; and they presented themselves before God.","2":"And Joshua said unto all the people, Thus saith the LORD God of Israel, Your fathers dwelt on the other side of the flood in old time, *even* Terah, the father of Abraham, and the father of Nachor: and they served other gods.","3":"And I took your father Abraham from the other side of the flood, and led him throughout all the land of Canaan, and multiplied his seed, and gave him Isaac.","4":"And I gave unto Isaac Jacob and Esau: and I gave unto Esau mount Seir, to possess it; but Jacob and his children went down into Egypt.","5":"I sent Moses also and Aaron, and I plagued Egypt, according to that which I did among them: and afterward I brought you out.","6":"And I brought your fathers out of Egypt: and ye came unto the sea; and the Egyptians pursued after your fathers with chariots and horsemen unto the Red sea.","7":"And when they cried unto the LORD, he put darkness between you and the Egyptians, and brought the sea upon them, and covered them; and your eyes have seen what I have done in Egypt: and ye dwelt in the wilderness a long season.","8":"And I brought you into the land of the Amorites, which dwelt on the other side Jordan; and they fought with you: and I gave them into your hand, that ye might possess their land; and I destroyed them from before","9":"Then Balak the son of Zippor, king of Moab, arose and warred against Israel, and sent and called Balaam the son of Beor to curse","10":"But I would not hearken unto Balaam; therefore he blessed you still: so I delivered you out of his hand.","11":"And ye went over Jordan, and came unto Jericho: and the men of Jericho fought against you, the Amorites, and the Perizzites, and the Canaanites, and the Hittites, and the Girgashites, the Hivites, and the Jebusites; and I delivered them into your hand.","12":"And I sent the hornet before you, which drave them out from before you, *even* the two kings of the Amorites; *but* not with thy sword, nor with thy bow.","13":"And I have given you a land for which ye did not labour, and cities which ye built not, and ye dwell in them; of the vineyards and oliveyards which ye planted not do ye eat.","14":"Now therefore fear the LORD, and serve him in sincerity and in truth: and put away the gods which your fathers served on the other side of the flood, and in Egypt; and serve ye the LORD.","15":"And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that *were* on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD.","16":"And the people answered and said, God forbid that we should forsake the LORD, to serve other gods;","17":"For the LORD our God, he *it is* that brought us up and our fathers out of the land of Egypt, from the house of bondage, and which did those great signs in our sight, and preserved us in all the way wherein we went, and among all the people through whom we passed:","18":"And the LORD drave out from before us all the people, even the Amorites which dwelt in the land: *therefore* will we also serve the LORD; for he *is* our God.","19":"And Joshua said unto the people, Ye cannot serve the LORD: for he *is* an holy God; he *is* a jealous God; he will not forgive your transgressions nor your sins.","20":"If ye forsake the LORD, and serve strange gods, then he will turn and do you hurt, and consume you, after that he hath done you good.","21":"And the people said unto Joshua, Nay; but we will serve the LORD.","22":"And Joshua said unto the people, Ye *are* witnesses against yourselves that ye have chosen you the LORD, to serve him. And they said, *We are* witnesses.","23":"Now therefore put away, *said he*, the strange gods which *are* among you, and incline your heart unto the LORD God of Israel.","24":"And the people said unto Joshua, The LORD our God will we serve, and his voice will we obey.","25":"So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem.","26":"And Joshua wrote these words in the book of the law of God, and took a great stone, and set it up there under an oak, that *was* by the sanctuary of the LORD.","27":"And Joshua said unto all the people, Behold, this stone shall be a witness unto us; for it hath heard all the words of the LORD which he spake unto us: it shall be therefore a witness unto you, lest ye deny your God.","28":"So Joshua let the people depart, every man unto his inheritance.","29":"And it came to pass after these things, that Joshua the son of Nun, the servant of the LORD, died, *being* an hundred and ten years old.","30":"And they buried him in the border of his inheritance in Timnathserah, which *is* in mount Ephraim, on the north side of the hill of Gaash.","31":"And Israel served the LORD all the days of Joshua, and all the days of the elders that overlived Joshua, and which had known all the works of the LORD, that he had done for Israel.","32":"And the bones of Joseph, which the children of Israel brought up out of Egypt, buried they in Shechem, in a parcel of ground which Jacob bought of the sons of Hamor the father of Shechem for an hundred pieces of silver: and it became the inheritance of the children of Joseph.","33":"And Eleazar the son of Aaron died; and they buried him in a hill *that pertained to* Phinehas his son, which was given him in mount Ephraim."}},"tsk":{"1":[{"kopje":"Sichem","refs":["Joz 24:25","Gen 12:6","Gen 33:18","Gen 33:19","Gen 35:4","Richt 9:1-3","1 Kon 12:1"]},{"kopje":"riep","refs":["Joz 23:2","Ex 18:25","Ex 18:26"]},{"kopje":"stelden zich","refs":["1 Sam 10:19","Hand 10:33"]}],"2":[{"kopje":"Uw vaders","refs":["Gen 11:26","Gen 11:31","Gen 12:1","Gen 31:53","Deut 26:5","Jes 51:2","Ezech 16:3"]},{"kopje":"andere goden gediend","refs":["Joz 24:15","Gen 31:19","Gen 31:30","Gen 31:32","Gen 31:53","Gen 35:4"]}],"3":[{"kopje":"nam","refs":["Gen 12:1-4","Neh 9:7","Neh 9:8","Hand 7:2","Hand 7:3"]},{"kopje":"gaf","refs":["Gen 21:2","Gen 21:3","Ps 127:3"]}],"4":[{"kopje":"aan Izak","refs":["Gen 25:24-26"]},{"kopje":"aan Ezau","refs":["Gen 32:3","Gen 36:8","Deut 2:5"]},{"kopje":"Jakob","refs":["Gen 46:1-7","Ps 105:23","Hand 7:15"]}],"5":[{"kopje":"zond","refs":["Ex 3:10","Ex 4:12","Ex 4:13","Ps 105:26"]},{"kopje":"trof","refs":["Ex 7:1","Ex 12:51","Ps 78:43-51","Ps 105:27-36","Ps 135:8","Ps 135:9","Ps 136:10"]}],"6":[{"kopje":"geleid","refs":["Ex 12:37","Ex 12:51","Micha 6:4"]},{"kopje":"Egyptenaars","refs":["Ex 14:1","Ex 15:27","Neh 9:11","Ps 77:16-21","Ps 78:13","Ps 136:13-15","Jes 63:12","Jes 63:13","Hand 7:36","Hebr 11:29"]}],"7":[{"kopje":"Zij nu","refs":["Ex 14:10"]},{"kopje":"bracht duisternis","refs":["Ex 14:20"]},{"kopje":"bracht","refs":["Ex 14:27","Ex 14:28"]},{"kopje":"uw n class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites;</span> but not with thy <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> nor with thy bow.","13":"And I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> for which ye did not <span class=\"wl wl-kjv\" data-code=\"H3021\">labour,</span> and <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> which ye <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> not, and ye <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in them; of the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards</span> and <span class=\"wl wl-kjv\" data-code=\"H2132\">oliveyards</span> which ye <span class=\"wl wl-kjv\" data-code=\"H5193\">planted</span> not do ye eat.","14":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him in <span class=\"wl wl-kjv\" data-code=\"H8549\">sincerity</span> and in <span class=\"wl wl-kjv\" data-code=\"H571\">truth:</span> and put <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> which your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> on the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H5104\">flood,</span> and in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> ye the LORD.","15":"And if it seem <span class=\"wl wl-kjv\" data-code=\"H7489\">evil</span> unto <span class=\"wl wl-kjv\" data-code=\"H4310\">you</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> you this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">whom</span> ye will <span class=\"wl wl-kjv\" data-code=\"H5647\">serve;</span> whether the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> which your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> that were on the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H5104\">flood,</span> or the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> in whose <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> ye <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell:</span> but as for me and my <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> we will <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the LORD.","16":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> God <span class=\"wl wl-kjv\" data-code=\"H2486\">forbid</span> that we should <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> gods;","17":"For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> he it is that brought us <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> and our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H5650\">bondage,</span> and which <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> those <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H226\">signs</span> in our <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">preserved</span> us in all the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> wherein we <span class=\"wl wl-kjv\" data-code=\"H1980\">went,</span> and among all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">through</span> whom we passed:","18":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> drave <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> us all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> even the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites</span> which <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> therefore will we also <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> for he is our God.","19":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Ye <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for he is an <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> he is a <span class=\"wl wl-kjv\" data-code=\"H7072\">jealous</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God;</span> he will not <span class=\"wl wl-kjv\" data-code=\"H5375\">forgive</span> your <span class=\"wl wl-kjv\" data-code=\"H6588\">transgressions</span> nor your sins.","20":"If ye <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H5236\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> then he will <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> and do you <span class=\"wl wl-kjv\" data-code=\"H7489\">hurt,</span> and <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> you, <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that he hath done you good.","21":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> Nay; but we will <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the LORD.","22":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Ye are <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses</span> against yourselves that ye have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> you the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him. And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We are witnesses.","23":"Now therefore put <span class=\"wl wl-kjv\" data-code=\"H5493\">away,</span> said he, the <span class=\"wl wl-kjv\" data-code=\"H5236\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> which are <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> you, and <span class=\"wl wl-kjv\" data-code=\"H5186\">incline</span> your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of Israel.","24":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> will we <span class=\"wl wl-kjv\" data-code=\"H5647\">serve,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> will we obey.","25":"So <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> them a <span class=\"wl wl-kjv\" data-code=\"H2706\">statute</span> and an <span class=\"wl wl-kjv\" data-code=\"H4941\">ordinance</span> in Shechem.","26":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> and set it <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> there under an <span class=\"wl wl-kjv\" data-code=\"H427\">oak,</span> that was by the <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> of the LORD.","27":"And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Behold, this <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H5713\">witness</span> unto us; for it hath <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> all the <span class=\"wl wl-kjv\" data-code=\"H561\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto us: it shall be therefore a <span class=\"wl wl-kjv\" data-code=\"H5713\">witness</span> unto you, lest ye <span class=\"wl wl-kjv\" data-code=\"H3584\">deny</span> your God.","28":"So <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> let the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">depart,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> unto his inheritance.","29":"And it came to pass <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">things,</span> that <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5126\">Nun,</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> being an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> old.","30":"And they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him in the <span class=\"wl wl-kjv\" data-code=\"H1366\">bord n 3:12; Rev 1:7."}],"14":[{"catchword":"in oprechtheid","tekst":"Dat is, oprechtelijk, van ganser harte, zonder bedrog."},{"catchword":"uw vaders","tekst":"Te weten, Therah, Nahor, enz., ja ook Abraham, eer God de Heere hem uit Ur der Chaldeën geroepen heeft."}],"15":[{"catchword":"Doch zo","tekst":"Jozua stelt het den Israëlieten niet vrij, God te dienen of niet; maar dit zegt hij opdat zij vrij en ongedwongen zouden verklaren wat zij te doen gezind waren, en opdat zij des te vaster zouden verbonden blijven God te dienen, nadat zij zulks vrijwillig aangenomen hadden te doen. Zie dergelijke manier van spreken, Rth 1:8-15."}],"16":[{"catchword":"Het zij verre","tekst":"Hebreeuws, het zij ons verre van te verlaten."}],"18":[{"catchword":"ook den HEERE dienen,","tekst":"Te weten, zowel als gij en uws vaders huis."}],"19":[{"catchword":"Gij zult","tekst":"Te weten, indien gij de vreemde goden bij u behoudt, vermengende den valsen godsdienst met den waren godsdienst, gelijk vs.23 af te nemen is."},{"catchword":"heilig God;","tekst":"Hebreeuws, Elohim Kedoschim hu. Zie hiervan Gen 20:13."},{"catchword":"vergeven","tekst":"Hebreeuws, wegnemen; gelijke manier van spreken zie Gen 50:17. Anders, niet verdragen."}],"21":[{"catchword":"Neen,","tekst":"Versta hierbij, wij zullen den Heere niet verlaten."}],"23":[{"catchword":"vreemde goden weg,","tekst":"Te weten de goden der vreemdelingen. Uit deze woorden is te zien, ofschoon er openlijk geen afgoderij is geduld geweest, dat er nochtans enigen onder de Israëlieten in dezen tijd waren, die de afgoden in het verborgen bij zich hadden, en die eerden en dienden. Zie Amo 5:25-26; Act 7:43. Zie ook Gen 35:2."}],"25":[{"catchword":"Alzo maakt Jozua","tekst":"Dat is, hij vernieuwde en bevestigde het verbond, hetwelk God met het volk Israëls had opgericht."},{"catchword":"te Sichem","tekst":"Zie boven, vs.1."}],"26":[{"catchword":"woorden","tekst":"Dat is, de woorden van dit verbond."},{"catchword":"den eik,","tekst":"Van dezen eik zie  on ver.2.] Thus saith the LORD the God of Israel , Your fathers dwelt of old (time) on the other side of the river , [ Understand the river Euphrates : so below v. 3,14,15.] (namely) Therah the father of Abraham,and the father of Nabor: and they served other gods. [ See Gen 11:26,31.& Deut.26,5.]"}],"3":[{"catchword":null,"tekst":"Then I took your father Abraham from the other side of the river, and made him walk thorow all the land of Canaan: I also increased his seed,and gave him Isaac. [See Gen 12:1.& 21.2.]"}],"4":[{"catchword":null,"tekst":"And unto Isaac I gave Jacob and Esau: [Here Esau the first-born is not named first, but Jacob: See the like also Gen 11:26 & 1 Chron.1.28.and in this Chap.v.5.] and unto Esau I gave Mount Seir, hereditary to possess it: but Jacob and his children went down into Egypt."}],"5":[{"catchword":null,"tekst":"Then I sent Moseh and Aaron,and plagued the Egyptians, according as i did in the midst thereof: and afterward I led you out thence."}],"6":[{"catchword":null,"tekst":"When I carried your fathers out of Egypt, then came unto the Sea, and the Egyptians pursued after your fathers,with charets, and with borsemen, onto the Red-sea."}],"7":[{"catchword":null,"tekst":"They now called unto the LORD, and he put a darkness between you, and covered them, and your eyes have seen what I have done in Egypt : [ This is to be understood of many of those that were under twenty years old when they departed out of Egypt,for they that were above the age of twenty (excepting Caleb and Joshua) they all dyed in the Wilderness ] after that ye have dwelt in the wilderness many days."}],"8":[{"catchword":null,"tekst":"Then I brought you into the land of Amorites,which dwelt on the other side of Jordan, they fought against you ,but I delivered them into your hand, and ye possess their land hereditarily, and I destroyed them before your face."}],"9":[{"catchword":null,"tekst":"Also Balak the son of Zippor, the King of the Moabites arose,and he fought against Israel: [ i.e. Intended, or purposed to fight: See Judg.11.25. compare Job 10:32,33. where the word stoning , is put for intending,or going about to stone.So that it seems,that this is to be understood of Balaks enmity shewed against Israel;first when he went about to curse them by Bilean;and after that, when by Bileams counsel,( by means of the Moabitish women) he brought them to commit first whoredom, and then idolatry, and so caused the wrath of God to come upon them] and he sent forth, ands caused to call (for) Bileam the son of Beor,that he might curse you."}],"11":[{"catchword":null,"tekst":"When he had passed over Jordan , and came to Jericho,the citizens [ Or Lords,or men] of Jericho warred against you , [ viz. those of Jericho by shutting their gates; but these nations which are named,by force of arms] the Amorites,and the Girgasites,the Hivites,and the Jebusites: but I delivered them into your hand."}],"12":[{"catchword":null,"tekst":"And I sent bornets [ Heb. the Hornet ] before you , they drave them away from your face , (as) both the kings of the Amorites , [ as if he should say , As ye before tim drave out both the Kings of the Amorites , to wit , Sihon and Og. See below ver. 18.] not by your sword , nor by your bowe . [ understand this also , of all other weapons and arms , as Gen. 48.22. Psal. 7.13 . & 44.3 , 13. The meaning of these words is , That their Swords and Bowes had been in vain had not the Lord destroyed their enemies ]"}],"13":[{"catchword":null,"tekst":"Thus I have given you a land wherein ye have not laboured , and cities which ye have not built , and ye not built , and ye dwell thereor thein : [ Jos. 11.13. it&rsquo;s said , That the Israelites banned , or utterly destroyed no cities , save Hazor onely. This was therefore done , that the children of Israel might finde houses and cities to dwell in ] ye eat of the vineyards and of the olives that grew upon the trees . See the like phrase or manner of speaking , Gen 3:12. & Rev 2:7. ] which ye have not planted ."}],"14":[{"catchword":null,"tekst":"And now , fear the LORD , and serve him in uprightness , [ i.e. uprightly , sincerely , with all the heart , without dissembling ] and in truth : and put away the gods which your fathers served [ viz.Therah , Nahor , etc. yea , Abraham himself , before God called him out of Ur of the Chaldees ] on the other side of the river , and in Egypt , and serve the LORD."}],"15":[{"catchword":null,"tekst":"But it be evil in your eyes to serve the LORD , chuse you this day whom ye will serve , whether the gods which your fathers that were on the other side of the river , served ; or the gods of Amorites,in whoseland ye dwell:[ Joshua leaves it not arbitrary to the Israelites, whether they should serve God or no;but this he saith,That they might freely, and without compulsion, declare what they were minded to do; and that they might be more firmly tyed to serve God,in that they had freely taken upon them to do it.See the like phrase or manner of speaking,Ruth 1.8,15.] but as for me and my house we will serve the LORD."}],"16":[{"catchword":null,"tekst":"Then answered the people, and said,Far he it from us,that we should forsake the LORD, [ Herb. Be it far to us from forsaking, & c.] to serve other gods."}],"17":[{"catchword":null,"tekst":"For the LORD is our God, it is he that brought us and our fathers up out of land of Egypt, out of the house of bondage: and that did these great tokens before our eyes, and kept us on all the way thorow which we went ,and among all people,through the midst of whom we marched."}],"18":[{"catchword":null,"tekst":"And the Lord hath driven out before our faces all those nations, even the Amorite, inhabitant of the land; we also will serve the LORD, [viz. as well as thou, and thy fathers house] for he is our God."}],"19":[{"catchword":null,"tekst":"Then Josua said un to the people , Ye will not be able to serve the LORD , [ viz. if ye keep with you the strange gods among you , mixing the false worship with the true worship of God , as may be gathered from vers. 23.] for he is a holy God ; [ Heb. Elohim Kedoschim hu. See hereof , Gen. 20, on ver. 13. ] He is a jealous God , he will not forgive [Heb. take away: see the like phrase or manner of speaking , Gen 50:17. oth. not bear or endure ] your transgression , nor your sins ."}],"20":[{"catchword":null,"tekst":"If ye shall forsake the LORD , and save strange gods , he will then turn about , and he will do you hurt , and he will destroy you , after that he hath done you good ."}],"21":[{"catchword":null,"tekst":"Then the people said unto Josua , Nay, [ Understand withall , we will not forsake the Lord ] but we will serve the LORD ."}],"22":[{"catchword":null,"tekst":"Now Josua said unto the people , ye are witnesses against your selves , that you have chosen you the LORD , to serve him : And they said , We are witnesses ."}],"23":[{"catchword":null,"tekst":"And now put away the strange gods which are in the midst of you , [ viz. the gods of the strangers .By these words it appeareth , That although idolatry was not publickly tolerated , yet there were some among the Israelites at this time , that had idols in secret , which they privately worshipped and served . See Amos 5. ver.25,26. & Act 7:43. See also Gen. 35.on ver. 2 . ] and encline your hearts unto the LORD the God of Israel ."}],"24":[{"catchword":null,"tekst":"And the people said unto Josua , We will serve the LORD our God , and we will obey his voice ."}],"25":[{"catchword":null,"tekst":"So Josua made that same day a covenant with the people : [ i.e. he renewed , and confirmed the Covenant which God had made with the people of Israel ] and be set it to them for a statute and right ( or , Ordinance ) at Sichem . [ See above vers. 1. ]"}],"26":[{"catchword":null,"tekst":"And Josua wrote these words [ i.e. the words of this Covenant ] in the book of the law of God : and he took a great stone , and he set the same up there under the Oak , which was by the sanctuary of the LORD .[ See of this Oak , Judg. 9.6.]"}],"27":[{"catchword":null,"tekst":"And Josua said unto all the people , Behold , this stone shall be for a witness unto us , for it hath heard all the words of the LORD , that he hath spoken unto us : [ i.e. it hath been there present . Here sense is ascribed and attributed unto the stone , which is void of sense . So likewise it is said , Hear , ye heavens , and thou earth , Isa 1:2. and Deut . 32.1. The heavens declare the glory of God , Psal. 19.1. The stones shall cry , Luk 19:40. ] yea , it shall be for a witnesse against you , that ye may not lye unto the LORD your God . [ but keep and do what ye have promised him ]"}],"28":[{"catchword":null,"tekst":"Then Josua sent the people away , each one unto his inheritance ."}],"30":[{"catchword":null,"tekst":"And they buried him in the border of his inheritance , at Timnath-Serah , [ Otherwise called , Timnath-Heres , Jud 2:9.] which is upon a Mountaine of Ephraim , on the North of Mount Gaas ."}],"31":[{"catchword":null,"tekst":"Now Israel served the LORD all the dayes of Josua , and all the dayes of the Eldest , that lived long after Josua , [ Heb. that prolonged their dayes after Josua . See Exod. 20.12.] and which knew all the work of the LORD, which he had done unto Israel . [ Understand here , those that together with Josua , had governed the people , and out-lived him . See Judg.2.7.]"}],"32":[{"catchword":null,"tekst":"They also buried the bones of Joseph , which the children of Israel had brought up out of Egypt , at Sichem , [ Understand this as above vers.1. For here followeth , That Joseph&rsquo;s bones were buried in the parcel of the field or ground , etc. which lay not in the City of Sichem , as may be gathered from Genes. 33.18. ] in that parcel of the field ich Jacob had bought of the children of Hemor , the father of Sichem , for an hundred pieces of money : [ See Genes. 33.19. and the annotat. thereon . Stephen , Act 7:16. saith For the price of silver ] for they were become an inheritance of the children of Joseph . [ viz. that parcel of the field and the burying place that was therein ]"}],"33":[{"catchword":null,"tekst":"Also Eleazar the son of Aaron died and they buried him on the hill of Pinehas his son , which was given him on mount Ephraim ."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
