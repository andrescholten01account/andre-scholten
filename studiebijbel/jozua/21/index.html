an Benjamin, door het lot, dertien steden.","5":"En aan de overgebleven kinderen van Kahath vielen, bij het lot, van de families van de stam van Efraïm, en van de stam van Dan, en van de halve stam van Manasse, tien steden.","6":"En aan de kinderen van Gerson, van de families van de stam van Issaschar, en van de stam van Aser, en van de stam van Nafthali, en van de halve stam van Manasse, in Bazan, bij het lot, dertien steden.","7":"Aan de kinderen van Merari, naar hun families, van de stam van Ruben, en van de stam van Gad, en van de stam van Zebulon, twaalf steden.","8":"Zo gaven de kinderen van Israël aan de Levieten deze steden en hun voorsteden, bij het lot, zoals de HEERE geboden had door de hand van Mozes.","9":"Verder gaven zij van de stam van de kinderen van Juda, en van de stam van de kinderen van Simeon, deze steden, die men bij name noemde;","10":"Dat zij waren van de kinderen van Aäron, van de families van de Kahathieten, uit de kinderen van Levi; want het eerste lot was voor hen.","11":"Zo gaven zij hun de stad van Arba, de vader van Anok (dat is Hebron), op het gebergte van Juda, en de voorsteden rondom haar.","12":"Maar het veld van de stad en haar dorpen gaven zij aan Kaleb, de zoon van Jefunne, tot zijn bezit.","13":"Zo gaven zij aan de kinderen van de priester Aäron de vrijstad voor de doodslager, Hebron en haar voorsteden, en Libna en haar voorsteden;","14":"En Jatthir en haar voorsteden, en Esthemoa en haar voorsteden;","15":"En Holon en haar voorsteden, en Debir en haar voorsteden;","16":"En Ain en haar voorsteden, en Jutta en haar voorsteden, en Beth-semes en haar voorsteden; negen steden van deze twee stammen.","17":"En van de stam van Benjamin, Gibeon en haar voorsteden, Geba en haar voorsteden;","18":"Anathoth en haar voorsteden, en Almon en haar voorsteden: vier steden.","19":"Al de steden van de kinderen van Aäron, de priesters, waren dertien steden en hun voorsteden.","20":"De families nu van de kinderen van Kahath, de Levieten, die overgebleven waren van de kinderen van Kahath, die hadden de steden van hun lot van de stam van Efraïm.","21":"En zij gaven hun Sichem, een vrijstad voor de doodslager, en haar voorsteden, op het gebergte van Efraïm, en Gezer en haar voorsteden;","22":"En Kibzaim en haar voorsteden, en Beth-horon en haar voorsteden: vier steden.","23":"En van de stam van Dan, Elteke en haar voorsteden, Gibbethon en haar voorsteden;","24":"Ajalon en haar voorsteden, Gath-rimmon en haar voorsteden: vier steden.","25":"En van de halve stam van Manasse, Thaanach en haar voorsteden, en Gath-rimmon en haar voorsteden: twee steden.","26":"Al de steden voor de families van de overige kinderen van Kahath zijn tien, met hun voorsteden.","27":"En aan de kinderen van Gerson, van de families van de Levieten, van de andere halve stam van Manasse, de vrijstad voor de doodslager, Golan in Bazan, en haar voorsteden, en Beesthera en haar voorsteden: twee steden.","28":"En van de stam van Issaschar, Kisjon en haar voorsteden, en Dobrath en haar voorsteden;","29":"Jarmuth en haar voorsteden, En-gannim en haar voorsteden: vier steden.","30":"En van de stam van Aser, Misal en haar voorsteden, Abdon en haar voorsteden;","31":"En Helkath en haar voorsteden, en Rehob en haar voorsteden: vier steden.","32":"En van de stam van Nafthali, de vrijstad voor de doodslager, Kedes in Galilea, en haar voorsteden, en Hammoth-dor en haar voorsteden, en Karthan en haar voorsteden: drie steden.","33":"Al de steden van de Gersonieten, naar hun families, zijn dertien steden en hun voorsteden.","34":"Aan de families nu van de kinderen van Merari, de overige Levieten, werd gegeven van de stam van Zebulon, Jokneam en haar voorsteden, Kartha en haar voorsteden;","35":"Dimna en haar voorsteden, Nahalal en haar voorsteden: vier steden.","36":"En van de stam van Ruben, Bezer en haar voorsteden, en Jahza en haar voorsteden;","37":"Kedemoth en haar voorsteden, en Mefaath en haar voorsteden: vier steden.","38":"Van de stam van Gad nu, de vrijstad voor de doodslager, Ramoth in Gilead, en haar voorsteden, en Mahanaim en haar voorsteden;","39":"Hesbon en haar voorsteden, Jaezer en haar voorsteden: al die steden zijn vier.","40":"Al die steden waren van de kinderen van Merari, naar hun families, die nog overig waren van de families van de Levieten; en hun lot was twaalf steden.","41":"Al de steden van de Levieten, te midden van het bezit van de kinderen van Israël, waren achtenveertig steden en hun voorsteden.","42":"Deze steden waren elk met haar voorsteden rondom haar; zo was het met al die steden.","43":"Zo gaf de HEERE aan Israël het hele land, dat Hij gezworen had aan hun vaderen te geven, en zij beërfden het, en woonden daarin.","44":"En de HEERE gaf hun rust rondom, naar alles wat Hij hun vaderen gezworen had; en er stond niet één man van al hun vijanden voor hen staande; al hun vijanden gaf de HEERE in hun hand.","45":"Er viel niet één woord weg van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam allemaal uit."},"SV":{"1":"Toen naderden de hoofden der vaderen van de Levieten tot Eleazar, den priester, en tot Jozua, den zoon van Nun, en tot de hoofden der vaderen van de stammen der kinderen Israëls;","2":"En zij spraken tot hen, te Silo, in het land Kanaän, zeggende: De HEERE heeft geboden door den dienst van Mozes, dat men ons steden te bewonen geven zou, en haar voorsteden voor onze beesten.","3":"Daarom gaven de kinderen Israëls aan de Levieten van hun erfdeel, naar den mond des HEEREN, deze steden en de voorsteden derzelve.","4":"Toen ging het lot uit voor de huisgezinnen der Kahathieten; en voor de kinderen van Aäron, den priester, uit de Levieten, waren van den stam van Juda, en van den stam van Simeon, en van den stam van Benjamin, door het lot, dertien steden.","5":"En aan de overgebleven kinderen van Kahath vielen, bij het lot, van de huisgezinnen van den stam van Efraïm, en van den stam van Dan, en van den halven stam van Manasse, tien steden.","6":"En aan de kinderen van Gerson, van de huisgezinnen van den stam van Issaschar, en van den stam van Aser, en van den stam van Nafthali, en van den halven stam van Manasse, in Bazan, bij het lot, dertien steden.","7":"Aan de kinderen van Merari, naar hun huisgezinnen, van den stam van Ruben, en van den stam van Gad, en van den stam van Zebulon, twaalf steden.","8":"Alzo gaven de kinderen Israëls aan de Levieten deze steden en haar voorsteden, bij het lot, gelijk de HEERE geboden had door den dienst van Mozes.","9":"Verder gaven zij van den stam der kinderen van Juda, en van den stam der kinderen van Simeon, deze steden, die men bij name noemde;","10":"Dat zij waren van de kinderen van Aäron, van de huisgezinnen der Kahathieten, uit de kinderen van Levi; want het eerste lot was het hunne.","11":"Zo gaven zij hun de stad van Arba, den vader van Anok ( zij is Hebron), op den berg van Juda, en haar voorsteden rondom haar.","12":"Maar het veld der stad en haar dorpen, gaven zij aan Kaleb, den zoon van Jefunne, tot zijn bezitting.","13":"Alzo gaven zij aan de kinderen van den priester Aäron de vrijstad des doodslagers, Hebron en haar voorsteden, en Libna en haar voorsteden;","14":"En Jatthir en haar voorsteden, en Esthemoa en haar voorsteden;","15":"En Holon en haar voorsteden, en Debir en haar voorsteden;","16":"En Ain en haar voorsteden, en Jutta en haar voorsteden, en Beth-semes en haar voorsteden; negen steden van deze twee stammen.","17":"En van den stam van Benjamin, Gibeon en haar voorsteden, Geba en haar voorsteden;","18":"Anathoth en haar voorsteden, en Almon en haar voorsteden: vier steden.","19":"Al de steden der kinderen van Aäron, de priesteren, waren dertien steden en haar voorsteden.","20":"De huisgezinnen nu der kinderen van Kahath, de Levieten, die overgebleven waren van de kinderen van Kahath, die hadden de steden huns lots van den stam van Efraïm.","21":"En zij gaven hun Sichem, een vrijstad des doodslagers, en haar voorsteden, op den berg Efraïm, en Gezer en haar voorsteden;","22":"En Kibzaim en haar voorsteden, en Beth-horon en haar voorsteden: vier steden.","23":"En van den stam van Dan, Elteke en haar voorsteden, Gibbethon en haar voorsteden;","24":"Ajalon en haar voorsteden, Gath-rimmon en haar voorsteden: vier steden.","25":"En van den halven stam van Manasse, Thaanach en haar voorsteden, en Gath-rimmon en haar voorsteden: twee steden.","26":"Al de steden voor de huisgezinnen van de overige kinderen van Kahath zijn tien, met haar voorsteden.","27":"En aan de kinderen van Gerson, van de huisgezinnen der Levieten, van den halven stam van Manasse, de vrijstad des doodslagers, Golan in Bazan, en haar voorsteden, en Beesthera en haar voorsteden: twee steden.","28":"En van den stam van Issaschar, Kisjon en haar voorsteden, en Dobrath en haar voorsteden;","29":"Jarmuth en haar voorsteden, En-gannim en haar voorsteden: vier steden.","30":"En van den stam van Aser, Misal en haar voorsteden, Abdon en haar voorsteden;","31":"En Helkath en haar voorsteden, en Rehob en haar voorsteden: vier steden.","32":"En van den stam van Nafthali, de vrijstad des doodslagers, Kedes in Galilea, en haar voorsteden, en Hammoth-dor en haar voorsteden, en Karthan en haar voorsteden: drie steden.","33":"Al de steden der Gersonieten, naar hun huisgezinnen, zijn dertien steden en haar voorsteden.","34":"Aan de huisgezinnen nu van de kinderen van Merari, van de overige Levieten, *werd* *gegeven* van den stam van Zebulon, Jokneam en haar voorsteden, Kartha en haar voorsteden;","35":"Dimna en haar voorsteden, Nahalal en haar voorsteden: vier steden.","36":"En van den stam van Ruben, Bezer en haar voorsteden, en Jahza en haar voorsteden;","37":"Kedemoth en haar voorsteden, en Mefaath en haar voorsteden: vier steden.","38":"Van den stam van Gad nu, de vrijstad des doodslagers, Ramoth in Gilead, en haar voorsteden, en Mahanaim en haar voorsteden;","39":"Hesbon en haar voorsteden, Jaezer en haar voorsteden: al die steden zijn vier.","40":"Al die steden waren van de kinderen van Merari, naar hun huisgezinnen, die nog overig waren van de huisgezinnen der Levieten; en hun lot was twaalf steden.","41":"Al de steden der Levieten, in het midden van de erfenis der kinderen Israëls, waren acht en veertig steden en haar voorsteden.","42":"Deze steden waren elk met haar voorsteden rondom haar; alzo was het met al die steden.","43":"Alzo gaf de HEERE aan Israël het ganse land, dat Hij gezworen had hun vaderen te geven, en zij beerfden het, en woonden daarin.","44":"En de HEERE gaf hun rust rondom, naar alles, wat Hij hun vaderen gezworen had; en er bestond niet een man van al hun vijanden voor hun aangezicht; al hun vijanden gaf de HEERE in hun hand.","45":"Er viel niet een woord van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam altemaal."},"KJV":{"1":"Then came near the heads of the fathers of the Levites unto Eleazar the priest, and unto Joshua the son of Nun, and unto the heads of the fathers of the tribes of the children of Israel;","2":"And they spake unto them at Shiloh in the land of Canaan, saying, The LORD commanded by the hand of Moses to give us cities to dwell in, with the suburbs thereof for our cattle.","3":"And the children of Israel gave unto the Levites out of their inheritance, at the commandment of the LORD, these cities and their suburbs.","4":"And the lot came out for the families of the Kohathites: and the children of Aaron the priest, *which were* of the Levites, had by lot out of the tribe of Judah, and out of the tribe of Simeon, and out of the tribe of Benjamin, thirteen cities.","5":"And the rest of the children of Kohath *had* by lot out of the families of the tribe of Ephraim, and out of the tribe of Dan, and out of the half tribe of Manasseh, ten cities.","6":"And the children of Gershon *had* by lot out of the families of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the half tribe of Manasseh in Bashan, thirteen cities.","7":"The children of Merari by their families *had* out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.","8":"And the children of Israel gave by lot unto the Levites these cities with their suburbs, as the LORD commanded by the hand of Moses.","9":"And they gave out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, these cities which are *here* mentioned by name,","10":"Which the children of Aaron, *being* of the families of the Kohathites, *who were* of the children of Levi, had: for theirs was the first lot.","11":"And they gave them the city of Arba the father of Anak, which *city is* Hebron, in the hill *country* of Judah, with the suburbs thereof round about","12":"But the fields of the city, and the villages thereof, gave they to Caleb the son of Jephunneh for his possession.","13":"Thus they gave to the children of Aaron the priest Hebron with her suburbs, *to be* a city of refuge for the slayer; and Libnah with her suburbs,","14":"And Jattir with her suburbs, and Eshtemoa with her suburbs,","15":"And Holon with her suburbs, and Debir with her suburbs,","16":"And Ain with her suburbs, and Juttah with her suburbs, *and* Bethshemesh with her suburbs; nine cities out of those two tribes.","17":"And out of the tribe of Benjamin, Gibeon with her suburbs, Geba with her suburbs,","18":"Anathoth with her suburbs, and Almon with her suburbs; four cities.","19":"All the cities of the children of Aaron, the priests, *were* thirteen cities with their suburbs.","20":"And the families of the children of Kohath, the Levites which remained of the children of Kohath, even they had the cities of their lot out of the tribe of Ephraim.","21":"For they gave them Shechem with her suburbs in mount Ephraim, *to be* a city of refuge for the slayer; and Gezer with her suburbs,","22":"And Kibzaim with her suburbs, and Bethhoron with her suburbs; four cities.","23":"And out of the tribe of Dan, Eltekeh with her suburbs, Gibbethon with her suburbs,","24":"Aijalon with her suburbs, Gathrimmon with her suburbs; four cities.","25":"And out of the half tribe of Manasseh, Tanach with her suburbs, and Gathrimmon with her suburbs; two cities.","26":"All the cities *were* ten with their suburbs for the families of the children of Kohath that remained.","27":"And unto the children of Gershon, of the families of the Levites, out of the *other* half tribe of Manasseh *they gave* Golan in Bashan with her suburbs, *to be* a city of refuge for the slayer; and Beeshterah with her suburbs; two cities.","28":"And out of the tribe of Issachar, Kishon with her suburbs, Dabareh with her suburbs,","29":"Jarmuth with her suburbs, Engannim with her suburbs; four cities.","30":"And out of the tribe of Asher, Mishal with her suburbs, Abdon with her suburbs,","31":"Helkath with her suburbs, and Rehob with her suburbs; four cities.","32":"And out of the tribe of Naphtali, Kedesh in Galilee with her suburbs, *to be* a city of refuge for the slayer; and Hammothdor with her suburbs, and Kartan with her suburbs; three cities.","33":"All the cities of the Gershonites according to their families *were* thirteen cities with their suburbs.","34":"And unto the families of the children of Merari, the rest of the Levites, out of the tribe of Zebulun, Jokneam with her suburbs, and Kartah with her suburbs,","35":"Dimnah with her suburbs, Nahalal with her suburbs; four cities.","36":"And out of the tribe of Reuben, Bezer with her suburbs, and Jahazah","37":"Kedemoth with her suburbs, and Mephaath with her suburbs; four cities.","38":"And out of the tribe of Gad, Ramoth in Gilead with her suburbs, *to be* a city of refuge for the slayer; and Mahanaim with her suburbs,","39":"Heshbon with her suburbs, Jazer with her suburbs; four cities","40":"So all the cities for the children of Merari by their families, which were remaining of the families of the Levites, were *by* their lot twelve /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
