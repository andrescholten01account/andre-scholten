spraken tot hen, te Silo, in het land Kanaän, en zeiden: De HEERE heeft geboden door de hand van Mozes, dat men ons steden zou geven om te bewonen, en de voorsteden ervan voor ons vee.", "3": "Daarom gaven de kinderen van Israël aan de Levieten van hun erfdeel, naar het bevel van de HEERE, deze steden en de voorsteden daarvan.", "4": "Toen ging het lot uit voor de families van de Kahathieten; en voor de kinderen van Aäron, de priester, uit de Levieten, waren er van de stam van Juda, en van de stam van Simeon, en van de stam van Benjamin, door het lot, dertien steden.", "5": "En aan de overgebleven kinderen van Kahath vielen, bij het lot, van de families van de stam van Efraïm, en van de stam van Dan, en van de halve stam van Manasse, tien steden.", "6": "En aan de kinderen van Gerson, van de families van de stam van Issaschar, en van de stam van Aser, en van de stam van Nafthali, en van de halve stam van Manasse, in Bazan, bij het lot, dertien steden.", "7": "Aan de kinderen van Merari, naar hun families, van de stam van Ruben, en van de stam van Gad, en van de stam van Zebulon, twaalf steden.", "8": "Zo gaven de kinderen van Israël aan de Levieten deze steden en hun voorsteden, bij het lot, zoals de HEERE geboden had door de hand van Mozes.", "9": "Verder gaven zij van de stam van de kinderen van Juda, en van de stam van de kinderen van Simeon, deze steden, die men bij name noemde;", "10": "Dat zij waren van de kinderen van Aäron, van de families van de Kahathieten, uit de kinderen van Levi; want het eerste lot was voor hen.", "11": "Zo gaven zij hun de stad van Arba, de vader van Anok (dat is Hebron), op het gebergte van Juda, en de voorsteden rondom haar.", "12": "Maar het veld van de stad en haar dorpen gaven zij aan Kaleb, de zoon van Jefunne, tot zijn bezit.", "13": "Zo gaven zij aan de kinderen van de priester Aäron de vrijstad voor de doodslager, Hebron en haar voorsteden, en Libna en haar voorsteden;", "14": "En Jatthir en haar voorsteden, en Esthemoa en haar voorsteden;", "15": "En Holon en haar voorsteden, en Debir en haar voorsteden;", "16": "En Ain en haar voorsteden, en Jutta en haar voorsteden, en Beth-semes en haar voorsteden; negen steden van deze twee stammen.", "17": "En van de stam van Benjamin, Gibeon en haar voorsteden, Geba en haar voorsteden;", "18": "Anathoth en haar voorsteden, en Almon en haar voorsteden: vier steden.", "19": "Al de steden van de kinderen van Aäron, de priesters, waren dertien steden en hun voorsteden.", "20": "De families nu van de kinderen van Kahath, de Levieten, die overgebleven waren van de kinderen van Kahath, die hadden de steden van hun lot van de stam van Efraïm.", "21": "En zij gaven hun Sichem, een vrijstad voor de doodslager, en haar voorsteden, op het gebergte van Efraïm, en Gezer en haar voorsteden;", "22": "En Kibzaim en haar voorsteden, en Beth-horon en haar voorsteden: vier steden.", "23": "En van de stam van Dan, Elteke en haar voorsteden, Gibbethon en haar voorsteden;", "24": "Ajalon en haar voorsteden, Gath-rimmon en haar voorsteden: vier steden.", "25": "En van de halve stam van Manasse, Thaanach en haar voorsteden, en Gath-rimmon en haar voorsteden: twee steden.", "26": "Al de steden voor de families van de overige kinderen van Kahath zijn tien, met hun voorsteden.", "27": "En aan de kinderen van Gerson, van de families van de Levieten, van de andere halve stam van Manasse, de vrijstad voor de doodslager, Golan in Bazan, en haar voorsteden, en Beesthera en haar voorsteden: twee steden.", "28": "En van de stam van Issaschar, Kisjon en haar voorsteden, en Dobrath en haar voorsteden;", "29": "Jarmuth en haar voorsteden, En-gannim en haar voorsteden: vier steden.", "30": "En van de stam van Aser, Misal en haar voorsteden, Abdon en haar voorsteden;", "31": "En Helkath en haar voorsteden, en Rehob en haar voorsteden: vier steden.", "32": "En van de stam van Nafthali, de vrijstad voor de doodslager, Kedes in Galilea, en haar voorsteden, en Hammoth-dor en haar voorsteden, en Karthan en haar voorsteden: drie steden.", "33": "Al de steden van de Gersonieten, naar hun families, zijn dertien steden en hun voorsteden.", "34": "Aan de families nu van de kinderen van Merari, de overige Levieten, werd gegeven van de stam van Zebulon, Jokneam en haar voorsteden, Kartha en haar voorsteden;", "35": "Dimna en haar voorsteden, Nahalal en haar voorsteden: vier steden.", "36": "En van de stam van Ruben, Bezer en haar voorsteden, en Jahza en haar voorsteden;", "37": "Kedemoth en haar voorsteden, en Mefaath en haar voorsteden: vier steden.", "38": "Van de stam van Gad nu, de vrijstad voor de doodslager, Ramoth in Gilead, en haar voorsteden, en Mahanaim en haar voorsteden;", "39": "Hesbon en haar voorsteden, Jaezer en haar voorsteden: al die steden zijn vier.", "40": "Al die steden waren van de kinderen van Merari, naar hun families, die nog overig waren van de families van de Levieten; en hun lot was twaalf steden.", "41": "Al de steden van de Levieten, te midden van het bezit van de kinderen van Israël, waren achtenveertig steden en hun voorsteden.", "42": "Deze steden waren elk met haar voorsteden rondom haar; zo was het met al die steden.", "43": "Zo gaf de HEERE aan Israël het hele land, dat Hij gezworen had aan hun vaderen te geven, en zij beërfden het, en woonden daarin.", "44": "En de HEERE gaf hun rust rondom, naar alles wat Hij hun vaderen gezworen had; en er stond niet één man van al hun vijanden voor hen staande; al hun vijanden gaf de HEERE in hun hand.", "45": "Er viel niet één woord weg van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam allemaal uit."}, "SV": {"1": "Toen naderden de hoofden der vaderen van de Levieten tot Eleazar, den priester, en tot Jozua, den zoon van Nun, en tot de hoofden der vaderen van de stammen der kinderen Israëls;", "2": "En zij spraken tot hen, te Silo, in het land Kanaän, zeggende: De HEERE heeft geboden door den dienst van Mozes, dat men ons steden te bewonen geven zou, en haar voorsteden voor onze beesten.", "3": "Daarom gaven de kinderen Israëls aan de Levieten van hun erfdeel, naar den mond des HEEREN, deze steden en de voorsteden derzelve.", "4": "Toen ging het lot uit voor de huisgezinnen der Kahathieten; en voor de kinderen van Aäron, den priester, uit de Levieten, waren van den stam van Juda, en van den stam van Simeon, en van den stam van Benjamin, door het lot, dertien steden.", "5": "En aan de overgebleven kinderen van Kahath vielen, bij het lot, van de huisgezinnen van den stam van Efraïm, en van den stam van Dan, en van den halven stam van Manasse, tien steden.", "6": "En aan de kinderen van Gerson, van de huisgezinnen van den stam van Issaschar, en van den stam van Aser, en van den stam van Nafthali, en van den halven stam van Manasse, in Bazan, bij het lot, dertien steden.", "7": "Aan de kinderen van Merari, naar hun huisgezinnen, van den stam van Ruben, en van den stam van Gad, en van den stam van Zebulon, twaalf steden.", "8": "Alzo gaven de kinderen Israëls aan de Levieten deze steden en haar voorsteden, bij het lot, gelijk de HEERE geboden had door den dienst van Mozes.", "9": "Verder gaven zij van den stam der kinderen van Juda, en van den stam der kinderen van Simeon, deze steden, die men bij name noemde;", "10": "Dat zij waren van de kinderen van Aäron, van de huisgezinnen der Kahathieten, uit de kinderen van Levi; want het eerste lot was het hunne.", "11": "Zo gaven zij hun de stad van Arba, den vader van Anok ( zij is Hebron), op den berg van Juda, en haar voorsteden rondom haar.", "12": "Maar het veld der stad en haar dorpen, gaven zij aan Kaleb, den zoon van Jefunne, tot zijn bezitting.", "13": "Alzo gaven zij aan de kinderen van den priester Aäron de vrijstad des doodslagers, Hebron en haar voorsteden, en Libna en haar voorsteden;", "14": "En Jatthir en haar voorsteden, en Esthemoa en haar voorsteden;", "15": "En Holon en haar voorsteden, en Debir en haar voorsteden;", "16": "En Ain en haar voorsteden, en Jutta en haar voorsteden, en Beth-semes en haar voorsteden; negen steden van deze twee stammen.", "17": "En van den stam van Benjamin, Gibeon en haar voorsteden, Geba en haar voorsteden;", "18": "Anathoth en haar voorsteden, en Almon en haar voorsteden: vier steden.", "19": "Al de steden der kinderen van Aäron, de priesteren, waren dertien steden en haar voorsteden.", "20": "De huisgezinnen nu der kinderen van Kahath, de Levieten, die overgebleven waren van de kinderen van Kahath, die hadden de steden huns lots van den stam van Efraïm.", "21": "En zij gaven hun Sichem, een vrijstad des doodslagers, en haar voorsteden, op den berg Efraïm, en Gezer en haar voorsteden;", "22": "En Kibzaim en haar voorsteden, en Beth-horon en haar voorsteden: vier steden.", "23": "En van den stam van Dan, Elteke en haar voorsteden, Gibbethon en haar voorsteden;", "24": "Ajalon en haar voorsteden, Gath-rimmon en haar voorsteden: vier steden.", "25": "En van den halven stam van Manasse, Thaanach en haar voorsteden, en Gath-rimmon en haar voorsteden: twee steden.", "26": "Al de steden voor de huisgezinnen van de overige kinderen van Kahath zijn tien, met haar voorsteden.", "27": "En aan de kinderen van Gerson, van de huisgezinnen der Levieten, van den halven stam van Manasse, de vrijstad des doodslagers, Golan in Bazan, en haar voorsteden, en Beesthera en haar voorsteden: twee steden.", "28": "En van den stam van Issaschar, Kisjon en haar voorsteden, en Dobrath en haar voorsteden;", "29": "Jarmuth en haar voorsteden, En-gannim en haar voorsteden: vier steden.", "30": "En van den stam van Aser, Misal en haar voorsteden, Abdon en haar voorsteden;", "31": "En Helkath en haar voorsteden, en Rehob en haar voorsteden: vier steden.", "32": "En van den stam van Nafthali, de vrijstad des doodslagers, Kedes in Galilea, en haar voorsteden, en Hammoth-dor en haar voorsteden, en Karthan en haar voorsteden: drie steden.", "33": "Al de steden der Gersonieten, naar hun huisgezinnen, zijn dertien steden en haar voorsteden.", "34": "Aan de huisgezinnen nu van de kinderen van Merari, van de overige Levieten, *werd* *gegeven* van den stam van Zebulon, Jokneam en haar voorsteden, Kartha en haar voorsteden;", "35": "Dimna en haar voorsteden, Nahalal en haar voorsteden: vier steden.", "36": "En van den stam van Ruben, Bezer en haar voorsteden, en Jahza en haar voorsteden;", "37": "Kedemoth en haar voorsteden, en Mefaath en haar voorsteden: vier steden.", "38": "Van den stam van Gad nu, de vrijstad des doodslagers, Ramoth in Gilead, en haar voorsteden, en Mahanaim en haar voorsteden;", "39": "Hesbon en haar voorsteden, Jaezer en haar voorsteden: al die steden zijn vier.", "40": "Al die steden waren van de kinderen van Merari, naar hun huisgezinnen, die nog overig waren van de huisgezinnen der Levieten; en hun lot was twaalf steden.", "41": "Al de steden der Levieten, in het midden van de erfenis der kinderen Israëls, waren acht en veertig steden en haar voorsteden.", "42": "Deze steden waren elk met haar voorsteden rondom haar; alzo was het met al die steden.", "43": "Alzo gaf de HEERE aan Israël het ganse land, dat Hij gezworen had hun vaderen te geven, en zij beerfden het, en woonden daarin.", "44": "En de HEERE gaf hun rust rondom, naar alles, wat Hij hun vaderen gezworen had; en er bestond niet een man van al hun vijanden voor hun aangezicht; al hun vijanden gaf de HEERE in hun hand.", "45": "Er viel niet een woord van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam altemaal."}, "KJV": {"1": "Then came near the heads of the fathers of the Levites unto Eleazar the priest, and unto Joshua the son of Nun, and unto the heads of the fathers of the tribes of the children of Israel;", "2": "And they spake unto them at Shiloh in the land of Canaan, saying, The LORD commanded by the hand of Moses to give us cities to dwell in, with the suburbs thereof for our cattle.", "3": "And the children of Israel gave unto the Levites out of their inheritance, at the commandment of the LORD, these cities and their suburbs.", "4": "And the lot came out for the families of the Kohathites: and the children of Aaron the priest, *which were* of the Levites, had by lot out of the tribe of Judah, and out of the tribe of Simeon, and out of the tribe of Benjamin, thirteen cities.", "5": "And the rest of the children of Kohath *had* by lot out of the families of the tribe of Ephraim, and out of the tribe of Dan, and out of the half tribe of Manasseh, ten cities.", "6": "And the children of Gershon *had* by lot out of the families of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the half tribe of Manasseh in Bashan, thirteen cities.", "7": "The children of Merari by their families *had* out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.", "8": "And the children of Israel gave by lot unto the Levites these cities with their suburbs, as the LORD commanded by the hand of Moses.", "9": "And they gave out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, these cities which are *here* mentioned by name,", "10": "Which the children of Aaron, *being* of the families of the Kohathites, *who were* of the children of Levi, had: for theirs was the first lot.", "11": "And they gave them the city of Arba the father of Anak, which *city is* Hebron, in the hill *country* of Judah, with the suburbs thereof round about", "12": "But the fields of the city, and the villages thereof, gave they to Caleb the son of Jephunneh for his possession.", "13": "Thus they gave to the children of Aaron the priest Hebron with her suburbs, *to be* a city of refuge for the slayer; and Libnah with her suburbs,", "14": "And Jattir with her suburbs, and Eshtemoa with her suburbs,", "15": "And Holon with her suburbs, and Debir with her suburbs,", "16": "And Ain with her suburbs, and Juttah with her suburbs, *and* Bethshemesh with her suburbs; nine cities out of those two tribes.", "17": "And out of the tribe of Benjamin, Gibeon with her suburbs, Geba with her suburbs,", "18": "Anathoth with her suburbs, and Almon with her suburbs; four cities.", "19": "All the cities of the children of Aaron, the priests, *were* thirteen cities with their suburbs.", "20": "And the families of the children of Kohath, the Levites which remained of the children of Kohath, even they had the cities of their lot out of the tribe of Ephraim.", "21": "For they gave them Shechem with her suburbs in mount Ephraim, *to be* a city of refuge for the slayer; and Gezer with her suburbs,", "22": "And Kibzaim with her suburbs, and Bethhoron with her suburbs; four cities.", "23": "And out of the tribe of Dan, Eltekeh with her suburbs, Gibbethon with her suburbs,", "24": "Aijalon with her suburbs, Gathrimmon with her suburbs; four cities.", "25": "And out of the half tribe of Manasseh, Tanach with her suburbs, and Gathrimmon with her suburbs; two cities.", "26": "All the cities *were* ten with their suburbs for the families of the children of Kohath that remained.", "27": "And unto the children of Gershon, of the families of the Levites, out of the *other* half tribe of Manasseh *they gave* Golan in Bashan with her suburbs, *to be* a city of refuge for the slayer; and Beeshterah with her suburbs; two cities.", "28": "And out of the tribe of Issachar, Kishon with her suburbs, Dabareh with her suburbs,", "29": "Jarmuth with her suburbs, Engannim with her suburbs; four cities.", "30": "And out of the tribe of Asher, Mishal with her suburbs, Abdon with her suburbs,", "31": "Helkath with her suburbs, and Rehob with her suburbs; four cities.", "32": "And out of the tribe of Naphtali, Kedesh in Galilee with her suburbs, *to be* a city of refuge for the slayer; and Hammothdor with her suburbs, and Kartan with her suburbs; three cities.", "33": "All the cities of the Gershonites according to their families *were* thirteen cities with their suburbs.", "34": "And unto the families of the children of Merari, the rest of the Levites, out of the tribe of Zebulun, Jokneam with her suburbs, and Kartah with her suburbs,", "35": "Dimnah with her suburbs, Nahalal with her suburbs; four cities.", "36": "And out of the tribe of Reuben, Bezer with her suburbs, and Jahazah", "37": "Kedemoth with her suburbs, and Mephaath with her suburbs; four cities.", "38": "And out of the tribe of Gad, Ramoth in Gilead with her suburbs, *to be* a city of refuge for the slayer; and Mahanaim with her suburbs,", "39": "Heshbon with her suburbs, Jazer with her suburbs; four cities", "40": "So all the cities for the children of Merari by their families, which were remaining of the families of the Levites, were *by* their lot twelve cities.", "41": "All the cities of the Levites within the possession of the children of Israel *were* forty and eight cities with their suburbs.", "42": "These cities were every one with their suburbs round about them: thus *were* all these cities.", "43": "And the LORD gave unto Israel all the land which he sware to give unto their fathers; and they possessed it, and dwelt", "44": "And the LORD gave them rest round about, according to all that he sware unto their fathers: and there stood not a man of all their enemies before them; the LORD delivered all their enemies into their hand.", "45": "There failed not ought of any good thing which the LORD had spoken unto the house of Israel; all came to pass."}}, "tsk": {"1": [{"kopje": "de hoofden", "refs": ["Joz 19:51", "Ex 6:13", "Ex 6:24"]}, {"kopje": "Eleazar", "refs": ["Joz 14:1", "Joz 17:4", "Num 34:17-29"]}], "2": [{"kopje": "Silo", "refs": ["Joz 18:1"]}, {"kopje": "De HEERE", "refs": ["Num 35:2-8", "Ezech 48:9-18", "Matt 10:10", "Gal 6:6", "1 Tim 5:17", "1 Tim 5:18"]}], "3": [{"kopje": "aan de Levieten", "refs": ["Gen 49:7", "Deut 33:8-10", "1 Kron 6:54-81"]}], "4": [{"kopje": "de kinderen", "refs": ["Joz 21:8-19", "Joz 24:33", "1 Kron 6:54-60
