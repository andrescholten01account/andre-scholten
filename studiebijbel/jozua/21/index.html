et, dat alle legers van de HEERE uit Egypteland gegaan zijn.", "Num 21:32": "Daarna zond Mozes om Jaezer te verspieden; en zij namen haar onderhorige plaatsen in; en hij dreef de Amorieten die er waren uit hun bezit.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Num 34:17-29": "Dit zijn de namen van de mannen die voor u het land ter erfenis zullen uitdelen: Eleazar, de priester, en Jozua, de zoon van Nun. Verder zult u uit elke stam één leider nemen, om het land ter erfenis uit te delen. En dit zijn de namen van deze mannen: van de stam van Juda, Kaleb, zoon van Jefunne;", "Ps 105:42": "Want Hij dacht aan Zijn heilig woord, aan Abraham, Zijn knecht.", "Joz 14:15": "De naam van Hebron was vroeger Kirjath-Arba; die Arba een groot man geweest is onder de Enakieten. En het land had rust van de oorlog.", "Neh 1:5": "En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Num 35:2-8": "Gebied de Israëlieten dat zij van de erfenis van hun bezitting steden aan de Levieten geven om te bewonen; daarbij zult u aan de Levieten ook voorsteden geven, rondom de steden. En die steden zullen zij hebben om te bewonen; maar hun voorsteden zullen zijn voor hun vee, en voor hun bezit, en voor al hun dieren, En de voorsteden van de steden, die u aan de Levieten zult geven, zullen van de stadsmuur af, naar buiten toe, duizend el zijn, rondom.", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "Ps 92:15": "In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "1 Kron 15:7": "Van de nakomelingen van Gersom was Joël leider, en van zijn broeders waren er honderddertig.", "Joz 10:23": "Zij nu deden zo, en brachten tot hem die vijf koningen uit de grot: de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon.", "1 Kron 6:77": "De overige kinderen van Merari hadden van de stam van Zebulon: Rimmono en haar voorsteden, Thabor en haar voorsteden;", "Jer 33:25": "Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld;", "Joz 16:5": "Het gebied nu van de kinderen van Efraïm, naar hun huisgezinnen, is dit: namelijk, de grens van hun erfdeel was oostwaarts Atroth-addar tot aan het bovenste Beth-horon.", "1 Kron 6:68": "En Jokmeam en haar voorsteden, en Beth-horon en haar voorsteden,", "Joz 19:26": "En Allammelech, en Am-ad, en Mis-al; en zij reikt aan Karmel westwaarts, en aan Sichor-libnath;", "Joz 18:25": "Gibeon, en Rama, en Beeroth,", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Joz 21:13-18": "Zo gaven zij aan de kinderen van de priester Aäron de vrijstad voor de doodslager, Hebron en haar voorsteden, en Libna en haar voorsteden; En Jatthir en haar voorsteden, en Esthemoa en haar voorsteden; En Holon en haar voorsteden, en Debir en haar voorsteden;", "Joz 15:42": "Libna, en Ether, en Asan,", "Hagg 2:6": "Met het woord, waarmee Ik met u een verbond gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd!", "2 Sam 17:24": "David nu kwam te Mahanaïm, en Absalom trok de Jordaan over, hij en alle mannen van Israël met hem.", "Hos 2:18": "En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.", "2 Sam 19:32": "Barzillai nu was zeer oud, een man van tachtig jaar; en hij had de koning van voedsel voorzien toen hij in Mahanaïm verbleef; want hij was een zeer belangrijk man.", "Jes 49:7": "Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft.", "Joz 15:54": "en Humta, en Kirjath-arba, dat is Hebron, en Zior; negen steden en haar dorpen.", "1 Tess 5:24": "Hij, Die u roept, is getrouw, Die het ook doen zal.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Joz 15:14": "En Kaleb verdreef vandaar de drie zonen van Enak, Sesai, en Ahiman, en Talmai, geboren uit Enak.", "Joz 10:29": "Toen trok Jozua door, en heel Israël met hem, van Makkeda naar Libna, en hij streed tegen Libna.", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Rom 11:1": "Ik zeg dan: Heeft God Zijn volk verstoten? Dat zij verre. Want ik ben ook een Israëliet, uit het zaad van Abraham, van de stam Benjamin.", "Ps 146:6": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.", "Ex 6:4": "En ook heb Ik het gekerm gehoord van de kinderen van Israël, die de Egyptenaars in dienstbaarheid houden, en Ik heb aan Mijn verbond gedacht.", "Joz 15:32": "en Lebaoth, en Silhim, en Aïn, en Rimmon. Al deze steden zijn negenentwintig, met haar dorpen.", "Num 4:22-28": "Neem ook de som op van de zonen van Gerson, naar het huis van hun vaderen, naar hun geslachten. U zult hen tellen van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die komt om in de strijd te dienen, om de dienst te verrichten in de tent der samenkomst. Dit zal de dienst zijn van de geslachten van de Gersonieten, in het dienen en in het dragen.", "Neh 11:31": "De kinderen van Benjamin nu woonden, van Geba af, in Michmas, en Aja, en Beth-el, en haar onderhorige plaatsen,", "Deut 31:6": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten.", "Rom 11:2": "God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt:", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Neh 9:32": "Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.", "1 Kon 15:22": "Toen liet de koning Asa door heel Juda uitroepen (niemand was vrijgesteld), dat zij de stenen van Rama, en het hout daarvan, zouden wegdragen, waarmee Baësa gebouwd had; en de koning Asa bouwde daarmee Geba-Benjamins, en Mizpa.", "Joz 18:6": "En u zult het land beschrijven in zeven delen, en het hierheen naar mij toe brengen, dat ik voor u hier het lot werp voor het aangezicht van de HEERE, onze God.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "1 Kron 6:57-60": "En aan de kinderen van Aäron gaven zij steden van Juda, de vrijstad Hebron, en Libna en haar voorsteden, en Jattir en Esthemoa, en haar voorsteden, En Hilen en haar voorsteden, en Debir en haar voorsteden, En Asan en haar voorsteden, en Beth-semes en haar voorsteden.", "Richt 5:19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.", "Num 32:3": "Ataroth, en Dibon, en Jaezer, en Nimra, en Hesbon, en Eleale, en Schebam, en Nebo, en Behon;", "Joz 13:18": "En Jahza, en Kedemoth, en Mefaath,", "Joz 21:8-19": "Zo gaven de kinderen van Israël aan de Levieten deze steden en hun voorsteden, bij het lot, zoals de HEERE geboden had door de hand van Mozes. Verder gaven zij van de stam van de kinderen van Juda, en van de stam van de kinderen van Simeon, deze steden, die men bij name noemde; Dat zij waren van de kinderen van Aäron, van de families van de Kahathieten, uit de kinderen van Levi; want het eerste lot was voor hen.", "Jes 10:30": "Roep luid met uw stem, dochter van Gallim! Laat het horen tot Lais toe, o ellendige Anathoth!", "Lev 26:45": "Maar Ik zal hun ten goede denken aan het verbond van hun voorouders, die Ik uit het land Egypte voor de ogen van de heidenen uitgevoerd heb, opdat Ik hun tot een God zou zijn; Ik ben de HEERE!", "Jes 15:4": "Zowel Hesbon als Eleale schreeuwt, hun stem wordt gehoord tot Jahaz toe; daarom roepen de toegeruste soldaten van Moab luid, ieders ziel is in hem bang gemaakt.", "1 Kron 6:80": "En van de stam van Gad: Ramoth in Gilead, en haar voorsteden, en Mahanaim en haar voorsteden,", "Joz 15:55": "Maon, Karmel, en Zif, en Juta,", "Luk 21:32": "Voorwaar, Ik zeg u, dat dit geslacht beslist niet zal voorbijgaan, totdat alles gebeurd zal zijn.", "Ps 89:6": "Daarom loven de hemelen Uw wonderen, o HEERE! ook is Uw getrouwheid in de gemeente van de heiligen.", "1 Kron 23:25": "Want David had gezegd: De HEERE, de God van Israël, heeft Zijn volk rust gegeven, en Hij zal in Jeruzalem wonen tot in eeuwigheid.", "Ps 89:29": "Ik zal hem Mijn goedertierenheid in eeuwigheid bewaren, en Mijn verbond zal hem vast blijven.", "Joz 19:7": "Ain, Rimmon, en Ether, en Asan; vier steden en hun dorpen;", "Num 35:3": "En die steden zullen zij hebben om te bewonen; maar hun voorsteden zullen zijn voor hun vee, en voor hun bezit, en voor al hun dieren,", "1 Kon 8:15": "En hij zei: Geloofd zij de HEERE, de God van Israël, Die met Zijn mond tot mijn vader David gesproken heeft, en het met Zijn hand vervuld heeft, en zei:", "1 Kron 6:74": "En van de stam van Aser: Masal en haar voorsteden, en Abdon en haar voorsteden,", "Gen 24:27": "en hij zei: Geloofd zij de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en trouw niet onthouden heeft aan mijn heer; wat mij betreft, de HEERE heeft mij op deze weg geleid, naar het huis van de broers van mijn heer.", "Jes 49:16": "Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.", "Ps 89:34": "Maar Mijn goedertierenheid zal Ik van hem niet wegnemen, en in Mijn getrouwheid niet feilen.", "Num 26:62": "En hun getelden waren drieëntwintigduizend, al wat mannelijk is, van een maand oud en daarboven; want dezen werden niet geteld onder de kinderen van Israël, omdat hun geen erfenis gegeven werd onder de kinderen van Israël.", "Jes 44:21": "Denk aan deze dingen, o Jakob, en Israël! Want u bent Mijn knecht, Ik heb u geformeerd; u bent Mijn knecht, Israël, u zult door Mij niet vergeten worden.", "Hebr 6:13-19": "Want toen God aan Abraham de belofte deed, zwoer Hij bij Zichzelf, omdat Hij bij niemand groter kon zweren, en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken. En zo heeft hij, nadat hij geduldig volhard had, de belofte verkregen.", "2 Sam 22:31": "Gods weg is volmaakt; het woord van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Ex 6:15": "Dit nu zijn de namen van de zonen van Levi, naar hun geboorten: Gerson, en Kehath, en Merari. En de jaren van het leven van Levi waren honderdzevenendertig jaren.", "1 Kron 17:27": "Nu dan, het heeft U behaagd het huis van Uw knecht te zegenen, zodat het in eeuwigheid voor Uw aangezicht zal zijn; want U, HEERE, hebt het gezegend, en het zal gezegend zijn in eeuwigheid.", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "Num 13:21": "Zo trokken zij op, en verspiedden het land, van de woestijn Zin af tot Rechob toe, waar men komt bij Hamath.", "Ps 147:13": "Want Hij maakt de grendels van uw poorten sterk; Hij zegent uw kinderen binnen in u.", "Joz 9:3": "Toen de inwoners van Gibeon hoorden wat Jozua met Jericho en met Ai gedaan had,", "Joz 19:12": "En zij keert zich van Sarid oostwaarts naar de opgang van de zon, tot de grens van Chisloth-thabor, en zij komt uit bij Dobrath, en gaat omhoog naar Jafia.", "Hebr 10:23": "Laten wij de onwankelbare belijdenis van de hoop vasthouden (want Die het beloofd heeft, is trouw);", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Num 21:23": "Doch Sihon liet Israël niet toe door zijn gebied te trekken; maar Sihon verzamelde al zijn volk, en hij ging uit, Israël tegemoet, naar de woestijn, en hij kwam te Jahza, en streed tegen Israël;", "Jes 51:6": "Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.", "Joz 19:11": "En hun grens gaat omhoog naar het westen en Mar-ala, en reikt tot Dabbaseth, en reikt tot aan de beek die vóór Jokneam ligt.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Num 21:26-30": "Want Hesbon was de stad van Sihon, de koning van de Amorieten; en hij had gestreden tegen de vorige koning van de Moabieten, en hij had al zijn land uit zijn hand genomen, tot aan de Arnon. Daarom zeggen zij die spreekwoorden gebruiken: Komt tot Hesbon; men bouwt en bevestigt de stad van Sihon! Want er is een vuur uitgegaan uit Hesbon; een vlam uit de stad van Sihon; het heeft Ar der Moabieten verteerd, en de heren van de hoogten van de Arnon.", "Jes 54:9": "Want dat zal Mij zijn als de wateren van Noach, toen Ik zwoer dat de wateren van Noach niet meer over de aarde zouden gaan; zo heb Ik gezworen dat Ik niet meer op u toornen, of u bestraffen zal.", "1 Kon 2:26": "En tegen Abjathar, de priester, zei de koning: Ga naar Anathoth, naar uw akkers; want u verdient de dood; maar op deze dag zal ik u niet doden, omdat u de ark van de Heere HEERE gedragen hebt voor het aangezicht van mijn vader David, en omdat u verdrukt bent geweest in alles waarin mijn vader verdrukt was.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Hand 13:33": "dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.", "Joz 20:7-9": "Toen wijdden zij Kedes in Galilea, op het gebergte van Naftali, en Sichem op het gebergte van Efraïm, en Kirjath-arba, dat is Hebron, op het gebergte van Juda. En aan de andere kant van de Jordaan, bij Jericho oostwaarts, gaven zij Bezer in de woestijn, in het platte land, uit de stam van Ruben; en Ramoth in Gilead, uit de stam van Gad; en Golan in Bazan, uit de stam van Manasse. Dit nu zijn de steden, die bestemd waren voor alle kinderen van Israël, en voor de vreemdeling die te midden van hen woont, opdat daarheen kan vluchten ieder die iemand door een vergissing doodt; opdat hij niet sterft door de hand van de bloedwreker, totdat hij voor de vergadering heeft gestaan.", "Rom 15:8": "En ik zeg dat Jezus Christus een dienaar van de besnijdenis geworden is, vanwege de waarheid van God, opdat Hij de beloften aan de vaderen zou bevestigen;", "Num 32:2": "Toen kwamen de kinderen van Gad en de kinderen van Ruben en spraken tot Mozes, tot Eleazar de priester, en tot de leiders van de vergadering, en zeiden:", "Deut 7:8": "Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Gen 6:18": "Maar met u zal Ik Mijn verbond oprichten; en u zult in de ark gaan, u, en uw zonen, en uw vrouw, en de vrouwen van uw zonen met u.", "Joz 19:20": "En Rabbith, en Kisjon, en Ebez,", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Neh 11:20": "Het overige nu van Israël, van de priesters en de Levieten, was in alle steden van Juda, ieder in zijn erfdeel.", "1 Kron 6:56": "Maar het veld van de stad, en haar dorpen, gaven zij aan Kaleb, de zoon van Jefunne.", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "1 Kon 8:20": "Zo heeft de HEERE Zijn woord bevestigd, dat Hij gesproken had; want ik ben opgestaan in de plaats van mijn vader David, en ik zit op de troon van Israël, zoals de HEERE gesproken heeft; en ik heb een huis gebouwd voor de Naam van de HEERE, de God van Israël.", "1 Kron 6:75": "En Hukok en haar voorsteden, en Rehob en haar voorsteden.", "Richt 1:10": "En Juda was heengetrokken tegen de Kanaänieten die in Hebron woonden (de naam van Hebron was voorheen Kirjath-arba), en zij versloegen Sesai, Ahiman, en Thalmai.", "1 Kon 8:24": "Die Uw dienaar, mijn vader David, gehouden hebt wat U tot hem gesproken had; want met Uw mond hebt U gesproken, en met Uw hand vervuld, zoals het op deze dag is.", "Joz 19:42": "En Saalabbin, en Ajalon, en Jithla,", "Hos 2:19": "En Ik zal u aan Mij verloven in geloof; en u zult de Heere kennen.", "Deut 9:5": "Niet om uw gerechtigheid, noch om de oprechtheid van uw hart, komt u daar binnen om hun land te erven; maar om de goddeloosheid van deze volken verdrijft de HEERE, uw God, hen voor uw aangezicht uit de bezitting: en om het woord te bevestigen dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft.", "2 Sam 5:25": "En David deed zo, zoals de HEERE hem geboden had; en hij versloeg de Filistijnen van Geba af, tot waar u bij Gezer komt.", "Joz 19:45": "En Jehud, en Bene-berak, en Gath-rimmon,", "Jes 10:29": "Zij trekken door de doorgang, te Geba houden zij hun overnachting; Rama beeft, Gibea van Saul vlucht.", "1 Kron 22:18": "Is de HEERE, uw God, niet met u, en heeft Hij u geen rust gegeven rondom? Want Hij heeft de inwoners van het land in mijn hand gegeven, en dit land is onderworpen geworden voor het aangezicht van de HEERE, en voor het aangezicht van Zijn volk.", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "Joz 19:37": "En Kedes, en Edrei, en En-hazor,", "Ps 37:28": "Want de HEERE heeft het recht lief, en zal Zijn gunstgenoten niet verlaten; in eeuwigheid worden zij bewaard; maar het nageslacht van de goddelozen wordt uitgeroeid.", "Joz 17:16": "Toen zeiden de kinderen van Jozef: Dat gebergte zou voor ons niet genoeg zijn; er zijn ook ijzeren wagens bij alle Kanaänieten die in het land van het dal wonen, bij hen te Beth-Sean en haar onderhorige plaatsen, en bij hen die in het dal van Jizreël zijn.", "Luk 1:68-70": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht; zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Num 26:65": "Want de HEERE had van hen gezegd, dat zij in de woestijn zeker zouden sterven; en er was niemand van hen overgebleven, dan Kaleb, de zoon van Jefunne, en Jozua, de zoon van Nun.", "Joz 10:21": "Zo keerde al het volk terug tot Jozua in het leger, bij Makkeda, in vrede; niemand had zijn tong tegen de kinderen van Israël geroerd.", "Zach 14:10": "Dit hele land zal rondom als een vlak veld gemaakt worden, van Geba tot Rimmon toe, zuidwaarts van Jeruzalem; en zij zal verhoogd en bewoond worden op haar plaats; van de poort van Benjamin af, tot aan de plaats van de eerste poort, tot aan de Hoekpoort toe; en van de toren van Hananeel, tot aan de wijnbakken van de koning toe.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "1 Kron 6:78": "En aan de overkant van de Jordaan tegenover Jericho, aan de oostkant van de Jordaan, van de stam van Ruben: Bezer in de woestijn, en haar voorsteden, en Jahza en haar voorsteden,", "1 Kron 6:65": "En zij gaven ze bij het lot, van de stam van de kinderen van Juda, en van de stam van de kinderen van Simeon, en van de stam van de kinderen van Benjamin, deze steden, die zij bij name noemden.", "Joz 13:17": "Hesbon en al haar steden, die in het vlakke land zijn, Dibon, en Bamoth-baal, en Beth-baal-meon,", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "Num 4:38": "Evenzo de getelden van de zonen van Gerson, naar hun geslachten, en naar het huis van hun vaderen;", "Gen 33:19": "En hij kocht een stuk van het veld, waar hij zijn tent had opgezet, van de zonen van Hemor, de vader van Sichem, voor honderd stukken van het geld.", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "1 Kron 6:43": "De zoon van Jahath, de zoon van Gerson, de zoon van Levi.", "Hand 13:32": "En wij verkondigen u de belofte, die aan de vaderen gedaan is,", "1 Kor 1:9": "God is getrouw, door Wie u geroepen bent tot de gemeenschap van Zijn Zoon Jezus Christus, onze Heere.", "Joz 17:4": "Dezen dan traden toe voor Eleazar, de priester, en voor Jozua, de zoon van Nun, en voor de leiders, en zeiden: De HEERE heeft Mozes geboden dat men ons een erfdeel geven zou te midden van onze broeders. Daarom gaf hij haar, naar het woord van de HEERE, een erfdeel te midden van de broeders van hun vader.", "1 Sam 13:3": "Toen versloeg Jonathan de bezetting van de Filistijnen die te Geba was, en de Filistijnen hoorden dat. Daarom liet Saul de bazuin blazen door het hele land en zei: Laat de Hebreeën het horen.", "Ex 6:15-19": "Dit nu zijn de namen van de zonen van Levi, naar hun geboorten: Gerson, en Kehath, en Merari. En de jaren van het leven van Levi waren honderdzevenendertig jaren. De zonen van Gerson: Libni en Simeï, naar hun huisgezinnen. En de zonen van Kehath: Amram, en Jizhar, en Hebron, en Uzziël; en de jaren van het leven van Kehath waren honderddrieëndertig jaren.", "1 Sam 6:12": "De koeien nu gingen recht op die weg, op de weg naar Beth-Semes op één straat; zij gingen steeds voort, al loeiend, en weken noch naar rechts noch naar links af; en de vorsten van de Filistijnen gingen achter hen aan tot aan het gebied van Beth-Semes.", "Ex 6:16": "De zonen van Gerson: Libni en Simeï, naar hun huisgezinnen.", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.", "Ezech 48:9-18": "Het hefoffer, dat u de HEERE zult offeren, zal zijn de lengte van vijfentwintigduizend, en de breedte van tienduizend. En daarin zal het heilig hefoffer zijn voor de priesters, noordwaarts de lengte van vijfentwintigduizend, en westwaarts de breedte van tienduizend, en oostwaarts de breedte van tienduizend, en zuidwaarts de lengte van vijfentwintigduizend; en het heiligdom van de HEERE zal in het midden daarvan zijn. Het zal zijn voor de priesters, die geheiligd zijn uit de kinderen van Zadok, die Mijn wacht waargenomen hebben; die niet gedwaald hebben, zoals de kinderen van Israël dwaalden; zoals de andere Levieten gedwaald hebben.", "Joz 19:51": "Dit zijn de erfdelen die Eleazar, de priester, en Jozua, de zoon van Nun, en de hoofden van de vaders van de stammen van de kinderen van Israël door het lot erfelijk uitdeelden te Silo, voor het aangezicht van de HEERE, aan de deur van de tent van de samenkomst. Zo maakten zij een einde aan het uitdelen van het land.", "Ps 92:3": "Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten;", "Jer 33:20": "Zo zegt de HEERE: Als u Mijn verbond met de dag, en Mijn verbond met de nacht zou kunnen verbreken, zodat er geen dag en nacht meer zijn op hun tijd;", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "1 Kron 6:62": "En de kinderen van Gerson, naar hun families, hadden van de stam van Issaschar, en van de stam van Aser, en van de stam van Nafthali, en van de stam van Manasse in Basan, dertien steden.", "Ps 89:35": "Ik zal Mijn verbond niet ontheiligen, en wat uit Mijn lippen gegaan is, zal Ik niet veranderen.", "Num 10:17": "Toen werd de tabernakel afgenomen, en de zonen van Gerson en de zonen van Merari trokken op, dragend de tabernakel.", "Joz 19:35": "De vaste steden nu zijn: Ziddim, Zer en Hammath, Rakkath en Cinnereth,", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Joz 19:30": "En Umma, en Afek, en Rehob; tweeëntwintig steden en hun dorpen.", "Num 33:54": "En u zult het land in erfelijk bezit nemen door het lot, naar uw geslachten; aan hen die veel zijn, zult u hun erfenis groter maken, en aan hen die weinig zijn, zult u hun erfenis kleiner maken; waar voor iemand het lot ook uitvalt, dat zal hij hebben; naar de stammen van uw vaderen zult u de erfenis ontvangen.", "Ps 92:2": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste!", "Ps 19:10": "De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Ps 119:89": "Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen.", "Richt 1:30": "Zebulon verdreef de inwoners van Kitron niet, noch de inwoners van Nahalol; maar de Kanaänieten woonden in zijn midden, en werden dienstbaar.", "1 Kron 6:59": "En Asan en haar voorsteden, en Beth-semes en haar voorsteden.", "1 Kron 6:2": "De kinderen van Kahath nu waren Amram, Jizhar, en Hebron, en Uzziël.", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "Num 35:6": "De steden nu, die u aan de Levieten zult geven, zullen zes vrijsteden zijn, die u aanwijzen zult, opdat de doodslager daarheen vlucht; en daarboven zult u hun tweeënveertig steden geven.", "2 Sam 5:1-5": "Toen kwamen alle stammen van Israël naar David in Hebron, en zij zeiden: Zie, wij zijn uw gebeente en uw vlees. Ook al eerder, toen Saul koning over ons was, was u het die Israël uitleidde en terugbracht; ook heeft de HEERE tegen u gezegd: U zult Mijn volk Israël weiden, en u zult een leider zijn over Israël. Zo kwamen alle oudsten van Israël naar de koning in Hebron; en koning David sloot met hen een verbond in Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël.", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Luk 1:55": "zoals Hij gesproken heeft tot onze vaderen, tot Abraham en zijn nageslacht, tot in eeuwigheid.", "Gen 49:7": "Vervloekt is hun toorn, want hij is heftig; en hun verbolgenheid, want zij is hard! Ik zal hen verdelen onder Jakob, en zal hen verstrooien onder Israël.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Ps 33:4": "Want het woord van de HEERE is recht, en al Zijn werk is trouw.", "Neh 9:8": "En U hebt zijn hart getrouw gevonden voor Uw aangezicht, en hebt een verbond met hem gemaakt, dat U zou geven het land van de Kanaänieten, de Hethieten, de Amorieten, en de Ferezieten, en de Jebusieten, en de Girgasieten, dat U het aan zijn nageslacht zou geven; en U hebt Uw woorden bevestigd, omdat U rechtvaardig bent.", "Richt 1:31": "Aser verdreef de inwoners van Acco niet, noch de inwoners van Sidon, noch Achlab, noch Achsib, noch Chelba, noch Afik, noch Rechob;", "1 Kon 12:1": "En Rehabeam ging naar Sichem, want het hele Israël was naar Sichem gekomen om hem koning te maken.", "Joz 19:15": "En Kattath, en Nahalal, en Simron, en Jidala, en Bethlehem; twaalf steden en hun dorpen.", "Joz 12:13": "De koning van Debir, één; de koning van Geder, één;", "Neh 11:11": "Seraja, de zoon van Hilkia, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, was voorganger van Gods huis;", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Gal 6:6": "En wie onderwezen wordt in het Woord, moet delen van alle goederen met hem die hem onderwijst.", "Joz 18:14": "En dat gebied strekt zich uit en keert zich om, naar de westhoek zuidwaarts van de berg, die tegenover Beth-horon zuidwaarts is, en de uiteinden ervan zijn aan Kirjath-baal (dat is Kirjath-jearim), een stad van de kinderen van Juda. Dit is de westkant.", "Joz 19:44": "En Elteke, en Gibbethon, en Baälath,", "Jes 16:8": "Want de velden van Hesbon zijn verdord, ook de wijnstok van Sibma; de heren van de heidenvolken hebben zijn beste planten verpletterd; zij reiken tot Jaezer toe, zij dwaalden door de woestijn; hun scheuten zijn uitgespreid, zij zijn over de zee gegaan.", "Ps 121:3": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Ps 100:5": "Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.", "2 Sam 7:15": "Maar Mijn goedertierenheid zal van hem niet wijken, zoals Ik die weggenomen heb van Saul, die Ik van voor uw aangezicht heb weggenomen.", "Jer 31:37": "Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "1 Kron 6:16": "Zo zijn dan de kinderen van Levi: Gerson, Kahath en Merari.", "Jes 65:16": "Zodat wie zich zal zegenen op aarde, zich zal zegenen in de God van de waarheid; en wie zal zweren op aarde, zal zweren bij de God van de waarheid, omdat de vorige benauwdheden vergeten zullen zijn, en omdat zij voor Mijn ogen verborgen zijn.", "Richt 18:21": "Zo keerden zij zich om en trokken verder; en zij stelden de kinderen, en het vee, en de bagage voor zich uit.", "1 Kon 9:15-17": "Dit is nu de reden van het uitschot, dat de koning Salomo liet opkomen, om het huis van de HEERE te bouwen, en zijn huis, en Millo, en de muur van Jeruzalem, alsook Hazor, en Megiddo, en Gezer. Want Farao, de koning van Egypte, was opgekomen, en had Gezer ingenomen, en het met vuur verbrand, en de Kanaänieten, die in de stad woonden, gedood, en had het aan zijn dochter, de vrouw van Salomo, tot een geschenk gegeven. Zo bouwde Salomo Gezer, en het lage Beth-horon.", "1 Sam 14:31": "Toch versloegen zij op die dag de Filistijnen van Michmas tot Ajalon; en het volk was zeer moe.", "1 Kron 6:55": "En zij gaven hun Hebron, in het land van Juda, en haar voorsteden rondom die.", "Num 27:1-5": "Toen kwamen de dochters van Zelafead naar voren, de zoon van Hefer, de zoon van Gilead, de zoon van Machir, de zoon van Manasse, onder de geslachten van Manasse, de zoon van Jozef (en dit zijn de namen van zijn dochters: Machla, Noa, en Hogla, en Milka, en Tirza); En zij gingen staan voor Mozes, en voor Eleazar, de priester, en voor de leiders, en de hele vergadering, bij de deur van de tent van de samenkomst, en zeiden: Onze vader is gestorven in de woestijn, en hij is niet geweest onder hen die zich tegen de HEERE verzameld hebben, in de groep van Korach; maar hij is in zijn eigen zonde gestorven, en had geen zonen.", "1 Kron 6:54-81": "En dit waren hun woonplaatsen, naar hun kampementen, in hun gebieden, namelijk van de zonen van Aäron, van de familie van de Kahathieten, want dat lot was voor hen. En zij gaven hun Hebron, in het land van Juda, en haar voorsteden rondom die. Maar het veld van de stad, en haar dorpen, gaven zij aan Kaleb, de zoon van Jefunne.", "Ex 6:3": "En ook heb Ik Mijn verbond met hen opgericht, dat Ik hun het land Kanaän geven zou, het land van hun vreemdelingschap, waarin zij vreemdelingen zijn geweest.", "Num 36:1-5": "En de familiehoofden van het geslacht van de kinderen van Gilead, de zoon van Machir, de zoon van Manasse, uit de geslachten van de kinderen van Jozef, traden naar voren en spraken voor Mozes en voor de leiders, de familiehoofden van de kinderen van Israël. En zij zeiden: De HEERE heeft mijn heer geboden dat land door het lot aan de kinderen van Israël in erfenis te geven; en mijn heer is door de HEERE geboden de erfenis van onze broeder Zelafead te geven aan zijn dochters. Wanneer zij aan een van de zonen van de andere stammen van de kinderen van Israël tot vrouw zouden worden, dan zou hun erfenis van de erfenis van onze vaderen afgetrokken worden, en toegevoegd worden aan de erfenis van die stam waaraan zij zouden komen; zo zou van het lot van onze erfenis worden afgetrokken.", "Ezra 9:9": "Want wij zijn knechten; maar in onze dienstbaarheid heeft onze God ons niet verlaten; maar Hij heeft weldadigheid tot ons geneigd voor het aangezicht van de koningen van Perzië, dat Hij ons een weinig leven zou geven, om het huis van onze God te verhogen, en de woestenijen ervan op te richten, en om ons een muur te geven in Juda en te Jeruzalem.", "Ps 121:4": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen.", "Joz 18:13": "En vandaar gaat het gebied door naar Luz, aan de zijde van Luz (dat is Beth-el), zuidwaarts; en dit gebied gaat af naar Atroth-addar, aan de berg, die aan de zuidzijde van het benedenste Beth-horon is.", "Num 35:1-8": "En de HEERE sprak tot Mozes, in de vlakke velden van de Moabieten, aan de Jordaan bij Jericho: Gebied de Israëlieten dat zij van de erfenis van hun bezitting steden aan de Levieten geven om te bewonen; daarbij zult u aan de Levieten ook voorsteden geven, rondom de steden. En die steden zullen zij hebben om te bewonen; maar hun voorsteden zullen zijn voor hun vee, en voor hun bezit, en voor al hun dieren,", "1 Kron 6:1": "De kinderen van Levi waren Gerson, Kahath en Merari.", "1 Kron 6:54-60": "En dit waren hun woonplaatsen, naar hun kampementen, in hun gebieden, namelijk van de zonen van Aäron, van de familie van de Kahathieten, want dat lot was voor hen. En zij gaven hun Hebron, in het land van Juda, en haar voorsteden rondom die. Maar het veld van de stad, en haar dorpen, gaven zij aan Kaleb, de zoon van Jefunne.", "1 Kron 6:3": "En de kinderen van Amram waren Aäron, en Mozes en Mirjam; en de kinderen van Aäron waren Nadab en Abihu, Eleazar en Ithamar.", "Joz 14:1": "Dit is nu wat de kinderen van Israël geërfd hebben in het land Kanaän: wat de priester Eleazar, en Jozua, de zoon van Nun, en de hoofden van de vaderen van de stammen van de kinderen van Israël, hun hebben doen erven;", "Ps 119:90": "Uw trouw is van geslacht tot geslacht; U hebt de aarde vastgemaakt, en zij blijft staan;", "Matt 24:34": "Voorwaar, Ik zeg u: dit geslacht zal beslist niet voorbijgaan, totdat al deze dingen gebeurd zijn.", "Joz 12:11": "De koning van Jarmuth, één; de koning van Lachis, één;", "Joz 23:14": "En ziet, ik ga heden in de weg van de hele aarde; en u weet in uw hele hart en in uw hele ziel, dat er niet één woord gevallen is van al die goede woorden, die de HEERE, uw God, over u gesproken heeft; zij zijn u alle overkomen; er is daarvan niet één woord gevallen.", "Joz 19:25": "En hun grens was Helkath, en Hali, en Beten, en Achsaf,", "Joz 20:8": "En aan de andere kant van de Jordaan, bij Jericho oostwaarts, gaven zij Bezer in de woestijn, in het platte land, uit de stam van Ruben; en Ramoth in Gilead, uit de stam van Gad; en Golan in Bazan, uit de stam van Manasse.", "2 Kon 8:19": "Toch wilde de HEERE Juda niet verderven, omwille van David, Zijn dienaar; zoals Hij hem gezegd had dat Hij hem altijd een lamp zou geven voor zijn zonen.", "Ezech 16:62": "Want Ik zal Mijn verbond met u oprichten, en u zult weten dat Ik de HEERE ben;", "Ps 25:10": "Caph. Alle paden van de HEERE zijn goedertierenheid en waarheid, voor hun die Zijn verbond en Zijn getuigenissen bewaren.", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Jer 51:5": "Want Israël of Juda zal niet in weduwschap gelaten worden door zijn God, door de HEERE van de heerscharen (hoewel hun land vol schuld is), door de Heilige van Israël.", "Matt 10:10": "Ook geen reistas voor onderweg, geen twee stel kleren, geen schoenen, geen staf; want de arbeider is zijn voedsel waard.", "Num 3:17-26": "Dit nu waren de zonen van Levi met hun namen: Gerson, en Kahath, en Merari. En dit zijn de namen van de zonen van Gerson, naar hun geslachten: Libni en Simeï. En de zonen van Kahath, naar hun geslachten: Amram en Izhar, Hebron en Uzziël.", "Joz 10:19": "Maar sta u zelf niet stil, jaag uw vijanden achterna, en sla hen in de achterhoede; laat hen niet in hun steden komen; want de HEERE, uw God, heeft ze in uw hand gegeven.", "Deut 33:8-10": "En van Levi zei hij: Uw Tummim en Uw Urim zijn bij de man, Uw gunstgenoot, die Gij beproefd hebt in Massa, met wie Gij getwist hebt aan de wateren van Meriba. Die tegen zijn vader en tegen zijn moeder zei: Ik zie hem niet; en die zijn broeders niet kende, en zijn zonen niet achtte; want zij onderhielden Uw woord, en bewaarden Uw verbond. Zij zullen Jakob Uw rechten leren, en Israël Uw wet; zij zullen reukwerk voor Uw neus leggen, en dat helemaal verteerd zal worden, op Uw altaar.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Ps 89:2": "Ik zal de goedertierenheid van de HEERE eeuwig zingen; ik zal Uw waarheid met mijn mond bekend maken, van geslacht tot geslacht.", "Joz 15:10": "Daarna zal deze grens zich omkeren van Baäla tegen het westen, naar het gebergte Seïr, en zal doorgaan aan de kant van de berg Jearim van het noorden; dat is Chesalon; en zij zal afkomen naar Beth-semes, en door Timna gaan.", "2 Kon 13:23": "Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe.", "Joh 8:26": "Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld.", "1 Kron 6:69": "En Ajalon en haar voorsteden, en Gath-rimmon en haar voorsteden.", "Ezech 16:60": "Toch zal Ik denken aan Mijn verbond met u, in de dagen van uw jeugd, en Ik zal met u een eeuwig verbond oprichten.", "Ps 89:9": "O HEERE, God van de heerscharen! Wie is als Gij, grootmachtig, o HEERE! en Uw getrouwheid is rondom U.", "Luk 21:33": "De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "Joz 21:43-45": "Zo gaf de HEERE aan Israël het hele land, dat Hij gezworen had aan hun vaderen te geven, en zij beërfden het, en woonden daarin. En de HEERE gaf hun rust rondom, naar alles wat Hij hun vaderen gezworen had; en er stond niet één man van al hun vijanden voor hen staande; al hun vijanden gaf de HEERE in hun hand. Er viel niet één woord weg van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam allemaal uit.", "Richt 9:1": "Abimelech nu, de zoon van Jerubbaäl, ging naar Sichem, naar de broers van zijn moeder; en hij sprak tot hen, en tot het hele geslacht van het huis van de vader van zijn moeder, en zei:", "Joz 15:51": "en Gosen, en Holon, en Gilo; elf steden en haar dorpen.", "Neh 12:29": "En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.", "Joz 17:11": "Want Manasse had, in Issaschar en in Aser, Beth-Sean en haar onderhorige plaatsen, en Jibleam en haar onderhorige plaatsen, en de inwoners van Dor en haar onderhorige plaatsen, en de inwoners van En-Dor en haar onderhorige plaatsen, en de inwoners van Thaänach en haar onderhorige plaatsen, en de inwoners van Megiddo en haar onderhorige plaatsen: drie landstreken.", "Jes 16:9": "Daarom beween ik, met de wening over Jaezer, de wijnstok van Sibma; ik maak u doornat met mijn tranen, o Hesbon en Eleale! Want het vreugdegeroep over uw zomervruchten en over uw oogst is verstomd;", "Lev 25:32-34": "Wat aangaat de steden van de Levieten, en de huizen van de steden van hun bezitting; de Levieten zullen een eeuwige lossing hebben. En als men onder de Levieten lossing gedaan zal hebben, dan zal de koop van het huis en van de stad van zijn bezitting in het jubeljaar uitgaan; want de huizen van de steden van de Levieten zijn hun bezitting te midden van de kinderen van Israël. Maar het veld van de weidegrond van hun steden zal niet verkocht worden; want het is een eeuwige bezitting voor hen.", "Jes 51:8": "Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Num 35:8": "De steden die u van de bezitting van de Israëlieten geven zult, zult u van hem die veel heeft, veel nemen, en van hem die weinig heeft, weinig nemen; ieder zal naar zijn erfenis, die zij zullen erven, van zijn steden aan de Levieten geven.", "Jer 29:10": "Want zo zegt de HEERE: Zeker, als er zeventig jaren te Babel vervuld zullen zijn, zal Ik u bezoeken, en Ik zal Mijn goede woord over u waarmaken, door u terug te brengen naar deze plaats.", "1 Kron 6:72": "En van de stam van Issaschar: Kedes en haar voorsteden, Dobrath en haar voorsteden,", "Gen 9:16": "Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.", "Joz 21:4-40": "Toen ging het lot uit voor de families van de Kahathieten; en voor de kinderen van Aäron, de priester, uit de Levieten, waren er van de stam van Juda, en van de stam van Simeon, en van de stam van Benjamin, door het lot, dertien steden. En aan de overgebleven kinderen van Kahath vielen, bij het lot, van de families van de stam van Efraïm, en van de stam van Dan, en van de halve stam van Manasse, tien steden. En aan de kinderen van Gerson, van de families van de stam van Issaschar, en van de stam van Aser, en van de stam van Nafthali, en van de halve stam van Manasse, in Bazan, bij het lot, dertien steden.", "Ezech 48:8-20": "Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend meetrieten in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn. Het hefoffer, dat u de HEERE zult offeren, zal zijn de lengte van vijfentwintigduizend, en de breedte van tienduizend. En daarin zal het heilig hefoffer zijn voor de priesters, noordwaarts de lengte van vijfentwintigduizend, en westwaarts de breedte van tienduizend, en oostwaarts de breedte van tienduizend, en zuidwaarts de lengte van vijfentwintigduizend; en het heiligdom van de HEERE zal in het midden daarvan zijn.", "Joz 15:13": "Doch Kaleb, de zoon van Jefunne, had hij een deel gegeven te midden van de kinderen van Juda, naar het bevel van de HEERE tot Jozua, de stad van Arba, vader van Enak, dat is Hebron.", "Joz 19:21": "En Remeth, en En-gannim, en En-hadda, en Beth-pazzez.", "2 Kor 1:20": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.", "1 Sam 30:27": "Namelijk aan hen die in Beth-el waren, en aan hen die in Ramoth in het zuiden waren, en aan hen die in Jather waren,", "Num 35:2": "Gebied de Israëlieten dat zij van de erfenis van hun bezitting steden aan de Levieten geven om te bewonen; daarbij zult u aan de Levieten ook voorsteden geven, rondom de steden.", "Richt 2:1": "En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid.", "1 Sam 6:15": "En de Levieten haalden de ark van de HEERE eraf en het koffertje dat erbij was, waarin de gouden kleinoden waren, en zetten ze op die grote steen; en de mensen van Beth-Semes brachten brandoffers en slachtten slachtoffers voor de HEERE, op diezelfde dag.", "Ezech 45:1-6": "Wanneer u dan het land door het lot laat toevallen als erfenis, zult u een hefoffer aan de HEERE brengen, als een heilige plaats, van het land; de lengte zal zijn de lengte van vijfentwintigduizend meetrieten, en de breedte tienduizend; dat zal in zijn hele omtrek rondom heilig zijn. Hiervan zal voor het heiligdom zijn vijfhonderd bij vijfhonderd, vierkant rondom; en het zal vijftig el hebben als buitenruimte rondom. Zo zult u met deze maat meten: de lengte van vijfentwintigduizend, en de breedte van tienduizend, en daarin zal het heiligdom zijn, met het heilige der heiligen.", "1 Kron 6:79": "En Kedemoth en haar voorsteden, en Mefaath en haar voorsteden;", "1 Kron 23:13": "De kinderen van Amram waren Aäron en Mozes. Aäron nu werd afgezonderd om de allerheiligste dingen te heiligen, hij en zijn zonen, tot in eeuwigheid, om te roken voor het aangezicht van de HEERE, om Hem te dienen en om in Zijn Naam tot in eeuwigheid te zegenen.", "Num 32:35": "en Atroth-Sofan, en Jaezer, en Jogbeha,", "1 Kon 22:3": "Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.", "Joz 10:3": "Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:", "Ex 6:13": "Dit zijn de hoofden van ieder huis van hun vaderen: de zonen van Ruben, de eerstgeborene van Israël, zijn Hanoch en Pallu, Hezron en Charmi; dit zijn de huisgezinnen van Ruben.", "Zach 9:11": "U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "1 Kron 6:67": "Want zij gaven hun van de vrijsteden, Sichem en haar voorsteden op het gebergte van Efraïm, en Gezer en haar voorsteden,", "1 Sam 30:28": "en aan hen die in Aroër waren, en aan hen die in Sifmoth waren, en aan hen die in Esthemoa waren,", "Jer 48:32": "Meer dan om het geween van Jaëzer zal Ik u bewenen, u wijnstok van Sibma! Uw ranken zijn over de zee gegaan, zij hebben gereikt tot aan de zee van Jaëzer; maar de verwoester is gevallen op uw zomervruchten en op uw wijnoogst;", "1 Kron 6:20": "Van Gerson: zijn zoon was Libni; zijn zoon Jahath; zijn zoon Zimma;", "1 Kron 6:17": "En dit zijn de namen van de zonen van Gerson: Libni en Simeï.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "1 Kron 8:6": "Dezen nu zijn de kinderen van Ehud; dezen waren hoofden van de vaderen van de inwoners van Geba, en hij voerde hen over naar Manahath;", "Ps 94:14": "Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "2 Kon 23:8": "En hij bracht al de priesters uit de steden van Juda, en verontreinigde de hoogten, waar die priesters gerookt hadden, van Geba af tot Berseba toe; en hij brak de hoogten van de poorten af, ook die welke bij de deur van de poort van Jozua, de leider van de stad, was, welke aan iemands linkerhand lag, als men de stadspoort binnenging.", "Luk 1:72": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken;", "Dan 9:4": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Joz 18:24": "Chefar-haammonai, en Ofni, en Gaba; twaalf steden en de bijbehorende dorpen.", "2 Kron 16:6": "Toen nam de koning Asa heel Juda, en zij droegen de stenen van Rama weg, en het hout ervan, waarmee Baësa gebouwd had; en hij bouwde daarmee Geba en Mizpa.", "Gen 46:11": "En de zonen van Levi: Gerson, Kehath en Merari.", "Num 26:57": "Dit zijn nu de getelden van Levi, naar hun geslachten: van Gerson het geslacht der Gersonieten; van Kohath het geslacht der Kohathieten; van Merari het geslacht der Merarieten.", "1 Kron 4:32": "En hun dorpen waren Etam en Ain, Rimmon en Tochen, en Asan; vijf steden.", "Jes 11:5": "Want gerechtigheid zal de gordel van Zijn lendenen zijn; ook zal de trouw de gordel van Zijn lendenen zijn.", "Deut 4:31": "Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Joz 17:14": "Toen spraken de kinderen van Jozef tot Jozua en zeiden: Waarom hebt u ons als erfdeel maar één lot en één snoer gegeven, terwijl wij toch een groot volk zijn, aangezien de HEERE ons tot nu toe zo gezegend heeft?", "Deut 1:4": "nadat hij Sihon, de koning van de Amorieten, die in Hesbon woonde, verslagen had, en Og, de koning van Bazan, die in Astharoth woonde, bij Edreï.", "2 Kron 6:4-15": "En hij zei: Geloofd zij de HEERE, de God van Israël, Die met Zijn mond tot mijn vader David gesproken heeft, en het met Zijn handen vervuld heeft, en zei: Vanaf de dag dat Ik Mijn volk uit Egypteland uitgevoerd heb, heb Ik geen stad verkoren uit alle stammen van Israël om een huis te bouwen, dat Mijn Naam daar zou zijn; en geen man verkoren om een leider te zijn over Mijn volk Israël. Maar Ik heb Jeruzalem verkoren, dat Mijn Naam daar zou zijn; en Ik heb David verkoren, dat hij over Mijn volk Israël zou zijn.", "Hebr 10:37": "want: Nog een heel klein tijdje en Hij, Die komen zal, zal komen, en niet uitblijven.", "Pred 3:8": "Een tijd om lief te hebben, en een tijd om te haten; een tijd van oorlog, en een tijd van vrede.", "Num 7:7": "Twee wagens en vier runderen gaf hij aan de zonen van Gerson, naar hun dienst;", "1 Sam 6:9": "Kijk dan toe: als zij de weg naar haar eigen gebied opgaat naar Beth-Semes, dan heeft Hij ons dit grote kwaad gedaan; maar zo niet, dan zullen wij weten dat Zijn hand ons niet geraakt heeft; het is ons een toeval geweest.", "Joz 20:7": "Toen wijdden zij Kedes in Galilea, op het gebergte van Naftali, en Sichem op het gebergte van Efraïm, en Kirjath-arba, dat is Hebron, op het gebergte van Juda.", "Luk 1:54": "Hij heeft Israël, Zijn knecht, opgenomen, om Zijn barmhartigheid te gedenken,", "Ps 111:7-9": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar. Samech. Ze zijn ondersteund voor altijd en in eeuwigheid; Ain. gedaan in waarheid en oprechtheid. Pe. Hij heeft Zijn volk verlossing gezonden; Tsade. Hij heeft Zijn verbond in eeuwigheid geboden; Koph. Zijn Naam is heilig en ontzagwekkend.", "Joz 16:3": "En het gaat af tegen het westen naar het gebied van Jafleti, tot aan het gebied van het benedenste Beth-horon, en tot Gezer; en de uiteinden ervan zijn aan de zee.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Jes 37:8": "Zo keerde Rabsaké terug, en hij trof de koning van Assyrië aan, strijdend tegen Libna; want hij had gehoord dat hij van Lachis vertrokken was.", "Joz 15:50": "en Anab, en Estemo, en Anim,", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Ps 119:65": "Teth. U hebt bij Uw knecht goed gedaan, HEERE, naar Uw woord.", "Joz 16:10": "En zij verdreven de Kanaänieten niet, die in Gezer woonden; zo woonden die Kanaänieten in het midden van de Efraïmieten tot op deze dag; maar zij moesten wel dwangarbeid verrichten.", "1 Kron 6:76": "En van de stam van Nafthali: Kedes in Galilea, en haar voorsteden, en Hammon en haar voorsteden, en Kirjathaim en haar voorsteden.", "1 Kron 6:73": "En Ramoth en haar voorsteden, en Anem en haar voorsteden.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Joz 10:12": "Toen sprak Jozua tot de HEERE, op de dag toen de HEERE de Amorieten voor het aangezicht van de kinderen van Israël overgaf, en hij zei voor de ogen van de Israëlieten: Zon, sta stil te Gibeon, en u, maan, in het dal van Ajalon!", "Ps 105:8": "Hij gedenkt Zijn verbond tot in eeuwigheid, het woord dat Hij ingesteld heeft, tot in duizend geslachten;", "Luk 1:39": "En Maria stond in diezelfde dagen op en reisde met haast naar het gebergte, naar een stad van Juda;", "2 Sam 2:1-3": "Daarna gebeurde het, dat David de HEERE vroeg en zei: Zal ik optrekken in een van de steden van Juda? En de HEERE zei tegen hem: Trek op. En David zei: Waarheen zal ik optrekken? En Hij zei: Naar Hebron. Zo trok David daarheen op, en ook zijn twee vrouwen, Ahinoam, de Jizreëlietische, en Abigaïl, de vrouw van Nabal, de Karmeliet. Ook liet David zijn mannen optrekken, die bij hem waren, ieder met zijn huisgezin; en zij woonden in de steden van Hebron.", "Deut 33:10": "Zij zullen Jakob Uw rechten leren, en Israël Uw wet; zij zullen reukwerk voor Uw neus leggen, en dat helemaal verteerd zal worden, op Uw altaar.", "Num 32:1-5": "De nakomelingen van Ruben en de nakomelingen van Gad hadden veel vee, heel veel; en zij bekeken het land Jaezer en het land Gilead, en zie, deze plaats was een plaats geschikt voor vee. Toen kwamen de kinderen van Gad en de kinderen van Ruben en spraken tot Mozes, tot Eleazar de priester, en tot de leiders van de vergadering, en zeiden: Ataroth, en Dibon, en Jaezer, en Nimra, en Hesbon, en Eleale, en Schebam, en Nebo, en Behon;", "Lev 26:44": "En hierboven is dit ook: als zij in het land van hun vijanden zullen zijn, zal Ik hen niet verwerpen, en ook niet van hen walgen, om een einde aan hen te maken en Mijn verbond met hen te vernietigen; want Ik ben de HEERE, hun God!", "Jer 33:21": "Dan zou ook Mijn verbond met Mijn knecht David verbroken kunnen worden, zodat hij geen zoon heeft die op zijn troon regeert, en met de Levieten, de priesters, Mijn dienaren.", "Jer 33:26": "Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "Ex 6:24": "En Eleazar, de zoon van Aäron, nam voor zich een van de dochters van Putiel tot een vrouw; en zij baarde hem Pinehas. Dit zijn de hoofden van de vaderen van de Levieten, naar hun huisgezinnen.", "Rom 11:29": "Want de genadegiften en de roeping van God zijn onberouwelijk.", "Joz 21:1-4": "Toen naderden de hoofden van de families van de Levieten tot Eleazar, de priester, en tot Jozua, de zoon van Nun, en tot de hoofden van de families van de stammen van de kinderen van Israël; En zij spraken tot hen, te Silo, in het land Kanaän, en zeiden: De HEERE heeft geboden door de hand van Mozes, dat men ons steden zou geven om te bewonen, en de voorsteden ervan voor ons vee. Daarom gaven de kinderen van Israël aan de Levieten van hun erfdeel, naar het bevel van de HEERE, deze steden en de voorsteden daarvan.", "Joz 24:33": "Ook stierf Eleazar, de zoon van Aäron; en zij begroeven hem op de heuvel van Pinehas, zijn zoon, die hem gegeven was op het gebergte van Efraïm.", "Joz 19:25-28": "En hun grens was Helkath, en Hali, en Beten, en Achsaf, En Allammelech, en Am-ad, en Mis-al; en zij reikt aan Karmel westwaarts, en aan Sichor-libnath; En keert zich naar de opgang van de zon naar Beth-dagon, en reikt aan Zebulon, en aan het dal Jiftha-el noordwaarts naar Beth-emek, en Nehiel, en komt uit bij Kabul, ter linkerhand;", "Spr 18:18": "Het lot doet de geschillen ophouden, en maakt scheiding tussen machtigen.", "Ps 89:3": "Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:", "1 Kron 6:57": "En aan de kinderen van Aäron gaven zij steden van Juda, de vrijstad Hebron, en Libna en haar voorsteden, en Jattir en Esthemoa, en haar voorsteden,", "1 Tim 5:17": "De oudsten die goed leiding geven, moeten dubbele eer waardig geacht worden, vooral wie arbeiden in het Woord en de leer.", "Ps 40:11": "Uw gerechtigheid bedek ik niet in het midden van mijn hart; Uw waarheid en Uw heil spreek ik uit; Uw weldadigheid en Uw trouw verheel ik niet in de grote gemeente.", "Num 32:1": "De nakomelingen van Ruben en de nakomelingen van Gad hadden veel vee, heel veel; en zij bekeken het land Jaezer en het land Gilead, en zie, deze plaats was een plaats geschikt voor vee.", "1 Kron 6:60": "Van de stam van Benjamin nu: Geba en haar voorsteden, en Allemeth en haar voorsteden, en Anathoth en haar voorsteden. Al hun steden, in hun families, waren dertien steden.", "Joz 12:22": "De koning van Kedes, één, de koning van Jokneam, bij de Karmel, één;", "Jer 32:40": "En Ik zal een eeuwig verbond met hen sluiten, dat Ik Mij van achter hen niet zal afkeren, opdat Ik hun goeddoe; en Ik zal Mijn vrees in hun hart geven, zodat zij niet van Mij afwijken.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Ps 147:14": "Die uw grondgebied in vrede stelt; Hij verzadigt u met het beste van de tarwe.", "Gen 9:15": "dan zal Ik Mijn verbond gedenken, dat er is tussen Mij en tussen u, en tussen alle levende ziel van alle vlees; en het water zal niet meer worden tot een vloed, om alle vlees te verderven.", "2 Kron 21:7": "Doch de HEERE wilde het huis van David niet te gronde richten, omwille van het verbond dat Hij met David gesloten had; en zoals Hij gezegd had hem en zijn zonen voor altijd een lamp te zullen geven.", "Joz 13:25": "dat hun gebied was Jaezer, en alle steden van Gilead, en het halve land van de kinderen van Ammon, tot Aroer toe, die voor aan Rabba ligt;", "1 Kron 6:81": "En Hesbon en haar voorsteden, en Jaezer en haar voorsteden.", "Joz 21:13-19": "Zo gaven zij aan de kinderen van de priester Aäron de vrijstad voor de doodslager, Hebron en haar voorsteden, en Libna en haar voorsteden; En Jatthir en haar voorsteden, en Esthemoa en haar voorsteden; En Holon en haar voorsteden, en Debir en haar voorsteden;", "Rom 3:3": "Want wat is het, al zijn sommigen ongelovig geweest? Zal hun ongeloof het geloof van God tenietdoen?", "1 Kron 6:58": "En Hilen en haar voorsteden, en Debir en haar voorsteden,", "Joz 18:1": "En de hele gemeenschap van de kinderen van Israël verzamelde zich te Silo, en zij richtten daar de tent van de samenkomst op, nadat het land aan hen onderworpen was.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Micha 7:20": "U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt.", "Matt 24:35": "De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Ps 89:25": "En Mijn getrouwheid en Mijn goedertierenheid zullen met hem zijn; en zijn hoorn zal in Mijn Naam verhoogd worden.", "Jer 31:36": "Als deze ordeningen van voor Mijn aangezicht zullen wijken, spreekt de HEERE, dan zal ook het nageslacht van Israël ophouden een volk te zijn voor Mijn aangezicht, alle dagen.", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Num 32:37": "En de kinderen van Ruben bouwden Hezbon, en Eleale, en Kirjathaïm,", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "2 Sam 15:7": "Aan het einde van veertig jaren gebeurde het dat Absalom tegen de koning zei: Laat mij toch gaan, en mijn gelofte, die ik de HEERE beloofd heb, te Hebron inlossen.", "Jer 33:14": "Zie, de dagen komen, spreekt de HEERE, dat Ik het goede woord zal vervullen, dat Ik tot het huis van Israël en over het huis van Juda gesproken heb.", "Gen 32:2": "En Jakob zei, toen hij hen zag: Dit is een leger van God! En hij noemde de naam van die plaats Mahanaim.", "Jer 48:21": "En het oordeel is gekomen over het vlakke land; over Holon, en over Jahza, en over Mefaäth,", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Ps 36:6": "O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe.", "Gen 23:2": "Sara stierf te Kiriath-arba, dat is Hebron, in het land Kanaän; en Abraham kwam om Sara te beklagen en haar te bewenen.", "Joz 15:49": "en Danna, en Kirjath-sanna, dat is Debir,", "Luk 1:73": "en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "1 Kron 6:71": "De kinderen van Gerson hadden van de families van de halve stam van Manasse: Golan in Basan en haar voorsteden, en Astharoth, en haar voorsteden.", "Joz 13:21": "En alle steden van het vlakke land, en het hele koninkrijk van Sihon, de koning van de Amorieten, die te Hesbon regeerde, die Mozes verslagen heeft, alsook de vorsten van Midian, Evi, en Rekem, en Zur, en Hur, en Reba, machthebbers van Sihon, inwoners van het land.", "Richt 21:19": "Toen zeiden zij: Zie, er is een feest van de HEERE te Silo, van jaar tot jaar, dat gehouden wordt ten noorden van het huis van God, ten oosten van de hoge weg die opgaat van het huis van God naar Sichem, en ten zuiden van Lebona.", "1 Sam 12:22": "Want de HEERE zal Zijn volk niet verlaten, omwille van Zijn grote Naam, omdat het de HEERE behaagd heeft, u tot een volk voor Zichzelf te maken.", "Neh 9:7": "U bent die HEERE, de God, Die Abram hebt verkoren, en hem uit Ur der Chaldeeën uitgevoerd; en U hebt zijn naam gesteld Abraham.", "Gen 21:1": "En de HEERE bezocht Sara, zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had.", "Gen 35:27": "En Jakob kwam bij Izak, zijn vader, in Mamre, te Kirjath-Arba, dat is Hebron, waar Abraham als vreemdeling had gewoond, en Izak.", "Deut 4:43": "Bezer in de woestijn, in het effen land, voor de Rubenieten; en Ramoth in Gilead, voor de Gadieten; en Golan in Bazan, voor de Manassieten.", "1 Kron 23:6": "En David verdeelde hen in afdelingen, naar de kinderen van Levi: Gerson, Kehath en Merari.", "Joz 15:48": "Op het gebergte nu: Samir, en Jatthir, en Socho,"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H5066\">Toen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5066\">naderden</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5066\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7218\">hoofden</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7218\">van</span> de families van <span class=\"wl\" data-l=\"L3\" data-code=\"H3881\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3881\">Levieten</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3881\">tot</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H499\">Eleazar</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H499\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3548\">priester</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H413\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H413\">tot</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3091\">Jozua</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H3091\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5126\">Nun</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H413\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H413\">tot</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7218\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7218\">ho /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {

    } else {
      h += '<em>Geen verwijzingen</em>';

  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];

  const refChips = refs => {
