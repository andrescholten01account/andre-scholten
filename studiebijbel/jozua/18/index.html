an het zuiden, en het huis van Jozef zal blijven op zijn gebied van het noorden.","6":"En u zult het land beschrijven in zeven delen, en het hierheen naar mij toe brengen, dat ik voor u hier het lot werp voor het aangezicht van de HEERE, onze God.","7":"Want de Levieten hebben geen deel in uw midden; maar het priesterschap van de HEERE is hun erfdeel. Gad nu, en Ruben, en de halve stam van Manasse, hebben hun erfdeel genomen aan de overkant van de Jordaan, oostwaarts, dat Mozes, de knecht van de HEERE, hun gegeven heeft.","8":"Toen maakten die mannen zich op, en gingen heen. En Jozua gebood hun, die heengingen om het land te beschrijven, en zei: Gaat, en doorwandelt het land, en beschrijft het; komt dan weer tot mij, dan zal ik u hier het lot werpen, voor het aangezicht van de HEERE, te Silo.","9":"De mannen dan gingen heen, en trokken het land door en beschreven het, naar de steden, in zeven delen, in een boek; en kwamen *weer* tot Jozua in het leger te Silo.","10":"Toen wierp Jozua het lot voor hen te Silo, voor het aangezicht van de HEERE. En Jozua verdeelde daar aan de kinderen van Israël het land, naar hun afdelingen.","11":"En het lot van de stam van de kinderen van Benjamin kwam op, naar hun huisgezinnen; en het gebied van hun lot ging uit tussen de kinderen van Juda, en tussen de kinderen van Jozef.","12":"En hun gebied was aan de kant noordwaarts van de Jordaan; en dit gebied gaat omhoog aan de zijde van Jericho vanuit het noorden, en gaat omhoog door het gebergte westwaarts, en de uiteinden ervan zijn aan de woestijn van Beth-aven.","13":"En vandaar gaat het gebied door naar Luz, aan de zijde van Luz (dat is Beth-el), zuidwaarts; en dit gebied gaat af naar Atroth-addar, aan de berg, die aan de zuidzijde van het benedenste Beth-horon is.","14":"En dat gebied strekt zich uit en keert zich om, naar de westhoek zuidwaarts van de berg, die tegenover Beth-horon zuidwaarts is, en de uiteinden ervan zijn aan Kirjath-baal (dat is Kirjath-jearim), een stad van de kinderen van Juda. Dit is de westkant.","15":"De kant nu ten zuiden is vanaf het uiterste van Kirjath-jearim; en dit gebied gaat uit ten westen, en het komt uit bij de bron van het water van Neftoah.","16":"En dit gebied gaat af tot aan het uiterste van de berg, die tegenover het dal van de zoon van Hinnom is, dat in het dal van de Refaïeten is tegen het noorden; en gaat af door het dal van Hinnom, aan de zijde van de Jebusieten zuidwaarts, en gaat af naar de bron van Rogel;","17":"En strekt zich uit vanuit het noorden, en gaat uit naar En-semes; vandaar gaat het uit naar Geliloth, dat tegenover de opgang naar Adummim is, en het gaat af naar de steen van Bohan, de zoon van Ruben;","18":"En gaat door aan de zijde tegenover Araba naar het noorden, en gaat af naar Araba.","19":"Verder gaat dit gebied door aan de zijde van Beth-hogla noordwaarts, en de uiteinden van dit gebied zijn aan de baai van de Zoutzee noordwaarts, aan het uiterste van de Jordaan zuidwaarts. Dit is het zuidelijke gebied.","20":"De Jordaan nu begrenst het aan de kant naar het oosten. Dit is het erfdeel van de kinderen van Benjamin, in hun gebieden rondom, naar hun huisgezinnen.","21":"De steden nu van de stam van de kinderen van Benjamin, naar hun huisgezinnen, zijn: Jericho, en Beth-hogla, en Emek-keziz,","22":"En Beth-araba, en Zemaraim, en Beth-el,","23":"En Haavvim, en Para, en Ofra,","24":"Chefar-haammonai, en Ofni, en Gaba; twaalf steden en de bijbehorende dorpen.","25":"Gibeon, en Rama, en Beeroth,","26":"En Mizpe, en Chefira, en Moza,","27":"En Rekem, en Jirpeel, en Tharala,","28":"En Zela, Elef en Jebusi (dat is Jeruzalem), Gibath, Kirjath: veertien steden alsook de bijbehorende dorpen. Dit is het erfdeel van de kinderen van Benjamin, naar hun huisgezinnen."},"SV":{"1":"En de ganse vergadering van de kinderen Israëls verzamelde zich te Silo, en zij richtten aldaar op de tent der samenkomst, nadat het land voor hen onderworpen was.","2":"En er bleven over onder de kinderen Israëls, aan dewelken zij hun erfdeel niet uitgedeeld hadden, zeven stammen.","3":"En Jozua zeide tot de kinderen Israëls: Hoe lang houdt gij u zo slap, om voort te gaan, om het land te beërven, hetwelk de HEERE, de God uwer vaderen, u gegeven heeft?","4":"Geeft voor ulieden drie mannen van elken stam, dat ik ze heenzende, en zij zich opmaken, en het land doorwandelen, en beschrijven hetzelve naar hun erven, en *weder* tot mij komen.","5":"Zij nu zullen het delen in zeven delen; Juda zal blijven op zijn landpale van het zuiden, en het huis van Jozef zal blijven op zijn landpale van het noorden.","6":"En gijlieden zult het land beschrijven in zeven delen, en tot mij herwaarts brengen, dat ik voor ulieden het lot hier werpe voor het aangezicht des HEEREN, onzes Gods.","7":"Want de Levieten hebben geen deel in het midden van ulieden; maar het priesterdom des HEEREN is hun erfdeel. Gad nu, en Ruben, en de halve stam van Manasse, hebben hun erfdeel genomen op gene zijde van de Jordaan, oostwaarts, hetwelk hun Mozes, de knecht des HEEREN, gegeven heeft.","8":"Toen maakten zich die mannen op, en gingen heen. En Jozua gebood hun, die heengingen om het land te beschrijven, zeggende: Gaat, en doorwandelt het land, en beschrijft het; komt dan weder tot mij, zo zal ik ulieden hier het lot werpen, voor het aangezicht des HEEREN, te Silo.","9":"De mannen dan gingen heen, en togen het land door en beschreven het, naar de steden, in zeven delen, in een boek; en kwamen *weder* tot Jozua in het leger te Silo.","10":"Toen wierp Jozua het lot voor hen te Silo, voor het aangezicht des HEEREN. En Jozua deelde aldaar den kinderen Israëls het land, naar hun afdelingen.","11":"En het lot van den stam der kinderen van Benjamin kwam op, naar hun huisgezinnen; en de landpale van hun lot ging uit tussen de kinderen van Juda, en tussen de kinderen van Jozef.","12":"En hun landpale was naar den hoek noordwaarts van de Jordaan; en deze landpale gaat opwaarts aan de zijde van Jericho van het noorden, en gaat op door het gebergte westwaarts, en haar uitgangen zijn aan de woestijn van Beth-aven.","13":"En van daar gaat de landpale door naar Luz, aan de zijde van Luz ( welke is Beth-el), zuidwaarts; en deze landpale gaat af naar Atroth-addar, aan den berg, die aan de zuidzijde van het benedenste Beth-horon is.","14":"En die landpale strekt en keert zich om, naar den westhoek zuidwaarts van den berg, die tegenover Beth-horon zuidwaarts is, en haar uitgangen zijn aan Kirjath-baal ( welke is Kirjath-jearim), een stad der kinderen van Juda. Dit is de hoek ten westen.","15":"De hoek nu ten zuiden is aan het uiterste van Kirjath-jearim; en deze landpale gaat uit ten westen, en zij komt uit aan de fontein der wateren van Neftoah.","16":"En deze landpale gaat af tot aan het uiterste des bergs, die tegenover het dal van den zoon van Hinnom is, die in het dal der Refaieten is tegen het noorden; en gaat af door het dal van Hinnom, aan de zijde der Jebusieten zuidwaarts, en gaat af aan de fontein van Rogel;","17":"En strekt zich van het noorden, en gaat uit te En-semes; van daar gaat zij uit naar Geliloth, welke is tegenover den opgang naar Adummim, en zij gaat af aan den steen van Bohan, den zoon van Ruben;","18":"En gaat door ter zijde tegenover Araba naar het noorden, en gaat af te Araba.","19":"Verder gaat deze landpale door aan de zijde van Beth-hogla noordwaarts, en de uitgangen van deze landpale zijn aan de tong der Zoutzee noordwaarts, aan het uiterste van de Jordaan zuidwaarts. Dit is de zuiderlandpale.","20":"De Jordaan nu bepaalt haar aan den hoek naar het oosten. Dit is het erfdeel der kinderen van Benjamin, in hun landpalen rondom, naar hun huisgezinnen.","21":"De steden nu van den stam der kinderen van Benjamin, naar hun huisgezinnen, zijn: Jericho, en Beth-hogla, en Emek-keziz,","22":"En Beth-araba, en Zemaraim, en Beth-el,","23":"En Haavvim, en Para, en Ofra,","24":"Chefar-haammonai, en Ofni, en Gaba; twaalf steden en haar dorpen.","25":"Gibeon, en Rama, en Beeroth,","26":"En Mizpe, en Chefira, en Moza,","27":"En Rekem, en Jirpeel, en Tharala,","28":"En Zela, Elef en Jebusi ( deze is Jeruzalem), Gibath, Kirjath: veertien steden mitsgaders haar dorpen. Dit is het erfdeel der kinderen van Benjamin, naar hun huisgezinnen."},"KJV":{"1":"And the whole congregation of the children of Israel assembled together at Shiloh, and set up the tabernacle of the congregation there. And the land was subdued before","2":"And there remained among the children of Israel seven tribes, which had not yet received their inheritance.","3":"And Joshua said unto the children of Israel, How long *are* ye slack to go to possess the land, which the LORD God of your fathers hath given","4":"Give out from among you three men for *each* tribe: and I will send them, and they shall rise, and go through the land, and describe it according to the inheritance of them; and they shall come","5":"And they shall divide it into seven parts: Judah shall abide in their coast on the south, and the house of Joseph shall abide in their coasts on the north.","6":"Ye shall therefore describe the land *into* seven parts, and bring *the description* hither to me, that I may cast lots for you here before the LORD our God.","7":"But the Levites have no part among you; for the priesthood of the LORD *is* their inheritance: and Gad, and Reuben, and half the tribe of Manasseh, have received their inheritance beyond Jordan on the east, which Moses the servant of the LORD gave","8":"And the men arose, and went away: and Joshua charged them that went to describe the land, saying, Go and walk through the land, and describe it, and come again to me, that I may here cast lots for you before the LORD in Shiloh.","9":"And the men went and passed through the land, and described it by cities into seven parts in a book, and came *again* to Joshua to the host at Shiloh.","10":"And Joshua cast lots for them in Shiloh before the LORD: and there Joshua divided the land unto the children of Israel according to their divisions.","11":"And the lot of the tribe of the children of Benjamin came up according to their families: and the coast of their lot came forth between the children of Judah and the children of Joseph.","12":"And their border on the north side was from Jordan; and the border went up to the side of Jericho on the north side, and went up through the mountains westward; and the goings out thereof were at the wilderness of Bethaven.","13":"And the border went over from thence toward Luz, to the side of Luz, which *is* Bethel, southward; and the border descended to Atarothadar, near the hill that *lieth* on the south side of the nether Bethhoron.","14":"And the border was drawn *thence*, and compassed the corner of the sea southward, from the hill that *lieth* before Bethhoron southward; and the goings out thereof were at Kirjathbaal, which *is* Kirjathjearim, a city of the children of Judah: this *was* the west quarter.","15":"And the south quarter *was* from the end of Kirjathjearim, and the border went out on the west, and went out to the well of waters of Nephtoah:","16":"And the border came down to the end of the mountain that *lieth* before the valley of the son of Hinnom, *and* which *is* in the valley of the giants on the north, and descended to the valley of Hinnom, to the side of Jebusi on the south, and descended to Enrogel,","17":"And was drawn from the north, and went forth to Enshemesh, and went forth toward Geliloth, which *is* over against the going up of Adummim, and descended to the stone of Bohan the son of Reuben,","18":"And passed along toward the side over against Arabah northward, and went down unto Arabah:","19":"And the border passed along to the side of Bethhoglah northward: and the outgoings of the border were at the north bay of the salt sea at the south end of Jordan: this *was* the south coast.","20":"And Jordan was the border of it on the east side. This *was* the inheritance of the children of Benjamin, by the coasts thereof round about, according to their families.","21":"Now the cities of the tribe of the children of Benjamin according to their families were Jericho, and Bethhoglah, and the valley of Keziz,","22":"And Betharabah, and Zemaraim, and Bethel,","23":"And Avim, and Parah, and Ophrah,","24":"And Chepharhaammonai, and Ophni, and Gaba; twelve cities with their villages:","25":"Gibeon, and Ramah, and Beeroth,","26":"And Mizpeh, and Chephirah, and Mozah,","27":"And Rekem, and Irpeel, and Taralah,","28":"And Zelah, Eleph, and Jebusi, which *is* Jerusalem, Gibeath, *and* Kirjath; fourteen cities with their villages. This *is* the inheritance of the children of Benjamin according to their families."}},"tsk":{"1":[{"kopje":"Silo","refs":["Richt 21:19","Joz 19:51","Joz 21:2","Joz 22:9"]},{"kopje":"richtten op","refs":["Richt 18:31","1 Sam 1:3","1 Sam 1:24","1 Sam 4:3","1 Sam 4:4","1 Kon 2:27","1 Kon 14:2","1 Kon 14:4","Ps 78:66","Jer 7:12-14","Jer 26:6"]}],"3":[{"kopje":"Hoe lang houdt u","refs":["Richt 18:9","Spr 2:2-6","Spr 10:4","Spr 13:4","Spr 15:19","Pred 9:10","Zef 3:16","Matt 20:6","Joh 6:27","Fil 3:13","Fil 3:14","2 Petr 1:10","2 Petr 1:11"]}],"4":[{"kopje":"drie","refs":["Joz 18:3","Joz 3:12","Joz 4:2","Num 1:4","Num 13:2"]},{"kopje":"beschrijven","refs":["Joz 18:6","Joz 18:9"]}],"5":[{"kopje":"Juda zal","refs":["Joz 15:1-12","Joz 19:1-9"]},{"kopje":"het huis","refs":["Joz 16:1","Joz 17:18"]}],"6":[{"kopje":"dat ik werp","refs":["Joz 18:8","Joz 18:10","Joz 14:2","Num 26:54","Num 26:55","Num 33:54","Num 34:13","Ps 105:11","Spr 16:33","Spr 18:18","Hand 13:19"]}],"7":[{"kopje":"de Levieten","refs":["Joz 13:14","Joz 13:33","Num 18:20","Num 18:23","Deut 10:9","Deut 18:1","Deut 18:2"]},{"kopje":"Gad","refs":["Joz 13:8-31","Num 32:29-41","Deut 3:12-17","Deut 4:47","Deut 4:48"]}],"8":[{"kopje":"Gaat","refs":["Gen 13:17"]},{"kopje":"dan zal ik u hier","refs":["Joz 18:6","Joz 18:10","Joz 7:16-18","Joz 13:7","Joz 14:1","Joz 14:2","Joz 15:1","1 Sam 14:41","Hand 1:24-26","Rom 14:19"]}],"9":[ (function bouwHfdnav() {

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
