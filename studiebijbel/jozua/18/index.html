ren van Israël, aan wie zij hun erfdeel nog niet uitgedeeld hadden, zeven stammen.", "3": "En Jozua zei tegen de kinderen van Israël: Hoe lang houdt u zich zo slap, om verder te trekken, om het land in bezit te nemen, dat de HEERE, de God van uw vaderen, u gegeven heeft?", "4": "Geeft voor u drie mannen van elke stam, dat ik ze uitzend, en zij zich opmaken, en het land doorwandelen, en het beschrijven naar hun erfdelen, en *weer* tot mij komen.", "5": "Zij nu zullen het verdelen in zeven delen; Juda zal blijven op zijn gebied van het zuiden, en het huis van Jozef zal blijven op zijn gebied van het noorden.", "6": "En u zult het land beschrijven in zeven delen, en het hierheen naar mij toe brengen, dat ik voor u hier het lot werp voor het aangezicht van de HEERE, onze God.", "7": "Want de Levieten hebben geen deel in uw midden; maar het priesterschap van de HEERE is hun erfdeel. Gad nu, en Ruben, en de halve stam van Manasse, hebben hun erfdeel genomen aan de overkant van de Jordaan, oostwaarts, dat Mozes, de knecht van de HEERE, hun gegeven heeft.", "8": "Toen maakten die mannen zich op, en gingen heen. En Jozua gebood hun, die heengingen om het land te beschrijven, en zei: Gaat, en doorwandelt het land, en beschrijft het; komt dan weer tot mij, dan zal ik u hier het lot werpen, voor het aangezicht van de HEERE, te Silo.", "9": "De mannen dan gingen heen, en trokken het land door en beschreven het, naar de steden, in zeven delen, in een boek; en kwamen *weer* tot Jozua in het leger te Silo.", "10": "Toen wierp Jozua het lot voor hen te Silo, voor het aangezicht van de HEERE. En Jozua verdeelde daar aan de kinderen van Israël het land, naar hun afdelingen.", "11": "En het lot van de stam van de kinderen van Benjamin kwam op, naar hun huisgezinnen; en het gebied van hun lot ging uit tussen de kinderen van Juda, en tussen de kinderen van Jozef.", "12": "En hun gebied was aan de kant noordwaarts van de Jordaan; en dit gebied gaat omhoog aan de zijde van Jericho vanuit het noorden, en gaat omhoog door het gebergte westwaarts, en de uiteinden ervan zijn aan de woestijn van Beth-aven.", "13": "En vandaar gaat het gebied door naar Luz, aan de zijde van Luz (dat is Beth-el), zuidwaarts; en dit gebied gaat af naar Atroth-addar, aan de berg, die aan de zuidzijde van het benedenste Beth-horon is.", "14": "En dat gebied strekt zich uit en keert zich om, naar de westhoek zuidwaarts van de berg, die tegenover Beth-horon zuidwaarts is, en de uiteinden ervan zijn aan Kirjath-baal (dat is Kirjath-jearim), een stad van de kinderen van Juda. Dit is de westkant.", "15": "De kant nu ten zuiden is vanaf het uiterste van Kirjath-jearim; en dit gebied gaat uit ten westen, en het komt uit bij de bron van het water van Neftoah.", "16": "En dit gebied gaat af tot aan het uiterste van de berg, die tegenover het dal van de zoon van Hinnom is, dat in het dal van de Refaïeten is tegen het noorden; en gaat af door het dal van Hinnom, aan de zijde van de Jebusieten zuidwaarts, en gaat af naar de bron van Rogel;", "17": "En strekt zich uit vanuit het noorden, en gaat uit naar En-semes; vandaar gaat het uit naar Geliloth, dat tegenover de opgang naar Adummim is, en het gaat af naar de steen van Bohan, de zoon van Ruben;", "18": "En gaat door aan de zijde tegenover Araba naar het noorden, en gaat af naar Araba.", "19": "Verder gaat dit gebied door aan de zijde van Beth-hogla noordwaarts, en de uiteinden van dit gebied zijn aan de baai van de Zoutzee noordwaarts, aan het uiterste van de Jordaan zuidwaarts. Dit is het zuidelijke gebied.", "20": "De Jordaan nu begrenst het aan de kant naar het oosten. Dit is het erfdeel van de kinderen van Benjamin, in hun gebieden rondom, naar hun huisgezinnen.", "21": "De steden nu van de stam van de kinderen van Benjamin, naar hun huisgezinnen, zijn: Jericho, en Beth-hogla, en Emek-keziz,", "22": "En Beth-araba, en Zemaraim, en Beth-el,", "23": "En Haavvim, en Para, en Ofra,", "24": "Chefar-haammonai, en Ofni, en Gaba; twaalf steden en de bijbehorende dorpen.", "25": "Gibeon, en Rama, en Beeroth,", "26": "En Mizpe, en Chefira, en Moza,", "27": "En Rekem, en Jirpeel, en Tharala,", "28": "En Zela, Elef en Jebusi (dat is Jeruzalem), Gibath, Kirjath: veertien steden alsook de bijbehorende dorpen. Dit is het erfdeel van de kinderen van Benjamin, naar hun huisgezinnen."}, "SV": {"1": "En de ganse vergadering van de kinderen Israëls verzamelde zich te Silo, en zij richtten aldaar op de tent der samenkomst, nadat het land voor hen onderworpen was.", "2": "En er bleven over onder de kinderen Israëls, aan dewelken zij hun erfdeel niet uitgedeeld hadden, zeven stammen.", "3": "En Jozua zeide tot de kinderen Israëls: Hoe lang houdt gij u zo slap, om voort te gaan, om het land te beërven, hetwelk de HEERE, de God uwer vaderen, u gegeven heeft?", "4": "Geeft voor ulieden drie mannen van elken stam, dat ik ze heenzende, en zij zich opmaken, en het land doorwandelen, en beschrijven hetzelve naar hun erven, en *weder* tot mij komen.", "5": "Zij nu zullen het delen in zeven delen; Juda zal blijven op zijn landpale van het zuiden, en het huis van Jozef zal blijven op zijn landpale van het noorden.", "6": "En gijlieden zult het land beschrijven in zeven delen, en tot mij herwaarts brengen, dat ik voor ulieden het lot hier werpe voor het aangezicht des HEEREN, onzes Gods.", "7": "Want de Levieten hebben geen deel in het midden van ulieden; maar het priesterdom des HEEREN is hun erfdeel. Gad nu, en Ruben, en de halve stam van Manasse, hebben hun erfdeel genomen op gene zijde van de Jordaan, oostwaarts, hetwelk hun Mozes, de knecht des HEEREN, gegeven heeft.", "8": "Toen maakten zich die mannen op, en gingen heen. En Jozua gebood hun, die heengingen om het land te beschrijven, zeggende: Gaat, en doorwandelt het land, en beschrijft het; komt dan weder tot mij, zo zal ik ulieden hier het lot werpen, voor het aangezicht des HEEREN, te Silo.", "9": "De mannen dan gingen heen, en togen het land door en beschreven het, naar de steden, in zeven delen, in een boek; en kwamen *weder* tot Jozua in het leger te Silo.", "10": "Toen wierp Jozua het lot voor hen te Silo, voor het aangezicht des HEEREN. En Jozua deelde aldaar den kinderen Israëls het land, naar hun afdelingen.", "11": "En het lot van den stam der kinderen van Benjamin kwam op, naar hun huisgezinnen; en de landpale van hun lot ging uit tussen de kinderen van Juda, en tussen de kinderen van Jozef.", "12": "En hun landpale was naar den hoek noordwaarts van de Jordaan; en deze landpale gaat opwaarts aan de zijde van Jericho van het noorden, en gaat op door het gebergte westwaarts, en haar uitgangen zijn aan de woestijn van Beth-aven.", "13": "En van daar gaat de landpale door naar Luz, aan de zijde van Luz ( welke is Beth-el), zuidwaarts; en deze landpale gaat af naar Atroth-addar, aan den berg, die aan de zuidzijde van het benedenste Beth-horon is.", "14": "En die landpale strekt en keert zich om, naar den westhoek zuidwaarts van den berg, die tegenover Beth-horon zuidwaarts is, en haar uitgangen zijn aan Kirjath-baal ( welke is Kirjath-jearim), een stad der kinderen van Juda. Dit is de hoek ten westen.", "15": "De hoek nu ten zuiden is aan het uiterste van Kirjath-jearim; en deze landpale gaat uit ten westen, en zij komt uit aan de fontein der wateren van Neftoah.", "16": "En deze landpale gaat af tot aan het uiterste des bergs, die tegenover het dal van den zoon van Hinnom is, die in het dal der Refaieten is tegen het noorden; en gaat af door het dal van Hinnom, aan de zijde der Jebusieten zuidwaarts, en gaat af aan de fontein van Rogel;", "17": "En strekt zich van het noorden, en gaat uit te En-semes; van daar gaat zij uit naar Geliloth, welke is tegenover den opgang naar Adummim, en zij gaat af aan den steen van Bohan, den zoon van Ruben;", "18": "En gaat door ter zijde tegenover Araba naar het noorden, en gaat af te Araba.", "19": "Verder gaat deze landpale door aan de zijde van Beth-hogla noordwaarts, en de uitgangen van deze landpale zijn aan de tong der Zoutzee noordwaarts, aan het uiterste van de Jordaan zuidwaarts. Dit is de zuiderlandpale.", "20": "De Jordaan nu bepaalt haar aan den hoek naar het oosten. Dit is het erfdeel der kinderen van Benjamin, in hun landpalen rondom, naar hun huisgezinnen.", "21": "De steden nu van den stam der kinderen van Benjamin, naar hun huisgezinnen, zijn: Jericho, en Beth-hogla, en Emek-keziz,", "22": "En Beth-araba, en Zemaraim, en Beth-el,", "23": "En Haavvim, en Para, en Ofra,", "24": "Chefar-haammonai, en Ofni, en Gaba; twaalf steden en haar dorpen.", "25": "Gibeon, en Rama, en Beeroth,", "26": "En Mizpe, en Chefira, en Moza,", "27": "En Rekem, en Jirpeel, en Tharala,", "28": "En Zela, Elef en Jebusi ( deze is Jeruzalem), Gibath, Kirjath: veertien steden mitsgaders haar dorpen. Dit is het erfdeel der kinderen van Benjamin, naar hun huisgezinnen."}, "KJV": {"1": "And the whole congregation of the children of Israel assembled together at Shiloh, and set up the tabernacle of the congregation there. And the land was subdued before", "2": "And there remained among the children of Israel seven tribes, which had not yet received their inheritance.", "3": "And Joshua said unto the children of Israel, How long *are* ye slack to go to possess the land, which the LORD God of your fathers hath given", "4": "Give out from among you three men for *each* tribe: and I will send them, and they shall rise, and go through the land, and describe it according to the inheritance of them; and they shall come", "5": "And they shall divide it into seven parts: Judah shall abide in their coast on the south, and the house of Joseph shall abide in their coasts on the north.", "6": "Ye shall therefore describe the land *into* seven parts, and bring *the description* hither to me, that I may cast lots for you here before the LORD our God.", "7": "But the Levites have no part among you; for the priesthood of the LORD *is* their inheritance: and Gad, and Reuben, and half the tribe of Manasseh, have received their inheritance beyond Jordan on the east, which Moses the servant of the LORD gave", "8": "And the men arose, and went away: and Joshua charged them that went to describe the land, saying, Go and walk through the land, and describe it, and come again to me, that I may here cast lots for you before the LORD in Shiloh.", "9": "And the men went and passed through the land, and described it by cities into seven parts in a book, and came *again* to Joshua to the host at Shiloh.", "10": "And Joshua cast lots for them in Shiloh before the LORD: and there Joshua divided the land unto the children of Israel according to their divisions.", "11": "And the lot of the tribe of the children of Benjamin came up according to their families: and the coast of their lot came forth between the children of Judah and the children of Joseph.", "12": "And their border on the north side was from Jordan; and the border went up to the side of Jericho on the north side, and went up through the mountains westward; and the goings out thereof were at the wilderness of Bethaven.", "13": "And the border went over from thence toward Luz, to the side of Luz, which *is* Bethel, southward; and the border descended to Atarothadar, near the hill that *lieth* on the south side of the nether Bethhoron.", "14": "And the border was drawn *thence*, and compassed the corner of the sea southward, from the hill that *lieth* before Bethhoron southward; and the goings out thereof were at Kirjathbaal, which *is* Kirjathjearim, a city of the children of Judah: this *was* the west quarter.", "15": "And the south quarter *was* from the end of Kirjathjearim, and the border went out on the west, and went out to the well of waters of Nephtoah:", "16": "And the border came down to the end of the mountain that *lieth* before the valley of the son of Hinnom, *and* which *is* in the valley of the giants on the north, and descended to the valley of Hinnom, to the side of Jebusi on the south, and descended to Enrogel,", "17": "And was drawn from the north, and went forth to Enshemesh, and went forth toward Geliloth, which *is* over against the going up of Adummim, and descended to the stone of Bohan the son of Reuben,", "18": "And passed along toward the side over against Arabah northward, and went down unto Arabah:", "19": "And the border passed along to the side of Bethhoglah northward: and the outgoings of the border were at the north bay of the salt sea at the south end of Jordan: this *was* the south coast.", "20": "And Jordan was the border of it on the east side. This *was* the inheritance of the children of Benjamin, by the coasts thereof round about, according to their families.", "21": "Now the cities of the tribe of the children of Benjamin according to their families were Jericho, and Bethhoglah, and the valley of Keziz,", "22": "And Betharabah, and Zemaraim, and Bethel,", "23": "And Avim, and Parah, and Ophrah,", "24": "And Chepharhaammonai, and Ophni, and Gaba; twelve cities with their villages:", "25": "Gibeon, and Ramah, and Beeroth,", "26": "And Mizpeh, and Chephirah, and Mozah,", "27": "And Rekem, and Irpeel, and Taralah,", "28": "And Zelah, Eleph, and Jebusi, which *is* Jerusalem, Gibeath, *and* Kirjath; fourteen cities with their villages. This *is* the inheritance of the children of Benjamin according to their families."}}, "tsk": {"1": [{"kopje": "Silo", "refs": ["Richt 21:19", "Joz 19:51", "Joz 21:2", "Joz 22:9"]}, {"kopje": "richtten op", "refs": ["Richt 18:31", "1 Sam 1:3", "1 Sam 1:24", "1 Sam 4:3", "1 Sam 4:4", "1 Kon 2:27", "1 Kon 14:2", "1 Kon 14:4", "Ps 78:66", "Jer 7:12-14", "Jer 26:6"]}], "3": [{"kopje": "Hoe lang houdt u", "refs": ["Richt 18:9", "Spr 2:2-6", "Spr 10:4", "Spr 13:4", "Spr 15:19", "Pred 9:10", "Zef 3:16", "Matt 20:6", "Joh 6:27", "Fil 3:13", "Fil 3:14", "2 Petr 1:10", "2 Petr 1:11"]}], "4": [{"kopje": "drie", "refs": ["Joz 18:3", "Joz 3:12", "Joz 4:2", "Num 1:4", "Num 13:2"]}, {"kopje": "beschrijven", {"label": "Called", "href": "../../nave/j/?hl=Josh.18.28#i10616", "refs": [], "kinderen": [{"label": "Jebus", "href": "../../nave/j/?hl=Josh.18.28#i10617", "refs": [{"disp": "Joz 18:28", "href": "../../jozua/18/#v28", "ref": "Joz 18:28", "svLabel": null}, {"disp": "Richt 19:10", "href": "../../richteren/19/#v10", "ref": "Richt 19:10", "svLabel": null}], "kinderen": []}]}, {"label": "Falls to Benjamin in the allotment of the land of Canaan", "href": "../../nave/j/?hl=Josh.18.28#i10680", "refs": [{"disp": "Joz 18:28", "href": "../../jozua/18/#v28", "ref": "Joz 18:28", "svLabel": null}], "kinderen": []}]}, {"topic": "Zelah", "href": "../../nave/z/#t-zelah", "kinderen": [{"label": "Saul buried in", "href": "../../nave/z/?hl=Josh.18.28#i22585", "refs": [{"disp": "Joz 18:28", "href": "../../jozua/18/#v28", "ref": "Joz 18:28", "svLabel": null}, {"disp": "2 Sam 21:14", "href": "../../2-samuel/21/#v14", "ref": "2 Sam 21:14", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Jerusalem", "href": "../../torrey/j/#t-jerusalem", "kinderen": [{"label": "The ancient Jebusi or Jebus", "href": "../../torrey/j/?hl=Josh.18.28#i10162", "refs": [{"disp": "Joz 15:8", "href": "../../jozua/15/#v8", "ref": "Joz 15:8", "svLabel": null}, {"disp": "Joz 18:28", "href": "../../jozua/18/#v28", "ref": "Joz 18:28", "svLabel": null}, {"disp": "Richt 19:10", "href": "../../richteren/19/#v10", "ref": "Richt 19:10", "svLabel": null}], "kinderen": []}, {"label": "Allotted to the tribe of Benjamin", "href": "../../torrey/j/?hl=Josh.18.28#i10164", "refs": [{"disp": "Joz 18:28", "href": "../../jozua/18/#v28", "ref": "Joz 18:28", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Pred 9:10": "Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.", "Deut 14:27": "Maar de Leviet die in uw poorten is, zult u niet verlaten; want hij heeft geen deel noch erfdeel met u.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "1 Sam 2:14": "En sloeg die in de teil, of in de ketel, of in de pan, of in de pot; al wat de vork optrok, dat nam de priester voor zich. Zo deden zij aan alle Israëlieten die in Silo kwamen.", "1 Kon 12:29-32": "En hij zette het ene te Beth-el, en het andere plaatste hij te Dan. En deze zaak werd tot zonde; want het volk ging heen voor het ene, tot Dan toe. Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Deut 10:1-22": "In die tijd zei de HEERE tegen mij: Houw u twee stenen platen, zoals de eerste, en klim naar Mij op deze berg; daarna zult u zich een kist van hout maken. En Ik zal op die platen schrijven de woorden, die op de eerste platen waren, die u gebroken hebt; en u zult ze in die kist leggen. Zo maakte ik een kist van acaciahout, en hieuw twee stenen platen zoals de eerste; en ik klom op de berg, en de twee platen waren in mijn hand.", "Joz 16:2": "En het komt van Beth-el uit naar Luz; en het gaat door tot het gebied van de Archiet, tot Ataroth toe;", "Gen 10:18": "En de Arvadiet, en de Tsemariet, en de Hamathiet; en daarna zijn de huisgezinnen van de Kanaänieten verspreid.", "2 Kron 33:6": "En hij deed zijn zonen door het vuur gaan, in het dal van de zoon van Hinnom, en pleegde toverij, en gaf op vogelgeschrei acht, en toverde, en hij stelde waarzeggers en duivelskunstenaars aan; en hij deed zeer veel kwaads in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Deut 12:18": "Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt.", "Gen 28:19": "En hij noemde de naam van die plaats Beth-el; hoewel de naam van die stad vroeger Luz was.", "1 Kron 13:5": "David dan verzamelde heel Israël, van het Egyptische Sichor af, tot waar men bij Hamath komt, om de ark van God te brengen vanuit Kirjath-jearim.", "1 Kron 6:54-81": "En dit waren hun woonplaatsen, naar hun kampementen, in hun gebieden, namelijk van de zonen van Aäron, van de familie van de Kahathieten, want dat lot was voor hen. En zij gaven hun Hebron, in het land van Juda, en haar voorsteden rondom die. Maar het veld van de stad, en haar dorpen, gaven zij aan Kaleb, de zoon van Jefunne.", "Hos 10:5": "De inwoners van Samaria zullen bang zijn vanwege het kalf van Beth-aven; want zijn volk zal erover treuren, alsook zijn afgodspriesters (die zich erover verheugden), over zijn heerlijkheid, omdat die van hen is weggegaan.", "1 Kor 9:1-23": "Ben ik niet een apostel? Ben ik niet vrij? Heb ik niet Jezus Christus, onze Heere, gezien? Bent u niet mijn werk in de Heere? Als ik voor anderen geen apostel ben, ben ik het toch voor u; want het zegel van het apostelschap ben ik voor u in de Heere. Mijn verantwoording aan hen die onderzoek naar mij doen, is deze.", "Ps 61:6": "Want U, o God! hebt gehoord naar mijn geloften; U hebt mij gegeven de erfenis van hen die Uw Naam vrezen.", "Joz 15:9": "Daarna zal deze grens zich uitstrekken van de top van de berg tot aan de waterbron Nefthoah, en uitgaan tot de steden van het gebergte Efron. Verder zal deze grens zich uitstrekken naar Baäla; dat is Kirjath-jearim.", "Num 13:2": "Zend mannen uit, die het land Kanaän verspieden, dat Ik de kinderen van Israël geven zal; van elke stam van hun vaderen zullen jullie een man zenden, ieder een leider onder hen.", "Num 34:3": "De zuiderkant nu zal voor u zijn vanaf de woestijn Zin, langs de zijden van Edom; en de zuidergrens zal voor u zijn vanaf het einde van de Zoutzee, in het oosten;", "Ezech 44:28": "Dit nu zal hun tot erfenis zijn: Ik ben hun Erfenis; daarom zult u hun geen bezitting geven in Israël; Ik ben hun Bezitting.", "Joz 21:2": "En zij spraken tot hen, te Silo, in het land Kanaän, en zeiden: De HEERE heeft geboden door de hand van Mozes, dat men ons steden zou geven om te bewonen, en de voorsteden ervan voor ons vee.", "Joz 16:1-10": "Daarna kwam het lot van de kinderen van Jozef uit: vanaf de Jordaan bij Jericho, aan het water van Jericho, oostwaarts, de woestijn opgaande van Jericho, door het gebergte van Beth-el; En het komt van Beth-el uit naar Luz; en het gaat door tot het gebied van de Archiet, tot Ataroth toe; En het gaat af tegen het westen naar het gebied van Jafleti, tot aan het gebied van het benedenste Beth-horon, en tot Gezer; en de uiteinden ervan zijn aan de zee.", "Joz 14:3": "Want aan de twee stammen en de halve stam had Mozes een erfdeel gegeven aan de overkant van de Jordaan; maar aan de Levieten had hij geen erfdeel onder hen gegeven.", "Joz 15:1-8": "Het lot voor de stam van de kinderen van Juda, naar hun huisgezinnen, was: aan het gebied van Edom, de woestijn Zin, zuidwaarts, was het uiterste tegen het zuiden; zodat hun grens, tegen het zuiden, het uiterste van de Zoutzee was; van de tong af, die tegen het zuiden ziet; en zij gaat uit naar het zuiden tot de opgang van Akrabbim, en gaat door naar Zin, en gaat op van het zuiden naar Kades-barnea, en gaat door Hezron, en gaat op naar Adar, en gaat om Karkaa;", "1 Sam 7:2": "En het gebeurde, vanaf die dag, dat de ark van de Heere in Kirjath-jearim bleef, en de tijd werd lang; het werden twintig jaar; en heel het huis van Israël klaagde de HEERE achterna.", "1 Sam 13:17": "En de verwoesters trokken uit het leger van de Filistijnen, in drie groepen; de ene groep sloeg de weg in naar Ofra, naar het land Sual;", "1 Tess 2:6": "Wij hebben ook geen eer gezocht bij mensen, niet bij u, en ook niet bij anderen; hoewel wij u tot last hadden kunnen zijn als apostelen van Christus;", "1 Sam 4:4": "Het volk zond dan naar Silo, en men bracht vandaar de ark van het verbond van de HEERE van de heerscharen, die tussen de cherubs† woont; en de twee zonen van Eli, Hofni en Pinehas, waren daar bij de ark van het verbond van God.", "Jes 11:15": "Ook zal de HEERE de inham van de zee van Egypte verbannen, en Hij zal Zijn hand bewegen tegen de rivier, door de sterkte van Zijn wind; en Hij zal die slaan in de zeven stromen, en Hij zal maken dat men er met schoenen doorheen zal gaan.", "Ezech 48:29": "Dit is het land, dat u zult laten vallen in erfenis, voor de stammen van Israël, en dit zullen hun delen zijn, spreekt de Heere HEERE.", "Jer 19:2": "En ga uit naar het dal van de zoon van Hinnom, dat voor de deur van de Zonnepoort is, en roep daar de woorden uit, die Ik tot u spreken zal;", "Joz 15:1-12": "Het lot voor de stam van de kinderen van Juda, naar hun huisgezinnen, was: aan het gebied van Edom, de woestijn Zin, zuidwaarts, was het uiterste tegen het zuiden; zodat hun grens, tegen het zuiden, het uiterste van de Zoutzee was; van de tong af, die tegen het zuiden ziet; en zij gaat uit naar het zuiden tot de opgang van Akrabbim, en gaat door naar Zin, en gaat op van het zuiden naar Kades-barnea, en gaat door Hezron, en gaat op naar Adar, en gaat om Karkaa;", "Zef 3:16": "Op die dag zal tegen Jeruzalem gezegd worden: Vrees niet, o Sion! Laat uw handen niet slap worden.", "Joz 14:1": "Dit is nu wat de kinderen van Israël geërfd hebben in het land Kanaän: wat de priester Eleazar, en Jozua, de zoon van Nun, en de hoofden van de vaderen van de stammen van de kinderen van Israël, hun hebben doen erven;", "Joz 21:22": "En Kibzaim en haar voorsteden, en Beth-horon en haar voorsteden: vier steden.", "1 Kron 13:6": "Toen trok David op met heel Israël naar Baäla, dat is Kirjath-jearim, dat in Juda ligt, om vandaar de ark van God op te halen, van de HEERE, Die tussen de cherubs woont, waar de Naam wordt aangeroepen.", "Deut 18:1-8": "De Levitische priesters, de hele stam van Levi, zullen geen deel of erfdeel hebben met Israël; de vuuroffers van de HEERE en Zijn erfdeel zullen zij eten. Daarom zal hij geen erfdeel hebben tussen zijn broeders; de HEERE is zijn Erfdeel, zoals Hij tot hem gesproken heeft. Dit nu zal het recht van de priesters zijn van het volk, van hen die een offerande offeren, hetzij een os of klein vee: dat hij de priester de schouder zal geven, en beide kaken, en de pens.", "Jer 7:12-14": "Want ga nu naar Mijn plaats die te Silo was, waar Ik Mijn Naam in het begin had laten wonen; en zie wat Ik daaraan gedaan heb vanwege de slechtheid van Mijn volk Israël. En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt; daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb.", "Joz 16:3": "En het gaat af tegen het westen naar het gebied van Jafleti, tot aan het gebied van het benedenste Beth-horon, en tot Gezer; en de uiteinden ervan zijn aan de zee.", "Joz 12:3": "En over de vlakte tot aan de zee van Cinneroth naar het oosten, en tot aan de zee van de vlakte, de Zoutzee, naar het oosten, op de weg naar Beth-jesimoth; en vanuit het zuiden, beneden Asdoth-pisga.", "1 Kon 9:2": "Dat de HEERE voor de tweede keer aan Salomo verscheen, zoals Hij hem in Gibeon verschenen was.", "Neh 2:12-16": "Daarna maakte ik mij 's nachts op, ik en enkele weinig mannen met mij, en ik maakte aan niemand bekend wat mijn God in mijn hart had gegeven om in Jeruzalem te doen; en er was geen dier met mij, dan het dier waarop ik reed. En ik trok 's nachts uit door de Dalpoort, en voorbij de Drakenfontein, en naar de Mestpoort, en ik bekeek de muren van Jeruzalem, die waren afgebroken, en haar poorten die met vuur verteerd waren. En ik ging verder naar de Fonteinpoort, en naar de vijver van de koning; maar daar was geen plaats voor het dier om onder mij door te gaan.", "1 Tess 2:5": "Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige!", "Joz 2:1": "Jozua, de zoon van Nun, had twee mannen die stiekem zouden verspieden, gestuurd vanuit Sittim, en hij zei: Ga op weg, bekijk het land en Jericho. Zij dan gingen op weg en kwamen bij het huis van een vrouw, een hoer, wier naam was Rachab, en zij sliepen daar.", "Jer 7:32": "Daarom zie, de dagen komen, spreekt de HEERE, dat het niet meer Tofeth genoemd zal worden, noch dal van de zoon van Hinnom, maar moorddal; en zij zullen ze in Tofeth begraven, omdat er geen plaats meer zal zijn.", "Luk 19:1": "En Jezus ging Jericho binnen en trok erdoorheen.", "Zach 2:2": "En ik zei: Waar gaat u heen? En hij zei tegen mij: Om Jeruzalem te meten; om te zien, hoe groot haar breedte, en hoe groot haar lengte wezen zal.", "Ps 78:66": "En Hij sloeg Zijn tegenstanders aan het achterste; Hij deed hun eeuwige smaad aan.", "1 Sam 10:26": "En Saul ging ook naar zijn huis te Gibea, en met hem gingen mannen uit het leger, van wie God het hart geraakt had.", "1 Kon 14:4": "En Jerobeams vrouw deed zo, en stond op, en ging naar Silo, en kwam in het huis van Ahia. Ahia nu kon niet zien, want zijn ogen waren star geworden vanwege zijn ouderdom.", "2 Kron 23:2": "Die trokken door Juda, en verzamelden de Levieten uit alle steden van Juda, en de hoofden van de vaderen van Israël, en zij kwamen naar Jeruzalem.", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Deut 12:19": "Wacht u ervoor dat u de Leviet niet verlaat, al uw dagen in uw land.", "Joz 7:17": "Toen hij het geslacht van Juda liet aankomen, wees hij het geslacht van Zarchi aan. Toen hij het geslacht van Zarchi liet aankomen, man voor man, werd Zabdi aangewezen;", "Joz 16:5": "Het gebied nu van de kinderen van Efraïm, naar hun huisgezinnen, is dit: namelijk, de grens van hun erfdeel was oostwaarts Atroth-addar tot aan het bovenste Beth-horon.", "1 Kron 6:61": "Maar de kinderen van Kahath die overgebleven waren, hadden van de familie van de stam, uit de halve stam van half Manasse, bij het lot, tien steden.", "Num 18:20": "Ook zei de HEERE tegen Aäron: U zult in hun land niet erven, en u zult geen deel te midden van hen hebben; Ik ben uw deel en uw erfenis, te midden van de kinderen van Israël.", "Spr 13:4": "De ziel van de luiaard is begerig, doch er is niets; maar de ziel van de vlijtigen zal vet gemaakt worden.", "Ezech 34:1-5": "En het woord van de HEERE gebeurde tot mij, en Hij zei: Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet.", "Joz 4:2": "Neem u twaalf mannen uit het volk, uit elke stam een man.", "Matt 10:9": "Verkrijgt u geen goud, geen zilver, geen koperen geld in uw gordels;", "Ps 78:60": "Daarom verliet Hij de tabernakel te Silo, de tent, die Hij tot een woning gesteld had onder de mensen.", "Joz 18:4-9": "Geeft voor u drie mannen van elke stam, dat ik ze uitzend, en zij zich opmaken, en het land doorwandelen, en het beschrijven naar hun erfdelen, en weer tot mij komen. Zij nu zullen het verdelen in zeven delen; Juda zal blijven op zijn gebied van het zuiden, en het huis van Jozef zal blijven op zijn gebied van het noorden. En u zult het land beschrijven in zeven delen, en het hierheen naar mij toe brengen, dat ik voor u hier het lot werp voor het aangezicht van de HEERE, onze God.", "Deut 13:12": "Wanneer u van een van uw steden, die de HEERE, uw God, u geeft om daar te wonen, zult horen zeggen:", "Fil 3:14": "Maar één ding doe ik: ik vergeet wat achter is, en strek mij uit naar wat voor is, en jaag naar het doel, naar de prijs van de roeping van God van boven in Christus Jezus.", "Deut 4:48": "Vanaf Aroer, dat aan de oever van de beek Arnon ligt, tot aan de berg Sion, dat is de Hermon;", "Hand 13:19": "En nadat Hij zeven volken had uitgeroeid in het land Kanaän, heeft Hij hun door het lot het land daarvan uitgedeeld.", "Num 26:54": "Aan degenen die veel zijn, zult u hun erfenis meer maken, en aan hen die weinig zijn, zult u hun erfenis minder maken; aan ieder zal, naar zijn getelden, zijn erfenis gegeven worden.", "Jer 19:11": "En u zult tegen hen zeggen: Zo zegt de HEERE van de heerscharen: Zo zal Ik dit volk en deze stad verbreken, zoals men een pottenbakkersvat verbreekt, dat niet weer heel gemaakt kan worden; en zij zullen hen in Tofeth begraven, omdat er geen andere plaats zal zijn om te begraven.", "Jes 10:29": "Zij trekken door de doorgang, te Geba houden zij hun overnachting; Rama beeft, Gibea van Saul vlucht.", "2 Kron 13:4": "En Abia maakte zich op vanaf de berg Zemaraim, die in het gebergte van Efraïm ligt, en hij zei: Luister naar mij, Jerobeam, en heel Israël!", "Spr 15:19": "De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.", "Deut 18:1": "De Levitische priesters, de hele stam van Levi, zullen geen deel of erfdeel hebben met Israël; de vuuroffers van de HEERE en Zijn erfdeel zullen zij eten.", "Jes 17:5": "Want het zal zijn zoals wanneer een maaier het staande koren verzamelt, en met zijn arm aren afmaait; ja, het zal zijn zoals wanneer iemand aren leest in het dal Refraïm.", "1 Kon 2:27": "Salomo verdreef dan Abjathar, zodat hij geen priester van de HEERE meer was, om het woord van de HEERE te vervullen, dat Hij over het huis van Eli in Silo gesproken had.", "Joz 15:1": "Het lot voor de stam van de kinderen van Juda, naar hun huisgezinnen, was: aan het gebied van Edom, de woestijn Zin, zuidwaarts, was het uiterste tegen het zuiden;", "Jer 19:6": "Daarom, ziet, de dagen komen, spreekt de HEERE, dat deze plaats niet meer het Tofeth genoemd zal worden, of dal van de zoon van Hinnom, maar Moorddal.", "Ex 35:21-29": "En zij kwamen, ieder man wiens hart hem bewoog, en ieder wiens geest hem vrijwillig maakte, die brachten het hefoffer van de HEERE voor het werk van de tent van de samenkomst, en voor heel haar dienst, en voor de heilige klederen. Zo kwamen dan de mannen met de vrouwen, allen die vrijwillig van hart waren; zij brachten haken, en oorsieraden, en ringen, en spangetjes, allerlei gouden voorwerpen; en ieder man die een gouden beweegoffer aan de HEERE offerde, En ieder man bij wie hemelsblauw gevonden werd, en purper, en scharlaken, en fijn linnen, en geitenhaar, en roodgeverfde ramsvellen, en dassenvellen, die brachten ze.", "Richt 20:4": "Toen antwoordde de Levitische man, de man van de vrouw die gedood was, en zei: Ik kwam met mijn bijvrouw te Gibea, dat van Benjamin is, om te overnachten.", "1 Sam 1:9": "Toen stond Hanna op, nadat men in Silo gegeten en gedronken had. En Eli, de priester, zat op een stoel bij een post van de tempel van de HEERE.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Neh 11:30": "Zanoah, Adullam en haar dorpen, Lachis en haar akkers, Azeka en haar onderhorige plaatsen; en zij legerden zich van Berseba af tot aan het dal Hinnom.", "Richt 20:18": "En de kinderen van Israël maakten zich op, en trokken op naar het huis van God, en vroegen God om raad, en zeiden: Wie zal onder ons als eerste optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zei: Juda als eerste.", "Joz 16:7": "En komt af van Janoah naar Ataroth en Naharoth, en raakt Jericho, en gaat uit aan de Jordaan.", "Jer 26:6": "Zo zal Ik dit huis stellen als Silo, en deze stad zal Ik stellen tot een vloek voor alle volken van de aarde.", "Spr 2:2-6": "Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt; Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid; Als u haar zoekt als zilver, en naspeurt als verborgen schatten;", "Richt 19:13": "Verder zei hij tegen zijn knecht: Kom, laten wij naderen tot een van die plaatsen, en overnachten in Gibea of in Rama.", "Num 1:4": "En met u zullen er zijn van elke stam een man, die hoofd is over het huis van zijn vaderen.", "Joz 13:7": "En nu, deel dit land als erfdeel toe aan de negen stammen en aan de halve stam van Manasse,", "1 Sam 1:3": "Deze man ging elk jaar op uit zijn stad om te aanbidden en om te offeren aan de HEERE van de heerscharen te Silo; en daar waren priesters van de HEERE, Hofni en Pinehas, de twee zonen van Eli.", "Joz 14:2": "Door het lot van hun erfenis, zoals de HEERE door de dienst van Mozes geboden had, aangaande de negen stammen en de halve stam.", "Num 34:13": "En Mozes gebood de kinderen van Israël en zei: Dit is het land dat u door het lot in erfbezit zult nemen, dat de HEERE aan de negen stammen en de halve stam van Manasse te geven geboden heeft.", "1 Sam 14:41": "Saul nu sprak tot de HEERE, de God van Israël: Toon de onschuldige. Toen werden Jonathan en Saul aangewezen, en het volk ging vrijuit.", "Ps 16:5": "De HEERE is het deel van mijn erfenis en van mijn beker; U onderhoudt mijn lot.", "Ps 16:6": "De snoeren zijn mij op fijne plaatsen gevallen; ja, een mooie erfenis is mij ten deel gevallen.", "Matt 20:6": "En hij ging uit, omtrent het elfde uur, en vond anderen werkloos staan, en zei tegen hen: Wat staat u hier de hele dag werkloos?", "Joz 15:7": "Verder zal deze grens opgaan naar Debir, van het dal van Achor, en zal noordwaarts zien naar Gilgal, dat tegenover de opgang van Adummim is, die aan het zuiden van de beek is. Daarna zal deze grens doorgaan tot het water van En-semes, en haar uitgangen zullen zijn te En-rogel.", "1 Tess 2:9": "Want u herinnert zich, broeders, onze inspanning en moeite; want terwijl wij nacht en dag werkten, om niemand van u tot last te zijn, hebben wij het Evangelie van God onder u gepredikt.", "Richt 19:10": "Doch de man wilde niet overnachten, maar stond op, en trok weg, en kwam tot tegenover Jebus (dat is Jeruzalem), met hem het paar gezadelde ezels; ook was zijn bijvrouw bij hem.", "Joz 7:16-18": "Toen stond Jozua 's morgens vroeg op, en liet Israël aankomen naar zijn stammen; en de stam van Juda werd aangewezen. Toen hij het geslacht van Juda liet aankomen, wees hij het geslacht van Zarchi aan. Toen hij het geslacht van Zarchi liet aankomen, man voor man, werd Zabdi aangewezen; Diens huisgezin liet hij aankomen, man voor man, en Achan werd aangewezen, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda.", "Joz 16:1": "Daarna kwam het lot van de kinderen van Jozef uit: vanaf de Jordaan bij Jericho, aan het water van Jericho, oostwaarts, de woestijn opgaande van Jericho, door het gebergte van Beth-el;", "1 Kron 6:65": "En zij gaven ze bij het lot, van de stam van de kinderen van Juda, en van de stam van de kinderen van Simeon, en van de stam van de kinderen van Benjamin, deze steden, die zij bij name noemden.", "1 Sam 13:18": "en een groep sloeg de weg in naar Beth-horon; en een groep sloeg de weg in naar het gebied dat uitziet op het dal Zeboim, naar de woestijn toe.", "Joz 15:61": "In de woestijn: Beth-araba, Middin en Sechacha,", "Joh 4:36": "En wie maait, ontvangt loon, en verzamelt vrucht voor het eeuwige leven; opdat zij zich samen verblijden, zowel wie zaait als wie maait.", "2 Sam 6:2": "En David maakte zich op en ging heen met al het volk dat bij hem was, van Baälim-juda, om vandaar de ark van God op te brengen, bij wie de Naam wordt aangeroepen, de Naam van de HEERE van de heerscharen, Die daarop woont tussen de cherubs.", "Richt 1:8": "Want de Judeeërs hadden tegen Jeruzalem gestreden, en hadden het ingenomen, en met de scherpte van het zwaard geslagen; en zij hadden de stad in brand gestoken.", "Joz 22:9": "Zo keerden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse terug, en trokken weg van de kinderen van Israël, van Silo, dat in het land Kanaän is, om te gaan naar het land van Gilead, naar het land van hun bezitting, waarin zij bezitters gemaakt waren, naar het bevel van de HEERE, door de dienst van Mozes.", "Spr 18:18": "Het lot doet de geschillen ophouden, en maakt scheiding tussen machtigen.", "Joz 10:2": "Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk.", "Matt 10:10": "Ook geen reistas voor onderweg, geen twee stel kleren, geen schoenen, geen staf; want de arbeider is zijn voedsel waard.", "Deut 4:47": "En zijn land in bezit hadden genomen; daarbij het land van Og, koning van Bazan; twee koningen van de Amorieten, die aan deze kant van de Jordaan waren, tegen de opgang van de zon;", "Jer 7:12": "Want ga nu naar Mijn plaats die te Silo was, waar Ik Mijn Naam in het begin had laten wonen; en zie wat Ik daaraan gedaan heb vanwege de slechtheid van Mijn volk Israël.", "2 Sam 21:14": "En zij begroeven de beenderen van Saul en zijn zoon Jonathan in het land van Benjamin te Zela, in het graf van zijn vader Kis, en deden alles wat de koning geboden had. Zo werd God na dezen voor het land vermurwd.", "1 Kon 3:5": "Te Gibeon verscheen de HEERE aan Salomo in een droom 's nachts, en God zei: Vraag wat Ik u geven zal.", "Luk 10:8": "En in welke stad u ook binnengaat en zij u ontvangen, eet wat u wordt voorgezet.", "Joz 15:2": "zodat hun grens, tegen het zuiden, het uiterste van de Zoutzee was; van de tong af, die tegen het zuiden ziet;", "Ezra 2:25": "De kinderen van Kirjath-arim, Cefira en Beeroth, zevenhonderddrieënveertig.", "Micha 2:5": "Daarom zult u niemand hebben die het meetsnoer werpt in het lot, in de gemeente van de HEERE.", "2 Sam 5:18": "En de Filistijnen kwamen en verspreidden zich in het dal Refaïm.", "Joz 17:18": "Maar het gebergte zal het uwe zijn; en omdat het een woud is, houw het af, dan zullen de uitgangen ervan de uwe zijn; want u zult de Kanaänieten verdrijven, al hebben zij ijzeren wagens, al zijn zij sterk.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Luk 10:30": "En Jezus antwoordde en zei: Een zeker mens ging van Jeruzalem naar Jericho, en viel in handen van rovers, die hem uitkleedden en daarbij zware slagen gaven, en weggingen en hem halfdood lieten liggen.", "Hand 20:34": "En u weet zelf, dat deze handen gediend hebben voor mijn behoeften, en voor die van hen die met mij waren.", "Matt 27:35": "Nadat zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, door het lot te werpen; opdat vervuld zou worden wat gezegd is door de profeet: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen.", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Deut 10:9": "Daarom heeft Levi geen deel, en ook geen erfdeel met zijn broeders; de HEERE is zijn erfdeel, zoals de HEERE, uw God, tegen hem gesproken heeft.", "1 Kon 14:2": "En Jerobeam zei tegen zijn vrouw: Sta nu op, en verkleed u, zodat men niet merkt dat u Jerobeams vrouw bent, en ga naar Silo. Zie, daar is de profeet Ahia, die tegen mij gezegd heeft dat ik koning zou zijn over dit volk.", "Joz 18:1-10": "En de hele gemeenschap van de kinderen van Israël verzamelde zich te Silo, en zij richtten daar de tent van de samenkomst op, nadat het land aan hen onderworpen was. En er bleven over onder de kinderen van Israël, aan wie zij hun erfdeel nog niet uitgedeeld hadden, zeven stammen. En Jozua zei tegen de kinderen van Israël: Hoe lang houdt u zich zo slap, om verder te trekken, om het land in bezit te nemen, dat de HEERE, de God van uw vaderen, u gegeven heeft?", "Richt 20:27": "En de kinderen van Israël vroegen de HEERE, want daar was de ark van het verbond van God in die dagen.", "Joz 7:2": "Toen Jozua mannen zond van Jericho naar Ai, dat bij Beth-aven ligt, ten oosten van Beth-el, sprak hij tot hen: Trek op en verken het land. Die mannen trokken op en verkenden Ai.", "2 Sam 17:17": "Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen.", "Ezech 40:5": "En zie, er was een muur buiten om het huis heen, rondom, en in de hand van de man was een meetriet van zes ellen, elke el een el en een handbreed; en hij mat de breedte van het gebouw: één riet, en de hoogte: één riet.", "Deut 14:27-29": "Maar de Leviet die in uw poorten is, zult u niet verlaten; want hij heeft geen deel noch erfdeel met u. Aan het einde van drie jaren zult u alle tienden van uw opbrengst voortbrengen, in datzelfde jaar, en u zult ze wegleggen in uw poorten; Zo zal de Leviet komen – omdat hij geen deel noch erfdeel met u heeft – en de vreemdeling, en de wees en de weduwe die in uw poorten zijn, en zij zullen eten en verzadigd worden; opdat de HEERE, uw God, u zegent in al het werk van uw hand, dat u doen zult.", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Joz 10:10": "En de HEERE bracht hen in verwarring voor het aangezicht van Israël; en hij sloeg hen met een grote slag te Gibeon, en vervolgde hen op de weg waar men naar Beth-horon opgaat, en sloeg hen tot Azeka en tot Makkeda toe.", "Jes 28:21": "Want de HEERE zal Zich opmaken, zoals op de berg Perazim, Hij zal beroerd zijn, zoals in het dal van Gibeon, om Zijn werk te doen, Zijn werk zal vreemd zijn; en om Zijn daad te doen, Zijn daad zal vreemd zijn!", "Luk 22:35": "En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.", "Joz 13:15-33": "Zo gaf Mozes aan de stam van de kinderen van Ruben, naar hun huisgezinnen, dat hun gebied was vanaf Aroer af, die aan de oever van de beek Arnon ligt, en de stad die midden in de beek ligt, en heel het vlakke land tot Medeba toe; Hesbon en al haar steden, die in het vlakke land zijn, Dibon, en Bamoth-baal, en Beth-baal-meon,", "Hand 20:33": "Ik heb niemands zilver, of goud, of kleding begeerd.", "Richt 10:17": "En de Ammonieten werden bijeengeroepen, en legerden zich in Gilead; daartegenover werden de Israëlieten verzameld, en legerden zich te Mizpa.", "1 Kron 14:9": "Toen de Filistijnen kwamen, spreidden zij zich uit in het dal van Refaïm.", "Richt 1:21": "Doch de Benjaminieten hebben de Jebusieten, die in Jeruzalem woonden, niet verdreven; maar de Jebusieten woonden met de Benjaminieten in Jeruzalem, tot op deze dag.", "Joz 15:6": "En deze grens zal opgaan tot Beth-hogla, en zal doorgaan van het noorden naar Beth-araba; en deze grens zal opgaan tot de steen van Bohan, de zoon van Ruben.", "Joz 13:8-31": "samen met wie de Rubenieten en Gadieten hun erfenis ontvangen hebben; die Mozes hun gaf aan de overkant van de Jordaan naar het oosten toe, zoals Mozes, de knecht van de HEERE, hun gegeven had: Van Aroer af, die aan de oever van de beek Arnon ligt, en de stad die midden in de beek ligt, en heel het vlakke land van Medeba tot Dibon toe; En alle steden van Sihon, de koning van de Amorieten, die te Hesbon geregeerd heeft, tot aan de grens van de kinderen van Ammon;", "Ezech 47:22": "Maar het zal gebeuren dat u het door loting zult laten toevallen als erfenis, voor u en voor de vreemdelingen die in uw midden wonen, die in uw midden kinderen zullen krijgen; en zij zullen voor u zijn als een geboren inwoner onder de kinderen van Israël; zij zullen met u in erfenis vallen, in het midden van de stammen van Israël.", "1 Sam 14:23": "Zo verloste de HEERE Israël op die dag; en het leger trok verder naar Beth-aven.", "Richt 1:23-26": "En het huis van Jozef stuurde verspieders naar Beth-el; de naam van deze stad was voorheen Luz. En de wachters zagen een man de stad uitgaan; en zij zeiden tegen hem: Wijs ons toch de ingang van de stad, en wij zullen goedheid bij u bewijzen. En toen hij hun de ingang van de stad had gewezen, sloegen zij de stad met de scherpte van het zwaard; maar die man en zijn hele familie lieten zij gaan.", "Deut 18:2": "Daarom zal hij geen erfdeel hebben tussen zijn broeders; de HEERE is zijn Erfdeel, zoals Hij tot hem gesproken heeft.", "Num 26:55": "Het land zal echter door het lot verdeeld worden; naar de namen van de stammen van hun vaderen zullen zij erven.", "Joz 10:11": "Het gebeurde nu, toen zij voor het aangezicht van Israël vluchtten, terwijl ze in de afdaling van Beth-horon waren, dat de HEERE grote stenen op hen wierp van de hemel, tot Azeka toe, zodat zij stierven; er waren er meer die van de hagelstenen stierven, dan die de kinderen van Israël met het zwaard doodden.", "Ezech 45:1": "Wanneer u dan het land door het lot laat toevallen als erfenis, zult u een hefoffer aan de HEERE brengen, als een heilige plaats, van het land; de lengte zal zijn de lengte van vijfentwintigduizend meetrieten, en de breedte tienduizend; dat zal in zijn hele omtrek rondom heilig zijn.", "Rom 14:19": "Laten wij dan najagen wat tot de vrede dient, en wat tot de opbouw van elkaar dient.", "Joz 19:51": "Dit zijn de erfdelen die Eleazar, de priester, en Jozua, de zoon van Nun, en de hoofden van de vaders van de stammen van de kinderen van Israël door het lot erfelijk uitdeelden te Silo, voor het aangezicht van de HEERE, aan de deur van de tent van de samenkomst. Zo maakten zij een einde aan het uitdelen van het land.", "Jer 32:35": "En zij hebben de hoogten van Baäl gebouwd, die in het dal van de zoon van Hinnom zijn, om hun zonen en hun dochters voor de Molech door het vuur te laten gaan; wat Ik hun niet geboden heb, en wat niet in Mijn hart is opgekomen, dat zij deze gruwel zouden doen; om Juda te laten zondigen.", "Joz 15:60": "Kirjath-baal, dat is Kirjath-jearim, en Rabba; twee steden en haar dorpen.", "Gen 13:17": "Maak u op, doorwandel dit land, in zijn lengte en in zijn breedte; want Ik zal het u geven.", "Joz 6:1": "(Jericho sloot nu de poorten stevig, en was gesloten, voor het aangezicht van de kinderen van Israël; er ging niemand uit, en er ging niemand in.)", "2 Tess 3:7-9": "Want u zelf weet hoe men ons behoort na te volgen; want wij hebben ons niet ongeregeld gedragen onder u; En wij hebben geen brood bij iemand gegeten voor niets, maar in arbeid en moeite, nacht en dag werkend, opdat wij niemand van u lastig zouden zijn; Niet dat wij de macht niet hebben, maar opdat wij onszelf u zouden geven tot een voorbeeld, om ons na te volgen.", "Richt 19:12-15": "Maar zijn heer zei tegen hem: Wij zullen hierheen niet afwijken naar een vreemde stad, die niet van de kinderen van Israël is; maar wij zullen doortrekken tot aan Gibea. Verder zei hij tegen zijn knecht: Kom, laten wij naderen tot een van die plaatsen, en overnachten in Gibea of in Rama. Zo trokken zij verder, en gingen hun weg; en de zon ging voor hen onder bij Gibea, dat aan Benjamin toebehoort;", "Jer 7:14": "daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb.", "Joz 18:11-28": "En het lot van de stam van de kinderen van Benjamin kwam op, naar hun huisgezinnen; en het gebied van hun lot ging uit tussen de kinderen van Juda, en tussen de kinderen van Jozef. En hun gebied was aan de kant noordwaarts van de Jordaan; en dit gebied gaat omhoog aan de zijde van Jericho vanuit het noorden, en gaat omhoog door het gebergte westwaarts, en de uiteinden ervan zijn aan de woestijn van Beth-aven. En vandaar gaat het gebied door naar Luz, aan de zijde van Luz (dat is Beth-el), zuidwaarts; en dit gebied gaat af naar Atroth-addar, aan de berg, die aan de zuidzijde van het benedenste Beth-horon is.", "1 Sam 7:1": "Toen kwamen de mannen van Kirjath-jearim, en haalden de ark van de HEERE op, en zij brachten haar in het huis van Abinadab, op de heuvel; en zij heiligden zijn zoon Eleazar, om de ark van de HEERE te bewaren.", "Num 32:29-41": "en Mozes zei tegen hen: Als de kinderen van Gad en de kinderen van Ruben, met u over de Jordaan trekken, ieder die toegerust is ten oorlog, voor het aangezicht van de HEERE, en het land voor uw aangezicht onderworpen zal zijn, dan zult u hun het land Gilead ter bezitting geven. Maar als zij niet toegerust met u oversteken, dan zullen zij tot bezitters gesteld worden te midden van u in het land Kanaän. En de kinderen van Gad en de kinderen van Ruben antwoordden en zeiden: Wat de HEERE tot uw knechten gesproken heeft, zullen wij zo doen.", "2 Kron 28:3": "Hij brandde ook reukwerk in het dal van de zoon van Hinnom, en hij verbrandde zijn zonen in het vuur, naar de gruwelen van de heidenen die de HEERE voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.", "Jes 30:33": "Want Tofeth is van oudsher bereid; ja, hij is ook voor de koning bereid; Hij heeft hem diep en wijd gemaakt, het vuur en hout van zijn brandstapel is veel; de adem van de HEERE zal hem aansteken als een zwavelstroom.", "Kol 1:12": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht;", "1 Sam 1:1": "Er was een man van Ramathaïm-Zofim, van het gebergte van Efraïm, wiens naam was Elkana, een zoon van Jerocham, de zoon van Elihu, de zoon van Tochu, de zoon van Zuf, een Efrathiet.", "2 Kor 1:14": "Zoals u ook ten dele ons erkend hebt, dat wij uw roem zijn, zoals u ook de onze bent, in de dag van de Heere Jezus.", "Luk 22:36": "Hij zei dan tegen hen: Maar nu, wie een buidel heeft, neem hem, en net zo ook een tas; en wie er geen heeft, verkoopt zijn kleed en koopt een zwaard.", "Hos 5:8": "Blaas de bazuin te Gibea, de trompet te Rama; roep luid te Beth-Aven; achter u, Benjamin!", "Joz 15:8": "En deze grens zal opgaan door het dal van de zoon van Hinnom, aan de kant van de Jebusiet van het zuiden, dat is Jeruzalem; en deze grens zal opwaarts gaan tot de top van de berg, die voor het dal van Hinnom is, westwaarts, wat in het uiterste van het dal van de Refaïeten is, tegen het noorden.", "Deut 3:12-17": "Dit land nu namen wij in die tijd in bezit; vanaf Aroer, dat aan de beek Arnon ligt, en de helft van het gebergte van Gilead, met de steden ervan, gaf ik aan de Rubenieten en Gadieten. En het overige van Gilead, alsook heel Bazan, het koninkrijk van Og, gaf ik aan de halve stam van Manasse, de hele landstreek van Argob, door heel Bazan; dat werd het land van de reuzen genoemd. Jaïr, de zoon van Manasse, kreeg de hele landstreek van Argob, tot aan het gebied van de Gezurieten en Maächatieten; en hij noemde ze naar zijn naam, Bazan-Havvoth-Jaïr, tot op deze dag.", "2 Kor 11:7-9": "Heb ik zonde gedaan, toen ik mijzelf vernederd heb opdat u verhoogd zou worden, omdat ik u het Evangelie van God om niet verkondigd heb? Ik heb andere gemeenten beroofd, doordat ik bezoldiging van hen nam om u te dienen; en toen ik bij u aanwezig was en gebrek had, ben ik niemand lastig gevallen. Want mijn gebrek hebben de broeders vervuld die van Macedonië kwamen; en ik heb mijzelf in alles gehouden zonder u te bezwaren, en ik zal mij nog zo houden.", "Hos 4:15": "Als u, Israël! wilt hoereren, laat Juda dan zeker niet schuldig worden; kom toch niet naar Gilgal, en ga niet op naar Beth-Aven, en zweer niet: Zo waarachtig als de Heere leeft.", "Mark 6:8": "En Hij gebood hun dat zij niets zouden meenemen voor onderweg, dan alleen een staf: geen reistas, geen brood, geen geld in de gordel;", "Luk 10:7": "En blijf in dat huis, etend en drinkend wat zij u geven; want de arbeider is zijn loon waard. Ga niet van het ene huis naar het andere.", "Joz 9:17": "Want toen de kinderen van Israël verder trokken, kwamen zij op de derde dag bij hun steden aan; hun steden nu waren Gibeon, en Chefira, en Beeroth, en Kirjath-jearim.", "Neh 7:30": "De mannen van Rama en Gaba, zeshonderdeenentwintig;", "Num 18:23": "Maar de Levieten, die zullen de dienst van de tent der samenkomst bedienen, en die zullen hun ongerechtigheid dragen; het zal een eeuwige inzetting zijn voor uw geslachten; en te midden van de kinderen van Israël zullen zij geen erfenis erven.", "Ex 38:8": "Hij maakte ook het koperen wasvat, met zijn koperen voet, van de spiegels van de vrouwen die samenkwamen, die samenkwamen voor de deur van de tent van de samenkomst.", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "1 Kon 3:4": "En de koning ging naar Gibeon om daar te offeren, omdat dat de grote hoogte was; duizend brandoffers offerde Salomo op dat altaar.", "Richt 20:26": "Toen trokken alle kinderen van Israël en heel het volk op, en kwamen bij het huis van God, en weenden, en bleven daar voor het aangezicht van de HEERE, en vastten die dag tot de avond; en zij offerden brandoffers en dankoffers voor het aangezicht van de HEERE.", "Num 33:54": "En u zult het land in erfelijk bezit nemen door het lot, naar uw geslachten; aan hen die veel zijn, zult u hun erfenis groter maken, en aan hen die weinig zijn, zult u hun erfenis kleiner maken; waar voor iemand het lot ook uitvalt, dat zal hij hebben; naar de stammen van uw vaderen zult u de erfenis ontvangen.", "2 Kor 1:15": "En op dit vertrouwen wilde ik eerder naar u toe komen, opdat u een tweede keer weldaad zou ontvangen;", "1 Sam 13:15": "Toen stond Samuël op en ging van Gilgal naar Gibea-benjamins; en Saul telde het volk dat bij hem gevonden werd, ongeveer zeshonderd man.", "Fil 4:10-18": "En ik ben zeer verblijd geweest in de Heere, dat u nu eindelijk opnieuw bent opgebloeid om aan mij te denken; waaraan u ook gedacht hebt, maar u hebt de gelegenheid niet gehad. Niet dat ik dit zeg vanwege gebrek; want ik heb geleerd tevreden te zijn in de omstandigheden waarin ik ben. En ik weet vernederd te worden, ik weet ook overvloed te hebben; in alle opzichten en in alles ben ik ingewijd, zowel verzadigd te zijn als honger te lijden, zowel overvloed te hebben als gebrek te lijden.", "Gen 14:3": "Deze allen voegden zich samen in het dal Siddim, dat is de Zoutzee.", "Num 31:48-54": "Toen kwamen de aanvoerders die over de duizenden van het leger waren, de hoofdlieden der duizenden en de hoofdlieden der honderden, tot Mozes; En zij zeiden tegen Mozes: Uw dienaren hebben de som opgenomen van de krijgslieden die onder ons gezag geweest zijn; en van ons ontbreekt niet één man. Daarom hebben wij een offergave voor de HEERE gebracht, ieder wat hij gekregen heeft: een gouden voorwerp, een keten, of een armring, een vingerring, een oorring, of een hangende sieraad, om voor onze zielen verzoening te doen voor het aangezicht van de HEERE.", "Hand 1:24-26": "En zij baden en zeiden: U, Heere! U, Kenner van de harten van allen, wijs van deze twee er één aan, die U uitverkoren hebt, om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats. En zij wierpen hun loten; en het lot viel op Matthias, en hij werd met algemene instemming bij de elf apostelen gerekend.", "Deut 3:17": "Verder het vlakke veld, en de Jordaan, alsook het gebied ervan; van Kinnereth af tot aan de zee van het vlakke veld, de Zoutzee, onder de hellingen van de Pisga naar het oosten.", "Joz 19:1-9": "Daarna kwam het tweede lot uit voor Simeon, voor de stam van de kinderen van Simeon, naar hun huisgezinnen; en hun erfdeel was in het midden van het erfdeel van de kinderen van Juda. En zij hadden in hun erfdeel: Beer-seba, en Seba, en Molada, En Hazar-sual, en Bala, en Azem,", "Ezra 2:26": "De kinderen van Rama en Gaba, zeshonderdeenentwintig.", "Matt 27:57": "En toen het avond geworden was, kwam er een rijk man uit Arimathea, genaamd Jozef, die ook zelf een discipel van Jezus was.", "Num 26:62": "En hun getelden waren drieëntwintigduizend, al wat mannelijk is, van een maand oud en daarboven; want dezen werden niet geteld onder de kinderen van Israël, omdat hun geen erfenis gegeven werd onder de kinderen van Israël.", "1 Sam 1:24": "Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Spr 10:4": "Wie met een lakse hand werkt, wordt arm; maar de hand van de vlijtigen maakt rijk.", "Jer 7:31": "En zij hebben de hoogten van Tofeth gebouwd, dat in het dal van de zoon van Hinnom is, om hun zonen en hun dochters met vuur te verbranden; wat Ik niet heb geboden, en wat niet in Mijn hart is opgekomen.", "1 Sam 4:3": "Toen het volk weer in het leger gekomen was, zeiden de oudsten van Israël: Waarom heeft de HEERE ons vandaag verslagen voor de Filistijnen? Laten wij uit Silo de ark van het verbond van de HEERE tot ons nemen, en laat die in ons midden komen, zodat zij ons verlost uit de hand van onze vijanden.", "2 Kon 23:10": "Hij verontreinigde ook Thofeth, dat in het dal van de kinderen van Hinnom is, opdat niemand zijn zoon of zijn dochter voor de Molech door het vuur zou laten gaan.", "Ex 36:3-7": "Zij namen dan van voor Mozes het hele hefoffer, dat de kinderen van Israël gebracht hadden voor het werk van de dienst van het heiligdom, om dat te maken; maar zij brachten hem nog elke morgen vrijwillig offer. Daarom kwamen alle wijzen, die al het werk van het heiligdom maakten, ieder man van zijn werk, dat zij maakten, en zij spraken tot Mozes en zeiden: Het volk brengt te veel, meer dan genoeg is voor de dienst van het werk dat de HEERE geboden heeft te maken.", "1 Kron 13:2": "En David zei tegen de hele gemeente van Israël: Als het u goeddunkt, en het van de HEERE, onze God, is, laten wij ons uitbreiden en laten wij zenden aan onze overige broeders, in alle landen van Israël, en de priesters en Levieten, die met hen zijn in de steden, met hun voorsteden, opdat zij bij ons verzameld worden.", "2 Kor 12:13-18": "Want wat is er, waarin u minder geweest bent dan de andere gemeenten, behalve dan dat ikzelf u niet lastig ben geweest? Vergeef mij dit onrecht. Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen. En ik zal zeer graag de kosten dragen, en voor uw zielen ten koste gegeven worden; hoewel ik, terwijl ik u overvloediger liefheb, minder bemind word.", "Joz 13:14": "Alleen aan de stam Levi gaf hij geen erfenis. De vuuroffers van God, de HEERE van Israël, zijn zijn erfenis, zoals Hij tot hem gesproken had.", "Neh 7:29": "De mannen van Kirjath-Jearim, Cefira en Beëroth, zevenhonderddrieënveertig;", "Joz 15:34": "en Zanoah, en En-gannim, Tappuah, en Enam,", "Richt 1:22-26": "En het huis van Jozef trok ook op naar Beth-el. En de HEERE was met hen. En het huis van Jozef stuurde verspieders naar Beth-el; de naam van deze stad was voorheen Luz. En de wachters zagen een man de stad uitgaan; en zij zeiden tegen hem: Wijs ons toch de ingang van de stad, en wij zullen goedheid bij u bewijzen.", "2 Sam 5:8": "Want David zei op diezelfde dag: Ieder die de Jebusieten slaat en bij die watergoot komt, en die kreupelen en die blinden, die door Davids ziel gehaat worden, die zal tot een hoofd en tot een leider zijn; daarom zegt men: Een blinde en kreupele zal het huis niet binnenkomen.", "Joz 15:63": "Maar de kinderen van Juda konden de Jebusieten, inwoners van Jeruzalem, niet verdrijven; zo woonden de Jebusieten bij de kinderen van Juda te Jeruzalem, tot op deze dag.", "Richt 20:5": "En de burgers van Gibea maakten zich tegen mij op, en omringden het huis in de nacht om mij heen; zij waren van plan mij te doden, en mijn bijvrouw hebben zij verkracht, zodat zij gestorven is.", "Richt 20:28": "En Pinehas, de zoon van Eleazar, de zoon van Aäron, stond voor Zijn aangezicht in die dagen, en zei: Zal ik nog meer uittrekken ten strijde tegen de kinderen van Benjamin, mijn broeder, of zal ik ophouden? En de HEERE zei: Trek op, want morgen zal Ik hem in uw hand geven.", "Joz 3:16": "Zo bleven de wateren die van boven afkwamen staan; zij rezen op als één hoop, heel ver van de stad Adam af, die naast Sarthan ligt; en die naar de zee van het vlakke veld liepen, namelijk de Zoutzee, liepen weg, zij werden afgesneden. Toen trok het volk over, tegenover Jericho.", "Joz 21:17": "En van de stam van Benjamin, Gibeon en haar voorsteden, Geba en haar voorsteden;", "1 Sam 1:21": "En die man, Elkana, trok op met zijn hele huis, om aan de HEERE het jaarlijkse offer te offeren, en zijn gelofte.", "Fil 3:13": "Broeders, ik acht niet dat ik het zelf al gegrepen heb.", "Gal 6:6": "En wie onderwezen wordt in het Woord, moet delen van alle goederen met hem die hem onderwijst.", "Joz 19:1": "Daarna kwam het tweede lot uit voor Simeon, voor de stam van de kinderen van Simeon, naar hun huisgezinnen; en hun erfdeel was in het midden van het erfdeel van de kinderen van Juda.", "Deut 3:1-20": "Daarna keerden wij ons om en trokken op, de weg van Bazan; en Og, de koning van Bazan, trok uit ons tegemoet, hij en al zijn volk, ten strijde bij Edrei. Toen zei de HEERE tegen mij: Wees niet bang voor hem, want Ik heb hem, en al zijn volk, en zijn land, in uw hand gegeven; en u zult hem doen, zoals u met Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt. En de HEERE, onze God, gaf ook Og, de koning van Bazan, en al zijn volk, in onze hand, zodat wij hem sloegen, totdat wij hem niemand lieten overblijven.", "Job 28:9-11": "Hij legt zijn hand aan de keiachtige rots, hij keert de bergen vanaf de wortel om. In de rotsstenen houwt hij stromen uit, en zijn oog ziet al het kostelijke. Hij bindt de rivier toe, zodat er geen traan uitkomt, en het verborgene brengt hij aan het licht.", "1 Kon 1:9": "En Adonia slachtte schapen en runderen en gemest vee bij de steen Zoheleth, die bij de bron Rogel is; en nodigde al zijn broers, de zonen van de koning, en alle mannen van Juda, de knechten van de koning.", "2 Sam 4:2": "En Sauls zoon had twee mannen, aanvoerders van benden; de naam van de één was Baëna, en de naam van de ander Rechab, zonen van Rimmon, de Beerothiet, uit de kinderen van Benjamin; want ook Beeroth werd tot Benjamin gerekend.", "Ezech 40:6": "Toen kwam hij bij de poort die naar het oosten keek, en hij ging de trappen ervan op, en mat de drempel van de poort: één riet de breedte, en de andere drempel: één riet de breedte.", "Deut 12:12": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zonen, en uw dochters, en uw dienstknechten, en uw dienstmaagden, en de Leviet die in uw poorten is; want hij heeft geen deel noch erfenis met u.", "Ps 105:11": "En zei: Ik zal u geven het land Kanaän, het snoer van uw erfdeel.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "1 Sam 13:16": "En Saul en zijn zoon Jonathan, en het volk dat bij hen gevonden werd, bleven te Gibea-benjamins; maar de Filistijnen waren te Michmas gelegerd.", "Joz 19:9": "Het erfdeel van de kinderen van Simeon ligt binnen het gebied van de kinderen van Juda; want het erfdeel van de kinderen van Juda was te groot voor hen; daarom erfden de kinderen van Simeon in het midden van hun erfdeel.", "Richt 18:9": "En zij zeiden: Maak u op, en laat ons tegen hen optrekken; want wij hebben dat land bekeken, en zie, het is zeer goed; zult u dan stil blijven? Wees niet lui om te gaan, en om erin te trekken, om dat land in erfelijk bezit te nemen;", "Jer 31:14": "En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "Joz 3:12": "Neem dan nu twaalf mannen uit de stammen van Israël, uit elke stam een man;", "Richt 21:19": "Toen zeiden zij: Zie, er is een feest van de HEERE te Silo, van jaar tot jaar, dat gehouden wordt ten noorden van het huis van God, ten oosten van de hoge weg die opgaat van het huis van God naar Sichem, en ten zuiden van Lebona.", "Richt 18:31": "Zo stelden zij voor zich het gesneden beeld van Micha op, dat hij gemaakt had, al de dagen dat het huis van God te Silo was.", "Hos 10:9": "Sinds de dagen van Gibea hebt u gezondigd, o Israël; daar zijn zij blijven staan; de strijd te Gibea tegen de kinderen van de verkeerdheid zal hen niet inhalen.", "Joz 13:15-23": "Zo gaf Mozes aan de stam van de kinderen van Ruben, naar hun huisgezinnen, dat hun gebied was vanaf Aroer af, die aan de oever van de beek Arnon ligt, en de stad die midden in de beek ligt, en heel het vlakke land tot Medeba toe; Hesbon en al haar steden, die in het vlakke land zijn, Dibon, en Bamoth-baal, en Beth-baal-meon,", "Gen 19:25": "En Hij keerde deze steden om, en die hele vlakte, en alle inwoners van deze steden, ook het gewas van het land.", "1 Sam 13:5": "En de Filistijnen werden verzameld om tegen Israël te strijden, dertigduizend wagens en zesduizend ruiters, en volk in menigte als het zand dat aan de oever van de zee is; en zij trokken op en legerden zich te Michmas, ten oosten van Beth-aven.", "1 Kron 7:24": "Zijn dochter nu was Seëra, die het lage en het hoge Beth-horon bouwde, en Uzzen-seëra.", "Joz 13:33": "Maar aan de stam van Levi gaf Mozes geen erfdeel; de HEERE, de God van Israël, is Zelf hun Erfdeel, zoals Hij tot hen gesproken heeft."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3605\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3605\">de</span> hele gemeenschap van <span class=\"wl\" data-l=\"L2\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L3\" data ">congregation</span> there. And the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> was <span class=\"wl wl-kjv\" data-code=\"H3533\">subdued</span> before", "2": "And there <span class=\"wl wl-kjv\" data-code=\"H3498\">remained</span> among the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes,</span> which had not yet <span class=\"wl wl-kjv\" data-code=\"H2505\">received</span> their inheritance.", "3": "And <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> How long are ye <span class=\"wl wl-kjv\" data-code=\"H7503\">slack</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> hath given", "4": "Give <span class=\"wl wl-kjv\" data-code=\"H3051\">out</span> from among you <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> for each <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> them, and they shall <span class=\"wl wl-kjv\" data-code=\"H6965\">rise,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> through the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H3789\">describe</span> it <span class=\"wl wl-kjv\" data-code=\"H6310\">according</span> to the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of them; and they shall come", "5": "And they shall <span class=\"wl wl-kjv\" data-code=\"H2505\">divide</span> it into <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H2506\">parts:</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> shall <span class=\"wl wl-kjv\" data-code=\"H5975\">abide</span> in their <span class=\"wl wl-kjv\" data-code=\"H1366\">coast</span> on the <span class=\"wl wl-kjv\" data-code=\"H5045\">south,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> shall <span class=\"wl wl-kjv\" data-code=\"H5975\">abide</span> in their <span class=\"wl wl-kjv\" data-code=\"H1366\">coasts</span> on the north.", "6": "Ye shall therefore <span class=\"wl wl-kjv\" data-code=\"H3789\">describe</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> into <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H2506\">parts,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the description hither to me, that I may <span class=\"wl wl-kjv\" data-code=\"H3384\">cast</span> <span class=\"wl wl-kjv\" data-code=\"H1486\">lots</span> for you here <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our God.", "7": "But the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> have no <span class=\"wl wl-kjv\" data-code=\"H2506\">part</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> you; for the <span class=\"wl wl-kjv\" data-code=\"H3550\">priesthood</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is their <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance:</span> and <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> and <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben,</span> and <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> have <span class=\"wl wl-kjv\" data-code=\"H3947\">received</span> their <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> on the <span class=\"wl wl-kjv\" data-code=\"H4217\">east,</span> which <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> gave", "8": "And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3212\">away:</span> and <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> them that <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H3789\">describe</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> through the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H3789\">describe</span> it, and come <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to me, that I may here <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> <span class=\"wl wl-kjv\" data-code=\"H1486\">lots</span> for you <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in Shiloh.", "9": "And the <span class=\"wl wl-kjv\" data-code=\"H582\">men const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
