ja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en *door* Jezus Christus bewaard:","2":"Barmhartigheid, en vrede, en liefde, worden u overvloedig gegeven.","3":"Geliefden, omdat ik alle inzet gebruik om u te schrijven over de gemeenschappelijke zaligheid, moest ik u schrijven en u vermanen dat u strijdt voor het geloof, dat eenmaal aan de heiligen overgeleverd is.","4":"Want er zijn sommige mensen ingeslopen, die vroeger al voor ditzelfde oordeel opgeschreven zijn, goddelozen, die de genade van onze God veranderen in losbandigheid, en de enige Heerser, God, en onze Heere Jezus Christus verloochenen.","5":"Maar ik wil u herinneren, ook al weet u dit al, dat de Heere, nadat Hij het volk uit Egypteland verlost had, daarna hen die niet geloofden, verdorven heeft.","6":"En de engelen, die hun oorspronkelijke positie niet bewaard hebben, maar hun eigen woonplaats verlaten hebben, heeft Hij voor het oordeel van de grote dag met eeuwige boeien onder de duisternis bewaard.","7":"Zoals Sodom en Gomorra, en de steden daaromheen, die op vergelijkbare wijze als deze gehoereerd hebben, en ander vlees zijn nagegaan, tot een voorbeeld voorgesteld zijn, en de straf van het eeuwige vuur dragen.","8":"Op dezelfde manier verontreinigen ook deze mensen, die zich in slaap dromen laten brengen, het vlees, en verwerpen het gezag, en lasteren de hoogwaardigheidsbekleders.","9":"Maar Michaël, de aartsengel, toen hij met de duivel twistte en handelde over het lichaam van Mozes, durfde geen oordeel van lastering tegen hem uitspreken, maar zei: De Heere bestraft u!","10":"Maar deze mensen lasteren wat zij niet weten; en wat zij van nature weten, zoals de redeloze dieren, daarin verderven zij zichzelf.","11":"Wee hen, want zij zijn de weg van Kaïn ingegaan, en door de verleiding van het loon van Balaäm zijn zij weggestort, en zijn door de tegenspraak van Korach vergaan.","12":"Deze mensen zijn vlekken in uw liefdemaaltijden, en als zij met u aan de maaltijd zijn, weiden zij zichzelf zonder vrees; zij zijn wolken zonder water, die door de winden rondgedreven worden; zij zijn als bomen aan het einde van de herfst, zonder vrucht, tweemaal gestorven, en ontworteld;","13":"Wilde golven van de zee, die hun eigen schande opschuimen; dwalende sterren, aan wie de zwartste duisternis voor eeuwig bewaard wordt.","14":"En van deze mensen heeft ook Enoch, de zevende vanaf Adam, geprofeteerd, en gezegd: Zie, de Heere is gekomen met Zijn vele duizenden heiligen;","15":"Om over allen gericht te houden, en alle goddelozen onder hen te straffen, vanwege al hun goddeloze werken, die zij goddeloos gedaan hebben, en vanwege alle harde woorden die de goddeloze zondaars tegen Hem gesproken hebben.","16":"Deze mensen zijn mopperaars, klagers over hun lot, die wandelen naar hun eigen begeerten; en hun mond spreekt zeer opgeblazen dingen, terwijl zij mensen bewonderen omwille van het voordeel dat het oplevert.","17":"Maar geliefden, denk aan de woorden, die door de apostelen van onze Heere Jezus Christus voorzegd zijn;","18":"Dat zij u gezegd hebben, dat er in de laatste tijd spotters zullen zijn, die naar hun eigen goddeloze begeerten zullen wandelen.","19":"Dit zijn de mensen die zichzelf afscheiden, natuurlijke mensen, die de Geest niet hebben.","20":"Maar geliefden, bouw uzelf op in uw allerheiligst geloof, en bid in de Heilige Geest;","21":"Bewaar uzelf in de liefde van God, terwijl u de barmhartigheid van onze Heere Jezus Christus verwacht, tot het eeuwige leven.","22":"En ontferm u over sommigen, met onderscheid;","23":"Maar behoud anderen door vrees, en grijp hen uit het vuur; en haat ook het kleed, dat door het vlees bevlekt is.","24":"Aan Hem nu, Die machtig is u voor struikelen te bewaren, en onstraffelijk te stellen voor Zijn heerlijkheid, in vreugde,","25":"Aan de enige, wijze God, onze Zaligmaker, zij heerlijkheid en majesteit, kracht en macht, zowel nu als in alle eeuwigheid. Amen."},"SV":{"1":"Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God den Vader geheiligd zijn, en *door* Jezus Christus bewaard:","2":"Barmhartigheid, en vrede, en liefde zij *u* vermenigvuldigd.","3":"Geliefden, alzo ik alle naarstigheid doe om u te schrijven van de gemene zaligheid, zo heb ik noodzaak gehad aan u te schrijven en *u* te vermanen, dat gij strijdt voor het geloof, dat eenmaal den heiligen overgeleverd is.","4":"Want er zijn sommige mensen ingeslopen, die eertijds tot ditzelfde oordeel te voren opgeschreven zijn, goddelozen, die de genade onzes Gods veranderen in ontuchtigheid, en den enigen Heerser, God, en onzen Heere Jezus Christus verloochenen.","5":"Maar ik wil u indachtig maken, als die dit eenmaal weet, dat de Heere, het volk uit Egypteland verlost hebbende, wederom degenen, die niet geloofden, verdorven heeft.","6":"En de engelen, die hun beginsel niet bewaard hebben, maar hun eigen woonstede verlaten hebben, heeft Hij tot het oordeel des groten dags met eeuwige banden onder de duisternis bewaard.","7":"Gelijk Sodoma en Gomorra, en de steden rondom dezelve, die op gelijke wijze als deze gehoereerd hebben, en ander vlees zijn nagegaan , tot een voorbeeld voorgesteld zijn, dragende de straf des eeuwigen vuurs.","8":"Desgelijks evenwel ook dezen, in slaap gebracht zijnde, verontreinigen het vlees, en verwerpen de heerschappij, en lasteren de heerlijkheden.","9":"Maar Michaël, de archangel, toen hij met den duivel twistte, en handelde van het lichaam van Mozes, durfde geen oordeel van lastering tegen *hem* voortbrengen, maar zeide: De Heere bestraffe u!","10":"Maar dezen, hetgeen zij niet weten, dat lasteren zij; en hetgeen zij natuurlijk, als de onredelijke dieren, weten, in hetzelve verderven zij zich.","11":"Wee hun, want zij zijn den weg van Kaïn ingegaan, en door de verleiding van het loon van Balaäm zijn zij henengestort, en zijn door de tegenspreking van Korach vergaan.","12":"Dezen zijn vlekken in uw liefdemaaltijden, *en* als zij met u ter maaltijd zijn, weiden zij zichzelven zonder vreze; zij zijn waterloze wolken, die van de winden omgedreven worden; zij zijn als bomen in het afgaan van den herfst, onvruchtbaar, tweemaal verstorven, *en* ontworteld;","13":"Wilde baren der zee, hun eigen schande opschuimende; dwalende sterren, denwelken de donkerheid der duisternis in der eeuwigheid bewaard wordt.","14":"En van dezen heeft ook Enoch, de zevende van Adam, geprofeteerd, zeggende: Ziet, de Heere is gekomen met Zijn vele duizenden heiligen;","15":"Om gericht te houden tegen allen, en te straffen alle goddelozen onder hen, vanwege al hun goddeloze werken, die zij goddelooslijk gedaan hebben, en vanwege al de harde *woorden*, die de goddeloze zondaars tegen Hem gesproken hebben.","16":"Deze zijn murmureerders, klagers over hun staat, wandelende naar hun begeerlijkheden; en hun mond spreekt zeer opgeblazen dingen, verwonderende zich over de personen om des voordeels wil.","17":"Maar geliefden, gedenkt gij der woorden, die voorzegd zijn van de apostelen van onzen Heere Jezus Christus;","18":"Dat zij u gezegd hebben, dat er in den laatsten tijd spotters zullen zijn, die naar hun goddeloze begeerlijkheden wandelen zullen.","19":"Dezen zijn het, die zichzelven afscheiden, natuurlijke *mensen*, den Geest niet hebbende.","20":"Maar geliefden, bouwt gij uzelven op uw allerheiligst geloof, biddende in den Heiligen Geest;","21":"Bewaart uzelven in de liefde Gods, verwachtende de barmhartigheid van onzen Heere Jezus Christus ten eeuwigen leven.","22":"En ontfermt u wel eniger, onderscheid makende;","23":"Maar behoudt anderen door vreze, en grijpt ze uit het vuur; en haat ook den rok, die van het vlees bevlekt is.","24":"Hem nu, Die machtig is u van struikelen te bewaren, en onstraffelijk te stellen voor Zijn heerlijkheid, in vreugde,","25":"Den alleen wijzen God, onzen Zaligmaker, zij heerlijkheid en majesteit, kracht en macht, beide nu en in alle eeuwigheid. Amen."},"KJV":{"1":"Jude, the servant of Jesus Christ, and brother of James, to them that are sanctified by God the Father, and preserved in Jesus Christ, *and* called:","2":"Mercy unto you, and peace, and love, be multiplied.","3":"Beloved, when I gave all diligence to write unto you of the common salvation, it was needful for me to write unto you, and exhort *you* that ye should earnestly contend for the faith which was once delivered unto the saints.","4":"For there are certain men crept in unawares, who were before of old ordained to this condemnation, ungodly men, turning the grace of our God into lasciviousness, and denying the only Lord God, and our Lord Jesus Christ.","5":"I will therefore put you in remembrance, though ye once knew this, how that the Lord, having saved the people out of the land of Egypt, afterward destroyed them that believed not.","6":"And the angels which kept not their first estate, but left their own habitation, he hath reserved in everlasting chains under darkness unto the judgment of the great day.","7":"Even as Sodom and Gomorrha, and the cities about them in like manner, giving themselves over to fornication, and going after strange flesh, are set forth for an example, suffering the vengeance of eternal fire.","8":"Likewise also these *filthy* dreamers defile the flesh, despise dominion, and speak evil of dignities.","9":"Yet Michael the archangel, when contending with the devil he disputed about the body of Moses, durst not bring against him a railing accusation, but said, The Lord rebuke thee.","10":"But these speak evil of those things which they know not: but what they know naturally, as brute beasts, in those things they corrupt themselves.","11":"Woe unto them! for they have gone in the way of Cain, and ran greedily after the error of Balaam for reward, and perished in the gainsaying of Core.","12":"These are spots in your feasts of charity, when they feast with you, feeding themselves without fear: clouds *they are* without water, carried about of winds; trees whose fruit withereth, without fruit, twice dead, plucked up by the roots;","13":"Raging waves of the sea, foaming out their own shame; wandering stars, to whom is reserved the blackness of darkness for ever.","14":"And Enoch also, the seventh from Adam, prophesied of these, saying, Behold, the Lord cometh with ten thousands of his saints,","15":"To execute judgment upon all, and to convince all that are ungodly among them of all their ungodly deeds which they have ungodly committed, and of all their hard *speeches* which ungodly sinners have spoken against him.","16":"These are murmurers, complainers, walking after their own lusts; and their mouth speaketh great swelling *words*, having men's persons in admiration because of advantage.","17":"But, beloved, remember ye the words which were spoken before of the apostles of our Lord Jesus Christ;","18":"How that they told you there should be mockers in the last time, who should walk after their own ungodly lusts.","19":"These be they who separate themselves, sensual, having not the Spirit.","20":"But ye, beloved, building up yourselves on your most holy faith, praying in the Holy Ghost,","21":"Keep yourselves in the love of God, looking for the mercy of our Lord Jesus Christ unto eternal life.","22":"And of some have compassion, making a difference:","23":"And others save with fear, pulling *them* out of the fire; hating even the garment spotted by the flesh.","24":"Now unto him that is able to keep you from falling, and to present *you* faultless before the presence of his glory with exceeding joy,","25":"To the only wise God our Saviour, *be* glory and majesty, dominion and power, both now and ever. Amen."}},"tsk":{"1":[{"kopje":"","refs":["1 Petr 1:5","1 Tess 5:23","1 Petr 2:9","2 Tim 1:9","Rom 1:1","Joh 14:22","Joh 17:15","Hebr 3:1","1 Petr 5:10","2 Petr 1:1","Rom 8:30","Rom 9:24","Joh 15:16","2 Tess 2:13-14","2 Tim 4:18","1 Tess 2:12","Rom 6:22","Joh 10:28-30","Joh 17:11-12","1 Kor 1:2","Joh 12:26","Ef 5:26","Hand 27:23","Luk 6:16","Rom 16:18","Joh 6:39","1 Kor 6:11","Jak 1:1","1 Petr 1:2","Hand 1:13","Hand 20:32","Matt 10:3","Mark 3:18","Joh 17:17","Joh 17:19"]}],"2":[{"kopje":"","refs":["2 Petr 1:2","1 Petr 1:2","Openb 1:4-6","Rom 1:7"]}],"3":[{"kopje":"","refs":["1 Tim 6:12","Fil 1:27","Judas 1:20","Tit 1:4","2 Tim 1:13","Openb 12:11","2 Tim 4:7-8","Openb 2:10","1 Tim 1:18","Gal 2:5","Hebr 13:22","Hand 4:12","Deut 9:10","Hand 18:28","Jes 45:22","Hand 9:22","Hand 13:46-47","1 Kor 15:3","1 Tess 2:2","Rom 15:15-16","Hand 28:28","Hand 6:8-10","1 Petr 5:12","2 Petr 3:1-2","Jes 45:17","2 Petr 1:1","2 Petr 1:12-15","Ef 1:1","Gal 6:11","Hand 18:4-6","Hand 17:3","Jer 9:3","Hand 20:27","Judas 1:17","Gal 3:28","Fil 1:1","Deut 21:9","Neh 13:25","Kol 1:2"]}],"4":[{"kopje":"","refs":["2 Petr 2:1-3","Gal 2:4","2 Petr 2:10","Tit 1:15-16","1 Petr 2:16","1 Joh 2:22","2 Petr 2:18-22","1 Petr 2:8","2 Petr 2:5-6","2 Tim 3:6","Rom 6:1-2","Tit 2:11-12","Gal 5:13","Ps 1:1","2 Petr 3:7","Ef 4:14","Hebr 12:15-16","Hand 11:23","Joh 17:3","Ps 62:3","Hand 15:24","Matt 13:25","Judas 1:15","1 Petr 4:18","Rom 9:21-22","Openb 15:4","1 Tim 6:15-16","2 Sam 22:5"]}],"5":[{"kopje":"","refs":["Hebr 3:16-4:2","Num 26:64-65","1 Kor 10:1-12","Ps 106:26","Num 14:22-37","Deut 2:15-16","Rom 15:15","2 Petr 1:12-13","2 Petr 3: Act 1:13. Deze is het die dezen zendbrief heeft geschreven."},{"catchword":"een dienstknecht","tekst":"Dat is, apostel. Zie Rom 1:1; Tit 1:1; Jam 1:1; 2Pe 1:1."},{"catchword":"Jakobus'","tekst":"Daar zijn ook onder de apostelen twee Jakobussen geweest, Mat 10:2-3 : één, die een zoon van Zebedeüs was en een broeder van den evangelist Johannes, en één , die een zoon was van Alpheüs, toegenaamd de mindere. De tweede broeder van dezen was Judas, hetwelk hij in het opschrift bijvoegt, om hem van den ander te onderscheiden, en zijn aanzien daarmede ook te versterken, alzo deze Jakobus onder de apostelen in grote achting was. Zie Luk 6:16; Act 15:13; Gal 2:9, en de aantekening op het opschrift van den zendbrief van Jakobus."},{"catchword":"de geroepenen,","tekst":"Zie Rom 1:6."},{"catchword":"door God","tekst":"Grieks in; namelijk door den Geest der wedergeboorte."},{"catchword":"bewaard;","tekst":"Namelijk bij de zaligheid, die hij hun verworven heeft. Zie Joh 10:28, en Joh 17:12; 1Pe 1:5."}],"2":[{"catchword":"Barmhartigheid,","tekst":"Zie dergelijke groetenis Tit 1:4."},{"catchword":"vermenigvuldigd","tekst":"Zie van dit woord 1Pe 1:2, en 2Pe 1:2."}],"3":[{"catchword":"de gemene","tekst":"Dat is, van zaken die onzer aller zaligheid aangaan, die gij met onze apostelen gemeen hebt. Zie Tit 1:3."},{"catchword":"noodzaak","tekst":"Namelijk om het nu te doen. De reden van deze noodzakelijkheid wordt aangewezen in het volgende vers vs.4."},{"catchword":"strijdt","tekst":"Namelijk tegen de verleiding en kwade voorbeelden der goddeloze spotters, om door hen niet overwonnen en verleid te worden tot afval of goddeloosheid; 1Ti 6:12."},{"catchword":"voor het geloof,","tekst":"Dat is, voor de zuivere leer van het Evangelie, gelijk 1Ti 4:1, om die te behouden en daarvan niet af te wijken."},{"catchword":"eenmaal","tekst":"Dat is, die niet veranderd zal worden , maar altijd blijven, zoals zij eens van Christus en de apostelen geleerd is."},{"catchword":"overgeleverd is","tekst":"Namelijk van Christus en zijn apostelen."}],"4":[{"catchword":"ingeslopen,","tekst":"Dat is , heimelijk en bedriegelijk onder de christenen gekomen. Zie Gal 2:4; 2Pe 2:1."},{"catchword":"eertijds","tekst":"Of al over lang; gelijk 2Pe 2:3."},{"catchword":"tot dit oordeel","tekst":"Namelijk waardoor God hen rechtvaardig in een verkeerden zin heeft overgeleverd, Rom 1:24, Rom 1:26, Rom 1:28; 2Th 2:10-11, en hiernamaals straffen zal met de eeuwige verdoemenis."},{"catchword":"tevoren","tekst":"Nemelijk door God in het register van de verworpen mensen; een gelijkenis genomen van de mensen, die hun registers hebben, waarin zij namen optekenen dergenen, met wie zij te doen hebben, elk in zijn orde. Zie Phi 4:3."},{"catchword":"goddelozen,","tekst":"Dat is, noch op God noch op zijn dienst passen."},{"catchword":"de genade","tekst":"Dat is, de leer der genade Gods."},{"catchword":"veranderen in","tekst":"Grieks verzetten, overstellen; dat is, misbruiken om daarop vrijer te zondigen en alle ontucht te bedrijven. Zie Gal 5:13; 1Pe 2:16; 2Pe 2:19."},{"catchword":"ontuchtigheid,","tekst":"Of dartelheid, geilheid, wulpseid."},{"catchword":"heerser","tekst":"Of Heere. Grieks despoten. Zie van dit woord. Act 4:24; 2Pe 2:1."},{"catchword":"God en","tekst":"Of onzen God en Heere Jezus Christus."},{"catchword":"verloochenen","tekst":"Zie de aantekening 2Pe 2:1."}],"5":[{"catchword":"indachtig maken,","tekst":"Dat is, verhalen en in gedachtenis brengen enige voorbeelden van Gods oordelen tegen de zodanigen."},{"catchword":"eenmaal weet,","tekst":"Dat is, gewisselijk, ten volle, terecht onveranderlijk."},{"catchword":"het volk uit","tekst":"Namelijk van Israël."},{"catchword":"verlost hebbende,","tekst":"Grieks behouden hebbende."},{"catchword":"verdorven heeft","tekst":"Dat is, omgebracht heeft in de woestijn ; welke tijdelijke straf een afbeelding was van de eeuwige; Heb 3:17, enz."}],"6":[{"catchword":"beginsel","tekst":"Dat is, hun eerste staat, waarin zij naar Gods evenbeeld geschapen en in de hemelse gelukzaligheid met de goede engelen gesteld waren, Joh 8:44. Of oorsprong of heerschappij. Want het Griekse woord betekent alle drie."},{"catchword":"hun eigen","tekst":"Dat is, den hemel,de plaats der gelukzaligheid, waar de goede engelen hun woonplaats nog hebben, Mat 24:36; Mar 12:25, Luk 2:15; waaruit deze afvallige engelen rechtvaardig zijn verstoten."},{"catchword":"des groten dags","tekst":"Namelijk waarin dat grote werk van de opstanding en het oordeel van alle mensen, en de voleinding der wereld geschieden zal, en Christus in Zijn heerlijkheid zal verschijnen."},{"catchword":"met eeuwige","tekst":"Zie de aantekening 2Pe 2:4."}],"7":[{"catchword":"de steden","tekst":"Namelijk Adama en Zeboïm, gelijk deze genoemd worden Deu 29:23."},{"catchword":"deze","tekst":"Namelijk inwoners van Sodom en Gomorra."},{"catchword":"ander vlees","tekst":"Zo beschrijft de apostel met eerbare woorden de gruwelijke zonden der Sodomieten. Zie Rom 1:27."},{"catchword":"tot een exempel","tekst":"Namelijk van Gods rechtvaardigen toorn en straf tegen de zodanigen zondaars, om zich daaraan te mogen spiegelen."},{"catchword":"des eeuwigen","tekst":"Zie van deze straf Mat 25:41."}],"8":[{"catchword":"dezen","tekst":"Namelijk goddeloze mensen, waarvan hij gesproken heeft vs.4."},{"catchword":"in slaap","tekst":"Of dromende. Dit wordt verstaan òf naar de letter, òf geestelijkerwijze,dat zij van den satan gelijk als in een slaap der zonde gewiegd zijnde, hun vlees verontreinigen met hoererijen, overspel, enz."},{"catchword":"het vlees,","tekst":"Dat is, hun lichamen, waarin deze zonden gedaan worden, en die daardoor worden verontreinigd. Zie 1Co 6:18."},{"catchword":"de heerschappij,","tekst":"Dat is, degenen die in overheid zijn gesteld, en het ambt zelf."},{"catchword":"de heerlijkheden","tekst":"Dat is, diegenen die over de mensen in hoogheid, macht, eer en groot aanzien zijn gesteld. Zie 2Pe 2:10."}],"9":[{"catchword":"Michaël","tekst":"Dit is de eigennaam van den aartsengel ,die ook gevonden wordt Dan 10:13, en Dan 12:1; Rev 12:7, en is zoveel te zeggen als wie is gelijk God. Welke naam ook den Heere Jezus Christus wel kan toegeschreven worden; maar hij wordt ook 1Th 4:16, uitdrukkelijk van den archangel onderscheiden."},{"catchword":"de archangel,","tekst":"Dat is, de overste engel of een van de overste engelen. Zie van deze naam 1Th 4:16, en de aantekening aldaar."},{"catchword":"toen hij met","tekst":"Deze geschiedenis wordt in de Schriften van het Oude Testament niet beschreven, zodat het schijnt dat Judas dit heeft tot òf uit enige overlevering van mond tot mond, òf uit enig geschrift, dat wij nu niet hebben, gelijk hij ook vs.14. de profetie van Henoch verhaalt; gelijk ook Paulus verhaalt de namen van de Egyptische tovenaars, 2Ti 3:8. Waaruit niet kan besloten worden, dat de Heilige Schrift onvolmaakt zou zijn. Zie de aantekening aldaar."},{"catchword":"het lichaam van","tekst":"Dit wordt door velen verstaan van het dode lichaam Mozes, toen hij gestorven was op den berg Nebo, hetwelk God heeft begraven op een onbekende plaats, opdat de Israëlieten met zijn dode beenderen geen afgoderij zouden begaan, gelijk door velen hedendaags gedaan wordt met de beenderen van martelaren en andere heiligen, Deu 34:1, Deu 34:6, en menen dat de duivel dit heeft gezocht te verhinderen, om het volk tot afgoderij te brengen."},{"catchword":"oordeel van","tekst":"Dat is, een lasterlijk oordeel, lasterwoorden, of scheldwoorden waarmee iemand veroordeeld wordt. Zie 2Pe 2:11."},{"catchword":"De Heere","tekst":"Dergelijke wordt gelezen Zec 3:2, waarop sommigen menen dat de apostel hier zou zien."}],"10":[{"catchword":"natuurlijk,","tekst":"Dat is, door de uitwendige zinnen."},{"catchword":"verderven","tekst":"Namelijk doordien zij die dingen met overdaad en ontuchtigheid misbruiken, waarmee zij lichaam en ziel bederven."}],"11":[{"catchword":"Wee hun,","tekst":"Dat is, hun zal een eeuwige ellende overkomen."},{"catchword":"den weg van","tekst":"Dat is, het voorbeeld van Kaïn gevolgd, in hun broeders te haten en te vervolgen."},{"catchword":"des loons","tekst":"Dat is, gelijk Bileam door gierigheid ter wille vn het loon heeft laten verleiden, om Gods volk te vloeken, hoewel God hem zulks heeft verhinderd, zo leren deze ook valse leringen en lasteren de rechte leer ter wille van vuil gewin. Grieks uitgestort; dat is, gelijk als uitgegoten water van zelf henen vliet, zo worden zij uit grote gierigheid daar henen gedreven."},{"catchword":"door de tegenspreking","tekst":"Dat is, navolgende de wederspannigheid en oproerigheid van Korach tegen hun overheid."},{"catchword":"vergaan","tekst":"Of in het verderf gebracht; gelijk korach met zijn metgezellen Dathan en Abiram, en al wat zij hadden, levend in de aarde verzonken zijn; Num 16:31, enz."}],"12":[{"catchword":"liefdemaaltijden,","tekst":"Grieks agapais; dat is, liefden. Zo werden genoemd de maaltijden, die de eerste Christenen plachten met elkander tot versterking der liefde te houden, als het avondmaal was gehouden, waarvan de apostel Paulus spreekt 1Co 11:21-22, en die beschreven worden van Tertull.Apol.cap.36."},{"catchword":"met u","tekst":"Dat is, van u tot een bijzondere maaltijd genood zijn."},{"catchword":"weiden zij","tekst":"Dat is, met gulzigheid en overdadigheid vullen en mesten zij zichzelf. Zie Eze 34:2."},{"catchword":"zonder vrees;","tekst":"Namelijk van daarover door God gestraft te zullen worden; of ook van schande voor de mensen."},{"catchword":"in het afgaan","tekst":"Dat is, die dan noch vruchten noch bladeren hebben; of die soms bloesems en beginsel van vruchten voortbrengen, maar die vergaan en afvallen."},{"catchword":"tweemaal","tekst":"Dat is, ganselijk noch vruchten noch bladeren hebben."}],"13":[{"catchword":"Wilde baren","tekst":"dat is, onstuimige, wrede."},{"catchword":"opschuimende;","tekst":"Dat is , als schuim en vuiligheid uitwerpende, namelijk hunne onstuimige vuile en lasterlijke woorden en schandelijke daden."},{"catchword":"dwalende","tekst":"Dat is, planeten welker loop, hoewel hij zeker is, zo schrijnen zij ons nochtans te dwalen, omdat haar loop niet eenparig is met de andere sterren. Daarbij vergelijkt hij hun ongestadigheid."},{"catchword":"de donkerheid","tekst":"Zie de verklaring daarvan 2Pe 2:17."}],"14":[{"catchword":"de zevende van","tekst":"Namelijk Adam meegerekend, aldus: Adam, Seth, Enos, Kenan, Mahalaleël, Jared, Henoch. Zie Gen 5."},{"catchword":"geprofeteerd,","tekst":"Deze profetie staat nergens in de Schriften van het Oude testament beschreven, maar schijnt van mond tot mond onder de Joden overgeleverd te zijn, en heeft God door den apostel Judas deze laten opschrijven onder de heilige Schriften, om eeuwig in de gemeente bewaard te worden. Zie vs.9."},{"catchword":"is gekomen","tekst":"Dat is, zal komen. Zo spreken de profeten, om daarmee aan te wijzen de zekerheid van de vervulling der profetie, alsof die al geschiedde of geschied ware. Zie 1Co 16:22."},{"catchword":"vele duizenden","tekst":"Grieks heilige tienduizenden; namelijk van engelen: een zeker getal voor een onzeker groot getal;zie Dan 7:10; Mat 24:31, en Mat 25:31."}],"15":[{"catchword":"te houden tegen","tekst":"Grieks te doen, of oordeel te vellen."},{"catchword":"allen, en","tekst":"Namelijk ongelovige en onboetvaardige zondaren. Want hier wordt gesproken van het oordeel van verdoemenis, waarin gelovige en boetvaardige zondaren niet zullen komen; Joh 5:24."},{"catchword":"te straffen alle","tekst":"Grieks te bestraffen, of te overtuigen."},{"catchword":"goddelozen onder","tekst":"Dat is, die onder hen in goddeloosheid uitmunten en de godzaligen lasteren, vervolgen en verdrukken; zoals hier door den apostel beschreven worden."},{"catchword":"de harde","tekst":"Dat is, niet alleen over hun goddelozen werken, maar ook over hun ongerijmde, lasterlijke en smadelijke woorden, die hard zijn om te verdragen."},{"catchword":"Hem gesproken","tekst":"Namelijk den heere, die komen zal om het gericht te houden, vs.14. dat is, tegen Zijn persoon, leer en gemeente."}],"16":[{"catchword":"murmureerders,","tekst":"Namelijk zo tegen God, dat Hij hun niet genoegdoet; als tegen de mensen en vooral die over hen gesteld zijn, met wier regering zij niet tevreden zijn."},{"catchword":"klagers over","tekst":"Dat is, niet tevreden zijnde met staat of deel, die God hun toegeschikt heeft."},{"catchword":"hun begeerlijkheden;","tekst":"Namelijk vleselijke begeerlijkheden. Zie Rom 8:1, Rom 8:5; 2Co 10:3; Gal 5:16; 2Pe 3:3."},{"catchword":"verwonderende","tekst":"Dat is, als met een verwondering prijzende en pluimstrijkende de personen die om hun rijkdom of macht in aanzien zijn, en hun bevordelijk kunnen wezen."},{"catchword":"om des voordeels","tekst":"Om door deze pluimstrijkerij van hen voordeel te bekomen."}],"17":[{"catchword":"van de apostelen","tekst":"Hieruit volgt niet dat deze Judas niet mede een apostel van Christus zou geweest zijn. Want ook Petrus maakt gewag van de zendbrieven van Paulus, 2Pe 3:15; maar alleen dat hij na de andere apostelen heeft geschreven. Hij ziet hier vooral op de apostelen Paulus en Petrus."}],"18":[{"catchword":"goddeloze","tekst":"Grieks begeerlijkheden der goddeloosheden."}],"19":[{"catchword":"afscheiden,","tekst":"Namelijk van de heilige vergaderingen der gelovigen. Of scheiding en scheuring in de gemeente maken."},{"catchword":"natuurlijke","tekst":"Grieks ziekelijke, gelijk 1Co 2:14; Jam 3:15. Zie de aantekening aldaar."},{"catchword":"den Geest","tekst":"Namelijk Gods, dat is, den Geest der wedergeboorte; hetwelk daaruit blijkt, omdat hun vleselijke begeerlijkheden in hen de overhand hebben en heersen; wat niet geschiedt in degenen die den Geest der wedergeboorte hebben."}],"20":[{"catchword":"bouwt gij","tekst":"Of sticht; dat is, stelt uw fundament vast, en neemt dagelijks meer en meer toe in het geloof."},{"catchword":"uzelf","tekst":"Of elkander, gelijk 1Th 5:11."},{"catchword":"uw allerheiligst","tekst":"Dat is, op het vertrouwen dat gij hebt op den Zaligmaker Jezus Christus, om dat te behouden, daarin toe te nemen, en daarop alle christelijke deugden te vestigen, Rom 14:23; Heb 11:6. Op op de leer der heilige profeten en apostelen, die gij geloofd en eenmaal aangenomen hebt, Eph 2:20, daarin dagelijks meer en meer toenemende, en bij deze vast blijvende."},{"catchword":"biddende","tekst":"Namelijk God, dat Hij door zijn Goddelijke genade en kracht u daarin versterke. Waaruit blijkt, als wij vermaand worden onszelf te stichten en te bewaren, dat zulk een bewaring niet uit onze krachten voortkomt, maar uit de genade en kracht Gods, dien wij daarom moeten bidden."},{"catchword":"in den Heiligen Geest;","tekst":"Of door den Heilige Geest; Rom 8:26."}],"21":[{"catchword":"Bewaart","tekst":"Namelijk zorgvuldig aanwendende alle middelen om daarin te blijven en toe te nemen. Zie voorgaande vers, vs.20."},{"catchword":"uzelf","tekst":"Of elkander, gelijk tevoren."},{"catchword":"in de liefde","tekst":"Dit kan verstaan worden, òf in de liefde die wij God toe dragen om daarin te volharden en toe te nemen: naar beide moeten wij trachten. Doch het tweede schijnt met des apostels doel meer overeen te komen."},{"catchword":"de barmhartigheid","tekst":"Dat is, het genadige vonnis, dat Hij over ons gelovigen zonder onze verdiensten, uit enkel barmhartigheid, zal uitspreken in den dag des oordeels; Mat 25:34."}],"22":[{"catchword":"ontfermt u","tekst":"Dat is, bestraft en vermaant enigen uit barmhartigheid en medelijden over hun zwakheid, namelijk die uit zwakheid zondigen en niet moedwillig; Gal 6:1."},{"catchword":"onderscheid","tekst":"Namelijk tussen zwakken en moedwilligen, tussen leerzamen en hardnekkigen, namelijk om uw bestraffingen en vermaningen naar elks gelegenheid met zachtheid of met hardigheidte doen, om hen te beter te winnen."}],"23":[{"catchword":"behoudt","tekst":"Dat is, zoekt hen te behouden met goede vermaningen. Zie 1Ti 4:16."},{"catchword":"anderen","tekst":"Namelijk die moedwillig of hardnekkig zijn."},{"catchword":"door vrees,","tekst":"Grieks, in vreze; dat is, zoekt hen te verschrikken met voorstellingen van het vreselijk oordeel Gods, dat over zodanigen zal gaan, indien zij zich niet bekeren; 2Ti 4:2."},{"catchword":"grijpt ze uit","tekst":"Dat is, trekt hen zonder vertoeven uit het openbaar gevaar van de zaligheid te verliezen, gelijk men doet als iemand in het vuur gevallen is. Want een bekeerd zondaar is als uit het helse vuur getrokken."},{"catchword":"den rok die","tekst":"Dat is, niet alleen de onkuischheid en andere zonden zelf, maar ook wat daarmee enige gemeenschap heeft."},{"catchword":"bevlekt is","tekst":"Dit schijnt gezegd te worden ten opzichte van de onreinheden der wet, waarnaar al wat iets onreins aanraakte zelf ook voor onrein gehouden werd."}],"24":[{"catchword":"struikelen","tekst":"Of te stoten, mistreden."},{"catchword":"voor Zijn","tekst":"Dat is, voor Hem, die heerlijk is."}],"25":[{"catchword":"in alle eeuwigheid","tekst":"Grieks, in al de eeuwen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"JUDAS, [Amongst the Apostles of Christ there were two of this name: one that was surnamed Iscarioth, the betrayer of our Lord: and one who was also called Thaddeus and Lebbeus, Mat. 10. 3. Who for distinction sake was called Judas not the Iscarioth, Joh. 14. 22. And other whiles Judas of James, Luke 6. 16. Acts 1. 13. He it is who wrote this Epistle] A servant of Jesus Christ, [that is, an Apostle. See Rom. 1. 1. Tit. 1. 1. Jam. 1. 1. 2 Pet. 1.1.] and brother of James [there were also two of this name amongst the Apostles, Mat. 10. 2, 3. One that was a son of Zebedee, and a brother of this second: which he adds in the superscription, to distinguish from the other, and also to strengthen his own authority thereby, seeing this James was in great esteem amongst the Apostles. See Luk. 6. 16. Act. 15. 13. Gal. 2. 9. And the annotate on the superscription of the Epistle of James] to the called ones [See Rom. 1. 6.] who are sanctified by God the Father [Gr. In namely, by the Spirit of regeneration ] and kept (by) Jesus Christ. [namely, in the salvation which he hath procured from them. See Joh. 10. 28. And chap. 17. 12. 1 Pet. 1. 5.]"}],"2":[{"catchword":null,"tekst":"Mercy [See the like salutation, Tit. 1. 4.] and peace, and love, be multiplied, 1 Pet. 1. 2. And 2 Pet. 1. 2.]"}],"3":[{"catchword":null,"tekst":"Beloved, seeing I give all diligence to write to you of the common salvation, [That is, of matters which concern the salvation of us all, which ye have in common with us Apostles. See Tit. 1. 3.] I was necessitated [the reason of this necessity is showed in the following verse] to write unto you, and to exhort (you) to fight [namely, against the seduction and evil examples of ungodly mockers, that ye be not overcome and seduced by them to apostasy or impiety, 1 Tim. 6. 12.] for the faith, [that is, for the pure doctrine of the Gospel, as 1 Tim. 4. 1. To retain it, and not to turn away from it] that was once [that is, which shall not be changed, but always remain so as it was once taught by Christ and the Apostles] delivered [namely, by Christ and his Apostles] to the Saints."}],"4":[{"catchword":null,"tekst":"For there are some men crept in [ That is, secretly and deceitfully come amongst Christians. See Gal. 2. 4. 2 Pet. 2. 1.] who of old [or, long ago, as 2 Pet. 2. 3.] where registered aforehand [namely, by God in the Roll of reprobate persons. A similitude taken from men that keep their book registers, in which they set down the names of those they have to do withal, each one in his order. See Phil. 4. 3.] unto this same judgement, [namely, whereby God hath justly given them up to a perverse sense, Rom. 1. 24, 26, 28. 2 Thes. 2. 10, 11. And shall hereafter punish them with eternal damnation] ungodly ones, [that is, who regard neither God nor his service] who change [Gr, transfer, transpose, i.e. abuse it, thereupon to sin the more freely, and to commit all manner of lasciviousness] the grace of our God [that is, the doctrine of the grace of God] into lasciviousness, [or, wantonness, immodesty, lustfulness] and deny [see the annot. On 2 Pet. 2. 1.] the only Lord [Gr. Despoten. See of this word, Act 4. 24. 2 Pet. 2. 1.] God, and our Lord Jesus Christ. [or, our God and Lord Jesus Christ.]"}],"5":[{"catchword":null,"tekst":"But I will put your in mind [That is, rehearse and bring to your mind some examples of God&acirc;&euro;&trade;s judgement against such persons] as they that once knew this [that is, certainly, fully, rightly, unchangeably] that the Lord having delivered [Gr. Having saved] the people, [namely, of Israel] out of the Land of Egypt, again destroyed those that believe not. [that is, made away with them in the wilderness: which temporal punishment was a representation of the eternal, Heb. 3. 17. & c]"}],"6":[{"catchword":null,"tekst":"And the Angels who kept not their beginning, [That is, their first estate, in which they were created after God&acirc;&euro;&trade;s image and put in the heavenly blessedness with the good Angels, Joh. 8. 44. Or original, or, dominion. For the Greek word signifies all these three things] but left their own habitation, [that is, heaven, the place of blessedness, where the good Angels have still their habitation, Mat. 24. 36. Mar. 12. 25. Luk. 2. 15. From whence these apostate angels were justly thrust out] he hath kept unto the judgement of the great day [namely, in which that great work of the resurrection and judgement of all men and the end of the world shall come to pass, and Christ shall appear in his glory] with everlasting bands under darkness. [See the annotate. on 2 Pet. 2. 4.]"}],"7":[{"catchword":null,"tekst":"Even as Sodom and Gomorra, and the Cities round about the same, [Namely, Adamah and Zeboim as the same are called, Deut. 29. 23.] who in like manner as these [namely, inhabitants of Sodom and Gomorra] committed fornication, and went after other flesh, [so the Apostle in modest terms describes the abominable sin an example [namely, of God&acirc;&euro;&trade;s just wrath and judgement against such sinners, that they may see themselves therein] bearing the punishment of eternal fire. [see of this punishment, Mat. 25. 41.]"}],"8":[{"catchword":null,"tekst":"Yet even these also [Namely, ungodly men, spoken of, ver. 4.] being brought asleep [or dreaming. This is understood either according to the letter, or in a spiritual manner, that they being as it were lulled into the sleep of sin, defile their flesh with whoredoms, adultery & c.] defile the flesh [that is, their bodies, in which these sins are committed, and which are defiled thereby. See 1 Cor. 6. 18.] and reject the dominion. [that is, those that are in Magistracy, and the very Office itself] and reproach the dignities. [that is, those that are set over men in eminency, power, honour, authority. See 2 Pet. 2. 20.]"}],"9":[{"catchword":null,"tekst":"But Michael [This is the proper name of the Arch-Angel, which is found also, Dan. 10. 13. And 12. 1. Revel. 12. 7. And is as much to say as, who is like unto God? Which name also may well be ascribed to the Lord Jesus Christ, but he is also 1 Thes. 4. 16. Expressly distinguished from the Arch-angel, or one of the highest Angels. See of this name, 1 Thes. 4. 16. And the annotate there] when he contended with the Devil, [this history is not written in the writings of the Old Testament: so that it seems that Jude hath this either by some tradition from hand to hand, or out of writing that we have not now: as he also, ver. 14. Relates the prophecy of Enoch: as Paul also rehearseth the names of the Egyptian Sorcerers, 2 Tim. 3. 8. From whence cannot be concluded that the holy Scripture is imperfect. See the note there] and debated concerning the body of Moses, [this is by many understood of the dead body of Moses, when he was dead on Mount Nebo, which God buried in an unknown place, that the Israelites might not commit idolatry with his dead bones, as is done by many at this day with the bones of Martyrs and other Saints, Deut. 34. Ver. 1. 6. And think that the Devil fought to hinder this, to bring the people to idolatry] durst not bring forth a judgement of reviling words, or reproachful words, whereby anyone is condemned. See 2 Pet. 2. 11.] but said, the Lord rebuke thee. [the like we read, Zach. 3. 2. To which some think that the Apostle here hath respect.]"}],"10":[{"catchword":null,"tekst":"But these reproach that which they know not, and that which they know naturally [That is, by their very outward senses] as the unreasonable beasts, therein they corrupt themselves. [namely, by reason that they abuse those things by excess and lasciviousness, whereby they corrupt both body and soul.]"}],"11":[{"catchword":null,"tekst":"Woe unto them [That is, an eternal misery shall come upon them] for they are entered the way of Cain, [that is, have followed the example of Cain, in hating and persecuting their brethren] and by the seduction of the reward of Balaam precipitated, [that is, even as Balaam through covetousness, for reward sake, suffered himself to be seduced to curse God&acirc;&euro;&trade;s people; although God hindered him from it, so these also teach false doctrines, and reproach the true, merely for filthy lucre&acirc;&euro;&trade;s sake. Gr. Poured out, i.e. as water poured out fleets away of itself, so they also are carried away with great covetousness] and perished [or, are brought into destruction, even as Corah, with his companions Dathan and Abiram, with all that they had, sunk down alive into the earth, Numb. 16. 31, & c.] by the contradiction of Core. [that is, imitating the rebellion and sedition of Core against their Magistrates.]"}],"12":[{"catchword":null,"tekst":"These are spots in your love-feasts [Gr. Agapais, i.e. loves. So the feasts were called which the primitive Christians were wont to keep together for the strengthening of love, when the Lord&acirc;&euro;&trade;s supper was held: of which the Apostle Paul speaks, 1 Cor. 11. 21, 22. And which are described by Tertullian Apol. Cap. 36.] (and) while they are at feast with you [that is, are invited by you to a particular feast] they feed themselves [that is, they fill and pamper themselves with gluttony and excess. See Ezek. 34. 2.] without fear, [namely, that they shall be punished for it by God: or as being ashamed before men] they are clouds without water, which are driven about by winds: they are as trees in the passing away of the harvest, [which then have neither fruits nor leaves left. Or which indeed sometimes may bring forth blossoms, and beginnings of fruits, but they perish, and decay soon] unfruitful, twice dead, [that is, wholly, having neither fruits nor leaves] (and) rooted up:"}],"13":[{"catchword":null,"tekst":"Wild waves of the sea [That is, tempestuous, fierce] forming up their own shame: [that is, casting forth as scum and filthiness; namely, their tempestuous, foul, and reviling words, and shameful deeds] wandering stars, [that is, planets, who though they have a certain course, yet they seem to us to wander, because their course is not uniform with the other stars. Whereunto he compareth their unsteadfastness] to whom the blackness of darkness [See the exposition hereof, 2 Pet. 2. 17.] is reserved for ever."}],"14":[{"catchword":null,"tekst":"And of these Enoch also, the seventh from Adam, [Namely, Adam himself being of the number thus, Adam, Seth, Enos, Kenan, Mahaleel, Jered, Enoch. See Gen. chap. 5.] prophesied [this prophecy stands no where written in the writings of the Old Testament, but seems to be delivered from hand to hand among the Jews, and God caused the same to be written by the Apostle Jude amongst the holy Scriptures, to be everlastingly preserved in the Church. See ver. 9.] saying, behold the Lord is come [that is, shall come. So the Prophets speak, thereby to show the certainty of the fulfilling of the Prophecy, as if it now came to pass or were to pass. See 1 Cor. 16. 22.] with his many thousand holy ones, [Gr. Holy ten thousands, namely, of Angels. A certain number for an uncertain great number. See Dan. 7. 10. Matth. 24. 31. And chap. 25. 31.]"}],"15":[{"catchword":null,"tekst":"To hold judgement [Gr. To do, or to give judgement] against all, [namely, unbelieving and impenitent of condemnation, into which believing and penitent sinners shall not come, Joh. 5. 24.] and to punish, [Gr. To reprove, or to convince] all ungodly ones among them, [that is, who are eminent in ungodliness among them, and reproach, persecute, and oppress the godly such as are here described by the Apostle] because of all the hard (words) [that is, not only concerning their ungodly works, but also for their absurd, railing and reproachful words, which are hard to be born] which ungodly sinners have spoken against him. [namely, the Lord, who shall come to hold judgement, verse 14 i.e. against his person, doctrine, and Church.]"}],"16":[{"catchword":null,"tekst":"These are murmurers, [Namely, as well against God that he doth not satisfy them, as against men, and especially those that are placed over them; with whose government they are not content] complainers of their estate, [that is, not being content with the estate or portion, that God hath appointed them] walking after their own lusts, [namely, fleshly lusts. See Rom. 8. 1. 2 Cor. 10. 3. Gal. 5. 16. 2 Pet. 3. 3.] and their mouth speaketh very swelling things; admiring at persons [that is, as with admiration commending and flattering the persons, which are in esteem for their riches and power, and may be advantageous to them] for advantage sake. [by this flattery to get advantage by them.]"}],"17":[{"catchword":null,"tekst":"But beloved remember ye the words which were foretold by the Apostles of our Lord Jesus Christ: [Hence it follows not, that this Jude should not himself also have been an Apostle of Jesus Christ, for Peter also makes mention of the Epistles Of Paul, 2 Pet. 3. 15. But only that he wrote after the other Apostles. He hath here respect chiefly to the Apostles Paul and Peter.]"}],"18":[{"catchword":null,"tekst":"That they have told you, that in the last times shall be mockers, who shall walk after their own ungodly lusts. [Gr. Lusts of ungodliness&acirc;&euro;&trade;s.]"}],"19":[{"catchword":null,"tekst":"These are they who separate themselves, [Namely, from the holy Assembles of believers. Or make separation and rents in the church] natural (men) [Gr. Animal: as 1 Cor. 2. 14. Jam. 3. 15. See the annotations there] not having the Spirit. [namely, of God, i.e. the Spirit of regeneration which appears from thence, because their fleshly lusts have the upper hand and reign in them: which is not so in them that have the Spirit of regeneration.]"}],"20":[{"catchword":null,"tekst":"But beloved, build ye [Or. Edify i.e. set your foundation fast, and increase daily more and more in faith] your selves [or, one another, as 1 Thes. 5. 11.] on your most holy faith, [that is, in the confidence that ye have in our Savior Jesus Christ, to retain that, to increase therein, and to establish all Christian virtues thereon, Rom. 14. 23. Heb. 11. 6. Or on the doctrine of the holy Prophets and Apostles, which ye believe and have received once, Ephes. 2. 20. Daily increasing therein more and more, and abiding firmly in the same] praying [namely, to God, that by his Divine grace and power he would strengthen you therein. Whence appears, that when we are exhorted to edify and to keep our selves, such keeping proceeds not from our own abilities, but from the grace and power of God, to whom we must pray for it] in the holy Ghost, [or by the holy Ghost, Rom. 8. 26.]"}],"21":[{"catchword":null,"tekst":"Keep [viz. carefully using all means to abide and increase therein. See the former verse] yourselves [or, one another, as before] in the love of God, [this may be understood either in the love wherewith God loveth us, to abide in his favour and friendship: or in the love which we const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
