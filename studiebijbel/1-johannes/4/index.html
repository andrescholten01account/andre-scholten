efgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft *tot* een verzoening voor onze zonden.","11":"Geliefden, als God ons zo lief heeft gehad, dan zijn ook wij verplicht elkaar lief te hebben.","12":"Niemand heeft ooit God gezien; als wij elkaar liefhebben, blijft God in ons, en Zijn liefde is in ons volmaakt.","13":"Hieraan herkennen wij dat wij in Hem blijven, en Hij in ons, omdat Hij ons van Zijn Geest gegeven heeft.","14":"En wij hebben het gezien, en getuigen dat de Vader *Zijn* Zoon gezonden heeft *tot* een Zaligmaker van de wereld.","15":"Wie beleden zal hebben dat Jezus de Zoon van God is, God blijft in hem, en hij in God.","16":"En wij hebben de liefde gekend en geloofd, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem.","17":"Hierin is de liefde bij ons volmaakt, opdat wij vrijmoedigheid mogen hebben in de dag van het oordeel, *namelijk* dat wij zijn zoals Hij is, in deze wereld.","18":"Er is in de liefde geen vrees, maar de volmaakte liefde drijft de vrees naar buiten; want de vrees heeft pijn, en die vreest, is niet volmaakt in de liefde.","19":"Wij hebben Hem lief, omdat Hij ons eerst lief heeft gehad.","20":"Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?","21":"En dit gebod hebben wij van Hem, *namelijk* dat wie God liefheeft, ook zijn broeder liefhebt."},"SV":{"1":"Geliefden, gelooft niet een iegelijken geest, maar beproeft de geesten, of zij uit God zijn; want vele valse profeten zijn uitgegaan in de wereld.","2":"Hieraan kent gij den Geest van God: alle geest, die belijdt, dat Jezus Christus in het vlees gekomen is, die is uit God;","3":"En alle geest, die niet belijdt, dat Jezus Christus in het vlees gekomen is, die is uit God niet; maar dit is *de* *geest* van den antichrist, welken *geest* gij gehoord hebt, dat komen zal, en is nu alrede in de wereld.","4":"Kinderkens, gij zijt uit God, en hebt hen overwonnen; want Hij is meerder, Die in u is, dan die in de wereld is.","5":"Zij zijn uit de wereld, daarom spreken zij uit de wereld, en de wereld hoort hen.","6":"Wij zijn uit God. Die God kent, hoort ons; die uit God niet is, hoort ons niet. Hieruit kennen wij den geest der waarheid, en den geest der dwaling.","7":"Geliefden! Laat ons elkander liefhebben, want de liefde is uit God; en een iegelijk, die liefheeft, is uit God geboren, en kent God;","8":"Die niet liefheeft, die heeft God niet gekend; want God is liefde.","9":"Hierin is de liefde Gods jegens ons geopenbaard, dat God Zijn eniggeboren Zoon gezonden heeft in de wereld, opdat wij zouden leven door Hem.","10":"Hierin is de liefde, niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft *tot* een verzoening voor onze zonden.","11":"Geliefden, indien God ons alzo lief heeft gehad, zo zijn ook wij schuldig elkander lief te hebben.","12":"Niemand heeft ooit God aanschouwd; indien wij elkander liefhebben, zo blijft God in ons, en Zijn liefde is in ons volmaakt.","13":"Hieraan kennen wij, dat wij in Hem blijven, en Hij in ons, omdat Hij ons van Zijn Geest gegeven heeft.","14":"En wij hebben het aanschouwd, en getuigen, dat de Vader *Zijn* Zoon gezonden heeft *tot* een Zaligmaker der wereld.","15":"Zo wie beleden zal hebben, dat Jezus de Zoon van God is, God blijft in hem, en hij in God.","16":"En wij hebben gekend en geloofd de liefde, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem.","17":"Hierin is de liefde bij ons volmaakt, opdat wij vrijmoedigheid mogen hebben in den dag des oordeels, *namelijk* dat gelijk Hij is, wij ook zijn in deze wereld.","18":"Er is in de liefde geen vrees, maar de volmaakte liefde drijft de vrees buiten; want de vrees heeft pijn, en die vreest, is niet volmaakt in de liefde.","19":"Wij hebben Hem lief , omdat Hij ons eerst liefgehad heeft.","20":"Indien iemand zegt: Ik heb God lief; en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, dien hij gezien heeft, hoe kan hij God liefhebben, Dien hij niet gezien heeft?","21":"En dit gebod hebben wij van Hem, *namelijk* dat die God liefheeft, ook zijn broeder liefhebbe."},"KJV":{"1":"Beloved, believe not every spirit, but try the spirits whether they are of God: because many false prophets are gone out into the world.","2":"Hereby know ye the Spirit of God: Every spirit that confesseth that Jesus Christ is come in the flesh is of God:","3":"And every spirit that confesseth not that Jesus Christ is come in the flesh is not of God: and this is that spirit of antichrist, whereof ye have heard that it should come; and even now already is it in the world.","4":"Ye are of God, little children, and have overcome them: because greater is he that is in you, than he that is in the world.","5":"They are of the world: therefore speak they of the world, and the world heareth them.","6":"We are of God: he that knoweth God heareth us; he that is not of God heareth not us. Hereby know we the spirit of truth, and the spirit of error.","7":"Beloved, let us love one another: for love is of God; and every one that loveth is born of God, and knoweth God.","8":"He that loveth not knoweth not God; for God is love.","9":"In this was manifested the love of God toward us, because that God sent his only begotten Son into the world, that we might live through him.","10":"Herein is love, not that we loved God, but that he loved us, and sent his Son to be the propitiation for our sins.","11":"Beloved, if God so loved us, we ought also to love one another.","12":"No man hath seen God at any time. If we love one another, God dwelleth in us, and his love is perfected in us.","13":"Hereby know we that we dwell in him, and he in us, because he hath given us of his Spirit.","14":"And we have seen and do testify that the Father sent the Son to be the Saviour of the world.","15":"Whosoever shall confess that Jesus is the Son of God, God dwelleth in him, and he in God.","16":"And we have known and believed the love that God hath to us. God is love; and he that dwelleth in love dwelleth in God, and God in him.","17":"Herein is our love made perfect, that we may have boldness in the day of judgment: because as he is, so are we in this world.","18":"There is no fear in love; but perfect love casteth out fear: because fear hath torment. He that feareth is ➔ not made perfect in love.","19":"We love him, because he first loved us.","20":"If a man say, I love God, and hateth his brother, he is a liar: for he that loveth not his brother whom he hath seen, how can he love God whom he hath ➔ not seen?","21":"And this commandment have we from him, That he who loveth God love his brother also."}},"tsk":{"1":[{"kopje":"geloof niet","refs":["Deut 13:1-5","Spr 14:15","Jer 5:31","Jer 29:8","Jer 29:9","Matt 7:15","Matt 7:16","Matt 24:4","Matt 24:5","Rom 16:18","2 Petr 2:1"]},{"kopje":"beproef","refs":["Luk 12:57","Hand 17:11","Rom 16:19","1 Kor 14:29","1 Tess 5:21","Openb 2:2"]},{"kopje":"veel","refs":["1 Joh 2:18","Matt 24:5","Matt 24:23-26","Mark 13:21","Luk 21:8","Hand 20:29","1 Tim 4:1","2 Tim 3:13","2 Petr 2:1","2 Joh 1:7"]}],"2":[{"kopje":"Elke","refs":["1 Joh 5:1","Joh 16:13-15","1 Kor 12:3"]},{"kopje":"gekomen","refs":["1 Joh 4:3","Joh 1:14","1 Tim 3:16"]}],"3":[{"kopje":"maar dit","refs":["1 Joh 2:18","1 Joh 2:22","2 Tess 2:7","2 Tess 2:8","2 Joh 1:7"]}],"4":[{"kopje":"bent","refs":["1 Joh 4:6","1 Joh 4:16","1 Joh 3:9","1 Joh 3:10","1 Joh 5:19"]},{"kopje":"en hebt","refs":["1 Joh 2:13","1 Joh 5:4","Rom 8:37","Ef 6:10","Ef 6:13","Openb 12:11"]},{"kopje":"meer","refs":["1 Joh 4:13","1 Joh 4:16","1 Joh 3:24","Joh 10:28-30","Joh 14:17-23","Joh 17:23","Rom 8:10","Rom 8:11","1 Kor 6:13","2 Kor 6:16","Ef 3:17"]},{"kopje":"dan","refs":["1 Joh 5:19","Joh 12:31","Joh 14:30","Joh 16:11","1 Kor 2:12","2 Kor 4:4","Ef 2:2","Ef 6:12"]}],"5" jke leer verlicht."},{"catchword":"hen","tekst":"Namelijk de valse leraars."},{"catchword":"overwonnen; want","tekst":"Namelijk door uw standvastigheid in de ware leer, waarvan zij u niet hebben kunnen aftrekken of verleiden. Zie Mat 24:24."},{"catchword":"Hij is","tekst":"Namelijk de Geest Gods."},{"catchword":"meerder,","tekst":"Dat is, machtiger, gelijk Joh 10:29, en 1Jo 3:20. Namelijk om u bij de waarheid te behouden en tegen de verleidingen te versterken."},{"catchword":"Die in u is,","tekst":"Dat is, die u God gegeven heeft, en in u blijft. Zie 1Jo 3:9."},{"catchword":"in de wereld is","tekst":"Namelijk de duivel of de geest der dwaling, vs.6, die in de wereldse en onherboren mensen is, zoals de valse leraars zijn, gelijk in vs.5 gezegd wordt."}],"5":[{"catchword":"Zij zijn uit","tekst":"Namelijk de valse leraars."},{"catchword":"zij uit de wereld,","tekst":"Dat is, dingen die uit de wereld zijn, en die met het verstand der onwedergeboren mensen of ook met hunne wereldse lusten overeenkomen."},{"catchword":"de wereld","tekst":"Dat is, de wereldse en onwedergeboren mensen, gelijk 1Jo 3:13."},{"catchword":"hoort hen","tekst":"Dat is, neemt hun valse leer aan."}],"6":[{"catchword":"Wij zijn","tekst":"Namelijk apostelen, en die met ons enerlei leer voorstellen."},{"catchword":"uit God","tekst":"Dat is, niet alleen door den Geest Gods wedergeboren en verlicht met de kennis der waarheid; maar ook door Hem geroepen om Zijn goddelijke waarheid en mensen zuiver te prediken."},{"catchword":"kent,","tekst":"Namelijk recht, gelijk Hij zich in Zijn Woord geopenbaard heeft."},{"catchword":"hoort ons;","tekst":"Dat is, neemt onze leer aan, gelijk tevoren."},{"catchword":"Hieruit kennen wij","tekst":"Namelijk als men ons hoort of niet hoort."},{"catchword":"den geest der waarheid,","tekst":"Namelijk als men ons hoort en onze leer aanneemt."},{"catchword":"den geest der dwaling","tekst":"Namelijk als men ons niet hoort. Zodat uit de leer en schriften der apostelen [gelijk ook der profeten en Evangelisten] moet geoordeeld worden omtrent waarheid of dwaling in de leer."}],"7":[{"catchword":"uit God; en een","tekst":"Dat is, God is een bewerker der liefde, die deze in ons werkt en ons beveelt."},{"catchword":"is uit God geboren,","tekst":"Dat is, dat is een zeker teken, dat hij waarlijk door den Geest van God is wedergeboren."},{"catchword":"kent God;","tekst":"Namelijk recht, hoedanig Hij is, wat Hem behaagt en wat Hij ons bevolen heeft."}],"8":[{"catchword":"liefde","tekst":"Dat is, God heeft lief, niet alleen zichzelf, maar ook al Zijn schepselen, bijzonder Zijn uitverkorenen in Christus Jezus, met zulk een grote liefde en toegenegenheid, dat men met recht mag zeggen, dat Hij niet alleen liefde heeft, maar ook de liefde zelf is, gelijk Hij ook de wijsheid, goedheid, enz. zelf genoemd wordt."}],"9":[{"catchword":"jegens ons","tekst":"Grieks in ons; gelijk ook vs.16, of onder ons."},{"catchword":"wij zouden","tekst":"Namelijk die in Hem geloven, gelijk uitgedrukt wordt Joh 3:16."},{"catchword":"leven door Hem","tekst":"Namelijk geestelijk en eeuwig."}],"10":[{"catchword":"is de liefde, niet","tekst":"Dat is, blijkt de grootheid van Gods liefde tot ons."},{"catchword":"liefgehad hebben,","tekst":"Namelijk eerst, zodat wij met onze liefde God tot wederliefde zouden verwekt hebben. Want wij waren van nature haters van God; Rom 1:30, en vijanden van God; Rom 5:10."},{"catchword":"lief heeft gehad,","tekst":"Namelijk eerst, gelijk uitgedrukt wordt vs.19."}],"11":[{"catchword":"zó lief heeft gehad,","tekst":"Dat is, met zulk een grote, uitnemende, onverdiende en onuitsprekelijke liefde."},{"catchword":"schuldig","tekst":"Dat is, het is niet alleen betamelijk dat wij het voorbeeld van God als Zijn kinderen hierin navolgen; maar wij zijn daardoor, alsmede door Gods bevel, verplicht om zulks te doen."},{"catchword":"elkander lief te hebben","tekst":"Dat is, niet alleen God, die de mensen zo uitnemend heeft liefgehad, maar ook wij mensen elkander om Zijnentwil."}],"12":[{"catchword":"Niemand heeft","tekst":"Namelijk der mensen, gelijk uitgedrukt wordt 1Ti 6:16."},{"catchword":"aanschouwd;","tekst":"Namelijk met de ogen van het lichaam, gelijk verklaard wordt vs.20. Dat is, hoewel men God niet met lichamelijke ogen kan zien en aanschouwen, zo blijkt Hij nochtans in ons als wij elkander liefhebben."},{"catchword":"blijft God in","tekst":"Zie hiervan de verklaring op 1Jo 3:24."},{"catchword":"Zijn liefde is","tekst":"Namelijk waarmee wij Hem liefhebben."},{"catchword":"volmaakt","tekst":"Zie de aantekeningen 1Jo 2:5."}],"13":[{"catchword":"omdat Hij ons","tekst":"Zie de verklaring 1Jo 3:24."}],"14":[{"catchword":"aanschouwd, en","tekst":"zie 1Jo 1:1."},{"catchword":"der wereld","tekst":"Dat is, der uitverkorenen en gelovigen in de ganse wereld. Zie Joh 3:17, en Joh 4:42, en 1Jo 2:2."}],"15":[{"catchword":"beleden zal hebben,","tekst":"Namelijk en voorts zal gedaan hebben hetgeen deze belijdenis vereist, namelijk hem met waar geloof zal aangenomen hebben en zijn geloof met de werken der liefde getoond. Want anderszins hebben dit ook de duivelen wel beleden; Mat 8:29; Mar 5:7."},{"catchword":"God blijft in hem,","tekst":"Zie de verklaring 1Jo 3:24."}],"16":[{"catchword":"tot ons heeft","tekst":"Grieks in ons."},{"catchword":"liefde;","tekst":"Zie der verklaring vs.8."},{"catchword":"en die in de liefde","tekst":"Dat is, daaRom."}],"17":[{"catchword":"Hierin is de","tekst":"Dat is, hierdoor zijn wij volmaakt in de liefde, namelijk dat gelijk Hij is, wij ook zijn in deze wereld, gelijk volgt."},{"catchword":"vrijmoedigheid mogen","tekst":"Dat is, een vrijmoedig vertrouwen dat wij in dien dag niet zullen veroordeeld worden; daar wij nu de liefde oefenen, en de Heere Christus dan zal te voorschijn brengen de werken der liefde, niet als verdienende oorzaken der vrijspreking en zaligheid, maar als vruchten en kentekenen van ons geloof. Zie Mat 25:34-35, enz."},{"catchword":"gelijk Hij is,","tekst":"Dat is, gelijk Christus in de liefde gewandeld heeft, en gestadig daarin blijft, wij ook Zijn voetstappen navolgen. Zie 1Jo 2:6, en 1Jo 3:3, en de aantekeningen aldaar. Of gelijk God de liefde is, wij ook zo in de liefde wandelen; vs.8, 10; Mat 5:48."}],"18":[{"catchword":"in de liefde","tekst":"Dat is, in degenen, die hun geloof door de liefde betonen, die waarlijk God en hun naaste liefhebben."},{"catchword":"geen vrees, maar","tekst":"Namelijk van verdoemd te worden in den dag des oordeels, welke vrees een slaafse vrees genoemd wordt. Want hij spreekt hier niet van de vreze Gods, die het beginsel is van alle wijsheid, Psa 111:10 welke is een kinderlijk ontzag voor de Goddelijke majesteit en zorgvuldigheid om dezen niet te vertoornen; daar die ons wordt geboden; Phi 2:12; 1Pe 1:17."},{"catchword":"de volmaakte liefde","tekst":"Dat is, als wij God en onzen naaste oprecht liefhebben. Zie 1Jo 2:5."},{"catchword":"drijft de vrees buiten;","tekst":"Grieks werpt. Want deze vrees is in de harten en gewetens der zondaren zo vast ingeplant, dat ze als met geweld door een sterk en oprecht geloof buiten het hart gedreven moet worden. Dat wij nu een oprecht geloof hebben, wordt gekend uit de oprechte liefde tot God en onzen naaste, die dus dit uitdrijven ook toegeschreven wordt."},{"catchword":"de vrees heeft","tekst":"Namelijk van verdoemd te zullen worden."},{"catchword":"pijn, en die vreest,","tekst":"Of straffing; dat is, kwelling, angst en benauwdheid des gemoeds, die ophoudt als wij verzekerd zijn van de oprechtheid onzes geloofs, hetwelk geschiedt zo door den geest Gods, als door de werken der liefde, welke hoe groter ze is, hoe minder de vrees en benauwdheid is."},{"catchword":"is niet volmaakt in de liefde","tekst":"Dat is, heeft nog de rechte liefde niet; want zo hij deze had, hij zou de vrees uitdrijven."}],"19":[{"catchword":"Wij hebben Hem lief,","tekst":"Of laat ons Hem, dat is God, liefhebben; want de Griekse tekst laat beide overzettingen toe."},{"catchword":"omdat Hij ons","tekst":"Zie vs.10."}],"20":[{"catchword":"haat zijn broeder,","tekst":"Dat is, niet alleen werkelijke haat, maar ook zelfs niet liefheeft; gelijk de volgende woorden verklaren."},{"catchword":"die is een leugenaar;","tekst":"Zie 1Jo 2:4."},{"catchword":"dien hij gezien heeft,","tekst":"Dat is, wiens persoon, staat en nood hij ziet door welk zien de liefde en barmhartigheid pleegt ontstoken te worden in het hart."},{"catchword":"hoe kan hij God","tekst":"Hij wilt zeggen, die kan geenszins God liefhebben; alzo men lichter door het gezicht dan door het gehoor tot liefde bewogen wordt; en God niet minder de ene liefde als de andere van ons eist."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Beloved believe not every spirit [That is, Teacher, which pretends that his doctrine is from the revelation of the holy spirit. See 1 Tim. 4. 1.] but try the spirits [namely, by the touchstone of God&acirc;&euro;&trade;s word. See 1 Thes. 5. 21.] whether they are of God: [that is, whether their doctrine be inspired by God, and agreeth with God&acirc;&euro;&trade;s word] for many false Prophets, not only who foretell any thing that is not true, but also who perversely interpret the Scripture, and teach false doctrines. See Matth. 24. 24.] are gone out into the world. [See 1 John 2. 19.]"}],"2":[{"catchword":null,"tekst":"Hereby ye know [Or hereby know the spirit of God: imperatively] the spirit of God. [that is, the doctrine which is inspired by the spirit God. Or a true teacher who is moved by the spirit of God] Every spirit [that is, Teacher. See ver. 1.] that confesseth [that is,openly teacheth and acknowledgeth] that Jesus Christ [Gr. Jesus Christ being come in the flesh, see ver. 3. And 2 John 7.] is come in the flesh, [that is, hath assumed the human nature, as the only Mediator, to reconcile us unto God in the same. See John 1. 14. Rom. 1. 3. This is the principal article of Christian Religion, and as a sum of the same. See Matth. 16. 16. Mark 8. 29. John 20. 31. Rom. 1. 3, 4. And thereby it appears that he was the son of God before he assumed the human nature] he is of God: [i.e. He is a true Teacher, who propoundeth the divine truth and doctrine.]"}],"3":[{"catchword":null,"tekst":"And every spirit which confesseth not that Jesus Christ is come in the flesh, he is not of God: but this is Antichrist, which is contrary to the truth of the person and office of Christ] which (spirit) ye have heard that it shall come, and is now already in the world."}],"4":[{"catchword":null,"tekst":"Little children ye are of God, [That is, regenerated by the spirit of God, and thereby enlightened with the knowledge of the true and divine doctrine] and have overcome [namely, by your steadfastness in the true doctrine, from which they were not able to withdraw or seduce you. See Matth. 24. 24.] them: [name the false Teachers] for he [namely, the spirit of God] is greater [that is, mightier, as John 10. 29. And 1 John 3. 20. Namely, to preserve you in the truth, and to strengthen you against seductions] which is in you, [That is, which God hath given you, and abideth in you. See chap. 3. 9.] than he that is in the world. [namely, the Devil, or the spirit of error, ver. 6. Who is in worldly and unregenerate men, such as the false teachers are, as is said in the following verse.]"}],"5":[{"catchword":null,"tekst":"They [Namely, the false Teachers] are of the world: therefore speak they of the world, [that is, things which are of the world, and which agree with the understanding of regenerate men, or with their worldly lusts also] and the world [that is, worldly and unregenerated men, as chap. 3. 13.] hereth them. [that is, embraceth their false doctrine.]"}],"6":[{"catchword":null,"tekst":"We [Namely, Apostles, and they that propound one kind of doctrine with us] are of God. [that is, not only regenerated by the spirit of God, and enlightened with the knowledge of the truth, but also called by him, to preach his divine truth purely unto men] He that knoweth God [namely, rightly, as he hath revealed himself in his word] heareth us: [that is, embraceth our doctrine, as before] he that is not of God, heareth us not. Hereby we know [namely, when men hear us, and embrace our doctrine] and the Spirit of error. [namely, when men hear us not. So that by the doctrine and writings of the Apostles (as also of the Prophets and evangelists) must be judged of the truth or error in doctrine]"}],"7":[{"catchword":null,"tekst":"Beloved let us love one another: for love is of God, [that is, God is an author of love, who worketh the same in us, and commandeth it us] and every one that loveth is born of God, [that is, that is a certain sign, that he is truly regenerated by the spirit of God] and knoweth God: [namely, aright, what manner of one he is, what pleaseth him, and what he hath commanded us.]"}],"8":[{"catchword":null,"tekst":"He that loveth not hath not known God: for God is love. [that is, God loveth not only himself but also all his creatures, and especially his elect in Christ Jesus, with such a great love and affection, that it may be rightly said, that he not only loveth, but also is love itself, as he is also called wisdom, goodness etc. itself]"}],"9":[{"catchword":null,"tekst":"Herein is the love of God towards us, [Gr. In us, as also ver. 16. Or among us] manifested, that God sent his only begotten Son into the world, that we [Namely, who believe in him, as is exprest, John 3. 16.] might live [namely, spiritually and eternally] through him."}],"10":[{"catchword":null,"tekst":"Herein is love [That is, appeareth the greatness of God&acirc;&euro;&trade;s love unto us] not that we loved God, [namely first, so that by our love we should have stirred up God to love us again. For we were by nature haters of God, Rom. 1. 30. And enemies of God. Rom. 5. 10.] but that he loved us, [namely, first, as is exprest ver. 19.] and sent his son (for) a ransom for our sins."}],"11":[{"catchword":null,"tekst":"Beloved if God have so loved us, [Namely, with such a great, exceeding, undeserved, and unspeakable love] we also ought [that is, it is not only seemly, that we should herein follow the example of God as his children: but we are thereby as also by God&acirc;&euro;&trade;s command obliged so to do] to love one another. [that is, not only God, who hath so exceedingly loved men, but also we men one another for his sake.]"}],"12":[{"catchword":null,"tekst":"None [Namely, of men, as is exprest 1 Tim. 6. 16.] hath ever beheld God: [namely, with eyes of the body, as is declared ver. 20. i.e. although men cannot see and behold God with their bodily eyes, yet nevertheless so it is, that he abideth in us, if we love one another] if we love one another God with their bodily eyes, yet nevertheless so it is, that he abideth in us, if we love one another.] if we love one another God abideth in us, [See the exposition hereof on 1 John 3. 24.] and his love [namely, with which we love him] is perfect in us. [See the annotate. on chap. 2. Ver. 5.]"}],"13":[{"catchword":null,"tekst":"Hereby we know that we abide in him, and he in us, because he hath given us of his spirit. [see the exposition chap. 3. 24.]"}],"14":[{"catchword":null,"tekst":"And we have beheld it, [See chap. 1. 1.] and testify that the father hath sent (his) son (for) a Saviour of the world. [that is, of the elect and faithful in the whole world. See John 3. 17. And chap. 4. 42. And 1 John 2. 2.]"}],"15":[{"catchword":null,"tekst":"Whosoever shall have confessed [Namely, and further shall have done that which his confession requires. Namely, shall have embraced him by a true faith, and shown his faith by the works of Love. For otherwise the Devils also indeed confessed this, Mat. 8. 29. Mark 5. 7.] that Jesus is the Son of God, God abideth in him, and he in God. [See the exposition chap. 3. 24.]"}],"16":[{"catchword":null,"tekst":"And we have known and believed the love that God hath unto us. [Gr. In us] God is love: [See the exposition ver. 8.] and [that is, therefore] he that abideth in love, he abideth in God, and God in him."}],"17":[{"catchword":null,"tekst":"Herein is love perfect with us, [That is, hereby are we perfect in love, namely, that like as he is, we are also in the world, as followeth] that we may have boldness in the day of judgement, [that is, a bold confidence that we shall not be condemned in that day: seeing we now exercise love, and the Lord Christ shall then bring forth works of love, not as meritorious causes of absolution and salvation, but as fruits and evidences of our faith. See Matth. 25. Ver. 34. 35. Etc] (namely) that even as he is, [that is, even as Christ walked in love, ver. 8. 10. Matth. 5. 48.] we are also in this world."}],"18":[{"catchword":null,"tekst":"There is no fear [Namely, of being condemned in the day of judgement, which fear is called a slavish fear. For he speaketh not here of the fear of God, which is the beginning of all wisdom, Psalm 111. 10. Which is a childlike reverence of the Divine Majesty, and a fullness not to provoke the same: seeing that is commanded us, Phil. 2. 12. 1 Pet. 1. 17.] in love, [that is, in them who show their faith by love: who truly love God and their neighbor] but perfect love [that is, when we sincerely love God and our neighbor. See chap. 2. 5.] driveth out fear: [Gr. Casteth. For this fear is so firmly implanted in the hearts and consciences of sinners, that it must as it were by force be driven out of the heart by a strong and true faith. Now that we have a true faith, is known by the true love of God and our neighbor, to which therefore this driving out is also ascribed] for fear [ namely, that we shall be damned] hath torment, [or punishment, i.e. vexation, anguish, and distress of mind, which ceaseth when we are assured of the truth of our faith, which is done both by the spirit of God, and by the works of love, which by how much greater it is, by so much the fear and anguish is the less] and he that feareth, is not perfect in love. [that is, hath not yet true love: for if he had it, he would drive out this fear.]"}],"19":[{"catchword":null,"tekst":"We love him [ Or let us love him, i.e. God, for the Greek Text may bear both Translations] because he loved us first. [See vers. 10.]"}],"20":[{"catchword":null,"tekst":"If any man say, I love God, and hateth his brother [That is, not only actually hateth him, but even also doth not love him; as the following words declare] he is a liar. [see chap. 2. 4.] For he that loveth not his brother whom he hath seen, [that is, whose person, state, and necessity he seeth, by which sight love and mercy useth to be stirred up in the heart] how can he love God [he would say he can in no wise love God: seeing men are more easily moved to love by sight then by hearing, and God no less requires the one love of us than the other] whom he hath not seen?"}],"21":[{"catchword":null,"tekst":"And this commandment we have from him, (namely) that he that loveth God, should love his brother also."}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"

let vertaling = 'SVnu';
// vanuit een rechtsklik-vertaalmenu (elders) kan de link ?vert=SV meegeven om

const _vertParam = new URLSearchParams(location.search).get('vert');
if (_vertParam && D.vertalingen[_vertParam]) vertaling = _vertParam;
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +

// popup positioneren bij een element

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

document.addEventListener('click', e => {

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
