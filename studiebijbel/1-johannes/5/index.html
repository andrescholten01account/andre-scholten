od gelooft, heeft het getuigenis in zichzelf; wie God niet gelooft, heeft Hem tot een leugenaar gemaakt, omdat hij niet geloofd heeft het getuigenis dat God getuigd heeft van Zijn Zoon.","11":"En dit is het getuigenis, *namelijk* dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.","12":"Wie de Zoon heeft, die heeft het leven; wie de Zoon van God niet heeft, die heeft het leven niet.","13":"Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.","14":"En dit is de vrijmoedigheid die wij tegenover Hem hebben, dat als wij iets bidden naar Zijn wil, Hij ons verhoort.","15":"En als wij weten dat Hij ons verhoort, wat wij ook bidden, dan weten wij dat wij de beden verkrijgen die wij van Hem gebeden hebben.","16":"Als iemand zijn broeder een zonde ziet doen die niet tot de dood is, die zal *God* bidden en Hij zal hem het leven geven, aan hen namelijk die zondigen niet tot de dood. Er is een zonde tot de dood; voor die *zonde* zeg ik niet dat hij moet bidden.","17":"Alle ongerechtigheid is zonde; en er is zonde die niet tot de dood is.","18":"Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.","19":"Wij weten dat wij uit God zijn, en dat de hele wereld ligt in het boze.","20":"Maar wij weten dat de Zoon van God gekomen is, en ons het verstand gegeven heeft, opdat wij de Waarachtige kennen; en wij zijn in de Waarachtige, *namelijk* in Zijn Zoon Jezus Christus. Deze is de waarachtige God, en het eeuwige Leven.","21":"Kinderen, bewaar uzelf voor de afgoden. Amen."},"SV":{"1":"Een iegelijk, die gelooft, dat Jezus is de Christus, die is uit God geboren; en een iegelijk, die liefheeft Dengene, Die geboren heeft, die heeft ook lief dengene, die uit Hem geboren is.","2":"Hieraan kennen wij, dat wij de kinderen Gods liefhebben, wanneer wij God liefhebben, en Zijn geboden bewaren.","3":"Want dit is de liefde Gods, dat wij Zijn geboden bewaren; en Zijn geboden zijn niet zwaar.","4":"Want al wat uit God geboren is, overwint de wereld; en dit is de overwinning, die de wereld overwint, *namelijk* ons geloof.","5":"Wie is het, die de wereld overwint, dan die gelooft, dat Jezus is de Zoon van God?","6":"Deze is het, Die gekomen is door water en bloed, *namelijk* Jezus, de Christus; niet door het water alleen, maar door het water en het bloed. En de Geest is het, Die getuigt, dat de Geest de waarheid is.","7":"Want Drie zijn er, Die getuigen in den hemel, de Vader, het Woord en de Heilige Geest; en deze Drie zijn Een.","8":"En drie zijn er, die getuigen op de aarde, de Geest, en het water, en het bloed; en die drie zijn tot een.","9":"Indien wij de getuigenis der mensen aannemen, de getuigenis van God is meerder; want dit is de getuigenis van God, welke Hij van Zijn Zoon getuigd heeft.","10":"Die in den Zoon van God gelooft, heeft de getuigenis in zichzelven; die God niet gelooft, heeft Hem tot een leugenaar gemaakt, dewijl hij niet geloofd heeft de getuigenis, die God getuigd heeft van Zijn Zoon.","11":"En dit is de getuigenis, *namelijk* dat ons God het eeuwige leven gegeven heeft; en ditzelve leven is in Zijn Zoon.","12":"Die den Zoon heeft, die heeft het leven; die den Zoon van God niet heeft, die heeft het leven niet.","13":"Deze dingen heb ik u geschreven, die gelooft in den Naam des Zoons van God; opdat gij weet, dat gij het eeuwige leven hebt, en opdat gij gelooft in den Naam des Zoons van God.","14":"En dit is de vrijmoedigheid, die wij tot Hem hebben, dat zo wij iets bidden naar Zijn wil, Hij ons verhoort.","15":"En indien wij weten, dat Hij ons verhoort, wat wij ook bidden, zo weten wij, dat wij de beden verkrijgen, die wij van Hem gebeden hebben.","16":"Indien iemand zijn broeder ziet zondigen een zonde niet tot den dood, die zal *God* bidden en Hij zal hem het leven geven, dengenen, *zeg* *ik*, die zondigen niet tot den dood. Er is een zonde tot den dood; voor dezelve *zonde* zeg ik niet, dat hij zal bidden.","17":"Alle ongerechtigheid is zonde; en er is zonde niet tot den dood.","18":"Wij weten, dat een iegelijk, die uit God geboren is, niet zondigt; maar die uit God geboren is, bewaart zichzelven, en de boze vat hem niet.","19":"Wij weten, dat wij uit God zijn, en dat de gehele wereld ligt in het boze.","20":"Doch wij weten, dat de Zoon van God gekomen is, en heeft ons het verstand gegeven, dat wij den Waarachtige kennen; en wij zijn in den Waarachtige, *namelijk* in Zijn Zoon Jezus Christus. Deze is de waarachtige God, en het eeuwige Leven.","21":"Kinderkens, bewaart uzelven van de afgoden. Amen."},"KJV":{"1":"Whosoever believeth that Jesus is the Christ is born of God: and every one that loveth him that begat loveth him also that is begotten of him.","2":"By this we know that we love the children of God, when we love God, and keep his commandments.","3":"For this is the love of God, that we keep his commandments: and his commandments are not grievous.","4":"For whatsoever is born of God overcometh the world: and this is the victory that overcometh the world, even our faith.","5":"Who is he that overcometh the world, but he that believeth that Jesus is the Son of God?","6":"This is he that came by water and blood, even Jesus Christ; not by water only, but by water and blood. And it is the Spirit that beareth witness, because the Spirit is truth.","7":"For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one.","8":"And there are three that bear witness in earth, the Spirit, and the water, and the blood: and these three agree in one.","9":"If we receive the witness of men, the witness of God is greater: for this is the witness of God which he hath testified of his Son.","10":"He that believeth on the Son of God hath the witness in himself: he that believeth not God hath made him a liar; because he believeth not the record that God gave of his Son.","11":"And this is the record, that God hath given to us eternal life, and this life is in his Son.","12":"He that hath the Son hath life; and he that hath not the Son of God hath not life.","13":"These things have I written unto you that believe on the name of the Son of God; that ye may know that ye have eternal life, and that ye may believe on the name of the Son of God.","14":"And this is the confidence that we have in him, that, if we ask any thing according to his will, he heareth us:","15":"And if we know that he hear us, whatsoever we ask, we know that we have the petitions that we desired of him.","16":"If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death. There is a sin unto death: I do not say that he shall pray for it.","17":"All unrighteousness is sin: and there is a sin not unto death.","18":"We know that whosoever is born of God sinneth not; but he that is begotten of God keepeth himself, and that wicked one toucheth him not.","19":"And we know that we are of God, and the whole world lieth in wickedness.","20":"And we know that the Son of God is come, and hath given us an understanding, that we may know him that is true, and we are in him that is true, even in his Son Jesus Christ. This is the true God, and eternal life.","21":"Little children, keep yourselves from idols. Amen."}},"tsk":{"1":[{"kopje":"gelooft","refs":["1 Joh 2:22","1 Joh 2:23","1 Joh 4:2","1 Joh 4:14","1 Joh 4:15","Matt 16:16","Joh 1:12","Joh 1:13","Joh 6:69","Hand 8:37","Rom 10:9","Rom 10:10"]},{"kopje":"geboren","refs":["1 Joh 5:4","1 Joh 2:29","1 Joh 3:9","1 Joh 4:7"]},{"kopje":"en ieder","refs":["1 Joh 2:10","1 Joh 3:14","1 Joh 3:17","1 Joh 4:20","Joh 15:23","Jak 1:18","1 Petr 1:3","1 Petr 1:22","1 Petr 1:23"]}],"3":[{"kopje":"dit","refs":["Ex 20:6","Deut 5:10","Deut 7:9","Deut 10:12","Deut 10:13","Dan 9:4","Matt 12:47-50","Joh 14:15","Joh 14:21-24","Joh 15:10","Joh 1 lass=\"wl wl-kjv\" data-code=\"G228\">true,</span> even <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G5207\">Son</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ.</span> <span class=\"wl wl-kjv\" data-code=\"G3778\">This</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> the <span class=\"wl wl-kjv\" data-code=\"G228\">true</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G166\">eternal</span> <span class=\"wl wl-kjv\" data-code=\"G2222\">life.</span>","21":"Little <span class=\"wl wl-kjv\" data-code=\"G5040\">children,</span> <span class=\"wl wl-kjv\" data-code=\"G5442\">keep</span> <span class=\"wl wl-kjv\" data-code=\"G1438\">yourselves</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> <span class=\"wl wl-kjv\" data-code=\"G1497\">idols.</span> <span class=\"wl wl-kjv\" data-code=\"G281\">Amen.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"gelooft","tekst":"Namelijk met zodanig een geloof, dat vergezeld is van alles wat tot een oprecht geloof behoort; zie 1Jo 4:2."},{"catchword":"de Christus,","tekst":"Dat is, de ware en beloofde Messias. Zie Joh 20:31."},{"catchword":"Dengene","tekst":"Dat is, den Vader."},{"catchword":"dengene","tekst":"Dat is, zijn kinderen; hetwelk, dewijl het zo is onder de mensen, zo bewijst de apostel daarmee, dat als men God liefheeft men ook al de kinderen Gods moet liefhebben, die uit Hem geboren zijn."}],"2":[{"catchword":"wanneer wij God","tekst":"Want uit de liefde Gods, als een oorsprong en fontein, moet de liefde van den naaste spruiten en voortkomen."}],"3":[{"catchword":"dit is de liefde Gods,","tekst":"Dat is, hiermee betonen wij, dat wij God waarlijk liefhebben."},{"catchword":"niet zwaar","tekst":"Dat is, bezwaarlijk, moeilijk, hetwelk hier niet gezegd wordt om aan te wijzen, dat wij deze geboden hier volkomen kunnen onderhouden. Zie 1Jo 1:8, en 1Jo 2:1; maar ten opzichte van de wedergeborenen, in welker hart de Heilige Geest de geboden Gods, zo inschrijft, dat Hij meteen in hen een lust verwekt om deze gaarne te doen, Rom 7:22. En hetgeen iemand gaarne doet valt hem niet zwaar of moeilijk. Zie Mat 11:30."}],"4":[{"catchword":"overwint de wereld;","tekst":"Dat is, in den geestelijken strijd tussen den Geest der wedergeboorte en de wereldse begeerlijkheden en aanlokkingen, waardoor wij tot afwijking van het geloof en overtreding der geboden Gods worden verzocht, houdt het de overHand."},{"catchword":"de overwinning,","tekst":"Dat is, de oorzaak van onze overwinning, omdat het Christus omhelst, door wien wij alles vermogen; Phi 4:13."},{"catchword":"ons geloof","tekst":"Namelijk dat vergezeld is van al wat tot een waar geloof vereist wordt; want zulk een geloof kan niet bestaan zonder onderhouding van de geboden der liefde tot God en den naaste."}],"6":[{"catchword":"door water en bloed,","tekst":"De apostel ziet hier op het water en bloed dat uit de doorstoken zijde van Christus gevloeid is, waarvan Johannes alleen gewag maakt, Joh 19:34-35; en verhaalt dat weder hier, om te tonen dat daarin een verborgenheid is, namelijk dat van Hem vloeit het water van den Heiligen Geest, waardoor wij gereinigd en wedergeboren worden, en dat door het uitstorten van Zijn bloed aan het kruis ons is verworven de verzoening met God en de vergeving onzer zonden. En daardoor is vervuld hetgeen afgebeeld was door de plechtigheden van het Oude Testament, die meest bestonden in reinigingen met water en bloedstorting der beesten die geofferd werden, zodat dit de zin is: dewijl Christus, gekomen zijnde, al wat door de ceremoniën van het Oude Testament afgebeeld was, inderdaad vervuld heeft, dit dan een klaar bewijs is, dat Hij de ware Messias is."},{"catchword":"niet door het water","tekst":"Dat is, Hij is gekomen om niet alleen de weldaad der wedergeboorte of der reiniging onzer verdorven natuur, maar ook de weldaad der rechtvaardigmaking of verzoening met God tezamen teweeg te brengen, door Zijn Geest en bloed, welke twee weldaden van elkander niet worden gescheiden."},{"catchword":"de Geest is het,","tekst":"Dat is, de Heilige Geest getuigt in de harten der gelovigen; 2Co 1:22; Eph 1:13."},{"catchword":"de Geest de waarheid is","tekst":"Dat is, de leer van het Evangelie dat Jezus is de Christus. Welke leer geest genoemd wordt, 2Co 3:6. Zie de aantekeningen aldaar."}],"7":[{"catchword":"Want","tekst":"Dit vers, daar het een zeer klaar getuigenis bevat van den Heilige Drievuldigheid, schijnt door de Arianen uit enige boeken uitgelaten te zijn, maar wordt in meest alle Griekse boeken gevonden en zelfs ook bij vele oude en aanzienlijke leraars, die voor de tijden der Arianen geleefd hebben, tot bewijs der Heilige Drievuldigheid daaruit bijgebracht, en de tegenstelling van de getuigen op aarde, vs.8, toont klaarlijk dat dit vs, daar wezen moet, gelijk blijkt uit vs.9, waar gesproken wordt van deze getuigenis van God."},{"catchword":"Drie zijn er,","tekst":"Namelijk personen en onderscheiden getuigen."},{"catchword":"in den hemel,","tekst":"Dat is, geven hiervan uit den hemel een hemels en Goddelijk getuigenis, waaraan niet mag getwijfeld worden. Zie Mat 3:16-17, en Mat 17:7; Joh 3:31; Act 2:1, enz."},{"catchword":"het Woord","tekst":"Dat is, de Zoon Gods. Zie Joh 1:1."},{"catchword":"deze Drie zijn","tekst":"Namelijk personen. Zie Mat 3:16-17, en Mat 28:19."},{"catchword":"Een","tekst":"Namelijk van wezen en natuur, die alle drie van deze zaak gezamenlijk en enerlei getuigen. Een zeer klaar bewijs en getuigenis van de drieheid der personen in het enig Goddelijk wezen. Zie Joh 10:30."}],"8":[{"catchword":"drie zijn er,","tekst":"Dat is, drie getuigen zijn er ook op de aarde die hetzelfde getuigen."},{"catchword":"de Geest,","tekst":"Dat is, de Geest der aanneming tot kinderen, die den gelovigen in de gemeente hier op aarde gegeven wordt, en het water der wedergeboorte, waardoor de gelovigen van hun gemeenschap met den Vader en den Zoon verzekerd worden, en het bloed des Nieuwen Testaments, waardoor zij verkrijgen vergeving hunner zonden en de verzoening met God. Anderen verstaan door den Geest de leer van het Evangelie, en door het water het sacrament van den doop, en door het bloed, het sacrament van het avondmaal, door welke drie middelen de gelovigen in de Kerk hier op aarde van de vergeving hunner zonden door Christus, en van het eeuwige leven, als door drie vaste getuigen, verzekerd worden. Zie ook de aantekeningen op vs.6."},{"catchword":"tot een","tekst":"Dat is, zien op enerlei zaak en geven daarvan enerlei getuigenis, namelijk dat Jezus is de Zaligmaker en de Zoon Gods, vs.5."}],"9":[{"catchword":"meerder;","tekst":"Dat is, geloofwaardiger, en moet daarom ook vaster aangenomen worden."},{"catchword":"van Zijn Zoon getuigd","tekst":"Namelijk Jezus Christus, dat Hij de ware en enige Zaligmaker is."}],"10":[{"catchword":"heeft de getuigenis","tekst":"Dat is, door den Heiligen Geest, die het geloof in hem gewrocht heeft, in zijn hart hiervan overtuigt en verzekert; Joh 3:33."},{"catchword":"heeft Hem tot een","tekst":"Zie 1Jo 1:10."}],"11":[{"catchword":"de getuigenis,","tekst":"Namelijk waarvan ik spreekt."},{"catchword":"ons God het","tekst":"Namelijk die in Christus waarlijk geloven; Joh 3:36."},{"catchword":"is in Zijn Zoon","tekst":"Namelijk als in een fontein uit wiens volheid wij het ontvangen, Joh 1:16. Want de Zoon heeft ons het leven verdiend, heeft de macht om het ons te geven, en geeft het ook allen die in Hem geloven. Zie Joh 6:47-48, Joh 6:51, en Joh 17:2."}],"12":[{"catchword":"heeft, die heeft","tekst":"Dat is, met waar geloof heeft aangenomen, Joh 1:12, die heeft de beginselen van het eeuwige leven reeds in dit leven, en heeft een zekere hoop dat hij het ook hiernamaals volkomen zal bezitten. Zie Joh 5:24, en Joh 8:51."}],"13":[{"catchword":"gelooft in den Naam","tekst":"Dat is, in het geloof meer en meer moogt toenemen en daarin volharden."}],"14":[{"catchword":"de vrijmoedigheid,","tekst":"Dat is, vrijmoedig vertrouwen, gelijk Heb 4:16; 1Jo 2:28, en 1Jo 3:21."},{"catchword":"tot Hem hebben,","tekst":"Namelijk God, gelijk Hij spreekt 1Jo 3:21."},{"catchword":"verhoort","tekst":"Grieks hoort."}],"15":[{"catchword":"wat wij ook bidden,","tekst":"Namelijk naar Zijn wil, gelijk vs.14."},{"catchword":"de beden","tekst":"Dat is, de zaken die wij bidden."},{"catchword":"verkrijgen,","tekst":"Grieks hebben; dat is, zeker zullen hebben."}],"16":[{"catchword":"zijn broeder ziet","tekst":"Dat is, zijn mede-christen ."},{"catchword":"een zonde niet","tekst":"Dat is, een zonde waarop de eeuwige dood niet zeker volgt; dat is die niet onvergeeflijk is."},{"catchword":"bidden en","tekst":"Namelijk voor zijn broeder, dat God hem deze zonde wil vergeven."},{"catchword":"Hij zal hem","tekst":"Namelijk God zal hem zijn zonden vergeven en zo het leven geven; of hij, namelijk die God voor de zonde van zijn broeder bidt, zal met zijn gebed hetzelve bij God teweeg brengen. Zie 1Ti 5:16; Jam 5:20."},{"catchword":"het leven geven,","tekst":"Dat is, van den dood, dien hij door zijn zonde verdiend had, verlossen."},{"catchword":"een zonde tot den dood;","tekst":"Dat is, die zekerlijk den dood met zich brengt, welke is de lastering tegen den Heiligen Geest, wanneer iemand de waarheid der christelijke leer, waarvan hij door den Heiligen Geest is verlicht en overtuigd, loochent en deze vijandig lastert en vervolgt. Zie de aantekeningen Mat 12:31."},{"catchword":"dat hij zal bidden","tekst":"Namelijk daar God zodanigen zondaren de zonden niet wil vergeven, maar geeft hen over in hun onboetvaardigheid tot het einde toe, doordien zij het middel tot de boetvaardigheid, hetwelk Christus' offerande is, en de overtuiging van den Heiligen Geest verwerpen en tegenstaan."}],"17":[{"catchword" (function bouwHfdnav() {

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
