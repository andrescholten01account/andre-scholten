n Jahaziël, en Johanan, en Jozabad, de Gederathiet;","5":"Eluzai, en Jerimoth, en Bealja, en Semarja, en Sefatja, de Harufiet;","6":"Elkana, en Jissia, en Azareël, en Joëzer, en Jasobam, de Korahieten;","7":"En Joëla en Zebadja, de zonen van Jeroham, uit Gedor.","8":"Ook scheidden zich van de Gadieten af naar David, in die vesting bij de woestijn, kloeke helden, krijgslieden voor de oorlog, toegerust met rond schild en lang schild; en hun gezichten waren als de gezichten van leeuwen, en zij waren zo snel als de reeën op de bergen.","9":"Ezer was het hoofd; Obadja de tweede; Eliab de derde;","10":"Mismanna de vierde; Jirmeja de vijfde;","11":"Attai de zesde; Eliël de zevende;","12":"Johanan de achtste; Elzabad de negende;","13":"Jirmeja de tiende; Machbannai de elfde.","14":"Dezen waren van de kinderen van Gad, aanvoerders van het leger; een van de kleinsten was over honderd, en de grootste over duizend.","15":"Dezelfde mannen zijn het die over de Jordaan gingen in de eerste maand, toen die vol was tot aan al haar oevers; en zij verdreven alle inwoners van de laagten, naar het oosten en naar het westen.","16":"Er kwamen ook van de kinderen van Benjamin en Juda naar de vesting bij David.","17":"En David ging hun tegemoet, en antwoordde en zei tegen hen: Als u in vrede tot mij gekomen bent om mij te helpen, dan zal mijn hart met u verbonden zijn; maar als het is om mij bedrieglijk over te leveren aan mijn vijanden, terwijl er toch geen onrecht in mijn handen is, dan zie de God van onze vaderen het en straffe het!","18":"En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.","19":"Er vielen ook van Manasse tot David, toen hij met de Filistijnen kwam om tegen Saul te strijden, hoewel zij hen niet hielpen; want de vorsten van de Filistijnen stuurden hem na overleg weg, en zeiden: Met gevaar voor onze hoofden zou hij naar Saul, zijn heer, overlopen.","20":"Toen hij naar Ziklag ging, vielen tot hem uit Manasse: Adnah, en Jozabad, en Jediaël, en Michaël, en Jozabad, en Elihu, en Zillethai; aanvoerders van de duizenden die in Manasse waren.","21":"En dezen hielpen David mee tegen die benden; want zij waren allen kloeke helden, en zij waren aanvoerders in het leger.","22":"Want er kwamen er in die tijd dag bij dag bij David om hem te helpen, tot er een groot leger was, als een leger van God.","23":"En dit zijn de aantallen van de aanvoerders van hen die toegerust waren voor het leger, die naar David te Hebron kwamen om het koninkrijk van Saul aan hem over te dragen, naar het woord van de HEERE:","24":"Van de kinderen van Juda, die rond schild en speer droegen, waren zesduizend achthonderd toegerust voor het leger;","25":"Van de kinderen van Simeon, kloeke helden voor het leger, zevenduizend honderd;","26":"Van de kinderen van Levi, vierduizend zeshonderd;","27":"En Jehojada was aanvoerder van de Aäronieten; en met hem waren er drieduizend zevenhonderd.","28":"En Zadok was een jongeman, een kloeke held; en uit zijn vaders huis waren tweeëntwintig leiders;","29":"En van de kinderen van Benjamin, de broers van Saul, drieduizend; want tot dan toe hielden de meesten van hen het nog met het huis van Saul;","30":"En van de kinderen van Efraïm, twintigduizend achthonderd, kloeke helden, mannen van naam in het huis van hun vaderen;","31":"En van de halve stam van Manasse achttienduizend, die met naam waren aangewezen om te komen en David koning te maken;","32":"En van de kinderen van Issaschar, die verstand hadden van de tijden, om te weten wat Israël moest doen; hun hoofden waren tweehonderd, en al hun broeders volgden hun woord;","33":"Uit Zebulon, uitgaand in het leger, toegerust voor de strijd met alle oorlogswapens, vijftigduizend; en in staat een slagorde te houden met een onwankelbaar hart;","34":"En uit Nafthali, duizend aanvoerders, en bij hen met rond schild en speer, zevenendertigduizend.","35":"En uit de Danieten, toegerust voor de strijd, achtentwintigduizend zeshonderd;","36":"En uit Aser, uitgaand in het leger, om krijgsorde te houden, waren veertigduizend;","37":"En van de overkant van de Jordaan, van de Rubenieten, en Gadieten, en de halve stam van Manasse, met allerlei oorlogswapens voor de strijd, honderdtwintigduizend.","38":"Al deze krijgslieden, die zich in slagorde konden houden, kwamen met een volkomen hart naar Hebron om David koning te maken over heel Israël. En ook heel de rest van Israël was één van hart om David tot koning te maken.","39":"En zij waren daar bij David drie dagen lang, etend en drinkend; want hun broeders hadden voor hen iets toebereid.","40":"En ook degenen die dicht bij hen woonden, tot aan Issaschar, en Zebulon, en Nafthali, brachten brood op ezels, en op kamelen, en op muildieren, en op runderen, meel, klompen gedroogde vijgen, en rozijnenkoeken, en wijn, en olie, en runderen, en kleinvee in overvloed; want er was blijdschap in Israël."},"SV":{"1":"Dezen nu zijn het, die tot David kwamen naar Ziklag, toen hij nog besloten was voor het aangezicht van Saul, den zoon van Kis; zij waren ook onder de helden, die tot dien krijg hielpen.","2":"Gewapend met bogen, rechts en links met stenen werpende, en met pijlen schietende uit den boog; zij waren van de broederen van Saul, uit Benjamin.","3":"Het hoofd was Ahiëzer, en Joas, zonen van Semaa, den Gibeathiet; daarna Jeziel en Pelet, zonen van Azmaveth, en Beracha, en Jehu, de Anathothiet.","4":"En Jismaja, de Gibeoniet, was een held onder de dertig, en over dertig *gesteld*; en Jirmeja, en Jahaziel, en Johanan, en Jozabad, de Gederathiet;","5":"Eluzai, en Jerimoth, en Bealja, en Semarja, en Sefatja, de Harufiet;","6":"Elkana, en Jissia, en Azareël, en Joezer, en Jasobam, de Korahieten;","7":"En Joëla en Zebadja, de zonen van Jeroham, van Gedor.","8":"Ook scheidden zich van de Gadieten af tot David, in die vesting naar de woestijn, kloeke helden, krijgslieden ten oorlog, toegerust met rondas en schild; en hun aangezichten waren aangezichten der leeuwen; en zij waren als de reeën op de bergen in snelheid.","9":"Ezer was het hoofd; Obadja de tweede; Eliab de derde;","10":"Mismanna de vierde; Jirmeja de vijfde;","11":"Attai de zesde; Eliël de zevende;","12":"Johanan de achtste; Elzabad de negende;","13":"Jormeja de tiende; Machbannai de elfde.","14":"Dezen waren van de kinderen van Gad, hoofden des heirs; een van de kleinsten was over honderd, en de grootste over duizend.","15":"Deze zelfden zijn het, die over de Jordaan gingen in de eerste maand, toen dezelve vol was aan al haar oevers; en zij verdreven al *de* *inwoners* der laagten, tegen het oosten en tegen het westen.","16":"Er kwamen ook van de kinderen van Benjamin en Juda op de vesting tot David.","17":"En David ging uit hun tegemoet, en antwoordde, en zeide tot hen: Indien gijlieden ten vrede tot mij gekomen zijt, om mij te helpen, zo zal mijn hart tegelijk over ulieden zijn; maar indien het is, om mij aan mijn vijanden bedriegelijk over te leveren, daar toch geen wrevel in mijn handen is, de God onzer vaderen zie het, en straffe het!","18":"En de Geest toog Amasai aan, den overste der hoofdlieden, *en* *hij* *zeide*: Wij zijn uw, o David, en met u zijn wij, gij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helperen; want uw God helpt u. Toen nam David hen aan, en stelde hen tot hoofden der benden.","19":"Er vielen ook van Manasse tot David, toen hij met de Filistijnen kwam, om tegen Saul te strijden, alhoewel zij hen niet hielpen; want de vorsten der Filistijnen verlieten hem met raad, zeggende: Met *gevaar* *van* onze hoofden zou hij tot Saul, zijn heer, vallen.","20":"Toen hij naar Ziklag toog, vielen tot hem uit Manasse: Adnah, en Jozabad, en Jediael, en Michaël, en Jozabad, en Elihu, en Zillethai; hoofden der duizenden, die in Manasse waren.","21":"En dezen hielpen David mede tegen die benden; want alle dezen waren kloeke helden; en zij waren oversten in het heir.","22":"Want er kwamen er te *dier* tijd dag bij dag tot David, om hem te helpen, tot een groot leger toe, als een leger Gods.","23":"En dit zijn de getallen der hoofden dergenen, die toegerust waren ten heire, die tot David te Hebron kwamen, om het koninkrijk van Saul tot hem te wenden, naar den mond des HEEREN:","24":"Van de kinderen van Juda, die rondassen en spiesen droegen, waren zes duizend en achthonderd toegerust ten heire;","25":"Van de kinderen van Simeon, kloeke helden ten heire, zeven duizend en honderd;","26":"Van de kinderen van Levi, vier duizend en zeshonderd;","27":"En Jehojada was overste der Aäronieten; en met hem waren er drie duizend en zevenhonderd.","28":"En Zadok was een jongeling, een kloek held; en uit zijns vaders huis waren twee en twintig oversten;","29":"En van de kinderen van Benjamin, de broederen van Saul, drie duizend; want tot nog toe waren er velen van hen, die het met het huis van Saul hielden;","30":"En van de kinderen van Efraïm, twintig duizend en achthonderd, kloeke helden, mannen van naam in het huis hunner vaderen;","31":"En van den halven stam van Manasse achttien duizend, die met namen uitgedrukt zijn, dat zij kwamen, om David koning te maken;","32":"En van de kinderen van Issaschar, die ervaren waren in het verstand van de tijden, om te weten wat Israël doen moest; hun hoofden waren tweehonderd, en alle hun broeders *pasten* op hun woord;","33":"Uit Zebulon, uitgaande in het heir, toegerust ten strijde met alle krijgswapenen, vijftig duizend; en om een slagorde te houden met een onwankelbaar hart;","34":"En uit Nafthali, duizend oversten, en bij hen met rondas en spies, zeven en dertig duizend.","35":"En uit de Danieten, ten strijde toegerust, acht en twintig duizend en zeshonderd;","36":"En uit Aser, uitgaande in het heir, om krijgsorde te houden, waren veertig duizend;","37":"En van gene zijde van de Jordaan, van de Rubenieten, en Gadieten, en den halven stam van Manasse, met allerlei krijgsgereedschap ten oorlog, honderd en twintigduizend.","38":"Al deze krijgslieden, die zich in slagorde konden houden, kwamen met een volkomen hart te Hebron, om David koning te maken over gans Israël. En ook was al het overige van Israël een hart, om David tot koning te maken.","39":"En zij waren daar bij David drie dagen lang, etende en drinkende; want hun broeders hadden voor hen *wat* toebereid.","40":"En ook de naasten aan hen, tot aan Issaschar, en Zebulon, en Nafthali, brachten brood op ezelen, en op kemelen, en op muildieren, en op runderen, meelspijs, stukken vijgen, en stukken rozijnen, en wijn, en olie, en runderen, en klein vee in menigte; want er was blijdschap in Israël."},"KJV":{"1":"Now these are they that came to David to Ziklag, while he yet kept himself close because of Saul the son of Kish: and they were among the mighty men, helpers of the war.","2":"They were armed with bows, and could use both the right hand and the left in hurling stones and shooting arrows out of a bow, even of Saul's brethren of Benjamin.","3":"The chief was Ahiezer, then Joash, the sons of Shemaah the Gibeathite; and Jeziel, and Pelet, the sons of Azmaveth; and Berachah, and Jehu the Antothite,","4":"And Ismaiah the Gibeonite, a mighty man among the thirty, and over the thirty; and Jeremiah, and Jahaziel, and Johanan, and Josabad the Gederathite,","5":"Eluzai, and Jerimoth, and Bealiah, and Shemariah, and Shephatiah the Haruphite,","6":"Elkanah, and Jesiah, and Azareel, and Joezer, and Jashobeam, the Korhites,","7":"And Joelah, and Zebadiah, the sons of Jeroham of Gedor.","8":"And of the Gadites there separated themselves unto David into the hold to the wilderness men of might, and men of war fit for the battle, that could handle shield and buckler, whose faces were like the faces of lions, and were as swift as the roes upon the mountains;","9":"Ezer the first, Obadiah the second, Eliab the third,","10":"Mishmannah the fourth, Jeremiah the fifth,","11":"Attai the sixth, Eliel the seventh,","12":"Johanan the eighth, Elzabad the ninth,","13":"Jeremiah the tenth, Machbanai the eleventh.","14":"These were of the sons of Gad, captains of the host: one of the least was over an hundred, and the greatest over a thousand.","15":"These are they that went over Jordan in the first month, when it had overflown all his banks; and they put to flight all them of the valleys, both toward the east, and toward the west.","16":"And there came of the children of Benjamin and Judah to the hold unto David.","17":"And David went out to meet them, and answered and said unto them, If ye be come peaceably unto me to help me, mine heart shall be knit unto you: but if ye be come to betray me to mine enemies, seeing there is no wrong in mine hands, the God of our fathers look thereon, and rebuke it.","18":"Then the spirit came upon Amasai, who was chief of the captains, and he said, Thine are we, David, and on thy side, thou son of Jesse: peace, peace be unto thee, and peace be to thine helpers; for thy God helpeth thee. Then David received them, and made them captains of the band.","19":"And there fell some of Manasseh to David, when he came with the Philistines against Saul to battle: but they helped them not: for the lords of the Philistines upon advisement sent him away, saying, He will fall to his master Saul to the jeopardy of our heads.","20":"As he went to Ziklag, there fell to him of Manasseh, Adnah, and Jozabad, and Jediael, and Michael, and Jozabad, and Elihu, and Zilthai, captains of the thousands that were of Manasseh.","21":"And they helped David against the band of the rovers: for they were all mighty men of valour, and were captains in the host.","22":"For at that time day by day there came to David to help him, until it was a great host, like the host of God.","23":"And these are the numbers of the bands that were ready armed to the war, and came to David to Hebron, to turn the kingdom of Saul to him, according to the word of the LORD.","24":"The children of Judah that bare shield and spear were six thousand and eight hundred, ready armed to the war.","25":"Of the children of Simeon, mighty men of valour for the war, seven thousand and one hundred.","26":"Of the children of Levi four thousand and six hundred.","27":"And Jehoiada was the leader of the Aaronites, and with him were three thousand and seven hundred;","28":"And Zadok, a young man mighty of valour, and of his father's house twenty and two captains.","29":"And of the children of Benjamin, the kindred of Saul, three thousand: for hitherto the greatest part of them had kept the ward of the house of Saul.","30":"And of the children of Ephraim twenty thousand and eight hundred, mighty men of valour, famous throughout the house of their fathers.","31":"And of the half tribe of Manasseh eighteen thousand, which were expressed by name, to come and make David king.","32":"And of the children of Issachar, which were men that had understanding of the times, to know what Israel ought to do; the heads of them were two hundred; and all their brethren were at their commandment.","33":"Of Zebulun, such as went forth to battle, expert in war, with all instruments of war, fifty thousand, which could keep rank: they were not of double heart.","34":"And of Naphtali a thousand captains, and with them with shield and spear thirty and seven thousand.","35":"And of the Danites expert in war twenty and eight thousand and six hundred.","36":"And of Asher, such as went forth to battle, expert in war, forty thousand.","37":"And on the other side of Jordan, of the Reubenites, and the Gadites, and of the half tribe of Manasseh, with all manner of instruments of war for the battle, an hundred and twenty thousand.","38":"All these men of war, that could keep rank, came with a perfect heart to Hebron, to make David king over all Israel: and all the rest also of Israel were of one heart to make David king.","39":"And there they were with David three days, eating and drinking: for their brethren had prepared for them.","40":"Moreover they that were nigh them, even unto Issachar and Zebulun and Naphtali, brought bread on asses, and on camels, and on mules, and on oxen, and meat, meal, cakes of figs, and bunches of raisins, and wine, and oil, and oxen, and sheep abundantly: for there was joy in Israel."}},"tsk":{"1":[{"kopje":"dit zijn","refs":["1 Sam 27:2","1 Sam 27:6","2 Sam 1:1","2 Sam 4:10"]},{"kopje":"toen hij zich nog","refs":["Deut 32:32","1 Kon 14:10","1 Kon 21:21","2 Kon 9:8","2 Kon 14:26"]},{"kopje":"Saul","refs":["1 Kron 8:33","1 Kron 9:39"]},{"kopje":"de helden","refs":["1 Kron 11:10","1 Kron 11:19","1 Kron 11:24","1 Kron 11:25"]}],"2":[{"kopje":"gewapend","refs":["Richt 3:15","Richt 20:16"]},{"kopje":"werpend","refs":["1 Sam 17:49"]}],"3":[{"kopje":"Gibeathiet","refs":["1 Sam 11:4","2 Sam 21:6"]},{"kopje":"Azmaveth","refs":["1 Kron 11:33"]},{"kopje":"de Anathothiet","refs":["1 Kron 11:28"]}],"4":[{"kopje":"Gibeoniet","refs":["Joz 9:3","Joz 9:17-23"]},{"kopje":"een held","refs":["1 Kron 11:15"]},{"kopje":"Gederathiet","refs":["Joz 15:36"]}],"7":[{"kopje":"Gedor","refs":["1 Kron 4:18","1 Kron 4:39","Joz 15:58"]}],"8":[{"kopje":"in die vesting bij de woestijn","refs":["1 Kron 12:16","1 Kron 11:16","1 Sam 23:14","1 Sam 24:1","1 Sam 24:23"]},{"kopje":"toegerust","refs":["2 Kron 25:5","Jer 46:9"]},{"kopje":"hun gezichten","refs":["1 Kron 11:22","2 Sam 1:23","2 Sam 17:10","2 Sam 23:20","Spr 28:1"]},{"kopje":"zo snel als de reeën op de bergen","refs":["2 Sam 2:18","Spr 6:5","Hoogl 8:14"]}],"14":[{"kopje":"een van de kleinsten was over honderd, en de grootste over duizend","refs":["Lev 26:8","Deut 32:30"]}],"15":[{"kopje":"vol was","refs":["Joz 3:15","Joz 4:18","Jer 12:5","Jer 49:19"]}],"16":[{"kopje":"de kinderen","refs":["1 Kron 12:2"]},{"kopje":"de vesting","refs":["1 Kron 12:8"]}],"17":[{"kopje":"Als u in vrede tot mij gekomen bent","refs":["1 Sam 16:4","2 Sam 3:20-25","1 Kon 2:13","2 Kon 9:22","Ps 12:2","Ps 12:3"]}   // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
