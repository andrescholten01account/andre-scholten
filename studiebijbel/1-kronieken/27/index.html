{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Dit nu zijn de kinderen van Israël naar hun getal, de hoofden van de families, en de aanvoerders van de duizenden en van de honderden, met hun opzichters, die de koning dienden in alle zaken van de verdelingen, aankomend en weggaand van maand tot maand, in al de maanden van het jaar; elke verdeling was vierentwintigduizend man.","2":"Over de eerste verdeling, in de eerste maand, was Jasobam, de zoon van Zabdiël; en in zijn verdeling waren er vierentwintigduizend.","3":"Hij was uit de kinderen van Perez, het hoofd van alle aanvoerders van de legers in de eerste maand.","4":"En over de verdeling in de tweede maand was Dodai, de Ahohiet, en over zijn verdeling was Mikloth ook voorganger; in zijn verdeling waren er ook vierentwintigduizend.","5":"De derde aanvoerder van het leger, in de derde maand, was Benaja, de zoon van Jojada, de opperpriester; die was het hoofd; in zijn verdeling waren er ook vierentwintigduizend.","6":"Deze Benaja was een held van de dertig, en stond boven de dertig; en over zijn verdeling was Ammizabad, zijn zoon.","7":"De vierde, in de vierde maand, was Asaël, de broer van Joab, en na hem Zebadja, zijn zoon; in zijn verdeling waren er ook vierentwintigduizend.","8":"De vijfde, in de vijfde maand, was Samhuth, de Jizrahiet, de aanvoerder; in zijn verdeling waren er ook vierentwintigduizend.","9":"De zesde, in de zesde maand, was Ira, de zoon van Ikkes, de Thekoïet; in zijn verdeling waren er ook vierentwintigduizend.","10":"De zevende, in de zevende maand, was Helez, de Peloniet, uit de kinderen van Efraïm; in zijn verdeling waren er ook vierentwintigduizend.","11":"De achtste, in de achtste maand, was Sibbechai, de Husathiet, van de Zerahieten; in zijn verdeling waren er ook vierentwintigduizend.","12":"De negende, in de negende maand, was Abiëzer, de Anathothiet, van de Benjaminieten; in zijn verdeling waren er ook vierentwintigduizend.","13":"De tiende, in de tiende maand, was Maharai, de Netofathiet, van de Zerahieten; in zijn verdeling waren er ook vierentwintigduizend.","14":"De elfde, in de elfde maand, was Benaja, de Pirhathoniet, van de kinderen van Efraïm; in zijn verdeling waren er ook vierentwintigduizend.","15":"De twaalfde, in de twaalfde maand, was Heldai, de Netofathiet, van Othniël; in zijn verdeling waren er ook vierentwintigduizend.","16":"En over de stammen van Israël waren dezen: over de Rubenieten was Eliëzer, de zoon van Zichri, voorganger; over de Simeonieten was Sefatja, de zoon van Maächa;","17":"Over de Levieten was Hasabja, de zoon van Kemuël; over de Aäronieten was Zadok;","18":"Over Juda was Elihu, uit de broers van David; over Issaschar was Omri, de zoon van Michaël;","19":"Over Zebulon was Jismaja, de zoon van Obadja; over Naftali was Jerimoth, de zoon van Azriël;","20":"Over de kinderen van Efraïm was Hosea, de zoon van Azazja; over de halve stam van Manasse was Joël, de zoon van Pedaja;","21":"Over half Manasse, in Gilead, was Jiddo, de zoon van Zecharja; over Benjamin was Jaäsiël, de zoon van Abner;","22":"Over Dan was Azarel, de zoon van Jeroham. Dezen waren de aanvoerders van de stammen van Israël.","23":"Maar David nam het getal niet op van hen die twintig jaar oud en daar beneden waren; omdat de HEERE gezegd had dat Hij Israël vermenigvuldigen zou als de sterren van de hemel.","24":"Joab, de zoon van Zeruja, had begonnen te tellen, maar hij maakte het niet af, omdat er vanwege deze telling grote toorn over Israël gekomen was; daarom is het getal niet opgenomen in de rekening van de kronieken van koning David.","25":"En over de schatten van de koning was Azmaveth, de zoon van Adiël; en over de schatten op het land, in de steden, en in de dorpen, en in de torens, was Jonathan, de zoon van Uzzia.","26":"En over hen die het akkerwerk deden, in de landbouw, was Ezri, de zoon van Chelub.","27":"En over de wijngaarden was Simeï, de Ramathiet; maar over wat van de wijnstokken kwam, tot de voorraden wijn, was Zabdi, de Sifmiet.","28":"En over de olijfgaarden en de wilde vijgenbomen die in de laagte waren, was Baäl-Hanan, de Gederiet; maar Joas was over de voorraden olie.","29":"En over de runderen die in Saron weidden, was Sitrai, de Saroniet; maar over de runderen in de laagten was Safat, de zoon van Adlai.","30":"En over de kamelen was Obil, de Ismaëliet; en over de ezelinnen was Jechdeja, de Meronothiet.","31":"En over het kleine vee was Jaziz, de Hageriet. Al dezen waren opzichters over het bezit dat koning David had.","32":"En Jonathan, de oom van David, was raadsman, een verstandig man; hij was ook schrijver; Jehiël nu, de zoon van Hachmoni, was bij de zonen van de koning.","33":"En Achitofel was raadsman van de koning; en Husai, de Archiet, was de vriend van de koning.","34":"En na Achitofel was Jojada, de zoon van Benaja, en Abjathar; maar Joab was de legeraanvoerder van de koning."},"SV":{"1":"Dit nu zijn de kinderen Israëls naar hun getal, de hoofden der vaderen, en de oversten der duizenden en der honderden, met hun ambtlieden, den koning dienende in alle zaken der verdelingen, aangaande en afgaande van maand tot maand in al de maanden des jaars; elke verdeling was vier en twintig duizend.","2":"Over de eerste verdeling in de eerste maand was Jasobam, de zoon van Zabdiël; en in zijn verdeling waren er vier en twintig duizend.","3":"Hij was uit de kinderen van Perez, het hoofd van al de oversten der heiren in de eerste maand.","4":"En over de verdeling in de tweede maand was Dodai, de Ahohiet, en *over* zijn verdeling was Mikloth ook voorganger; in zijn verdeling waren er ook vier en twintig duizend.","5":"De derde overste des heirs in de derde maand was Benaja, de zoon van Jojada, den opperambtman; die was het hoofd; in zijn verdeling waren er ook vier en twintig duizend.","6":"Deze Benaja was een held van de dertig, en over de dertig; en *over* zijn verdeling was Ammizabad, zijn zoon.","7":"De vierde, in de vierde maand, was Asahel, de broeder van Joab, en na hem Zebadja, zijn zoon; in zijn verdeling waren er ook vier en twintig duizend.","8":"De vijfde, in de vijfde maand, was Samhuth, de Jizrahiet, de overste; in zijn verdeling waren er ook vier en twintig duizend.","9":"De zesde, in de zesde maand, was Ira, de zoon van Ikkes, de Thekoiet; in zijn verdeling waren er ook vier en twintig duizend.","10":"De zevende, in de zevende maand, was Helez, de Peloniet, uit de kinderen van Efraïm; in zijn verdeling waren er ook vier en twintig duizend.","11":"De achtste, in de achtste maand, was Sibbechai, de Husathiet, van de Zerahieten; in zijn verdeling waren er ook vier en twintig duizend.","12":"De negende, in de negende maand, was Abiezer, de Anathothiet; van de Benjaminieten; in zijn verdeling waren er ook vier en twintig duizend.","13":"De tiende, in de tiende maand, was Maharai, de Nethofathiet, van de Zerahieten; in zijn verdeling waren er ook vier en twintig duizend.","14":"De elfde, in de elfde maand, was Benaja, de Pirhathoniet, van de kinderen van Efraïm; in zijn verdeling waren er ook vier en twintig duizend.","15":"De twaalfde, in de twaalfde maand, was Heldai, de Nethofathiet, van Othniël; in zijn verdeling waren er ook vier en twintig duizend.","16":"Doch over de stammen van Israël waren *dezen*: over de Rubenieten was Eliëzer, de zoon van Zichri, voorganger; over de Simeonieten was Sefatja, de zoon van Maacha;","17":"Over de Levieten was Hasabja, de zoon van Kemuël; over de Aäronieten was Zadok;","18":"Over Juda was Elihu, uit de broederen van David; over Issaschar was Omri, de zoon van Michaël;","19":"Over Zebulon was Jismaja, de zoon van Obadja; over Nafthali was Jerimoth, de zoon van Azriël;","20":"Over de kinderen van Efraïm was Hosea, de zoon van Azazja; over den halven stam van Manasse was Joël, de zoon van Pedaja;","21":"Over half Manasse, in Gilead, was Jiddo, de zoon van Zecharja; over Benjamin was Jaasiel, de zoon van Abner;","22":"Over Dan was Azarel, de zoon van Jeroham. Dezen waren de oversten der stammen van Israël.","23":"Maar David nam het getal van die niet op, die twintig jaren oud en daar beneden waren; omdat de HEERE gezegd had, dat Hij Israël vermenigvuldigen zou als de sterren des hemels.","24":"Joab, de zoon van Zeruja, had begonnen te tellen, maar hij voleindde het niet, omdat er deshalve een grote toorn over Israël gekomen was; daarom is het getal niet opgebracht in de rekening der kronieken van den koning David.","25":"En over de schatten des konings was Azmaveth, de zoon van Adiël; en over de schatten op het land, in de steden, en in de dorpen, en in de torens, was Jonathan, de zoon van Uzzia.","26":"En over die, die het akkerwerk deden, in de landbouwing, was Ezri, de zoon van Chelub.","27":"En over de wijngaarden was Simeï, de Ramathiet; maar over hetgeen dat van de wijnstokken kwam tot de schatten des wijns, was Zabdi, de Sifmiet.","28":"En over de olijfgaarden en de wilde vijgebomen, die in de laagte waren, was Baäl-hanan, de Gederiet; maar Joas was over de schatten der olie.","29":"En over de runderen, die in Saron weidden, was Sitrai, de Saroniet; maar over de runderen in de laagten, was Safat, de zoon van Adlai.","30":"En over de kemelen was Obil, de Ismaëliet; en over de ezelinnen was Jechdeja, de Meronothiet.","31":"En over het kleine vee was Jaziz, de Hageriet. Alle dezen waren oversten over de have, die de koning David had.","32":"En Jonathan, Davids oom, was raad, een verstandig man; hij was ook schrijver; Jehiel nu, de zoon van Hachmoni, was bij de zonen des konings.","33":"En Achitofel was raad des konings; en Husai, de Archiet, was des konings vriend.","34":"En na Achitofel was Jojada, de zoon van Benaja, en Abjathar; maar Joab was des konings krijgsoverste."},"KJV":{"1":"Now the children of Israel after their number, to wit, the chief fathers and captains of thousands and hundreds, and their officers that served the king in any matter of the courses, which came in and went out month by month throughout all the months of the year, of every course were twenty and four thousand.","2":"Over the first course for the first month was Jashobeam the son of Zabdiel: and in his course were twenty and four thousand.","3":"Of the children of Perez was the chief of all the captains of the host for the first month.","4":"And over the course of the second month was Dodai an Ahohite, and of his course was Mikloth also the ruler: in his course likewise were twenty and four thousand.","5":"The third captain of the host for the third month was Benaiah the son of Jehoiada, a chief priest: and in his course were twenty and four thousand.","6":"This is that Benaiah, who was mighty among the thirty, and above the thirty: and in his course was Ammizabad his son.","7":"The fourth captain for the fourth month was Asahel the brother of Joab, and Zebadiah his son after him: and in his course were twenty and four thousand.","8":"The fifth captain for the fifth month was Shamhuth the Izrahite: and in his course were twenty and four thousand.","9":"The sixth captain for the sixth month was Ira the son of Ikkesh the Tekoite: and in his course were twenty and four thousand.","10":"The seventh captain for the seventh month was Helez the Pelonite, of the children of Ephraim: and in his course were twenty and four thousand.","11":"The eighth captain for the eighth month was Sibbecai the Hushathite, of the Zarhites: and in his course were twenty and four thousand.","12":"The ninth captain for the ninth month was Abiezer the Anetothite, of the Benjamites: and in his course were twenty and four thousand.","13":"The tenth captain for the tenth month was Maharai the Netophathite, of the Zarhites: and in his course were twenty and four thousand.","14":"The eleventh captain for the eleventh month was Benaiah the Pirathonite, of the children of Ephraim: and in his course were twenty and four thousand.","15":"The twelfth captain for the twelfth month was Heldai the Netophathite, of Othniel: and in his course were twenty and four thousand.","16":"Furthermore over the tribes of Israel: the ruler of the Reubenites was Eliezer the son of Zichri: of the Simeonites, Shephatiah the son of Maachah:","17":"Of the Levites, Hashabiah the son of Kemuel: of the Aaronites, Zadok:","18":"Of Judah, Elihu, one of the brethren of David: of Issachar, Omri the son of Michael:","19":"Of Zebulun, Ishmaiah the son of Obadiah: of Naphtali, Jerimoth the son of Azriel:","20":"Of the children of Ephraim, Hoshea the son of Azaziah: of the half tribe of Manasseh, Joel the son of Pedaiah:","21":"Of the half tribe of Manasseh in Gilead, Iddo the son of Zechariah: of Benjamin, Jaasiel the son of Abner:","22":"Of Dan, Azareel the son of Jeroham. These were the princes of the tribes of Israel.","23":"But David took not the number of them from twenty years old and under: because the LORD had said he would increase Israel like to the stars of the heavens.","24":"Joab the son of Zeruiah began to number, but he finished not, because there fell wrath for it against Israel; neither was the number put in the account of the chronicles of king David.","25":"And over the king's treasures was Azmaveth the son of Adiel: and over the storehouses in the fields, in the cities, and in the villages, and in the castles, was Jehonathan the son of Uzziah:","26":"And over them that did the work of the field for tillage of the ground was Ezri the son of Chelub:","27":"And over the vineyards was Shimei the Ramathite: over the increase of the vineyards for the wine cellars was Zabdi the Shiphmite:","28":"And over the olive trees and the sycomore trees that were in the low plains was Baalhanan the Gederite: and over the cellars of oil was Joash:","29":"And over the herds that fed in Sharon was Shitrai the Sharonite: and over the herds that were in the valleys was Shaphat the son of Adlai:","30":"Over the camels also was Obil the Ishmaelite: and over the asses was Jehdeiah the Meronothite:","31":"And over the flocks was Jaziz the Hagerite. All these were the rulers of the substance which was king David's.","32":"Also Jonathan David's uncle was a counsellor, a wise man, and a scribe: and Jehiel the son of Hachmoni was with the king's sons:","33":"And Ahithophel was the king's counsellor: and Hushai the Archite was the king's companion:","34":"And after Ahithophel was Jehoiada the son of Benaiah, and Abiathar: and the general of the king's army was Joab."}},"tsk":{"1":[{"kopje":"aanvoerders","refs":["1 Kron 13:1","Ex 18:25","Deut 1:15","1 Sam 8:12","Micha 5:1"]},{"kopje":"dienden","refs":["1 Kron 28:1","2 Kron 17:12-19","2 Kron 26:11-13"]},{"kopje":"alle zaken","refs":["1 Kon 5:14"]},{"kop  23 , 2Sa 24 , enz.; 1Ch 11:26 ."},{"catchword":"en over zijn verdeling","tekst":"Eenigen verstaan dit alzo, dat deze Hammizabad is geweest overste luitenant van zijns vaders regiment, die ook overste was over de Krethi en Plethi, 2Sa 8:18 ."}],"7":[{"catchword":"De vierde,","tekst":"Te weten, overste; en zo in het volgende."},{"catchword":"na hem Zebádja,","tekst":"Te weten, na zijn dood, nadat hij van Abner verslagen was; 2Sa 2:23 ."}],"8":[{"catchword":"Samhuth,","tekst":"Samma genoemd, 2Sa 23:25 , en Sammoth, 1Ch 11:27 ."}],"10":[{"catchword":"de Peloniet,","tekst":"Anders, de Paltiet, 2Sa 23:26 ."}],"11":[{"catchword":"van de Zerahieten;","tekst":"Dezen waren nakomelingen van Zerah, den zoon van Juda; Gen 46:12 ."}],"15":[{"catchword":"Heldaï,","tekst":"Anders, Helad genoemd, 1Ch 11:30 , en Heleb, 2Sa 23:29 ."}],"17":[{"catchword":"over de Aäronieten","tekst":"Hebreeuws, over Aäron; dat is, over het hogepriesterlijke huis, dat in Aärons geslacht moest blijven."}],"18":[{"catchword":"Elihu,","tekst":"Eliab genoemd, 1Sa 16:6 ."}],"20":[{"catchword":"kinderen van Efraïm","tekst":"Dat is, nakomelingen."}],"22":[{"catchword":"Dezen waren","tekst":"Te weten, die straks uitdrukkelijk genoemd zijn. Aser en Gad met hun kolonellen worden in dit register niet genoemd; waarom zij voorbijgegaan of verzwegen zijn, is onzeker."}],"23":[{"catchword":"die twintig jaren oud","tekst":"Hebreeuws, van de zoon van twintig jaar."},{"catchword":"omdat de HEERE gezegd had,","tekst":"Versta dit alzo, dat David dezen niet heeft willen tellen, opdat het niet schijnen zou dat hij twijfelde aan de belofte Gods Abraham gedaan, Gen 22:17 , en Gen 26:4 . Sommigen verstaan dit alzo dat David het getal des volks niet heeft willen opnemen, nadat hij van den Heere gekastijd en bestraft was geweest, omdat hij het volk door Joab deed tellen."}],"24":[{"catchword":"had begonnen te tellen,","tekst":"Te weten, al de Israëlieten, die boven de twintig jaren oud waren, 2Sa 24 ."},{"catchword":"hij voleind h month, was Maharai the Methophathite, of the Zarhites: In his division there were also four and twenty thousand."}],"14":[{"catchword":null,"tekst":"The eleventh, in the eleventh month, was Benaja the Pirhathonite, of the children of Ephraim: in his division there were likewise four and twenty thousand."}],"15":[{"catchword":null,"tekst":"The twelfth, in the twelfth month, was Heldai [Otherwise called Heled, 1 Chron.11.30. and Hebeb, 2 Sam.23.29.] the Netophathite, of Othniel: In his division there were also four and twenty thousand."}],"16":[{"catchword":null,"tekst":"But over the tribes of Israel were (these): Over the Reubenites Eliezer the son of zichri was Leader: over the Simeonites was Sephatja the son of Maacha."}],"17":[{"catchword":null,"tekst":"Over the Levites was Hasabia the son of Kemuel, over the Aaronites [Hebr. over Aaron, that is, over the high Priests house, which ought to continue in Aarons family] was Zadok."}],"18":[{"catchword":null,"tekst":"Over Juda was Elihu, [Called Eliab, 1 Sam.16.6.] (one) of Davids brethren: over Issaschar was Homri the son of Michael."}],"19":[{"catchword":null,"tekst":"Over Zebulon was Ismaja the son of Obadja: over Naphathali was Jerimoth the son of Azriel."}],"20":[{"catchword":null,"tekst":"Over the children [That is, posterity] of Ephraim was Hosea the son of Azazia; over the half tribe of Manasseh was Joel the son of Pedaja."}],"21":[{"catchword":null,"tekst":"Over half Manasseh in Gilead, was Iddo the son Zacharja: over Benjamin was Jaasiel the son of Abner."}],"22":[{"catchword":null,"tekst":"Over Dan was Azarel the son of Jeroham: these [To wit, that were even now expressly named] were the Princes of the tribes of Israel. [Aser and Gad with the Chieftains are not named in this Register, why they are passed by or concealed, is uncertained.]"}],"23":[{"catchword":null,"tekst":"But David took not the number of them that were twenty years old, [Heb. from the son of twenty years] and under; because the LORD had said, that he would multiply Israel as the stars of Heaven. [understand this thus, that David would not number these, that it might not appear that he doubteth of the promise of God made to Abraham, Gen 22:17. and 26.4. Some understand this thus, David would not take the number of the people after the time that he was chastised and punished of God for causing the people to be numbered by Joab.]"}],"24":[{"catchword":null,"tekst":"Joab the son of Zeruja had begun to number, [To wit, all the Israelites that were above twenty years old, 2 Sam.24.] but he finished it not, [for he counted not Benjamin nor Levi, because he did this work of numbering the people grudgingly, and against his will. See 1 Chron.21.6.] because there came great wrath upon Israel for it: [meaning the burning wrath of God; that is, the hot siery pestilence, 2 Sam.24.13.] therefore the number is not brought into the account [Hebr. into the number] of the Chronicle of king David. [to wit, the full number was not brought in; for Joab took not the number of Levi and Benjamin, chap.21.6. Others understand this thus, that David being grieved for what he had done, would not have this to be set down in the public records; but God would have it to be recorded in the books of the holy Scripture.]"}],"25":[{"catchword":null,"tekst":"And over the kings treasures was Azmaveth the son of Adiel. [Understand those treasures that were in the kings house, or within Jerusalem; as Jonathan was over the kings treasures and revenues, that were received and gathered without the said city] and over the treasures in the country, in the cities, and in the towers; [that is, castles, strong holds, fenced houses] was Jonathan the son of Uzzija."}],"26":[{"catchword":null,"tekst":"And over those that did the work of the field in the tillage of the ground, [Understand here those that did the kings husbandry, and tilled his ground] was Ezri the son of Chelub."}],"27":[{"catchword":null,"tekst":"And over the vineyards was Simei the Ramathite: [That is, over the vine-dressers, that were to look to, and dress the kings vineyards. And so was this mans office distinct from Zaddi&acirc;&euro;&trade;s] but over that which came of the vines, for the store-houses of wine, [that is, over the wine-cellars] wos Zadi the Siphmite."}],"28":[{"catchword":null,"tekst":"And over the olive-yards, and the Sycamore-trees that were in the low grounds was BaalHaman the Gederite; but Joas was over the treasures of the oil. [That is, over the oil that was stored up in cellars.]"}],"29":[{"catchword":null,"tekst":"And over the oxen that fed in Saron, [See Cant.2.1.] was Sitrai the Saronite: But over the oxen in the low grounds, was Saphat the son of Adlai."}],"30":[{"catchword":null,"tekst":"And over the camels was Obil the Ismeelite: And over the she-asses was Jechdeja the Meronothite."}],"31":[{"catchword":null,"tekst":"And over the small cattle [As sheep ad goats] was Jaziz the Hagerite: All these were Rulers over the substance that king David had."}],"32":[{"catchword":null,"tekst":"And Jonathan Davids Uncle, [Some think that this Jonathan was Davids Nephew, the son of Samma, Davids brother, of whom we read, Sam.21.22. and so David should have been his Uncle] was counselor, an understanding man, he was also Scribe: [or Secretary] Now Jehiel the son of Hachmoni, was with the kings sons. [to wit, for to instruct and fashion them as their tutor in all good manners and learning.]"}],"33":[{"catchword":null,"tekst":"And Achitophel was the kings Counsellor: And Husai the Archite was the kings friend."}],"34":[{"catchword":null,"tekst":"And after Achitophel was Jojada the son of Benaja, and Abjathar: But Joab was the General of the kings army."}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
