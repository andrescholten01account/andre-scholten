raël naar hun getal, de hoofden van de families, en de aanvoerders van de duizenden en van de honderden, met hun opzichters, die de koning dienden in alle zaken van de verdelingen, aankomend en weggaand van maand tot maand, in al de maanden van het jaar; elke verdeling was vierentwintigduizend man.", "2": "Over de eerste verdeling, in de eerste maand, was Jasobam, de zoon van Zabdiël; en in zijn verdeling waren er vierentwintigduizend.", "3": "Hij was uit de kinderen van Perez, het hoofd van alle aanvoerders van de legers in de eerste maand.", "4": "En over de verdeling in de tweede maand was Dodai, de Ahohiet, en over zijn verdeling was Mikloth ook voorganger; in zijn verdeling waren er ook vierentwintigduizend.", "5": "De derde aanvoerder van het leger, in de derde maand, was Benaja, de zoon van Jojada, de opperpriester; die was het hoofd; in zijn verdeling waren er ook vierentwintigduizend.", "6": "Deze Benaja was een held van de dertig, en stond boven de dertig; en over zijn verdeling was Ammizabad, zijn zoon.", "7": "De vierde, in de vierde maand, was Asaël, de broer van Joab, en na hem Zebadja, zijn zoon; in zijn verdeling waren er ook vierentwintigduizend.", "8": "De vijfde, in de vijfde maand, was Samhuth, de Jizrahiet, de aanvoerder; in zijn verdeling waren er ook vierentwintigduizend.", "9": "De zesde, in de zesde maand, was Ira, de zoon van Ikkes, de Thekoïet; in zijn verdeling waren er ook vierentwintigduizend.", "10": "De zevende, in de zevende maand, was Helez, de Peloniet, uit de kinderen van Efraïm; in zijn verdeling waren er ook vierentwintigduizend.", "11": "De achtste, in de achtste maand, was Sibbechai, de Husathiet, van de Zerahieten; in zijn verdeling waren er ook vierentwintigduizend.", "12": "De negende, in de negende maand, was Abiëzer, de Anathothiet, van de Benjaminieten; in zijn verdeling waren er ook vierentwintigduizend.", "13": "De tiende, in de tiende maand, was Maharai, de Netofathiet, van de Zerahieten; in zijn verdeling waren er ook vierentwintigduizend.", "14": "De elfde, in de elfde maand, was Benaja, de Pirhathoniet, van de kinderen van Efraïm; in zijn verdeling waren er ook vierentwintigduizend.", "15": "De twaalfde, in de twaalfde maand, was Heldai, de Netofathiet, van Othniël; in zijn verdeling waren er ook vierentwintigduizend.", "16": "En over de stammen van Israël waren dezen: over de Rubenieten was Eliëzer, de zoon van Zichri, voorganger; over de Simeonieten was Sefatja, de zoon van Maächa;", "17": "Over de Levieten was Hasabja, de zoon van Kemuël; over de Aäronieten was Zadok;", "18": "Over Juda was Elihu, uit de broers van David; over Issaschar was Omri, de zoon van Michaël;", "19": "Over Zebulon was Jismaja, de zoon van Obadja; over Naftali was Jerimoth, de zoon van Azriël;", "20": "Over de kinderen van Efraïm was Hosea, de zoon van Azazja; over de halve stam van Manasse was Joël, de zoon van Pedaja;", "21": "Over half Manasse, in Gilead, was Jiddo, de zoon van Zecharja; over Benjamin was Jaäsiël, de zoon van Abner;", "22": "Over Dan was Azarel, de zoon van Jeroham. Dezen waren de aanvoerders van de stammen van Israël.", "23": "Maar David nam het getal niet op van hen die twintig jaar oud en daar beneden waren; omdat de HEERE gezegd had dat Hij Israël vermenigvuldigen zou als de sterren van de hemel.", "24": "Joab, de zoon van Zeruja, had begonnen te tellen, maar hij maakte het niet af, omdat er vanwege deze telling grote toorn over Israël gekomen was; daarom is het getal niet opgenomen in de rekening van de kronieken van koning David.", "25": "En over de schatten van de koning was Azmaveth, de zoon van Adiël; en over de schatten op het land, in de steden, en in de dorpen, en in de torens, was Jonathan, de zoon van Uzzia.", "26": "En over hen die het akkerwerk deden, in de landbouw, was Ezri, de zoon van Chelub.", "27": "En over de wijngaarden was Simeï, de Ramathiet; maar over wat van de wijnstokken kwam, tot de voorraden wijn, was Zabdi, de Sifmiet.", "28": "En over de olijfgaarden en de wilde vijgenbomen die in de laagte waren, was Baäl-Hanan, de Gederiet; maar Joas was over de voorraden olie.", "29": "En over de runderen die in Saron weidden, was Sitrai, de Saroniet; maar over de runderen in de laagten was Safat, de zoon van Adlai.", "30": "En over de kamelen was Obil, de Ismaëliet; en over de ezelinnen was Jechdeja, de Meronothiet.", "31": "En over het kleine vee was Jaziz, de Hageriet. Al dezen waren opzichters over het bezit dat koning David had.", "32": "En Jonathan, de oom van David, was raadsman, een verstandig man; hij was ook schrijver; Jehiël nu, de zoon van Hachmoni, was bij de zonen van de koning.", "33": "En Achitofel was raadsman van de koning; en Husai, de Archiet, was de vriend van de koning.", "34": "En na Achitofel was Jojada, de zoon van Benaja, en Abjathar; maar Joab was de legeraanvoerder van de koning."}, "SV": {"1": "Dit nu zijn de kinderen Israëls naar hun getal, de hoofden der vaderen, en de oversten der duizenden en der honderden, met hun ambtlieden, den koning dienende in alle zaken der verdelingen, aangaande en afgaande van maand tot maand in al de maanden des jaars; elke verdeling was vier en twintig duizend.", "2": "Over de eerste verdeling in de eerste maand was Jasobam, de zoon van Zabdiël; en in zijn verdeling waren er vier en twintig duizend.", "3": "Hij was uit de kinderen van Perez, het hoofd van al de oversten der heiren in de eerste maand.", "4": "En over de verdeling in de tweede maand was Dodai, de Ahohiet, en *over* zijn verdeling was Mikloth ook voorganger; in zijn verdeling waren er ook vier en twintig duizend.", "5": "De derde overste des heirs in de derde maand was Benaja, de zoon van Jojada, den opperambtman; die was het hoofd; in zijn verdeling waren er ook vier en twintig duizend.", "6": "Deze Benaja was een held van de dertig, en over de dertig; en *over* zijn verdeling was Ammizabad, zijn zoon.", "7": "De vierde, in de vierde maand, was Asahel, de broeder van Joab, en na hem Zebadja, zijn zoon; in zijn verdeling waren er ook vier en twintig duizend.", "8": "De vijfde, in de vijfde maand, was Samhuth, de Jizrahiet, de overste; in zijn verdeling waren er ook vier en twintig duizend.", "9": "De zesde, in de zesde maand, was Ira, de zoon van Ikkes, de Thekoiet; in zijn verdeling waren er ook vier en twintig duizend.", "10": "De zevende, in de zevende maand, was Helez, de Peloniet, uit de kinderen van Efraïm; in zijn verdeling waren er ook vier en twintig duizend.", "11": "De achtste, in de achtste maand, was Sibbechai, de Husathiet, van de Zerahieten; in zijn verdeling waren er ook vier en twintig duizend.", "12": "De negende, in de negende maand, was Abiezer, de Anathothiet; van de Benjaminieten; in zijn verdeling waren er ook vier en twintig duizend.", "13": "De tiende, in de tiende maand, was Maharai, de Nethofathiet, van de Zerahieten; in zijn verdeling waren er ook vier en twintig duizend.", "14": "De elfde, in de elfde maand, was Benaja, de Pirhathoniet, van de kinderen van Efraïm; in zijn verdeling waren er ook vier en twintig duizend.", "15": "De twaalfde, in de twaalfde maand, was Heldai, de Nethofathiet, van Othniël; in zijn verdeling waren er ook vier en twintig duizend.", "16": "Doch over de stammen van Israël waren *dezen*: over de Rubenieten was Eliëzer, de zoon van Zichri, voorganger; over de Simeonieten was Sefatja, de zoon van Maacha;", "17": "Over de Levieten was Hasabja, de zoon van Kemuël; over de Aäronieten was Zadok;", "18": "Over Juda was Elihu, uit de broederen van David; over Issaschar was Omri, de zoon van Michaël;", "19": "Over Zebulon was Jismaja, de zoon van Obadja; over Nafthali was Jerimoth, de zoon van Azriël;", "20": "Over de kinderen van Efraïm was Hosea, de zoon van Azazja; over den halven stam van Manasse was Joël, de zoon van Pedaja;", "21": "Over half Manasse, in Gilead, was Jiddo, de zoon van Zecharja; over Benjamin was Jaasiel, de zoon van Abner;", "22": "Over Dan was Azarel, de zoon van Jeroham. Dezen waren de oversten der stammen van Israël.", "23": "Maar David nam het getal van die niet op, die twintig jaren oud en daar beneden waren; omdat de HEERE gezegd had, dat Hij Israël vermenigvuldigen zou als de sterren des hemels.", "24": "Joab, de zoon van Zeruja, had begonnen te tellen, maar hij voleindde het niet, omdat er deshalve een grote toorn over Israël gekomen was; daarom is het getal niet opgebracht in de rekening der kronieken van den koning David.", "25": "En over de schatten des konings was Azmaveth, de zoon van Adiël; en over de schatten op het land, in de steden, en in de dorpen, en in de torens, was Jonathan, de zoon van Uzzia.", "26": "En over die, die het akkerwerk deden, in de landbouwing, was Ezri, de zoon van Chelub.", "27": "En over de wijngaarden was Simeï, de Ramathiet; maar over hetgeen dat van de wijnstokken kwam tot de schatten des wijns, was Zabdi, de Sifmiet.", "28": "En over de olijfgaarden en de wilde vijgebomen, die in de laagte waren, was Baäl-hanan, de Gederiet; maar Joas was over de schatten der olie.", "29": "En over de runderen, die in Saron weidden, was Sitrai, de Saroniet; maar over de runderen in de laagten, was Safat, de zoon van Adlai.", "30": "En over de kemelen was Obil, de Ismaëliet; en over de ezelinnen was Jechdeja, de Meronothiet.", "31": "En over het kleine vee was Jaziz, de Hageriet. Alle dezen waren oversten over de have, die de koning David had.", "32": "En Jonathan, Davids oom, was raad, een verstandig man; hij was ook schrijver; Jehiel nu, de zoon van Hachmoni, was bij de zonen des konings.", "33": "En Achitofel was raad des konings; en Husai, de Archiet, was des konings vriend.", "34": "En na Achitofel was Jojada, de zoon van Benaja, en Abjathar; maar Joab was des konings krijgsoverste."}, "KJV": {"1": "Now the children of Israel after their number, to wit, the chief fathers and captains of thousands and hundreds, and their officers that served the king in any matter of the courses, which came in and went out month by month throughout all the months of the year, of every course were twenty and four thousand.", "2": "Over the first course for the first month was Jashobeam the son of Zabdiel: and in his course were twenty and four thousand.", "3": "Of the children of Perez was the chief of all the captains of the host for the first month.", "4": "And over the course of the second month was Dodai an Ahohite, and of his course was Mikloth also the ruler: in his course likewise were twenty and four thousand.", "5": "The third captain of the host for the third month was Benaiah the son of Jehoiada, a chief priest: and in his course were twenty and four thousand.", "6": "This is that Benaiah, who was mighty among the thirty, and above the thirty: and in his course was Ammizabad his son.", "7": "The fourth captain for the fourth month was Asahel the brother of Joab, and Zebadiah his son after him: and in his course were twenty and four thousand.", "8": "The fifth captain for the fifth month was Shamhuth the Izrahite: and in his course were twenty and four thousand.", "9": "The sixth captain for the sixth month was Ira the son of Ikkesh the Tekoite: and in his course were twenty and four thousand.", "10": "The seventh captain for the seventh month was Helez the Pelonite, of the children of Ephraim: and in his course were twenty and four thousand.", "11": "The eighth captain for the eighth month was Sibbecai the Hushathite, of the Zarhites: and in his course were twenty and four thousand.", "12": "The ninth captain for the ninth month was Abiezer the Anetothite, of the Benjamites: and in his course were twenty and four thousand.", "13": "The tenth captain for the tenth month was Maharai the Netophathite, of the Zarhites: and in his course were twenty and four thousand.", "14": "The eleventh captain for the eleventh month was Benaiah the Pirathonite, of the children of Ephraim: and in his course were twenty and four thousand.", "15": "The twelfth captain for the twelfth month was Heldai the Netophathite, of Othniel: and in his course were twenty and four thousand.", "16": "Furthermore over the tribes of Israel: the ruler of the Reubenites was Eliezer the son of Zichri: of the Simeonites, Shephatiah the son of Maachah:", "17": "Of the Levites, Hashabiah the son of Kemuel: of the Aaronites, Zadok:", "18": "Of Judah, Elihu, one of the brethren of David: of Issachar, Omri the son of Michael:", "19": "Of Zebulun, Ishmaiah the son of Obadiah: of Naphtali, Jerimoth the son of Azriel:", "20": "Of the children of Ephraim, Hoshea the son of Azaziah: of the half tribe of Manasseh, Joel the son of Pedaiah:", "21": "Of the half tribe of Manasseh in Gilead, Iddo the son of Zechariah: of Benjamin, Jaasiel the son of Abner:", "22": "Of Dan, Azareel the son of Jeroham. These were the princes of the tribes of Israel.", "23": "But David took not the number of them from twenty years old and under: because the LORD had said he would increase Israel like to the stars of the heavens.", "24": "Joab the son of Zeruiah began to number, but he finished not, because there fell wrath for it against Israel; neither was the number put in the account of the chronicles of king David.", "25": "And over the king's treasures was Azmaveth the son of Adiel: and over the storehouses in the fields, in the cities, and in the villages, and in the castles, was Jehonathan the son of Uzziah:", "26": "And over them that did the work of the field for tillage of the ground was Ezri the son of Chelub:", "27": "And over the vineyards was Shimei the Ramathite: over the increase of the vineyards for the wine cellars was Zabdi the Shiphmite:", "28": "And over the olive trees and the sycomore trees that were in the low plains was Baalhanan the Gederite: and over the cellars of oil was Joash:", "29": "And over the herds that fed in Sharon was Shitrai the Sharonite: and over the herds that were in the valleys was Shaphat the son of Adlai:", "30": "Over the camels also was Obil the Ishmaelite: and over the asses 11496", "refs": [], "kinderen": [{"label": "Commander of David's army", "href": "../../nave/j/?hl=1Chr.27.34#i11497", "refs": [{"disp": "2 Sam 8:16", "href": "../../2-samuel/8/#v16", "ref": "2 Sam 8:16", "svLabel": null}, {"disp": "2 Sam 20:23", "href": "../../2-samuel/20/#v23", "ref": "2 Sam 20:23", "svLabel": null}, {"disp": "1 Kron 11:6", "href": "../../1-kronieken/11/#v6", "ref": "1 Kron 11:6", "svLabel": null}, {"disp": "1 Kron 18:15", "href": "../../1-kronieken/18/#v15", "ref": "1 Kron 18:15", "svLabel": null}, {"disp": "1 Kron 27:34", "href": "../../1-kronieken/27/#v34", "ref": "1 Kron 27:34", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"1 Kron 24:31": "En zij wierpen ook loten, samen met hun broeders, de zonen van Aäron, voor het aangezicht van koning David, en Zadok, en Achimelech, en van de familiehoofden onder de priesters en onder de Levieten; het familiehoofd tegenover zijn jongste broer.", "Richt 4:2": "Zo verkocht de HEERE hen in de hand van Jabin, koning van de Kanaänieten, die te Hazor regeerde; en zijn legeraanvoerder was Sisera; hij woonde in Haroseth der heidenen.", "1 Sam 14:51": "En Kis was Sauls vader, en Ner, Abners vader, was een zoon van Abiël.", "1 Kron 29:29": "De geschiedenissen nu van koning David, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Samuel, de ziener, en in de geschiedenissen van de profeet Nathan, en in de geschiedenissen van Gad, de ziener;", "1 Kron 24:6": "En Semaja, de zoon van Nethaneel, de schrijver, uit de Levieten, schreef hen op, voor het aangezicht van de koning, en van de vorsten, en van de priester Zadok, en van Achimelech, de zoon van Abjathar, en van de familiehoofden onder de priesters en onder de Levieten; één familie werd genomen voor Eleazar, en zo ook werd er één genomen voor Ithamar.", "1 Kron 11:31": "Ithai, de zoon van Ribai, uit Gibea van de kinderen van Benjamin; Benaja, de Pirhathoniet;", "2 Sam 16:16": "En het gebeurde, toen Husai, de Archiet, Davids vriend, bij Absalom kwam, dat Husai tegen Absalom zei: Leve de koning, leve de koning!", "Gen 41:48": "En hij verzamelde al het voedsel van de zeven jaren die in Egypteland waren, en legde het voedsel op in de steden; het voedsel van het veld rondom elke stad, legde hij daarbinnen op.", "1 Sam 9:3": "De ezelinnen nu van Kis, de vader van Saul, waren kwijtgeraakt; daarom zei Kis tegen zijn zoon Saul: Neem nu een van de knechten met u, en maak u op, ga heen, zoek de ezelinnen.", "2 Kon 21:25": "Het overige van de geschiedenis van Amon, wat hij gedaan heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "2 Sam 21:21": "En hij hoonde Israël; maar Jonathan, de zoon van Simea, Davids broer, sloeg hem.", "Deut 1:15": "Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen.", "1 Kron 27:32-34": "En Jonathan, de oom van David, was raadsman, een verstandig man; hij was ook schrijver; Jehiël nu, de zoon van Hachmoni, was bij de zonen van de koning. En Achitofel was raadsman van de koning; en Husai, de Archiet, was de vriend van de koning. En na Achitofel was Jojada, de zoon van Benaja, en Abjathar; maar Joab was de legeraanvoerder van de koning.", "1 Kron 11:27": "Sammoth, de Harodiet; Helez, de Peloniet;", "Gen 36:24": "En dit zijn de zonen van Zibeon: Aja en Ana; dat is die Ana, die de muildieren in de woestijn gevonden heeft, toen hij de ezels van zijn vader Zibeon weidde.", "1 Kron 27:1-15": "Dit nu zijn de kinderen van Israël naar hun getal, de hoofden van de families, en de aanvoerders van de duizenden en van de honderden, met hun opzichters, die de koning dienden in alle zaken van de verdelingen, aankomend en weggaand van maand tot maand, in al de maanden van het jaar; elke verdeling was vierentwintigduizend man. Over de eerste verdeling, in de eerste maand, was Jasobam, de zoon van Zabdiël; en in zijn verdeling waren er vierentwintigduizend. Hij was uit de kinderen van Perez, het hoofd van alle aanvoerders van de legers in de eerste maand.", "2 Kron 32:28": "Ook opslagplaatsen voor de opbrengst van koren, en wijn, en olie; en stallen voor allerlei beesten, en kooien voor de kudden.", "Ezra 1:7": "Ook bracht koning Kores de voorwerpen van het huis van de HEERE naar buiten, die Nebukadnezar uit Jeruzalem had weggehaald, en in het huis van zijn god had gezet.", "Ex 18:25": "En Mozes koos bekwame mannen, uit heel Israël, en stelde hen aan tot hoofden over het volk; leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien;", "1 Kron 11:12": "En na hem was Eleazar, de zoon van Dodo, de Ahohiet; hij was een van de drie helden.", "2 Sam 23:9": "En na hem was Eleazar, de zoon van Dodo, zoon van Ahohi; deze was onder de drie helden met David, toen zij de Filistijnen beschimpten, die daar ten strijde verzameld waren, en de mannen van Israël waren teruggetrokken.", "2 Sam 23:24": "Asahel, Joabs broer, was onder de dertig; Elhanan, de zoon van Dodo, van Bethlehem;", "2 Sam 23:28": "Zalmon, de Ahohiet; Maharai, de Netofathiet;", "2 Sam 20:23": "Joab nu was over het hele leger van Israël; en Benaja, de zoon van Jojada, over de Krethi en over de Plethi;", "1 Kon 1:7": "En hij overlegde met Joab, de zoon van Zeruja, en met Abjathar, de priester; die hielpen hem, en volgden Adonia.", "1 Kron 26:30": "Van de Hebronieten was Hasabja, en zijn broers, dappere mannen, duizend zevenhonderd, over de ambten van Israël aan deze kant van de Jordaan naar het westen, over al het werk van de HEERE, en tot de dienst van de koning.", "2 Sam 23:26": "Helez, de Paltiet; Ira, de zoon van Ikes, de Thekoiet;", "2 Kron 12:15": "De geschiedenis van Rehabeam nu, van begin tot eind, is die niet geschreven in de woorden van Semaja, de profeet, en Iddo, de ziener, die de geslachtsregisters vermelden? Daarbij ook de oorlogen van Rehabeam en Jerobeam, al hun dagen door.", "1 Kron 27:26-31": "En over hen die het akkerwerk deden, in de landbouw, was Ezri, de zoon van Chelub. En over de wijngaarden was Simeï, de Ramathiet; maar over wat van de wijnstokken kwam, tot de voorraden wijn, was Zabdi, de Sifmiet. En over de olijfgaarden en de wilde vijgenbomen die in de laagte waren, was Baäl-Hanan, de Gederiet; maar Joas was over de voorraden olie.", "Jes 60:6": "Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.", "2 Kron 26:22": "Het overige nu van de geschiedenissen van Uzzia, de eerste en de laatste, heeft de profeet Jesaja, de zoon van Amos, beschreven.", "1 Sam 21:7": "Daar was nu een man van de knechten van Saul, diezelfde dag opgehouden voor het aangezicht van de HEERE, en zijn naam was Doeg, een Edomiet, de machtigste onder de herders die Saul had.", "1 Sam 17:29": "Toen zei David: Wat heb ik nu gedaan? Is er geen reden voor?", "1 Kron 11:28": "Ira, de zoon van Ikkes, de Thekoiet; Abiëzer, de Anathothiet;", "1 Kron 12:28": "En Zadok was een jongeman, een kloeke held; en uit zijn vaders huis waren tweeëntwintig leiders;", "2 Sam 13:3": "Maar Amnon had een vriend, wiens naam Jonadab was, een zoon van Simea, Davids broer; en Jonadab was een zeer sluwe man.", "1 Kron 11:22-25": "Benaja, de zoon van Jojada, de zoon van een dapper man uit Kabzeël, was groot van daden; hij versloeg twee sterke leeuwen van Moab; ook ging hij af, en versloeg een leeuw in het midden van het kuil, in de sneeuwtijd. Hij versloeg ook een Egyptische man, een man van grote lengte, van vijf ellen; en die Egyptenaar had een speer in de hand, als een weversboom; maar hij ging naar hem af met een staf, en rukte de speer uit de hand van de Egyptenaar, en hij doodde hem met zijn eigen speer. Deze dingen deed Benaja, de zoon van Jojada; daardoor had hij een naam onder die drie helden.", "1 Kon 4:28": "De gerst nu en het stro voor de paarden, en voor de snelle kamelen, brachten zij naar de plaats waar hij was, ieder naar zijn taak.", "1 Sam 30:17": "En David sloeg hen van de schemering tot aan de avond van de volgende dag; en er ontkwam niet één man van hen, behalve vierhonderd jonge mannen, die op kamelen reden en vluchtten.", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "Gen 15:5": "Toen leidde Hij hem naar buiten, en zei: Zie nu op naar de hemel, en tel de sterren, als u ze tellen kunt; en Hij zei tegen hem: Zo zal uw nageslacht zijn!", "2 Kon 1:9": "En hij zond naar hem een leider over vijftig met zijn vijftigtal. En toen hij naar hem opklom (want zie, hij zat op de top van een berg), sprak hij tot hem: Man van God! De koning zegt: Kom naar beneden.", "Gen 7:11": "In het zeshonderdste jaar van het leven van Noach, in de tweede maand, op de zeventiende dag van de maand, op diezelfde dag zijn alle bronnen van het grote afgrond opengebroken, en de sluizen van de hemel geopend.", "2 Kron 32:29": "Daarbij had hij zich steden gemaakt, alsook bezit van schapen en runderen in menigte; want God gaf hem zeer veel bezit.", "1 Kron 18:15": "Joab nu, de zoon van Zeruja, ging over het leger; en Josafat, de zoon van Ahilud, was kanselier;", "Num 2:3": "Die zich nu oostwaarts, naar de opgang, legeren zullen, zal zijn de banier van het leger van Juda, naar hun legers; en Nahesson, de zoon van Amminadab, zal de leider van de zonen van Juda zijn.", "2 Sam 23:8": "Dit zijn de namen van de helden die David gehad heeft: Joscheb-Baschebeth, de zoon van Tachkemoni, de voornaamste van de hoofdlieden. Deze was Adino, de Ezniet, die zich stelde tegen achthonderd man, die door hem verslagen werden op één moment.", "1 Kron 11:6": "Want David zei: Al wie de Jebusieten het eerst verslaat, zal tot hoofd en leider worden. Toen klom Joab, de zoon van Zeruja, er als eerste op; daarom werd hij tot hoofd.", "2 Sam 16:16-19": "En het gebeurde, toen Husai, de Archiet, Davids vriend, bij Absalom kwam, dat Husai tegen Absalom zei: Leve de koning, leve de koning! Maar Absalom zei tegen Husai: Is dit uw trouw aan uw vriend? Waarom bent u niet met uw vriend meegegaan? En Husai zei tegen Absalom: Nee, maar wie de HEERE verkiest, en dit hele volk, en alle mannen van Israël, van hem zal ik zijn, en bij hem zal ik blijven.", "1 Kon 2:35": "En de koning stelde Benaja, de zoon van Jojada, in zijn plaats aan over het leger; en Zadok, de priester, stelde de koning aan in de plaats van Abjathar.", "Ps 55:14": "Maar u bent het, o mens, als van mijn eigen stand, mijn leidsman en mijn bekende!", "2 Kon 19:2": "Daarna stuurde hij Eljakim, de hofmeester, en Sebna, de schrijver, en de oudsten van de priesters, met zakken bedekt, naar Jesaja, de profeet, de zoon van Amoz;", "2 Sam 16:17": "Maar Absalom zei tegen Husai: Is dit uw trouw aan uw vriend? Waarom bent u niet met uw vriend meegegaan?", "1 Kon 20:27": "De kinderen van Israël werden ook gemonsterd, en waren verzorgd met middelen van bestaan, en trokken hun tegemoet; en de kinderen van Israël legerden zich tegenover hen, als twee blote geitenkudden, maar de Syriërs vervulden het land.", "1 Kron 21:1-7": "Toen stond de satan op tegen Israël, en hij porde David aan, dat hij Israël telde. En David zei tegen Joab en tegen de leiders van het volk: Ga heen, tel Israël van Ber-seba tot Dan toe, en breng hen tot mij, dat ik hun aantal weet. Toen zei Joab: De HEERE doet Zijn volk, hoeveel zij nu ook zijn, honderd keer zoveel worden; zijn zij niet allen, o mijn heer koning, mijn heer tot knechten? Waarom verzoekt mijn heer dit? Waarom zou het Israël tot schuld worden?", "Jes 65:10": "En Saron zal tot een schaapskooi worden, en het dal van Achor tot een rustplaats voor het vee, voor Mijn volk, dat Mij gezocht heeft.", "Num 26:20": "Zo waren de zonen van Juda naar hun geslachten: van Sela het geslacht der Selanieten; van Perez het geslacht der Perezieten; van Zerah het geslacht der Zerahieten.", "1 Kon 12:33": "En hij offerde op het altaar, dat hij te Beth-el gemaakt had, op de vijftiende dag van de achtste maand, van de maand die hij uit zijn eigen hart bedacht had; zo maakte hij voor de kinderen van Israël een feest, en offerde op dat altaar, en bracht reukwerk.", "2 Sam 2:32": "En zij namen Asahel op, en begroeven hem in het graf van zijn vader, dat te Bethlehem was. Joab nu en zijn mannen gingen de hele nacht, tot het licht hun aanbrak te Hebron.", "2 Kron 32:27": "Jehizkia had zeer veel rijkdom en eer; en hij maakte zich schatkamers voor zilver, en voor goud, en voor kostbaar gesteente, en voor specerijen, en voor schilden, en voor allerlei begeerlijk gereedschap;", "2 Sam 23:30": "Benaja, de Pirhathoniet; Hiddai, van de beken van Gaäs;", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "1 Kron 27:25-31": "En over de schatten van de koning was Azmaveth, de zoon van Adiël; en over de schatten op het land, in de steden, en in de dorpen, en in de torens, was Jonathan, de zoon van Uzzia. En over hen die het akkerwerk deden, in de landbouw, was Ezri, de zoon van Chelub. En over de wijngaarden was Simeï, de Ramathiet; maar over wat van de wijnstokken kwam, tot de voorraden wijn, was Zabdi, de Sifmiet.", "1 Sam 16:6": "En het gebeurde, toen zij binnenkwamen, dat hij Eliab aanzag, en dacht: Zeker, deze staat hier voor de HEERE, Zijn gezalfde.", "2 Sam 24:4-9": "Doch het woord van de koning kreeg de overhand tegen Joab, en tegen de aanvoerders van het leger. Zo trok Joab uit, met de aanvoerders van het leger, van voor de koning, om het volk Israël te tellen. En zij gingen over de Jordaan, en legerden zich bij Aroer, aan de rechterkant van de stad die in het midden ligt van de beek van Gad, en bij Jaezer. Vervolgens kwamen zij in Gilead, en in het lage land Hodsi; ook kwamen zij bij Dan-jaän, en rondom bij Sidon.", "1 Kon 4:27": "Deze bestelmeesters nu, ieder in zijn maand, verzorgden de koning Salomo, en allen die aan de tafel van de koning Salomo kwamen; zij lieten niets ontbreken.", "1 Sam 17:13": "En de drie oudste zonen van Isaï gingen op weg; zij volgden Saul na in de strijd. De namen nu van zijn drie zonen die in de strijd gingen, waren: Eliab, de eerstgeborene, en zijn tweede Abinadab, en de derde Samma.", "2 Sam 23:29": "Heleb, de zoon van Baëna, de Netofathiet; Ithai, de zoon van Ribai, van Gibea van de kinderen van Benjamin;", "2 Sam 8:17": "En Zadok, zoon van Ahitub, en Achimelech, zoon van Abjathar, waren priesters; en Seraja was schrijver.", "Deut 20:9": "En het zal gebeuren, als die opzichters geëindigd zullen hebben met spreken tot het volk, dan zullen zij aanvoerders van de legers aan het hoofd van het volk aanstellen.", "1 Kron 11:29": "Sibbechai, de Husathiet; Ilai, de Ahohiet;", "2 Kron 9:29": "Het overige nu van de geschiedenissen van Salomo, van de eerste tot de laatste, is dat niet geschreven in de woorden van Nathan, de profeet, en in de profetie van Ahia, de Siloniet, en in de gezichten van Jedi, de ziener, over Jerobeam, de zoon van Nebat?", "1 Kron 4:13": "En de kinderen van Kenaz waren Othniël en Seraja; en de kinderen van Othniël, Hathath.", "1 Kron 5:16": "En zij woonden in Gilead, in Basan, en in de bijbehorende plaatsen, en in alle voorsteden van Saron, tot aan hun grensgebieden.", "2 Kron 26:11-13": "Verder had Uzzia een legermacht van geoefenden ten oorlog, die ten leger uittrokken bij benden, naar het getal van hun monstering, onder toezicht van Jeïel, de schrijver, en Maäseja, de ambtenaar, onder het gezag van Hananja, een van de vorsten van de koning. Het gehele getal van de hoofden van de vaderen, van de strijdbare helden, was tweeduizend zeshonderd. En onder hun gezag was een leger van driehonderdzevenduizend vijfhonderd, die met strijdbare kracht ten oorlog geoefend werden, om de koning tegen de vijand te helpen.", "Num 1:18": "En zij verzamelden de gehele vergadering, op de eerste dag van de tweede maand; en die verklaarden hun afkomst, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van wie twintig jaar oud was en daarboven, hoofd voor hoofd.", "1 Kron 9:1": "Heel Israël werd in geslachtsregisters geteld, en zie, zij zijn geschreven in het boek van de koningen van Israël. En die van Juda waren weggevoerd naar Babel, vanwege hun overtredingen.", "1 Kron 21:4": "Doch het woord van de koning kreeg de overhand tegen Joab; daarom trok Joab uit, en hij doorwandelde heel Israël; daarna kwam hij weer naar Jeruzalem.", "1 Kon 4:14": "Abinadab, de zoon van Iddo, was te Mahanaïm.", "1 Kron 2:16": "En hun zusters waren Zeruja en Abigaïl. De kinderen nu van Zeruja waren Abisai, en Joab, en Asa-el; drie.", "Gen 30:43": "En die man breidde zich zeer sterk uit, en hij had veel kudden, en dienstmaagden, en dienstknechten, en kamelen, en ezels.", "2 Sam 8:15-18": "Zo regeerde David over heel Israël, en David deed aan zijn hele volk recht en gerechtigheid. Joab nu, de zoon van Zeruja, was over het leger; en Josafat, zoon van Achilud, was kanselier. En Zadok, zoon van Ahitub, en Achimelech, zoon van Abjathar, waren priesters; en Seraja was schrijver.", "2 Kron 32:32": "Het overige van de geschiedenissen van Jehizkia, en zijn goeddadigheden, zie, die zijn geschreven in het visioen van de profeet Jesaja, de zoon van Amoz, en in het boek van de koningen van Juda en Israël.", "1 Kron 11:26": "De helden nu van de legers waren: Asahel, de broer van Joab; Elhanan, de zoon van Dodo, van Bethlehem;", "2 Kron 26:10": "Hij bouwde ook torens in de woestijn, en hakte veel putten uit, omdat hij veel vee had, zowel in de laagten als in de effent velden; akkerlieden en wijngaardeniers op de bergen en op de vruchtbare velden; want hij was een liefhebber van het bewerken van het land.", "Gen 38:29": "Maar het gebeurde, toen hij zijn hand terugtrok, zie, dat zijn broer naar buiten kwam; en zij zei: Hoe bent u doorgebroken? Op u komt de breuk! En men noemde hem Perez.", "2 Kon 18:18": "En zij riepen naar de koning; toen ging tot hen uit Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier.", "2 Kon 20:13": "En Hizkia luisterde naar hen, en hij toonde hun zijn hele schathuis, het zilver en het goud, en de specerijen, en de beste olie, en zijn wapenhuis, en alles wat gevonden werd in zijn schatten; er was geen ding in zijn huis, of in zijn hele heerschappij, dat hij hun niet toonde.", "Luk 17:7": "En wie van u die een dienstknecht heeft die ploegt of de dieren hoedt, zal tegen hem zeggen, als hij van de akker komt: Kom meteen aan tafel?", "Job 1:3": "Daartoe had hij zeven duizend schapen, en drie duizend kamelen, en vijfhonderd juk ossen, en vijfhonderd ezelinnen; ook had hij zeer veel dienstvolk; zodat deze man groter was dan al die van het oosten.", "1 Kron 21:6": "Doch Levi en Benjamin telde hij niet onder hen mee; want het woord van de koning was voor Joab een gruwel.", "2 Sam 20:25": "En Seja was schrijver; en Zadok en Abjathar waren priesters.", "Est 3:9": "Als het de koning goeddunkt, laat er geschreven worden dat men hen ombrengt; dan zal ik tienduizend talenten zilver opwegen in de handen van hen die het werk doen, om het in de schatten van de koning te brengen.", "Num 2:31": "Al de getelden in het leger van Dan waren honderdzevenenvijftigduizend zeshonderd. Zij zullen achteraan optrekken, naar hun banieren.", "2 Kron 20:34": "Het overige nu van de geschiedenissen van Josafat, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Jehu, de zoon van Hanani, die men optekende in het boek van de koningen van Israël.", "2 Sam 24:1-15": "En de toorn van de HEERE ging verder tegen Israël ontsteken; en Hij porde David tegen hen aan en zei: Ga, tel Israël en Juda. De koning zei toen tegen Joab, de legeraanvoerder die bij hem was: Trek nu rond door alle stammen van Israël, van Dan tot Ber-seba toe, en tel het volk, zodat ik het getal van het volk weet. Toen zei Joab tegen de koning: Laat de HEERE, uw God, aan dit volk, hoeveel het er ook mogen zijn, honderdmaal meer toevoegen, zodat de ogen van mijn heer de koning het mogen aanzien; maar waarom heeft mijn heer de koning zin in deze zaak?", "Jer 41:8": "Doch onder hen werden tien mannen gevonden, die tegen Ismaël zeiden: Dood ons niet, want wij hebben verborgen schatten in het veld, van tarwe, en gerst, en olie, en honing. Zo liet hij af, en doodde hen niet te midden van hun broeders.", "1 Kron 26:29": "Van de Jizharieten waren Chenanja en zijn zonen belast met het buitenwerk in Israël, als opzichters en als rechters.", "1 Sam 8:12": "en hij zal hen voor zich aanstellen als leiders over duizend, en als leiders over vijftigtallen; en hij zal hen zijn akker laten ploegen, en zijn oogst laten oogsten, en zijn oorlogswapens laten maken, alsook zijn wagentuig.", "Num 7:12": "Hij nu die op de eerste dag zijn offergave bracht, was Nahesson, de zoon van Amminadab, voor de stam van Juda.", "2 Sam 2:18-23": "Nu waren daar drie zonen van Zeruja, Joab, en Abisai en Asahel; en Asahel was licht op zijn voeten, als een van de reeën die in het veld zijn. En Asahel jaagde Abner achterna; en hij week niet af, om van achter Abner naar rechts of naar links af te gaan. Toen keek Abner achter zich om, en zei: Bent u dit, Asahel? En hij zei: Ik ben het.", "2 Sam 21:18": "En het gebeurde daarna, dat er opnieuw een oorlog was te Gob tegen de Filistijnen. Toen sloeg Sibbechai, de Husathiet, Saf, die van de kinderen van Rafa was.", "1 Kron 27:1-22": "Dit nu zijn de kinderen van Israël naar hun getal, de hoofden van de families, en de aanvoerders van de duizenden en van de honderden, met hun opzichters, die de koning dienden in alle zaken van de verdelingen, aankomend en weggaand van maand tot maand, in al de maanden van het jaar; elke verdeling was vierentwintigduizend man. Over de eerste verdeling, in de eerste maand, was Jasobam, de zoon van Zabdiël; en in zijn verdeling waren er vierentwintigduizend. Hij was uit de kinderen van Perez, het hoofd van alle aanvoerders van de legers in de eerste maand.", "1 Kron 12:27": "En Jehojada was aanvoerder van de Aäronieten; en met hem waren er drieduizend zevenhonderd.", "1 Kron 26:32": "En zijn broers waren dappere mannen, tweeduizend zevenhonderd hoofden van de families; en koning David stelde hen aan over de Rubenieten, en Gadieten, en de halve stam van de Manassieten, voor alle zaken van God en de zaken van de koning.", "2 Kon 22:1-14": "Josia was acht jaar oud, toen hij koning werd, en regeerde eenendertig jaar te Jeruzalem; en de naam van zijn moeder was Jedida, een dochter van Adaja, uit Bozkath. En hij deed wat recht was in de ogen van de HEERE; en hij wandelde in heel de weg van zijn vader David, en week niet af naar rechts of naar links. Het gebeurde nu in het achttiende jaar van koning Josia, dat de koning de schrijver Safan, de zoon van Azalia, de zoon van Mesullam, zond naar het huis van de HEERE, en zei:", "1 Kon 4:7": "En Salomo had twaalf bestelmeesters over heel Israël, die de koning en zijn huis van voedsel voorzagen; voor ieder was er een maand in het jaar om te verzorgen.", "1 Kron 27:26-28": "En over hen die het akkerwerk deden, in de landbouw, was Ezri, de zoon van Chelub. En over de wijngaarden was Simeï, de Ramathiet; maar over wat van de wijnstokken kwam, tot de voorraden wijn, was Zabdi, de Sifmiet. En over de olijfgaarden en de wilde vijgenbomen die in de laagte waren, was Baäl-Hanan, de Gederiet; maar Joas was over de voorraden olie.", "Gen 49:8-10": "Juda! U bent het, u zullen uw broers loven; uw hand zal zijn op de nek van uw vijanden; voor u zullen de zonen van uw vader zich neerbuigen. Juda is een leeuwenwelp! U bent van de roof opgeklommen, mijn zoon! Hij kromt zich, hij legt zich neer als een leeuw, en als een oude leeuw; wie zal hem doen opstaan? De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "1 Kron 28:1": "Toen verzamelde David alle leiders van Israël in Jeruzalem: de leiders van de stammen, de leiders van de afdelingen die de koning dienden bij toerbeurt, de leiders over de duizenden, de leiders over de honderden, de beheerders over alle bezittingen en het vee van de koning en zijn zonen, met de hovelingen, de helden en alle dappere mannen.", "Ezra 1:8": "En Kores, de koning van Perzië, liet ze uitgeven door de hand van Mithredath, de schatmeester, die ze overhandigde aan Sesbazar, de vorst van Juda, na ze geteld te hebben.", "2 Sam 3:37": "En al het volk en heel Israël merkten op die dag dat het niet van de koning was gekomen dat Abner, de zoon van Ner, gedood was.", "1 Kron 26:25": "Maar zijn broers van Eliëzer waren dezen: Rehabja was zijn zoon, en Jesaja zijn zoon, en Joram zijn zoon, en Zichri zijn zoon, en Selomith zijn zoon.", "2 Sam 8:16": "Joab nu, de zoon van Zeruja, was over het leger; en Josafat, zoon van Achilud, was kanselier.", "1 Kron 24:4": "En van de kinderen van Eleazar werden meer hoofden van de mannen gevonden dan van de kinderen van Ithamar, toen zij hen indeelden; van de kinderen van Eleazar waren zestien hoofden van de families, maar van de kinderen van Ithamar, naar hun families, acht.", "Num 10:10": "Ook op de dag van uw vrolijkheid, en op uw vastgestelde hoogtijden, en aan de begin van uw maanden, zult u ook met de trompetten blazen over uw brandoffers en over uw dankoffers; en zij zullen u ter gedachtenis zijn voor het aangezicht van uw God; Ik ben de HEERE, uw God!", "2 Sam 23:27": "Abiëzer, de Anetothiet; Mebunnai, de Husathiet;", "1 Sam 13:2": "koos Saul zich drieduizend man uit Israël; er waren er bij Saul tweeduizend te Michmas en op het gebergte van Beth-el, en duizend waren er bij Jonathan te Gibea-benjamins; en de rest van het volk liet hij gaan, ieder naar zijn tent.", "2 Kon 18:15": "Zo gaf Hizkia al het zilver, dat gevonden werd in het huis van de HEERE, en in de schatten van het huis van de koning.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "Job 1:17": "Terwijl deze nog sprak, kwam er een ander en zei: De Chaldeeën stelden drie groepen op, en vielen de kamelen aan, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Est 2:12": "Toen nu de beurt van elke jonge dochter naderde om bij koning Ahasveros te komen, nadat haar twaalf maanden lang naar de wet van de vrouwen gebeurd was; want zo werden vervuld de dagen van haar schoonheidsverzorging, zes maanden met mirreolie, en zes maanden met specerijen, en met andere schoonheidsmiddelen van de vrouwen;", "1 Sam 14:50": "En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.", "2 Sam 16:23": "In die dagen was de raad die Achitofel gaf, als had men naar het woord van God gevraagd; zo was alle raad van Achitofel, zowel bij David als bij Absalom.", "Ezra 5:17": "Als het de koning dan nu goeddunkt, laat er gezocht worden in het schathuis van de koning daar, dat te Babel is, of het zo is dat een bevel van de koning Kores gegeven is om dit huis van God te Jeruzalem te bouwen; en dat men ons het believen van de koning hierover laat weten.", "1 Kon 4:4": "En Benaja, de zoon van Jojada, was over het leger; en Zadok en Abjathar waren priesters.", "2 Sam 23:25": "Samma, de Harodiet; Elika, de Harodiet;", "2 Sam 15:32": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd.", "1 Kron 13:1": "David hield raad met de leiders van de duizenden en van de honderden, en met alle vorsten.", "2 Kon 18:37": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, tot Hizkia, met gescheurde kleren; en zij maakten hem de woorden van Rabsake bekend.", "Num 31:14": "En Mozes werd zeer boos op de aanvoerders van het leger, de hoofdlieden over de duizenden, en de hoofdlieden over de honderden, die uit de strijd van die oorlog kwamen.", "Gen 47:6": "Egypteland ligt voor u; laat uw vader en uw broers wonen in het beste deel van het land; laat hen in het land Gosen wonen. En als u weet dat er onder hen bekwame mannen zijn, zet hen dan aan als veemeesters over wat ik heb.", "2 Sam 2:18-24": "Nu waren daar drie zonen van Zeruja, Joab, en Abisai en Asahel; en Asahel was licht op zijn voeten, als een van de reeën die in het veld zijn. En Asahel jaagde Abner achterna; en hij week niet af, om van achter Abner naar rechts of naar links af te gaan. Toen keek Abner achter zich om, en zei: Bent u dit, Asahel? En hij zei: Ik ben het.", "Richt 12:13": "En na hem richtte Abdon, een zoon van Hillel, de Pirhathoniet, Israël.", "1 Kon 4:7-19": "En Salomo had twaalf bestelmeesters over heel Israël, die de koning en zijn huis van voedsel voorzagen; voor ieder was er een maand in het jaar om te verzorgen. En dit zijn hun namen: de zoon van Hur was in het gebergte van Efraïm. De zoon van Deker in Makaz, en in Saalbim, en Beth-semes, en Elon-beth-hanan.", "2 Kron 17:12-19": "Zo nam Josafat toe, en werd bijzonder groot; daartoe bouwde hij in Juda burchten en voorraadsteden. En hij had veel van het werk in de steden van Juda, en krijgslieden, kloeke helden, in Jeruzalem. Dit nu is hun telling, naar de huizen van hun vaderen. In Juda waren leiders van de duizenden: Adna de aanvoerder, en met hem waren driehonderdduizend kloeke helden.", "2 Kon 12:10-12": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd. En zij gaven het geld, goed gewogen, in handen van hen die het werk verzorgden en die aangesteld waren over het huis van de HEERE; en zij betaalden daarmee de timmerlieden en de bouwlieden die het huis van de HEERE herstelden; En de metselaars en de steenhouwers, en om hout en gehouwen stenen te kopen, om de breuken van het huis van de HEERE te herstellen, en voor alles wat uitgegeven werd voor het huis, om dat te herstellen.", "1 Kron 21:5": "En Joab gaf aan David het aantal van het getelde volk; en heel Israël was elfhonderdduizend man, die het zwaard uittrokken, en Juda vierhonderdzeventigduizend man, die het zwaard uittrokken.", "2 Kron 16:2": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei:", "1 Kron 11:11": "Dezen nu zijn het aantal van de helden die David had: Jasobam, de zoon van Hachmoni, was het hoofd van de dertig; hij zwaaide zijn speer tegen driehonderd man en versloeg hen op eenmaal.", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "1 Sam 13:1": "Saul was een jaar koning geweest, en in het tweede jaar dat hij over Israël regeerde,", "Est 6:1": "Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning.", "Matt 20:8": "Toen het nu avond geworden was, zei de heer van de wijngaard tegen zijn rentmeester: Roep de arbeiders, en geef hun het loon, te beginnen bij de laatsten tot de eersten.", "2 Sam 20:23-26": "Joab nu was over het hele leger van Israël; en Benaja, de zoon van Jojada, over de Krethi en over de Plethi; En Adoram was over de schatting; en Josafat, de zoon van Ahilud, was kanselier; En Seja was schrijver; en Zadok en Abjathar waren priesters.", "2 Sam 15:32-37": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd. En David zei tegen hem: Als u met mij meegaat, zult u mij tot een last zijn; maar als u teruggaat naar de stad, en tegen Absalom zegt: Uw knecht, ik zal van de koning zijn; ik ben eerder wel de knecht van uw vader geweest, maar nu zal ik uw knecht zijn; dan zou u voor mij de raad van Achitofel teniet doen.", "2 Sam 20:24": "En Adoram was over de schatting; en Josafat, de zoon van Ahilud, was kanselier;", "2 Sam 15:12": "Absalom zond ook om Achitofel, de Giloniet, Davids raadsman, te halen uit zijn stad, uit Gilo, terwijl hij offers bracht. En de samenzwering werd sterk, en het volk kwam gestaag toe en werd meer bij Absalom.", "Est 8:9": "Toen werden de schrijvers van de koning geroepen, op datzelfde moment, in de derde maand (dat is de maand Sivan), op de drieëntwintigste daarvan, en er werd geschreven naar alles wat Mordechai gebood, aan de Joden, en aan de stadhouders, en landvoogden, en leiders van de landschappen, die van Indië af tot aan Morenland reiken, honderdzevenentwintig landschappen, ieder landschap naar zijn eigen schrift, ieder volk naar zijn eigen taal; ook aan de Joden naar hun schrift en naar hun taal.", "Ex 1:11": "En zij stelden leiders van dwangarbeid over hen aan, om hen te onderdrukken met hun lasten; want men bouwde voor Farao voorraadsteden, Pitom en Raamses.", "1 Kron 21:1-8": "Toen stond de satan op tegen Israël, en hij porde David aan, dat hij Israël telde. En David zei tegen Joab en tegen de leiders van het volk: Ga heen, tel Israël van Ber-seba tot Dan toe, en breng hen tot mij, dat ik hun aantal weet. Toen zei Joab: De HEERE doet Zijn volk, hoeveel zij nu ook zijn, honderd keer zoveel worden; zijn zij niet allen, o mijn heer koning, mijn heer tot knechten? Waarom verzoekt mijn heer dit? Waarom zou het Israël tot schuld worden?", "2 Sam 24:1-9": "En de toorn van de HEERE ging verder tegen Israël ontsteken; en Hij porde David tegen hen aan en zei: Ga, tel Israël en Juda. De koning zei toen tegen Joab, de legeraanvoerder die bij hem was: Trek nu rond door alle stammen van Israël, van Dan tot Ber-seba toe, en tel het volk, zodat ik het getal van het volk weet. Toen zei Joab tegen de koning: Laat de HEERE, uw God, aan dit volk, hoeveel het er ook mogen zijn, honderdmaal meer toevoegen, zodat de ogen van mijn heer de koning het mogen aanzien; maar waarom heeft mijn heer de koning zin in deze zaak?", "1 Kon 16:16": "Het volk nu, dat zich gelegerd had, hoorde zeggen: Zimri heeft een verbond gesloten, ja, heeft ook de koning verslagen; daarom maakte heel Israël diezelfde dag Omri, de legeraanvoerder, koning over Israël, in het leger.", "1 Kon 12:32": "En Jerobeam maakte een feest in de achtste maand, op de vijftiende dag van de maand, gelijk het feest dat in Juda was, en offerde op het altaar; op dezelfde manier deed hij te Beth-el, terwijl hij de kalveren offerde die hij gemaakt had; hij stelde ook te Beth-el priesters der hoogten aan, die hij gemaakt had.", "Num 10:14": "Want als eerste trok op de banier van het leger van de kinderen van Juda, naar hun legers; en over zijn leger was Nahesson, de zoon van Amminadab.", "2 Sam 15:37": "Zo kwam Husai, Davids vriend, in de stad; en Absalom kwam te Jeruzalem.", "1 Kron 27:2-15": "Over de eerste verdeling, in de eerste maand, was Jasobam, de zoon van Zabdiël; en in zijn verdeling waren er vierentwintigduizend. Hij was uit de kinderen van Perez, het hoofd van alle aanvoerders van de legers in de eerste maand. En over de verdeling in de tweede maand was Dodai, de Ahohiet, en over zijn verdeling was Mikloth ook voorganger; in zijn verdeling waren er ook vierentwintigduizend.", "Neh 13:13": "En ik stelde tot schatmeesters over de schatten Selemja, de priester, en Zadok, de schrijver, en Pedaja, uit de Levieten; en aan hun zijde Hanan, de zoon van Zakkur, de zoon van Matthanja; want zij werden betrouwbaar geacht, en hun werd opgelegd het aan hun broeders uit te delen.", "1 Kon 4:5": "En Azaria, de zoon van Nathan, was over de bestelmeesters; en Zabud, de zoon van Nathan, was overambtman, de vriend van de koning.", "Gen 24:35": "en de HEERE heeft mijn heer zeer gezegend, zodat hij groot geworden is; en Hij heeft hem gegeven schapen, en runderen, en zilver, en goud, en knechten, en dienstmeisjes, en kamelen, en ezels.", "Jer 36:12": "ging hij naar het huis van de koning, naar de kamer van de schrijver; en zie, daar zaten al de vorsten: Elisama, de schrijver, en Delaja, de zoon van Semaja, en Elnathan, de zoon van Achbor, en Gemarja, de zoon van Safan, en Zedekia, de zoon van Hananja, en al de vorsten.", "1 Kron 21:1-17": "Toen stond de satan op tegen Israël, en hij porde David aan, dat hij Israël telde. En David zei tegen Joab en tegen de leiders van het volk: Ga heen, tel Israël van Ber-seba tot Dan toe, en breng hen tot mij, dat ik hun aantal weet. Toen zei Joab: De HEERE doet Zijn volk, hoeveel zij nu ook zijn, honderd keer zoveel worden; zijn zij niet allen, o mijn heer koning, mijn heer tot knechten? Waarom verzoekt mijn heer dit? Waarom zou het Israël tot schuld worden?", "2 Kon 1:11": "En hij zond weer naar hem een andere leider over vijftig met zijn vijftigtal. Deze antwoordde en sprak tot hem: Man van God! Zo zegt de koning: Kom snel naar beneden.", "1 Kon 4:18": "Simeï, de zoon van Ela, in Benjamin.", "1 Kron 18:17": "en Benaja, de zoon van Jojada, ging over de Krethi en Plethi; maar de zonen van David waren de eersten aan de hand van de koning.", "Est 3:12": "Toen werden de schrijvers van de koning geroepen, in de eerste maand, op de dertiende dag daarvan, en er werd geschreven naar alles wat Haman beval, aan de stadhouders van de koning, en aan de landvoogden die over elk landschap waren, en aan de vorsten van elk volk, elk landschap naar zijn schrift, en elk volk naar zijn taal; er werd geschreven in de naam van de koning Ahasveros, en het werd met de ring van de koning verzegeld.", "1 Kon 5:14": "En hij zond hen naar de Libanon, tienduizend van het maand bij beurten; een maand waren zij op de Libanon; twee maanden elk in zijn huis; en Adoniram was over dit uitschot.", "Job 3:6": "Diezelfde nacht, donkerheid neemt hem in; dat hij zich niet verheugt onder de dagen van het jaar; dat hij in het getal van de maanden niet komt!", "1 Kron 20:4": "En het gebeurde daarna, toen de oorlog met de Filistijnen bij Gezer opstond, dat Sibchai, de Husathiet, toen Sippai versloeg, die van de kinderen van Rafa was; en zij werden onderworpen.", "2 Sam 23:20-23": "Verder Benaja, de zoon van Jojada, de zoon van een dappere man, groot van daden, uit Kabzeel; die versloeg twee sterke leeuwen van Moab; ook ging hij af, en sloeg een leeuw in het midden van een kuil in de sneeuwtijd. Daarbij versloeg hij een Egyptische man, een man van aanzien; en in de hand van de Egyptenaar was een speer, maar hij ging op hem af met een staf; en hij rukte de speer uit de hand van de Egyptenaar, en doodde hem met zijn eigen speer. Deze dingen deed Benaja, de zoon van Jojada; daarom had hij een naam onder de drie helden.", "1 Kon 4:3": "Elihoref en Ahia, de zoon van Sisa, waren schrijvers; Josafat, de zoon van Ahilud, was kanselier.", "2 Sam 3:27": "Toen Abner naar Hebron terugkwam, nam Joab hem apart in het midden van de poort om in stilte met hem te spreken; en hij sloeg hem daar onder de vijfde rib, zodat hij stierf, vanwege het bloed van zijn broer Asaël.", "2 Sam 22:20-23": "En Hij voerde mij uit in de ruimte, en rukte mij eruit, want Hij had lust aan mij. De HEERE vergold mij naar mijn gerechtigheid; Hij gaf mij weer naar de reinheid van mijn handen. Want ik heb de wegen van de HEERE gehouden, en ben van mijn God niet goddeloos afgegaan.", "1 Kon 11:41": "Het overige nu van de geschiedenissen van Salomo, en alles wat hij gedaan heeft, en zijn wijsheid, is dat niet geschreven in het boek van de geschiedenissen van Salomo?", "1 Kron 11:30": "Maharai, de Netofathiet; Heled, de zoon van Baäna, de Netofathiet;", "Hebr 11:12": "Daarom zijn er ook uit één mens, en dat een als het ware al gestorvene, zovelen in aantal geboren als de sterren van de hemel, en als het zand aan de oever van de zee, dat niet te tellen is.", "1 Kon 14:19": "Het overige nu van de geschiedenis van Jerobeam, hoe hij oorlog voerde, en hoe hij geregeerd heeft, zie, dat staat geschreven in het boek van de kronieken van de koningen van Israël.", "Gen 12:16": "En hij deed Abram goed omwille van haar; zodat hij schapen had, en runderen, en ezels, en knechten, en dienstmeisjes, en ezelinnen, en kamelen.", "2 Sam 17:23": "Toen Achitofel nu zag dat zijn raad niet was opgevolgd, zadelde hij de ezel, stond op, en ging naar zijn huis in zijn stad, en gaf bevel aan zijn huis, en verhing zich. Zo stierf hij, en werd begraven in het graf van zijn vader.", "Openb 22:2": "In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">Dit</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">nu</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">zijn</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3478\">Israël</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3478\">naar</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4557\">hun</span> <span class= /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
