wandelde heel Israël; daarna kwam hij weer naar Jeruzalem.","5":"En Joab gaf aan David het aantal van het getelde volk; en heel Israël was elfhonderdduizend man, die het zwaard uittrokken, en Juda vierhonderdzeventigduizend man, die het zwaard uittrokken.","6":"Doch Levi en Benjamin telde hij niet onder hen mee; want het woord van de koning was voor Joab een gruwel.","7":"En deze zaak was kwaad in de ogen van God; daarom sloeg Hij Israël.","8":"Toen zei David tegen God: Ik heb zeer gezondigd, dat ik deze zaak gedaan heb; maar neem toch nu de misdaad van Uw knecht weg, want ik heb zeer dwaas gehandeld.","9":"De HEERE nu sprak tot Gad, de ziener van David, en zei:","10":"Ga heen, en spreek tot David, en zeg: Zo zegt de HEERE: Drie dingen leg Ik u voor; kies u er een uit, dat Ik u doe.","11":"En Gad kwam tot David, en zei tot hem: Zo zegt de HEERE: Kies voor uzelf:","12":"Of drie jaren honger, of drie maanden verteerd te worden voor het aangezicht van uw tegenstanders, en dat het zwaard van uw vijanden u achterhaalt; of drie dagen het zwaard van de HEERE, dat is, de pestilentie in het land, en een verdervende engel van de HEERE in al de gebieden van Israël? Zo bezie nu goed, wat antwoord ik Hem zal teruggeven, Die mij gezonden heeft.","13":"Toen zei David tegen Gad: Ik ben zeer benauwd; laat mij toch in de hand van de HEERE vallen; want Zijn barmhartigheden zijn zeer veel, maar laat mij in de hand van mensen niet vallen.","14":"De HEERE dan gaf pestilentie in Israël; en er vielen van Israël zeventigduizend man.","15":"En God zond een engel naar Jeruzalem, om die te verderven; en toen hij haar verdierf, zag de HEERE het, en het berouwde Hem over dat kwaad; en Hij zei tegen de verdervende engel: Het is genoeg, trek nu uw hand terug. De engel van de HEERE nu stond bij de dorsvloer van Ornan, de Jebusiet.","16":"Toen David zijn ogen ophief, zag hij de engel van de HEERE, staande tussen de aarde en de hemel, met zijn getrokken zwaard in zijn hand, uitgestrekt over Jeruzalem; toen viel David, en de oudsten, bedekt met zakken, op hun aangezicht.","17":"En David zei tegen God: Ben ik het niet, die gezegd heb, dat men het volk tellen zou? Ja, ik zelf ben het, die gezondigd en zeer kwalijk gehandeld heb; maar deze schapen, wat hebben die gedaan? O HEERE, mijn God, laat toch Uw hand tegen mij zijn, en tegen het huis van mijn vader, maar niet tegen Uw volk ter plaag.","18":"Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.","19":"Zo ging David dan op naar het woord van Gad, dat hij in de Naam van de HEERE gesproken had.","20":"Toen Ornan zich omkeerde, zag hij de engel; en zijn vier zonen, die bij hem waren, verstopten zich; en Ornan dorste tarwe.","21":"En David kwam tot Ornan; en Ornan keek toe, en zag David; toen ging hij uit de dorsvloer, en boog zich neer voor David, met het gezicht ter aarde.","22":"En David zei tegen Ornan: Geef mij de plaats van de dorsvloer, dat ik daarop voor de HEERE een altaar bouw; geef ze mij voor het volle geld, opdat deze plaag opgehouden wordt over het volk.","23":"Toen zei Ornan tegen David: Neem ze maar mee, en mijn heer de koning doet wat goed is in zijn ogen; zie, ik geef deze runderen tot brandoffers, en deze sleden tot hout, en de tarwe tot spijsoffer; ik geef het allemaal.","24":"En de koning David zei tegen Ornan: Nee, maar ik zal het zeker kopen voor het volle geld; want ik zal voor de HEERE niet nemen wat van u is, om een brandoffer voor niets te offeren.","25":"En David gaf aan Ornan voor die plaats zeshonderd gouden sikkels aan gewicht.","26":"Toen bouwde David daar voor de HEERE een altaar, en hij offerde brandoffers en dankoffers. Toen hij de HEERE aanriep, antwoordde Hij hem door vuur uit de hemel, op het brandofferaltaar.","27":"En de HEERE zei tegen de engel, dat hij zijn zwaard weer in zijn schede zou steken.","28":"In dezelfde tijd, toen David zag, dat de HEERE hem geantwoord had op de dorsvloer van Ornan, de Jebusiet, offerde hij daar;","29":"Want de tabernakel van de HEERE, die Mozes in de woestijn gemaakt had, en het altaar van het brandoffer, was in die tijd op de hoogte te Gibeon.","30":"David nu kon niet heengaan voor dat altaar, om God te zoeken; want hij was verschrikt voor het zwaard van de engel van de HEERE."},"SV":{"1":"Toen stond de satan op tegen Israël, en hij porde David aan, dat hij Israël telde.","2":"En David zeide tot Joab en tot de oversten des volks: Gaat heen, telt Israël van Ber-seba tot Dan toe, en brengt hen tot mij, dat ik hun getal wete.","3":"Toen zeide Joab: De HEERE doe tot Zijn volk, gelijk zij *nu* zijn, honderdmaal meer; zijn zij niet allen, o mijn heer koning, mijn heer tot knechten? Waarom verzoekt mijn heer dit? Waarom zou het Israël tot schuld worden?","4":"Doch het woord des konings nam de overhand tegen Joab; derhalve toog Joab uit, en hij doorwandelde gans Israël; daarna kwam hij weder te Jeruzalem.","5":"En Joab gaf David de som van het getelde volk; en gans Israël was elfhonderd duizend man, die het zwaard uittrokken, en Juda vierhonderd duizend, en zeventig duizend man, die het zwaard uittrokken.","6":"Doch Levi en Benjamin telde hij onder dezelve niet; want des konings woord was Joab een gruwel.","7":"En deze zaak was kwaad in de ogen Gods; daarom sloeg Hij Israël.","8":"Toen zeide David tot God: Ik heb zeer gezondigd, dat ik deze zaak gedaan heb; maar neem toch nu de misdaad Uws knechts weg, want ik heb zeer zottelijk gehandeld.","9":"De HEERE nu sprak tot Gad, den ziener van David, zeggende:","10":"Ga heen, en spreek tot David, zeggende: Aldus zegt de HEERE: Drie dingen leg Ik u voor; kies u een uit die, dat Ik u doe.","11":"En Gad kwam tot David, en zeide tot hem: Zo zegt de HEERE: Neem u uit:","12":"Of drie jaren honger, of drie maanden verteerd te worden voor het aangezicht uwer wederpartij, en dat het zwaard uwer vijanden *u* achterhale; of drie dagen het zwaard des HEEREN, dat is, de pestilentie in het land, en een verdervenden engel des HEEREN in al de landpalen van Israël? Zo zie nu toe, wat antwoord ik Dien zal wedergeven, Die mij gezonden heeft.","13":"Toen zeide David tot Gad: Mij is zeer bange; laat mij toch in de hand des HEEREN vallen; want Zijn barmhartigheden zijn zeer vele, maar laat mij in de hand der mensen niet vallen.","14":"De HEERE dan gaf pestilentie in Israël; en er vielen van Israël zeventig duizend man.","15":"En God zond een engel naar Jeruzalem, om die te verderven; en als hij haar verdierf, zag het de HEERE, en het berouwde Hem over dat kwaad; en Hij zeide tot den verdervenden engel: Het is genoeg, trek nu uw hand af. De engel des HEEREN nu stond bij den dorsvloer van Ornan, den Jebusiet.","16":"Als David zijn ogen ophief, zo zag hij den engel des HEEREN, staande tussen de aarde en tussen den hemel, met zijn uitgetrokken zwaard in zijn hand, uitgestrekt over Jeruzalem; toen viel David, en de oudsten, bedekt met zakken, op hun aangezichten.","17":"En David zeide tot God: Ben ik het niet, die gezegd heb, dat men het volk tellen zou? Ja, ik zelf ben het, die gezondigd en zeer kwalijk gehandeld heb; maar deze schapen, wat hebben die gedaan? O HEERE, mijn God, dat toch Uw hand tegen mij, en tegen het huis mijns vaders zij, maar niet tegen Uw volk ter plage.","18":"Toen zeide de engel des HEEREN tot Gad, dat hij David zeggen zou, dat David zou opgaan, om den HEERE een altaar op te richten op den dorsvloer van Ornan, den Jebusiet.","19":"Zo ging dan David op naar het woord van Gad, dat hij in den Naam des HEEREN gesproken had.","20":"Toen zich Ornan wendde, zo zag hij den engel; en zijn vier zonen, die bij hem waren, verstaken zich; en Ornan dorste tarwe.","21":"En David kwam tot Ornan; en Ornan zag toe, en zag David; zo ging hij uit den dorsvloer, en boog zich neder voor David, met het aangezicht ter aarde.","22":"En David zeide tot Ornan: Geef mij de plaats des dorsvloers, dat ik op dezelve den HEERE een altaar bouwe; geef ze mij voor het volle geld, opdat deze plage opgehouden worde van over het volk.","23":"Toen zeide Ornan tot David: Neem ze maar henen, en mijn heer de koning doe wat goed is in zijn ogen; zie, ik geef deze runderen tot brandofferen, en deze sleden tot hout, en de tarwe tot spijsoffer; ik geef het al.","24":"En de koning David zeide tot Ornan: Neen, maar ik zal het zekerlijk kopen voor het volle geld; want ik zal voor den HEERE niet nemen wat uw is, dat ik een brandoffer om niet offere.","25":"En David gaf aan Ornan voor die plaats zeshonderd gouden sikkelen van gewicht.","26":"Toen bouwde David aldaar den HEERE een altaar, en hij offerde brandofferen en dankofferen. Als hij den HEERE aanriep, zo antwoordde Hij hem door vuur uit den hemel, op het brandofferaltaar.","27":"En de HEERE zeide tot den engel, dat hij zijn zwaard weder in zijn schede steken zou.","28":"Ter zelfder tijd, toen David zag, dat de HEERE hem geantwoord had op den dorsvloer van Ornan, den Jebusiet, zo offerde hij aldaar;","29":"Want de tabernakel des HEEREN, dien Mozes in de woestijn gemaakt had, en het altaar des brandoffers, was te dier tijd op de hoogte te Gibeon.","30":"David nu kon niet heengaan voor hetzelve, om God te zoeken; want hij was verschrikt voor het zwaard van den engel des HEEREN."},"KJV":{"1":"And Satan stood up against Israel, and provoked David to number Israel.","2":"And David said to Joab and to the rulers of the people, Go, number Israel from Beersheba even to Dan; and bring the number of them to me, that I may know it.","3":"And Joab answered, The LORD make his people an hundred times so many more as they be: but, my lord the king, are they not all my lord's servants? why then doth my lord require this thing? why will he be a cause of trespass to Israel?","4":"Nevertheless the king's word prevailed against Joab. Wherefore Joab departed, and went throughout all Israel, and came to Jerusalem.","5":"And Joab gave the sum of the number of the people unto David. And all they of Israel were a thousand thousand and an hundred thousand men that drew sword: and Judah was four hundred threescore and ten thousand men that drew sword.","6":"But Levi and Benjamin counted he not among them: for the king's word was abominable to Joab.","7":"And God was displeased with this thing; therefore he smote Israel.","8":"And David said unto God, I have sinned greatly, because I have done this thing: but now, I beseech thee, do away the iniquity of thy servant; for I have done very foolishly.","9":"And the LORD spake unto Gad, David's seer, saying,","10":"Go and tell David, saying, Thus saith the LORD, I offer thee three things: choose thee one of them, that I may do it unto thee.","11":"So Gad came to David, and said unto him, Thus saith the LORD, Choose thee","12":"Either three years' famine; or three months to be destroyed before thy foes, while that the sword of thine enemies overtaketh thee; or else three days the sword of the LORD, even the pestilence, in the land, and the angel of the LORD destroying throughout all the coasts of Israel. Now therefore advise thyself what word I shall bring again to him that sent me.","13":"And David said unto Gad, I am in a great strait: let me fall now into the hand of the LORD; for very great are his mercies: but let me not fall into the hand of man.","14":"So the LORD sent pestilence upon Israel: and there fell of Israel seventy thousand men.","15":"And God sent an angel unto Jerusalem to destroy it: and as he was destroying, the LORD beheld, and he repented him of the evil, and said to the angel that destroyed, It is enough, stay now thine hand. And the angel of the LORD stood by the threshingfloor of Ornan the Jebusite.","16":"And David lifted up his eyes, and saw the angel of the LORD stand between the earth and the heaven, having a drawn sword in his hand stretched out over Jerusalem. Then David and the elders of Israel, who were clothed in sackcloth, fell upon their faces.","17":"And David said unto God, Is it not I that commanded the people to be numbered? even I it is that have sinned and done evil indeed; but as for these sheep, what have they done? let thine hand, I pray thee, O LORD my God, be on me, and on my father's house; but not on thy people, that they should be plagued.","18":"Then the angel of the LORD commanded Gad to say to David, that David should go up, and set up an altar unto the LORD in the threshingfloor of Ornan the Jebusite.","19":"And David went up at the saying of Gad, which he spake in the name of the LORD.","20":"And Ornan turned back, and saw the angel; and his four sons with him hid themselves. Now Ornan was threshing wheat.","21":"And as David came to Ornan, Ornan looked and saw David, and went out of the threshingfloor, and bowed himself to David with his face to the ground.","22":"Then David said to Ornan, Grant me the place of this threshingfloor, that I may build an altar therein unto the LORD: thou shalt grant it me for the full price: that the plague may be stayed from the people.","23":"And Ornan said unto David, Take it to thee, and let my lord the king do that which is good in his eyes: lo, I give thee the oxen also for burnt offerings, and the threshing instruments for wood, and the wheat for the meat offering; I give it all.","24":"And king David said to Ornan, Nay; but I will verily buy it for the full price: for I will not take that which is thine for the LORD, nor offer burnt offerings without cost.","25":"So David gave to Ornan for the place six hundred shekels of gold by weight.","26":"And David built there an altar unto the LORD, and offered burnt offerings and peace offerings, and called upon the LORD; and he answered him from heaven by fire upon the altar of burnt offering.","27":"And the LORD commanded the angel; and he put up ➔ his sword again into the sheath thereof.","28":"At that time when David saw that the LORD had answered him in the threshingfloor of Ornan the Jebusite, then he sacrificed there.","29":"For 0\">God</span> was <span class=\"wl wl-kjv\" data-code=\"H3415\">displeased</span> with this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing;</span> therefore he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> I have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly,</span> because I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing:</span> but now, I beseech thee, do <span class=\"wl wl-kjv\" data-code=\"H5674\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant;</span> for I have done <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H5528\">foolishly.</span>","9":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H2374\">seer,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","10":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">tell</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> I <span class=\"wl wl-kjv\" data-code=\"H5186\">offer</span> thee <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> things: <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> thee <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of <span class=\"wl wl-kjv\" data-code=\"H2007\">them,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it unto thee.","11":"So <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H6901\">Choose</span> thee","12":"Either <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years'</span> <span class=\"wl wl-kjv\" data-code=\"H7458\">famine;</span> or <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">months</span> to be <span class=\"wl wl-kjv\" data-code=\"H5595\">destroyed</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thy <span class=\"wl wl-kjv\" data-code=\"H6862\">foes,</span> while that the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> <span class=\"wl wl-kjv\" data-code=\"H5381\">overtaketh</span> thee; <span class=\"wl wl-kjv\" data-code=\"H518\">or</span> else <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> even the <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">destroying</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H1366\">coasts</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span> Now therefore <span class=\"wl wl-kjv\" data-code=\"H7200\">advise</span> thyself what <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> I shall bring <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to him that <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me.","13":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> I am in a <span class=\"wl wl-kjv\" data-code=\"H3966\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6887\">strait:</span> let me <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> now into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> for <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> are his <span class=\"wl wl-kjv\" data-code=\"H7356\">mercies:</span> but let me not <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man.</span>","14":"So the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence</span> upon <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and there <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> unto <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> it: and as he was <span class=\"wl wl-kjv\" data-code=\"H7843\">destroying,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5162\">repented</span> him of the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> that <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed,</span> It is <span class=\"wl wl-kjv\" data-code=\"H7227\">enough,</span> <span class=\"wl wl-kjv\" data-code=\"H7503\">stay</span> now thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by the <span class=\"wl wl-kjv\" data-code=\"H1637\">threshingfloor</span> of <span class=\"wl wl-kjv\" data-code=\"H771\">Ornan</span> the <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusite.</span>","16":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> between the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> and the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> ,"18":"Then the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad</span> to <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> should go <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and set <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H1637\">threshingfloor</span> of <span class=\"wl wl-kjv\" data-code=\"H771\">Ornan</span> the <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusite.</span>","19":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> at the <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H771\">Ornan</span> turned <span class=\"wl wl-kjv\" data-code=\"H7725\">back,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel;</span> and his <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> with him <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> themselves. Now <span class=\"wl wl-kjv\" data-code=\"H771\">Ornan</span> was <span class=\"wl wl-kjv\" data-code=\"H1758\">threshing</span> <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat.</span>","21":"And as <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H771\">Ornan,</span> <span class=\"wl wl-kjv\" data-code=\"H771\">Ornan</span> <span class=\"wl wl-kjv\" data-code=\"H5027\">looked</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H1637\">threshingfloor,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> with his <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground.</span>","22":"Then <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H771\">Ornan,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Grant</span> me the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of this <span class=\"wl wl-kjv\" data-code=\"H1637\">threshingfloor,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> therein unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">grant</span> it me for the <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">price:</span> that the <span class=\"wl wl-kjv\" data-code=\"H4046\">plague</span> may be <span class=\"wl wl-kjv\" data-code=\"H6113\">stayed</span> from the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","23":"And <span class=\"wl wl-kjv\" data-code=\"H771\">Ornan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> it to thee, and let my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that which is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes:</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">lo,</span> I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee the <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen</span> also for burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and the threshing <span class=\"wl wl-kjv\" data-code=\"H4173\">instruments</span> for <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat</span> for the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering;</span> I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> it all.","24":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H771\">Ornan,</span> Nay; but I will <span class=\"wl wl-kjv\" data-code=\"H7069\">verily</span> <span class=\"wl wl-kjv\" data-code=\"H7069\">buy</span> it for the <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">price:</span> for I will not <span class=\"wl wl-kjv\" data-code=\"H5375\">take</span> that which is thine for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> without <span class=\"wl wl-kjv\" data-code=\"H2600\">cost.</span>","25":"So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</s ":null,"tekst":"Then Satan stood up against Israel, and stirred up, [Oth. Provoked, moved, excited, instigated] David to number the people. [See the further annotate. On this chap. 2 Sam.24.]"}],"2":[{"catchword":null,"tekst":"And David said unto Joab, and to the Rulers of the people, Go your ways, number Israel from Berseba unto Dan [To wit, from the South to the North, from the one end of the Kingdom to the other. So likewise, Judg.20.1. and elsewhere] and bring them to me, that I may know their number."}],"3":[{"catchword":null,"tekst":"Then said Joab, The LORD add unto his people, as they are (now), an hundred times more: are they not all, O my Lord the King, my Lords servants? Why doth this (thing)? Why should it be trespass to Israel?"}],"4":[{"catchword":null,"tekst":"But the Kings word prevailed against Joab: therefore Joab went out, and passed throughout all Israel: [Joab spent in and about this employment nine months and twenty days, As appeareth 2 Sam.24.8.] After that he returned to Jerusalem."}],"5":[{"catchword":null,"tekst":"And Joab delivered unto David the sum of the people that were numbered: and all Israel were eleven hundred thousand men [Heb. thousand thousands, and an hundred thousand. ]that drew the sword: and Juda four hundred thousand, and threescore and ten thousand, that drew the sword. [see 2 Sam.24.9.]"}],"6":[{"catchword":null,"tekst":"But Levi and Benjamin, he counted not among them: [Heb. in the midst of them] for the Kings word was an abominable unto Joab."}],"7":[{"catchword":null,"tekst":"And this thing [To wit, that David had caused the people to be numbered] was evil in the yes of God: therefore he smote Israel. [to wit, with the pestilence.]"}],"8":[{"catchword":null,"tekst":"Then said David unto God, I have greatly sinned, (in) that I have done this thing: but now, I beseech thee, take away the iniquity of thy servant, [that is, mine initiquity: See 2 Sam.12.on v.13.] for I have done very foolishly."}],"9":[{"catchword":null,"tekst":"Now the LORD spake unto Gad Davids Seer, [That is, Prophet and Teacher, who was with David, whither so ever he went. Of the word Seer, 1 Sam.9.9.] saying:"}],"10":[{"catchword":null,"tekst":"Go and speak unto David, saying; Thus saith the LORD, I offer thee three things; chuse thee one out of them, that I may do (it) to thee."}],"11":[{"catchword":null,"tekst":"And Gad came to David, and said unto him, thus saith the LORD, chuse thee;"}],"12":[{"catchword":null,"tekst":"Either three years famine, or three months to be consumed before the face of thine adversary, and that the sword of thine enemies may overtake (thee): or three days the sword of the Lord, that is, the pestilence in the land, [The Angel of the LORD smote and slew the Israelites with the pestilence, as with a sword. See below vers.16,27.] and a destroying Angel of the LORD [that is, that shall kill and destroy many of the inhabitants of the land with pestilence] in all the borders of Israel; now then, look, consider, what answer I shall carry back to him, that sent me."}],"13":[{"catchword":null,"tekst":"Then David said unto Gad, I am in a great strait: let me, I pray thee, fall into the hand of the LORD [That is, I chuse the pestilence, and not war: let meonely fall into the hand of the LORD] for his mercies are very many, but let me fall into the hand of men."}],"14":[{"catchword":null,"tekst":"The LORD then gave pestilence in Israel: and there fell of Israel threescore and ten thousand men."}],"15":[{"catchword":null,"tekst":"And God sent an Angel to Jerusalem to destroy it, and when he destroyed the same, the LORD saw it, and it repented him of that evil, [That is ceased to destroy with the pestilence: spoken of God after the manner of men. See Gen 6:6.] and he said unto the destroying Angel, it is enough, withdraw now thine hand: now the Angel of the LORD stood by the threshing-floor of Ornan the Jebusite. [Oth. Called Arauna, and Arania, 2 Sam.24. 16.18. where is also shewed why he is called a Jebusite. See the annotate. There.]"}],"16":[{"catchword":null,"tekst":"When David lift up his eyes, then he saw the Angel of the LORD standing between the earth, and between the heaven, with his drawn sword in his hand, stretched out over Jerusalem: Then David, and the Eldest covered with sacks [that is, with mourning garments. See the annotate. On Gen.chap.37.v.14.] fell (down) upon their faces."}],"17":[{"catchword":null,"tekst":"And David said unto God, Am not I he that said [That is, commanded] that the people should be numbered? Yea I my self am he that sinned, and dealt very ill, [Heb. doing ill, have done ill] but these sheep what have they done? [it is true indeed that the subjects had not offended in or by numbering the people: yet notwithstanding they were justly punished of God for other sins of their] O LORD my God, let, I pray thine hand be against me, and against me, and against my fathers house, [as if David should say, slay me, and my fathers house, that is, my friends and kindred, with the pestilence] but not against thy people for a plague."}],"18":[{"catchword":null,"tekst":"Then the Angel of the LORD said unto Gad, that he should tell David, that David should go up, to rear up an Altar unto the LORD, in the threshing-floor of Ornan the Jebusite."}],"19":[{"catchword":null,"tekst":"So then David went up, according to the Word of Gad, which he had spoken in the Name of the LORD."}],"20":[{"catchword":null,"tekst":"When ornan turned himself about, then he saw the Angel, and his four sons that were with him, hid themselves; and Ornan threshed wheat."}],"21":[{"catchword":null,"tekst":"And David came to Ornan, and Ornan looked, and saw David, son he went out of the threshing-floor, and bowed himself down before David, with the face to the ground."}],"22":[{"catchword":null,"tekst":"And David said unto Ornan, Give me [That is, sell me, as straightway followeth] the place of the threshing-floor, that I may build an altar upon it unto the LORD: give it me for the full money, [as Gen 23:9.] that this plague may cease from the people."}],"23":[{"catchword":null,"tekst":"Then Ornan said unto David, Take it but away, [Hebr. Take it to thee, or, for thee] and let my Lord the King do that which is good in his eyes: Behold, I give these oxen [to wit, wherewith I even now thresh: for in those times they were wont to cause the oxen to tread out the corn] for burnt-offerings, and these sledges for wood, and the Wheat for meat-offering, I give it all."}],"24":[{"catchword":null,"tekst":"And King David said unto Ornan, Nay, [As if David had said, I will in no wise receive anything as a free gift, which thou offerest to me] but I will surely buy it [Heb. buying, I will buy it] for the full money: for I will not take that which is thine for the LORD, [that is, to give unto the LORD] that I should offer a burnt-offering for nothing, (or, without cost.)"}],"25":[{"catchword":null,"tekst":"And David gave unto Ornan for that place, six hundred shekels of gold by weight. [If these were common shekels, then every shekels weighteth two drams, or French Crowns. So that David gave for that place 1200. French Crowns. For the oxen, and the other Furniture, he gave fifty shekels of silver. See further the annotate. Gen.24.on v.22. & 2 Sam.24.on v.24.]"}],"26":[{"catchword":null,"tekst":"Then David built there an altar unto the LORD, and he offered burnt-offerings, and thank-offerings: when he called upon the LORD, then the LORD answered him by fire from heaven, by fire upon the altar of burnt-offering. [God caused fire to fall from heaven upon the burnt-offering, thereby witnessing, that he had heard Davids prayer. Compare herewith that which is recorded, Lev.9.v.24. & 1 Kings 18.38. & 1 Chron.7.1.]"}],"27":[{"catchword":null,"tekst":"And the LORD said unto the Angel, that he should put up his sword again into the sheath thereof."}],"28":[{"catchword":null,"tekst":"At that time, when David saw, that the LORD answered him on the threshing floor of Ornan the Jebusite then he offered there."}],"29":[{"catchword":null,"tekst":"For the Tabernacle of the LORD, which Moseh had made in the wilderness, and the altar of burnt-offering, were at that time on the high place at Gibeon. [See above chap.16.39. and 2 Chron.1.3.]"}],"30":[{"catchword":null,"tekst":"Now David could not go before it [To wit, the altar of burnt-offering: or, the Tabernacle which was at Gibeon] to enquire of God: for he was afraid of the sword of the Angel of the LORD."}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

function plaatsPopup(el, html) {

  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
