ba en Dedan.","10":"Cusch verwekte Nimrod; die begon geweldig te worden op aarde.","11":"En Mitsraïm verwekte de Ludieten, en de Anamieten, en de Lehabieten, en de Naftuchieten,","12":"En de Pathrusieten, en de Casluchieten (van wie de Filistijnen zijn voortgekomen) en de Cafthorieten.","13":"Kanaän verwekte Sidon, zijn eerstgeborene, en Heth,","14":"En de Jebusieten, en de Amorieten, en de Girgasieten,","15":"En de Hevieten, en de Arkieten, en de Sinieten,","16":"En de Arvadieten, en de Zemarieten, en de Hamathieten.","17":"De kinderen van Sem waren Elam, en Assur, en Arfachsad, en Lud, en Aram, en Uz, en Hul, en Gether, en Mesech.","18":"Arfachsad verwekte Selah, en Selah verwekte Heber.","19":"Aan Heber nu zijn twee zonen geboren; de naam van de één was Peleg, omdat in zijn dagen de aarde verdeeld is, en de naam van zijn broer was Joktan.","20":"En Joktan verwekte Almodad, en Selef, en Hazarmaveth, en Jerah,","21":"En Hadoram, en Uzal, en Dikla,","22":"En Ebal, en Abimaël, en Scheba,","23":"En Ofir, en Havila, en Jobab. Al dezen waren zonen van Joktan.","24":"Sem, Arfachsad, Selah,","25":"Heber, Peleg, Rehu,","26":"Serug, Nahor, Terah,","27":"Abram; die is Abraham.","28":"De kinderen van Abraham waren Izak en Ismaël.","29":"Dit zijn hun geboorten: de eerstgeborene van Ismaël was Nebajoth, en Kedar, en Adbeel, en Mibsam,","30":"Misma en Duma, Massa, Hadad en Thema,","31":"Jetur, Nafis, en Kedma; deze zijn de kinderen van Ismaël.","32":"De kinderen nu van Ketura, Abrahams bijvrouw: *zij* baarde Zimram, en Joksan, en Medan, en Midian, en Isbak, en Suah. En de kinderen van Joksan waren Scheba en Dedan.","33":"De kinderen van Midian nu waren Efa, en Efer, en Henoch, en Abida, en Eldaä. Die allen waren zonen van Ketura.","34":"Abraham verwekte Izak. De zonen van Izak waren Ezau en Israël.","35":"En de kinderen van Ezau: Elifaz, Rehuël, en Jehus, en Jaëlam, en Korah.","36":"De kinderen van Elifaz waren Theman, en Omar, Zefi, en Gaetham, Kenaz, en Timna, en Amalek.","37":"De kinderen van Rehuël waren Nahath, Zerah, Samma en Mizza.","38":"De kinderen van Seir nu waren Lotan, en Sobal, en Zibeon, en Ana, en Dison, en Ezer, en Disan.","39":"De kinderen van Lotan nu waren Hori en Homam; en de zuster van Lotan was Timna.","40":"De kinderen van Sobal waren Aljan, en Manahath, en Ebal, Sefi en Onam; en de kinderen van Zibeon waren Aja en Ana.","41":"De kinderen van Ana waren Dison; en de zonen van Dison waren Hamram, en Esban, en Jithran, en Cheran.","42":"De kinderen van Ezer waren Bilhan, en Zaävan, en Jaäkan. De kinderen van Disan waren Uz en Aran.","43":"Dit nu zijn de koningen die geregeerd hebben in het land van Edom, voordat er een koning regeerde over de kinderen van Israël: Bela, de zoon van Beor; en de naam van zijn stad was Dinhaba.","44":"En Bela stierf, en Jobab regeerde in zijn plaats, een zoon van Zerah, van Bozra.","45":"En Jobab stierf, en Husam, uit het land van de Themanieten, regeerde in zijn plaats.","46":"En Husam stierf, en Hadad, de zoon van Bedad, regeerde in zijn plaats, die de Midianieten in het veld van Moab versloeg; en de naam van zijn stad was Avith.","47":"En Hadad stierf, en Samla, van Masreka, regeerde in zijn plaats.","48":"En Samla stierf, en Saul, van Rehoboth aan de rivier, regeerde in zijn plaats.","49":"En Saul stierf, en Baäl-hanan, de zoon van Achbor, regeerde in zijn plaats.","50":"Toen Baäl-hanan stierf, regeerde Hadad in zijn plaats, en de naam van zijn stad was Pahi, en de naam van zijn vrouw was Mehetabeel, de dochter van Matred, dochter van Mee-sahab.","51":"Toen Hadad stierf, werden er vorsten in Edom: de vorst Timna, de vorst Alja, de vorst Jetheth,","52":"De vorst Aholibama, de vorst Ela, de vorst Pinon,","53":"De vorst Kenaz, de vorst Theman, de vorst Mibzar,","54":"De vorst Magdiël, de vorst Iram. Dezen waren de vorsten van Edom."},"SV":{"1":"Adam, Seth, Enos,","2":"Kenan, Mahalal-el, Jered,","3":"Henoch, Methusalah, Lamech,","4":"Noach, Sem, Cham en Jafeth.","5":"De kinderen van Jafeth waren Gomer, en Magog, en Madai, en Javan, en Tubal, en Mesech, en Tiras.","6":"En de kinderen van Gomer waren Askenaz, en Difath, en Thogarma.","7":"En de kinderen van Javan waren Elisa en Tharsisa, de Chittieten en Dodanieten.","8":"De kinderen van Cham waren Cusch en Mitsraim, Put, en Kanaän.","9":"En de kinderen van Cusch waren Seba, en Havila, en Sabta, en Raema, en Sabtecha; en de kinderen van Raema waren Scheba en Dedan.","10":"Cusch nu gewon Nimrod; die begon geweldig te zijn op aarde.","11":"En Mitsraim gewon de Ludieten, en de Anamieten, en de Lehabieten, en de Naftuchieten,","12":"En de Pathrusieten, en de Casluchieten, ( van welke de Filistijnen zijn voortgekomen) en de Cafthorieten.","13":"Kanaän nu gewon Sidon, zijn eerstgeborene, en Heth,","14":"En den Jebusiet, en den Amoriet, en den Girgasiet,","15":"En den Heviet, en den Arkiet, en den Siniet,","16":"En den Arvadiet, en den Zemariet, en den Hamathiet.","17":"De kinderen van Sem waren Elam, en Assur, en Arfachsad, en Lud, en Aram, en Uz, en Hul, en Gether, en Mesech.","18":"Arfachsad nu gewon Selah, en Selah gewon Heber.","19":"Aan Heber nu zijn twee zonen geboren; de naam des enen was Peleg, omdat in zijn dagen het aardrijk verdeeld is, en de naam zijns broeders was Joktan.","20":"En Joktan gewon Almodad, en Selef, en Hazarmaveth, en Jerah,","21":"En Hadoram, en Uzal, en Dikla,","22":"En Ebal, en Abimaël, en Scheba,","23":"En Ofir, en Havila, en Jobab. Alle dezen waren zonen van Joktan.","24":"Sem, Arfachsad, Selah,","25":"Heber, Peleg, Rehu,","26":"Serug, Nahor, Terah,","27":"Abram; die is Abraham.","28":"De kinderen van Abraham waren Izak en Ismaël.","29":"Dit zijn hun geboorten: de eerstgeborene van Ismaël was Nebajoth, en Kedar, en Adbeel, en Mibsam,","30":"Misma en Duma, Massa, Hadad en Thema,","31":"Jetur, Nafis, en Kedma; deze zijn de kinderen van Ismaël.","32":"De kinderen nu van Ketura, Abrahams bijwijf: *die* baarde Zimram, en Joksan, en Medan, en Midian, en Isbak, en Suah. En de kinderen van Joksan waren Scheba en Dedan.","33":"De kinderen van Midian nu waren Efa, en Efer, en Henoch, en Abida, en Eldaa. Die allen waren zonen van Ketura.","34":"Abraham nu gewon Izak. De zonen van Izak waren Ezau en Israël.","35":"En de kinderen van Ezau: Elifaz, Rehuël, en Jehus, en Jaëlam, en Korah.","36":"De kinderen van Elifaz waren Theman, en Omar, Zefi, en Gaetham, Kenaz, en Timna, en Amalek.","37":"De kinderen van Rehuël waren Nahath, Zerah, Samma en Mizza.","38":"De kinderen van Seir nu waren Lotan, en Sobal, en Zibeon, en Ana, en Dison, en Ezer, en Disan.","39":"De kinderen van Lotan nu waren Hori en Homam; en de zuster van Lotan was Timna.","40":"De kinderen van Sobal waren Aljan, en Manahath, en Ebal, Sefi en Onam; en de kinderen van Zibeon waren Aja en Ana.","41":"De kinderen van Ana waren Dison; en de zonen van Dison waren Hamram, en Esban, en Jithran, en Cheran.","42":"De kinderen van Ezer waren Bilhan, en Zaavan, en Jaakan. De kinderen van Disan waren Uz en Aran.","43":"Dit nu zijn de koningen, die geregeerd hebben in het land van Edom, eer er een koning regeerde over de kinderen Israëls: Bela, de zoon van Beor; en de naam zijner stad was Dinhaba.","44":"En Bela stierf, en Jobab regeerde in zijn plaats, een zoon van Zerah, van Bozra.","45":"En Jobab stierf, en Husam, uit het land der Themanieten, regeerde in zijn plaats.","46":"En Husam stierf, en Hadad, de zoon van Bedad, regeerde in zijn plaats, die de Midianieten in het veld van Moab versloeg; en de naam zijner stad was Avith.","47":"En Hadad stierf, en Samla, van Masreka, regeerde in zijn plaats.","48":"En Samla stierf, en Saul, van Rehoboth aan de rivier, regeerde in zijn plaats.","49":"En Saul stierf, en Baäl-hanan, de zoon van Achbor, regeerde in zijn plaats.","50":"Als Baäl-hanan stierf, zo regeerde Hadad in zijn plaats, en de naam zijner stad was Pahi, en de naam zijner huisvrouw was Mehetabeel, de dochter van Matred, dochter van Mee-sahab.","51":"Toen Hadad stierf, zo werden vorsten in Edom: de vorst Timna, de vorst Alja, de vorst Jetheth,","52":"De vorst Aholi-bama, de vorst Ela, de vorst Pinon,","53":"De vorst Kenaz, de vorst Theman, de vorst Mibzar,","54":"De vorst Magdiel, de vorst Iram. Dezen waren de vorsten van Edom."},"KJV":{"1":"Adam, Sheth, Enosh,","2":"Kenan, Mahalaleel, Jered,","3":"Henoch, Methuselah, Lamech,","4":"Noah, Shem, Ham, and Japheth.","5":"The sons of Japheth; Gomer, and Magog, and Madai, and Javan, and Tubal, and Meshech, and Tiras.","6":"And the sons of Gomer; Ashchenaz, and Riphath, and Togarmah.","7":"And the sons of Javan; Elishah, and Tarshish, Kittim, and Dodanim.","8":"The sons of Ham; Cush, and Mizraim, Put, and Canaan.","9":"And the sons of Cush; Seba, and Havilah, and Sabta, and Raamah, and Sabtecha. And the sons of Raamah; Sheba, and Dedan.","10":"And Cush begat Nimrod: he began to be mighty upon the earth.","11":"And Mizraim begat Ludim, and Anamim, and Lehabim, and Naphtuhim,","12":"And Pathrusim, and Casluhim, (of whom came the Philistines,) and Caphthorim.","13":"And Canaan begat Zidon his firstborn, and Heth,","14":"The Jebusite also, and the Amorite, and the Girgashite,","15":"And the Hivite, and the Arkite, and the Sinite,","16":"And the Arvadite, and the Zemarite, and the Hamathite.","17":"The sons of Shem; Elam, and Asshur, and Arphaxad, and Lud, and Aram, and Uz, and Hul, and Gether, and Meshech.","18":"And Arphaxad begat Shelah, and Shelah begat Eber.","19":"And unto Eber were born two sons: the name of the one was Peleg; because in his days the earth was divided: and his brother's name was Joktan.","20":"And Joktan begat Almodad, and Sheleph, and Hazarmaveth, and Jerah,","21":"Hadoram also, and Uzal, and Diklah,","22":"And Ebal, and Abimael, and Sheba,","23":"And Ophir, and Havilah, and Jobab. All these were the sons of Joktan.","24":"Shem, Arphaxad, Shelah,","25":"Eber, Peleg, Reu,","26":"Serug, Nahor, Terah,","27":"Abram; the same is Abraham.","28":"The sons of Abraham; Isaac, and Ishmael.","29":"These are their generations: The firstborn of Ishmael, Nebaioth; then Kedar, and Adbeel, and Mibsam,","30":"Mishma, and Dumah, Massa, Hadad, and Tema,","31":"Jetur, Naphish, and Kedemah. These are the sons of Ishmael.","32":"Now the sons of Keturah, Abraham's concubine: she bare Zimran, and Jokshan, and Medan, and Midian, and Ishbak, and Shuah. And the sons of Jokshan; Sheba, and Dedan.","33":"And the sons of Midian; Ephah, and Epher, and Henoch, and Abida, and Eldaah. All these are the sons of Keturah.","34":"And Abraham begat Isaac. The sons of Isaac; Esau and Israel.","35":"The sons of Esau; Eliphaz, Reuel, and Jeush, and Jaalam, and Korah.","36":"The sons of Eliphaz; Teman, and Omar, Zephi, and Gatam, Kenaz, and Timna, and Amalek.","37":"The sons of Reuel; Nahath, Zerah, Shammah, and Mizzah.","38":"And the sons of Seir; Lotan, and Shobal, and Zibeon, and Anah, and Dishon, and Ezer, and Dishan.","39":"And the sons of Lotan; Hori, and Homam: and Timna was Lotan's sister.","40":"The sons of Shobal; Alian, and Manahath, and Ebal, Shephi, and Onam. And the sons of Zibeon; Aiah, and Anah.","41":"The sons of Anah; Dishon. And the sons of Dishon; Amram, and Eshban, and Ithran, and Cheran.","42":"The sons of Ezer; Bilhan, and Zavan, and Jakan. The sons of Dishan; Uz, and Aran.","43":"Now these are the kings that reigned in the land of Edom before any king reigned over the children of Israel; Bela the son of Beor: and the name of his city was Dinhabah.","44":"And when Bela was dead, Jobab the son of Zerah of Bozrah reigned in his stead.","45":"And when Jobab was dead, Husham of the land of the Temanites reigned in his stead.","46":"And when Husham was dead, Hadad the son of Bedad, which smote Midian in the field of Moab, reigned in his stead: and the name of his city was Avith.","47":"And when Hadad was dead, Samlah of Masrekah reigned in his stead.","48":"And when Samlah was dead, Shaul of Rehoboth by the river reigned in his stead.","49":"And when Shaul was dead, Baalhanan th a-code=\"H4902\">Meshech.</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H775\">Arphaxad</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H7974\">Shelah,</span> and <span class=\"wl wl-kjv\" data-code=\"H7974\">Shelah</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H5677\">Eber.</span>","19":"And unto <span class=\"wl wl-kjv\" data-code=\"H5677\">Eber</span> were <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons:</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> was <span class=\"wl wl-kjv\" data-code=\"H6389\">Peleg;</span> because in his <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> was <span class=\"wl wl-kjv\" data-code=\"H6385\">divided:</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H3355\">Joktan.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H3355\">Joktan</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H486\">Almodad,</span> and <span class=\"wl wl-kjv\" data-code=\"H8026\">Sheleph,</span> and <span class=\"wl wl-kjv\" data-code=\"H2700\">Hazarmaveth,</span> and <span class=\"wl wl-kjv\" data-code=\"H3392\">Jerah,</span>","21":"<span class=\"wl wl-kjv\" data-code=\"H1913\">Hadoram</span> also, and <span class=\"wl wl-kjv\" data-code=\"H187\">Uzal,</span> and <span class=\"wl wl-kjv\" data-code=\"H1853\">Diklah,</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H5858\">Ebal,</span> and <span class=\"wl wl-kjv\" data-code=\"H39\">Abimael,</span> and <span class=\"wl wl-kjv\" data-code=\"H7614\">Sheba,</span>","23":"And <span class=\"wl wl-kjv\" data-code=\"H211\">Ophir,</span> and <span class=\"wl wl-kjv\" data-code=\"H2341\">Havilah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3103\">Jobab.</span> All these were the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3355\">Joktan.</span>","24":"<span class=\"wl wl-kjv\" data-code=\"H8035\">Shem,</span> <span class=\"wl wl-kjv\" data-code=\"H775\">Arphaxad,</span> <span class=\"wl wl-kjv\" data-code=\"H7974\">Shelah,</span>","25":"<span class=\"wl wl-kjv\" data-code=\"H5677\">Eber,</span> <span class=\"wl wl-kjv\" data-code=\"H6389\">Peleg,</span> <span class=\"wl wl-kjv\" data-code=\"H7466\">Reu,</span>","26":"<span class=\"wl wl-kjv\" data-code=\"H8286\">Serug,</span> <span class=\"wl wl-kjv\" data-code=\"H5152\">Nahor,</span> <span class=\"wl wl-kjv\" data-code=\"H8646\">Terah,</span>","27":"<span class=\"wl wl-kjv\" data-code=\"H87\">Abram;</span> the same is <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham.</span>","28":"The <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham;</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and <span class=\"wl wl-kjv\" data-code=\"H3458\">Ishmael.</span>","29":"These are their <span class=\"wl wl-kjv\" data-code=\"H8435\">generations:</span> The <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of <span class=\"wl wl-kjv\" data-code=\"H3458\">Ishmael,</span> <span class=\"wl wl-kjv\" data-code=\"H5032\">Nebaioth;</span> then <span class=\"wl wl-kjv\" data-code=\"H6938\">Kedar,</span> and <span class=\"wl wl-kjv\" data-code=\"H110\">Adbeel,</span> and <span class=\"wl wl-kjv\" data-code=\"H4017\">Mibsam,</span>","30":"<span class=\"wl wl-kjv\" data-code=\"H4927\">Mishma,</span> and <span class=\"wl wl-kjv\" data-code=\"H1746\">Dumah,</span> <span class=\"wl wl-kjv\" data-code=\"H4854\">Massa,</span> <span class=\"wl wl-kjv\" data-code=\"H2301\">Hadad,</span> and <span class=\"wl wl-kjv\" data-code=\"H8485\">Tema,</span>","31":"<span class=\"wl wl-kjv\" data-code=\"H3195\">Jetur,</span> <span class=\"wl wl-kjv\" data-code=\"H5305\">Naphish,</span> and <span class=\"wl wl-kjv\" data-code=\"H6929\">Kedemah.</span> These are the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3458\">Ishmael.</span>","32":"Now the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6989\">Keturah,</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine:</span> she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H2175\">Zimran,</span> and <span class=\"wl wl-kjv\" data-code=\"H3370\">Jokshan,</span> and <span class=\"wl wl-kjv\" data-code=\"H4091\">Medan,</span> and <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> and <span class=\"wl wl-kjv\" data-code=\"H3435\">Ishbak,</span> and <span class=\"wl wl-kjv\" data-code=\"H7744\">Shuah.</span> And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3370\">Jokshan;</span> <span class=\"wl wl-kjv\" data-code=\"H7614\">Sheba,</span> and <span class=\"wl wl-kjv\" data-code=\"H1719\">Dedan.</span>","33":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian;</span> <span class=\"wl wl-kjv\" data-code=\"H5891\">Ephah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6081\">Epher,</span> and <span class=\"wl wl-kjv\" data-code=\"H2585\">Henoch,</span> and <span class=\"wl wl-kjv\" data-code=\"H28\">Abida,</span> and <span class=\"wl wl-kjv\" data-code=\"H420\">Eldaah.</span> All these are the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6989\">Keturah.</span>","34":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac.</span> The <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac;</span> <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","35":"The <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau;</span> <span class=\"wl wl-kjv\" data-code=\"H464\">Eliphaz,</span> <span class=\"wl wl-kjv\" data-code=\"H7467\">Reuel,</span> and <span class=\"wl wl-kjv\" data-code=\"H3266\">Jeush,</span> and <span class=\"wl wl-kjv\" data-code=\"H3281\">Jaalam,</span> and <span class=\"wl wl-kjv\" data-code=\"H7141\">Korah.</span>","36":"The <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H464\">Eliphaz;</span> <span class=\"wl wl-kjv\" data-code=\"H8487\">Teman,</span> and <span class=\"wl wl-kjv\" data-code=\"H201\">Omar,</span> <span class=\"wl wl-kjv\" data-code=\"H6825\">Zephi,</span> and <span class=\"wl wl-kjv\" data-code=\"H1609\">Gatam,</span> <span class=\"wl wl-kjv\" data-code=\"H7073\">Kenaz,</span> and <span class=\"wl wl-kjv\" data-code=\"H8555\">Timna,</span> and <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalek.</span>","37":"The <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7467\">Reuel;</span> <span class=\"wl wl-kjv\" data-code=\"H5184\">Nahath,</span> <span class=\"wl wl-kjv\" data-code=\"H2226\">Zerah,</span> <span class=\"wl wl-kjv\" data-code=\"H8048\">Shammah,</span> and <span class=\"wl wl-kjv\" data-code=\"H4199\">Mizzah.</span>","38":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir;</span> <span class=\"wl wl-kjv\" data-code=\"H3877\">Lotan,</span> and <span class=\"wl wl-kjv\" data-code=\"H7732\">Shobal,</span> and <span class=\"wl wl-kjv\" data-code=\"H6649\">Zibeon,</span> and <span class=\"wl wl-kjv\" data-code=\"H6034\">Anah,</span> and <span class=\"wl wl-kjv\" data-code=\"H1787\">Dishon,</span> and <span class=\"wl wl-kjv\" data-code=\"H687\">Ezer,</span> and <span class=\"wl wl-kjv\" data-code=\"H1789\">Dishan.</span>","39":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3877\">Lotan;</span> <span class=\"wl wl-kjv\" data-code=\"H2753\">Hori,</span> and <span class=\"wl wl-kjv\" data-code=\"H1950\">Homam:</span> and <span class=\"wl wl-kjv\" data-code=\"H8555\">Timna</span> was <span class=\"wl wl-kjv\" data-code=\"H3877\">Lotan's</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister.</span>","40":"The <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7732\">Shobal;</span> <span class=\"wl wl-kjv\" data-code=\"H5935\">Alian,</span> and <span class=\"wl wl-kjv\" data-code=\"H4506\">Manahath,</span> and <span class=\"wl wl-kjv\" data-code=\"H5858\">Ebal,</span> <span class=\"wl wl-kjv\" data-code=\"H8195\">Shephi,</span> and <span class=\"wl wl-kjv\" data-code=\"H208\">Onam.</span> And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6649\">Zibeon;</span> <span class=\"wl wl-kjv\" data-code=\"H345\">Aiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6034\">Anah.</span>","41":"The <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6034\">Anah;</span> <span class=\"wl wl-kjv\" data-code=\"H1787\">Dishon.</span> And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1787\">Dishon;</span> <span class=\"wl wl-kjv\" data-code=\"H2566\">Amram,</span> and <span class=\"wl wl-kjv\" data-code=\"H790\">Esh (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
