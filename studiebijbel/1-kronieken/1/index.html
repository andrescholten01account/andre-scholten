inderen van Raema waren Scheba en Dedan.","10":"Cusch verwekte Nimrod; die begon geweldig te worden op aarde.","11":"En Mitsraïm verwekte de Ludieten, en de Anamieten, en de Lehabieten, en de Naftuchieten,","12":"En de Pathrusieten, en de Casluchieten (van wie de Filistijnen zijn voortgekomen) en de Cafthorieten.","13":"Kanaän verwekte Sidon, zijn eerstgeborene, en Heth,","14":"En de Jebusieten, en de Amorieten, en de Girgasieten,","15":"En de Hevieten, en de Arkieten, en de Sinieten,","16":"En de Arvadieten, en de Zemarieten, en de Hamathieten.","17":"De kinderen van Sem waren Elam, en Assur, en Arfachsad, en Lud, en Aram, en Uz, en Hul, en Gether, en Mesech.","18":"Arfachsad verwekte Selah, en Selah verwekte Heber.","19":"Aan Heber nu zijn twee zonen geboren; de naam van de één was Peleg, omdat in zijn dagen de aarde verdeeld is, en de naam van zijn broer was Joktan.","20":"En Joktan verwekte Almodad, en Selef, en Hazarmaveth, en Jerah,","21":"En Hadoram, en Uzal, en Dikla,","22":"En Ebal, en Abimaël, en Scheba,","23":"En Ofir, en Havila, en Jobab. Al dezen waren zonen van Joktan.","24":"Sem, Arfachsad, Selah,","25":"Heber, Peleg, Rehu,","26":"Serug, Nahor, Terah,","27":"Abram; die is Abraham.","28":"De kinderen van Abraham waren Izak en Ismaël.","29":"Dit zijn hun geboorten: de eerstgeborene van Ismaël was Nebajoth, en Kedar, en Adbeel, en Mibsam,","30":"Misma en Duma, Massa, Hadad en Thema,","31":"Jetur, Nafis, en Kedma; deze zijn de kinderen van Ismaël.","32":"De kinderen nu van Ketura, Abrahams bijvrouw: *zij* baarde Zimram, en Joksan, en Medan, en Midian, en Isbak, en Suah. En de kinderen van Joksan waren Scheba en Dedan.","33":"De kinderen van Midian nu waren Efa, en Efer, en Henoch, en Abida, en Eldaä. Die allen waren zonen van Ketura.","34":"Abraham verwekte Izak. De zonen van Izak waren Ezau en Israël.","35":"En de kinderen van Ezau: Elifaz, Rehuël, en Jehus, en Jaëlam, en Korah.","36":"De kinderen van Elifaz waren Theman, en Omar, Zefi, en Gaetham, Kenaz, en Timna, en Amalek.","37":"De kinderen van Rehuël waren Nahath, Zerah, Samma en Mizza.","38":"De kinderen van Seir nu waren Lotan, en Sobal, en Zibeon, en Ana, en Dison, en Ezer, en Disan.","39":"De kinderen van Lotan nu waren Hori en Homam; en de zuster van Lotan was Timna.","40":"De kinderen van Sobal waren Aljan, en Manahath, en Ebal, Sefi en Onam; en de kinderen van Zibeon waren Aja en Ana.","41":"De kinderen van Ana waren Dison; en de zonen van Dison waren Hamram, en Esban, en Jithran, en Cheran.","42":"De kinderen van Ezer waren Bilhan, en Zaävan, en Jaäkan. De kinderen van Disan waren Uz en Aran.","43":"Dit nu zijn de koningen die geregeerd hebben in het land van Edom, voordat er een koning regeerde over de kinderen van Israël: Bela, de zoon van Beor; en de naam van zijn stad was Dinhaba.","44":"En Bela stierf, en Jobab regeerde in zijn plaats, een zoon van Zerah, van Bozra.","45":"En Jobab stierf, en Husam, uit het land van de Themanieten, regeerde in zijn plaats.","46":"En Husam stierf, en Hadad, de zoon van Bedad, regeerde in zijn plaats, die de Midianieten in het veld van Moab versloeg; en de naam van zijn stad was Avith.","47":"En Hadad stierf, en Samla, van Masreka, regeerde in zijn plaats.","48":"En Samla stierf, en Saul, van Rehoboth aan de rivier, regeerde in zijn plaats.","49":"En Saul stierf, en Baäl-hanan, de zoon van Achbor, regeerde in zijn plaats.","50":"Toen Baäl-hanan stierf, regeerde Hadad in zijn plaats, en de naam van zijn stad was Pahi, en de naam van zijn vrouw was Mehetabeel, de dochter van Matred, dochter van Mee-sahab.","51":"Toen Hadad stierf, werden er vorsten in Edom: de vorst Timna, de vorst Alja, de vorst Jetheth,","52":"De vorst Aholibama, de vorst Ela, de vorst Pinon,","53":"De vorst Kenaz, de vorst Theman, de vorst Mibzar,","54":"De vorst Magdiël, de vorst Iram. Dezen waren de vorsten van Edom."},"SV":{"1":"Adam, Seth, Enos,","2":"Kenan, Mahalal-el, Jered,","3":"Henoch, Methusalah, Lamech,","4":"Noach, Sem, Cham en Jafeth.","5":"De kinderen van Jafeth waren Gomer, en Magog, en Madai, en Javan, en Tubal, en Mesech, en Tiras.","6":"En de kinderen van Gomer waren Askenaz, en Difath, en Thogarma.","7":"En de kinderen van Javan waren Elisa en Tharsisa, de Chittieten en Dodanieten.","8":"De kinderen van Cham waren Cusch en Mitsraim, Put, en Kanaän.","9":"En de kinderen van Cusch waren Seba, en Havila, en Sabta, en Raema, en Sabtecha; en de kinderen van Raema waren Scheba en Dedan.","10":"Cusch nu gewon Nimrod; die begon geweldig te zijn op aarde.","11":"En Mitsraim gewon de Ludieten, en de Anamieten, en de Lehabieten, en de Naftuchieten,","12":"En de Pathrusieten, en de Casluchieten, ( van welke de Filistijnen zijn voortgekomen) en de Cafthorieten.","13":"Kanaän nu gewon Sidon, zijn eerstgeborene, en Heth,","14":"En den Jebusiet, en den Amoriet, en den Girgasiet,","15":"En den Heviet, en den Arkiet, en den Siniet,","16":"En den Arvadiet, en den Zemariet, en den Hamathiet.","17":"De kinderen van Sem waren Elam, en Assur, en Arfachsad, en Lud, en Aram, en Uz, en Hul, en Gether, en Mesech.","18":"Arfachsad nu gewon Selah, en Selah gewon Heber.","19":"Aan Heber nu zijn twee zonen geboren; de naam des enen was Peleg, omdat in zijn dagen het aardrijk verdeeld is, en de naam zijns broeders was Joktan.","20":"En Joktan gewon Almodad, en Selef, en Hazarmaveth, en Jerah,","21":"En Hadoram, en Uzal, en Dikla,","22":"En Ebal, en Abimaël, en Scheba,","23":"En Ofir, en Havila, en Jobab. Alle dezen waren zonen van Joktan.","24":"Sem, Arfachsad, Selah,","25":"Heber, Peleg, Rehu,","26":"Serug, Nahor, Terah,","27":"Abram; die is Abraham.","28":"De kinderen van Abraham waren Izak en Ismaël.","29":"Dit zijn hun geboorten: de eerstgeborene van Ismaël was Nebajoth, en Kedar, en Adbeel, en Mibsam,","30":"Misma en Duma, Massa, Hadad en Thema,","31":"Jetur, Nafis, en Kedma; deze zijn de kinderen van Ismaël.","32":"De kinderen nu van Ketura, Abrahams bijwijf: *die* baarde Zimram, en Joksan, en Medan, en Midian, en Isbak, en Suah. En de kinderen van Joksan waren Scheba en Dedan.","33":"De kinderen van Midian nu waren Efa, en Efer, en Henoch, en Abida, en Eldaa. Die allen waren zonen van Ketura.","34":"Abraham nu gewon Izak. De zonen van Izak waren Ezau en Israël.","35":"En de kinderen van Ezau: Elifaz, Rehuël, en Jehus, en Jaëlam, en Korah.","36":"De kinderen van Elifaz waren Theman, en Omar, Zefi, en Gaetham, Kenaz, en Timna, en Amalek.","37":"De kinderen van Rehuël waren Nahath, Zerah, Samma en Mizza.","38":"De kinderen van Seir nu waren Lotan, en Sobal, en Zibeon, en Ana, en Dison, en Ezer, en Disan.","39":"De kinderen van Lotan nu waren Hori en Homam; en de zuster van Lotan was Timna.","40":"De kinderen van Sobal waren Aljan, en Manahath, en Ebal, Sefi en Onam; en de kinderen van Zibeon waren Aja en Ana.","41":"De kinderen van Ana waren Dison; en de zonen van Dison waren Hamram, en Esban, en Jithran, en Cheran.","42":"De kinderen van Ezer waren Bilhan, en Zaavan, en Jaakan. De kinderen van Disan waren Uz en Aran.","43":"Dit nu zijn de koningen, die geregeerd hebben in het land van Edom, eer er een koning regeerde over de kinderen Israëls: Bela, de zoon van Beor; en de naam zijner stad was Dinhaba.","44":"En Bela stierf, en Jobab regeerde in zijn plaats, een zoon van Zerah, van Bozra.","45":"En Jobab stierf, en Husam, uit het land der Themanieten, regeerde in zijn plaats.","46":"En Husam stierf, en Hadad, de zoon van Bedad, regeerde in zijn plaats, die de Midianieten in het veld van Moab versloeg; en de naam zijner stad was Avith.","47":"En Hadad stierf, en Samla, van Masreka, regeerde in zijn plaats.","48":"En Samla stierf, en Saul, van Rehoboth aan de rivier, regeerde in zijn plaats.","49":"En Saul stierf, en Baäl-hanan, de zoon van Achbor, regeerde in zijn plaats.","50":"Als Baäl-hanan stierf, zo regeerde Hadad in zijn plaats, en de naam zijner stad was Pahi, en de naam zijner huisvrouw was Mehetabeel, de dochter van Matred, dochter van Mee-sahab.","51":"Toen Hadad stierf, zo werden vorsten in Edom: de vorst Timna, de vorst Alja, de vorst Jetheth,","52":"De vorst Aholi-bama, de vorst Ela, de vorst Pinon,","53":"De vorst Kenaz, de vorst Theman, de vorst Mibzar,","54":"De vorst Magdiel, de vorst Iram. Dezen waren de vorsten van Edom."},"KJV":{"1":"Adam, Sheth, Enosh,","2":"Kenan, Mahalaleel, Jered,","3":"Henoch, Methuselah, Lamech,","4":"Noah, Shem, Ham, and Japheth.","5":"The sons of Japheth; Gomer, and Magog, and Madai, and Javan, and Tubal, and Meshech, and Tiras.","6":"And the sons of Gomer; Ashchenaz, and Riphath, and Togarmah.","7":"And the sons of Javan; Elishah, and Tarshish, Kittim, and Dodanim.","8":"The sons of Ham; Cush, and Mizraim, Put, and Canaan.","9":"And the sons of Cush; Seba, and Havilah, and Sabta, and Raamah, and Sabtecha. And the sons of Raamah; Sheba, and Dedan.","10":"And Cush begat Nimrod: he began to be mighty upon the earth.","11":"And Mizraim begat Ludim, and Anamim, and Lehabim, and Naphtuhim,","12":"And Pathrusim, and Casluhim, (of whom came the Philistines,) and Caphthorim.","13":"And Canaan begat Zidon his firstborn, and Heth,","14":"The Jebusite also, and the Amorite, and the Girgashite,","15":"And the Hivite, and the Arkite, and the Sinite,","16":"And the Arvadite, and the Zemarite, and the Hamathite.","17":"The sons of Shem; Elam, and Asshur, and Arphaxad, and Lud, and Aram, and Uz, and Hul, and Gether, and Meshech.","18":"And Arphaxad begat Shelah, and Shelah begat Eber.","19":"And unto Eber were born two sons: the name of the one was Peleg; because in his days the earth was divided: and his brother's name was Joktan.","20":"And Joktan begat Almodad, and Sheleph, and Hazarmaveth, and Jerah,","21":"Hadoram also, and Uzal, and Diklah,","22":"And Ebal, and Abimael, and Sheba,","23":"And Ophir, and Havilah, and Jobab. All these were the sons of Joktan.","24":"Shem, Arphaxad, Shelah,","25":"Eber, Peleg, Reu,","26":"Serug, Nahor, Terah,","27":"Abram; the same is Abraham.","28":"The sons of Abraham; Isaac, and Ishmael.","29":"These are their generations: The firstborn of Ishmael, Nebaioth; then Kedar, and Adbeel, and Mibsam,","30":"Mishma, and Dumah, Massa, Hadad, and Tema,","31":"Jetur, Naphish, and Kedemah. These are the sons of Ishmael.","32":"Now the sons of Keturah, Abraham's concubine: she bare Zimran, and Jokshan, and Medan, and Midian, and Ishbak, and Shuah. And the sons of Jokshan; Sheba, and Dedan.","33":"And the sons of Midian; Ephah, and Epher, and Henoch, and Abida, and Eldaah. All these are the sons of Keturah.","34":"And Abraham begat Isaac. The sons of Isaac; Esau and Israel.","35":"The sons of Esau; Eliphaz, Reuel, and Jeush, and Jaalam, and Korah.","36":"The sons of Eliphaz; Teman, and Omar, Zephi, and Gatam, Kenaz, and Timna, and Amalek.","37":"The sons of Reuel; Nahath, Zerah, Shammah, and Mizzah.","38":"And the sons of Seir; Lotan, and Shobal, and Zibeon, and Anah, and Dishon, and Ezer, and Dishan.","39":"And the sons of Lotan; Hori, and Homam: and Timna was Lotan's sister.","40":"The sons of Shobal; Alian, and Manahath, and Ebal, Shephi, and Onam. And the sons of Zibeon; Aiah, and Anah.","41":"The sons of Anah; Dishon. And the sons of Dishon; Amram, and Eshban, and Ithran, and Cheran.","42":"The sons of Ezer; Bilhan, and Zavan, and Jakan. The sons of Dishan; Uz, and Aran.","43":"Now these are the kings that reigned in the land of Edom before any king reigned over the children of Israel; Bela the son of Beor: and the name of his city was Dinhabah.","44":"And when Bela was dead, Jobab the son of Zerah of Bozrah reigned in his stead.","45":"And when Jobab was dead, Husham of the land of the Temanites reigned in his stead.","46":"And when Husham was dead, Hadad the son of Bedad, which smote Midian in the field of Moab, reigned in his stead: and the name of his city was Avith.","47":"And when Hadad was dead, Samlah of Masrekah reigned in his stead.","48":"And when Samlah was dead, Shaul of Rehoboth by the river reigned in his stead.","49":"And when Shaul was dead, Baalhanan the son of Achbor reigned in his stead.","50":"And when Baalhanan was dead, Hadad reigned in his stead: and the name of his city was Pai; and his wife's name was Mehetabel, the daughter of Matred, the daughter of Mezahab.","51":"Hadad died also. And the dukes of Edom were; duke Timnah, duke Aliah, duke Jetheth,","52":"Duke Aholibamah, duke Elah, duke Pinon,","53":"Duke Kenaz, duke Teman, duke Mibzar,","54":"Duke Magdiel, duke Iram. These are the dukes of Edom."}},"tsk":{"1":[{"kopje":"Seth","refs":["Gen 4:25","Gen 4:26","Gen 5:3","Gen 5:8","Luk 3:38"]},{"kopje":"Enos","refs":["Gen 5:9-11","Luk 3:38"]}],"2":[{"kopje":"Kenan","refs":["Gen 5:12-14","Luk 3:37"]},{"kopje":"Mahalal-el","refs":["Gen 5:15-17","Luk 3:37"]},{"kopje":"Jered","refs":["Gen 5:18-20","Luk 3:37"]}],"3":[{"kopje":"Henoch","refs":["Gen 5:21-24","Hebr 11:5","Judas 1:14"]},{"kopje":"Methusalah","refs":["Gen 5:25-27","Luk 3:37"]},{"kopje":"Lamech","refs":["Gen 5:28-31","Luk 3:36"]}],"4":[{"kopje":"Noach","refs":["Gen 5:32","Gen 6:8","Gen 6:9","Gen 7:1","Gen 9:29","Jes 54:9","Jes 54:10","Ezech 14:14","Matt 24:37","Matt 24:38","Luk 3:36","Luk 17:26","Hebr 11:7","2 Petr 2:5"]},{"kopje":"Sem","refs":["Gen 5:32","Gen 6:10","Gen 9:18"]}],"6":[{"kopje":"Askenaz","refs":["Gen 10:3"]}],"7":[{"kopje":"Tharsisa","refs":["Ps 72:10","Jes 66:19"]},{"kopje":"Chittieten","refs":["Num 24:24","Jes 23:1","Jes 23:12","Jer 2:10","Ezech 27:6","Dan 11:30"]}],"8":[{"kopje":"kinderen","refs":["Gen 10:6","Gen 10:7"]},{"kopje":"Put","refs":["Gen 10:6"]}],"9":[{"kopje":"Sabta","refs":["Gen 10:7","Gen 10:7"]}],"12":[{"kopje":"Cafthorieten","refs":["Deut 2:23","Jer 47:4","Amos 9:7"]}],"13":[{"kopje":"Kanaän","refs":["Gen 9:22","Gen 9:25","Gen 9:26","Gen 10:15-19"]},{"kopje":"Heth","refs":["Gen 23:3","Gen 23:5","Gen 23:20","Gen 27:46","Gen 49:30-32","Ex 23:28","Joz 9:1","2 Sam 11:6"]}],"14":[{"kopje":"Jebusieten","refs":["Gen 15:21","Ex 33:2","Ex 34:11","Richt 1:21","Richt 19:11","2 Sam 24:16","Zach 9:7"]},{ abel":null},{"disp":"1 Kron 1:54","href":"../../1-kronieken/1/#v54","ref":"1 Kron 1:54","svLabel":null}],"kinderen":[]}]}]}},"extern":{"Gen 25:24-28":"Toen nu haar dagen vervuld waren om te baren, zie, er waren tweelingen in haar buik. En de eerste kwam uit, rood; hij was helemaal als een harig kleed; daarom noemden zij zijn naam Ezau. En daarna kwam zijn broer uit, wiens hand de hiel van Ezau vasthield; daarom noemde men zijn naam Jakob. En Izak was zestig jaar oud, toen hij hen verwekte.","Gen 11:10-13":"Dit zijn de geboorten van Sem: Sem was honderd jaar oud, en verwekte Arfachsad, twee jaar na de vloed. En Sem leefde, nadat hij Arfachsad verwekt had, vijfhonderd jaar; en hij verwekte zonen en dochters. En Arfachsad leefde vijfendertig jaar, en hij verwekte Selah.","Luk 3:34-38":"de zoon van Jakob, de zoon van Izak, de zoon van Abraham, de zoon van Thara, de zoon van Nachor, de zoon van Saruch, de zoon van Ragau, de zoon van Falek, de zoon van Heber, de zoon van Sala, de zoon van Kaïnan, de zoon van Arfaxad, de zoon van Sem, de zoon van Noach, de zoon van Lamech,","Gen 11:16":"En Heber leefde vierendertig jaar, en verwekte Peleg.","Ps 72:15":"En hij zal leven; en men zal hem geven van het goud van Scheba, en men zal voortdurend voor hem bidden; de hele dag zal men hem zegenen.","Jes 34:6":"Het zwaard van de HEERE is vol bloed, het is vet geworden van vet, van het bloed van de lammeren en de bokken, van het vet van de nieren van de rammen; want de HEERE heeft een offer in Bozra, en een grote slachting in het land van de Edomieten.","Gen 36:24":"En dit zijn de zonen van Zibeon: Aja en Ana; dat is die Ana, die de muildieren in de woestijn gevonden heeft, toen hij de ezels van zijn vader Zibeon weidde.","Matt 1:2":"Abraham verwekte Izak, en Izak verwekte Jakob, en Jakob verwekte Juda en zijn broers;","Gen 36:32":"Bela dan, de zoon van Beor, regeerde in Edom, en de naam van zijn stad was Dinhaba.","Gen 5:3":"En Adam leefde honderdendertig jaren, en verwekte een zoon naar zijn gelijkenis, naar zijn evenbeeld, en noemde zijn naam Seth.","Gen 36:37":"En Samla stierf, en Saul van Rehoboth, aan de rivier, regeerde in zijn plaats.","Jes 23:1":"De last van Tyrus. Huil, u schepen van Tarsis! Want zij is verwoest, zodat er geen huis meer is, zodat niemand er meer in kan gaan; uit het land Chittim is het aan hen bekendgemaakt.","Gen 36:9-43":"Dit nu zijn de geboorten van Ezau, de vader van de Edomieten, op het gebergte van Seïr. Dit zijn de namen van de zonen van Ezau: Elifaz, de zoon van Ada, Ezaus vrouw; Rehuël, de zoon van Basmath, Ezaus vrouw. En de zonen van Elifaz waren: Teman, Omar, Zefo, en Gaetam, en Kenaz.","Joz 24:2":"Toen zei Jozua tegen het hele volk: Zo zegt de HEERE, de God van Israël: Aan de overkant van de rivier hebben uw vaders vanouds gewoond, namelijk Terah, de vader van Abraham, en de vader van Nahor; en zij hebben andere goden gediend.","Ex 3:8":"Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.","Gen 4:26":"En ook aan diezelfde Seth werd een zoon geboren, en hij noemde zijn naam Enos. Toen begon men de Naam van de HEERE aan te roepen.","Gen 27:46":"En Rebekka zei tegen Izak: Ik heb een afkeer van mijn leven vanwege de dochters van Heth! Als Jakob een vrouw neemt van de dochters van Heth, zoals deze zijn, van de dochters van dit land, waartoe zal mij dan het leven zijn?","Gen 16:11":"Ook zei de Engel van de HEERE tegen haar: Zie, u bent zwanger, en zult een zoon baren, en u zult zijn naam Ismaël noemen, omdat de HEERE uw verdrukking gehoord heeft.","Gen 14:1":"En het gebeurde in de dagen van Amrafel, de koning van Sinear, van Arioch, de koning van Ellasar, van Kedor-laomer, de koning van Elam, en van Tideal, de koning van de volken;","Gen 10:11":"Uit dit land is Assur uitgegaan, en heeft Nineve gebouwd, en Rehoboth, Ir, en Kalach.","Ex 23:28":"Ik zal ook horzels voor uw aangezicht zenden; die zullen van voor uw aangezicht wegjagen de Hevieten, de Kanaänieten en de Hethieten.","Gen 10:22":"Sems zonen waren Elam, en Assur, en Arfachsad, en Lud, en Aram.","Gen 6:10":"En Noach verwekte drie zonen: Sem, Cham en Jafeth.","Dan 11:30":"Want er zullen schepen van Chittim tegen hem komen, daarom zal hij door smart getroffen worden, en hij zal terugkeren, en gram worden tegen het heilige verbond, en hij zal het doen; want bij zijn terugkeer zal hij aandacht geven aan hen die het heilige verbond verlaten.","Amos 1:12":"Daarom zal Ik een vuur zenden in Teman, dat zal de paleizen van Bozra verteren.","Jer 49:13":"Want Ik heb bij Mijzelf gezworen, spreekt de HEERE, dat Bozra zal worden tot een ontzetting, tot een smaad, tot een woestheid, en tot een vloek; en al haar steden zullen worden tot eeuwige woestheden.","Hebr 11:11":"Door het geloof heeft ook Sara zelf kracht ontvangen om, ook toen de tijd van haar ouderdom voorbij was, zwanger te worden en te baren; omdat zij Hem trouw achtte, Die het beloofd had.","Gen 25:15":"Hadar en Thema, Jetur, Nafis en Kedma.","Job 6:19":"De reizigers van Thema zien ze, de wandelaars van Scheba wachten op haar.","1 Sam 15:7":"Toen sloeg Saul de Amalekieten van Havila af, tot daar waar u komt bij Sur, dat voor Egypte ligt.","Gen 36:10":"Dit zijn de namen van de zonen van Ezau: Elifaz, de zoon van Ada, Ezaus vrouw; Rehuël, de zoon van Basmath, Ezaus vrouw.","Gen 10:4":"En de zonen van Javan zijn: Elisa, en Tarsis; de Chittieten en Dodanieten.","Gen 36:13":"En dit zijn de zonen van Rehuël: Nahath, en Zerah, Samma en Mizza; dat zijn geweest de zonen van Basmath, Ezaus vrouw.","Jes 21:12":"De wachter zei: De morgenstond is gekomen, en het is nog nacht; als u wilt vragen, vraag; keer terug, kom.","2 Sam 11:6":"Toen zond David naar Joab en zei: Stuur Uria, de Hethiet, naar mij. En Joab stuurde Uria naar David.","Gen 9:24":"En Noach ontwaakte uit zijn roes, en merkte wat zijn jongste zoon hem had aangedaan.","Gen 16:11-16":"Ook zei de Engel van de HEERE tegen haar: Zie, u bent zwanger, en zult een zoon baren, en u zult zijn naam Ismaël noemen, omdat de HEERE uw verdrukking gehoord heeft. En hij zal een woudezel van een mens zijn; zijn hand zal tegen allen zijn, en de hand van allen tegen hem; en hij zal wonen voor het aangezicht van al zijn broeders. En zij noemde de Naam van de HEERE, Die tot haar sprak: U bent de God van het aanzien! want zij zei: Heb ik ook hier gezien naar Hem, Die mij aanziet?","Jer 49:7":"Tegen Edom zegt de HEERE van de heerscharen zo: Is er dan geen wijsheid meer te Theman? Is de raad vergaan van de verstandigen? Is hun wijsheid onnut geworden?","Gen 36:36":"En Hadad stierf, en Samla, van Masreka, regeerde in zijn plaats.","Micha 2:12":"Zeker zal Ik u, o Jakob, geheel verzamelen; zeker zal Ik het overblijfsel van Israël bijeenbrengen; Ik zal het samen bijeenzetten als schapen van Bozra; als een kudde in het midden van haar kooi zullen zij dreunen van de mensenmenigte.","Gen 25:2":"En zij baarde hem Zimran en Joksan, en Medan en Midian, en Jisbak en Suah.","Joz 24:4":"En aan Izak gaf Ik Jakob en Ezau; en Ik gaf aan Ezau het gebergte Seïr, om dat te bezitten; maar Jakob en zijn kinderen trokken naar Egypte.","1 Kon 10:11":"Verder brachten ook de schepen van Hiram, die goud uit Ofir haalden, uit Ofir zeer veel almuggimhout en kostbaar gesteente.","Gen 5:8":"Zo waren al de dagen van Seth negenhonderdentwaalf jaren; en hij stierf.","Jes 13:12":"Ik zal maken dat een man kostbaarder zal zijn dan zuiver goud, en een mens dan fijn goud van Ofir.","Gen 10:8":"En Cusch verwekte Nimrod; deze begon geweldig te zijn op de aarde.","Gen 36:15-43":"Dit zijn de vorsten onder de zonen van Ezau: de zonen van Elifaz, de eerstgeborene van Ezau, waren: vorst Teman, vorst Omar, vorst Zefo, vorst Kenaz. Vorst Korah, vorst Gaetam, vorst Amalek; dat zijn de vorsten van Elifaz in het land Edom; dat zijn de zonen van Ada. En dit zijn de zonen van Rehuël, de zoon van Ezau: vorst Nahath, vorst Zerah, vorst Samma, vorst Mizza; dat zijn de vorsten van Rehuël in het land Edom; dat zijn de zonen van Basmath, de vrouw van Ezau.","Luk 3:38":"de zoon van Enos, de zoon van Seth, de zoon van Adam, de zoon van God.","Gen 10:16":"En de Jebusiet, en de Amoriet, en de Girgasiet,","1 Kron 1:32-34":"De kinderen nu van Ketura, Abrahams bijvrouw: zij baarde Zimram, en Joksan, en Medan, en Midian, en Isbak, en Suah. En de kinderen van Joksan waren Scheba en Dedan. De kinderen van Midian nu waren Efa, en Efer, en Henoch, en Abida, en Eldaä. Die allen waren zonen van Ketura. Abraham verwekte Izak. De zonen van Izak waren Ezau en Israël.","Gen 10:2-5":"De zonen van Jafeth zijn: Gomer, en Magog, en Madai, en Javan, en Tubal, en Mesech, en Thiras. En de zonen van Gomer zijn: Askenaz, en Rifath, en Togarma. En de zonen van Javan zijn: Elisa, en Tarsis; de Chittieten en Dodanieten.","Gen 10:21-25":"Verder zijn er aan Sem zonen geboren; hijzelf is ook de vader van alle zonen van Heber, broer van Jafeth, de oudste. Sems zonen waren Elam, en Assur, en Arfachsad, en Lud, en Aram. En Arams zonen waren Uz, en Hul, en Gether, en Maz.","Gen 32:28":"Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.","Gen 23:3":"Daarna stond Abraham op van bij zijn dode, en hij sprak tot de zonen van Heth en zei:","Gen 10:13":"En Mitsraïm verwekte de Ludieten, en de Anamieten, en de Lehabieten, en de Naftuchieten,","Gen 25:1-4":"En Abraham ging verder, en nam een vrouw, wier naam Ketura was. En zij baarde hem Zimran en Joksan, en Medan en Midian, en Jisbak en Suah. En Joksan verwekte Seba en Dedan; en de zonen van Dedan waren de Assurieten, en Letusieten, en Leummieten.","Gen 36:40":"En dit zijn de namen van de vorsten van Ezau, naar hun geslachten, naar hun plaatsen, met hun namen: vorst Timna, vorst Alva, vorst Jetheth,","Gen 36:33":"En Bela stierf, en Jobab, de zoon van Zerah, uit Bozra, regeerde in zijn plaats.","Gen 6:8":"Maar Noach vond genade in de ogen van de HEERE.","Gen 11:14":"En Selah leefde dertig jaar, en hij verwekte Heber.","Gen 21:1-8":"En de HEERE bezocht Sara, zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had. En Sara werd zwanger, en baarde Abraham een zoon in zijn ouderdom, op de vastgestelde tijd die God hem gezegd had. En Abraham noemde de naam van zijn zoon die hem geboren was, die Sara hem gebaard had, Izak.","Gen 17:15-19":"Verder zei God tegen Abraham: Wat de naam van uw vrouw Sarai betreft, u zult haar niet meer Sarai noemen; maar haar naam zal Sara zijn. Want Ik zal haar zegenen, en u ook uit haar een zoon geven; ja, Ik zal haar zegenen, zodat zij tot volken wordt: koningen van volken zullen uit haar voortkomen! Toen viel Abraham op zijn aangezicht, en hij lachte; en hij zei in zijn hart: Zal aan iemand die honderd jaar oud is een kind geboren worden; en zal Sara, die negentig jaar oud is, baren?","Gen 10:3":"En de zonen van Gomer zijn: Askenaz, en Rifath, en Togarma.","Gen 5:12-14":"En Kenan leefde zeventig jaren, en hij verwekte Mahalal-el. En Kenan leefde, nadat hij Mahalal-el verwekt had, achthonderdenveertig jaren; en hij verwekte zonen en dochters. Zo waren al de dagen van Kenan negenhonderdentien jaren; en hij stierf.","Gen 11:16-19":"En Heber leefde vierendertig jaar, en verwekte Peleg. En Heber leefde, nadat hij Peleg verwekt had, vierhonderd en dertig jaar; en hij verwekte zonen en dochters. En Peleg leefde dertig jaar, en hij verwekte Rehu.","Gen 23:10":"Efron nu zat in het midden van de zonen van Heth; en Efron de Hethiet antwoordde Abraham, ten aanhoren van de zonen van Heth, van allen die door de poort van zijn stad naar binnen gingen, en zei:","Gen 49:32":"De akker, en de spelonk die daarin is, is gekocht van de zonen van Heth.","Ps 72:10":"De koningen van Tharsis en de eilanden zullen geschenken aanbrengen; de koningen van Scheba en Seba zullen vereringen toevoeren.","Gen 48:22":"En ik heb u één stuk land gegeven, boven uw broers; dat ik met mijn zwaard en met mijn boog uit de hand van de Amorieten genomen heb.","Joz 24:3":"Toen nam Ik uw vader Abraham van de overkant van de rivier, en liet hem door heel het land Kanaän trekken; Ik vermeerderde ook zijn nageslacht en gaf hem Izak.","Gen 36:28":"Dit zijn de zonen van Disan: Uz en Aran.","Ezech 27:8":"De inwoners van Sidon en Arvad waren uw roeiers; uw wijzen, o Tyrus! die in u waren, die waren uw schippers.","1 Kron 1:17-54":"De kinderen van Sem waren Elam, en Assur, en Arfachsad, en Lud, en Aram, en Uz, en Hul, en Gether, en Mesech. Arfachsad verwekte Selah, en Selah verwekte Heber. Aan Heber nu zijn twee zonen geboren; de naam van de één was Peleg, omdat in zijn dagen de aarde verdeeld is, en de naam van zijn broer was Joktan.","Jes 21:2":"Een hard visioen is mij bekendgemaakt: die trouweloze handelt trouweloos, en die verwoester verwoest; trek op, o Elam! beleger het, o Media! Ik heb al haar gezucht doen ophouden.","Gen 16:16":"En Abram was zesentachtig jaar oud, toen Hagar Ismaël aan Abram baarde.","Amos 2:1":"Zo zegt de HEERE: Om drie overtredingen van Moab, en om vier zal Ik dat niet afwenden; omdat hij de beenderen van de koning van Edom tot kalk verbrand heeft.","Jes 66:19":"En Ik zal een teken bij hen zetten, en uit hen die ontkomen zijn, zal Ik zenden naar de heidenen, naar Tarsis, Pul en Lud, de boogschutters, naar Tubal en Javan, naar de ver gelegen eilanden, die Mijn faam niet gehoord en Mijn heerlijkheid niet gezien hebben; en zij zullen Mijn heerlijkheid onder de heidenen verkondigen.","Gen 10:9":"Hij was een geweldig jager voor het aangezicht van de HEERE; daarom wordt gezegd: Net als Nimrod, een geweldig jager voor het aangezicht van de HEERE.","Gen 36:39":"En Baäl-Hanan, de zoon van Achbor, stierf, en Hadar regeerde in zijn plaats; en de naam van zijn stad was Pahu; en de naam van zijn vrouw was Mechetabeël, een dochter van Matred, de dochter van Me-Zahab.","Gen 36:35":"En Husam stierf, en in zijn plaats regeerde Hadad, de zoon van Bedad, die Midian versloeg in het veld van Moab; en de naam van zijn stad was Avith.","Gen 49:30-32":"In de spelonk die op de akker van Machpela is, die tegenover Mamre is, in het land Kanaän, die Abraham met die akker gekocht heeft van Efron, de Hethiet, tot een erfbegrafenis. Daar hebben zij Abraham begraven, en Sara, zijn vrouw; daar hebben zij Izak begraven, en Rebekka, zijn vrouw; en daar heb ik Lea begraven. De akker, en de spelonk die daarin is, is gekocht van de zonen van Heth.","Gal 4:28":"Maar wij, broeders, zijn kinderen van de belofte, zoals Izak was.","Gen 9:29":"Zo waren al de dagen van Noach negenhonderdvijftig jaren; en hij stierf.","Jes 54:9":"Want dat zal Mij zijn als de wateren van Noach, toen Ik zwoer dat de wateren van Noach niet meer over de aarde zouden gaan; zo heb Ik gezworen dat Ik niet meer op u toornen, of u bestraffen zal.","Gen 10:21-31":"Verder zijn er aan Sem zonen geboren; hijzelf is ook de vader van alle zonen van Heber, broer van Jafeth, de oudste. Sems zonen waren Elam, en Assur, en Arfachsad, en Lud, en Aram. En Arams zonen waren Uz, en Hul, en Gether, en Maz.","Jer 2:10":"Want ga over naar de eilanden van de Chittiërs, en zie toe, en zend naar Kedar, en let er goed op; en zie, of zoiets is gebeurd?","Gen 10:18":"En de Arvadiet, en de Tsemariet, en de Hamathiet; en daarna zijn de huisgezinnen van de Kanaänieten verspreid.","Dan 8:2":"En ik zag een gezicht, (het gebeurde nu, toen ik het zag, dat ik in de burcht Susan was, die in het landschap Elam is) ik zag dan in een gezicht dat ik aan de rivier de Ulai was.","Gen 36:21":"En Dison, en Ezer, en Disan; dat zijn de vorsten van de Horieten, zonen van Seïr, in het land van Edom.","Ezech 27:23":"Haran, en Kanne, en Eden, de kooplieden van Scheba, Assur en Kilmad, handelden met u.","2 Sam 21:2":"Toen riep de koning de Gibeonieten, en zei tegen hen: (De Gibeonieten nu waren niet van de kinderen van Israël, maar van het overblijfsel van de Amorieten; en de kinderen van Israël hadden hun gezworen, maar Saul zocht hen te doden in zijn ijver voor de kinderen van Israël en Juda.)","Ex 13:5":"En het zal gebeuren, als de HEERE u in het land van de Kanaänieten, de Hethieten, de Amorieten, de Hevieten en de Jebusieten gebracht zal hebben, dat Hij uw vaderen gezworen heeft u te geven, een land dat overvloeit van melk en honing; dan moet u deze dienst houden in deze maand.","Gen 21:3":"En Abraham noemde de naam van zijn zoon die hem geboren was, die Sara hem gebaard had, Izak.","Jes 63:1":"Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen.","Joz 3:10":"Verder zei Jozua: Hieraan zult u weten dat de levende God in uw midden is, en dat Hij helemaal voor uw aangezicht zal verdrijven de Kanaänieten, en de Hethieten, en de Hevieten, en de Ferezieten, en de Girgazieten, en de Amorieten en de Jebusieten.","Gen 25:24-26":"Toen nu haar dagen vervuld waren om te baren, zie, er waren tweelingen in haar buik. En de eerste kwam uit, rood; hij was helemaal als een harig kleed; daarom noemden zij zijn naam Ezau. En daarna kwam zijn broer uit, wiens hand de hiel van Ezau vasthield; daarom noemde men zijn naam Jakob. En Izak was zestig jaar oud, toen hij hen verwekte.","Gen 7:13":"Op diezelfde dag ging Noach, en Sem, en Cham, en Jafeth, de zonen van Noach, evenals ook de vrouw van Noach, en de drie vrouwen van zijn zonen met hem in de ark;","Gen 36:5":"En Aholibama baarde Jehus, en Jaëlam, en Korah. Dit zijn de zonen van Ezau, die hem geboren zijn in het land Kanaän.","Mal 1:2-4":"Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad, en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn. Ofschoon Edom zei: Wij zijn arm geworden, maar wij zullen de verwoeste plaatsen weer opbouwen; zo zegt de HEERE van de heerscharen: Zullen zij bouwen, dan zal Ik afbreken; en men zal hen noemen: Gebied van de goddeloosheid, en een volk, op wie de HEERE toornig is tot in eeuwigheid.","Gen 25:12-18":"Dit nu zijn de geboorten van Ismaël, de zoon van Abraham, die Hagar, de Egyptische, dienstmaagd van Sara, Abraham gebaard heeft. En dit zijn de namen van de zonen van Ismaël, met hun namen naar hun geboorten. De eerstgeborene van Ismaël, Nebajoth; daarna Kedar, en Adbeël, en Mibsam, En Misma, en Duma, en Massa,","Jes 60:7":"Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen op Mijn altaar komen, en Ik zal het huis van Mijn heerlijkheid heerlijk maken.","Jes 22:6":"Want Elam heeft de pijlkoker genomen, de man is op de wagen, er zijn ruiters; en Kir ontbloot het schild.","Gen 25:1":"En Abraham ging verder, en nam een vrouw, wier naam Ketura was.","Num 24:24":"En de schepen van de kust van de Chitteeërs zullen Assur plagen, zij zullen ook Heber plagen; en ook hij zal voor altijd ten verderve zijn.","Jer 25:23":"Dedan, en Tema, en Buz, en allen, die aan de hoeken kortgeschoren zijn;","Gen 17:5":"En uw naam zal niet meer Abram genoemd worden; maar uw naam zal Abraham zijn; want Ik heb u tot een vader van een menigte volken gemaakt.","Gen 36:11":"En de zonen van Elifaz waren: Teman, Omar, Zefo, en Gaetam, en Kenaz.","Gen 36:4":"Ada nu baarde aan Ezau Elifaz, en Basmath baarde Rehuël.","Num 25:6":"En zie, een man uit de kinderen van Israël kwam, en bracht een Midianietische vrouw naar zijn broeders, voor de ogen van Mozes en voor de ogen van de hele vergadering van de kinderen van Israël, terwijl zij weenden voor de deur van de tent van de samenkomst.","Gen 23:18":"Tot een bezitting, voor de ogen van de zonen van Heth, bij allen die de poort van zijn stad binnengingen.","Gen 10:25":"En aan Heber werden twee zonen geboren; de naam van de één was Peleg, want in zijn dagen is de aarde verdeeld; en de naam van zijn broer was Joktan.","Gen 36:41":"Vorst Aholibama, vorst Ela, vorst Pinon,","1 Kron 1:8-10":"De kinderen van Cham waren Cusch en Mitsraïm, Put, en Kanaän. En de kinderen van Cusch waren Seba, en Havila, en Sabta, en Raema, en Sabtecha; en de kinderen van Raema waren Scheba en Dedan. Cusch verwekte Nimrod; die begon geweldig te worden op aarde.","Jer 47:4":"Vanwege de dag die eraan komt om alle Filistijnen te verstoren, om Tyrus en Sidon alle overgebleven helper af te snijden; want de HEERE zal de Filistijnen, het overblijfsel van het eiland Kafthor, verstoren.","2 Sam 24:16":"Toen nu de engel zijn hand uitstrekte over Jeruzalem om haar te verderven, kreeg de HEERE berouw over dat kwaad, en Hij zei tegen de engel die het verderf onder het volk aanrichtte: Het is genoeg, trek uw hand nu terug. De engel van de HEERE was nu bij de dorsvloer van Arauna, de Jebusiet.","Gen 36:9":"Dit nu zijn de geboorten van Ezau, de vader van de Edomieten, op het gebergte van Seïr.","Matt 24:37":"En zoals de dagen van Noach waren, zo zal ook de komst van de Zoon des mensen zijn.","Job 2:11":"Toen de drie vrienden van Job al dit kwaad hoorden dat over hem gekomen was, kwamen zij, ieder uit zijn eigen plaats: Elifaz, de Themaniet, en Bildad, de Suhiet, en Zofar, de Naämathiet; en zij waren het samen eens geworden dat zij zouden komen om hem te beklagen en om hem te troosten.","Gen 37:28":"Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.","Gen 5:20":"Zo waren al de dagen van Jered negenhonderdtweeënzestig jaren; en hij stierf.","Gen 10:22-32":"Sems zonen waren Elam, en Assur, en Arfachsad, en Lud, en Aram. En Arams zonen waren Uz, en Hul, en Gether, en Maz. En Arfachsad verwekte Selah, en Selah verwekte Heber.","Gen 11:20-23":"En Rehu leefde tweeëndertig jaar, en hij verwekte Serug. En Rehu leefde, nadat hij Serug verwekt had, tweehonderd en zeven jaar; en hij verwekte zonen en dochters. En Serug leefde dertig jaar, en verwekte Nahor.","Gen 23:7":"Toen stond Abraham op, en boog zich neer voor het volk van het land, voor de zonen van Heth;","Gen 36:10-16":"Dit zijn de namen van de zonen van Ezau: Elifaz, de zoon van Ada, Ezaus vrouw; Rehuël, de zoon van Basmath, Ezaus vrouw. En de zonen van Elifaz waren: Teman, Omar, Zefo, en Gaetam, en Kenaz. En Timna was een bijvrouw van Elifaz, de zoon van Ezau, en zij baarde aan Elifaz Amalek; dit zijn de zonen van Ada, Ezaus vrouw.","Gen 9:18":"En de zonen van Noach die uit de ark gingen, waren Sem, en Cham, en Jafeth; en Cham is de vader van Kanaän.","Gen 7:1":"Daarna zei de HEERE tegen Noach: Ga u, en heel uw huis in de ark; want u heb Ik gezien als rechtvaardige voor Mijn aangezicht in dit geslacht.","Gen 10:6-8":"En de zonen van Cham zijn: Cusch en Mitsraïm, en Put, en Kanaän. En de zonen van Cusch zijn: Seba en Havila, en Sabta, en Raema, en Sabtecha. En de zonen van Raema zijn: Scheba en Dedan. En Cusch verwekte Nimrod; deze begon geweldig te zijn op de aarde.","1 Kron 2:23":"En hij nam Gesur en Aram, met de vlekken van Jaïr, van hen, met Kenath en haar onderhorige plaatsen, zestig steden. Deze allen zijn zonen van Machir, de vader van Gilead.","Gen 5:18-20":"En Jered leefde honderdtweeënzestig jaren, en hij verwekte Henoch. En Jered leefde, nadat hij Henoch verwekt had, achthonderd jaren; en hij verwekte zonen en dochters. Zo waren al de dagen van Jered negenhonderdtweeënzestig jaren; en hij stierf.","Gen 25:12-16":"Dit nu zijn de geboorten van Ismaël, de zoon van Abraham, die Hagar, de Egyptische, dienstmaagd van Sara, Abraham gebaard heeft. En dit zijn de namen van de zonen van Ismaël, met hun namen naar hun geboorten. De eerstgeborene van Ismaël, Nebajoth; daarna Kedar, en Adbeël, en Mibsam, En Misma, en Duma, en Massa,","Num 23:7":"Toen begon hij zijn spreuk, en zei: Uit Syrië heeft Balak, de koning van de Moabieten, mij laten halen, van het gebergte in het oosten, en zei: Kom, vervloek Jakob voor mij, en kom, scheld Israël uit!","Gen 16:3":"Zo nam Sarai, Abrams vrouw, de Egyptische Hagar, haar dienstmaagd, na tien jaar dat Abram in het land Kanaän gewoond had, en zij gaf haar aan Abram, haar man, hem tot een vrouw.","Ezech 27:11":"De kinderen van Arvad en uw leger waren rondom op uw muren, en de Gammadieten waren op uw torens; hun schilden hingen zij rondom aan uw muren; die maakten uw schoonheid volkomen.","Ezech 32:24":"Daar is Elam met haar hele menigte rondom haar graf; zij zijn allen verslagen, de gevallenen door het zwaard, die onbesneden zijn neergedaald tot de onderste plaatsen van de aarde, die hun schrik hadden gegeven in het land van de levenden; nu dragen zij hun schande met hen die in het kuil zijn neergedaald.","Gen 25:18":"En zij woonden van Havila tot Sur toe, dat tegenover Egypte ligt, in de richting van Assur; hij heeft zich neergeslagen tegenover al zijn broers.","Gen 9:26":"Vervolgens zei hij: Gezegend zij de HEERE, de God van Sem; en Kanaän zal hem een knecht zijn!","Gen 5:32":"En Noach was vijfhonderd jaren oud; en Noach verwekte Sem, Cham en Jafeth.","1 Kron 1:51-54":"Toen Hadad stierf, werden er vorsten in Edom: de vorst Timna, de vorst Alja, de vorst Jetheth, De vorst Aholibama, de vorst Ela, de vorst Pinon, De vorst Kenaz, de vorst Theman, de vorst Mibzar,","1 Kron 1:1-4":"Adam, Seth, Enos, Kenan, Mahalal-el, Jered, Henoch, Methusalah, Lamech,","1 Kron 5:19":"En zij voerden oorlog tegen de Hagarenen, en tegen Jethur, en Nafis, en Nodab.","Jes 11:11":"Want het zal gebeuren op die dag, dat de Heere voor de tweede keer Zijn hand zal aanleggen om het overblijfsel van Zijn volk terug te verwerven, dat overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden van de zee.","Gen 23:16":"En Abraham luisterde naar Efron; en Abraham woog Efron het geld af, waarover hij gesproken had ten aanhoren van de zonen van Heth, vierhonderd sikkel van het zilver, gangbaar bij de koopman.","Gen 36:34":"En Jobab stierf, en Husam, uit het land van de Temanieten, regeerde in zijn plaats.","Gen 5:15-17":"En Mahalal-el leefde vijfenzestig jaren, en hij verwekte Jered. En Mahalal-el leefde, nadat hij Jered verwekt had, achthonderdendertig jaren; en hij verwekte zonen en dochters. Zo waren al de dagen van Mahalal-el achthonderdvijfennegentig jaren; en hij stierf.","Gen 5:15":"En Mahalal-el leefde vijfenzestig jaren, en hij verwekte Jered.","Hoogl 1:5":"Ik ben zwart, doch liefelijk, jullie dochters van Jeruzalem, zoals de tenten van Kedar, zoals de gordijnen van Salomo.","Gen 36:17":"En dit zijn de zonen van Rehuël, de zoon van Ezau: vorst Nahath, vorst Zerah, vorst Samma, vorst Mizza; dat zijn de vorsten van Rehuël in het land Edom; dat zijn de zonen van Basmath, de vrouw van Ezau.","Gen 5:28-31":"En Lamech leefde honderdtweeëntachtig jaren, en hij verwekte een zoon. En hij noemde zijn naam Noach, en zei: Deze zal ons troosten over ons werk en over de smart van onze handen, vanwege het aardrijk, dat de HEERE vervloekt heeft! En Lamech leefde, nadat hij Noach verwekt had, vijfhonderdvijfennegentig jaren; en hij verwekte zonen en dochters.","Gen 36:31-39":"En dit zijn de koningen die geregeerd hebben in het land Edom, voordat er een koning regeerde over de kinderen van Israël. Bela dan, de zoon van Beor, regeerde in Edom, en de naam van zijn stad was Dinhaba. En Bela stierf, en Jobab, de zoon van Zerah, uit Bozra, regeerde in zijn plaats.","Gen 25:14":"En Misma, en Duma, en Massa,","Neh 9:8":"En U hebt zijn hart getrouw gevonden voor Uw aangezicht, en hebt een verbond met hem gemaakt, dat U zou geven het land van de Kanaänieten, de Hethieten, de Amorieten, en de Ferezieten, en de Jebusieten, en de Girgasieten, dat U het aan zijn nageslacht zou geven; en U hebt Uw woorden bevestigd, omdat U rechtvaardig bent.","Richt 19:11":"Toen zij nu bij Jebus waren, was de dag ver gedaald; en de knecht zei tegen zijn heer: Kom toch, laten we naar deze stad van de Jebusieten gaan, en daarin overnachten.","1 Kon 8:65":"Op diezelfde tijd hield Salomo ook het feest, en heel Israël met hem, een grote gemeente, vanaf de ingang van Hamath tot de rivier van Egypte, voor het aangezicht van de HEERE, onze God, zeven dagen en zeven dagen, dat is veertien dagen.","Ex 3:17":"Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.","Gen 5:16":"En Mahalal-el leefde, nadat hij Jered verwekt had, achthonderdendertig jaren; en hij verwekte zonen en dochters.","1 Kron 1:5-7":"De kinderen van Jafeth waren Gomer, en Magog, en Madai, en Javan, en Tubal, en Mesech, en Tiras. En de kinderen van Gomer waren Askenaz, en Difath, en Thogarma. En de kinderen van Javan waren Elisa en Tharsisa, de Chittieten en Dodanieten.","Ezech 14:14":"Ofschoon deze drie mannen, Noach, Daniël en Job, in het midden daarvan zouden zijn, zouden zij door hun gerechtigheid alleen hun eigen ziel bevrijden, spreekt de Heere HEERE.","Ezech 32:29":"Daar is Edom, haar koningen en al haar vorsten, die met hun macht gelegd zijn bij de verslagenen van het zwaard; die liggen met de onbesnedenen en met hen die in het kuil zijn neergedaald.","Deut 10:6":"(En de kinderen van Israël reisden van Beeroth-Bene-jaakan naar Mosera. Daar stierf Aäron, en werd daar begraven; en zijn zoon Eleazar bediende het priesterambt in zijn plaats.","Gen 25:13":"En dit zijn de namen van de zonen van Ismaël, met hun namen naar hun geboorten. De eerstgeborene van Ismaël, Nebajoth; daarna Kedar, en Adbeël, en Mibsam,","Hab 3:3":"God kwam van Theman, en de Heilig aren Seba, en Havila, en Sabta, en Raema, en Sabtecha; en de kinderen van Raema waren Scheba en Dedan. Cusch verwekte Nimrod; die begon geweldig te worden op aarde.","Gen 5:9-11":"En Enos leefde negentig jaren, en hij verwekte Kenan. En Enos leefde, nadat hij Kenan verwekt had, achthonderdenvijftien jaren; en hij verwekte zonen en dochters. Zo waren al de dagen van Enos negenhonderdenvijf jaren; en hij stierf.","Hebr 11:7":"Door het geloof heeft Noach, door God gewaarschuwd over de dingen die nog niet gezien werden, en bevreesd geworden, de ark gebouwd tot redding van zijn huisgezin; door dit geloof heeft hij de wereld veroordeeld, en is hij een erfgenaam geworden van de rechtvaardigheid die naar het geloof is.","Ex 33:2":"En Ik zal een Engel voor uw aangezicht zenden (en Ik zal uitdrijven de Kanaänieten, de Amorieten, en de Hethieten, en de Ferezieten, de Hevieten, en de Jebusieten),","Ezech 27:20":"Dedan handelde met u met kostbaar gewaad voor wagens.","Gen 4:25":"En Adam had opnieuw gemeenschap met zijn vrouw, en zij baarde een zoon, en zij noemde zijn naam Seth; want God heeft mij, zei zij, een ander nageslacht gegeven in de plaats van Abel; want Kaïn heeft hem doodgeslagen.","Gen 25:3":"En Joksan verwekte Seba en Dedan; en de zonen van Dedan waren de Assurieten, en Letusieten, en Leummieten.","Deut 2:12":"Ook woonden de Horieten hiervoor in Seir; maar de kinderen van Ezau verdreven hen uit hun bezit en verdelgden hen van voor hun aangezicht, en hebben in hun plaats gewoond; zoals Israël gedaan heeft met het land van zijn erfenis, dat de HEERE hun gegeven heeft.","Gen 25:13-15":"En dit zijn de namen van de zonen van Ismaël, met hun namen naar hun geboorten. De eerstgeborene van Ismaël, Nebajoth; daarna Kedar, en Adbeël, en Mibsam, En Misma, en Duma, en Massa, Hadar en Thema, Jetur, Nafis en Kedma.","Hebr 11:5":"Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming  dan verslaan, of uit het land verdrijven; want ik weet dat wie u zegent, gezegend is, en wie u vervloekt, vervloekt is.","Amos 2:9":"Ik heb daarentegen de Amoriet voor hun aangezicht verdelgd, wiens hoogte was als de hoogte van de ceders, en hij was sterk als de eiken; maar Ik heb zijn vrucht van boven, en zijn wortels van beneden verdelgd.","Ezech 25:13":"Daarom, zo zegt de Heere HEERE: Ik zal ook Mijn hand uitstrekken tegen Edom, en Ik zal mens en dier uit haar uitroeien; en Ik zal haar tot een woestenij maken, vanaf Teman; en zij zullen tot Dedan toe door het zwaard vallen.","Gen 5:25-27":"En Methusalach leefde honderdzevenentachtig jaren, en hij verwekte Lamech. En Methusalach leefde, nadat hij Lamech verwekt had, zevenhonderdtweeëntachtig jaren; en hij verwekte zonen en dochters. Zo waren al de dagen van Methusalach negenhonderdnegenenzestig jaren; en hij stierf.","Ezech 27:6":"Zij hebben uw riemen uit eiken van Basan gemaakt; uw dekken hebben zij gemaakt van welbewerkt ivoor, uit de eilanden van de Chittieten.","Luk 3:36":"de zoon van Kaïnan, de zoon van Arfaxad, de zoon van Sem, de zoon van Noach, de zoon van Lamech,","Gen 10:27":"En Hadoram, en Usal, en Dikla,","Ex 34:11":"Onderhoud u wat Ik u heden gebied! Zie, Ik zal voor uw aangezicht uitdrijven de Amorieten, en de Kanaänieten, en de Hethieten, en de Ferezieten, en de Hevieten, en de Jebusieten.","Num 24:17-19":"Ik zal hem zien, maar nu niet; ik zal hem aanschouwen, maar niet van dichtbij. Er zal een ster voortkomen uit Jakob, en er zal een scepter uit Israël opkomen; die zal de gebieden van de Moabieten verslaan, en al de kinderen van Seth verstoren. En Edom zal een erfelijk bezit zijn; en Seir zal voor zijn vijanden een erfelijk bezit zijn; doch Israël zal met kracht handelen. En er zal iemand uit Jakob heersen, en hij zal de overigen uit de steden ombrengen.","Deut 2:23":"Ook hebben de Kafthorieten, die uit Kafthor weggetrokken waren, de Avieten, die in Hazerim tot Gaza toe woonden, verdelgd, en in hun plaats gewoond.","Jes 54:10":"Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.","Gen 25:19-26":"Dit nu zijn de geboorten van Izak, de zoon van Abraham: Abraham verwekte Izak. En Izak was veertig jaar oud, toen hij Rebekka, de dochter van Bethuel, de Syriër, uit Paddan-Aram, de zuster van Laban, de Syriër, tot vrouw nam. En Izak bad de HEERE vurig voor zijn vrouw; want zij was onvruchtbaar; en de HEERE liet Zich door hem verbidden, zodat Rebekka, zijn vrouw, zwanger werd.","1 Kron 1:35-54":"En de kinderen van Ezau: Elifaz, Rehuël, en Jehus, en Jaëlam, en Korah. De kinderen van Elifaz waren Theman, en Omar, Zefi, en Gaetham, Kenaz, en Timna, en Amalek. De kinderen van Rehuël waren Nahath, Zerah, Samma en Mizza.","1 Kron 1:28-31":"De kinderen van Abraham waren Izak en Ismaël. Dit zijn hun geboorten: de eerstgeborene van Ismaël was Nebajoth, en Kedar, en Adbeel, en Mibsam, Misma en Duma, Massa, Hadad en Thema,","Gen 10:15":"En Kanaän verwekte Sidon, zijn eerstgeborene, en Heth,","Amos 9:7":"Bent u voor Mij niet als de kinderen van de Moren, o kinderen van Israël? spreekt de HEERE. Heb Ik Israël niet opgevoerd uit het land Egypte, en de Filistijnen uit Kafthor, en de Syriërs uit Kir?","Deut 20:17":"Maar u zult ze helemaal verbannen: de Hethieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, de Hevieten, en de Jebusieten, zoals de HEERE, uw God, u geboden heeft;","Num 20:14":"Daarna zond Mozes boden uit Kades tot de koning van Edom, die zeiden: Zo zegt uw broeder Israël: U weet al de moeite, die ons overkomen is;","Rom 9:10-13":"En niet alleen dit, maar ook Rebekka is daar een bewijs van, toen zij zwanger was van één man, namelijk Izaak, onze vader. Want toen de kinderen nog niet geboren waren, en nog niets goeds of kwaads gedaan hadden, opdat het voornemen van God, dat volgens de verkiezing is, vast zou blijven, niet uit de werken, maar uit Hem Die roept, werd tot haar gezegd: De oudste zal de jongste dienen.","Gen 36:23":"En dit zijn de zonen van Sobal: Alvan en Manahath, en Ebal, en Sefo, en Onam.","Gen 25:6":"Maar aan de zonen van de bijvrouwen die Abraham had, gaf Abraham geschenken; en zond hen weg van zijn zoon Izak, terwijl hij nog leefde, oostwaarts naar het land van het Oosten.","Gen 36:27":"Dit zijn de zonen van Ezer: Bilhan, en Zaävan, en Akan.","Gen 4:16-22":"En Kaïn ging weg van het aangezicht van de HEERE; en hij woonde in het land Nod, ten oosten van Eden. En Kaïn had gemeenschap met zijn vrouw, en zij werd zwanger en baarde Henoch; en hij bouwde een stad, en noemde de naam van die stad naar de naam van zijn zoon, Henoch. En aan Henoch werd Hirad geboren; en Hirad verwekte Mechujaël; en Mechujaël verwekte Methusael; en Methusael verwekte Lamech.","Gen 36:14":"En dit zijn geweest de zonen van Aholibama, dochter van Ana, dochter van Zibeon, Ezaus vrouw; en zij baarde aan Ezau Jehus, en Jaëlam, en Korah.","1 Kon 10:1":"En toen de koningin van Scheba het gerucht van Salomo hoorde, aangaande de Naam van de HEERE, kwam zij om hem met raadsels te toetsen.","1 Kon 9:28":"En zij kwamen te Ofir, en haalden daar goud vandaan, vierhonderdtwintig talenten, en brachten het naar de koning Salomo.","Jer 25:25":"En alle koningen van Zimri, en alle koningen van Elam, en alle koningen van Medië;","Gen 10:23":"En Arams zonen waren Uz, en Hul, en Gether, en Maz.","Jes 21:13":"De last tegen Arabië. In het woud van Arabië zult u overnachten, o reizende karavanen van Dedanieten!","Ps 83:9":"Ook heeft Assur zich bij hen gevoegd; zij zijn de kinderen van Lot tot steun geweest. Sela.","Gen 5:19":"En Jered leefde, nadat hij Henoch verwekt had, achthonderd jaren; en hij verwekte zonen en dochters.","Matt 24:38":"Want zoals zij waren in de dagen voor de zondvloed, etend en drinkend, terwijl zij trouwden en ten huwelijk gaven, tot de dag toe waarop Noach in de ark ging;","Job 22:24":"Dan zult u het goud op het s n;","Deut 7:1":"Wanneer de HEERE, uw God, u gebracht zal hebben in het land waar u naar toe gaat om het te erven, en Hij vele volken voor uw aangezicht zal hebben uitgeworpen, de Hethieten, en de Girgasieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, en de Hevieten, en de Jebusieten, zeven volken, die groter en machtiger zijn dan u,","Gen 9:22":"En Cham, de vader van Kanaän, zag de naaktheid van zijn vader, en hij vertelde het zijn beide broers daarbuiten.","Gen 36:29":"Dit zijn de vorsten van de Horieten: vorst Lotan, vorst Sobal, vorst Zibeon, vorst Ana.","Gen 36:42":"Vorst Kenaz, vorst Teman, vorst Mibzar,","Gen 36:22":"En de zonen van Lotan waren Hori en Hemam; en Lotans zuster was Timna.","Gen 36:41-43":"Vorst Aholibama, vorst Ela, vorst Pinon, Vorst Kenaz, vorst Teman, vorst Mibzar, Vorst Magdiël, vorst Iram; dit zijn de vorsten van Edom, naar hun woonplaatsen, in het land van hun bezit; hij is Ezau, de vader van Edom.","Richt 1:21":"Doch de Benjaminieten hebben de Jebusieten, die in Jeruzalem woonden, niet verdreven; maar de Jebusieten woonden met de Benjaminieten in Jeruzalem, tot op deze dag.","Gen 10:17":"En de Hivviet, en de Arkiet, en de Siniet,","Gen 10:6":"En de zonen van Cham zijn: Cusch en Mitsraïm, en Put, en Kanaän.","Ezech 27:10":"Perzen, en Lydiërs, en Puteeërs waren in uw leger, uw krijgslieden; schild en helm hingen zij in u op, die maakten uw sieraad.","Gen 36:12":"En Timna was een bijvrouw van Elifaz, de zoon van Ezau, en zij baarde aan Elifaz Amalek; dit zijn de zonen van Ada, Ezaus vrouw.","Gen 15:21":"En de Amorieten, en de Kanaänieten, en de Girgazieten, en de Jebusieten.","Luk 3:34":"de zoon van Jakob, de zoon van Izak, de zoon van Abraham, de zoon van Thara, de zoon van Nachor,","Richt 6:1-6":"Maar de Israëlieten deden wat slecht was in de ogen van de HEERE; daarom gaf de HEERE hen zeven jaar lang in de hand van de Midianieten. Toen de hand van de Midianieten sterk werd over Israël, maakten de Israëlieten voor zichzelf, vanw r</span> of <span class=\"wl wl-kjv\" data-code=\"H4314\">Mezahab.</span>","51":"<span class=\"wl wl-kjv\" data-code=\"H1908\">Hadad</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> also. And the <span class=\"wl wl-kjv\" data-code=\"H441\">dukes</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> were; <span class=\"wl wl-kjv\" data-code=\"H441\">duke</span> <span class=\"wl wl-kjv\" data-code=\"H8555\">Timnah,</span> <span class=\"wl wl-kjv\" data-code=\"H441\">duke</span> <span class=\"wl wl-kjv\" data-code=\"H5933\">Aliah,</span> <span class=\"wl wl-kjv\" data-code=\"H441\">duke</span> <span class=\"wl wl-kjv\" data-code=\"H3509\">Jetheth,</span>","52":"<span class=\"wl wl-kjv\" data-code=\"H441\">Duke</span> <span class=\"wl wl-kjv\" data-code=\"H173\">Aholibamah,</span> <span class=\"wl wl-kjv\" data-code=\"H441\">duke</span> <span class=\"wl wl-kjv\" data-code=\"H425\">Elah,</span> <span class=\"wl wl-kjv\" data-code=\"H441\">duke</span> <span class=\"wl wl-kjv\" data-code=\"H6373\">Pinon,</span>","53":"<span class=\"wl wl-kjv\" data-code=\"H441\">Duke</span> <span class=\"wl wl-kjv\" data-code=\"H7073\">Kenaz,</span> <span class=\"wl wl-kjv\" data-code=\"H441\">duke</span> <span class=\"wl wl-kjv\" data-code=\"H8487\">Teman,</span> <span class=\"wl wl-kjv\" data-code=\"H441\">duke</span> <span class=\"wl wl-kjv\" data-code=\"H4014\">Mibzar,</span>","54":"<span class=\"wl wl-kjv\" data-code=\"H441\">Duke</span> <span class=\"wl wl-kjv\" data-code=\"H4025\">Magdiel,</span> <span class=\"wl wl-kjv\" data-code=\"H441\">duke</span> <span class=\"wl wl-kjv\" data-code=\"H5902\">Iram.</span> These are the <span class=\"wl wl-kjv\" data-code=\"H441\">dukes</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
