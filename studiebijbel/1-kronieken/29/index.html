rstenen in overvloed.","3":"En daarbij, uit mijn genegenheid voor het huis van mijn God, geef ik mijn eigen goud en zilver, dat ik heb, aan het huis van mijn God, boven op alles wat ik al voor het heilige huis klaargemaakt heb;","4":"Drieduizend talenten goud, van het goud van Ofir, en zevenduizend talenten gelouterd zilver, om de wanden van de huizen mee te bekleden;","5":"Goud voor de gouden *voorwerpen*, en zilver voor de zilveren *voorwerpen*, en voor al het werk dat door de hand van de werkmeesters gemaakt moet worden. En wie is er bereid om zich vandaag vrijwillig aan de HEERE te wijden?","6":"Toen gaven de leiders van de families vrijwillig, en de leiders van de stammen van Israël, en de aanvoerders van de duizenden en van de honderden, en de leiders van het werk van de koning;","7":"En zij gaven voor de dienst van het huis van God vijfduizend talenten goud, en tienduizend drachmen, en tienduizend talenten zilver, en achttienduizend talenten koper, en honderdduizend talenten ijzer.","8":"En bij wie stenen gevonden werden, die gaven ze aan de schat van het huis van de HEERE, onder toezicht van Jehiël, de Gersoniet.","9":"En het volk was blij over hun vrijwillig geven; want zij gaven met een volkomen hart vrijwillig aan de HEERE; en koning David verblijdde zich ook met grote blijdschap.","10":"Daarom loofde David de HEERE voor de ogen van de hele gemeente; en David zei: Geloofd bent U, HEERE, God van onze vader Israël, van eeuwigheid tot in eeuwigheid!","11":"Van U, o HEERE, is de grootheid, en de macht, en de heerlijkheid, en de overwinning, en de majesteit; want alles wat in de hemel en op aarde is, is van U: van U, o HEERE, is het Koninkrijk, en U hebt Uzelf verhoogd tot een Hoofd boven alles.","12":"En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.","13":"Nu dan, onze God, wij danken U, en loven de Naam van Uw heerlijkheid.","14":"Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.","15":"Want wij zijn vreemdelingen en bijwoners voor Uw aangezicht, zoals al onze vaders; onze dagen op aarde zijn als een schaduw, en er is geen verwachting.","16":"HEERE, onze God, al deze overvloed die wij klaargemaakt hebben om U een huis te bouwen, voor de Naam van Uw heiligheid, dat komt van Uw hand, en het is alles van U.","17":"En ik weet, mijn God, dat U het hart beproeft, en dat U een welgevallen hebt aan oprechtheid. Ik heb in oprechtheid van mijn hart al deze dingen vrijwillig gegeven, en ik heb nu met vreugde Uw volk, dat hier aanwezig is, gezien, dat het zich tegenover U vrijwillig gedragen heeft.","18":"O HEERE, God van onze vaders, Abraham, Izak en Israël, bewaar dit voor eeuwig in de gedachten van het hart van Uw volk, en richt hun hart op U.","19":"En geef mijn zoon Salomo een volkomen hart, om Uw geboden, Uw getuigenissen en Uw inzettingen te houden; en om alles te doen, en om dit paleis te bouwen, dat ik klaargemaakt heb.","20":"Daarna zei David tegen de hele gemeente: Looft nu de HEERE, uw God! Toen loofde de hele gemeente de HEERE, de God van hun vaderen; en zij bogen hun hoofd, en zij bogen zich neer voor de HEERE, en voor de koning.","21":"En zij offerden de HEERE slachtoffers; ook brachten zij de HEERE brandoffers, de volgende morgen na die dag: duizend jonge stieren, duizend rammen, duizend lammeren, met hun drankoffers; en slachtoffers in overvloed, voor heel Israël.","22":"En zij aten en dronken op die dag voor het aangezicht van de HEERE met grote vreugde; en zij maakten Salomo, de zoon van David, voor de tweede keer koning, en zij zalfden hem voor de HEERE tot voorganger, en Zadok tot priester.","23":"Zo zat Salomo op de troon van de HEERE, als koning in de plaats van zijn vader David, en hij was voorspoedig; en heel Israël luisterde naar hem.","24":"En alle vorsten, en helden, ja, ook alle zonen van koning David, gaven de hand, dat zij onder koning Salomo zouden staan.","25":"En de HEERE maakte Salomo uitermate groot voor de ogen van heel Israël; en Hij gaf hem een koninklijke majesteit, zoals geen koning van Israël voor hem gehad heeft.","26":"Zo heeft dan David, de zoon van Isaï, geregeerd over heel Israël.","27":"De dagen nu dat hij over Israël geregeerd heeft, zijn veertig jaar; in Hebron regeerde hij zeven jaar, en in Jeruzalem regeerde hij drieëndertig jaar.","28":"En hij stierf op hoge leeftijd, verzadigd van dagen, rijkdom en eer; en zijn zoon Salomo regeerde in zijn plaats.","29":"De geschiedenissen nu van koning David, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Samuel, de ziener, en in de geschiedenissen van de profeet Nathan, en in de geschiedenissen van Gad, de ziener;","30":"Met heel zijn koninkrijk, en zijn macht, en de tijden die over hem heen gegaan zijn, en over Israël, en over al de koninkrijken van de landen."},"SV":{"1":"Verder zeide de koning David tot de ganse gemeente: God heeft mijn zoon Salomo alleen verkoren, een jongeling en teder; dit werk daarentegen is groot, want het is geen paleis voor een mens, maar voor God, den HEERE.","2":"Ik heb nu uit al mijn kracht bereid tot het huis mijns Gods, goud tot gouden, en zilver tot zilveren, en koper tot koperen, ijzer tot ijzeren, en hout tot houten *werken*; sardonixstenen en vervullende *stenen*, versierstenen en borduursel, en allerlei kostelijke stenen, en marmerstenen in menigte.","3":"En daartoe, uit mijn welgevallen tot het huis mijns Gods, geef ik het bijzonder goud en zilver, dat ik heb, tot het huis mijns Gods daarenboven, behalve al wat ik ten huize des heiligdoms bereid heb;","4":"Drie duizend talenten gouds, van het goud van Ofir, en zeven duizend talenten gelouterd zilver, om de wanden der huizen te overtrekken;","5":"Goud tot de gouden, en zilver tot de zilveren *vaten*, en tot alle werk, door de hand der werkmeesteren *te* *maken*. En wie is er willig, heden zijn hand den HEERE te vullen?","6":"Toen gaven vrijwillig de oversten der vaderen, en de oversten der stammen van Israël, en de oversten der duizenden en der honderden, en de oversten van het werk des konings;","7":"En zij gaven, tot den dienst van het huis Gods, vijf duizend talenten gouds, en tien duizend drachmen, en tien duizend talenten zilvers, en achttien duizend talenten kopers, en honderd duizend talenten ijzers.","8":"En bij wien stenen gevonden werden, die gaven zij in den schat van het huis des HEEREN, onder de hand van Jehiel, den Gersoniet.","9":"En het volk was verblijd over hun vrijwillig geven; want zij gaven met een volkomen hart den HEERE vrijwillig; en de koning David verblijdde zich ook met grote blijdschap.","10":"Daarom loofde David den HEERE voor de ogen der ganse gemeente; en David zeide: Geloofd zijt Gij, HEERE, God van onzen vader Israël, van eeuwigheid tot in eeuwigheid!","11":"Uw, o HEERE, is de grootheid, en de macht, en de heerlijkheid, en de overwinning, en de majesteit; want alles, wat in den hemel en op aarde is, *is* *Uw*: Uw, o HEERE, is het Koninkrijk, en Gij hebt U verhoogd tot een Hoofd boven alles.","12":"En rijkdom en eer zijn voor Uw aangezicht, en Gij heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand alles groot te maken en sterk te maken.","13":"Nu dan, onze God, wij danken U, en loven den Naam Uwer heerlijkheid.","14":"Want wie ben ik, en wat is mijn volk, dat wij de macht zouden verkregen hebben, om vrijwillig te geven als dit is? Want het is alles van U, en wij geven het U uit Uw hand.","15":"Want wij zijn vreemdelingen en bijwoners voor Uw aangezicht, gelijk al onze vaders; onze dagen op aarde zijn als een schaduw, en er is geen verwachting.","16":"HEERE, onze God, al deze menigte, die wij bereid hebben om U een huis te bouwen, den Naam Uwer heiligheid, dat is van Uw hand, en het is alles Uw.","17":"En ik weet, mijn God, dat Gij het hart proeft, en dat Gij een welgevallen hebt aan oprechtigheden. Ik heb in oprechtigheid mijns harten al deze dingen vrijwillig gegeven, en ik heb nu met vreugde Uw volk, dat hier bevonden wordt, gezien, dat het zich jegens U vrijwillig gedragen heeft.","18":"O HEERE, Gij, God onzer vaderen, Abraham, Izak en Israël, bewaar dit in der eeuwigheid in den zin der gedachten van het hart Uws volks, en richt hun hart tot U.","19":"En geef mijn zoon Salomo een volkomen hart, om te houden Uw geboden, Uw getuigenissen en Uw inzettingen; en om alles te doen, en om dit paleis te bouwen, hetwelk ik bereid heb.","20":"Daarna zeide David tot de ganse gemeente: Looft nu den HEERE, uw God! Toen loofde de ganse gemeente den HEERE, den God hunner vaderen; en zij neigden het hoofd, en zij bogen zich neder voor den HEERE, en voor den koning.","21":"En zij offerden den HEERE slachtofferen; ook offerden zij den HEERE brandofferen, des anderen morgens van dien dag, duizend varren, duizend rammen, duizend lammeren, met hun drankofferen; en slachtofferen in menigte, voor gans Israël.","22":"En zij aten en dronken deszelven daags voor het aangezicht des HEEREN met grote vreugde; en zij maakten Salomo, den zoon van David, ten andere male koning, en zij zalfden *hem* den HEERE tot voorganger, en Zadok tot priester.","23":"Alzo zat Salomo op den troon des HEEREN, als koning in zijns vaders Davids plaats, en hij was voorspoedig; en gans Israël hoorde naar hem.","24":"En al de vorsten, en helden, ja, ook al de zonen van den koning David, gaven de hand, dat zij onder den koning Salomo zijn zouden.","25":"En de HEERE maakte Salomo groot ten hoogste voor de ogen van gans Israël; en Hij gaf aan hem een koninklijke majesteit, zodanige aan geen koning van Israël voor hem geweest is.","26":"Zo heeft dan David, de zoon van Isaï, geregeerd over gans Israël.","27":"De dagen nu, die hij geregeerd heeft over Israël, zijn veertig jaren; te Hebron regeerde hij zeven jaren, en te Jeruzalem regeerde hij drie en dertig.","28":"En hij stierf in goeden ouderdom, zat van dagen, rijkdom en eer; en zijn zoon Salomo regeerde in zijn plaats.","29":"De geschiedenissen nu van den koning David, de eerste en de laatste, ziet, die zijn geschreven in de geschiedenissen van Samuël, den ziener, en in de geschiedenissen van den profeet Nathan, en in de geschiedenissen van Gad, den ziener;","30":"Met al zijn koninkrijk, en zijn macht, en de tijden, die over hem verlopen zijn, en over Israël, en over al de koninkrijken der landen."},"KJV":{"1":"Furthermore David the king said unto all the congregation, Solomon my son, whom alone God hath chosen, is yet young and tender, and the work is great: for the palace is not for man, but for the LORD God.","2":"Now I have prepared with all my might for the house of my God the gold for things to be made of gold, and the silver for things of silver, and the brass for things of brass, the iron for things of iron, and wood for things of wood; onyx stones, and stones to be set, glistering stones, and of divers colours, and all manner of precious stones, and marble stones in abundance.","3":"Moreover, because I have set my affection to the house of my God, I have of mine own proper good, of gold and silver, which I have given to the house of my God, over and above all that I have prepared for the holy house,","4":"Even three thousand talents of gold, of the gold of Ophir, and seven thousand talents of refined silver, to overlay the walls of the houses withal:","5":"The gold for things of gold, and the silver for things of silver, and for all manner of work to be made by the hands of artificers. And who then is willing to consecrate his service this day unto the LORD?","6":"Then the chief of the fathers and princes of the tribes of Israel, and the captains of thousands and of hundreds, with the rulers of the king's work, offered willingly,","7":"And gave for the service of the house of God of gold five thousand talents and ten thousand drams, and of silver ten thousand talents, and of brass eighteen thousand talents, and one hundred thousand talents of iron.","8":"And they with whom precious stones were found gave them to the treasure of the house of the LORD, by the hand of Jehiel the Gershonite.","9":"Then the people rejoiced, for that they offered willingly, because with perfect heart they offered willingly to the LORD: and David the king also rejoiced with great joy.","10":"Wherefore David blessed the LORD before all the congregation: and David said, Blessed be thou, LORD God of Israel our father, for ever and ever.","11":"Thine, O LORD, is the greatness, and the power, and the glory, and the victory, and the majesty: for all that is in the heaven and in the earth is thine; thine is the kingdom, O LORD, and thou art exalted as head above all.","12":"Both riches and honour come of thee, and thou reignest over all; and in thine hand is power and might; and in thine hand it is to make great, and to give strength unto all.","13":"Now therefore, our God, we thank thee, and praise thy glorious name.","14":"But who am I, and what is my people, that we should be able to offer so willingly after this sort? for all things come of thee, and of thine own have we given thee.","15":"For we are strangers before thee, and sojourners, as were all our fathers: our days on the earth are as a shadow, and there is none abiding.","16":"O LORD our God, all this store that we have prepared to build thee an house for thine holy name cometh of thine hand, and is all thine own.","17":"I know also, my God, that thou triest the heart, and hast pleasure in uprightness. As for me, in the uprightness of mine heart I have willingly offered all these things: and now have I seen with joy thy people, which are present here, to offer willingly unto thee.","18":"O LORD God of Abraham, Isaac, and of Israel, our fathers, keep this for ever in the imagination of the thoughts of the heart of thy people, and prepare their heart unto thee:","19":"And give unto Solomon my son a perfect heart, to keep thy commandments, thy testimonies, and thy statutes, and to do all these things, and to build the palace, for the which I have made provision.","20":"And David said to all the congregation, Now bless the LORD your God. And all the congregation blessed the LORD God of their fathers, and bowed down their heads, and worshipped the LORD, and the king.","21":"And they sacrificed sacrifices unto the LORD, and offered burnt offerings unto the LORD, on the morrow after that day, even a thousand bullocks, a thousand rams, and a thousand lambs, with their drink offerings, and sacrifices in abundance for all Israel:","22":"And did eat and drink before the LORD on that day with great gladness. And they made Solomon the son of David king the second time, and anointed him unto the LORD to be the chief governor, and Zadok to be priest.","23":"Then Solomon sat on the throne of the LORD as king instead of David his father, and prospered; and all Israel obeyed him.","24":"And all the princes, and the mighty men, and all the sons likewise of king David, submitted themselves unto Solomon the king.","25":"And the LORD magnified Solomon exceedingly in the sight of all Israel, and bestowed upon him such royal majesty as had not been on any king before him in Israel.","26":"Thus David the son of Jesse reigned over all Israel.","27":"And the time that he reigned over Israel was forty years; seven years reigned he in Hebron, and thirty and three years reigned he in Jerusalem.","28":"And he died in a good old age, full of days, riches, and honour: and Solomon his son reigned in his stead.","29":"Now the acts of David the king, first and last, behold, they are written in the book of Samuel the seer, and in the book of Nathan the prophet, and in the book of Gad the seer,","30":"With all his reign and his might, and the times that went over him, and over Israel, and over all the kingdoms of the countries."}},"tsk":{"1":[{"kopje":"zei","refs":["1 Kron 28:1","1 Kron 28:8"]},{"k t</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> for things to be made of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> for things of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> for things of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass,</span> the <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> for things of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> and <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> for things of <span class=\"wl wl-kjv\" data-code=\"H6086\">wood;</span> <span class=\"wl wl-kjv\" data-code=\"H7718\">onyx</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and stones to be <span class=\"wl wl-kjv\" data-code=\"H4394\">set,</span> <span class=\"wl wl-kjv\" data-code=\"H6320\">glistering</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and of divers <span class=\"wl wl-kjv\" data-code=\"H7553\">colours,</span> and all manner of <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and <span class=\"wl wl-kjv\" data-code=\"H7893\">marble</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance.</span>","3":"Moreover, because I have set my <span class=\"wl wl-kjv\" data-code=\"H7521\">affection</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> I <span class=\"wl wl-kjv\" data-code=\"H3426\">have</span> of mine own proper <span class=\"wl wl-kjv\" data-code=\"H5459\">good,</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> over and <span class=\"wl wl-kjv\" data-code=\"H4605\">above</span> all that I have <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> for the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span>","4":"Even <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> of the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> of <span class=\"wl wl-kjv\" data-code=\"H211\">Ophir,</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H2212\">refined</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> to <span class=\"wl wl-kjv\" data-code=\"H2902\">overlay</span> the <span class=\"wl wl-kjv\" data-code=\"H7023\">walls</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> withal:","5":"The <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> for things of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> for things of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and for all manner of <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> to be made by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of <span class=\"wl wl-kjv\" data-code=\"H2796\">artificers.</span> And who then is <span class=\"wl wl-kjv\" data-code=\"H5068\">willing</span> to <span class=\"wl wl-kjv\" data-code=\"H4390\">consecrate</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">service</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span>","6":"Then the <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> and of <span class=\"wl wl-kjv\" data-code=\"H3967\">hundreds,</span> with the <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4399\">work,</span> offered <span class=\"wl wl-kjv\" data-code=\"H5068\">willingly,</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> for the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> and ten <span class=\"wl wl-kjv\" data-code=\"H7239\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H150\">drams,</span> and of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents,</span> and of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> <span class=\"wl wl-kjv\" data-code=\"H8083\">eighteen</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents,</span> and one <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron.</span>","8":"And they with whom precious <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> were <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them to the <span class=\"wl wl-kjv\" data-code=\"H214\">treasure</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3171\">Jehiel</span> the <span class=\"wl wl-kjv\" data-code=\"H1649\">Gershonite.</span>","9":"Then the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced,</span> for that they offered <span class=\"wl wl-kjv\" data-code=\"H5068\">willingly,</span> because with <span class=\"wl wl-kjv\" data-code=\"H8003\">perfect</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> they offered <span class=\"wl wl-kjv\" data-code=\"H5068\">willingly</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> also <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8057\">joy.</span>","10":"Wherefore <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">before</span> all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be thou, <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> our <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> and <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>","11":"Thine, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> is the <span class=\"wl wl-kjv\" data-code=\"H1420\">greatness,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1369\">power,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8597\">glory,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5331\">victory,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1935\">majesty:</span> for all that is in the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> and in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is thine; thine is the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and thou art <span class=\"wl wl-kjv\" data-code=\"H4984\">exalted</span> as <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> above all.","12":"Both <span class=\"wl wl-kjv\" data-code=\"H6239\">riches</span> and <span class=\"wl wl-kjv\" data-code=\"H3519\">honour</span> come of <span class=\"wl wl-kjv\" data-code=\"H6440\">thee,</span> and thou <span class=\"wl wl-kjv\" data-code=\"H4910\">reignest</span> over all; and in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> is <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> and <span class=\"wl wl-kjv\" data-code=\"H1369\">might;</span> and in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> it is to make <span class=\"wl wl-kjv\" data-code=\"H1431\">great,</span> and to give <span class=\"wl wl-kjv\" data-code=\"H2388\">strength</span> unto all.","13":"Now therefore, our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> we <span class=\"wl wl-kjv\" data-code=\"H3034\">thank</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> thy <span class=\"wl wl-kjv\" data-code=\"H8597\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name.</span>","14":"But who am I, and what is my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that we should <span class=\"wl wl-kjv\" data-code=\"H6113\">be</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">able</span> to offer so <span class=\"wl wl-kjv\" data-code=\"H5068\">willingly</span> after this sort? for all things come of thee, and of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">own</span> have we <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thee.","15":"For we are <span class=\"wl wl-kjv\" data-code=\"H1616\">strangers</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H8453\">sojourners,</span> as were all our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers:</span> our <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> are as a <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow,</span> and there is none <span class=\"wl wl-kjv\" data-code=\"H4723\">abiding.</span>","16":"O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> all this <span class=\"wl wl-kjv\" data-code=\"H1995\">store</span> that n</span> of the <span class=\"wl wl-kjv\" data-code=\"H4284\">thoughts</span> of the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> their <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> unto thee:","19":"And <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> a <span class=\"wl wl-kjv\" data-code=\"H8003\">perfect</span> <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> thy <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> thy <span class=\"wl wl-kjv\" data-code=\"H5715\">testimonies,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes,</span> and to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all these things, and to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace,</span> for the which I have made <span class=\"wl wl-kjv\" data-code=\"H3559\">provision.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation,</span> Now <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span> And all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and bowed down their <span class=\"wl "catchword":"alleen verkoren,","tekst":"Hebreeuws, enen; te weten, uit al mijn zonen. Hierom heeft hem David nog tijdens zijn leven tot koning laten kronen, en de andere zonen Davids hebben met handslag beloofd Salomo te gehoorzamen, vs.24."},{"catchword":"een jongeling","tekst":"Salomo had toen ter tijd een vrouw getrouwd, gelijk uit den ouderdom van zijn zoon Rehabeam is af te nemen, 2Ch 12:13 , want hij heeft veertig jaren geregeerd, 2Ch 9:30 , en zijn zoon Rehabeam was een en veertig jaren oud toen hij koning werd na Salomo's dood; waaruit dan blijkt dat Rehabeam een jaar oud was toen Salomo als koning gekroond is; doch David noemt hem hier, met reden, jong omdat hij toentertijd naar sommiger rekening, maar omtrent achttien of negentien jaren oud was en broeders had, die ouder waren dan hij."},{"catchword":"dit werk daarentegen","tekst":"Te weten, de bouw des tempels, welken Salomo moest uitvoeren."}],"2":[{"catchword":"versierstenen","tekst":"Anders, stenen des versiersels en borduursels. Of, tot versiersel en borduursel."}],"3":[{"catchword":"uit mijn welgevallen","tekst":"Dat is, uit zonderlinge liefde tot het huis mijns Gods."},{"catchword":"het bijzonder","tekst":"Dat is, van mijn eigen juwelen en andere kostelijkheden, die ik gespaard en hiertoe bewaard heb."}],"4":[{"catchword":"talenten gouds,","tekst":"Zie Exo 25:39 ."},{"catchword":"om de wanden","tekst":"Te weten, het goud om de wanden des tempels te overtrekken; en het zilver om de andere huizen en kamers, tot den tempel behorende, te overtrekken."}],"5":[{"catchword":"wie is er willig,","tekst":"Te weten, onder ulieden."},{"catchword":"zijn hand","tekst":"Dat is, zijnen dienst den Heere te heiligen en hem een vrijwillige offerande te doen. Zie Exo 32:29 ; Lev 8:33 ."}],"7":[{"catchword":"ten dienste","tekst":"Dat is, tot de timmering des tempels."},{"catchword":"drachmen,","tekst":"Een drachma weegt zoveel als een Franse kroon."},{"catchword":"achttien duizend","tekst":"Hebreeuws, tien duizend, en acht duizend talenten kopers."}],"8":[{"catchword":"stenen","tekst":"Te weten, edele of kostelijke stenen."},{"catchword":"Jehiël,","tekst":"Deze is geweest de generale bewaarder van al de schatten des heiligdoms, die wij zouden mogen noemen een ontvanger-generaal; maar Selomith was gesteld over de schatten, die gecollecteerd werden tot den bouw des tempels; 1Ch 26:26 ."}],"12":[{"catchword":"over alles;","tekst":"Of, over alle."}],"13":[{"catchword":"den Naam","tekst":"Of, uw heerlijken naam."}],"14":[{"catchword":"als dit is?","tekst":"Dat is, al deze dingen."},{"catchword":"wij geven het U","tekst":"Dat is, gelijk wij dit eerst van U ontvangen hebben, alzo geven wij het U weder."}],"15":[{"catchword":"Want wij zijn vreemdelingen","tekst":"Dit is Davids argument. Dewijl wij mensen hier op aarde maar vreemdelingen en pelgrims zijn, die voorzeker van hier moeten scheiden, Psa 39:13 , en wij kunnen onze goederen na onzen dood niet behouden; zo kunnen wij dezelve niet beter aanleggen dan aan den dienst Gods, die het in eeuwigheid uit genade belonen zal."},{"catchword":"is geen verwachting","tekst":"Hij wil zeggen dat er niets vast, zeker, of gestadig is in dit leven; het is al ijdelheid en gelijk een schaduw; en niemand behoeft te vermoeden dat hij den dood zal ontlopen. Anders, die [te weten, schaduw] niet verzameld wordt."}],"18":[{"catchword":"den zin","tekst":"Of, de genegenheid. Hebreeuws, formeersel, maaksel."}],"19":[{"catchword":"hetwelk ik","tekst":"Dat is, tot hetwelk ik allen voorraad bijeengebracht en vaardig gemaakt heb. Ja, waartoe ik zelfs de plaats gekocht heb, 1Ch 21:25 , en 2Ch 3:1 , en een model of ontwerp daarvan gemaakt heb."}],"20":[{"catchword":"voor den HEERE,","tekst":"Voor den Heere met godsdienstigen eerbied, voor den koning met burgerlijken eerbied."}],"22":[{"catchword":"ten andere male","tekst":"Dit was een andere zalving dan die, waarvan men leest 1Ki 1:33 . Want de eerste geschiedde alleen in haast, daar die van Jeruzalem alleen bij waren, om het oproerig voornemen van Adonia te beletten; maar deze tweede zalving is ook bij het leven Davids [gelijk blijkt uit het begin van vs.22] doch met meerdere plechtigheid geschied, in tegenwoordigheid van al de vorsten en oversten des volks, ja ook der andere zonen Davids."},{"catchword":"HEERE tot voorganger,","tekst":"Dat is tot dienst des Heeren, tot handhaving van de beide tafelen der wet."},{"catchword":"tot priester","tekst":"Versta, tot hogepriester; en Abjathar werd afgezet, omdat hij mede geweest was in het oproer van Adonia, 1Ki 1:7 ."}],"23":[{"catchword":"op den troon des HEEREN,","tekst":"Dat is, den troon, welken hem de Heere gegeven had, en waarop hij als een stadhouder de plaats des Heeren bewaarde."}],"24":[{"catchword":"dat zij","tekst":"Dat is, dat zij Salomo voor hunnen koning en overheer kenden en aannamen. Hebreeuws, gaven de hand onder den koning Salomo."}],"25":[{"catchword":"een koninklijke majesteit,","tekst":"Hebreeuws, een majesteit des koninkrijks."},{"catchword":"koning van Israël","tekst":"Noch rechter, noch regent, onder de Israëlieten. Zie 1Ki 3:13 , en 2Ch 1:12 ."}],"28":[{"catchword":"ouderdom,","tekst":"Hebreeuws, grijsheid, of grauwigheid, gelijk Gen 25:8 ."}],"29":[{"catchword":"in de","tekst":"Dit kan verstaan worden van de twee boeken door Samuël, welker voornaamste delen van de profeten, die hier genoemd worden, beschreven zijn, te weten, door Samuël, Nathan en Gad, die hier zieners genoemd worden."},{"catchword":"geschiedenissen van Samuël,","tekst":"Hebreeuws, woorden, zaken."},{"catchword":"geschiedenissen van den profeet Nathan,","tekst":"Hebreeuws, woorden, zaken."},{"catchword":"geschiedenissen van Gad,","tekst":"Hebreeuws, woorden, zaken."}],"30":[{"catchword":"Met al zijn koninkrijk,","tekst":"Dat is, met de ganse regering zijns koninkrijks."},{"catchword":"tijden,","tekst":"Dat is met hetgeen te zijner tijd hem, Israël en den omliggenden koninkrijken is overkomen en gebeurd."}]},"kanttekeningen_en":{"1":[{"catc // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {

    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
