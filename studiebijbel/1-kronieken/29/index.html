 een gruwel; maar de oprechten van weg zijn Zijn welgevallen.", "Matt 3:14": "Maar Johannes weigerde Hem sterk, en zei: Ik heb het nodig door U gedoopt te worden, en komt U tot mij?", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "1 Kron 12:23-40": "En dit zijn de aantallen van de aanvoerders van hen die toegerust waren voor het leger, die naar David te Hebron kwamen om het koninkrijk van Saul aan hem over te dragen, naar het woord van de HEERE: Van de kinderen van Juda, die rond schild en speer droegen, waren zesduizend achthonderd toegerust voor het leger; Van de kinderen van Simeon, kloeke helden voor het leger, zevenduizend honderd;", "1 Kron 28:5": "En uit al mijn zonen (want de HEERE heeft mij veel zonen gegeven) heeft Hij mijn zoon Salomo verkoren, dat hij zou zitten op de troon van het koninkrijk van de HEERE over Israël.", "Gen 25:8": "En Abraham gaf de geest en stierf, in goede ouderdom, oud en verzadigd van het leven, en hij werd verzameld tot zijn volk.", "1 Kron 18:11": "Deze heiligde koning David ook aan de HEERE, met het zilver en het goud dat hij had meegebracht van alle heidenvolken: van de Edomieten, en van de Moabieten, en van de kinderen van Ammon, en van de Filistijnen, en van de Amalekieten.", "1 Kor 13:3": "En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud van de armen, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Ps 41:2-4": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads. De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden. De HEERE zal hem ondersteunen op het ziekbed; in zijn ziekte verandert U zijn hele leger.", "Jes 40:14": "Met wie heeft Hij raad gehouden, die Hem verstand zou geven, en Hem zou leren van het pad van het recht, en Hem wetenschap zou leren, en Hem bekend zou maken de weg van het veelvoudige verstand?", "1 Kon 2:35": "En de koning stelde Benaja, de zoon van Jojada, in zijn plaats aan over het leger; en Zadok, de priester, stelde de koning aan in de plaats van Abjathar.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Jer 27:4-6": "En beveel hun om tegen hun heren te zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Zo zult u tegen uw heren zeggen: Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Ps 89:14": "Gij hebt een arm met macht; Uw hand is sterk, Uw rechterhand is hoog.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "1 Kron 29:21-23": "En zij offerden de HEERE slachtoffers; ook brachten zij de HEERE brandoffers, de volgende morgen na die dag: duizend jonge stieren, duizend rammen, duizend lammeren, met hun drankoffers; en slachtoffers in overvloed, voor heel Israël. En zij aten en dronken op die dag voor het aangezicht van de HEERE met grote vreugde; en zij maakten Salomo, de zoon van David, voor de tweede keer koning, en zij zalfden hem voor de HEERE tot voorganger, en Zadok tot priester. Zo zat Salomo op de troon van de HEERE, als koning in de plaats van zijn vader David, en hij was voorspoedig; en heel Israël luisterde naar hem.", "Spr 3:2": "Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Ps 65:7": "Die de bergen vastzet door Zijn kracht, omgord met macht.", "2 Kron 6:41": "En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.", "Job 22:13": "Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen?", "Hebr 13:16": "En vergeet de weldadigheid en de mededeelzaamheid niet; want aan zulke offers heeft God een welgevallen.", "Ps 29:11": "De HEERE zal Zijn volk sterkte geven; de HEERE zal Zijn volk zegenen met vrede.", "Ezech 18:4": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "Ps 104:7": "Van Uw dreigen vluchtten zij, zij haastten zich weg voor de stem van uw donder.", "Kol 3:14": "En doe boven dit alles de liefde aan, die de band van de volmaaktheid is.", "Job 38:11": "En zei: Tot hiertoe zult u komen, en niet verder, en hier zal hij zich stellen tegen de hoogmoed van uw golven.", "Jes 33:13": "Hoort, u die ver weg bent, wat Ik gedaan heb; en u, die nabij bent, erken Mijn macht!", "Fil 3:12-15": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben. Broeders, ik acht niet dat ik het zelf al gegrepen heb. Maar één ding doe ik: ik vergeet wat achter is, en strek mij uit naar wat voor is, en jaag naar het doel, naar de prijs van de roeping van God van boven in Christus Jezus.", "Jer 18:1-23": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei: Maak u op en ga naar het huis van de pottenbakker, en daar zal Ik u Mijn woorden doen horen. Zo ging ik naar het huis van de pottenbakker; en zie, hij maakte een werk op de schijven.", "Job 9:19": "Als het op kracht aankomt, zie, Hij is sterk; en als het op recht aankomt, wie zal mij dagvaarden?", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "2 Kron 2:4": "Zie, ik zal een huis bouwen voor de Naam van de HEERE, mijn God, om Hem te heiligen, om reukwerk van welriekende specerijen voor Zijn aangezicht aan te steken, en voor de bereiding van het voortdurende brood, en voor de brandoffers van de morgen en de avond, op de sabbatten, en op de nieuwe manen, en op de vastgestelde hoogtijden van de HEERE, onze God; dit is voor eeuwig een verordening in Israël.", "Luk 22:29": "En Ik ken u het Koninkrijk toe, zoals Mijn Vader dat Mij toegekend heeft;", "Ps 77:19": "Het geluid van uw donder was rondom; de bliksemen verlichtten de wereld; de aarde werd beroerd en daverde.", "Ps 51:20": "Doe goed bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.", "Deut 11:8": "Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;", "2 Kron 23:9": "Verder gaf de priester Jojada aan de aanvoerders van de honderdtallen de speren, en de rondassen, en de schilden, die van koning David geweest waren, die in het huis van God waren.", "Ex 4:10": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "1 Kon 1:31": "Toen boog Bathseba met haar gezicht ter aarde, en boog zich neer voor de koning, en zei: Mijn heer de koning David leve in eeuwigheid!", "Ps 22:29": "Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen.", "Ps 26:8": "HEERE! Ik heb lief de woning van Uw huis, en de plaats van de tabernakel van Uw eer.", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u gesteld, zodat u zou heengaan en vrucht dragen, en dat uw vrucht blijft; zodat, wat u ook van de Vader zal vragen in Mijn Naam, Hij u dat geeft.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "1 Tess 3:6-9": "Maar nu Timotheüs van u tot ons gekomen is, en ons de goede boodschap gebracht heeft van uw geloof en liefde, en dat u altijd goede herinnering aan ons hebt, zeer verlangend om ons te zien, zoals wij ook naar u; daarom zijn wij, broeders, over u vertroost geworden in al onze verdrukking en nood, door uw geloof; want nu leven wij, als u vast staat in de Heere.", "Ef 1:17": "Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "Hand 10:4": "En hij hield de ogen op hem gericht, en werd zeer bevreesd, en zei: Wat is er, Heere? En Hij zei tegen hem: Uw gebeden en uw aalmoezen zijn als gedachtenis opgekomen voor God.", "2 Kon 14:28": "Het overige nu van de geschiedenis van Jerobeam, en alles wat hij gedaan heeft, en zijn macht, hoe hij gestreden heeft, en hoe hij Damaskus en Hamath, die tot Juda behoorden, weer aan Israël teruggebracht heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?", "Fil 1:6": "Ervan overtuigd dat Hij, Die in u een goed werk begonnen is, dat zal voleindigen tot op de dag van Jezus Christus;", "Ex 29:41": "Het andere lam nu zult u bereiden tussen de twee avonden; u zult daarmee doen gelijk met het morgenspijsoffer, en gelijk met het drankoffer daarvan, tot een liefelijke reuk; het is een vuuroffer voor de HEERE.", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "2 Sam 7:18-29": "Toen ging koning David naar binnen, en bleef voor het aangezicht van de HEERE, en hij zei: Wie ben ik, Heere HEERE, en wat is mijn huis, dat U mij tot hiertoe gebracht hebt? Daarbij is dit in Uw ogen nog klein geweest, Heere HEERE, maar U hebt ook over het huis van uw knecht gesproken tot ver in de toekomst; en dit naar de wet van de mensen, Heere HEERE! En wat zal David nog meer tot U spreken? Want U kent Uw knecht, Heere HEERE!", "Matt 6:10": "Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.", "Jer 1:6": "Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Ps 29:3-9": "De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid. De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.", "Jes 48:5": "Daarom heb Ik het u van toen af verkondigd, voordat het kwam, heb Ik het u doen horen; opdat u niet misschien zou zeggen: Mijn afgod heeft die dingen gedaan, of mijn gesneden beeld, of mijn gegoten beeld heeft ze bevolen.", "Hebr 11:38": "(de wereld was hen niet waard) zij hebben rondgedoold in woestijnen, en op bergen, en in spelonken, en in holen van de aarde.", "Rom 1:9": "Want God is mijn Getuige, Die ik dien in mijn geest, in het Evangelie van Zijn Zoon, hoe ik zonder ophouden aan u denk;", "Fil 4:20": "Onze God en Vader nu zij de heerlijkheid tot in alle eeuwigheid. Amen.", "Job 14:20": "U overweldigt hem voor altijd, en hij gaat heen; U verandert zijn gelaat, en zendt hem weg.", "Ps 125:4": "HEERE! doe het goede aan hen die goed zijn, en aan hen die oprecht zijn in hun hart.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "2 Kor 6:18": "en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.", "Pred 9:7": "Ga dan heen, eet uw brood met vreugde, en drink uw wijn met een vrolijk hart; want God heeft al een behagen in uw werken.", "2 Sam 12:16": "En David zocht God voor dat jongetje; en David vastte een vasten, en ging naar binnen, en lag heel de nacht op de aarde.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "2 Sam 6:5": "En David en het hele huis van Israël speelden voor het aangezicht van de HEERE, met allerlei snarenspel van dennenhout, met harpen, en met luiten, en met trommels, ook met schellen, en met cimbalen.", "1 Tess 1:1": "Paulus, en Silvanus, en Timotheüs, aan de Gemeente van de Thessalonicenzen, die is in God de Vader, en de Heere Jezus Christus: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Jes 43:16": "Zo zegt de HEERE, Die in de zee een weg, en in de sterke wateren een pad maakte;", "Openb 11:4": "Dezen zijn de twee olijfbomen en de twee kandelaars, die voor de God van de aarde staan.", "Job 37:17": "Hoe uw klederen warm worden, als Hij de aarde stil maakt vanuit het zuiden?", "Ex 25:1-8": "Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, dat zij voor Mij een hefoffer nemen. Van elke man wiens hart zich vrijwillig bewegen zal, zult u Mijn hefoffer nemen. Dit nu is het hefoffer, dat u van hen nemen zult: goud, zilver en koper;", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 107:35-38": "Hij maakt van de woestijn een waterpoel, en van het dorre land waterbronnen. En Hij doet de hongerigen daar wonen, en zij stichten een stad om in te wonen; En bezaaien akkers, en planten wijngaarden, die vrucht opbrengen.", "Gen 17:1": "Toen Abram negenennegentig jaar oud was, verscheen de HEERE aan Abram en zei tegen hem: Ik ben God, de Almachtige! Wandel voor Mijn aangezicht en wees oprecht!", "Deut 12:17-19": "U zult in uw poorten niet mogen eten de tienden van uw koren, en van uw most, en van uw olie, noch de eerstgeboorte van uw runderen en van uw schapen, noch enige van uw geloften die u zult hebben beloofd, noch uw vrijwillige offers, noch het hefoffer van uw hand. Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt. Wacht u ervoor dat u de Leviet niet verlaat, al uw dagen in uw land.", "Job 9:21": "Ben ik oprecht, dan acht ik toch mijn ziel niet; ik versmaad mijn leven.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "Jak 3:9": "Door haar loven wij God en de Vader, en door haar vervloeken wij de mensen, die naar de gelijkenis van God gemaakt zijn.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "2 Kor 3:5": "Niet dat wij uit onszelf bekwaam zijn om iets te bedenken, alsof het uit onszelf komt; maar onze bekwaamheid is uit God;", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Kol 3:2": "Bedenk de dingen die boven zijn, niet die op de aarde zijn.", "Ps 135:13": "O HEERE! Uw Naam is er in eeuwigheid; HEERE! Uw gedachtenis is van geslacht tot geslacht.", "Ex 15:10-12": "U hebt met Uw wind geblazen; de zee heeft hen gedekt, zij zonken onder als lood in geweldige wateren! O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet? U hebt Uw rechterhand uitgestrekt, de aarde heeft hen verslonden!", "Job 13:12": "Uw spreuken zijn als as, uw verweer is als een verweer van leem.", "1 Tim 6:17-19": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten; dat zij goed doen, rijk worden in goede werken, vrijgevig zijn en bereid om te delen; en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "1 Kor 2:7": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;", "2 Kor 8:12": "Want als de bereidheid van het gemoed er eerst is, dan is iemand aangenaam naar wat hij heeft, niet naar wat hij niet heeft.", "Joh 17:21": "Opdat zij allen één zijn, zoals U, Vader, in Mij, en Ik in U, dat ook zij in Ons één zijn; opdat de wereld gelooft dat U Mij gezonden hebt.", "2 Kon 19:27": "Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woeden tegen Mij.", "Joh 10:33": "De Joden antwoordden Hem: Wij stenigen U niet vanwege enig goed werk, maar vanwege godslastering, en omdat U, die een Mens bent, Uzelf God maakt.", "1 Kon 22:39": "Het overige nu van de geschiedenis van Achab, en alles wat hij gedaan heeft, en het huis van ivoor dat hij gebouwd heeft, en al de steden die hij gebouwd heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Israël?", "Luk 12:34": "Want waar uw schat is, daar zal ook uw hart zijn.", "Joh 10:30": "Ik en de Vader zijn één.", "Gen 14:19": "En hij zegende hem en zei: Gezegend zij Abram door God, de Allerhoogste, Die hemel en aarde bezit!", "1 Kron 28:21": "En zie, daar zijn de afdelingen van de priesters en de Levieten, voor elke dienst van het huis van God; en bij u zijn er voor al het werk allerlei vrijwilligers, met wijsheid voor elke dienst, ook de leiders en heel het volk, gereed voor al uw bevelen.", "1 Kron 18:14": "Zo regeerde David over heel Israël, en hij handelde met recht en gerechtigheid tegenover zijn hele volk.", "Tit 3:1": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn;", "1 Kron 27:25-34": "En over de schatten van de koning was Azmaveth, de zoon van Adiël; en over de schatten op het land, in de steden, en in de dorpen, en in de torens, was Jonathan, de zoon van Uzzia. En over hen die het akkerwerk deden, in de landbouw, was Ezri, de zoon van Chelub. En over de wijngaarden was Simeï, de Ramathiet; maar over wat van de wijnstokken kwam, tot de voorraden wijn, was Zabdi, de Sifmiet.", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "Dan 5:18-21": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven; En vanwege de grootheid die Hij hem gegeven had, beefden en sidderden alle volken, naties en talen voor hem; wie hij wilde, doodde hij, en wie hij wilde, hield hij in leven, en wie hij wilde, verhoogde hij, en wie hij wilde, vernederde hij. Maar toen zijn hart zich verhief, en zijn geest verstijfd werd tot hoogmoed, werd hij van de troon van zijn koninkrijk afgestoten, en men nam de eer van hem weg.", "Rom 12:13": "Deel mee in de behoeften van de heiligen. Streef naar gastvrijheid.", "Pred 2:8": "Ik verzamelde mij ook zilver en goud, en kostbaarheden van koningen en landstreken; ik nam mij zangers en zangeressen aan, en wat mensenkinderen tot lust strekt: allerlei snarenspel.", "Gen 47:9": "En Jakob zei tegen Farao: De jaren van mijn vreemdelingschap zijn honderddertig jaar; weinig en zwaar zijn de jaren van mijn leven geweest, en zij hebben niet gehaald bij de jaren van het leven van mijn vaderen, in de dagen van hun vreemdelingschap.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "2 Kron 1:10": "Geef mij nu wijsheid en kennis, zodat ik voor het aangezicht van dit volk uitga en inga; want wie zou dit Uw grote volk kunnen richten?", "Ps 41:12": "Hierbij weet ik, dat U lust aan mij hebt, dat mijn vijand over mij niet zal juichen.", "Job 21:22": "Zal men God wetenschap leren, terwijl Hij hen die hoog zijn richt?", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "Ps 47:9": "God regeert over de heidenen; God zit op de troon van Zijn heiligheid.", "Jes 26:4": "Vertrouw op de HEERE tot in eeuwigheid; want in de HEERE HEERE is een eeuwige rots.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Gen 28:20": "En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken;", "Job 42:17": "En Job stierf, oud en verzadigd van dagen.", "1 Sam 12:23": "Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.", "Ps 136:5": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Ps 145:1": "Een lofzang van David. Aleph. O mijn God, U Koning! Ik zal U verhogen, en Uw Naam loven voor eeuwig en altijd.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Ps 72:16": "Is er een handvol koren in het land op de hoogte van de bergen, de vrucht daarvan zal ruisen als de Libanon; en die van de stad zullen bloeien als het kruid van de aarde.", "Jer 3:19": "Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.", "Hand 3:12": "En Petrus, die dit zag, antwoordde het volk: Israëlieten, wat verbaast u zich hierover, of wat kijkt u zo strak naar ons, alsof wij door onze eigen kracht of vroomheid deze man hebben laten lopen?", "Ps 115:3": "Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "Job 40:4": "Hebt u een arm gelijk God? En kunt u, gelijk Hij, met de stem donderen?", "Deut 15:6": "Want de HEERE, uw God, zal u zegenen, zoals Hij tot u heeft gesproken; zo zult u aan veel volken lenen, maar u zult niet lenen; en u zult over veel volken heersen, maar over u zullen zij niet heersen.", "Jes 50:3": "Ik bekleed de hemel met zwartheid, en maak een zak tot zijn bedekking.", "Ps 90:3": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen!", "Jer 5:22": "Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Ps 122:7": "Vrede zij binnen uw vesting, welvaart in uw paleizen.", "Jak 1:25": "Maar wie zich verdiept in de volmaakte wet, die van de vrijheid is, en daarbij blijft, die is geen vergeetachtige hoorder geworden, maar een dader van het werk, die zal, zeg ik, gelukzalig zijn in dit zijn doen.", "Joh 8:19": "Zij zeiden dan tegen Hem: Waar is Uw Vader? Jezus antwoordde: U kent Mij niet, en Mijn Vader ook niet; als u Mij kende, zou u ook Mijn Vader kennen.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "2 Kor 8:11-15": "Maar voleindig nu ook het doen; opdat, zoals er geweest is de bereidheid van het gemoed om te willen, er ook zo het voleindigen zij uit wat u hebt. Want als de bereidheid van het gemoed er eerst is, dan is iemand aangenaam naar wat hij heeft, niet naar wat hij niet heeft. Want dit zeg ik niet, opdat anderen verlichting zouden hebben, en u verdrukking;", "Ex 4:31": "En het volk geloofde, en zij hoorden, dat de HEERE de kinderen van Israël bezocht had, en dat Hij hun verdrukking gezien had, en zij bogen hun hoofden, en aanbaden.", "Joh 4:21": "Jezus zei tegen haar: Vrouw, geloof Mij, het uur komt waarop u, noch op deze berg, noch in Jeruzalem, de Vader zult aanbidden.", "1 Kron 26:28": "Ook alles wat Samuël, de ziener, geheiligd had, en Saul, de zoon van Kis, en Abner, de zoon van Ner, en Joab, de zoon van Zeruja; al wat iemand geheiligd had, was onder de hand van Selomith en zijn broers.", "Ps 50:10-12": "Want al het gedierte van het woud is Mijn, de dieren op duizend bergen. Ik ken al het gevogelte van de bergen, en het wild van het veld is bij Mij. Zo Mij hongerde, Ik zou het u niet zeggen; want Mijn is de wereld en haar volheid.", "Ezech 11:13": "Het gebeurde nu, toen ik profeteerde, dat Pelatja, de zoon van Benaja, stierf. Toen viel ik neer op mijn gezicht, en riep met luide stem, en zei: Ach, Heere HEERE! Zult U een volledig einde maken met het overblijfsel van Israël?", "Ex 40:9": "Dan zult u de zalfolie nemen en de tabernakel zalven, en alles wat daarin is; en u zult dezelf heiligen, met al zijn gereedschap, en het zal heilig zijn.", "Spr 30:4": "Wie is naar de hemel opgeklommen, en neergedaald? Wie heeft de wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft alle einden van de aarde vastgesteld? Hoe is Zijn Naam, en hoe is de Naam van Zijn Zoon, als u het weet?", "Ps 21:4-6": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud. Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos. Groot is zijn eer door Uw heil; majesteit en heerlijkheid hebt U hem toegevoegd.", "Ps 91:1-16": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige. Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie.", "Ps 72:19": "En geloofd zij de Naam van Zijn heerlijkheid tot in eeuwigheid; en de hele aarde moet met Zijn heerlijkheid vervuld worden. Amen, ja, amen.", "2 Sam 7:20": "En wat zal David nog meer tot U spreken? Want U kent Uw knecht, Heere HEERE!", "Ps 96:3": "Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Joh 16:25-28": "Deze dingen heb Ik door gelijkenissen tot u gesproken; maar de tijd komt dat Ik niet meer door gelijkenissen tot u zal spreken, maar u vrijuit over de Vader zal verkondigen. Op die dag zult u in Mijn Naam bidden; en Ik zeg u niet dat Ik de Vader voor u zal bidden; Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Hand 2:46": "En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "Mark 11:25": "En wanneer u staat om te bidden, vergeef als u iets tegen iemand hebt; opdat ook uw Vader, Die in de hemelen is, u uw overtredingen vergeeft.", "Ps 47:10": "De edelen van de volken zijn verzameld bij het volk van de God van Abraham; want de schilden van de aarde zijn van God. Hij is zeer verheven!", "Jes 48:12": "Hoor naar Mij, o Jakob! En u, Israël, Mijn geroepene! Ik ben Dezelfde; Ik ben de Eerste, ook ben Ik de Laatste.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "1 Kon 8:61": "En uw hart zij volkomen met de HEERE, onze God, om te wandelen in Zijn inzettingen, en Zijn geboden te houden, zoals op deze dag.", "Mark 13:32": "Maar van die dag en dat uur weet niemand, ook de engelen in de hemel niet, en ook de Zoon niet, maar alleen de Vader.", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "1 Joh 3:1": "Zie, hoe grote liefde de Vader ons gegeven heeft, namelijk dat wij kinderen van God genoemd zouden worden. Daarom kent de wereld ons niet, omdat zij Hem niet kent.", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "1 Kor 1:25": "Want het dwaze van God is wijzer dan de mensen; en het zwakke van God is sterker dan de mensen.", "Ps 145:13": "Mem. Uw Koninkrijk is een Koninkrijk van alle eeuwen, en Uw heerschappij is in alle geslacht en geslacht.", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "Ps 22:24-26": "U die de HEERE vreest, prijs Hem; al u nageslacht van Jakob, vereer Hem; en ontzie u voor Hem, al u nageslacht van Israël! Want Hij heeft niet veracht, noch verfoeid de verdrukking van de verdrukte, noch Zijn aangezicht voor hem verborgen; maar Hij heeft gehoord, toen hij tot Hem riep. Van U zal mijn lof zijn in een grote gemeente; ik zal mijn geloften betalen in de tegenwoordigheid van hen die Hem vrezen.", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Kol 3:17": "En alles wat u doet, met woorden of met werken, doe dat alles in de Naam van de Heere Jezus, terwijl u God en de Vader dankt door Hem.", "Dan 5:2": "Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "2 Kon 1:18": "Het overige nu van de daden van Ahazia, die hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "2 Sam 23:2-7": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest. De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God. En Hij zal zijn gelijk het licht van de morgen, wanneer de zon opgaat, een morgen zonder wolken, wanneer door de glans na de regen de grasscheutjes uit de aarde voortkomen.", "Klaagl 3:37": "Mem. Wie zegt iets, en het gebeurt, als de Heere het niet beveelt?", "Ps 119:164": "Ik loof U zevenmaal per dag, over de rechten van Uw gerechtigheid.", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Deut 32:5": "Hij heeft het tegen Hem verdorven; het zijn Zijn kinderen niet; de schandvlek is hun; het is een verkeerd en verdraaid geslacht.", "Ps 30:12": "U hebt mijn weeklagen veranderd in een reidans; U hebt mijn rouwkleed losgemaakt, en mij met blijdschap omgord;", "Matt 6:4": "opdat uw aalmoes in het verborgene is; en uw Vader, Die in het verborgene ziet, Die zal het u in het openbaar vergelden.", "1 Kron 28:14-18": "Het goud gaf hij naar het gewicht in goud, voor alle voorwerpen voor elke dienst; ook zilver voor alle zilveren voorwerpen bij gewicht, voor alle voorwerpen van elke dienst; en het gewicht voor de gouden kandelaars en hun gouden lampen, naar het gewicht van elke kandelaar en zijn lampen; ook voor de zilveren kandelaars, naar het gewicht van een kandelaar en zijn lampen, naar de dienst van elke kandelaar. Ook gaf hij het goud naar het gewicht voor de tafels van de bereiding, voor elke tafel, en het zilver voor de zilveren tafels;", "Gen 8:22": "Voortaan, al de dagen van de aarde, zullen zaaiing en oogst, en koude en hitte, en zomer en winter, en dag en nacht niet ophouden.", "Ps 119:108": "Laat U toch, o HEERE! welgevallen de vrijwillige offeranden van mijn mond, en leer mij Uw rechten.", "Matt 12:42": "De koningin van het zuiden zal opstaan in het oordeel met dit geslacht, en zal het veroordelen; want zij is gekomen van het einde van de aarde, om de wijsheid van Salomo te horen; en zie, meer dan Salomo is hier!", "Hand 13:36": "Want David is, nadat hij in zijn tijd de raad van God gediend had, ontslapen, en is bij zijn vaderen gelegd, en heeft wel verderving gezien;", "Job 42:10": "En de HEERE wendde de gevangenis van Job, toen hij gebeden had voor zijn vrienden; en de HEERE vermeerderde alles wat Job gehad had tot het dubbele.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Ps 102:25-28": "Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht. U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn.", "Ex 14:3": "Farao dan zal zeggen van de kinderen van Israël: Zij zijn verward in het land; die woestijn heeft hen ingesloten.", "Ps 98:1": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven.", "Dan 6:23": "Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "1 Joh 2:13": "Ik schrijf u, vaders! want u hebt Hem gekend, Die er vanaf het begin is. Ik schrijf u, jongemannen, want u hebt de boze overwonnen. Ik schrijf u, kinderen, want u hebt de Vader gekend.", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Matt 25:34-40": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Job 38:8": "Of wie heeft de zee met deuren toegesloten, toen zij uitbrak, en uit de baarmoeder voortkwam?", "Lev 22:29": "En als u een lofoffer aan de HEERE zult slachten, zult u het naar uw wil slachten.", "Rom 14:6": "Hij die de dag in acht neemt, neemt hem in acht voor de Heere; en hij die de dag niet in acht neemt, neemt hem niet in acht voor de Heere. Hij die eet, eet dat voor de Heere, want hij dankt God; en hij die niet eet, eet dat niet voor de Heere, en hij dankt God.", "Lev 8:10": "Toen nam Mozes de zalfolie, en zalfde de tabernakel, en alles wat daarin was, en heiligde ze.", "Deut 10:18": "Die het recht van de wees en van de weduwe doet; en de vreemdeling liefheeft, door hem brood en kleding te geven.", "Jes 60:16": "En u zult de melk van de heidenen zuigen, en u zult de borsten van de koningen zuigen; en u zult weten dat Ik de HEERE ben, uw Heiland, en uw Verlosser, de Machtige van Jakob."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H559\">Verder</s " data-code=\"H3605\">over</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3605\">al</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3605\">de</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H4467\">koninkrijken</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H4467\">van</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H776\">de</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H776\">landen</span>."}, "koppeling_kjv": {"1": "Furthermore <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation,</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> whom <span class=\"wl wl-kjv\" data-code=\"H259\">alone</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H977\">chosen,</span> is yet <span class=\"wl wl-kjv\" data-code=\"H5288\">young</span> and <span class=\"wl wl-kjv\" data-code=\"H7390\">tender,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> is <span class=\"wl wl-kjv\" data-code=\"H1419\">great:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace</span> is not for <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> but for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>", "2": "Now I have <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> with all my <span class=\"wl wl-kjv\" data-code=\"H3581\">might</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> for things to be made of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> for things of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> for things of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass,</span> the <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> for things of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> and <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> for things of <span class=\"wl wl-kjv\" data-code=\"H6086\">wood;</span> <span class=\"wl wl-kjv\" data-code=\"H7718\">onyx</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and stones to be <span class=\"wl wl-kjv\" data-code=\"H4394\">set,</span> <span class=\"wl wl-kjv\" data-code=\"H6320\">glistering</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and of divers <span class=\"wl wl-kjv\" data-code=\"H7553\">colours,</span> and all manner of <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and <span class=\"wl wl-kjv\" data-code=\"H7893\">marble</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance.</span>", "3": "Moreover, because I have set my <span class=\"wl wl-kjv\" data-code=\"H7521\">affection</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> I <span class=\"wl wl-kjv\" data-code=\"H3426\">have</span> of mine own proper <span class=\"wl wl-kjv\" data-code=\"H5459\">good,</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> over and <span class=\"wl wl-kjv\" data-code=\"H4605\">above</span> all that I have <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> for the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span>", "4": "Even <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> of the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> of <span class=\"wl wl-kjv\" data-code=\"H211\">Ophir,</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H2212\">refined</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> to <span class=\"wl wl-kjv\" data-code=\"H2902\">overlay</span> the <span class=\"wl wl-kjv\" data-code=\"H7023\">walls</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> withal:", "5": "The <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> for things of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> for things of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and for all manner of <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> to be made by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of <span class=\"wl wl-kjv\" data-code=\"H2796\">artificers.</span> And who then is <span class=\"wl wl-kjv\" data-code=\"H5068\">willing</span> to <span class=\"wl wl-kjv\" data-code=\"H4390\">consecrate</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">service</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span>", "6": "Then the <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> and of <span class=\"wl wl-kjv\" data-code=\"H3967\">hundreds,</span> with the <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4399\">work,</span> offered <span class=\"wl wl-kjv\" data-code=\"H5068\">willingly,</span>", "7": "And <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> for the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> and ten <span class=\"wl wl-kjv\" data-code=\"H7239\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H150\">drams,</span> and of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents,</span> and of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> <span class=\"wl wl-kjv\" data-code=\"H8083\">eighteen</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents,</span> and one <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron.</span>", "8": "And they with whom precious <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> were <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them to the <span class=\"wl wl-kjv\" data-code=\"H214\">treasure</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3171\">Jehiel</span> the <span class=\"wl wl-kjv\" data-code=\"H1649\">Gershonite.</span>", "9": "Then the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced,</span> for that they offered <span class=\"wl wl-kjv\" data-code=\"H5068\">willingly,</span> because with <span class=\"wl wl-kjv\" data-code=\"H8003\">perfect</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> they offered <span class=\"wl wl-kjv\" data-code=\"H5068\">willingly</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> also <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8057\">joy.</span>", "10": "Wherefore <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">before</span> all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be thou, <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> our <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> and <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>", "11": "Thine, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> is the <span class=\"wl wl-kjv\" data-code=\"H1420\">greatness,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1369\">power,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8597\">glory,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5331\">victory,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1935\">majesty:</span> for all that is in the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> and in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is thine; thine is the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and thou art <span class=\"wl wl-kjv\" data-code=\"H4984\">exalted</span> as <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> above all.", "12": "Both <span class=\"wl wl-kjv\" data-code=\"H6239\">riches</span> and <span class=\"wl wl-kjv\" data-code=\"H3519\">honour</span> come of <span class=\"wl wl-kjv\" data-code=\"H6440\">thee,</span> and thou <span class=\"wl wl-kjv\" data-code=\"H4910\">reignest</span> over all; and in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> is <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> and <span class=\"wl wl-kjv\" data-code=\"H1369\">might;</span> and in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> it is to make <span class=\"wl wl-kjv\" data-code=\"H1431\">great,</span> and to give <span class=\"wl wl-kjv\" data-code=\"H2388\">strength</span> unto all.", "13": "Now therefore, our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> we <span class=\"wl wl-kjv\" data-code=\"H3034\">thank</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> thy <span class=\"wl wl-kjv\" data-code=\"H8597\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name.</span>", "14": "But who am I, and what is my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that we should <span class=\"wl wl-kjv\" data-code=\"H6113\">be</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">able</span> to offer so <span class=\"wl wl-kjv\" data-code=\"H5068\">willingly</span> after this sort? for all things come of thee, and of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">own</span> have we <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thee.", "15": "For we are <span class=\"wl wl-kjv\" data-code=\"H1616\">strangers</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H8453\">sojourners,</span> as were all our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers:</span> our <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> are as a <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow,</span> and there is none <span class=\"wl wl-kjv\" data-code=\"H4723\">abiding.</span>", "16": "O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> all this <span class=\"wl wl-kjv\" data-code=\"H1995\">store</span> that we have <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> thee an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for thine <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> cometh of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and is all thine own.", "17": "I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> also, my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H974\">triest</span> the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H7521\">pleasure</span> in <span class=\"wl wl-kjv\" data-code=\"H3476\">uprightness.</span> As for me, in the <span class=\"wl wl-kjv\" data-code=\"H4339\">uprightness</span> of mine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> I have willingly <span class=\"wl wl-kjv\" data-code=\"H5068\">offered</span> all these things: and now have I <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> with <span class=\"wl wl-kjv\" data-code=\"H8057\">joy</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> which are <span class=\"wl wl-kjv\" data-code=\"H4672\">present</span> here, to offer <span class=\"wl wl-kjv\" data-code=\"H5068\">willingly</span> unto thee.", "18": "O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> this for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> in the <span class=\"wl wl-kjv\" data-code=\"H3336\">imagination</span> of the <span class=\"wl wl-kjv\" data-code=\"H4284\">thoughts</span> of the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [

].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
</body>
