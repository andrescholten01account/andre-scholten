":"Zacharia","href":"../../zacharia/1/"},{"naam":"Maleachi","href":"../../maleachi/1/"},{"naam":"Mattheüs","href":"../../mattheus/1/"},{"naam":"Markus","href":"../../markus/1/"},{"naam":"Lukas","href":"../../lukas/1/"},{"naam":"Johannes","href":"../../johannes/1/"},{"naam":"Handelingen","href":"../../handelingen/1/"},{"naam":"Romeinen","href":"../../romeinen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}]},"vertalingen":{"SVnu":{"1":"De kinderen van Ruben nu, de eerstgeborene van Israël; (want hij was de eerstgeborene; maar omdat hij het bed van zijn vader ontheiligd had, werd zijn eerstgeboorterecht gegeven aan de kinderen van Jozef, de zoon van Israël; maar niet zó, dat hij zich in het geslachtsregister naar het eerstgeboorterecht mocht laten rekenen;","2":"want Juda werd machtig onder zijn broeders, en hij die tot een voorganger was, kwam uit hem; maar het eerstgeboorterecht was van Jozef.)","3":"De kinderen van Ruben, de eerstgeborene van Israël, zijn Hanoch en Pallu, Hezron en Charmi.","4":"De kinderen van Joël: zijn zoon Semaja; zijn zoon Gog; zijn zoon Simeï;","5":"zijn zoon Micha; zijn zoon Reaja; zijn zoon Baäl;","6":"zijn zoon Beëra, die Tiglath-Pilneser, de koning van Assyrië, gevankelijk wegvoerde; hij was de vorst van de Rubenieten.","7":"Aangaande zijn broeders in hun huisgezinnen, toen zij naar hun geboorten in de geslachtsregisters werden opgenomen; de hoofden waren Jehiël en Zecharja,","8":"en Bela, de zoon van Azaz, de zoon van Sema, de zoon van Joël, die woonde te Aroër, tot aan Nebo en Baäl-Meon,","9":"en hij woonde in het oosten, tot aan de ingang van de woestijn, vanaf de rivier de Eufraat; want hun vee was veel geworden in het land Gilead.","10":"En in de dagen van Saul voerden zij oorlog tegen de Hagarenen, die vielen door hun hand; en zij woonden in hun tenten over de gehele oostzijde van Gilead.","11":"De kinderen van Gad nu woonden tegenover hen, in het land Basan, tot aan Salcha toe.","12":"Joël was het hoofd; en Safam de tweede; maar Jaenai en Safat bleven in Basan.","13":"Hun broeders nu, naar hun families, waren Michaël, en Mesullam, en Seba, en Jorai, en Jachan, en Zia, en Heber: zeven.","14":"Dezen zijn de kinderen van Abihaïl, de zoon van Huri, de zoon van Jaroah, de zoon van Gilead, de zoon van Michaël, de zoon van Jesisai, de zoon van Jahdo, de zoon van Buz.","15":"Ahi, de zoon van Abdiël, de zoon van Guni, was het hoofd van het huis van hun vaderen.","16":"En zij woonden in Gilead, in Basan, en in de bijbehorende plaatsen, en in alle voorsteden van Saron, tot aan hun grensgebieden.","17":"Deze allen zijn naar hun geslachtsregisters geteld, in de dagen van Jotham, de koning van Juda, en in de dagen van Jerobeam, de koning van Israël.","18":"Van de kinderen van Ruben, en van de Gadieten, en van de halve stam van Manasse, van de strijdbaarste mannen, die schild en zwaard droegen, en de boog spanden, en ervaren waren in de oorlog, waren vierenveertigduizend zevenhonderdzestig, die uittrokken in het leger.","19":"En zij voerden oorlog tegen de Hagarenen, en tegen Jethur, en Nafis, en Nodab.","20":"Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden.","21":"En zij voerden hun vee gevankelijk weg; van hun kamelen vijftigduizend, en tweehonderdvijftigduizend schapen, en tweeduizend ezels, en honderdduizend mensenzielen.","22":"Want er vielen veel gewonden, omdat de strijd van God was; en zij woonden in hun plaats, totdat zij gevankelijk werden weggevoerd.","23":"De kinderen nu van de halve stam van Manasse woonden in dat land. Zij werden talrijker, van Basan tot aan Baäl-Hermon, en Senir, en de berg Hermon.","24":"Dezen nu waren de hoofden van de families van hun vaderen, te weten: Hefer, en Jisei, en Eliël, en Azriël, en Jeremia, en Hodavja, en Jahdiël; sterke, dappere mannen, mannen van naam, hoofden van de huizen van hun vaderen.","25":"Maar zij hebben tegen de God van hun vaderen overtreden, en de goden van de volken van het land nagehoereerd, die God voor hun aangezicht had weggevaagd.","26":"Zo verwekte de God van Israël de geest van Pul, de koning van Assyrië, en de geest van Tiglath-Pilneser, de koning van Assyrië, die voerde hen gevankelijk weg, te weten de Rubenieten, en de Gadieten, en de halve stam van Manasse; en hij bracht hen naar Halah, en Habor, en Hara, en aan de rivier Gozan, tot op deze dag."},"SV":{"1":"De kinderen van Ruben nu, den eerstgeborene van Israël; ( want hij was de eerstgeborene; maar dewijl hij zijns vaders bed ontheiligd had, werd zijn eerstgeboorte gegeven aan de kinderen van Jozef, den zoon van Israël; doch niet *alzo*, dat hij zich in het geslachtsregister naar de eerstgeboorte rekenen mocht;","2":"Want Juda werd machtig onder zijn broederen, en die tot een voorganger was, was uit hem; doch de eerstgeboorte was van Jozef.)","3":"De kinderen van Ruben, den eerstgeborene van Israël, zijn Hanoch en Pallu, Hezron en Charmi.","4":"De kinderen van Joël: zijn zoon Semaja; zijn zoon Gog; zijn zoon Simeï;","5":"Zijn zoon Micha; zijn zoon Reaja; zijn zoon Baäl;","6":"Zijn zoon Beera, welken Tiglath-pilneser, de koning van Assyrië, gevankelijk wegvoerde; hij was de vorst der Rubenieten.","7":"Aangaande zijn broederen in hun huisgezinnen, als zij naar hun geboorten in de geslachtsregisters gesteld werden; de hoofden zijn geweest Jehiel en Zecharja,","8":"En Bela, de zoon van Azaz, den zoon van Sema, den zoon van Joël, die woonde te Aroer, en tot aan Nebo, en Baäl-meon,","9":"En hij woonde tegen het oosten, tot den ingang der woestijn, van de rivier Frath af; want hun vee was veel geworden in het land van Gilead.","10":"En in de dagen van Saul voerden zij krijg tegen de Hagarenen, die vielen door hun hand; en zij woonden in hun tenten tegen de gehele oostzijde van Gilead.","11":"De kinderen van Gad nu woonden tegen hen over, in het land van Basan, tot Salcha toe.","12":"Joël was het hoofd; en Safam de tweede; maar Jaenai en Safat *bleven* in Basan.","13":"Hun broeders nu, naar hun vaderlijke huizen, waren Michaël, en Mesullam, en Seba, en Jorai, en Jachan, en Zia, en Heber: zeven.","14":"Dezen zijn de kinderen van Abihaïl, den zoon van Huri, den zoon van Jaroah, den zoon van Gilead, den zoon van Michaël, den zoon van Jesisai, den zoon van Jahdo, den zoon van Buz.","15":"Ahi, de zoon van Abdiel, den zoon van Guni, was het hoofd van het huis hunner vaderen.","16":"En zij woonden in Gilead, in Basan, en in haar onderhorige plaatsen, en in al de voorsteden van Saron, tot aan hun uitgangen.","17":"Deze allen zijn naar hun geslachtsregisters geteld, in de dagen van Jotham, den koning van Juda, en in de dagen van Jerobeam, den koning van Israël.","18":"Van de kinderen van Ruben, en van de Gadieten, en van den halven stam van Manasse, van de strijdbaarste mannen, schild en zwaard dragende, en den boog spannende, en ervaren in den krijg, waren vier en veertig duizend zevenhonderd en zestig, uitgaande in het heir.","19":"En zij voerden krijg tegen de Hagarenen, en *tegen* Jethur, en Nafis, en Nodab.","20":"Doch zij werden geholpen tegen hen, en de Hagarenen werden in hun hand gegeven, en allen, die met hen waren; omdat zij tot God riepen in den krijg, zo liet Hij Zich van hen verbidden, dewijl zij op Hem vertrouwden.","21":"En zij voerden hun vee gevankelijk weg; van hun kemelen vijftig duizend, en tweehonderd en vijftig duizend schapen, en twee duizend ezelen, en honderd duizend zielen der mensen.","22":"Want er vielen vele verwonden, dewijl de strijd van God was; en zij woonden in hun plaats, totdat zij gevankelijk weggevoerd werden.","23":"De kinderen nu van den halven stam van Manasse woonden in dat land. Zij werden vermenigvuldigd van Basan tot aan Baäl-hermon, en Senir, en den berg Hermon.","24":"Dezen nu waren de hoofden hunner vaderlijke huizen, te weten: Hefer, en Jisei, en Eliël, en Azriël, en Jeremia, en Hodavja, en Jahdiel; mannen sterk van kracht, mannen van naam, hoofden der huizen hunner vaderen.","25":"Maar zij hebben tegen den God hunner vaderen overtreden, en de goden der volken des lands nagehoereerd, welke God voor hun aangezichten had verdelgd.","26":"Zo verwekte de God Israëls den geest van Pul, den koning van Assyrië, en den geest van Tiglath-pilneser, den koning van Assyrië, die voerde hen gevankelijk weg, *te* *weten* de Rubenieten, en de Gadieten, en den halven stam van Manasse; en hij bracht hen te Halah, en Habor, en Hara, en aan de rivier Gozan, tot op dezen dag."},"KJV":{"1":"Now the sons of Reuben the firstborn of Israel, (for he was the firstborn; but, forasmuch as he defiled his father's bed, his birthright was given unto the sons of Joseph the son of Israel: and the genealogy is not to be reckoned after the birthright.","2":"For Judah prevailed above his brethren, and of him came the chief ruler; but the birthright was Joseph's:)","3":"The sons, I say, of Reuben the firstborn of Israel were, Hanoch, and Pallu, Hezron, and Carmi.","4":"The sons of Joel; Shemaiah his son, Gog his son, Shimei his son,","5":"Micah his son, Reaia his son, Baal his son,","6":"Beerah his son, whom Tilgathpilneser king of Assyria carried away captive: he was prince of the Reubenites.","7":"And his brethren by their families, when the genealogy ➔ of their generations was reckoned, were the chief, Jeiel, and Zechariah,","8":"And Bela the son of Azaz, the son of Shema, the son of Joel, who dwelt in Aroer, even unto Nebo and Baalmeon:","9":"And eastward he inhabited unto the entering in of the wilderness from the river Euphrates: because their cattle were multiplied in the land of Gilead.","10":"And in the days of Saul they made war with the Hagarites, who fell by their hand: and they dwelt in their tents throughout all the east land of Gilead.","11":"And the children of Gad dwelt over against them, in the land of Bashan unto Salchah:","12":"Joel the chief, and Shapham the next, and Jaanai, and Shaphat in Bashan.","13":"And their brethren of the house of their fathers were, Michael, and Meshullam, and Sheba, and Jorai, and Jachan, and Zia, and Heber, seven.","14":"These are the children of Abihail the son of Huri, the son of Jaroah, the son of Gilead, the son of Michael, the son of Jeshishai, the son of Jahdo, the son of Buz;","15":"Ahi the son of Abdiel, the son of Guni, chief of the house of their fathers.","16":"And they dwelt in Gilead in Bashan, and in her towns, and in all the suburbs of Sharon, upon their borders.","17":"All these were reckoned by genealogies in the days of Jotham king of Judah, and in the days of Jeroboam king of Israel.","18":"The sons of Reuben, and the Gadites, and half the tribe of Manasseh, of valiant men, men able to bear buckler and sword, and to shoot with bow, and skilful in war, were four and forty thousand seven hundred and threescore, that went out to the war.","19":"And they made war with the Hagarites, with Jetur, and Nephish, and Nodab.","20":"And they were helped against them, and the Hagarites were delivered into their hand, and all that were with them: for they cried to God in the battle, and he was intreated of them; because they put their trust in him.","21":"And they took away their cattle; of their camels fifty thousand, and of sheep two hundred and fifty thousand, and of asses two thousand, and of men an hundred thousand.","22":"For there fell down many slain, because the war was of God. And they dwelt in their steads until the captivity.","23":"And the children of the half tribe of Manasseh dwelt in the land: they increased from Bashan unto Baalhermon and Senir, and unto mount Hermon.","24":"And these were the heads of the house of their fathers, even Epher, and Ishi, and Eliel, and Azriel, and Jeremiah, and Hodaviah, and Jahdiel, mighty men of valour, famous men, and heads of the house of their fathers.","25":"And they transgressed against the God of their fathers, and went a whoring after the gods of the people of the land, whom God destroyed before them.","26":"And the God of Israel stirred up the spirit of Pul king of Assyria, and the spirit of Tilgathpilneser king of Assyria, and he carried them away, even the Reubenites, and the Gadites, and the half tribe of Manasseh, and brought them unto Halah, and Habor, and Hara, and to the river Gozan, unto this day."}},"tsk":{"1":[{"kopje":"hij was","refs":["1 Kron 2:1","Gen 29:32","Gen 46:8","Gen 49:3","Ex 6:13","Num 1:5","Num 16:1","Num 26:5"]},{"kopje":"omdat","refs":["Gen 35:22","Gen 49:4","Lev 18:8","Lev 20:11","Deut 27:20","1 Kor 5:1"]},{"kopje":"eerstgeboorterecht","refs":["1 Kron 26:10","Gen 48:15-22","Deut 21:17","Kol 1:15"]},{"kopje":"en","refs":["Gen 25:23","1 Sam 16:6-11"]},{"kopje":"rekenen","refs":["Joz 14:6"]}],"2":[{"kopje":"Juda","refs":["Gen 35:23","Gen 49:8-10","Num 2:3","Num 7:12","Joz 14:6","Richt 1:2","Ps 60:9","Ps 108:9","Micha 5:1","Matt 2:6","Hebr 7:14","Openb 5:5"]},{"kopje":"een voorganger","refs":["Gen 49:10","1 Sam 1 an> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H8346\">threescore,</span> that went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to the <span class=\"wl wl-kjv\" data-code=\"H6635\">war.</span>","19":"And they <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> with the <span class=\"wl wl-kjv\" data-code=\"H1905\">Hagarites,</span> with <span class=\"wl wl-kjv\" data-code=\"H3195\">Jetur,</span> and <span class=\"wl wl-kjv\" data-code=\"H5305\">Nephish,</span> and <span class=\"wl wl-kjv\" data-code=\"H5114\">Nodab.</span>","20":"And they were <span class=\"wl wl-kjv\" data-code=\"H5826\">helped</span> against them, and the <span class=\"wl wl-kjv\" data-code=\"H1905\">Hagarites</span> were <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and all that were with them: for they <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> to <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> and he was <span class=\"wl wl-kjv\" data-code=\"H6279\">intreated</span> of them; because they put their <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> in him.","21":"And they took <span class=\"wl wl-kjv\" data-code=\"H7617\">away</span> their <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle;</span> of their <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> and of <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> and of <span class=\"wl wl-kjv\" data-code=\"H2543\">asses</span> two <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> and of <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand.</span>","22":"For there <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> down <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H2491\">slain,</span> because the <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> was of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span> And they <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in their steads until the <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity.</span>","23":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> they <span class=\"wl wl-kjv\" data-code=\"H7235\">increased</span> from <span class=\"wl wl-kjv\" data-code=\"H1316\">Bashan</span> unto <span class=\"wl wl-kjv\" data-code=\"H1179\">Baalhermon</span> and <span class=\"wl wl-kjv\" data-code=\"H8149\">Senir,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H2768\">Hermon.</span>","24":"And these were the <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> even <span class=\"wl wl-kjv\" data-code=\"H6081\">Epher,</span> and <span class=\"wl wl-kjv\" data-code=\"H3469\">Ishi,</span> and <span class=\"wl wl-kjv\" data-code=\"H447\">Eliel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5837\">Azriel,</span> and <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H1938\">Hodaviah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3164\">Jahdiel,</span> <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour,</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">famous</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","25":"And they <span class=\"wl wl-kjv\" data-code=\"H4603\">transgressed</span> against the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and went a <span class=\"wl wl-kjv\" data-code=\"H2181\">whoring</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> whom <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them.","26":"And the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> stirred <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H6322\">Pul</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H8407\">Tilgathpilneser</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and he carried them <span class=\"wl wl-kjv\" data-code=\"H1540\">away,</span> even the <span class=\"wl wl-kjv\" data-code=\"H7206\">Reubenites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1425\">Gadites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them unto <span class=\"wl wl-kjv\" data-code=\"H2477\">Halah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2249\">Habor,</span> and <span class=\"wl wl-kjv\" data-code=\"H2024\">Hara,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> <span class=\"wl wl-kjv\" data-code=\"H1470\">Gozan,</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ontheiligd had,","tekst":"Te weten, beslapende Bilha zijns vaders bijwijf, Gen 35:22 . Zie Gen 49:4 ."},{"catchword":"eerstgeboorte","tekst":"Dat is, het recht, dat de eerstgeborene had boven zijn broeders, genietende dubbele portie of deel in het erfgoed, Deu 21:17 . Dit werd Jozef en zijnen zonen gegeven, want in de uitdeling van het land Kanaän zijn Efraïm en Manasse nevens de andere stammen in het lot gesteld, om hun deel te hebben. Zie van Jozef Gen 48:22 , en van zijn zonen, Gen 48:5 ."}],"2":[{"catchword":"Juda","tekst":"Van de heerlijkheid en treffelijkheid van Juda, zie Gen 49:8 , enz."},{"catchword":"uit hem;","tekst":"Anders, hij werd tot een voorganger voor, of, boven hem; te weten, boven JoZEf. Of, aangaande den voorganger was hij meer dan hij; te weten, dan JoZEf. Eerst zijn de koningen, daarna de vorsten of regenten des lands, uit den stam van Juda, uit den huize Davids geweest, tot de tijden van Herodes, als de Silo gekomen is; Gen 49:10 ."},{"catchword":"de eerstgeboorte","tekst":"Te weten, zoveel de dubbele portie der goederen aanging, gelijk vs.1 gezegd is. Zie Gen 48:5 , en Gen 49:22 , enz."}],"6":[{"catchword":"Tiglath-pilneser,","tekst":"Hij wordt ook Tiglath-Pileser genoemd 2Ki 15:29 , en 2Ki 16:7 ."},{"catchword":"hij was de vorst","tekst":"Te weten, Joël, die de zoon Hanoch, den eerstgeborene van Ruben, schijnt geweest te zijn, en daarom vorst der Rubenieten."}],"7":[{"catchword":"zijn broederen","tekst":"Te weten, Hanochs broeders, die vs.3 uitgedrukt werden."},{"catchword":"gesteld","tekst":"Zie onder, vs.17."}],"8":[{"catchword":"die woonde","tekst":"Versta dit van Bela, of van zijn geslacht, of in het algemeen van Ruben en zijne nakomelingen. Zie Jos 13:15-16 , waar Rubens erfdeel ook beschreven wordt."}],"9":[{"catchword":"den ingang","tekst":"Dat is, van de rivier Eufraat tot aan de Jordaan."},{"catchword":"hun vee","tekst":"Te weten, der broeders van Joël, waarvan vs.7 gesproken is."}],"10":[{"catchword":"voerden","tekst":"Hebreeuws, maakten, of, deden."},{"catchword":"Hagarenen,","tekst":"Dezen zijn Ismaëlieten geweest, en worden Hagarenen genoemd omdat zij van Hagar de dienstmaagd van Abraham, Ismaëls moeder, afkomstig waren."},{"catchword":"die vielen","tekst":"Te weten, de Hagarenen."},{"catchword":"zij woonden","tekst":"Te weten, de Israëlieten."}],"12":[{"catchword":"bleven","tekst":"Te weten, om hun eigen landpalen te beschermen, terwijl hun broeders den krijg voerden."}],"14":[{"catchword":"Dezen zijn de kinderen van Abihaïl,","tekst":"Te weten, die, van welken straks gesproken is, vs.13."}],"16":[{"catchword":"in haar onderhorige","tekst":"Dat is, in de kleine steden, dorpen en vlekken, behorende onder de grote steden. Hebreeuws, dochteren."},{"catchword":"Saron,","tekst":"Waar goede weide was. Dit Saron was in Gilead gelegen. Zie van een ander Saron in Efraïm, Son 2:1 ."}],"17":[{"catchword":"Jotham,","tekst":"Toen hij het koninkrijk als stadhouder zijns vaders bediende, dewijl zijn vader van melaatsheid geslagen was; 2Ki 15:5 ."},{"catchword":"Jeróbeam,","tekst":"Versta hier, Jerobeam, den tweeden van dien naam, den zon van Joas, 2Ki 13:13 , en 2Ki 14:23 ; want Jerobeam, de zoon van Nebat, was al lang dood."}],"18":[{"catchword":"boog spannende,","tekst":"Zie de aantekening onder, 1Ch 8:40 ."}],"19":[{"catchword":"Jethur, Nafis, Nodab","tekst":"Zie van dezen Gen 25:15 , waar te zien is dat zij Israëlieten geweest zijn."}],"20":[{"catchword":"werden geholpen","tekst":"Te weten, van God, vs.22."},{"catchword":"tegen hen,","tekst":"Te weten, tegen de Hagarenen."}],"22":[{"catchword":"verwonden,","tekst":"Dat is, die dodelijk verwond zijnde, van de kwetsuur stierven."},{"catchword":"van God was;","tekst":"Dat is, God streed voor hen tegen hun vijanden."},{"catchword":"gevankelijk","tekst":"Te weten, naar Assyrië. Zie 2Ki 17:6 , en 2Ki 15:29 ."}],"23":[{"catchword":"en den berg Hermon","tekst":"Zie Deu 3:9 ."}],"25":[{"catchword":"nagehoereerd,","tekst":"Te weten, met menigerlei schrikkelijke afgoderij, gelijk verhaald wordt 2Ki 17:7 , enz."}],"26":[{"catchword":"Zo verwekte","tekst":"Zie 2Ki 15:19 ."},{"catchword":"hij bracht hen te Halah,","tekst":"Versta dit van de eerste wegvoering, waarvan 2Ki 15:29 ; maar 2Ki 17:6 wordt verhaald de laatste wegvoering door Salmanasser."},{"catchword":"tot op dezen dag","tekst":"Dat is, daar zijn zij tot op dezen dag. Versta, dat deze wegvoering duurde tot op dien dag, of dat zij daar woonden tot op dien dag, in welken dit geschreven is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now the children of Reuben the first-born of Israel (for he was the first-born, but forasmuch as he defiled his fathers bed [Lying with Bilha his fathers concubine, Gen 35:22. See also Gen 49:3.] his birth-right was given to the children of Joseph the son of Israel: [that is, the right which the first-born had above his brethren, enjoying a double portion or part in the inheritance, Deut.21.17. this was given to Joseph and his sons; for in the division of the land of Canaan, Ephraim and Manasseh were placed among the rest of the tribes, to have their share with them. See of Joseph Gen 48:22. and of his sons, Gen 48:5.] yet not (so), that he might reckon himself in the genelogy according to the birth-right."}],"2":[{"catchword":null,"tekst":"For Juda waxed mighty among his brethren, [Of Juda&acirc;&euro;&trade;s dominion and excellency, see Gen.49.v.8.etc.] and he that was a leader, was of him; [Oth. Be became a leader for, or, over him; to wit, over Joseph: or; as concerning the Leader he was more then he; to wit, then Joseph. First the Kings, then Princes or Rulers of the land, were of the tribe of Juda, of the house and family of David, until the time of Herod, when Silo came, Gen 49:10.] but the birth-right was Josephs.) [to wit, as much as concerned the double portion of the goods or estate as was said v.1. See Gen 48:5. and 49.22. etc.]"}],"3":[{"catchword":null,"tekst":"The children of Reuben the first-born of Israel are Hanoch, and Pallu, Hezron, and Charmi."}],"4":[{"catchword":null,"tekst":"The children of Joel, Semaaja his son, Gog his son, Simei his son."}],"5":[{"catchword":null,"tekst":"Micha his son, Reaja his son, Baal his son."}],"6":[{"catchword":null,"tekst":"Beera his son, whom Tilgath Pilneser [He is also called Tilgath-Pileser, 2 Kings 15.29. and 16.7.] the king of Assyria carried away captive, he was Prince of the Reubenites [he, to wit, Joel, who seemeth to have been the son of Hanoch, the first-born of Reuben, and therefore Prince of the Reubenites.]"}],"7":[{"catchword":null,"tekst":"As for his brethren, [To wit, Hanochs brethren, who are expressed v.3.] in their families, when they were according to their generations put in the genealogys: [see below v.17.] the heads (or chief) were Jeiel and Zacharja."}],"8":[{"catchword":null,"tekst":"And Bela the son of Azaz, the son of Sema, the son of Joel, the same [Understand this Bela, or of his Family, or in general of Reubens inheritance is also described] dwelt at Aroer, and unto Nebo, and Baal Meon."}],"9":[{"catchword":null,"tekst":"And he dwelt East-ward, unto the entering in of the wilderness, from the River Phrath: [i.e. from the River Euphrates unto the Jordan] for their cattle [to wit, the cattle of the brethren of Joel, of whom is spoken v.7.] were multiplied in the land of Gilead."}],"10":[{"catchword":null,"tekst":"And in the days of Saul they waged [Heb. made, or, did] war against the Hagarens [these were Ismaelites, and are called Hagarens because they came of Hagar, Abrahams maid-servant, Ismaels mother: They dwelt in Arabia the desert] those [to wit, the Hagarens] fell by their hand: and they [to wit, the Israelites] dwelt in their tents toward all the East-side of Gilead."}],"11":[{"catchword":null,"tekst":"Now the children of Gad dwelt over against them, in the land of Basan unto Salcha."}],"12":[{"catchword":null,"tekst":"Joel was the head (or chief) and Saphan the second: But Jaenai and Saphat (tarried) in Basan. [To wit, to defend their own borders, while their brethren waged war.]"}],"13":[{"catchword":null,"tekst":"Now their brethren, according to the houses of their fathers, were Michal, and Messullam, and Seba, and Jorai, and Jachan, and Zia, and Heber, seven."}],"14":[{"catchword":null,"tekst":"These [To wit, those, of whom even now was spoken, v.13.] are the children of ABihail, the son of Huri, the son of Harvah, the son of Gilead, the son of Michael, the son of Jesisai, the son of Jahdo, the son of Buz."}],"15":[{"catchword":null,"tekst":"Ahi the son of Abdiel, the son of Gani was the head (or chief) of the house of their Fathers."}],"16":[{"catchword":null,"tekst":"And they dwelt in Gilead, in Basan, and in their dependant places: [That is, in the small cities, towns, and villages, resorting under the great cities. Hebr. daughters] and in suburbs of Saaron, [where there was good pasture. This Saron lay in Gilead. See of another Saron in Ephraim, Cant.2.1.] until their goings out."}],"17":[{"catchword":null,"tekst":"All these are numbered according to their genealogies the days of Jotham king of Juda: [When he as Deputy of his Father governed the Kingdom, while his Father was smitten with leprosy, 2 Kings 15.5.] and in the days of Jerobeam the king of Israel. [understand here Jerobeam the second of the name, the son of Joas, 2 Kings 13.13. and 14. For Jerobeam the son of Nebat had been dead long before.]"}],"18":[{"catchword":null,"tekst":"Of the children of Reuben, and of the Gadites and of the half tribe of Manasseh, of the most warlike men, bearing shield and sword, and bending the bow, [See the annotate. Below chap.8.20.] and expert in the war, (there) were four and fourty thousand, and seven hundred and threescore that went forth into the host."}],"19":[{"catchword":null,"tekst":"And they waged war against the Hagarens: And (against) Jetur, and Nephis, and Nodab. [See of these Gen 25:14. where it appeareth, that they were Ismaelites.]"}],"20":[{"catchword":null,"tekst":"But they were helped [To wit, of God, v.22.] against them, [to wit, against the Hagarens] and the Hagarens were delivered into their hand, etc all that werewith them: because they cryed to God in the battle, he suffered himself to be intreated of them, for as much as they trusted in him."}],"21":[{"catchword":null,"tekst":"And they carried away captive their cattle, of their camels fifty thousand: And two hundred and fifty thousand sheep, and two thousand asses, and an hundred thousand souls of men."}],"22":[{"catchword":null,"tekst":"For there fell many wounded, [i.e. who being mortally wounded, died of their wounds] because the battle was of God: [i.e. God fought for them against their Enemies] And they dwelt in their room until they were carried away const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
