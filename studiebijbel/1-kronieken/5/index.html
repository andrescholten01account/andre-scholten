on en Charmi.","4":"De kinderen van Joël: zijn zoon Semaja; zijn zoon Gog; zijn zoon Simeï;","5":"zijn zoon Micha; zijn zoon Reaja; zijn zoon Baäl;","6":"zijn zoon Beëra, die Tiglath-Pilneser, de koning van Assyrië, gevankelijk wegvoerde; hij was de vorst van de Rubenieten.","7":"Aangaande zijn broeders in hun huisgezinnen, toen zij naar hun geboorten in de geslachtsregisters werden opgenomen; de hoofden waren Jehiël en Zecharja,","8":"en Bela, de zoon van Azaz, de zoon van Sema, de zoon van Joël, die woonde te Aroër, tot aan Nebo en Baäl-Meon,","9":"en hij woonde in het oosten, tot aan de ingang van de woestijn, vanaf de rivier de Eufraat; want hun vee was veel geworden in het land Gilead.","10":"En in de dagen van Saul voerden zij oorlog tegen de Hagarenen, die vielen door hun hand; en zij woonden in hun tenten over de gehele oostzijde van Gilead.","11":"De kinderen van Gad nu woonden tegenover hen, in het land Basan, tot aan Salcha toe.","12":"Joël was het hoofd; en Safam de tweede; maar Jaenai en Safat bleven in Basan.","13":"Hun broeders nu, naar hun families, waren Michaël, en Mesullam, en Seba, en Jorai, en Jachan, en Zia, en Heber: zeven.","14":"Dezen zijn de kinderen van Abihaïl, de zoon van Huri, de zoon van Jaroah, de zoon van Gilead, de zoon van Michaël, de zoon van Jesisai, de zoon van Jahdo, de zoon van Buz.","15":"Ahi, de zoon van Abdiël, de zoon van Guni, was het hoofd van het huis van hun vaderen.","16":"En zij woonden in Gilead, in Basan, en in de bijbehorende plaatsen, en in alle voorsteden van Saron, tot aan hun grensgebieden.","17":"Deze allen zijn naar hun geslachtsregisters geteld, in de dagen van Jotham, de koning van Juda, en in de dagen van Jerobeam, de koning van Israël.","18":"Van de kinderen van Ruben, en van de Gadieten, en van de halve stam van Manasse, van de strijdbaarste mannen, die schild en zwaard droegen, en de boog spanden, en ervaren waren in de oorlog, waren vierenveertigduizend zevenhonderdzestig, die uittrokken in het leger.","19":"En zij voerden oorlog tegen de Hagarenen, en tegen Jethur, en Nafis, en Nodab.","20":"Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden.","21":"En zij voerden hun vee gevankelijk weg; van hun kamelen vijftigduizend, en tweehonderdvijftigduizend schapen, en tweeduizend ezels, en honderdduizend mensenzielen.","22":"Want er vielen veel gewonden, omdat de strijd van God was; en zij woonden in hun plaats, totdat zij gevankelijk werden weggevoerd.","23":"De kinderen nu van de halve stam van Manasse woonden in dat land. Zij werden talrijker, van Basan tot aan Baäl-Hermon, en Senir, en de berg Hermon.","24":"Dezen nu waren de hoofden van de families van hun vaderen, te weten: Hefer, en Jisei, en Eliël, en Azriël, en Jeremia, en Hodavja, en Jahdiël; sterke, dappere mannen, mannen van naam, hoofden van de huizen van hun vaderen.","25":"Maar zij hebben tegen de God van hun vaderen overtreden, en de goden van de volken van het land nagehoereerd, die God voor hun aangezicht had weggevaagd.","26":"Zo verwekte de God van Israël de geest van Pul, de koning van Assyrië, en de geest van Tiglath-Pilneser, de koning van Assyrië, die voerde hen gevankelijk weg, te weten de Rubenieten, en de Gadieten, en de halve stam van Manasse; en hij bracht hen naar Halah, en Habor, en Hara, en aan de rivier Gozan, tot op deze dag."},"SV":{"1":"De kinderen van Ruben nu, den eerstgeborene van Israël; ( want hij was de eerstgeborene; maar dewijl hij zijns vaders bed ontheiligd had, werd zijn eerstgeboorte gegeven aan de kinderen van Jozef, den zoon van Israël; doch niet *alzo*, dat hij zich in het geslachtsregister naar de eerstgeboorte rekenen mocht;","2":"Want Juda werd machtig onder zijn broederen, en die tot een voorganger was, was uit hem; doch de eerstgeboorte was van Jozef.)","3":"De kinderen van Ruben, den eerstgeborene van Israël, zijn Hanoch en Pallu, Hezron en Charmi.","4":"De kinderen van Joël: zijn zoon Semaja; zijn zoon Gog; zijn zoon Simeï;","5":"Zijn zoon Micha; zijn zoon Reaja; zijn zoon Baäl;","6":"Zijn zoon Beera, welken Tiglath-pilneser, de koning van Assyrië, gevankelijk wegvoerde; hij was de vorst der Rubenieten.","7":"Aangaande zijn broederen in hun huisgezinnen, als zij naar hun geboorten in de geslachtsregisters gesteld werden; de hoofden zijn geweest Jehiel en Zecharja,","8":"En Bela, de zoon van Azaz, den zoon van Sema, den zoon van Joël, die woonde te Aroer, en tot aan Nebo, en Baäl-meon,","9":"En hij woonde tegen het oosten, tot den ingang der woestijn, van de rivier Frath af; want hun vee was veel geworden in het land van Gilead.","10":"En in de dagen van Saul voerden zij krijg tegen de Hagarenen, die vielen door hun hand; en zij woonden in hun tenten tegen de gehele oostzijde van Gilead.","11":"De kinderen van Gad nu woonden tegen hen over, in het land van Basan, tot Salcha toe.","12":"Joël was het hoofd; en Safam de tweede; maar Jaenai en Safat *bleven* in Basan.","13":"Hun broeders nu, naar hun vaderlijke huizen, waren Michaël, en Mesullam, en Seba, en Jorai, en Jachan, en Zia, en Heber: zeven.","14":"Dezen zijn de kinderen van Abihaïl, den zoon van Huri, den zoon van Jaroah, den zoon van Gilead, den zoon van Michaël, den zoon van Jesisai, den zoon van Jahdo, den zoon van Buz.","15":"Ahi, de zoon van Abdiel, den zoon van Guni, was het hoofd van het huis hunner vaderen.","16":"En zij woonden in Gilead, in Basan, en in haar onderhorige plaatsen, en in al de voorsteden van Saron, tot aan hun uitgangen.","17":"Deze allen zijn naar hun geslachtsregisters geteld, in de dagen van Jotham, den koning van Juda, en in de dagen van Jerobeam, den koning van Israël.","18":"Van de kinderen van Ruben, en van de Gadieten, en van den halven stam van Manasse, van de strijdbaarste mannen, schild en zwaard dragende, en den boog spannende, en ervaren in den krijg, waren vier en veertig duizend zevenhonderd en zestig, uitgaande in het heir.","19":"En zij voerden krijg tegen de Hagarenen, en *tegen* Jethur, en Nafis, en Nodab.","20":"Doch zij werden geholpen tegen hen, en de Hagarenen werden in hun hand gegeven, en allen, die met hen waren; omdat zij tot God riepen in den krijg, zo liet Hij Zich van hen verbidden, dewijl zij op Hem vertrouwden.","21":"En zij voerden hun vee gevankelijk weg; van hun kemelen vijftig duizend, en tweehonderd en vijftig duizend schapen, en twee duizend ezelen, en honderd duizend zielen der mensen.","22":"Want er vielen vele verwonden, dewijl de strijd van God was; en zij woonden in hun plaats, totdat zij gevankelijk weggevoerd werden.","23":"De kinderen nu van den halven stam van Manasse woonden in dat land. Zij werden vermenigvuldigd van Basan tot aan Baäl-hermon, en Senir, en den berg Hermon.","24":"Dezen nu waren de hoofden hunner vaderlijke huizen, te weten: Hefer, en Jisei, en Eliël, en Azriël, en Jeremia, en Hodavja, en Jahdiel; mannen sterk van kracht, mannen van naam, hoofden der huizen hunner vaderen.","25":"Maar zij hebben tegen den God hunner vaderen overtreden, en de goden der volken des lands nagehoereerd, welke God voor hun aangezichten had verdelgd.","26":"Zo verwekte de God Israëls den geest van Pul, den koning van Assyrië, en den geest van Tiglath-pilneser, den koning van Assyrië, die voerde hen gevankelijk weg, *te* *weten* de Rubenieten, en de Gadieten, en den halven stam van Manasse; en hij bracht hen te Halah, en Habor, en Hara, en aan de rivier Gozan, tot op dezen dag."},"KJV":{"1":"Now the sons of Reuben the firstborn of Israel, (for he was the firstborn; but, forasmuch as he defiled his father's bed, his birthright was given unto the sons of Joseph the son of Israel: and the genealogy is not to be reckoned after the birthright.","2":"For Judah prevailed above his brethren, and of him came the chief ruler; but the birthright was Joseph's:)","3":"The sons, I say, of Reuben the firstborn of Israel were, Hanoch, and Pallu, Hezron, and Carmi.","4":"The sons of Joel; Shemaiah his son, Gog his son, Shimei his son,","5":"Micah his son, Reaia his son, Baal his son,","6":"Beerah his son, whom Tilgathpilneser king of Assyria carried away captive: he was prince of the Reubenites.","7":"And his brethren by their families, when the genealogy ➔ of their generations was reckoned, were the chief, Jeiel, and Zechariah,","8":"And Bela the son of Azaz, the son of Shema, the son of Joel, who dwelt in Aroer, even unto Nebo and Baalmeon:","9":"And eastward he inhabited unto the entering in of the wilderness from the river Euphrates: because their cattle were multiplied in the land of Gilead.","10":"And in the days of Saul they made war with the Hagarites, who fell by their hand: and they dwelt in their tents throughout all the east land of Gilead.","11":"And the children of Gad dwelt over against them, in the land of Bashan unto Salchah:","12":"Joel the chief, and Shapham the next, and Jaanai, and Shaphat in Bashan.","13":"And their brethren of the house of their fathers were, Michael, and Meshullam, and Sheba, and Jorai, and Jachan, and Zia, and Heber, seven.","14":"These are the children of Abihail the son of Huri, the son of Jaroah, the son of Gilead, the son of Michael, the son of Jeshishai, the son of Jahdo, the son of Buz;","15":"Ahi the son of Abdiel, the son of Guni, chief of the house of their fathers.","16":"And they dwelt in Gilead in Bashan, and in her towns, and in all the suburbs of Sharon, upon their borders.","17":"All these were reckoned by genealogies in the days of Jotham king of Judah, and in the days of Jeroboam king of Israel.","18":"The sons of Reuben, and the Gadites, and half the tribe of Manasseh, of valiant men, men able to bear buckler and sword, and to shoot with bow, and skilful in war, were four and forty thousand seven hundred and threescore, that went out to the war.","19":"And they made war with the Hagarites, with Jetur, and Nephish, and Nodab.","20":"And they were helped against them, and the Hagarites were delivered into their hand, and all that were with them: for they cried to God in the battle, and he was intreated of them; because they put their trust in him.","21":"And they took away their cattle; of their camels fifty thousand, and of sheep two hundred and fifty thousand, and of asses two thousand, and of men an hundred thousand.","22":"For there fell down many slain, because the war was of God. And they dwelt in their steads until the captivity.","23":"And the children of the half tribe of Manasseh dwelt in the land: they increased from Bashan unto Baalhermon and Senir, and unto mount Hermon.","24":"And these were the heads of the house of their fathers, even Epher, and Ishi, and Eliel, and Azriel, and Jeremiah, and Hodaviah, and Jahdiel, mighty men of valour, famous men, and heads of the house of their fathers.","25":"And they transgressed against the God of their fathers, and went a whoring after the gods of the people of the land, whom God destroyed before them.","26":"And the God of Israel stirred up the spirit of Pul king of Assyria, and the spirit of Tilgathpilneser king of Assyria, and he carried them away, even the Reubenites, and the Gadites, and the half tribe of Manasseh, and brought them unto Halah, and Habor, and Hara, and to the river Gozan, unto this day."}},"tsk":{"1":[{"kopje":"hij was","refs":["1 Kron 2:1","Gen 29:32","Gen 46:8","Gen 49:3","Ex 6:13","Num 1:5","Num 16:1","Num 26:5"]},{"kopje":"omdat","refs":["Gen 35:22","Gen 49:4","Lev 18:8","Lev 20:11","Deut 27:20","1 Kor 5:1"]},{"kopje":"eerstgeboorterecht","refs":["1 Kron 26:10","Gen 48:15-22","Deut 21:17","Kol 1:15"]},{"kopje":"en","refs":["Gen 25:23","1 Sam 16:6-11"]},{"kopje":"rekenen","refs":["Joz 14:6"]}],"2":[{"kopje":"Juda","refs":["Gen 35:23","Gen 49:8-10","Num 2:3","Num 7:12","Joz 14:6","Richt 1:2","Ps 60:9","Ps 108:9","Micha 5:1","Matt 2:6","Hebr 7:14","Openb 5:5"]},{"kopje":"een voorganger","refs":["Gen 49:10","1 Sam 1 en te zijn in het boek.","Num 26:5":"Ruben was de eerstgeborene van Israël. De zonen van Ruben waren: Hanoch, van wie het geslacht der Hanochieten was; van Pallu het geslacht der Palluieten;","Ps 89:37":"Zijn zaad zal in eeuwigheid zijn, en zijn troon zal voor Mij zijn als de zon.","Jes 63:15-17":"Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in. U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam. HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.","2 Kron 13:14":"Toen Juda nu omkeek, zie, toen hadden zij de strijd vóór en achter zich; en zij riepen tot de HEERE, en de priesters bliezen op de trompetten.","Richt 6:4":"En zij legerden zich tegen hen, en vernielden de opbrengst van het land, tot waar u bij Gaza komt; en zij lieten geen middelen van bestaan over in Israël, geen klein vee, geen os, geen ezel.","Ps 31:15-19":"Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God. Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers. Laat Uw aangezicht over Uw knecht lichten; verlos mij door Uw goedertierenheid.","Luk 3:23-38":"En Hij, Jezus, was ongeveer dertig jaar oud toen Hij Zijn werk begon, en Hij was (naar men meende) de zoon van Jozef, de zoon van Heli, de zoon van Matthat, de zoon van Levi, de zoon van Melchi, de zoon van Janna, de zoon van Jozef, de zoon van Mattathias, de zoon van Amos, de zoon van Naum, de zoon van Esli, de zoon van Naggai,","Ps 57:3":"Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.","Jer 14:19-21":"Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking. HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd. Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.","Lev 18:6-18":"Niemand zal tot enige nabestaande van het eigen vlees naderen, om de schaamte te ontdekken; Ik ben de HEERE! U zult de schaamte van uw vader en de schaamte van uw moeder niet ontdekken; zij is uw moeder; u zult haar schaamte niet ontdekken. U zult de schaamte van de vrouw van uw vader niet ontdekken; het is de schaamte van uw vader.","Hand 3:17":"En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.","Ezech 27:13":"Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlinge handel met u.","2 Sam 12:22":"En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.","Matt 13:56":"En Zijn zusters, zijn die niet allemaal bij ons? Waar komt dan bij Deze dit alles vandaan?","Joz 14:6":"Toen naderden de kinderen van Juda tot Jozua, te Gilgal, en Kaleb, de zoon van Jefunne, de Keneziet, zei tegen hem: U weet het woord dat de HEERE tot Mozes, de man van God, gesproken heeft te Kades-Barnea, vanwege mij, en vanwege u.","Ps 88:10-15":"Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?","Job 10:2":"Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.","Ps 102:3":"Verberg Uw aangezicht niet voor mij, neig Uw oor tot mij ten dage van mijn benauwdheid; ten dage als ik roep, verhoor mij haastig.","2 Kron 14:11":"En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.","Mark 14:36":"En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.","Jer 17:18":"Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen de dag van het kwaad, en verbreek hen met een dubbele verbreking.","Ps 20:9":"Zij hebben zich gekromd, en zijn gevallen; maar wij zijn opgestaan en staande gebleven.","1 Kron 26:31":"Van de Hebronieten was Jeria het hoofd, van de Hebronieten naar zijn geslachten onder de families; in het veertigste jaar van het koninkrijk van David zijn er gezocht en onder hen gevonden dappere helden in Jaëzer in Gilead.","Ezra 5:5":"Doch het oog van hun God was over de oudsten van de Joden, zodat men hen niet kon tegenhouden, totdat de zaak bij Darius kwam, en zij daarna daarover een brief terugbrachten.","Ps 75:8":"Maar God is Rechter; Hij vernedert deze, en verhoogt die.","Jer 14:8":"O Israëls Verwachting, Zijn Verlosser in tijd van benauwdheid! Waarom zou U zijn als een vreemdeling in het land, en als een reiziger die slechts inkeert om te overnachten?","Ps 71:9":"Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.","Lev 20:19-21":"Verder zult u de schaamte van de zuster van uw moeder, en van de zuster van uw vader niet ontdekken; omdat hij zijn naaste bloedverwant ontbloot heeft, zullen zij hun ongerechtigheid dragen. Als ook een man gemeenschap heeft met de vrouw van zijn oom, heeft hij de schaamte van zijn oom ontdekt; zij zullen hun zonde dragen; zonder kinderen zullen zij sterven. En wanneer een man de vrouw van zijn broer neemt, is het onreinheid; hij heeft de schaamte van zijn broer ontdekt; zij zullen zonder kinderen zijn.","1 Kron 5:18-20":"Van de kinderen van Ruben, en van de Gadieten, en van de halve stam van Manasse, van de strijdbaarste mannen, die schild en zwaard droegen, en de boog spanden, en ervaren waren in de oorlog, waren vierenveertigduizend zevenhonderdzestig, die uittrokken in het leger. En zij voerden oorlog tegen de Hagarenen, en tegen Jethur, en Nafis, en Nodab. Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden.","Gen 29:32":"En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben.","2 Sam 16:5":"Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte.","Matt 27:46":"En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?","1 Kron 21:12":"Of drie jaren honger, of drie maanden verteerd te worden voor het aangezicht van uw tegenstanders, en dat het zwaard van uw vijanden u achterhaalt; of drie dagen het zwaard van de HEERE, dat is, de pestilentie in het land, en een verdervende engel van de HEERE in al de gebieden van Israël? Zo bezie nu goed, wat antwoord ik Hem zal teruggeven, Die mij gezonden heeft.","2 Kron 32:21":"En de HEERE zond een engel, die alle strijdbare helden, en vorsten, en aanvoerders in het leger van de koning van Assyrië vernietigde. Zo keerde hij met schaamte van het aangezicht terug naar zijn land; en toen hij in het huis van zijn god was gegaan, velden zij hem daar met het zwaard, zij die uit zijn eigen lijf voortgekomen waren.","2 Sam 2:7":"En nu, laat uw handen sterk zijn, en wees dapper, omdat uw heer Saul gestorven is; en ook hebben die van het huis van Juda mij tot koning over zich gezalfd.","Num 2:3":"Die zich nu oostwaarts, naar de opgang, legeren zullen, zal zijn de banier van het leger van Juda, naar hun legers; en Nahesson, de zoon van Amminadab, zal de leider van de zonen van Juda zijn.","Ps 123:3":"Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.","Jes 8:10":"Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!","Ps 71:1":"Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.","Ezech 38:12":"Om buit te buiten, en om roof te roven; om uw hand te wenden tegen de woeste plaatsen, die nu bewoond zijn, en tegen een volk, dat uit de heidenen verzameld is, dat vee en have verkregen heeft, wonend in het midden van het land.","Jes 5:1-8":"Nu zal ik voor mijn Beminde een lied van mijn Liefste zingen, over Zijn wijngaard. Mijn Beminde heeft een wijngaard op een vruchtbare heuvel. En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht. Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.","Ps 77:3":"Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.","Joh 4:5":"Hij kwam dan in een stad van Samaria, genaamd Sichar, dicht bij het stuk land dat Jakob aan zijn zoon Jozef gaf.","Ezech 29:19":"Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.","Ps 83:7":"de tenten van Edom en de Ismaëlieten, Moab en de Hagarenen;","Joz 13:11":"En Gilead, en het gebied van de Gezurieten en van de Maachathieten, en de hele berg Hermon, en heel Bazan, tot Salcha toe;","Hoogl 4:8":"Bij Mij vanaf de Libanon, o bruid! Kom bij Mij vanaf de Libanon; kijk vanaf de top van Amana, vanaf de top van Senir en van Hermon, vanaf de woningen van de leeuwinnen, vanaf de bergen van de luipaarden.","Ps 17:14":"Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.","Ps 60:3-5":"O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.","2 Sam 17:14":"Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.","Richt 1:2":"En de HEERE zei: Juda zal optrekken; zie, Ik heb dat land in zijn hand gegeven.","Ps 90:15":"Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.","2 Kron 13:13":"Maar Jerobeam liet een hinderlaag omtrekken, om van achteren bij hen te komen; zo stonden zij vóór Juda, en de hinderlaag was achter hen.","Ps 44:5":"U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.","Ps 74:19":"Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.","Neh 6:9":"Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!","Gen 12:3":"En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.","Num 32:33":"Zo gaf Mozes hun, de kinderen van Gad, en de kinderen van Ruben, en de halve stam van Manasse, de zoon van Jozef, het koninkrijk van Sihon, koning van de Amorieten, en het koninkrijk van Og, koning van Bazan; het land met de steden ervan, binnen de grenzen, de steden van het land rondom.","Hand 3:22":"Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.","Gen 50:20":"U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.","Ps 146:6":"Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.","1 Joh 4:2":"Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God;","2 Kron 36:23":"Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, dat in Juda is; wie is er onder u van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekt op.","1 Kron 27:31":"En over het kleine vee was Jaziz, de Hageriet. Al dezen waren opzichters over het bezit dat koning David had.","Pred 2:26":"Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.","2 Kron 14:11-13":"En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen. En de HEERE plaagde de Moren voor Asa en voor Juda; en de Moren vluchtten. Asa nu en het volk, dat met hem was, joegen hen na tot Gerar toe; en er vielen zoveel Moren, dat er voor hen geen herstel meer was; want zij waren verbroken voor de HEERE en voor Zijn leger; en zij droegen zeer veel van het roof daarvan mee.","Spr 22:3":"Een verstandig mens ziet het kwaad en verbergt zich; maar de eenvoudigen gaan door en worden gestraft.","Jer 17:7":"Gezegend daarentegen is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!","Ps 35:25":"Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!","Jer 16:19":"O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.","Ex 23:24":"U zult zich voor hun goden niet buigen, hen ook niet dienen; ook zult u niet doen naar hun werken; maar u zult ze geheel afbreken, en hun opgerichte beelden helemaal vermorzelen.","2 Kron 20:12":"O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.","Gen 46:24":"En de zonen van Nafthali: Jahzeel, en Guni, en Jezer, en Sillem.","Gen 25:15":"Hadar en Thema, Jetur, Nafis en Kedma.","1 Kron 5:3-6":"De kinderen van Ruben, de eerstgeborene van Israël, zijn Hanoch en Pallu, Hezron en Charmi. De kinderen van Joël: zijn zoon Semaja; zijn zoon Gog; zijn zoon Simeï; zijn zoon Micha; zijn zoon Reaja; zijn zoon Baäl;","Ps 10:12-15":"Sta op, HEERE God! Hef Uw hand op, vergeet de ellendigen niet. Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken? U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.","Spr 28:8":"Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.","Matt 2:6":"En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.","Num 32:34-36":"En de kinderen van Gad bouwden Dibon, en Ataroth, en Aroer, en Atroth-Sofan, en Jaezer, en Jogbeha, en Beth-Nimra, en Beth-Haran, versterkte steden en schaapskooien.","Ps 142:2":"Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem.","Jes 9:7-11":"De Heere heeft een woord gezonden in Jakob, en het is gevallen in Israël. En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden: De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;","Ps 105:17":"Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf.","Jes 7:14-16":"Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen. Boter en honing zal Hij eten, totdat Hij weet het kwade te verwerpen en het goede te verkiezen. Zeker, voordat dit Knechtje weet het kwade te verwerpen en het goede te verkiezen, zal dat land, waarvoor u zo bang bent, verlaten zijn door zijn twee koningen.","1 Kron 7:34":"En de zonen van Semer waren Ahi en Rohega, Jehubba en Aram.","Hebr 2:9-17":"maar wij zien Jezus met heerlijkheid en eer gekroond, Die een weinig minder dan de engelen geworden was, vanwege het lijden van de dood, opdat Hij door de genade van God voor allen de dood zou proeven. Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken. Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen,","Filem 1:1":"Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,","Jes 15:2":"Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden.","2 Kron 21:11":"Ook maakte hij hoogten op de bergen van Juda; en hij liet de inwoners van Jeruzalem overspel plegen, ja, hij dreef Juda daartoe.","Num 7:12":"Hij nu die op de eerste dag zijn offergave bracht, was Nahesson, de zoon van Amminadab, voor de stam van Juda.","1 Kon 8:36-50":"hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt. Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn; elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;","Neh 9:32":"Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.","Ps 116:4":"Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.","Num 31:35":"En van de mensen, de zielen uit de vrouwen die geen gemeenschap met een man hadden gehad, waren alle zielen tezamen tweeëndertigduizend.","Klaagl 5:17":"Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.","Ps 119:28":"Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.","Joz 10:14":"En er was geen dag aan deze gelijk, ervoor of erna, dat de HEERE de stem van een man zó verhoorde; want de HEERE streed voor Israël.","Jer 14:9":"Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.","Jes 43:14":"Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.","Lev 20:12":"Ook als de man gemeenschap heeft met de vrouw van zijn zoon, zullen zij beiden zeker gedood worden; zij hebben een gruwelijke vermenging gedaan; hun bloed is op hen!","2 Kon 17:7":"Want het was gebeurd, omdat de kinderen van Israël gezondigd hadden tegen de HEERE, hun God, Die hen uit het land Egypte opgevoerd had, onder de hand van de farao, de koning van Egypte, vandaan; en zij hadden andere goden gevreesd;","Joz 4:13":"Ongeveer veertigduizend toegeruste krijgsmannen trokken voor het aangezicht van de HEERE ten strijde, naar de vlakke velden van Jericho.","Gen 48:15-22":"En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag; Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land! Toen Jozef zag dat zijn vader zijn rechterhand op het hoofd van Efraïm legde, was dat niet goed in zijn ogen, en hij greep de hand van zijn vader vast, om die van het hoofd van Efraïm naar het hoofd van Manasse te brengen.","Ps 46:2":"God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.","1 Kron 26:10":"En Hosa, uit de kinderen van Merari, had zonen; Simri was het hoofd; (hoewel hij niet de eerstgeborene was, stelde zijn vader hem toch tot hoofd aan);","Ps 74:11":"Waarom trekt U Uw hand, ja, Uw rechterhand terug? Trek haar uit het midden van Uw boezem; maak er een einde aan.","Num 32:3":"Ataroth, en Dibon, en Jaezer, en Nimra, en Hesbon, en Eleale, en Schebam, en Nebo, en Behon;","Ps 119:39":"Wend mijn smaad af, die ik vrees, want Uw rechten zijn goed.","Job 1:17":"Terwijl deze nog sprak, kwam er een ander en zei: De Chaldeeën stelden drie groepen op, en vielen de kamelen aan, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.","Deut 2:30":"Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.","Ps 10:1":"HEERE, waarom staat U ver weg? Waarom verbergt U Zich in tijden van benauwdheid?","1 Sam 2:6-9":"De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.","Deut 2:36":"Van Aroer af, dat aan de oever van de beek Arnon is, en de stad die aan de beek is, tot Gilead toe, was er geen stad die voor ons te sterk was; de HEERE, onze God, gaf dat alles aan ons over.","Hand 7:59":"En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.","Ps 109:1-31":"Een psalm van David, voor de koorleider. O God van mijn lof! Zwijg niet. Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong. En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak.","Ps 2:7":"Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.","Neh 6:16":"En het gebeurde, toen al onze vijanden dit hoorden, dat alle heidenvolken die rondom ons waren, bevreesd werden en zeer in aanzien daalden in hun eigen ogen; want zij begrepen dat dit werk door onze God tot stand gebracht was.","Joh 20:27":"Daarna zei Hij tegen Thomas: Breng uw vinger hier, en bekijk Mijn handen, en breng uw hand, en stop hem in Mijn zijde; en wees niet ongelovig, maar gelovig.","Kol 1:15":"Die het Beeld is van de onzienlijke God, de Eerstgeborene van alle schepselen.","2 Sam 1:18":"toen hij gezegd had dat men de kinderen van Juda de boog moest leren; kijk, het is geschreven in het boek van de Oprechten.","Ps 70:3":"Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.","Num 31:34":"En eenenzestigduizend ezels;","2 Sam 22:7":"Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; en Hij hoorde mijn stem uit Zijn paleis, en mijn geroep kwam in Zijn oren.","Jes 13:4":"Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger.","2 Kon 15:5":"En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.","Ps 80:15":"O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,","Jer 47:7":"Hoe zou u stil houden? De HEERE heeft toch aan het zwaard bevel gegeven; tegen Askelon en tegen de zeehaven, daar heeft Hij het besteld.","2 Sam 24:6":"Vervolgens kwamen zij in Gilead, en in het lage land Hodsi; ook kwamen zij bij Dan-jaän, en rondom bij Sidon.","1 Kor 15:47":"De eerste mens is uit de aarde, aards; de tweede Mens is de Heere uit de hemel.","Job 16:20":"Mijn vrienden bespotten mij; maar mijn oog druipt tot God.","Ps 17:13":"Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;","2 Kron 14:15":"En zij sloegen ook de tenten van het vee, en voerden schapen in menigte weg, en kamelen; en kwamen weer naar Jeruzalem.","Jer 12:12":"Op alle hoge plaatsen in de woestijn zijn verstoorders gekomen; want het zwaard van de HEERE verteert van het ene einde van het land tot aan het andere einde van het land; er is geen vrede voor enig vlees.","Ps 71:4":"Mijn God, bevrijd mij van de hand van de goddeloze, van de hand van hem die verkeerd handelt, en van de opgeblazene.","2 Kon 14:23":"In het vijftiende jaar van Amazia, de zoon van Joas, de koning van Juda, werd in Samaria koning Jerobeam, de zoon van Joas, koning van Israël, en regeerde eenenveertig jaar.","Ps 71:2":"Red mij door Uw gerechtigheid, en bevrijd mij; neig Uw oor tot mij, en verlos mij.","Rom 1:3":"over Zijn Zoon, Die geworden is uit het geslacht van David, naar het vlees;","Ps 133:3":"Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.","Gen 43:14":"En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!","Openb 5:5":"En een van de oudsten zei tegen mij: Huil niet; zie, de Leeuw uit de stam van Juda, de Wortel van David, heeft overwonnen om het boek te openen en zijn zeven zegels te verbreken.","Hab 1:12":"Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.","Jer 48:10":"Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!","Luk 23:46":"En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.","Ps 119:42":"Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.","Ps 60:13":"Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.","Ezech 25:9":"Daarom, zie, Ik zal de zijde van Moab openen, vanaf de steden, vanaf zijn steden die aan zijn grenzen liggen, het sieraad van het land, Beth-Jesimoth, Baäl-Meon, en tot Kirjathaïm toe;","1 Kon 17:1":"En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!","Job 10:15":"Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.","Gen 48:15-20":"En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag; Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land! Toen Jozef zag dat zijn vader zijn rechterhand op het hoofd van Efraïm legde, was dat niet goed in zijn ogen, en hij greep de hand van zijn vader vast, om die van het hoofd van Efraïm naar het hoofd van Manasse te brengen.","2 Kon 17:6":"In het negende jaar van Hosea nam de koning van Assyrië Samaria in, en voerde Israël weg naar Assyrië, en liet hen wonen in Halah, en in Habor, aan de rivier Gozan, en in de steden van de Meden.","Ps 119:107":"Ik ben helemaal zeer verdrukt, HEERE! maak mij levend naar Uw woord.","Gen 24:35":"en de HEERE heeft mijn heer zeer gezegend, zodat hij groot geworden is; en Hij heeft hem gegeven schapen, en runderen, en zilver, en goud, en knechten, en dienstmeisjes, en kamelen, en ezels.","Gen 34:28":"Hun schapen, en hun runderen, en hun ezels, en wat er in de stad was, en wat er in het veld was, namen zij mee.","Ex 17:4":"Toen riep Mozes tot de HEERE en zei: Wat moet ik met dit volk doen? Het scheelt niet veel, of zij zullen mij stenigen.","Openb 17:17":"Want God heeft hun in hun hart gegeven dat zij Zijn plan uitvoeren, en dat zij één en dezelfde gezindheid uitvoeren, en dat zij hun koninkrijk aan het beest geven, totdat de woorden van God vervuld zullen zijn.","Num 26:7":"Dit zijn de geslachten der Rubenieten; en hun getelden waren drieënveertigduizend zevenhonderddertig.","Ps 89:20":"Toen hebt Gij in een gezicht gesproken van Uw heilige, en gezegd: Ik heb hulp besteld bij een held; Ik heb een verkorene uit het volk verhoogd.","Fil 2:7":"Maar heeft Zichzelf ontledigd door de gestalte van een dienstknecht aan te nemen, en is de mensen gelijk geworden;","Ps 61:3":"Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.","Jes 44:28":"Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.","Job 5:12":"Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.","Ps 40:8":"Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven.","Gen 48:22":"En ik heb u één stuk land gegeven, boven uw broers; dat ik met mijn zwaard en met mijn boog uit de hand van de Amorieten genomen heb.","Ps 31:2-5":"Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid. Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden. Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.","Ezech 21:27":"Ik zal die kroon omgekeerd, omgekeerd, omgekeerd neerzetten; ja, zij zal er niet zijn, totdat hij komt die daartoe recht heeft, en aan wie Ik hem geven zal.","Joz 4:12":"En de kinderen van Ruben, en de kinderen van Gad, alsook de halve stam van Manasse, trokken gewapend voor de ogen van de kinderen van Israël, zoals Mozes tegen hen gesproken had.","Deut 18:15-19":"Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren, naar alles wat u van de HEERE, uw God, bij Horeb, op de dag van de samenkomst, gevraagd hebt, en zei: Ik wil de stem van de HEERE, mijn God, niet meer horen, en dit grote vuur wil ik niet meer zien, opdat ik niet sterf. Toen zei de HEERE tot mij: Het is goed, wat zij gesproken hebben.","Luk 14:32":"Anders stuurt hij, terwijl die ander nog ver weg is, gezanten en vraagt om vredesvoorwaarden.","2 Kron 25:15":"Toen ontstak de toorn van de HEERE tegen Amazia; en Hij zond tot hem een profeet, die tegen hem zei: Waarom hebt u de goden van dat volk gezocht, die hun eigen volk niet gered hebben uit uw hand?","Ex 17:11":"En het gebeurde: terwijl Mozes zijn hand ophief, was Israël de sterkste; maar terwijl hij zijn hand neerliet, was Amalek de sterkste.","Ps 94:1-23":"O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend! Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen. Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?","Fil 2:8":"En in gedaante gevonden als een mens, heeft Hij Zichzelf vernederd, gehoorzaam geworden tot de dood, ja, de dood van het kruis.","Ps 27:11":"HEERE, leer mij Uw weg, en leid mij op het rechte pad, omwille van mijn verspieders.","Ps 5:9":"HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.","2 Kon 10:33":"Vanaf de Jordaan, tegen de opgang van de zon, het gehele land van Gilead, van de Gadieten, en van de Rubenieten, en van de Manassieten; van Aroër, dat aan de beek van Arnon is, en Gilead, en Basan.","Ezra 1:5":"Toen maakten de hoofden van de families van Juda en Benjamin zich klaar, en de priesters en de Levieten, met ieder wiens geest God opwekte, om op te trekken en het huis van de HEERE te bouwen, dat te Jeruzalem woont.","Ps 119:145-149":"Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren. Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden. Ik ben de morgenschemering voorgekomen, en heb geschrei gemaakt; op Uw woord heb ik gehoopt.","2 Kon 15:37":"In die dagen begon de HEERE tegen Juda te zenden Rezin, de koning van Syrië, en Pekah, de zoon van Remalia.","Matt 15:22-28":"En zie, een Kananese vrouw, die uit die omgeving kwam, riep tot Hem en zei: Heere! U Zoon van David, ontferm U over mij! mijn dochter is ernstig door de duivel bezeten. Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na. Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.","1 Sam 18:17":"Daarom zei Saul tegen David: Zie, mijn oudste dochter Merab zal ik u tot vrouw geven; alleen, wees mij een dapper man en voer de oorlogen van de HEERE. Want Saul zei: Laat mijn hand niet tegen hem zijn, maar laat de hand van de Filistijnen tegen hem zijn.","Jes 13:9":"Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.","Jes 54:17":"Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.","Job 10:9":"Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.","2 Kron 24:24":"Hoewel het leger van Syrië met weinig mannen kwam, gaf de HEERE toch in hun hand een leger van zeer grote omvang, omdat zij de HEERE, de God van hun vaderen, verlaten hadden; zo voerden zij de oordelen uit tegen Joas.","Gen 2:14":"En de naam van de derde rivier is Hiddekel; die stroomt naar het oosten van Assur. En de vierde rivier is Frath.","1 Kron 5:11-17":"De kinderen van Gad nu woonden tegenover hen, in het land Basan, tot aan Salcha toe. Joël was het hoofd; en Safam de tweede; maar Jaenai en Safat bleven in Basan. Hun broeders nu, naar hun families, waren Michaël, en Mesullam, en Seba, en Jorai, en Jachan, en Zia, en Heber: zeven.","Job 19:29":"Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.","Hand 13:33":"dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.","Jes 38:2":"Toen keerde Hizkia zijn gezicht om naar de wand, en hij bad tot de HEERE.","Klaagl 1:20":"Resch. Zie, HEERE, want mij is bang; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer opstandig geweest; van buiten heeft mij het zwaard van kinderen beroofd, van binnen is het als de dood.","2 Kron 14:10":"Toen trok Asa tegen hem uit; en zij stelden de slagorde op in het dal Zefatha bij Maresa.","Gen 30:11":"Toen zei Lea: Er komt een hoop! En zij noemde zijn naam Gad.","1 Kron 2:1":"Dit zijn de kinderen van Israël: Ruben, Simeon, Levi en Juda, Issaschar en Zebulon,","Ps 119:153":"Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.","Ex 14:4":"En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.","Ezech 39:1":"Verder, mensenkind! Profeteer tegen Gog en zeg: Zo zegt de Heere HEERE: Zie, Ik zál u, o Gog, hoofdvorst van Mesech en Tubal!","Joz 10:42":"En Jozua nam al deze koningen en hun land in één keer in; want de HEERE, de God van Israël, streed voor Israël.","Richt 8:27":"En Gideon maakte daarvan een efod, en zette die neer in zijn stad, in Ofra; en heel Israël pleegde daar overspel door die na te lopen; en het werd voor Gideon en zijn huis een valstrik.","1 Kon 4:21":"En Salomo heerste over al de koninkrijken, van de rivier tot het land van de Filistijnen, en tot aan het gebied van Egypte; die brachten geschenken, en dienden Salomo al de dagen van zijn leven.","Ezech 39:15":"En deze doorgangers zullen door het land trekken, en als iemand een mensenbeen ziet, zal hij daarbij een merkteken oprichten, totdat de doodgravers het hebben begraven in het dal van Gogs menigte.","Deut 34:1":"Toen ging Mozes op vanaf de vlakke velden van Moab, naar de berg Nebo, op de hoogten van Pisga, die recht tegenover Jericho ligt; en de HEERE liet hem het hele land zien: Gilead tot Dan toe;","2 Kon 15:19":"Toen kwam Pul, de koning van Assyrië, tegen het land; en Menahem gaf aan Pul duizend talenten van het zilver, opdat zijn hand met hem zou zijn, om het koninkrijk in zijn hand te versterken.","Ps 79:9":"Help ons, o God van ons heil! Vanwege de eer van Uw Naam; en red ons, en doe verzoening over onze zonden, om Uw Naam.","Jes 41:4":"Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.","Num 1:5":"Dit zijn nu de namen van de mannen die bij u zullen staan: van Ruben, Elizur, de zoon van Sedeur.","Jes 37:12":"Hebben de goden van de volken die mijn vaders vernietigd hebben, die gered — Gozan, en Haran, en Rezef, en de kinderen van Eden, die in Telassar waren?","Ps 13:2-5":"Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen? Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn? Kijk naar mij, verhoor mij, HEERE, mijn God; verlicht mijn ogen, zodat ik niet in de dood ontslaap;","Ezech 38:18":"Maar het zal gebeuren op die dag, op de dag als Gog tegen het land van Israël zal aankomen, spreekt de Heere HEERE, dat Mijn grimmigheid in Mijn neus zal opkomen.","Jer 46:15-17":"Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef. Hij maakte de struikelende velen; ja, de een viel op de ander; zodat zij zeiden: Staat op en laat ons wederkeren tot ons volk, en tot het land van onze geboorte, vanwege het verdrukkende zwaard. Daar riepen zij: Farao, de koning van Egypte, is maar een gedruis; hij heeft de gezette tijd laten voorbijgaan.","Spr 21:18":"De goddeloze is een rantsoen voor de rechtvaardigen, en de trouweloze voor de oprechten.","Jes 51:9":"Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?","Luk 22:42":"en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.","Spr 19:21":"In het hart van de man zijn veel gedachten; maar de raad van de HEERE, die zal standhouden.","Ps 80:4-6":"O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden. HEERE, God van de heerscharen! Hoe lang zult U roken tegen het gebed van Uw volk? U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.","Gen 32:11":"Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!","Ps 20:3":"Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.","Ps 39:13":"Hoor, HEERE, mijn gebed, en neem mijn geroep ter ore; zwijg niet bij mijn tranen; want ik ben een vreemdeling bij U, een bijwoner, zoals al mijn vaders.","Jes 48:14":"Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.","Richt 6:5":"Want zij kwamen op met hun vee en hun tenten; zij kwamen in zo'n grote menigte als de sprinkhanen, zodat men hen en hun kamelen niet tellen kon; en zij kwamen in het land om het te vernielen.","Hand 4:29":"En nu dan, Heere, zie op hun dreigingen, en geef Uw dienstknechten met alle vrijmoedigheid Uw woord te spreken;","Matt 26:39":"En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.","1 Sam 16:1":"Toen zei de HEERE tegen Samuël: Hoe lang draagt u leed om Saul, die Ik toch verworpen heb, dat hij geen koning meer zal zijn over Israël? Vul uw hoorn met olie, en ga op weg; Ik zal u zenden naar Isaï, de Bethlehemiet; want Ik heb Mij een koning uitgekozen onder zijn zonen.","Amos 3:6":"Zal de bazuin in de stad geblazen worden, zonder dat het volk sidddert? Zal er een kwaad in de stad zijn, dat de HEERE niet doet?","Openb 17:5":"En op haar voorhoofd was een naam geschreven: namelijk Verborgenheid; het grote Babylon, de moeder van de hoererijen en van de gruwelen van de aarde.","Joh 11:3":"Zijn zusters dan zonden tot Hem, en zeiden: Heere, zie, hij die U liefhebt, is ziek.","Gen 49:3":"Ruben! U bent mijn eerstgeborene, mijn kracht, en het begin van mijn macht; de voortreffelijkste in hoogheid, en de voortreffelijkste in sterkte!","2 Kron 20:4-13":"En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof. En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.","Ps 126:4":"O HEERE, keer onze gevangenschap, zoals waterstromen in het zuiden.","Gen 46:9":"En de zonen van Ruben: Hanoch, en Pallu, en Hezron, en Karmi.","Est 9:1":"In de twaalfde maand nu (dat is de maand Adar), op de dertiende dag daarvan, toen het woord en de wet van de koning nabij gekomen waren om uitgevoerd te worden, op de dag dat de vijanden van de Joden hoopten over hen te heersen, gebeurde het omgekeerde: de Joden zelf heersten over hun haters.","Openb 22:16":"Ik, Jezus, heb Mijn engel gezonden om u deze dingen te getuigen in de Gemeenten. Ik ben de Wortel en het geslacht van David, de blinkende Morgenster.","2 Kon 19:16":"HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.","Micha 5:1":"En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.","Deut 1:7":"Keer u om, vertrek, en ga naar het gebergte van de Amorieten, en naar al hun buren, in het vlakke veld, op het gebergte, en in de laagte, en in het zuiden, en aan de kust van de zee; het land van de Kanaänieten, en de Libanon, tot aan die grote rivier, de rivier de Eufraat.","Joël 1:19":"Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.","Ezra 1:1":"In het eerste jaar nu van Kores, koning van Perzië, opdat het woord van de HEERE, uit de mond van Jeremia, volbracht werd, wekte de HEERE de geest van Kores, koning van Perzië, op, zodat hij een boodschap liet doorgeven door heel zijn koninkrijk, zelfs ook op schrift, en zei:","Jak 5:13-16":"Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen. Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere. En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het b sommigen onder u omgekeerd, zoals God Sodom en Gomorra omkeerde, u, die was als een stuk brandhout, dat uit de brand gered is; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.","Ps 105:25":"Hij keerde hun hart om, zodat zij Zijn volk haatten, dat zij met Zijn knechten listig omgingen.","Deut 3:9":"(De Sidoniërs noemen Hermon Sirjon; maar de Amorieten noemen hem Senir.)","Joz 13:17":"Hesbon en al haar steden, die in het vlakke land zijn, Dibon, en Bamoth-baal, en Beth-baal-meon,","Klaagl 2:18":"Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op!","Joz 22:9":"Zo keerden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse terug, en trokken weg van de kinderen van Israël, van Silo, dat in het land Kanaän is, om te gaan naar het land van Gilead, naar het land van hun bezitting, waarin zij bezitters gemaakt waren, naar het bevel van de HEERE, door de dienst van Mozes.","Neh 4:20":"Op de plaats waar u het geluid van de bazuin zult horen, daarheen moet u zich naar ons toe verzamelen; onze God zal voor ons strijden.","1 Sam 19:15":"Toen zond Saul boden om David te bezien, en zei: Breng hem met bed en al bij mij, zodat men hem kan doden.","Ps 56:2-14":"Wees mij genadig, o God! Want de mens zoekt mij op te slokken; de hele dag dringt de bestrijder mij. Mijn verspieders zoeken mij de hele dag op te slokken; want ik heb veel bestrijders, o Allerhoogste! Ten dage dat ik zal vrezen, zal ik op U vertrouwen.","Ps 22:2-22":"Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen? Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte. Doch U bent heilig, wonende onder de lofzangen van Israël.","2 Kron 28:6":"Want Pekah, de zoon van Remalia, doodde in Juda honderdtwintigduizend man op één dag, allen strijdbare mannen, omdat zij de HEERE, de God van ve stam van Manasse, met allerlei oorlogswapens voor de strijd, honderdtwintigduizend.","Rom 8:29":"Want die Hij van tevoren gekend heeft, die heeft Hij ook van tevoren bestemd om gelijkvormig te zijn aan het beeld van Zijn Zoon, opdat Hij de Eerstgeborene zou zijn onder veel broeders.","Ps 17:6-9":"Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden. Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan! Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,","Gen 25:23":"En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.","Ps 50:15":"En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.","Ps 108:7":"Opdat Uw beminden bevrijd worden; geef heil door Uw rechterhand, en verhoor ons.","Deut 23:4":"Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken.","Hebr 10:5":"Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid;","Num 32:38":"en Nebo, en Baäl-Meon, waarvan de naam veranderd was, en Sibma; en zij noemden de steden die zij bouwden met andere namen.","Est 9:25":"Maar toen zij voor de koning gekomen was, heeft hij door brieven bevolen dat zijn boze plan, dat hij bedacht had tegen de Joden, op zijn eigen hoofd zou terugkeren; en men heeft hem en zijn zonen aan de galg gehangen.","Ps 4:2":"Als ik roep, verhoor mij, o God van mijn gerechtigheid! In benauwdheid hebt U mij ruimte gemaakt; wees mij genadig, en hoor mijn gebed.","Ps 3:8":"Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tand ot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.","Est 6:1-12":"Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning. En men vond geschreven dat Mordechai had bekendgemaakt dat Bigthana en Theres, twee kamerlingen van de koning, uit de dorpelwachters, van plan waren de hand te leggen aan koning Ahasveros. Toen zei de koning: Welke eer en verhoging is Mordechai hiervoor gegeven? En de knechten van de koning, zijn dienaars, zeiden: Aan hem is niets gegeven.","Neh 4:9":"Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.","Joz 13:24-28":"En aan de stam van Gad, aan de kinderen van Gad, naar hun huisgezinnen, gaf Mozes, dat hun gebied was Jaezer, en alle steden van Gilead, en het halve land van de kinderen van Ammon, tot Aroer toe, die voor aan Rabba ligt; En van Hesbon af tot Ramath-mizpa en Betonim toe; en van Mahanaim af tot aan de grens van Debir toe;","Jes 41:2":"Wie heeft van de opgang die rechtvaardige verwekt? Heeft hem geroepen om hem op zijn voet te doen staan? De heidenvolken voor zijn aangezicht gegeven, en gemaakt dat hij over koningen heerste? Heeft hun zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?","Ps 119:76":"Laat toch Uw goedertierenheid zijn om mij te troosten, naar Uw toezegging aan Uw knecht.","1 Kor 5:1":"Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft.","Ps 39:11":"Neem Uw plaag van mij weg; ik ben bezweken door de slagen van Uw hand.","Ps 130:1-8":"Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE! Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen. Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?","1 Kron 9:16":"En Obadja, de zoon van Semaja, de zoon van Galal, de zoon van Jeduthun; en Berechja, de zoon van Asa, de zoon van Elkana, woonachtig in de dorpen van de Netofathieten.","1 Joh 1:1-3":"Wat er was van het begin af, wat wij gehoord hebben, wat wij gezien hebben met onze ogen, wat wij aanschouwd hebben, en onze handen getast hebben, van het Woord des levens; (Want het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.) Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.","Num 31:45":"En de ezels dertigduizend vijfhonderd;","Joz 15:26":"Amam, en Sema, en Molada,","1 Kor 16:7":"Want ik wil u nu niet zien terwijl ik onderweg ben, maar ik hoop enige tijd bij u te blijven, als de Heere het zal toelaten.","Hoogl 2:1":"Ik ben een roos van Saron, een lelie van de dalen.","Ps 64:2":"Hoor, o God, mijn stem in mijn geklaag; behoed mijn leven voor de schrik van de vijand.","Deut 32:30":"Hoe zou één duizend achtervolgen, en twee tienduizend doen vluchten, als niet hun Rotssteen hen verkocht had, en de HEERE hen overgeleverd had?","Ezech 38:8":"Na veel dagen zult u bezocht worden; in het laatste van de jaren zult u komen in het land, dat teruggebracht is van het zwaard, dat verzameld is uit veel volken, op de bergen van Israël, die steeds tot verwoesting geweest zijn; wanneer datzelfde land uit de volken uitgevoerd zal zijn, en zij allemaal veilig zullen wonen.","Klaagl 1:9-11":"Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot. Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden. Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.","Ps 35:23":"Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.","2 Kon 24:7":"De koning van Egypte trok voortaan niet meer uit zijn land; want de koning van Babel had, van de rivier van Egypte af tot aan de rivier de Eufraat, alles ingenomen wat van de koning van Egypte was.","Lev 20:17":"En als een man zijn zuster, de dochter van zijn vader, of de dochter van zijn moeder, neemt, en hij haar schaamte ziet, en zij zijn schaamte ziet, is het een schandvlek; daarom zullen zij voor de ogen van de kinderen van hun volk uitgeroeid worden; hij heeft de schaamte van zijn zuster ontdekt, hij zal zijn ongerechtigheid dragen.","Hab 1:13":"U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?","Luk 1:38-56":"En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg. En Maria stond in diezelfde dagen op en reisde met haast naar het gebergte, naar een stad van Juda; en kwam in het huis van Zacharias, en groette Elizabet.","1 Kon 8:44":"Wanneer Uw volk in de oorlog tegen zijn vijand uittrekken zal, langs de weg die U hen zenden zult, en tot de HEERE bidden zullen in de richting van deze stad, die U verkoren hebt, en van dit huis, dat ik voor Uw Naam gebouwd heb;","Num 3:35":"De aanvoerder nu van het vaderlijke huis van de geslachten van Merari zal zijn Zuriël, de zoon van Abihaïl; zij zullen zich legeren aan de zijde van de tabernakel, noordwaarts.","1 Sam 14:32":"Toen stortte het volk zich op de buit, en zij namen schapen, en runderen, en kalveren, en slachtten ze op de grond; en het volk at ze met het bloed.","Jes 19:2":"Want Ik zal de Egyptenaren tegen de Egyptenaren ver
