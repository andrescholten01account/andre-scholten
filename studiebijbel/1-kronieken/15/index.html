ijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "Ps 150:4": "Loof Hem met de trommel en fluit; loof Hem met snarenspel en orgel!", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "Ex 6:16": "De zonen van Gerson: Libni en Simeï, naar hun huisgezinnen.", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Luk 19:37-41": "En toen Hij nu in de buurt kwam van de afdaling van de Olijfberg, begon heel de menigte van de discipelen zich te verblijden, en God te loven met luide stem, vanwege alle krachtige daden die zij gezien hadden, en zij zeiden: Gezegend is de Koning, Die komt in de Naam van de Heere! Vrede in de hemel, en heerlijkheid in de hoogste hemelen! En sommigen van de Farizeeën uit de menigte zeiden tegen Hem: Meester, bestraf Uw discipelen.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "2 Kron 15:14": "En zij zwoeren de HEERE met luide stem en met gejuich, en ook met trompetten en met bazuinen.", "1 Kor 2:14": "Maar de natuurlijke mens begrijpt niet de dingen die van de Geest van God zijn; want ze zijn hem dwaasheid, en hij kan ze niet verstaan, omdat ze geestelijk beoordeeld worden.", "1 Kon 4:4": "En Benaja, de zoon van Jojada, was over het leger; en Zadok en Abjathar waren priesters.", "1 Kon 8:8": "Daarna schoven zij de draagstokken verder naar buiten, zodat de uiteinden van de draagstokken gezien werden vanuit het heiligdom, vóór het binnenste heiligdom, maar buiten werden zij niet gezien; en zij zijn daar tot op deze dag.", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "1 Sam 10:19": "Maar u hebt vandaag uw God verworpen, Die u Zelf uit al uw ellenden en uw noden verlost heeft, en u hebt tegen Hem gezegd: Nee, zet een koning over ons; nu dan, stel u voor het aangezicht van de HEERE, naar uw stammen en naar uw duizenden.", "1 Kron 26:4": "Obed-Edom had ook kinderen: Semaja was de eerstgeborene, Jozabad de tweede, Joah de derde, en Sachar de vierde, en Nethaneel de vijfde,", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Num 31:14": "En Mozes werd zeer boos op de aanvoerders van het leger, de hoofdlieden over de duizenden, en de hoofdlieden over de honderden, die uit de strijd van die oorlog kwamen.", "2 Kron 1:4": "(Maar de ark van God had David opgebracht van Kirjath-jearim naar de plaats die David voor haar bereid had; want hij had voor haar een tent gespannen te Jeruzalem.)", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "1 Kron 6:62": "En de kinderen van Gerson, naar hun families, hadden van de stam van Issaschar, en van de stam van Aser, en van de stam van Nafthali, en van de stam van Manasse in Basan, dertien steden.", "1 Sam 3:11-14": "En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Num 10:17": "Toen werd de tabernakel afgenomen, en de zonen van Gerson en de zonen van Merari trokken op, dragend de tabernakel.", "1 Kron 13:8": "En David en heel Israël speelden voor het aangezicht van God met alle kracht, zowel met liederen, als met harpen, en met luiten, en met trommels, en met cimbalen, en met trompetten.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "1 Sam 22:7": "Toen zei Saul tegen zijn knechten die bij hem stonden: Hoor toch, u, zonen van Jemini, zal ook de zoon van Isaï u allemaal akkers en wijngaarden geven? Zal hij u allemaal tot aanvoerders van duizenden en aanvoerders van honderden stellen?", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Hos 5:8": "Blaas de bazuin te Gibea, de trompet te Rama; roep luid te Beth-Aven; achter u, Benjamin!", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Ex 6:21": "En de zonen van Uzziël: Misael, en Elzafan, en Sithri.", "2 Sam 6:15": "Zo brachten David en het hele huis van Israël de ark van de HEERE op, met gejuich en met geluid van bazuinen.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "1 Petr 4:18": "En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "1 Sam 18:28": "En Saul zag en merkte dat de HEERE met David was; en Michal, de dochter van Saul, had hem lief.", "1 Kron 25:5": "Deze allen waren kinderen van Heman, de ziener van de koning, in de woorden van God, om de hoorn te verheffen; want God had Heman veertien zonen gegeven, en drie dochters.", "Ezra 6:16": "En de kinderen van Israël, de priesters en Levieten, en de overige kinderen van de wegvoering hielden de inwijding van dit huis van God met vreugde.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "1 Kron 25:1-6": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst. Van de kinderen van Asaf waren Zakkur, en Jozef, en Nethanja, en Asarela, kinderen van Asaf; onder leiding van Asaf, die onder leiding van de koning profeteerde. Aangaande Jeduthun: de kinderen van Jeduthun waren Gedalja, en Zeri, en Jesaja, Hasabja en Mattithja, zes; onder leiding van hun vader Jeduthun, die op harpen profeteerde om de HEERE te danken en te loven.", "Jer 33:17-22": "Want zo zegt de HEERE: Aan David zal het nooit ontbreken aan een Man, Die op de troon van het huis van Israël zit. Ook zal het de Levitische priesters nooit ontbreken aan een Man voor Mijn aangezicht, die brandoffer offert, en spijsoffer aansteekt, en slachtoffer bereidt, alle dagen. En het woord van de HEERE kwam tot Jeremia, en Hij zei:", "Ps 150:3-5": "Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp! Loof Hem met de trommel en fluit; loof Hem met snarenspel en orgel! Loof Hem met luid klinkende cimbalen; loof Hem met cimbalen van vreugdegeluid!", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Deut 31:26": "Neem dit wetboek, en leg het aan de zijde van de ark van het verbond van de HEERE, uw God, opdat het daar tot getuige zij tegen u.", "Dan 3:4": "En een heraut riep met kracht: Men zegt u aan, u volken, u naties en tongen!", "2 Sam 5:9": "Zo woonde David in de burcht en noemde die de stad van David. En David bouwde rondom, vanaf Millo naar binnen toe.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Job 21:12": "Zij heffen op met de trommel en de harp, en verblijden zich bij het geluid van de fluit.", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "1 Kron 6:2": "De kinderen van Kahath nu waren Amram, Jizhar, en Hebron, en Uzziël.", "1 Sam 19:11-17": "Maar Saul zond boden naar Davids huis, om hem te bewaken, en om hem 's morgens te doden. Dit maakte Michal, zijn vrouw, aan David bekend, en zei: Als u vannacht uw leven niet redt, zult u morgen gedood worden. En Michal liet David door een venster naar beneden, en hij ging heen, en vluchtte, en ontkwam. En Michal nam een beeld, en legde het in het bed, en legde een geitenvel aan zijn hoofdkussen, en dekte het met een kleed toe.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Openb 5:12-14": "die met een luide stem zeiden: Het Lam, Dat geslacht is, is waard te ontvangen de kracht, en rijkdom, en wijsheid, en sterkte, en eer, en heerlijkheid, en dankzegging. En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid. En de vier dieren zeiden: Amen. En de vierentwintig oudsten vielen neer en aanbaden Hem Die leeft tot in alle eeuwigheid.", "Ex 15:21": "Toen antwoordde Mirjam hun: Zingt de HEERE; want Hij is hoog verheven! Hij heeft het paard met zijn ruiter in de zee gestort!", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "1 Sam 12:25": "Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen.", "1 Sam 16:21-23": "Zo kwam David bij Saul, en stond voor hem; en hij hield veel van hem, en hij werd zijn wapendrager. Daarna stuurde Saul iemand naar Isaï om te zeggen: Laat David toch bij mij blijven, want hij heeft genade gevonden in mijn ogen. En het gebeurde, als de geest van God over Saul kwam, dat David de harp nam en met zijn hand speelde; dat gaf Saul verademing, en het werd beter met hem, en de boze geest week van hem.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Ezra 8:29": "Waak en bewaar het, totdat u het opweegt, in tegenwoordigheid van de leiders van de priesters en Levieten, en van de vorsten van de vaderen van Israël, te Jeruzalem, in de kamers van het huis van de HEERE.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Hebr 9:4": "met een gouden wierookvat, en de ark van het verbond, rondom met goud overdekt, waarin de gouden kruik was met het manna erin, en de staf van Aäron die gebloeid had, en de tafelen van het verbond.", "Joh 3:15": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "1 Kron 15:5-10": "Van de nakomelingen van Kehath was Uriël leider, en van zijn broeders waren er honderdtwintig. Van de nakomelingen van Merari was Asaja leider, en van zijn broeders waren er tweehonderdtwintig. Van de nakomelingen van Gersom was Joël leider, en van zijn broeders waren er honderddertig.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Hos 5:9": "Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.", "2 Kron 35:15": "En de zangers, de zonen van Asaf, waren op hun standplaats, naar het gebod van David, en Asaf, en Heman, en Jeduthun, de ziener van de koning, alsook de poortwachters bij elke poort; zij hoefden niet te wijken van hun dienst, want hun broeders, de Levieten, bereidden voor hen.", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Ps 149:6": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand,", "1 Kron 6:49": "Aäron nu en zijn zonen brachten reukwerk op het altaar van het brandoffer, en op het reukaltaar, aangesteld voor al het werk van het heilige der heiligen, en om voor Israël verzoening te doen, naar alles wat Mozes, de knecht van God, geboden had.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Ps 12:2": "Behoud, o HEERE; want de goedertierene ontbreekt, want de getrouwen zijn weinig geworden onder de mensenkinderen.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "Jes 23:16": "Neem de harp, ga rond door de stad, u vergeten hoer! Speel mooi, zing veel liederen, opdat men weer aan u denkt!", "1 Kron 11:7": "David nu woonde op de burcht; daarom noemt men die de stad van David.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Ezech 9:10": "Daarom ook, wat Mij aangaat, Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal hun weg op hun hoofd geven.", "Ex 6:15-21": "Dit nu zijn de namen van de zonen van Levi, naar hun geboorten: Gerson, en Kehath, en Merari. En de jaren van het leven van Levi waren honderdzevenendertig jaren. De zonen van Gerson: Libni en Simeï, naar hun huisgezinnen. En de zonen van Kehath: Amram, en Jizhar, en Hebron, en Uzziël; en de jaren van het leven van Kehath waren honderddrieëndertig jaren.", "2 Kron 29:34": "Doch van de priesters waren er te weinig, en zij konden niet van al de brandoffers de huid aftrekken; daarom hielpen hun broeders, de Levieten, hen, totdat het werk beëindigd was, en totdat de andere priesters zich geheiligd hadden; want de Levieten waren oprechter van hart om zich te heiligen, dan de priesters.", "2 Sam 3:14": "Ook zond David boden naar Isboseth, de zoon van Saul, en zei: Geef mij mijn vrouw Michal, die ik mij met honderd voorhuiden van de Filistijnen ondertrouwd heb.", "2 Sam 12:17": "Toen kwamen de oudsten van zijn huis naar hem toe, om hem te laten opstaan van de aarde; maar hij wilde niet, en at ook geen brood met hen.", "Ps 150:3": "Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "1 Kron 16:39": "En de priester Zadok, en zijn broeders, de priesters, voor de tabernakel van de HEERE op de hoogte, die te Gibeon is;", "1 Kron 15:4-10": "En David verzamelde de nakomelingen van Aäron en de Levieten. Van de nakomelingen van Kehath was Uriël leider, en van zijn broeders waren er honderdtwintig. Van de nakomelingen van Merari was Asaja leider, en van zijn broeders waren er tweehonderdtwintig.", "1 Kron 6:16": "Zo zijn dan de kinderen van Levi: Gerson, Kahath en Merari.", "Ps 135:2": "U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God!", "Num 4:2-15": "Neem de som op van de zonen van Kohath, uit het midden van de zonen van Levi, naar hun geslachten, naar het huis van hun vaderen. Van dertig jaar oud en ouder, tot vijftig jaar oud; ieder die in deze strijd komt om het werk in de tent der samenkomst te doen. Dit zal de dienst zijn van de zonen van Kohath, in de tent der samenkomst: namelijk het allerheiligste.", "1 Kron 26:23": "Voor de Amramieten, van de Jizharieten, van de Hebronieten, van de Uzziëlieten,", "1 Sam 14:18": "Toen zei Saul tegen Ahia: Breng de ark van God hierheen. Want de ark van God was op die dag bij de kinderen van Israël.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Ezra 7:24-28": "Ook laten wij u weten, aangaande alle priesters en Levieten, zangers, poortwachters, Nethinim en dienaars van het huis van deze God, dat men de cijns, oude belasting en tol hun niet zal mogen opleggen. En u, Ezra, stel naar de wijsheid van uw God, die in uw hand is, regeerders en rechters aan, die al het volk rechtspreken dat aan de overkant van de rivier is, allen die de wetten van God kennen; en wie ze niet kent, moet u het bekendmaken. En ieder die de wet van uw God en de wet van de koning niet zal doen, over hem moet spoedig recht gedaan worden, hetzij ter dood, of tot verbanning, of tot boete van goederen, of tot gevangenschap.", "Num 3:35": "De aanvoerder nu van het vaderlijke huis van de geslachten van Merari zal zijn Zuriël, de zoon van Abihaïl; zij zullen zich legeren aan de zijde van de tabernakel, noordwaarts.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "2 Kron 5:11": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen; (want al de priesters die aanwezig waren, hadden zich geheiligd, zonder de verdelingen aan te houden;", "Ps 119:155": "Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "1 Kron 6:1": "De kinderen van Levi waren Gerson, Kahath en Merari.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "1 Kron 25:7": "En hun aantal, met hun broeders die onderwezen waren in het gezang van de HEERE, allen meesters, was tweehonderdachtentachtig.", "Ps 66:13-15": "Ik zal met brandoffers Uw huis binnengaan; ik zal U mijn geloften betalen, Die mijn lippen hebben geuit, en mijn mond heeft uitgesproken, toen het mij bang te moede was. Brandoffers van vetgemeste dieren zal ik U offeren, met rookwerk van rammen; ik zal runderen met bokken bereiden. Sela.", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "Jes 16:10": "zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "1 Kron 13:14": "Zo bleef de ark van God bij het huisgezin van Obed-edom, in zijn huis, drie maanden; en de HEERE zegende het huis van Obed-edom, en alles wat hij had.", "Joël 2:15": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit.", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Ps 149:1-3": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning. Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "1 Kron 16:1": "Toen zij de ark van God binnenbrachten, zetten zij die in het midden van de tent die David voor haar gespannen had; en zij offerden brandoffers en dankoffers voor het aangezicht van God.", "Job 18:5-21": "Ja, het licht van de goddelozen zal uitgeblust worden, en de vonk van zijn vuur zal niet glinsteren. Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden. De stappen van zijn kracht zullen beperkt worden, en zijn eigen plan zal hem neerwerpen.", "Fil 4:4": "Verblijd u in de Heere te allen tijd; opnieuw zeg ik: Verblijd u.", "Matt 18:35": "Zo zal ook Mijn hemelse Vader met u doen, als u niet ieder van harte uw broeder zijn misdaden vergeeft.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "2 Kron 35:6": "En slacht het pascha, en heilig u, en bereid dat voor uw broeders, doende naar het woord van de HEERE, door de hand van Mozes.", "Num 3:4": "Maar Nadab en Abihu stierven voor het aangezicht van de HEERE, toen zij vreemd vuur voor het aangezicht van de HEERE in de woestijn van Sinaï brachten, en zij hadden geen kinderen; doch Eleazar en Ithamar bedienden het priesterambt voor het aangezicht van hun vader Aäron.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Num 10:8": "En de zonen van Aäron, de priesters, zullen met die trompetten blazen; en zij zullen u zijn tot een eeuwige inzetting bij uw geslachten.", "2 Petr 2:12-17": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "2 Kron 20:21": "Hij nu overlegde met het volk, en hij stelde voor de HEERE zangers aan, die de heilige Majesteit zouden prijzen, uitgaande voor de toegeruste troepen, en die zeiden: Loof de HEERE, want Zijn goedertierenheid is voor eeuwig!", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "Amos 6:5": "Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "1 Kon 2:35": "En de koning stelde Benaja, de zoon van Jojada, in zijn plaats aan over het leger; en Zadok, de priester, stelde de koning aan in de plaats van Abjathar.", "Jes 24:17": "De angst, en de kuil, en de strik over u, o inwoners van het land!", "Hand 14:23": "En toen zij in elke gemeente, met opsteken van de handen, oudsten hadden aangesteld, en gebeden hadden met vasten, bevalen zij hen bij de Heere aan, in Wie zij geloofd hadden.", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "Pred 8:12": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.", "Jes 66:21": "En ook zal Ik uit hen sommigen tot priesters en tot Levieten nemen, zegt de HEERE.", "Rom 12:1": "Ik smeek u dan, broeders, door de ontfermingen van God, dat u uw lichamen stelt tot een levend, heilig en Gode welbehaaglijk offer, dat is uw redelijke godsdienst.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Matt 25:30": "En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Num 4:19": "Maar dit zult u voor hen doen, opdat zij leven en niet sterven, wanneer zij tot het allerheiligste naderen: Aäron en zijn zonen zullen komen, en hen ieder aanstellen over zijn dienst en zijn last.", "Luk 19:26": "Want ik zeg u dat ieder die heeft, gegeven zal worden; maar van hem die niet heeft, zal ook wat hij heeft afgenomen worden.", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "2 Kron 35:9": "Daartoe Chonanja, en Semaja, en Nethaneel, zijn broeders, alsook Hasabja, en Jeiel, en Jozabad, de leiders van de Levieten, gaven de Levieten tot paasoffers, vijfduizend klein vee en vijfhonderd runderen.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Deut 12:7": "En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "1 Kron 23:8": "De kinderen van Ladan waren deze: Jehiel, het hoofd, en Zetham, en Joël; drie.", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "1 Kron 17:1-5": "Het gebeurde nu, toen David in zijn huis woonde, dat David tegen Nathan, de profeet, zei: Zie, ik woon in een huis van cederhout, maar de ark van het verbond van de HEERE staat onder gordijnen. Toen zei Nathan tegen David: Doe alles wat in uw hart is, want God is met u. Maar het gebeurde diezelfde nacht dat het woord van God tot Nathan kwam en zei:", "Ps 109:6-19": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "1 Kron 16:6": "Maar Benaja en Jahaziël, de priesters, voortdurend met trompetten voor de ark van het verbond van God.", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "1 Kron 6:29": "De kinderen van Merari waren Maheli; zijn zoon Libni; zijn zoon Simeï; zijn zoon Uzza;", "1 Kron 9:22": "Allen die uitgekozen waren tot poortwachters aan de dorpels, waren tweehonderdtwaalf. Dezen waren in het geslachtsregister ingeschreven naar hun dorpen. David en Samuël, de ziener, hadden hen in hun ambt bevestigd.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "1 Kron 12:26-28": "Van de kinderen van Levi, vierduizend zeshonderd; En Jehojada was aanvoerder van de Aäronieten; en met hem waren er drieduizend zevenhonderd. En Zadok was een jongeman, een kloeke held; en uit zijn vaders huis waren tweeëntwintig leiders;", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "1 Sam 6:19": "En de Heere sloeg onder de mensen van Beth-Semes, omdat zij in de ark van de HEERE gekeken hadden; ja, Hij sloeg van het volk zeventig mannen, en vijftigduizend mannen. Toen bedreef het volk rouw, omdat de HEERE een grote slag onder het volk geslagen had.", "Ps 132:5": "totdat ik voor de HEERE een plaats gevonden zal hebben, woningen voor de Machtige van Jakob!", "2 Sam 15:24": "En zie, Zadok was ook daar, en alle Levieten met hem, die de ark van het verbond van God droegen; en zij zetten de ark van God neer, en Abjathar klom op, totdat heel het volk uit de stad klaar was met overgaan.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Num 3:17-26": "Dit nu waren de zonen van Levi met hun namen: Gerson, en Kahath, en Merari. En dit zijn de namen van de zonen van Gerson, naar hun geslachten: Libni en Simeï. En de zonen van Kahath, naar hun geslachten: Amram en Izhar, Hebron en Uzziël.", "Num 4:15": "Als Aäron en zijn zonen het dekken van het heiligdom, en van al het gereedschap van het heiligdom, bij het optrekken van het leger, voltooid hebben, dan zullen daarna de zonen van Kohath komen om te dragen; maar zij zullen dat heilige niet aanraken, opdat zij niet sterven. Dit is de last van de zonen van Kohath, in de tent der samenkomst.", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "1 Kron 15:16-24": "En David zei tegen de leiders van de Levieten, dat zij hun broeders, de zangers, moesten aanstellen met muziekinstrumenten, met luiten, en harpen, en cimbalen, zodat zij zich lieten horen, terwijl zij de stem verhieven met blijdschap. Zo stelden de Levieten Heman aan, de zoon van Joël, en uit zijn broeders Asaf, de zoon van Berechja; en uit de zonen van Merari, hun broeders, Ethan, de zoon van Kusaja; En met hen hun broeders van de tweede orde: Zecharja, Ben en Jaaziel, en Semiramoth, en Jehiel, en Unni, Eliab, en Benaja, en Maaseja, en Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, de poortwachters.", "Micha 2:3": "Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Matt 13:38-42": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Ex 21:17-20": "Wie ook zijn vader of zijn moeder vervloekt, die zal zeker gedood worden. En wanneer mannen ruzie hebben, en de een slaat de ander met een steen of met een vuist, en hij sterft niet, maar moet het bed houden; als hij weer opstaat en op straat gaat met behulp van zijn stok, zal hij die hem sloeg, onschuldig zijn; alleen zal hij vergoeden wat de ander door verzuim verloren heeft, en hij zal hem volledig laten helen.", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "1 Sam 8:12": "en hij zal hen voor zich aanstellen als leiders over duizend, en als leiders over vijftigtallen; en hij zal hen zijn akker laten ploegen, en zijn oogst laten oogsten, en zijn oorlogswapens laten maken, alsook zijn wagentuig.", "1 Kron 15:16-22": "En David zei tegen de leiders van de Levieten, dat zij hun broeders, de zangers, moesten aanstellen met muziekinstrumenten, met luiten, en harpen, en cimbalen, zodat zij zich lieten horen, terwijl zij de stem verhieven met blijdschap. Zo stelden de Levieten Heman aan, de zoon van Joël, en uit zijn broeders Asaf, de zoon van Berechja; en uit de zonen van Merari, hun broeders, Ethan, de zoon van Kusaja; En met hen hun broeders van de tweede orde: Zecharja, Ben en Jaaziel, en Semiramoth, en Jehiel, en Unni, Eliab, en Benaja, en Maaseja, en Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, de poortwachters.", "Ps 119:118": "U vertreedt allen, die van Uw inzettingen afdwalen, want hun bedrog is leugen.", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "1 Kron 9:21": "Zacharja, de zoon van Meselemja, was poortwachter aan de deur van de tent van de samenkomst.", "1 Kron 6:44": "Hun broeders nu, de kinderen van Merari, stonden aan de linker zijde, namelijk Ethan, de zoon van Kisi, de zoon van Abdi, de zoon van Malluch,", "Neh 12:36": "En zijn broeders, Semaja, en Azareël, Milalai, Gilalai, Maai, Nethaneel, en Juda, Hanani, met muziekinstrumenten van David, de man van God; en Ezra, de schriftgeleerde, ging voor hen uit.", "Job 21:7-33": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen? Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht. Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Ps 83:2": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God!", "2 Kron 29:15": "En zij verzamelden hun broeders, en heiligden zich, en kwamen, volgens het gebod van de koning, door de woorden van de HEERE, om het huis van de HEERE te reinigen.", "1 Sam 4:11": "En de ark van God werd genomen, en de twee zonen van Eli, Hofni en Pinehas, stierven.", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Jer 49:12": "Want zo zegt de HEERE: Zie, van hen wier oordeel het niet is de beker te drinken, zullen er helemaal drinken; en zou u dan enigszins ongestraft blijven? U zult niet ongestraft blijven, maar u zult helemaal drinken.", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Ps 89:32": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Jes 30:29": "Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.", "1 Kon 19:13": "En het gebeurde, toen Elia dat hoorde, dat hij zijn gezicht bedekte met zijn mantel, en naar buiten ging, en ging staan in de ingang van de grot. En zie, een stem kwam tot hem, die zei: Wat doet u hier, Elia?", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.", "Klaagl 3:3": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "1 Kron 22:6": "Toen riep hij zijn zoon Salomo, en gebood hem voor de HEERE, de God van Israël, een huis te bouwen.", "2 Tess 1:5-9": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Richt 11:34": "Toen Jeftha nu bij Mizpa bij zijn huis kwam, zie, zo kwam zijn dochter hem tegemoet, met trommels en met reidansen. Zij was zijn enige kind; hij had verder geen zoon of dochter.", "Ex 19:15": "En hij zei tot het volk: Weest gereed tegen de derde dag, en nadert niet tot de vrouw.", "Ps 68:33-36": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.", "1 Sam 8:2": "De naam van zijn eerstgeboren zoon was Joël, en de naam van zijn tweede was Abia; zij waren richters te Berseba.", "Hand 7:46": "die genade gevonden heeft voor God, en gevraagd heeft om een woonplaats te mogen vinden voor de God van Jakob.", "1 Kron 6:42": "De zoon van Ethan, de zoon van Zimma, de zoon van Simeï,", "2 Sam 6:20-23": "Toen David nu terugkwam om zijn huis te zegenen, ging Michal, de dochter van Saul, naar buiten, David tegemoet, en zei: Hoe is de koning van Israël vandaag geëerd, die zich vandaag voor de ogen van de dienstmaagden van zijn dienstknechten heeft ontbloot, zoals een van de nietswaardige mensen zich onbeschaamd ontbloot! Maar David zei tegen Michal: Voor het aangezicht van de HEERE, Die mij verkozen heeft boven uw vader en boven zijn hele huis, om mij aan te stellen tot een voorganger over het volk van de HEERE, over Israël; ja, ik zal spelen voor het aangezicht van de HEERE. Ook zal ik mij nog geringer houden dan dit, en nederig zijn in mijn ogen; en met de dienstmaagden waarvan u gesproken hebt, met hen zal ik geëerd worden.", "Num 23:29": "En Bileam zei tegen Balak: Bouw hier zeven altaren voor mij, en maak hier zeven stieren en zeven rammen voor mij klaar.", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "1 Sam 2:18": "Doch Samuël diende voor het aangezicht van de HEERE, terwijl hij een jongen was, omgord met de linnen efod.", "2 Sam 6:5": "En David en het hele huis van Israël speelden voor het aangezicht van de HEERE, met allerlei snarenspel van dennenhout, met harpen, en met luiten, en met trommels, ook met schellen, en met cimbalen.", "Spr 11:5-8": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Gen 31:27": "Waarom bent u heimelijk gevlucht, en hebt u zich aan mij ontstolen? En hebt u het mij niet verteld, zodat ik u had kunnen wegzenden met vreugde, en met gezangen, met tamboerijn en met harp?", "1 Kor 13:1": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn.", "Job 10:14": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 98:1-8": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven. De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen. Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Ps 5:12": "Maar laat verblijd zijn allen die op U vertrouwen, tot in eeuwigheid; laat hen juichen, omdat U hen overdekt; en laat in U van vreugde opspringen die Uw Naam liefhebben.", "Openb 16:2-21": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.", "Ps 81:5": "Want dat is een inzetting in Israël, een recht van de God van Jakob.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "2 Sam 15:25": "Toen zei de koning tegen Zadok: Breng de ark van God terug in de stad; als ik genade zal vinden in de ogen van de HEERE, dan zal Hij mij terughalen, en zal Hij mij haar laten zien, alsook Zijn woning.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "2 Kor 3:5": "Niet dat wij uit onszelf bekwaam zijn om iets te bedenken, alsof het uit onszelf komt; maar onze bekwaamheid is uit God;", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "1 Kron 10:14": "en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "Joh 17:17": "Heilig hen in Uw waarheid; Uw woord is de waarheid.", "Jes 24:18": "En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.", "1 Sam 3:3": "en Samuël zich ook had neergelegd, voordat de lamp van God uitgedaan werd, in de tempel van de HEERE, waar de ark van God was,", "Ps 105:2": "Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen.", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Ps 81:2-4": "Zingt vrolijk voor God, onze Sterkte; juicht voor de God van Jakob. Heft een psalm op, en geeft de trommel; de liefelijke harp met de luit. Blaast de bazuin in de nieuwe maan, op de bestemde tijd, op onze feestdag.", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Ezech 5:4": "En nog zult u daarvan nemen, en dat werpen in het midden van het vuur, en zult ze verbranden met vuur; daaruit zal een vuur voortkomen tegen het hele huis van Israël.", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Hand 2:13": "En anderen zeiden spottend: Zij zijn vol zoete wijn.", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Spr 13:21": "Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "1 Kron 26:14": "Het lot nu voor het oosten viel op Salemja; maar voor zijn zoon Zecharja, die een verstandig raadsman was, wierp men het lot, en zijn lot kwam uit voor het noorden;", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "1 Sam 7:12": "Samuël nam toen een steen, en zette die tussen Mizpa en Sen, en noemde hem Eben-haezer; en hij zei: Tot hiertoe heeft de HEERE ons geholpen.", "Jes 24:8": "De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houdt op, de vreugde van de harp rust.", "2 Sam 6:17": "Toen zij nu de ark van de HEERE naar binnen brachten, zetten zij die op haar plaats, in het midden van de tent die David voor haar gespannen had; en David offerde brandoffers voor het aangezicht van de HEERE, en dankoffers.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "1 Kron 6:20": "Van Gerson: zijn zoon was Libni; zijn zoon Jahath; zijn zoon Zimma;", "1 Kron 6:17": "En dit zijn de namen van de zonen van Gerson: Libni en Simeï.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "1 Sam 18:27": "Toen maakte David zich op, en hij en zijn mannen gingen heen, en zij sloegen onder de Filistijnen tweehonderd man, en David bracht hun voorhuiden, en men leverde ze de koning volkomen, opdat hij schoonzoon van de koning zou worden. Toen gaf Saul hem zijn dochter Michal tot vrouw.", "Ex 15:20": "En Mirjam, de profetes, de zuster van Aäron, nam een trommel in haar hand; en alle vrouwen gingen achter haar aan, met trommels en met reidansen.", "Neh 12:43": "En zij offerden op die dag grote slachtoffers, en waren vrolijk; want God had hen vrolijk gemaakt met grote vrolijkheid; en ook de vrouwen en de kinderen waren vrolijk; zodat de vrolijkheid van Jeruzalem tot van verre gehoord werd.", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Hos 9:9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "2 Sam 13:8": "En Thamar ging naar het huis van haar broer Amnon (hij lag namelijk neer), en zij nam deeg, en kneedde het, en maakte er voor zijn ogen koekjes van, en bakte de koekjes.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "1 Kron 26:2": "Meselemja nu had kinderen; Zecharja was de eerstgeborene, Jediaël de tweede, Zebadja de derde, Jathniël de vierde,", "Gen 46:11": "En de zonen van Levi: Gerson, Kehath en Merari.", "Ezech 45:23": "En de zeven dagen van het feest zal hij een brandoffer aan de HEERE klaarmaken, van zeven varren en zeven rammen, die gaaf zijn, dagelijks, de zeven dagen lang, en een zondoffer van een geitenbok, dagelijks.", "Num 26:57": "Dit zijn nu de getelden van Levi, naar hun geslachten: van Gerson het geslacht der Gersonieten; van Kohath het geslacht der Kohathieten; van Merari het geslacht der Merarieten.", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "1 Kon 8:1": "Toen verzamelde Salomo de oudsten van Israël, en alle hoofden van de stammen, de leiders van de vaderen, onder de kinderen van Israël, bij de koning Salomo te Jeruzalem, om de ark van het verbond van de HEERE op te brengen uit de stad van David, dat is Sion.", "2 Sam 19:11": "Toen zond koning David een bericht naar Zadok en naar Abjathar, de priesters, en zei: Spreek tegen de oudsten van Juda: Waarom zouden jullie de laatsten zijn om de koning terug te halen naar zijn huis? (Want wat er in heel Israël gezegd werd, was de koning ter ore gekomen in zijn huis.)", "Pred 2:8": "Ik verzamelde mij ook zilver en goud, en kostbaarheden van koningen en landstreken; ik nam mij zangers en zangeressen aan, en wat mensenkinderen tot lust strekt: allerlei snarenspel.", "2 Kron 5:2": "Toen verzamelde Salomo de oudsten van Israël, en al de hoofden van de stammen, de leiders van de vaderen onder de kinderen van Israël, in Jeruzalem, om de ark van het verbond van de HEERE op te brengen uit de stad van David, dat is Sion.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "2 Sam 15:24-29": "En zie, Zadok was ook daar, en alle Levieten met hem, die de ark van het verbond van God droegen; en zij zetten de ark van God neer, en Abjathar klom op, totdat heel het volk uit de stad klaar was met overgaan. Toen zei de koning tegen Zadok: Breng de ark van God terug in de stad; als ik genade zal vinden in de ogen van de HEERE, dan zal Hij mij terughalen, en zal Hij mij haar laten zien, alsook Zijn woning. Maar als Hij zo zal zeggen: Ik heb geen behagen in u; zie, hier ben ik, laat Hij met mij doen zoals het goed is in Zijn ogen.", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "1 Kron 6:50": "Dit nu zijn de kinderen van Aäron: Eleazar, was zijn zoon; Pinehas zijn zoon; Abisua zijn zoon;", "2 Sam 13:7": "Toen zond David iemand naar Thamar in het huis, en zei: Ga toch naar het huis van uw broer Amnon, en maak voor hem voedsel klaar.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "1 Kron 13:10": "Toen ontstak de toorn van de HEERE tegen Uza, en Hij sloeg hem, omdat hij zijn hand had uitgestrekt naar de ark; en hij stierf daar voor het aangezicht van God.", "Ps 98:4-6": "Juich de HEERE toe, heel de aarde! Roep uit van vreugde, en zing vrolijk, en zing psalmen. Zing psalmen voor de HEERE met de harp, met de harp en met de stem van het gezang, Met trompetten en bazuingeklank; juich voor het aangezicht van de Koning, de HEERE.", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Num 7:7": "Twee wagens en vier runderen gaf hij aan de zonen van Gerson, naar hun dienst;", "Num 8:24-26": "Dit is het wat de Levieten aangaat: van vijfentwintig jaar oud en daarboven, zullen zij binnengaan om de strijd te strijden, in de dienst van de tent van de samenkomst. Maar vanaf dat hij vijftig jaar oud is, zal hij van de strijd van deze dienst afgaan, en hij zal niet meer dienen. Doch hij zal met zijn broeders dienen in de tent van de samenkomst, om de wacht waar te nemen; maar de dienst zal hij niet verrichten. Zo zult u aan de Levieten doen in hun wachten.", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "Luk 17:15": "En een van hen, die zag dat hij genezen was, keerde terug en verheerlijkte God met luide stem.", "Jer 3:16": "En het zal gebeuren, wanneer u meer geworden en vruchtbaar geworden bent in het land, in die dagen, spreekt de HEERE, dat zij niet meer zullen zeggen: De ark van het verbond van de HEERE, en zij zal ook niet in het hart opkomen; en zij zullen er niet aan denken, en haar niet bezoeken, en zij zal niet opnieuw gemaakt worden.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Openb 18:22": "En de stem van citerspelers, en zangers, en fluiters, en bazuinblazers, zal in u niet meer gehoord worden; en geen enkele kunstenaar van welke kunst dan ook zal meer in u gevonden worden; en het geluid van de molen zal in u niet meer gehoord worden.", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "Ex 40:20": "Vervolgens nam hij de getuigenis en legde die in de ark, en deed de draagbomen aan de ark, en hij zette het verzoendeksel boven op de ark.", "Jes 12:6": "Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.", "1 Kron 26:4-8": "Obed-Edom had ook kinderen: Semaja was de eerstgeborene, Jozabad de tweede, Joah de derde, en Sachar de vierde, en Nethaneel de vijfde, Ammiël de zesde, Issaschar de zevende, Peullethai de achtste; want God had hem gezegend. Ook werden zijn zoon Semaja kinderen geboren, die heersten over het huis van hun vader; want zij waren dappere helden.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Job 15:28-30": "En heeft verdelgde steden bewoond, en huizen die men niet bewoonde, die gereed waren om een puinhoop te worden. Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde. Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "1 Kron 23:19": "Aangaande de kinderen van Hebron: Jeria was het hoofd, Amarja de tweede, Jahaziël de derde, en Jekameam de vierde.", "Num 1:47-54": "Maar de Levieten werden naar de stam van hun vaderen niet onder hen geteld. Want de HEERE had tot Mozes gesproken en gezegd: Alleen de stam van Levi zult u niet tellen, en hun aantal niet opnemen onder de zonen van Israël.", "Num 4:6": "En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen.", "Ps 92:2-4": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste! Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten; Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "2 Sam 6:7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Dan 3:6": "En wie niet neervalt en aanbidt, die zal op datzelfde moment in het midden van de brandende vuuroven geworpen worden.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Ps 47:2-6": "Al u volken, klapt in de hand; juicht tot God met een stem van vreugdegezang. Want de HEERE, de Allerhoogste, is ontzagwekkend, een groot Koning over de hele aarde. Hij brengt de volken onder ons, en de naties onder onze voeten.", "Ex 37:3-5": "En hij goot er vier gouden ringen voor, aan haar vier hoeken, zodat er twee ringen aan de ene zijde waren, en twee ringen aan de andere zijde. En hij maakte handbomen van acaciahout, en hij overtrok ze met goud. En hij stak de handbomen in de ringen aan de zijden van de ark, om de ark te dragen.", "Ps 68:26": "De zangers gingen voorop, de speellieden erachteraan, in het midden de trommelende meisjes.", "Spr 3:33": "De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.", "Deut 10:8": "In die tijd zonderde de HEERE de stam Levi af, om de ark van het verbond van de HEERE te dragen, om voor het aangezicht van de HEERE te staan, om Hem te dienen, en om in Zijn Naam te zegenen, tot op deze dag.", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "1 Kron 15:25-28": "Het gebeurde nu, dat David en de oudsten van Israël, en de aanvoerders van de duizendtallen, heengingen, om de ark van het verbond van de HEERE op te halen, uit het huis van Obed-edom, met vreugde; Zo gebeurde het, doordat God de Levieten hielp die de ark van het verbond van de HEERE droegen, dat zij zeven jonge stieren en zeven rammen offerden. David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.", "1 Kor 14:15": "Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Lev 10:3": "En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Ex 6:17": "En de zonen van Kehath: Amram, en Jizhar, en Hebron, en Uzziël; en de jaren van het leven van Kehath waren honderddrieëndertig jaren.", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "2 Kron 23:18": "Jojada nu stelde de diensten van het huis van de HEERE aan, onder leiding van de Levitische priesters, die David in het huis van de HEERE ingedeeld had, om de brandoffers van de HEERE te offeren, zoals in de wet van Mozes geschreven staat, met blijdschap en met gezang, naar de instelling van David.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Spr 21:12": "De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Matt 11:17": "En zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben u klaagliederen gezongen, en u hebt niet geweend.", "2 Kron 29:25-28": "En hij stelde de Levieten aan in het huis van de HEERE, met cimbalen, met luiten en harpen, naar het gebod van David, en van Gad, de ziener van de koning, en van Nathan, de profeet; want dit gebod kwam van de hand van de HEERE, door de hand van Zijn profeten. De Levieten nu stonden met de instrumenten van David, en de priesters met de trompetten. En Hizkia gaf bevel dat men het brandoffer op het altaar zou offeren; en op het moment dat het brandoffer begon, begon ook het gezang van de HEERE, met de trompetten en met de instrumenten van David, de koning van Israël.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "2 Kron 35:3": "En hij zei tegen de Levieten, die heel Israël onderwezen, die de HEERE heilig waren: Zet de heilige ark in het huis, dat Salomo, de zoon van David, de koning van Israël, gebouwd heeft; u hebt geen last op de schouders; dien nu de HEERE, uw God, en Zijn volk Israël;", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "1 Kron 16:7": "Op diezelfde dag gaf David voor het eerst deze psalm, om de HEERE te loven, door de dienst van Asaf en zijn broeders.", "2 Kron 30:12": "Ook was de hand van God in Juda, die hun één hart gaf, om het gebod van de koning en van de leiders te doen, naar het woord van de HEERE.", "Ezech 26:13": "Zo zal Ik het gedreun van uw liederen doen ophouden, en het geschal van uw harpen zal niet meer gehoord worden.", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Deut 16:15": "Zeven dagen zult u de HEERE, uw God, feest houden, in de plaats die de HEERE zal uitkiezen; want de HEERE, uw God, zal u zegenen in al uw inkomen, en in al het werk van uw handen; daarom zult u zeker vrolijk zijn.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Ps 55:20": "God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.", "Ex 25:12-15": "En giet daarvoor vier gouden ringen, en zet die aan haar vier hoeken, zodat twee ringen op de ene zijde daarvan zijn, en twee ringen op haar andere zijde. En maak handbomen van acaciahout, en overtrek ze met goud. En steek de handbomen in de ringen die aan de zijde van de ark zijn, zodat men de ark daarmee draagt.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "1 Kron 26:8": "Deze allen waren uit de kinderen van Obed-Edom; zij, en hun kinderen, en hun broers, dappere mannen, krachtig genoeg voor de dienst; er waren er tweeënzestig van Obed-Edom.", "1 Kron 16:37-43": "Zo liet hij daar, voor de ark van het verbond van de HEERE, Asaf en zijn broeders, om voortdurend te dienen voor de ark, naarmat
