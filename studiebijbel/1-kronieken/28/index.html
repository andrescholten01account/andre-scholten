hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Spr 6:16-18": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel: hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten; een hart dat verdorven plannen smeedt; voeten die zich haasten om naar het kwaad te lopen;", "Jer 38:20": "En Jeremia zei: Zij zullen u niet overgeven; wees toch gehoorzaam aan de stem van de HEERE, die ik tot u spreek; zo zal het u goed gaan, en zal uw leven behouden blijven.", "Num 10:21": "Toen trokken de Kohathieten op, dragend het heiligdom; en de anderen richtten de tabernakel op, tegen dat dezen kwamen.", "Deut 26:16-18": "Op deze dag gebiedt de HEERE, uw God, u deze inzettingen en rechten te doen; houd ze dan en doe ze, met heel uw hart en met heel uw ziel. Heden hebt u de HEERE laten zeggen dat Hij u tot een God zal zijn, en dat u zult wandelen in Zijn wegen, en Zijn inzettingen houden, en Zijn geboden, en Zijn rechten, en dat u Zijn stem zult gehoorzamen. En de HEERE heeft u heden laten zeggen dat u Hem tot een volk van het eigendom zult zijn, zoals Hij u gesproken heeft, en dat u al Zijn geboden zult houden;", "2 Kron 5:7": "Zo brachten de priesters de ark van het verbond van de HEERE naar haar plaats, naar het binnenste heiligdom van het huis, naar het heilige der heiligen, tot onder de vleugels van de cherubs.", "Deut 6:2-25": "Opdat u de HEERE, uw God, vreest, om al Zijn inzettingen en Zijn geboden te houden, die ik u gebied; u, en uw kind, en kindskind, al de dagen van uw leven; en opdat uw dagen verlengd worden. Hoor dan, Israël! en let erop dat u ze doet, opdat het u goed gaat, en opdat u zeer vermenigvuldigt (zoals de HEERE, de God van uw vaderen, u gesproken heeft) in het land, dat overvloeit van melk en honing. Hoor, Israël! De HEERE, onze God, is een enig HEERE!", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Ps 118:10": "Alle heidenen hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "1 Tess 3:11": "Moge nu onze God en Vader Zelf, en onze Heere Jezus Christus, onze weg naar u richten.", "Ps 60:11": "Wie zal mij brengen in een vaste stad? Wie zal mij leiden tot in Edom?", "1 Kron 26:26": "Deze Selomith en zijn broers waren over al de schatten van de heilige dingen, die koning David geheiligd had, alsook de hoofden van de families, de leiders over duizenden en honderden, en de leiders van het leger;", "Jes 51:6": "Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Deut 18:13": "Oprecht zult u zijn met de HEERE, uw God.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ps 119:2": "Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "Ps 65:10-14": "U bezoekt het land, en hebt het begerig gemaakt, U verrijkt het overvloedig; de rivier van God is vol water; wanneer U het zo bereid hebt, maakt U hun koren gereed. U maakt zijn opgeploegde aarde dronken; U doet ze dalen in zijn voren; U maakt het zacht door de druppels; U zegent zijn uitspruitsel. U kroont het jaar van Uw goedheid; en Uw voetstappen druipen van vettigheid.", "Ps 33:20-22": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild. Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen. Uw goedertierenheid, HEERE! zij over ons, zoals wij op U hopen.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "2 Tim 3:1-9": "En weet dit, dat in de laatste dagen zware tijden zullen aanbreken. Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig, zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede,", "1 Kon 6:5": "En rondom aan de wand van het huis bouwde hij kamers, aan de wanden van het huis rondom, zowel van de tempel als van het binnenste heiligdom¹. Zo maakte hij zijkamers rondom.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "2 Kron 30:8": "Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Ezech 43:11": "En indien zij schaamrood worden vanwege alles wat zij gedaan hebben, maak hun dan bekend de vorm van het huis, en zijn gestalte, en zijn uitgangen, en zijn ingangen, en al zijn vormen, en al zijn ordinantiën, ja, al zijn vormen en al zijn wetten; en schrijf het voor hun ogen, opdat zij zijn hele vorm en al zijn ordinantiën bewaren, en die doen.", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Rom 15:8": "En ik zeg dat Jezus Christus een dienaar van de besnijdenis geworden is, vanwege de waarheid van God, opdat Hij de beloften aan de vaderen zou bevestigen;", "Mark 12:41": "En Jezus, gezeten tegenover de schatkist, zag hoe de menigte geld in de schatkist wierp; en veel rijken wierpen er veel daarin.", "Ps 55:17": "Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Rom 16:27": "Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Matt 5:45": "opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "2 Kron 3:3": "En dit zijn de grondmaten die Salomo aanhield om het huis van God te bouwen: de lengte in ellen, naar de eerste maat, was zestig ellen, en de breedte twintig ellen.", "Ps 103:3-5": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden; Die uw mond verzadigt met het goede, uw jeugd vernieuwt als die van een arend.", "2 Petr 2:20-22": "Want als zij, nadat zij door de kennis van de Heere en Zaligmaker Jezus Christus aan de besmettingen van de wereld ontkomen zijn, daar opnieuw in verstrikt raken en erdoor overwonnen worden, dan is voor hen het laatste erger geworden dan het eerste. Want het zou beter voor hen geweest zijn de weg van de gerechtigheid niet gekend te hebben, dan die gekend te hebben en zich weer af te keren van het heilige gebod dat hun overgeleverd was. Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "Spr 2:3": "Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid;", "Jer 11:4": "Dat Ik uw vaderen geboden heb, op de dag dat Ik hen uit Egypteland, uit de ijzeroven, uitvoerde, en Ik zei: Wees Mijn stem gehoorzaam, en doe die, naar alles wat Ik u gebied; zo zult u Mij tot een volk zijn, en Ik zal u tot een God zijn;", "Ps 51:12": "Schep mij een rein hart, o God! en vernieuw in mijn binnenste een vaste geest.", "1 Kon 8:24": "Die Uw dienaar, mijn vader David, gehouden hebt wat U tot hem gesproken had; want met Uw mond hebt U gesproken, en met Uw hand vervuld, zoals het op deze dag is.", "Ps 119:11": "Ik heb Uw rede in mijn hart verborgen, opdat ik tegen U niet zondigen zou.", "Ps 67:7": "De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "2 Kron 29:21": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren.", "Num 23:26": "Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?", "Joh 1:48": "Jezus zag Nathanaël naar Zich toe komen, en zei van hem: Zie, waarlijk een Israëliet, in wie geen bedrog is.", "1 Joh 2:22-24": "Wie is de leugenaar, dan wie loochent, dat Jezus de Christus is? Deze is de antichrist, die de Vader en de Zoon loochent. Ieder, die de Zoon loochent, heeft ook de Vader niet; wie de Zoon belijdt, heeft ook de Vader. Wat u dan vanaf het begin gehoord hebt, laat dat in u blijven. Als in u blijft, wat u vanaf het begin gehoord hebt, dan zult u ook in de Zoon en in de Vader blijven.", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Fil 2:16": "Doordat u vasthoudt aan het woord van het leven, mij tot een roem tegen de dag van Christus, dat ik niet tevergeefs gelopen heb, en ook niet tevergeefs gearbeid heb.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Ps 24:3-6": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Hagg 2:19": "Zet er toch uw hart op, vanaf deze dag en verder; vanaf de vierentwintigste dag van de negende maand, vanaf de dag waarop het fundament van de tempel van de HEERE gelegd is, zet er uw hart op.", "Openb 1:12": "En ik keerde mij om, om de stem te zien die met mij gesproken had; en toen ik mij omgekeerd had, zag ik zeven gouden kandelaren;", "Luk 1:68-70": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht; zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "1 Tim 6:14": "dat u dit gebod houdt, onbevlekt en onberispelijk, tot de verschijning van onze Heere Jezus Christus;", "Job 39:3": "Wie bereidt de raaf haar kost, als haar jongen tot God schreeuwen, als zij dwalen, omdat er geen eten is?", "Ps 143:9": "Red mij, HEERE, van mijn vijanden; bij U schuil ik.", "Jes 43:7": "ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "Zach 10:1": "Vraag van de HEERE regen, in de tijd van de late regen; de HEERE maakt de bliksemwolken¹, en Hij zal hun regen genoeg geven, voor ieder kruid op het veld.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Hebr 10:14": "Want met één offer heeft Hij voor eeuwig volmaakt gemaakt hen die geheiligd worden.", "Deut 11:32": "Neem dan waar te doen al de inzettingen en de rechten, die ik u heden voorstel.", "Hebr 4:12": "Want het Woord van God is levend en krachtig, en scherper dan enig tweesnijdend zwaard, en gaat door tot de verdeling van ziel en geest, en van de gewrichten en het merg, en is een beoordelaar van de gedachten en overleggingen van het hart.", "Ezech 48:8": "Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend meetrieten in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn.", "1 Sam 2:3": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.", "Joh 16:26": "Op die dag zult u in Mijn Naam bidden; en Ik zeg u niet dat Ik de Vader voor u zal bidden;", "Ps 77:11-13": "Daarna zei ik: Dit krenkt mij; maar de rechterhand van de Allerhoogste verandert. Ik zal de daden van de HEERE gedenken; ja, ik zal Uw wonderen van vroeger gedenken; En ik zal al Uw werken overdenken, en van Uw daden spreken.", "1 Kron 22:17": "Ook gebood David aan alle vorsten van Israël dat zij zijn zoon Salomo helpen zouden, en hij zei:", "Ps 34:8": "Cheth. De Engel van de HEERE legert Zich rondom hen die Hem vrezen, en redt hen.", "Spr 21:26": "De hele dag begeert hij begeerlijke dingen; maar de rechtvaardige zal geven, en niet inhouden.", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Ps 71:6": "Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Joh 10:32": "Jezus antwoordde hun: Ik heb u veel goede werken getoond van Mijn Vader; om welk van die werken stenigt u Mij?", "Job 24:23": "Geeft God hem gerustheid, dan steunt hij daarop; toch zijn Zijn ogen op hun wegen.", "1 Sam 2:8": "Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Ps 119:27": "Geef mij de weg van Uw bevelen te verstaan, opdat ik Uw wonderen betracht.", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Job 31:4": "Ziet Hij niet mijn wegen, en telt Hij niet al mijn treden?", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Gal 4:9": "en nu u God kent, ja, veelmeer door God gekend bent, hoe keert u zich weer tot de zwakke en arme beginselen, die u weer van voren af aan wilt dienen?", "Lev 26:10": "En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.", "Pred 11:1": "Werp uw brood uit op het water, want u zult het vinden na veel dagen.", "Gen 43:19": "Daarom naderden zij tot hem die over het huis van Jozef was, en zij spraken tegen hem bij de deur van het huis.", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Ps 32:7": "U bent mij een schuilplaats; U behoedt mij voor benauwdheid; U omringt mij met vrolijke gezangen van bevrijding. Sela.", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Ps 37:31": "De wet van zijn God is in zijn hart; zijn gangen zullen niet uitglijden.", "Jes 65:24": "En het zal gebeuren: eer zij roepen, zal Ik antwoorden; terwijl zij nog spreken, zal Ik horen.", "2 Kron 3:5-10": "Het grote huis nu overdekte hij met dennenhout; daarna overtrok hij dat met goed goud; en hij bracht daarop palmen en ketenwerk aan. Hij overtrok het huis ook met kostbare stenen ter versiering; het goud nu was goud van Parvaim. Verder overdekte hij aan het huis de balken, de posten en de wanden daarvan, en de deuren daarvan met goud; en hij graveerde cherubs aan de wanden.", "Klaagl 3:41": "Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "Jer 33:20": "Zo zegt de HEERE: Als u Mijn verbond met de dag, en Mijn verbond met de nacht zou kunnen verbreken, zodat er geen dag en nacht meer zijn op hun tijd;", "Num 31:14": "En Mozes werd zeer boos op de aanvoerders van het leger, de hoofdlieden over de duizenden, en de hoofdlieden over de honderden, die uit de strijd van die oorlog kwamen.", "1 Kon 7:49": "En de kandelaars, vijf aan de rechterkant, en vijf aan de linkerkant, voor het binnenste heiligdom, van zuiver goud; en de bloemen, de lampen, en de snuiters van goud;", "2 Kron 7:17": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Jer 26:12": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;", "Ps 59:11": "De God van mijn goedertierenheid zal mij voor zijn; God zal mij op mijn verspieders doen zien.", "Jes 51:2": "Kijk naar Abraham, uw vader, en naar Sara, die u gebaard heeft; want Ik riep hem, toen hij nog alleen was, en Ik zegende hem, en Ik vermenigvuldigde hem.", "Tit 1:4": "aan Titus, mijn oprechte zoon, naar het gemeenschappelijke geloof: genade, barmhartigheid, vrede zij u van God de Vader, en de Heere Jezus Christus, onze Zaligmaker.", "Ezech 36:37": "Zo zegt de Heere HEERE: Daarenboven zal Ik hierom door het huis van Israël vertrouwd worden, dat Ik het hun doe; Ik zal ze vermenigvuldigen met mensen, als schapen.", "Ex 7:2": "U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.", "Num 23:12": "Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Ps 38:16": "Want op U, HEERE! hoop ik; Gij zult verhoren, Heere, mijn God!", "Matt 5:6": "Zalig zijn zij die hongeren en dorsten naar de gerechtigheid, want zij zullen verzadigd worden.", "1 Kron 26:20": "Ook was, van de Levieten, Ahia over de schatten van het huis van God, en over de schatten van de geheiligde dingen.", "2 Kron 26:18": "En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Jer 17:12": "Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Hand 14:17": "hoewel Hij Zichzelf toch niet zonder getuigenis gelaten heeft, doordat Hij goeddeed, ons vanuit de hemel regen en vruchtbare tijden gaf, en onze harten vervulde met voedsel en vreugde.", "Ex 25:31-39": "U zult ook een kandelaar van zuiver goud maken. Van gedreven werk zal deze kandelaar gemaakt worden, zijn schacht en zijn armen; zijn schaaltjes, zijn knoppen en zijn bloemen zullen uit hem zijn. En zes armen zullen uit zijn zijden uitgaan; drie armen van de kandelaar uit zijn ene zijde, en drie armen van de kandelaar uit zijn andere zijde. In de ene arm zullen drie schaaltjes zijn, gelijk amandelbloesems, een knop en een bloem; en drie schaaltjes, gelijk amandelbloesems, in de andere arm, een knop en een bloem; zo zullen die zes armen zijn die uit de kandelaar uitgaan.", "Ezech 40:48": "Toen bracht hij mij naar het voorhuis van het huis, en hij mat elke post van het voorhuis: vijf ellen aan deze, en vijf ellen aan die kant; en de breedte van de poort: drie ellen aan deze, en drie ellen aan die kant.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Ps 139:1-12": "Een psalm van David, voor de koorleider. HEERE! U doorgrondt en kent mij. U weet mijn zitten en mijn opstaan; U verstaat van verre mijn gedachten. U omringt mijn gaan en mijn liggen; en U bent al mijn wegen gewend.", "2 Kron 4:8": "Ook maakte hij tien tafels, en hij zette ze in de tempel, vijf aan de rechterhand, en vijf aan de linkerhand; en hij maakte honderd gouden sprenkelschalen.", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Hebr 13:21": "Hij volmaakt u in alle goed werk, opdat u Zijn wil mag doen; terwijl Hij in u werkt wat voor Hem welgevallig is, door Jezus Christus; aan Wie de heerlijkheid is, tot in alle eeuwigheid. Amen.", "Ps 44:9": "In God roemen wij de hele dag, en Uw Naam zullen wij loven tot in eeuwigheid. Sela.", "Jona 4:6": "En God, de HEERE, liet een wonderboom groeien en die opschieten boven Jona, zodat er schaduw zou zijn over zijn hoofd, om hem te bevrijden van zijn ellende. En Jona verheugde zich over de wonderboom met grote blijdschap.", "Spr 2:5": "Dan zult u de vreze des HEEREN verstaan, en zult de kennis van God vinden.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Ps 34:5": "Daleth. Ik heb de HEERE gezocht, en Hij heeft mij geantwoord, en mij uit al mijn angsten gered.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Ps 90:14": "Verzadig ons in de morgenstond met Uw goedertierenheid, zo zullen wij juichen, en verblijd zijn in al onze dagen.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Ezech 40:15": "En van de voorkant van de ingangspoort tot aan de voorkant van het voorhuis van de binnenpoort was vijftig ellen.", "Ps 22:6": "Tot U hebben zij geroepen, en zijn uitgered; op U hebben zij vertrouwd, en zijn niet beschaamd geworden.", "2 Sam 7:8": "Nu dan, zo zult u tegen Mijn knecht, tegen David, zeggen: Zo zegt de HEERE van de heerscharen: Ik heb u genomen van de schaapskooi, van achter de schapen, om een voorganger te zijn over Mijn volk, over Israël.", "Jona 3:10": "En God zag hun werken, dat zij zich bekeerden van hun boze weg; en het berouwde God over het kwaad, dat Hij gesproken had hun te zullen doen, en Hij deed het niet.", "Ps 94:9-11": "Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien? Zou Hij, Die de heidenen tuchtigt, niet straffen, Hij, Die de mens wetenschap leert? De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Job 26:6": "Het dodenrijk is naakt voor Hem, en geen bedekking is er voor het verderf.", "Spr 14:11": "Het huis van de goddelozen zal weggevaagd worden; maar de tent van de oprechten zal bloeien.", "Jer 29:13": "En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.", "Ps 121:3": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "Ps 100:5": "Want de HEERE is goed; Zijn goedertierenheid is eeuwig, en Zijn trouw van geslacht tot geslacht.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Mal 4:4": "Denk aan de wet van Mozes, Mijn knecht, die Ik hem geboden heb op Horeb voor heel Israël, met de inzettingen en rechten.", "Ex 37:24": "Hij maakte hem uit een talent zuiver goud, met al zijn gereedschap.", "2 Sam 8:11": "die de koning David ook aan de HEERE toewijdde, samen met het zilver en het goud dat hij toegewijd had van alle heidenvolken die hij zich onderworpen had;", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Deut 30:1-10": "Verder zal het gebeuren, wanneer al deze dingen over u gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult u het weer ter harte nemen, onder alle volken, waarheen de HEERE, uw God, u gedreven heeft; En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.", "1 Kron 29:9": "En het volk was blij over hun vrijwillig geven; want zij gaven met een volkomen hart vrijwillig aan de HEERE; en koning David verblijdde zich ook met grote blijdschap.", "Jes 45:21": "Verkondig het en treed hier toe, ja, beraadslaag samen: wie heeft dat van oudsher laten horen? Wie heeft dat van toen af verkondigd? Ben Ik het niet, de HEERE? En er is geen God meer behalve Mij, een rechtvaardig God, en een Heiland, niemand is er dan Ik.", "Spr 3:9": "Vereer de HEERE met uw goed, en met de eerstelingen van al uw inkomsten;", "1 Kron 24:1-19": "Wat betreft de kinderen van Aäron: dit waren hun verdelingen. De zonen van Aäron waren Nadab, Abihu, Eleazar en Ithamar. Maar Nadab stierf, en Abihu, voor het aangezicht van hun vader, en zij hadden geen kinderen. En Eleazar en Ithamar bedienden het priesterambt. David nu verdeelde hen, en Zadok uit de kinderen van Eleazar, en Abimelech uit de kinderen van Ithamar, naar hun ambt in hun dienst.", "2 Kron 20:3-30": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda. En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.", "Ps 81:14-17": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld! In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders. Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Ps 115:12-14": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen. Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten. De HEERE zal de zegen over u vermeerderen, over u en over uw kinderen.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Ex 25:23-30": "U zult ook een tafel maken van acaciahout; twee el zal haar lengte zijn, en een el haar breedte, en een el en een halve zal haar hoogte zijn. En u zult ze met zuiver goud overtrekken; u zult daaraan ook een gouden krans maken, rondom. U zult ook een lijst rondom daaraan maken, een hand breed; en u zult een gouden krans rondom die lijst maken.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Deut 7:12-15": "Dan zal het gebeuren, omdat u deze rechten zult horen, en houden, en die doen, dat de HEERE, uw God, voor u het verbond en de goedertierenheid zal houden, die Hij uw vaderen gezworen heeft; en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten;", "Deut 4:1-40": "Israël! hoor naar de inzettingen en de rechten die ik u leer te doen, opdat u leeft, en het land binnentrekt en in bezit neemt dat de HEERE, de God van uw vaderen, u geeft. U mag aan dit woord, dat ik u gebied, niets toevoegen, en er ook niets van afdoen; opdat u de geboden bewaart van de HEERE, uw God, die ik u gebied. Uw ogen hebben gezien wat God bij Baäl-peor gedaan heeft; want ieder man die Baäl-peor navolgde, die heeft de HEERE, uw God, uit uw midden weggevaagd.", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Num 5:6": "Spreek tot de kinderen van Israël: Wanneer een man of een vrouw iets van enige menselijke zonden gedaan zal hebben, door overtreding tegen de HEERE overtreden hebbend, dan is die ziel schuldig.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Hebr 9:1": "Zo had dan het eerste verbond wel regels van de eredienst, en het aardse heiligdom.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Ps 119:43": "En ruk het woord van de waarheid van mijn mond niet al te zeer, want ik hoop op Uw rechten.", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Zef 3:12": "Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.", "Matt 11:25-27": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt. Ja, Vader! Want zo is het welbehagen geweest voor U. Alle dingen zijn Mij overgegeven door Mijn Vader; en niemand kent de Zoon dan de Vader, en niemand kent de Vader dan de Zoon, en wie het de Zoon wil openbaren.", "Jes 48:6": "U hebt het gehoord, aanmerkt dat alles; zult u het ook niet verkondigen? Van nu af doe Ik u nieuwe dingen horen, en verborgen dingen, en die u niet geweten hebt.", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Spr 20:9": "Wie kan zeggen: Ik heb mijn hart gezuiverd, ik ben rein van mijn zonde?", "Ps 119:90": "Uw trouw is van geslacht tot geslacht; U hebt de aarde vastgemaakt, en zij blijft staan;", "Jes 44:4": "En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Hoogl 3:1-4": "Ik zocht 's nachts op mijn bed Hem, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet; ik zei: ... Ik zal nu opstaan, en in de stad omgaan, in de wijken en in de straten; ik zal Hem zoeken, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet. De wachters, die in de stad omgingen, vonden mij: ik zei: Hebt u Die gezien, Die mijn ziel liefheeft?", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "1 Kor 13:3": "En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud van de armen, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.", "Ps 41:2-4": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads. De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden. De HEERE zal hem ondersteunen op het ziekbed; in zijn ziekte verandert U zijn hele leger.", "Jes 40:14": "Met wie heeft Hij raad gehouden, die Hem verstand zou geven, en Hem zou leren van het pad van het recht, en Hem wetenschap zou leren, en Hem bekend zou maken de weg van het veelvoudige verstand?", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Joh 2:25": "En omdat Hij niet nodig had dat iemand zou getuigen van de mens; want Hij Zelf wist wat er in de mens was.", "Hand 2:21": "En het zal gebeuren dat ieder die de Naam van de Heere zal aanroepen, behouden zal worden.", "Klaagl 3:25": "Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt.", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "Ps 91:1": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige.", "Ps 20:6-8": "Wij zullen juichen over Uw heil, en de vaandels opsteken in de Naam van onze God. De HEERE vervult al uw verlangens. Nu weet ik, dat de HEERE Zijn Gezalfde behoudt; Hij zal Hem verhoren uit de hemel van Zijn heiligheid; het heil van Zijn rechterhand zal zijn met machten. Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Spr 2:1-6": "Mijn zoon! Als u mijn woorden aanneemt, en mijn geboden bij u bewaart; Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt; Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid;", "Ps 91:10": "U zal geen kwaad overkomen, en geen plaag zal uw tent naderen.", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "Luk 12:10": "En ieder die een woord spreken zal tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest gelasterd zal hebben, die zal het niet vergeven worden.", "2 Kon 8:19": "Toch wilde de HEERE Juda niet verderven, omwille van David, Zijn dienaar; zoals Hij hem gezegd had dat Hij hem altijd een lamp zou geven voor zijn zonen.", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Spr 3:2": "Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Job 22:13": "Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen?", "Hebr 13:16": "En vergeet de weldadigheid en de mededeelzaamheid niet; want aan zulke offers heeft God een welgevallen.", "1 Kon 2:1-4": "Toen de dagen van David naderden dat hij zou sterven, gaf hij zijn zoon Salomo deze opdracht en zei: Ik ga heen in de weg van de hele aarde, wees dus sterk en wees een man. En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;", "Kol 3:14": "En doe boven dit alles de liefde aan, die de band van de volmaaktheid is.", "Fil 3:12-15": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben. Broeders, ik acht niet dat ik het zelf al gegrepen heb. Maar één ding doe ik: ik vergeet wat achter is, en strek mij uit naar wat voor is, en jaag naar het doel, naar de prijs van de roeping van God van boven in Christus Jezus.", "Ps 119:44": "Zo zal ik Uw wet voortdurend onderhouden, eeuwig en altijd.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "2 Sam 7:13": "Die zal voor Mijn Naam een huis bouwen; en Ik zal de troon van zijn koninkrijk bevestigen tot in eeuwigheid.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Luk 22:29": "En Ik ken u het Koninkrijk toe, zoals Mijn Vader dat Mij toegekend heeft;", "Deut 8:16-20": "Die u in de woestijn voedde met manna, dat uw vaderen niet gekend hadden; om u te verootmoedigen, en om u te beproeven, opdat Hij u uiteindelijk goeddeed; En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "1 Kron 28:11-19": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel; en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen; en van de afdelingen van de priesters en de Levieten, en van al het werk van de dienst van het huis van de HEERE, en van alle voorwerpen van de dienst van het huis van de HEERE.", "Hebr 8:5": "Deze priesters dienen het voorbeeld en de schaduw van de hemelse dingen, zoals Mozes door een goddelijke aanwijzing gewaarschuwd werd toen hij de tabernakel zou voltooien: Want, zegt Hij, zie erop toe dat u alles maakt naar het patroon dat u op de berg getoond is.", "Deut 11:8": "Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;", "Jak 5:16": "Belijd elkaar de misdaden, en bid voor elkaar, opdat u gezond wordt; een krachtig gebed van de rechtvaardige vermag veel.", "1 Kon 6:10": "Hij bouwde ook de kamers tegen het hele huis, vijf ellen hoog; en hij voegde ze vast aan dat huis met cederhout.", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Ps 22:29": "Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen.", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Gen 49:8-10": "Juda! U bent het, u zullen uw broers loven; uw hand zal zijn op de nek van uw vijanden; voor u zullen de zonen van uw vader zich neerbuigen. Juda is een leeuwenwelp! U bent van de roof opgeklommen, mijn zoon! Hij kromt zich, hij legt zich neer als een leeuw, en als een oude leeuw; wie zal hem doen opstaan? De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u gesteld, zodat u zou heengaan en vrucht dragen, en dat uw vrucht blijft; zodat, wat u ook van de Vader zal vragen in Mijn Naam, Hij u dat geeft.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Ef 1:17": "Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "Hand 10:4": "En hij hield de ogen op hem gericht, en werd zeer bevreesd, en zei: Wat is er, Heere? En Hij zei tegen hem: Uw gebeden en uw aalmoezen zijn als gedachtenis opgekomen voor God.", "1 Sam 16:6-13": "En het gebeurde, toen zij binnenkwamen, dat hij Eliab aanzag, en dacht: Zeker, deze staat hier voor de HEERE, Zijn gezalfde. Doch de HEERE zei tegen Samuël: Kijk niet naar zijn gestalte, en ook niet naar zijn lange lengte, want Ik heb hem verworpen; want het is niet zoals de mens ziet; want de mens kijkt naar wat voor ogen is, maar de HEERE kijkt naar het hart. Toen riep Isaï Abinadab, en liet hem voor Samuël langslopen; doch hij zei: Ook deze heeft de HEERE niet uitgekozen.", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Matt 5:28": "Maar Ik zeg u, dat ieder die naar een vrouw kijkt om haar te begeren, al overspel met haar gepleegd heeft in zijn hart.", "Jes 48:5": "Daarom heb Ik het u van toen af verkondigd, voordat het kwam, heb Ik het u doen horen; opdat u niet misschien zou zeggen: Mijn afgod heeft die dingen gedaan, of mijn gesneden beeld, of mijn gegoten beeld heeft ze bevolen.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Ps 22:5": "Op U hebben onze vaders vertrouwd; zij hebben vertrouwd, en U hebt hen uitgeholpen.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Gen 9:16": "Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "2 Kor 6:18": "en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "2 Kor 1:20": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "1 Tess 1:1": "Paulus, en Silvanus, en Timotheüs, aan de Gemeente van de Thessalonicenzen, die is in God de Vader, en de Heere Jezus Christus: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Ex 25:1-8": "Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, dat zij voor Mij een hefoffer nemen. Van elke man wiens hart zich vrijwillig bewegen zal, zult u Mijn hefoffer nemen. Dit nu is het hefoffer, dat u van hen nemen zult: goud, zilver en koper;", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Gen 17:1": "Toen Abram negenennegentig jaar oud was, verscheen de HEERE aan Abram en zei tegen hem: Ik ben God, de Almachtige! Wandel voor Mijn aangezicht en wees oprecht!", "Deut 12:17-19": "U zult in uw poorten niet mogen eten de tienden van uw koren, en van uw most, en van uw olie, noch de eerstgeboorte van uw runderen en van uw schapen, noch enige van uw geloften die u zult hebben beloofd, noch uw vrijwillige offers, noch het hefoffer van uw hand. Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt. Wacht u ervoor dat u de Leviet niet verlaat, al uw dagen in uw land.", "Job 9:21": "Ben ik oprecht, dan acht ik toch mijn ziel niet; ik versmaad mijn leven.", "Luk 14:26-33": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn. En wie zijn kruis niet draagt en Mij navolgt, die kan Mijn discipel niet zijn. Want wie van u die een toren wil bouwen, gaat niet eerst zitten om de kosten te berekenen, of hij wel genoeg heeft om het af te maken?", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "Jak 3:9": "Door haar loven wij God en de Vader, en door haar vervloeken wij de mensen, die naar de gelijkenis van God gemaakt zijn.", "Matt 9:4": "En Jezus kende hun gedachten en zei: Waarom denkt u kwaad in uw hart?", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "Ps 27:8": "Mijn hart zegt tegen U: U zegt: Zoek Mijn aangezicht; ik zoek Uw aangezicht, o HEERE!", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "1 Kon 9:6-9": "Maar als u zich helemaal afkeert, u en uw kinderen, van Mij, om Mij niet meer te volgen, en Mijn geboden en Mijn inzettingen, die Ik voor uw aangezicht gegeven heb, niet houdt, maar heengaat en andere goden dient, en u voor hen neerbuigt; Dan zal Ik Israël uitroeien van het land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen; en Israël zal tot een spreekwoord en spotrede zijn onder alle volken. En aangaande dit huis, dat verheven zal geweest zijn, ieder die eraan voorbijgaat zal zich ontzetten en fluiten; men zal zeggen: Waarom heeft de HEERE zo gedaan aan dit land en aan dit huis?", "Ps 59:10": "Tegen zijn sterkte zal ik op U wachten; want God is mijn Hoog Vertrek.", "Deut 29:10": "U staat heden allen voor het aangezicht van de HEERE, uw God: uw hoofden van uw stammen, uw oudsten, en uw opzichters, alle mannen van Israël;", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Num 7:14": "Een reukschaal van tien gouden sikkels, vol van het reukwerk;", "Ex 22:23": "Als u hen op enige manier kwaad doet, en zij roepen dan tot Mij, zal Ik hun geroep zeker verhoren;", "1 Tim 6:17-19": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten; dat zij goed doen, rijk worden in goede werken, vrijgevig zijn en bereid om te delen; en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "Gal 3:29": "En als u van Christus bent, dan bent u Abrahams nageslacht, en naar de belofte erfgenamen.", "1 Kor 2:7": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Spr 15:13-15": "Een vrolijk hart maakt het gezicht blij; maar door verdriet in het hart wordt de geest verslagen. Een verstandig hart zoekt de wetenschap; maar de mond van de zotten voedt zich met dwaasheid. Al de dagen van de bedrukte zijn kwaad; maar een vrolijk hart is een voortdurende maaltijd.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "2 Kor 8:12": "Want als de bereidheid van het gemoed er eerst is, dan is iemand aangenaam naar wat hij heeft, niet naar wat hij niet heeft.", "Joh 17:21": "Opdat zij allen één zijn, zoals U, Vader, in Mij, en Ik in U, dat ook zij in Ons één zijn; opdat de wereld gelooft dat U Mij gezonden hebt.", "2 Kon 19:27": "Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woeden tegen Mij.", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "Matt 6:14": "Want als u de mensen hun misdaden vergeeft, zal uw hemelse Vader ook u vergeven.", "Joh 10:33": "De Joden antwoordden Hem: Wij stenigen U niet vanwege enig goed werk, maar vanwege godslastering, en omdat U, die een Mens bent, Uzelf God maakt.", "1 Kon 8:53": "Want U hebt hen voor Uzelf tot een erfdeel afgezonderd, uit alle volken van de aarde; zoals U gesproken hebt door de dienst van Mozes, Uw dienaar, toen U onze vaderen uit Egypte uitvoerde, Heere HEERE!", "1 Kon 6:13": "En Ik zal in het midden van de kinderen van Israël wonen; en Ik zal Mijn volk Israël niet verlaten.", "Luk 1:72": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken;", "Job 33:26": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven.", "Luk 12:34": "Want waar uw schat is, daar zal ook uw hart zijn.", "Joh 10:30": "Ik en de Vader zijn één.", "Ps 27:2": "Toen de bozen, mijn tegenpartijen en mijn vijanden, tegen mij naar mij toe kwamen om mijn vlees te eten, stieten zij zelf aan en vielen.", "Fil 1:19-21": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus. Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood. Want het leven is voor mij Christus, en het sterven is winst.", "Tit 3:1": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn;", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "Rom 12:13": "Deel mee in de behoeften van de heiligen. Streef naar gastvrijheid.", "Joz 21:45": "Er viel niet één woord weg van al de goede woorden, die de HEERE gesproken had tot het huis van Israël; het kwam allemaal uit.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Deut 7:12-26": "Dan zal het gebeuren, omdat u deze rechten zult horen, en houden, en die doen, dat de HEERE, uw God, voor u het verbond en de goedertierenheid zal houden, die Hij uw vaderen gezworen heeft; en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten;", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Job 21:22": "Zal men God wetenschap leren, terwijl Hij hen die hoog zijn richt?", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "Num 15:38-40": "Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten. En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert; Opdat u denkt aan en doet al Mijn geboden, en voor uw God heilig bent.", "Hebr 3:15": "Terwijl er gezegd wordt: Heden, als u Zijn stem hoort, verhard uw harten niet, zoals bij de verbittering gebeurd is.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Dan 3:16": "Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Gen 28:20": "En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken;", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "1 Joh 3:2": "Geliefden, nu zijn wij kinderen van God, en het is nog niet openbaar geworden wat wij zijn zullen. Maar wij weten dat, als Hij geopenbaard zal zijn, wij Hem gelijk zullen zijn; want wij zullen Hem zien zoals Hij is.", "Hand 22:16": "En nu, waarom wacht u nog? Sta op, laat u dopen en uw zonden afwassen, terwijl u de Naam van de Heere aanroept.", "Ps 136:5": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "1 Kon 6:23-30": "In het binnenste heiligdom¹ nu maakte hij twee cherubs van olijfhout; de hoogte van elk was tien ellen. En vijf ellen was de ene vleugel van de cherub, en vijf ellen de andere vleugel van de cherub; van het einde van zijn ene vleugel tot aan het einde van zijn andere vleugel waren het tien ellen. Zo was de andere cherub ook tien ellen; beide cherubs hadden dezelfde maat en dezelfde vorm.", "Luk 1:54": "Hij heeft Israël, Zijn knecht, opgenomen, om Zijn barmhartigheid te gedenken,", "1 Joh 3:22": "en wat wij ook bidden, ontvangen wij van Hem, omdat wij Zijn geboden bewaren en doen wat welgevallig is voor Hem.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Ps 69:33": "De zachtmoedigen, als zij dit gezien hebben, zullen zich verblijden; en u die God zoekt, uw hart zal leven.", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Ps 72:16": "Is er een handvol koren in het land op de hoogte van de bergen, de vrucht daarvan zal ruisen als de Libanon; en die van de stad zullen bloeien als het kruid van de aarde.", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Jer 3:19": "Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.", "Ps 21:8": "Want de koning vertrouwt op de HEERE, en door de goedertierenheid van de Allerhoogste zal hij niet wankelen.", "Ps 94:11": "De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Ps 4:9": "Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.", "Ezech 42:20": "Hij mat het aan de vier zijden; het had een muur rondom, de lengte was vijfhonderd rieten, en de breedte vijfhonderd, om onderscheid te maken tussen het heilige en het onheilige.", "Hand 17:23": "Want toen ik door de stad liep en uw heiligdommen bekeek, vond ik ook een altaar waarop een opschrift stond: AAN DE ONBEKENDE GOD. Hem dan, Die u niet kent en toch dient, verkondig ik u.", "Ps 17:2": "Laat mijn recht van voor Uw aangezicht uitgaan, laat Uw ogen aanschouwen wat recht is.", "2 Kon 22:5": "En dat zij dat geven in de hand van de opzichters van het werk, die aangesteld zijn over het huis van de HEERE; opdat zij het geven aan degenen die het werk doen dat in het huis van de HEERE is, om de scheuren van het huis te herstellen;", "2 Kon 11:15": "Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.", "2 Petr 2:17": "Dezen zijn waterloze bronnen, wolken die door een storm worden voortgedreven; voor hen is de donkerheid van de duisternis voor eeuwig bewaard.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Jak 4:8-11": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen! Gedraag u als ellendigen, en treur en ween; laat uw lachen veranderen in treuren, en uw blijdschap in verdriet. Verneder u voor de Heere, en Hij zal u verhogen.", "Jak 1:25": "Maar wie zich verdiept in de volmaakte wet, die van de vrijheid is, en daarbij blijft, die is geen vergeetachtige hoorder geworden, maar een dader van het werk, die zal, zeg ik, gelukzalig zijn in dit zijn doen.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Joh 8:19": "Zij zeiden dan tegen Hem: Waar is Uw Vader? Jezus antwoordde: U kent Mij niet, en Mijn Vader ook niet; als u Mij kende, zou u ook Mijn Vader kennen.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "2 Kor 8:11-15": "Maar voleindig nu ook het doen; opdat, zoals er geweest is de bereidheid van het gemoed om te willen, er ook zo het voleindigen zij uit wat u hebt. Want als de bereidheid van het gemoed er eerst is, dan is iemand aangenaam naar wat hij heeft, niet naar wat hij niet heeft. Want dit zeg ik niet, opdat anderen verlichting zouden hebben, en u verdrukking;", "Matt 13:21": "Doch hij heeft geen wortel in zichzelf, maar houdt maar even stand; en als er verdrukking of vervolging komt om het woord, dan struikelt hij meteen.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Joh 4:21": "Jezus zei tegen haar: Vrouw, geloof Mij, het uur komt waarop u, noch op deze berg, noch in Jeruzalem, de Vader zult aanbidden.", "Amos 5:4-6": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef. Maar zoek Beth-el niet, en kom niet naar Gilgal, en trek niet over naar Ber-seba; want Gilgal zal zeker in gevangenschap weggevoerd worden, en Beth-el zal tot niets worden. Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Ex 33:17-20": "Toen zei de HEERE tegen Mozes: Ook deze zaak, die u gesproken hebt, zal Ik doen, omdat u genade gevonden hebt in Mijn ogen, en Ik u bij naam ken. Toen zei hij: Toon mij nu Uw heerlijkheid! Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Dan 8:11": "Ja, hij verhief zich tot aan de Vorst van dat leger, en van Hem werd het voortdurende offer weggenomen, en de woning van Zijn heiligdom werd neergeworpen.", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Ps 21:4-6": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud. Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos. Groot is zijn eer door Uw heil; majesteit en heerlijkheid hebt U hem toegevoegd.", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "2 Sam 7:20": "En wat zal David nog meer tot U spreken? Want U kent Uw knecht, Heere HEERE!", "Ezech 43:10": "U, mensenkind, wijs het huis van Israël dit huis, opdat zij schaamrood worden vanwege hun ongerechtigheden, en laat ze het
