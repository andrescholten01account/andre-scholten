ders van Israël in Jeruzalem: de leiders van de stammen, de leiders van de afdelingen die de koning dienden bij toerbeurt, de leiders over de duizenden, de leiders over de honderden, de beheerders over alle bezittingen en het vee van de koning en zijn zonen, met de hovelingen, de helden en alle dappere mannen.", "2": "En koning David stond op zijn voeten en zei: Hoor mij, mijn broeders en mijn volk! Ik had het in mijn hart om een huis van rust te bouwen voor de ark van het verbond van de HEERE, en voor de voetbank van de voeten van onze God, en ik heb voorbereidingen getroffen om te bouwen.", "3": "Maar God heeft tegen mij gezegd: U zult voor Mijn Naam geen huis bouwen, want u bent een krijgsman en u hebt veel van het bloed vergoten.", "4": "Nu heeft de HEERE, de God van Israël, mij verkoren uit het hele huis van mijn vader om koning te zijn over Israël, voor eeuwig; want Hij heeft Juda verkoren tot leider, en uit het huis van Juda het huis van mijn vader; en onder de zonen van mijn vader heeft Hij een welgevallen aan mij gehad, om mij koning te maken over heel Israël.", "5": "En uit al mijn zonen (want de HEERE heeft mij veel zonen gegeven) heeft Hij mijn zoon Salomo verkoren, dat hij zou zitten op de troon van het koninkrijk van de HEERE over Israël.", "6": "En Hij heeft tegen mij gezegd: Uw zoon Salomo, die zal Mijn huis en Mijn voorhoven bouwen; want Ik heb hem voor Mij verkoren tot een zoon, en Ik zal hem tot een Vader zijn.", "7": "En Ik zal zijn koninkrijk bevestigen tot in eeuwigheid, als hij standvastig is om Mijn geboden en Mijn rechten te doen, zoals op deze dag.", "8": "Welnu, voor de ogen van heel Israël, de gemeente van de HEERE, en voor de oren van onze God: houd en zoek al de geboden van de HEERE, uw God; opdat u dit goede land erfelijk bezit, en het na u nalaat als erfenis aan uw kinderen tot in eeuwigheid.", "9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "10": "Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.", "11": "En David gaf zijn zoon Salomo een bereiding[1] van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "12": "en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;", "13": "en van de afdelingen van de priesters en de Levieten, en van al het werk van de dienst van het huis van de HEERE, en van alle voorwerpen van de dienst van het huis van de HEERE.", "14": "Het goud gaf hij naar het gewicht in goud, voor alle voorwerpen voor elke dienst; ook zilver voor alle zilveren voorwerpen bij gewicht, voor alle voorwerpen van elke dienst;", "15": "en het gewicht voor de gouden kandelaars en hun gouden lampen, naar het gewicht van elke kandelaar en zijn lampen; ook voor de zilveren kandelaars, naar het gewicht van een kandelaar en zijn lampen, naar de dienst van elke kandelaar.", "16": "Ook gaf hij het goud naar het gewicht voor de tafels van de bereiding[2], voor elke tafel, en het zilver voor de zilveren tafels;", "17": "en zuiver goud voor de krauwels, en voor de sprenkelschalen[3], en voor de schalen, en voor gouden bekers, het gewicht voor elke beker; evenzo voor zilveren bekers, voor elke beker het gewicht;", "18": "en voor het reukofferaltaar gelouterd goud in gewicht; en goud voor de bereiding van de wagen, namelijk van de cherubs[4], die hun vleugels zouden uitspreiden en de ark van het verbond van de HEERE overdekken.", "19": "Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.", "20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "21": "En zie, daar zijn de afdelingen van de priesters en de Levieten, voor elke dienst van het huis van God; en bij u zijn er voor al het werk allerlei vrijwilligers, met wijsheid voor elke dienst, ook de leiders en heel het volk, gereed voor al uw bevelen."}, "SV": {"1": "Toen vergaderde David te Jeruzalem alle oversten van Israël, de oversten der stammen, en de oversten der verdelingen, den koning dienende, en de oversten der duizenden, en de oversten der honderden, en de oversten van alle have en vee des konings en zijner zonen, met de kamerlingen, en de helden, ja, allen kloeken held.", "2": "En de koning David stond op zijn voeten, en hij zeide: Hoort mij, mijn broeders, en mijn volk! Ik had in mijn hart een huis der rust voor de ark des verbonds des HEEREN te bouwen, en voor de voetbank der voeten onzes Gods, en ik heb gereedschap gemaakt om te bouwen.", "3": "Maar God heeft tot mij gezegd: Gij zult Mijn Naam geen huis bouwen, want gij zijt een krijgsman, en gij hebt veel bloeds vergoten.", "4": "Nu heeft mij de HEERE, de God Israëls, verkoren uit mijns vaders ganse huis, dat ik tot koning over Israël wezen zou in eeuwigheid; want Hij heeft Juda tot een voorganger verkoren, en mijns vaders huis in het huis van Juda; en onder de zonen mijns vaders heeft Hij een welgevallen aan mij gehad, dat Hij mij ten koning maakte over gans Israël.", "5": "En uit al mijn zonen (want de HEERE heeft mij vele zonen gegeven) zo heeft Hij mijn zoon Salomo verkoren, dat hij zitten zou op den stoel des koninkrijks des HEEREN over Israël.", "6": "En Hij heeft tot mij gezegd: Uw zoon Salomo, die zal Mijn huis en Mijn voorhoven bouwen; want Ik heb hem Mij uitverkoren tot een zoon, en Ik zal hem tot een Vader zijn.", "7": "En Ik zal zijn koninkrijk bevestigen tot in eeuwigheid, indien hij sterk wezen zal, om Mijn geboden en Mijn rechten te doen, gelijk te dezen dage.", "8": "Nu dan, voor de ogen van het ganse Israël, de gemeente des HEEREN, en voor de oren onzes Gods, houdt en zoekt al de geboden des HEEREN, uws Gods; opdat gijlieden dit goede land erfelijk bezit, en uw kinderen na u tot in eeuwigheid doet erven.", "9": "En gij, mijn zoon Salomo, ken den God uws vaders, en dien Hem met een volkomen hart en met een willige ziel; want de HEERE doorzoekt alle harten, en Hij verstaat al het gedichtsel der gedachten; indien gij Hem zoekt, Hij zal van u gevonden worden; maar indien gij Hem verlaat, Hij zal u tot in eeuwigheid verstoten.", "10": "Zie nu toe, want de HEERE heeft u verkoren, dat gij een huis ten heiligdom bouwt; wees sterk, en doe het.", "11": "En David gaf zijn zoon Salomo een voorbeeld van het voorhuis, met zijn behuizingen, en zijn schatkameren, en zijn opperzalen, en zijn binnenkameren, en van het huis des verzoendeksels;", "12": "En een voorbeeld van alles, wat bij hem door den Geest was, *namelijk* van de voorhoven van het huis des HEEREN, en van alle kameren rondom; tot de schatten van het huis Gods, en tot de schatten der heilige dingen;", "13": "En van de verdelingen der priesteren en der Levieten, en van alle werk van den dienst van het huis des HEEREN, en van alle vaten van den dienst van het huis des HEEREN.", "14": "Het goud *gaf* *hij* naar het goudgewicht, tot alle vaten van elken dienst; *ook* *zilver* tot alle zilveren vaten bij gewicht, tot al de vaten van elken dienst;", "15": "En het gewicht tot de gouden kandelaars, en hun gouden lampen, naar het gewicht van elken kandelaar en zijn lampen; ook tot de zilveren kandelaars, naar het gewicht van een kandelaar en zijn lampen, naar den dienst van elken kandelaar.", "16": "Ook *gaf* *hij* het goud naar het gewicht tot de tafelen der toerichting, tot elke tafel, en het zilver tot de zilveren tafelen;", "17": "En louter goud tot de krauwelen, en tot de sprengbekkens, en tot de schotelen, en tot gouden bekers, het gewicht tot elken beker, desgelijks tot zilveren bekers, tot elken beker het gewicht;", "18": "En tot het reukaltaar gelouterd goud in gewicht; en goud tot het voorbeeld des wagens, *te* *weten* der cherubim, die *de* *vleugels* zouden uitbreiden, en de ark des verbonds des HEEREN overdekken.", "19": "Dit alles heeft men mij, *zeide* *David*, bij geschrift te verstaan gegeven van de hand des HEEREN, *te* *weten* al de werken dezes voorbeelds.", "20": "En David zeide tot zijn zoon Salomo: Wees sterk, en heb goeden moed, en doe het, vrees niet, en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven, en Hij zal u niet verlaten, totdat gij al het werk tot den dienst van het huis des HEEREN zult volbracht hebben.", "21": "En zie, daar zijn de verdelingen der priesteren en der Levieten, tot allen dienst van het huis Gods; en bij u zijn tot alle werk allerlei vrijwilligen, met wijsheid tot allen dienst, ook de vorsten, en het ganse volk, *bereid* tot al uw bevelen."}, "KJV": {"1": "And David assembled all the princes of Israel, the princes of the tribes, and the captains of the companies that ministered to the king by course, and the captains over the thousands, and captains over the hundreds, and the stewards over all the substance and possession of the king, and of his sons, with the officers, and with the mighty men, and with all the valiant men, unto Jerusalem.", "2": "Then David the king stood up upon his feet, and said, Hear me, my brethren, and my people: As for me, I had in mine heart to build an house of rest for the ark of the covenant of the LORD, and for the footstool of our God, and had made ready for the building:", "3": "But God said unto me, Thou shalt not build an house for my name, because thou hast been a man of war, and hast shed blood.", "4": "Howbeit the LORD God of Israel chose me before all the house of my father to be king over Israel for ever: for he hath chosen Judah to be the ruler; and of the house of Judah, the house of my father; and among the sons of my father he liked me to make me king over all Israel:", "5": "And of all my sons, (for the LORD hath given me many sons,) he hath chosen Solomon my son to sit upon the throne of the kingdom of the LORD over Israel.", "6": "And he said unto me, Solomon thy son, he shall build my house and my courts: for I have chosen him to be my son, and I will be his father.", "7": "Moreover I will establish his kingdom for ever, if he be constant to do my commandments and my judgments, as at this day.", "8": "Now therefore in the sight of all Israel the congregation of the LORD, and in the audience of our God, keep and seek for all the commandments of the LORD your God: that ye may possess this good land, and leave it for an inheritance for your children after you for ever.", "9": "And thou, Solomon my son, know thou the God of thy father, and serve him with a perfect heart and with a willing mind: for the LORD searcheth all hearts, and understandeth all the imaginations of the thoughts: if thou seek him, he will be found of thee; but if thou forsake him, he will cast thee off for ever.", "10": "Take heed now; for the LORD hath chosen thee to build an house for the sanctuary: be strong, and do it.", "11": "Then David gave to Solomon his son the pattern of the porch, and of the houses thereof, and of the treasuries thereof, and of the upper chambers thereof, and of the inner parlours thereof, and of the place of the mercy seat,", "12": "And the pattern of all that he had by the spirit, of the courts of the house of the LORD, and of all the chambers round about, of the treasuries of the house of God, and of the treasuries of the dedicated things:", "13": "Also for the courses of the priests and the Levites, and for all the work of the service of the house of the LORD, and for all the vessels of service in the house of the LORD.", "14": "He gave of gold by weight for things of gold, for all instruments of all manner of service; silver also for all instruments of silver by weight, for all instruments of every kind of service:", "15": "Even the weight for the candlesticks of gold, and for their lamps of gold, by weight for every candlestick, and for the lamps thereof: and for the candlesticks of silver by weight, both for the candlestick, and also for the lamps thereof, according to the use of every candlestick.", "16": "And by weight he gave gold for the tables of shewbread, for every table; and likewise silver for the tables of silver:", "17": "Also pure gold for the fleshhooks, and the bowls, and the cups: and for the golden basons he gave gold by weight for every bason; and likewise silver by weight for every bason of silver:", "18": "And for the altar of incense refined gold by weight; and gold for the pattern of the chariot of the cherubims, that spread out their wings, and covered the ark of the covenant of the LORD.", "19": "All this, said David, the LORD made me understand in writing by his hand upon me, even all the works of this pattern.", "20": "And David said to Solomon his son, Be strong and of good courage, and do it: fear not, nor be dismayed: for the LORD God, even my God, will be with thee; he will not fail thee, nor forsake thee, until thou hast finished all the work for the service of the house of the LORD.", "21": "And, behold, the courses of the priests and the Levites, even they shall be with thee for all the service of the house of God: and there shall be with thee for all manner of workmanship every willing skilful man, for any manner of service: also the princes and all the people will be wholly at thy commandment."}}, "tsk": {"1": [{"kopje": "verzamelde", "refs": ["1 Kron 23:2", "Joz 23:2", "Joz 24:1"]}, {"kopje": "de leiders", "refs": ["1 Kron 27:16-22"]}, {"kopje": "de leiders van de afdelingen", "refs": ["1 Kron s er gevallen van al Zijn goede woorden, die Hij gesproken heeft door de dienst van Mozes, Zijn dienaar.", "Deut 8:1-6": "Alle geboden die ik u vandaag gebied, moet u nauwkeurig opvolgen, opdat u leeft en meer wordt, en het land binnengaat en erft, dat de HEERE aan uw vaderen gezworen heeft. En u zult denken aan heel de weg, die de HEERE, uw God, u deze veertig jaar in de woestijn geleid heeft; opdat Hij u verootmoedigt, om u te beproeven, om te weten wat in uw hart was, of u Zijn geboden zou houden, of niet. En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Joh 14:16": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid;", "Spr 24:22": "Want hun verderf zal snel ontstaan; en wie weet hun beider ondergang?", "Ex 13:12": "dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Ps 62:6-8": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "2 Kron 4:20-22": "En de kandelaars met hun lampen, van gesloten goud, om die naar de gewoonte aan te steken, vóór het binnenste heiligdom; En de bloemen, en de lampen, en de snuiters, van goud; het was het volmaaktste goud; Alsook de gaffels, en de sprenkelschalen, en de rookschalen, en de wierookvaten, van gesloten goud; aangaande de ingang van het huis, zijn binnenste deuren, van het heilige der heiligen, en de deuren van het huis van de tempel waren van goud.", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Neh 1:5": "En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Joh 2:16": "En Hij zei tegen hen die de duiven verkochten: Neem deze dingen hier weg; maak het huis van Mijn Vader niet tot een huis van koophandel.", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "2 Kron 1:12": "De wijsheid en de kennis is u gegeven; daartoe zal Ik u rijkdom, en goederen, en eer geven, zoals geen koningen die vóór u geweest zijn, gehad hebben, en na u zal niemand zoiets hebben.", "Ps 40:2-5": "Ik heb de HEERE lang verwacht; en Hij heeft Zich tot mij geneigd, en mijn geroep gehoord. En Hij heeft mij uit een ruisende kuil, uit modderig slijk opgehaald, en heeft mijn voeten op een rotssteen gesteld, Hij heeft mijn gangen vastgemaakt. En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.", "Ps 34:22": "Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Matt 7:7-12": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden. Of welk mens is er onder u die, als zijn zoon hem om brood zou vragen, hem een steen zal geven?", "Ps 48:9": "Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.", "Jer 33:25": "Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld;", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "Num 4:12": "Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.", "Rom 13:1": "Ieder mens moet onderworpen zijn aan de machten die over hem gesteld zijn; want er is geen macht dan van God, en de machten die er zijn, zijn door God aangesteld.", "Dan 2:22": "Hij openbaart diepe en verborgen dingen; Hij weet wat in het duister is, want het licht woont bij Hem.", "Jes 49:9-12": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn. Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden. En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Hos 2:18": "En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Ps 84:3": "Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God.", "1 Tess 5:24": "Hij, Die u roept, is getrouw, Die het ook doen zal.", "Joz 22:5": "Neem alleen nauwgezet in acht om te doen het gebod en de wet, die Mozes, de dienaar van de HEERE, u geboden heeft: dat u de HEERE, uw God, liefhebt, en dat u wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat u Hem dient met uw hele hart en met uw hele ziel.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Ps 18:2-4": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte! De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek. Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Luk 18:10-14": "Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar. Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Gen 26:5": "omdat Abraham Mijn stem gehoorzaam is geweest, en Mijn bevel heeft onderhouden, Mijn geboden, Mijn inzettingen en Mijn wetten.", "Luk 21:36": "Waak dan te allen tijde, en bid, dat u waardig geacht mag worden om al deze dingen die gebeuren zullen te ontvluchten, en te staan voor de Zoon des mensen.", "1 Kon 8:22": "En Salomo stond voor het altaar van de HEERE, tegenover de hele gemeente van Israël, en breidde zijn handen uit naar de hemel;", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "2 Kon 12:4-14": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE, Zullen de priesters tot zich nemen, ieder van zijn bekende; en zij zullen de breuken van het huis herstellen, naar alles wat er voor breuk gevonden zal worden. Maar het gebeurde in het drieëntwintigste jaar van koning Joas, dat de priesters de breuken van het huis niet hersteld hadden.", "Mark 4:5-17": "En het andere viel op de rotsachtige grond, waar het niet veel aarde had; en het kwam meteen op, omdat het geen diepte van aarde had. Maar toen de zon opgegaan was, verschroeide het, en omdat het geen wortel had, verdorde het. En het andere viel tussen de dorens, en de dorens groeiden op, en verstikten het, en het gaf geen vrucht.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "1 Tim 4:16": "Let op uzelf en op de leer; volhard daarin; want als u dat doet, zult u zowel uzelf behouden als hen die u horen.", "Matt 5:42": "Geef aan hem die iets van u vraagt, en keer u niet af van hem die van u wil lenen.", "Luk 21:1": "En toen Hij omhoogkeek, zag Hij de rijken hun gaven in de schatkist werpen.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "Gen 48:21": "Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.", "Spr 3:20": "Door Zijn kennis zijn de afgronden gekloofd, en de wolken druipen dauw.", "Matt 24:12": "En omdat de ongerechtigheid zal toenemen, zal de liefde van velen verkillen.", "Ef 3:15": "uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt,", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Klaagl 2:1": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.", "2 Kor 9:7": "Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief.", "Matt 6:9": "Bid daarom zo: Onze Vader, Die in de hemelen bent! Laat Uw Naam geheiligd worden.", "Ezech 18:26": "Als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, en daarin sterft, zal hij in zijn onrecht, dat hij gedaan heeft, sterven.", "Ps 89:11": "Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.", "Joz 23:2": "Zo riep Jozua heel Israël, hun oudsten, en hun hoofden, en hun rechters, en hun opzichters, en hij zei tegen hen: Ik ben oud geworden, en wel bedaagd;", "2 Kor 4:16-18": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.", "Ps 130:5": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "1 Kor 5:13": "Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "Ps 143:6": "Ik breid mijn handen uit tot U; mijn ziel is voor U als een dorstig land. Sela.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Matt 5:14-16": "U bent het licht der wereld; een stad die boven op een berg ligt, kan niet verborgen zijn. Ook steekt men geen kaars aan om die onder een korenmaat te zetten, maar op een kandelaar, en zij schijnt voor allen die in het huis zijn. Laat uw licht zo schijnen voor de mensen, dat zij uw goede werken mogen zien en uw Vader, Die in de hemelen is, verheerlijken.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Ps 56:12": "Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?", "Jes 63:18": "Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.", "Ps 7:12-14": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt. Als hij zich niet bekeert, zal Hij Zijn zwaard scherpen; Hij heeft Zijn boog gespannen, en hem gereedgemaakt. En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "2 Sam 22:27": "Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "2 Kron 6:30": "Hoor U dan uit de hemel, de vaste plaats van Uw woning, en vergeef, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van de kinderen der mensen;", "Ps 69:34": "Want de HEERE hoort de behoeftigen, en Hij veracht Zijn gevangenen niet.", "Deut 30:15-20": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade. Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven. Maar als uw hart zich zal afwenden, en u niet horen zult, en u gedreven wordt om u voor andere goden te buigen, en die te dienen;", "Ps 18:20": "En Hij voerde mij uit in de ruimte, Hij rukte mij eruit, want Hij had lust aan mij.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Deut 28:1-68": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "2 Kron 30:18": "Want een menigte van het volk, velen uit Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet zoals geschreven is. Doch Hizkia bad voor hen, en zei: De HEERE, die goed is, doe verzoening voor ieder,", "Neh 9:25": "En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van allerlei goed, uitgehouwen waterputten, wijngaarden, olijfgaarden en fruitbomen, in overvloed; en zij hebben gegeten, en zijn verzadigd en vet geworden, en hebben in weelde geleefd, door Uw grote goedheid.", "Hebr 6:8": "maar die doornen en distels draagt, is verwerpelijk, en dicht bij de vervloeking, waarvan het einde verbranding is.", "Job 12:13": "Bij Hem is wijsheid en macht; Hij heeft raad en verstand.", "1 Kron 14:4-7": "Dit nu zijn de namen van de kinderen die hij te Jeruzalem had: Sammua, en Sobab, Nathan en Salomo, En Jibchar, en Elisua, en Elpelet, En Nogah, en Nefeg, en Jafia,", "2 Kor 8:7-9": "Zo dan, zoals u in alles overvloedig bent, in geloof, en in woord, en in kennis, en in alle naarstigheid, en in uw liefde tot ons, zorg ervoor, dat u ook in deze gave overvloedig bent. Ik zeg dit niet als een gebod, maar om door de naarstigheid van anderen ook de oprechtheid van uw liefde te beproeven. Want u kent de genade van onze Heere Jezus Christus, dat Hij om uwentwil arm geworden is, terwijl Hij rijk was, opdat u door Zijn armoede rijk zou worden.", "Spr 31:20": "Caph. Zij breidt haar handpalm uit naar de ellendige; en zij steekt haar handen uit naar de arme.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "Hebr 6:13-19": "Want toen God aan Abraham de belofte deed, zwoer Hij bij Zichzelf, omdat Hij bij niemand groter kon zweren, en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken. En zo heeft hij, nadat hij geduldig volhard had, de belofte verkregen.", "2 Tess 2:11": "En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven;", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Rom 1:21": "Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden;", "Ef 6:6-8": "niet uit ogendienst, als mensenbehagers, maar als dienstknechten van Christus, terwijl u de wil van God doet van harte; terwijl u dient met goedwilligheid de Heere, en niet de mensen; wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Ef 2:18": "Want door Hem hebben wij beiden de toegang door één Geest tot de Vader.", "Spr 8:17": "Ik heb hen lief die Mij liefhebben; en die Mij vroeg zoeken, zullen Mij vinden.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "2 Kron 6:8": "Maar de HEERE zei tot mijn vader David: Omdat het in uw hart geweest is om voor Mijn Naam een huis te bouwen, hebt u er goed aan gedaan dat het in uw hart geweest is.", "Jes 61:9": "En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft.", "2 Petr 3:17": "U dan, geliefden, omdat u dit van tevoren weet, wees op uw hoede, dat u niet mede weggesleept wordt door de dwaling van de verdorven mensen, en afvalt van uw eigen standvastigheid;", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Joh 5:36": "Maar Ik heb een getuigenis, groter dan dat van Johannes; want de werken die de Vader Mij gegeven heeft om te volbrengen, deze werken die Ik doe, getuigen van Mij dat de Vader Mij gezonden heeft.", "Job 11:11": "Want Hij kent de ijdele mensen, en Hij ziet de ondeugd; zou Hij dan niet opmerken?", "Job 33:26-28": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven. Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat; Maar God heeft mijn ziel verlost, dat zij niet voert in het verderf, zodat mijn leven het licht aanziet.", "Ps 147:13": "Want Hij maakt de grendels van uw poorten sterk; Hij zegent uw kinderen binnen in u.", "Job 34:21": "Want Zijn ogen zijn op ieders wegen, en Hij ziet al zijn treden.", "2 Kron 25:5": "En Amazia verzamelde Juda, en stelde hen, naar de families van hun vaderen, aan tot leiders van duizenden en tot leiders van honderden, door heel Juda en Benjamin; en hij monsterde hen, van twintig jaar oud en daarboven, en vond hen driehonderdduizend uitgelezen mannen, die uit konden trekken ten strijde, en die speer en schild konden hanteren.", "Luk 11:13": "Als u dan, die slecht bent, weet uw kinderen goede gaven te geven, hoeveel te meer zal de hemelse Vader de Heilige Geest geven aan hen die Hem daarom bidden?", "1 Kron 22:16-19": "Van het goud, van het zilver, en van het koper, en van het ijzer is geen getal; maak u op, en doe het, en de HEERE zal met u zijn. Ook gebood David aan alle vorsten van Israël dat zij zijn zoon Salomo helpen zouden, en hij zei: Is de HEERE, uw God, niet met u, en heeft Hij u geen rust gegeven rondom? Want Hij heeft de inwoners van het land in mijn hand gegeven, en dit land is onderworpen geworden voor het aangezicht van de HEERE, en voor het aangezicht van Zijn volk.", "Ps 36:7": "Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Deut 17:20": "Zodat zijn hart zich niet verheft boven zijn broeders, en hij niet afwijkt van het gebod, naar rechts of naar links; opdat hij de dagen verlengt in zijn koninkrijk, hij en zijn zonen, te midden van Israël.", "Ezra 5:14": "Ja, de vaten van het huis van God, die van goud en zilver waren, die Nebukadnezar uit de tempel die te Jeruzalem was, had weggenomen en had gebracht in de tempel van Babel, die heeft de koning Kores gehaald uit de tempel van Babel, en ze zijn gegeven aan iemand wiens naam Sesbazar was, die hij tot landvoogd had gesteld.", "Matt 3:10": "En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Ezra 1:2-4": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij opgedragen Hem een huis te bouwen te Jeruzalem, dat in Juda is. Wie is er onder u van al Zijn volk? Zijn God zij met hem, en hij trekt op naar Jeruzalem, dat in Juda is, en hij bouwt het huis van de HEERE, de God van Israël; Hij is de God, Die te Jeruzalem woont. En ieder die achterblijft in een van de plaatsen waar hij als vreemdeling verblijft, die zullen de mensen van zijn plaats bijstaan met zilver, en met goud, en met bezit, en met vee; benevens een vrijwillige gave, voor het huis van God, Die te Jeruzalem woont.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Hebr 6:11": "Maar wij verlangen ernaar dat ieder van u dezelfde ijver bewijst, tot de volle zekerheid van de hoop, tot het einde toe;", "Joh 17:1": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt.", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Openb 21:7": "Wie overwint, zal alles beërven; en Ik zal hem een God zijn, en hij zal Mij een zoon zijn.", "Jer 17:10": "Ik, de HEERE, doorgrond het hart, en proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "1 Kron 22:14": "Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe.", "Gen 3:3": "Maar van de vrucht van de boom die in het midden van de hof staat, heeft God gezegd: U zult daarvan niet eten, en u zult die ook niet aanraken, anders sterft u.", "Luk 6:37": "En oordeel niet, en u zult niet geoordeeld worden; veroordeel niet, en u zult niet veroordeeld worden; laat los, en u zult losgelaten worden.", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Hab 3:17-19": "Alhoewel de vijgenboom niet bloeien zal, en er geen vrucht aan de wijnstok zal zijn, dat het werk van de olijfboom liegen zal, en de velden geen voedsel voortbrengen; dat men de kudde uit de kooi zal wegscheuren, en dat er geen rund in de stallen zal zijn; Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil. De HEERE Heere is mijn Sterkte; en Hij zal mijn voeten maken als die van de hinden, en Hij zal mij doen treden op mijn hoogten. Voor de koorleider, op mijn Neginoth.", "Deut 7:8": "Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Jer 12:3": "Maar U, HEERE, kent mij, U ziet mij, en proeft mijn hart, dat het met U is. Ruk hen uit als schapen ter slachting, en heilig hen tot de dag van de doding.", "Spr 13:2": "Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Ezech 40:8": "Ook mat hij het voorhuis van de poort aan de binnenkant: één riet.", "Ex 25:40": "Zie er dan op toe dat u het maakt naar hun voorbeeld, dat u op de berg getoond is.", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Deut 18:1-8": "De Levitische priesters, de hele stam van Levi, zullen geen deel of erfdeel hebben met Israël; de vuuroffers van de HEERE en Zijn erfdeel zullen zij eten. Daarom zal hij geen erfdeel hebben tussen zijn broeders; de HEERE is zijn Erfdeel, zoals Hij tot hem gesproken heeft. Dit nu zal het recht van de priesters zijn van het volk, van hen die een offerande offeren, hetzij een os of klein vee: dat hij de priester de schouder zal geven, en beide kaken, en de pens.", "Job 23:10": "Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.", "Ps 141:8": "Doch op U zijn mijn ogen, HEERE, Heere; op U vertrouw ik, ontbloot mijn ziel niet.", "Kol 1:28": "Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;", "Lev 26:3-28": "Als u in Mijn inzettingen wandelt, en Mijn geboden houdt, en die doet; Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen.", "2 Sam 7:5-13": "Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen? Want Ik heb in geen huis gewoond, vanaf de dag dat Ik de kinderen van Israël uit Egypte opvoerde, tot op deze dag; maar Ik heb rondgetrokken in een tent en in een tabernakel. Overal waar Ik met al de kinderen van Israël heb rondgetrokken, heb Ik ooit een woord gesproken met een van de stammen van Israël, aan wie Ik geboden heb Mijn volk Israël te weiden, en gezegd: Waarom bouwt u Mij geen huis van cederhout?", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "1 Kon 8:20": "Zo heeft de HEERE Zijn woord bevestigd, dat Hij gesproken had; want ik ben opgestaan in de plaats van mijn vader David, en ik zit op de troon van Israël, zoals de HEERE gesproken heeft; en ik heb een huis gebouwd voor de Naam van de HEERE, de God van Israël.", "Ezech 11:19-21": "En Ik zal hun één hart geven, en Ik zal een nieuwe geest in uw binnenste geven; en Ik zal het stenen hart uit hun vlees wegnemen, en zal hun een hart van vlees geven; Opdat zij wandelen in Mijn inzettingen, en Mijn rechten bewaren en die doen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn. Maar van hen wier hart het hart van hun verfoeiselen en hun gruwelen navolgt, zal Ik de weg daarvan op hun hoofd geven, spreekt de Heere HEERE.", "Ezech 36:9-11": "Want ziet, Ik ben bij u, en Ik zal u aanzien, en u zult gebouwd en bezaaid worden. En Ik zal mensen op u vermenigvuldigen, het hele huis van Israël, ja, dat geheel; en de steden zullen bewoond, en de eenzame plaatsen bebouwd worden. Ja, Ik zal mensen en beesten op u vermenigvuldigen, en zij zullen vermenigvuldigd worden en vruchtbaar zijn; en Ik zal u doen bewonen, als in uw vorige tijden, ja, Ik zal het beter maken dan in uw beginselen; en u zult weten dat Ik de HEERE ben.", "Spr 11:11": "Door de zegen van de oprechten wordt een stad verheven; maar door de mond van de goddelozen wordt zij verbroken.", "Luk 8:3": "en Johanna, de vrouw van Chusas, de rentmeester van Herodes, en Susanna, en vele anderen, die Hem dienden met hun bezittingen.", "Matt 20:23": "En Hij zei tegen hen: Mijn drinkbeker zult u wel drinken, en met de doop waarmee Ik gedoopt word, zult u gedoopt worden; maar het zitten aan Mijn rechterhand en aan Mijn linkerhand, staat niet aan Mij te geven, maar het zal gegeven worden aan hen voor wie het bereid is door Mijn Vader.", "Deut 32:11-14": "Zoals een arend zijn nest opwekt, over zijn jongen zweeft, zijn vleugels uitbreidt, ze neemt en ze draagt op zijn vleugels; Zo leidde de HEERE hem alleen, en er was geen vreemde god met hem. Hij deed hem rijden op de hoogten van de aarde, zodat hij at van de opbrengsten van het veld; en Hij deed hem honing zuigen uit de steenrots, en olie uit de harde rots;", "Matt 21:41": "Zij zeiden tegen hem: Hij zal die kwaden een kwade dood laten sterven, en de wijngaard verhuren aan andere landbouwers, die hem de vruchten op de juiste tijd zullen geven.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Jak 1:14": "Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "2 Kon 17:38": "En het verbond dat Ik met u gemaakt heb, zult u niet vergeten; en u zult geen andere goden vrezen.", "Num 18:1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "Ps 89:17-28": "Zij zullen zich de hele dag verheugen in Uw Naam, en door Uw gerechtigheid verhoogd worden. Want Gij zijt de heerlijkheid van hun sterkte; en door Uw welbehagen zal onze hoorn verhoogd worden. Want ons schild is van de HEERE, en onze koning is van de Heilige van Israël.", "1 Sam 16:1": "Toen zei de HEERE tegen Samuël: Hoe lang draagt u leed om Saul, die Ik toch verworpen heb, dat hij geen koning meer zal zijn over Israël? Vul uw hoorn met olie, en ga op weg; Ik zal u zenden naar Isaï, de Bethlehemiet; want Ik heb Mij een koning uitgekozen onder zijn zonen.", "Lev 19:36": "U zult een eerlijke weegschaal hebben, eerlijke gewichten, een eerlijke efa, en een eerlijke hin; Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb!", "Deut 9:5": "Niet om uw gerechtigheid, noch om de oprechtheid van uw hart, komt u daar binnen om hun land te erven; maar om de goddeloosheid van deze volken verdrijft de HEERE, uw God, hen voor uw aangezicht uit de bezitting: en om het woord te bevestigen dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Num 8:19": "En Ik heb de Levieten aan Aäron en aan zijn zonen als gift gegeven, uit het midden van de kinderen van Israël, om de dienst van de kinderen van Israël in de tent van de samenkomst te verrichten, en om voor de kinderen van Israël verzoening te doen, zodat er geen plaag onder de kinderen van Israël komt, als de kinderen van Israël tot het heiligdom zouden naderen.", "1 Joh 1:2": "(Want het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.)", "Ps 119:114": "U bent mijn Schuilplaats en mijn Schild; op Uw Woord heb ik gehoopt.", "Job 22:18": "Hij had immers hun huizen met goed gevuld; daarom is de raad van de goddelozen ver van mij.", "Ex 3:19": "Toch weet Ik dat de koning van Egypte u niet zal laten gaan, ook niet door een sterke hand.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "2 Sam 7:9": "En Ik ben met u geweest, overal waar u gegaan bent, en heb al uw vijanden voor uw aangezicht uitgeroeid; en Ik heb u een grote naam gemaakt, als de naam van de groten die op de aarde zijn.", "Ps 18:19": "Zij hadden mij bejegend ten dage van mijn ongeval; maar de HEERE was mij tot een Steunsel.", "1 Kron 5:2": "want Juda werd machtig onder zijn broeders, en hij die tot een voorganger was, kwam uit hem; maar het eerstgeboorterecht was van Jozef.)", "Ex 4:23": "En Ik heb tegen u gezegd: Laat Mijn zoon gaan, opdat hij Mij dient! maar u hebt geweigerd hem te laten gaan; zie, Ik zal uw zoon, uw eerstgeborene, doden!", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Ps 33:13-15": "De HEERE kijkt uit de hemel, en ziet alle mensenkinderen. Hij ziet uit vanaf Zijn vaste woonplaats op alle inwoners van de aarde. Hij vormt hun aller hart; Hij let op al hun werken.", "Deut 4:40": "En u zult Zijn inzettingen en Zijn geboden houden, die ik u vandaag gebied, opdat het u en uw kinderen na u goed gaat, en opdat u de dagen verlengt in het land dat de HEERE, uw God, u geeft, voor altijd.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Lev 26:40-42": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Matt 19:21": "Jezus zei tegen hem: Als u volmaakt wilt zijn, ga heen, verkoop wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom hier, volg Mij.", "1 Sam 2:13": "Want de gewoonte van deze priesters met het volk was, dat wanneer iemand een offer offerde, de jongen van de priester kwam, terwijl het vlees kookte, met een drietandige vork in zijn hand;", "1 Kron 29:19": "En geef mijn zoon Salomo een volkomen hart, om Uw geboden, Uw getuigenissen en Uw inzettingen te houden; en om alles te doen, en om dit paleis te bouwen, dat ik klaargemaakt heb.", "Zach 8:12": "Want het zaad zal voorspoedig zijn, de wijnstok zal zijn vrucht geven, en de aarde zal haar opbrengst geven, en de hemel zal zijn dauw geven; en Ik zal het overblijfsel van dit volk dit alles doen erven.", "Jes 1:28": "Maar er zal verbreking zijn van de overtreders, en van de zondaars samen; en zij die de HEERE verlaten, zullen omkomen.", "Ex 23:25": "En u zult de HEERE uw God dienen, dan zal Hij uw brood en uw water zegenen; en Ik zal de ziekten uit uw midden weren.", "Jes 5:11-14": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft! En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Ps 73:28": "Maar wat mij aangaat, het is mij goed om dicht bij God te zijn; ik stel mijn vertrouwen op de Heere HEERE, om al Uw werken te vertellen.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Matt 10:30": "En ook uw haren van het hoofd zijn alle geteld.", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "1 Kon 6:16-20": "Daartoe bouwde hij twintig ellen met cederen planken aan de zijden van het huis, van de vloer af tot de wanden; dit bouwde hij Hem van binnen tot een binnenste heiligdom¹, tot het heilige der heiligen. Dat huis nu was veertig ellen, namelijk de tempel, die vooraan was. En het ceder aan het huis, van binnen, was gesneden met knoppen en open bloemen; het was allemaal ceder, geen steen werd gezien.", "Jes 60:17": "Voor koper zal Ik goud brengen, en voor ijzer zal Ik zilver brengen, en voor hout koper, en voor stenen ijzer; en Ik zal uw opzieners vreedzaam maken, en uw drijvers rechtvaardig.", "Mark 12:43": "En Jezus riep Zijn discipelen tot Zich, en zei tegen hen: Voorwaar, Ik zeg u, dat deze arme weduwe meer heeft ingeworpen dan allen die iets in de schatkist geworpen hebben.", "Ex 25:17-22": "U zult ook een verzoendeksel maken van zuiver goud; twee el en een halve zal de lengte daarvan zijn, en anderhalve el de breedte daarvan. U zult ook twee cherubs van goud maken; van gedreven goud zult u ze maken, uit de beide einden van het verzoendeksel. En maak u een cherub uit het ene einde aan deze zijde, en de andere cherub uit het andere einde aan die zijde; uit het verzoendeksel zult u de cherubs maken, uit de beide einden ervan.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Num 14:9": "Wees alleen niet opstandig tegen de HEERE! En vrees het volk van dit land niet; want zij zijn ons brood! Hun bescherming is van hen geweken, en de HEERE is met ons; vrees hen niet!", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "Jer 12:17": "Maar als zij niet zullen horen, dan zal Ik dat volk geheel en al uitrukken en verdelgen, spreekt de HEERE.", "Hand 13:32": "En wij verkondigen u de belofte, die aan de vaderen gedaan is,", "Gen 6:12": "Toen zag God de aarde, en zie, zij was verdorven; want alle vlees had zijn weg verdorven op de aarde.", "Hebr 11:16-39": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt. Door het geloof heeft Abraham, toen hij beproefd werd, Izak geofferd, en hij die de beloften ontvangen had, heeft zijn enige zoon geofferd, (tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Hebr 12:1": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is;", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "Deut 15:7-18": "Wanneer er onder u een arme zal zijn, iemand van uw broeders, in een van uw poorten, in uw land dat de HEERE, uw God, u geven zal, dan zult u uw hart niet verharden, en uw hand niet toesluiten voor uw broeder die arm is; Maar u zult uw hand mild voor hem opendoen, en u zult hem rijkelijk lenen, genoeg voor zijn gebrek, wat hem ontbreekt. Wacht ervoor dat er in uw hart geen verdorven gedachte is, om te zeggen: Het zevende jaar, het jaar van de vrijlating, komt dichtbij; zodat uw oog kwaadaardig is tegen uw broeder die arm is, en dat u hem niets geeft; en hij over u roept tot de HEERE, en er zonde in u is.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Ps 90:1": "Een gebed van Mozes, de man van God. Heere! U bent ons geweest een Toevlucht van geslacht tot geslacht.", "Ps 92:3": "Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten;", "Jes 62:9": "Maar wie het inzamelen, zullen het eten, en zij zullen de HEERE prijzen; en wie het bijeenbrengen, zullen het drinken in de voorhoven van Mijn heiligdom.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "1 Tim 1:17": "De Koning nu der eeuwen, de onverderfelijke, de onzichtbare, de alleen wijze God, zij eer en heerlijkheid in alle eeuwigheid. Amen.", "1 Kron 29:2": "Ik heb nu uit al mijn kracht klaargemaakt voor het huis van mijn God: goud voor de gouden dingen, en zilver voor de zilveren, en koper voor de koperen, ijzer voor de ijzeren, en hout voor de houten werken; sardonyxstenen en stenen om in te zetten, glanzende stenen en stenen van verschillende kleuren, en allerlei kostbare stenen, en marmerstenen in overvloed.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "1 Sam 3:11-14": "En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.", "Kol 2:9-11": "Want in Hem woont heel de volheid van de Godheid lichamelijk; En u bent in Hem volmaakt, Die het Hoofd is van alle overheid en macht; In Wie u ook besneden bent met een besnijdenis die niet met handen gedaan wordt, in het uittrekken van het lichaam van de zonden van het vlees, door de besnijdenis van Christus;", "Ps 34:16": "Ain. De ogen van de HEERE zijn op de rechtvaardigen, en Zijn oren gericht op hun geroep.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Ps 89:35": "Ik zal Mijn verbond niet ontheiligen, en wat uit Mijn lippen gegaan is, zal Ik niet veranderen.", "Joh 6:32": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: Mozes heeft u niet het brood uit de hemel gegeven; maar Mijn Vader geeft u dat ware Brood uit de hemel.", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "Hebr 3:14": "Want wij zijn deelgenoten van Christus geworden, als wij tenminste het begin van dit vaste vertrouwen tot het einde toe onwrikbaar vasthouden;", "1 Petr 4:18": "En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Ezech 36:28-38": "En u zult wonen in het land dat Ik uw vaderen gegeven heb, en u zult Mij tot een volk zijn, en Ik zal u tot een God zijn. En Ik zal u verlossen van al uw onreinheden; en Ik zal roepen tot het koren, en zal dat vermenigvuldigen, en Ik zal geen honger op u leggen. En Ik zal de vrucht van het geboomte en de opbrengst van het veld vermenigvuldigen, opdat u de smaad van het honger niet meer ontvangt onder de heidenen.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Ps 147:11": "De HEERE schept vreugde in hen die Hem vrezen, die op Zijn goedertierenheid hopen.", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Deut 31:17": "Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is?", "Spr 28:27": "Wie de arme geeft, zal geen gebrek hebben; maar wie zijn ogen verbergt, zal veel vervloekt worden.", "Ps 92:2": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste!", "Ps 119:89": "Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen.", "1 Joh 5:18": "Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.", "Gen 15:2": "Toen zei Abram: Heere HEERE, wat zult U mij geven, terwijl ik zonder kinderen heenga en de bezorger van mijn huis deze Damascener Eliëzer is?", "Ezech 10:2-22": "En Hij sprak tot de man, gekleed in linnen, en zei: Ga naar binnen, tussen de wielen, tot onder de cherub, en vul uw vuisten met vurige kolen van tussen de cherubs, en strooi ze over de stad; en hij ging voor mijn ogen naar binnen. De cherubs nu stonden aan de rechterzijde van het huis, toen die man naar binnen ging; en een wolk vervulde de binnenste voorhof. Toen hief de heerlijkheid van de HEERE zich omhoog van boven de cherub, naar de drempel van het huis; en het huis werd vervuld met een wolk, en het voorhof was vol van de glans van de heerlijkheid van de HEERE.", "Job 11:17-19": "Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn. En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen; En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "Joh 5:17-23": "En Jezus antwoordde hun: Mijn Vader werkt tot nu toe, en Ik werk ook. Daarom zochten de Joden des te meer Hem te doden, omdat Hij niet alleen de sabbat brak, maar ook zei dat God Zijn eigen Vader was, en Zichzelf aan God gelijk maakte. Jezus dan antwoordde en zei tegen hen: Voorwaar, voorwaar, Ik zeg u: De Zoon kan niets van Zichzelf doen, als Hij de Vader dat niet ziet doen; want al wat Die doet, dat doet ook de Zoon evenzo.", "Luk 1:38": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "Joh 10:36-38": "zegt u dan tegen Mij, Die de Vader geheiligd en in de wereld gezonden heeft: U lastert God; omdat Ik gezegd heb: Ik ben Gods Zoon? Als Ik de werken van Mijn Vader niet doe, geloof Mij dan niet; maar als Ik ze doe, en u Mij niet gelooft, geloof dan de werken; opdat u mag weten en geloven dat de Vader in Mij is, en Ik in Hem.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Deut 16:17": "Ieder naar de gave van zijn hand, naar de zegen van de HEERE, uw God, die Hij u gegeven heeft.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Jak 3:2": "Want wij struikelen allen in veel dingen. Als iemand in woorden niet struikelt, die is een volmaakt man, in staat om ook het hele lichaam in toom te houden.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Kol 1:2": "Aan de heilige en gelovige broeders in Christus die in Kolosse zijn: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Neh 13:5": "En hij had hem een grote kamer gemaakt, waar zij tevoren het spijsoffer, de wierook en de vaten heenleidden, en de tienden van koren, van most en van olie, die bevolen waren voor de Levieten, en de zangers, en de poortwachters, alsook het hefoffer van de priesters.", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "Amos 9:13": "Zie, de dagen komen, spreekt de HEERE, dat de ploeger de maaier zal bereiken, en de druiventreder de zaadzaaier; en de bergen zullen van zoete wijn druipen, en alle heuvels zullen smelten.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "1 Kon 2:4": "opdat de HEERE Zijn woord bevestigt, dat Hij over mij gesproken heeft, toen Hij zei: Als uw zonen hun weg bewaren, om voor Mijn aangezicht trouw, met hun hele hart en met hun hele ziel te wandelen, dan zal het u nooit ontbreken, zei Hij, aan een man op de troon van Israël.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Matt 19:17": "En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden.", "Matt 13:20": "Maar die op steenachtige plaatsen bezaaid is, dit is degene die het woord hoort en dat meteen met vreugde ontvangt;", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "1 Kron 9:26-29": "Want in dat ambt waren vier leidende poortwachters, die Levieten waren; en zij waren over de kamers en over de schatten van het huis van God. En zij bleven overnachten rondom het huis van God; want op hen was de wacht, en zij waren over de opening, en dat elke morgen. En enigen van hen waren over de voorwerpen van de dienst; want zij droegen ze in op basis van getal, en op basis van getal droegen zij ze uit.", "1 Kon 3:14": "En als u in Mijn wegen wandelt en Mijn inzettingen en Mijn geboden onderhoudt, zoals uw vader David gewandeld heeft, dan zal Ik ook uw dagen verlengen.", "Ef 2:19": "Zo bent u dan niet meer vreemdelingen en bijwoners, maar medeburgers van de heiligen, en huisgenoten van God;", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Deut 28:1-14": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.", "Deut 12:28": "Neem het waar, en hoor al deze woorden die ik u gebied, opdat het u, en uw kinderen na u, goed gaat tot in eeuwigheid, als u zult gedaan hebben wat goed en recht is in de ogen van de HEERE, uw God.", "Job 5:24-26": "En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen. Ook zult u bevinden dat uw nageslacht talrijk zal zijn, en uw spruiten als het kruid van de aarde. U zult in ouderdom naar het graf gaan, zoals de korenhoop op zijn tijd wordt opgevoerd.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Ex 6:3": "En ook heb Ik Mijn verbond met hen opgericht, dat Ik hun het land Kanaän geven zou, het land van hun vreemdelingschap, waarin zij vreemdelingen zijn geweest.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "Deut 11:1-3": "Daarom zult u de HEERE, uw God, liefhebben, en u zult altijd onderhouden Zijn bevel, en Zijn inzettingen, en Zijn rechten, en Zijn geboden. En u zult heden weten, dat ik niet spreek met uw kinderen, die het niet weten, en de vermaning van de HEERE, uw God, niet gezien hebben. Zijn grootheid, Zijn sterke hand en Zijn uitgestrekte arm; Daartoe Zijn tekenen en Zijn daden, die Hij in het midden van Egypte gedaan heeft, aan farao, de koning van Egypte, en aan zijn hele land;", "Matt 6:32": "Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt.", "Ef 4:1": "Ik bid u dan, ik, de gevangene in de Heere, dat u wandelt op een manier die de roeping waard is waarmee u geroepen bent;", "Joël 2:18-26": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen. En de HEERE zal antwoorden en tegen Zijn volk zeggen: Ziet, Ik zend u het koren, en de most, en de olie, zodat u daarvan verzadigd zult worden; en Ik zal u niet meer overgeven tot een smaad onder de heidenen. En Ik zal hem die uit het noorden komt ver van u doen vertrekken, en hem wegdrijven in een dor en woest land, zijn voorkant naar de Oostzee, en zijn achterkant naar de verste zee; en zijn stank zal opgaan, en zijn vuiligheid zal opgaan; want hij heeft grote dingen gedaan.", "Joh 16:15": "Alles wat de Vader heeft, is van Mij; daarom heb Ik gezegd dat Hij het uit het Mijne zal nemen, en het u zal verkondigen.", "Ps 112:7": "Mem. Hij zal voor geen kwaad gerucht bang zijn; Nun. zijn hart is vast, vertrouwend op de HEERE.", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ps 33:20": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Hand 2:25-
