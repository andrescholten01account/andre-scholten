ekozen heb om Mijn Naam daar te doen wonen. Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Kol 2:2": "Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus;", "Rom 10:12": "Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen.", "1 Sam 3:1": "En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.", "1 Kron 29:10": "Daarom loofde David de HEERE voor de ogen van de hele gemeente; en David zei: Geloofd bent U, HEERE, God van onze vader Israël, van eeuwigheid tot in eeuwigheid!", "Job 23:6": "Zou Hij naar de grootheid van Zijn macht met mij twisten? Nee; maar Hij zou acht op mij slaan.", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "Deut 1:5": "Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "Matt 6:6": "Maar u, wanneer u bidt, ga in uw binnenkamer, en sluit uw deur, en bid tot uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.", "Spr 21:12": "De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.", "Job 8:6": "als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "Joz 1:7": "Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Deut 5:29": "Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!", "Ex 34:20": "Doch de ezel, die de baarmoeder opent, zult u met een stuk klein vee lossen; maar als u hem niet zult lossen, zo zult u hem de nek breken. Al de eerstgeborenen van uw zonen zult u lossen, en men zal voor Mijn aangezicht niet met lege handen verschijnen.", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "Rom 8:38": "Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal,", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "1 Kron 27:25-31": "En over de schatten van de koning was Azmaveth, de zoon van Adiël; en over de schatten op het land, in de steden, en in de dorpen, en in de torens, was Jonathan, de zoon van Uzzia. En over hen die het akkerwerk deden, in de landbouw, was Ezri, de zoon van Chelub. En over de wijngaarden was Simeï, de Ramathiet; maar over wat van de wijnstokken kwam, tot de voorraden wijn, was Zabdi, de Sifmiet.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "Matt 10:22": "En u zult door allen gehaat worden om Mijn Naam; maar wie volhardt tot het einde, die zal behouden worden.", "Dan 6:17": "Toen beval de koning, en zij brachten Daniël naar voren, en wierpen hem in de kuil van de leeuwen; en de koning antwoordde en zei tegen Daniël: Uw God, Die u voortdurend eert, Die verlost u!", "Ps 11:1": "Een psalm van David, voor de koorleider. Ik vertrouw op de HEERE; hoe zegt u tegen mijn ziel: Vlucht naar uw gebergte, als een vogel?", "Ps 55:20": "God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Jak 1:5-7": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden. Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt. Want laat die mens niet menen dat hij iets ontvangen zal van de Heere.", "Zach 4:2": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie, en zie, een geheel gouden kandelaar, en een oliekruikje boven op zijn hoofd, en zijn zeven lampen daarop; die lampen hadden zeven en zeven pijpen, die boven op zijn hoofd waren;", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "Jer 33:21": "Dan zou ook Mijn verbond met Mijn knecht David verbroken kunnen worden, zodat hij geen zoon heeft die op zijn troon regeert, en met de Levieten, de priesters, Mijn dienaren.", "1 Kron 29:12": "En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.", "2 Kor 13:11": "Verder, broeders, wees blij, wordt volmaakt, wees getroost, wees eensgezind, leef in vrede; en de God van de liefde en van de vrede zal met u zijn.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Hand 10:33": "Zo heb ik dan meteen naar u gezonden, en u hebt er goed aan gedaan hier te komen. Wij zijn dan nu allen hier aanwezig voor God, om te horen alles wat u door God bevolen is.", "Deut 29:15": "Maar met hem die heden hier bij ons voor het aangezicht van de HEERE, onze God, staat; en met hem die hier heden bij ons niet is.", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Ps 144:10": "U, Die de koningen overwinning geeft, Die Zijn dienaar David bevrijdt van het boze zwaard;", "Job 12:22": "Hij openbaart de diepten uit de duisternis, en de schaduw van de dood brengt Hij voort in het licht.", "Ps 132:7": "Wij zullen in Zijn woningen ingaan, wij zullen ons neerbuigen voor de voetbank van Zijn voeten.", "Hos 9:15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "Joh 1:13": "Die niet uit bloed, niet uit de wil van het vlees, en niet uit de wil van een man, maar uit God geboren zijn.", "Jes 10:3": "Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Hand 2:33": "Hij dan, door de rechterhand van God verhoogd, en de belofte van de Heilige Geest ontvangen hebbend van de Vader, heeft dit uitgestort, wat u nu ziet en hoort.", "Jer 42:4": "En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.", "Mal 3:10-12": "Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn. En Ik zal om uwentwil de opeter bestraffen, zodat hij u de vrucht van het land niet verderft; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE van de heerscharen. En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "Ps 102:14": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.", "Deut 11:7": "Want het zijn uw ogen, die al dit grote werk van de HEERE gezien hebben, dat Hij gedaan heeft.", "Openb 3:20": "Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.", "Ps 94:7": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Joh 15:7": "Als u in Mij blijft, en Mijn woorden in u blijven, dan zult u vragen wat u wilt, en het zal u gebeuren.", "Jer 17:5": "Zo zegt de HEERE: Vervloekt is de man die op een mens vertrouwt, en vlees tot zijn arm stelt, en wiens hart van de HEERE afwijkt!", "Ps 104:24-30": "Hoe groot zijn Uw werken, o HEERE! U hebt ze allemaal met wijsheid gemaakt; het aardrijk is vol van Uw rijkdom. Deze zee, die groot en wijd van omvang is, daarin is het wemelende gedierte, ontelbaar, kleine dieren met grote. Daar varen de schepen, en de Leviathan, die U gevormd hebt om daarin te spelen.", "Deut 14:27-29": "Maar de Leviet die in uw poorten is, zult u niet verlaten; want hij heeft geen deel noch erfdeel met u. Aan het einde van drie jaren zult u alle tienden van uw opbrengst voortbrengen, in datzelfde jaar, en u zult ze wegleggen in uw poorten; Zo zal de Leviet komen – omdat hij geen deel noch erfdeel met u heeft – en de vreemdeling, en de wees en de weduwe die in uw poorten zijn, en zij zullen eten en verzadigd worden; opdat de HEERE, uw God, u zegent in al het werk van uw hand, dat u doen zult.", "Ps 75:9": "Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.", "Ps 40:11": "Uw gerechtigheid bedek ik niet in het midden van mijn hart; Uw waarheid en Uw heil spreek ik uit; Uw weldadigheid en Uw trouw verheel ik niet in de grote gemeente.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "2 Kron 15:12": "En zij sloten een verbond, dat zij de HEERE, de God van hun vaderen, zouden zoeken met hun hele hart en met hun hele ziel.", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "Jer 32:40": "En Ik zal een eeuwig verbond met hen sluiten, dat Ik Mij van achter hen niet zal afkeren, opdat Ik hun goeddoe; en Ik zal Mijn vrees in hun hart geven, zodat zij niet van Mij afwijken.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "Jer 13:1-3": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "Ps 147:14": "Die uw grondgebied in vrede stelt; Hij verzadigt u met het beste van de tarwe.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Ps 119:74": "Die U vrezen, zullen mij aanzien, en zich verblijden, omdat ik op Uw woord gehoopt heb.", "Rom 8:14-19": "Want zovelen als er door de Geest van God geleid worden, die zijn kinderen van God. Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader! Diezelfde Geest getuigt met onze geest, dat wij kinderen van God zijn.", "Deut 4:1": "Israël! hoor naar de inzettingen en de rechten die ik u leer te doen, opdat u leeft, en het land binnentrekt en in bezit neemt dat de HEERE, de God van uw vaderen, u geeft.", "Job 37:6-24": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui. Dan zegelt Hij de hand van ieder mens toe, opdat elk mens het werk van Hem kent. En het gedierte gaat in de holen, en blijft in zijn schuilplaatsen.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Spr 15:29": "De HEERE is ver van de goddelozen; maar het gebed van de rechtvaardigen zal Hij verhoren.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Luk 19:10": "Want de Zoon des mensen is gekomen om te zoeken en zalig te maken wat verloren was.", "Ps 100:3": "Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Hand 20:35": "Ik heb u in alles getoond, dat men, zo arbeidend, de zwakken moet opnemen, en zich de woorden van de Heere Jezus herinneren, dat Hij gezegd heeft: Het is zaliger te geven dan te ontvangen.", "Joh 14:6-13": "Jezus zei tegen hem: Ik ben de Weg, en de Waarheid, en het Leven. Niemand komt tot de Vader dan door Mij. Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien. Filippus zei tegen Hem: Heere, toon ons de Vader, en het is ons genoeg.", "Ps 28:5": "Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.", "Ps 118:5": "Uit de benauwdheid heb ik de HEERE aangeroepen; de HEERE heeft mij verhoord en mij in de ruimte gezet.", "1 Kor 16:13": "Waakt, staat vast in het geloof, houdt u mannelijk, weest sterk.", "2 Kor 4:13": "Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Deut 11:26": "Zie, ik stel u heden voor: zegen en vloek:", "Hebr 4:13": "En er is geen schepsel onzichtbaar voor Hem; maar alle dingen zijn naakt en geopend voor de ogen van Hem, met Wie wij te maken hebben.", "1 Kon 14:26": "En hij nam de schatten van het huis van de HEERE, en de schatten van het huis van de koning weg, ja, hij nam alles weg; hij nam ook al de gouden schilden weg die Salomo gemaakt had.", "Jer 50:4": "In die dagen en op die tijd, spreekt de HEERE, zullen de kinderen van Israël komen, zij en de kinderen van Juda samen; wandelend en wenend zullen zij heengaan, en de HEERE, hun God, zoeken.", "2 Kron 7:18": "Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst.", "Joh 5:43": "Ik ben gekomen in de Naam van Mijn Vader, en u neemt Mij niet aan; als een ander komt in zijn eigen naam, die zult u aannemen.", "Ezech 18:24": "Maar als de rechtvaardige zich afkeert van zijn gerechtigheid, en onrecht doet, en handelt naar al de gruwelen die de goddeloze doet, zou die leven? Al zijn gerechtigheden, die hij gedaan heeft, zullen niet aangerekend worden; door zijn overtreding, waardoor hij overtreden heeft, en door zijn zonde, die hij gezondigd heeft, daardoor zal hij sterven.", "Ezech 40:9": "Toen mat hij het andere voorhuis van de poort: acht ellen, en de posten ervan: twee ellen; en het voorhuis van de poort was aan de binnenkant.", "1 Kor 9:26": "Ik loop dan zo, niet als op het onzekere; ik strijd zo, niet als iemand die de lucht slaat;", "Micha 7:20": "U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt.", "1 Kron 27:16-22": "En over de stammen van Israël waren dezen: over de Rubenieten was Eliëzer, de zoon van Zichri, voorganger; over de Simeonieten was Sefatja, de zoon van Maächa; Over de Levieten was Hasabja, de zoon van Kemuël; over de Aäronieten was Zadok; Over Juda was Elihu, uit de broers van David; over Issaschar was Omri, de zoon van Michaël;", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "Ps 89:25": "En Mijn getrouwheid en Mijn goedertierenheid zullen met hem zijn; en zijn hoorn zal in Mijn Naam verhoogd worden.", "Joh 1:14": "En het Woord is vlees geworden, en heeft onder ons gewoond (en wij hebben Zijn heerlijkheid aanschouwd, een heerlijkheid als van de Eniggeborene van de Vader), vol van genade en waarheid.", "Ps 118:13": "U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Ps 119:151": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid.", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Jer 44:23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "Ps 11:4": "De HEERE is in het paleis van Zijn heiligheid, de troon van de HEERE is in de hemel; Zijn ogen aanschouwen, Zijn oogleden beproeven de mensenkinderen.", "1 Kron 29:1": "Verder zei koning David tegen de hele gemeente: God heeft mijn zoon Salomo alleen uitgekozen, een jongeman en teder; dit werk daarentegen is groot, want het is geen paleis voor een mens, maar voor God, de HEERE.", "Job 34:25": "Daarom dat Hij hun werken kent, zo keert Hij hen 's nachts om, en zij worden verbrijzeld.", "2 Petr 2:15": "zij hebben de rechte weg verlaten en zijn verdwaald, en volgen de weg van Bileam, de zoon van Bosor, die het loon van de onrechtvaardigheid heeft liefgehad;", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "2 Kron 4:18": "En Salomo maakte al deze voorwerpen, in grote hoeveelheid; want het gewicht van het koper werd niet onderzocht.", "Jer 33:14": "Zie, de dagen komen, spreekt de HEERE, dat Ik het goede woord zal vervullen, dat Ik tot het huis van Israël en over het huis van Juda gesproken heb.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Gen 49:12": "Hij is roodachtig van ogen door de wijn, en wit van tanden door de melk.", "Rom 2:14-16": "Want wanneer de heidenen, die de wet niet hebben, van nature de dingen doen die van de wet zijn, dan zijn dezen, die de wet niet hebben, zichzelf een wet; Als mensen die het werk van de wet laten zien, geschreven in hun harten, terwijl hun geweten mede getuigt, en de gedachten elkaar onderling beschuldigen, of ook wel ontschuldigen). Op de dag waarop God de verborgen dingen van de mensen zal oordelen door Jezus Christus, naar mijn Evangelie.", "Ps 36:6": "O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe.", "Gal 1:4": "Die Zichzelf gegeven heeft voor onze zonden, opdat Hij ons zou trekken uit deze tegenwoordige boze wereld, naar de wil van onze God en Vader;", "Deut 13:17": "Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;", "Matt 9:9": "En toen Jezus vandaar verder ging, zag Hij een man in het tolhuis zitten, genaamd Mattheüs; en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Luk 10:22": "Alle dingen zijn Mij door Mijn Vader overgegeven; en niemand weet wie de Zoon is dan de Vader; en wie de Vader is dan de Zoon, en hij aan wie de Zoon het wil openbaren.", "Ezech 44:27": "En op de dag dat hij in het heilige naar binnen gaat, in het binnenste voorhof, om in het heilige te dienen, zal hij zijn zondoffer offeren, spreekt de Heere HEERE.", "Deut 27:9": "Vervolgens sprak Mozes, samen met de Levitische priesters, tot heel Israël: Luister toe en hoor, o Israël! Op deze dag bent u het volk van de HEERE, uw God, geworden.", "Rom 3:11": "er is niemand die verstandig is, er is niemand die God zoekt.", "Joh 7:34": "U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.", "Job 42:2": "Ik weet, dat U alles vermag, en dat geen van Uw gedachten kan afgesneden worden.", "1 Sam 12:22": "Want de HEERE zal Zijn volk niet verlaten, omwille van Zijn grote Naam, omdat het de HEERE behaagd heeft, u tot een volk voor Zichzelf te maken.", "Jer 5:3": "HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Gen 21:1": "En de HEERE bezocht Sara, zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "1 Kron 29:17": "En ik weet, mijn God, dat U het hart beproeft, en dat U een welgevallen hebt aan oprechtheid. Ik heb in oprechtheid van mijn hart al deze dingen vrijwillig gegeven, en ik heb nu met vreugde Uw volk, dat hier aanwezig is, gezien, dat het zich tegenover U vrijwillig gedragen heeft.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "Deut 11:12-15": "Een land, dat de HEERE, uw God, verzorgt; de ogen van de HEERE, uw God, zijn er voortdurend op gericht, van het begin van het jaar tot het einde van het jaar. En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel; Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt.", "Ps 37:18": "Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven.", "Ps 104:35": "De zondaars zullen van de aarde weggevaagd worden, en de goddelozen zullen niet meer zijn. Loof de HEERE, mijn ziel! Hallelujah!", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Jes 9:17": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook.", "Num 23:5": "Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.", "Job 36:5": "Zie, God is machtig, toch veracht Hij niemand; machtig is Hij in kracht van hart.", "Luk 16:9": "En Ik zeg u: Maak uzelf vrienden uit de onrechtvaardige Mammon, opdat, wanneer het u ontbreken zal, zij u mogen ontvangen in de eeuwige tenten.", "Fil 1:2": "Genade zij u en vrede van God, onze Vader, en van de Heere Jezus Christus.", "Ezech 33:12": "U dan, o mensenkind! Zeg tegen de kinderen van uw volk: De gerechtigheid van de rechtvaardige zal hem niet redden op de dag van zijn overtreding; en wat de goddeloosheid van de goddeloze betreft, hij zal er niet om vallen op de dag dat hij zich van zijn goddeloosheid bekeert; en de rechtvaardige zal niet kunnen leven door zijn gerechtigheid, op de dag dat hij zondigt.", "Pred 7:20": "Voorwaar, er is geen mens rechtvaardig op aarde, die goed doet en niet zondigt.", "1 Kon 9:5": "Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.", "1 Sam 16:7": "Doch de HEERE zei tegen Samuël: Kijk niet naar zijn gestalte, en ook niet naar zijn lange lengte, want Ik heb hem verworpen; want het is niet zoals de mens ziet; want de mens kijkt naar wat voor ogen is, maar de HEERE kijkt naar het hart.", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Ps 39:8": "En nu, wat verwacht ik, Heere? Mijn hoop is op U.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is; maar wee die mens door wie de Zoon des mensen verraden wordt; het zou beter voor hem geweest zijn als die mens niet geboren was.", "Job 39:9": "Die Ik de wildernis tot zijn huis besteld heb, en het ziltige tot zijn woningen.", "1 Joh 1:5": "En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is.", "Jer 22:4": "Want als u deze zaak ernstig zult doen, dan zullen door de poorten van dit huis koningen binnengaan, zittend op de troon van David, rijdend op wagens en op paarden, hij, en zijn dienaren, en zijn volk.", "Joh 8:21": "Jezus zei dan weer tegen hen: Ik ga heen, en u zult Mij zoeken, en in uw zonden zult u sterven; waar Ik heenga, kunt u niet komen.", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "Deut 6:1-25": "Dit zijn dan de geboden, de inzettingen en de rechten, die de HEERE, uw God, geboden heeft om u te leren; opdat u ze doet in het land, waar u naartoe gaat, om het te bezitten; Opdat u de HEERE, uw God, vreest, om al Zijn inzettingen en Zijn geboden te houden, die ik u gebied; u, en uw kind, en kindskind, al de dagen van uw leven; en opdat uw dagen verlengd worden. Hoor dan, Israël! en let erop dat u ze doet, opdat het u goed gaat, en opdat u zeer vermenigvuldigt (zoals de HEERE, de God van uw vaderen, u gesproken heeft) in het land, dat overvloeit van melk en honing.", "Ps 106:18": "En een vuur brandde onder hun groep, een vlam stak de goddelozen in brand.", "Num 7:9": "Maar aan de zonen van Kohath gaf hij niets; want de dienst van de heilige dingen die op hen rustte, moesten zij op de schouders dragen.", "Rom 1:28": "En zoals het hun niet goeddacht God te erkennen, zo heeft God hen overgegeven aan een verkeerd denken, om dingen te doen die niet betamen;", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Deut 10:12": "Nu dan, Israël! Wat vraagt de HEERE, uw God, van u, dan de HEERE, uw God, te vrezen, in al Zijn wegen te wandelen, en Hem lief te hebben, en de HEERE, uw God, te dienen, met heel uw hart en met heel uw ziel;", "Luk 12:5": "Maar Ik zal u tonen voor wie u bang moet zijn: wees bang voor Hem, Die, nadat Hij gedood heeft, ook macht heeft om in de hel te werpen; ja, Ik zeg u, wees bang voor Hem!", "2 Kron 20:8": "Zij nu hebben daarin gewoond, en zij hebben U daarin een heiligdom gebouwd voor Uw Naam, en zeiden:", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Ef 3:10": "opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "1 Sam 10:7": "En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.", "Hand 27:25": "Daarom, houd moed, mannen, want ik geloof God, dat het zo zal zijn zoals het mij gezegd is.", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "Deut 5:33": "In heel de weg die de HEERE, uw God, u gebiedt, zult u gaan; opdat u leeft, en opdat het u goed gaat, en u de dagen verlengt in het land dat u erven zult.", "Ef 5:20": "en dank altijd voor alle dingen God en de Vader, in de Naam van onze Heere Jezus Christus,", "1 Kor 8:3": "Maar als iemand God liefheeft, die is door Hem gekend.", "Zach 6:13": "Ja, Hij zal de tempel van de HEERE bouwen, en Hij zal het sieraad dragen, en Hij zal zitten, en heersen op Zijn troon; en Hij zal priester zijn op Zijn troon; en de raad van vrede zal tussen die Beiden zijn.", "Joh 14:14": "Als u iets zult vragen in Mijn Naam, Ik zal het doen.", "Hagg 2:6": "Met het woord, waarmee Ik met u een verbond gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd!", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Joh 14:15": "Als u Mij liefhebt, bewaar dan Mijn geboden.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Ps 90:15": "Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.", "Num 12:6-8": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "Matt 23:33": "Slangen, addergebroed! Hoe zou u de helse verdoemenis ontvluchten?", "Ps 34:18": "Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.", "Openb 18:5": "Want haar zonden zijn de een na de ander gevolgd tot aan de hemel toe, en God is haar ongerechtigheden gaan gedenken.", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "1 Kron 18:7-11": "En David nam de gouden schilden die bij Hadar-ezers knechten waren geweest, en hij bracht ze naar Jeruzalem. Ook nam David heel veel koper uit Tibchath en uit Chun, steden van Hadar-ezer; daarvan heeft Salomo de koperen zee, en de pilaren, en de koperen voorwerpen gemaakt. Toen Thou, de koning van Hamath, hoorde dat David de hele legermacht van Hadar-ezer, de koning van Zoba, verslagen had,", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Openb 14:1": "En ik zag, en zie, het Lam stond op de berg Sion, en met Hem honderdvierenveertigduizend, die de naam van Zijn Vader geschreven hadden op hun voorhoofden.", "1 Kron 21:24": "En de koning David zei tegen Ornan: Nee, maar ik zal het zeker kopen voor het volle geld; want ik zal voor de HEERE niet nemen wat van u is, om een brandoffer voor niets te offeren.", "Ps 16:5": "De HEERE is het deel van mijn erfenis en van mijn beker; U onderhoudt mijn lot.", "Ps 77:2-10": "Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen. Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden. Dacht ik aan God, dan maakte ik misbaar; peinsde ik, dan werd mijn ziel overstelpt. Sela.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "2 Kon 6:32": "(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "2 Kron 15:18": "En hij bracht in het huis van God de geheiligde dingen van zijn vader, en zijn eigen geheiligde dingen, zilver en goud, en voorwerpen.", "Gen 6:13": "Daarom zei God tegen Noach: Het einde van alle vlees is voor Mijn aangezicht gekomen; want de aarde is door hen vervuld met geweld; en zie, Ik zal hen met de aarde verderven.", "Ps 91:8": "Alleen zult u het met uw ogen aanschouwen; en u zult de vergelding van de goddelozen zien.", "Jer 34:1": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:", "Ps 18:30": "Want met U loop ik door een bende, en met mijn God spring ik over een muur.", "Jes 58:9": "Dan zult u roepen, en de HEERE zal antwoorden; u zult schreeuwen, en Hij zal zeggen: Zie, hier ben Ik. Als u uit uw midden wegdoet het juk, het uitsteken van de vinger, en het spreken van ongerechtigheid;", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "Deut 31:6": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten.", "2 Kron 31:10": "En Azarja, de hoofdpriester, van het huis van Zadok, sprak tot hem en zei: Sinds men deze heffing is begonnen tot het huis van de HEERE te brengen, is er te eten geweest en genoeg om verzadigd te worden, ja, tot overvloed toe; want de HEERE heeft Zijn volk gezegend, zodat deze grote hoeveelheid overgebleven is.", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "Job 19:25-27": "Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan; En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen; Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.", "Matt 5:9": "Zalig zijn de vreedzamen, want zij zullen kinderen van God genoemd worden.", "Lev 26:16-39": "Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten. Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand. En als u Mij ook na deze dingen niet zult horen, zal Ik nog daaraan toedoen, om u zevenvoudig over uw zonden te tuchtigen.", "Ps 119:119": "U doet alle goddelozen van de aarde weg als schuim, daarom heb ik Uw getuigenissen lief.", "Ef 4:17": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed.", "Joh 10:15": "Zoals de Vader Mij kent, zo ken Ik ook de Vader; en Ik geef Mijn leven voor de schapen.", "Job 29:20": "Mijn heerlijkheid was nieuw bij mij, en mijn boog vernieuwde zich in mijn hand.", "Lev 21:12": "En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "Jes 43:6": "Ik zal zeggen tot het noorden: Geef; en tot het zuiden: Houd niet terug; breng Mijn zonen van verre, en Mijn dochters van het einde der aarde;", "Jes 8:19": "Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; zo zeg: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden vragen?", "Neh 13:30": "Zo reinigde ik hen van alle vreemden; en ik stelde de wachten van de priesters en van de Levieten vast, ieder in zijn werk;", "Hagg 1:8": "Klim het gebergte op, breng hout aan, en bouw dit huis, en Ik zal er welgevallen aan hebben en verheerlijkt worden, zegt de HEERE.", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "2 Sam 7:12-16": "Wanneer uw dagen vervuld zullen zijn, en u met uw vaderen zult ontslapen zijn, dan zal Ik uw nakomeling na u doen opstaan, die uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen. Die zal voor Mijn Naam een huis bouwen; en Ik zal de troon van zijn koninkrijk bevestigen tot in eeuwigheid. Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "1 Kron 22:6-13": "Toen riep hij zijn zoon Salomo, en gebood hem voor de HEERE, de God van Israël, een huis te bouwen. En David zei tegen Salomo: Mijn zoon, wat mij betreft, het lag in mijn hart om voor de Naam van de HEERE, mijn God, een huis te bouwen; maar het woord van de HEERE kwam tot mij en zei: U hebt bloed in overvloed vergoten, want u hebt grote oorlogen gevoerd; u zult voor Mijn Naam geen huis bouwen, omdat u veel van het bloed op de aarde voor Mijn aangezicht vergoten hebt.", "Ezech 37:1": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.", "2 Kor 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting;", "Kol 1:21": "En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend,", "Deut 34:9-11": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;", "Lev 26:45": "Maar Ik zal hun ten goede denken aan het verbond van hun voorouders, die Ik uit het land Egypte voor de ogen van de heidenen uitgevoerd heb, opdat Ik hun tot een God zou zijn; Ik ben de HEERE!", "Kol 1:12": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht;", "Ruth 1:6": "Toen maakte zij zich klaar met haar schoondochters, en keerde terug uit de velden van Moab; want zij had in het land van Moab gehoord dat de HEERE naar Zijn volk had omgezien en hun brood gaf.", "Ezech 3:10-12": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "Joh 4:23": "Maar het uur komt, en is er nu, waarop de ware aanbidders de Vader zullen aanbidden in geest en waarheid; want de Vader zoekt ook zulke aanbidders.", "1 Joh 5:14": "En dit is de vrijmoedigheid die wij tegenover Hem hebben, dat als wij iets bidden naar Zijn wil, Hij ons verhoort.", "Ps 76:12": "Doe geloften en betaal ze de HEERE, uw God, u allen, die rondom Hem zijn! Laat men Hem, Die te vrezen is, geschenken brengen;", "Spr 2:3-5": "Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid; Als u haar zoekt als zilver, en naspeurt als verborgen schatten; Dan zult u de vreze des HEEREN verstaan, en zult de kennis van God vinden.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Ps 146:7-9": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los. De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief. De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Hos 2:20": "En het zal op die dag gebeuren, dat Ik verhoren zal, spreekt de Heere; Ik zal de hemel verhoren, en die zal de aarde verhoren.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "Rom 1:3": "over Zijn Zoon, Die geworden is uit het geslacht van David, naar het vlees;", "2 Kron 4:22": "Alsook de gaffels, en de sprenkelschalen, en de rookschalen, en de wierookvaten, van gesloten goud; aangaande de ingang van het huis, zijn binnenste deuren, van het heilige der heiligen, en de deuren van het huis van de tempel waren van goud.", "Ps 89:29": "Ik zal hem Mijn goedertierenheid in eeuwigheid bewaren, en Mijn verbond zal hem vast blijven.", "Hebr 10:26-29": "Want als wij willens en wetens zondigen, nadat wij de kennis van de waarheid ontvangen hebben, blijft er geen offer meer over voor de zonden; maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "Pred 7:17": "Wees niet al te goddeloos, en wees ook niet al te dwaas; waarom zou u sterven vóór uw tijd?", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "1 Kon 8:15": "En hij zei: Geloofd zij de HEERE, de God van Israël, Die met Zijn mond tot mijn vader David gesproken heeft, en het met Zijn hand vervuld heeft, en zei:", "Num 5:7": "En zij zullen hun zonde die zij gedaan hebben belijden; daarna zal hij zijn schuld weer uitkeren, naar de hoofdsom daarvan, en het vijfde deel daarvan zal hij daarboven toevoegen, en zal het geven aan degene aan wie hij zich schuldig gemaakt heeft.", "Ps 89:34": "Maar Mijn goedertierenheid zal Ik van hem niet wegnemen, en in Mijn getrouwheid niet feilen.", "Ex 19:3": "En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Jes 44:21": "Denk aan deze dingen, o Jakob, en Israël! Want u bent Mijn knecht, Ik heb u geformeerd; u bent Mijn knecht, Israël, u zult door Mij niet vergeten worden.", "2 Kron 15:7": "Daarom, wees u sterk, en laat uw handen niet verslappen; want er is loon naar uw werk.", "1 Kon 8:43": "hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "Ef 4:11-13": "En Dezelfde heeft sommigen gegeven als apostelen, en sommigen als profeten, en sommigen als evangelisten, en sommigen als herders en leraars; Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus; Totdat wij allen komen tot de eenheid van het geloof en van de kennis van de Zoon van God, tot een volwassen man, tot de maat van de grootte van de volheid van Christus;", "2 Sam 22:31": "Gods weg is volmaakt; het woord van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "Ps 89:29-38": "Ik zal hem Mijn goedertierenheid in eeuwigheid bewaren, en Mijn verbond zal hem vast blijven. En Ik zal zijn zaad in eeuwigheid vestigen, en zijn troon als de dagen van de hemelen. Als zijn kinderen Mijn wet verlaten, en in Mijn rechten niet wandelen;", "Ezech 11:21": "Maar van hen wier hart het hart van hun verfoeiselen en hun gruwelen navolgt, zal Ik de weg daarvan op hun hoofd geven, spreekt de Heere HEERE.", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "Ps 119:6": "Dan zou ik niet beschaamd worden, wanneer ik letten zou op al Uw geboden.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "1 Kron 23:1": "Toen David nu oud was en verzadigd van dagen, maakte hij zijn zoon Salomo koning over Israël.", "Deut 7:10": "En Hij vergeldt ieder van hen die Hem haten, in zijn aangezicht, om hem te verderven; Hij zal het voor wie Hem haat niet uitstellen, in zijn aangezicht zal Hij het hem vergelden.", "2 Kor 9:6-13": "En dit zeg ik: wie spaarzaam zaait, zal ook spaarzaam maaien; en wie in zegeningen zaait, zal ook in zegeningen maaien. Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief. En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk.", "Deut 26:18": "En de HEERE heeft u heden laten zeggen dat u Hem tot een volk van het eigendom zult zijn, zoals Hij u gesproken heeft, en dat u al Zijn geboden zult houden;", "1 Sam 19:24": "En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?", "Spr 12:7": "De goddelozen worden omgekeerd, zodat zij niet meer zijn; maar het huis van de rechtvaardigen zal bestaan.", "Deut 4:4": "U daarentegen, die de HEERE, uw God, aanhing, u bent vandaag allemaal nog in leven.", "Ps 9:4": "Omdat mijn vijanden achterwaarts gekeerd, gevallen en vergaan zijn van Uw aangezicht.", "Ex 30:1-10": "U moet ook een reukaltaar maken voor het reukwerk; van acaciahout moet u het maken. Een el zal zijn lengte zijn, en een el zijn breedte; vierkant zal het zijn, maar twee ellen zijn hoogte; uit hetzelfde materiaal zullen zijn hoornen zijn. En u moet het met zuiver goud overtrekken, zijn bovenkant en zijn wanden rondom, en ook zijn hoornen; en u moet er een gouden krans rondom aan maken.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Matt 6:33": "Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Jes 51:1": "Hoor naar Mij, u die de gerechtigheid najaagt, u die de HEERE zoekt! Kijk naar de rots waaruit u gehouwen bent, en naar de holte van de bornput waaruit u gegraven bent.", "Jer 24:4": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Job 22:28": "Als u een zaak besluit, zal zij voor u bestendig zijn; en op uw wegen zal het licht schijnen.", "Joh 9:31": "En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.", "1 Sam 3:21": "En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "Deut 13:4": "De HEERE, uw God, zult u navolgen, en Hem vrezen, en Zijn geboden zult u houden, en Zijn stem gehoorzaam zijn, en Hem dienen, en Hem aanhangen.", "1 Sam 10:6": "En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.", "Job 38:25-27": "Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen? Om te regenen op het land, waar niemand is, op de woestijn, waarin geen mens is; Om het woeste en het verwoeste te verzadigen, en om het uitspruitsel van de grasscheutjes te doen meer worden.", "Jer 11:1-5": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei: Hoor u de woorden van dit verbond, en spreek tot de mannen van Juda, en tot de inwoners van Jeruzalem; Zeg dan tegen hen: Zo zegt de HEERE, de God van Israël: Vervloekt is de man die niet hoort naar de woorden van dit verbond.", "Ex 35:25": "En alle vrouwen die wijs van hart waren, sponnen met hun handen, en zij brachten het gesponnene, het hemelsblauwe garen, en het purper, het scharlaken, en het fijn linnen.", "Matt 12:20": "Het geknakte riet zal Hij niet breken, en de walmende vlaspit zal Hij niet uitblussen, totdat Hij het oordeel tot overwinning zal uitbrengen.", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "1 Kron 29:2-5": "Ik heb nu uit al mijn kracht klaargemaakt voor het huis van mijn God: goud voor de gouden dingen, en zilver voor de zilveren, en koper voor de koperen, ijzer voor de ijzeren, en hout voor de houten werken; sardonyxstenen en stenen om in te zetten, glanzende stenen en stenen van verschillende kleuren, en allerlei kostbare stenen, en marmerstenen in overvloed. En daarbij, uit mijn genegenheid voor het huis van mijn God, geef ik mijn eigen goud en zilver, dat ik heb, aan het huis van mijn God, boven op alles wat ik al voor het heilige huis klaargemaakt heb; Drieduizend talenten goud, van het goud van Ofir, en zevenduizend talenten gelouterd zilver, om de wanden van de huizen mee te bekleden;", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Ps 64:8": "Maar God zal hen haastig met een pijl schieten; hun plagen zijn er.", "Jes 54:9": "Want dat zal Mij zijn als de wateren van Noach, toen Ik zwoer dat de wateren van Noach niet meer over de aarde zouden gaan; zo heb Ik gezworen dat Ik niet meer op u toornen, of u bestraffen zal.", "Jer 30:19": "En van hen zal dankzegging uitgaan, en een stem van spelende mensen; en Ik zal hen vermeerderen, en zij zullen niet minder worden, en Ik zal hen verheerlijken, en zij zullen niet gering worden.", "Hebr 4:5": "En op deze plaats opnieuw: Zij zullen Mijn rust niet ingaan!", "Amos 9:2-4": "Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten. En al gingen zij in gevangenschap voor het aangezicht van hun vijanden, dan zal Ik vandaar het zwaard gebieden, dat het hen doodt; en Ik zal Mijn oog tegen hen richten ten kwade, en niet ten goede.", "Hand 13:39": "En dat ieder die gelooft, door Hem gerechtvaardigd wordt van alles waarvan u niet gerechtvaardigd kon worden door de wet van Mozes.", "Joh 1:18": "Niemand heeft ooit God gezien; de eniggeboren Zoon, Die in de schoot van de Vader is, Die heeft Hem ons verklaard.", "Openb 20:10": "En de duivel, die hen verleidde, werd geworpen in de poel van het vuur en sulfer, waar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.", "Joz 24:14": "En nu, vrees de HEERE, en dien Hem in oprechtheid en in waarheid; en doe de goden weg die uw vaders gediend hebben, aan de overkant van de rivier, en in Egypte; en dien de HEERE.", "Hebr 10:38": "Maar de rechtvaardige zal uit het geloof leven; en als iemand zich terugtrekt, heeft Mijn ziel in hem geen behagen.", "1 Kron 29:17-19": "En ik weet, mijn God, dat U het hart beproeft, en dat U een welgevallen hebt aan oprechtheid. Ik heb in oprechtheid van mijn hart al deze dingen vrijwillig gegeven, en ik heb nu met vreugde Uw volk, dat hier aanwezig is, gezien, dat het zich tegenover U vrijwillig gedragen heeft. O HEERE, God van onze vaders, Abraham, Izak en Israël, bewaar dit voor eeuwig in de gedachten van het hart van Uw volk, en richt hun hart op U. En geef mijn zoon Salomo een volkomen hart, om Uw geboden, Uw getuigenissen en Uw inzettingen te houden; en om alles te doen, en om dit paleis te bouwen, dat ik klaargemaakt heb.", "Gen 6:7": "En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "Deut 6:6": "En deze woorden, die ik u heden gebied, zullen in uw hart zijn.", "Ezech 33:18": "Als de rechtvaardige afwijkt van zijn gerechtigheid en onrecht doet, zal hij daarin sterven.", "Matt 11:28-30": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven. Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen. Want Mijn juk is zacht, en Mijn last is licht.", "Ps 101:2": "Ik zal verstandig handelen op de oprechte weg; wanneer zult U tot mij komen? Ik zal in het midden van mijn huis wandelen, in oprechtheid van mijn hart.", "Deut 29:9": "Houdt dan de woorden van dit verbond, en doet ze; opdat u verstandig handelt in alles, wat u doen zult.", "Ex 22:30": "Hetzelfde moet u doen met uw runderen en met uw schapen; zeven dagen moeten ze bij hun moeder blijven, op de achtste dag moet u ze aan Mij geven.", "Gen 6:18": "Maar met u zal Ik Mijn verbond oprichten; en u zult in de ark gaan, u, en uw zonen, en uw vrouw, en de vrouwen van uw zonen met u.", "1 Kon 6:3": "En het voorhuis, vooraan de tempel van dat huis, was in zijn lengte twintig ellen, overeenkomstig de breedte van het huis, tien ellen in zijn breedte, vooraan het huis.", "Ps 27:10": "Want mijn vader en mijn moeder hebben mij verlaten, maar de HEERE zal mij aannemen.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Deut 4:29-31": "Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel. Wanneer u in angst zult zijn, en al deze dingen u zullen treffen, in de laatste dagen, dan zult u terugkeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn. Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Luk 13:24": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;", "Ps 140:7": "Ik heb tegen de HEERE gezegd: U bent mijn God; neem ter ore, HEERE, de stem van mijn smekingen.", "Kol 1:3": "Wij danken de God en Vader van onze Heere Jezus Christus, terwijl wij altijd voor u bidden,", "Ps 107:1-43": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft. En hen die Hij uit de landen verzameld heeft, van het oosten en van het westen, van het noorden en van de zee.", "Gen 49:20": "Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Luk 17:1": "En Hij zei tegen de discipelen: Het kan niet anders, dan dat er ergernissen komen; maar wee hem, door wie ze komen.", "Ps 94:22": "Doch de HEERE is mij geweest tot een Hoog Vertrek, en mijn God tot een Steenrots van mijn toevlucht.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Ps 50:22": "Verstaat dit toch, u die God vergeet! opdat Ik niet verscheur en niemand redt.", "Ps 106:3": "Gelukkig zijn zij die het recht onderhouden, die te allen tijde gerechtigheid doen.", "Gen 4:7": "Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.", "Ps 145:15": "Ain. Aller ogen wachten op U; en U geeft hun hun voedsel op de juiste tijd.", "Hos 2:7": "Zij erkent echter niet dat Ik haar het koren, de nieuwe wijn, en de olie gegeven heb, en haar het zilver en goud vermeerderd heb, dat zij voor de Baäl gebruikt hebben.", "Job 27:8-23": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken? Zal God zijn geroep horen, als benauwdheid over hem komt? Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "Jer 7:23": "Maar deze zaak heb Ik hun geboden, en Ik zei: Hoor naar Mijn stem, dan zal Ik u tot een God zijn, en u zult Mij tot een volk zijn; en wandel in heel de weg die Ik u gebieden zal, opdat het u goed gaat.", "Ps 31:15": "Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God.", "Ps 9:13": "Want Hij zoekt de bloedstortingen, Hij gedenkt daarvan; Hij vergeet het geroep van de ellendigen niet.", "Hos 2:19": "En Ik zal u aan Mij verloven in geloof; en u zult de Heere kennen.", "Spr 3:19": "De HEERE heeft de aarde door wijsheid gegrond, de hemelen door verstandigheid bereid.", "1 Kor 16:1-3": "Wat de verzameling betreft, die voor de heiligen gebeurt: zoals ik aan de Gemeenten in Galatië verordend heb, doet u ook zo. Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn. En wanneer ik daar gekomen zal zijn, zal ik hen die u bekwaam zult achten door brieven zenden, om uw gave naar Jeruzalem over te dragen.", "Matt 24:13": "Maar wie zal volharden tot het einde, die zal behouden worden.", "Deut 11:9": "En opdat u de dagen verlengt in het land, dat de HEERE aan uw vaderen gezworen heeft, aan hen en aan hun nageslacht te geven; een land, vloeiend van melk en honing.", "Ps 18:29": "Want U doet mijn lamp lichten; de HEERE, mijn God, doet mijn duisternis opklaren.", "Jak 4:10": "Verneder u voor de Heere, en Hij zal u verhogen.", "Ps 119:57": "Cheth. De HEERE is mijn deel, ik heb gezegd, dat ik Uw woorden zal bewaren.", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "1 Kon 17:24": "Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.", "Ps 86:2": "Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt.", "Gen 49:18": "Op Uw zaligheid wacht ik, HEERE!", "Gen 28:21": "en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn!", "Matt 5:19-30": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen. Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan. U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "2 Kon 3:11": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Ex 22:29": "Met het brengen van de opbrengst van uw oogst en van uw perskuip mag u niet talmen; de eerstgeborene van uw zonen moet u aan Mij geven.", "Ps 108:11-14": "Wie zal mij voeren in een vaste stad? Wie zal mij leiden tot in Edom? Zult U het niet zijn, o God! Die ons verstoten had, en Die niet uittrok, o God! Met onze legers? Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Hebr 13:14": "Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige.", "1 Kron 16:11": "Vraagt naar de HEERE en Zijn sterkte, zoekt Zijn aangezicht voortdurend.", "Amos 3:8": "De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?", "Ex 32:33-35": "Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen. Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken! Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had.", "Ps 31:16": "Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers.", "Zach 1:7": "Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Matt 24:36": "Maar die dag en dat uur kent niemand, ook de engelen van de hemelen niet, maar alleen Mijn Vader.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "Ps 71:14": "Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "Ex 11:1": "(Want de HEERE had tegen Mozes gesproken: Ik zal nog één plaag over Farao en over Egypte brengen, daarna zal hij u van hier laten trekken; als hij u geheel zal laten trekken, dan zal hij u haastig van hier uitdrijven.", "Jes 63:16": "U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.", "Jak 1:22-25": "En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel; Want hij heeft zichzelf bekeken, en is weggegaan, en heeft meteen vergeten hoe hij eruitzag.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "Amos 7:7": "Nog liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Jak 1:4": "Doch de volharding moet een volmaakt werk hebben, opdat u volmaakt bent en geheel oprecht, in geen ding gebrekkig.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "Jer 8:12-14": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE. Ik zal hen voorzeker wegrapen, spreekt de HEERE; er zijn geen druiven aan de wijnstok, en geen vijgen aan de vijgenboom, ja, het blad is afgevallen; en de geboden die Ik hun gegeven heb, die overtreden zij. Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.", "1 Joh 3:6-10": "Ieder die in Hem blijft, zondigt niet; ieder die zondigt, heeft Hem niet gezien en heeft Hem niet gekend. Kinderen, laat niemand u verleiden. Die de rechtvaardigheid doet, is rechtvaardig, zoals Hij rechtvaardig is. Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "Jer 24:7": "En Ik zal hun een hart geven om Mij te kennen, dat Ik de HEERE ben; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn; want zij zullen zich tot Mij bekeren met hun hele hart.", "Ps 37:19": "Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "1 Kor 1:9": "God is getrouw, door Wie u geroepen bent tot de gemeenschap van Zijn Zoon Jezus Christus, onze Heere.", "Zach 4:11-14": "Verder antwoordde ik en zei tegen Hem: Wat zijn die twee olijfbomen, aan de rechterzijde van de kandelaar en aan zijn linkerzijde? En opnieuw antwoordend, zei ik tegen Hem: Wat zijn die twee takjes van de olijfbomen, die naast de twee gouden kruiken zijn, die het goud uit zichzelf uitgieten? En Hij sprak tegen mij: Weet u niet wat deze zijn? En ik zei: Nee, mijn Heere!", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Joh 1:6": "Er was een mens door God gezonden, wiens naam Johannes was.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Joh 15:26": "Maar wanneer de Trooster gekomen zal zijn, Die Ik u zenden zal van de Vader, namelijk de Geest van de waarheid, Die van de Vader uitgaat, Die zal van Mij getuigen.", "Hos 11:3": "Ik echter leerde Efraïm lopen; Hij nam ze op Zijn armen, maar zij erkenden niet dat Ik ze genas.", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Matt 6:18": "opdat het niet door de mensen gezien wordt dat u vast, maar door uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.", "Joh 20:21": "Jezus zei dan opnieuw tegen hen: Vrede zij u; zoals de Vader Mij gezonden heeft, zend Ik ook u.", "Num 19:20": "Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden van de gemeenschap uitgeroeid worden; want hij heeft het heiligdom van de HEERE verontreinigd, het water van de afzondering is niet op hem gesprenkeld, hij is onrein.", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Ps 91:9": "Want U, HEERE, bent mijn Toevlucht! De Allerhoogste hebt u gesteld tot uw Vertrek;", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.", "Joh 6:37": "Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.", "Deut 1:6": "De HEERE, onze God, sprak tot ons bij Horeb, en zei: U bent lang genoeg bij deze berg gebleven.", "Ps 102:18-21": "Zich gewend zal hebben tot het gebed van hem die geheel ontbloot is, en niet versmaad hebben hun gebed; Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven; Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben;", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "1 Joh 3:10": "Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft,", "Ex 25:8": "En zij zullen Mij een heiligdom maken, dat Ik in hun midden woon.", "Zach 8:20-23": "Zo zegt de HEERE van de heerscharen: Nog zal het gebeuren, dat de volken, en de inwoners van veel steden, komen zullen; En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan. Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "Kol 1:23": "als u maar blijft in het geloof, gefundeerd en vast, en niet wordt weggebracht van de hoop van het Evangelie dat u gehoord hebt, dat gepredikt is onder alle schepselen die onder de hemel zijn; waarvan ik, Paulus, een dienaar geworden ben;", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Gen 24:40": "En hij zei tegen mij: De HEERE, voor Wiens aangezicht ik gewandeld heb, zal Zijn Engel met u zenden, en Hij zal uw weg voorspoedig maken, zodat u voor mijn zoon een vrouw neemt, uit mijn geslacht en uit het huis van mijn vader.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "Amos 8:12": "En zij zullen zwerven van zee tot zee, en van het noorden tot het oosten; zij zullen rondlopen om het woord van de HEERE te zoeken, maar zullen het niet vinden.", "2 Kon 20:3": "Och, HEERE, gedenk toch dat ik voor Uw aangezicht in waarheid en met een volkomen hart gewandeld heb, en gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg veel.", "Ps 34:19": "Koph. De HEERE is nabij de gebrokenen van hart, en Hij behoudt de verslagenen van geest.", "Ps 57:8": "Mijn hart is standvastig, o God! mijn hart is standvastig; ik zal zingen en psalmzingen.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Richt 13:25": "En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.", "2 Kron 35:4": "En bereid u naar de huizen van uw vaderen, naar uw verdelingen, naar het voorschrift van David, de koning van Israël, en naar de beschrijving van zijn zoon Salomo;", "Matt 19:22": "Toen nu de jongeling dit woord hoorde, ging hij bedroefd weg; want hij had veel bezittingen.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Job 8:5": "Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt;", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "2 Kron 7:17-22": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt; Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst. Maar als u zich afkeert, en Mijn inzettingen en Mijn geboden, die Ik voor uw aangezicht gegeven heb, verlaat, en heengaat, en andere goden dient, en u voor die neerbuigt;", "1 Kon 20:42": "En hij zei tegen hem: Zo zegt de HEERE: Omdat u de man, die Ik verbannen had, uit uw hand hebt laten gaan, zal uw leven in de plaats van zijn leven zijn, en uw volk in de plaats van zijn volk.", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "Joël 2:12": "Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen.", "Joh 14:2": "In het huis van Mijn Vader zijn veel woningen; anders zou Ik het u gezegd hebben. Ik ga heen om u plaats te bereiden.", "1 Sam 12:25": "Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen.", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Ex 39:42": "Naar alles wat de HEERE aan Mozes geboden had, zo hadden de kinderen van Israël het gehele werk gemaakt.", "Ps 59:18": "Van U, o mijn Sterkte, zal ik psalmzingen; want God is mijn Hoog Vertrek, de God van mijn goedertierenheid.", "Neh 9:8": "En U hebt zijn hart getrouw gevonden voor Uw aangezicht, en hebt een verbond met hem gemaakt, dat U zou geven het land van de Kanaänieten, de Hethieten, de Amorieten, en de Ferezieten, en de Jebusieten, en de Girgasieten, dat U het aan zijn nageslacht zou geven; en U hebt Uw woorden bevestigd, omdat U rechtvaardig bent.", "Joh 3:15": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Ps 7:11": "Mijn schild is bij God, Die de oprechten van hart behoudt.", "Deut 1:10": "De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel.", "Hos 5:9": "Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.", "Ps 78:34": "Toen Hij hen doodde, zochten zij Hem, en keerden weer, en zochten God vroeg;", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "Ps 25:1": "Een psalm van David. Aleph. Tot U, o HEERE! hef ik mijn ziel op.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "Ps 56:9": "U hebt mijn omzwerven geteld; leg mijn tranen in Uw fles; staan zij niet in Uw register?", "Ps 145:16": "Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen."
