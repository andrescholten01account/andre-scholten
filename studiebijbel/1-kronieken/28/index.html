 kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Hand 15:17": "opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.", "Ps 128:2-6": "Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel. Zie, zo zal die man zeker gezegend worden, die de HEERE vreest.", "Hos 2:21": "En de aarde zal het koren verhoren, alsook de nieuwe wijn en de olie; en die zullen Jizreël verhoren.", "Hand 7:47": "En Salomo bouwde Hem een huis.", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Gen 9:1-3": "En God zegende Noach en zijn zonen, en Hij zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde! En vrees en angst voor u zal er zijn over al het gedierte van de aarde, en over al het gevogelte van de hemel; over alles wat zich op de aardbodem beweegt, en over alle vissen van de zee; zij zijn in uw hand overgegeven. Alles wat zich beweegt, dat leeft, zal u tot voedsel zijn; Ik heb het u allemaal gegeven, zoals het groene kruid.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Ps 89:6": "Daarom loven de hemelen Uw wonderen, o HEERE! ook is Uw getrouwheid in de gemeente van de heiligen.", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Joh 15:6": "Als iemand in Mij niet blijft, die is buiten geworpen, zoals de rank, en is verdord; en men verzamelt ze, en men werpt ze in het vuur, en zij worden verbrand.", "Ps 140:8": "HEERE, Heere, sterkte van mijn heil! U hebt mijn hoofd bedekt op de dag van de wapening.", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Matt 15:18-20": "Maar de dingen die de mond uitgaan, komen voort uit het hart, en die verontreinigen de mens. Want uit het hart komen voort boze overwegingen, doodslagen, overspelen, hoererijen, dieverijen, valse getuigenissen, lasteringen. Deze dingen zijn het die de mens verontreinigen; maar het eten met ongewassen handen verontreinigt de mens niet.", "Gen 24:27": "en hij zei: Geloofd zij de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en trouw niet onthouden heeft aan mijn heer; wat mij betreft, de HEERE heeft mij op deze weg geleid, naar het huis van de broers van mijn heer.", "Ezra 6:5": "Daarbij moet men ook de gouden en zilveren vaten van het huis van God, die Nebukadnezar uit de tempel die te Jeruzalem was heeft weggevoerd en naar Babel gebracht, teruggeven, zodat zij teruggaan naar de tempel die te Jeruzalem is, ieder naar zijn plaats, en men zal ze brengen naar het huis van God.", "Jer 26:13": "Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft.", "Hand 7:49": "De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?", "Ps 78:52-55": "En Hij voerde Zijn volk als schapen, en leidde hen, als een kudde, door de woestijn. Ja, Hij leidde hen zeker, zodat zij niet vreesden; want de zee had hun vijanden overdekt. En Hij bracht hen tot het gebied van Zijn heiligheid, tot deze berg, die Zijn rechterhand verkregen heeft.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Jes 49:16": "Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Luk 16:16": "De wet en de profeten zijn tot op Johannes; van die tijd af wordt het Koninkrijk van God verkondigd, en ieder doet geweld op datzelfde.", "Ps 27:6": "Ook nu zal mijn hoofd verhoogd worden boven mijn vijanden die rondom mij zijn, en ik zal in Zijn tent offeranden van het geschal offeren; ik zal zingen, ja, psalmzingen voor de HEERE.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Hos 4:1": "Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is;", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Ezech 33:10-16": "Daarom, mensenkind! Zeg tegen het huis van Israël: U spreekt zo en zegt: Omdat onze overtredingen en onze zonden op ons zijn, en wij daarin wegkwijnen, hoe zouden wij dan leven? Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël? U dan, o mensenkind! Zeg tegen de kinderen van uw volk: De gerechtigheid van de rechtvaardige zal hem niet redden op de dag van zijn overtreding; en wat de goddeloosheid van de goddeloze betreft, hij zal er niet om vallen op de dag dat hij zich van zijn goddeloosheid bekeert; en de rechtvaardige zal niet kunnen leven door zijn gerechtigheid, op de dag dat hij zondigt.", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Jes 40:13": "Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen?", "Luk 2:49": "En Hij zei tegen hen: Waarom hebt u Mij gezocht? Wist u niet dat Ik moet zijn in de dingen van Mijn Vader?", "2 Sam 12:1": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Num 22:18": "Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Job 12:16": "Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "Ps 65:3": "U hoort het gebed; tot U zal alle vlees komen.", "Hebr 10:23": "Laten wij de onwankelbare belijdenis van de hoop vasthouden (want Die het beloofd heeft, is trouw);", "Ps 118:17": "Ik zal niet sterven, maar leven; en ik zal de werken van de HEERE vertellen.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Hand 2:23": "Deze, door de bepaalde raad en voorkennis van God overgegeven, hebt u genomen en door de handen van onrechtvaardigen aan het kruis gehecht en gedood;", "Joh 14:26": "Maar de Trooster, de Heilige Geest, Die de Vader zal zenden in Mijn Naam, Die zal u alles leren, en zal u alles laten herinneren wat Ik u gezegd heb.", "Hebr 6:12": "opdat u niet traag wordt, maar navolgers bent van hen die door geloof en geduld de beloften beërven.", "Ps 127:1-5": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs. Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap. Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Lev 19:37": "Daarom zult u al Mijn inzettingen en al Mijn rechten onderhouden, en zult ze doen; Ik ben de HEERE!", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Joh 21:17": "Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "1 Kon 2:2-4": "Ik ga heen in de weg van de hele aarde, wees dus sterk en wees een man. En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt; opdat de HEERE Zijn woord bevestigt, dat Hij over mij gesproken heeft, toen Hij zei: Als uw zonen hun weg bewaren, om voor Mijn aangezicht trouw, met hun hele hart en met hun hele ziel te wandelen, dan zal het u nooit ontbreken, zei Hij, aan een man op de troon van Israël.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Ex 15:26": "en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!", "Ps 44:22": "Zou God dat niet onderzoeken? Want Hij kent de verborgenheden van het hart.", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Spr 2:1-5": "Mijn zoon! Als u mijn woorden aanneemt, en mijn geboden bij u bewaart; Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt; Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid;", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Ps 147:3": "Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "Hebr 9:5": "En boven over de ark waren de cherubs der heerlijkheid, die het verzoendeksel beschaduwden; van welke dingen wij nu niet stuk voor stuk zullen spreken.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Spr 11:10": "Een stad springt op van vreugde over het welvaren van de rechtvaardigen; en als de goddelozen vergaan, is er gejuich.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Dan 2:44": "Maar in de dagen van die koningen zal de God van de hemel een Koninkrijk oprichten, dat in eeuwigheid niet zal worden verwoest; en dat Koninkrijk zal aan geen ander volk worden overgelaten; het zal al die koninkrijken verbrijzelen en tenietdoen, maar zelf zal het in alle eeuwigheid bestaan.", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Ps 71:21": "Gij zult mijn grootheid vermeerderen, en mij rondom vertroosten.", "Joz 23:7": "Dat u niet ingaat tot deze volken: deze, die overgebleven zijn bij u; gedenkt ook niet aan de naam van hun goden, en laat er niet bij zweren, en dient hen niet, en buigt u voor hen niet;", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Hand 13:33": "dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.", "Num 24:16": "Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.", "2 Tess 1:2": "Genade zij u, en vrede, van God, onze Vader, en de Heere Jezus Christus.", "Ex 35:31": "En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Spr 15:6": "In het huis van de rechtvaardige is een grote schat; maar in de inkomst van de goddeloze is opschudding.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "Joh 13:3": "Jezus, die wist dat de Vader Hem alle dingen in de handen gegeven had, en dat Hij van God uitgegaan was en tot God heenging,", "Matt 10:29": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader.", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Job 28:10": "In de rotsstenen houwt hij stromen uit, en zijn oog ziet al het kostelijke.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Ps 143:8": "Doe mij Uw goedertierenheid in de morgenstond horen, want ik vertrouw op U; maak mij de weg bekend die ik moet gaan, want ik hef mijn ziel tot U op.", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "2 Kron 31:21": "En in al het werk dat hij begon in de dienst van het huis van God, en in de wet en in het gebod, om zijn God te zoeken, deed hij dat met zijn hele hart, en had voorspoed.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Spr 15:3": "De ogen van de HEERE zijn in alle plaatsen, en zien de kwaden en de goeden.", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Ps 113:6-9": "Die zeer laag ziet, in de hemel en op de aarde. Die de arme uit het stof opricht, en de behoeftige uit de vuilnis verhoogt; Om hem te doen zitten bij de vorsten, bij de vorsten van Zijn volk.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "2 Kor 8:24": "Bewijs dan aan hen het bewijs van uw liefde, en van onze roem over u, ook voor het aangezicht van de gemeenten.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Ex 3:7": "En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "1 Kron 17:1": "Het gebeurde nu, toen David in zijn huis woonde, dat David tegen Nathan, de profeet, zei: Zie, ik woon in een huis van cederhout, maar de ark van het verbond van de HEERE staat onder gordijnen.", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "1 Kron 22:18": "Is de HEERE, uw God, niet met u, en heeft Hij u geen rust gegeven rondom? Want Hij heeft de inwoners van het land in mijn hand gegeven, en dit land is onderworpen geworden voor het aangezicht van de HEERE, en voor het aangezicht van Zijn volk.", "Joh 14:24": "Wie Mij niet liefheeft, bewaart Mijn woorden niet; en het woord dat u hoort, is niet het Mijne, maar dat van de Vader, Die Mij gezonden heeft.", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Jes 60:7": "Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen op Mijn altaar komen, en Ik zal het huis van Mijn heerlijkheid heerlijk maken.", "Rom 1:29": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid;", "Ezech 18:21-23": "Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en recht en gerechtigheid doet, hij zal zeker leven, hij zal niet sterven. Al zijn overtredingen, die hij gedaan heeft, zullen hem niet aangerekend worden; door zijn gerechtigheid, die hij gedaan heeft, zal hij leven. Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "Ps 147:9": "Die het vee zijn voer geeft; aan de jonge raven, als zij roepen.", "Ps 37:28": "Want de HEERE heeft het recht lief, en zal Zijn gunstgenoten niet verlaten; in eeuwigheid worden zij bewaard; maar het nageslacht van de goddelozen wordt uitgeroeid.", "Matt 18:19": "Verder zeg Ik u: als twee van u het op de aarde over enige zaak eens worden waar zij om zouden vragen, dat zal hun gebeuren van Mijn Vader, Die in de hemelen is.", "Joh 12:50": "En Ik weet dat Zijn gebod het eeuwige leven is. Wat Ik dan spreek, dat spreek Ik zoals de Vader Mij gezegd heeft.", "Matt 10:20": "Want u bent het niet die spreekt, maar het is de Geest van uw Vader, Die in u spreekt.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ps 25:2": "Beth. Mijn God! op U vertrouw ik; laat mij niet beschaamd worden; laat mijn vijanden niet van vreugde opspringen over mij.", "Ps 145:18": "Koph. De HEERE is nabij allen die Hem aanroepen, allen die Hem aanroepen in waarheid.", "1 Joh 5:15": "En als wij weten dat Hij ons verhoort, wat wij ook bidden, dan weten wij dat wij de beden verkrijgen die wij van Hem gebeden hebben.", "Ps 68:6": "Hij is een Vader van de wezen, en een Rechter van de weduwen; God, in de woonplaats van Zijn heiligheid.", "2 Kor 4:8": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig;", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Ps 61:8": "Hij zal eeuwig voor Gods aangezicht zitten; bereid goedertierenheid en waarheid, dat zij hem behoeden.", "Ps 37:5": "Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Ps 1:6": "Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "Job 39:8": "Wie heeft de woudezel vrij heengezonden, en wie heeft de banden van de wilde ezel gelost?", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Matt 23:26": "Blinde Farizeeër, reinig eerst wat binnen in de drinkbeker en de schotel is, opdat ook de buitenkant daarvan rein wordt.", "Jer 31:9": "Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "1 Kron 29:14": "Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Ps 56:10": "Dan zullen mijn vijanden achterwaarts keren, ten dage dat ik roepen zal; dit weet ik, dat God met mij is.", "Job 5:9": "Die grote dingen doet, die men niet doorzoeken kan; wonderen, die men niet tellen kan;", "Luk 22:35": "En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.", "Jer 27:2": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.", "Rom 8:29": "Want die Hij van tevoren gekend heeft, die heeft Hij ook van tevoren bestemd om gelijkvormig te zijn aan het beeld van Zijn Zoon, opdat Hij de Eerstgeborene zou zijn onder veel broeders.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Ps 57:2-4": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan. Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien. Hij zal vanuit de hemel zenden, en mij verlossen, en te schande maken hem die mij zoekt te verslinden. Sela. God zal Zijn goedertierenheid en Zijn waarheid zenden.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "2 Kron 18:27": "En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!", "2 Kron 11:16": "Na hen kwamen ook uit alle stammen van Israël naar Jeruzalem, mensen die hun hart erop gericht hadden om de HEERE, de God van Israël, te zoeken, om aan de HEERE, de God van hun vaderen, offers te brengen.", "2 Kon 18:15": "Zo gaf Hizkia al het zilver, dat gevonden werd in het huis van de HEERE, en in de schatten van het huis van de koning.", "1 Kron 24:1": "Wat betreft de kinderen van Aäron: dit waren hun verdelingen. De zonen van Aäron waren Nadab, Abihu, Eleazar en Ithamar.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Joh 17:3": "En dit is het eeuwige leven, dat zij U kennen, de enige waarachtige God, en Jezus Christus, Die U gezonden hebt.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "Hos 1:2": "Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Micha 7:7-9": "Maar ik zal uitzien naar de HEERE, ik zal wachten op de God van mijn heil; mijn God zal mij horen. Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn. Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Matt 18:20": "Want waar twee of drie in Mijn Naam bijeengekomen zijn, daar ben Ik in hun midden.", "1 Tim 4:2": "door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;", "1 Kron 3:1-9": "Dit waren de kinderen van David die hem in Hebron geboren zijn: de eerstgeborene Amnon, van Ahinoam, de Jizreëlietische; de tweede Daniël, van Abigaïl, de Karmelietische; de derde Absalom, de zoon van Maächa, de dochter van Thalmai, de koning van Gesur; de vierde Adonia, de zoon van Haggith; de vijfde Sefatja, van Abital; de zesde Jithream, van zijn vrouw Egla.", "Ps 142:4": "Toen mijn geest in mij overweldigd was, kende U mijn pad. Zij hebben in het geheim een strik voor mij verborgen op de weg die ik zou gaan.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "Openb 3:5": "Wie overwint, die zal bekleed worden met witte kleren; en Ik zal zijn naam beslist niet uitwissen uit het boek van het leven, en Ik zal zijn naam belijden voor Mijn Vader en voor Zijn engelen.", "Ex 38:8": "Hij maakte ook het koperen wasvat, met zijn koperen voet, van de spiegels van de vrouwen die samenkwamen, die samenkwamen voor de deur van de tent van de samenkomst.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Ps 74:7": "Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.", "2 Kon 4:27": "Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.", "Jer 11:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Ps 19:10": "De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Ezech 11:1": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.", "Jes 40:26-28": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist. Waarom zegt u dan, o Jakob! en spreekt, o Israël! mijn weg is voor de HEERE verborgen, en mijn recht gaat aan mijn God voorbij? Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Hos 10:12": "Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.", "Ps 92:11": "Maar U zult mijn hoorn verhogen, zoals de hoorn van een eenhoorn; ik ben met verse olie overgoten.", "Matt 21:22": "En alles wat u in het gebed zult vragen, in geloof, zult u ontvangen.", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "Matt 26:42": "Opnieuw, voor de tweede keer, ging Hij heen en bad, en zei: Mijn Vader! Als deze drinkbeker niet aan Mij voorbij kan gaan zonder dat Ik hem drink, laat Uw wil dan gebeuren!", "Spr 4:23": "Behoed uw hart boven alles wat te bewaren is, want daaruit komt het leven voort.", "Ps 37:25": "Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "Joh 11:52": "en niet alleen voor dat volk, maar ook opdat Hij de kinderen van God die verstrooid waren, tot één zou samenbrengen.", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Jes 30:19": "Want het volk zal in Sion wonen, te Jeruzalem; u zult helemaal niet wenen; zeker zal Hij u genadig zijn op de stem van uw geroep; zodra Hij het horen zal, zal Hij u antwoorden.", "1 Kor 8:6": "toch hebben wij maar één God, de Vader, uit Wie alle dingen zijn, en wij tot Hem; en maar één Heere, Jezus Christus, door Wie alle dingen zijn, en wij door Hem.", "Luk 1:55": "zoals Hij gesproken heeft tot onze vaderen, tot Abraham en zijn nageslacht, tot in eeuwigheid.", "Hebr 6:4-8": "Want het is onmogelijk om hen die eens verlicht zijn geweest, en de hemelse gave geproefd hebben, en deelgenoot geworden zijn van de Heilige Geest, en het goede woord van God geproefd hebben, en de krachten van de toekomende eeuw, en die afvallig worden, opnieuw te vernieuwen tot bekering, omdat zij voor zichzelf de Zoon van God opnieuw kruisigen en openlijk te schande maken.", "Ps 37:22": "Want zijn gezegenden zullen de aarde erfelijk bezitten; maar zijn vervloekten zullen uitgeroeid worden.", "1 Kron 22:13": "Dan zult u voorspoedig zijn, als u erop toeziet om te doen de inzettingen en de rechten die de HEERE aan Mozes geboden heeft over Israël. Wees sterk en heb goede moed, wees niet bevreesd, en wees niet verslagen!", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Gal 1:3": "Genade zij u en vrede van God de Vader, en onze Heere Jezus Christus;", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Ps 33:4": "Want het woord van de HEERE is recht, en al Zijn werk is trouw.", "Jer 51:16": "Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "2 Tim 4:4": "en zij zullen hun oren van de waarheid afkeren, en zich wenden tot fabels.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Num 24:2-4": "Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Ps 91:15": "Hij zal Mij aanroepen, en Ik zal hem verhoren; in de benauwdheid zal Ik bij hem zijn. Ik zal hem eruit trekken, en zal hem verheerlijken.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "Job 4:7-21": "Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd? Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook. Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Hand 16:34": "En hij bracht hen in zijn huis, en zette hun de tafel voor, en verheugde zich dat hij met heel zijn huis gelovig geworden was in God.", "Jes 65:23": "Zij zullen niet tevergeefs arbeiden, noch baren voor verstoring; want zij zijn het nageslacht van de gezegenden van de HEERE, en hun nakomelingen met hen.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "2 Sam 22:2-5": "Hij zei dan: De HEERE is mij mijn Steenrots, en mijn Burg, en mijn Uithelper. God is mijn Rots, ik zal op Hem vertrouwen; mijn Schild en de Hoorn van mijn heil, mijn Hoog Vertrek en mijn Toevlucht, mijn Verlosser! Van geweld hebt U mij verlost! Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.", "Gal 5:5": "Want wij verwachten door de Geest, uit het geloof, de hoop van de rechtvaardigheid.", "Jer 31:37": "Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "2 Kron 7:13-15": "Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend; En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen. Nu zullen Mijn ogen open zijn, en Mijn oren opmerkzaam op het gebed van deze plaats.", "Lev 26:3-13": "Als u in Mijn inzettingen wandelt, en Mijn geboden houdt, en die doet; Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen.", "1 Sam 2:14": "En sloeg die in de teil, of in de ketel, of in de pan, of in de pot; al wat de vork optrok, dat nam de priester voor zich. Zo deden zij aan alle Israëlieten die in Silo kwamen.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Ps 3:6": "Ik lag neer en sliep; ik werd wakker, want de HEERE ondersteunde mij.", "2 Sam 24:12-14": "Ga heen, en spreek tot David: Zo zegt de HEERE: Drie dingen leg Ik u voor; kies u er een van uit, opdat Ik dat u doe. Zo kwam Gad bij David, en maakte het hem bekend, en zei tegen hem: Zal er een hongersnood van zeven jaar in uw land tot u komen? Of wilt u drie maanden vluchten voor uw vijanden, terwijl zij u achtervolgen? Of dat er drie dagen pestilentie in uw land is? Merk nu op, en zie toe, wat antwoord ik terug moet brengen aan Hem die mij gezonden heeft. Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.", "1 Kon 9:3-9": "En de HEERE zei tegen hem: Ik heb uw gebed en uw smeking gehoord, die u voor Mijn aangezicht smekend gedaan hebt; Ik heb dit huis geheiligd, dat u gebouwd hebt, om Mijn Naam daar tot in eeuwigheid te vestigen; en Mijn ogen en Mijn hart zullen daar alle dagen zijn. En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt; Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Gen 50:24": "En Jozef zei tot zijn broeders: Ik sterf; maar God zal u zeker bezoeken, en Hij zal u doen optrekken uit dit land, naar het land, dat Hij aan Abraham, Izak en Jakob gezworen heeft.", "Num 31:48": "Toen kwamen de aanvoerders die over de duizenden van het leger waren, de hoofdlieden der duizenden en de hoofdlieden der honderden, tot Mozes;", "Ex 23:15": "Het feest van de ongezuurde broden zult u houden; zeven dagen zult u ongezuurde broden eten (zoals Ik u geboden heb), op de vastgestelde tijd in de maand Abib, want in die maand bent u uit Egypte getrokken; en men zal niet met lege handen voor Mijn aangezicht verschijnen.", "Ps 32:6": "Hierom zal iedere heilige U aanbidden in de tijd dat U te vinden bent; ja, in een overstroming van grote wateren zullen zij hem niet aanraken.", "Ex 40:21": "En hij bracht de ark in de tabernakel, en hij hing het voorhangsel op als bedekking, en bedekte de ark der getuigenis, zoals de HEERE aan Mozes geboden had.", "Ezra 9:9": "Want wij zijn knechten; maar in onze dienstbaarheid heeft onze God ons niet verlaten; maar Hij heeft weldadigheid tot ons geneigd voor het aangezicht van de koningen van Perzië, dat Hij ons een weinig leven zou geven, om het huis van onze God te verhogen, en de woestenijen ervan op te richten, en om ons een muur te geven in Juda en te Jeruzalem.", "Ps 35:10": "Al mijn beenderen zullen zeggen: HEERE, wie is U gelijk! U, Die de ellendige redt van hem die sterker is dan hij, en de ellendige en de nooddruftige van zijn berover.", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "1 Kon 16:1-4": "Toen kwam het woord van de HEERE tot Jehu, de zoon van Hanani, tegen Baësa, en Hij zei: Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden; Zie, zo zal Ik de nakomelingen van Baësa, en de nakomelingen van zijn huis wegdoen; en Ik zal uw huis maken zoals het huis van Jerobeam, de zoon van Nebat.", "Pred 11:2": "Geef een deel aan zeven, ja, ook aan acht; want u weet niet wat voor kwaad er op de aarde zal zijn.", "Ps 61:5": "Ik zal in Uw hut verkeren in eeuwigheden; ik zal mijn toevlucht nemen in het verborgene van Uw vleugels. Sela.", "Ps 62:2": "Zeker, mijn ziel is stil bij God; van Hem is mijn heil.", "Gen 16:13": "En zij noemde de Naam van de HEERE, Die tot haar sprak: U bent de God van het aanzien! want zij zei: Heb ik ook hier gezien naar Hem, Die mij aanziet?", "Rom 1:2": "(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),", "2 Sam 7:4-12": "Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen? Want Ik heb in geen huis gewoond, vanaf de dag dat Ik de kinderen van Israël uit Egypte opvoerde, tot op deze dag; maar Ik heb rondgetrokken in een tent en in een tabernakel.", "1 Kron 16:15": "Gedenkt tot in eeuwigheid van Zijn verbond, van het woord dat Hij ingesteld heeft tot in het duizendste geslacht;", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Job 29:5": "Toen de Almachtige nog met mij was, en mijn jongens rondom mij;", "Matt 24:34": "Voorwaar, Ik zeg u: dit geslacht zal beslist niet voorbijgaan, totdat al deze dingen gebeurd zijn.", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "1 Tess 2:4": "maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft.", "Ef 6:23": "Vrede zij de broeders, en liefde met geloof, van God de Vader, en de Heere Jezus Christus.", "Joz 23:14": "En ziet, ik ga heden in de weg van de hele aarde; en u weet in uw hele hart en in uw hele ziel, dat er niet één woord gevallen is van al die goede woorden, die de HEERE, uw God, over u gesproken heeft; zij zijn u alle overkomen; er is daarvan niet één woord gevallen.", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Joh 8:41": "U doet de werken van uw vader. Zij zeiden dan tegen Hem: Wij zijn niet uit hoererij geboren; wij hebben één Vader, namelijk God.", "2 Petr 2:12-17": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Joh 16:24": "Tot nu toe hebt u niets gebeden in Mijn Naam; bid, en u zult ontvangen, opdat uw blijdschap volkomen is.", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "Matt 22:41-46": "Toen de Farizeeën bijeengebracht waren, vroeg Jezus hun, En zei: Wat denkt u van de Christus? Wiens Zoon is Hij? Zij zeiden tegen Hem: De Zoon van David. Hij zei tegen hen: Hoe noemt David Hem dan, in de Geest, zijn Heere? Hij zei immers:", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Openb 10:7": "maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.", "2 Sam 7:3": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u.", "Hand 1:4": "En toen Hij met hen vergaderd was, beval Hij hun dat zij niet uit Jeruzalem weg zouden gaan, maar de belofte van de Vader verwachten, die u, zei Hij, van Mij gehoord hebt.", "Hebr 8:2": "Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.", "Hebr 1:6": "En als Hij de Eerstgeborene opnieuw in de wereld inbrengt, zegt Hij: En dat alle engelen van God Hem aanbidden.", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Dan 6:21-23": "Toen hij nu bij de kuil gekomen was, riep hij naar Daniël met droevige stem; de koning antwoordde en zei tegen Daniël: O Daniël, dienaar van de levende God! heeft ook uw God, Die u voortdurend eert, u uit de macht van de leeuwen kunnen verlossen? Toen sprak Daniël tegen de koning: O koning, leef voor eeuwig! Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "2 Kon 12:18": "Maar Joas, de koning van Juda, nam al de geheiligde dingen die Josafat, en Joram, en Ahazia, zijn vaderen, de koningen van Juda, geheiligd hadden, en zijn eigen geheiligde dingen, en al het goud dat gevonden werd in de schatten van het huis van de HEERE en van het huis van de koning, en zond het aan Hazaël, de koning van Syrië; toen trok hij weg van Jeruzalem.", "Ezech 16:62": "Want Ik zal Mijn verbond met u oprichten, en u zult weten dat Ik de HEERE ben;", "Num 18:5": "U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Ps 118:14": "De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.", "Ps 109:6-19": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "1 Tim 6:18": "dat zij goed doen, rijk worden in goede werken, vrijgevig zijn en bereid om te delen;", "Kol 4:12": "U groet Epafras, die één van u is, een dienstknecht van Christus, die altijd voor u strijdt in de gebeden, opdat u volmaakt en volkomen mag staan in heel de wil van God.", "Gen 49:11": "Hij bindt zijn jonge ezel aan de wijnstok, en het veulen van zijn ezelin aan de edelste wijnstok; hij wast zijn kleed in de wijn, en zijn mantel in wijndruivenbloed.", "Ex 3:9": "En nu, zie, het geschrei van de kinderen van Israël is tot Mij gekomen; en ook heb Ik de verdrukking gezien waarmee de Egyptenaren hen verdrukken.", "Spr 5:21": "Want de wegen van ieder mens zijn voor de ogen van de HEERE, en Hij weegt al zijn gangen.", "2 Tess 1:1": "Paulus, en Silvanus, en Timotheüs, aan de Gemeente van de Thessalonicenzen, die is in God, onze Vader, en de Heere Jezus Christus:", "Spr 10:27": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort.", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "1 Joh 3:20": "Want als ons hart ons veroordeelt, God is meer dan ons hart, en Hij kent alle dingen.", "2 Tim 2:1": "U dan, mijn zoon, word gesterkt in de genade die in Christus Jezus is;", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "Lev 19:19": "U zult Mijn inzettingen houden; u zult uw vee niet van twee verschillende soorten met elkaar laten paren; uw akker zult u niet met tweeërlei zaad bezaaien, en een kleed van twee soorten stof, dooreen vermengd, zal u niet aandoen.", "Spr 16:1": "De mens heeft plannen van het hart; maar het antwoord van de tong is van de HEERE.", "Dan 2:19": "Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Rom 9:8": "Dat is: niet de kinderen van het vlees zijn kinderen van God, maar de kinderen van de belofte worden als nageslacht gerekend.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Joh 3:33": "Wie Zijn getuigenis aangenomen heeft, die heeft verzegeld dat God waarachtig is.", "Gen 28:13": "En zie, de HEERE stond boven op de ladder en zei: Ik ben de HEERE, de God van uw vader Abraham, en de God van Izak; dit land, waarop u ligt te slapen, zal Ik aan u geven, en aan uw nageslacht.", "2 Kron 15:1": "Toen kwam de Geest van God op Azaria, de zoon van Oded.", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Ezra 8:26": "ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten;", "Jes 38:16": "Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.", "1 Joh 3:17": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem?", "Ex 15:1-19": "Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen. De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen! De HEERE is een krijgsman; HEERE is Zijn Naam!", "Joz 23:6": "Zo weest zeer sterk, om te bewaren en om te doen alles, wat geschreven is in het wetboek van Mozes; opdat u daarvan niet afwijkt naar rechts noch naar links;", "Zach 10:6": "En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren.", "Ezech 16:60": "Toch zal Ik denken aan Mijn verbond met u, in de dagen van uw jeugd, en Ik zal met u een eeuwig verbond oprichten.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Hebr 12:9": "Verder, wij hebben de vaders van ons vlees wel als kastijders gehad, en wij hadden ontzag voor hen; zullen wij dan niet veel meer onderworpen zijn aan de Vader van de geesten, en leven?", "Ps 18:3": "De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "Jer 22:16": "Hij heeft de rechtszaak van de ellendige en behoeftige berecht, toen ging het hem goed; is dat niet Mij kennen? spreekt de HEERE.", "Ps 89:9": "O HEERE, God van de heerscharen! Wie is als Gij, grootmachtig, o HEERE! en Uw getrouwheid is rondom U.", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Gal 5:3": "En ik verklaar opnieuw aan ieder mens die zich laat besnijden, dat hij verplicht is de hele wet te doen.", "Ps 147:10": "Hij heeft geen behagen in de sterkte van het paard; Hij schept geen vreugde in de benen van de man.", "Spr 8:34": "Gelukkig is de mens die naar Mij hoort, dagelijks wakend aan Mijn poorten, wachtend bij de posten van Mijn deuren.", "Ps 89:32": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "Ezech 11:24": "Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Deut 4:35": "Aan u is het getoond, opdat u weet dat de HEERE die God is; er is niemand anders dan Hij alleen!", "Deut 4:29": "Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Matt 6:5-13": "En wanneer u bidt, wees dan niet zoals de geveinsden; want die bidden graag terwijl ze in de synagogen en op de hoeken van de straten staan, opdat zij door de mensen gezien worden. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben. Maar u, wanneer u bidt, ga in uw binnenkamer, en sluit uw deur, en bid tot uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden. En als u bidt, gebruik dan geen zinloze herhaling van woorden, zoals de heidenen; want zij menen dat zij vanwege hun veelheid van woorden verhoord zullen worden.", "1 Sam 16:12": "Toen stuurde hij iemand, en liet hem komen; hij nu was roodachtig, en had daarbij mooie ogen en een knap voorkomen; en de HEERE zei: Sta op, zalf hem, want deze is het.", "Joh 6:31": "Onze vaders hebben het manna gegeten in de woestijn, zoals geschreven is: Hij gaf hun brood uit de hemel te eten.", "1 Kron 22:19": "Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.", "2 Tess 1:5-9": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Ps 72:1": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning.", "Jes 45:19": "Ik heb niet in het verborgene gesproken, op een donkere plaats van de aarde; Ik heb tegen het zaad van Jakob niet gezegd: Zoekt Mij tevergeefs; Ik ben de HEERE, Die gerechtigheid spreekt, Die rechtmatige dingen verkondigt.", "Matt 7:11": "Als u dan, die slecht bent, uw kinderen goede gaven weet te geven, hoeveel te meer zal uw Vader, Die in de hemelen is, goede gaven geven aan hen die ze van Hem vragen!", "Deut 31:7": "En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven.", "1 Kon 7:48-50": "Ook maakte Salomo alle voorwerpen die voor het huis van de HEERE bestemd waren: het gouden altaar, en de gouden tafel waarop de toonbroden lagen; En de kandelaars, vijf aan de rechterkant, en vijf aan de linkerkant, voor het binnenste heiligdom, van zuiver goud; en de bloemen, de lampen, en de snuiters van goud; Alsook de schalen, de vorken, de sprenkelschalen, de rookschalen, en de wierookvaten, van zuiver goud; daartoe de scharnieren van de deuren van het binnenste huis, het heilige der heiligen, en van de deuren van het huis van de tempel, van goud.", "Num 10:29": "Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Spr 11:5-8": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "1 Kron 23:2": "En hij verzamelde alle vorsten van Israël, ook de priesters en de Levieten.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Neh 2:20": "Toen gaf ik hun antwoord, en zei tegen hen: De God van de hemel, Hij zal het ons doen gelukken, en wij, Zijn dienaren, zullen opstaan en bouwen; maar u hebt geen deel, geen recht, en geen aandenken in Jeruzalem.", "Jer 29:30": "Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Ezech 3:20": "Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "1 Sam 19:20": "Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.", "Jes 63:8": "Want Hij zei: Zij zijn zeker Mijn volk, kinderen die niet liegen zullen? Zo is Hij hun geworden tot een Heiland.", "Ezech 33:14-16": "Als Ik ook tegen de goddeloze zeg: U zult zeker sterven! en hij zich van zijn zonde bekeert en recht en gerechtigheid doet; Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven. Aan al zijn zonden die hij gezondigd heeft, zal niet meer gedacht worden; hij heeft recht en gerechtigheid gedaan, hij zal zeker leven.", "Amos 9:1": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "2 Kor 4:9": "Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven;", "1 Kron 29:16": "HEERE, onze God, al deze overvloed die wij klaargemaakt hebben om U een huis te bouwen, voor de Naam van Uw heiligheid, dat komt van Uw hand, en het is alles van U.", "Luk 11:5-13": "En Hij zei tegen hen: Wie van u zal een vriend hebben, en zal midden in de nacht naar hem toe gaan, en tegen hem zeggen: Vriend! leen mij drie broden; Omdat mijn vriend van de reis bij mij gekomen is, en ik heb niets, dat ik hem kan voorzetten; En dat die van binnen dan zou antwoorden en zeggen: Val mij niet lastig; de deur is al gesloten, en mijn kinderen zijn met mij in de slaapkamer; ik kan niet opstaan om u te geven.", "Amos 7:14": "Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "1 Kron 28:4-6": "Nu heeft de HEERE, de God van Israël, mij verkoren uit het hele huis van mijn vader om koning te zijn over Israël, voor eeuwig; want Hij heeft Juda verkoren tot leider, en uit het huis van Juda het huis van mijn vader; en onder de zonen van mijn vader heeft Hij een welgevallen aan mij gehad, om mij koning te maken over heel Israël. En uit al mijn zonen (want de HEERE heeft mij veel zonen gegeven) heeft Hij mijn zoon Salomo verkoren, dat hij zou zitten op de troon van het koninkrijk van de HEERE over Israël. En Hij heeft tegen mij gezegd: Uw zoon Salomo, die zal Mijn huis en Mijn voorhoven bouwen; want Ik heb hem voor Mij verkoren tot een zoon, en Ik zal hem tot een Vader zijn.", "Deut 2:7": "Want de HEERE, uw God, heeft u gezegend in al het werk van uw hand; Hij kent uw wandelen door deze zo grote woestijn; deze veertig jaren is de HEERE, uw God, met u geweest; niets heeft u ontbroken.", "Zach 9:11": "U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Spr 13:21": "Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.", "Ps 140:13": "Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Lev 26:4-6": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen. Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Ps 27:5": "Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "Ezech 11:4": "Daarom, profeteer tegen hen; profeteer, o mensenkind!", "Ezech 2:1": "En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.", "Ps 40:4": "En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.", "1 Kron 22:10": "Die zal voor Mijn Naam een huis bouwen, en die zal Mij tot een zoon zijn, en Ik hem tot een Vader; en Ik zal de troon van zijn rijk over Israël bevestigen tot in eeuwigheid.", "1 Kon 11:4": "Want het gebeurde in de tijd van Salomo's ouderdom, dat zijn vrouwen zijn hart deden neigen naar andere goden; zodat zijn hart niet volkomen was met de HEERE, zijn God, zoals het hart van zijn vader David.", "Ps 130:6": "Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen.", "Jes 55:10": "Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter;", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "Ezech 3:22": "En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.", "Ps 116:1-15": "Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen; want Hij neigt Zijn oor tot mij; daarom zal ik Hem in mijn dagen aanroepen. De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Openb 1:20": "de verborgenheid van de zeven sterren die u gezien hebt in Mijn rechterhand, en de zeven gouden kandelaren. De zeven sterren zijn de engelen van de zeven gemeenten; en de zeven kandelaren die u gezien hebt, zijn de zeven gemeenten.", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Gen 20:6": "En God zei tegen hem in de droom: Ik heb ook geweten dat u dit in oprechtheid van uw hart gedaan hebt, en Ik heb u ook belet om tegen Mij te zondigen; daarom heb Ik u niet toegelaten haar aan te raken.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "1 Kron 22:9": "Zie, de zoon die u geboren zal worden, die zal een man van rust zijn, want Ik zal hem rust geven van al zijn vijanden rondom; want zijn naam zal Salomo zijn, en Ik zal vrede en rust over Israël geven in zijn dagen.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Matt 6:30-33": "Als God nu het gras van het veld, dat er vandaag is en morgen in de oven geworpen wordt, zo kleedt, zal Hij u niet veel meer kleden, kleingelovigen? Wees daarom niet bezorgd en zeg niet: Wat zullen wij eten, of wat zullen wij drinken, of waarmee zullen wij ons kleden? Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt.", "Gen 2:16": "En de HEERE God gebood de mens en zei: Van elke boom van deze hof mag u vrijelijk eten;", "Jes 11:5": "Want gerechtigheid zal de gordel van Zijn lendenen zijn; ook zal de trouw de gordel van Zijn lendenen zijn.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Ps 38:10": "Heere! Voor U is al mijn verlangen; en mijn zuchten is voor U niet verborgen.", "Jer 23:9": "Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "2 Kron 6:4-15": "En hij zei: Geloofd zij de HEERE, de God van Israël, Die met Zijn mond tot mijn vader David gesproken heeft, en het met Zijn handen vervuld heeft, en zei: Vanaf de dag dat Ik Mijn volk uit Egypteland uitgevoerd heb, heb Ik geen stad verkoren uit alle stammen van Israël om een huis te bouwen, dat Mijn Naam daar zou zijn; en geen man verkoren om een leider te zijn over Mijn volk Israël. Maar Ik heb Jeruzalem verkoren, dat Mijn Naam daar zou zijn; en Ik heb David verkoren, dat hij over Mijn volk Israël zou zijn.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Luk 1:70": "zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "Luk 24:49": "En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte.", "1 Kon 1:47": "Ook zijn de knechten van de koning gekomen om onze heer, de koning David, te zegenen, en zeiden: Uw God make de naam van Salomo beter dan uw naam, en make zijn troon groter dan uw troon; en de koning heeft zich neergebogen op het bed.", "Job 29:19": "Mijn wortel was uitgebreid tot aan het water, en dauw vernachtte op mijn tak.", "2 Kon 17:37": "En de inzettingen, en de rechten, en de wet, en het gebod, die Hij u geschreven heeft, zult u in acht nemen om ze te doen, alle dagen; en u zult geen andere goden vrezen.", "2 Tim 4:3": "Want er zal een tijd komen dat zij de gezonde leer niet zullen verdragen, maar doordat hun oren jeuken, zullen zij zich naar hun eigen begeerten leraars in menigte bijeenzoeken;", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Joz 24:15": "Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen!", "Ps 86:7": "In de dag van mijn benauwdheid roep ik U aan, want Gij verhoort mij.", "1 Kon 15:15": "En hij bracht in het huis van de HEERE de geheiligde dingen van zijn vader, en zijn eigen geheiligde dingen: zilver, en goud, en vaten.", "Jes 19:20": "En het zal zijn tot een teken, en tot een getuigenis voor de HEERE van de heerscharen in Egypteland, want zij zullen tot de HEERE roepen vanwege de verdrukkers, en Hij zal hun een Heiland en Meester zenden, Die hen zal verlossen.", "Ps 147:4": "Hij telt het aantal van de sterren; Hij noemt ze allemaal bij hun naam.", "Ps 111:7-9": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar. Samech. Ze zijn ondersteund voor altijd en in eeuwigheid; Ain. gedaan in waarheid en oprechtheid. Pe. Hij heeft Zijn volk verlossing gezonden; Tsade. Hij heeft Zijn verbond in eeuwigheid geboden; Koph. Zijn Naam is heilig en ontzagwekkend.", "Spr 28:5": "De kwade mensen begrijpen het recht niet; maar wie de HEERE zoeken, begrijpen alles.", "Neh 1:8-10": "Denk toch aan het woord, dat U Uw dienaar Mozes geboden hebt, en zei: Als u ontrouw wordt, zal Ik u onder de volken verstrooien. Maar als u zich tot Mij bekeert, en Mijn geboden houdt, en die doet; al waren uw verdrevenen aan het einde van de hemel, Ik zal hen vandaar verzamelen, en zal ze brengen naar de plaats die Ik g
