en zestien hoofden van de families, maar van de kinderen van Ithamar, naar hun families, acht.","5":"En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.","6":"En Semaja, de zoon van Nethaneel, de schrijver, uit de Levieten, schreef hen op, voor het aangezicht van de koning, en van de vorsten, en van de priester Zadok, en van Achimelech, de zoon van Abjathar, en van de familiehoofden onder de priesters en onder de Levieten; één familie werd genomen voor Eleazar, en zo ook werd er één genomen voor Ithamar.","7":"Het eerste lot nu ging uit voor Jojarib, het tweede voor Jedaja,","8":"Het derde voor Harim, het vierde voor Seorim,","9":"Het vijfde voor Malchia, het zesde voor Mijamin,","10":"Het zevende voor Hakkoz, het achtste voor Abia,","11":"Het negende voor Jesua, het tiende voor Sechanja,","12":"Het elfde voor Eljasib, het twaalfde voor Jakim,","13":"Het dertiende voor Huppa, het veertiende voor Jesebeab,","14":"Het vijftiende voor Bilga, het zestiende voor Immer,","15":"Het zeventiende voor Hezir, het achttiende voor Happizzes,","16":"Het negentiende voor Petahja, het twintigste voor Jehezkel,","17":"Het eenentwintigste voor Jachin, het tweeëntwintigste voor Gamul,","18":"Het drieëntwintigste voor Delaja, het vierentwintigste voor Maazja.","19":"Het ambt van dezen in hun dienst was: gaan in het huis van de HEERE, naar hun ordening door de hand van Aäron, hun vader; zoals de HEERE, de God van Israël, hem geboden had.","20":"Wat betreft de overige kinderen van Levi: van de kinderen van Amram was Subael, van de kinderen van Subael was Jechdeja.","21":"Aangaande Rehabja: van de kinderen van Rehabja was Jissia het hoofd.","22":"Van de Jizharieten was Selomoth; van de kinderen van Selomoth was Jahath.","23":"En van de kinderen van Hebron was Jeria de eerste, Amarja de tweede, Jahaziel de derde, Jekameam de vierde.","24":"Van de kinderen van Uzziël was Micha; van de kinderen van Micha was Samir;","25":"De broer van Micha was Jissia; van de kinderen van Jissia was Zecharja.","26":"De kinderen van Merari waren Maheli en Musi. De kinderen van Jaazia waren Beno.","27":"De kinderen van Merari van Jaazia waren Beno, Soham, Zakkur en Hibri.","28":"Van Maheli was Eleazar; en die had geen kinderen.","29":"Aangaande Kis: de kinderen van Kis waren Jerahmeel.","30":"En de kinderen van Musi waren Maheli, Eder en Jeremoth. Dezen zijn de kinderen van de Levieten, naar hun families.","31":"En zij wierpen ook loten, samen met hun broeders, de zonen van Aäron, voor het aangezicht van koning David, en Zadok, en Achimelech, en van de familiehoofden onder de priesters en onder de Levieten; het familiehoofd tegenover zijn jongste broer."},"SV":{"1":"Aangaande nu de kinderen van Aäron, *dit* waren hun verdelingen. De zonen van Aäron waren Nadab, en Abihu, Eleazar en Ithamar.","2":"Maar Nadab stierf, en Abihu, voor het aangezicht huns vaders, en zij hadden geen kinderen. En Eleazar en Ithamar bedienden het priesterambt.","3":"David nu verdeelde hen, en Zadok uit de kinderen van Eleazar, en Abimelech uit de kinderen van Ithamar, naar hun ambt in hun dienst.","4":"En van de kinderen van Eleazar werden meer gevonden tot hoofden der mannen, dan van de kinderen van Ithamar, als zij hen afdeelden; van de kinderen van Eleazar waren zestien hoofden der vaderlijke huizen, maar van de kinderen van Ithamar, naar hun vaderlijke huizen, acht.","5":"En zij deelden hen door loten af, dezen met genen; want de oversten des heiligdoms en de oversten Gods waren uit de kinderen van Eleazar en van de kinderen van Ithamar.","6":"En Semaja, de zoon van Nethaneel, de schrijver, uit de Levieten, schreef hen op, voor het aangezicht des konings, en van de vorsten, en van den priester Zadok, en van Achimelech, den zoon van Abjathar, en van de hoofden der vaderen onder de priesters en onder de Levieten; een vaderlijk huis werd genomen voor Eleazar, en desgelijks werd genomen voor Ithamar.","7":"Het eerste lot nu ging uit voor Jojarib, het tweede voor Jedaja,","8":"Het derde voor Harim, het vierde voor Seorim,","9":"Het vijfde voor Malchia, het zesde voor Mijamin,","10":"Het zevende voor Hakkoz, het achtste voor Abia,","11":"Het negende voor Jesua, het tiende voor Sechanja,","12":"Het elfde voor Eljasib, het twaalfde voor Jakim,","13":"Het dertiende voor Huppa, het veertiende voor Jesebeab,","14":"Het vijftiende voor Bilga, het zestiende voor Immer,","15":"Het zeventiende voor Hezir, het achttiende voor Happizzes,","16":"Het negentiende voor Petahja, het twintigste voor Jehezkel,","17":"Het een en twintigste voor Jachin, het twee en twintigste voor Gamul,","18":"Het drie en twintigste voor Delaja, het vier en twintigste voor Maazja.","19":"Het ambt van dezen in hun dienst was te gaan in het huis des HEEREN, naar hun ordening door de hand van Aäron, huns vaders; gelijk als hem de HEERE, de God Israëls, geboden had.","20":"Van de overige kinderen van Levi nu, was van de kinderen van Amram Subael, van de kinderen van Subael was Jechdeja.","21":"Aangaande Rehabja: van de kinderen van Rehabja was Jissia het hoofd.","22":"Van de Jizharieten was Selomoth; van de kinderen van Selomoth was Jahath.","23":"En van de kinderen van *Hebron* was Jeria de *eerste*, Amarja de tweede, Jahaziel de derde, Jekameam de vierde.","24":"*Van* de kinderen van Uzziël was Micha; van de kinderen van Micha was Samir;","25":"De broeder van Micha was Jissia; van de kinderen van Jissia was Zecharja.","26":"De kinderen van Merari waren Maheli en Musi. De kinderen van Jaazia waren Beno.","27":"De kinderen van Merari van Jaazia waren Beno, en Soham, en Zakkur, en Hibri.","28":"Van Maheli was Eleazar; en die had geen kinderen.","29":"Aangaande Kis: de kinderen van Kis waren Jerahmeel.","30":"En de kinderen van Musi waren Maheli, en Eder, en Jeremoth. Dezen zijn de kinderen der Levieten, naar hun vaderlijke huizen.","31":"En zij wierpen ook loten, nevens hun broederen, de zonen van Aäron, voor het aangezicht van den koning David, en Zadok, en Achimelech, en van de hoofden der vaderen onder de priesteren en onder de Levieten; het hoofd der vaderen tegen zijn kleinsten broeder."},"KJV":{"1":"Now these are the divisions of the sons of Aaron. The sons of Aaron; Nadab, and Abihu, Eleazar, and Ithamar.","2":"But Nadab and Abihu died before their father, and had no children: therefore Eleazar and Ithamar executed the priest's office.","3":"And David distributed them, both Zadok of the sons of Eleazar, and Ahimelech of the sons of Ithamar, according to their offices in their service.","4":"And there were more chief men found of the sons of Eleazar than of the sons of Ithamar; and thus were they divided. Among the sons of Eleazar there were sixteen chief men of the house of their fathers, and eight among the sons of Ithamar according to the house of their fathers.","5":"Thus were they divided by lot, one sort with another; for the governors of the sanctuary, and governors of the house of God, were of the sons of Eleazar, and of the sons of Ithamar.","6":"And Shemaiah the son of Nethaneel the scribe, one of the Levites, wrote them before the king, and the princes, and Zadok the priest, and Ahimelech the son of Abiathar, and before the chief of the fathers of the priests and Levites: one principal household being taken for Eleazar, and one taken for Ithamar.","7":"Now the first lot came forth to Jehoiarib, the second to Jedaiah,","8":"The third to Harim, the fourth to Seorim,","9":"The fifth to Malchijah, the sixth to Mijamin,","10":"The seventh to Hakkoz, the eighth to Abijah,","11":"The ninth to Jeshua, the tenth to Shecaniah,","12":"The eleventh to Eliashib, the twelfth to Jakim,","13":"The thirteenth to Huppah, the fourteenth to Jeshebeab,","14":"The fifteenth to Bilgah, the sixteenth to Immer,","15":"The seventeenth to Hezir, the eighteenth to Aphses,","16":"The nineteenth to Pethahiah, the twentieth to Jehezekel,","17":"The one and twentieth to Jachin, the two and twentieth to Gamul,","18":"The three and twentieth to Delaiah, the four and twentieth to Maaziah.","19":"These were the orderings of them in their service to come into the house of the LORD, according to their manner, under Aaron their father, as the LORD God of Israel had commanded him.","20":"And the rest of the sons of Levi were these: Of the sons of Amram; Shubael: of the sons of Shubael; Jehdeiah.","21":"Concerning Rehabiah: of the sons of Rehabiah, the first was Isshiah.","22":"Of the Izharites; Shelomoth: of the sons of Shelomoth; Jahath.","23":"And the sons of Hebron; Jeriah the first, Amariah the second, Jahaziel the third, Jekameam the fourth.","24":"Of the sons of Uzziel; Michah: of the sons of Michah; Shamir.","25":"The brother of Michah was Isshiah: of the sons of Isshiah; Zechariah.","26":"The sons of Merari were Mahli and Mushi: the sons of Jaaziah; Beno.","27":"The sons of Merari by Jaaziah; Beno, and Shoham, and Zaccur, and Ibri.","28":"Of Mahli came Eleazar, who had no sons.","29":"Concerning Kish: the son of Kish was Jerahmeel.","30":"The sons also of Mushi; Mahli, and Eder, and Jerimoth. These were the sons of the Levites after the house of their fathers.","31":"These likewise cast lots over against their brethren the sons of Aaron in the presence of David the king, and Zadok, and Ahimelech, and the chief of the fathers of the priests and Levites, even the principal fathers over against their younger brethren."}},"tsk":{"1":[{"kopje":"verdelingen","refs":["1 Kron 23:6"]},{"kopje":"de zonen","refs":["1 Kron 6:3","Ex 6:22","Ex 28:1","Lev 10:1-6","Num 3:2","Num 26:60"]}],"2":[{"kopje":"Nadab","refs":["Ex 24:1","Ex 24:9"]},{"kopje":"stierf","refs":["Lev 10:2","Num 3:4","Num 26:61"]},{"kopje":"Eleazar","refs":["Ex 29:9","Lev 10:12","Num 16:39","Num 16:40","Num 18:7"]}],"3":[{"kopje":"Zadok","refs":["1 Kron 24:6","1 Kron 24:31","1 Kron 6:4-8","1 Kron 6:50-53","1 Kron 12:27","1 Kron 12:28","1 Kron 15:11","1 Kron 16:39" , dubbel genomen is; anderen, dat hetgeen tevoren voor hem genomen was, voor hem nu genomen bleEf."}],"7":[{"catchword":"ging uit voor Jójarib,","tekst":"Men trok het lot uit emmers, of uit enig ander vat."}],"10":[{"catchword":"Hakkoz,","tekst":"Of, Koz."},{"catchword":"Abia,","tekst":"Van deze Abia — dagordening of beurt en van diens nakomelingen was Zacharias, de vader van Johannes den Doper, Luk 1:5 ."}],"15":[{"catchword":"Happizzes,","tekst":"Anders, Pitses."}],"19":[{"catchword":"te gaan","tekst":"Te weten, op den sabbat, en zij bleven daar de gehele week door, tot aan den anderen sabbat, en dat ging alzo met beurten onder hen om. Zie 2Ki 11:5 , en 1Ch 9:25 ."},{"catchword":"door de hand","tekst":"Dat is, zoals hetzelfde recht door Aäron was onderhouden, volgens de ordinantie Gods, gelijk volgt. Anders, onder de hand Aärons, dat is, onder het beleid Aärons. Verstaande van een van de nakomelingen Aärons, die het ambt des hogepriesters bediende, en Aäron daarin gevolgd was."},{"catchword":"hem de HEERE,","tekst":"Te weten, Aäron."}],"20":[{"catchword":"Van de overige","tekst":"Boven, 1Ch 23 zijn de Gersonieten beschreven; nu worden hier beschreven de Kahathieten en Merarieten, die de twee andere geslachten der Levieten waren."},{"catchword":"Súbaël,","tekst":"Hij wordt 1Ch 23:16 Sebuel genoemd; hij is geweest Mozes' zoonszoon, en alzo van de nakomelingen van Amram."}],"23":[{"catchword":"En van de kinderen","tekst":"Dit vs. wordt hier alzo aangevuld uit 1Ch 23:19 , en 1Ch 26:31 ."}],"26":[{"catchword":"kinderen van Merári","tekst":"Van hier voort stelt hij de overige zonen der Levieten van het huis Merari."},{"catchword":"De kinderen van Jaäzia","tekst":"Anders, en de zoon van Jaäzia zijns [te weten van Merari] zoons."}],"31":[{"catchword":"En zij wierpen","tekst":"De zin dezer woorden is, dat er zoveel hopen en beurten dezer Levieten waren, als er beurten der priesters waren, opdat elke beurt der priesters hun eigen hoop of beurt der Levieten had, om hen te dienen in het uitvoeren huns priesterambts. En alzo er vier en twintig beurten der priesters waren, alzo zijn er ook vier en twintig beurten dezer Levieten geweest waarvan de meesten hier, en de rest in vs.8-10 verhaald worden."},{"catchword":"nevens hun broederen,","tekst":"Of, tegenover, gelijkvormig."},{"catchword":"het hoofd der vaderen","tekst":"Dat is, de kleinste broeder even zowel als de oversten onder de vaderen. Anders, Aboth het hoofd, houdende hetzelve voor een eigennaam."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now concerning the children of Aaron, (these) were their divisions: The sons of Aaron were Nadab, and Abihu, Elezar; and Itharmar."}],"2":[{"catchword":null,"tekst":"But Nadab and Abihu died before the face of their Father, [That is, in the presence of their Father: Or in the life-time of their Father. See Gen 11:28.] and they had no children: And Eleazar and Itharmar administered the Priests office."}],"3":[{"catchword":null,"tekst":"Now David divided them, both Zadok of the children of Eleazar, and Ahimelech of the children of Itharmar, [Compare herewith below.v.6.31. where it is said that they were lifted or written down, and that the lots were cast before the face of David, and Zadok and Ahimelech, &c.] according to their office [or, according to their service."}],"4":[{"catchword":null,"tekst":"And of the children [That is, posterity; and so in the sequel] of Eleazar (there) were more found (to be) heads of men, then of the children of Itharmar, [To wit, as many more, as immediately followeth] when they divided them: [to wit, those that are numbered v.3.] of the children of Eleazar there were sixteen heads of (their) Fatherly houses, but of the children of Itharmar, according to their Fathers houses, (there were) eight."}],"5":[{"catchword":null,"tekst":"And they divided them [To wit, those that are named, v.3.] by lots, [as for the order and distinction among them, they left that to God, who ruleth and disposeth the Lots as se // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

function toggle(n) {
  const paneel = document.getElementById('p' + n);

    document.getElementById('p' + openVers).classList.remove('open');

document.addEventListener('click', e => {

  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
