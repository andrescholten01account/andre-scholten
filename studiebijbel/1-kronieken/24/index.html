ron: dit waren hun verdelingen. De zonen van Aäron waren Nadab, Abihu, Eleazar en Ithamar.", "2": "Maar Nadab stierf, en Abihu, voor het aangezicht van hun vader, en zij hadden geen kinderen. En Eleazar en Ithamar bedienden het priesterambt.", "3": "David nu verdeelde hen, en Zadok uit de kinderen van Eleazar, en Abimelech uit de kinderen van Ithamar, naar hun ambt in hun dienst.", "4": "En van de kinderen van Eleazar werden meer hoofden van de mannen gevonden dan van de kinderen van Ithamar, toen zij hen indeelden; van de kinderen van Eleazar waren zestien hoofden van de families, maar van de kinderen van Ithamar, naar hun families, acht.", "5": "En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.", "6": "En Semaja, de zoon van Nethaneel, de schrijver, uit de Levieten, schreef hen op, voor het aangezicht van de koning, en van de vorsten, en van de priester Zadok, en van Achimelech, de zoon van Abjathar, en van de familiehoofden onder de priesters en onder de Levieten; één familie werd genomen voor Eleazar, en zo ook werd er één genomen voor Ithamar.", "7": "Het eerste lot nu ging uit voor Jojarib, het tweede voor Jedaja,", "8": "Het derde voor Harim, het vierde voor Seorim,", "9": "Het vijfde voor Malchia, het zesde voor Mijamin,", "10": "Het zevende voor Hakkoz, het achtste voor Abia,", "11": "Het negende voor Jesua, het tiende voor Sechanja,", "12": "Het elfde voor Eljasib, het twaalfde voor Jakim,", "13": "Het dertiende voor Huppa, het veertiende voor Jesebeab,", "14": "Het vijftiende voor Bilga, het zestiende voor Immer,", "15": "Het zeventiende voor Hezir, het achttiende voor Happizzes,", "16": "Het negentiende voor Petahja, het twintigste voor Jehezkel,", "17": "Het eenentwintigste voor Jachin, het tweeëntwintigste voor Gamul,", "18": "Het drieëntwintigste voor Delaja, het vierentwintigste voor Maazja.", "19": "Het ambt van dezen in hun dienst was: gaan in het huis van de HEERE, naar hun ordening door de hand van Aäron, hun vader; zoals de HEERE, de God van Israël, hem geboden had.", "20": "Wat betreft de overige kinderen van Levi: van de kinderen van Amram was Subael, van de kinderen van Subael was Jechdeja.", "21": "Aangaande Rehabja: van de kinderen van Rehabja was Jissia het hoofd.", "22": "Van de Jizharieten was Selomoth; van de kinderen van Selomoth was Jahath.", "23": "En van de kinderen van Hebron was Jeria de eerste, Amarja de tweede, Jahaziel de derde, Jekameam de vierde.", "24": "Van de kinderen van Uzziël was Micha; van de kinderen van Micha was Samir;", "25": "De broer van Micha was Jissia; van de kinderen van Jissia was Zecharja.", "26": "De kinderen van Merari waren Maheli en Musi. De kinderen van Jaazia waren Beno.", "27": "De kinderen van Merari van Jaazia waren Beno, Soham, Zakkur en Hibri.", "28": "Van Maheli was Eleazar; en die had geen kinderen.", "29": "Aangaande Kis: de kinderen van Kis waren Jerahmeel.", "30": "En de kinderen van Musi waren Maheli, Eder en Jeremoth. Dezen zijn de kinderen van de Levieten, naar hun families.", "31": "En zij wierpen ook loten, samen met hun broeders, de zonen van Aäron, voor het aangezicht van koning David, en Zadok, en Achimelech, en van de familiehoofden onder de priesters en onder de Levieten; het familiehoofd tegenover zijn jongste broer."}, "SV": {"1": "Aangaande nu de kinderen van Aäron, *dit* waren hun verdelingen. De zonen van Aäron waren Nadab, en Abihu, Eleazar en Ithamar.", "2": "Maar Nadab stierf, en Abihu, voor het aangezicht huns vaders, en zij hadden geen kinderen. En Eleazar en Ithamar bedienden het priesterambt.", "3": "David nu verdeelde hen, en Zadok uit de kinderen van Eleazar, en Abimelech uit de kinderen van Ithamar, naar hun ambt in hun dienst.", "4": "En van de kinderen van Eleazar werden meer gevonden tot hoofden der mannen, dan van de kinderen van Ithamar, als zij hen afdeelden; van de kinderen van Eleazar waren zestien hoofden der vaderlijke huizen, maar van de kinderen van Ithamar, naar hun vaderlijke huizen, acht.", "5": "En zij deelden hen door loten af, dezen met genen; want de oversten des heiligdoms en de oversten Gods waren uit de kinderen van Eleazar en van de kinderen van Ithamar.", "6": "En Semaja, de zoon van Nethaneel, de schrijver, uit de Levieten, schreef hen op, voor het aangezicht des konings, en van de vorsten, en van den priester Zadok, en van Achimelech, den zoon van Abjathar, en van de hoofden der vaderen onder de priesters en onder de Levieten; een vaderlijk huis werd genomen voor Eleazar, en desgelijks werd genomen voor Ithamar.", "7": "Het eerste lot nu ging uit voor Jojarib, het tweede voor Jedaja,", "8": "Het derde voor Harim, het vierde voor Seorim,", "9": "Het vijfde voor Malchia, het zesde voor Mijamin,", "10": "Het zevende voor Hakkoz, het achtste voor Abia,", "11": "Het negende voor Jesua, het tiende voor Sechanja,", "12": "Het elfde voor Eljasib, het twaalfde voor Jakim,", "13": "Het dertiende voor Huppa, het veertiende voor Jesebeab,", "14": "Het vijftiende voor Bilga, het zestiende voor Immer,", "15": "Het zeventiende voor Hezir, het achttiende voor Happizzes,", "16": "Het negentiende voor Petahja, het twintigste voor Jehezkel,", "17": "Het een en twintigste voor Jachin, het twee en twintigste voor Gamul,", "18": "Het drie en twintigste voor Delaja, het vier en twintigste voor Maazja.", "19": "Het ambt van dezen in hun dienst was te gaan in het huis des HEEREN, naar hun ordening door de hand van Aäron, huns vaders; gelijk als hem de HEERE, de God Israëls, geboden had.", "20": "Van de overige kinderen van Levi nu, was van de kinderen van Amram Subael, van de kinderen van Subael was Jechdeja.", "21": "Aangaande Rehabja: van de kinderen van Rehabja was Jissia het hoofd.", "22": "Van de Jizharieten was Selomoth; van de kinderen van Selomoth was Jahath.", "23": "En van de kinderen van *Hebron* was Jeria de *eerste*, Amarja de tweede, Jahaziel de derde, Jekameam de vierde.", "24": "*Van* de kinderen van Uzziël was Micha; van de kinderen van Micha was Samir;", "25": "De broeder van Micha was Jissia; van de kinderen van Jissia was Zecharja.", "26": "De kinderen van Merari waren Maheli en Musi. De kinderen van Jaazia waren Beno.", "27": "De kinderen van Merari van Jaazia waren Beno, en Soham, en Zakkur, en Hibri.", "28": "Van Maheli was Eleazar; en die had geen kinderen.", "29": "Aangaande Kis: de kinderen van Kis waren Jerahmeel.", "30": "En de kinderen van Musi waren Maheli, en Eder, en Jeremoth. Dezen zijn de kinderen der Levieten, naar hun vaderlijke huizen.", "31": "En zij wierpen ook loten, nevens hun broederen, de zonen van Aäron, voor het aangezicht van den koning David, en Zadok, en Achimelech, en van de hoofden der vaderen onder de priesteren en onder de Levieten; het hoofd der vaderen tegen zijn kleinsten broeder."}, "KJV": {"1": "Now these are the divisions of the sons of Aaron. The sons of Aaron; Nadab, and Abihu, Eleazar, and Ithamar.", "2": "But Nadab and Abihu died before their father, and had no children: therefore Eleazar and Ithamar executed the priest's office.", "3": "And David distributed them, both Zadok of the sons of Eleazar, and Ahimelech of the sons of Ithamar, according to their offices in their service.", "4": "And there were more chief men found of the sons of Eleazar than of the sons of Ithamar; and thus were they divided. Among the sons of Eleazar there were sixteen chief men of the house of their fathers, and eight among the sons of Ithamar according to the house of their fathers.", "5": "Thus were they divided by lot, one sort with another; for the governors of the sanctuary, and governors of the house of God, were of the sons of Eleazar, and of the sons of Ithamar.", "6": "And Shemaiah the son of Nethaneel the scribe, one of the Levites, wrote them before the king, and the princes, and Zadok the priest, and Ahimelech the son of Abiathar, and before the chief of the fathers of the priests and Levites: one principal household being taken for Eleazar, and one taken for Ithamar.", "7": "Now the first lot came forth to Jehoiarib, the second to Jedaiah,", "8": "The third to Harim, the fourth to Seorim,", "9": "The fifth to Malchijah, the sixth to Mijamin,", "10": "The seventh to Hakkoz, the eighth to Abijah,", "11": "The ninth to Jeshua, the tenth to Shecaniah,", "12": "The eleventh to Eliashib, the twelfth to Jakim,", "13": "The thirteenth to Huppah, the fourteenth to Jeshebeab,", "14": "The fifteenth to Bilgah, the sixteenth to Immer,", "15": "The seventeenth to Hezir, the eighteenth to Aphses,", "16": "The nineteenth to Pethahiah, the twentieth to Jehezekel,", "17": "The one and twentieth to Jachin, the two and twentieth to Gamul,", "18": "The three and twentieth to Delaiah, the four and twentieth to Maaziah.", "19": "These were the orderings of them in their service to come into the house of the LORD, according to their manner, under Aaron their father, as the LORD God of Israel had commanded him.", "20": "And the rest of the sons of Levi were these: Of the sons of Amram; Shubael: of the sons of Shubael; Jehdeiah.", "21": "Concerning Rehabiah: of the sons of Rehabiah, the first was Isshiah.", "22": "Of the Izharites; Shelomoth: of the sons of Shelomoth; Jahath.", "23": "And the sons of Hebron; Jeriah the first, Amariah the second, Jahaziel the third, Jekameam the fourth.", "24": "Of the sons of Uzziel; Michah: of the sons of Michah; Shamir.", "25": "The brother of Michah was Isshiah: of the sons of Isshiah; Zechariah.", "26": "The sons of Merari were Mahli and Mushi: the sons of Jaaziah; Beno.", "27": "The sons of Merari by Jaaziah; Beno, and Shoham, and Zaccur, and Ibri.", "28": "Of Mahli came Eleazar, who had no sons.", "29": "Concerning Kish: the son of Kish was Jerahmeel.", "30": "The sons also of Mushi; Mahli, and Eder, and Jerimoth. These were the sons of the Levites after the house of their fathers.", "31": "These likewise cast lots over against their brethren the sons of Aaron in the presence of David the king, and Zadok, and Ahimelech, and the chief of the fathers of the priests and Levites, even the principal fathers over against their younger brethren."}}, "tsk": {"1": [{"kopje": "verdelingen", "refs": ["1 Kron 23:6"]}, {"kopje": "de zonen", "refs": ["1 Kron 6:3", "Ex 6:22", "Ex 28:1", "Lev 10:1-6", "Num 3:2", "Num 26:60"]}], "2": [{"kopje": "Nadab", "refs": ["Ex 24:1", "Ex 24:9"]}, {"kopje": "stierf", "refs": ["Lev 10:2", "Num 3:4", "Num 26:61"]}, {"kopje": "Eleazar", "refs": ["Ex 29:9", "Lev 10:12", "Num 16:39", "Num 16:40", "Num 18:7"]}], "3": [{"kopje": "Zadok", "refs": ["1 Kron 24:6", "1 Kron 24:31", "1 Kron 6:4-8", "1 Kron 6:50-53", "1 Kron 12:27", "1 Kron 12:28", "1 Kron 15:11", "1 Kron 16:39", "2 Sam 20:25", "1 Kon 2:35"]}, {"kopje": "Abimelech", "refs": ["1 Sam 21:1", "1 Sam 22:9-23", "2 Sam 8:17"]}], "4": [{"kopje": "meer", "refs": ["1 Kron 15:6-12"]}, {"kopje": "kinderen van Eleazar", "refs": ["Num 25:11-13"]}, {"kopje": "naar", "refs": ["1 Kron 23:24"]}], "5": [{"kopje": "deelden hen in door loten", "refs": ["Joz 18:10", "Spr 16:33", "Jona 1:7", "Hand 1:26"]}, {"kopje": "de leiders", "refs": ["1 Kron 9:11", "2 Kron 35:8", "Neh 11:11", "Matt 26:3", "Matt 27:1", "Hand 4:1", "Hand 4:6", "Hand 5:24"]}], "6": [{"kopje": "de schrijver", "refs": ["1 Kon 4:3", "2 Kron 34:13", "Ezra 7:6", "Neh 8:2", "Matt 8:19", "Matt 13:52", "Matt 23:1", "Matt 23:2"]}, {"kopje": "familiehoofden", "refs": ["1 Kron 23:24"]}], "7": [{"kopje": "Jojarib", "refs": ["1 Kron 9:10", "Neh 12:19"]}, {"kopje": "Jedaja", "refs": ["Ezra 2:36", "Neh 7:39", "Neh 11:10"]}], "8": [{"kopje": "Harim", "refs": ["Ezra 2:39", "Ezra 10:21", "Neh 7:35", "Neh 12:15"]}], "9": [{"kopje": "Mijamin", "refs": ["Neh 12:17"]}], "10": [{"kopje": "Abia", "refs": ["Neh 12:4", "Neh 12:17", "Luk 1:5"]}], "11": [{"kopje": "Jesua", "refs": ["Ezra 2:36", "Neh 7:39", "Neh 12:10"]}], "12": [{"kopje": "Eljasib", "refs": ["Neh 12:10"]}], "14": [{"kopje" , "torrey": [{"topic": "Priests", "href": "../../torrey/p/#t-priests", "kinderen": [{"label": "Each course of, had its president or chief", "href": "../../torrey/p/?hl=1Chr.24.31#i16072", "refs": [{"disp": "1 Kron 24:6", "href": "../../1-kronieken/24/#v6", "ref": "1 Kron 24:6", "svLabel": null}, {"disp": "1 Kron 24:31", "href": "../../1-kronieken/24/#v31", "ref": "1 Kron 24:31", "svLabel": null}, {"disp": "2 Kron 36:14", "href": "../../2-kronieken/36/#v14", "ref": "2 Kron 36:14", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "Ezra 2:39": "De kinderen van Harim, duizend en zeventien.", "1 Kron 23:21": "De kinderen van Merari waren Maheli en Musi; de kinderen van Maheli waren Eleazar en Kis.", "1 Kron 15:6-12": "Van de nakomelingen van Merari was Asaja leider, en van zijn broeders waren er tweehonderdtwintig. Van de nakomelingen van Gersom was Joël leider, en van zijn broeders waren er honderddertig. Uit de nakomelingen van Elizafan was Semaja leider, en van zijn broeders waren er tweehonderd.", "2 Kron 22:12": "En hij was bij hen verborgen in het huis van God, zes jaar; en Athalia regeerde over het land.", "1 Kron 28:13": "en van de afdelingen van de priesters en de Levieten, en van al het werk van de dienst van het huis van de HEERE, en van alle voorwerpen van de dienst van het huis van de HEERE.", "Matt 12:4": "Hoe hij het huis van God binnenging, en de toonbroden at, die hij niet mocht eten, en ook zij die bij hem waren niet, maar alleen de priesters?", "Matt 26:3": "Toen kwamen de overpriesters en de Schriftgeleerden en de oudsten van het volk samen in de zaal van de hogepriester, die Kajafas genoemd werd;", "Neh 7:39": "De priesters: de kinderen van Jedaja, van het huis van Jesua, negenhonderddrieënzeventig;", "Neh 12:15": "Van Harim, Adna; van Merajoth, Helkai;", "1 Kron 24:1-19": "Wat betreft de kinderen van Aäron: dit waren hun verdelingen. De zonen van Aäron waren Nadab, Abihu, Eleazar en Ithamar. Maar Nadab stierf, en Abihu, voor het aangezicht van hun vader, en zij hadden geen kinderen. En Eleazar en Ithamar bedienden het priesterambt. David nu verdeelde hen, en Zadok uit de kinderen van Eleazar, en Abimelech uit de kinderen van Ithamar, naar hun ambt in hun dienst.", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Ex 6:22": "En Aäron nam zich Eliseba, dochter van Amminadab, zuster van Nahesson, tot een vrouw; en zij baarde hem Nadab en Abihu, Eleazar en Ithamar.", "1 Kron 4:2": "En Reaja, de zoon van Sobal, verwekte Jahath, en Jahath verwekte Ahumai en Lahad; dit zijn de huisgezinnen van de Zorathieten;", "Neh 13:11": "En ik twistte met de overheden, en zei: Waarom is het huis van God verlaten? Doch ik verzamelde hen, en herstelde ze op hun plaats.", "2 Kron 30:8": "Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Ezra 5:8": "De koning zij bekend, dat wij naar het landschap Juda getrokken zijn, naar het huis van de grote God, dat gebouwd wordt met grote stenen, en het hout wordt gelegd in de wanden; en dat werk wordt snel gedaan en gaat voorspoedig door hun handen voort.", "Hebr 9:1": "Zo had dan het eerste verbond wel regels van de eredienst, en het aardse heiligdom.", "Micha 4:2": "En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Num 3:2": "En dit zijn de namen van de zonen van Aäron: de eerstgeborene, Nadab, daarna Abihu, Eleazar, en Ithamar.", "Ps 84:11": "Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.", "1 Kron 23:23": "De kinderen van Musi waren Maheli, en Eder, en Jeremoth; drie.", "Neh 12:17": "Van Abia, Zichri; van Minjamin, van Moadja, Piltai;", "1 Kron 6:3": "En de kinderen van Amram waren Aäron, en Mozes en Mirjam; en de kinderen van Aäron waren Nadab en Abihu, Eleazar en Ithamar.", "Ezra 10:21": "En van de kinderen van Harim: Maaseja, en Elia, en Semaja, en Jehiel, en Uzia,", "Neh 12:4": "Iddo, Ginnethoi, Abia,", "Neh 12:10": "Jesua nu verwekte Jojakim, en Jojakim verwekte Eljasib, en Eljasib verwekte Jojada,", "Pred 4:17": "Let op uw voet, als u naar het huis van God gaat, en wees liever bereid om te horen, dan om het offer van dwazen te geven; want zij weten niet dat zij kwaad doen.", "1 Kron 26:13": "En zij wierpen het lot, zowel de kleinen als de groten, naar hun families, voor elke poort.", "2 Kron 34:12": "En die mannen handelden trouw in dit werk; en de opzichters daarover waren Jahath en Obadja, Levieten uit de kinderen van Merari, alsook Zacharia en Mesullam, uit de kinderen van de Kahathieten, om het werk voort te drijven; en die Levieten waren allen kundig op muziekinstrumenten.", "Ezra 2:36": "De priesters. De kinderen van Jedaja, van het huis van Jesua, negenhonderddrieënzeventig.", "2 Kron 35:5": "En sta in het heiligdom, naar de onderscheiding van de vaderlijke huizen, voor uw broeders, het volk, en naar de afdeling van de vaderlijke huizen van de Levieten;", "1 Kron 26:24": "En Sebuël, de zoon van Gersom, de zoon van Mozes, was leider over de schatten.", "1 Kron 26:31": "Van de Hebronieten was Jeria het hoofd, van de Hebronieten naar zijn geslachten onder de families; in het veertigste jaar van het koninkrijk van David zijn er gezocht en onder hen gevonden dappere helden in Jaëzer in Gilead.", "1 Kron 15:20": "En Zecharja, en Aziël, en Semiramoth, en Jehiel, en Unni, en Eliab, en Maaseja, en Benaja, met luiten op Alamoth.", "1 Kron 23:10": "De kinderen van Simeï nu waren Jahath, Zina, en Jeüs, en Beria; dezen waren de kinderen van Simeï; vier.", "1 Kron 23:19": "Aangaande de kinderen van Hebron: Jeria was het hoofd, Amarja de tweede, Jahaziël de derde, en Jekameam de vierde.", "1 Sam 22:9-23": "Toen antwoordde Doeg, de Edomiet, die bij de knechten van Saul stond, en zei: Ik zag de zoon van Isaï komen te Nob, naar Achimelech, de zoon van Ahitub; Die de HEERE voor hem raadpleegde, en hem teerkost gaf; hij gaf hem ook het zwaard van Goliath, de Filistijn. Toen zond de koning heen om de priester Achimelech, de zoon van Ahitub, te laten roepen, en het hele huis van zijn vader, de priesters die te Nob waren; en zij kwamen allemaal naar de koning.", "1 Kron 12:28": "En Zadok was een jongeman, een kloeke held; en uit zijn vaders huis waren tweeëntwintig leiders;", "Num 7:9": "Maar aan de zonen van Kohath gaf hij niets; want de dienst van de heilige dingen die op hen rustte, moesten zij op de schouders dragen.", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "Num 3:4": "Maar Nadab en Abihu stierven voor het aangezicht van de HEERE, toen zij vreemd vuur voor het aangezicht van de HEERE in de woestijn van Sinaï brachten, en zij hadden geen kinderen; doch Eleazar en Ithamar bedienden het priesterambt voor het aangezicht van hun vader Aäron.", "Neh 7:35": "De kinderen van Harim, driehonderdtwintig;", "2 Kron 20:8": "Zij nu hebben daarin gewoond, en zij hebben U daarin een heiligdom gebouwd voor Uw Naam, en zeiden:", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "1 Kron 6:50-53": "Dit nu zijn de kinderen van Aäron: Eleazar, was zijn zoon; Pinehas zijn zoon; Abisua zijn zoon; Bukki zijn zoon; Uzzi zijn zoon; Serahja zijn zoon; Merajoth zijn zoon; Amarja zijn zoon; Ahitub zijn zoon;", "Num 4:12": "Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.", "Neh 12:19": "En van Jojarib, Matthenai; van Jedaja, Uzzi;", "1 Kron 23:12-14": "De kinderen van Kehath waren Amram, Jizhar, Hebron en Uzziël; vier. De kinderen van Amram waren Aäron en Mozes. Aäron nu werd afgezonderd om de allerheiligste dingen te heiligen, hij en zijn zonen, tot in eeuwigheid, om te roken voor het aangezicht van de HEERE, om Hem te dienen en om in Zijn Naam tot in eeuwigheid te zegenen. Aangaande nu Mozes, de man van God, zijn kinderen werden gerekend onder de stam van Levi.", "Num 18:1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Matt 27:1": "Toen het morgen geworden was, hebben alle overpriesters en de oudsten van het volk samen een besluit genomen tegen Jezus, om Hem te doden.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "1 Kon 2:35": "En de koning stelde Benaja, de zoon van Jojada, in zijn plaats aan over het leger; en Zadok, de priester, stelde de koning aan in de plaats van Abjathar.", "Ezech 42:20": "Hij mat het aan de vier zijden; het had een muur rondom, de lengte was vijfhonderd rieten, en de breedte vijfhonderd, om onderscheid te maken tussen het heilige en het onheilige.", "Hebr 7:11": "Als dan nu de volkomenheid door het Levitische priesterschap zou zijn (want onder dat priesterschap heeft het volk de wet ontvangen), wat nodig was het dan nog, dat een andere priester naar de ordening van Melchizedek zou opstaan, en niet naar de ordening van Aäron genoemd zou worden?", "Zach 7:2": "Toen men naar het huis van God had gezonden Sarezer en Regem-Melech en hun mannen, om het aangezicht van de HEERE te smeken,", "2 Kon 19:2": "Daarna stuurde hij Eljakim, de hofmeester, en Sebna, de schrijver, en de oudsten van de priesters, met zakken bedekt, naar Jesaja, de profeet, de zoon van Amoz;", "2 Kron 34:13": "Zij waren ook aangesteld over de lastdragers, en de opzichters van allen die in enig werk arbeidden; want uit de Levieten waren er schrijvers, en beambten, en poortwachters.", "1 Kron 26:13-19": "En zij wierpen het lot, zowel de kleinen als de groten, naar hun families, voor elke poort. Het lot nu voor het oosten viel op Salemja; maar voor zijn zoon Zecharja, die een verstandig raadsman was, wierp men het lot, en zijn lot kwam uit voor het noorden; Obed-Edom voor het zuiden; en voor zijn kinderen het huis van de schatkamers.", "Luk 1:5": "In de dagen van Herodes, de koning van Judea, was er een priester met de naam Zacharias, uit de dagorde van Abia; en zijn vrouw was uit de dochters van Aäron, en haar naam was Elizabet.", "Hebr 8:2": "Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.", "2 Kron 36:14": "Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.", "1 Kron 28:10": "Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.", "1 Sam 21:1": "Toen kwam David bij Nob, bij de priester Achimelech; en Achimelech kwam David bevend tegemoet, en hij zei tegen hem: Waarom bent u alleen, en geen man met u?", "Jona 1:7": "Vervolgens zeiden zij, ieder tegen zijn metgezel: Kom, laten we loten werpen, zodat wij mogen weten om wie het gaat dat dit kwaad ons overkomt. Zo wierpen zij loten, en het lot viel op Jona.", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "2 Kron 36:19": "En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "2 Kron 29:21": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren.", "Richt 20:18": "En de kinderen van Israël maakten zich op, en trokken op naar het huis van God, en vroegen God om raad, en zeiden: Wie zal onder ons als eerste optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zei: Juda als eerste.", "Num 18:5": "U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "Num 8:19": "En Ik heb de Levieten aan Aäron en aan zijn zonen als gift gegeven, uit het midden van de kinderen van Israël, om de dienst van de kinderen van Israël in de tent van de samenkomst te verrichten, en om voor de kinderen van Israël verzoening te doen, zodat er geen plaag onder de kinderen van Israël komt, als de kinderen van Israël tot het heiligdom zouden naderen.", "Ex 6:20": "En de zonen van Jizhar: Korah, en Nefeg, en Zichri.", "2 Sam 8:17": "En Zadok, zoon van Ahitub, en Achimelech, zoon van Abjathar, waren priesters; en Seraja was schrijver.", "Gen 28:22": "En deze steen, die ik als opgericht teken gezet heb, zal een huis van God zijn; en van alles wat U mij geven zult, zal ik U zeker de tienden geven!", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "1 Kron 23:22": "En Eleazar stierf, en hij had geen zonen, maar dochters; en de kinderen van Kis, hun broeders, namen hen tot vrouw.", "Ex 28:1": "Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron.", "Matt 8:19": "En er kwam een schriftgeleerde naar Hem toe, die tegen Hem zei: Meester, ik zal U volgen, waar U ook heengaat.", "1 Kron 2:9": "En de kinderen van Hezron, die hem geboren zijn, waren Jerahmeel, en Ram, en Chelubai.", "1 Kron 23:16": "Van de kinderen van Gersom was Sebuël het hoofd.", "Ezra 10:20": "En van de kinderen van Immer: Hanani en Zebadja.", "Ex 6:18": "En de zonen van Merari: Machli en Musi; dit zijn de huisgezinnen van Levi, naar hun geboorten.", "Joz 9:23": "Nu dan, vervloekt bent u! en onder u zullen altijd knechten blijven, houthakkers en waterputters voor het huis van mijn God.", "Ps 55:15": "Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Ex 6:24": "En Eleazar, de zoon van Aäron, nam voor zich een van de dochters van Putiel tot een vrouw; en zij baarde hem Pinehas. Dit zijn de hoofden van de vaderen van de Levieten, naar hun huisgezinnen.", "Neh 8:2": "verzamelde het hele volk zich als één man op het plein voor de Waterpoort; en zij zeiden tegen Ezra, de schriftgeleerde, dat hij het boek van de wet van Mozes zou halen, die de HEERE aan Israël geboden had.", "Num 3:20": "En de zonen van Merari, naar hun geslachten: Maheli en Musi; dit zijn de geslachten van de Levieten, naar het huis van hun vaderen.", "Dan 9:17": "En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf.", "Dan 8:11": "Ja, hij verhief zich tot aan de Vorst van dat leger, en van Hem werd het voortdurende offer weggenomen, en de woning van Zijn heiligdom werd neergeworpen.", "Ps 63:3": "Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;", "Num 26:61": "Nadab nu en Abihu waren gestorven, toen zij vreemd vuur brachten voor het aangezicht van de HEERE.", "Ex 24:9": "Mozes nu en Aäron klommen omhoog, ook Nadab en Abihu, en zeventig van de oudsten van Israël.", "1 Kron 16:39": "En de priester Zadok, en zijn broeders, de priesters, voor de tabernakel van de HEERE op de hoogte, die te Gibeon is;", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "1 Kron 23:11": "En Jahath was het hoofd, en Zizza de tweede; maar Jeüs en Beria hadden niet veel kinderen; daarom werden zij in het vaderlijke huis maar als één geslacht geteld.", "2 Kron 31:2": "En Hizkia stelde de verdelingen van de priesters en de Levieten in, naar hun verdelingen, ieder naar zijn dienst, de priesters en de Levieten voor het brandoffer en voor de dankoffers, om te dienen, en om te loven, en om te prijzen in de poort van de legerplaatsen van de HEERE;", "Richt 21:2": "Zo kwam het volk naar het huis van God, en zij bleven daar tot de avond, voor het aangezicht van God; en zij hieven hun stem op en weenden met groot geween.", "Ezech 48:8": "Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend meetrieten in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn.", "1 Kron 27:32": "En Jonathan, de oom van David, was raadsman, een verstandig man; hij was ook schrijver; Jehiël nu, de zoon van Hachmoni, was bij de zonen van de koning.", "Hand 5:24": "Toen nu de hogepriester en de hoofdman van de tempel, en de overpriesters deze woorden hoorden, werden zij vol twijfel over hen, wat hier toch uit zou worden.", "Ps 73:17": "Totdat ik in Gods heiligdommen inging, en op hun einde lette.", "1 Kron 6:4-8": "En Eleazar verwekte Pinehas, Pinehas verwekte Abisua; En Abisua verwekte Bukki, en Bukki verwekte Uzzi; En Uzzi verwekte Zerahja, en Zerahja verwekte Merajoth;", "Dan 11:31": "En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.", "2 Kron 33:7": "Hij stelde ook de gelijkenis van een gesneden beeld, dat hij gemaakt had, in het huis van God, waarvan God gezegd had tot David en tot zijn zoon Salomo: In dit huis, en te Jeruzalem, dat Ik uit alle stammen van Israël verkozen heb, zal Ik Mijn Naam zetten tot in eeuwigheid.", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Ezra 7:6": "Deze Ezra trok op uit Babel; en hij was een vaardig schriftgeleerde in de wet van Mozes, die de HEERE, de God van Israël, gegeven heeft; en de koning gaf hem, naar de hand van de HEERE, zijn God, over hem, al zijn verzoek.", "2 Sam 20:25": "En Seja was schrijver; en Zadok en Abjathar waren priesters.", "Num 25:11-13": "Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, heeft Mijn grimmigheid van over de kinderen van Israël afgewend, omdat hij Mijn ijver geijverd heeft in hun midden, zodat Ik de kinderen van Israël in Mijn ijver niet vernietigd heb. Zeg daarom: Zie, Ik geef hem Mijn verbond van vrede. En hij zal hebben, en zijn nageslacht na hem, het verbond van het eeuwige priesterschap, omdat hij voor zijn God geijverd heeft, en verzoening gedaan heeft voor de kinderen van Israël.", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "2 Kron 35:8": "Ook gaven zijn vorsten tot een vrijwillig offer voor het volk, voor de priesters, en voor de Levieten; Hilkia, en Zacharia, en Jehiel, de leiders van het huis van God, gaven de priesters tot paasoffers, tweeduizend en zeshonderd klein vee, en driehonderd runderen.", "1 Kor 14:40": "Laat alle dingen eerlijk en met orde gebeuren.", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "1 Kron 9:25": "En hun broeders waren op hun dorpen, en kwamen elke zevende dag van tijd tot tijd bij hen om te dienen;", "1 Kron 12:27": "En Jehojada was aanvoerder van de Aäronieten; en met hem waren er drieduizend zevenhonderd.", "1 Kron 9:29": "Want uit hen zijn er aangesteld over de voorwerpen, en over al de heilige voorwerpen, en over de meelbloem, en wijn, en olie, en wierook, en specerijen.", "Lev 21:12": "En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!", "Matt 23:2": "en zei: De Schriftgeleerden en de Farizeeën zitten op de stoel van Mozes;", "Joz 18:10": "Toen wierp Jozua het lot voor hen te Silo, voor het aangezicht van de HEERE. En Jozua verdeelde daar aan de kinderen van Israël het land, naar hun afdelingen.", "Ezra 5:15": "En hij zei tegen hem: Neem deze vaten, ga ze afvoeren naar de tempel die te Jeruzalem is, en laat het huis van God gebouwd worden op zijn plaats.", "Num 26:56": "Naar het lot zal ieders erfenis verdeeld worden tussen de velen en de weinigen.", "Num 19:20": "Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden van de gemeenschap uitgeroeid worden; want hij heeft het heiligdom van de HEERE verontreinigd, het water van de afzondering is niet op hem gesprenkeld, hij is onrein.", "1 Kron 23:24": "Dit zijn de kinderen van Levi, naar het huis van hun vaderen, de hoofden van de vaderen, naar hun telling in het getal van de namen naar hun hoofden, die het werk deden van de dienst van het huis van de HEERE, van twintig jaar oud en daarboven.", "1 Kron 6:47": "De zoon van Maheli, de zoon van Musi, de zoon van Merari, de zoon van Levi.", "1 Kron 26:25": "Maar zijn broers van Eliëzer waren dezen: Rehabja was zijn zoon, en Jesaja zijn zoon, en Joram zijn zoon, en Zichri zijn zoon, en Selomith zijn zoon.", "Ezech 5:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!", "1 Kron 24:5-31": "En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar. En Semaja, de zoon van Nethaneel, de schrijver, uit de Levieten, schreef hen op, voor het aangezicht van de koning, en van de vorsten, en van de priester Zadok, en van Achimelech, de zoon van Abjathar, en van de familiehoofden onder de priesters en onder de Levieten; één familie werd genomen voor Eleazar, en zo ook werd er één genomen voor Ithamar. Het eerste lot nu ging uit voor Jojarib, het tweede voor Jedaja,", "1 Kron 6:7": "En Merajoth verwekte Amarja, en Amarja verwekte Ahitub;", "Neh 13:30": "Zo reinigde ik hen van alle vreemden; en ik stelde de wachten van de priesters en van de Levieten vast, ieder in zijn werk;", "Neh 11:10": "Van de priesters: Jedaja, de zoon van Jojarib, Jachin;", "Matt 13:52": "En Hij zei tegen hen: Daarom is iedere Schriftgeleerde die onderwezen is in het Koninkrijk der hemelen, gelijk aan een heer des huizes, die uit zijn schat nieuwe en oude dingen tevoorschijn haalt.", "1 Kron 15:18": "En met hen hun broeders van de tweede orde: Zecharja, Ben en Jaaziel, en Semiramoth, en Jehiel, en Unni, Eliab, en Benaja, en Maaseja, en Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, de poortwachters.", "Ezech 45:3": "Zo zult u met deze maat meten: de lengte van vijfentwintigduizend, en de breedte van tienduizend, en daarin zal het heiligdom zijn, met het heilige der heiligen.", "Num 3:27": "En van Kahath is het geslacht van de Amramieten, en het geslacht van de Izharieten, en het geslacht van de Hebronieten, en het geslacht van de Uzziëlieten; dit zijn de geslachten van de Kohathieten.", "Ezech 48:21": "En het overgelatene zal voor de vorst zijn, van deze en van gene zijde van het heilig hefoffer, en van de bezitting van de stad, voor aan de vijfentwintigduizend meetrieten van het hefoffer, tot aan de oostgrens en westgrens, voor aan de vijfentwintigduizend aan de westgrens, tegenover de andere delen, dat zal voor de vorst zijn; en het heilig hefoffer, en het heiligdom van het huis, zal in het midden daarvan zijn.", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Jes 63:18": "Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "Num 16:39": "En Eleazar, de priester, nam de koperen wierookvaten die de verbrande mannen gebracht hadden, en men hamerde ze uit tot een overdekking voor het altaar;", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "2 Kon 18:37": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, tot Hizkia, met gescheurde kleren; en zij maakten hem de woorden van Rabsake bekend.", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Lev 10:1-6": "En de zonen van Aäron, Nadab en Abihu, namen ieder zijn wierookvat en deden er vuur in, en legden er reukwerk op, en brachten vreemd vuur voor het aangezicht van de HEERE, wat Hij hun niet geboden had. Toen ging er een vuur uit van het aangezicht van de HEERE, en verteerde hen; en zij stierven voor het aangezicht van de HEERE. En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "1 Kron 25:8": "En zij wierpen de loten over de dienst, tegen elkaar, zowel de kleinen als de groten, de meester met de leerling.", "Ex 25:8": "En zij zullen Mij een heiligdom maken, dat Ik in hun midden woon.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Hand 4:6": "En Annas, de hogepriester, en Kajafas, en Johannes, en Alexander, en allen die van het hogepriesterlijk geslacht waren.", "Hos 9:8": "De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.", "Matt 23:1": "Toen sprak Jezus tot de menigten en tot Zijn discipelen,", "1 Kron 6:52": "Merajoth zijn zoon; Amarja zijn zoon; Ahitub zijn zoon;", "1 Kron 22:19": "Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "2 Kron 26:18": "En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Ps 74:7": "Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.", "Richt 20:26": "Toen trokken alle kinderen van Israël en heel het volk op, en kwamen bij het huis van God, en weenden, en bleven daar voor het aangezicht van de HEERE, en vastten die dag tot de avond; en zij offerden brandoffers en dankoffers voor het aangezicht van de HEERE.", "2 Kron 35:4": "En bereid u naar de huizen van uw vaderen, naar uw verdelingen, naar het voorschrift van David, de koning van Israël, en naar de beschrijving van zijn zoon Salomo;", "Num 18:7": "Maar u, en uw zonen met u, zullen uw priesterambt waarnemen in alle zaken van het altaar, en in wat binnen het voorhangsel is; dat zult u bedienen; uw priesterambt geef Ik u tot een dienst van een geschenk; en de vreemde die nadert, zal gedood worden.", "Lev 10:12": "En Mozes sprak tegen Aäron, en tegen Eleazar en tegen Ithamar, zijn overgebleven zonen: Neem het spijsoffer dat over is van de vuuroffers van de HEERE, en eet dat ongezuurd bij het altaar; want het is allerheiligst.", "Ezra 7:23": "Alles wat naar het bevel van de God van de hemel is, dat dat vlijtig gedaan wordt, voor het huis van de God van de hemel; want waartoe zou er grote toorn zijn over het koninkrijk van de koning en zijn kinderen?", "Lev 10:2": "Toen ging er een vuur uit van het aangezicht van de HEERE, en verteerde hen; en zij stierven voor het aangezicht van de HEERE.", "2 Kron 5:14": "En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.", "Neh 6:10": "Toen ik in het huis kwam van Semaja, de zoon van Delaja, de zoon van Mehetabeel — hij was namelijk opgesloten — zei hij: Laten wij samenkomen in het huis van God, binnen in de tempel, en laten wij de deuren van de tempel sluiten; want zij zullen komen om u te doden, ja, 's nachts zullen zij komen om u te doden.", "1 Kron 7:3": "En de kinderen van Uzzi waren Jizrahja; en de kinderen van Jizrahja waren Michaël, en Obadja, en Joël, en Jisia; deze vijf waren allemaal samen hoofden.", "Hand 4:1": "Terwijl zij tot het volk spraken, kwamen de priesters, en de hoofdman van de tempel, en de Sadduceeën op hen af,", "1 Kron 9:11": "En Azarja, de zoon van Hilkija, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, leider van het huis van God;", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "1 Kron 9:10": "Van de priesters nu, Jedaja, en Jojarib, en Jachin,", "1 Kron 23:18": "Van de kinderen van Jizhar was Selomith het hoofd.", "Neh 10:34": "Ook wierpen wij de loten, onder de priesters, de Levieten en het volk, over het offer van het hout, dat men brengen zou naar het huis van onze God, naar het huis van onze vaderen, op bestemde tijden, jaar op jaar, om te branden op het altaar van de HEERE, onze God, zoals het in de wet geschreven is;", "Dan 8:13": "Daarna hoorde ik een heilige spreken; en de heilige zei tegen de onbenoemde die daar sprak: Tot hoelang zal dat gezicht van het voortdurende offer en de verwoestende afval duren, dat zowel het heiligdom als het leger vertrapt zal worden?", "1 Kron 23:17": "De kinderen van Eliëzer nu waren deze: Rehabja het hoofd; en Eliëzer had geen andere kinderen, maar de kinderen van Rehabja werden zeer talrijk.", "Neh 13:13": "En ik stelde tot schatmeesters over de schatten Selemja, de priester, en Zadok, de schrijver, en Pedaja, uit de Levieten; en aan hun zijde Hanan, de zoon van Zakkur, de zoon van Matthanja; want zij werden betrouwbaar geacht, en hun werd opgelegd het aan hun broeders uit te delen.", "Ezra 2:36-39": "De priesters. De kinderen van Jedaja, van het huis van Jesua, negenhonderddrieënzeventig. De kinderen van Immer, duizend tweeënvijftig. De kinderen van Pashur, duizend tweehonderdzevenenveertig.", "Num 26:60": "En aan Aäron werden geboren Nadab en Abihu, Eleazar en Ithamar.", "1 Kron 15:11": "En David riep de priesters Zadok en Abjathar, en de Levieten Uriël, Asaja en Joël, Semaja, en Eliël, en Amminadab.", "Ezra 7:20": "Het overige nu, dat nodig zal zijn voor het huis van uw God, dat u zult moeten uitgeven, zult u geven uit het schathuis van de koning.", "Joël 1:16": "Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God?", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Jer 36:12": "ging hij naar het huis van de koning, naar de kamer van de schrijver; en zie, daar zaten al de vorsten: Elisama, de schrijver, en Delaja, de zoon van Semaja, en Elnathan, de zoon van Achbor, en Gemarja, de zoon van Safan, en Zedekia, de zoon van Hananja, en al de vorsten.", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "2 Kron 23:8": "En de Levieten en heel Juda deden naar alles wat de priester Jojada geboden had; en zij namen ieder zijn mannen, die op de sabbat aantraden, samen met hen die op de sabbat weggingen; want de priester Jojada had de afdelingen geen verlof gegeven.", "Num 3:19": "En de zonen van Kahath, naar hun geslachten: Amram en Izhar, Hebron en Uzziël.", "Neh 7:40": "De kinderen van Immer, duizendtweeënvijftig;", "Neh 11:11": "Seraja, de zoon van Hilkia, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, was voorganger van Gods huis;", "Num 16:40": "Ter herinnering voor de kinderen van Israël, opdat geen vreemdeling, die niet uit het nageslacht van Aäron is, nadert om reukwerk aan te steken voor het aangezicht van de HEERE; opdat hij niet wordt als Korach en zijn vergadering, zoals de HEERE hem door de hand van Mozes gezegd had.", "Ex 29:9": "En u zult hen met de gordel omgorden, namelijk Aäron en zijn zonen; en u zult hun de mutsen opbinden, opdat zij het priesterambt hebben tot een eeuwige inzetting. Vervolgens zult u de hand van Aäron vullen, en de hand van zijn zonen.", "Luk 1:9": "dat hem naar de gewoonte van de priesterlijke dienst door het lot te beurt viel om de tempel van de Heere in te gaan en reukoffers te brengen.", "Num 10:21": "Toen trokken de Kohathieten op, dragend het heiligdom; en de anderen richtten de tabernakel op, tegen dat dezen kwamen.", "1 Kon 4:3": "Elihoref en Ahia, de zoon van Sisa, waren schrijvers; Josafat, de zoon van Ahilud, was kanselier.", "Gen 28:17": "En hij vreesde, en zei: Hoe ontzagwekkend is deze plaats! Dit is niets anders dan een huis van God, en dit is de poort van de hemel!", "Ezech 44:27": "En op de dag dat hij in het heilige naar binnen gaat, in het binnenste voorhof, om in het heilige te dienen, zal hij zijn zondoffer offeren, spreekt de Heere HEERE.", "Hand 1:26": "En zij wierpen hun loten; en het lot viel op Matthias, en hij werd met algemene instemming bij de elf apostelen gerekend.", "2 Kron 23:4": "Dit is de zaak die u doen zult: een derde deel van u, die op de sabbat aantreden, van de priesters en van de Levieten, zullen poortwachters van de dorpels zijn;", "1 Kron 6:19": "De kinderen van Merari waren Maheli en Musi. En dit zijn de families van de Levieten, naar hun vaderen.", "1 Kron 28:21": "En zie, daar zijn de afdelingen van de priesters en de Levieten, voor elke dienst van het huis van God; en bij u zijn er voor al het werk allerlei vrijwilligers, met wijsheid voor elke dienst, ook de leiders en heel het volk, gereed voor al uw bevelen.", "1 Kron 6:18": "En de kinderen van Kahath waren Amram, en Jizhar, en Hebron, en Uzziël.", "1 Kron 26:26": "Deze Selomith en zijn broers waren over al de schatten van de heilige dingen, die koning David geheiligd had, alsook de hoofden van de families, de leiders over duizenden en honderden, en de leiders van het leger;", "Ex 24:1": "Daarna zei Hij tegen Mozes: Klim op tot de HEERE, u en Aäron, Nadab en Abihu, en zeventig van de oudsten van Israël; en buig u neer van verre!", "Neh 10:39": "Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "1 Kron 23:20": "Aangaande de kinderen van Uzziël: Micha was het hoofd, en Jissia de tweede.", "Richt 18:31": "Zo stelden zij voor zich het gesneden beeld van Micha op, dat hij gemaakt had, al de dagen dat het huis van God te Silo was.", "Ps 150:1": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte!", "Hebr 10:21": "en omdat wij een grote Priester hebben over het huis van God,", "2 Kron 24:13": "Zo deden de verzorgers van het werk, dat de vooruitgang van het werk door hun hand toenam; en zij herstelden het huis van God naar zijn gestalte, en maakten het vast.", "Num 3:28": "In getal van al wat mannelijk was, va her,</span> and had no <span class=\"wl wl-kjv\" data-code=\"H1121\">children:</span> therefore <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> and <span class=\"wl wl-kjv\" data-code=\"H385\">Ithamar</span> executed the priest's <span class=\"wl wl-kjv\" data-code=\"H3547\">office.</span>", "3": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H2505\">distributed</span> them, both <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar,</span> and <span class=\"wl wl-kjv\" data-code=\"H288\">Ahimelech</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H385\">Ithamar,</span> according to their <span class=\"wl wl-kjv\" data-code=\"H6486\">offices</span> in their <span class=\"wl wl-kjv\" data-code=\"H5656\">service.</span>", "4": "And there were <span class=\"wl wl-kjv\" data-code=\"H7227\">more</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H1397\">men</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> than of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H385\">Ithamar;</span> and thus were they <span class=\"wl wl-kjv\" data-code=\"H2505\">divided.</span> Among the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> there were <span class=\"wl wl-kjv\" data-code=\"H8337\">sixteen</span> chief <span class=\"wl wl-kjv\" data-code=\"H7218\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> among the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H385\">Ithamar</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>", "5": "Thus were they <span class=\"wl wl-kjv\" data-code=\"H2505\">divided</span> by <span class=\"wl wl-kjv\" data-code=\"H1486\">lot,</span> one <span class=\"wl wl-kjv\" data-code=\"H428\">sort</span> with <span class=\"wl wl-kjv\" data-code=\"H428\">another;</span> for the <span class=\"wl wl-kjv\" data-code=\"H8269\">governors</span> of the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary,</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">governors</span> of the house of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> were of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H385\">Ithamar.</span>", "6": "And <span class=\"wl wl-kjv\" data-code=\"H8098\">Shemaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5417\">Nethaneel</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe,</span> one of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H288\">Ahimelech</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <spa e=\"H8671\">ninth</span> to <span class=\"wl wl-kjv\" data-code=\"H3442\">Jeshua,</span> the <span class=\"wl wl-kjv\" data-code=\"H6224\">tenth</span> to <span class=\"wl wl-kjv\" data-code=\"H7935\">Shecaniah,</span>", "12": "The <span class=\"wl wl-kjv\" data-code=\"H6249\">eleventh</span> to <span class=\"wl wl-kjv\" data-code=\"H475\">Eliashib,</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> to <span class=\"wl wl-kjv\" data-code=\"H3356\">Jakim,</span>", "13": "The <span class=\"wl wl-kjv\" data-code=\"H7969\">thirteenth</span> to <span class=\"wl wl-kjv\" data-code=\"H2647\">Huppah,</span> the <span class=\"wl wl-kjv\" data-code=\"H702\">fourteenth</span> to <span class=\"wl wl-kjv\" data-code=\"H3428\">Jeshebeab,</span>", "14": "The <span class=\"wl wl-kjv\" data-code=\"H2568\">fifteenth</span> to <span class=\"wl wl-kjv\" data-code=\"H1083\">Bilgah,</span> the <span class=\"wl wl-kjv\" data-code=\"H8337\">sixteenth</span> to <span class=\"wl wl-kjv\" data-code=\"H564\">Immer,</span>", "15": "The <span class=\"wl wl-kjv\" data-code=\"H7651\">seventeenth</span> to <span class=\"wl wl-kjv\" data-code=\"H2387\">Hezir,</span> the <span class=\"wl wl-kjv\" data-code=\"H8083\">eighteenth</span> to <span class=\"wl wl-kjv\" data-code=\"H6483\">Aphses,</span>", "16": "The <span class=\"wl wl-kjv\" data-code=\"H8672\">nineteenth</span> to <span class=\"wl wl-kjv\" data-code=\"H6611\">Pethahiah,</span> the <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> to <span class=\"wl wl-kjv\" data-code=\"H3168\">Jehezekel,</span>", "17": "The <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> to <span class=\"wl wl-kjv\" data-code=\"H3199\">Jachin,</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> to <span class=\"wl wl-kjv\" data-code=\"H1577\">Gamul,</span>", "18": "The <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> to <span class=\"wl wl-kjv\" data-code=\"H1806\">Delaiah,</span> the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> to <span class=\"wl wl-kjv\" data-code=\"H4590\">Maaziah.</span>", "19": "These were the <span class=\"wl wl-kjv\" data-code=\"H6486\">orderings</span> of them in their <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> according to their <span class=\"wl wl-kjv\" data-code=\"H4941\">manner,</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">under</span> <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him.", "20": "And the <span class=\"wl wl-kjv\" data-code=\"H3498\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi</span> were these: Of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6019\">Amram;</span> <span class=\"wl wl-kjv\" data-code=\"H7619\">Shubael:</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7619\">Shubael;</span> <span class=\"wl wl-kjv\" data-code=\"H3165\">Jehdeiah.</span>", "21": "Concerning <span class=\"wl wl-kjv\" data-code=\"H7345\">Rehabiah:</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span c code=\"H5980\">against</span> their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> in the <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok,</span> and <span class=\"wl wl-kjv\" data-code=\"H288\">Ahimelech,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> even the <span class=\"wl wl-kjv\" data-code=\"H7218\">principal</span> <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> over <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> their <span class=\"wl wl-kjv\" data-code=\"H6996\">younger</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brethren.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
</body>
