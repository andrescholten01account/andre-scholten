s van de duizenden en van de honderden, en met alle vorsten.", "2": "En David zei tegen de hele gemeente van Israël: Als het u goeddunkt, en het van de HEERE, onze God, is, laten wij ons uitbreiden en laten wij zenden aan onze overige broeders, in alle landen van Israël, en de priesters en Levieten, die met hen zijn in de steden, met hun voorsteden, opdat zij bij ons verzameld worden.", "3": "En laten wij de ark van onze God naar ons terughalen, want wij hebben er in de dagen van Saul niet naar gevraagd[1].", "4": "Toen zei de hele gemeente dat men zo zou doen; want die zaak was recht in de ogen van het hele volk.", "5": "David dan verzamelde heel Israël, van het Egyptische Sichor af, tot waar men bij Hamath komt, om de ark van God te brengen vanuit Kirjath-jearim.", "6": "Toen trok David op met heel Israël naar Baäla, dat is Kirjath-jearim, dat in Juda ligt, om vandaar de ark van God op te halen, van de HEERE, Die tussen de cherubs woont[2], waar de Naam wordt aangeroepen.", "7": "En zij voerden de ark van God op een nieuwe wagen uit het huis van Abinadab. Uza en Ahio leidden de wagen.", "8": "En David en heel Israël speelden voor het aangezicht van God met alle kracht, zowel met liederen, als met harpen, en met luiten, en met trommels, en met cimbalen, en met trompetten.", "9": "Toen zij bij de dorsvloer van Chidon gekomen waren, strekte Uza zijn hand uit om de ark vast te houden, want de runderen struikelden.", "10": "Toen ontstak de toorn van de HEERE tegen Uza, en Hij sloeg hem, omdat hij zijn hand had uitgestrekt naar de ark; en hij stierf daar voor het aangezicht van God.", "11": "En David ontstak, omdat de HEERE een scheur gescheurd had aan Uza; daarom noemde hij die plaats Perez-uza, tot op deze dag.", "12": "En David vreesde de HEERE op die dag, en zei: Hoe zal ik de ark van God tot mij brengen?", "13": "Daarom liet David de ark niet tot zich brengen in de stad van David, maar liet haar afwijken naar het huis van Obed-edom, de Gethiet.", "14": "Zo bleef de ark van God bij het huisgezin van Obed-edom, in zijn huis, drie maanden; en de HEERE zegende het huis van Obed-edom, en alles wat hij had."}, "SV": {"1": "En David hield raad met de oversten der duizenden en der honderden, *en* met alle vorsten.", "2": "En David zeide tot de ganse gemeente van Israël: Indien het ulieden goeddunkt, en van den HEERE, onzen God, te zijn, laat ons ons uitbreiden, laat ons zenden aan onze overige broeders, in alle landen van Israël, en de priesters en Levieten, *die* met hen zijn in de steden, met haar voorsteden, opdat zij tot ons vergaderd worden.", "3": "En laat ons de ark onzes Gods tot ons wederhalen, want wij hebben ze in de dagen van Saul niet gezocht.", "4": "Toen zeide de ganse gemeente, dat men alzo doen zou; want die zaak was recht in de ogen des gansen volks.", "5": "David dan vergaderde gans Israël van het Egyptische Sichor af, tot daar men komt te Hamath, om de ark Gods te brengen van Kirjath-jearim.", "6": "Toen toog David op met het ganse Israël naar Baäla, dat is, Kirjath-jearim, hetwelk in Juda is, dat hij van daar ophaalde de ark Gods, des HEEREN, Die tussen de cherubim woont, waar de Naam wordt aangeroepen.", "7": "En zij voerden de ark Gods op een nieuwen wagen uit het huis van Abinadab. Uza nu en Ahio leidden den wagen.", "8": "En David en gans Israël speelden voor het aangezicht Gods met alle macht, zo met liederen, als met harpen, en met luiten, en met trommelen, en met cimbalen, en met trompetten.", "9": "Toen zij aan den dorsvloer van Chidon gekomen waren, zo strekte Uza zijn hand uit, om de ark te houden, want de runderen struikelden.", "10": "Toen ontstak de toorn des HEEREN over Uza, en Hij sloeg hem, omdat hij zijn hand had uitgestrekt aan de ark; en hij stierf aldaar voor het aangezicht Gods.", "11": "En David ontstak, dat de HEERE een scheur gescheurd had aan Uza; daarom noemde hij diezelve plaats Perez-uza, tot op dezen dag.", "12": "En David vreesde den HEERE te dien dage, zeggende: Hoe zal ik de ark Gods tot mij brengen?", "13": "Daarom liet David de ark niet tot zich brengen in de stad Davids, maar deed ze afwijken in het huis van Obed-edom, den Gethiet.", "14": "Alzo bleef de ark Gods bij het huisgezin van Obed-edom, in zijn huis, drie maanden; en de HEERE zegende het huis van Obed-edom, en alles, wat hij had."}, "KJV": {"1": "And David consulted with the captains of thousands and hundreds, and with every leader.", "2": "And David said unto all the congregation of Israel, If it seem good unto you, and that it be of the LORD our God, let us send abroad unto our brethren every where, that are left in all the land of Israel, and with them also to the priests and Levites which are in their cities and suburbs, that they may gather themselves unto us:", "3": "And let us bring again the ark of our God to us: for we enquired not at it in the days of Saul.", "4": "And all the congregation said that they would do so: for the thing was right in the eyes of all the people.", "5": "So David gathered ➔ all Israel together, from Shihor of Egypt even unto the entering of Hemath, to bring the ark of God from Kirjathjearim.", "6": "And David went up, and all Israel, to Baalah, that is, to Kirjathjearim, which belonged to Judah, to bring up thence the ark of God the LORD, that dwelleth between the cherubims, whose name is called on it.", "7": "And they carried the ark of God in a new cart out of the house of Abinadab: and Uzza and Ahio drave the cart.", "8": "And David and all Israel played before God with all their might, and with singing, and with harps, and with psalteries, and with timbrels, and with cymbals, and with trumpets.", "9": "And when they came unto the threshingfloor of Chidon, Uzza put forth his hand to hold the ark; for the oxen stumbled.", "10": "And the anger of the LORD was kindled against Uzza, and he smote him, because he put his hand to the ark: and there he died before God.", "11": "And David was displeased, because the LORD had made a breach upon Uzza: wherefore that place is called Perezuzza to this day.", "12": "And David was afraid of God that day, saying, How shall I bring the ark of God home to me?", "13": "So David brought not the ark home to himself to the city of David, but carried it aside into the house of Obededom the Gittite.", "14": "And the ark of God remained with the family of Obededom in his house three months. And the LORD blessed the house of Obededom, and all that he had."}}, "tsk": {"1": [{"kopje": "hield raad", "refs": ["1 Kron 12:14", "1 Kron 12:20", "1 Kron 12:32", "2 Sam 6:1", "2 Kon 23:1", "2 Kron 29:20", "2 Kron 34:29", "2 Kron 34:30"]}], "2": [{"kopje": "Als het u goeddunkt", "refs": ["1 Kon 12:7", "2 Kon 9:15", "Spr 15:22", "Filem 1:8", "Filem 1:9"]}, {"kopje": "en het van de HEERE", "refs": ["Ex 18:23", "2 Sam 7:2-5"]}, {"kopje": "overige", "refs": ["1 Kron 10:7", "1 Sam 31:1", "Jes 37:4"]}, {"kopje": "de priesters", "refs": ["1 Kron 15:2-14", "Num 4:4-20", "2 Kron 31:4-21"]}, {"kopje": "de steden, met hun voorsteden", "refs": ["1 Kron 6:54-81", "Num 35:2-9"]}], "3": [{"kopje": "de ark", "refs": ["1 Sam 7:1", "1 Sam 7:2", "Ps 132:6"]}, {"kopje": "gevraagd", "refs": ["1 Sam 14:18", "1 Sam 14:36", "1 Sam 22:10", "1 Sam 22:15", "1 Sam 23:2", "1 Sam 23:9-12"]}], "4": [{"kopje": "die zaak", "refs": ["1 Sam 18:20", "2 Sam 3:36", "2 Kron 30:4", "Est 8:5"]}], "5": [{"kopje": "David", "refs": ["1 Sam 7:1", "2 Sam 6:1"]}, {"kopje": "Sichor", "refs": ["Num 34:5-8", "Joz 13:3-6", "1 Kon 4:21", "Jer 2:18"]}, {"kopje": "Hamath", "refs": ["Num 34:8", "Joz 13:5", "1 Kon 8:65", "2 Kon 25:21"]}, {"kopje": "Kirjath-jearim", "refs": ["1 Kron 13:6", "1 Sam 6:21", "1 Sam 7:1"]}], "6": [{"kopje": "Baäla", "refs": ["Joz 15:9", "Joz 15:60", "2 Sam 6:2"]}, {"kopje": "woont", "refs": ["Ex 25:22", "Num 7:89", "1 Sam 4:4", "2 Kon 19:15", "Ps 80:2", "Ps 99:1", "Jes 37:16"]}, {"kopje": "waar de Naam", "refs": ["Ex 20:24", "Ex 23:21", "Num 6:27", "1 Kon 8:16"]}], "7": [{"kopje": "voerden de ark", "refs": ["Num 3:10", 1 Kron 13:14", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"1 Kor 11:30-32": "Daarom zijn er onder u velen zwak en ziek, en velen slapen. Want als wij onszelf zouden oordelen, zouden wij niet geoordeeld worden. Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.", "1 Sam 5:11": "En zij zonden heen, en verzamelden alle vorsten van de Filistijnen, en zeiden: Zend de ark van de God van Israël heen, dat die terugkeert naar haar plaats, opdat zij mij en mijn volk niet doodt; want er was een dodelijke kwelling in de hele stad, en de hand van God was daar zeer zwaar.", "Num 17:4": "En u zult ze wegleggen in de tent van de samenkomst, voor de getuigenis, waar Ik met u samenkomen zal.", "1 Sam 14:18": "Toen zei Saul tegen Ahia: Breng de ark van God hierheen. Want de ark van God was op die dag bij de kinderen van Israël.", "2 Kron 29:25": "En hij stelde de Levieten aan in het huis van de HEERE, met cimbalen, met luiten en harpen, naar het gebod van David, en van Gad, de ziener van de koning, en van Nathan, de profeet; want dit gebod kwam van de hand van de HEERE, door de hand van Zijn profeten.", "1 Sam 10:5": "Daarna zult u komen op de heuvel van God, waar de bezettingen van de Filistijnen zijn; en het zal gebeuren, als u daar in de stad komt, dat u een groep profeten zult ontmoeten, die van de hoogte afkomen, met voor zich uit luiten, en trommels, en pijpen, en harpen, en zij zullen profeteren.", "1 Sam 6:20": "Toen zeiden de mensen van Beth-Semes: Wie zou kunnen bestaan voor het aangezicht van de HEERE, deze heilige God? En naar wie zal Hij van ons wegtrekken?", "Ps 132:8": "Sta op, HEERE, tot Uw rust, U en de ark van Uw sterkte!", "Jona 4:4": "En de HEERE zei: Is het terecht dat uw woede oplaait?", "1 Kron 12:32": "En van de kinderen van Issaschar, die verstand hadden van de tijden, om te weten wat Israël moest doen; hun hoofden waren tweehonderd, en al hun broeders volgden hun woord;", "1 Kron 15:24": "En Sebanja, en Josafat, en Nethaneel, en Amasai, en Zecharja, en Benaja, en Eliëzer, de priesters, bliezen op trompetten voor de ark van God; en Obed-edom en Jehia waren poortwachters van de ark.", "Deut 12:18": "Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt.", "Num 35:2-9": "Gebied de Israëlieten dat zij van de erfenis van hun bezitting steden aan de Levieten geven om te bewonen; daarbij zult u aan de Levieten ook voorsteden geven, rondom de steden. En die steden zullen zij hebben om te bewonen; maar hun voorsteden zullen zijn voor hun vee, en voor hun bezit, en voor al hun dieren, En de voorsteden van de steden, die u aan de Levieten zult geven, zullen van de stadsmuur af, naar buiten toe, duizend el zijn, rondom.", "1 Kron 6:54-81": "En dit waren hun woonplaatsen, naar hun kampementen, in hun gebieden, namelijk van de zonen van Aäron, van de familie van de Kahathieten, want dat lot was voor hen. En zij gaven hun Hebron, in het land van Juda, en haar voorsteden rondom die. Maar het veld van de stad, en haar dorpen, gaven zij aan Kaleb, de zoon van Jefunne.", "1 Kron 27:1": "Dit nu zijn de kinderen van Israël naar hun getal, de hoofden van de families, en de aanvoerders van de duizenden en van de honderden, met hun opzichters, die de koning dienden in alle zaken van de verdelingen, aankomend en weggaand van maand tot maand, in al de maanden van het jaar; elke verdeling was vierentwintigduizend man.", "Ps 119:120": "Het haar van mijn vlees is te berge gerezen van verschrikking voor U, en ik heb gevreesd voor Uw oordelen.", "Joz 15:9": "Daarna zal deze grens zich uitstrekken van de top van de berg tot aan de waterbron Nefthoah, en uitgaan tot de steden van het gebergte Efron. Verder zal deze grens zich uitstrekken naar Baäla; dat is Kirjath-jearim.", "1 Kron 16:37": "Zo liet hij daar, voor de ark van het verbond van de HEERE, Asaf en zijn broeders, om voortdurend te dienen voor de ark, naarmate op elke dag besteld was.", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "2 Sam 6:8": "En David werd toornig, omdat de HEERE een scheur gescheurd had aan Uza; en hij noemde die plaats Perez-uza, tot op deze dag.", "1 Kron 13:5-8": "David dan verzamelde heel Israël, van het Egyptische Sichor af, tot waar men bij Hamath komt, om de ark van God te brengen vanuit Kirjath-jearim. Toen trok David op met heel Israël naar Baäla, dat is Kirjath-jearim, dat in Juda ligt, om vandaar de ark van God op te halen, van de HEERE, Die tussen de cherubs woont, waar de Naam wordt aangeroepen. En zij voerden de ark van God op een nieuwe wagen uit het huis van Abinadab. Uza en Ahio leidden de wagen.", "1 Kron 15:27": "David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.", "Joz 14:3": "Want aan de twee stammen en de halve stam had Mozes een erfdeel gegeven aan de overkant van de Jordaan; maar aan de Levieten had hij geen erfdeel onder hen gegeven.", "1 Sam 5:10": "Toen zonden zij de ark van God naar Ekron; maar het gebeurde, toen de ark van God te Ekron kwam, dat die van Ekron riepen en zeiden: Zij hebben de ark van de God van Israël naar ons toe gebracht, om mij en mijn volk te doden.", "Ps 144:9": "O God, ik zal U een nieuw lied zingen; met de luit en het tiensnarig instrument zal ik U lofzingen.", "1 Kron 15:15": "En de nakomelingen van de Levieten droegen de ark van God op hun schouders, met de draagbomen die erop waren, zoals Mozes geboden had naar het woord van de HEERE.", "1 Sam 7:2": "En het gebeurde, vanaf die dag, dat de ark van de Heere in Kirjath-jearim bleef, en de tijd werd lang; het werden twintig jaar; en heel het huis van Israël klaagde de HEERE achterna.", "Jer 2:18": "En nu, wat hebt u te doen met de weg van Egypte, om de wateren van Sihor te drinken? En wat hebt u te doen met de weg van Assur, om de wateren van de rivier te drinken?", "1 Kon 4:21": "En Salomo heerste over al de koninkrijken, van de rivier tot het land van de Filistijnen, en tot aan het gebied van Egypte; die brachten geschenken, en dienden Salomo al de dagen van zijn leven.", "1 Sam 4:4": "Het volk zond dan naar Silo, en men bracht vandaar de ark van het verbond van de HEERE van de heerscharen, die tussen de cherubs† woont; en de twee zonen van Eli, Hofni en Pinehas, waren daar bij de ark van het verbond van God.", "Dan 3:5-7": "Op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, het akkoordgezang, en allerlei soorten muziek, dan zult u neervallen en aanbidden het gouden beeld, dat de koning Nebukadnezar heeft opgericht; En wie niet neervalt en aanbidt, die zal op datzelfde moment in het midden van de brandende vuuroven geworpen worden. Daarom, op dat moment, toen al die volken het geluid hoorden van de hoorn, de pijp, de citer, de vedel, de psalters, en allerlei soorten muziek, vielen alle volken, naties en tongen neer en aanbaden het gouden beeld, dat de koning Nebukadnezar had opgericht.", "1 Sam 4:22": "En zij zei: De eer is gevankelijk weggevoerd uit Israël, want de ark van God is genomen.", "Joz 13:3": "Van de Sichor af, die voor aan Egypte is, tot aan de grens van Ekron toe naar het noorden, dat aan de Kanaänieten toegerekend wordt; vijf vorsten van de Filistijnen, de Gazatiet en de Asdodiet, de Askeloniet, de Gathiet en de Ekroniet, en de Avvieten.", "Deut 18:1-8": "De Levitische priesters, de hele stam van Levi, zullen geen deel of erfdeel hebben met Israël; de vuuroffers van de HEERE en Zijn erfdeel zullen zij eten. Daarom zal hij geen erfdeel hebben tussen zijn broeders; de HEERE is zijn Erfdeel, zoals Hij tot hem gesproken heeft. Dit nu zal het recht van de priesters zijn van het volk, van hen die een offerande offeren, hetzij een os of klein vee: dat hij de priester de schouder zal geven, en beide kaken, en de pens.", "1 Kron 15:16": "En David zei tegen de leiders van de Levieten, dat zij hun broeders, de zangers, moesten aanstellen met muziekinstrumenten, met luiten, en harpen, en cimbalen, zodat zij zich lieten horen, terwijl zij de stem verhieven met blijdschap.", "2 Kron 34:29": "Toen zond de koning heen, en verzamelde alle oudsten van Juda en Jeruzalem.", "Num 4:4-20": "Dit zal de dienst zijn van de zonen van Kohath, in de tent der samenkomst: namelijk het allerheiligste. Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken. En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen.", "Num 34:5-8": "Verder zal deze grens omgaan van Azmon naar de rivier van Egypte, en haar uiteinden zullen bij de zee zijn. Wat de westgrens betreft, daarvoor zal de grote zee voor u de grens zijn; dit zal uw westgrens zijn. Verder zal dit voor u de noordgrens zijn: vanaf de grote zee zult u de berg Hor voor uzelf aftekenen.", "Ps 57:9": "Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken.", "1 Kron 15:28": "Zo bracht heel Israël de ark van het verbond van de HEERE op, met gejuich, en met geluid van de bazuin, en met trompetten, en met cimbalen, en maakte geluid met luiten en met harpen.", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "2 Kron 30:4": "En deze zaak was goed in de ogen van de koning, en in de ogen van de hele gemeente.", "1 Kron 16:1": "Toen zij de ark van God binnenbrachten, zetten zij die in het midden van de tent die David voor haar gespannen had; en zij offerden brandoffers en dankoffers voor het aangezicht van God.", "2 Sam 3:36": "Toen al het volk dit merkte, was het goed in hun ogen; alles wat de koning gedaan had, was goed in de ogen van heel het volk.", "2 Sam 6:7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "1 Kron 25:6": "Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.", "2 Kon 1:9": "En hij zond naar hem een leider over vijftig met zijn vijftigtal. En toen hij naar hem opklom (want zie, hij zat op de top van een berg), sprak hij tot hem: Man van God! De koning zegt: Kom naar beneden.", "2 Sam 6:5-23": "En David en het hele huis van Israël speelden voor het aangezicht van de HEERE, met allerlei snarenspel van dennenhout, met harpen, en met luiten, en met trommels, ook met schellen, en met cimbalen. Toen zij nu kwamen tot aan de dorsvloer van Nachon, strekte Uza zijn hand uit naar de ark van God, en hield die vast, want de runderen struikelden. Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "2 Kron 23:2": "Die trokken door Juda, en verzamelden de Levieten uit alle steden van Juda, en de hoofden van de vaderen van Israël, en zij kwamen naar Jeruzalem.", "Ps 68:26": "De zangers gingen voorop, de speellieden erachteraan, in het midden de trommelende meisjes.", "Deut 12:19": "Wacht u ervoor dat u de Leviet niet verlaat, al uw dagen in uw land.", "Amos 5:23": "Doe het lawaai van uw liederen van Mij weg; ook wil Ik het spel van uw luiten niet horen.", "Num 16:35": "Daarbij kwam er een vuur uit van de HEERE, en het verteerde die tweehonderd en vijftig mannen die reukwerk offerden.", "Ps 132:6": "Zie, wij hebben van haar gehoord in Efratha; wij hebben haar gevonden in de velden van Jaar.", "1 Kron 15:2-14": "Toen zei David: Niemand mag de ark van God dragen, dan de Levieten; want die heeft de HEERE uitgekozen, om de ark van God te dragen, en om Hem te dienen tot in eeuwigheid. Ook verzamelde David heel Israël in Jeruzalem, om de ark van de HEERE op te halen naar haar plaats, die hij voor haar bereid had. En David verzamelde de nakomelingen van Aäron en de Levieten.", "2 Kon 3:15": "Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.", "Ezech 34:1-5": "En het woord van de HEERE gebeurde tot mij, en Hij zei: Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet.", "2 Sam 4:3": "En de Beerothieten waren gevlucht naar Gitthaïm, en waren daar vreemdelingen tot op deze dag.", "Amos 6:5": "Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "Num 3:10": "Maar Aäron en zijn zonen zult u aanstellen, dat zij hun priesterambt waarnemen; en de vreemde die nadert, zal gedood worden.", "Filem 1:8": "Daarom, hoewel ik grote vrijmoedigheid heb in Christus om u te bevelen wat betamelijk is,", "1 Kron 15:10-24": "Uit de nakomelingen van Uzziël was Amminadab leider, en zijn broeders waren honderdtwaalf. En David riep de priesters Zadok en Abjathar, en de Levieten Uriël, Asaja en Joël, Semaja, en Eliël, en Amminadab. En hij zei tegen hen: U bent hoofden van de families onder de Levieten; heilig uzelf, u en uw broers, zodat u de ark van de HEERE, de God van Israël, opbrengt naar de plaats, die ik voor haar bereid heb.", "Ex 30:36": "En daarvan moet u een deel heel fijn stoten, en daarvan moet u leggen vóór de getuigenis, in de tent van de samenkomst, waar Ik tot u komen zal; het zal voor u allerheiligst zijn.", "1 Sam 16:23": "En het gebeurde, als de geest van God over Saul kwam, dat David de harp nam en met zijn hand speelde; dat gaf Saul verademing, en het werd beter met hem, en de boze geest week van hem.", "2 Sam 6:1-11": "Daarna verzamelde David opnieuw alle uitgelezen mannen in Israël, dertigduizend. En David maakte zich op en ging heen met al het volk dat bij hem was, van Baälim-juda, om vandaar de ark van God op te brengen, bij wie de Naam wordt aangeroepen, de Naam van de HEERE van de heerscharen, Die daarop woont tussen de cherubs. En zij zetten de ark van God op een nieuwe wagen, en haalden die uit het huis van Abinadab, dat op een heuvel is; en Uza en Ahio, zonen van Abinadab, leidden de nieuwe wagen.", "Ps 47:6": "God vaart op met gejuich, de HEERE met bazuingeschal.", "1 Sam 6:21": "Zo zonden zij boden naar de inwoners van Kirjath-Jearim en zeiden: De Filistijnen hebben de ark van de HEERE teruggebracht; kom naar beneden, haal haar op naar u toe.", "Ex 23:21": "Wees op uw hoede voor Zijn aangezicht, en wees Zijn stem gehoorzaam, en verbitter Hem niet; want Hij zal uw overtredingen niet vergeven; want Mijn Naam is in Hem.", "1 Kron 13:1-4": "David hield raad met de leiders van de duizenden en van de honderden, en met alle vorsten. En David zei tegen de hele gemeente van Israël: Als het u goeddunkt, en het van de HEERE, onze God, is, laten wij ons uitbreiden en laten wij zenden aan onze overige broeders, in alle landen van Israël, en de priesters en Levieten, die met hen zijn in de steden, met hun voorsteden, opdat zij bij ons verzameld worden. En laten wij de ark van onze God naar ons terughalen, want wij hebben er in de dagen van Saul niet naar gevraagd.", "1 Sam 22:10": "Die de HEERE voor hem raadpleegde, en hem teerkost gaf; hij gaf hem ook het zwaard van Goliath, de Filistijn.", "1 Kron 15:19": "De zangers nu, Heman, Asaf en Ethan, lieten zich horen met koperen cimbalen;", "Job 25:6": "Hoeveel te minder de mens, die een made is, en het mensenkind, die een worm is!", "2 Kon 9:15": "maar de koning Joram was teruggekeerd om zich in Jizreël te laten genezen van de verwondingen die de Syriërs hem toegebracht hadden, toen hij streed tegen Hazaël, de koning van Syrië.) En Jehu zei: Als dit uw wens is, laat dan niemand uit de stad ontkomen, die dit in Jizreël zou gaan vertellen.", "1 Kron 23:5": "En vierduizend poortwachters, en vierduizend lofzangers van de HEERE, met instrumenten die ik gemaakt heb, zei David, om lof te zingen.", "1 Kron 26:8": "Deze allen waren uit de kinderen van Obed-Edom; zij, en hun kinderen, en hun broers, dappere mannen, krachtig genoeg voor de dienst; er waren er tweeënzestig van Obed-Edom.", "Num 34:8": "Vanaf de berg Hor zult u de grens aftekenen tot waar men bij Hamath komt; en de uiteinden van deze grens zullen bij Zedad zijn.", "2 Kron 6:41": "En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.", "1 Sam 6:3": "Zij dan zeiden: Als u de ark van de God van Israël wegzendt, zend haar niet leeg weg, maar geef Hem in elk geval een schuldoffer terug; dan zult u genezen worden, en aan u zal bekend worden waarom Zijn hand niet van u afwijkt.", "1 Kron 10:7": "Toen alle mannen van Israël die in het dal waren zagen dat zij gevlucht waren, en dat Saul en zijn zonen dood waren, verlieten zij hun steden en vluchtten. Toen kwamen de Filistijnen en woonden daarin.", "Joz 6:6": "Toen riep Jozua, de zoon van Nun, de priesters, en zei tegen hen: Draagt de ark van het verbond, en laat zeven priesters zeven ramsbazuinen dragen, voor de ark van de HEERE.", "1 Sam 4:17": "Toen antwoordde de brenger van de boodschap en zei: Israël is gevlucht voor de Filistijnen, en er is ook een grote nederlaag onder het volk gebeurd; bovendien zijn uw twee zonen, Hofni en Pinehas, gestorven, en de ark van God is genomen.", "2 Sam 6:2": "En David maakte zich op en ging heen met al het volk dat bij hem was, van Baälim-juda, om vandaar de ark van God op te brengen, bij wie de Naam wordt aangeroepen, de Naam van de HEERE van de heerscharen, Die daarop woont tussen de cherubs.", "Gen 30:27": "Toen zei Laban tegen hem: Als ik toch genade gevonden heb in uw ogen; ik heb ondervonden dat de HEERE mij om u gezegend heeft.", "1 Sam 23:9-12": "Toen David begreep dat Saul dit kwaad heimelijk tegen hem voorhad, zei hij tegen de priester Abjathar: Breng de efod hierheen. En David zei: HEERE, God van Israël! Uw dienaar heeft zeker gehoord dat Saul van plan is naar Kehila te komen, om de stad te vernietigen om mijnentwil. Zullen de burgers van Kehila mij ook in zijn hand overgeven? Zal Saul afkomen, zoals Uw dienaar gehoord heeft? O HEERE, God van Israël, vertel het toch aan Uw dienaar! En de HEERE zei: Hij zal afkomen.", "Joz 13:3-6": "Van de Sichor af, die voor aan Egypte is, tot aan de grens van Ekron toe naar het noorden, dat aan de Kanaänieten toegerekend wordt; vijf vorsten van de Filistijnen, de Gazatiet en de Asdodiet, de Askeloniet, de Gathiet en de Ekroniet, en de Avvieten. Vanaf het zuiden, het hele land van de Kanaänieten, en Meara, die van de Sidoniërs is, tot Afek toe, tot aan de grens van de Amorieten. Daarbij het land van de Giblieten, en de hele Libanon naar de opgang van de zon toe, van Baäl-gad af, onder aan de berg Hermon, tot aan de ingang van Hamath toe.", "1 Kron 13:6-8": "Toen trok David op met heel Israël naar Baäla, dat is Kirjath-jearim, dat in Juda ligt, om vandaar de ark van God op te halen, van de HEERE, Die tussen de cherubs woont, waar de Naam wordt aangeroepen. En zij voerden de ark van God op een nieuwe wagen uit het huis van Abinadab. Uza en Ahio leidden de wagen. En David en heel Israël speelden voor het aangezicht van God met alle kracht, zowel met liederen, als met harpen, en met luiten, en met trommels, en met cimbalen, en met trompetten.", "1 Kron 15:1": "En David bouwde zich huizen in zijn stad; en hij bereidde voor de ark van God een plaats, en spande een tent voor haar.", "Ex 20:24": "Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen.", "Gen 32:32": "Daarom eten de kinderen van Israël tot op deze dag de verrukte zenuw niet, die op het heupgewricht zit, omdat Hij het heupgewricht van Jakob had aangeraakt, bij de verrukte zenuw.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "1 Sam 6:19": "En de Heere sloeg onder de mensen van Beth-Semes, omdat zij in de ark van de HEERE gekeken hadden; ja, Hij sloeg van het volk zeventig mannen, en vijftigduizend mannen. Toen bedreef het volk rouw, omdat de HEERE een grote slag onder het volk geslagen had.", "2 Sam 6:3": "En zij zetten de ark van God op een nieuwe wagen, en haalden die uit het huis van Abinadab, dat op een heuvel is; en Uza en Ahio, zonen van Abinadab, leidden de nieuwe wagen.", "Joz 4:9": "Jozua richtte ook twaalf stenen op, midden in de Jordaan, op de standplaats van de voeten van de priesters die de ark van het verbond droegen; en zij zijn daar tot op deze dag.", "Joz 7:6-9": "Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd. En Jozua zei: Ach, Heere HEERE! Waarom hebt U dit volk ooit de Jordaan laten oversteken, om ons te geven in de hand van de Amorieten, om ons te vernietigen? Was het toch maar zo dat wij tevreden waren geweest en gebleven waren aan de overkant van de Jordaan! Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd?", "Num 4:15": "Als Aäron en zijn zonen het dekken van het heiligdom, en van al het gereedschap van het heiligdom, bij het optrekken van het leger, voltooid hebben, dan zullen daarna de zonen van Kohath komen om te dragen; maar zij zullen dat heilige niet aanraken, opdat zij niet sterven. Dit is de last van de zonen van Kohath, in de tent der samenkomst.", "1 Sam 22:15": "Ben ik vandaag begonnen God voor hem te raadplegen? Dat zij verre van mij, dat de koning zijn knecht iets aanrekent, of het hele huis van mijn vader; want uw knecht heeft van al deze dingen niets geweten, klein of groot.", "Mal 3:10": "Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Deut 10:9": "Daarom heeft Levi geen deel, en ook geen erfdeel met zijn broeders; de HEERE is zijn erfdeel, zoals de HEERE, uw God, tegen hem gesproken heeft.", "Richt 20:27": "En de kinderen van Israël vroegen de HEERE, want daar was de ark van het verbond van God in die dagen.", "1 Sam 31:1": "De Filistijnen streden tegen Israël; en de mannen van Israël vluchtten voor de Filistijnen, en vielen verslagen op het gebergte Gilboa.", "Deut 14:27-29": "Maar de Leviet die in uw poorten is, zult u niet verlaten; want hij heeft geen deel noch erfdeel met u. Aan het einde van drie jaren zult u alle tienden van uw opbrengst voortbrengen, in datzelfde jaar, en u zult ze wegleggen in uw poorten; Zo zal de Leviet komen – omdat hij geen deel noch erfdeel met u heeft – en de vreemdeling, en de wees en de weduwe die in uw poorten zijn, en zij zullen eten en verzadigd worden; opdat de HEERE, uw God, u zegent in al het werk van uw hand, dat u doen zult.", "Jes 37:4": "Misschien zal de HEERE, uw God, de woorden horen van Rabsaké, aan wie zijn heer, de koning van Assyrië, gezonden heeft, om de levende God te honen en te schelden met woorden die de HEERE, uw God, gehoord heeft; hef dan een gebed op voor het overblijfsel dat nog gevonden wordt.", "Job 25:5": "Zie, zelfs de maan geeft geen schijnsel, en de sterren zijn niet zuiver in Zijn ogen.", "Ps 71:22": "Ook zal ik U loven met het instrument van de luit, Uw trouw, mijn God; ik zal U psalmzingen met de harp, o Heilige van Israël!", "2 Kon 23:1": "Toen zond de koning boden, en tot hem verzamelden zich alle oudsten van Juda en Jeruzalem.", "2 Sam 7:2-5": "Dat de koning zei tegen de profeet Nathan: Zie toch, ik woon in een huis van cederhout, en de ark van God woont in het midden van de tentkleden. En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei:", "Spr 10:22": "De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.", "Ex 18:23": "Als u deze zaak doet, en God het u gebiedt, zult u het kunnen volhouden; zo zal ook al dit volk in vrede naar zijn plaats gaan.", "Ps 33:2": "Looft de HEERE met de harp; zingt Hem psalmen met de luit, en het tiensnarig instrument.", "1 Kron 12:14": "Dezen waren van de kinderen van Gad, aanvoerders van het leger; een van de kleinsten was over honderd, en de grootste over duizend.", "1 Kron 16:4": "En hij stelde voor de ark van de HEERE sommigen uit de Levieten aan tot dienaars, en dat om de HEERE, de God van Israël, te vermelden, en te loven, en te prijzen.", "1 Sam 4:11": "En de ark van God werd genomen, en de twee zonen van Eli, Hofni en Pinehas, stierven.", "Matt 25:24": "Maar hij die het ene talent ontvangen had, kwam ook en zei: Heer, ik kende u, dat u een hard mens bent, die maait waar u niet gezaaid hebt, en verzamelt vandaar waar u niet gestrooid hebt;", "Openb 5:8": "En toen Het dat boek genomen had, vielen de vier dieren en de vierentwintig oudsten voor het Lam neer, elk met een citer en gouden schalen vol reukwerk, dat zijn de gebeden van de heiligen.", "Ps 150:4": "Loof Hem met de trommel en fluit; loof Hem met snarenspel en orgel!", "1 Kron 15:18": "En met hen hun broeders van de tweede orde: Zecharja, Ben en Jaaziel, en Semiramoth, en Jehiel, en Unni, Eliab, en Benaja, en Maaseja, en Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, de poortwachters.", "2 Sam 7:2": "Dat de koning zei tegen de profeet Nathan: Zie toch, ik woon in een huis van cederhout, en de ark van God woont in het midden van de tentkleden.", "Ps 149:3": "Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "Joz 7:6-15": "Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd. En Jozua zei: Ach, Heere HEERE! Waarom hebt U dit volk ooit de Jordaan laten oversteken, om ons te geven in de hand van de Amorieten, om ons te vernietigen? Was het toch maar zo dat wij tevreden waren geweest en gebleven waren aan de overkant van de Jordaan! Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd?", "Joz 15:60": "Kirjath-baal, dat is Kirjath-jearim, en Rabba; twee steden en haar dorpen.", "2 Sam 6:1": "Daarna verzamelde David opnieuw alle uitgelezen mannen in Israël, dertigduizend.", "2 Kron 15:14": "En zij zwoeren de HEERE met luide stem en met gejuich, en ook met trompetten en met bazuinen.", "1 Kron 13:9-11": "Toen zij bij de dorsvloer van Chidon gekomen waren, strekte Uza zijn hand uit om de ark vast te houden, want de runderen struikelden. Toen ontstak de toorn van de HEERE tegen Uza, en Hij sloeg hem, omdat hij zijn hand had uitgestrekt naar de ark; en hij stierf daar voor het aangezicht van God. En David ontstak, omdat de HEERE een scheur gescheurd had aan Uza; daarom noemde hij die plaats Perez-uza, tot op deze dag.", "1 Sam 6:7": "Neem dan nu en maak een nieuwe wagen, en twee zogende koeien waarop geen juk gekomen is; span de koeien voor de wagen, en breng hun kalveren van achter hen terug naar huis.", "2 Kron 31:4-21": "En hij zei tegen het volk, tegen de inwoners van Jeruzalem, dat zij het deel van de priesters en Levieten zouden geven, opdat zij versterkt zouden worden in de wet van de HEERE. Toen dat bevel nu bekend werd, brachten de kinderen van Israël veel eerstelingen van koren, most, en olie, en honing, en van alle opbrengsten van het veld; ook brachten zij de tienden van alles in met overvloed. En de kinderen van Israël en Juda, die in de steden van Juda woonden, brachten ook tienden van de runderen en van de schapen, en tienden van de heilige dingen die aan de HEERE, hun God, geheiligd waren, en maakten er veel hopen van.", "1 Kron 26:4": "Obed-Edom had ook kinderen: Semaja was de eerstgeborene, Jozabad de tweede, Joah de derde, en Sachar de vierde, en Nethaneel de vijfde,", "2 Sam 6:6-8": "Toen zij nu kwamen tot aan de dorsvloer van Nachon, strekte Uza zijn hand uit naar de ark van God, en hield die vast, want de runderen struikelden. Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God. En David werd toornig, omdat de HEERE een scheur gescheurd had aan Uza; en hij noemde die plaats Perez-uza, tot op deze dag.", "1 Sam 7:1": "Toen kwamen de mannen van Kirjath-jearim, en haalden de ark van de HEERE op, en zij brachten haar in het huis van Abinadab, op de heuvel; en zij heiligden zijn zoon Eleazar, om de ark van de HEERE te bewaren.", "2 Kron 34:30": "En de koning ging op naar het huis van de HEERE, en alle mannen van Juda en de inwoners van Jeruzalem, alsook de priesters en de Levieten, en heel het volk, van de grootste tot de kleinste toe; en men las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was.", "Num 31:14": "En Mozes werd zeer boos op de aanvoerders van het leger, de hoofdlieden over de duizenden, en de hoofdlieden over de honderden, die uit de strijd van die oorlog kwamen.", "2 Kron 1:4": "(Maar de ark van God had David opgebracht van Kirjath-jearim naar de plaats die David voor haar bereid had; want hij had voor haar een tent gespannen te Jeruzalem.)", "Lev 16:2": "De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel.", "1 Kon 8:16": "Van die dag af, dat Ik Mijn volk Israël uit Egypteland uitgevoerd heb, heb Ik geen stad verkoren uit alle stammen van Israël, om een huis te bouwen, dat Mijn Naam daar zou wezen; maar Ik heb David verkoren, dat hij over Mijn volk Israël wezen zou.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Joz 13:5": "Daarbij het land van de Giblieten, en de hele Libanon naar de opgang van de zon toe, van Baäl-gad af, onder aan de berg Hermon, tot aan de ingang van Hamath toe.", "Jes 23:3": "En wiens inkomsten het zaad van Sichor was over het grote water, de oogst van de rivier; en zij was de markt van de heidenvolken.", "Filem 1:9": "Vraag ik u nochtans liever door de liefde, aangezien ik zo iemand ben, namelijk Paulus, een oud man, en nu ook een gevangene van Jezus Christus.", "2 Sam 6:15": "Zo brachten David en het hele huis van Israël de ark van de HEERE op, met gejuich en met geluid van bazuinen.", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "Ps 68:26-28": "De zangers gingen voorop, de speellieden erachteraan, in het midden de trommelende meisjes. Looft God in de gemeenten, de Heere, u die uit de bron van Israël bent! Daar is Benjamin de kleine, die over hen heerste, de vorsten van Juda, met hun vergadering, de vorsten van Zebulon, de vorsten van Naftali.", "1 Sam 4:7": "Daarom werden de Filistijnen bang, want zij zeiden: God is in het leger gekomen. En zij zeiden: Wee ons, want zoiets is eerder nooit gebeurd!", "1 Kron 25:5": "Deze allen waren kinderen van Heman, de ziener van de koning, in de woorden van God, om de hoorn te verheffen; want God had Heman veertien zonen gegeven, en drie dochters.", "Ps 108:3": "Ontwaak, u luit en harp! Ik zal in de dageraad ontwaken.", "1 Sam 18:20": "Doch Michal, de dochter van Saul, had David lief. Toen dat Saul te kennen werd gegeven, was die zaak goed in zijn ogen.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "2 Sam 6:6": "Toen zij nu kwamen tot aan de dorsvloer van Nachon, strekte Uza zijn hand uit naar de ark van God, en hield die vast, want de runderen struikelden.", "1 Kron 25:1-6": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst. Van de kinderen van Asaf waren Zakkur, en Jozef, en Nethanja, en Asarela, kinderen van Asaf; onder leiding van Asaf, die onder leiding van de koning profeteerde. Aangaande Jeduthun: de kinderen van Jeduthun waren Gedalja, en Zeri, en Jesaja, Hasabja en Mattithja, zes; onder leiding van hun vader Jeduthun, die op harpen profeteerde om de HEERE te danken en te loven.", "2 Sam 6:5": "En David en het hele huis van Israël speelden voor het aangezicht van de HEERE, met allerlei snarenspel van dennenhout, met harpen, en met luiten, en met trommels, ook met schellen, en met cimbalen.", "Ps 150:3-5": "Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp! Loof Hem met de trommel en fluit; loof Hem met snarenspel en orgel! Loof Hem met luid klinkende cimbalen; loof Hem met cimbalen van vreugdegeluid!", "Joz 18:7": "Want de Levieten hebben geen deel in uw midden; maar het priesterschap van de HEERE is hun erfdeel. Gad nu, en Ruben, en de halve stam van Manasse, hebben hun erfdeel genomen aan de overkant van de Jordaan, oostwaarts, dat Mozes, de knecht van de HEERE, hun gegeven heeft.", "2 Kron 29:20": "Toen stond koning Hizkia vroeg op, en verzamelde de leiders van de stad, en hij ging op naar het huis van de HEERE.", "2 Sam 6:10": "David dan wilde de ark van de HEERE niet bij zich laten overbrengen naar de stad van David; maar David deed haar afwijken naar het huis van Obed-edom, de Gethiet.", "1 Sam 14:36": "Daarna zei Saul: Laten we de Filistijnen achterna trekken, bij nacht, en hen beroven totdat het morgen licht wordt, en laten we niet één man van hen overlaten. Zij nu zeiden: Doe alles wat goed is in uw ogen; maar de priester zei: Laten we hier tot God naderen.", "2 Kon 25:21": "En de koning van Babel sloeg hen, en doodde hen te Ribla, in het land van Hamath. Zo werd Juda uit zijn land gevankelijk weggevoerd.", "Num 26:62": "En hun getelden waren drieëntwintigduizend, al wat mannelijk is, van een maand oud en daarboven; want dezen werden niet geteld onder de kinderen van Israël, omdat hun geen erfenis gegeven werd onder de kinderen van Israël.", "1 Kron 25:1": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Ps 81:3": "Heft een psalm op, en geeft de trommel; de liefelijke harp met de luit.", "2 Sam 15:25": "Toen zei de koning tegen Zadok: Breng de ark van God terug in de stad; als ik genade zal vinden in de ogen van de HEERE, dan zal Hij mij terughalen, en zal Hij mij haar laten zien, alsook Zijn woning.", "Num 17:12": "Toen spraken de kinderen van Israël tot Mozes en zeiden: Zie, wij geven de geest, wij vergaan, wij allen vergaan!", "Luk 5:9": "Want verbazing had hem en allen die met hem waren overweldigd, over de vangst van de vissen die zij gevangen hadden;", "2 Kron 26:16-20": "Maar toen hij sterk geworden was, verhief zijn hart zich tot zijn eigen verderf, en hij overtrad tegen de HEERE, zijn God; want hij ging het tempel van de HEERE binnen, om te roken op het reukaltaar. Doch Azaria, de priester, ging hem na, en met hem priesters van de HEERE, tachtig kloeke mannen. En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "1 Sam 4:3": "Toen het volk weer in het leger gekomen was, zeiden de oudsten van Israël: Waarom heeft de HEERE ons vandaag verslagen voor de Filistijnen? Laten wij uit Silo de ark van het verbond van de HEERE tot ons nemen, en laat die in ons midden komen, zodat zij ons verlost uit de hand van onze vijanden.", "1 Kon 8:27": "Maar zou God werkelijk op de aarde wonen? Zie, de hemelen, ja, de hemel der hemelen kunnen U niet bevatten, hoeveel te minder dit huis, dat ik gebouwd heb!", "2 Sam 6:11": "En de ark van de HEERE bleef in het huis van Obed-edom, de Gethiet, drie maanden; en de HEERE zegende Obed-edom en zijn hele huis.", "2 Sam 6:9": "En David vreesde de HEERE die dag; en hij zei: Hoe zal de ark van de HEERE bij mij komen?", "Joz 13:14": "Alleen aan de stam Levi gaf hij geen erfenis. De vuuroffers van God, de HEERE van Israël, zijn zijn erfenis, zoals Hij tot hem gesproken had.", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Gen 39:5": "En het gebeurde vanaf toen, dat hij hem aangesteld had over zijn huis en over alles wat hij had, dat de HEERE het huis van de Egyptenaar zegende, om Jozefs wil; ja, de zegen van de HEERE was op alles wat hij had, in het huis en op het veld.", "1 Sam 3:3": "en Samuël zich ook had neergelegd, voordat de lamp van God uitgedaan werd, in de tempel van de HEERE, waar de ark van God was,", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "2 Sam 6:4": "Toen zij hem nu uit het huis van Abinadab, dat op de heuvel is, met de ark van God, wegvoerden, ging Ahio voor de ark uit.", "Mal 3:11": "En Ik zal om uwentwil de opeter bestraffen, zodat hij u de vrucht van het land niet verderft; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE van de heerscharen.", "Deut 34:6": "En Hij begroef hem in een dal, in het land van Moab, tegenover Beth-peor; en niemand heeft zijn graf gekend, tot op deze dag.", "Spr 15:22": "Plannen worden tenietgedaan als er geen overleg is; maar door veel raadgevers komen ze tot stand.", "Ps 99:1": "De HEERE regeert, dat de volken beven; Hij zit tussen de cherubs; de aarde beeft.", "1 Kon 8:65": "Op diezelfde tijd hield Salomo ook het feest, en heel Israël met hem, een grote gemeente, vanaf de ingang van Hamath tot de rivier van Egypte, voor het aangezicht van de HEERE, onze God, zeven dagen en zeven dagen, dat is veertien dagen.", "Jes 37:16": "O HEERE van de heerscharen¹, God van Israël, Die tussen de cherubs² woont! U Zelf, U alleen bent de God van alle koninkrijken van de aarde; U hebt de hemel en de aarde gemaakt!", "2 Kon 1:11": "En hij zond weer naar hem een andere leider over vijftig met zijn vijftigtal. Deze antwoordde en sprak tot hem: Man van God! Zo zegt de koning: Kom snel naar beneden.", "Richt 20:28": "En Pinehas, de zoon van Eleazar, de zoon van Aäron, stond voor Zijn aangezicht in die dagen, en zei: Zal ik nog meer uittrekken ten strijde tegen de kinderen van Benjamin, mijn broeder, of zal ik ophouden? En de HEERE zei: Trek op, want morgen zal Ik hem in uw hand geven.", "1 Kron 12:20": "Toen hij naar Ziklag ging, vielen tot hem uit Manasse: Adnah, en Jozabad, en Jediaël, en Michaël, en Jozabad, en Elihu, en Zillethai; aanvoerders van de duizenden die in Manasse waren.", "1 Kron 16:42": "Met hen dan waren Heman en Jeduthun, met trompetten en cimbalen voor hen die zich lieten horen, en met instrumenten van de muziek van God; maar de zonen van Jeduthun waren aan de poort.", "Lev 10:1-3": "En de zonen van Aäron, Nadab en Abihu, namen ieder zijn wierookvat en deden er vuur in, en legden er reukwerk op, en brachten vreemd vuur voor het aangezicht van de HEERE, wat Hij hun niet geboden had. Toen ging er een vuur uit van het aangezicht van de HEERE, en verteerde hen; en zij stierven voor het aangezicht van de HEERE. En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Luk 5:8": "Toen Simon Petrus dat zag, viel hij neer aan de knieën van Jezus en zei: Heere, ga weg van mij, want ik ben een zondig mens.", "1 Sam 23:2": "En David vroeg de HEERE: Zal ik heengaan en deze Filistijnen verslaan? En de HEERE zei tegen David: Ga heen, en u zult de Filistijnen verslaan en Kehila verlossen.", "Num 14:44": "Toch waagden zij het roekeloos, om de top van de berg te beklimmen; maar de ark van het verbond van de HEERE en Mozes weken niet uit het midden van het leger.", "1 Kron 26:5": "Ammiël de zesde, Issaschar de zevende, Peullethai de achtste; want God had hem gezegend.", "1 Kron 15:2": "Toen zei David: Niemand mag de ark van God dragen, dan de Levieten; want die heeft de HEERE uitgekozen, om de ark van God te dragen, en om Hem te dienen tot in eeuwigheid.", "Deut 12:12": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zonen, en uw dochters, en uw dienstknechten, en uw dienstmaagden, en de Leviet die in uw poorten is; want hij heeft geen deel noch erfenis met u.", "1 Kon 12:7": "En zij spraken tegen hem en zeiden: Als u vandaag een knecht van dit volk wilt zijn, en hen dient, en hun antwoordt, en tot hen goede woorden spreekt, dan zullen zij voor altijd uw knechten zijn.", "1 Kron 16:5": "Asaf was het hoofd, en Zecharja de tweede na hem; Jeïel, en Semiramoth, en Jehiël, en Mattithja, en Eliab, en Benaja, en Obed-Edom, en Jeïel, met instrumenten van luiten en met harpen; en Asaf liet zich horen met cimbalen;", "Ex 30:6": "En u moet het zetten vóór het voorhangsel dat vóór de ark van de getuigenis zal zijn; vóór het verzoendeksel, dat boven de getuigenis zal zijn, waar Ik met u samen zal komen.", "Num 6:27": "Zo zullen zij Mijn Naam op de kinderen van Israël leggen; en Ik zal hen zegenen.", "Num 17:13": "Al wie ook maar enigszins nadert tot de tabernakel van de HEERE, zal sterven; zullen wij dan allen stervend omkomen?", "Jona 4:9": "Toen zei God tegen Jona: Is het terecht dat uw woede oplaait over de wonderboom? En hij zei: Terecht laait mijn woede op, tot de dood toe.", "Ps 150:3": "Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Est 8:5": "En zij zei: Als het de koning goeddunkt, en als ik genade voor zijn ogen gevonden heb, en deze zaak voor de koning juist is, en ik in zijn ogen aangenaam ben, laat er dan geschreven worden dat de brieven en het plan van Haman, de zoon van Hammedatha, de Agagiet, teruggeroepen worden, welke hij geschreven heeft om de Joden om te brengen, die in alle landschappen van de koning zijn.", "Ps 92:4": "Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.", "Spr 3:9": "Vereer de HEERE met uw goed, en met de eerstelingen van al uw inkomsten;"}, "noten": {"1": "SV: gezocht. D.i.: er niet om vroegen, er niet bij te rade gingen.", "2": "Cherubs: engelenwezens (Hebreeuws meervoud van cherub)."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1732\">David</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3289\">hield</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3289\">raad</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3289\">met</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8269\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8269\">leiders</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8269\">van</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H505\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H505\">duizenden</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1732\">en</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1732\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3967\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3967\">honderden</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H3967\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5973\">met</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3605\">alle</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H5057\">vorsten</span>.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1732\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1732\">David</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H559\">zei</span> tegen de hele <span class=\"wl\" data-l=\"L3\" data-code=\"H6951\">gemeente</span> <s ss=\"wl\" data-l=\"L9\" data-code=\"H1288\">de</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1288\">HEERE</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1288\">zegende</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1288\">het</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H1004\">huis</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H1004\">van</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5654\">Obed</span>-<span class=\"wl\" data-l=\"L11\" data-code=\"H5654\">edom</span>, <span class=\"wl\" data-l=\"L12\" data-code=\"H3605\">en</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H3605\">alles</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H834\">wat</span> hij had."}, "koppeling_kjv": {"1": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3289\">consulted</span> with the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> and <span class=\"wl wl-kjv\" data-code=\"H3967\">hundreds,</span> and with every <span class=\"wl wl-kjv\" data-code=\"H5057\">leader.</span>", "2": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> If it seem <span class=\"wl wl-kjv\" data-code=\"H2895\">good</span> unto you, and that it be of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> let us <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> <span class=\"wl wl-kjv\" data-code=\"H6555\">abroad</span> unto our <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> every where, that are <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> in all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and with them also to the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> which are in their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> and <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> themselves unto us:", "3": "And let us bring <span class=\"wl wl-kjv\" data-code=\"H5437\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to us: for we <span class=\"wl wl-kjv\" data-code=\"H1875\">enquired</span> not at it in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul.</span>", "4": "And all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> that they would do <span class=\"wl wl-kjv\" data-code=\"H6213\">so:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> was <span class=\"wl wl-kjv\" data-code=\"H3474\">right</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>", "5": "So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6950\">gathered</span> ➔ all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6950\">together,</span> from <span class=\"wl wl-kjv\" data-code=\"H7883\">Shihor</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H935\">entering</span> of <span class=\"wl wl-kjv\" data-code=\"H2574\">Hemath,</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> from <span class=\"wl wl-kjv\" data-code=\"H7157\">Kirjathjearim.</span>", "6": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to <span class=\"wl wl-kjv\" data-code=\"H1173\">Baalah,</span> that is, to <span class=\"wl wl-kjv\" data-code=\"H7157\">Kirjathjearim,</span> which belonged to <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> to bring <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> thence the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelleth</span> between the <span class=\"wl wl-kjv\" data-code=\"H3742\">cherubims,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> on it.", "7": "And they <span class=\"wl wl-kjv\" data-code=\"H7392\">carried</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in a <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H5699\">cart</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H41\">Abinadab:</span> and <span class=\"wl wl-kjv\" data-code=\"H5798\">Uzza</span> and <span class=\"wl wl-kjv\" data-code=\"H283\">Ahio</span> <span class=\"wl wl-kjv\" data-code=\"H5090\">drave</span> the <span class=\"wl wl-kjv\" data-code=\"H5699\">cart.</span>", "8": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7832\">played</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> with all their <span class=\"wl wl-kjv\" data-code=\"H5797\">might,</span> and with <span class=\"wl wl-kjv\" data-code=\"H7892\">singing,</span> and with <span class=\"wl wl-kjv\" data-code=\"H3658\">harps,</span> and with <span class=\"wl wl-kjv\" data-code=\"H5035\">psalteries,</span> and with <span class=\"wl wl-kjv\" data-code=\"H8596\">timbrels,</span> and with <span class=\"wl wl-kjv\" data-code=\"H4700\">cymbals,</span> and with <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpets.</span>", "9": "And when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1637\">threshingfloor</span> of <span class=\"wl wl-kjv\" data-code=\"H3592\">Chidon,</span> <span class=\"wl wl-kjv\" data-code=\"H5798\">Uzza</span> put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to <span class=\"wl wl-kjv\" data-code=\"H270\">hold</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark;</span> for the <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen</span> <span class=\"wl wl-kjv\" data-code=\"H8058\">stumbled.</span>", "10": "And the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against <span class=\"wl wl-kjv\" data-code=\"H5798\">Uzza,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him, because he <span class=\"wl wl-kjv\" data-code=\"H7971\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to the <span class=\"wl wl-kjv\" data-code=\"H727\">ark:</span> and there he <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>", "11": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">displeased,</span> because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6555\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H6556\">breach</span> upon <span class=\"wl wl-kjv\" data-code=\"H5798\">Uzza:</span> wherefore that <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> is <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H6560\">Perezuzza</span> to this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>", "12": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H1963\">How</span> shall I <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> home to me?", "13": "So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">brought</span> not the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> home to himself to the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> but carried it <span class=\"wl wl-kjv\" data-code=\"H5186\">aside</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H5654\">Obededom</span> the <span class=\"wl wl-kjv\" data-code=\"H1663\">Gittite.</span>", "14": "And the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">remained</span> with the <span class=\"wl wl-kjv\" data-code=\"H1004\">family</span> of <span class=\"wl wl-kjv\" data-code=\"H5654\">Obededom</span> in his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">months.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H5654\">Obededom,</span> and all that he had."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
