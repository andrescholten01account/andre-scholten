, dat Nahas, de koning van de kinderen van Ammon, stierf, en zijn zoon werd koning in zijn plaats.", "2": "Toen zei David: Ik zal goedheid bewijzen aan Hanun, de zoon van Nahas, want zijn vader heeft goedheid aan mij bewezen. Daarom stuurde David boden, om hem te troosten over zijn vader. Toen de knechten van David in het land van de kinderen van Ammon bij Hanun kwamen, om hem te troosten,", "3": "zeiden de vorsten van de kinderen van Ammon tegen Hanun: Eert David uw vader in uw ogen, omdat hij troosters naar u gestuurd heeft? Zijn zijn knechten niet naar u gekomen om het land te doorzoeken, en om het te verwoesten, en om het te verspieden?", "4": "Daarom nam Hanun de knechten van David, en hij schoor hen, en sneed hun kleren half af tot aan de heupen, en liet hen heengaan.", "5": "Zij nu gingen heen, en men berichtte David over deze mannen; en hij stuurde hun tegemoet, want die mannen waren zeer beschaamd. De koning zei toen: Blijft in Jericho, totdat uw baard weer gegroeid is; komt dan terug.", "6": "Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba;", "7": "zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde.", "8": "Toen David dit hoorde, stuurde hij Joab en het hele leger met de helden.", "9": "Toen de kinderen van Ammon uitgetrokken waren, stelden zij zich in slagorde op voor de poort van de stad; maar de koningen die gekomen waren, stonden apart in het veld.", "10": "Toen Joab zag dat de spits van de slagorde van voren en van achteren tegen hem stond, koos hij enigen uit alle uitgelezen mannen in Israël, en hij stelde hen in slagorde tegen de Syriërs op.", "11": "En het overige van het volk gaf hij in de hand van zijn broer Abisai, en zij stelden zich in slagorde tegen de kinderen van Ammon op.", "12": "En hij zei: Als de Syriërs mij te sterk worden, zult u mij komen verlossen; en als de kinderen van Ammon u te sterk worden, zal ik u verlossen.", "13": "Wees sterk, en laten we sterk zijn voor ons volk, en voor de steden van onze God; de HEERE doe wat goed is in Zijn ogen.", "14": "Toen naderde Joab en het volk dat bij hem was, ten strijde tegenover de Syriërs; en zij vluchtten voor hem.", "15": "Toen de kinderen van Ammon zagen dat de Syriërs vluchtten, vluchtten zij ook voor Abisai, zijn broer, en zij kwamen in de stad; en Joab kwam in Jeruzalem.", "16": "Toen de Syriërs zagen dat zij door Israël verslagen waren, stuurden zij boden, en lieten de Syriërs komen die aan de overkant van de rivier woonden; en Sofach, de legeraanvoerder van Hadar-Ezer, trok voor hen uit.", "17": "Toen dit aan David werd bericht, verzamelde hij heel Israël, en trok over de Jordaan, en kwam tot hen, en stelde de slagorde tegen hen op. Toen David de slagorde tegen de Syriërs opgesteld had, streden zij met hem.", "18": "Maar de Syriërs vluchtten voor Israël, en David versloeg van de Syriërs zevenduizend wagens, en veertigduizend man te voet; daarbij doodde hij Sofach, de legeraanvoerder.", "19": "Toen de knechten van Hadar-Ezer zagen dat zij verslagen waren voor Israël, sloten zij vrede met David, en dienden hem; en de Syriërs wilden de kinderen van Ammon niet meer helpen."}, "SV": {"1": "En het geschiedde na dezen, dat Nahas, de koning der kinderen Ammons, stierf, en zijn zoon werd koning in zijn plaats.", "2": "Toen zeide David: Ik zal weldadigheid doen aan Hanun, den zoon van Nahas; want zijn vader heeft weldadigheid aan mij gedaan. Daarom zond David boden, om hem te troosten over zijn vader. Toen de knechten van David in het land der kinderen Ammons tot Hanun kwamen, om hem te troosten,", "3": "Zo zeiden de vorsten der kinderen Ammons tot Hanun: Eert David uw vader in uw ogen, omdat hij troosters tot u gezonden heeft? Zijn niet zijn knechten tot u gekomen, om te doorzoeken, en om om te keren, en om het land te verspieden?", "4": "Daarom nam Hanun de knechten van David, en hij beschoor hen, en sneed hun klederen half af tot aan de heupen, en liet hen henengaan.", "5": "Zij nu gingen henen, en men boodschapte David van deze mannen; en hij zond hun tegemoet; want die mannen waren zeer beschaamd. De koning dan zeide: Blijft te Jericho, totdat ulieder baard weder gewassen zij; komt dan wederom.", "6": "Toen de kinderen Ammons zagen, dat zij zich stinkende gemaakt hadden bij David, zo zond Hanun en de kinderen Ammons duizend talenten zilvers, om zich wagenen en ruiters te huren uit Mesopotamië, en uit Syrië-maacha, en uit Zoba;", "7": "Zodat zij zich huurden twee en dertig duizend wagenen; en de koning van Maacha en zijn volk kwamen en legerden zich voor Medeba; ook vergaderden de kinderen Ammons uit hun steden, en zij kwamen ten strijde.", "8": "Toen het David hoorde, zo zond hij Joab en het ganse heir met de helden.", "9": "Als de kinderen Ammons uitgetogen waren, zo stelden zij de slagorde voor de poort der stad; maar de koningen, die gekomen waren, die waren bijzonder in het veld.", "10": "Toen Joab zag, dat de spits der slagorde van voren en van achteren tegen hem was, zo verkoos hij *enigen* uit alle uitgelezenen in Israël, en hij stelde hen in orde tegen de Syriërs aan.", "11": "En het overige des volks gaf hij in de hand van zijn broeder Abisai, en zij stelden hen in orde tegen de kinderen Ammons aan.", "12": "En hij zeide: Indien mij de Syriërs te sterk worden, zo zult gij mij komen verlossen; en indien de kinderen Ammons u te sterk worden, zo zal ik u verlossen.", "13": "Wees sterk, en laat ons sterk zijn voor ons volk, en voor de steden onzes Gods; de HEERE nu doe, wat goed is in Zijn ogen.", "14": "Toen naderde Joab en het volk, dat bij hem was, ten strijde voor het aangezicht der Syriërs; en zij vloden voor zijn aangezicht.", "15": "Toen de kinderen Ammons zagen, dat de Syriërs vloden, zo vloden zij ook voor het aangezicht van Abisai, zijn broeder, en zij kwamen in de stad; en Joab kwam te Jeruzalem.", "16": "Als de Syriërs zagen, dat zij voor het aangezicht van Israël geslagen waren, zo zonden zij boden, en brachten de Syriërs uit, die aan gene zijde der rivier woonden; en Sofach, de krijgsoverste van Hadar-ezer, *toog* voor hun aangezicht heen.", "17": "Toen het David werd aangezegd, zo vergaderde hij gans Israël, en hij toog over de Jordaan, en hij kwam tot hen, en hij stelde de slagorde tegen hen. Als David de slagorde tegen de Syriërs gesteld had, zo streden zij met hem.", "18": "Doch de Syriërs vloden voor het aangezicht van Israël, en David versloeg van de Syriërs zeven duizend wagenen, en veertig duizend mannen te voet; daartoe doodde hij Sofach, den krijgsoverste.", "19": "Toen de knechten van Hadar-ezer zagen, dat zij geslagen waren, voor het aangezicht van Israël, zo maakten zij vrede met David, en dienden hem; en de Syriërs wilden de kinderen Ammons niet meer verlossen."}, "KJV": {"1": "Now it came to pass after this, that Nahash the king of the children of Ammon died, and his son reigned in his stead.", "2": "And David said, I will shew kindness unto Hanun the son of Nahash, because his father shewed kindness to me. And David sent messengers to comfort him concerning his father. So the servants of David came into the land of the children of Ammon to Hanun, to comfort him.", "3": "But the princes of the children of Ammon said to Hanun, Thinkest thou that David doth honour thy father, that he hath sent comforters unto thee? are not his servants come unto thee for to search, and to overthrow, and to spy out the land?", "4": "Wherefore Hanun took David's servants, and shaved them, and cut off their garments in the midst hard by their buttocks, and sent them away.", "5": "Then there went certain, and told David how the men were served. And he sent to meet them: for the men were greatly ashamed. And the king said, Tarry at Jericho until your beards be grown, and then return.", "6": "And when the children of Ammon saw that they had made themselves odious to David, Hanun and the children of Ammon sent a thousand talents of silver to hire them chariots and horsemen out of Mesopotamia, and out of Syriamaachah, and out of Zobah.", "7": "So they hired thirty and two thousand chariots, and the king of Maachah and his people; who came and pitched before Medeba. And the children of Ammon gathered themselves together from their cities, and came to battle.", "8": "And when David heard of it, he sent Joab, and all the host of the mighty men.", "9": "And the children of Ammon came out, and put the battle in array before the gate of the city: and the kings that were come were by themselves in the field.", "10": "Now when Joab saw that the battle was set against him before and behind, he chose out of all the choice of Israel, and put them in array against the Syrians.", "11": "And the rest of the people he delivered unto the hand of Abishai his brother, and they set themselves in array against the children of Ammon.", "12": "And he said, If the Syrians be too strong for me, then thou shalt help me: but if the children of Ammon be too strong for thee, then I will help thee.", "13": "Be of good courage, and let us behave ourselves valiantly for our people, and for the cities of our God: and let the LORD do that which is good in his sight.", "14": "So Joab and the people that were with him drew nigh before the Syrians unto the battle; and they fled before him.", "15": "And when the children of Ammon saw that the Syrians were fled, they likewise fled before Abishai his brother, and entered into the city. Then Joab came to Jerusalem.", "16": "And when the Syrians saw that they were put to the worse before Israel, they sent messengers, and drew forth the Syrians that were beyond the river: and Shophach the captain of the host of Hadarezer went before them.", "17": "And it was told David; and he gathered all Israel, and passed over Jordan, and came upon them, and set the battle in array against them. So when David had put the battle in array against the Syrians, they fought with him.", "18": "But the Syrians fled before Israel; and David slew of the Syrians seven thousand men which fought in chariots, and forty thousand footmen, and killed Shophach the captain of the host.", "19": "And when the servants of Hadarezer saw that they were put to the worse before Israel, they made peace with David, and became his servants: neither would the Syrians help the children of Ammon any more."}}, "tsk": {"1": [{"kopje": "Nahas", "refs": ["1 Sam 11:1", "1 Sam 11:2", "1 Sam 12:12", "2 Sam 10:1-3"]}], "2": [{"kopje": "Ik zal goedheid bewijzen", "refs": ["1 Sam 30:26", "2 Sam 9:1", "2 Sam 9:7", "2 Kon 4:13", "Est 6:3", "Pred 9:15"]}, {"kopje": "de kinderen", "refs": ["Gen 19:37", "Gen 19:38", "Deut 23:3-6", "Neh 4:3", "Neh 4:7", "Neh 13:1"]}], "3": [{"kopje": "de vorsten", "refs": ["1 Sam 29:4", "1 Sam 29:9", "1 Kon 12:8-11"]}, {"kopje": "Eert David", "refs": ["1 Kor 13:5-7"]}, {"kopje": "te doorzoeken", "refs": ["Gen 42:9-18", "Joz 2:1-3", "Richt 1:23", "Richt 1:24", "Richt 18:2", "Richt 18:8-10"]}], "4": [{"kopje": "nam Hanun de knechten van David", "refs": ["Ps 35:12", "Ps 109:4", "Ps 109:5"]}, {"kopje": "schoor hen", "refs": ["Lev 19:27", "Jes 15:2", "Jer 41:5", "Jer 48:37"]}, {"kopje": "en sneed", "refs": ["Jes 20:4", "Jes 47:2", "Jes 47:3"]}, {"kopje": "liet hen heengaan", "refs": ["2 Sam 10:4", "2 Sam 10:5", "2 Kron 36:16", "Mark 12:4", "Luk 20:10", "Luk 20:11"]}], "5": [{"kopje": "en men berichtte David", "refs": ["Matt 18:31"]}, {"kopje": "in Jericho", "refs": ["Joz 6:24-26", "1 Kon 16:34"]}, {"kopje": "uw baard", "refs": ["Richt 16:22"]}], "6": [{"kopje": "stinkend gemaakt hadden", "refs": ["Luk 10:16", "1 Tess 4:8"]}, {"kopje": "stinkend", "refs": ["Gen 34:30", "Ex 5:21", "1 Sam 13:4", "1 Sam 27:12", "Ps 14:3"]}, {"kopje": "duizend", "refs": ["2 Kron 16:2", {"disp": "1 Kron 19:18", "href": "../../1-kronieken/19/#v18", "ref": "1 Kron 19:18", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"2 Kron 20:1": "Het gebeurde nu hierna, dat de kinderen van Moab, en de kinderen van Ammon, en met hen anderen naast de Ammonieten, tegen Josafat kwamen om te strijden.", "2 Kron 13:5-16": "Weet u niet dat de HEERE, de God van Israël, het koninkrijk over Israël voor eeuwig aan David gegeven heeft, aan hem en zijn zonen, met een zoutverbond? Toch is Jerobeam, de zoon van Nebat, de knecht van Salomo, de zoon van David, opgestaan en heeft hij tegen zijn heer gerebelleerd. Daarbij hebben zich nietswaardige mannen, kinderen van Belial, bij hem verzameld en zich sterk gemaakt tegen Rehabeam, de zoon van Salomo, toen Rehabeam jong was en teder van hart, zodat hij zich tegen hen niet kon verzetten.", "Richt 10:15": "Maar de Israëlieten zeiden tegen de HEERE: Wij hebben gezondigd; doe met ons naar alles wat goed is in Uw ogen; verlos ons toch alleen op deze dag!", "2 Sam 10:1-3": "En het gebeurde daarna, dat de koning van de kinderen Ammons stierf, en zijn zoon Hanun werd koning in zijn plaats. Toen zei David: Ik zal weldadigheid doen aan Hanun, de zoon van Nahas, zoals zijn vader weldadigheid aan mij gedaan heeft. Zo zond David heen, om hem door de dienst van zijn knechten te troosten over zijn vader. En de knechten van David kwamen in het land van de kinderen Ammons. Toen zeiden de vorsten van de kinderen Ammons tegen hun heer Hanun: Eert u David uw vader in uw ogen, omdat hij troosters tot u gezonden heeft? Heeft David zijn knechten niet daarom tot u gezonden, dat hij deze stad doorzoekt, en die verspiedt, en die omkeert?", "Jes 28:6": "en tot een Geest van het oordeel voor hem die te oordelen zit, en tot een sterkte voor hen die de strijd terugdrijven tot aan de poort toe.", "2 Sam 23:8-39": "Dit zijn de namen van de helden die David gehad heeft: Joscheb-Baschebeth, de zoon van Tachkemoni, de voornaamste van de hoofdlieden. Deze was Adino, de Ezniet, die zich stelde tegen achthonderd man, die door hem verslagen werden op één moment. En na hem was Eleazar, de zoon van Dodo, zoon van Ahohi; deze was onder de drie helden met David, toen zij de Filistijnen beschimpten, die daar ten strijde verzameld waren, en de mannen van Israël waren teruggetrokken. Deze stond op en sloeg onder de Filistijnen, totdat zijn hand moe werd, ja, zijn hand aan het zwaard kleefde; en de HEERE bracht een grote overwinning tot stand op die dag; en het volk keerde terug achter hem aan, alleen om te plunderen.", "Ps 35:12": "Zij vergelden mij kwaad voor goed, de beroving van mijn ziel.", "Neh 13:1": "Op die dag werd er gelezen in het boek van Mozes, voor de oren van het volk; en daarin werd geschreven gevonden, dat de Ammonieten en Moabieten niet zouden komen in de gemeente van God, tot in eeuwigheid;", "Joz 13:9": "Van Aroer af, die aan de oever van de beek Arnon ligt, en de stad die midden in de beek ligt, en heel het vlakke land van Medeba tot Dibon toe;", "Richt 3:28": "En hij zei tegen hen: Volg mij na; want de HEERE heeft uw vijanden, de Moabieten, in uw hand gegeven. En zij trokken af, hem na, en namen de doorwaadbare plaatsen van de Jordaan in naar Moab, en lieten niemand oversteken.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "Richt 1:24": "En de wachters zagen een man de stad uitgaan; en zij zeiden tegen hem: Wijs ons toch de ingang van de stad, en wij zullen goedheid bij u bewijzen.", "Jes 22:7": "En het zal gebeuren, dat uw uitgelezen dalen vol wagens zullen zijn, en dat de ruiters zich zeker zullen opstellen bij de poorten.", "1 Kron 19:2-5": "Toen zei David: Ik zal goedheid bewijzen aan Hanun, de zoon van Nahas, want zijn vader heeft goedheid aan mij bewezen. Daarom stuurde David boden, om hem te troosten over zijn vader. Toen de knechten van David in het land van de kinderen van Ammon bij Hanun kwamen, om hem te troosten, zeiden de vorsten van de kinderen van Ammon tegen Hanun: Eert David uw vader in uw ogen, omdat hij troosters naar u gestuurd heeft? Zijn zijn knechten niet naar u gekomen om het land te doorzoeken, en om het te verwoesten, en om het te verspieden? Daarom nam Hanun de knechten van David, en hij schoor hen, en sneed hun kleren half af tot aan de heupen, en liet hen heengaan.", "2 Kron 16:2-9": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei: Er is een verbond tussen mij en u, en tussen mijn vader en uw vader; zie, ik zend u zilver en goud; ga heen, verbreek uw verbond met Baësa, de koning van Israël, zodat hij van tegen mij aftrekt. En Benhadad hoorde naar de koning Asa, en zond de aanvoerders van de legers die hij had, tegen de steden van Israël, en zij sloegen Ijon, en Dan, en Abel-Maim, en alle schatsteden van Naftali.", "2 Sam 2:29": "Abner dan en zijn mannen gingen diezelfde hele nacht over de vlakte; en zij gingen over de Jordaan en trokken heel Bithron door, en kwamen bij Mahanaim.", "2 Kron 14:10": "Toen trok Asa tegen hem uit; en zij stelden de slagorde op in het dal Zefatha bij Maresa.", "Richt 10:9": "Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "Pred 9:15": "En men vond daar een arme, wijze man in, die de stad door zijn wijsheid redde; maar geen mens dacht meer aan die arme man.", "2 Sam 9:7": "En David zei tegen hem: Wees niet bang, want ik zal zeker goedheid aan u bewijzen, omwille van uw vader Jonathan; en ik zal u alle akkers van uw vader Saul teruggeven; en u zult voortdurend brood eten aan mijn tafel.", "Ps 109:5": "En zij hebben mij kwaad voor goed opgelegd, en haat voor mijn liefde.", "2 Kon 4:13": "(Want hij had hem gezegd: Zeg toch tegen haar: Zie, u bent zo bezorgd voor ons geweest, met al deze zorg; wat kan er voor u gedaan worden? Moet er voor u gesproken worden tot de koning, of tot de legeraanvoerder? En zij had gezegd: Ik woon te midden van mijn volk.", "2 Sam 10:15": "Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich weer samen.", "Ps 83:2-13": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "Gen 14:5": "Zo kwam Kedor-laomer in het veertiende jaar, en de koningen die met hem waren, en versloegen de Refaieten in Asteroth-karnaim, en de Zuzieten in Ham, en de Emieten in Schave-kiriathaim;", "Joz 8:22": "Ook kwamen zij die uit de stad kwamen, hun tegemoet, zodat zij midden tussen de Israëlieten waren, dezen van hier en genen van daar; en zij sloegen hen, totdat er niemand van hen overbleef, noch iemand ontkwam.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Joz 6:24-26": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE. Dus liet Jozua de hoer Rachab leven, en het huisgezin van haar vader, en alles wat zij had; en zij heeft gewoond in het midden van Israël tot op deze dag, omdat zij de boden verborgen had, die Jozua gezonden had om Jericho te verspieden. En terzelfder tijd bezwoer Jozua hen, en zei: Vervloekt zij die man voor het aangezicht van de HEERE, die zich opmaakt en deze stad Jericho bouwen zal; dat hij haar grondvest op zijn eerstgeboren zoon, en haar poorten stelt op zijn jongste zoon!", "2 Sam 10:6": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man.", "Lev 26:7": "En u zult uw vijanden vervolgen; en zij zullen voor uw aangezicht door het zwaard vallen.", "Richt 4:3": "Toen riepen de Israëlieten tot de HEERE; want hij had negenhonderd ijzeren wagens, en hij had de Israëlieten met geweld onderdrukt, twintig jaar.", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "1 Kon 11:23": "Ook verwekte God tegen hem een tegenstander, Rezon, de zoon van Eljada, die gevlucht was van zijn heer Hadad-ezer, de koning van Zoba,", "Jes 20:4": "zo zal de koning van Assyrië de gevangenen van de Egyptenaren wegvoeren, en de Moren, die weggevoerd zullen worden, jong en oud, naakt en barrevoets, en met ontblote billen, de Egyptenaren tot schande.", "2 Sam 18:4": "Toen zei de koning tegen hen: Ik zal doen wat goed is in uw ogen. De koning nu ging bij de poort staan, en al het volk trok uit bij honderdtallen en bij duizendtallen.", "1 Kon 20:1": "En Benhadad, de koning van Syrië, verzamelde al zijn leger; en twee en dertig koningen waren met hem, en paarden en wagens; en hij trok op, en belegerde Samaria en streed tegen haar.", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "Ps 18:45": "Zo gauw als hun oor van mij hoorde, hebben zij mij gehoorzaamd; vreemden hebben zich mij geveinsd onderworpen.", "1 Kron 18:4": "En David nam hem duizend wagens af, en zevenduizend ruiters, en twintigduizend man te voet; en David sneed bij alle wagenpaarden de hezenpezen door; maar hij hield honderd wagens daarvan over.", "1 Sam 14:47": "Toen nam Saul het koningschap over Israël in bezit; en hij streed rondom tegen al zijn vijanden: tegen Moab, en tegen de kinderen van Ammon, en tegen Edom, en tegen de koningen van Zoba, en tegen de Filistijnen; en overal waarheen hij zich wendde, strafte hij hen.", "Gal 6:2": "Draag elkaars lasten, en vervul zo de wet van Christus.", "2 Sam 9:1": "En David zei: Is er nog iemand die overgebleven is van het huis van Saul, zodat ik hem goedheid kan bewijzen, omwille van Jonathan?", "Jer 50:42": "Boog en spies zullen zij voeren; wreed zijn zij, en zullen niet barmhartig zijn; hun stem zal bruisen als de zee, en op paarden zullen zij rijden; het is opgesteld als een man ten oorlog, tegen u, o dochter van Babel!", "1 Kron 19:6-15": "Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba; zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde. Toen David dit hoorde, stuurde hij Joab en het hele leger met de helden.", "Luk 10:16": "Wie naar u luistert, luistert naar Mij; en wie u verwerpt, verwerpt Mij; en wie Mij verwerpt, verwerpt Hem die Mij gezonden heeft.", "Joz 2:7": "Die mannen dan achtervolgden hen op de weg naar de Jordaan, tot aan de doorwaadbare plaatsen; en men sloot de poort dicht, nadat zij naar buiten gegaan waren die hen achtervolgden.", "1 Kron 11:6": "Want David zei: Al wie de Jebusieten het eerst verslaat, zal tot hoofd en leider worden. Toen klom Joab, de zoon van Zeruja, er als eerste op; daarom werd hij tot hoofd.", "Ps 2:1": "Waarom woeden de heidenen, en bedenken de volken iets zinloos?", "2 Sam 10:12": "Wees sterk, en laten wij sterk zijn voor ons volk, en voor de steden van onze God; de HEERE nu doet, wat goed is in Zijn ogen.", "Richt 1:23": "En het huis van Jozef stuurde verspieders naar Beth-el; de naam van deze stad was voorheen Luz.", "2 Sam 10:9-14": "Toen Joab nu zag, dat de spits van de slagorde tegen hem was, van voren en van achteren, koos hij uit alle uitgelezen mannen van Israël, en stelde hen in slagorde op tegen de Syriërs; En het overige van het volk gaf hij onder de hand van zijn broer Abisaï, die het in slagorde opstelde tegen de kinderen Ammons. En hij zei: Als de Syriërs mij te sterk zullen zijn, zult u mij komen verlossen; en als de kinderen Ammons u te sterk zullen zijn, zal ik komen om u te verlossen.", "Num 21:30": "En wij hebben hen neergeveld! Hesbon is verloren tot Dibon toe; en wij hebben hen verwoest tot Nofat toe, dat tot Medeba toe reikt.", "Rom 8:31": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn?", "1 Sam 4:9": "Wees sterk, en gedraag u als mannen, Filistijnen, zodat u de Hebreeën niet gaat dienen, zoals zij u gediend hebben; wees dus mannen, en strijd.", "2 Sam 17:24": "David nu kwam te Mahanaïm, en Absalom trok de Jordaan over, hij en alle mannen van Israël met hem.", "1 Sam 12:12": "Toen u nu zag dat Nahas, de koning van de kinderen van Ammon, tegen u kwam, zei u tegen mij: Nee, maar een koning zal over ons regeren; terwijl toch de HEERE, uw God, uw Koning was.", "Lev 19:27": "U zult de hoeken van het hoofd niet rond afscheren; ook zult u de hoeken van het baard niet aantasten.", "Joz 1:7": "Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Neh 4:7": "En het gebeurde, toen Sanballat, Tobia, de Arabieren, de Ammonieten en de Asdodieten hoorden dat het herstel van de muren van Jeruzalem vorderde, dat de scheuren begonnen dichtgemaakt te worden, dat zij erg boos werden.", "Fil 1:28": "En dat u zich door niets laat verschrikken door hen die tegenstaan; wat voor hen een bewijs is van verderf, maar voor u van zaligheid, en dat van God.", "1 Kon 20:12": "En het gebeurde, toen hij dit woord hoorde, terwijl hij aan het drinken was, hij en de koningen in de tenten, dat hij zei tegen zijn knechten: Legt aan! En zij legden aan tegen de stad.", "Jes 47:2": "Neem de molen en maal meel; ontdek uw vlechten, ontbloot de enkels, ontdek de schenkels, ga door de rivieren.", "2 Kron 18:5": "Toen verzamelde de koning van Israël de profeten, vierhonderd man, en hij zei tegen hen: Zullen wij tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want God zal het in de hand van de koning geven.", "Richt 20:42": "Zo wendden zij zich voor het aangezicht van de mannen van Israël naar de weg van de woestijn; maar de strijd haalde hen in, en die uit de steden vernielden hen in hun midden.", "2 Sam 10:16": "En Hadad-Ezer zond heen, en liet de Syriërs uitkomen, die aan de overzijde van de rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-Ezers legeraanvoerder, trok voor hun aangezicht heen.", "Ps 48:4-7": "God is in haar paleizen; Hij is er bekend voor een Hoog Vertrek. Want zie, de koningen waren verzameld; zij waren samen doorgetrokken. Zoals zij het zagen, zo waren zij verwonderd; zij werden verschrikt, zij haastten weg.", "Jes 22:6": "Want Elam heeft de pijlkoker genomen, de man is op de wagen, er zijn ruiters; en Kir ontbloot het schild.", "2 Kron 22:5": "Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.", "Luk 20:11": "En opnieuw stuurde hij nog een andere dienstknecht; maar ook die sloegen zij en behandelden hem schandelijk, en stuurden hem met lege handen weg.", "2 Kron 27:5": "Hij streed ook tegen de koning van de Ammonieten, en had de overhand over hen, zodat de Ammonieten hem in datzelfde jaar honderd talenten van het zilver gaven, en tienduizend kor tarwe, en tienduizend gerst; dit brachten de Ammonieten hem opnieuw, ook in het tweede en in het derde jaar.", "Gen 19:38": "En de jongste baarde ook een zoon, en noemde hem Ben-Ammi; deze is de vader van de nakomelingen van Ammon, tot op deze dag.", "1 Sam 3:18": "Toen maakte Samuël hem al die woorden bekend, en verborg ze niet voor hem. En hij zei: Hij is de HEERE; laat Hij doen wat goed is in Zijn ogen!", "Deut 23:3-6": "Geen Ammoniet, noch Moabiet zal in de vergadering van de HEERE komen; zelfs hun tiende geslacht zal in eeuwigheid niet in de vergadering van de HEERE komen. Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken. Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "2 Sam 10:7-14": "Toen David dit hoorde, zond hij Joab heen, met heel het leger van de helden. En de kinderen Ammons trokken uit, en stelden de slagorde op voor de ingang van de poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maächa waren afzonderlijk in het veld. Toen Joab nu zag, dat de spits van de slagorde tegen hem was, van voren en van achteren, koos hij uit alle uitgelezen mannen van Israël, en stelde hen in slagorde op tegen de Syriërs;", "1 Kron 18:9": "Toen Thou, de koning van Hamath, hoorde dat David de hele legermacht van Hadar-ezer, de koning van Zoba, verslagen had,", "1 Sam 13:4": "Toen hoorde heel Israël zeggen: Saul heeft de bezetting van de Filistijnen verslagen, en ook is Israël gehaat geworden bij de Filistijnen. Toen werd het volk samengeroepen achter Saul, naar Gilgal.", "Zach 14:1-3": "Zie, de dag komt, de HEERE, dat uw roof zal uitgedeeld worden in het midden van u, o Jeruzalem! Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden. En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd.", "1 Kor 13:5-7": "Zij handelt niet ongeschikt, zij zoekt zichzelf niet, zij wordt niet verbitterd, zij denkt geen kwaad; Zij verblijdt zich niet in de ongerechtigheid, maar zij verblijdt zich in de waarheid; Zij bedekt alle dingen, zij gelooft alle dingen, zij hoopt alle dingen, zij verdraagt alle dingen.", "2 Kron 18:9": "De koning van Israël nu, en Josafat, de koning van Juda, zaten elk op zijn troon, bekleed met hun kleren, en zij zaten op het plein bij de ingang van de poort van Samaria; en al de profeten profeteerden in hun bijzijn.", "2 Sam 16:11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "Richt 18:2": "Zo zonden de kinderen van Dan uit hun geslacht vijf mannen uit hun gebied, strijdbare mannen, van Zora en van Esthaol, om het land te verkennen en te doorzoeken; en zij zeiden tegen hen: Ga, doorzoek het land. En zij kwamen aan het gebergte van Efraïm, tot aan het huis van Micha, en overnachtten daar.", "Ezra 10:4": "Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het.", "Neh 4:20": "Op de plaats waar u het geluid van de bazuin zult horen, daarheen moet u zich naar ons toe verzamelen; onze God zal voor ons strijden.", "1 Kon 15:20": "En Benhadad luisterde naar de koning Asa, en zond de leiders van de legers die hij had tegen de steden van Israël; en sloeg Ijon, en Dan, en Abel-Beth-Maächa, en het gehele Cinneroth, met het gehele land Nafthali.", "1 Kon 12:8-11": "Maar hij liet de raad van de oudsten varen, die zij hem gegeven hadden; en hij hield raad met de jongemannen, die met hem opgegroeid waren, die voor zijn aangezicht stonden. En hij zei tegen hen: Wat raadt u, dat wij dit volk antwoorden zullen, die tegen mij gesproken hebben en zeiden: Maak het juk, dat uw vader ons opgelegd heeft, lichter? En de jongemannen, die met hem opgegroeid waren, spraken tegen hem en zeiden: Zo moet u zeggen tegen dit volk, dat tegen u gesproken heeft en zei: Uw vader heeft ons juk zwaar gemaakt, maar maak u het over ons lichter; zo moet u tegen hen spreken: Mijn kleinste vinger zal dikker zijn dan de lenden van mijn vader.", "2 Kron 28:16": "In diezelfde tijd zond koning Achaz tot de koningen van Assyrië, dat zij hem zouden helpen.", "1 Sam 30:26": "Toen David in Ziklag kwam, zond hij van de buit naar de oudsten van Juda, zijn vrienden, en zei: Zie, hier is een geschenk voor u, van de buit van de vijanden van de HEERE.", "2 Kron 18:3": "Want Achab, de koning van Israël, zei tegen Josafat, de koning van Juda: Zult u met mij meegaan naar Ramoth in Gilead? En hij zei tegen hem: Ik zal zijn zoals u bent, en zoals uw volk is, zo zal mijn volk zijn, en wij zullen met u zijn in deze strijd.", "2 Sam 10:17": "Toen dat aan David werd bekendgemaakt, verzamelde hij heel Israël, en trok over de Jordaan, en kwam te Helam, en de Syriërs stelden de slagorde op tegen David, en streden met hem.", "1 Kron 18:5": "En de Syriërs van Damaskus kwamen om Hadar-ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "2 Sam 10:15-19": "Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich weer samen. En Hadad-Ezer zond heen, en liet de Syriërs uitkomen, die aan de overzijde van de rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-Ezers legeraanvoerder, trok voor hun aangezicht heen. Toen dat aan David werd bekendgemaakt, verzamelde hij heel Israël, en trok over de Jordaan, en kwam te Helam, en de Syriërs stelden de slagorde op tegen David, en streden met hem.", "Jer 48:37": "Want alle hoofden zijn kaal, en alle baarden afgeknipt; op alle handen zijn insnijdingen, en op de lenden is een rouwkleed.", "1 Kron 19:6-19": "Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba; zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde. Toen David dit hoorde, stuurde hij Joab en het hele leger met de helden.", "Deut 31:6": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten.", "1 Tess 4:8": "Wie dan dit verwerpt, verwerpt geen mens, maar God, Die ook Zijn Heilige Geest in ons heeft gegeven.", "1 Sam 29:4": "Maar de leiders van de Filistijnen werden zeer toornig op hem, en de leiders van de Filistijnen zeiden tegen hem: Laat de man teruggaan, zodat hij naar zijn plaats teruggaat, waar u hem hebt gesteld, en dat hij niet met ons meetrekt in de strijd, opdat hij niet een tegenstander voor ons wordt in de strijd; want waarmee zou hij zich bij zijn heer aangenaam kunnen maken? Is het niet met de hoofden van deze mannen?", "Neh 4:3": "En Tobia, de Ammoniet, was bij hem, en zei: Al is het dat zij bouwen, als er een vos opklom, dan zou hij hun stenen muur al kunnen omverhalen.", "1 Sam 14:6-12": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen. Toen zei zijn wapendrager tegen hem: Doe alles wat in uw hart is; ga uw gang, zie, ik ben met u, naar uw hart. Jonathan nu zei: Zie, wij zullen naar die mannen oversteken, en wij zullen ons aan hen laten zien.", "Job 1:22": "In dit alles zondigde Job niet, en schreef God niets van het ongerijmd toe.", "2 Sam 10:18": "Maar de Syriërs vluchtten voor Israëls aangezicht, en David versloeg van de Syriërs zevenhonderd wagens, en veertigduizend ruiters; daartoe sloeg hij Sobach, hun legeraanvoerder, zodat hij daar stierf.", "Gen 14:4": "Twaalf jaar hadden zij Kedor-laomer gediend; maar in het dertiende jaar vielen zij af.", "Jes 10:8": "Want hij zegt: Zijn niet mijn vorsten allemaal samen koningen?", "2 Sam 17:22": "Toen stond David op, en al het volk dat bij hem was; en zij gingen de Jordaan over. Bij het morgenlicht ontbrak er niet één die niet de Jordaan overgegaan was.", "Jes 15:2": "Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden.", "Joz 12:5": "En hij heerste over de berg Hermon, en over Salcha, en over heel Bazan, tot aan het gebied van de Gezurieten en de Maachathieten; en de helft van Gilead, het gebied van Sihon, de koning van Hesbon.", "2 Sam 10:5": "Toen zij dit David lieten weten, zond hij hun tegemoet; want deze mannen waren zeer beschaamd. En de koning zei: Blijf te Jericho, totdat uw baard weer gegroeid is, kom dan terug.", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "1 Kron 18:3-10": "David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat. En David nam hem duizend wagens af, en zevenduizend ruiters, en twintigduizend man te voet; en David sneed bij alle wagenpaarden de hezenpezen door; maar hij hield honderd wagens daarvan over. En de Syriërs van Damaskus kwamen om Hadar-ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "2 Sam 10:8": "En de kinderen Ammons trokken uit, en stelden de slagorde op voor de ingang van de poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maächa waren afzonderlijk in het veld.", "2 Sam 10:2": "Toen zei David: Ik zal weldadigheid doen aan Hanun, de zoon van Nahas, zoals zijn vader weldadigheid aan mij gedaan heeft. Zo zond David heen, om hem door de dienst van zijn knechten te troosten over zijn vader. En de knechten van David kwamen in het land van de kinderen Ammons.", "2 Sam 19:31": "Barzillai, de Gileadiet, kwam ook naar beneden uit Rogelim; en hij trok met de koning de Jordaan over, om hem over de Jordaan te begeleiden.", "Matt 18:31": "Toen zijn mededienstknechten zagen wat er gebeurd was, werden zij erg verdrietig; en zij gingen naar hun heer en vertelden hem alles wat er gebeurd was.", "2 Kron 25:6": "Daartoe huurde hij uit Israël honderdduizend sterke helden, voor honderd talenten van het zilver.", "Gen 34:30": "Toen zei Jakob tegen Simeon en tegen Levi: U hebt mij in het ongeluk gestort, doordat u mij stinkend maakt onder de inwoners van dit land, onder de Kanaänieten en onder de Ferezieten; en ik heb weinig volk in aantal; als zij zich tegen mij verzamelen, zullen zij mij verslaan, en ik zal vernietigd worden, ik en mijn huis.", "Richt 18:8-10": "En zij kwamen bij hun broeders te Zora en te Esthaol, en hun broeders zeiden tegen hen: Wat zegt u? En zij zeiden: Maak u op, en laat ons tegen hen optrekken; want wij hebben dat land bekeken, en zie, het is zeer goed; zult u dan stil blijven? Wees niet lui om te gaan, en om erin te trekken, om dat land in erfelijk bezit te nemen; (Als u daarheen gaat, zult u komen bij een zorgeloos volk, en dat land is wijd van omvang) want God heeft het in uw hand gegeven; een plaats waar geen gebrek is aan iets van wat op de aarde is.", "Richt 20:43": "Zij omringden Benjamin, zij vervolgden hem, zij vertrapten hem gemakkelijk, tot voor Gibea, tegen de opgang van de zon.", "Ps 109:4": "Voor mijn liefde staan zij mij tegen; maar ik was steeds in het gebed.", "Joz 2:1-3": "Jozua, de zoon van Nun, had twee mannen die stiekem zouden verspieden, gestuurd vanuit Sittim, en hij zei: Ga op weg, bekijk het land en Jericho. Zij dan gingen op weg en kwamen bij het huis van een vrouw, een hoer, wier naam was Rachab, en zij sliepen daar. Toen werd aan de koning in Jericho gemeld: Kijk, in deze nacht zijn hier mannen gekomen van de kinderen van Israël, om dit land te doorzoeken. Daarom stuurde de koning van Jericho mensen naar Rachab, en zei: Breng de mannen naar buiten die naar u toe gekomen zijn, die bij u in huis gekomen zijn; want zij zijn gekomen om het hele land te doorzoeken.", "Joël 2:5": "Zij zullen daarheen springen als een gedruis van wagens, op de toppen van de bergen; als het gedruis van een vuurvlam, die stoppels verteert; als een machtig volk, dat in slagorde opgesteld is.", "1 Kon 20:28-30": "En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben. En dezen waren gelegerd tegenover die, zeven dagen; het gebeurde nu op de zevende dag, dat de strijd aanging; en de kinderen van Israël sloegen van de Syriërs honderdduizend van het voetvolk op één dag. En de overgeblevenen vluchtten naar Afek, de stad in, en de muur viel op zeven en twintig duizend mannen, die overgebleven waren; ook vluchtte Benhadad, en kwam in de stad van kamer in kamer.", "Richt 1:3": "Toen zei Juda tegen zijn broeder Simeon: Trek met mij op in mijn lot, en laten we tegen de Kanaänieten strijden, dan zal ik ook met u optrekken in uw lot. Zo ging Simeon met hem mee.", "Ps 18:33": "Het is God, die mij met kracht omgordt; en Hij heeft mijn weg volkomen gemaakt.", "1 Sam 17:2": "Maar Saul en de mannen van Israël verzamelden zich, en legerden zich in het eikendal; en stelden de slagorde tegen de Filistijnen op.", "2 Kron 16:3": "Er is een verbond tussen mij en u, en tussen mijn vader en uw vader; zie, ik zend u zilver en goud; ga heen, verbreek uw verbond met Baësa, de koning van Israël, zodat hij van tegen mij aftrekt.", "2 Kon 16:9": "Zo luisterde de koning van Assyrië naar hem; want de koning van Assyrië trok op tegen Damaskus, en nam het in, en voerde de bevolking gevankelijk weg naar Kir, en hij doodde Rezin.", "Mark 12:4": "En hij stuurde weer een andere dienaar naar hen, en die stenigden zij, en verwondden hem aan het hoofd, en stuurden hem weg, na hem schandelijk behandeld te hebben.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "1 Kor 16:13": "Waakt, staat vast in het geloof, houdt u mannelijk, weest sterk.", "1 Sam 17:3": "De Filistijnen nu stonden aan een berg aan de ene kant, en de Israëlieten stonden aan een berg aan de andere kant; en de vallei was tussen hen.", "1 Kron 11:20": "Abisai nu, de broer van Joab, was ook het hoofd van drie; hij zwaaide zijn speer tegen driehonderd man en versloeg hen; zo had hij een naam onder die drie.", "Richt 12:6": "dan zeiden zij tegen hem: Zeg dan Schibboleth; maar hij zei: Sibbolet, en kon het zo niet goed uitspreken; dan grepen zij hem en doodden hem bij de doorwaadbare plaatsen van de Jordaan, zodat er in die tijd van Efraïm tweeënveertigduizend vielen.", "Micha 4:12": "Maar zij kennen de gedachten van de HEERE niet, en begrijpen Zijn raadsbesluit niet; dat Hij hen bijeengebracht heeft als schoven op de dorsvloer.", "Jes 47:3": "Uw schaamte zal ontdekt worden, ook zal uw schande gezien worden; Ik zal wraak nemen, en Ik zal u niet aanvallen als een mens.", "1 Kron 11:10-47": "Dezen nu waren de hoofden van de helden die David had, die zich dapper bij hem gedragen hebben in zijn koninkrijk bij heel Israël, om hem koning te maken, naar het woord van de HEERE over Israël. Dezen nu zijn het aantal van de helden die David had: Jasobam, de zoon van Hachmoni, was het hoofd van de dertig; hij zwaaide zijn speer tegen driehonderd man en versloeg hen op eenmaal. En na hem was Eleazar, de zoon van Dodo, de Ahohiet; hij was een van de drie helden.", "1 Kon 16:34": "In zijn dagen bouwde Hiel, de Betheliet, Jericho; op Abiram, zijn eerstgeboren zoon, heeft hij het gegrondvest, en op Segub, zijn jongste zoon, heeft hij de poorten ervan geplaatst; naar het woord van de HEERE, dat Hij door de dienst van Jozua, de zoon van Nun, gesproken had.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "2 Sam 10:1": "En het gebeurde daarna, dat de koning van de kinderen Ammons stierf, en zijn zoon Hanun werd koning in zijn plaats.", "1 Kron 19:7-15": "zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde. Toen David dit hoorde, stuurde hij Joab en het hele leger met de helden. Toen de kinderen van Ammon uitgetrokken waren, stelden zij zich in slagorde op voor de poort van de stad; maar de koningen die gekomen waren, stonden apart in het veld.", "Deut 31:7": "En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven.", "Gen 19:37": "En de oudste baarde een zoon, en noemde hem Moab; deze is de vader van de Moabieten, tot op deze dag.", "Ps 14:3": "Zij zijn allen afgeweken, samen zijn zij smerig geworden; er is niemand die goed doet, ook niet één.", "Luk 20:10": "En toen het de tijd was, stuurde hij een dienstknecht naar de landbouwers, opdat zij hem van de vrucht van de wijngaard zouden geven; maar de landbouwers sloegen hem, en stuurden hem met lege handen weg.", "Ex 14:9": "En de Egyptenaren joegen hen na en achterhaalden hen, terwijl zij zich gelegerd hadden aan de zee; met alle paarden, de wagens van Farao en zijn ruiters, en zijn leger; bij Pi-hachiroth, voor Baäl-zefon.", "Gen 42:9-18": "Toen dacht Jozef aan de dromen die hij over hen gedroomd had; en hij zei tegen hen: U bent verspieders, u bent gekomen om te bekijken waar het land onbeschermd is. En zij zeiden tegen hem: Nee, mijn heer! Maar uw knechten zijn gekomen om voedsel te kopen. Wij allen zijn zonen van één man; wij zijn eerlijke mensen; uw knechten zijn geen verspieders.", "2 Kron 18:1": "Josafat had rijkdom en eer in overvloed; en hij verzwagerde zich aan Achab.", "2 Kron 16:2": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei:", "2 Kron 14:9": "En Zerah, de Moor, trok tegen hen op, met een leger van duizend maal duizend, en driehonderd wagens; en hij kwam tot Maresa toe.", "Jer 46:16": "Hij maakte de struikelende velen; ja, de een viel op de ander; zodat zij zeiden: Staat op en laat ons wederkeren tot ons volk, en tot het land van onze geboorte, vanwege het verdrukkende zwaard.", "Richt 8:4": "Toen Gideon nu bij de Jordaan gekomen was, ging hij eroverheen, met de driehonderd mannen die bij hem waren, moe, maar toch nog vervolgend.", "Ps 46:12": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "1 Kon 20:24": "Daarom doe deze zaak: Doe de koningen weg, elk uit zijn plaats, en stel landvoogden in hun plaats.", "Ps 18:40": "Want U omgordde mij met kracht ten strijde; U deed onder mij nederbukken die tegen mij opstonden.", "2 Sam 16:10": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan?", "Joz 10:1-5": "Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren; Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:", "Est 6:3": "Toen zei de koning: Welke eer en verhoging is Mordechai hiervoor gegeven? En de knechten van de koning, zijn dienaars, zeiden: Aan hem is niets gegeven.", "1 Sam 11:2": "Maar Nahas, de Ammoniet, zei tegen hen: Op deze voorwaarde zal ik een verbond met u sluiten, dat ik bij u allen het rechteroog uitsteek, en dat ik deze schande op heel Israël leg.", "1 Kon 20:13": "En zie, een profeet trad naar Achab, de koning van Israël, en zei: Zo zegt de HEERE: Hebt u al deze grote menigte gezien? Zie, Ik zal ze heden in uw hand geven, opdat u weet, dat Ik de HEERE ben.", "2 Kron 28:20": "En Tiglath-Pilneser, de koning van Assyrië, kwam tot hem; maar hij benauwde hem, en versterkte hem niet.", "Jes 8:9-12": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden! Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons! Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "1 Sam 27:12": "En Achis geloofde David, en zei: Hij heeft zich helemaal onmogelijk gemaakt bij zijn volk, in Israël; daarom zal hij eeuwig mijn knecht zijn.", "2 Kron 13:3": "En Abia bond de strijd aan met een leger van strijdbare helden, vierhonderdduizend uitgelezen mannen; en Jerobeam stelde tegen hem de slagorde op, met achthonderdduizend uitgelezen mannen, kloeke helden.", "Joz 9:9-11": "Zij nu zeiden tegen hem: Uw knechten zijn uit een zeer ver land gekomen, om de Naam van de HEERE, uw God; want wij hebben van Hem horen spreken, en alles wat Hij in Egypte gedaan heeft; En alles wat Hij gedaan heeft aan de twee koningen van de Amorieten die aan de overkant van de Jordaan waren, Sihon, de koning van Hesbon, en Og, de koning van Bazan, die te Astharoth woonde. Daarom spraken tot ons onze oudsten, en al de inwoners van ons land, en zeiden: Neemt reiskost met u in uw handen op de reis, en gaat hun tegemoet, en zegt tegen hen: Wij zijn uw knechten, sluit dan nu een verbond met ons.", "Jes 7:1-9": "Het gebeurde nu in de dagen van Achaz, de zoon van Jotham, de zoon van Uzzia, de koning van Juda, dat Rezin, de koning van Syrië, en Pekah, de zoon van Remalia, de koning van Israël, optrokken naar Jeruzalem, ten oorlog tegen haar; maar hij kon met strijden niet tegen haar op. Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind. En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller;", "1 Sam 11:1": "Toen trok Nahas, de Ammoniet, op en belegerde Jabes in Gilead. En alle mannen van Jabes zeiden tegen Nahas: Sluit een verbond met ons, en wij zullen u dienen.", "Deut 3:14": "Jaïr, de zoon van Manasse, kreeg de hele landstreek van Argob, tot aan het gebied van de Gezurieten en Maächatieten; en hij noemde ze naar zijn naam, Bazan-Havvoth-Jaïr, tot op deze dag.", "1 Kron 14:17": "Zo ging Davids naam uit in alle landen; en de HEERE bracht de schrik voor hem over alle heidenvolken.", "Jes 21:7": "En hij zag een wagen, een span ruiters, een wagen met ezels, een wagen met kamelen; en hij lette zeer nauwkeurig op, met grote oplettendheid.", "2 Sam 15:26": "Maar als Hij zo zal zeggen: Ik heb geen behagen in u; zie, hier ben ik, laat Hij met mij doen zoals het goed is in Zijn ogen.", "Pred 4:9-12": "Twee zijn beter dan een; want zij hebben een goede beloning voor hun moeite; Want als zij vallen, richt de een zijn metgezel op; maar wee de ene die gevallen is, want er is geen tweede om hem op te helpen. Ook, als twee samen liggen, hebben zij warmte; maar hoe zou iemand alleen warm worden?", "Ps 20:8-10": "Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God. Zij hebben zich gekromd, en zijn gevallen; maar wij zijn opgestaan en staande gebleven. O HEERE! behoud; die Koning verhoort ons ten dage van ons roepen.", "Richt 16:22": "En het haar van zijn hoofd begon weer te groeien, zoals toen hij geschoren werd.", "2 Sam 8:3-13": "David sloeg ook Hadad-Ezer, de zoon van Rechob, de koning van Zoba, toen hij op weg ging om zijn macht te herstellen tot aan de rivier Frath. En David nam hem duizend wagens af, en zevenhonderd ruiters, en twintigduizend man voetvolk; en David sneed de pezen door van alle wagenpaarden, en hield daarvan honderd wagens over. En de Syriërs van Damaskus kwamen om Hadad-Ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "2 Sam 10:19": "Toen nu alle koningen die knechten van Hadad-Ezer waren, zagen dat zij voor Israëls aangezicht geslagen waren, sloten zij vrede met Israël, en dienden hen; en de Syriërs vreesden de kinderen Ammons niet meer te verlossen.", "2 Sam 10:6-19": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man. Toen David dit hoorde, zond hij Joab heen, met heel het leger van de helden. En de kinderen Ammons trokken uit, en stelden de slagorde op voor de ingang van de poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maächa waren afzonderlijk in het veld.", "Richt 12:5": "Want de Gileadieten namen de Efraïmieten de doorwaadbare plaatsen van de Jordaan af; en het gebeurde, toen de vluchtelingen van Efraïm zeiden: Laat mij oversteken, dat de mannen van Gilead tegen hem zeiden: Bent u een Efraïmiet? En wanneer hij zei: Nee;", "2 Sam 10:4": "Toen nam Hanun Davids knechten, en schoor hun baard half af, en sneed hun kleren half af, tot aan hun billen; en hij liet hen gaan.", "1 Sam 17:32": "En David zei tegen Saul: Laat aan niemand het hart ontvallen om hem. Uw knecht zal gaan en met deze Filistijn strijden.", "2 Kron 25:5": "En Amazia verzamelde Juda, en stelde hen, naar de families van hun vaderen, aan tot leiders van duizenden en tot leiders van honderden, door heel Juda en Benjamin; en hij monsterde hen, van twintig jaar oud en daarboven, en vond hen driehonderdduizend uitgelezen mannen, die uit konden trekken ten strijde, en die speer en schild konden hanteren.", "Joz 10:25": "Toen zei Jozua tot hen: Vrees niet en wees niet ontsteld, wees sterk en heb goede moed; want zo zal de HEERE aan al uw vijanden doen, tegen wie u strijdt.", "Ps 46:10": "Die de oorlogen doet ophouden tot aan het einde van de aarde, de boog verbreekt, en de speer in tweeën slaat, de wagens met vuur verbrandt.", "1 Kron 18:12": "Ook sloeg Abisaï, de zoon van Zeruja, de Edomieten in het Zoutdal, achttienduizend man.", "Richt 7:24": "Ook zond Gideon boden naar heel het gebergte van Efraïm, en zei: Kom naar beneden, de Midianieten tegemoet, en neem hun de wateren af, tot aan Beth-bara, namelijk de Jordaan; zo werd elke man van Efraïm bijeengeroepen, en zij namen hun de wateren af tot aan Beth-bara, en de Jordaan.", "1 Sam 29:9": "Achis antwoordde en zei tegen David: Ik weet het; voorzeker, u bent aangenaam in mijn ogen, als een engel van God; maar de leiders van de Filistijnen hebben gezegd: Laat hem niet met ons optrekken in deze strijd.", "Ex 5:21": "En zeiden tot hen: De HEERE ziet op u, en oordeelt het, omdat u onze reuk hebt doen stinken voor Farao, en voor zijn knechten, door een zwaard in hun handen te geven, om ons te doden.", "2 Kon 18:19-21": "En Rabsake zei tot hen: Zeg nu tot Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat vertrouwen is dit, waarmee u vertrouwt? U zegt (doch het is een woord der lippen): Er is raad en macht tot de oorlog; op wie vertrouwt u nu, dat u tegen mij rebelleert? Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "1 Kon 22:1-4": "En zij bleven drie jaar stil, zodat er geen oorlog was tussen Syrië en Israël. En het gebeurde in het derde jaar, dat Josafat, de koning van Juda, naar de koning van Israël afkwam. Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.", "1 Kon 11:24": "tegen wie hij ook mannen verzameld had, en hij werd aanvoerder van een bende, toen David hen doodde; en zij trokken naar Damascus, woonden daar en regeerden in Damascus.", "Joz 11:1-5": "Het gebeurde daarna, toen Jabin, de koning van Hazor, dit hoorde, dat hij een boodschap stuurde naar Jobab, de koning van Madon, en naar de koning van Simron, en naar de koning van Achsaf, En naar de koningen die tegen het noorden op het gebergte, en op het vlakke, tegen het zuiden van Cinneroth, en in de laagte, en in Nafoth-dor, aan de zee waren; Tot de Kanaänieten tegen het oosten en tegen het westen, en de Amorieten, en de Hethieten, en de Ferezieten; en de Jebusieten op het gebergte, en de Hevieten onder aan Hermon, in het land van Mizpa.", "Jer 46:15": "Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef.", "2 Sam 8:3": "David sloeg ook Hadad-Ezer, de zoon van Rechob, de koning van Zoba, toen hij op weg ging om zijn macht te herstellen tot aan de rivier Frath.", "1 Sam 13:5": "En de Filistijnen werden verzameld om tegen Israël te strijden, dertigduizend wagens en zesduizend ruiters, en volk in menigte als het zand dat aan de oever van de zee is; en zij trokken op en legerden zich te Michmas, ten oosten van Beth-aven.", "Micha 4:11": "Nu zijn wel veel heidenvolken tegen u verzameld, die zeggen: Laat ze ontheiligd worden, en laat ons oog zich verlustigen aan Sion.", "2 Sam 19:15": "Toen keerde de koning terug, en kwam tot aan de Jordaan; en Juda kwam naar Gilgal, om de koning tegemoet te gaan, om de koning over de Jordaan te brengen.", "Neh 4:14": "En ik zag toe, stond op, en zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Wees niet bang voor hen; denk aan die grote en ontzagwekkende Heere, en strijd voor uw broeders, uw zonen en uw dochters, uw vrouwen en uw huizen.", "2 Sam 10:3": "Toen zeiden de vorsten van de kinderen Ammons tegen hun heer Hanun: Eert u David uw vader in uw ogen, omdat hij troosters tot u gezonden heeft? Heeft David zijn knechten niet daarom tot u gezonden, dat hij deze stad doorzoekt, en die verspiedt, en die omkeert?", "1 Kon 20:19-21": "Zo trokken deze jongens van de leiders van de landschappen uit de stad, en het leger, dat hen navolgde. En ieder sloeg zijn man, zodat de Syriërs vluchtten, en Israël joeg hen na. Doch Benhadad, de koning van Syrië, ontkwam op een paard, met enige ruiters. En de koning van Israël trok uit, en sloeg paarden en wagens, zodat hij een grote slag aan de Syriërs toebracht."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" dat " data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> to <span class=\"wl wl-kjv\" data-code=\"H2586\">Hanun,</span> to <span class=\"wl wl-kjv\" data-code=\"H5162\">comfort</span> him.", "3": "But the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H2586\">Hanun,</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">Thinkest</span> thou that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> doth <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H5162\">comforters</span> unto thee? are not his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto thee for to <span class=\"wl wl-kjv\" data-code=\"H2713\">search,</span> and to <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrow,</span> and to spy <span class=\"wl wl-kjv\" data-code=\"H7270\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land?</span>", "4": "Wherefore <span class=\"wl wl-kjv\" data-code=\"H2586\">Hanun</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and <span class=\"wl wl-kjv\" data-code=\"H1548\">shaved</span> them, and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> their <span class=\"wl wl-kjv\" data-code=\"H4063\">garments</span> in the <span class=\"wl wl-kjv\" data-code=\"H2677\">midst</span> hard by their <span class=\"wl wl-kjv\" data-code=\"H4667\">buttocks,</span> and sent them <span class=\"wl wl-kjv\" data-code=\"H7971\">away.</span>", "5": "Then there <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> certain, and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> how the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were served. And he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> them: for the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H3637\">ashamed.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">Tarry</span> at <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho</span> until your <span class=\"wl wl-kjv\" data-code=\"H2206\">beards</span> be <span class=\"wl wl-kjv\" data-code=\"H6779\">grown,</span> and then <span class=\"wl wl-kjv\" data-code=\"H7725\">return.</span>", "6": "And when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that they had made themselves <span class=\"wl wl-kjv\" data-code=\"H887\">odious</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H2586\">Hanun</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> to <span class=\"wl wl-kjv\" data-code=\"H7936\">hire</span> them <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> and <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen</span> out of <span class=\"wl wl-kjv\" data-code=\"H763\">Mesopotamia,</span> and out of <span class=\"wl wl-kjv\" data-code=\"H758\">Syriamaachah,</span> and out of <span class=\"wl wl-kjv\" data-code=\"H6678\">Zobah.</span>", "7": "So they <span class=\"wl wl-kjv\" data-code=\"H7936\">hired</span> <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4601\">Maachah</span> and his <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> who <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H4311\">Medeba.</span> And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> from their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>", "8": "And when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of it, he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men.</span>", "9": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and put the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> before the <span class=\"wl wl-kjv\" data-code=\"H6607\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> that were <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> were by themselves in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field.</span>", "10": "Now when <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> was set against him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> and <span class=\"wl wl-kjv\" data-code=\"H268\">behind,</span> he chose <span class=\"wl wl-kjv\" data-code=\"H977\">out</span> of all the <span class=\"wl wl-kjv\" data-code=\"H977\">choice</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and put them in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians.</span>", "11": "And the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> he <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and they set themselves in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon.</span>", "12": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> be too <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> for me, then thou shalt <span class=\"wl wl-kjv\" data-code=\"H8668\">help</span> me: but if the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> be too <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> for thee, then I will <span class=\"wl wl-kjv\" data-code=\"H3467\">help</span> thee.", "13": "Be of good <span class=\"wl wl-kjv\" data-code=\"H2388\">courage,</span> and let us behave ourselves <span class=\"wl wl-kjv\" data-code=\"H2388\">valiantly</span> for our <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> and let the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that which is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in his <span class=\"wl wl-kjv\" data-code=\"H5869\">sight.</span>", "14": "So <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him drew <span class=\"wl wl-kjv\" data-code=\"H5066\">nigh</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.", "15": "And when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> were <span class=\"wl wl-kjv\" data-code=\"H5127\">fled,</span> they likewise <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span> Then <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>", "16": "And when the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that they were put to the <span class=\"wl wl-kjv\" data-code=\"H5062\">worse</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers,</span> and drew <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> that were <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river:</span> and <span class=\"wl wl-kjv\" data-code=\"H7780\">Shophach</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H1928\">Hadarezer</span> went <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them.", "17": "And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David;</span> and he <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> upon them, and set the battle in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> against them. So when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had put the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians,</span> they <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> with him.", "18": "But the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> of the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> men which fought in <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">footmen,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">killed</span> <span class=\"wl wl-kjv\" data-code=\"H7780\">Shophach</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host.</span>", "19": "And when the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\"
