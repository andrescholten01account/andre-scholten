l wat mannelijk is, van een maand oud en daarboven; want dezen werden niet geteld onder de kinderen van Israël, omdat hun geen erfenis gegeven werd onder de kinderen van Israël.","Lev 21:1":"Daarna zei de HEERE tegen Mozes: Spreek tot de priesters, de zonen van Aäron, en zeg tegen hen: Over een dode zal een priester zich niet verontreinigen onder zijn volken.","1 Sam 1:24":"Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.","1 Sam 2:20":"En Eli zegende Elkana en zijn vrouw, en zei: De HEERE geeft u nageslacht uit deze vrouw, voor de bede die zij aan de HEERE heeft afgebeden. En zij gingen naar hun eigen plaats.","Openb 14:2":"En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers;","Jer 28:5":"Toen zei de profeet Jeremia tegen de profeet Hananja, voor de ogen van de priesters en voor de ogen van het hele volk, dat in het huis van de HEERE stond;","Neh 12:27":"Bij de inwijding nu van de muur van Jeruzalem, zochten zij de Levieten op uit al hun plaatsen, om hen naar Jeruzalem te brengen, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen.","1 Kron 25:1-5":"David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst. Van de kinderen van Asaf waren Zakkur, en Jozef, en Nethanja, en Asarela, kinderen van Asaf; onder leiding van Asaf, die onder leiding van de koning profeteerde. Aangaande Jeduthun: de kinderen van Jeduthun waren Gedalja, en Zeri, en Jesaja, Hasabja en Mattithja, zes; onder leiding van hun vader Jeduthun, die op harpen profeteerde om de HEERE te danken en te loven.","Ex 6:15":"Dit nu zijn de namen van de zonen van Levi, naar hun geboorten: Gerson, en Kehath, en Merari. En de jaren van het leven van Levi waren honderdzevenendertig jaren.","1 Kron 24:2":"Maar Nadab stierf, en Abihu, voor het aangezicht van hun vader, en zij hadden geen kinderen. En Eleazar en Ithamar bedienden het priesterambt.","Joz 21:32":"En van de stam van Nafthali, de vrijstad voor de doodslager, Kedes in Galilea, en haar voorsteden, en Hammoth-dor en haar voorsteden, en Karthan en haar voorsteden: drie steden.","Amos 8:10":"En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.","Num 3:19":"En de zonen van Kahath, naar hun geslachten: Amram en Izhar, Hebron en Uzziël.","Richt 1:20":"En zij gaven Hebron aan Kaleb, zoals Mozes gesproken had; en hij verdreef vandaar de drie zonen van Enak.","Lev 10:20":"Toen Mozes dit hoorde, was dat goed in zijn ogen.","Joz 21:28":"En van de stam van Issaschar, Kisjon en haar voorsteden, en Dobrath en haar voorsteden;","Num 26:59":"En de naam van de vrouw van Amram was Jochebed, de dochter van Levi, die de vrouw van Levi baarde in Egypte; en deze baarde aan Amram, Aäron, en Mozes, en Mirjam, hun zuster.","1 Kron 16:42":"Met hen dan waren Heman en Jeduthun, met trompetten en cimbalen voor hen die zich lieten horen, en met instrumenten van de muziek van God; maar de zonen van Jeduthun waren aan de poort.","Ezech 33:32":"En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.","Joz 21:17":"En van de stam van Benjamin, Gibeon en haar voorsteden, Geba en haar voorsteden;","Jer 26:7":"En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis van de HEERE.","Joz 19:12":"En zij keert zich van Sarid oostwaarts naar de opgang van de zon, tot de grens van Chisloth-thabor, en zij komt uit bij Dobrath, en gaat omhoog naar Jafia.","Num 26:10":"En de aarde opende haar mond, en verslond hen met Korach, toen die groep stierf, toen het vuur tweehonderdvijftig mannen verteerde, en zij werden tot een teken.","Joz 21:7":"Aan de kinderen van Merari, naar hun families, van de stam van Ruben, en van de stam van Gad, en van de stam van Zebulon, twaalf steden.","1 Kor 12:11":"Doch al deze dingen werkt één en dezelfde Geest, Die aan ieder afzonderlijk uitdeelt zoals Hij wil.","Joz 21:24":"Ajalon en haar voorsteden, Gath-rimmon en haar voorsteden: vier steden.","1 Sam 1:7":"En zo deed hij jaar op jaar; van toen af dat zij opging naar het huis van de HEERE, zo tergde zij haar steeds; daarom weende zij en at niet.","2 Kon 25:9":"En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.","Ex 24:1":"Daarna zei Hij tegen Mozes: Klim op tot de HEERE, u en Aäron, Nadab en Abihu, en zeventig van de oudsten van Israël; en buig u neer van verre!","2 Sam 18:27-29":"Verder zei de wachter: Ik zie de manier van lopen van de eerste, als de manier van lopen van Ahimaäz, de zoon van Zadok. Toen zei de koning: Dat is een goed man, en hij zal met een goed bericht komen. Ahimaäz dan riep en zei tegen de koning: Vrede! En hij boog zich voor de koning met het gezicht ter aarde, en zei: Geloofd zij de HEERE, uw God, Die de mannen heeft overgegeven die hun hand tegen mijn heer de koning ophieven. Toen zei de koning: Is het goed met de jongeman, met Absalom? En Ahimaäz zei: Ik zag een groot rumoer, toen Joab, de knecht van de koning, en mij, uw knecht, wegzond, maar ik weet niet wat het was.","2 Kon 23:4":"En de koning gebood de hogepriester Hilkia, en de priesters van de tweede rang, en de bewakers van de drempel, dat zij uit de tempel van de HEERE al het gereedschap, dat voor Baäl, en voor het beeld van het bos en voor heel het leger van de hemel gemaakt was, naar buiten zouden brengen; en hij verbrandde dat buiten Jeruzalem in de velden van Kidron, en liet het stof daarvan naar Beth-el brengen.","Richt 4:6":"En zij zond heen en riep Barak, de zoon van Abinoam, van Kedes-nafthali; en zij zei tegen hem: Heeft de HEERE, de God van Israël, niet geboden: Ga heen en trek op naar de berg Thabor, en neem met u tienduizend man, van de kinderen van Nafthali en van de kinderen van Zebulon?","Num 3:32":"De aanvoerder nu van de aanvoerders van Levi zal zijn Eleazar, de zoon van Aäron, de priester; zijn opzicht zal zijn over degenen, die de wacht van het heiligdom waarnemen.","1 Kron 8:20":"En Eljoenai, en Zillethai, en Eliël,","1 Kron 24:31":"En zij wierpen ook loten, samen met hun broeders, de zonen van Aäron, voor het aangezicht van koning David, en Zadok, en Achimelech, en van de familiehoofden onder de priesters en onder de Levieten; het familiehoofd tegenover zijn jongste broer.","1 Kron 23:21":"De kinderen van Merari waren Maheli en Musi; de kinderen van Maheli waren Eleazar en Kis.","1 Kron 4:34":"Doch Mesobab, en Jamlech, en Josa, de zoon van Amazia,","Spr 18:10":"De Naam van de HEERE is een sterke toren; de rechtvaardige zal daarheen lopen, en in veiligheid gesteld worden.","Zach 6:11":"Namelijk, neem zilver en goud, en maak kronen; en zet ze op het hoofd van Jozua, de zoon van Jozadak, de hogepriester.","Ps 132:8":"Sta op, HEERE, tot Uw rust, U en de ark van Uw sterkte!","Ef 3:8":"Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,","Zach 8:9":"Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.","1 Sam 1:28":"Daarom heb ik hem ook aan de HEERE overgegeven al de dagen die hij leven zal; hij is aan de HEERE gegeven. En hij aanbad daar de HEERE.","Neh 12:27-31":"Bij de inwijding nu van de muur van Jeruzalem, zochten zij de Levieten op uit al hun plaatsen, om hen naar Jeruzalem te brengen, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen. Zo werden de kinderen van de zangers verzameld, zowel uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten; En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.","Ps 42:2":"Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God!","1 Kron 26:21":"Van de kinderen van Ladan, kinderen van de Gersoniet Ladan; van Ladan, de Gersoniet, waren hoofden van de families Jehiëli.","1 Kon 2:26":"En tegen Abjathar, de priester, zei de koning: Ga naar Anathoth, naar uw akkers; want u verdient de dood; maar op deze dag zal ik u niet doden, omdat u de ark van de Heere HEERE gedragen hebt voor het aangezicht van mijn vader David, en omdat u verdrukt bent geweest in alles waarin mijn vader verdrukt was.","Jer 26:2":"Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.","1 Kron 22:14":"Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe.","Num 25:6-11":"En zie, een man uit de kinderen van Israël kwam, en bracht een Midianietische vrouw naar zijn broeders, voor de ogen van Mozes en voor de ogen van de hele vergadering van de kinderen van Israël, terwijl zij weenden voor de deur van de tent van de samenkomst. Toen Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, dat zag, stond hij op uit het midden van de vergadering, en nam een spies in zijn hand; en hij ging de Israëlitische man achterna, de tent in, en doorstak hen beiden, de Israëlitische man en de vrouw, door hun buik. Toen hield de plaag over de kinderen van Israël op.","Ezra 3:11":"En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE.","2 Kon 23:2":"En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was.","2 Kron 5:13":"het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.","1 Kron 23:23":"De kinderen van Musi waren Maheli, en Eder, en Jeremoth; drie.","2 Kron 36:5-21":"Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en hij deed wat slecht was in de ogen van de HEERE, zijn God. Nebukadnezar, de koning van Babel, trok tegen hem op, en bond hem met twee koperen ketenen, om hem naar Babel te voeren. Nebukadnezar bracht ook een deel van de voorwerpen van het huis van de HEERE naar Babel, en zette ze in zijn tempel te Babel.","Joz 20:7-9":"Toen wijdden zij Kedes in Galilea, op het gebergte van Naftali, en Sichem op het gebergte van Efraïm, en Kirjath-arba, dat is Hebron, op het gebergte van Juda. En aan de andere kant van de Jordaan, bij Jericho oostwaarts, gaven zij Bezer in de woestijn, in het platte land, uit de stam van Ruben; en Ramoth in Gilead, uit de stam van Gad; en Golan in Bazan, uit de stam van Manasse. Dit nu zijn de steden, die bestemd waren voor alle kinderen van Israël, en voor de vreemdeling die te midden van hen woont, opdat daarheen kan vluchten ieder die iemand door een vergissing doodt; opdat hij niet sterft door de hand van de bloedwreker, totdat hij voor de vergadering heeft gestaan.","1 Kron 15:27":"David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.","Joz 13:31":"En het halve Gilead, en Astharoth, en Edrei, steden van het koninkrijk van Og in Bazan, waren voor de kinderen van Machir, de zoon van Manasse, namelijk voor de helft van de kinderen van Machir, naar hun huisgezinnen.","Ps 44:2":"O God! Wij hebben het met onze oren gehoord, onze vaders hebben het ons verteld: Wat een werk hebt U gedaan in hun dagen, in de dagen van vroeger.","Num 3:33":"Van Merari is het geslacht van de Mahelieten, en het geslacht van de Musieten; dit zijn de geslachten van Merari.","Deut 18:1-8":"De Levitische priesters, de hele stam van Levi, zullen geen deel of erfdeel hebben met Israël; de vuuroffers van de HEERE en Zijn erfdeel zullen zij eten. Daarom zal hij geen erfdeel hebben tussen zijn broeders; de HEERE is zijn Erfdeel, zoals Hij tot hem gesproken heeft. Dit nu zal het recht van de priesters zijn van het volk, van hen die een offerande offeren, hetzij een os of klein vee: dat hij de priester de schouder zal geven, en beide kaken, en de pens.","2 Kron 23:13":"En zij keek toe; en zie, de koning stond bij zijn pilaar, bij de ingang; en de leiders en de trompetten waren bij de koning; en heel het volk van het land was blij, en blies op de trompetten; en de zangers waren er met muzikale instrumenten, en gaven aanwijzingen om lof te zingen; toen scheurde Athalia haar kleren, en riep: Verraad, verraad!","Joz 19:20":"En Rabbith, en Kisjon, en Ebez,","2 Sam 17:17-20":"Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen. Een jongen zag hen echter, en vertelde het aan Absalom; doch die beiden gingen haastig weg, en kwamen in het huis van een man te Bahurim, die een put had in zijn binnenplaats, en zij daalden daarin af. En de vrouw nam en spreidde een deksel over de opening van de put, en strooide daar gepelde granen overheen. Zo werd de zaak niet bekend.","Neh 11:20":"Het overige nu van Israël, van de priesters en de Levieten, was in alle steden van Juda, ieder in zijn erfdeel.","Joz 21:34-39":"Aan de families nu van de kinderen van Merari, de overige Levieten, werd gegeven van de stam van Zebulon, Jokneam en haar voorsteden, Kartha en haar voorsteden; Dimna en haar voorsteden, Nahalal en haar voorsteden: vier steden. En van de stam van Ruben, Bezer en haar voorsteden, en Jahza en haar voorsteden;","1 Kron 12:28":"En Zadok was een jongeman, een kloeke held; en uit zijn vaders huis waren tweeëntwintig leiders;","1 Kron 25:6":"Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.","2 Sam 15:36":"Zie, hun beide zonen zijn daar bij hen, Ahimaäz, de zoon van Zadok, en Jonathan, de zoon van Abjathar; zo zult u door hun hand alles wat u zult horen, naar mij laten overbrengen.","Num 16:1-35":"Korach nu, de zoon van Jizhar, zoon van Kohath, zoon van Levi, nam tot zich zowel Dathan als Abiram, zonen van Eliab, en On, de zoon van Peleth, zonen van Ruben. En zij stonden op voor het aangezicht van Mozes, alsook tweehonderd en vijftig mannen uit de kinderen van Israël, leiders van de vergadering, de geroepenen van de samenkomst, mannen van naam. En zij verzamelden zich tegen Mozes en tegen Aäron, en zeiden tegen hen: Het is te veel voor u, want deze hele vergadering, zij allen, zijn heilig, en de HEERE is in hun midden; waarom verheft u zich dan boven de gemeente van de HEERE?","2 Kron 23:2":"Die trokken door Juda, en verzamelden de Levieten uit alle steden van Juda, en de hoofden van de vaderen van Israël, en zij kwamen naar Jeruzalem.","Joz 6:24":"De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.","Ezech 34:1-5":"En het woord van de HEERE gebeurde tot mij, en Hij zei: Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet.","Num 4:42":"En de getelden van de geslachten van de zonen van Merari, naar hun geslachten, naar het huis van hun vaderen,","1 Kron 26:12":"Uit dezen waren de verdelingen van de poortwachters onder de hoofden van de mannen, met wachtdiensten tegenover hun broers, om te dienen in het huis van de HEERE.","Num 3:33-36":"Van Merari is het geslacht van de Mahelieten, en het geslacht van de Musieten; dit zijn de geslachten van Merari. En hun getelden in getal van al wat mannelijk was, van een maand oud en daarboven, waren zesduizend tweehonderd. De aanvoerder nu van het vaderlijke huis van de geslachten van Merari zal zijn Zuriël, de zoon van Abihaïl; zij zullen zich legeren aan de zijde van de tabernakel, noordwaarts.","2 Sam 5:25":"En David deed zo, zoals de HEERE hem geboden had; en hij versloeg de Filistijnen van Geba af, tot waar u bij Gezer komt.","1 Sam 2:11":"Daarna ging Elkana naar Rama, naar zijn huis; maar de jongen diende de HEERE voor het aangezicht van de priester Eli.","Gen 36:5":"En Aholibama baarde Jehus, en Jaëlam, en Korah. Dit zijn de zonen van Ezau, die hem geboren zijn in het land Kanaän.","Jes 10:29":"Zij trekken door de doorgang, te Geba houden zij hun overnachting; Rama beeft, Gibea van Saul vlucht.","1 Kron 6:77-81":"De overige kinderen van Merari hadden van de stam van Zebulon: Rimmono en haar voorsteden, Thabor en haar voorsteden; En aan de overkant van de Jordaan tegenover Jericho, aan de oostkant van de Jordaan, van de stam van Ruben: Bezer in de woestijn, en haar voorsteden, en Jahza en haar voorsteden, En Kedemoth en haar voorsteden, en Mefaath en haar voorsteden;","Ezra 3:2":"En Jesua, de zoon van Jozadak, maakte zich op, en zijn broeders, de priesters, en Zerubbabel, de zoon van Sealthiël, en zijn broeders, en zij bouwden het altaar van de God van Israël, om daarop brandoffers te offeren, zoals geschreven is in de wet van Mozes, de man Gods.","1 Kron 16:41":"En met hen Heman en Jeduthun, en de overige uitgelezen mannen, die met naam uitgedrukt zijn om de HEERE te loven; want Zijn goedertierenheid is tot in eeuwigheid.","Num 18:1-32":"Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen. En ook zult u uw broeders, de stam van Levi, de stam van uw vader, met u laten naderen, zodat zij u worden bijgevoegd, en u dienen; maar u, en uw zonen met u, zult voor de tent der getuigenis zijn. En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u.","Neh 12:26":"Dezen waren er in de dagen van Jojakim, de zoon van Jesua, de zoon van Jozadak, en in de dagen van Nehemia, de landvoogd, en van de priester Ezra, de schriftgeleerde.","2 Kon 23:24":"En ook deed Josia de waarzeggers weg, en de duivelskunstenaars, en de terafim, en de drekgoden, en alle verfoeiselen die in het land van Juda en in Jeruzalem gezien werden; opdat hij de woorden van de wet zou bevestigen, die geschreven waren in het boek dat de priester Hilkia in het huis van de HEERE gevonden had.","Richt 4:9":"En zij zei: Ik zal zeker met u meetrekken, maar de eer zal niet voor u zijn op deze weg die u gaat; want de HEERE zal Sisera verkopen in de hand van een vrouw. Zo maakte Debora zich op, en trok met Barak naar Kedes.","Joz 21:39":"Hesbon en haar voorsteden, Jaezer en haar voorsteden: al die steden zijn vier.","Joz 19:37":"En Kedes, en Edrei, en En-hazor,","2 Sam 8:17":"En Zadok, zoon van Ahitub, en Achimelech, zoon van Abjathar, waren priesters; en Seraja was schrijver.","Jes 37:14":"Toen Hizkia de brieven uit de hand van de boden ontvangen had, en die gelezen had, ging hij naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE.","Zach 14:10":"Dit hele land zal rondom als een vlak veld gemaakt worden, van Geba tot Rimmon toe, zuidwaarts van Jeruzalem; en zij zal verhoogd en bewoond worden op haar plaats; van de poort van Benjamin af, tot aan de plaats van de eerste poort, tot aan de Hoekpoort toe; en van de toren van Hananeel, tot aan de wijnbakken van de koning toe.","1 Kron 15:19":"De zangers nu, Heman, Asaf en Ethan, lieten zich horen met koperen cimbalen;","Num 26:58":"Dit zijn de geslachten van Levi: het geslacht der Libnieten, het geslacht der Hebronieten, het geslacht der Machlieten, het geslacht der Muzieten, het geslacht der Korachieten. En Kohath verwekte Amram.","1 Sam 18:7":"En de vrouwen, spelend, antwoordden elkaar en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden!","Num 15:25":"En de priester zal de verzoening doen voor de hele vergadering van de kinderen van Israël, en het zal hun vergeven worden; want het was een afdwaling, en zij hebben hun offerande gebracht, een vuuroffer voor de HEERE, en hun zondoffer, voor het aangezicht van de HEERE, over hun afdwaling.","2 Kon 23:11":"En hij schafte de paarden af, die de koningen van Juda voor de zon gesteld hadden, bij de ingang van het huis van de HEERE, tot de kamer van Nathan-melech, de hoveling, die in Parvarim was; en de wagens van de zon verbrandde hij met vuur.","1 Sam 13:18":"en een groep sloeg de weg in naar Beth-horon; en een groep sloeg de weg in naar het gebied dat uitziet op het dal Zeboim, naar de woestijn toe.","1 Sam 18:6":"Het gebeurde nu, toen zij kwamen, en David terugkeerde van het verslaan van de Filistijn, dat de vrouwen uit al de steden van Israël uitgingen, met gezang en reidansen, koning Saul tegemoet, met tamboerijnen, met vreugde en met muziekinstrumenten.","Matt 9:23":"En toen Jezus in het huis van de leider kwam, en de fluitspelers zag en de rumoerige menigte,","Num 4:38":"Evenzo de getelden van de zonen van Gerson, naar hun geslachten, en naar het huis van hun vaderen;","Joz 21:37":"Kedemoth en haar voorsteden, en Mefaath en haar voorsteden: vier steden.","Jes 30:32":"En overal waar die gegrondveste staf doorgegaan zal zijn (waarop de HEERE hem zal hebben doen rusten), daar zal men met trommels en harpen zijn; want met bewegende bestrijdingen zal Hij tegen hen strijden.","2 Sam 20:25":"En Seja was schrijver; en Zadok en Abjathar waren priesters.","Joz 21:41":"Al de steden van de Levieten, te midden van het bezit van de kinderen van Israël, waren achtenveertig steden en hun voorsteden.","2 Kron 34:9":"En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.","Joz 21:27":"En aan de kinderen van Gerson, van de families van de Levieten, van de andere halve stam van Manasse, de vrijstad voor de doodslager, Golan in Bazan, en haar voorsteden, en Beesthera en haar voorsteden: twee steden.","1 Sam 8:1-5":"Het gebeurde nu, toen Samuël oud geworden was, dat hij zijn zonen tot richters over Israël aanstelde. De naam van zijn eerstgeboren zoon was Joël, en de naam van zijn tweede was Abia; zij waren richters te Berseba. Doch zijn zonen wandelden niet in zijn wegen, maar neigden zich naar de gierigheid, en namen geschenken aan, en bogen het recht.","Joz 10:38":"Toen keerde Jozua terug, en heel Israël met hem, naar Debir, en hij streed tegen haar.","1 Kon 22:3-28":"Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen. Daarna zei hij tegen Josafat: Zult u met mij optrekken naar de strijd bij Ramoth in Gilead? En Josafat zei tegen de koning van Israël: Ik zal zijn zoals u bent, mijn volk zoals uw volk, mijn paarden zoals uw paarden. Verder zei Josafat tegen de koning van Israël: Vraag toch vandaag naar het woord van de HEERE.","1 Sam 13:3":"Toen versloeg Jonathan de bezetting van de Filistijnen die te Geba was, en de Filistijnen hoorden dat. Daarom liet Saul de bazuin blazen door het hele land en zei: Laat de Hebreeën het horen.","1 Kon 8:63":"En Salomo offerde als dankoffer, dat hij de HEERE offerde, tweeëntwintigduizend runderen, en honderdtwintigduizend schapen. Zo hebben zij het huis van de HEERE ingewijd, de koning en al de kinderen van Israël.","2 Kron 29:5":"En hij zei tegen hen: Hoor mij, Levieten; heilig nu uzelf, en heilig het huis van de HEERE, de God van uw vaderen, en breng de onreinheid naar buiten, uit het heiligdom.","Ex 6:15-19":"Dit nu zijn de namen van de zonen van Levi, naar hun geboorten: Gerson, en Kehath, en Merari. En de jaren van het leven van Levi waren honderdzevenendertig jaren. De zonen van Gerson: Libni en Simeï, naar hun huisgezinnen. En de zonen van Kehath: Amram, en Jizhar, en Hebron, en Uzziël; en de jaren van het leven van Kehath waren honderddrieëndertig jaren.","Ex 6:16":"De zonen van Gerson: Libni en Simeï, naar hun huisgezinnen.","1 Kron 24:1":"Wat betreft de kinderen van Aäron: dit waren hun verdelingen. De zonen van Aäron waren Nadab, Abihu, Eleazar en Ithamar.","Joz 19:51":"Dit zijn de erfdelen die Eleazar, de priester, en Jozua, de zoon van Nun, en de hoofden van de vaders van de stammen van de kinderen van Israël door het lot erfelijk uitdeelden te Silo, voor het aangezicht van de HEERE, aan de deur van de tent van de samenkomst. Zo maakten zij een einde aan het uitdelen van het land.","1 Kon 4:4":"En Benaja, de zoon van Jojada, was over het leger; en Zadok en Abjathar waren priesters.","Joz 21:14":"En Jatthir en haar voorsteden, en Esthemoa en haar voorsteden;","Joz 21:3-8":"Daarom gaven de kinderen van Israël aan de Levieten van hun erfdeel, naar het bevel van de HEERE, deze steden en de voorsteden daarvan. Toen ging het lot uit voor de families van de Kahathieten; en voor de kinderen van Aäron, de priester, uit de Levieten, waren er van de stam van Juda, en van de stam van Simeon, en van de stam van Benjamin, door het lot, dertien steden. En aan de overgebleven kinderen van Kahath vielen, bij het lot, van de families van de stam van Efraïm, en van de stam van Dan, en van de halve stam van Manasse, tien steden.","Jer 20:2":"sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt.","Num 4:49":"Men telde hen, naar het bevel van de HEERE, door de hand van Mozes, ieder naar zijn dienst, en naar zijn last; en zijn getelden waren zoals de HEERE Mozes geboden had.","Num 10:17":"Toen werd de tabernakel afgenomen, en de zonen van Gerson en de zonen van Merari trokken op, dragend de tabernakel.","Kol 3:16":"Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.","Num 16:46":"En Mozes zei tegen Aäron: Neem het wierookvat, en doe daar vuur in van het altaar, en leg reukwerk daarop, en ga haastig naar de vergadering, doe verzoening over hen; want er is grote toorn van voor het aangezicht van de HEERE uitgegaan, de plaag is begonnen.","1 Kron 16:37-42":"Zo liet hij daar, voor de ark van het verbond van de HEERE, Asaf en zijn broeders, om voortdurend te dienen voor de ark, naarmate op elke dag besteld was. Obed-Edom nu, met hun broeders, waren achtenzestig; en hij stelde Obed-Edom, de zoon van Jeduthun, en Hosa, aan tot poortwachters; En de priester Zadok, en zijn broeders, de priesters, voor de tabernakel van de HEERE op de hoogte, die te Gibeon is;","Jer 28:1":"Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:","Joz 19:35":"De vaste steden nu zijn: Ziddim, Zer en Hammath, Rakkath en Cinnereth,","1 Kron 25:5":"Deze allen waren kinderen van Heman, de ziener van de koning, in de woorden van God, om de hoorn te verheffen; want God had Heman veertien zonen gegeven, en drie dochters.","Num 35:13-15":"En van deze steden die u geven zult, zullen zes vrijsteden voor u zijn. Drie van deze vrijsteden zult u geven aan deze kant van de Jordaan, en drie van deze steden zult u geven in het land Kanaän; vrijsteden zullen het zijn. Deze zes steden zullen voor de Israëlieten, en voor de vreemdeling, en de bijwoner in hun midden, tot een toevlucht zijn; opdat daarheen vlucht wie iemand bij ongeluk doodslaat.","Num 3:21":"Van Gerson was het geslacht van de Libnieten, en het geslacht van de Simeïeten; dit zijn de geslachten van de Gersonieten.","1 Kron 25:1-6":"David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst. Van de kinderen van Asaf waren Zakkur, en Jozef, en Nethanja, en Asarela, kinderen van Asaf; onder leiding van Asaf, die onder leiding van de koning profeteerde. Aangaande Jeduthun: de kinderen van Jeduthun waren Gedalja, en Zeri, en Jesaja, Hasabja en Mattithja, zes; onder leiding van hun vader Jeduthun, die op harpen profeteerde om de HEERE te danken en te loven.","Joz 19:30":"En Umma, en Afek, en Rehob; tweeëntwintig steden en hun dorpen.","2 Kron 29:30":"Daarna zeiden koning Hizkia en de leiders tegen de Levieten, dat zij de HEERE zouden loven, met de woorden van David en van Asaf, de ziener; en zij loofden met blijdschap; en zij bogen hun hoofden, en bogen zich neer.","1 Kron 26:11":"Hilkia was de tweede, Tebalja de derde, Zecharja de vierde; al de kinderen en broers van Hosa waren dertien.","1 Kron 23:7":"Uit de Gersonieten waren Ladan en Simeï.","2 Sam 15:24-27":"En zie, Zadok was ook daar, en alle Levieten met hem, die de ark van het verbond van God droegen; en zij zetten de ark van God neer, en Abjathar klom op, totdat heel het volk uit de stad klaar was met overgaan. Toen zei de koning tegen Zadok: Breng de ark van God terug in de stad; als ik genade zal vinden in de ogen van de HEERE, dan zal Hij mij terughalen, en zal Hij mij haar laten zien, alsook Zijn woning. Maar als Hij zo zal zeggen: Ik heb geen behagen in u; zie, hier ben ik, laat Hij met mij doen zoals het goed is in Zijn ogen.","Joz 18:7":"Want de Levieten hebben geen deel in uw midden; maar het priesterschap van de HEERE is hun erfdeel. Gad nu, en Ruben, en de halve stam van Manasse, hebben hun erfdeel genomen aan de overkant van de Jordaan, oostwaarts, dat Mozes, de knecht van de HEERE, hun gegeven heeft.","Ps 74:1":"Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?","Dan 3:4":"En een heraut riep met kracht: Men zegt u aan, u volken, u naties en tongen!","Job 21:12":"Zij heffen op met de trommel en de harp, en verblijden zich bij het geluid van de fluit.","Jer 52:12-15":"Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was; Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.","Joz 21:4":"Toen ging het lot uit voor de families van de Kahathieten; en voor de kinderen van Aäron, de priester, uit de Levieten, waren er van de stam van Juda, en van de stam van Simeon, en van de stam van Benjamin, door het lot, dertien steden.","Lev 10:16":"En Mozes zocht heel zorgvuldig de bok van het zondoffer; en zie, hij was verbrand. Daardoor werd hij zeer boos op Eleazar en op Ithamar, de overgebleven zonen van Aäron, en zei:","Ezra 10:18":"En er werden gevonden van de zonen van de priesters die vreemde vrouwen bij zich hadden laten wonen: van de zonen van Jesua, de zoon van Jozadak, en zijn broers, Maaseja, en Eliëzer, en Jarib, en Gedalja.","1 Kron 24:3-6":"David nu verdeelde hen, en Zadok uit de kinderen van Eleazar, en Abimelech uit de kinderen van Ithamar, naar hun ambt in hun dienst. En van de kinderen van Eleazar werden meer hoofden van de mannen gevonden dan van de kinderen van Ithamar, toen zij hen indeelden; van de kinderen van Eleazar waren zestien hoofden van de families, maar van de kinderen van Ithamar, naar hun families, acht. En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.","Ex 15:21":"Toen antwoordde Mirjam hun: Zingt de HEERE; want Hij is hoog verheven! Hij heeft het paard met zijn ruiter in de zee gestort!","1 Kon 12:8":"Maar hij liet de raad van de oudsten varen, die zij hem gegeven hadden; en hij hield raad met de jongemannen, die met hem opgegroeid waren, die voor zijn aangezicht stonden.","Deut 4:43":"Bezer in de woestijn, in het effen land, voor de Rubenieten; en Ramoth in Gilead, voor de Gadieten; en Golan in Bazan, voor de Manassieten.","Ex 4:13":"Doch hij zei: Och, Heere! zend toch door de hand van hem die U zult zenden.","Ex 23:19":"De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE uw God brengen. U zult een bokje niet koken in de melk van zijn moeder.","Joz 13:14":"Alleen aan de stam Levi gaf hij geen erfenis. De vuuroffers van God, de HEERE van Israël, zijn zijn erfenis, zoals Hij tot hem gesproken had.","2 Sam 18:19":"Toen zei Ahimaäz, de zoon van Zadok: Laat mij toch snel gaan, en de koning berichten dat de HEERE hem recht gedaan heeft tegenover zijn vijanden.","Jer 36:6":"Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.","Ps 106:31":"En het is hem gerekend tot gerechtigheid, van geslacht tot geslacht tot in eeuwigheid.","Lev 27:26":"Maar het eerstgeborene, dat de HEERE als eerstgeborene van een dier toebehoort, dat zal niemand heiligen; hetzij een rund, of een schaap of geit, het is van de HEERE.","2 Kon 22:12-14":"En de koning gebood Hilkia, de priester, en Ahikam, de zoon van Safan, en Achbor, de zoon van Michaja, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei: Ga heen, vraag de HEERE voor mij, en voor het volk, en voor heel Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die tegen ons ontstoken is, omdat onze vaderen niet geluisterd hebben naar de woorden van dit boek, om te doen naar alles wat voor ons geschreven is. Toen ging de priester Hilkia, en Ahikam, en Achbor, en Safan, en Asaja naar de profetes Hulda, de vrouw van Sallum, de zoon van Tikva, de zoon van Harhas, de klederbewaarder (zij woonde nu te Jeruzalem, in het tweede deel), en zij spraken met haar.","Ps 134:2":"Hef uw handen op naar het heiligdom, en loof de HEERE.","Neh 11:11":"Seraja, de zoon van Hilkia, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, was voorganger van Gods huis;","2 Kron 35:15":"En de zangers, de zonen van Asaf, waren op hun standplaats, naar het gebod van David, en Asaf, en Heman, en Jeduthun, de ziener van de koning, alsook de poortwachters bij elke poort; zij hoefden niet te wijken van hun dienst, want hun broeders, de Levieten, bereidden voor hen.","1 Kron 23:2-32":"En hij verzamelde alle vorsten van Israël, ook de priesters en de Levieten. En de Levieten werden geteld, van dertig jaar af en daarboven; en hun aantal was, naar hun hoofden, aan mannen, achtendertigduizend. Uit dezen waren er vierentwintigduizend om het werk van het huis van de HEERE aan te sturen; en zesduizend opzichters en rechters;","Joz 12:13":"De koning van Debir, één; de koning van Geder, één;","Ex 34:26":"De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE, uw God, brengen. U zult het bokje niet koken in de melk van zijn moeder.","2 Kron 7:11":"Zo voltooide Salomo het huis van de HEERE, en het huis van de koning; en alles wat in het hart van Salomo gekomen was om in het huis van de HEERE en in zijn huis te maken, voerde hij voorspoedig uit.","Ex 2:7":"Toen zei zijn zuster tegen de dochter van Farao: Zal ik gaan en een voedstermoeder uit de Hebreeuwse vrouwen voor u roepen, die dit kind voor u zoogt?","Ps 149:6":"De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand,","Deut 23:18":"U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.","Ps 68:5":"Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.","Jes 23:16":"Neem de harp, ga rond door de stad, u vergeten hoer! Speel mooi, zing veel liederen, opdat men weer aan u denkt!","1 Kron 26:1":"Aangaande de verdelingen van de poortwachters: van de Korahieten was Meselemja, de zoon van Kore, van de kinderen van Asaf.","Ps 82:1":"Een psalm van Asaf. God staat in de vergadering van God; Hij oordeelt in het midden van de goden;","2 Kron 34:14-20":"En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was. En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek. En Safan bracht dat boek naar de koning; en verder bracht hij de koning bericht terug en zei: Alles wat aan uw dienaren opgedragen is, dat doen zij.","Ps 135:2":"U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God!","Joz 21:13":"Zo gaven zij aan de kinderen van de priester Aäron de vrijstad voor de doodslager, Hebron en haar voorsteden, en Libna en haar voorsteden;","1 Kron 23:7-9":"Uit de Gersonieten waren Ladan en Simeï. De kinderen van Ladan waren deze: Jehiel, het hoofd, en Zetham, en Joël; drie. De kinderen van Simeï waren Selomith, en Haziël, en Haran, drie; dezen waren de hoofden van de vaderen van Ladan.","1 Kron 2:6":"En de kinderen van Zerah waren Zimri, en Ethan, en Heman, en Chalcol, en Dara. Deze allen zijn vijf.","Joz 21:27-33":"En aan de kinderen van Gerson, van de families van de Levieten, van de andere halve stam van Manasse, de vrijstad voor de doodslager, Golan in Bazan, en haar voorsteden, en Beesthera en haar voorsteden: twee steden. En van de stam van Issaschar, Kisjon en haar voorsteden, en Dobrath en haar voorsteden; Jarmuth en haar voorsteden, En-gannim en haar voorsteden: vier steden.","1 Sam 14:31":"Toch versloegen zij op die dag de Filistijnen van Michmas tot Ajalon; en het volk was zeer moe.","1 Kon 4:13":"De zoon van Geber was te Ramoth in Gilead; hij had de dorpen van Jaïr, de zoon van Manasse, die in Gilead zijn; ook had hij de streek van Argob, die in Basan is, zestig grote steden met muren en koperen grendels.","Hoogl 7:4":"Uw hals is als een ivoren toren, uw ogen zijn als de vijvers te Hesbon, bij de poort van Bath-rabbim; uw neus is als de toren van Libanon, die uitziet naar Damascus.","2 Kron 36:17-21":"Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand. En alle voorwerpen van het huis van God, de grote en de kleine, en de schatten van het huis van de HEERE, en de schatten van de koning en zijn vorsten, dit alles bracht hij naar Babel. En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.","Ps 49:2":"Hoort dit, alle volken! Neemt het ter oor, alle inwoners van de wereld,","1 Kron 6:54-81":"En dit waren hun woonplaatsen, naar hun kampementen, in hun gebieden, namelijk van de zonen van Aäron, van de familie van de Kahathieten, want dat lot was voor hen. En zij gaven hun Hebron, in het land van Juda, en haar voorsteden rondom die. Maar het veld van de stad, en haar dorpen, gaven zij aan Kaleb, de zoon van Jefunne.","Ezra 2:41":"De zangers. De kinderen van Asaf, honderdachtentwintig.","Num 35:1-8":"En de HEERE sprak tot Mozes, in de vlakke velden van de Moabieten, aan de Jordaan bij Jericho: Gebied de Israëlieten dat zij van de erfenis van hun bezitting steden aan de Levieten geven om te bewonen; daarbij zult u aan de Levieten ook voorsteden geven, rondom de steden. En die steden zullen zij hebben om te bewonen; maar hun voorsteden zullen zijn voor hun vee, en voor hun bezit, en voor al hun dieren,","Ezra 1:7":"Ook bracht koning Kores de voorwerpen van het huis van de HEERE naar buiten, die Nebukadnezar uit Jeruzalem had weggehaald, en in het huis van zijn god had gezet.","2 Kron 34:18":"Verder maakte Safan, de schrijver, aan de koning bekend en zei: Hilkia, de priester, heeft mij een boek gegeven. En Safan las erin voor voor het aangezicht van de koning.","Joz 14:3":"Want aan de twee stammen en de halve stam had Mozes een erfdeel gegeven aan de overkant van de Jordaan; maar aan de Levieten had hij geen erfdeel onder hen gegeven.","1 Kron 25:7":"En hun aantal, met hun broeders die onderwezen waren in het gezang van de HEERE, allen meesters, was tweehonderdachtentachtig.","Ps 75:2":"Wij loven U, o God! Wij loven, dat Uw Naam nabij is; men vertelt Uw wonderen.","Jer 11:23":"En zij zullen geen overblijfsel hebben; want Ik zal een kwaad brengen over de mannen van Anathoth, in het jaar van hun bezoeking.","Jes 16:10":"zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.","1 Kron 15:17-19":"Zo stelden de Levieten Heman aan, de zoon van Joël, en uit zijn broeders Asaf, de zoon van Berechja; en uit de zonen van Merari, hun broeders, Ethan, de zoon van Kusaja; En met hen hun broeders van de tweede orde: Zecharja, Ben en Jaaziel, en Semiramoth, en Jehiel, en Unni, Eliab, en Benaja, en Maaseja, en Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, de poortwachters. De zangers nu, Heman, Asaf en Ethan, lieten zich horen met koperen cimbalen;","1 Kron 9:19":"En Sallum, de zoon van Kore, de zoon van Ebjasaf, de zoon van Korah, en zijn broede van hun vaderen zullen zij erven.","Lev 25:32-34":"Wat aangaat de steden van de Levieten, en de huizen van de steden van hun bezitting; de Levieten zullen een eeuwige lossing hebben. En als men onder de Levieten lossing gedaan zal hebben, dan zal de koop van het huis en van de stad van zijn bezitting in het jubeljaar uitgaan; want de huizen van de steden van de Levieten zijn hun bezitting te midden van de kinderen van Israël. Maar het veld van de weidegrond van hun steden zal niet verkocht worden; want het is een eeuwige bezitting voor hen.","Joz 21:20-26":"De families nu van de kinderen van Kahath, de Levieten, die overgebleven waren van de kinderen van Kahath, die hadden de steden van hun lot van de stam van Efraïm. En zij gaven hun Sichem, een vrijstad voor de doodslager, en haar voorsteden, op het gebergte van Efraïm, en Gezer en haar voorsteden; En Kibzaim en haar voorsteden, en Beth-horon en haar voorsteden: vier steden.","2 Kon 22:10":"Ook liet Safan, de schrijver, de koning weten: De priester Hilkia heeft mij een boek gegeven. En Safan las dat voor het aangezicht van de koning.","1 Sam 6:12-19":"De koeien nu gingen recht op die weg, op de weg naar Beth-Semes op één straat; zij gingen steeds voort, al loeiend, en weken noch naar rechts noch naar links af; en de vorsten van de Filistijnen gingen achter hen aan tot aan het gebied van Beth-Semes. En de mensen van Beth-Semes maaiden de tarweoogst in het dal, en toen zij hun ogen opsloegen, zagen zij de ark en verblijdden zich toen zij haar zagen. En de wagen kwam op de akker van Jozua, de Beth-Semiet, en bleef daar staan; en daar was een grote steen, en zij kloofden het hout van de wagen, en offerden de koeien de HEERE als brandoffer.","Jes 30:29":"Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.","2 Sam 17:15-17":"En Husai zei tegen Zadok en tegen Abjathar, de priesters: Zo en zo heeft Achitofel Absalom en de oudsten van Israël geraden, maar zo en zo heb ik geraden. Nu dan, stuur haastig iemand, en laat David weten: Overnacht deze nacht niet bij de vlakke velden van de woestijn, en ga ook snel over; anders wordt de koning verslonden, en al het volk dat bij hem is. Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen.","Ps 27:4":"Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.","2 Kron 34:14":"En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.","1 Kron 9:14":"Van de Levieten nu waren Semaja, de zoon van Hasub, de zoon van Azrikam, de zoon van Hasabja, van de kinderen van Merari;","Joz 1:1":"Het gebeurde nu, na de dood van Mozes, de knecht van de HEERE, dat de HEERE tegen Jozua, de zoon van Nun, de dienaar van Mozes, sprak en zei:","Gen 35:4":"Toen gaven zij Jakob al die vreemde goden die in hun hand waren, en de oorringen die aan hun oren waren, en Jakob verborg ze onder de eikenboom die bij Sichem is.","1 Kron 22:6":"Toen riep hij zijn zoon Salomo, en gebood hem voor de HEERE, de God van Israël, een huis te bouwen.","Richt 11:34":"Toen Jeftha nu bij Mizpa bij zijn huis kwam, zie, zo kwam zijn dochter hem tegemoet, met trommels en met reidansen. Zij was zijn enige kind; hij had verder geen zoon of dochter.","Ps 68:33-36":"U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.","1 Sam 8:2":"De naam van zijn eerstgeboren zoon was Joël, en de naam van zijn tweede was Abia; zij waren richters te Berseba.","Ps 77:2":"Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen.","Ezech 48:8-20":"Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend meetrieten in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn. Het hefoffer, dat u de HEERE zult offeren, zal zijn de lengte van vijfentwintigduizend, en de breedte van tienduizend. En daarin zal het heilig hefoffer zijn voor de priesters, noordwaarts de lengte van vijfentwintigduizend, en westwaarts de breedte van tienduizend, en oostwaarts de breedte van tienduizend, en zuidwaarts de lengte van vijfentwintigduizend; en het heiligdom van de HEERE zal in het midden daarvan zijn.","Joz 15:13":"Doch Kaleb, de zoon van Jefunne, had hij een deel gegeven te midden van de kinderen van Juda, naar het bevel van de HEERE tot Jozua, de stad van Arba, vader van Enak, dat is Hebron.","1 Kon 4:12":"Baäna, de zoon van Ahilud, had Taanach, en Megiddo, en heel Beth-sean, dat bij Zartana ligt, beneden Jizreël, van Beth-sean af tot Abel-mehola toe, tot aan de overkant van Jokmeam.","Ps 76:2":"God is bekend in Juda; Zijn Naam is groot in Israël.","Ps 118:26":"Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.","Gen 31:27":"Waarom bent u heimelijk gevlucht, en hebt u zich aan mij ontstolen? En hebt u het mij niet verteld, zodat ik u had kunnen wegzenden met vreugde, en met gezangen, met tamboerijn en met harp?","1 Sam 30:27":"Namelijk aan hen die in Beth-el waren, en aan hen die in Ramoth in het zuiden waren, en aan hen die in Jather waren,","Ps 98:1-8":"Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven. De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen. Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.","1 Sam 6:15":"En de Levieten haalden de ark van de HEERE eraf en het koffertje dat erbij was, waarin de gouden kleinoden waren, en zetten ze op die grote steen; en de mensen van Beth-Semes brachten brandoffers en slachtten slachtoffers voor de HEERE, op diezelfde dag.","Ex 6:20-23":"En de zonen van Jizhar: Korah, en Nefeg, en Zichri. En de zonen van Uzziël: Misael, en Elzafan, en Sithri. En Aäron nam zich Eliseba, dochter van Amminadab, zuster van Nahesson, tot een vrouw; en zij baarde hem Nadab en Abihu, Eleazar en Ithamar.","Ezech 45:1-6":"Wanneer u dan het land door het lot laat toevallen als erfenis, zult u een hefoffer aan de HEERE brengen, als een heilige plaats, van het land; de lengte zal zijn de lengte van vijfentwintigduizend meetrieten, en de breedte tienduizend; dat zal in zijn hele omtrek rondom heilig zijn. Hiervan zal voor het heiligdom zijn vijfhonderd bij vijfhonderd, vierkant rondom; en het zal vijftig el hebben als buitenruimte rondom. Zo zult u met deze maat meten: de lengte van vijfentwintigduizend, en de breedte van tienduizend, en daarin zal het heiligdom zijn, met het heilige der heiligen.","Ps 80:2":"O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.","1 Kron 23:4":"Uit dezen waren er vierentwintigduizend om het werk van het huis van de HEERE aan te sturen; en zesduizend opzichters en rechters;","Joz 21:30":"En van de stam van Aser, Misal en haar voorsteden, Abdon en haar voorsteden;","1 Kron 23:13":"De kinderen van Amram waren Aäron en Mozes. Aäron nu werd afgezonderd om de allerheiligste dingen te heiligen, hij en zijn zonen, tot in eeuwigheid, om te roken en Azarja, de zoon van Jehaleel; en van de Gersonieten, Joah, de zoon van Zimma, en Eden, de zoon van Joah;","Ps 116:19":"in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!","Hagg 1:1":"In het tweede jaar van koning Darius, in de zesde maand, op de eerste dag van de maand, kwam het woord van de HEERE, door de dienst van Haggai, de profeet, tot Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en tot Josua, de zoon van Jozadak, de hogepriester, en Hij zei:","Ex 27:1-8":"U moet ook een altaar maken van acaciahout; vijf el zal de lengte zijn, en vijf el de breedte (vierkant zal dit altaar zijn), en drie el zijn hoogte. En u moet zijn hoorns maken op zijn vier hoeken; uit hetzelfde stuk zullen zijn hoorns zijn, en u moet het met koper overtrekken. U moet het ook potten maken, om zijn as te ontvangen, ook zijn schoffels, en zijn besprengbekkens, en zijn krauwels, en zijn koolpannen; al zijn gereedschap moet u van koper maken.","1 Kron 22:1":"En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.","2 Sam 6:17":"Toen zij nu de ark van de HEERE naar binnen brachten, zetten zij die op haar plaats, in het midden van de tent die David voor haar gespannen had; en David offerde brandoffers voor het aangezicht van de HEERE, en dankoffers.","Gen 29:34":"En zij werd nog zwanger, en baarde een zoon, en zei: Nu zal mijn man zich ditmaal aan mij hechten, omdat ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.","Jes 24:8":"De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houdt op, de vreugde van de harp rust.","1 Kron 9:33":"Uit dezen zijn ook de zangers, hoofden van de vaderen onder de Levieten, in de kamers, vrijgesteld van andere dienst; want dag en nacht waren zij bezig met dat werk.","1 Kron 8:6":"Dezen nu zijn de kinderen van Ehud; dezen waren hoofden van de vaderen van de inwoners van Geba, en hij voerde hen over naar Manahath;","Num 7:8":"
