aäz;","9":"En Ahimaäz verwekte Azarja, en Azarja verwekte Johanan;","10":"En Johanan verwekte Azarja. Hij is het die het priesterambt bediende in het huis dat Salomo in Jeruzalem gebouwd had.","11":"En Azarja verwekte Amarja, en Amarja verwekte Ahitub;","12":"En Ahitub verwekte Zadok, en Zadok verwekte Sallum;","13":"En Sallum verwekte Hilkia, en Hilkia verwekte Azarja;","14":"En Azarja verwekte Seraja, en Seraja verwekte Jozadak;","15":"En Jozadak ging mee toen de HEERE Juda en Jeruzalem gevangen liet wegvoeren door de hand van Nebukadnezar.","16":"*Zo* *zijn* *dan* de kinderen van Levi: Gerson, Kahath en Merari.","17":"En dit zijn de namen van de zonen van Gerson: Libni en Simeï.","18":"En de kinderen van Kahath waren Amram, en Jizhar, en Hebron, en Uzziël.","19":"De kinderen van Merari waren Maheli en Musi. En dit zijn de families van de Levieten, naar hun vaderen.","20":"Van Gerson: zijn zoon was Libni; zijn zoon Jahath; zijn zoon Zimma;","21":"Zijn zoon Joah; zijn zoon Iddo; zijn zoon Zerah; zijn zoon Jeathrai.","22":"De kinderen van Kahath waren: zijn zoon Amminadab; zijn zoon Korah; zijn zoon Assir;","23":"Zijn zoon Elkana; en zijn zoon Ebjasaf; en zijn zoon Assir;","24":"Zijn zoon Tahath; zijn zoon Uriël; zijn zoon Uzzia, en zijn zoon Saul.","25":"De kinderen van Elkana nu waren Amasia en Ahimoth.","26":"Elkana; diens zoon was Elkana; zijn zoon was Zofai; en zijn zoon was Nahath;","27":"Zijn zoon Eliab; zijn zoon Jeroham; zijn zoon Elkana.","28":"De zonen van Samuël nu waren *deze*: zijn eerstgeborene was Vasni, daarna Abia.","29":"De kinderen van Merari waren Maheli; zijn zoon Libni; zijn zoon Simeï; zijn zoon Uzza;","30":"Zijn zoon Simea; zijn zoon Haggija; zijn zoon Asaja.","31":"Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.","32":"En zij dienden voor de tabernakel van de tent der samenkomst met gezangen, totdat Salomo het huis van de HEERE in Jeruzalem bouwde; en zij stonden naar hun beurt in hun ambt.","33":"Dezen nu zijn het die daar stonden met hun zonen; van de zonen van de Kahathieten, Heman de zanger, de zoon van Joël, de zoon van Samuël,","34":"De zoon van Elkana, de zoon van Jeroham, de zoon van Eliël, de zoon van Toah,","35":"De zoon van Zuf, de zoon van Elkana, de zoon van Mahath, de zoon van Amasai,","36":"De zoon van Elkana, de zoon van Joël, de zoon van Azarja, de zoon van Zefanja,","37":"De zoon van Tahath, de zoon van Assir, de zoon van Ebjasaf, de zoon van Korah,","38":"De zoon van Jizhar, de zoon van Kahath, de zoon van Levi, de zoon van Israël.","39":"En zijn broeder Asaf stond aan zijn rechter *zijde*; Asaf was de zoon van Berechja, de zoon van Simea,","40":"De zoon van Michaël, de zoon van Baeseja, de zoon van Malchija,","41":"De zoon van Ethni, de zoon van Zerah, de zoon van Adaja,","42":"De zoon van Ethan, de zoon van Zimma, de zoon van Simeï,","43":"De zoon van Jahath, de zoon van Gerson, de zoon van Levi.","44":"Hun broeders nu, de kinderen van Merari, *stonden* aan de linker *zijde*, *namelijk* Ethan, de zoon van Kisi, de zoon van Abdi, de zoon van Malluch,","45":"De zoon van Hasabja, de zoon van Amazia, de zoon van Hilkia,","46":"De zoon van Amzi, de zoon van Bani, de zoon van Semer,","47":"De zoon van Maheli, de zoon van Musi, de zoon van Merari, de zoon van Levi.","48":"Hun broeders nu, de Levieten, waren aangesteld voor allerlei dienst van de tabernakel van het huis van God.","49":"Aäron nu en zijn zonen brachten reukwerk op het altaar van het brandoffer, en op het reukaltaar, aangesteld voor al het werk van het heilige der heiligen, en om voor Israël verzoening te doen, naar alles wat Mozes, de knecht van God, geboden had.","50":"Dit nu zijn de kinderen van Aäron: Eleazar, was zijn zoon; Pinehas zijn zoon; Abisua zijn zoon;","51":"Bukki zijn zoon; Uzzi zijn zoon; Serahja zijn zoon;","52":"Merajoth zijn zoon; Amarja zijn zoon; Ahitub zijn zoon;","53":"Zadok zijn zoon; Ahimaäz zijn zoon.","54":"En dit waren hun woonplaatsen, naar hun kampementen, in hun gebieden, *namelijk* van de zonen van Aäron, van de familie van de Kahathieten, want dat lot was voor hen.","55":"En zij gaven hun Hebron, in het land van Juda, en haar voorsteden rondom die.","56":"Maar het veld van de stad, en haar dorpen, gaven zij aan Kaleb, de zoon van Jefunne.","57":"En aan de kinderen van Aäron gaven zij steden van Juda, de vrijstad Hebron, en Libna en haar voorsteden, en Jattir en Esthemoa, en haar voorsteden,","58":"En Hilen en haar voorsteden, en Debir en haar voorsteden,","59":"En Asan en haar voorsteden, en Beth-semes en haar voorsteden.","60":"Van de stam van Benjamin nu: Geba en haar voorsteden, en Allemeth en haar voorsteden, en Anathoth en haar voorsteden. Al hun steden, in hun families, waren dertien steden.","61":"Maar de kinderen van Kahath die overgebleven waren, hadden van de familie van de stam, uit de halve stam van half Manasse, bij het lot, tien steden.","62":"En de kinderen van Gerson, naar hun families, hadden van de stam van Issaschar, en van de stam van Aser, en van de stam van Nafthali, en van de stam van Manasse in Basan, dertien steden.","63":"De kinderen van Merari, naar hun families, hadden van de stam van Ruben, en van de stam van Gad, en van de stam van Zebulon, bij het lot, twaalf steden.","64":"Zo gaven de kinderen van Israël aan de Levieten deze steden en haar voorsteden.","65":"En zij gaven ze bij het lot, van de stam van de kinderen van Juda, en van de stam van de kinderen van Simeon, en van de stam van de kinderen van Benjamin, deze steden, die zij bij name noemden.","66":"*Aan* *de* *overigen* nu, uit de families van de kinderen van Kahath, kwamen steden van hun gebied toe, van de stam van Efraïm.","67":"Want zij gaven hun van de vrijsteden, Sichem en haar voorsteden op het gebergte van Efraïm, en Gezer en haar voorsteden,","68":"En Jokmeam en haar voorsteden, en Beth-horon en haar voorsteden,","69":"En Ajalon en haar voorsteden, en Gath-rimmon en haar voorsteden.","70":"En uit de halve stam van Manasse: Aner en haar voorsteden, en Bileam en haar voorsteden. De families van de overige kinderen van Kahath hadden *deze* *steden*:","71":"De kinderen van Gerson hadden van de families van de halve stam van Manasse: Golan in Basan en haar voorsteden, en Astharoth, en haar voorsteden.","72":"En van de stam van Issaschar: Kedes en haar voorsteden, Dobrath en haar voorsteden,","73":"En Ramoth en haar voorsteden, en Anem en haar voorsteden.","74":"En van de stam van Aser: Masal en haar voorsteden, en Abdon en haar voorsteden,","75":"En Hukok en haar voorsteden, en Rehob en haar voorsteden.","76":"En van de stam van Nafthali: Kedes in Galilea, en haar voorsteden, en Hammon en haar voorsteden, en Kirjathaim en haar voorsteden.","77":"De overige kinderen van Merari hadden van de stam van Zebulon: Rimmono en haar voorsteden, Thabor en haar voorsteden;","78":"En aan de overkant van de Jordaan tegenover Jericho, aan de oostkant van de Jordaan, van de stam van Ruben: Bezer in de woestijn, en haar voorsteden, en Jahza en haar voorsteden,","79":"En Kedemoth en haar voorsteden, en Mefaath en haar voorsteden;","80":"En van de stam van Gad: Ramoth in Gilead, en haar voorsteden, en Mahanaim en haar voorsteden,","81":"En Hesbon en haar voorsteden, en Jaezer en haar voorsteden."},"SV":{"1":"De kinderen van Levi waren Gerson, Kahath en Merari.","2":"De kinderen van Kahath nu waren Amram, Jizhar, en Hebron, en Uzziël.","3":"En de kinderen van Amram waren Aäron, en Mozes en Mirjam; en de kinderen van Aäron waren Nadab en Abihu, Eleazar en Ithamar.","4":"En Eleazar gewon Pinehas, Pinehas gewon Abisua;","5":"En Abisua gewon Bukki, en Bukki gewon Uzzi;","6":"En Uzzi gewon Zerahja, en Zerahja gewon Merajoth;","7":"En Merajoth gewon Amarja, en Amarja gewon Ahitub;","8":"En Ahitub gewon Zadok, en Zadok gewon Ahimaäz;","9":"En Ahimaäz gewon Azarja, en Azarja gewon Johanan;","10":"En Johanan gewon Azarja. Hij is het, die het priesterambt bediende in het huis, dat Salomo te Jeruzalem gebouwd had.","11":"En Azarja gewon Amarja, en Amarja gewon Ahitub;","12":"En Ahitub gewon Zadok, en Zadok gewon Sallum;","13":"En Sallum gewon Hilkia, en Hilkia gewon Azarja;","14":"En Azarja gewon Seraja, en Seraja gewon Jozadak;","15":"En Jozadak ging mede, als de HEERE Juda en Jeruzalem gevankelijk wegvoerde door de hand van Nebukadnezar.","16":"*Zo* *zijn* *dan* de kinderen van Levi: Gerson, Kahath en Merari.","17":"En dit zijn de namen der zonen van Gerson: Libni en Simeï.","18":"En de kinderen van Kahath waren Amram, en Jizhar, en Hebron, en Uzziël.","19":"De kinderen van Merari waren Maheli en Musi. En dit zijn de huisgezinnen der Levieten, naar hun vaderen.","20":"Van Gerson: zijn zoon was Libni; zijn zoon Jahath; zijn zoon Zimma;","21":"Zijn zoon Joah; zijn zoon Iddo; zijn zoon Zerah; zijn zoon Jeathrai.","22":"De kinderen van Kahath waren: zijn zoon Amminadab; zijn zoon Korah; zijn zoon Assir;","23":"Zijn zoon Elkana; en zijn zoon Ebjasaf; en zijn zoon Assir;","24":"Zijn zoon Tahath; zijn zoon Uriël; zijn zoon Uzzia, en zijn zoon Saul.","25":"De kinderen van Elkana nu waren Amasia en Ahimoth.","26":"Elkana; dezes zoon was Elkana; zijn zoon was Zofai; en zijn zoon was Nahath;","27":"Zijn zoon Eliab; zijn zoon Jeroham; zijn zoon Elkana.","28":"De zonen van Samuël nu waren *dezen*: zijn eerstgeborene was Vasni, daarna Abia.","29":"De kinderen van Merari waren Maheli; zijn zoon Libni; zijn zoon Simeï; zijn zoon Uzza;","30":"Zijn zoon Simea; zijn zoon Haggija; zijn zoon Asaja.","31":"Dezen nu zijn het, die David gesteld heeft tot het ambt des gezangs in het huis des HEEREN, nadat de ark *tot* rust *gekomen* was.","32":"En zij dienden voor den tabernakel van de tent der samenkomst met gezangen, totdat Salomo het huis des HEEREN te Jeruzalem bouwde; en zij stonden naar hun wijze in hun ambt.","33":"Dezen nu zijn ze, die daar stonden met hun zonen; van de zonen der Kahathieten, Heman de zanger, de zoon van Joël, den zoon van Samuël,","34":"Den zoon van Elkana, den zoon van Jeroham, den zoon van Eliël, den zoon van Toah,","35":"Den zoon van Zuf, den zoon van Elkana, den zoon van Mahath, den zoon van Amasai,","36":"Den zoon van Elkana, den zoon van Joël, den zoon van Azarja, den zoon van Zefanja,","37":"Den zoon van Tahath, den zoon van Assir, den zoon van Ebjasaf, den zoon van Korah,","38":"Den zoon van Jizhar, den zoon van Kahath, den zoon van Levi, den zoon van Israël.","39":"En zijn broeder Asaf stond aan zijn rechter *zijde*; Asaf was de zoon van Berechja, den zoon van Simea,","40":"Den zoon van Michaël, den zoon van Baeseja, den zoon van Malchija,","41":"Den zoon van Ethni, den zoon van Zerah, den zoon van Adaja,","42":"Den zoon van Ethan, den zoon van Zimma, den zoon van Simeï,","43":"Den zoon van Jahath, den zoon van Gerson, den zoon van Levi.","44":"Hunne broeders nu, de kinderen van Merari, *stonden* aan de linker *zijde*, *namelijk* Ethan, de zoon van Kisi, den zoon van Abdi, den zoon van Malluch,","45":"Den zoon van Hasabja, den zoon van Amazia, den zoon van Hilkia,","46":"Den zoon van Amzi, den zoon van Bani, den zoon van Semer,","47":"Den zoon van Maheli, den zoon van Musi, den zoon van Merari, den zoon van Levi.","48":"Hun broeders nu, de Levieten, waren gegeven tot allerlei dienst des tabernakels van het huis Gods.","49":"Aäron nu en zijn zonen rookten op het altaar des brandoffers, en op het reukaltaar, zijnde *besteld* tot al het werk van het heilige der heiligen, en om over Israël verzoening te doen, naar alles wat Mozes, de knecht Gods, geboden had.","50":"Dit nu zijn de kinderen van Aäron: Eleazar, was zijn zoon; Pinehas zijn zoon; Abisua zijn zoon;","51":"Bukki zijn zoon; Uzzi zijn zoon; Serahja zijn zoon;","52":"Merajoth zijn zoon; Amarja zijn zoon; Ahitub zijn zoon;","53":"Zadok zijn zoon; Ahimaäz zijn zoon.","54":"En dit waren hun woningen, naar hun kastelen, in hun landpalen, *namelijk* van de zonen van Aäron, van het huisgezin der Kahathieten, want dat lot was voor hen.","55":"En zij gaven hun Hebron, in het land van Juda, en haar voorsteden rondom dezelve.","56":"Maar het veld der stad, en haar dorpen, gaven zij Kaleb, den zoon van Jefunne.","57":"En den kinderen van Aäron gaven zij steden van Juda, de vrijstad Hebron, en Libna en haar voorsteden, en Jattir en Esthemoa, en haar voorsteden,","58":"En Hilen en haar voorsteden, en Debir en haar voorsteden,","59":"En Asan en haar voorsteden, en Beth-semes en haar voorsteden.","60":"Van den stam van Benjamin nu: Geba en haar voorsteden, en Allemeth en haar voorsteden, en Anathoth en haar voorsteden. Al hun steden, in hun huisgezinnen, waren dertien steden.","61":"Maar de kinderen van Kahath, die overgebleven waren, hadden van het huisgezin van den stam, uit den halven stam van half Manasse, bij het lot, tien steden.","62":"En de kinderen van Gerson, naar hun huisgezinnen, hadden van den stam van Issaschar, en van den stam van Aser, en van den stam van Nafthali, en van den stam van Manasse in Basan, dertien steden.","63":"De kinderen van Merari, naar hun huisgezinnen, hadden van den stam van Ruben, en van den stam van Gad, en van den stam van Zebulon, bij het lot, twaalf steden.","64":"Alzo gaven de kinderen Israëls aan de Levieten deze steden en haar voorsteden.","65":"En zij gaven ze bij het lot, van den stam der kinderen van Juda, en van den stam der kinderen van Simeon, en van den stam der kinderen van Benjamin, deze steden, dewelke zij bij namen noemden.","66":"*Aan* *de* *overigen* nu, uit de huisgezinnen der kinderen van Kahath, dien gewerden steden hunner landpale, van den stam van Efraïm.","67":"Want zij gaven hun van de vrijsteden, Sichem en haar voorsteden op het gebergte van Efraïm, en Gezer en haar voorsteden,","68":"En Jokmeam en haar voorsteden, en Beth-horon en haar voorsteden,","69":"En Ajalon en haar voorsteden, en Gath-rimmon en haar voorsteden.","70":"En uit den halven stam van Manasse: Aner en haar voorsteden, en Bileam en haar voorsteden. De huisgezinnen der overige kinderen van Kahath hadden *deze* *steden*:","71":"De kinderen van Gerson hadden van de huisgezinnen van den halven stam van Manasse: Golan in Basan en haar voorsteden, en Astharoth, en haar voorsteden.","72":"En van den stam van Issaschar: Kedes en haar voorsteden, Dobrath en haar voorsteden,","73":"En Ramoth en haar voorsteden, en Anem en haar voorsteden.","74":"En van den stam van Aser: Masal en haar voorsteden, en Abdon en haar voorsteden,","75":"En Hukok en haar voorsteden, en Rehob en haar voorsteden.","76":"En van den stam van Nafthali: Kedes in Galilea, en haar voorsteden, en Hammon en haar voorsteden, en Kirjathaim en haar voorsteden.","77":"De overige kinderen van Merari hadden van den stam van Zebulon: Rimmono en haar voorsteden, Thabor en haar voorsteden;","78":"En aan gene zijde van de Jordaan tegen Jericho, tegen het oosten aan de Jordaan, van den stam van Ruben: Bezer in de woestijn, en haar voorsteden, en Jahza en haar voorsteden,","79":"En Kedemoth en haar voorsteden, en Mefaath en haar voorsteden;","80":"En van den stam van Gad: Ramoth in Gilead, en haar voorsteden, en Mahanaim en haar voorsteden,","81":"En Hesbon en haar voorsteden, en Jaezer en haar voorsteden."},"KJV":{"1":"The sons of Levi; Gershon, Kohath, and Merari.","2":"And the sons of Kohath; Amram, Izhar, and Hebron, and Uzziel.","3":"And the children of Amram; Aaron, and Moses, and Miriam. The sons also of Aaron; Nadab, and Abihu, Eleazar, and Ithamar.","4":"Eleazar begat Phinehas, Phinehas begat Abishua,","5":"And Abishua begat Bukki, and Bukki begat Uzzi,","6":"And Uzzi begat Zerahiah, and Zerahiah begat Meraioth,","7":"Meraioth begat Amariah, and Amariah begat Ahitub,","8":"And Ahitub begat Zadok, and Zadok begat Ahimaaz,","9":"And Ahimaaz begat Azariah, and Azariah begat Johanan,","10":"And Johanan begat Azariah, (he it is that executed the priest's office in the temple that Solomon built in Jerusalem:)","11":"And Azariah begat Amariah, and Amariah begat Ahitub,","12":"And Ahitub begat Zadok, and Zadok begat Shallum,","13":"And Shallum begat Hilkiah, and Hilkiah begat Azariah,","14":"And Azariah begat Seraiah, and Seraiah begat Jehozadak,","15":"And Jehozadak went into captivity, when the LORD carried away Judah and Jerusalem by the hand of Nebuchadnezzar.","16":"The sons of Levi; Gershom, Kohath, and Merari.","17":"And these be the names of the sons of Gershom; Libni, and Shimei.","18":"And the sons of Kohath were, Amram, and Izhar, and Hebron, and Uzziel.","19":"The sons of Merari; Mahli, and Mushi. And these are the families of the Levites according to their fathers.","20":"Of Gershom; Libni his son, Jahath his son, Zimmah his son,","21":"Joah his son, Iddo his son, Zerah his son, Jeaterai his son.","22":"The sons of Kohath; Amminadab his son, Korah his son, Assir his son,","23":"Elkanah his son, and Ebiasaph his son, and Assir his son,","24":"Tahath his son, Uriel his son, Uzziah his son, and Shaul his son.","25":"And the sons of Elkanah; Amasai, and Ahimoth.","26":"As for Elkanah: the sons of Elkanah; Zophai his son, and Nahath his son,","27":"Eliab his son, Jeroham his son, Elkanah his son.","28":"And the sons of Samuel; the firstborn Vashni, and Abiah.","29":"The sons of Merari; Mahli, Libni his son, Shimei his son, Uzza his son,","30":"Shimea his son, Haggiah his son, Asaiah his son.","31":"And these are they whom David set over the service of song in the house of the LORD, after that the ark had rest.","32":"And they ministered before the dwelling place of the tabernacle of the congregation with singing, until Solomon had built the house of the LORD in Jerusalem: and then they waited on their office according to their order.","33":"And these are they that waited with their children. Of the sons of the Kohathites: Heman a singer, the son of Joel, the son of Shemuel,","34":"The son of Elkanah, the son of Jeroham, the son of Eliel, the son of Toah,","35":"The son of Zuph, the son of Elkanah, the son of Mahath, the son of Amasai,","36":"The son of Elkanah, the son of Joel, the son of Azariah, the son of Zephaniah,","37":"The son of Tahath, the son of Assir, the son of Ebiasaph, the son of Korah,","38":"The son of Izhar, the son of Kohath, the son of Levi, the son of Israel.","39":"And his brother Asaph, who stood on his right hand, even Asaph the son of Berachiah, the son of Shimea,","40":"The son of Michael, the son of Baaseiah, the son of Malchiah,","41":"The son of Ethni, the son of Zerah, the son of Adaiah,","42":"The son of Ethan, the son of Zimmah, the son of Shimei,","43":"The son of Jahath, the son of Gershom, the son of Levi.","44":"And their brethren the sons of Merari stood on the left hand: Ethan the son of Kishi, the son of Abdi, the son of Malluch,","45":"The son of Hashabiah, the son of Amaziah, the son of Hilkiah,","46":"The son of Amzi, the son of Bani, the son of Shamer,","47":"The son of Mahli, the son of Mushi, the son of Merari, the son of Levi.","48":"Their brethren also the Levites were appointed unto all manner of service of the tabernacle of the house of God.","49":"But Aaron and his sons offered upon the altar of the burnt offering, and on the altar of incense, and were appointed for all the work of the place most holy, and to make an atonement for Israel, according to all that Moses the servant of God had commanded.","50":"And these are the sons of Aaron; Eleazar his son, Phinehas his son, Abishua his son,","51":"Bukki his son, Uzzi his son, Zerahiah his son,","52":"Meraioth his son, Amariah his son, Ahitub his son,","53":"Zadok his son, Ahimaaz his son.","54":"Now these are their dwelling places throughout their castles in their coasts, of the sons of Aaron, of the families of the Kohathites: for theirs was the lot.","55":"And they gave them Hebron in the land of Judah, and the suburbs thereof round about it.","56":"But the fields of the city, and the villages thereof, they gave to Caleb the son of Jephunneh.","57":"And to the sons of Aaron they gave the cities of Judah, namely, Hebron, the city of refuge, and Libnah with her suburbs, and Jattir, and Eshtemoa, with their suburbs,","58":"And Hilen with her suburbs, Debir with her suburbs,","59":"And Ashan with her suburbs, and Bethshemesh with her suburbs:","60":"And out of the tribe of Benjamin; Geba with her suburbs, and Alemeth with her suburbs, and Anathoth with her suburbs. All their cities throughout their families were thirteen cities.","61":"And unto the sons of Kohath, which were left of the family of that tribe, were cities given out of the half tribe, namely, out of the half tribe of Manasseh, by lot, ten cities.","62":"And to the sons of Gershom throughout their families out of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the tribe of Manasseh in Bashan, thirteen cities.","63":"Unto the sons of Merari were given by lot, throughout their families, out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.","64":"And the children of Israel gave to the Levites these cities with their suburbs.","65":"And they gave by lot out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, and out of the tribe of the children of Benjamin, these cities, which are called by their names.","66":"And the residue of the families of the sons of Kohath had cities of their coasts out of the tribe of Ephraim.","67":"And they gave unto them, of the cities of refuge, Shechem in mount Ephraim with her suburbs; they gave also Gezer with her suburbs,","68":"And Jokmeam with her suburbs, and Bethhoron with her suburbs,","69":"And Aijalon with her suburbs, and Gathrimmon with her suburbs:","70":"And out of the half tribe of Manasseh; Aner with her suburbs, and Bileam with her suburbs, for the family of the remnant of the sons of Kohath.","71":"Unto the sons of Gershom were given out of the family of the half tribe of Manasseh, Golan in Bashan with her suburbs, and Ashtaroth with her suburbs:","72":"And out of the tribe of Issachar; Kedesh with her suburbs, Daberath with her suburbs,","73":"And Ramoth with her suburbs, and Anem with her suburbs:","74":"And out of the tribe of Asher; Mashal with her suburbs, and Abdon with her suburbs,","75":"And Hukok with her suburbs, and Rehob with her suburbs:","76":"And out of the tribe of Naphtali; Kedesh in Galilee with her suburbs, and Hammon with her suburbs, and Kirjathaim with her suburbs.","77":"Unto the rest of the children of Merari were given out of the tribe of Zebulun, Rimmon with her suburbs, Tabor with her suburbs:","78":"And on the other side Jordan by Jericho, on the east side of Jordan, were given them out of the tribe of Reuben, Bezer in the wilderness with her suburbs, and Jahzah with her suburbs,","79":"Kedemoth also with her suburbs, and Mephaath with her suburbs:","80":"And out of the tribe of Gad; Ramoth in Gilead with her suburbs, and Mahanaim with her suburbs,","81":"And Heshbon with her suburbs, and Jazer with her suburbs."}},"tsk":{"1":[{"kopje":"kinderen van Levi","refs":["1 Kron 23:6","Gen 46:11","Ex 6:15","Num 3:17","Num 26:57"]},{"kopje":"Gerson","refs":["1 Kron 6:16","1 Kron 6:20"]}],"2":[{"kopje":"de kinderen van Kahath","refs":["1 Kron 23:12","Ex 6:17","Ex 6:20-23"]},{"kopje":"Amram","refs":["1 Kron 6:22"]}],"3":[{"kopje":"Aäron","refs":["1 Kron 23:13","Ex 6:19"]},{"kopje":"Mirjam","refs":["Ex 2:4","Ex 2:7","Ex 15:20","Micha 6:4"]},{"kopje":"Nadab","refs":["1 Kron 24:1","1 Kron 24:2","Ex 6:22","Ex 24:1","Ex 28:1","Lev 10:1","Lev 10:12","Lev 10:16"]},{"kopje":"Eleazar","refs":["1 Kron 24:3-6"]}],"4":[{"kopje":"Pinehas","refs":["1 Kron 6:50","1 Kron 9:20","Ex 6:24","Num 25:6-11","Num 25:13","Num 31:6","Joz 22:13","Joz 22:30-32","Joz 24:33","Richt 20:28","Ezra 8:2","Ps 106:30","Ps 106:31"]},{"kopje":"Abisua","refs":["Ezra 7:1-5"]}],"6":[{"kopje":"Zerahja","refs":["Ezra 7:4"]},{"kopje":"Merajoth","refs":["Neh 12:15"]}],"7":[{"kopje":"Amarja","refs":["Ezra 7:3"] href":"../../nave/r/#t-ramoth-gilead","kinderen":[{"label":"A city of the territory of the tribe of Gad, and one of the cities of refuge","href":"../../nave/r/?hl=1Chr.6.80#i16892","refs":[{"disp":"Deut 4:43","href":"../../deuteronomium/4/#v43","ref":"Deut 4:43","svLabel":null},{"disp":"Joz 20:8","href":"../../jozua/20/#v8","ref":"Joz 20:8","svLabel":null},{"disp":"1 Kron 6:80","href":"../../1-kronieken/6/#v80","ref":"1 Kron 6:80","svLabel":null}],"kinderen":[]}]}]}},"extern":{"Num 3:1":"Dit nu zijn de geboorten van Aäron en Mozes; ten dage dat de HEERE met Mozes gesproken heeft op de berg Sinaï.","Ezra 7:27":"Geloofd zij de HEERE, de God van onze vaderen, Die zoiets in het hart van de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.","Ps 92:14":"Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.","Num 16:10":"Terwijl Hij u, en al uw broeders, de kinderen van Levi, met u, heeft laten naderen; zoekt u nu ook het priesterambt?","Dan 12:1":"En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.","1 Kron 6:71-76":"De kinderen van Gerson hadden van de families van de halve stam van Manasse: Golan in Basan en haar voorsteden, en Astharoth, en haar voorsteden. En van de stam van Issaschar: Kedes en haar voorsteden, Dobrath en haar voorsteden, En Ramoth en haar voorsteden, en Anem en haar voorsteden.","Neh 12:15":"Van Harim, Adna; van Merajoth, Helkai;","1 Kron 25:3":"Aangaande Jeduthun: de kinderen van Jeduthun waren Gedalja, en Zeri, en Jesaja, Hasabja en Mattithja, zes; onder leiding van hun vader Jeduthun, die op harpen profeteerde om de HEERE te danken en te loven.","Ps 95:1":"Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.","1 Kron 25:2":"Van de kinderen van Asaf waren Zakkur, en Jozef, en Nethanja, en Asarela, kinderen van Asaf; onder leiding van Asaf, die onder leiding van de koning profeteerde.","2 Kron 31:13":"Maar Jehiël, en Azazja, en Nahath, en Asaël, en Jerimoth, en Jozabad, en Eliël, en Jismachja, en Mahath, en Benaja, waren opzieners, onder de hand van Chonanja en Simeï, zijn broer; door het bevel van koning Hizkia en van Azarja, de leider van het huis van God.","Jer 41:5":"Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.","1 Kron 15:24":"En Sebanja, en Josafat, en Nethaneel, en Amasai, en Zecharja, en Benaja, en Eliëzer, de priesters, bliezen op trompetten voor de ark van God; en Obed-edom en Jehia waren poortwachters van de ark.","2 Kon 9:1":"Toen riep de profeet Elisa een van de zonen van de profeten, en hij zei tegen hem: Gord uw lenden, en neem deze oliekruik in uw hand, en ga naar Ramoth in Gilead.","Num 20:26-28":"En trek Aäron zijn kleren uit, en trek ze Eleazar, zijn zoon, aan; want Aäron zal verzameld worden, en daar sterven. Mozes nu deed zoals de HEERE geboden had; want zij klommen op naar de berg Hor, voor de ogen van de hele vergadering. En Mozes trok Aäron zijn kleren uit, en hij trok ze zijn zoon Eleazar aan; en Aäron stierf daar, op de top van die berg. Toen kwamen Mozes en Eleazar van die berg af.","Deut 12:18":"Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt.","Joz 19:34":"En deze grens keert zich westwaarts naar Asnoth-thabor, en vandaar gaat zij verder naar Hukkok, en zij reikt aan Zebulon tegen het zuiden, en aan Aser reikt zij tegen het westen, en aan Juda aan de Jordaan tegen de opgang van de zon.","Hebr 7:11-14":"Als dan nu de volkomenheid door het Levitische priesterschap zou zijn (want onder dat priesterschap heeft het volk de wet ontvangen), wat nodig was het dan nog, dat een andere priester naar de ordening van Melchizedek zou opstaan, en niet naar de ordening van Aäron genoemd zou worden? Want als het priesterschap verandert, gebeurt er ook noodzakelijk verandering van de wet. Want Hij, over Wie deze dingen gezegd worden, behoort tot een andere stam, waarvan niemand zich tot het altaar begeven heeft.","1 Kon 1:40":"En al het volk kwam achter hem aan omhoog, en het volk speelde op fluiten, en verblijdde zich met grote blijdschap, zodat de aarde van hun geluid barstte.","2 Kron 8:16":"Zo werd al het werk van Salomo klaargemaakt, tot de dag van de grondlegging van het huis van de HEERE, en tot het voltooien ervan, zodat het huis van de HEERE volmaakt werd.","Ps 144:9":"O God, ik zal U een nieuw lied zingen; met de luit en het tiensnarig instrument zal ik U lofzingen.","Ps 50:1":"Een psalm van Asaf. De God der goden, de HEERE spreekt, en roept de aarde, van de opgang van de zon tot aan haar ondergang.","Joz 13:26":"En van Hesbon af tot Ramath-mizpa en Betonim toe; en van Mahanaim af tot aan de grens van Debir toe;","2 Kon 22:12":"En de koning gebood Hilkia, de priester, en Ahikam, de zoon van Safan, en Achbor, de zoon van Michaja, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei:","Num 35:2-8":"Gebied de Israëlieten dat zij van de erfenis van hun bezitting steden aan de Levieten geven om te bewonen; daarbij zult u aan de Levieten ook voorsteden geven, rondom de steden. En die steden zullen zij hebben om te bewonen; maar hun voorsteden zullen zijn voor hun vee, en voor hun bezit, en voor al hun dieren, En de voorsteden van de steden, die u aan de Levieten zult geven, zullen van de stadsmuur af, naar buiten toe, duizend el zijn, rondom.","Ezech 48:29":"Dit is het land, dat u zult laten vallen in erfenis, voor de stammen van Israël, en dit zullen hun delen zijn, spreekt de Heere HEERE.","Ps 23:6":"Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.","Num 31:10":"Verder verbrandden zij al hun steden met hun woonplaatsen, en al hun burchten, met vuur.","1 Kron 23:10":"De kinderen van Simeï nu waren Jahath, Zina, en Jeüs, en Beria; dezen waren de kinderen van Simeï; vier.","Num 16:16-50":"Verder zei Mozes tegen Korach: U, en uw hele vergadering, wees voor het aangezicht van de HEERE; u, en zij, ook Aäron, morgen. En neem ieder zijn wierookvat, en leg reukwerk daarin, en breng het voor het aangezicht van de HEERE, ieder zijn wierookvat, tweehonderd en vijftig wierookvaten; ook u, en Aäron, ieder zijn wierookvat. Zo nam ieder zijn wierookvat, en deed vuur daarin, en legde reukwerk daarin; en zij stonden voor de deur van de tent van de samenkomst, ook Mozes en Aäron.","2 Kron 20:22":"Toen zij nu begonnen met vreugdegeroep en lofzang, stelde de HEERE hinderlagen tegen de kinderen van Ammon, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden verslagen.","2 Kron 5:12":"en de Levieten, die zangers waren, van hen allen, van Asaf, van Heman, van Jeduthun, en van hun zonen, en van hun broeders, in fijn linnen gekleed, met cimbalen, en met luiten, en harpen, stonden aan de oostzijde van het altaar, en met hen tot honderdtwintig priesters toe, die op trompetten trompetten);","2 Sam 16:5":"Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte.","Ps 78:1":"Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond.","Jer 38:1":"Toen Sefatja, de zoon van Matthan, en Gedalia, de zoon van Pashur, en Juchal, de zoon van Selemja, en Pashur, de zoon van Malchia, de woorden hoorden die Jeremia tot al het volk sprak:","1 Kron 15:7":"Van de nakomelingen van Gersom was Joël leider, en van zijn broeders waren er honderddertig.","2 Kon 12:10":"Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.","Jer 36:5":"En Jeremia gebood Baruch: Ik word tegengehouden, ik zal niet in het huis van de HEERE kunnen gaan.","Num 26:11":"Maar de kinderen van Korach stierven niet.","1 Kron 6:16-48":"Zo zijn dan de kinderen van Levi: Gerson, Kahath en Merari. En dit zijn de namen van de zonen van Gerson: Libni en Simeï. En de kinderen van Kahath waren Amram, en Jizhar, en Hebron, en Uzziël.","Joz 21:26":"Al de steden voor de families van de overige kinderen van Kahath zijn tien, met hun voorsteden.","1 Kron 6:50-53":"Dit nu zijn de kinderen van Aäron: Eleazar, was zijn zoon; Pinehas zijn zoon; Abisua zijn zoon; Bukki zijn zoon; Uzzi zijn zoon; Serahja zijn zoon; Merajoth zijn zoon; Amarja zijn zoon; Ahitub zijn zoon;","Joz 16:5":"Het gebied nu van de kinderen van Efraïm, naar hun huisgezinnen, is dit: namelijk, de grens van hun erfdeel was oostwaarts Atroth-addar tot aan het bovenste Beth-horon.","Joz 19:26":"En Allammelech, en Am-ad, en Mis-al; en zij reikt aan Karmel westwaarts, en aan Sichor-libnath;","Ps 135:3":"Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.","2 Sam 19:35":"Ik ben vandaag tachtig jaar oud; zou ik nog kunnen onderscheiden tussen goed en kwaad? Zou uw knecht kunnen proeven wat ik eet en wat ik drink? Zou ik nog kunnen horen naar de stem van zangers en zangeressen? En waarom zou uw knecht mijn heer de koning nog langer tot last zijn?","Jes 14:11":"Uw hoogmoed is in het rijk van de dood neergestort, met het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.","Jer 39:9":"Het overige nu van het volk, dat in de stad was overgebleven, en de overlopers, die naar hem overgelopen waren, met het overige van het volk, dat overgebleven was, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk naar Babel.","Lev 22:33":"Die u uit het land Egypte heb uitgevoerd, opdat Ik u tot een God zou zijn; Ik ben de HEERE!","2 Kron 20:19":"En de Levieten uit de kinderen van de Kahathieten en uit de kinderen van de Korachieten stonden op om de HEERE, de God van Israël, met luide stem uitbundig te prijzen.","Joz 15:42":"Libna, en Ether, en Asan,","2 Kron 36:14":"Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.","2 Sam 17:24":"David nu kwam te Mahanaïm, en Absalom trok de Jordaan over, hij en alle mannen van Israël met hem.","Deut 34:5":"Zo stierf Mozes, de knecht van de HEERE, daar in het land van Moab, naar het woord van de HEERE.","Ps 150:1-6":"Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte! Loof Hem vanwege Zijn machtige daden; loof Hem naar de overvloed van Zijn grootheid! Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!","2 Sam 19:32":"Barzillai nu was zeer oud, een man van tachtig jaar; en hij had de koning van voedsel voorzien toen hij in Mahanaïm verbleef; want hij was een zeer belangrijk man.","Dan 3:7":"Daarom, op dat moment, toen al die volken het geluid hoorden van de hoorn, de pijp, de citer, de vedel, de psalters, en allerlei soorten muziek, vielen alle volken, naties en tongen neer en aanbaden het gouden beeld, dat de koning Nebukadnezar had opgericht.","1 Kron 14:16":"David nu deed zoals God hem geboden had; en zij sloegen het leger van de Filistijnen van Gibeon af tot aan Gezer.","Ps 122:9":"Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.","1 Kron 23:12":"De kinderen van Kehath waren Amram, Jizhar, Hebron en Uzziël; vier.","2 Sam 15:35":"En zijn niet Zadok en Abjathar, de priesters, daar bij u? Zo zal het gebeuren, dat u alles wat u uit het huis van de koning zult horen, aan de priesters, Zadok en Abjathar, zult bekendmaken.","Ex 6:20":"En de zonen van Jizhar: Korah, en Nefeg, en Zichri.","Num 4:31-33":"Dit zal nu de taak zijn van hun last, naar al hun dienst, in de tent der samenkomst: de planken van de tabernakel, en zijn richels, en zijn pilaren, en zijn voeten; Alsook de pilaren van de voorhof rondom, hun voeten, en hun pennen, en hun touwen, met al hun gereedschap, en met al hun dienst; en het gereedschap van de taak van hun last zult u bij name tellen. Dit is de dienst van de geslachten van de zonen van Merari, naar hun hele dienst, in de tent der samenkomst, onder de hand van Ithamar, de zoon van Aäron, de priester.","2 Kron 29:24":"En de priesters slachtten ze, en ontzondigden met hun bloed op het altaar, om verzoening te doen voor heel Israël; want de koning had dat brandoffer en dat zondoffer voor heel Israël bevolen.","Joz 14:2":"Door het lot van hun erfenis, zoals de HEERE door de dienst van Mozes geboden had, aangaande de negen stammen en de halve stam.","Jer 20:1":"Toen Pashur, de zoon van Immer, de priester (deze was aangesteld als voorganger in het huis van de HEERE), Jeremia hoorde deze woorden profeteren,","Ex 28:1":"Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron.","Joz 10:29":"Toen trok Jozua door, en heel Israël met hem, van Makkeda naar Libna, en hij streed tegen Libna.","1 Sam 8:1-3":"Het gebeurde nu, toen Samuël oud geworden was, dat hij zijn zonen tot richters over Israël aanstelde. De naam van zijn eerstgeboren zoon was Joël, en de naam van zijn tweede was Abia; zij waren richters te Berseba. Doch zijn zonen wandelden niet in zijn wegen, maar neigden zich naar de gierigheid, en namen geschenken aan, en bogen het recht.","Lev 10:1":"En de zonen van Aäron, Nadab en Abihu, namen ieder zijn wierookvat en deden er vuur in, en legden er reukwerk op, en brachten vreemd vuur voor het aangezicht van de HEERE, wat Hij hun niet geboden had.","Ex 6:18":"En de zonen van Merari: Machli en Musi; dit zijn de huisgezinnen van Levi, naar hun geboorten.","Neh 7:44":"De zangers: de kinderen van Asaf, honderdachtenveertig;","Num 3:20":"En de zonen van Merari, naar hun geslachten: Maheli en Musi; dit zijn de geslachten van de Levieten, naar het huis van hun vaderen.","Ps 95:2":"Laat ons Zijn aangezicht tegemoet gaan met lof; laat ons Hem juichen met psalmen.","2 Kron 35:25":"En Jeremia maakte een klaaglied over Josia; evenzo spraken alle zangers en zangeressen in hun klaagliederen van Josia, tot op deze dag; want zij gaven ze tot een inzetting in Israël; en zie, zij zijn geschreven in de klaagliederen.","1 Kron 6:3-15":"En de kinderen van Amram waren Aäron, en Mozes en Mirjam; en de kinderen van Aäron waren Nadab en Abihu, Eleazar en Ithamar. En Eleazar verwekte Pinehas, Pinehas verwekte Abisua; En Abisua verwekte Bukki, en Bukki verwekte Uzzi;","2 Kron 24:20-22":"En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten. En zij maakten een samenzwering tegen hem, en stenigden hem met stenen door het gebod van de koning, in de voorhof van het huis van de HEERE. Zo dacht de koning Joas niet aan de weldadigheid die zijn vader Jojada aan hem gedaan had, maar doodde zijn zoon; en toen deze stierf, zei hij: De HEERE zal het zien en het vergelden!","1 Kron 25:1-31":"David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst. Van de kinderen van Asaf waren Zakkur, en Jozef, en Nethanja, en Asarela, kinderen van Asaf; onder leiding van Asaf, die onder leiding van de koning profeteerde. Aangaande Jeduthun: de kinderen van Jeduthun waren Gedalja, en Zeri, en Jesaja, Hasabja en Mattithja, zes; onder leiding van hun vader Jeduthun, die op harpen profeteerde om de HEERE te danken en te loven.","Joz 10:2":"Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk.","2 Kon 12:9":"Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.","2 Kron 31:2":"En Hizkia stelde de verdelingen van de priesters en de Levieten in, naar hun verdelingen, ieder naar zijn dienst, de priesters en de Levieten voor het brandoffer en voor de dankoffers, om te dienen, en om te loven, en om te prijzen in de poort van de legerplaatsen van de HEERE;","Lev 4:20":"En hij zal met deze var doen zoals hij met de var van het zondoffer gedaan heeft, zo zal hij met hem doen; en de priester zal voor hen verzoening doen, en het zal hun vergeven worden.","Joz 21:6":"En aan de kinderen van Gerson, van de families van de stam van Issaschar, en van de stam van Aser, en van de stam van Nafthali, en van de halve stam van Manasse, in Bazan, bij het lot, dertien steden.","1 Kron 7:8":"De kinderen van Becher nu waren Zemira, en Joas, en Eliëzer, en Eljoenai, en Omri, en Jeremoth, en Abija, en Anathoth, en Alemeth; deze allemaal waren kinderen van Becher.","Joz 9:10":"En alles wat Hij gedaan heeft aan de twee koningen van de Amorieten die aan de overkant van de Jordaan waren, Sihon, de koning van Hesbon, en Og, de koning van Bazan, die te Astharoth woonde.","2 Sam 18:19-33":"Toen zei Ahimaäz, de zoon van Zadok: Laat mij toch snel gaan, en de koning berichten dat de HEERE hem recht gedaan heeft tegenover zijn vijanden. Maar Joab zei tegen hem: U zult vandaag geen boodschapper zijn, maar een andere dag zult u berichten; vandaag zult u niet berichten, omdat de zoon van de koning dood is. En Joab zei tegen Cuschi: Ga heen, en vertel de koning wat u gezien hebt; en Cuschi boog zich voor Joab, en liep heen.","Micha 2:5":"Daarom zult u niemand hebben die het meetsnoer werpt in het lot, in de gemeente van de HEERE.","Num 4:22-28":"Neem ook de som op van de zonen van Gerson, naar het huis van hun vaderen, naar hun geslachten. U zult hen tellen van dertig jaar oud en ouder, tot vijftig jaar oud, ieder die komt om in de strijd te dienen, om de dienst te verrichten in de tent der samenkomst. Dit zal de dienst zijn van de geslachten van de Gersonieten, in het dienen en in het dragen.","Neh 11:31":"De kinderen van Benjamin nu woonden, van Geba af, in Michmas, en Aja, en Beth-el, en haar onderhorige plaatsen,","Neh 11:17-23":"En Matthanja, de zoon van Micha, de zoon van Zabdi, de zoon van Asaf, was het hoofd, die de dankzegging begon in het gebed, en Bakbukja was de tweede van zijn broeders; en Abda, de zoon van Sammua, de zoon van Galal, de zoon van Jeduthun. Alle Levieten in de heilige stad waren tweehonderdvierentachtig. En de poortwachters: Akkub, Talmon, met hun broeders, die wacht hielden in de poorten, waren honderdtweeënzeventig.","2 Kon 18:18":"En zij riepen naar de koning; toen ging tot hen uit Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier.","1 Kron 22:5":"Want David zei: Mijn zoon Salomo is een jongeman en teder; en het huis dat men voor de HEERE bouwen zal, moet buitengewoon groot gemaakt worden, tot een naam en tot glorie in alle landen; ik zal er nu voorraad voor bereiden. Zo bereidde David voorraad in overvloed voor zijn dood.","Job 30:31":"Hierom is mijn harp tot een rouwklacht geworden, en mijn orgel tot een stem van hen die wenen.","2 Kron 34:20":"En de koning gebood Hilkia, en Ahikam, de zoon van Safan, en Abdon, de zoon van Micha, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei:","Jer 52:20":"De twee pilaren, de ene zee, en de twaalf koperen runderen, die in de plaats van de stellingen waren, die koning Salomo voor het huis van de HEERE gemaakt had; het koper daarvan, namelijk van al deze vaten, was zonder gewicht.","Deut 10:9":"Daarom heeft Levi geen deel, en ook geen erfdeel met zijn broeders; de HEERE is zijn erfdeel, zoals de HEERE, uw God, tegen hem gesproken heeft.","1 Kon 12:6":"En koning Rehabeam hield raad met de oudsten, die voor het aangezicht van zijn vader Salomo gestaan hadden toen hij nog leefde, en zei: Hoe raadt u mij, dat men dit volk antwoorden zal?","Jes 5:12":"En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.","1 Kon 1:34":"En laat Zadok, de priester, met Nathan, de profeet, hem daar tot koning over Israël zalven. Daarna moet u op de bazuin blazen, en zeggen: Leve de koning Salomo!","Gen 14:20":"En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.","Ps 135:1":"Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE!","2 Kon 11:4":"In het zevende jaar zond Jojada, en nam de leiders van honderd met de hoofdmannen en met de lijfwacht, en hij bracht hen bij zich, in het huis van de HEERE; en hij sloot een verbond met hen en beëdigde hen in het huis van de HEERE, en hij toonde hun de zoon van de koning.","Ezra 2:64":"Deze hele gemeente samen was tweeënveertigduizend driehonderdzestig.","1 Kon 15:22":"Toen liet de koning Asa door heel Juda uitroepen (niemand was vrijgesteld), dat zij de stenen van Rama, en het hout daarvan, zouden wegdragen, waarmee Baësa gebouwd had; en de koning Asa bouwde daarmee Geba-Benjamins, en Mizpa.","1 Kon 6:37":"In het vierde jaar werd de grond van het huis van de HEERE gelegd, in de maand Ziv;","Job 33:24":"Zo zal Hij hem genadig zijn, en zeggen: Verlos hem, dat hij in het verderf niet nederdaalt, Ik heb verzoening gevonden.","1 Kron 23:21-23":"De kinderen van Merari waren Maheli en Musi; de kinderen van Maheli waren Eleazar en Kis. En Eleazar stierf, en hij had geen zonen, maar dochters; en de kinderen van Kis, hun broeders, namen hen tot vrouw. De kinderen van Musi waren Maheli, en Eder, en Jeremoth; drie.","Joz 18:10":"Toen wierp Jozua het lot voor hen te Silo, voor het aangezicht van de HEERE. En Jozua verdeelde daar aan de kinderen van Israël het land, naar hun afdelingen.","1 Kron 6:57-60":"En aan de kinderen van Aäron gaven zij steden van Juda, de vrijstad Hebron, en Libna en haar voorsteden, en Jattir en Esthemoa, en haar voorsteden, En Hilen en haar voorsteden, en Debir en haar voorsteden, En Asan en haar voorsteden, en Beth-semes en haar voorsteden.","1 Kron 9:42":"En Achaz verwekte Jaera, en Jaera verwekte Alemeth, en Azmaveth, en Zimri; en Zimri verwekte Moza;","2 Kon 5:18":"In deze zaak moge de HEERE uw knecht vergeven: wanneer mijn heer naar het huis van Rimmon gaat, om zich daar neer te buigen, en hij op mijn hand leunt en ik mij in het huis van Rimmon neerbuig; als ik mij zo neerbuig in het huis van Rimmon, moge de HEERE toch uw knecht in deze zaak vergeven.","Jer 17:26":"En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.","1 Kon 1:44":"En de koning heeft met hem gezonden Zadok, de priester, en Nathan, de profeet, en Benaja, de zoon van Jojada, en de Krethi en de Plethi; en zij hebben hem laten rijden op de muilezelin van de koning.","Joz 21:5":"En aan de overgebleven kinderen van Kahath vielen, bij het lot, van de families van de stam van Efraïm, en van de stam van Dan, en van de halve stam van Manasse, tien steden.","1 Kron 16:4-6":"En hij stelde voor de ark van de HEERE sommigen uit de Levieten aan tot dienaars, en dat om de HEERE, de God van Israël, te vermelden, en te loven, en te prijzen. Asaf was het hoofd, en Zecharja de tweede na hem; Jeïel, en Semiramoth, en Jehiël, en Mattithja, en Eliab, en Benaja, en Obed-Edom, en Jeïel, met instrumenten van luiten en met harpen; en Asaf liet zich horen met cimbalen; Maar Benaja en Jahaziël, de priesters, voortdurend met trompetten voor de ark van het verbond van God.","Num 32:3":"Ataroth, en Dibon, en Jaezer, en Nimra, en Hesbon, en Eleale, en Schebam, en Nebo, en Behon;","1 Kron 24:23":"En van de kinderen van Hebron was Jeria de eerste, Amarja de tweede, Jahaziel de derde, Jekameam de vierde.","Spr 25:20":"Wie liederen zingt bij een treurig hart, is als iemand die een kleed aflegt op de dag van de koude, en als azijn op salpeter.","Joz 13:18":"En Jahza, en Kedemoth, en Mefaath,","Ps 88:2":"O HEERE, God van mijn heil! Bij dag, bij nacht roep ik voor U.","Klaagl 2:7":"Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.","Ps 87:7":"En de zangers, evenals de speellieden, alsook al mijn bronnen, zullen binnen u zijn.","1 Kron 22:11":"Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.","Num 31:6":"En Mozes zond hen ten strijde, duizend van elke stam, hen en Pinehas, de zoon van Eleazar, de priester, ten strijde, met de heilige voorwerpen en de trompetten om te schallen in zijn hand.","Jes 10:30":"Roep luid met uw stem, dochter van Gallim! Laat het horen tot Lais toe, o ellendige Anathoth!","2 Sam 18:22":"Doch Ahimaäz, de zoon van Zadok, hield vol en zei tegen Joab: Wat er ook gebeurt, laat mij toch ook achter Cuschi aan lopen. En Joab zei: Waarom zou u nu gaan lopen, mijn zoon, als u toch geen bericht hebt waarmee u iets bereikt?","Joz 21:31":"En Helkath en haar voorsteden, en Rehob en haar voorsteden: vier steden.","1 Sam 1:1":"Er was een man van Ramathaïm-Zofim, van het gebergte van Efraïm, wiens naam was Elkana, een zoon van Jerocham, de zoon van Elihu, de zoon van Tochu, de zoon van Zuf, een Efrathiet.","1 Kron 25:7-31":"En hun aantal, met hun broeders die onderwezen waren in het gezang van de HEERE, allen meesters, was tweehonderdachtentachtig. En zij wierpen de loten over de dienst, tegen elkaar, zowel de kleinen als de groten, de meester met de leerling. Het eerste lot nu ging uit voor Asaf, namelijk voor Jozef. Het tweede voor Gedalja; hij en zijn broeders, en zijn zonen, waren twaalf.","1 Kon 8:10":"En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.","Deut 4:41-43":"Toen zonderde Mozes drie steden af, aan deze kant van de Jordaan, tegen de opgang van de zon; Opdat daarheen kon vluchten de doodslager, die zijn naaste onopzettelijk doodslaat, die hij tot dan toe niet haatte; dat hij naar een van deze steden kon vluchten en in leven bleef; Bezer in de woestijn, in het effen land, voor de Rubenieten; en Ramoth in Gilead, voor de Gadieten; en Golan in Bazan, voor de Manassieten.","Joz 15:55":"Maon, Karmel, en Zif, en Juta,","Mark 14:26":"En nadat zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.","Gen 32:28":"Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.","Ps 45:2":"Mijn hart geeft een goede rede op; ik spreek mijn gedichten uit van een Koning; mijn tong
