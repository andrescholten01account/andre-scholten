 de HEERE, in een van de kamers, en geef hun wijn te drinken.","Ps 132:14":"Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd.","Gen 46:11":"En de zonen van Levi: Gerson, Kehath en Merari.","Num 26:57":"Dit zijn nu de getelden van Levi, naar hun geslachten: van Gerson het geslacht der Gersonieten; van Kohath het geslacht der Kohathieten; van Merari het geslacht der Merarieten.","1 Kron 4:32":"En hun dorpen waren Etam en Ain, Rimmon en Tochen, en Asan; vijf steden.","Pred 2:8":"Ik verzamelde mij ook zilver en goud, en kostbaarheden van koningen en landstreken; ik nam mij zangers en zangeressen aan, en wat mensenkinderen tot lust strekt: allerlei snarenspel.","Neh 12:28":"Zo werden de kinderen van de zangers verzameld, zowel uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten;","1 Kron 24:3":"David nu verdeelde hen, en Zadok uit de kinderen van Eleazar, en Abimelech uit de kinderen van Ithamar, naar hun ambt in hun dienst.","2 Kon 12:4":"En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,","Ezra 7:2":"de zoon van Sallum, de zoon van Zadok, de zoon van Ahitub,","Num 21:25":"Zo nam Israël al deze steden in; en Israël woonde in al de steden van de Amorieten, te Hesbon, en in al haar onderhorige plaatsen.","2 Kon 14:27":"En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.","Ex 6:22":"En Aäron nam zich Eliseba, dochter van Amminadab, zuster van Nahesson, tot een vrouw; en zij baarde hem Nadab en Abihu, Eleazar en Ithamar.","2 Kron 26:17-20":"Doch Azaria, de priester, ging hem na, en met hem priesters van de HEERE, tachtig kloeke mannen. En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God. Toen werd Uzzia toornig, en het reukwerk was in zijn hand om te roken; en terwijl hij toornig werd tegen de priesters, kwam de melaatsheid op aan zijn voorhoofd, voor het aangezicht van de priesters in het huis van de HEERE, bij het reukaltaar.","Lev 1:7-9":"En de zonen van Aäron, de priester, zullen vuur maken op het altaar, en zullen het hout op het vuur schikken. Ook zullen de zonen van Aäron, de priesters, de stukken, het hoofd en het smeer, schikken op het hout, dat op het vuur is, dat op het altaar is. Maar zijn ingewand en zijn schenkels zal men met water wassen; en de priester zal dat alles aansteken op het altaar; het is een brandoffer, een vuuroffer, tot een liefelijke reuk voor de HEERE.","Deut 1:4":"nadat hij Sihon, de koning van de Amorieten, die in Hesbon woonde, verslagen had, en Og, de koning van Bazan, die in Astharoth woonde, bij Edreï.","2 Kon 12:16":"Het geld van het schuldoffer en het geld van de zondoffers werd niet naar het huis van de HEERE gebracht; het was voor de priesters.","Hebr 2:12":"En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.","Ex 29:37":"Zeven dagen zult u verzoening doen voor het altaar, en zult het heiligen; dan zal dat altaar allerheiligst zijn; al wat het altaar aanraakt, zal heilig zijn.","Num 7:7":"Twee wagens en vier runderen gaf hij aan de zonen van Gerson, naar hun dienst;","2 Sam 6:12-17":"Toen berichtte men aan koning David: De HEERE heeft het huis van Obed-edom, en alles wat hij heeft, gezegend om de ark van God. Zo ging David heen en haalde de ark van God uit het huis van Obed-edom naar de stad van David, met vreugde. En het gebeurde, toen zij die de ark van de HEERE droegen, zes treden voortgegaan waren, dat hij ossen en gemest vee offerde. En David huppelde met alle macht voor het aangezicht van de HEERE; en David was omgord met een linnen lijfrok.","1 Kon 3:1":"En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.","Ezra 7:1-5":"Na deze geschiedenissen, in het koninkrijk van Arthahsasta, koning van Perzië: Ezra, de zoon van Seraja, de zoon van Azarja, de zoon van Hilkia, de zoon van Sallum, de zoon van Zadok, de zoon van Ahitub, de zoon van Amarja, de zoon van Azarja, de zoon van Merajoth,","Ps 84:2":"Hoe lieflijk zijn Uw woningen, o HEERE van de heerscharen!","2 Kron 3:4":"En het voorhuis, dat vooraan was, had een lengte, overeenkomstig de breedte van het huis, van twintig ellen, en de hoogte was honderdtwintig; dat overtrok hij van binnen met zuiver goud.","Joz 14:13":"Toen zegende Jozua hem, en hij gaf Kaleb, de zoon van Jefunne, Hebron als erfdeel.","Openb 18:22":"En de stem van citerspelers, en zangers, en fluiters, en bazuinblazers, zal in u niet meer gehoord worden; en geen enkele kunstenaar van welke kunst dan ook zal meer in u gevonden worden; en het geluid van de molen zal in u niet meer gehoord worden.","1 Kron 4:17":"En de kinderen van Ezra waren Jether, en Mered, en Efer, en Jalon; en zij baarde Mirjam, en Sammai, en Isbah, de vader van Esthemoa.","2 Kon 11:18":"Daarna ging al het volk van het land naar het huis van Baäl en brak dat af; zijn altaren en zijn beelden verbraken zij helemaal; en Mattan, de priester van Baäl, sloegen zij dood voor de altaren. De priester stelde toen ambtsdragers aan over het huis van de HEERE.","Deut 2:24":"Maak u op, ga op reis, en trek over de beek Arnon; zie, Ik heb Sihon, de koning van Hesbon, de Amoriet, en zijn land in uw hand gegeven; begin het te bezitten, en meng u met hen in de strijd.","Joz 21:22":"En Kibzaim en haar voorsteden, en Beth-horon en haar voorsteden: vier steden.","Joz 20:7":"Toen wijdden zij Kedes in Galilea, op het gebergte van Naftali, en Sichem op het gebergte van Efraïm, en Kirjath-arba, dat is Hebron, op het gebergte van Juda.","1 Sam 2:35":"En Ik zal Mij een trouwe priester verwekken; die zal doen zoals het in Mijn hart en in Mijn ziel zal zijn; hem zal Ik een bestendig huis bouwen, en hij zal alle dagen voor het aangezicht van Mijn Gezalfde wandelen.","Joz 16:3":"En het gaat af tegen het westen naar het gebied van Jafleti, tot aan het gebied van het benedenste Beth-horon, en tot Gezer; en de uiteinden ervan zijn aan de zee.","1 Kron 23:19":"Aangaande de kinderen van Hebron: Jeria was het hoofd, Amarja de tweede, Jahaziël de derde, en Jekameam de vierde.","2 Sam 12:20":"Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.","Ex 6:19":"En Amram nam Jochebed, zijn tante, tot een vrouw voor zichzelf, en zij baarde hem Aäron en Mozes; en de jaren van het leven van Amram waren honderdzevenendertig jaren.","1 Kron 24:26":"De kinderen van Merari waren Maheli en Musi. De kinderen van Jaazia waren Beno.","Ex 2:22":"Die baarde een zoon; en hij noemde zijn naam Gersom; want hij zei: Ik ben een vreemdeling geworden in een vreemd land.","1 Kon 9:16":"Want Farao, de koning van Egypte, was opgekomen, en had Gezer ingenomen, en het met vuur verbrand, en de Kanaänieten, die in de stad woonden, gedood, en had het aan zijn dochter, de vrouw van Salomo, tot een geschenk gegeven.","Ps 92:2-4":"Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste! Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten; Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.","Dan 3:6":"En wie niet neervalt en aanbidt, die zal op datzelfde moment in het midden van de brandende vuuroven geworpen worden.","Ps 122:1":"Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar het huis van de HEERE gaan.","Ps 68:26":"De zangers gingen voorop, de speellieden erachteraan, in het midden de trommelende meisjes.","Deut 12:19":"Wacht u ervoor dat u de Leviet niet verlaat, al uw dagen in uw land.","Num 35:2-5":"Gebied de Israëlieten dat zij van de erfenis van hun bezitting steden aan de Levieten geven om te bewonen; daarbij zult u aan de Levieten ook voorsteden geven, rondom de steden. En die steden zullen zij hebben om te bewonen; maar hun voorsteden zullen zijn voor hun vee, en voor hun bezit, en voor al hun dieren, En de voorsteden van de steden, die u aan de Levieten zult geven, zullen van de stadsmuur af, naar buiten toe, duizend el zijn, rondom.","2 Kron 26:21":"Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land.","2 Kron 33:15":"En hij nam de vreemde goden en die gelijkenis weg uit het huis van de HEERE, alsook alle altaren die hij gebouwd had op de berg van het huis van de HEERE, en te Jeruzalem; en hij wierp ze buiten de stad.","Jer 29:26":"De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.","1 Kor 14:15":"Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen.","Jes 2:2":"En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien.","Joz 16:10":"En zij verdreven de Kanaänieten niet, die in Gezer woonden; zo woonden die Kanaänieten in het midden van de Efraïmieten tot op deze dag; maar zij moesten wel dwangarbeid verrichten.","1 Kon 7:40":"Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:","Ex 6:17":"En de zonen van Kehath: Amram, en Jizhar, en Hebron, en Uzziël; en de jaren van het leven van Kehath waren honderddrieëndertig jaren.","Num 3:18":"En dit zijn de namen van de zonen van Gerson, naar hun geslachten: Libni en Simeï.","2 Kron 23:18":"Jojada nu stelde de diensten van het huis van de HEERE aan, onder leiding van de Levitische priesters, die David in het huis van de HEERE ingedeeld had, om de brandoffers van de HEERE te offeren, zoals in de wet van Mozes geschreven staat, met blijdschap en met gezang, naar de instelling van David.","Jer 37:12":"Dat Jeremia uit Jeruzalem wegging om naar het land van Benjamin te gaan, om zich daar te midden van het volk af te zonderen.","Num 3:17":"Dit nu waren de zonen van Levi met hun namen: Gerson, en Kahath, en Merari.","2 Kron 34:22":"Toen ging Hilkia, en zij die de koning had aangewezen, naar de profetes Hulda, de vrouw van Sallum, de zoon van Tokhath, de zoon van Hasra, de bewaarder van de kleding. Zij woonde te Jeruzalem, in het tweede stadsdeel; en zij spraken daarover met haar.","2 Kon 11:15":"Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.","Matt 11:17":"En zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben u klaagliederen gezongen, en u hebt niet geweend.","Hand 13:19":"En nadat Hij zeven volken had uitgeroeid in het land Kanaän, heeft Hij hun door het lot het land daarvan uitgedeeld.","Num 3:33-37":"Van Merari is het geslacht van de Mahelieten, en het geslacht van de Musieten; dit zijn de geslachten van Merari. En hun getelden in getal van al wat mannelijk was, van een maand oud en daarboven, waren zesduizend tweehonderd. De aanvoerder nu van het vaderlijke huis van de geslachten van Merari zal zijn Zuriël, de zoon van Abihaïl; zij zullen zich legeren aan de zijde van de tabernakel, noordwaarts.","Joz 10:12":"Toen sprak Jozua tot de HEERE, op de dag toen de HEERE de Amorieten voor het aangezicht van de kinderen van Israël overgaf, en hij zei voor de ogen van de Israëlieten: Zon, sta stil te Gibeon, en u, maan, in het dal van Ajalon!","2 Kron 29:25-28":"En hij stelde de Levieten aan in het huis van de HEERE, met cimbalen, met luiten en harpen, naar het gebod van David, en van Gad, de ziener van de koning, en van Nathan, de profeet; want dit gebod kwam van de hand van de HEERE, door de hand van Zijn profeten. De Levieten nu stonden met de instrumenten van David, en de priesters met de trompetten. En Hizkia gaf bevel dat men het brandoffer op het altaar zou offeren; en op het moment dat het brandoffer begon, begon ook het gezang van de HEERE, met de trompetten en met de instrumenten van David, de koning van Israël.","1 Kron 16:7":"Op diezelfde dag gaf David voor het eerst deze psalm, om de HEERE te loven, door de dienst van Asaf en zijn broeders.","1 Kon 10:5":"en het voedsel van zijn tafel, en het zitten van zijn knechten, en het staan van zijn dienaren, en hun kleding, en zijn schenkers, en zijn opgang waarlangs hij naar boven ging in het huis van de HEERE, toen was er in haar geen geest meer.","Num 22:5":"Hij stuurde boden naar Bileam, de zoon van Beor, naar Pethor, dat aan de rivier ligt, in het land van de kinderen van zijn volk, om hem te roepen, en zei: Zie, er is een volk uit Egypte getrokken; zie, het bedekt het gezicht van het land, en het blijft recht tegenover mij liggen.","Ezech 26:13":"Zo zal Ik het gedreun van uw liederen doen ophouden, en het geschal van uw harpen zal niet meer gehoord worden.","Richt 1:27":"En Manasse verdreef Beth-sean niet, noch de bijbehorende plaatsen, noch Thaanach met de bijbehorende plaatsen, noch de inwoners van Dor met de bijbehorende plaatsen, noch de inwoners van Jibleam met de bijbehorende plaatsen, noch de inwoners van Megiddo met de bijbehorende plaatsen; en de Kanaänieten wilden in dat land blijven wonen.","1 Kron 8:36":"En Achaz verwekte Jehoadda, en Jehoadda verwekte Alemeth, en Azmaveth, en Zimri; Zimri nu verwekte Moza;","Ezra 8:18":"En zij brachten ons, naar de goede hand van onze God over ons, een man van verstand, van de kinderen van Mahli, de zoon van Levi, de zoon van Israël; namelijk Serebja, met zijn zonen en broeders, achttien;","1 Kon 8:6-13":"Zo brachten de priesters de ark van het verbond van de HEERE naar haar plaats, naar het binnenste heiligdom¹ van het huis, naar het heilige der heiligen, tot onder de vleugels van de cherubs². Want de cherubs spreidden hun beide vleugels uit over de plaats van de ark; en de cherubs overdekten de ark en haar draagstokken van boven. Daarna schoven zij de draagstokken verder naar buiten, zodat de uiteinden van de draagstokken gezien werden vanuit het heiligdom, vóór het binnenste heiligdom, maar buiten werden zij niet gezien; en zij zijn daar tot op deze dag.","Ef 5:19":"en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,","1 Kron 23:16":"Van de kinderen van Gersom was Sebuël het hoofd.","Num 25:13":"En hij zal hebben, en zijn nageslacht na hem, het verbond van het eeuwige priesterschap, omdat hij voor zijn God geijverd heeft, en verzoening gedaan heeft voor de kinderen van Israël.","Ex 6:24":"En Eleazar, de zoon van Aäron, nam voor zich een van de dochters van Putiel tot een vrouw; en zij baarde hem Pinehas. Dit zijn de hoofden van de vaderen van de Levieten, naar hun huisgezinnen.","Joz 21:1-4":"Toen naderden de hoofden van de families van de Levieten tot Eleazar, de priester, en tot Jozua, de zoon van Nun, en tot de hoofden van de families van de stammen van de kinderen van Israël; En zij spraken tot hen, te Silo, in het land Kanaän, en zeiden: De HEERE heeft geboden door de hand van Mozes, dat men ons steden zou geven om te bewonen, en de voorsteden ervan voor ons vee. Daarom gaven de kinderen van Israël aan de Levieten van hun erfdeel, naar het bevel van de HEERE, deze steden en de voorsteden daarvan.","Hagg 1:14":"En de HEERE wekte de geest op van Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en de geest van Josua, de zoon van Jozadak, de hogepriester, en de geest van heel het overblijfsel van het volk; en zij kwamen en gingen aan het werk in het huis van de HEERE van de heerscharen, hun God,","Joz 24:33":"Ook stierf Eleazar, de zoon van Aäron; en zij begroeven hem op de heuvel van Pinehas, zijn zoon, die hem gegeven was op het gebergte van Efraïm.","Neh 11:17":"En Matthanja, de zoon van Micha, de zoon van Zabdi, de zoon van Asaf, was het hoofd, die de dankzegging begon in het gebed, en Bakbukja was de tweede van zijn broeders; en Abda, de zoon van Sammua, de zoon van Galal, de zoon van Jeduthun.","2 Kon 11:3":"En hij was met haar verborgen in het huis van de HEERE, zes jaar; en Athalia regeerde over het land.","Joz 21:16":"En Ain en haar voorsteden, en Jutta en haar voorsteden, en Beth-semes en haar voorsteden; negen steden van deze twee stammen.","Ps 68:27":"Looft God in de gemeenten, de Heere, u die uit de bron van Israël bent!","Ps 134:1":"Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!","Jer 29:3":"Door de hand van Elasa, de zoon van Safan, en Gemarja, de zoon van Hilkia, die Zedekia, de koning van Juda, naar Babel zond, naar Nebukadnezar, de koning van Babel, en hij zei:","Joz 21:29":"Jarmuth en haar voorsteden, En-gannim en haar voorsteden: vier steden.","Ps 79:1":"Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt.","2 Kron 35:8":"Ook gaven zijn vorsten tot een vrijwillig offer voor het volk, voor de priesters, en voor de Levieten; Hilkia, en Zacharia, en Jehiel, de leiders van het huis van God, gaven de priesters tot paasoffers, tweeduizend en zeshonderd klein vee, en driehonderd runderen.","Ezra 5:2":"Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.","2 Sam 17:17":"Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen.","1 Kron 23:28":"Omdat hun standplaats was aan de hand van de zonen van Aäron in de dienst van het huis van de HEERE, over de voorhoven, en over de kamers, en over de reiniging van alle heilige dingen, en het werk van de dienst van het huis van God;","Deut 14:27-29":"Maar de Leviet die in uw poorten is, zult u niet verlaten; want hij heeft geen deel noch erfdeel met u. Aan het einde van drie jaren zult u alle tienden van uw opbrengst voortbrengen, in datzelfde jaar, en u zult ze wegleggen in uw poorten; Zo zal de Leviet komen – omdat hij geen deel noch erfdeel met u heeft – en de vreemdeling, en de wees en de weduwe die in uw poorten zijn, en zij zullen eten en verzadigd worden; opdat de HEERE, uw God, u zegent in al het werk van uw hand, dat u doen zult.","Joz 10:10":"En de HEERE bracht hen in verwarring voor het aangezicht van Israël; en hij sloeg hen met een grote slag te Gibeon, en vervolgde hen op de weg waar men naar Beth-horon opgaat, en sloeg hen tot Azeka en tot Makkeda toe.","Num 32:1":"De nakomelingen van Ruben en de nakomelingen van Gad hadden veel vee, heel veel; en zij bekeken het land Jaezer en het land Gilead, en zie, deze plaats was een plaats geschikt voor vee.","1 Sam 1:8":"Toen zei Elkana, haar man: Hanna, waarom weent u, en waarom eet u niet, en waarom is uw hart bedroefd? Ben ik u niet beter dan tien zonen?","1 Kron 24:30":"En de kinderen van Musi waren Maheli, Eder en Jeremoth. Dezen zijn de kinderen van de Levieten, naar hun families.","Num 27:22":"En Mozes deed zoals de HEERE hem geboden had; want hij nam Jozua, en stelde hem voor Eleazar, de priester, en voor de hele vergadering.","Openb 14:3":"en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.","Ezech 47:22":"Maar het zal gebeuren dat u het door loting zult laten toevallen als erfenis, voor u en voor de vreemdelingen die in uw midden wonen, die in uw midden kinderen zullen krijgen; en zij zullen voor u zijn als een geboren inwoner onder de kinderen van Israël; zij zullen met u in erfenis vallen, in het midden van de stammen van Israël.","Joz 12:22":"De koning van Kedes, één, de koning van Jokneam, bij de Karmel, één;","Ezech 45:1":"Wanneer u dan het land door het lot laat toevallen als erfenis, zult u een hefoffer aan de HEERE brengen, als een heilige plaats, van het land; de lengte zal zijn de lengte van vijfentwintigduizend meetrieten, en de breedte tienduizend; dat zal in zijn hele omtrek rondom heilig zijn.","Jer 31:4":"Ik zal u weer bouwen, en u zult gebouwd worden, o jonkvrouw Israël! U zult weer versierd zijn met uw tamboerijnen, en uitgaan met de rei van de spelende mensen.","2 Kon 22:8":"Toen zei de hogepriester Hilkia tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE; en Hilkia gaf dat boek aan Safan, die het las.","2 Sam 17:20":"Toen nu de knechten van Absalom bij de vrouw in het huis kwamen, zeiden zij: Waar zijn Ahimaäz en Jonathan? En de vrouw zei tegen hen: Zij zijn over dat waterstroompje gegaan. En toen zij hen gezocht en niet gevonden hadden, keerden zij terug naar Jeruzalem.","Joz 13:25":"dat hun gebied was Jaezer, en alle steden van Gilead, en het halve land van de kinderen van Ammon, tot Aroer toe, die voor aan Rabba ligt;","2 Kon 25:18":"Ook nam de aanvoerder van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders.","2 Kon 22:4":"Ga naar Hilkia, de hogepriester, opdat hij het geld opsomt dat in het huis van de HEERE gebracht is, dat de wachters van de drempel bij het volk verzameld hebben;","Joz 21:21":"En zij gaven hun Sichem, een vrijstad voor de doodslager, en haar voorsteden, op het gebergte van Efraïm, en Gezer en haar voorsteden;","Joz 21:13-19":"Zo gaven zij aan de kinderen van de priester Aäron de vrijstad voor de doodslager, Hebron en haar voorsteden, en Libna en haar voorsteden; En Jatthir en haar voorsteden, en Esthemoa en haar voorsteden; En Holon en haar voorsteden, en Debir en haar voorsteden;","1 Kron 22:3":"En David bereidde ijzer in overvloed, voor de nagelen aan de deuren van de poorten en voor de verbindingen; ook koper in overvloed, zonder gewicht;","1 Kron 25:8":"En zij wierpen de loten over de dienst, tegen elkaar, zowel de kleinen als de groten, de meester met de leerling.","Ex 6:23":"En de zonen van Korah waren: Assir, en Elkana, en Abiasaf; dat zijn de huisgezinnen van de Korachieten.","Lev 1:5":"Daarna zal hij het jonge rund slachten voor het aangezicht van de HEERE; en de zonen van Aäron, de priesters, zullen het bloed offeren, en het bloed sprengen rondom dat altaar, dat voor de deur van de tent van de samenkomst is.","Ps 85:2":"U bent Uw land gunstig geweest, HEERE! De gevangenschap van Jakob hebt U gekeerd.","Ex 15:1":"Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen.","1 Sam 1:19":"En zij stonden 's morgens vroeg op, en zij aanbaden voor het aangezicht van de HEERE, en zij keerden terug, en kwamen bij hun huis te Rama. En Elkana had gemeenschap met zijn vrouw Hanna, en de HEERE dacht aan haar.","Num 8:5-26":"En de HEERE sprak tot Mozes en zei: Neem de Levieten uit het midden van de kinderen van Israël, en reinig hen. En zo zult u hun doen, om hen te reinigen: sprenkel op hen water van de ontzondiging; en zij zullen het scheermes over hun hele lichaam laten gaan, en zij zullen hun kleren wassen, en zich reinigen.","Ps 81:2":"Zingt vrolijk voor God, onze Sterkte; juicht voor de God van Jakob.","Jes 24:9":"Zij zullen geen wijn drinken met gezang; de sterke drank zal bitter zijn voor hen die hem drinken.","Ezech 44:15":"Maar de Levitische priesters, de kinderen van Zadok, die de wacht van Mijn heiligdom in acht genomen hebben, toen de kinderen van Israël van Mij afdwaalden, die zullen tot Mij naderen om Mij te dienen; en zullen voor Mijn aangezicht staan om Mij het vette en het bloed te offeren, spreekt de Heere HEERE;","Joz 21:36":"En van de stam van Ruben, Bezer en haar voorsteden, en Jahza en haar voorsteden;","2 Kron 20:28":"En zij kwamen in Jeruzalem, met luiten, en met harpen, en met trompetten, naar het huis van de HEERE.","2 Kron 29:25-30":"En hij stelde de Levieten aan in het huis van de HEERE, met cimbalen, met luiten en harpen, naar het gebod van David, en van Gad, de ziener van de koning, en van Nathan, de profeet; want dit gebod kwam van de hand van de HEERE, door de hand van Zijn profeten. De Levieten nu stonden met de instrumenten van David, en de priesters met de trompetten. En Hizkia gaf bevel dat men het brandoffer op het altaar zou offeren; en op het moment dat het brandoffer begon, begon ook het gezang van de HEERE, met de trompetten en met de instrumenten van David, de koning van Israël.","2 Kon 22:14":"Toen ging de priester Hilkia, en Ahikam, en Achbor, en Safan, en Asaja naar de profetes Hulda, de vrouw van Sallum, de zoon van Tikva, de zoon van Harhas, de klederbewaarder (zij woonde nu te Jeruzalem, in het tweede deel), en zij spraken met haar.","Joz 21:15":"En Holon en haar voorsteden, en Debir en haar voorsteden;","Jer 38:14":"Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij.","1 Kron 16:4-39":"En hij stelde voor de ark van de HEERE sommigen uit de Levieten aan tot dienaars, en dat om de HEERE, de God van Israël, te vermelden, en te loven, en te prijzen. Asaf was het hoofd, en Zecharja de tweede na hem; Jeïel, en Semiramoth, en Jehiël, en Mattithja, en Eliab, en Benaja, en Obed-Edom, en Jeïel, met instrumenten van luiten en met harpen; en Asaf liet zich horen met cimbalen; Maar Benaja en Jahaziël, de priesters, voortdurend met trompetten voor de ark van het verbond van God.","Ps 33:1-4":"Rechtvaardigen! Zingt vrolijk in de HEERE; lof past de oprechten. Looft de HEERE met de harp; zingt Hem psalmen met de luit, en het tiensnarig instrument. Zingt Hem een nieuw lied; speelt goed met vrolijk geschal.","Ps 104:33":"Ik zal de HEERE zingen in mijn leven; ik zal mijn God psalmzingen, zolang ik nog ben.","1 Sam 1:20":"En het gebeurde, na verloop van dagen, dat Hanna zwanger werd, en een zoon baarde, en zij noemde zijn naam Samuël: Want, zei ze, ik heb hem van de HEERE gebeden.","1 Kon 1:26":"Maar mij, die uw knecht ben, en Zadok, de priester, en Benaja, de zoon van Jojada, en Salomo, uw knecht, heeft hij niet genodigd.","Neh 12:24":"De hoofden dan van de Levieten waren Hasabja, Serebja, en Jesua, de zoon van Kadmiel, en hun broeders tegenover hen, om te prijzen en te danken, naar het gebod van David, de man van God, wacht tegenover wacht.","Joz 22:30-32":"Toen de priester Pinehas, en de leiders van de vergadering, en de hoofden van de duizenden van Israël, die met hem waren, de woorden hoorden, die de kinderen van Ruben, en de kinderen van Gad, en de kinderen van Manasse gesproken hadden, was het goed in hun ogen. En Pinehas, de zoon van de priester Eleazar, zei tegen de kinderen van Ruben, en tegen de kinderen van Gad, en tegen de kinderen van Manasse: Vandaag weten wij, dat de HEERE in het midden van ons is, omdat u deze overtreding tegen de HEERE niet begaan hebt; nu hebt u de kinderen van Israël verlost uit de hand van de HEERE. En Pinehas, de zoon van de priester Eleazar, keerde terug met de leiders van de kinderen van Ruben, en van de kinderen van Gad, uit het land Gilead, naar het land Kanaän, naar de kinderen van Israël; en zij brachten hun antwoord terug;","Hand 14:27":"En toen zij daar aangekomen waren, en de gemeente bijeengeroepen hadden, vertelden zij wat grote dingen God met hen gedaan had, en dat Hij voor de heidenen de deur van het geloof geopend had.","1 Kron 13:2":"En David zei tegen de hele gemeente van Israël: Als het u goeddunkt, en het van de HEERE, onze God, is, laten wij ons uitbreiden en laten wij zenden aan onze overige broeders, in alle landen van Israël, en de priesters en Levieten, die met hen zijn in de steden, met hun voorsteden, opdat zij bij ons verzameld worden.","Lev 8:1":"Verder sprak de HEERE tot Mozes en zei:","Ex 2:4":"En zijn zuster ging op een afstand staan, om te weten wat er met hem gedaan zou worden.","Joz 21:35":"Dimna en haar voorsteden, Nahalal en haar voorsteden: vier steden.","Jer 1:1":"De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;","Joz 21:34":"Aan de families nu van de kinderen van Merari, de overige Levieten, werd gegeven van de stam van Zebulon, Jokneam en haar voorsteden, Kartha en haar voorsteden;","Num 32:37":"En de kinderen van Ruben bouwden Hezbon, en Eleale, en Kirjathaïm,","1 Kron 6:3-9":"En de kinderen van Amram waren Aäron, en Mozes en Mirjam; en de kinderen van Aäron waren Nadab en Abihu, Eleazar en Ithamar. En Eleazar verwekte Pinehas, Pinehas verwekte Abisua; En Abisua verwekte Bukki, en Bukki verwekte Uzzi;","1 Kon 7:51":"Zo werd al het werk voltooid ,"Ezra 8:33":"Op de vierde dag nu werd het zilver, en het goud, en de vaten, gewogen in het huis van onze God, aan de hand van Meremoth, de zoon van Uria, de priester, en met hem Eleazar, de zoon van Pinehas; en met hen Jozabad, de zoon van Jesua, en Noadja, de zoon van Binnui, de Levieten.","Richt 20:28":"En Pinehas, de zoon van Eleazar, de zoon van Aäron, stond voor Zijn aangezicht in die dagen, en zei: Zal ik nog meer uittrekken ten strijde tegen de kinderen van Benjamin, mijn broeder, of zal ik ophouden? En de HEERE zei: Trek op, want morgen zal Ik hem in uw hand geven.","2 Kron 34:15":"En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.","2 Sam 17:27":"En het gebeurde, toen David te Mahanaïm gekomen was, dat Sobi, de zoon van Nahas, uit Rabba van de kinderen van Ammon, en Machir, de zoon van Ammiël, uit Lodebar, en Barzillai, de Gileadiet, uit Rogelim,","1 Sam 1:21":"En die man, Elkana, trok op met zijn hele huis, om aan de HEERE het jaarlijkse offer te offeren, en zijn gelofte.","Joz 21:34-40":"Aan de families nu van de kinderen van Merari, de overige Levieten, werd gegeven van de stam van Zebulon, Jokneam en haar voorsteden, Kartha en haar voorsteden; Dimna en haar voorsteden, Nahalal en haar voorsteden: vier steden. En van de stam van Ruben, Bezer en haar voorsteden, en Jahza en haar voorsteden;","2 Kon 20:8":"Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?","Gen 32:2":"En Jakob zei, toen hij hen zag: Dit is een leger van God! En hij noemde de naam van die plaats Mahanaim.","Ps 137:1-6":"Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden lass=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> with her <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs,</span> and <span class=\"wl wl-kjv\" data-code=\"H3096\">Jahzah</span> with her <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs,</span>","79":"<span class=\"wl wl-kjv\" data-code=\"H6932\">Kedemoth</span> also with her <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs,</span> and <span class=\"wl wl-kjv\" data-code=\"H4158\">Mephaath</span> with her <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs:</span>","80":"And out of the <span class=\"wl wl-kjv\" data-code=\"H4294\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad;</span> <span class=\"wl wl-kjv\" data-code=\"H7216\">Ramoth</span> in <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> with her <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs,</span> and <span class=\"wl wl-kjv\" data-code=\"H4266\">Mahanaim</span> with her <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs,</span>","81":"And <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon</span> with her <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs,</span> and <span class=\"wl wl-kjv\" data-code=\"H3270\">Jazer</span> with her <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
