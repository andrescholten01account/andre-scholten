te Azarja, en Azarja verwekte Johanan;","10":"En Johanan verwekte Azarja. Hij is het die het priesterambt bediende in het huis dat Salomo in Jeruzalem gebouwd had.","11":"En Azarja verwekte Amarja, en Amarja verwekte Ahitub;","12":"En Ahitub verwekte Zadok, en Zadok verwekte Sallum;","13":"En Sallum verwekte Hilkia, en Hilkia verwekte Azarja;","14":"En Azarja verwekte Seraja, en Seraja verwekte Jozadak;","15":"En Jozadak ging mee toen de HEERE Juda en Jeruzalem gevangen liet wegvoeren door de hand van Nebukadnezar.","16":"*Zo* *zijn* *dan* de kinderen van Levi: Gerson, Kahath en Merari.","17":"En dit zijn de namen van de zonen van Gerson: Libni en Simeï.","18":"En de kinderen van Kahath waren Amram, en Jizhar, en Hebron, en Uzziël.","19":"De kinderen van Merari waren Maheli en Musi. En dit zijn de families van de Levieten, naar hun vaderen.","20":"Van Gerson: zijn zoon was Libni; zijn zoon Jahath; zijn zoon Zimma;","21":"Zijn zoon Joah; zijn zoon Iddo; zijn zoon Zerah; zijn zoon Jeathrai.","22":"De kinderen van Kahath waren: zijn zoon Amminadab; zijn zoon Korah; zijn zoon Assir;","23":"Zijn zoon Elkana; en zijn zoon Ebjasaf; en zijn zoon Assir;","24":"Zijn zoon Tahath; zijn zoon Uriël; zijn zoon Uzzia, en zijn zoon Saul.","25":"De kinderen van Elkana nu waren Amasia en Ahimoth.","26":"Elkana; diens zoon was Elkana; zijn zoon was Zofai; en zijn zoon was Nahath;","27":"Zijn zoon Eliab; zijn zoon Jeroham; zijn zoon Elkana.","28":"De zonen van Samuël nu waren *deze*: zijn eerstgeborene was Vasni, daarna Abia.","29":"De kinderen van Merari waren Maheli; zijn zoon Libni; zijn zoon Simeï; zijn zoon Uzza;","30":"Zijn zoon Simea; zijn zoon Haggija; zijn zoon Asaja.","31":"Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.","32":"En zij dienden voor de tabernakel van de tent der samenkomst met gezangen, totdat Salomo het huis van de HEERE in Jeruzalem bouwde; en zij stonden naar hun beurt in hun ambt.","33":"Dezen nu zijn het die daar stonden met hun zonen; van de zonen van de Kahathieten, Heman de zanger, de zoon van Joël, de zoon van Samuël,","34":"De zoon van Elkana, de zoon van Jeroham, de zoon van Eliël, de zoon van Toah,","35":"De zoon van Zuf, de zoon van Elkana, de zoon van Mahath, de zoon van Amasai,","36":"De zoon van Elkana, de zoon van Joël, de zoon van Azarja, de zoon van Zefanja,","37":"De zoon van Tahath, de zoon van Assir, de zoon van Ebjasaf, de zoon van Korah,","38":"De zoon van Jizhar, de zoon van Kahath, de zoon van Levi, de zoon van Israël.","39":"En zijn broeder Asaf stond aan zijn rechter *zijde*; Asaf was de zoon van Berechja, de zoon van Simea,","40":"De zoon van Michaël, de zoon van Baeseja, de zoon van Malchija,","41":"De zoon van Ethni, de zoon van Zerah, de zoon van Adaja,","42":"De zoon van Ethan, de zoon van Zimma, de zoon van Simeï,","43":"De zoon van Jahath, de zoon van Gerson, de zoon van Levi.","44":"Hun broeders nu, de kinderen van Merari, *stonden* aan de linker *zijde*, *namelijk* Ethan, de zoon van Kisi, de zoon van Abdi, de zoon van Malluch,","45":"De zoon van Hasabja, de zoon van Amazia, de zoon van Hilkia,","46":"De zoon van Amzi, de zoon van Bani, de zoon van Semer,","47":"De zoon van Maheli, de zoon van Musi, de zoon van Merari, de zoon van Levi.","48":"Hun broeders nu, de Levieten, waren aangesteld voor allerlei dienst van de tabernakel van het huis van God.","49":"Aäron nu en zijn zonen brachten reukwerk op het altaar van het brandoffer, en op het reukaltaar, aangesteld voor al het werk van het heilige der heiligen, en om voor Israël verzoening te doen, naar alles wat Mozes, de knecht van God, geboden had.","50":"Dit nu zijn de kinderen van Aäron: Eleazar, was zijn zoon; Pinehas zijn zoon; Abisua zijn zoon;","51":"Bukki zijn zoon; Uzzi zijn zoon; Serahja zijn zoon;","52":"Merajoth zijn zoon; Amarja zijn zoon; Ahitub zijn zoon;","53":"Zadok zijn zoon; Ahimaäz zijn zoon.","54":"En dit waren hun woonplaatsen, naar hun kampementen, in hun gebieden, *namelijk* van de zonen van Aäron, van de familie van de Kahathieten, want dat lot was voor hen.","55":"En zij gaven hun Hebron, in het land van Juda, en haar voorsteden rondom die.","56":"Maar het veld van de stad, en haar dorpen, gaven zij aan Kaleb, de zoon van Jefunne.","57":"En aan de kinderen van Aäron gaven zij steden van Juda, de vrijstad Hebron, en Libna en haar voorsteden, en Jattir en Esthemoa, en haar voorsteden,","58":"En Hilen en haar voorsteden, en Debir en haar voorsteden,","59":"En Asan en haar voorsteden, en Beth-semes en haar voorsteden.","60":"Van de stam van Benjamin nu: Geba en haar voorsteden, en Allemeth en haar voorsteden, en Anathoth en haar voorsteden. Al hun steden, in hun families, waren dertien steden.","61":"Maar de kinderen van Kahath die overgebleven waren, hadden van de familie van de stam, uit de halve stam van half Manasse, bij het lot, tien steden.","62":"En de kinderen van Gerson, naar hun families, hadden van de stam van Issaschar, en van de stam van Aser, en van de stam van Nafthali, en van de stam van Manasse in Basan, dertien steden.","63":"De kinderen van Merari, naar hun families, hadden van de stam van Ruben, en van de stam van Gad, en van de stam van Zebulon, bij het lot, twaalf steden.","64":"Zo gaven de kinderen van Israël aan de Levieten deze steden en haar voorsteden.","65":"En zij gaven ze bij het lot, van de stam van de kinderen van Juda, en van de stam van de kinderen van Simeon, en van de stam van de kinderen van Benjamin, deze steden, die zij bij name noemden.","66":"*Aan* *de* *overigen* nu, uit de families van de kinderen van Kahath, kwamen steden van hun gebied toe, van de stam van Efraïm.","67":"Want zij gaven hun van de vrijsteden, Sichem en haar voorsteden op het gebergte van Efraïm, en Gezer en haar voorsteden,","68":"En Jokmeam en haar voorsteden, en Beth-horon en haar voorsteden,","69":"En Ajalon en haar voorsteden, en Gath-rimmon en haar voorsteden.","70":"En uit de halve stam van Manasse: Aner en haar voorsteden, en Bileam en haar voorsteden. De families van de overige kinderen van Kahath hadden *deze* *steden*:","71":"De kinderen van Gerson hadden van de families van de halve stam van Manasse: Golan in Basan en haar voorsteden, en Astharoth, en haar voorsteden.","72":"En van de stam van Issaschar: Kedes en haar voorsteden, Dobrath en haar voorsteden,","73":"En Ramoth en haar voorsteden, en Anem en haar voorsteden.","74":"En van de stam van Aser: Masal en haar voorsteden, en Abdon en haar voorsteden,","75":"En Hukok en haar voorsteden, en Rehob en haar voorsteden.","76":"En van de stam van Nafthali: Kedes in Galilea, en haar voorsteden, en Hammon en haar voorsteden, en Kirjathaim en haar voorsteden.","77":"De overige kinderen van Merari hadden van de stam van Zebulon: Rimmono en haar voorsteden, Thabor en haar voorsteden;","78":"En aan de overkant van de Jordaan tegenover Jericho, aan de oostkant van de Jordaan, van de stam van Ruben: Bezer in de woestijn, en haar voorsteden, en Jahza en haar voorsteden,","79":"En Kedemoth en haar voorsteden, en Mefaath en haar voorsteden;","80":"En van de stam van Gad: Ramoth in Gilead, en haar voorsteden, en Mahanaim en haar voorsteden,","81":"En Hesbon en haar voorsteden, en Jaezer en haar voorsteden."},"SV":{"1":"De kinderen van Levi waren Gerson, Kahath en Merari.","2":"De kinderen van Kahath nu waren Amram, Jizhar, en Hebron, en Uzziël.","3":"En de kinderen van Amram waren Aäron, en Mozes en Mirjam; en de kinderen van Aäron waren Nadab en Abihu, Eleazar en Ithamar.","4":"En Eleazar gewon Pinehas, Pinehas gewon Abisua;","5":"En Abisua gewon Bukki, en Bukki gewon Uzzi;","6":"En Uzzi gewon Zerahja, en Zerahja gewon Merajoth;","7":"En Merajoth gewon Amarja, en Amarja gewon Ahitub;","8":"En Ahitub gewon Zadok, en Zadok gewon Ahimaäz;","9":"En Ahimaäz gewon Azarja, en Azarja gewon Johanan;","10":"En Johanan gewon Azarja. Hij is het, die het priesterambt bediende in het huis, dat Salomo te Jeruzalem gebouwd had.","11":"En Azarja gewon Amarja, en Amarja gewon Ahitub;","12":"En Ahitub gewon Zadok, en Zadok gewon Sallum;","13":"En Sallum gewon Hilkia, en Hilkia gewon Azarja;","14":"En Azarja gewon Seraja, en Seraja gewon Jozadak;","15":"En Jozadak ging mede, als de HEERE Juda en Jeruzalem gevankelijk wegvoerde door de hand van Nebukadnezar.","16":"*Zo* *zijn* *dan* de kinderen van Levi: Gerson, Kahath en Merari.","17":"En dit zijn de namen der zonen van Gerson: Libni en Simeï.","18":"En de kinderen van Kahath waren Amram, en Jizhar, en Hebron, en Uzziël.","19":"De kinderen van Merari waren Maheli en Musi. En dit zijn de huisgezinnen der Levieten, naar hun vaderen.","20":"Van Gerson: zijn zoon was Libni; zijn zoon Jahath; zijn zoon Zimma;","21":"Zijn zoon Joah; zijn zoon Iddo; zijn zoon Zerah; zijn zoon Jeathrai.","22":"De kinderen van Kahath waren: zijn zoon Amminadab; zijn zoon Korah; zijn zoon Assir;","23":"Zijn zoon Elkana; en zijn zoon Ebjasaf; en zijn zoon Assir;","24":"Zijn zoon Tahath; zijn zoon Uriël; zijn zoon Uzzia, en zijn zoon Saul.","25":"De kinderen van Elkana nu waren Amasia en Ahimoth.","26":"Elkana; dezes zoon was Elkana; zijn zoon was Zofai; en zijn zoon was Nahath;","27":"Zijn zoon Eliab; zijn zoon Jeroham; zijn zoon Elkana.","28":"De zonen van Samuël nu waren *dezen*: zijn eerstgeborene was Vasni, daarna Abia.","29":"De kinderen van Merari waren Maheli; zijn zoon Libni; zijn zoon Simeï; zijn zoon Uzza;","30":"Zijn zoon Simea; zijn zoon Haggija; zijn zoon Asaja.","31":"Dezen nu zijn het, die David gesteld heeft tot het ambt des gezangs in het huis des HEEREN, nadat de ark *tot* rust *gekomen* was.","32":"En zij dienden voor den tabernakel van de tent der samenkomst met gezangen, totdat Salomo het huis des HEEREN te Jeruzalem bouwde; en zij stonden naar hun wijze in hun ambt.","33":"Dezen nu zijn ze, die daar stonden met hun zonen; van de zonen der Kahathieten, Heman de zanger, de zoon van Joël, den zoon van Samuël,","34":"Den zoon van Elkana, den zoon van Jeroham, den zoon van Eliël, den zoon van Toah,","35":"Den zoon van Zuf, den zoon van Elkana, den zoon van Mahath, den zoon van Amasai,","36":"Den zoon van Elkana, den zoon van Joël, den zoon van Azarja, den zoon van Zefanja,","37":"Den zoon van Tahath, den zoon van Assir, den zoon van Ebjasaf, den zoon van Korah,","38":"Den zoon van Jizhar, den zoon van Kahath, den zoon van Levi, den zoon van Israël.","39":"En zijn broeder Asaf stond aan zijn rechter *zijde*; Asaf was de zoon van Berechja, den zoon van Simea,","40":"Den zoon van Michaël, den zoon van Baeseja, den zoon van Malchija,","41":"Den zoon van Ethni, den zoon van Zerah, den zoon van Adaja,","42":"Den zoon van Ethan, den zoon van Zimma, den zoon van Simeï,","43":"Den zoon van Jahath, den zoon van Gerson, den zoon van Levi.","44":"Hunne broeders nu, de kinderen van Merari, *stonden* aan de linker *zijde*, *namelijk* Ethan, de zoon van Kisi, den zoon van Abdi, den zoon van Malluch,","45":"Den zoon van Hasabja, den zoon van Amazia, den zoon van Hilkia,","46":"Den zoon van Amzi, den zoon van Bani, den zoon van Semer,","47":"Den zoon van Maheli, den zoon van Musi, den zoon van Merari, den zoon van Levi.","48":"Hun broeders nu, de Levieten, waren gegeven tot allerlei dienst des tabernakels van het huis Gods.","49":"Aäron nu en zijn zonen rookten op het altaar des brandoffers, en op het reukaltaar, zijnde *besteld* tot al het werk van het heilige der heiligen, en om over Israël verzoening te doen, naar alles wat Mozes, de knecht Gods, geboden had.","50":"Dit nu zijn de kinderen van Aäron: Eleazar, was zijn zoon; Pinehas zijn zoon; Abisua zijn zoon;","51":"Bukki zijn zoon; Uzzi zijn zoon; Serahja zijn zoon;","52":"Merajoth zijn zoon; Amarja zijn zoon; Ahitub zijn zoon;","53":"Zadok zijn zoon; Ahimaäz zijn zoon.","54":"En dit waren hun woningen, naar hun kastelen, in hun landpalen, *namelijk* van de zonen van Aäron, van het huisgezin der Kahathieten, want dat lot was voor hen.","55":"En zij gaven hun Hebron, in het land van Juda, en haar voorsteden rondom dezelve.","56":"Maar het veld der stad, en haar dorpen, gaven zij Kaleb, den zoon van Jefunne.","57":"En den kinderen van Aäron gaven zij steden van Juda, de vrijstad Hebron, en Libna en haar voorsteden, en Jattir en Esthemoa, en haar voorsteden,","58":"En Hilen en haar voorsteden, en Debir en haar voorsteden,","59":"En Asan en haar voorsteden, en Beth-semes en haar voorsteden.","60":"Van den stam van Benjamin nu: Geba en haar voorsteden, en Allemeth en haar voorsteden, en Anathoth en haar voorsteden. Al hun steden, in hun huisgezinnen, waren dertien steden.","61":"Maar de kinderen van Kahath, die overgebleven waren, hadden van het huisgezin van den stam, uit den halven stam van half Manasse, bij het lot, tien steden.","62":"En de kinderen van Gerson, naar hun huisgezinnen, hadden van den stam van Issaschar, en van den stam van Aser, en van den stam van Nafthali, en van den stam van Manasse in Basan, dertien steden.","63":"De kinderen van Merari, naar hun huisgezinnen, hadden van den stam van Ruben, en van den stam van Gad, en van den stam van Zebulon, bij het lot, twaalf steden.","64":"Alzo gaven de kinderen Israëls aan de Levieten deze steden en haar voorsteden.","65":"En zij gaven ze bij het lot, van den stam der kinderen van Juda, en van den stam der kinderen van Simeon, en van den stam der kinderen van Benjamin, deze steden, dewelke zij bij namen noemden.","66":"*Aan* *de* *overigen* nu, uit de huisgezinnen der kinderen van Kahath, dien gewerden steden hunner landpale, van den stam van Efraïm.","67":"Want zij gaven hun van de vrijsteden, Sichem en haar voorsteden op het gebergte van Efraïm, en Gezer en haar voorsteden,","68":"En Jokmeam en haar voorsteden, en Beth-horon en haar voorsteden,","69":"En Ajalon en haar voorsteden, en Gath-rimmon en haar voorsteden.","70":"En uit den halven stam van Manasse: Aner en haar voorsteden, en Bileam en haar voorsteden. De huisgezinnen der overige kinderen van Kahath hadden *deze* *steden*:","71":"De kinderen van Gerson hadden van de huisgezinnen van den halven stam van Manasse: Golan in Basan en haar voorsteden, en Astharoth, en haar voorsteden.","72":"En van den stam van Issaschar: Kedes en haar voorsteden, Dobrath en haar voorsteden,","73":"En Ramoth en haar voorsteden, en Anem en haar voorsteden.","74":"En van den stam van Aser: Masal en haar voorsteden, en Abdon en haar voorsteden,","75":"En Hukok en haar voorsteden, en Rehob en haar voorsteden.","76":"En van den stam van Nafthali: Kedes in Galilea, en haar voorsteden, en Hammon en haar voorsteden, en Kirjathaim en haar voorsteden.","77":"De overige kinderen van Merari hadden van den stam van Zebulon: Rimmono en haar voorsteden, Thabor en haar voorsteden;","78":"En aan gene zijde van de Jordaan tegen Jericho, tegen het oosten aan de Jordaan, van den stam van Ruben: Bezer in de woestijn, en haar voorsteden, en Jahza en haar voorsteden,","79":"En Kedemoth en haar voorsteden, en Mefaath en haar voorsteden;","80":"En van den stam van Gad: Ramoth in Gilead, en haar voorsteden, en Mahanaim en haar voorsteden,","81":"En Hesbon en haar voorsteden, en Jaezer en haar voorsteden."},"KJV":{"1":"The sons of Levi; Gershon, Kohath, and Merari.","2":"And the sons of Kohath; Amram, Izhar, and Hebron, and Uzziel.","3":"And the children of Amram; Aaron, and Moses, and Miriam. The sons also of Aaron; Nadab, and Abihu, Eleazar, and Ithamar.","4":"Eleazar begat Phinehas, Phinehas begat Abishua,","5":"And Abishua begat Bukki, and Bukki begat Uzzi,","6":"And Uzzi begat Zerahiah, and Zerahiah begat Meraioth,","7":"Meraioth begat Amariah, and Amariah begat Ahitub,","8":"And Ahitub begat Zadok, and Zadok begat Ahimaaz,","9":"And Ahimaaz begat Azariah, and Azariah begat Johanan,","10":"And Johanan begat Azariah, (he it is that executed the priest's office in the temple that Solomon built in Jerusalem:)","11":"And Azariah begat Amariah, and Amariah begat Ahitub,","12":"And Ahitub begat Zadok, and Zadok begat Shallum,","13":"And Shallum begat Hilkiah, and Hilkiah begat Azariah,","14":"And Azariah begat Seraiah, and Seraiah begat Jehozadak,","15":"And Jehozadak went into captivity, when the LORD carried away Judah and Jerusalem by the hand of Nebuchadnezzar.","16":"The sons of Levi; Gershom, Kohath, and Merari.","17":"And these be the names of the sons of Gershom; Libni, and Shimei.","18":"And the sons of Kohath were, Amram, and Izhar, and Hebron, and Uzziel.","19":"The sons of Merari; Mahli, and Mushi. And these are the families of the Levites according to their fathers.","20":"Of Gershom; Libni his son, Jahath his son, Zimmah his son,","21":"Joah his son, Iddo his son, Zerah his son, Jeaterai his son.","22":"The sons of Kohath; Amminadab his son, Korah his son, Assir his son,","23":"Elkanah his son, and Ebiasaph his son, and Assir his son,","24":"Tahath his son, Uriel his son, Uzziah his son, and Shaul his son.","25":"And the sons of Elkanah; Amasai, and Ahimoth.","26":"As for Elkanah: the sons of Elkanah; Zophai his son, and Nahath his son,","27":"Eliab his son, Jeroham his son, Elkanah his son.","28":"And the sons of Samuel; the firstborn Vashni, and Abiah.","29":"The sons of Merari; Mahli, Libni his son, Shimei his son, Uzza his son,","30":"Shimea his son, Haggiah his son, Asaiah his son.","31":"And these are they whom David set over the service of song in the house of the LORD, after that the ark had rest.","32":"And they ministered before the dwelling place of the tabernacle of the congregation with singing, until Solomon had built the house of the LORD in Jerusalem: and then they waited on their office according to their order.","33":"And these are they that waited with their children. Of the sons of the Kohathites: Heman a singer, the son of Joel, the son of Shemuel,","34":"The son of Elkanah, the son of Jeroham, the son of Eliel, the son of Toah,","35":"The son of Zuph, the son of Elkanah, the son of Mahath, the son of Amasai,","36":"The son of Elkanah, the son of Joel, the son of Azariah, the son of Zephaniah,","37":"The son of Tahath, the son of Assir, the son of Ebiasaph, the son of Korah,","38":"The son of Izhar, the son of Kohath, the son of Levi, the son of Israel.","39":"And his brother Asaph, who stood on his right hand, even Asaph the son of Berachiah, the son of Shimea,","40":"The son of Michael, the son of Baaseiah, the son of Malchiah,","41":"The son of Ethni, the son of Zerah, the son of Adaiah,","42":"The son of Ethan, the son of Zimmah, the son of Shimei,","43":"The son of Jahath, the son of Gershom, the son of Levi.","44":"And their brethren the sons of Merari stood on the left hand: Ethan the son of Kishi, the son of Abdi, the son of Malluch,","45":"The son of Hashabiah, the son of Amaziah, the son of Hilkiah,","46":"The son of Amzi, the son of Bani, the son of Shamer,","47":"The son of Mahli, the son of Mushi, the son of Merari, the son of Levi.","48":"Their brethren also the Levites were appointed unto all manner of service of the tabernacle of the house of God.","49":"But Aaron and his sons offered upon the altar of the burnt offering, and on the altar of incense, and were appointed for all the work of the place most holy, and to make an atonement for Israel, according to all that Moses the servant of God had commanded.","50":"And these are the sons of Aaron; Eleazar his son, Phinehas his son, Abishua his son,","51":"Bukki his son, Uzzi his son, Zerahiah his son,","52":"Meraioth his son, Amariah his son, Ahitub his son,","53":"Zadok his son, Ahimaaz his son.","54":"Now these are their dwelling places throughout their castles in their coasts, of the sons of Aaron, of the families of the Kohathites: for theirs was the lot.","55":"And they gave them Hebron in the land of Judah, and the suburbs thereof round about it.","56":"But the fields of the city, and the villages thereof, they gave to Caleb the son of Jephunneh.","57":"And to the sons of Aaron they gave the cities of Judah, namely, Hebron, the city of refuge, and Libnah with her suburbs, and Jattir, and Eshtemoa, with their suburbs,","58":"And Hilen with her suburbs, Debir with her suburbs,","59":"And Ashan with her suburbs, and Bethshemesh with her suburbs:","60":"And out of the tribe of Benjamin; Geba with her suburbs, and Alemeth with her suburbs, and Anathoth with her suburbs. All their cities throughout their families were thirteen cities.","61":"And unto the sons of Kohath, which were left of the family of that tribe, were cities given out of the half tribe, namely, out of the half tribe of Manasseh, by lot, ten cities.","62":"And to the sons of Gershom throughout their families out of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the tribe of Manasseh in Bashan, thirteen cities.","63":"Unto the sons of Merari were given by lot, throughout their families, out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities.","64":"And the children of Israel gave to the Levites these cities with their suburbs.","65":"And they gave by lot out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, and out of the tribe of the children of Benjamin, these cities, which are called by their names.","66":"And the residue of the families of the sons of Kohath had cities of their coasts out of the tribe of Ephraim.","67":"And they gave unto them, of the cities of refuge, Shechem in mount Ephraim with her suburbs; they gave also Gezer with her suburbs,","68":"And Jokmeam with her suburbs, and Bethhoron with her suburbs,","69":"And Aijalon with her suburbs, and Gathrimmon with her suburbs:","70":"And out of the half tribe of Manasseh; Aner with her suburbs, and Bileam with her suburbs, for the family of the remnant of the sons of Kohath.","71":"Unto the sons of Gershom were given out of the family of the half tribe of Manasseh, Golan in Bashan with her suburbs, and Ashtaroth with her suburbs:","72":"And out of the tribe of Issachar; Kedesh with her suburbs, Daberath with her suburbs,","73":"And Ramoth with her suburbs, and Anem with her suburbs:","74":"And out of the tribe of Asher; Mashal with her suburbs, and Abdon with her suburbs,","75":"And Hukok with her suburbs, and Rehob with her suburbs:","76":"And out of the tribe of Naphtali; Kedesh in Galilee with her suburbs, and Hammon with her suburbs, and Kirjathaim with her suburbs.","77":"Unto the rest of the children of Merari were given out of the tribe of Zebulun, Rimmon with her suburbs, Tabor with her suburbs:","78":"And on the other side Jordan by Jericho, on the east side of Jordan, were given them out of the tribe of Reuben, Bezer in the wilderness with her suburbs, and Jahzah with her suburbs,","79":"Kedemoth also with her suburbs, and Mephaath with her suburbs:","80":"And out of the tribe of Gad; Ramoth in Gilead with her suburbs, and Mahanaim with her suburbs,","81":"And Heshbon with her suburbs, and Jazer with her suburbs."}},"tsk":{"1":[{"kopje":"kinderen van Levi","refs":["1 Kron 23:6","Gen 46:11","Ex 6:15","Num 3:17","Num 26:57"]},{"kopje":"Gerson","refs":["1 Kron 6:16","1 Kron 6:20"]}],"2":[{"kopje":"de kinderen van Kahath","refs":["1 Kron 23:12","Ex 6:17","Ex 6:20-23"]},{"kopje":"Amram","refs":["1 Kron 6:22"]}],"3":[{"kopje":"Aäron","refs":["1 Kron 23:13","Ex 6:19"]},{"kopje":"Mirjam","refs":["Ex 2:4","Ex 2:7","Ex 15:20","Micha 6:4"]},{"kopje":"Nadab","refs":["1 Kron 24:1","1 Kron 24:2","Ex 6:22","Ex 24:1","Ex 28:1","Lev 10:1","Lev 10:12","Lev 10:16"]},{"kopje":"Eleazar","refs":["1 Kron 24:3-6"]}],"4":[{"kopje":"Pinehas","refs":["1 Kron 6:50","1 Kron 9:20","Ex 6:24","Num 25:6-11","Num 25:13","Num 31:6","Joz 22:13","Joz 22:30-32","Joz 24:33","Richt 20:28","Ezra 8:2","Ps 106:30","Ps 106:31"]},{"kopje":"Abisua","refs":["Ezra 7:1-5"]}],"6":[{"kopje":"Zerahja","refs":["Ezra 7:4"]},{"kopje":"Merajoth","refs":["Neh 12:15"]}],"7":[{"kopje":"Amarja","refs":["Ezra 7:3"]},{"kopje":"Ahitub","refs":[ 42."}],"21":[{"catchword":"Joah","tekst":"Hij wordt Ethan genoemd, vs.42."},{"catchword":"Iddo","tekst":"vs.41 wordt hij Adaja genoemd."},{"catchword":"Jeathraï","tekst":"Hij wordt onder, vs.41, Ethni genoemd."},{"catchword":"zoon","tekst":"Dat is, neef; hij was eigenlijk te spreken de zoon van Simeï; onder, vs.42."}],"22":[{"catchword":"Korah;","tekst":"Dit was die Korach, die met Dathan en Abiram tegen Mozes rebelleerde."}],"24":[{"catchword":"Uriël","tekst":"Onder, vs.36, wordt hij Zefanja genoemd, of Zofonja."},{"catchword":"Uzzia","tekst":"Anders, Azaria, vs.36."},{"catchword":"Saul","tekst":"Anders, Joël; onder, vs.36."}],"25":[{"catchword":"Elkana","tekst":"Te weten, van den zoon van Saul."}],"26":[{"catchword":"Elkana","tekst":"Versta hierop: Die zoon van Amasai was."},{"catchword":"Zofaï","tekst":"Anders, Zuf, vs.35, en 1Sa 1:1 ."},{"catchword":"Nahath","tekst":"Toah, vs.34, en Tochu, 1Sa 1:1 ."}],"27":[{"catchword":"Eliab","tekst":"vs.34, Eliël."},{"catchword":"*","tekst":"Versta hierbij: Zijn zoon was Samuël; waarvan in vs.28."}],"28":[{"catchword":"Vasni","tekst":"Joël genoemd, vs.33, en 1Sa 8:2 ."}],"31":[{"catchword":"tot het ambt","tekst":"Hebreeuws, aan de hand des gezangs van het huis des Heeren."},{"catchword":"nadat de ark","tekst":"Hebreeuws, na de rust van de ark; dat is, nadat de ark des verbonds in Davids huis gebracht was, 2Sa 6:17 , want tevoren werd zij van de ene plaats in de andere gebracht."}],"32":[{"catchword":"naar hun wijze","tekst":"Dat is, naar de order, die hun verordineerd was."}],"33":[{"catchword":"Dezen nu zijn ze,","tekst":"Te weten, Heman, Asaf en Jeduthun, die als opperzangmeesters gesteld waren over de andere zangers, die in vier en twintig orden of beurten door David zijn onderscheiden; 1Ch 25:9 , enz."},{"catchword":"van de zonen der Kahathieten,","tekst":"Dat is, van de nakomelingen."},{"catchword":"de zanger,","tekst":"Dat is, opperzangmeester."}],"37":[{"catchword":"Ebjásaf","tekst":"Hij wordt, Exo 6:23 , Abiasaf genoemd."}],"39":[{"catchword":"Asaf stond","tekst":"Versta dit alzo, dat deze Asaf geweest is de broeder, dat is, de bloedverwant van Heman, waarvan vs.33 gesproken wordt, en wiens voorouders tot hiertoe verhaald zijn. Deze Heman nu stond met de zijnen, als hij zijn ambt bediende, in het midden. Asaf stond aan de rechterhand van Heman in de bediening van zijn ambt, gelijk de nakomelingen van Merari tot zijn linkerhand stonden, vs.44."},{"catchword":"Berechja","tekst":"Hebreeuws, Berechijahu."}],"44":[{"catchword":"broeders nu,","tekst":"Dat is, neven."},{"catchword":"Ethan","tekst":"Hij wordt Jeduthun genoemd, 1Ch 9:16 , en 1Ch 25:6 , en 2Ch 35:15 ; Psa 62:1 , en Psa 77:1 ."}],"48":[{"catchword":"broeders","tekst":"Dat is, neven, verwanten, gelijk boven, , vs.44, enz."},{"catchword":"de Levieten","tekst":"Te weten, de overige Levieten, die geen zangers waren."},{"catchword":"gegeven","tekst":"Dat is, besteld of verordineerd."}],"49":[{"catchword":"zijn zonen","tekst":"Mitsgaders degenen, die van den huize Aärons hun in het priesterambt gevolgd zijn. En daarom worden in de volgende verzen gesteld de hogepriesters van Aäron af tot op Zadok, die ten tijde van David en Salomo hogepriester werd; 1Ch 29:22 ."},{"catchword":"het werk","tekst":"Dat is, dat in het heilige der heiligen moest gedaan worden, hetwelk was het binnenste des tabernakels, waar niemand mocht ingaan dan alleen de hogepriester. Hier stond de ark des verbonds."},{"catchword":"Israël","tekst":"Dat is, het volk van Israël. Zie Lev 16 ."}],"50":[{"catchword":"Pinehas zijn zoon","tekst":"Te weten, Eleazars, die naast voorgaat, en versta dit ook alzo van de volgende, tot op de tijden Davids toe."}],"54":[{"catchword":"hun woningen,","tekst":"Zie Jos 21:13 . Daar worden de steden genoemd, die hun tot woningen gegeven zijn, hoewel de namen wat veranderd zijn, gelijk zulks door langheid van tijden meermalen gebeurt."},{"catchword":"lot","tekst":"Dat is, de woning, bij het lot hun toegevallen, was daar. Anders, die loten; te weten, die in de volgende verzen beschreven worden."},{"catchword":"was voor hen","tekst":"Hebreeuws, was hun."}],"55":[{"catchword":"zij gaven","tekst":"Te weten, de kinderen Israëls. Anders, men gaf hun."},{"catchword":"haar voorsteden","tekst":"Versta hierbij, met de akkers en weiden daar rondom naast gelegen, om zichzelven en hun beesten te voeden. En zo in het volgende."}],"57":[{"catchword":"Hebron","tekst":"Anders genoemd Kiriath-Arba, Jos 21:11 ."},{"catchword":"Esthemóa","tekst":"Anders, Estemo, Jos 15:50 ."}],"58":[{"catchword":"Hilen","tekst":"Anders, Holon, Jos 21:15 ."}],"59":[{"catchword":"Asan","tekst":"Anders, Ain, Jos 21:16 ."}],"60":[{"catchword":"Allemeth","tekst":"Anders, Almon, Jos 21:18 ."},{"catchword":"dertien steden","tekst":"Hier worden er maar elf genoemd, daar ontbreken er twee, namelijk, Jutta en Gibeon, die Jos 21:16-17 genoemd staan."}],"66":[{"catchword":"hunner landpale,","tekst":"Die tot hun landpale behoorden."}],"67":[{"catchword":"zij gaven","tekst":"Te weten, de Efraïmieten."},{"catchword":"hun","tekst":"Te weten, den overigen huisgezinnen der kinderen van Kehath."}],"68":[{"catchword":"Jokmeam","tekst":"Eenigen menen dat zij Joh 21:22 , Kibzaïm genoemd wordt."}],"69":[{"catchword":"Ajálon","tekst":"Ajalon behoorde tot den stam van Dan. Boven de twee steden, in dit vs. genoemd, gaf men hun nog twee steden van den stam van Dan, te weten, Elteke en Gibeton, Jos 21:23 ."}],"70":[{"catchword":"Aner","tekst":"Eenigen menen dat dit dezelfde stad is, die Jos 21:25 genoemd wordt Taënach."},{"catchword":"Bileam","tekst":"Anders, Gath-Rimmon, Jos 21:25 , en Ibleam, Jos 17:11 ."}],"71":[{"catchword":"Astharòth","tekst":"Anders Beëstera, Jos 21:27 ."}],"72":[{"catchword":"Kedes","tekst":"Anders, Kisjon; Jos 21:28 ."}],"73":[{"catchword":"Ramoth","tekst":"Anders, Remeth, Jos 19:21 , en Jarmuth, Jos 21:29 ."},{"catchword":"Anem","tekst":"Eenigen menen dat dit dezelfde stad is, die En gannim genoemd wordt; Jos 21:29 ."}],"74":[{"catchword":"Masal","tekst":"Anders, Miseal; Jos 21:30 ."}],"75":[{"catchword":"Hukok","tekst":"Anders, Helkath; Jos 21:31 ."}],"76":[{"catchword":"Hammon","tekst":"Anders, Hammoth-Dor; Jos 21:32 ."},{"catchword":"Kirjathaïm","tekst":"Anders, Kartan; Jos 21:32 , zo enigen menen."}],"77":[{"catchword":"Rimmóno","tekst":"En nog twee andere steden van den stam Zebulons, gelijk te zien is Jos 21:34-35 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The children of Levi were Gerson [Verse 16. And elsewhere he is called Gersom] Kahath, and Merari."}],"2":[{"catchword":null,"tekst":"Now the children of Kahath were, Amram, Hizbar, [Below v.23. he is called Amminadab] and Hebron, and Uzziel."}],"3":[{"catchword":null,"tekst":"And the children of Amram were, Aaron, and Moseh, and Mirjam: And the children of Aaron were, Nadab, and Abihu, [These two were slain of God, because they used strange fire in their censers, Lev.10.1.] Eleazar, [who succeeded his father Aaron in the high Priests office] and Itharmar."}],"4":[{"catchword":null,"tekst":"And Eleaser begat Pinehas begat Abisua."}],"5":[{"catchword":null,"tekst":"And Abisua begat Bukki, and Bukki begat Uzzi."}],"6":[{"catchword":null,"tekst":"And Uzzi begat Zerahja, and Zerahja begat Merajoth."}],"7":[{"catchword":null,"tekst":"Merojoth begat Amarja, and Amarja begat Ahituh."}],"8":[{"catchword":null,"tekst":"And Ahitub begat Zadok, and Zadok begat Ahimaaz."}],"9":[{"catchword":null,"tekst":"And Ahimaaz begat Azarja, and Azrja begat Johanan."}],"10":[{"catchword":null,"tekst":"And Johanan, [Some conceive that he was the same man, who 2 Kings 11.4. is called Jojada the high Priests. Of this mans great zeal, see 2 Kings 11.17.] begat Azarja: [some hold this man to have been the same that resisted king Uzzia, 2 Chron.26.17.] It is he, [some understand this of Johanan; others of Azarja, to his honor and praise, because he opposed king Uzzia] that executed the Priests office in the house which Salommon had built at Jerusalem. [to wit, in the house of the LORD, that is, in the temple.]"}],"11":[{"catchword":null,"tekst":"And Azarja begat Amarja: and Amarja begat Ahitub."}],"12":[{"catchword":null,"tekst":"And Ahitub begat Zadok, and Zadok begat Sallum. [Otherwise called Messullam, 1 Chron.9. 11.]"}],"13":[{"catchword":null,"tekst":"And Sallum begat Hilkia, [See 2 Kings 22,4.] and Hilkia begat Azarja."}],"14":[{"catchword":null,"tekst":"And Asarja begat Seraja, [Seraja was high Priest, when Nebuchadnezer took Jerusalem, whence he was carried away captive to Ribla, where Nebuchadnezer caused him to be put to death, 2 Kings 25.v.16,21. Jer 52:24,27. Ezra the Scribe (who is conceived to have written these books) was his son. See Ezra 7.1.] and Zerajah begat Jozadak."}],"15":[{"catchword":null,"tekst":"And Jozadak went (along) with (them) when the LORD carried away captive Juda and Jerusalem [i.e. the inhabitants of Juda and Jerusalem] by the hand of Nebuchadnezer."}],"16":[{"catchword":null,"tekst":"(So then) the children of levi (are) Gersom, Kahath, and Merari."}],"17":[{"catchword":null,"tekst":"And these are the names of the children of Levi, Libna, and Simei. [See Exo 6:17.]"}],"18":[{"catchword":null,"tekst":"And the children of Kehat were, Amram, and Izhar, and Hebron, and Uzziel."}],"19":[{"catchword":null,"tekst":"The children of Merari were, Maheli, and Musi: And these are the families of the Levites, according to their fathers."}],"20":[{"catchword":null,"tekst":"Of Gesom: [Oth. Concerning Gersom] Libni was his son, Jahath his son, Zimma his son. [Zimma was Jahaths sons, grand-child, for Simei was the Father of Zimma.]"}],"21":[{"catchword":null,"tekst":"Joah [He is called Ethan, v.42.] his son, Iddo [v.41.he is called Adaia] his son, Kerah his son, Jeathrai [below v.41. he is called Ethni] his son. [that is, cousin: He was, to speak properly, the son of Simei, v.42.]"}],"22":[{"catchword":null,"tekst":"The children of Kahat were, Amminadad his son, Korah [This was that Korah, (function bouwHfdnav() {

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
