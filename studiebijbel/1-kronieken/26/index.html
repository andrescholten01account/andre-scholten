aja kinderen geboren, die heersten over het huis van hun vader; want zij waren dappere helden.","7":"De kinderen van Semaja waren Othni, en Refaël, en Obed, *en* Elzabad, zijn broers, dappere mannen; Elihu, en Semachja.","8":"Deze allen waren uit de kinderen van Obed-Edom; zij, en hun kinderen, en hun broers, dappere mannen, krachtig genoeg voor de dienst; er waren er tweeënzestig van Obed-Edom.","9":"Meselemja nu had kinderen en broers, dappere mannen, achttien.","10":"En Hosa, uit de kinderen van Merari, had zonen; Simri was het hoofd; (hoewel hij niet de eerstgeborene was, stelde zijn vader hem toch tot hoofd aan);","11":"Hilkia was de tweede, Tebalja de derde, Zecharja de vierde; al de kinderen en broers van Hosa waren dertien.","12":"Uit dezen waren de verdelingen van de poortwachters onder de hoofden van de mannen, met wachtdiensten tegenover hun broers, om te dienen in het huis van de HEERE.","13":"En zij wierpen het lot, zowel de kleinen als de groten, naar hun families,[1] voor elke poort.","14":"Het lot nu voor het oosten viel op Salemja; maar voor zijn zoon Zecharja, die een verstandig raadsman was, wierp men het lot, en zijn lot kwam uit voor het noorden;","15":"Obed-Edom voor het zuiden; en voor zijn kinderen het huis van de schatkamers.","16":"Suppim en Hosa voor het westen, bij de poort Schallechet, bij de oplopende weg, wacht tegenover wacht.","17":"Voor het oosten waren zes Levieten; voor het noorden per dag vier; voor het zuiden per dag vier; maar bij de schatkamers telkens twee.","18":"Bij Parbar voor het westen waren er vier bij de hoge weg, twee bij Parbar.","19":"Dit zijn de verdelingen van de poortwachters van de kinderen van de Korahieten, en van de kinderen van Merari.","20":"Ook was, van de Levieten, Ahia over de schatten van het huis van God, en over de schatten van de geheiligde dingen.","21":"Van de kinderen van Ladan, kinderen van de Gersoniet Ladan; van Ladan, de Gersoniet, waren hoofden van de families Jehiëli.","22":"De kinderen van Jehiëli waren Zetham en Joël, zijn broer; *dezen* waren over de schatten van het huis van de HEERE.","23":"Voor de Amramieten, van de Jizharieten, van de Hebronieten, van de Uzziëlieten,","24":"En Sebuël, de zoon van Gersom, de zoon van Mozes, was leider over de schatten.","25":"Maar zijn broers van Eliëzer waren *dezen*: Rehabja was zijn zoon, en Jesaja zijn zoon, en Joram zijn zoon, en Zichri zijn zoon, en Selomith zijn zoon.","26":"Deze Selomith en zijn broers waren over al de schatten van de heilige dingen, die koning David geheiligd had, alsook de hoofden van de families, de leiders over duizenden en honderden, en de leiders van het leger;","27":"Van de oorlogen en van de buit hadden zij het geheiligd, om het huis van de HEERE te onderhouden.","28":"Ook alles wat Samuël, de ziener, geheiligd had, en Saul, de zoon van Kis, en Abner, de zoon van Ner, en Joab, de zoon van Zeruja; al wat *iemand* geheiligd had, was onder de hand van Selomith en zijn broers.","29":"Van de Jizharieten waren Chenanja en zijn zonen belast met het buitenwerk in Israël, als opzichters en als rechters.","30":"Van de Hebronieten was Hasabja, en zijn broers, dappere mannen, duizend zevenhonderd, over de ambten van Israël aan deze kant van de Jordaan naar het westen, over al het werk van de HEERE, en tot de dienst van de koning.","31":"Van de Hebronieten was Jeria het hoofd, van de Hebronieten naar zijn geslachten onder de families; in het veertigste jaar van het koninkrijk van David zijn er gezocht en onder hen gevonden dappere helden in Jaëzer in Gilead.","32":"En zijn broers waren dappere mannen, tweeduizend zevenhonderd hoofden van de families; en koning David stelde hen aan over de Rubenieten, en Gadieten, en de halve stam van de Manassieten, voor alle zaken van God en de zaken van de koning."},"SV":{"1":"Aangaande de verdelingen der poortiers: van de Korahieten was Meselemja, de zoon van Kore, van de kinderen van Asaf.","2":"Meselemja nu had kinderen; Zecharja was de eerstgeborene, Jediael de tweede, Zebadja de derde, Jathniel de vierde,","3":"Elam de vijfde, Johanan de zesde, Eljeoenai de zevende.","4":"Obed-edom had ook kinderen: Semaja was de eerstgeborene, Jozabad de tweede, Joah de derde, en Sachar de vierde, en Nethaneel de vijfde.","5":"Ammiël de zesde, Issaschar de zevende, Peullethai de achtste; want God had hem gezegend.","6":"Ook werden zijn zoon Semaja kinderen geboren, heersende over het huis huns vaders; want zij waren kloeke helden.","7":"De kinderen van Semaja waren Othni, en Refael, en Obed, *en* Elzabad, zijn broeders, kloeke lieden; Elihu, en Semachja.","8":"Deze allen waren uit de kinderen van Obed-edom; zij, en hun kinderen, en hun broeders, kloeke mannen in kracht tot den dienst; daar waren er twee en zestig van Obed-edom.","9":"Meselemja nu had kinderen en broeders, kloeke lieden, achttien.","10":"En Hosa, uit de kinderen van Merari, had zonen; Simri was het hoofd; ( alhoewel hij de eerstgeborene niet was, nochtans stelde hem zijn vader tot een hoofd).","11":"Hilkia was de tweede, Tebalja de derde, Zecharja de vierde; al de kinderen en broederen van Hosa waren dertien.","12":"Uit dezen waren de verdelingen der poortiers onder de hoofden der mannen, tot de wachten tegen hun broederen, om te dienen in het huis des HEEREN.","13":"En zij wierpen de loten, zo de kleinen als de groten, naar hun vaderlijke huizen, tot elke poort.","14":"Het lot nu tegen het oosten viel op Salemja; maar voor zijn zoon Zecharja, die een verstandig raadsman was, wierp men de loten, en zijn lot is uitgekomen tegen het noorden;","15":"Obed-edom tegen het zuiden; en voor zijn kinderen het huis der schatkameren.","16":"Suppim en Hosa tegen het westen, met de poort Schallechet, bij den opgaanden hogen weg, wacht tegenover wacht.","17":"Tegen het oosten waren zes Levieten; tegen het noorden des daags vier; tegen het zuiden des daags vier; maar bij de schatkameren twee *en* twee.","18":"Aan Parbar tegen het westen waren er vier bij den hogen weg, twee bij Parbar.","19":"Dit zijn de verdelingen der poortiers van de kinderen der Korahieten, en der kinderen van Merari.","20":"Ook was, van de Levieten, Ahia over de schatten van het huis Gods, en over de schatten der geheiligde dingen.","21":"Van de kinderen van Ladan, kinderen van den Gersoniet Ladan; van Ladan, den Gersoniet, waren hoofden der vaderen Jehieli.","22":"De kinderen van Jehieli waren Zetham en Joël, zijn broeder; *dezen* waren over de schatten van het huis des HEEREN.","23":"Voor de Amramieten, van de Jizharieten, van de Hebronieten, van de Uzziëlieten,","24":"En Sebuël, de zoon van Gersom, den zoon van Mozes, was overste over de schatten.","25":"Maar zijn broeders van Eliëzer waren *dezen*: Rehabja was zijn zoon, en Jesaja zijn zoon, en Joram zijn zoon, en Zichri zijn zoon, en Selomith zijn zoon.","26":"Deze Selomith en zijn broeders waren over al de schatten der heilige dingen, die de koning David geheiligd had, mitsgaders de hoofden der vaderen, de oversten over duizenden en honderden, en de oversten des heirs;","27":"Van de krijgen en van den buit hadden zij het geheiligd, om het huis des HEEREN te onderhouden.","28":"Ook alles, wat Samuël, de ziener, geheiligd had, en Saul, de zoon van Kis, en Abner, de zoon van Ner, en Joab, de zoon van Zeruja; al wat *iemand* geheiligd had, was onder de hand van Selomith en zijn broederen.","29":"Van de Jizharieten waren Chenanja en zijn zonen tot het buitenwerk in Israël, tot ambtlieden en tot rechters.","30":"Van de Hebronieten was Hasabja, en zijn broeders, kloeke mannen, duizend en zevenhonderd, over de ambten van Israël op deze zijde van de Jordaan tegen het westen, over al het werk des HEEREN, en tot den dienst des konings.","31":"Van de Hebronieten was Jeria het hoofd, van de Hebronieten zijner geslachten onder de vaderen; in het veertigste jaar des koninkrijks van David zijn er gezocht en onder hen gevonden kloeke helden in Jaezer in Gilead.","32":"En zijn broeders waren kloeke lieden, twee duizend en zevenhonderd hoofden der vaderen; en de koning David stelde hen over de Rubenieten, en Gadieten, en den halven stam der Manassieten, tot alle zaken Gods en de zaken des konings."},"KJV":{"1":"Concerning the divisions of the porters: Of the Korhites was Meshelemiah the son of Kore, of the sons of Asaph.","2":"And the sons of Meshelemiah were, Zechariah the firstborn, Jediael the second, Zebadiah the third, Jathniel the fourth,","3":"Elam the fifth, Jehohanan the sixth, Elioenai the seventh.","4":"Moreover the sons of Obededom were, Shemaiah the firstborn, Jehozabad the second, Joah the third, and Sacar the fourth, and Nethaneel the fifth,","5":"Ammiel the sixth, Issachar the seventh, Peulthai the eighth: for God blessed him.","6":"Also unto Shemaiah his son were sons born, that ruled throughout the house of their father: for they were mighty men of valour.","7":"The sons of Shemaiah; Othni, and Rephael, and Obed, Elzabad, whose brethren were strong men, Elihu, and Semachiah.","8":"All these of the sons of Obededom: they and their sons and their brethren, able men for strength for the service, were threescore and two of Obededom.","9":"And Meshelemiah had sons and brethren, strong men, eighteen.","10":"Also Hosah, of the children of Merari, had sons; Simri the chief, (for though he was not the firstborn, yet his father made him the chief;)","11":"Hilkiah the second, Tebaliah the third, Zechariah the fourth: all the sons and brethren of Hosah were thirteen.","12":"Among these were the divisions of the porters, even among the chief men, having wards one against another, to minister in the house of the LORD.","13":"And they cast lots, as well the small as the great, according to the house of their fathers, for every gate.","14":"And the lot eastward fell to Shelemiah. Then for Zechariah his son, a wise counsellor, they cast lots; and his lot came out northward.","15":"To Obededom southward; and to his sons the house of Asuppim.","16":"To Shuppim and Hosah the lot came forth westward, with the gate Shallecheth, by the causeway of the going up, ward against ward.","17":"Eastward were six Levites, northward four a day, southward four a day, and toward Asuppim two and two.","18":"At Parbar westward, four at the causeway, and two at Parbar.","19":"These are the divisions of the porters among the sons of Kore, and among the sons of Merari.","20":"And of the Levites, Ahijah was over the treasures of the house of God, and over the treasures of the dedicated things.","21":"As concerning the sons of Laadan; the sons of the Gershonite Laadan, chief fathers, even of Laadan the Gershonite, were Jehieli.","22":"The sons of Jehieli; Zetham, and Joel his brother, which were over the treasures of the house of the LORD.","23":"Of the Amramites, and the Izharites, the Hebronites, and the Uzzielites:","24":"And Shebuel the son of Gershom, the son of Moses, was ruler of the treasures.","25":"And his brethren by Eliezer; Rehabiah his son, and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.","26":"Which Shelomith and his brethren were over all the treasures of the dedicated things, which David the king, and the chief fathers, the captains over thousands and hundreds, and the captains of the host, had dedicated.","27":"Out of the spoils won in battles did they dedicate to maintain the house of the LORD.","28":"And all that Samuel the seer, and Saul the son of Kish, and Abner the son of Ner, and Joab the son of Zeruiah, had dedicated; and whosoever had dedicated any thing, it was under the hand of Shelomith, and of his brethren.","29":"Of the Izharites, Chenaniah and his sons were for the outward business over Israel, for officers and judges.","30":"And of the Hebronites, Hashabiah and his brethren, men of valour, a thousand and seven hundred, were officers among them of Israel on this side Jordan westward in all the business of the LORD, and in the service of the king.","31":"Among the Hebronites was Jerijah the chief, even among the Hebronites, according to the generations of his fathers. In the fortieth year of the reign of David they were sought for, and there were found among them mighty men of valour at Jazer of Gilead.","32":"And his brethren, men of valour, were two thousand and seven hundred chief fathers, whom king David made rulers over the Reubenites, the Gadites, and the half tribe of Manasseh, for every matter pertaining to God, and affairs of the king."}},"tsk":{"1":[{"kopje":"verdelingen","refs":["1 Kron 26:14","1 Kron 26:15","1 Kron 26:16","1 Kron 23:5"]},{"kopje":"poortwachters","refs":["1 Kron 9:17-27","1 Kron 15:18","1 Kron 15:23","1 Kron 15:24","2 Kron 23:19"]},{"kopje":"Korahieten","refs":["Num 26:9-11","Ps 44:2","Ps 49:2"]},{"kopje":"Meselemja","refs":["1 Kron 26:14"]},{"kopje":"Asaf","refs":["1 Kron 6:37","1 Kron 9:19"]}],"4":[{"kopje":"Obed-Edom","refs":["1 Kron 15:18","1 Kron 15:21","1 Kron 15:24","1 Kron 16:5","1 Kron 16:38"]}],"5":[{"kopje":"hem","refs":["1 Kron 13:14","Ps 128:1"]}],"6":[{"kopje":"dappere helden","refs":["1 Kron 26:8","1 Kron 12:28","Richt 6:12","2 Sam 2:7","2 Kron 26:17","Neh 11:14","1 Tim 6:12","2 Tim 2:3"]}],"8":[{"kopje":"dappere mannen","refs":["Matt 25:15","1 Kor 12:4-11","2 Kor 3:6","1 Petr 4:11"]}],"9":[{"kopje":"Meselemja","refs":["1 Kron 26:1","1 Kron 26:14"]}],"10":[{"kopje":"Hosa","refs":["1 Kron 16:38"]},{"kopje":"zijn vader","refs":["1 Kron 5:1","1 Kron 5:2"]}],"12":[{"kopje":"wachtdiensten","refs":["1 Kron 25:8"]}],"13":[{"kopje":"zowel de kleinen als de groten","refs":["1 Kron 24:31","1 Kron 25:8"]}],"14":[{"kopje":"Salemja","refs":["1 Kron 26:1"]},{"kopje":"Zecharja","refs":["1 Kron 26:2"]}],"15":[{"kopje":"schatkamers","refs":["1 Kron 26:17","2 Kron 25:24","Neh 12:25","Pred 12:11","2 Kron 25:24"]}],"16":[{"kopje":"Hosa","refs":["1 Kron 26:10","1 Kron 26:11"]},{"kopje":"oplopende weg","refs":["1 Kon 10:5","2 Kron 9:4"]},{"kopje":"wacht tegenover wacht","refs":["1 Kron 26:12","1 Kron 25:8","Neh 12:24"]}],"17":[{"kopje":"Voor het oost class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> for every <span class=\"wl wl-kjv\" data-code=\"H8179\">gate.</span>","14":"And the <span class=\"wl wl-kjv\" data-code=\"H1486\">lot</span> <span class=\"wl wl-kjv\" data-code=\"H4217\">eastward</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> to <span class=\"wl wl-kjv\" data-code=\"H8018\">Shelemiah.</span> Then for <span class=\"wl wl-kjv\" data-code=\"H2148\">Zechariah</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> a <span class=\"wl wl-kjv\" data-code=\"H7922\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H3289\">counsellor,</span> they <span class=\"wl wl-kjv\" data-code=\"H5307\">cast</span> <span class=\"wl wl-kjv\" data-code=\"H1486\">lots;</span> and his <span class=\"wl wl-kjv\" data-code=\"H1486\">lot</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6828\">northward.</span>","15":"To <span class=\"wl wl-kjv\" data-code=\"H5654\">Obededom</span> <span class=\"wl wl-kjv\" data-code=\"H5045\">southward;</span> and to his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H624\">Asuppim.</span>","16":"To <span class=\"wl wl-kjv\" data-code=\"H8206\">Shuppim</span> and <span class=\"wl wl-kjv\" data-code=\"H2621\">Hosah</span> the lot came forth <span class=\"wl wl-kjv\" data-code=\"H4628\">westward,</span> with the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> <span class=\"wl wl-kjv\" data-code=\"H7996\">Shallecheth,</span> by the <span class=\"wl wl-kjv\" data-code=\"H4546\">causeway</span> of the going <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> <span class=\"wl wl-kjv\" data-code=\"H4929\">ward</span> <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> <span class=\"wl wl-kjv\" data-code=\"H4929\">ward.</span>","17":"<span class=\"wl wl-kjv\" data-code=\"H421 >house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","28":"And all that <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> the <span class=\"wl wl-kjv\" data-code=\"H7200\">seer,</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7027\">Kish,</span> and <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner,</span> and <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah,</span> had <span class=\"wl wl-kjv\" data-code=\"H6942\">dedicated;</span> and whosoever had <span class=\"wl wl-kjv\" data-code=\"H6942\">dedicated</span> any thing, it was under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H8019\">Shelomith,</span> and of his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren.</span>","29":"Of the <span class=\"wl wl-kjv\" data-code=\"H3325\">Izharites,</span> <span class=\"wl wl-kjv\" data-code=\"H3663\">Chenaniah</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> were for the <span class=\"wl wl-kjv\" data-code=\"H2435\">outward</span> <span class=\"wl wl-kjv\" data-code=\"H4399\">business</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> for <span class=\"wl wl-kjv\" data-code=\"H7860\">officers</span> and <span class=\"wl wl-kjv\" data-code=\"H8199\">judges.</span>","30":"And of the <span class=\"wl wl-kjv\" data-code=\"H2276\">Hebronites,</span> <span class=\"wl wl-kjv\" data-code=\"H2811\">Hashabiah</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour,</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred,</span> were <span class=\"wl wl-kjv\" data-code=\"H6486\">officers</span> among them of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> on this <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> <span class=\"wl wl-kjv\" data-code=\"H4628\">westward</span> in all the <span class=\"wl wl-kjv\" data-code=\"H4399\">business</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","31":"Among the <span class=\"wl wl-kjv\" data-code=\"H2276\">Hebronites</span> was <span class=\"wl wl-kjv\" data-code=\"H3404\">Jerijah</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief,</span> even among the <span class=\"wl wl-kjv\" data-code=\"H2276\">Hebronites,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H8435\">generations</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span> In the <span class=\"wl wl-kjv\" data-code=\"H705\">fortieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of the <span class=\"wl wl-kjv\" data-code=\"H4438\">reign</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> they were <span class=\"wl wl-kjv\" data-code=\"H1875\">sought</span> for, and there were <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> among them mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour</span> at <span class=\"wl wl-kjv\" data-code=\"H3270\">Jazer</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead.</span>","32":"And his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour,</span> were two <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> whom <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> made <span class=\"wl wl-kjv\" data-code=\"H6485\">rulers</span> over the <span class=\"wl wl-kjv\" data-code=\"H7206\">Reubenites,</span> the <span class=\"wl wl-kjv\" data-code=\"H1425\">Gadites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H4520\">Manasseh,</span> for every <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> pertaining to <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H1697\">affairs</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de verdelingen","tekst":"Hier staat aan te merken dat er drie geslachten tot het portiersambt besteld waren: 1. het geslacht van Meselemja; 2. het geslacht van Obed-Edom, vs.4; 3. het geslacht van Hosa, vs.10."},{"catchword":"poortiers","tekst":"Te weten, van den tempel."},{"catchword":"Meselemja,","tekst":"vs.14 Selemja."},{"catchword":"Asaf","tekst":"Dit is een andere Asaf geweest dan die vermaarde voorzanger, van wien in 1Ch 25 gesproken is."}],"2":[{"catchword":"de eerstgeborene,","tekst":"Voor eerstgeborene staat boven dikwijls het hoofd; zie 1Ch 23:8-9 , 1Ch 23:11 , 1Ch 23:18-19 , enz."}],"5":[{"catchword":"hem gezegend","tekst":"Te weten, Obed-Edom; wien God vele kinderen en kindskinderen gegeven heeft. Zie onder, vs.8. Deze manier van spreken wordt ook gebruikt Gen 1:22 , Gen 1:28 , en elders."}],"6":[{"catchword":"kloeke helden","tekst":"Dat is, geweldige lieden, die kloek en dapper waren in de bediening van hun ambt, te weten, in het houden van hun wacht en in het weren van alle geweld en wanorde van de deuren des tempels."}],"7":[{"catchword":"Obed,","tekst":"Eenigen maken van Obed en Elzabad maar een man. Anderen voegen het woord en hier tussen in. En dan zijn hier vier en twintig hoofden, gelijk in de andere beurten."},{"catchword":"kloeke lieden;","tekst":"Hebreeuws, kinderen, of zonen der kloekheid."}],"10":[{"catchword":"stelde hem","tekst":"De vader heeft dezen zijn zoon het eerstgeboorterecht niet mogen geven, en den eerstgeborene, zonder merkelijke reden uitsluiten, die hier mag geweest zijn. Zie de wet Deu 21:16-17 ."}],"12":[{"catchword":"Uit dezen waren","tekst":"De zin dezer woorden is dat deze portiers of deurwachters ook in vier en twintig beurten zijn gedeeld geweest, gelijk de andere Levieten, elk in hun bediening, en dat zij ook alzo in hun wacht aan en afgingen op hun beurt, gelijk de anderen, op alle sabbaten veranderende."},{"catchword":"tegen hun broederen,","tekst":"Zie 1Ch 24:31 ."}],"13":[{"catchword":"zo de kleinen als de groten,","tekst":"Hebreeuws, gelijk de kleine, alzo den grote, gelijk 1Ch 25:8 ."},{"catchword":"tot elke poort","tekst":"Versta, dat zij het lot wierpen of trokken naardat de poorten van den tempel of andere plaatsen gelegen waren, daar zij de wacht moesten houden; ook naar het getal der personen, die op elke plaats de wacht moesten houden. Hebreeuws, tot poort en poort."}],"14":[{"catchword":"tegen het oosten","tekst":"Dat is, de poort, die tegen het oosten lag, en alzo vervolgens."}],"15":[{"catchword":"Obed-edom","tekst":"Hij wil zeggen dat enigen van de kinderen van Obed-Edom de wacht hielden aan de zuidpoort des tempels, en enigen aan de schatkamers."},{"catchword":"het huis der schatkameren","tekst":"Hebreeuws, het huis der verzamelingen; dat is, waar verzameld en bewaard werden de gaven, die van het volk tot den bouw en de reparatie des tempels gegeven werden, mitsgaders de tienden, eerstelingen, enz. Zie 2Ch 25:24 . Doch enigen menen dat dit geweest is een huis of gebouw bij of aan den tempel, waar de leraars der wet, profeten en zangmeesters hun vergaderingen en samenkomsten hielden, om met elkander te spreken van de wetten en geboden des Heeren. Anderen houden hier het Hebreeuwse woord Asuppim, als zijnde de naam ener zekere plaats."}],"16":[{"catchword":"Hosa","tekst":"Versta, het huis van Hosa, den zoon van Suppim, van het geslacht van Merari. Eenigen menen dat Suppim en Hosa broeders geweest zijn, en dat zij in het lot tezamen onder een hoofd zijn gevoegd geweest."},{"catchword":"met de poort Schallechet,","tekst":"De zin dezer woorden is dat Suppim en Hosa de wacht niet alleen aan de westpoort hadden [die de achterste poort genaamd wordt, omdat zij stond achter de poort des heiligdoms, waar de ark des verbonds stond], maar ook aan een andere poort, die daarbij stond, bij de opgaande gang of galerij, die Salomo gemaakt had, om uit de stad Davids in den tempel te gaan. Zie van deze gang 1Ki 10:12 , en 2Ch 9:11 ."},{"catchword":"wacht tegenover wacht","tekst":"Dat is, zij waren alzo geordineerd dat als de een afging van den dienst in het huis des Heeren, zo trad de ander aan. Of, zij hielden wacht elk op zijn plaats tegen elkander over; of, zij waren elkander gelijk, elk in zijne wacht."}],"18":[{"catchword":"Parbar","tekst":"Parbar is een Chaldeeuws woord, en beduidt een uiterste deel, of een deel dat uitwaarts komt."}],"20":[{"catchword":"en","tekst":"Anders, dat is, of te weten, gelijk de letter van genomen wordt Jdg 7:24 , en 1Sa 28:3 , enz."},{"catchword":"over de schatten","tekst":"Hier staat aan te merken dat er verscheidene schatten in het huis des Heeren geweest zijn; want vooreerst werd daar verzameld hetgeen tot onderhoud der priesters en der Levieten gegeven werd, als, daar waren de eerstelingen en de tienden, of de waarde derzelve; daarna, wat den Heere geheiligd werd, als vrijwillig offer, beloften, het losgeld voor de eerstgeborenen en dergelijke, waarvan de onkomsten genomen werden tot het dagelijkse offer, idem, tot de offeranden op de sabbaten, nieuwe maanden en jaarlijkse feestdagen, enz. Ten derde, zo werd er ook geld vergaderd tot den bouw des tempels en de onderhouding deszelven. Zie onder, vs.26-28."}],"21":[{"catchword":"Ladan,","tekst":"Anders, Libni."},{"catchword":"van Ladan, den Gersoniet","tekst":"Boven, 1Ch 23:8 worden Zetham en Joël genoemd kinderen van Ladan, òf omdat het zijne kindskinderen waren, òf dat zij waarlijk zijn kinderen en broeders van Jehiëli zijn geweest, en dat hier Zetham en Joël kinderen van Jehiëli zijn genaamd geweest, naar de namen van hun oom."}],"24":[{"catchword":"de zoon van Gersom,","tekst":"Dat is, nakomeling. Zie boven, 1Ch 23:16 ."},{"catchword":"was overste","tekst":"Wij zouden hem noemen oppersten rekenmeester; of president in de rekenkamer."}],"25":[{"catchword":"broeders","tekst":"Dat is, bloedverwanten."},{"catchword":"van Eliëzer","tekst":"Dat is, die van Eliëzer gesproten waren. Eliëzer was de tweede zoon van Mozes, wiens nakomelingen hier tot wachters over de schatten gesteld werden."}],"26":[{"catchword":"broederen","tekst":"Dat is, bloedverwanten."},{"catchword":"geheiligd had,","tekst":"Dat is, in den tempel tot den godsdienst geschonken had."}],"27":[{"catchword":"Van de krijgen","tekst":"Dat is, van den buit in den krijg verkregen."},{"catchword":"te onderhouden","tekst":"Te weten, nadat het huis gebouwd zijnde, mettertijd verbetering zou van node hebben."}],"28":[{"catchword":"de ziener,","tekst":"Zie 1Sa 9:9 ."}],"29":[{"catchword":"tot het buitenwerk","tekst":"Dat is, over zulke zaken, die buiten Jeruzalem te doen waren, verstaande daardoor dat zij het ambt der rechters en ambtlieden in het land mede bediend hebben. Want alhoewel de Levieten ordinaire kerkelijke dienaars waren en bleven, nochtans zijn sommigen onder hen ook wel mede in politieke zaken en diensten gebruikt, niet alleen in hun eigen steden, die hun van de stammen, naar Gods ordinantie waren gegeven, maar ook elders daartoe geroepen zijnde: [gelijk afgenomen wordt uit deze plaats, vs.29-32; idem boven, 1Ch 23:4 . Vergelijk 2Ch 19:11 ] dewijl Levi mede een van de stammen Israëls was, en de rechten van de politie Israëls beschreven waren in het wetboek Gods, hetwelk den Levieten specialijk was toebetrouwd. Zie 2Ch 17:8-9 , enz. Anderen menen dat het buitenwerk dezer Levieten is geweest, dat zij in het land rondom her hebben vergaderd en verzorgd, hetgeen tot den bouw des tempels en den godsdienst van node was. Zie 2Ch 34:13 ; Neh 11:16 ."}],"31":[{"catchword":"in het veertigste jaar","tekst":"Dit was het laatste jaar der regering van David, in hetwelk hij de bovenverhaalde orde gemaakt heeft, eer hij Salomo tot koning in zijn plaats stelde, houdende deshalve een grote bijeenkomst des volks; onder 1Ch 28 , 1Ch 29 ."},{"catchword":"Jáëzer in Gilead","tekst":"Dit was een stad in het land Gilead, die den Merarieten tot woning gegeven was; Jos 21:39 ."}],"32":[{"catchword":"zijn","tekst":"Te weten, Jerijas broeders."},{"catchword":"broeders","tekst":"Dat is, verwanten."},{"catchword":"kloeke lieden,","tekst":"Zie boven, vs.7."},{"catchword":"en de zaken des konings","tekst":"Vergelijk vs.30."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Concerning the divisions of the porters, [To wit, of the Temple. Here is to be noted, that there were three families appointed for the office of porters: as first, the family of Meselemja. Secondly, the family of Obed-Edom, v.4.11. Thirdly, the family of Hosa, v.10.] of the Korhites was Meselemja, [called Selemja, v.14.] the son of Kore, of the children of Asaph. [this was another Asaph, then that famous chief singers, of whom is spoken in the 25. Chapter.]"}],"2":[{"catchword":null,"tekst":"Now Meselemja had children: Secharja was the first-born, [For first-born is often used (above chap.23.v.10,18,19, &c. the word head] Jediael the second, zebadja the third, Jathniel the fourth."}],"3":[{"catchword":null,"tekst":"Elam the fist, Johanan the six, Eljeoenai the seventh."}],"4":[{"catchword":null,"tekst":"Obed-Edom had also children: Semaja was the first-born, Jozabad the second, Joah the third, and Sachar the fourth, and Nethaneel the fist."}],"5":[{"catchword":null,"tekst":"Ammiel the six, Issaschur the seventh, Peullethai the eight, for God had blessed him. [To wit, Obed-Edom, to whom God gave children and grand-children. See below v.8. This phrase is also used, Gen.2.v.22, 18, &c.]"}],"6":[{"catchword":null,"tekst":"Also unto Semaja his son were children born, ruling over the house of their Father: For they were valiant champions. [That is, mighty men, that were valiant and courageous in the execution of their office, to wit, in keeping their guard, and in removing all violence and disorder from the doors of the Temple.]"}],"7":[{"catchword":null,"tekst":"The children of Semaja were Othni, and Rephael, and Obed, (and) Elzabad [Some make of Obed and Elzabad but one name: Others do here insert the word and, the there be four and twenty heads here, as there be in the other courses] his brethren valiant men: [Heb. children, or, sons of valour] Elihu, and Semachja."}],"8":[{"catchword":null,"tekst":"All these were of the children of Obed-Edom, they and their children, and their brethren, valiant men in strength for the service, there were threescore and two of Obed-Edom."}],"9":[{"catchword":null,"tekst":"Now Meselemja had children and brethren, valiant men, eighteen."}],"10":[{"catchword":null,"tekst":"And Hosa of the children of Merari, had sons: Simri was the head (although he was not the first-born, yet his Father made him an head.) [The Father might not give the birth right to this son of his, and exclude the first-born without some special and remarkeable cause, which it may be was given here. See the law, Deu.21.16,17.]"}],"11":[{"catchword":null,"tekst":"Hilkija was the second, Tebalja the third, ZEcharja the fourth; all the children and brethren of Hosa were thirteen."}],"12":[{"catchword":null,"tekst":"Out of these were the divisions of the Porters among the heads of the men, for the wards against their brethren: [See chap.24.v.31.] to minister in the house of the LORD. [the meaning of the words of this verse is, that these porters or door-keepers were also divided into four and twenty courses, as the other Levites were, each in their function or administration, and that they likewise so came on, and went off in their wards by turns, as the others did, changing their courses every Sabbath day.]"}],"13":[{"catchword":null,"tekst":"And they cast lots as well the small as the great, [Heb. as the small, so the great, as chap.25.v.8.] according to their fatherly houses, for every gate. [understand that they cast or drew lots, according as the gates of the Temple, or other places lay, where they were to keep guard: also according to the number of the persons that were to keep guard in every place. Heb. for gate and gate.]"}],"14":[{"catchword":null,"tekst":"Now the lot East-ward [That is, of the gate that lay East-ward: and so in the sequel] fell upon Selemja: but for Zecharja his son, who was an understanding Counsellor, they cast lots, and his lots came forth North-ward."}],"15":[{"catchword":null,"tekst":"For Obed-Edom Southward, and for his children the house of the treasure-chambers. [Intimating that some of the children of Obed-Edom kept guard at the south-gate of the Temple, and some at the treasure-chambers. The words rendered here the house of the treasure-chambers, are in the Heb. the house of gatherings; that is, where the gifts that were given by the people toward the building and repairing of the Temple, were gathered and kept, as also the tithes, first-fruits, &c. See 2 Chron.25.v.24. But some conceive that this w // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
