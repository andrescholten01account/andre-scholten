e; maar Ik ben gegaan van tent naar tent, en van tabernakel naar tabernakel.","6":"Overal waar Ik gewandeld heb met heel Israël, heb Ik ooit een woord gesproken tegen een van de richters van Israël, aan wie Ik gebood Mijn volk te weiden, en gezegd: Waarom bouwt u Mij geen huis van cederhout?","7":"Nu dan, zo zult u zeggen tegen Mijn knecht, tegen David: Zo zegt de HEERE van de heerscharen[1]: Ik heb u van de schaapskooi genomen, van achter de schapen vandaan, opdat u een voorganger over Mijn volk Israël zou zijn;","8":"En Ik ben met u geweest overal waar u heen bent gegaan, en Ik heb al uw vijanden voor u uitgeroeid; en Ik heb u een naam gemaakt, gelijk de naam van de groten die op de aarde zijn.","9":"En Ik heb voor Mijn volk Israël een plaats bepaald, en hem geplant, zodat hij op zijn plaats woont en niet meer heen en weer gedreven wordt; en de kinderen van de verkeerdheid zullen hem niet meer krenken zoals eerst,","10":"En vanaf die dagen dat Ik geboden heb dat er richters zouden zijn over Mijn volk Israël; en Ik heb al uw vijanden vernederd; ook heb Ik u bekendgemaakt dat de HEERE u een huis bouwen zal.","11":"En het zal gebeuren, als uw dagen vervuld zijn, dat u heengaat tot uw vaderen, dat Ik dan uw nageslacht na u zal doen opstaan, dat uit uw zonen zijn zal, en Ik zal zijn koninkrijk bevestigen.","12":"Die zal Mij een huis bouwen, en Ik zal zijn troon bevestigen tot in eeuwigheid.","13":"Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; en Mijn goedertierenheid zal Ik niet van hem wenden, zoals Ik die weggenomen heb van hem die vóór u geweest is;","14":"Maar Ik zal hem in Mijn huis bestendig maken, en in Mijn Koninkrijk tot in eeuwigheid; en zijn troon zal vast zijn tot in eeuwigheid.","15":"Naar al deze woorden, en naar dit hele visioen, zo sprak Nathan tegen David.","16":"Toen kwam koning David binnen, en bleef voor het aangezicht van de HEERE, en hij zei: Wie ben ik, HEERE God, en wat is mijn huis, dat U mij tot hiertoe gebracht hebt?","17":"En dit is nog klein geweest in Uw ogen, o God! Daarom hebt U over het huis van Uw knecht ook gesproken voor een verre toekomst, en U hebt mij naar menselijke maatstaf voorzien met deze verhoging, o HEERE God!","18":"Wat zal David hier verder aan toevoegen, vanwege de eer aan Uw knecht? Maar U kent Uw knecht wel.","19":"HEERE, omwille van Uw knecht, en naar Uw hart, hebt U al deze grote dingen gedaan, om al deze grote dingen bekend te maken.","20":"HEERE, er is niemand zoals U, en er is geen God buiten U, naar alles wat wij met onze oren gehoord hebben.","21":"En wie is als Uw volk Israël, één enig volk op de aarde, dat God heengegaan is om voor Zich tot een volk te verlossen, om U een Naam te maken van grote en ontzagwekkende dingen, door de heidenvolken te verdrijven voor het aangezicht van Uw volk, dat U uit Egypte verlost hebt?","22":"En U hebt Uw volk Israël voor Uzelf tot een volk gemaakt tot in eeuwigheid; en U, HEERE, bent hun tot een God geworden.","23":"Nu dan, HEERE, laat het woord dat U over Uw knecht gesproken hebt, en over zijn huis, waar worden tot in eeuwigheid; en doe zoals U gesproken hebt.","24":"Ja, laat het waar worden, en laat Uw Naam groot gemaakt worden tot in eeuwigheid, zodat men zegt: De HEERE van de heerscharen, de God van Israël, is Israëls God; en laat het huis van David, Uw knecht, bestendig zijn voor Uw aangezicht.","25":"Want U, mijn God, hebt aan het oor van Uw knecht geopenbaard dat U hem een huis bouwen zou; daarom heeft Uw knecht in zijn hart de vrijmoedigheid gevonden om voor Uw aangezicht te bidden.","26":"Nu dan, HEERE, U bent die God; en U hebt dit goede over Uw knecht gesproken.","27":"Nu dan, het heeft U behaagd het huis van Uw knecht te zegenen, zodat het in eeuwigheid voor Uw aangezicht zal zijn; want U, HEERE, hebt het gezegend, en het zal gezegend zijn in eeuwigheid."},"SV":{"1":"Het geschiedde nu, als David in zijn huis woonde, dat David tot Nathan, den profeet, zeide: Zie, ik woon in een cederen huis, maar de ark des verbonds des HEEREN onder gordijnen.","2":"Toen zeide Nathan tot David: Doe alles, wat in uw hart is, want God is met u.","3":"Maar het geschiedde in denzelven nacht, dat het woord Gods tot Nathan kwam, zeggende:","4":"Ga heen en zeg tot David, Mijn knecht: Alzo zegt de HEERE: Gij zult Mij geen huis bouwen, om in te wonen.","5":"Want Ik heb in geen huis gewoond van dien dag af, dat Ik Israël heb opgevoerd tot dezen dag toe; maar Ik ben gegaan van tent tot tent, en van tabernakel *tot* *tabernakel*.","6":"Overal, waar Ik gewandeld heb met geheel Israël, heb Ik wel een woord gesproken tot een van de richters van Israël, denwelken Ik gebood Mijn volk te weiden, zeggende: Waarom bouwt gijlieden Mij geen cederen huis?","7":"Nu dan, alzo zult gij zeggen tot Mijn knecht, tot David: Zo zegt de HEERE der heirscharen: Ik heb u van de schaapskooi genomen, van achter de schapen, opdat gij een voorganger over Mijn volk Israël zoudt zijn;","8":"En Ik ben met u geweest overal, waar gij heengegaan zijt, en Ik heb al uw vijanden uitgeroeid van voor uw aangezicht; en Ik heb u een naam gemaakt, gelijk de naam is der groten, die op de aarde zijn.","9":"En Ik heb voor Mijn volk Israël een plaats besteld, en hem geplant, dat hij aan zijn plaats wone, en niet meer heen en weder gedreven worde; en de kinderen der verkeerdheid zullen hem niet meer krenken, gelijk als in het eerst.","10":"En van die dagen af, dat Ik geboden heb richters te wezen over Mijn volk Israël; en heb al uw vijanden vernederd; ook heb Ik u te kennen gegeven, dat u de HEERE een huis bouwen zal.","11":"En het zal geschieden, als uw dagen zullen vervuld zijn, dat gij heengaat tot uw vaderen, zo zal Ik uw zaad na u doen opstaan, hetwelk uit uw zonen zijn zal, en Ik zal zijn koninkrijk bevestigen.","12":"Die zal Mij een huis bouwen, en Ik zal zijn stoel bevestigen tot in der eeuwigheid.","13":"Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; en Mijn goedertierenheid zal Ik van hem niet wenden, gelijk als Ik *die* weggenomen heb van dien, die voor u geweest is;","14":"Maar Ik zal hem in Mijn huis bestendig maken, en in Mijn Koninkrijk tot in eeuwigheid; en zijn stoel zal vast zijn tot in eeuwigheid.","15":"Naar al deze woorden, en naar dit ganse gezicht, alzo sprak Nathan tot David.","16":"Toen kwam de koning David in, en bleef voor het aangezicht des HEEREN, en hij zeide: Wie ben ik, HEERE God, en wat is mijn huis, dat Gij mij tot hiertoe gebracht hebt?","17":"En dit is klein in Uw ogen geweest, o God! daarom hebt Gij van het huis Uws knechts tot van verre heen gesproken, en Gij hebt mij naar menselijke wijze voorzien met deze verhoging, o HEERE God!","18":"Wat zal David meer bij U daartoe voegen, vanwege de eer aan Uw knecht? Doch Gij kent Uw knecht wel.","19":"HEERE, om Uws knechts wil, en naar Uw hart, hebt Gij al deze grote dingen gedaan, om al deze grote dingen bekend te maken.","20":"HEERE, er is niemand gelijk Gij, en er is geen God behalve Gij, naar alles, wat wij met onze oren gehoord hebben.","21":"En wie is als Uw volk Israël, een enig volk op de aarde, hetwelk God heengegaan is Zich tot een volk te verlossen, dat Gij U een Naam maaktet van grote en verschrikkelijke dingen, met de heidenen uit te stoten van het aangezicht Uws volks, hetwelk Gij uit Egypte verlost hebt?","22":"En Gij hebt Uw volk Israël U ten volk gemaakt tot in der eeuwigheid; en Gij, HEERE, zijt hun tot een God geworden.","23":"Nu dan, HEERE, het woord, dat Gij over Uw knecht gesproken hebt, en over zijn huis, dat worde waar tot in eeuwigheid; en doe, gelijk als Gij gesproken hebt.","24":"Ja, het worde waar, en Uw Naam worde groot gemaakt tot in eeuwigheid, dat men zegge: De HEERE der heirscharen, de God van Israël, is Israëls God; en het huis van David, Uw knecht, zij bestendig voor Uw aangezicht.","25":"Want Gij, mijn God, hebt voor het oor Uws knechts geopenbaard, dat Gij hem een huis bouwen zoudt; daarom heeft Uw knecht *in* *zijn* *hart* gevonden, om voor Uw aangezicht te bidden.","26":"Nu dan, HEERE, Gij zijt die God; en Gij hebt dit goede over Uw knecht gesproken.","27":"Nu dan, het heeft U beliefd te zegenen het huis Uws knechts, dat het in eeuwigheid voor Uw aangezicht zij; want Gij, HEERE, hebt het gezegend, en het zal gezegend zijn in eeuwigheid."},"KJV":{"1":"Now it came to pass, as David sat in his house, that David said to Nathan the prophet, Lo, I dwell in an house of cedars, but the ark of the covenant of the LORD remaineth under curtains.","2":"Then Nathan said unto David, Do all that is in thine heart; for God is with thee.","3":"And it came to pass the same night, that the word of God came to Nathan, saying,","4":"Go and tell David my servant, Thus saith the LORD, Thou shalt not build me an house to dwell in:","5":"For I have not dwelt in an house since the day that I brought up Israel unto this day; but have gone from tent to tent, and from one tabernacle to another.","6":"Wheresoever I have walked with all Israel, spake I a word to any of the judges of Israel, whom I commanded to feed my people, saying, Why have ye not built me an house of cedars?","7":"Now therefore thus shalt thou say unto my servant David, Thus saith the LORD of hosts, I took thee from the sheepcote, even from following the sheep, that thou shouldest be ruler over my people Israel:","8":"And I have been with thee whithersoever thou hast walked, and have cut off all thine enemies from before thee, and have made thee a name like the name of the great men that are in the earth.","9":"Also I will ordain a place for my people Israel, and will plant them, and they shall dwell in their place, and shall be moved no more; neither shall the children of wickedness waste them any more, as at the beginning,","10":"And since the time that I commanded judges to be over my people Israel. Moreover I will subdue all thine enemies. Furthermore I tell thee that the LORD will build thee an house.","11":"And it shall come to pass, when thy days be expired that thou must go to be with thy fathers, that I will raise up thy seed after thee, which shall be of thy sons; and I will establish his kingdom.","12":"He shall build me an house, and I will stablish his throne for ever.","13":"I will be his father, and he shall be my son: and I will not take ➔ my mercy away from him, as I took it from him that was before thee:","14":"But I will settle him in mine house and in my kingdom for ever: and his throne shall be established for evermore.","15":"According to all these words, and according to all this vision, so did Nathan speak unto David.","16":"And David the king came and sat before the LORD, and said, Who am I, O LORD God, and what is mine house, that thou hast brought me hitherto?","17":"And yet this was a small thing in thine eyes, O God; for thou hast also spoken of thy servant's house for a great while to come, and hast regarded me according to the estate of a man of high degree, O LORD God.","18":"What can ➔ David speak more to thee for the honour of thy servant? for thou knowest thy servant.","19":"O LORD, for thy servant's sake, and according to thine own heart, hast thou done all this greatness, in making known all these great things.","20":"O LORD, there is none like thee, neither is there any God beside thee, according to all that we have heard with our ears.","21":"And what one nation in the earth is like thy people Israel, whom God went to redeem to be his own people, to make thee a name of greatness and terribleness, by driving out nations from before thy people, whom thou hast redeemed out of Egypt?","22":"For thy people Israel didst thou make thine own people for ever; and thou, LORD, becamest their God.","23":"Therefore now, LORD, let the thing that thou hast spoken concerning thy servant and concerning his house be established for ever, and do as thou hast said.","24":"Let it even be established, that thy name may be magnified for ever, saying, The LORD of hosts is the God of Israel, even a God to Israel: and let the house of David thy servant be established before thee.","25":"For thou, O my God, hast told thy servant that thou wilt build him an house: therefore thy servant hath found in his heart to pray before thee.","26":"And now, LORD, thou art God, and hast promised this goodness unto thy servant:","27":"Now therefore let it please thee to bless the house of thy servant, that it may be before thee for ever: for thou blessest, O LORD, and it shall be blessed for ever."}},"tsk":{"1":[{"kopje":"toen David","refs":["2 Sam 7:1","2 Sam 7:2-17","2 Kron 6:7-9","Dan 4:4","Dan 4:29","Dan 4:30"]},{"kopje":"Nathan","refs":["1 Kron 29:29","2 Sam 12:1","2 Sam 12:25","1 Kon 1:8","1 Kon 1:23","1 Kon 1:44"]},{"kopje":"ik woon","refs":["1 Kron 14:1","Jer 22:15","Hagg 1:4","Hagg 1:9"]},{"kopje":"de ark","refs":["Ps 132:5","Hand 7:46"]},{"kopje":"onder gordijnen","refs":["1 Kron 17:5","1 Kron 15:1","1 Kron 16:1","Ex 40:19-21","2 Sam 6:17","2 Kron 1:4"]}],"2":[{"kopje":"Doe alles","refs":["1 Kron 22:7","1 Kron 28:2","Joz 9:14","1 Sam 16:7","Ps 20:5","1 Kor 13:9"]},{"kopje":"want God","refs":["1 Sam 10:7","2 Sam 7:3","Zach 8:23","Luk 1:28"]}],"3":[{"kopje":"woord","refs":["Num 12:6","2 Kon 20:1-5","Jes 30:21","Amos 3:7"]}],"4":[{"kopje":"zeg","refs":["Jes 55:8","Jes 55:9","Rom 11:33","Rom 11:34"]},{"kopje":"U zult voor Mij geen","refs":["1 Kron 22:7","1 Kron 22:8","1 Kron 28:2","1 Kron 28:3","2 Sam 7:4","2 Sam 7:5","1 Kon 8:19","2 Kron 6:8","2 Kron 6:9"]}],"5":[{"kopje":"gewoond","refs":["2 Sam 7:6","1 Kon 8:27","2 Kron 2:6","2 Kron 6:18","Jes 66:1","Jes 66:2","Hand 7:44-50"]},{"kopje":"van tent naar tent","refs":["Ex 40:2","Ex 40:3","2 Sam 6:17","1 Kon 8:4","1 Kon 8:16"]}],"6":[{"kopje":"gewandeld","refs":["Ex 33:14","Ex 33:14","Ex 33:15","Ex 40:35-38","Lev 26:11","Lev 26:12","Num 10:33-36","Deut 23:14","2 Kor 6:16","Openb 2:1"]},{"kopje":"de richters","refs":["Richt 2:16-18","1 Sam 12:11","2 Sam 7:7","Hand 13:20"]},{"kopje":"weiden","refs":["1 Kron 11:2","Ps 78:71","Ps 78:72","Jer 23:4","Ezech 34:2","Mic  <span class=\"wl\" data-l=\"L6\" data-code=\"H5769\">eeuwigheid</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5769\">voor</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6440\">Uw</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6440\">aangezicht</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6440\">zal</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3588\">zijn</span>; <span class=\"wl\" data-l=\"L8\" data-code=\"H3588\">want</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H859\">U</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H1288\">HEERE</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H1288\">hebt</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1288\">het</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1288\">gezegend</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H1288\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1288\">het</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1288\">zal</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1288\">gezegend</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1288\">zijn</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H5769\">in</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H5769\">eeuwigheid</span>."},"koppeling_kjv":{"1":"Now it came to pass, as <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> Lo, I <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H730\">cedars,</span> but the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> remaineth under <span class=\"wl wl-kjv\" data-code=\"H3407\">curtains.</span>","2":"Then <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">Do</span> all that is in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart;</span> for <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is with thee.","3":"And it came to pass the same <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> came to <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","4":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> me an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to dwell <span class=\"wl wl-kjv\" data-code=\"H3427\">in:</span>","5":"For I have not dwelt <span class=\"wl wl-kjv\" data-code=\"H3427\">in</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> since the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that I brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> but have gone from <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> to <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and from one <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> to another.","6":"Wheresoever I have <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> with all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> I a <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> to <span class=\"wl wl-kjv\" data-code=\"H259\">any</span> of the <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> whom I <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> to <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Why have ye not <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> me an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H730\">cedars?</span>","7":"Now therefore thus shalt thou <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> I <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> thee from the <span class=\"wl wl-kjv\" data-code=\"H5116\">sheepcote,</span> even from <span class=\"wl wl-kjv\" data-code=\"H310\">following</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> that thou shouldest be <span class=\"wl wl-kjv\" data-code=\"H5057\">ruler</span> over my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span>","8":"And I have been with thee whithersoever thou hast <span class=\"wl wl-kjv\" data-code=\"H1980\">walked,</span> and have cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> all thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, and have <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> thee a <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> like the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the great <span class=\"wl wl-kjv\" data-code=\"H1419\">men</span> that are in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth.</span>","9":"Also I will <span class=\"wl wl-kjv\" data-code=\"H7760\">ordain</span> a <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> for my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> them, and they shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in their place, and shall be <span class=\"wl wl-kjv\" data-code=\"H7264\">moved</span> no more; neither shall the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5766\">wickedness</span> <span class=\"wl wl-kjv\" data-code=\"H1086\">waste</span> them any <span class=\"wl wl-kjv\" data-code=\"H3254\">more,</span> as at the <span class=\"wl wl-kjv\" data-code=\"H7223\">beginning,</span>","10":"And since the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> that I <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> to be over my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span> Moreover I will <span class=\"wl wl-kjv\" data-code=\"H3665\">subdue</span> all thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies.</span> Furthermore I <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> thee that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> thee an <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","11":"And it shall come to pass, when thy <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> be <span class=\"wl wl-kjv\" data-code=\"H4390\">expired</span> that thou must <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to be with thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> that I will raise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> thee, which shall be of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3559\">establish</span> his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom.</span>","12":"He shall <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> me an <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3559\">stablish</span> his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>","13":"I will be his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and he shall be my <span class=\"wl wl-kjv\" data-code=\"H1121\">son:</span> and I will not <span class=\"wl wl-kjv\" data-code=\"H5493\">take</span> ➔ my <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> from him, as I <span class=\"wl wl-kjv\" data-code=\"H5493\">took</span> it from him that was <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee:","14":"But I will <span class=\"wl wl-kjv\" data-code=\"H5975\">settle</span> him in mine <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> and in my <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> and his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">evermore.</span>","15":"According to all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> and according to all this <span class=\"wl wl-kjv\" data-code=\"H2377\">vision,</span> so did <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","16":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who am I, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and what is mine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> me <span class=\"wl wl-kjv\" data-code=\"H1988\">hitherto?</span>","17":"And yet this was a small <span class=\"wl wl-kjv\" data-code=\"H6994\">thing</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> O <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> for thou hast also <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for a great while to <span class=\"wl wl-kjv\" data-code=\"H7350\">come,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H7200\">regarded</span> me according to the <span class=\"wl wl-kjv\" data-code=\"H8448\">estate</span> of a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> of high <span class=\"wl wl-kjv\" data-code=\"H4609\">degree,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","18":"What <span class=\"wl wl-kjv\" data-code=\"H3254\">can</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> speak <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> to thee for the <span class=\"wl wl-kjv\" data-code=\"H3519\">honour</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant?</span> for thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant.</span>","19":"O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> for thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant's</span> sake, and according to thine own <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> hast thou <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> all this <span class=\"wl wl-kjv\" data-code=\"H1420\">greatness,</span> in making <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> all these great <span class=\"wl wl-kjv\" data-code=\"H1420\">things.</span>","20":"O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> there is none like thee, neither is there any <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2108\">beside</span> thee, according to all that we have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> with our <span class=\"wl wl-kjv\" data-code=\"H241\">ears.</span>","21":"And what <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is like thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> whom <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem</span> to be his own <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thee a <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of <span class=\"wl wl-kjv\" data-code=\"H1420\">greatness</span> and <span class=\"wl wl-kjv\" data-code=\"H3372\">terribleness,</span> by driving <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> whom thou hast <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt?</span>","22":"For thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> didst thou <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> thine own <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever;</span> and thou, <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> becamest their <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","23":"Therefore now, <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> let the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> concerning thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> and concerning his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> be <span class=\"wl wl-kjv\" data-code=\"H539\">established</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> as thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">said.</span>","24":"Let it even be <span class=\"wl wl-kjv\" data-code=\"H539\">established,</span> that thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> may be <span class=\"wl wl-kjv\" data-code=\"H1431\">magnified</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> is the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> even a <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and let the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> be <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee.","25":"For thou, O my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> hast <span class=\"wl wl-kjv\" data-code=\"H1540\">told</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> that thou wilt <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> him an <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> therefore thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> hath <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in his heart to <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee.","26":"And now, <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> thou art <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H1696\">promised</span> this <span class=\"wl wl-kjv\" data-code=\"H2896\">goodness</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant:</span>","27":"Now therefore let it <span class=\"wl wl-kjv\" data-code=\"H2974\">please</span> thee to <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> that it may be <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> for thou <span class=\"wl wl-kjv\" data-code=\"H1288\">blessest,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"geschiedde","tekst":"Deze historie wordt ook beschreven 2Sa 7 , bijna met dezelfde woorden; zie aldaar breder verklaring der duistere plaatsen."},{"catchword":"als David","tekst":"Dat is, toen hij tot rust en vrede gekomen was."}],"5":[{"catchword":"opgevoerd","tekst":"2Sa 7:6 staat hierbij, uit Egypte."},{"catchword":"Ik ben","tekst":"Dit wordt gezegd ten aanzien dat de tabernakel in geen vaste plaats is gebleven, zowel toen Israël in de woestijn was, als toen het in het land Kanaän is geweest."},{"catchword":"gegaan","tekst":"Hebreeuws, geweest."},{"catchword":"van tent tot tent,","tekst":"Hebreeuws, uit de tent in de tent."}],"6":[{"catchword":"Overal,","tekst":"Dat is, waarheen de ark des verbonds gebracht werd, boven welke Ik mijne tegenwoordigheid betoon."}],"9":[{"catchword":"niet meer","tekst":"Dat is, het zal van de ene plaats tot de andere niet vervoerd worden."},{"catchword":"kinderen","tekst":"Dat is, de boze mensen, die geheel ter ongerechtigheid overgegeven zijn."}],"10":[{"catchword":"vernederd;","tekst":"Dat is, gedempt, tenonder gebracht."},{"catchword":"dat u","tekst":"Dat is, dat Hij u nakomelingen geven zou, die uw koninkrijk zouden beërven. Zie onder, vs.25, 27."},{"catchword":"de HEERE","tekst":"Dat is, Ik, want de Heere spreekt hier."}],"11":[{"catchword":"uw dagen","tekst":"Te weten, de dagen uws levens."},{"catchword":"dat gij heengaat","tekst":"Dat is, dat gij sterven zult."},{"catchword":"zal Ik","tekst":"Vergelijk 2Sa 7:12 met de aantekening."},{"catchword":"zijn koninkrijk","tekst":"Versta hier, niet alleen Salomo en andere nakomelingen van David, maar ook Christus zelf; want Salomo's rijk heeft niet altoos geduurd, maar het rijk van Christus duurt in eeuwigheid. Vergelijk Luk 1:32-33 ."}],"12":[{"catchword":"Die","tekst":"Salomo heeft een huis van hout en steen getimmerd, maar Christus een geestelijk huis, hetwelk is zijn kerk."},{"catchword":"tot in der eeuwigheid","tekst":"Dat past alleen op Christus, niet op Salomo."}],"13":[{"catchword":"die voor u","tekst":"Hierbij verstaat hij Saul, die vanwege zijn ongehoorzaamheid van het koninkrijk afgestoten is."}],"14":[{"catchword":"in Mijn Koninkrijk","tekst":"Dat is, in mijn kerk."}],"15":[{"catchword":"Naar al deze","tekst":"Dat is, naar al deze woorden door gezichten geopenbaard en bevolen."}],"16":[{"catchword":"bleef","tekst":"Te weten, zolang totdat hij zijn gebed geëindigd had, hetwelk hier volgt."},{"catchword":"voor het aangezicht","tekst":"Versta dit alzo, dat David voor de ark des verbonds gezeten heeft, die een teken was van de tegenwoordigheid des Heeren."},{"catchword":"Wie ben ik,","tekst":"Zie Gen 32:10 ."},{"catchword":"tot hiertoe","tekst":"Te weten, tot de koninklijke waardigheid."}],"17":[{"catchword":"tot van verre","tekst":"Dat is, van zaken, die nog ver zijn, en die eerst lang na mijn tijd zouden geschieden."},{"catchword":"Gij hebt mij","tekst":"Zie 2Sa 7:19 . Of aldus: Gij hebt mij aangezien naar de wijze eens mensen van hogen staat, [te weten, daar ik maar een schaapsherder was]."},{"catchword":"naar menselijke wijze","tekst":"Te weten, mij door Nathan zeer goedertierenlijk aansprekende. Hebreeuws, naar de wijze [of orde] eens mensen."},{"catchword":"verhoging,","tekst":"Of, voortreffelijkheid, of uitnemendheid."}],"18":[{"catchword":"Wat zal David","tekst":"Alsof hij zeide: Mij ontbreken woorden om uw weldaden naar behoren te roemen."},{"catchword":"aan Uw knecht?","tekst":"Te weten, bewezen."}],"19":[{"catchword":"om Uws knechts wil,","tekst":"Door den knecht des Heeren verstaan hier sommigen Jezus Christus den Zaligmaker, den vaderen beloofd, gelijk Isa 49:6 , en elders."},{"catchword":"naar Uw hart,","tekst":"Dat is, naar uw goedgunstigheid."}],"20":[{"catchword":"naar alles,","tekst":"Hetwelk blijkt en bewezen wordt met al de wonderwerken en daden, die Gij van den aanbeginne der wereld hebt gedaan, inzonderheid aan onze vaderen, gelijk wij van hen gehoord hebben."}],"21":[{"catchword":"hetwelk God","tekst":"Israël heeft God niet gezocht, maar God heeft Israël gezocht en zich tot een volk verkoren, om zich toe te eigenen en te heiligen. Dit is ook te verstaan van het geestelijke Israël, dat is de uitverkoren kinderen Gods; want niemand komt tot Christus, de fontein des levens, tenzij dat de Vader hem trekke."}],"24":[{"catchword":"het worde waar,","tekst":"Te weten, dat Gij tot uw knecht gesproken hebt."}],"25":[{"catchword":"hebt voor het oor","tekst":"Te weten, door den profeet Nathan, hem te kennen gevende wat Gij in uw raad over hem besloten hebt."},{"catchword":"in zijn hart","tekst":"Dit is hier ingevoegd uit 2Sa 7:27 ."},{"catchword":"te bidden","tekst":"Wat David te dezer tijd gebeden heeft, wordt breder beschreven 2Sa 7 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now it came to pass when David dwelt in his house: [That kis, when he had attained to rest and peace] that David said unto Nathan the Prophet, Behold, I dwell in an house of Cedar, but the Ark of the Covenant of the LORD (remaineth) under curtains. [this History is also described, 2 Sam.7. almost verbatim. See there a more large Exposition of obscure places.]"}],"2":[{"catchword":null,"tekst":"Then Nathan said unto David, Do all that is in thine heart for God is with thee."}],"3":[{"catchword":null,"tekst":"But it came to pass the same night, that the Word of God came to Nathan, saying,"}],"4":[{"catchword":null,"tekst":"Go, and say unto David my servant, Thus saith the LORD: Thou shalt build me no house to dwell in."}],"5":[{"catchword":null,"tekst":"For I have dwelt in no house from that day that I brought up Israel [Understand, out of Egypt, from 2 Sam.7.5.] unto this day: but have gone [Hebr. been] from Tent to Tent [heb. out of the tent unto the Tent] and from Tabernacle (to Tabernacle.) This is said in regard the Tabernacle continued not in any fixed place, neither when Israel was in the wilderness, nor when they were in the land of Canaan.]"}],"6":[{"catchword":null,"tekst":"Where so ever I have walked with all Israel, [That is, where so ever the Ark of the Covenant was brought, upon which I do manifest my presence] spake I a word to one of the judges of Israel, whom I commanded to feed my people, saying, why do ye not build me an house of Cedar?"}],"7":[{"catchword":null,"tekst":"Now then, thus shalt thou say unto my servant, unto David, thus saith the LORD of hosts, I took thee from the sheepfold, from after the sheep, that thou shouldest be a Leader over my people Israel."}],"8":[{"catchword":null,"tekst":"And I have been with thee whither so ever thou hast gone, etc I have destroy all thine enemies from before thy face: and I have made thee a name, as the name of Great (men) is, that are upon the earth."}],"9":[{"catchword":null,"tekst":"And I have appointed a place for my people Israel, and planted him, that be may dwell in his place, and be no more driven to and fro, [That is, they shall not be transported from one place to another] and the children of perverseness [that is, wicked men that are wholly given up to iniquity] shall not weaken them any more as at the first."}],"10":[{"catchword":null,"tekst":"And from those days that I commanded judges to be over my people Israel: and have humbled [That is, quelled, subdued] all thine enemies: I have also told thee, that the LORD [that is, I; for the Lord speaketh here] will build thee an house. [that is, that he will give thee posterity to inherit thy Kingdom. See below v.25,27.]"}],"11":[{"catchword":null,"tekst":"And it shall come to pass, when thy days [To wit, the days of thy life] shall be fulfilled, that thou goest to thy Fathers, [that is, that thou shalt die] then I wil cause thy seed to rise up after thee, [Compare 2 Sam.7.v.12. with the annotate.] which shall be of thy sons, and I will establish his kingdom. [Understand here not onely Salomon, and other of Davids posterity, but also Christ himself; for Salomon Kingdom did not continued always, but Christs Kingdom continueth for ever, Luk.1.32,33.]"}],"12":[{"catchword":null,"tekst":"He shall build me an house: [Salomon built an house of wood and stone, but Christ a spiritual house, which is his Church] and I will establish his throne for ever. [this suiteth onely with Christ, not with Salomon.]"}],"13":[{"catchword":null,"tekst":"I will be a Father unto him, and he shall be a son unto me: and I will not turn my mercy (away) from him, as I took (the same) away from him that was before thee. [He meaneth hereby Saul, who for his disobedience was deposed from the Kingdom.]"}],"14":[{"catchword":null,"tekst":"But I will settle him in mine house, and in my kingdom [that is, in my church] for ever, and his throne shall be establish forever."}],"15":[{"catchword":null,"tekst":"According to all these words, and according to all this vision; [That is, according to all these words, revealed and commanded by visions] so did Nathan speak unto David."}],"16":[{"catchword":null,"tekst":"Then David the King came in, and continued [To wit, so long, until he had finished his prayer, which followeth here.] before the face of the LORD: [understand this thus, that David sat before the Ark of the Covenant, which was a token of Gods presence] and he said, who am I, LORD God? [see Gen 32:10.] and what is mine house, that thou hast brought me hither to? [to wit, to the Royal Dignity.]"}],"17":[{"catchword":null,"tekst":"And this was (a) small (thing) kin thine eyes, O God, therefore thou hast spoken of thy servants house for a great while hence, [That is, of things that are yet altar off, and which should not come to pass till along while after my time] and thou hast furnished me with this exaltation [or, excellence, or, eminency] after the manner of men, [to wit, speaking unto me most graciously by Nathan. Heb. after the manner (or order) of a man. See 2 Sam.7.9. Or thus: Thou hast regarded me after the manner of a man of high degree to wit, whereas I was before but a shepherd.] O LORD God."}],"18":[{"catchword":null,"tekst":"What shall David add thereunto more with thee, concerning the honor [To wit, done, or shewed] to thy servant? [as if he had said, Words do fail me, to set forth and publish thy mercies as they ought to be proclaimed] but thou knowest thy servant well."}],"19":[{"catchword":null,"tekst":"LORD, for thy servants sake, [By the servant of the Lord some do here understand our Saviour Jesus Christ promised unto the fathers; as Isa.chap.49. vers.6. and elsewhere] and according to thine heart [that is, according to thy loving kindness] hast thou done all these great things: to make known all these great things."}],"20":[{"catchword":null,"tekst":"LORD, there is none like unto thee, and there is no God besides thee, according to all that we have heard with our ears. [Which appeareth, and is made manifest by all the wonderful works & acts, which thou hast done since the world began, especially unto our Fathers, as we have heard of them.]"}],"21":[{"catchword":null,"tekst":"And who is like unto thy people Israel, an onely people upon the earth, whom God went to redeem (to be) a people unto himself, [Israel sought not God, but God sought Israel, and chose them for his people, to consecrate and set them apart for himself. This is also to be understood of spiritual Israel; that is, the elect children of God: for no man cometh to Christ the fountain of life, unless the Father draw him.] that thou mightiest make thee a name of great and terrible things, by driving out the Heathen from the face of thy people, whom thou hast delivered out of Egypt."}],"22":[{"catchword":null,"tekst":"And thou hast made thy people Israel (to be) a people unto thee for ever: and thou LORD didst become a God unto them."}],"23":[{"catchword":null,"tekst":"Now then, LORD, that word that thou hast spoken concerning thy servant, and concerning his house, let that be versified for ever; and do according as thou hast spoken."}],"24":[{"catchword":null,"tekst":"Yea let it be verified [To wit, that which thou hast spoken unto thy servant] and let thy Name be magnified for ever; let it be said, The LORD of hosts, the thy servant be established before thy face."}],"25":[{"catchword":null,"tekst":"For thou, my God, hast revealed before the ear of thy servant, [to wit, discovering unto him by Nathan the Prophet, what thou in thy counsel hast determined concerning him] that wilt build him an house: therefore hath thy servant found (in his heart) [this is here inserted out of 2 Sam. Chap.7. ver.27.] to pray before thy face. [what David prayed at this time is described more largely, 2 Sam.chap.7.]"}],"26":[{"catchword":null,"tekst":"Now then, LORD, thou art that God: and thou hast spoken this good (thing) concerning thy servant."}],"27":[{"catchword":null,"tekst":"No (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
