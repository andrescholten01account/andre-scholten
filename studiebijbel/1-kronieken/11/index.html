00\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4677\">Mezobaja</span>."}, "koppeling_kjv": {"1": "Then all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> themselves to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> unto <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, we are thy <span class=\"wl wl-kjv\" data-code=\"H6106\">bone</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh.</span>", "2": "And moreover in <span class=\"wl wl-kjv\" data-code=\"H8543\">time</span> <span class=\"wl wl-kjv\" data-code=\"H8032\">past,</span> even when <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> was <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> thou wast he that leddest <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> and broughtest <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto thee, Thou shalt <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and thou shalt be <span class=\"wl wl-kjv\" data-code=\"H5057\">ruler</span> over my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "3": "Therefore <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> all the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron;</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with them in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and they <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel.</span>", "4": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> which is <span class=\"wl wl-kjv\" data-code=\"H2982\">Jebus;</span> where the <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusites</span> were, the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>", "5": "And the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H2982\">Jebus</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> hither. Nevertheless <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H4686\">castle</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> which is the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>", "6": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Whosoever <span class=\"wl wl-kjv\" data-code=\"H5221\">smiteth</span> the <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusites</span> <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">captain.</span> So <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">went</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and was <span class=\"wl wl-kjv\" data-code=\"H7218\">chief.</span>", "7": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H4679\">castle;</span> therefore they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> it the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>", "8": "And he <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> even from <span class=\"wl wl-kjv\" data-code=\"H4407\">Millo</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about:</span> and <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">repaired</span> the <span class=\"wl wl-kjv\" data-code=\"H7605\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>", "9": "So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">waxed</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">greater</span> and <span class=\"wl wl-kjv\" data-code=\"H1419\">greater:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> was with him.", "10": "These also are the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> whom <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had, who <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> themselves with him in his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom,</span> and with all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to make him <span class=\"wl wl-kjv\" data-code=\"H4427\">king,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> concerning <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "11": "And this is the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> whom <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had; <span class=\"wl wl-kjv\" data-code=\"H3434\">Jashobeam,</span> an <span class=\"wl wl-kjv\" data-code=\"H2453\">Hachmonite,</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H7991\">captains:</span> he lifted <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> against <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> by him at <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">time.</span>", "12": "And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him was <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1734\">Dodo,</span> the <span class=\"wl wl-kjv\" data-code=\"H266\">Ahohite,</span> who was one of the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1368\">mighties.</span>", "13": "He was with <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> at <span class=\"wl wl-kjv\" data-code=\"H6450\">Pasdammim,</span> and there the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> were gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> where was a <span class=\"wl wl-kjv\" data-code=\"H2513\">parcel</span> of <span class=\"wl wl-kjv\" data-code=\"H7704\">ground</span> <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>", "14": "And they <span class=\"wl wl-kjv\" data-code=\"H3320\">set</span> themselves in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of that <span class=\"wl wl-kjv\" data-code=\"H2513\">parcel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> it, and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> them by a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8668\">deliverance.</span>", "15": "Now <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> of the <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">captains</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> into the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> of <span class=\"wl wl-kjv\" data-code=\"H5725\">Adullam;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H7497\">Rephaim.</span>", "16": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was then in the <span class=\"wl wl-kjv\" data-code=\"H4686\">hold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines'</span> <span class=\"wl wl-kjv\" data-code=\"H5333\">garrison</span> was then at <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem.</span>", "17": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H183\">longed,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Oh that one would give me <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> of the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of the <span class=\"wl wl-kjv\" data-code=\"H953\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem,</span> that is at the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate!</span>", "18": "And the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> brake <span class=\"wl wl-kjv\" data-code=\"H1234\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and <span class=\"wl wl-kjv\" data-code=\"H7579\">drew</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> out of the <span class=\"wl wl-kjv\" data-code=\"H953\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem,</span> that was by the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">took</span> it, and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it to <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> but <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of it, but poured it <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span>", "19": "And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2486\">forbid</span> it me, that I should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H2063\">thing:</span> shall I <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of these <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that have put their lives in <span class=\"wl wl-kjv\" data-code=\"H5315\">jeopardy?</span> for with the jeopardy of their <span class=\"wl wl-kjv\" data-code=\"H5315\">lives</span> they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it. Therefore he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> it. These things <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> these <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1368\">mightiest.</span>", "20": "And <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> the <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> he was <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H7969\">three:</span> for lifting <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> against <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred,</span> he <span class=\"wl wl-kjv\" data-code=\"H2491\">slew</span> them, and had a <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> among the <span class=\"wl wl-kjv\" data-code=\"H7969\">three.</span>", "21": "Of the <span class=\"wl wl-kjv\" data-code=\"H7969\">three,</span> he was more <span class=\"wl wl-kjv\" data-code=\"H3513\">honourable</span> than the <span class=\"wl wl-kjv\" data-code=\"H8147\">two;</span> for he was their <span class=\"wl wl-kjv\" data-code=\"H8269\">captain:</span> howbeit he <span class=\"wl wl-kjv\" data-code=\"H935\">attained</span> not to the first <span class=\"wl wl-kjv\" data-code=\"H7969\">three.</span>", "22": "<span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of a <span class=\"wl wl-kjv\" data-code=\"H2428\">valiant</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H6909\">Kabzeel,</span> who had done <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H6467\">acts;</span> he <span cl const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
