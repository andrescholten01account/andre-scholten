ij David in Hebron, en zei: Zie, wij zijn uw gebeente en uw vlees.", "2": "Zelfs al eerder, toen Saul nog koning was, hebt u Israël uitgeleid en ingeleid; ook heeft de HEERE, uw God, tot u gezegd: U zult Mijn volk Israël weiden, en u zult voorganger zijn over Mijn volk Israël.", "3": "Ook kwamen alle oudsten van Israël naar de koning in Hebron, en David maakte een verbond met hen te Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël, naar het woord van de HEERE, door de dienst van Samuël.", "4": "En David trok op, en heel Israël, naar Jeruzalem, dat is Jebus; want daar waren de Jebusieten, de inwoners van het land.", "5": "En de inwoners van Jebus zeiden tegen David: U zult hier niet binnenkomen. David veroverde toch de burcht Sion, dat is de stad van David.", "6": "Want David zei: Al wie de Jebusieten het eerst verslaat, zal tot hoofd en leider worden. Toen klom Joab, de zoon van Zeruja, er als eerste op; daarom werd hij tot hoofd.", "7": "David nu woonde op de burcht; daarom noemt men die de stad van David.", "8": "En hij bouwde de stad rondom, vanaf Millo af, en rondom heen; en Joab herstelde de rest van de stad.", "9": "En David werd voortdurend groter, want de HEERE van de heerscharen[1] was met hem.", "10": "Dezen nu waren de hoofden van de helden die David had, die zich dapper bij hem gedragen hebben in zijn koninkrijk bij heel Israël, om hem koning te maken, naar het woord van de HEERE over Israël.", "11": "Dezen nu zijn het aantal van de helden die David had: Jasobam, de zoon van Hachmoni, was het hoofd van de dertig; hij zwaaide zijn speer tegen driehonderd man en versloeg hen op eenmaal.", "12": "En na hem was Eleazar, de zoon van Dodo, de Ahohiet; hij was een van de drie helden.", "13": "Hij was met David te Pas-Dammim, toen de Filistijnen daar ten strijde verzameld waren, en het stuk akker vol gerst was, en het volk voor het aangezicht van de Filistijnen vluchtte;", "14": "En zij stelden zich op in het midden van dat stuk, en beschermden het, en zij versloegen de Filistijnen; en de HEERE verloste hen door een grote verlossing.", "15": "En drie van de dertig hoofden trokken naar de rots naar David, in de spelonk van Adullam; en het leger van de Filistijnen had zich gelegerd in het dal Refaïm.", "16": "En David was toen in de vesting, en de bezetting van de Filistijnen was toen in Bethlehem.", "17": "En David kreeg dorst, en zei: Wie zal mij water te drinken geven uit de bron van Bethlehem, die onder de poort is?", "18": "Toen braken die drie door het leger van de Filistijnen, en putten water uit de bron van Bethlehem, die onder de poort is, en zij droegen het en brachten het naar David. Maar David wilde het niet drinken, maar hij goot het uit voor de HEERE;", "19": "En hij zei: Dat mijn God dit verre van mij houdt, dat ik zoiets zou doen! Zou ik het bloed van deze mannen drinken? Met gevaar voor hun leven, ja, met gevaar voor hun leven hebben zij dat gebracht. En hij wilde het niet drinken. Dit deden de drie helden.", "20": "Abisai nu, de broer van Joab, was ook het hoofd van drie; hij zwaaide zijn speer tegen driehonderd man en versloeg hen; zo had hij een naam onder die drie.", "21": "Van die drie was hij geëerd boven de twee; daarom werd hij hun tot leider; maar hij kwam niet aan de *eerste* drie toe.", "22": "Benaja, de zoon van Jojada, de zoon van een dapper man uit Kabzeël, was groot van daden; hij versloeg twee sterke leeuwen van Moab; ook ging hij af, en versloeg een leeuw in het midden van het kuil, in de sneeuwtijd.", "23": "Hij versloeg ook een Egyptische man, een man van grote lengte, van vijf ellen; en die Egyptenaar had een speer in de hand, als een weversboom; maar hij ging naar hem af met een staf, en rukte de speer uit de hand van de Egyptenaar, en hij doodde hem met zijn *eigen* speer.", "24": "Deze dingen deed Benaja, de zoon van Jojada; daardoor had hij een naam onder die drie helden.", "25": "Zie, hij was de meest geëerde van die dertig; toch kwam hij niet aan de drie toe. En David stelde hem over zijn lijfwacht.", "26": "De helden nu van de legers waren: Asahel, de broer van Joab; Elhanan, de zoon van Dodo, van Bethlehem;", "27": "Sammoth, de Harodiet; Helez, de Peloniet;", "28": "Ira, de zoon van Ikkes, de Thekoiet; Abiëzer, de Anathothiet;", "29": "Sibbechai, de Husathiet; Ilai, de Ahohiet;", "30": "Maharai, de Netofathiet; Heled, de zoon van Baäna, de Netofathiet;", "31": "Ithai, de zoon van Ribai, uit Gibea van de kinderen van Benjamin; Benaja, de Pirhathoniet;", "32": "Hurai, uit de beken van Gaäs; Abiël, de Arbathiet;", "33": "Azmaveth, de Baharumiet; Eljahba, de Saälboniet;", "34": "Van de kinderen van Hasem, de Gizoniet, was Jonathan, de zoon van Sage, de Harariet;", "35": "Ahiam, de zoon van Sachar, de Harariet; Elifal, de zoon van Ur;", "36": "Hefer, de Mecherathiet; Ahia, de Peloniet;", "37": "Hezro, de Karmeliet; Naäri, de zoon van Ezbai;", "38": "Joël, de broer van Nathan; Mibhar, de zoon van Geri;", "39": "Zelek, de Ammoniet; Nahrai, de Berothiet, wapendrager van Joab, de zoon van Zeruja;", "40": "Ira, de Jithriet; Gareb, de Jithriet;", "41": "Uria, de Hethiet; Zabad, de zoon van Ahlai;", "42": "Adina, de zoon van Siza, de Rubeniet, was het hoofd van de Rubenieten; toch waren er dertig bij hem;", "43": "Hanan, de zoon van Maächa, en Josafat, de Mithniet;", "44": "Uzzia, de Asterathiet; Sama en Jeiël, de zonen van Hotham, de Aroeriet;", "45": "Jediaël, de zoon van Simri, en Joha, zijn broer, de Tiziet;", "46": "Eliël, Hammahavim en Jeribai, en Josavia, de zonen van Elnaam; en Jithma, de Moabiet;", "47": "Eliël en Obed, en Jaäziël van Mezobaja."}, "SV": {"1": "Toen vergaderde zich gans Israël tot David naar Hebron, zeggende: Zie, wij zijn uw gebeente en uw vlees.", "2": "Zelfs ook te voren, toen Saul nog koning was, hebt gij Israël uitgeleid en ingeleid; ook heeft de HEERE, uw God, tot u gezegd: Gij zult Mijn volk Israël weiden, en gij zult voorganger zijn van Mijn volk Israël.", "3": "Ook kwamen alle oudsten in Israël tot den koning naar Hebron, en David maakte een verbond met hen te Hebron, voor het aangezicht des HEEREN; en zij zalfden David ten koning over Israël, naar het woord des HEEREN, door den dienst van Samuël.", "4": "En David toog henen, en gans Israël, naar Jeruzalem, welke is Jebus; want daar waren de Jebusieten, de inwoners des lands.", "5": "En de inwoners van Jebus zeiden tot David: Gij zult hier niet inkomen. David dan nog won den burg Sion, welke is de stad Davids.", "6": "Want David zeide: Al wie de Jebusieten het eerst slaat, zal tot een hoofd, en tot een overste worden. Toen beklom Joab, de zoon van Zeruja, dien het eerst; daarom werd hij tot een hoofd.", "7": "David nu woonde op den burg; daarom heet men dien de stad Davids.", "8": "En hij bouwde de stad rondom, van Millo af, en rondom henen; en Joab vernieuwde het overige der stad.", "9": "En David ging geduriglijk voort, en werd groot, want de HEERE der heirscharen was met hem.", "10": "Dezen nu waren de hoofden der helden, die David had, die zich dapper bij hem gedragen hebben in zijn koninkrijk bij geheel Israël, om hem koning te maken, naar het woord des HEEREN over Israël.", "11": "Dezen nu zijn van het getal der helden, die David had: Jasobam, de zoon van Hachmoni, was het hoofd der dertigen, die zijn spies tegen driehonderd opheffende, hen op eenmaal versloeg.", "12": "En na hem was Eleazar, de zoon van Dodo, de Ahohiet; hij was onder die drie helden.", "13": "Hij was met David te Pas-dammim, als de Filistijnen daar ten strijde vergaderd waren, en het stuk des akkers vol gerst was, en het volk voor het aangezicht der Filistijnen vlood;", "14": "En zij stelden zich in het midden van dat stuk, en beschermden het, en zij sloegen de Filistijnen; en de HEERE verloste hen door een grote verlossing.", "15": "En drie uit de dertig hoofden togen af naar den rotssteen tot David in de spelonk van Adullam; en het leger der Filistijnen had zich gelegerd in het dal Refaim.", "16": "En David was toen in de vesting en de bezetting der Filistijnen was toen te Bethlehem.", "17": "En David kreeg lust, en zeide: Wie zal mij water te drinken geven uit Bethlehems bornput, die onder de poort is?", "18": "Toen braken die drie door het leger der Filistijnen, en putten water uit Bethlehems bornput, die onder de poort is, en zij droegen het en brachten het tot David. Doch David wilde het niet drinken, maar hij goot het uit voor den HEERE;", "19": "En hij zeide: Dat late mijn God verre van mij zijn, van zulks te doen! Zou ik het bloed dezer mannen drinken? Met gevaar huns levens, ja, met gevaar huns levens hebben zij dat gebracht. En hij wilde het niet drinken. Dit deden de drie helden.", "20": "Abisai nu, de broeder van Joab, was ook het hoofd van drie; en hij, verheffende zijn spies tegen driehonderd, versloeg hen; alzo had hij een naam onder die drie.", "21": "Uit die drie was hij geëerd boven de twee; daarom werd hij hun tot een overste; maar hij kwam tot aan de *eerste* drie niet.", "22": "Benaja, de zoon van Jojada, de zoon eens dapperen mans van Kabzeel, was groot van daden; hij versloeg twee sterke leeuwen van Moab; ook ging hij af, en versloeg een leeuw in het midden des kuils, in den sneeuwtijd.", "23": "Hij versloeg ook een Egyptischen man, een man van grote lengte, van vijf ellen; en die Egyptenaar had een spies in de hand, als een weversboom; maar hij ging tot hem af met een staf, en rukte de spies uit de hand des Egyptenaars, en hij doodde hem met zijn *eigen* spies.", "24": "Deze dingen deed Benaja, de zoon van Jojada; dies had hij een naam onder die drie helden.", "25": "Ziet, hij was de heerlijkste van die dertig; nochtans kwam hij tot aan de drie niet. En David stelde hem over zijn trawanten.", "26": "De helden nu der heiren waren: Asahel, de broeder van Joab; Elhanan, de zoon van Dodo, van Bethlehem;", "27": "Sammoth, de Harodiet; Helez, de Peloniet;", "28": "Ira, de zoon van Ikkes, de Thekoiet; Abiezer, de Anathothiet;", "29": "Sibbechai, de Husathiet; Ilai, de Ahohiet;", "30": "Maharai, de Netofathiet; Heled, de zoon van Baäna, de Netofathiet;", "31": "Ithai, de zoon van Ribai, van Gibea der kinderen Benjamins; Benaja, de Pirhathoniet;", "32": "Hurai, van de beken van Gaas; Abiël; de Arbathiet;", "33": "Azmaveth, de Baharumiet; Eljahba, de Saalboniet;", "34": "*Van* de kinderen van Hasem, den Gizoniet, was Jonathan, de zoon van Sage, de Harariet;", "35": "Ahiam, de zoon van Sachar, de Harariet; Elifal, de zoon van Ur;", "36": "Hefer, de Mecherathiet; Ahia, de Peloniet;", "37": "Hezro, de Karmeliet; Naäri, de zoon van Ezbai;", "38": "Joël, de broeder van Nathan; Mibhar, de zoon van Geri;", "39": "Zelek, de Ammoniet; Nahrai, de Berothiet, wapendrager van Joab, den zoon van Zeruja;", "40": "Ira, de Jithriet; Gareb, de Jithriet;", "41": "Uria, de Hethiet; Zabad, de zoon van Ahlai;", "42": "Adina, de zoon van Siza, de Rubeniet, was het hoofd der Rubenieten; nochtans waren er dertig boven hem;", "43": "Hanan, de zoon van Maacha, en Josafat, de Mithniet;", "44": "Uzzia, de Asterathiet; Sama, en Jeiel, de zoon van Hotham, den Aroeriet;", "45": "Jediael, de zoon van Simri, en Joha, zijn broeder, de Tiziet;", "46": "Eliël, Hammahavim en Jeribai, en Josavia, de zonen van Elnaam; en Jithma, de Moabiet;", "47": "Eliël en Obed, en Jaaziel van Mezobaja."}, "KJV": {"1": "Then all Israel gathered themselves to David unto Hebron, saying, Behold, we are thy bone and thy flesh.", "2": "And moreover in time past, even when Saul was king, thou wast he that leddest out and broughtest in Israel: and the LORD thy God said unto thee, Thou shalt feed my people Israel, and thou shalt be ruler over my people Israel.", "3": "Therefore came all the elders of Israel to the king to Hebron; and David made a covenant with them in Hebron before the LORD; and they anointed David king over Israel, according to the word of the LORD by Samuel.", "4": "And David and all Israel went to Jerusalem, which is Jebus; where the Jebusites were, the inhabitants of the land.", "5": "And the inhabitants of Jebus said to David, Thou shalt not come hither. Nevertheless David took the castle of Zion, which is the city of David.", "6": "And David said, Whosoever smiteth the Jebusites first shall be chief and captain. So Joab the son of Zeruiah went ➔ first up, and was chief.", "7": "And David dwelt in the castle; therefore they called it the city of David.", "8": "And he built the city round about, even from Millo round about: and Joab repaired the rest of the city.", "9": "So David waxed greater and greater: for the LORD of hosts was with him.", "10": "These also are the chief of the mighty men whom David had, who strengthened themselves with him in his kingdom, and with all Israel, to make him king, according to the word of the LORD concerning Israel.", "11": "And this is the number of the mighty men whom David had; Jashobeam, an Hachmonite, the chief of the captains: he lifted up his spear against three hundred slain by him at one time.", "12": "And after him was Eleazar the son of Dodo, the Ahohite, who was one of the three mighties.", "13": "He was with David at Pasdammim, and there the Philistines were gathered together to battle, where was a parcel of ground full of barley; and the people fled from before the Philistines.", "14": "And they set themselves in the midst of that parcel, and delivered it, and slew the Philistines; and the LORD saved them by a great deliverance.", "15": "Now three of the thirty captains went down to the rock to David, into the cave of Adullam; and the host of the Philistines encamped in the valley of Rephaim.", "16": "And David was then in the hold, and the Philistines' garrison was then at Bethlehem.", "17": "And David longed, and said, Oh that one would give me drink of the water of the well of Bethlehem, that is at the gate!", "18": "And the three brake through the host of the Philistines, and drew water out of the well of Bethlehem, that was by the gate, and took it, and brought it to David: but David would not drink of it, but poured it out to the LORD,", "19": "And said, My God forbid it me, that I should do this thing: shall I drink the blood of these men that have put their lives in jeopardy? for with the jeopardy of their lives they brought it. Therefore he would not drink it. These things did these three mightiest.", "20": "And Abishai the brother of Joab, he was chief of the three: for lifting up his spear against three hundred, he slew them, and had a name among the three.", "21": "Of the three, he was more honourable than the two; for he was their captain: howbeit he attained not to the first three.", "22": "Benaiah the son of Jehoiada, the son of a valiant man of Kabzeel, who had done many acts; he slew two lionlike men of Moab: also he went down and slew a lion in a pit in a snowy day.", "23": "And he slew an Egyptian, a man of great stature, five cubits high; and in the Egyptian's hand was a spear like a weaver's beam; and he went down to him with a staff, and plucked the spear out of the Egyptian's hand, and slew him with his own spear.", "24": "These things did Benaiah the son of Jehoiada, and had the name among the three mighties.", "25": "Behold, he was honourable among the thirty, but attained not to the first three: and David set him over his guard.", "26": "Also the valiant men of the armies were, Asahel the brother of Joab, Elhanan the son of Dodo of Bethlehem,", "27": "Shammoth the Harorite, Helez the Pelonite,", "28": "Ira the son of Ikkesh the Tekoite, Abiezer the Antothite,", "29": "Sibbecai the Hushathite, Ilai the Ahohite,", "30": "Maharai the Netophathite, Heled the son of Baanah the Netophathite,", "31": "Ithai the son of Ribai of Gibeah, that pertained to the children of Benjamin, Benaiah the Pirathonite,", "32": "Hurai of the brooks of Gaash, Abiel the Arbathite,", "33": "Azmaveth the Baharumite, Eliahba the Shaalbonite,", "34": "The sons of Hashem the Gizonite, Jonathan the son of Shage the Hararite,", "35": "Ahiam the son ref": "../../nave/j/?hl=1Chr.11.46#i11787", "refs": [{"disp": "1 Kron 11:46", "href": "../../1-kronieken/11/#v46", "ref": "1 Kron 11:46", "svLabel": null}], "kinderen": []}]}]}, "47": {"nave": [{"topic": "Eliel", "href": "../../nave/e/#t-eliel", "kinderen": [{"label": "4. Three of David's heroes, bearing the same name", "href": "../../nave/e/?hl=1Chr.11.47#i6037", "refs": [{"disp": "1 Kron 11:46", "href": "../../1-kronieken/11/#v46", "ref": "1 Kron 11:46", "svLabel": null}, {"disp": "1 Kron 11:47", "href": "../../1-kronieken/11/#v47", "ref": "1 Kron 11:47", "svLabel": null}, {"disp": "1 Kron 12:11", "href": "../../1-kronieken/12/#v11", "ref": "1 Kron 12:11", "svLabel": null}], "kinderen": []}]}, {"topic": "Jasiel", "href": "../../nave/j/#t-jasiel", "kinderen": [{"label": "One of David's warriors", "href": "../../nave/j/?hl=1Chr.11.47#i10312", "refs": [{"disp": "1 Kron 11:47", "href": "../../1-kronieken/11/#v47", "ref": "1 Kron 11:47", "svLabel": null}], "kinderen": []}]}, {"topic": "Obed", "href": "../../nave/o/#t-obed", "kinderen": [{"label": "3. One of David's heroes", "href": "../../nave/o/?hl=1Chr.11.47#i14775", "refs": [{"disp": "1 Kron 11:47", "href": "../../1-kronieken/11/#v47", "ref": "1 Kron 11:47", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"1 Kron 20:5": "Daarna was er nog een oorlog tegen de Filistijnen, en Elhanan, de zoon van Jaïr, versloeg Lachmi, de broer van Goliath, de Gethiet, wiens speerhout was als een weversboom.", "2 Sam 2:18": "Nu waren daar drie zonen van Zeruja, Joab, en Abisai en Asahel; en Asahel was licht op zijn voeten, als een van de reeën die in het veld zijn.", "Hoogl 8:6": "Zet mij als een zegel op Uw hart, als een zegel op Uw arm; want de liefde is sterk als de dood; de ijver is hard als het graf; haar kolen zijn vurige kolen, vlammen van de Heere.", "Deut 8:8": "Een land van tarwe en gerst, en wijnstokken, en vijgenbomen, en granaatappels; een land van olierijke olijfbomen, en van honing;", "Mark 14:24": "En Hij zei tegen hen: Dat is Mijn bloed, het bloed van het nieuwe testament, dat voor velen vergoten wordt.", "1 Sam 26:6": "Toen antwoordde David en sprak tegen Achimelech, de Hethiet, en tegen Abisai, de zoon van Zeruja, de broer van Joab, en zei: Wie zal met mij naar Saul in het leger afgaan? Toen zei Abisai: Ik zal met u afgaan.", "2 Sam 23:9": "En na hem was Eleazar, de zoon van Dodo, zoon van Ahohi; deze was onder de drie helden met David, toen zij de Filistijnen beschimpten, die daar ten strijde verzameld waren, en de mannen van Israël waren teruggetrokken.", "2 Sam 23:24": "Asahel, Joabs broer, was onder de dertig; Elhanan, de zoon van Dodo, van Bethlehem;", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "1 Kron 27:34": "En na Achitofel was Jojada, de zoon van Benaja, en Abjathar; maar Joab was de legeraanvoerder van de koning.", "2 Sam 23:35": "Hezrai, de Karmeliet; Paërai, de Arbiet;", "Num 31:10": "Verder verbrandden zij al hun steden met hun woonplaatsen, en al hun burchten, met vuur.", "2 Sam 3:17-21": "Abner nu had overleg met de oudsten van Israël, en zei: U hebt David al lang geleden als koning over u gewenst. Doe het nu dan; want de HEERE heeft over David gesproken, en gezegd: Door de hand van David, Mijn dienaar, zal Ik Mijn volk Israël verlossen van de hand van de Filistijnen, en van de hand van al hun vijanden. En Abner sprak ook ten aanhoren van Benjamin. Vervolgens ging Abner ook naar Hebron om ten aanhoren van David alles te vertellen wat goed was in de ogen van Israël, en in de ogen van heel het huis van Benjamin.", "Job 17:9": "En de rechtvaardige zal zijn weg vasthouden, en wie rein van handen is, zal in sterkte toenemen.", "Klaagl 4:11": "Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de gloed van Zijn toorn uitgestort; en Hij heeft in Sion een vuur aangestoken, dat haar fundamenten verteerd heeft.", "2 Sam 23:10": "Deze stond op en sloeg onder de Filistijnen, totdat zijn hand moe werd, ja, zijn hand aan het zwaard kleefde; en de HEERE bracht een grote overwinning tot stand op die dag; en het volk keerde terug achter hem aan, alleen om te plunderen.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "2 Sam 3:17": "Abner nu had overleg met de oudsten van Israël, en zei: U hebt David al lang geleden als koning over u gewenst.", "Richt 19:10-12": "Doch de man wilde niet overnachten, maar stond op, en trok weg, en kwam tot tegenover Jebus (dat is Jeruzalem), met hem het paar gezadelde ezels; ook was zijn bijvrouw bij hem. Toen zij nu bij Jebus waren, was de dag ver gedaald; en de knecht zei tegen zijn heer: Kom toch, laten we naar deze stad van de Jebusieten gaan, en daarin overnachten. Maar zijn heer zei tegen hem: Wij zullen hierheen niet afwijken naar een vreemde stad, die niet van de kinderen van Israël is; maar wij zullen doortrekken tot aan Gibea.", "2 Sam 11:6-27": "Toen zond David naar Joab en zei: Stuur Uria, de Hethiet, naar mij. En Joab stuurde Uria naar David. Toen Uria bij hem kwam, vroeg David hoe het met Joab ging, en hoe het met het volk ging, en hoe het met de strijd stond. Daarna zei David tegen Uria: Ga naar uw huis, en was uw voeten. En toen Uria uit het huis van de koning wegging, volgde hem een gerecht van de koning achterna.", "2 Sam 5:5": "In Hebron regeerde hij over Juda zeven jaar en zes maanden; en in Jeruzalem regeerde hij drieëndertig jaar over heel Israël en Juda.", "2 Sam 6:12": "Toen berichtte men aan koning David: De HEERE heeft het huis van Obed-edom, en alles wat hij heeft, gezegend om de ark van God. Zo ging David heen en haalde de ark van God uit het huis van Obed-edom naar de stad van David, met vreugde.", "2 Sam 23:17-19": "En hij zei: Het zij verre van mij, o HEERE, dat ik dit zou doen; zou ik het bloed drinken van de mannen die heengegaan zijn met gevaar voor hun leven? En hij wilde het niet drinken. Dit deden die drie helden. Abisai, Joabs broer, de zoon van Zeruja, die was ook een hoofd van drie; en hij hief zijn speer op tegen driehonderd man, die door hem verslagen werden; en hij had een naam onder die drie. Was hij niet de meest geëerde van die drie? Daarom werd hij hun tot een aanvoerder. Maar hij kwam niet tot aan die eerste drie.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "2 Sam 23:30": "Benaja, de Pirhathoniet; Hiddai, van de beken van Gaäs;", "2 Sam 19:13": "En tegen Amasa moet u zeggen: Bent u niet mijn gebeente en mijn vlees? God doe mij zo, en meer dan dat, als u niet legeraanvoerder wordt voor mijn aangezicht, alle dagen, in de plaats van Joab.", "Openb 14:1": "En ik zag, en zie, het Lam stond op de berg Sion, en met Hem honderdvierenveertigduizend, die de naam van Zijn Vader geschreven hadden op hun voorhoofden.", "2 Sam 3:30": "Zo hebben Joab en zijn broer Abisaï Abner doodgeslagen, omdat hij hun broer Asaël te Gibeon in de strijd had gedood.", "1 Kron 27:6": "Deze Benaja was een held van de dertig, en stond boven de dertig; en over zijn verdeling was Ammizabad, zijn zoon.", "Joz 10:2": "Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk.", "1 Kon 14:7": "Ga heen, zeg tegen Jerobeam: Zo zegt de HEERE, de God van Israël: Omdat Ik u verheven heb uit het midden van het volk, en u tot een leider over Mijn volk Israël gesteld heb;", "2 Kon 23:30": "En zijn knechten voerden hem dood op een wagen van Megiddo, en brachten hem naar Jeruzalem, en begroeven hem in zijn graf; en het volk van het land nam Joahaz, de zoon van Josia, en zalfde hem, en maakte hem koning in de plaats van zijn vader.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Ps 142:2": "Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem.", "1 Kron 29:27": "De dagen nu dat hij over Israël geregeerd heeft, zijn veertig jaar; in Hebron regeerde hij zeven jaar, en in Jeruzalem regeerde hij drieëndertig jaar.", "2 Sam 21:19": "Verder was er nog een oorlog te Gob tegen de Filistijnen; en Elhanan, de zoon van Jaäre-Oregim, de Bethlehemiet, sloeg de broer van Goliath, de Gethiet, wiens speersteel was als een weversboom.", "Richt 11:11": "Zo ging Jeftha met de oudsten van Gilead, en het volk stelde hem tot hoofd en aanvoerder over zich. En Jeftha sprak al zijn woorden voor het aangezicht van de HEERE te Mizpa.", "Rom 16:4": "die voor mijn leven hun hals gesteld hebben; hun dank ik niet alleen, maar ook alle Gemeenten van de heidenen.", "Jer 41:8": "Doch onder hen werden tien mannen gevonden, die tegen Ismaël zeiden: Dood ons niet, want wij hebben verborgen schatten in het veld, van tarwe, en gerst, en olie, en honing. Zo liet hij af, en doodde hen niet te midden van hun broeders.", "1 Kron 3:4": "Zes zijn hem in Hebron geboren; want hij regeerde daar zeven jaar en zes maanden; en drieëndertig jaar regeerde hij in Jeruzalem.", "2 Sam 21:18": "En het gebeurde daarna, dat er opnieuw een oorlog was te Gob tegen de Filistijnen. Toen sloeg Sibbechai, de Husathiet, Saf, die van de kinderen van Rafa was.", "Ps 48:3": "Schoon van ligging, een vreugde van de hele aarde is de berg Sion, aan de zijden van het noorden; de stad van de grote Koning.", "2 Sam 2:18-23": "Nu waren daar drie zonen van Zeruja, Joab, en Abisai en Asahel; en Asahel was licht op zijn voeten, als een van de reeën die in het veld zijn. En Asahel jaagde Abner achterna; en hij week niet af, om van achter Abner naar rechts of naar links af te gaan. Toen keek Abner achter zich om, en zei: Bent u dit, Asahel? En hij zei: Ik ben het.", "2 Sam 5:6": "En de koning trok met zijn mannen naar Jeruzalem, tegen de Jebusieten, die in dat land woonden. En zij zeiden tegen David: U zult hier niet binnenkomen, maar de blinden en kreupelen zullen u wegjagen; dat wil zeggen: David zal hier niet binnenkomen.", "Num 11:4": "En het gemengde volk, dat in hun midden was, werd bevangen met lust; daarom weenden ook de kinderen van Israël weer, en zeiden: Wie zal ons vlees te eten geven?", "Joh 6:55": "Want Mijn vlees is werkelijk voedsel, en Mijn bloed is werkelijk drank.", "Ps 143:6": "Ik breid mijn handen uit tot U; mijn ziel is voor U als een dorstig land. Sela.", "1 Kron 14:9": "Toen de Filistijnen kwamen, spreidden zij zich uit in het dal van Refaïm.", "1 Sam 28:17": "Want de HEERE heeft voor Zich gedaan, zoals Hij door mijn dienst gesproken heeft; en Hij heeft het koninkrijk uit uw hand gescheurd, en Hij heeft het gegeven aan uw naaste, aan David.", "1 Sam 14:23": "Zo verloste de HEERE Israël op die dag; en het leger trok verder naar Beth-aven.", "1 Kron 15:29": "Het gebeurde nu, toen de ark van het verbond van de HEERE tot aan de stad van David gekomen was, dat Michal, de dochter van Saul, door een venster keek, en koning David zag, springend en spelend; toen verachtte zij hem in haar hart.", "2 Sam 3:21": "Toen zei Abner tegen David: Ik zal opstaan en heengaan, en heel Israël verzamelen bij mijn heer de koning, zodat zij een verbond met u sluiten, en u regeert over alles wat uw hart begeert. Zo liet David Abner gaan, en hij ging in vrede.", "2 Sam 12:26": "Joab nu streed tegen Rabba van de kinderen van Ammon; en hij nam de koninklijke stad in.", "2 Sam 6:16": "En het gebeurde, toen de ark van de HEERE in de stad van David kwam, dat Michal, de dochter van Saul, door het venster uitkeek. Toen zij nu koning David zag, springend en huppelend voor het aangezicht van de HEERE, verachtte zij hem in haar hart.", "Joz 15:16": "En Kaleb zei: Wie Kirjath-sefer zal verslaan en innemen, aan hem zal ik mijn dochter Achsa tot vrouw geven.", "Ef 5:30": "Want wij zijn leden van Zijn lichaam, van Zijn vlees en van Zijn benen.", "2 Sam 23:39": "Uria, de Hethiet, zevenendertig in alles.", "Gen 10:16": "En de Jebusiet, en de Amoriet, en de Girgasiet,", "1 Sam 23:25": "Saul en zijn mannen gingen ook om hem te zoeken. Dat werd David verteld, en hij trok af naar die rots, en bleef in de woestijn van Maon. Toen Saul dat hoorde, joeg hij David na in de woestijn van Maon.", "Joz 15:8": "En deze grens zal opgaan door het dal van de zoon van Hinnom, aan de kant van de Jebusiet van het zuiden, dat is Jeruzalem; en deze grens zal opwaarts gaan tot de top van de berg, die voor het dal van Hinnom is, westwaarts, wat in het uiterste van het dal van de Refaïeten is, tegen het noorden.", "Hand 20:24": "Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.", "Richt 5:18": "Zebulon, het is een volk, dat zijn ziel versmaad heeft ter dood, evenzo Nafthali, op de hoogten van het veld.", "Hand 23:32": "En de volgende dag lieten zij de ruiters met hem verder trekken, en keerden zelf terug naar de legerplaats.", "Rom 6:2": "Dat zij verre. Wij die aan de zonde gestorven zijn, hoe zullen wij nog daarin leven?", "2 Sam 6:10": "David dan wilde de ark van de HEERE niet bij zich laten overbrengen naar de stad van David; maar David deed haar afwijken naar het huis van Obed-edom, de Gethiet.", "2 Sam 5:22": "Daarna trokken de Filistijnen weer op; en zij verspreidden zich in het dal Refaïm.", "1 Kon 2:30": "En Benaja kwam bij de tent van de HEERE, en zei tegen hem: Zo zegt de koning: Kom naar buiten. En hij zei: Nee, hier zal ik sterven! En Benaja bracht het antwoord terug aan de koning en zei: Zo heeft Joab gesproken, en zo heeft hij mij geantwoord.", "1 Sam 15:28": "Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u.", "2 Sam 5:3": "Zo kwamen alle oudsten van Israël naar de koning in Hebron; en koning David sloot met hen een verbond in Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël.", "2 Sam 23:20": "Verder Benaja, de zoon van Jojada, de zoon van een dappere man, groot van daden, uit Kabzeel; die versloeg twee sterke leeuwen van Moab; ook ging hij af, en sloeg een leeuw in het midden van een kuil in de sneeuwtijd.", "Ps 48:14": "Zet uw hart op haar vesting; beschouw nauwkeurig haar paleizen, opdat u het aan het volgende geslacht vertelt.", "Ps 132:13": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei:", "2 Sam 8:2": "Ook sloeg hij de Moabieten, en mat hen met een snoer, en liet hen op de aarde neerliggen; en hij mat met twee snoeren om te doden, en met een vol snoer om in het leven te laten. Zo werden de Moabieten David tot knechten, en zij brachten geschenken.", "1 Kon 1:38": "Toen ging Zadok, de priester, met Nathan, de profeet, en Benaja, de zoon van Jojada, en de Krethi en de Plethi naar beneden, en zij lieten Salomo rijden op de muilezelin van de koning David, en geleidden hem naar Gihon.", "Ps 42:3": "Mijn ziel dorst naar God, naar de levende God; wanneer zal ik binnengaan en voor het aangezicht van God verschijnen?", "1 Sam 10:5": "Daarna zult u komen op de heuvel van God, waar de bezettingen van de Filistijnen zijn; en het zal gebeuren, als u daar in de stad komt, dat u een groep profeten zult ontmoeten, die van de hoogte afkomen, met voor zich uit luiten, en trommels, en pijpen, en harpen, en zij zullen profeteren.", "1 Sam 18:17": "Daarom zei Saul tegen David: Zie, mijn oudste dochter Merab zal ik u tot vrouw geven; alleen, wees mij een dapper man en voer de oorlogen van de HEERE. Want Saul zei: Laat mijn hand niet tegen hem zijn, maar laat de hand van de Filistijnen tegen hem zijn.", "2 Sam 23:16": "Toen braken die drie helden door het leger van de Filistijnen, en putten water uit Bethlehems bornput, die in de poort is, en droegen het, en kwamen bij David; maar hij wilde dat niet drinken, maar goot het uit voor de HEERE.", "Ps 42:2": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God!", "2 Sam 5:6-10": "En de koning trok met zijn mannen naar Jeruzalem, tegen de Jebusieten, die in dat land woonden. En zij zeiden tegen David: U zult hier niet binnenkomen, maar de blinden en kreupelen zullen u wegjagen; dat wil zeggen: David zal hier niet binnenkomen. Maar David nam de burcht Sion in; dat is de stad van David. Want David zei op diezelfde dag: Ieder die de Jebusieten slaat en bij die watergoot komt, en die kreupelen en die blinden, die door Davids ziel gehaat worden, die zal tot een hoofd en tot een leider zijn; daarom zegt men: Een blinde en kreupele zal het huis niet binnenkomen.", "Num 13:22": "En zij trokken op in het zuiden, en kwamen tot Hebron toe, en daar waren Ahiman, Sesai en Talmai, kinderen van Enak; Hebron nu was zeven jaar eerder gebouwd dan Zoan in Egypte.", "1 Sam 17:9": "Als hij tegen mij kan strijden en mij kan verslaan, dan zullen wij u tot knechten zijn; maar als ik hem overwin en hem versla, dan zult u ons tot knechten zijn en ons dienen.", "2 Sam 3:1": "Er was een lange oorlog tussen het huis van Saul en het huis van David. Maar David werd steeds sterker, terwijl het huis van Saul steeds zwakker werd.", "2 Sam 23:28": "Zalmon, de Ahohiet; Maharai, de Netofathiet;", "1 Kron 27:7": "De vierde, in de vierde maand, was Asaël, de broer van Joab, en na hem Zebadja, zijn zoon; in zijn verdeling waren er ook vierentwintigduizend.", "2 Sam 23:26": "Helez, de Paltiet; Ira, de zoon van Ikes, de Thekoiet;", "2 Sam 5:7": "Maar David nam de burcht Sion in; dat is de stad van David.", "1 Sam 23:18": "En die beiden sloten een verbond voor het aangezicht van de HEERE; en David bleef in het woud, maar Jonathan ging naar huis.", "1 Kron 11:22-25": "Benaja, de zoon van Jojada, de zoon van een dapper man uit Kabzeël, was groot van daden; hij versloeg twee sterke leeuwen van Moab; ook ging hij af, en versloeg een leeuw in het midden van het kuil, in de sneeuwtijd. Hij versloeg ook een Egyptische man, een man van grote lengte, van vijf ellen; en die Egyptenaar had een speer in de hand, als een weversboom; maar hij ging naar hem af met een staf, en rukte de speer uit de hand van de Egyptenaar, en hij doodde hem met zijn eigen speer. Deze dingen deed Benaja, de zoon van Jojada; daardoor had hij een naam onder die drie helden.", "1 Sam 22:1": "Toen ging David vandaar weg, en ontkwam naar de spelonk van Adullam. En zijn broers hoorden het, en het hele huis van zijn vader, en ze kwamen daarheen naar hem toe.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Hand 21:13": "Maar Paulus antwoordde: Wat doet u, dat u weent en mijn hart week maakt? Want ik ben bereid niet alleen gebonden te worden, maar ook te sterven te Jeruzalem, voor de Naam van de Heere Jezus.", "1 Sam 16:1": "Toen zei de HEERE tegen Samuël: Hoe lang draagt u leed om Saul, die Ik toch verworpen heb, dat hij geen koning meer zal zijn over Israël? Vul uw hoorn met olie, en ga op weg; Ik zal u zenden naar Isaï, de Bethlehemiet; want Ik heb Mij een koning uitgekozen onder zijn zonen.", "Ps 125:1": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid.", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "1 Kron 12:8": "Ook scheidden zich van de Gadieten af naar David, in die vesting bij de woestijn, kloeke helden, krijgslieden voor de oorlog, toegerust met rond schild en lang schild; en hun gezichten waren als de gezichten van leeuwen, en zij waren zo snel als de reeën op de bergen.", "1 Kron 27:13": "De tiende, in de tiende maand, was Maharai, de Netofathiet, van de Zerahieten; in zijn verdeling waren er ook vierentwintigduizend.", "1 Kor 15:30": "Waarom lopen ook wij ieder uur gevaar?", "1 Kron 27:12": "De negende, in de negende maand, was Abiëzer, de Anathothiet, van de Benjaminieten; in zijn verdeling waren er ook vierentwintigduizend.", "1 Sam 13:4": "Toen hoorde heel Israël zeggen: Saul heeft de bezetting van de Filistijnen verslagen, en ook is Israël gehaat geworden bij de Filistijnen. Toen werd het volk samengeroepen achter Saul, naar Gilgal.", "Ps 78:68": "Maar Hij verkoos de stam van Juda, de berg Sion, die Hij liefhad.", "Jes 12:3": "En u zult water scheppen met vreugde uit de fonteinen van het heil;", "2 Sam 23:17": "En hij zei: Het zij verre van mij, o HEERE, dat ik dit zou doen; zou ik het bloed drinken van de mannen die heengegaan zijn met gevaar voor hun leven? En hij wilde het niet drinken. Dit deden die drie helden.", "2 Sam 23:32": "Eljachba, de Saalboniet; van de zonen van Jazen, Jonathan;", "2 Sam 5:10": "David nu ging voortdurend voort, en werd machtig; want de HEERE, de God van de heerscharen, was met hem.", "2 Sam 5:1-16": "Toen kwamen alle stammen van Israël naar David in Hebron, en zij zeiden: Zie, wij zijn uw gebeente en uw vlees. Ook al eerder, toen Saul koning over ons was, was u het die Israël uitleidde en terugbracht; ook heeft de HEERE tegen u gezegd: U zult Mijn volk Israël weiden, en u zult een leider zijn over Israël. Zo kwamen alle oudsten van Israël naar de koning in Hebron; en koning David sloot met hen een verbond in Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël.", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Hand 23:16": "En toen de zoon van Paulus' zuster van deze hinderlaag hoorde, kwam hij daarheen en ging de legerplaats in en vertelde het aan Paulus.", "Joh 10:4": "En wanneer hij zijn eigen schapen naar buiten gedreven heeft, gaat hij voor hen uit; en de schapen volgen hem, omdat zij zijn stem kennen.", "Richt 9:20": "Maar zo niet, laat er dan vuur uitgaan van Abimelech, dat de burgers van Sichem en het huis van Millo verteert; en laat er vuur uitgaan van de burgers van Sichem en van het huis van Millo, dat Abimelech verteert!", "2 Kon 11:17": "En Jojada sloot een verbond tussen de HEERE en de koning, en het volk, dat het de HEERE tot een volk zou zijn; alsook tussen de koning en het volk.", "2 Sam 2:4": "Daarna kwamen de mannen van Juda, en zalfden daar David tot koning over het huis van Juda. Toen lieten zij David weten en zeiden: Het zijn de mannen van Jabes in Gilead, die Saul begraven hebben.", "Hand 21:37": "En toen Paulus de legerplaats binnengeleid zou worden, zei hij tegen de leider: Is het mij toegestaan iets tegen u te zeggen? En hij zei: Kent u Grieks?", "1 Sam 13:2": "koos Saul zich drieduizend man uit Israël; er waren er bij Saul tweeduizend te Michmas en op het gebergte van Beth-el, en duizend waren er bij Jonathan te Gibea-benjamins; en de rest van het volk liet hij gaan, ieder naar zijn tent.", "1 Sam 17:34-36": "Toen zei David tegen Saul: Uw knecht weidde de schapen van zijn vader, en er kwam een leeuw en een beer, en nam een schaap uit de kudde weg. En ik ging hem achterna, en sloeg hem, en redde het uit zijn muil; toen hij tegen mij opstond, greep ik hem bij zijn baard, en sloeg hem, en doodde hem. Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "2 Sam 2:11": "Het getal nu van de dagen dat David koning geweest is te Hebron, over het huis van Juda, is zeven jaar en zes maanden.", "2 Sam 23:15": "En David kreeg lust en zei: Wie zal mij water te drinken geven uit Bethlehems bornput, die in de poort is?", "Richt 14:5": "Zo ging Simson, met zijn vader en zijn moeder, naar Thimnath. Toen zij nu kwamen tot aan de wijngaarden van Thimnath, zie, daar was een jonge leeuw, die hem brullend tegemoet kwam.", "Num 11:5": "Wij denken aan de vissen die wij in Egypte voor niets aten; aan de komkommers, en aan de meloenen, en aan het look, en aan de uien, en aan het knoflook.", "Deut 3:11": "Want Og, de koning van Bazan, was als enige van de overgeblevenen van de reuzen overgebleven; zie, zijn bed, een bed van ijzer, staat dat niet in Rabba van de kinderen van Ammon? Negen el is zijn lengte, en vier el zijn breedte, naar de elleboogsmaat van een man.", "2 Kron 17:14-19": "Dit nu is hun telling, naar de huizen van hun vaderen. In Juda waren leiders van de duizenden: Adna de aanvoerder, en met hem waren driehonderdduizend kloeke helden. Naast hem nu was de aanvoerder Johanan; en met hem waren tweehonderdtachtigduizend; Naast hem was Amasia, de zoon van Zichri, die zich vrijwillig aan de HEERE overgegeven had; en met hem waren tweehonderdduizend kloeke helden.", "Rom 9:33": "zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "1 Sam 7:6": "En zij werden verzameld te Mizpa, en zij schepten water en goten het uit voor het aangezicht van de HEERE; en zij vastten die dag, en zeiden daar: Wij hebben tegen de HEERE gezondigd. Zo richtte Samuël de kinderen van Israël te Mizpa.", "2 Sam 5:9": "Zo woonde David in de burcht en noemde die de stad van David. En David bouwde rondom, vanaf Millo naar binnen toe.", "Ps 46:12": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "1 Kron 27:8": "De vijfde, in de vijfde maand, was Samhuth, de Jizrahiet, de aanvoerder; in zijn verdeling waren er ook vierentwintigduizend.", "2 Sam 2:1-4": "Daarna gebeurde het, dat David de HEERE vroeg en zei: Zal ik optrekken in een van de steden van Juda? En de HEERE zei tegen hem: Trek op. En David zei: Waarheen zal ik optrekken? En Hij zei: Naar Hebron. Zo trok David daarheen op, en ook zijn twee vrouwen, Ahinoam, de Jizreëlietische, en Abigaïl, de vrouw van Nabal, de Karmeliet. Ook liet David zijn mannen optrekken, die bij hem waren, ieder met zijn huisgezin; en zij woonden in de steden van Hebron.", "Rom 6:1": "Wat zullen wij dan zeggen? Zullen wij in de zonde blijven, opdat de genade des te meer wordt?", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "1 Kon 2:34": "En Benaja, de zoon van Jojada, ging omhoog, en viel op hem aan, en doodde hem; en hij werd begraven in zijn huis, in de woestijn.", "1 Kon 21:3": "Maar Naboth zei tegen Achab: Dat de HEERE ver van mij houde, dat ik u de erfenis van mijn vaderen zou geven!", "Joz 15:63": "Maar de kinderen van Juda konden de Jebusieten, inwoners van Jeruzalem, niet verdrijven; zo woonden de Jebusieten bij de kinderen van Juda te Jeruzalem, tot op deze dag.", "Jes 29:1": "Wee Ariël, Ariël! De stad waarin David gelegerd heeft; doe jaar bij jaar; laat ze feestoffers slachten.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "2 Sam 23:37": "Zelek, de Ammoniet; Naharai, de Beerothiet, de wapendrager van Joab, de zoon van Zeruja;", "1 Sam 18:13": "Daarom stuurde Saul hem van zich weg, en hij stelde hem aan tot leider van duizend; en hij ging uit en hij ging in voor het aangezicht van het volk.", "1 Sam 17:1": "En de Filistijnen verzamelden hun leger ten strijde, en verzamelden zich te Socho, dat in Juda ligt; en zij legerden zich tussen Socho en Azeka, aan het einde van Dammim.", "Job 31:31": "Als de lieden van mijn tent niet hebben gezegd: Och, hadden wij van zijn vlees maar, wij zouden niet verzadigd worden;", "1 Kron 20:4": "En het gebeurde daarna, toen de oorlog met de Filistijnen bij Gezer opstond, dat Sibchai, de Husathiet, toen Sippai versloeg, die van de kinderen van Rafa was; en zij werden onderworpen.", "1 Kon 9:15": "Dit is nu de reden van het uitschot, dat de koning Salomo liet opkomen, om het huis van de HEERE te bouwen, en zijn huis, en Millo, en de muur van Jeruzalem, alsook Hazor, en Megiddo, en Gezer.", "Gen 29:14": "Toen zei Laban tegen hem: Voorwaar, u bent mijn gebeente en mijn vlees! En hij bleef bij hem een volle maand.", "2 Kron 23:3": "En heel de gemeente sloot een verbond in het huis van God, met de koning; en hij zei tegen hen: Zie, de zoon van de koning zal koning zijn, zoals de HEERE over de zonen van David gesproken heeft.", "1 Kron 11:15-20": "En drie van de dertig hoofden trokken naar de rots naar David, in de spelonk van Adullam; en het leger van de Filistijnen had zich gelegerd in het dal Refaïm. En David was toen in de vesting, en de bezetting van de Filistijnen was toen in Bethlehem. En David kreeg dorst, en zei: Wie zal mij water te drinken geven uit de bron van Bethlehem, die onder de poort is?", "2 Kor 5:15": "Omdat wij dit oordelen: dat als Eén voor allen gestorven is, zij dan allen gestorven zijn. En Hij is voor allen gestorven, opdat zij die leven niet meer voor zichzelf zouden leven, maar voor Hem Die voor hen gestorven en opgewekt is.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "2 Sam 23:31": "Abi-albon, de Arbathiet; Azmaveth, de Barhumiet;", "2 Sam 7:7": "Overal waar Ik met al de kinderen van Israël heb rondgetrokken, heb Ik ooit een woord gesproken met een van de stammen van Israël, aan wie Ik geboden heb Mijn volk Israël te weiden, en gezegd: Waarom bouwt u Mij geen huis van cederhout?", "2 Sam 8:18": "Er was ook Benaja, zoon van Jojada, met de Krethi en de Plethi; maar Davids zonen waren prinsen.", "1 Kron 11:1-29": "Toen kwam heel Israël bijeen bij David in Hebron, en zei: Zie, wij zijn uw gebeente en uw vlees. Zelfs al eerder, toen Saul nog koning was, hebt u Israël uitgeleid en ingeleid; ook heeft de HEERE, uw God, tot u gezegd: U zult Mijn volk Israël weiden, en u zult voorganger zijn over Mijn volk Israël. Ook kwamen alle oudsten van Israël naar de koning in Hebron, en David maakte een verbond met hen te Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël, naar het woord van de HEERE, door de dienst van Samuël.", "Ps 48:13": "Ga rondom Sion, en omring haar; tel haar torens;", "2 Sam 20:23": "Joab nu was over het hele leger van Israël; en Benaja, de zoon van Jojada, over de Krethi en over de Plethi;", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Lev 17:10": "En ieder uit het huis van Israël, en uit de vreemdelingen, die in hun midden als vreemdelingen verkeren, die enig bloed zal gegeten hebben, tegen diens ziel, die dat bloed zal gegeten hebben, zal Ik Mijn aangezicht keren, en zal die uit het midden van haar volk uitroeien.", "1 Kor 15:41": "De ene heerlijkheid is die van de zon, en de andere heerlijkheid is die van de maan, en de andere heerlijkheid is die van de sterren; want de ene ster verschilt van de andere ster in heerlijkheid.", "2 Sam 20:26": "En ook was Ira, de Jaïriet, Davids opperofficier.", "1 Kron 12:23-40": "En dit zijn de aantallen van de aanvoerders van hen die toegerust waren voor het leger, die naar David te Hebron kwamen om het koninkrijk van Saul aan hem over te dragen, naar het woord van de HEERE: Van de kinderen van Juda, die rond schild en speer droegen, waren zesduizend achthonderd toegerust voor het leger; Van de kinderen van Simeon, kloeke helden voor het leger, zevenduizend honderd;", "2 Kron 12:10": "En koning Rehabeam maakte, in plaats daarvan, koperen schilden; en hij gaf die in bewaring bij de aanvoerders van de wacht, die de deur van het huis van de koning bewaakten.", "2 Sam 3:18": "Doe het nu dan; want de HEERE heeft over David gesproken, en gezegd: Door de hand van David, Mijn dienaar, zal Ik Mijn volk Israël verlossen van de hand van de Filistijnen, en van de hand van al hun vijanden.", "1 Kron 11:4-6": "En David trok op, en heel Israël, naar Jeruzalem, dat is Jebus; want daar waren de Jebusieten, de inwoners van het land. En de inwoners van Jebus zeiden tegen David: U zult hier niet binnenkomen. David veroverde toch de burcht Sion, dat is de stad van David. Want David zei: Al wie de Jebusieten het eerst verslaat, zal tot hoofd en leider worden. Toen klom Joab, de zoon van Zeruja, er als eerste op; daarom werd hij tot hoofd.", "Ps 125:2": "Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid.", "2 Sam 23:34": "Elifelet, de zoon van Ahasbai, de zoon van een Maachathiet; Eliam, de zoon van Achitofel, de Giloniet;", "1 Kon 2:35": "En de koning stelde Benaja, de zoon van Jojada, in zijn plaats aan over het leger; en Zadok, de priester, stelde de koning aan in de plaats van Abjathar.", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "2 Sam 23:13": "Ook gingen drie van de dertig hoofden af, en kwamen in de oogsttijd naar David, in de spelonk van Adullam; en de troep Filistijnen had zich gelegerd in het dal Rafaïm.", "2 Sam 5:6-9": "En de koning trok met zijn mannen naar Jeruzalem, tegen de Jebusieten, die in dat land woonden. En zij zeiden tegen David: U zult hier niet binnenkomen, maar de blinden en kreupelen zullen u wegjagen; dat wil zeggen: David zal hier niet binnenkomen. Maar David nam de burcht Sion in; dat is de stad van David. Want David zei op diezelfde dag: Ieder die de Jebusieten slaat en bij die watergoot komt, en die kreupelen en die blinden, die door Davids ziel gehaat worden, die zal tot een hoofd en tot een leider zijn; daarom zegt men: Een blinde en kreupele zal het huis niet binnenkomen.", "Gen 25:16": "Deze zijn de zonen van Ismaël, en dit zijn hun namen, in hun dorpen en versterkte plaatsen: twaalf vorsten naar hun volken.", "Rom 8:31": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn?", "1 Kon 2:11": "De dagen nu dat David over Israël geregeerd heeft, zijn veertig jaar; zeven jaar heeft hij geregeerd in Hebron, en in Jeruzalem heeft hij drieëndertig jaar geregeerd.", "2 Sam 23:29": "Heleb, de zoon van Baëna, de Netofathiet; Ithai, de zoon van Ribai, van Gibea van de kinderen van Benjamin;", "Ps 63:2": "O God! U bent mijn God! Ik zoek U in de dageraad; mijn ziel dorst naar U; mijn lichaam verlangt naar U, in een land, dor en mat, zonder water.", "2 Sam 18:11": "Toen zei Joab tegen de man die het hem vertelde: Zie toch, u hebt het gezien, waarom hebt u hem daar dan niet ter aarde geslagen? Dan had ik u tien zilverstukken en een gordel gegeven.", "1 Kron 8:4": "En Abisua, en Naäman, en Ahoah,", "Richt 16:14": "En zij maakte ze vast met een pin, en zei tegen hem: De Filistijnen over u, Simson! Toen werd hij wakker uit zijn slaap, en nam de pin van het weefsel weg, en de weversboom.", "Ps 2:6": "Ik heb Mijn Koning toch gezalfd over Sion, de berg van Mijn heiligheid.", "Klaagl 4:12": "Lamed. De koningen van de aarde zouden het niet geloofd hebben, en ook geen van de bewoners van de wereld, dat de tegenstander en vijand door de poorten van Jeruzalem zou binnengaan.", "1 Kon 3:9": "Geef dan Uw knecht een verstandig hart om Uw volk te richten, en om onderscheid te kunnen maken tussen goed en kwaad; want wie zou dit zware volk van U kunnen richten?", "1 Kron 2:16": "En hun zusters waren Zeruja en Abigaïl. De kinderen nu van Zeruja waren Abisai, en Joab, en Asa-el; drie.", "1 Sam 27:5": "En David zei tegen Achis: Als ik nu genade gevonden heb in uw ogen, laat men mij een plaats geven in een van de steden van het land, zodat ik daar kan wonen; want waarom zou uw knecht bij u in de koninklijke stad wonen?", "1 Kron 27:15": "De twaalfde, in de twaalfde maand, was Heldai, de Netofathiet, van Othniël; in zijn verdeling waren er ook vierentwintigduizend.", "2 Sam 5:18": "En de Filistijnen kwamen en verspreidden zich in het dal Refaïm.", "1 Kron 11:5-7": "En de inwoners van Jebus zeiden tegen David: U zult hier niet binnenkomen. David veroverde toch de burcht Sion, dat is de stad van David. Want David zei: Al wie de Jebusieten het eerst verslaat, zal tot hoofd en leider worden. Toen klom Joab, de zoon van Zeruja, er als eerste op; daarom werd hij tot hoofd. David nu woonde op de burcht; daarom noemt men die de stad van David.", "Jes 55:4": "Zie, Ik heb hem tot een getuige van de volken gegeven, een vorst en gebieder van de volken.", "2 Sam 8:16": "Joab nu, de zoon van Zeruja, was over het leger; en Josafat, zoon van Achilud, was kanselier.", "Ps 122:5": "Want daar staan de stoelen van het gericht, de stoelen van het huis van David.", "2 Sam 23:27": "Abiëzer, de Anetothiet; Mebunnai, de Husathiet;", "1 Sam 17:25": "En de mannen van Israël zeiden: Hebt u die man wel gezien, die is opgekomen? Want hij is opgekomen om Israël te honen; en het zal gebeuren dat de koning de man die hem verslaat, met grote rijkdom zal verrijken, en hij zal hem zijn dochter geven, en hij zal het huis van zijn vader vrijmaken in Israël.", "Ps 18:51": "Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "1 Kron 11:1-3": "Toen kwam heel Israël bijeen bij David in Hebron, en zei: Zie, wij zijn uw gebeente en uw vlees. Zelfs al eerder, toen Saul nog koning was, hebt u Israël uitgeleid en ingeleid; ook heeft de HEERE, uw God, tot u gezegd: U zult Mijn volk Israël weiden, en u zult voorganger zijn over Mijn volk Israël. Ook kwamen alle oudsten van Israël naar de koning in Hebron, en David maakte een verbond met hen te Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël, naar het woord van de HEERE, door de dienst van Samuël.", "1 Kron 12:11": "Attai de zesde; Eliël de zevende;", "Richt 9:2": "Spreekt toch ten aanhoren van alle burgers van Sichem: Wat is voor u beter, dat zeventig mannen, allemaal zonen van Jerubbaäl, over u heersen, of dat één man over u heerst? Bedenkt ook dat ik uw eigen vlees en bloed ben.", "1 Sam 16:12": "Toen stuurde hij iemand, en liet hem komen; hij nu was roodachtig, en had daarbij mooie ogen en een knap voorkomen; en de HEERE zei: Sta op, zalf hem, want deze is het.", "2 Kron 17:12": "Zo nam Josafat toe, en werd bijzonder groot; daartoe bouwde hij in Juda burchten en voorraadsteden.", "2 Sam 2:18-24": "Nu waren daar drie zonen van Zeruja, Joab, en Abisai en Asahel; en Asahel was licht op zijn voeten, als een van de reeën die in het veld zijn. En Asahel jaagde Abner achterna; en hij week niet af, om van achter Abner naar rechts of naar links af te gaan. Toen keek Abner achter zich om, en zei: Bent u dit, Asahel? En hij zei: Ik ben het.", "1 Kron 11:10-47": "Dezen nu waren de hoofden van de helden die David had, die zich dapper bij hem gedragen hebben in zijn koninkrijk bij heel Israël, om hem koning te maken, naar het woord van de HEERE over Israël. Dezen nu zijn het aantal van de helden die David had: Jasobam, de zoon van Hachmoni, was het hoofd van de dertig; hij zwaaide zijn speer tegen driehonderd man en versloeg hen op eenmaal. En na hem was Eleazar, de zoon van Dodo, de Ahohiet; hij was een van de drie helden.", "2 Sam 11:11": "En Uria zei tegen David: De ark, en Israël, en Juda blijven in de tenten; en mijn heer Joab, en de knechten van mijn heer, zijn gelegerd op het open veld, en zou ik naar mijn huis gaan, om te eten en te drinken, en bij mijn vrouw te liggen? Zo waarachtig als u leeft en uw ziel leeft, ik zal dit niet doen!", "2 Sam 20:6": "Toen zei David tegen Abisai: Nu zal Seba, de zoon van Bichri, ons meer kwaad doen dan Absalom; neem u de knechten van uw heer, en jaag hem achterna, opdat hij niet misschien vaste steden voor zich vindt, en zich aan onze ogen onttrekt.", "Joz 12:15": "De koning van Libna, één; de koning van Adullam, één;", "2 Sam 15:10": "Absalom nu had verspieders uitgezonden naar alle stammen van Israël, om te zeggen: Zodra u het geluid van de bazuin hoort, moet u zeggen: Absalom is koning geworden te Hebron.", "Joh 4:10": "Jezus antwoordde en zei tegen haar: Als u de gave van God kende, en Wie Hij is, Die tegen u zegt: Geef Mij te drinken, dan zou u van Hem hebben gevraagd, en Hij zou u levend water gegeven hebben.", "2 Kron 27:4": "Daartoe bouwde hij steden op het gebergte van Juda; en in de wouden bouwde hij burchten en torens.", "2 Sam 19:12": "U bent mijn broeders; mijn gebeente en mijn vlees bent u; waarom zouden jullie dan de laatsten zijn om de koning terug te halen?", "1 Kron 18:2-11": "Hij sloeg ook de Moabieten, zodat de Moabieten Davids knechten werden, die geschenken brachten. David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat. En David nam hem duizend wagens af, en zevenduizend ruiters, en twintigduizend man te voet; en David sneed bij alle wagenpaarden de hezenpezen door; maar hij hield honderd wagens daarvan over.", "2 Sam 18:2": "Verder zond David het volk uit, een derde deel onder leiding van Joab, en een derde deel onder leiding van Abisai, de zoon van Zeruja, Joabs broer, en een derde deel onder leiding van Ithai, de Gethiet. En de koning zei tegen het volk: Ik zal ook zelf zeker met u meetrekken.", "1 Sam 11:15": "Toen ging heel het volk naar Gilgal, en Saul werd daar koning gemaakt voor het aangezicht van de HEERE te Gilgal; en zij offerden daar dankoffers voor het aangezicht van de HEERE; en Saul verheugde zich daar zeer, met alle mannen van Israël.", "1 Kron 12:34": "En uit Nafthali, duizend aanvoerders, en bij hen met rond schild en speer, zevenendertigduizend.", "Joz 15:21": "De steden nu, van het uiterste van de stam van de kinderen van Juda tot het gebied van Edom, tegen het zuiden, zijn: Kabzeel, en Eder, en Jagur,", "2 Sam 23:20-23": "Verder Benaja, de zoon van Jojada, de zoon van een dappere man, groot van daden, uit Kabzeel; die versloeg twee sterke leeuwen van Moab; ook ging hij af, en sloeg een leeuw in het midden van een kuil in de sneeuwtijd. Daarbij versloeg hij een Egyptische man, een man van aanzien; en in de hand van de Egyptenaar was een speer, maar hij ging op hem af met een staf; en hij rukte de speer uit de hand van de Egyptenaar, en doodde hem met zijn eigen speer. Deze dingen deed Benaja, de zoon van Jojada; daarom had hij een naam onder de drie helden.", "1 Sam 16:3": "En u zult Isaï uitnodigen voor het offer, en Ik zal u laten weten wat u moet doen; en u zult Mij zalven degene die Ik u zeggen zal.", "Micha 5:3": "En Hij zal staan, en zal weiden in de kracht van de HEERE, in de hoogheid van de Naam van de HEERE, Zijn God, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden van de aarde.", "1 Kron 9:20": "Zoals Pinehas, de zoon van Eleazar, vroeger voorganger over hen was, met wie de HEERE was.", "1 Sam 17:4": "Toen ging er een kampvechter uit het leger van de Filistijnen naar buiten; zijn naam was Goliath, uit Gath; zijn hoogte was zes ellen en een span.", "2 Kon 12:20": "En zijn knechten stonden op, en smeedden een samenzwering, en sloegen Joas dood in het huis van Millo, dat afdaalt naar Silla;", "2 Sam 23:33": "Samma, de Harariet; Ahiam, de zoon van Sarar, de Harariet;", "1 Kon 1:8": "Maar Zadok, de priester, en Benaja, de zoon van Jojada, en Nathan, de profeet, en Simeï, en Rei, en de helden die David had, waren niet met Adonia.", "1 Kon 8:1": "Toen verzamelde Salomo de oudsten van Israël, en alle hoofden van de stammen, de leiders van de vaderen, onder de kinderen van Israël, bij de koning Salomo te Jeruzalem, om de ark van het verbond van de HEERE op te brengen uit de stad van David, dat is Sion.", "2 Kron 5:2": "Toen verzamelde Salomo de oudsten van Israël, en al de hoofden van de stammen, de leiders van de vaderen onder de kinderen van Israël, in Jeruzalem, om de ark van het verbond van de HEERE op te brengen uit de stad van David, dat is Sion.", "1 Sam 13:23": "En het leger van de Filistijnen trok uit naar de doortocht van Michmas.", "2 Sam 1:23": "Saul en Jonathan, die geliefd waren, en die liefelijke mensen in hun leven, zijn ook in hun dood niet gescheiden; zij waren sneller dan arenden, zij waren sterker dan leeuwen.", "2 Sam 23:8-39": "Dit zijn de namen van de helden die David gehad heeft: Joscheb-Baschebeth, de zoon van Tachkemoni, de voornaamste van de hoofdlieden. Deze was Adino, de Ezniet, die zich stelde tegen achthonderd man, die door hem verslagen werden op één moment. En na hem was Eleazar, de zoon van Dodo, zoon van Ahohi; deze was onder de drie helden met David, toen zij de Filistijnen beschimpten, die daar ten strijde verzameld waren, en de mannen van Israël waren teruggetrokken. Deze stond op en sloeg onder de Filistijnen, totdat zijn hand moe werd, ja, zijn hand aan het zwaard kleefde; en de HEERE bracht een grote overwinning tot stand op die dag; en het volk keerde terug achter hem aan, alleen om te plunderen.", "Jer 3:15": "En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand.", "Ps 9:12": "Zingt psalmen voor de HEERE, Die te Sion woont; verkondigt onder de volken Zijn daden.", "Neh 4:2": "Hij sprak in het bijzijn van zijn broeders en van het leger van Samaria, en zei: Wat doen deze zwakke Joden? Zullen zij zichzelf versterken? Zullen zij offeren? Zullen zij het in één dag afmaken? Zullen zij de stenen uit de puinhopen weer levend maken, terwijl die verbrand zijn?", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "1 Kron 27:2": "Over de eerste verdeling, in de eerste maand, was Jasobam, de zoon van Zabdiël; en in zijn verdeling waren er vierentwintigduizend.", "1 Sam 19:5": "Want hij heeft zijn leven gewaagd, en hij heeft de Filistijn geslagen, en de HEERE heeft een grote overwinning aan heel Israël gegeven; u hebt het gezien, en u bent verblijd geweest; waarom zou u dan tegen onschuldig bloed zondigen, David zonder reden doden?", "1 Kron 18:15": "Joab nu, de zoon van Zeruja, ging over het leger; en Josafat, de zoon van Ahilud, was kanselier;", "2 Sam 23:36": "Jig-al, de zoon van Nathan, van Zoba; Bani, de Gadiet;", "2 Sam 23:8": "Dit zijn de namen van de helden die David gehad heeft: Joscheb-Baschebeth, de zoon van Tachkemoni, de voornaamste van de hoofdlieden. Deze was Adino, de Ezniet, die zich stelde tegen achthonderd man, die door hem verslagen werden op één moment.", "1 Kron 27:5": "De derde aanvoerder van het leger, in de derde maand, was Benaja, de zoon van Jojada, de opperpriester; die was het hoofd; in zijn verdeling waren er ook vierentwintigduizend.", "1 Kron 12:38": "Al deze krijgslieden, die zich in slagorde konden houden, kwamen met een volkomen hart naar Hebron om David koning te maken over heel Israël. En ook heel de rest van Israël was één van hart om David tot koning te maken.", "2 Sam 2:32": "En zij namen Asahel op, en begroeven hem in het graf van zijn vader, dat te Bethlehem was. Joab nu en zijn mannen gingen de hele nacht, tot het licht hun aanbrak te Hebron.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Jes 17:5": "Want het zal zijn zoals wanneer een maaier het staande koren verzamelt, en met zijn arm aren afmaait; ja, het zal zijn zoals wanneer iemand aren leest in het dal Refraïm.", "Micha 1:15": "Ik zal u nog een erfgenaam toebrengen, u inwoonster van Maresa! Hij zal komen tot aan Adullam, tot aan de heerlijkheid van Israël.", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "Richt 9:17": "(want mijn vader heeft voor u gestreden, en hij heeft zijn leven ver weggeworpen, en heeft u gered uit de hand van de Midianieten;", "Ps 144:10": "U, Die de koningen overwinning geeft, Die Zijn dienaar David bevrijdt van het boze zwaard;", "1 Kron 15:1": "En David bouwde zich huizen in zijn stad; en hij bereidde voor de ark van God een plaats, en spande een tent voor haar.", "2 Sam 21:17": "Maar Abisai, de zoon van Zeruja, hielp hem, en sloeg de Filistijn, en doodde hem. Toen zwoeren de mannen van David hem, en zeiden: U zult niet meer met ons uittrekken ten strijde, zodat u de lamp van Israël niet uitblust.", "1 Kron 27:32": "En Jonathan, de oom van David, was raadsman, een verstandig man; hij was ook schrijver; Jehiël nu, de zoon van Hachmoni, was bij de zonen van de koning.", "2 Sam 2:1": "Daarna gebeurde het, dat David de HEERE vroeg en zei: Zal ik optrekken in een van de steden van Juda? En de HEERE zei tegen hem: Trek op. En David zei: Waarheen zal ik optrekken? En Hij zei: Naar Hebron.", "1 Kon 11:27": "Dit is nu de zaak waarom hij tegen de koning in opstand kwam. Salomo bouwde Millo, en herstelde de bres in de stad van zijn vader David.", "2 Sam 23:23": "Hij was de meest geëerde van de dertig, maar tot die eerste drie kwam hij niet; en David stelde hem aan over zijn lijfwacht.", "Richt 1:21": "Doch de Benjaminieten hebben de Jebusieten, die in Jeruzalem woonden, niet verdreven; maar de Jebusieten woonden met de Benjaminieten in Jeruzalem, tot op deze dag.", "Deut 17:15": "Dan moet u zeker die tot koning over u aanstellen die de HEERE, uw God, zal uitkiezen; uit uw broeders moet u een koning over u aanstellen; u mag geen vreemde man over u zetten die uw broeder niet is.", "Matt 13:8": "En een ander deel viel in de goede aarde, en gaf vrucht, het ene honderdvoud, het andere zestigvoud, en het andere dertigvoud.", "1 Sam 17:26": "Toen zei David tegen de mannen die bij hem stonden: Wat zal men de man doen die deze Filistijn verslaat en de smaad van Israël wegneemt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van de levende God zou honen?", "2 Kon 5:1": "Naäman nu, de legeraanvoerder van de koning van Syrië, was een groot man voor het aangezicht van zijn heer, en van hoog aanzien; want door hem had de HEERE de Syriërs verlossing gegeven; zo was deze man een strijdbaar held, doch melaats.", "2 Sam 23:25": "Samma, de Harodiet; Elika, de Harodiet;", "Joz 15:17": "Othniël nu, de zoon van Kenaz, de broer van Kaleb, nam het in; en hij gaf hem Achsa, zijn dochter, tot vrouw.", "2 Sam 23:38": "Ira, de Jethriet; Gareb, de Jethriet;", "Gen 15:21": "En de Amorieten, en de Kanaänieten, en de Girgazieten, en de Jebusieten.", "2 Sam 5:5-9": "In Hebron regeerde hij over Juda zeven jaar en zes maanden; en in Jeruzalem regeerde hij drieëndertig jaar over heel Israël en Juda. En de koning trok met zijn mannen naar Jeruzalem, tegen de Jebusieten, die in dat land woonden. En zij zeiden tegen David: U zult hier niet binnenkomen, maar de blinden en kreupelen zullen u wegjagen; dat wil zeggen: David zal hier niet binnenkomen. Maar David nam de burcht Sion in; dat is de stad van David.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "2 Sam 12:7": "Toen zei Nathan tegen David: U bent die man! Zo zegt de HEERE, de God van Israël: Ik heb u tot koning gezalfd over Israël, en Ik heb u uit de hand van Saul gered;", "1 Sam 17:51": "Daarom liep David, en ging op de Filistijn staan, en nam zijn zwaard, en trok het uit zijn schede, en doodde hem, en hakte hem daarmee het hoofd af. Toen de Filistijnen zagen dat hun geweldigste dood was, vluchtten zij.", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Richt 12:13": "En na hem richtte Abdon, een zoon van Hillel, de Pirhathoniet, Israël.", "Hand 21:34": "En in de menigte riep de één dit, de ander wat anders. En omdat hij vanwege de opschudding niets met zekerheid kon te weten komen, beval hij dat men hem naar de legerplaats zou brengen.", "Richt 9:6": "Toen verzamelden zich alle burgers van Sichem, en het hele huis van Millo, en gingen heen en maakten Abimelech tot koning, bij de hoge eik die bij Sichem is.", "1 Kron 27:9": "De zesde, in de zesde maand, was Ira, de zoon van Ikkes, de Thekoïet; in zijn verdeling waren er ook vierentwintigduizend.", "1 Kron 27:10": "De zevende, in de zevende maand, was Helez, de Peloniet, uit de kinderen van Efraïm; in zijn verdeling waren er ook vierentwintigduizend.", "1 Kron 27:14": "De elfde, in de elfde maand, was Benaja, de Pirhathoniet, van de kinderen van Efraïm; in zijn verdeling waren er ook vierentwintigduizend.", "1 Sam 17:10": "Verder zei de Filistijn: Ik heb vandaag de slagorden van Israël gehoond, en gezegd: Geef mij een man, dat wij samen strijden!", "2 Sam 19:21": "Toen antwoordde Abisai, de zoon van Zeruja, en zei: Zou Simeï hiervoor niet gedood moeten worden? Hij heeft toch de gezalfde van de HEERE vervloekt?", "2 Sam 23:18": "Abisai, Joabs broer, de zoon van Zeruja, die was ook een hoofd van drie; en hij hief zijn speer op tegen driehonderd man, die door hem verslagen werden; en hij had een naam onder die drie.", "Ps 87:2": "De HEERE heeft de poorten van Sion lief, boven alle woningen van Jakob.", "1 Kron 11:4-8": "En David trok op, en heel Israël, naar Jeruzalem, dat is Jebus; want daar waren de Jebusieten, de inwoners van het land. En de inwoners van Jebus zeiden tegen David: U zult hier niet binnenkomen. David veroverde toch de burcht Sion, dat is de stad van David. Want David zei: Al wie de Jebusieten het eerst verslaat, zal tot hoofd en leider worden. Toen klom Joab, de zoon van Zeruja, er als eerste op; daarom werd hij tot hoofd.", "2 Sam 15:18": "En al zijn knechten trokken aan zijn zijde voorbij, ook alle Krethi en alle Plethi, en alle Gethieten, zeshonderd man die van Gath te voet gekomen waren, trokken voor het aangezicht van de koning voorbij.", "2 Sam 23:13-39": "Ook gingen drie van de dertig hoofden af, en kwamen in de oogsttijd naar David, in de spelonk van Adullam; en de troep Filistijnen had zich gelegerd in het dal Rafaïm. En David was toen in een vesting; en de bezetting van de Filistijnen was toen te Bethlehem. En David kreeg lust en zei: Wie zal mij water te drinken geven uit Bethlehems bornput, die in de poort is?", "1 Sam 17:36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Joh 18:12": "De afdeling dan, en de aanvoerder over duizend, en de dienaars van de Joden namen Jezus gezamenlijk en bonden Hem vast;", "2 Sam 5:2": "Ook al eerder, toen Saul koning over ons was, was u het die Israël uitleidde en terugbracht; ook heeft de HEERE tegen u gezegd: U zult Mijn volk Israël weiden, en u zult een leider zijn over Israël.", "1 Kron 27:11": "De achtste, in de achtste maand, was Sibbechai, de Husathiet, van de Zerahieten; in zijn verdeling waren er ook vierentwintigduizend.", "Hand 23:10": "En toen er grote tweedracht ontstond, gaf de aanvoerder, uit vrees dat Paulus door hen verscheurd zou worden, bevel dat het krijgsvolk zou afdalen en hem uit hun midden zou wegrukken en naar de legerplaats brengen.", "1 Sam 16:12-14": "Toen stuurde hij iemand, en liet hem komen; hij nu was roodachtig, en had daarbij mooie ogen en een knap voorkomen; en de HEERE zei: Sta op, zalf hem, want deze is het. Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama. En de Geest van de HEERE week van Saul; en een boze geest van de HEERE verschrikte hem.", "Joz 18:28": "En Zela, Elef en Jebusi (dat is Jeruzalem), Gibath, Kirjath: veertien steden alsook de bijbehorende dorpen. Dit is het erfdeel van de kinderen van Benjamin, naar hun huisgezinnen.", "2 Sam 3:27": "Toen Abner naar Hebron terugkwam, nam Joab hem apart in het midden van de poort om in stilte met hem te spreken; en hij sloeg hem daar onder de vijfde rib, zodat hij stierf, vanwege het bloed van zijn broer Asaël.", "Ps 78:71": "Van achter de zogende schapen liet Hij hem komen, om Jakob te weiden, Zijn volk, en Israël, Zijn erfenis.", "1 Kron 27:4": "En over de verdeling in de tweede maand was Dodai, de Ahohiet, en over zijn verdeling was Mikloth ook voorganger; in zijn verdeling waren er ook vierentwintigduizend.", "Ps 72:14": "Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen."}, "noten": {"1": "D.i. legermachten"}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H6908\">Toen</span> kwam heel <span class=\"wl\" data-l=\"L2\" data-code=\"H3478\">Israël</span> bijeen <span class=\"wl\" data-l=\"L3\" data-code=\"H1732\">bij</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1732\">David</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1732\">in</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2275\">Hebron</span>, en zei: <span class=\"wl\" data-l=\"L5\" data-code=\"H2009\">Zie</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H587\">wij</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H587\">zijn</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6106\">uw</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6106\">gebeente</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1320\">en</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1320\">uw</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H
