op, en heel Israël, naar Jeruzalem, dat is Jebus; want daar waren de Jebusieten, de inwoners van het land.","5":"En de inwoners van Jebus zeiden tegen David: U zult hier niet binnenkomen. David veroverde toch de burcht Sion, dat is de stad van David.","6":"Want David zei: Al wie de Jebusieten het eerst verslaat, zal tot hoofd en leider worden. Toen klom Joab, de zoon van Zeruja, er als eerste op; daarom werd hij tot hoofd.","7":"David nu woonde op de burcht; daarom noemt men die de stad van David.","8":"En hij bouwde de stad rondom, vanaf Millo af, en rondom heen; en Joab herstelde de rest van de stad.","9":"En David werd voortdurend groter, want de HEERE van de heerscharen[1] was met hem.","10":"Dezen nu waren de hoofden van de helden die David had, die zich dapper bij hem gedragen hebben in zijn koninkrijk bij heel Israël, om hem koning te maken, naar het woord van de HEERE over Israël.","11":"Dezen nu zijn het aantal van de helden die David had: Jasobam, de zoon van Hachmoni, was het hoofd van de dertig; hij zwaaide zijn speer tegen driehonderd man en versloeg hen op eenmaal.","12":"En na hem was Eleazar, de zoon van Dodo, de Ahohiet; hij was een van de drie helden.","13":"Hij was met David te Pas-Dammim, toen de Filistijnen daar ten strijde verzameld waren, en het stuk akker vol gerst was, en het volk voor het aangezicht van de Filistijnen vluchtte;","14":"En zij stelden zich op in het midden van dat stuk, en beschermden het, en zij versloegen de Filistijnen; en de HEERE verloste hen door een grote verlossing.","15":"En drie van de dertig hoofden trokken naar de rots naar David, in de spelonk van Adullam; en het leger van de Filistijnen had zich gelegerd in het dal Refaïm.","16":"En David was toen in de vesting, en de bezetting van de Filistijnen was toen in Bethlehem.","17":"En David kreeg dorst, en zei: Wie zal mij water te drinken geven uit de bron van Bethlehem, die onder de poort is?","18":"Toen braken die drie door het leger van de Filistijnen, en putten water uit de bron van Bethlehem, die onder de poort is, en zij droegen het en brachten het naar David. Maar David wilde het niet drinken, maar hij goot het uit voor de HEERE;","19":"En hij zei: Dat mijn God dit verre van mij houdt, dat ik zoiets zou doen! Zou ik het bloed van deze mannen drinken? Met gevaar voor hun leven, ja, met gevaar voor hun leven hebben zij dat gebracht. En hij wilde het niet drinken. Dit deden de drie helden.","20":"Abisai nu, de broer van Joab, was ook het hoofd van drie; hij zwaaide zijn speer tegen driehonderd man en versloeg hen; zo had hij een naam onder die drie.","21":"Van die drie was hij geëerd boven de twee; daarom werd hij hun tot leider; maar hij kwam niet aan de *eerste* drie toe.","22":"Benaja, de zoon van Jojada, de zoon van een dapper man uit Kabzeël, was groot van daden; hij versloeg twee sterke leeuwen van Moab; ook ging hij af, en versloeg een leeuw in het midden van het kuil, in de sneeuwtijd.","23":"Hij versloeg ook een Egyptische man, een man van grote lengte, van vijf ellen; en die Egyptenaar had een speer in de hand, als een weversboom; maar hij ging naar hem af met een staf, en rukte de speer uit de hand van de Egyptenaar, en hij doodde hem met zijn *eigen* speer.","24":"Deze dingen deed Benaja, de zoon van Jojada; daardoor had hij een naam onder die drie helden.","25":"Zie, hij was de meest geëerde van die dertig; toch kwam hij niet aan de drie toe. En David stelde hem over zijn lijfwacht.","26":"De helden nu van de legers waren: Asahel, de broer van Joab; Elhanan, de zoon van Dodo, van Bethlehem;","27":"Sammoth, de Harodiet; Helez, de Peloniet;","28":"Ira, de zoon van Ikkes, de Thekoiet; Abiëzer, de Anathothiet;","29":"Sibbechai, de Husathiet; Ilai, de Ahohiet;","30":"Maharai, de Netofathiet; Heled, de zoon van Baäna, de Netofathiet;","31":"Ithai, de zoon van Ribai, uit Gibea van de kinderen van Benjamin; Benaja, de Pirhathoniet;","32":"Hurai, uit de beken van Gaäs; Abiël, de Arbathiet;","33":"Azmaveth, de Baharumiet; Eljahba, de Saälboniet;","34":"Van de kinderen van Hasem, de Gizoniet, was Jonathan, de zoon van Sage, de Harariet;","35":"Ahiam, de zoon van Sachar, de Harariet; Elifal, de zoon van Ur;","36":"Hefer, de Mecherathiet; Ahia, de Peloniet;","37":"Hezro, de Karmeliet; Naäri, de zoon van Ezbai;","38":"Joël, de broer van Nathan; Mibhar, de zoon van Geri;","39":"Zelek, de Ammoniet; Nahrai, de Berothiet, wapendrager van Joab, de zoon van Zeruja;","40":"Ira, de Jithriet; Gareb, de Jithriet;","41":"Uria, de Hethiet; Zabad, de zoon van Ahlai;","42":"Adina, de zoon van Siza, de Rubeniet, was het hoofd van de Rubenieten; toch waren er dertig bij hem;","43":"Hanan, de zoon van Maächa, en Josafat, de Mithniet;","44":"Uzzia, de Asterathiet; Sama en Jeiël, de zonen van Hotham, de Aroeriet;","45":"Jediaël, de zoon van Simri, en Joha, zijn broer, de Tiziet;","46":"Eliël, Hammahavim en Jeribai, en Josavia, de zonen van Elnaam; en Jithma, de Moabiet;","47":"Eliël en Obed, en Jaäziël van Mezobaja."},"SV":{"1":"Toen vergaderde zich gans Israël tot David naar Hebron, zeggende: Zie, wij zijn uw gebeente en uw vlees.","2":"Zelfs ook te voren, toen Saul nog koning was, hebt gij Israël uitgeleid en ingeleid; ook heeft de HEERE, uw God, tot u gezegd: Gij zult Mijn volk Israël weiden, en gij zult voorganger zijn van Mijn volk Israël.","3":"Ook kwamen alle oudsten in Israël tot den koning naar Hebron, en David maakte een verbond met hen te Hebron, voor het aangezicht des HEEREN; en zij zalfden David ten koning over Israël, naar het woord des HEEREN, door den dienst van Samuël.","4":"En David toog henen, en gans Israël, naar Jeruzalem, welke is Jebus; want daar waren de Jebusieten, de inwoners des lands.","5":"En de inwoners van Jebus zeiden tot David: Gij zult hier niet inkomen. David dan nog won den burg Sion, welke is de stad Davids.","6":"Want David zeide: Al wie de Jebusieten het eerst slaat, zal tot een hoofd, en tot een overste worden. Toen beklom Joab, de zoon van Zeruja, dien het eerst; daarom werd hij tot een hoofd.","7":"David nu woonde op den burg; daarom heet men dien de stad Davids.","8":"En hij bouwde de stad rondom, van Millo af, en rondom henen; en Joab vernieuwde het overige der stad.","9":"En David ging geduriglijk voort, en werd groot, want de HEERE der heirscharen was met hem.","10":"Dezen nu waren de hoofden der helden, die David had, die zich dapper bij hem gedragen hebben in zijn koninkrijk bij geheel Israël, om hem koning te maken, naar het woord des HEEREN over Israël.","11":"Dezen nu zijn van het getal der helden, die David had: Jasobam, de zoon van Hachmoni, was het hoofd der dertigen, die zijn spies tegen driehonderd opheffende, hen op eenmaal versloeg.","12":"En na hem was Eleazar, de zoon van Dodo, de Ahohiet; hij was onder die drie helden.","13":"Hij was met David te Pas-dammim, als de Filistijnen daar ten strijde vergaderd waren, en het stuk des akkers vol gerst was, en het volk voor het aangezicht der Filistijnen vlood;","14":"En zij stelden zich in het midden van dat stuk, en beschermden het, en zij sloegen de Filistijnen; en de HEERE verloste hen door een grote verlossing.","15":"En drie uit de dertig hoofden togen af naar den rotssteen tot David in de spelonk van Adullam; en het leger der Filistijnen had zich gelegerd in het dal Refaim.","16":"En David was toen in de vesting en de bezetting der Filistijnen was toen te Bethlehem.","17":"En David kreeg lust, en zeide: Wie zal mij water te drinken geven uit Bethlehems bornput, die onder de poort is?","18":"Toen braken die drie door het leger der Filistijnen, en putten water uit Bethlehems bornput, die onder de poort is, en zij droegen het en brachten het tot David. Doch David wilde het niet drinken, maar hij goot het uit voor den HEERE;","19":"En hij zeide: Dat late mijn God verre van mij zijn, van zulks te doen! Zou ik het bloed dezer mannen drinken? Met gevaar huns levens, ja, met gevaar huns levens hebben zij dat gebracht. En hij wilde het niet drinken. Dit deden de drie helden.","20":"Abisai nu, de broeder van Joab, was ook het hoofd van drie; en hij, verheffende zijn spies tegen driehonderd, versloeg hen; alzo had hij een naam onder die drie.","21":"Uit die drie was hij geëerd boven de twee; daarom werd hij hun tot een overste; maar hij kwam tot aan de *eerste* drie niet.","22":"Benaja, de zoon van Jojada, de zoon eens dapperen mans van Kabzeel, was groot van daden; hij versloeg twee sterke leeuwen van Moab; ook ging hij af, en versloeg een leeuw in het midden des kuils, in den sneeuwtijd.","23":"Hij versloeg ook een Egyptischen man, een man van grote lengte, van vijf ellen; en die Egyptenaar had een spies in de hand, als een weversboom; maar hij ging tot hem af met een staf, en rukte de spies uit de hand des Egyptenaars, en hij doodde hem met zijn *eigen* spies.","24":"Deze dingen deed Benaja, de zoon van Jojada; dies had hij een naam onder die drie helden.","25":"Ziet, hij was de heerlijkste van die dertig; nochtans kwam hij tot aan de drie niet. En David stelde hem over zijn trawanten.","26":"De helden nu der heiren waren: Asahel, de broeder van Joab; Elhanan, de zoon van Dodo, van Bethlehem;","27":"Sammoth, de Harodiet; Helez, de Peloniet;","28":"Ira, de zoon van Ikkes, de Thekoiet; Abiezer, de Anathothiet;","29":"Sibbechai, de Husathiet; Ilai, de Ahohiet;","30":"Maharai, de Netofathiet; Heled, de zoon van Baäna, de Netofathiet;","31":"Ithai, de zoon van Ribai, van Gibea der kinderen Benjamins; Benaja, de Pirhathoniet;","32":"Hurai, van de beken van Gaas; Abiël; de Arbathiet;","33":"Azmaveth, de Baharumiet; Eljahba, de Saalboniet;","34":"*Van* de kinderen van Hasem, den Gizoniet, was Jonathan, de zoon van Sage, de Harariet;","35":"Ahiam, de zoon van Sachar, de Harariet; Elifal, de zoon van Ur;","36":"Hefer, de Mecherathiet; Ahia, de Peloniet;","37":"Hezro, de Karmeliet; Naäri, de zoon van Ezbai;","38":"Joël, de broeder van Nathan; Mibhar, de zoon van Geri;","39":"Zelek, de Ammoniet; Nahrai, de Berothiet, wapendrager van Joab, den zoon van Zeruja;","40":"Ira, de Jithriet; Gareb, de Jithriet;","41":"Uria, de Hethiet; Zabad, de zoon van Ahlai;","42":"Adina, de zoon van Siza, de Rubeniet, was het hoofd der Rubenieten; nochtans waren er dertig boven hem;","43":"Hanan, de zoon van Maacha, en Josafat, de Mithniet;","44":"Uzzia, de Asterathiet; Sama, en Jeiel, de zoon van Hotham, den Aroeriet;","45":"Jediael, de zoon van Simri, en Joha, zijn broeder, de Tiziet;","46":"Eliël, Hammahavim en Jeribai, en Josavia, de zonen van Elnaam; en Jithma, de Moabiet;","47":"Eliël en Obed, en Jaaziel van Mezobaja."},"KJV":{"1":"Then all Israel gathered themselves to David unto Hebron, saying, Behold, we are thy bone and thy flesh.","2":"And moreover in time past, even when Saul was king, thou wast he that leddest out and broughtest in Israel: and the LORD thy God said unto thee, Thou shalt feed my people Israel, and thou shalt be ruler over my people Israel.","3":"Therefore came all the elders of Israel to the king to Hebron; and David made a covenant with them in Hebron before the LORD; and they anointed David king over Israel, according to the word of the LORD by Samuel.","4":"And David and all Israel went to Jerusalem, which is Jebus; where the Jebusites were, the inhabitants of the land.","5":"And the inhabitants of Jebus said to David, Thou shalt not come hither. Nevertheless David took the castle of Zion, which is the city of David.","6":"And David said, Whosoever smiteth the Jebusites first shall be chief and captain. So Joab the son of Zeruiah went ➔ first up, and was chief.","7":"And David dwelt in the castle; therefore they called it the city of David.","8":"And he built the city round about, even from Millo round about: and Joab repaired the rest of the city.","9":"So David waxed greater and greater: for the LORD of hosts was with him.","10":"These also are the chief of the mighty men whom David had, who strengthened themselves with him in his kingdom, and with all Israel, to make him king, according to the word of the LORD concerning Israel.","11":"And this is the number of the mighty men whom David had; Jashobeam, an Hachmonite, the chief of the captains: he lifted up his spear against three hundred slain by him at one time.","12":"And after him was Eleazar the son of Dodo, the Ahohite, who was one of the three mighties.","13":"He was with David at Pasdammim, and there the Philistines were gathered together to battle, where was a parcel of ground full of barley; and the people fled from before the Philistines.","14":"And they set themselves in the midst of that parcel, and delivered it, and slew the Philistines; and the LORD saved them by a great deliverance.","15":"Now three of the thirty captains went down to the rock to David, into the cave of Adullam; and the host of the Philistines encamped in the valley of Rephaim.","16":"And David was then in the hold, and the Philistines' garrison was then at Bethlehem.","17":"And David longed, and said, Oh that one would give me drink of the water of the well of Bethlehem, that is at the gate!","18":"And the three brake through the host of the Philistines, and drew water out of the well of Bethlehem, that was by the gate, and took it, and brought it to David: but David would not drink of it, but poured it out to the LORD,","19":"And said, My God forbid it me, that I should do this thing: shall I drink the blood of these men that have put their lives in jeopardy? for with the jeopardy of their lives they brought it. Therefore he would not drink it. These things did these three mightiest.","20":"And Abishai the brother of Joab, he was chief of the three: for lifting up his spear against three hundred, he slew them, and had a name among the three.","21":"Of the three, he was more honourable than the two; for he was their captain: howbeit he attained not to the first three.","22":"Benaiah the son of Jehoiada, the son of a valiant man of Kabzeel, who had done many acts; he slew two lionlike men of Moab: also he went down and slew a lion in a pit in a snowy day.","23":"And he slew an Egyptian, a man of great stature, five cubits high; and in the Egyptian's hand was a spear like a weaver's beam; and he went down to him with a staff, and plucked the spear out of the Egyptian's hand, and slew him with his own spear.","24":"These things did Benaiah the son of Jehoiada, and had the name among the three mighties.","25":"Behold, he was honourable among the thirty, but attained not to the first three: and David set him over his guard.","26":"Also the valiant men of the armies were, Asahel the brother of Joab, Elhanan the son of Dodo of Bethlehem,","27":"Shammoth the Harorite, Helez the Pelonite,","28":"Ira the son of Ikkesh the Tekoite, Abiezer the Antothite,","29":"Sibbecai the Hushathite, Ilai the Ahohite,","30":"Maharai the Netophathite, Heled the son of Baanah the Netophathite,","31":"Ithai the son of Ribai of Gibeah, that pertained to the children of Benjamin, Benaiah the Pirathonite,","32":"Hurai of the brooks of Gaash, Abiel the Arbathite,","33":"Azmaveth the Baharumite, Eliahba the Shaalbonite,","34":"The sons of Hashem the Gizonite, Jonathan the son of Shage the Hararite,","35":"Ahiam the son of Sacar the Hararite, Eliphal the son of Ur,","36":"Hepher the Mecherathite, Ahijah the Pelonite,","37":"Hezro the Carmelite, Naarai the son of Ezbai,","38":"Joel the brother of Nathan, Mibhar the son of Haggeri,","39":"Zelek the Ammonite, Naharai the Berothite, the armourbearer of Joab the son of Zeruiah,","40":"Ira the Ithrite, Gareb the Ithrite,","41":"Uriah the Hittite, Zabad the son of Ahlai,","42":"Adina the son of Shiza the Reubenite, a captain of the Reubenites, and thirty with him,","43":"Hanan the son of Maachah, and Joshaphat the Mithnite,","44":"Uzzia the Ashterathite, Shama and Jehiel the sons of Hothan the Aroerite,","45":"Jediael the son of Shimri, and Joha his brother, the Tizite,","46":"Eliel the Mahavite, and Jeribai, and Joshaviah, the sons of Elnaam, and Ithmah the Moabit -code=\"H6106\">bone</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh.</span>","2":"And moreover in <span class=\"wl wl-kjv\" data-code=\"H8543\">time</span> <span class=\"wl wl-kjv\" data-code=\"H8032\">past,</span> even when <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> was <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> thou wast he that leddest <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> and broughtest <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto thee, Thou shalt <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and thou shalt be <span class=\"wl wl-kjv\" data-code=\"H5057\">ruler</span> over my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","3":"Therefore <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> all the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron;</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with them in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and they <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel.</span>","4":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> which is <span class=\"wl wl-kjv\" data-code=\"H2982\">Jebus;</span> where the <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusites</span> were, the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>","5":"And the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H2982\">Jebus</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> hither. Nevertheless <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H4686\">castle</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> which is the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Whosoever <span class=\"wl wl-kjv\" data-code=\"H5221\">smiteth</span> the <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusites</span> <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">captain.</span> So <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">went</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and was <span class=\"wl wl-kjv\" data-code=\"H7218\">chief.</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H4679\">castle;</span> therefore they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> it the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","8":"And he <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> even from <span class=\"wl wl-kjv\" data-code=\"H4407\">Millo</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about:</span> and <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">repaired</span> the <span class=\"wl wl-kjv\" data-code=\"H7605\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>","9":"So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">waxed</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">greater</span> and <span class=\"wl wl-kjv\" data-code=\"H1419\">greater:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> was with him.","10":"These also are the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> whom <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had, who <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> themselves with him in his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom,</span> and with all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to make him <span class=\"wl wl-kjv\" data-code=\"H4427\">king,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> concerning <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","11":"And this is the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> whom <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had; <span class=\"wl wl-kjv\" data-code=\"H3434\">Jashobeam,</span> an <span class=\"wl wl-kjv\" data-code=\"H2453\">Hachmonite,</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H7991\">captains:</span> he lifted <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> against <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> by him at <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">time.</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him was <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1734\">Dodo,</span> the <span class=\"wl wl-kjv\" data-code=\"H266\">Ahohite,</span> who was one of the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1368\">mighties.</span>","13":"He was with <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> at <span class=\"wl wl-kjv\" data-code=\"H6450\">Pasdammim,</span> and there the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> were gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> where was a <span class=\"wl wl-kjv\" data-code=\"H2513\">parcel</span> of <span class=\"wl wl-kjv\" data-code=\"H7704\">ground</span> <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>","14":"And they <span class=\"wl wl-kjv\" data-code=\"H3320\">set</span> themselves in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of that <span class=\"wl wl-kjv\" data-code=\"H2513\">parcel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> it, and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> them by a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8668\">deliverance.</span>","15":"Now <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> of the <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">captains</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> into the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> of <span class=\"wl wl-kjv\" data-code=\"H5725\">Adullam;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H7497\">Rephaim.</span>","16":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was then in the <span class=\"wl wl-kjv\" data-code=\"H4686\">hold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines'</span> <span class=\"wl wl-kjv\" data-code=\"H5333\">garrison</span> was then at <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H183\">longed,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Oh that one would give me <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> of the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of the <span class=\"wl wl-kjv\" data-code=\"H953\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem,</span> that is at the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate!</span>","18":"And the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> brake <span class=\"wl wl-kjv\" data-code=\"H1234\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and <span class=\"wl wl-kjv\" data-code=\"H7579\">drew</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> out of the <span class=\"wl wl-kjv\" data-code=\"H953\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem,</span> that was by the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">took</span> it, and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it to <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> but <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of it, but poured it <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span>","19":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2486\">forbid</span> it me, that I should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H2063\">thing:</span> shall I <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of these <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that have put their lives in <span class=\"wl wl-kjv\" data-code=\"H5315\">jeopardy?</span> for with the jeopardy of their <span class=\"wl wl-kjv\" data-code=\"H5315\">lives</span> they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it. Therefore he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> it. These things <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> these <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1368\">mightiest.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> the <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> he was <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H7969\">three:</span> for lifting <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> against <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred,</span> he <span class=\"wl wl-kjv\" data-code=\"H2491\">slew</span> them, and had a <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> among the <span class=\"wl wl-kjv\" data-code=\"H7969\">three.</span>","21":"Of the <span class=\"wl wl-kjv\" data-code=\"H7969\">three,</span> he was more <span class=\"wl wl-kjv\" data-code=\"H3513\">honourable</span> than the <span class=\"wl wl-kjv\" data-code=\"H8147\">two;</span> for he was their <span class=\"wl wl-kjv\" data-code=\"H8269\">captain:</span> howbeit he <span class=\"wl wl-kjv\" data-code=\"H935\">attained</span> not to the first <span class=\"wl wl-kjv\" data-code=\"H7969\">three.</span>","22":"<span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of a <span class=\"wl wl-kjv\" data-code=\"H2428\">valiant</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H6909\">Kabzeel,</span> who had done <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H6467\">acts;</span> he <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> lionlike <span class=\"wl wl-kjv\" data-code=\"H739\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab:</span> also he went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">in</span> a <span class=\"wl wl-kjv\" data-code=\"H953\">pit</span> in a <span class=\"wl wl-kjv\" data-code=\"H7950\">snowy</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","23":"And he <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> an <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptian,</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of great <span class=\"wl wl-kjv\" data-code=\"H4060\">stature,</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits</span> high; and in the <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptian's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> was a <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> like a <span class=\"wl wl-kjv\" data-code=\"H707\">weaver's</span> <span class=\"wl wl-kjv\" data-code=\"H4500\">beam;</span> and he went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to him with a <span class=\"wl wl-kjv\" data-code=\"H7626\">staff,</span> and <span class=\"wl wl-kjv\" data-code=\"H1497\">plucked</span> the <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptian's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> him with his own <span class=\"wl wl-kjv\" data-code=\"H2595\">spear.</span>","24":"These things <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada,</span> and had the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> among the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1368\">mighties.</span>","25":"<span class=\"wl wl-kjv\" data-code=\"H2009\">Behold,</span> he was <span class=\"wl wl-kjv\" data-code=\"H3513\">honourable</span> among j heelde, repareerde of verbeterde het vervallene. Anders, liet leven."}],"9":[{"catchword":"ging","tekst":"Hebreeuws, ging gaande, groot wordende."}],"10":[{"catchword":"in zijn koninkrijk","tekst":"Dat is, in den handel, belangende het koninkrijk. Daarin hebben zich die mannen bij al de Israëlieten dapperlijk en kloekelijk gedragen, inzonderheid in het innemen van Jebus."},{"catchword":"om hem koning te maken,","tekst":"Dat is, dat hij, die tevoren door Samuël tot koning gezalfd was, na den dood van Saul in het koninkrijk gesteld en bevestigd mocht worden. Daartoe hebben hem deze helden geholpen tegen zijn vijanden."}],"11":[{"catchword":"Dezen nu","tekst":"Uit dezen heeft David gekozen de oversten, die ordinairlijk bij hem in het leger waren."},{"catchword":"Jasóbam,","tekst":"Vergelijk dit met 2Sa 23:8 ."}],"12":[{"catchword":"onder die","tekst":"Versta Jasobam, die de eerste was, Eleazar de tweede en Samma de derde, die hier wordt voorbijgegaan, maar hij wordt uitgedrukt, 2Sa 23:11 . Deze drie zijn het, die het water uit den bornput te Bethlehem voor David haalden."}],"13":[{"catchword":"Pas-dammim,","tekst":"Anders, Dammin, 1Sa 17:1 ."}],"14":[{"catchword":"zij stelden zich","tekst":"Te weten, die voorgemelde helden. Zie 2Sa 23:11 ."}],"17":[{"catchword":"Wie zal","tekst":"Dat is, ik wens dat er iemand ware, die mij te drinken gaf uit dien bornput, enz."}],"18":[{"catchword":"putten water","tekst":"Anders, schepten."},{"catchword":"voor den HEERE;","tekst":"Dat is, God ter ere."}],"19":[{"catchword":"Dat late mijn God","tekst":"Hebreeuws, dat zij mij van mijn God verre."},{"catchword":"Zou ik","tekst":"Zie 2Sa 23:17 ."},{"catchword":"Met gevaar","tekst":"Hebreeuws, met, of, op hun zielen; dat is, met gevaar van hun leven."},{"catchword":"met gevaar huns levens","tekst":"David herhaalt zijn vorige woorden, uit grote verwondering. Zie gelijke manier van spreken Gen 49:4 ."}],"20":[{"catchword":"drie;","tekst":"Te weten, van welken straks zal gesproken worden, va // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
