n van Juda.","5":"En van de Silonieten was Asaja, de eerstgeborene, en zijn kinderen.","6":"En van de kinderen van Zerah was Jeüel, en van hun broeders waren zeshonderd negentig.","7":"En van de kinderen van Benjamin waren Sallu, de zoon van Mesullam, de zoon van Hodavia, de zoon van Hassenua;","8":"En Jibnea, de zoon van Jeroham, en Ela, de zoon van Uzzi, de zoon van Michri; en Mesullam, de zoon van Sefatja, de zoon van Reüel, de zoon van Jibnija;","9":"En hun broeders naar hun geslachten, negenhonderdzesenvijftig; al deze mannen waren hoofden van de vaderen in de huizen van hun vaderen.","10":"Van de priesters nu, Jedaja, en Jojarib, en Jachin,","11":"En Azarja, de zoon van Hilkija, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, leider van het huis van God;","12":"En Adaja, de zoon van Jeroham, de zoon van Pashur, de zoon van Malchija; en Massi, de zoon van Adiël, de zoon van Jahzera, de zoon van Mesullam, de zoon van Mesillemith, de zoon van Immer.","13":"Daartoe hun broeders, hoofden in de huizen van hun vaderen, duizend zevenhonderdzestig, kloeke helden voor het werk van de dienst van het huis van God.","14":"Van de Levieten nu waren Semaja, de zoon van Hasub, de zoon van Azrikam, de zoon van Hasabja, van de kinderen van Merari;","15":"En Bakbakkar, Heres, en Galal, en Mattanja, de zoon van Micha, de zoon van Zichri, de zoon van Asaf;","16":"En Obadja, de zoon van Semaja, de zoon van Galal, de zoon van Jeduthun; en Berechja, de zoon van Asa, de zoon van Elkana, woonachtig in de dorpen van de Netofathieten.","17":"De poortwachters nu waren: Sallum, en Akkub, en Talmon, en Ahiman, en hun broeders; Sallum was het hoofd.","18":"Ook tot nu toe, aan de poort van de koning oostwaarts, waren dezen de poortwachters onder de legers van de kinderen van Levi.","19":"En Sallum, de zoon van Kore, de zoon van Ebjasaf, de zoon van Korah, en zijn broeders van het huis van zijn vader, de Korahieten, waren over het werk van de dienst, wachters van de dorpels van de tabernakel; zoals hun vaders in het leger van de HEERE geweest waren bewaarders van de ingang;","20":"Zoals Pinehas, de zoon van Eleazar, vroeger voorganger over hen was, met wie de HEERE was.","21":"Zacharja, de zoon van Meselemja, was poortwachter aan de deur van de tent van de samenkomst.","22":"Allen die uitgekozen waren tot poortwachters aan de dorpels, waren tweehonderdtwaalf. Dezen waren in het geslachtsregister ingeschreven naar hun dorpen. David en Samuël, de ziener, hadden hen in hun ambt bevestigd.","23":"Zij dan en hun zonen waren aan de poorten van het huis van de HEERE, in het huis van de tent, aan de wachten.","24":"Die poortwachters waren aan de vier windstreken, tegen het oosten, tegen het westen, tegen het noorden en tegen het zuiden.","25":"En hun broeders waren op hun dorpen, en kwamen elke zevende dag van tijd tot tijd bij hen om *te dienen*;","26":"Want in dat ambt waren vier leidende poortwachters, die Levieten waren; en zij waren over de kamers en over de schatten van het huis van God.","27":"En zij bleven overnachten rondom het huis van God; want op hen was de wacht, en zij waren over de opening, en dat elke morgen.","28":"En *enigen* van hen waren over de voorwerpen van de dienst; want zij droegen ze in op basis van getal, en op basis van getal droegen zij ze uit.","29":"Want uit hen zijn er aangesteld over de voorwerpen, en over al de heilige voorwerpen, en over de meelbloem, en wijn, en olie, en wierook, en specerijen.","30":"En uit de zonen van de priesters waren van het bereider van het reukwerk van de specerijen.","31":"En Mattithja uit de Levieten, hij was de eerstgeborene van Sallum, de Korahiet, was in het ambt over het werk dat in pannen gebakken wordt.","32":"En uit de kinderen van de Kahathieten, uit hun broeders, waren *enigen* over de broden van de bereiding, om die elke sabbat te bereiden.","33":"*Uit* dezen zijn ook de zangers, hoofden van de vaderen onder de Levieten, in de kamers, vrijgesteld van andere dienst; want dag en nacht waren zij bezig met dat werk.","34":"Dit zijn de hoofden van de vaderen onder de Levieten, hoofden in hun geslachten; dezen woonden te Jeruzalem.","35":"Maar te Gibeon hadden gewoond Jeiel, de vader van Gibeon; de naam van zijn zuster nu was Maächa.","36":"En Abdon was zijn eerstgeboren zoon, daarna Zur, en Kis, en Baäl, en Ner, en Nadab.","37":"En Gedor, en Ahio, en Zacharja, en Mikloth.","38":"Mikloth nu verwekte Simeam; dezen woonden ook te Jeruzalem, tegenover hun broeders, met hun broeders.","39":"En Ner verwekte Kis, en Kis verwekte Saul, en Saul verwekte Jonathan, en Malchi-sua, en Abinadab, en Esbaal.","40":"En Jonathans zoon was Merib-baal, en Merib-baal verwekte Micha.","41":"De kinderen van Micha nu waren Pithon, en Melech, en Thaerea.","42":"En Achaz verwekte Jaera, en Jaera verwekte Alemeth, en Azmaveth, en Zimri; en Zimri verwekte Moza;","43":"En Moza verwekte Bina; wiens zoon was Refaja; wiens zoon was Elasa; wiens zoon was Azel.","44":"Azel nu had zes zonen, en dit zijn hun namen: Azrikam, Bochru, en Ismaël, en Searja, en Obadja, en Hanan; dezen zijn Azels zonen."},"SV":{"1":"En gans Israël werd in geslachtsregisters geteld, en ziet, zij zijn geschreven in het boek der koningen van Israël. En die van Juda waren weggevoerd naar Babel, om hunner overtredingen wil.","2":"De eerste inwoners nu, die in hun bezitting, in hun steden *kwamen*, waren de Israëlieten, de priesters, de Levieten, en de Nethinim.","3":"Maar te Jeruzalem woonden van de kinderen van Juda, en van de kinderen van Benjamin, en van de kinderen van Efraïm en Manasse;","4":"Uthai, de zoon van Ammihud, den zoon van Omri, den zoon van Imri, den zoon van Bani, van de kinderen van Perez, den zoon van Juda.","5":"En van de Silonieten was Asaja, de eerstgeborene, en zijn kinderen.","6":"En van de kinderen van Zerah was Jeüel, en van hun broederen waren zeshonderd en negentig.","7":"En van de kinderen van Benjamin waren Sallu, de zoon van Mesullam, den zoon van Hodavia, den zoon van Hassenua;","8":"En Jibnea, de zoon van Jeroham, en Ela, de zoon van Uzzi, den zoon van Michri; en Mesullam, de zoon van Sefatja, den zoon van Reüel, den zoon van Jibnija;","9":"En hun broederen naar hun geslachten, negenhonderd zes en vijftig; al deze mannen waren hoofden der vaderen in de huizen hunner vaderen.","10":"Van de priesteren nu, Jedaja, en Jojarib, en Jachin,","11":"En Azarja, de zoon van Hilkija, den zoon van Mesullam, den zoon van Zadok, den zoon van Merajoth, den zoon van Ahitub, overste van het huis Gods;","12":"En Adaja, de zoon van Jeroham, den zoon van Pashur, den zoon van Malchija; en Massi, de zoon van Adiël, den zoon van Jahzera, den zoon van Mesullam, den zoon van Mesillemith, den zoon van Immer.","13":"Daartoe hun broeders, hoofden in de huizen hunner vaderen, duizend zevenhonderd en zestig, kloeke helden aan het werk van den dienst van het huis Gods.","14":"Van de Levieten nu waren Semaja, de zoon van Hasub, den zoon van Azrikam, den zoon van Hasabja, van de kinderen van Merari;","15":"En Bakbakkar, Heres, en Galal, en Mattanja, de zoon van Micha, den zoon van Zichri, den zoon van Asaf;","16":"En Obadja, de zoon van Semaja, den zoon van Galal, den zoon van Jeduthun; en Berechja, de zoon van Asa, den zoon van Elkana, woonachtig in de dorpen der Netofathieten.","17":"De poortiers nu waren: Sallum, en Akkub, en Talmon, en Ahiman, en hun broeders; Sallum was het hoofd.","18":"Ook tot nog toe, aan de poort des konings oostwaarts, waren dezen de poortiers onder de legers der kinderen van Levi.","19":"En Sallum, de zoon van Kore, den zoon van Ebjasaf, den zoon van Korah, en zijn broeders van het huis zijns vaders, de Korahieten, waren over het werk van den dienst, wachters der dorpelen des tabernakels; gelijk hun vaders in het leger des HEEREN geweest waren bewaarders van den ingang;","20":"Als Pinehas, de zoon van Eleazar, te voren voorganger bij hen was, met welken de HEERE was.","21":"Zacharja, de zoon van Meselemja, was poortier aan de deur van de tent der samenkomst.","22":"Allen, die uitgelezen waren tot poortiers aan de dorpelen, waren tweehonderd en twaalf. Dezen waren in het geslachtsregister gesteld naar hun dorpen. David en Samuël, de ziener, hadden hen in hun ambt bevestigd.","23":"Zij dan en hun zonen waren aan de poorten van het huis des HEEREN, in het huis der tent, aan de wachten.","24":"Die poortiers waren aan de vier winden, tegen het oosten, tegen het westen, tegen het noorden, en tegen het zuiden.","25":"En hun broeders waren op hun dorpen, inkomende ten zevenden dage van tijd tot tijd, om met hen *te* *dienen*;","26":"Want in dat ambt waren vier overste poortiers, die Levieten waren; en zij waren over de kameren en over de schatten van het huis Gods.","27":"En zij bleven over nacht rondom het huis Gods; want op hen was de wacht, en zij waren over de opening, en dat allen morgen.","28":"En *enigen* van hen waren over de vaten van den dienst; want bij getal droegen zij ze in, en bij getal droegen zij ze uit.","29":"Want uit dezelve zijn er besteld over de vaten, en over al de heilige vaten, en over de meelbloem, en wijn, en olie, en wierook, en specerij.","30":"En uit de zonen der priesteren waren de bereiders van het reukwerk der specerijen.","31":"En Mattithja uit de Levieten, dewelke was de eerstgeborene van Sallum, den Korahiet, was in het ambt over het werk, dat in pannen gekookt wordt.","32":"En uit de kinderen der Kahathieten, uit hun broederen, waren *enigen* over de broden der toerichting, om *die* alle sabbatten te bereiden.","33":"*Uit* dezen zijn ook de zangers, hoofden der vaderen onder de Levieten in de kameren, dienstvrij ; want dag en nacht was het op hen, in dat werk te zijn.","34":"Dit zijn de hoofden der vaderen onder de Levieten, hoofden in hun geslachten; dezen woonden te Jeruzalem.","35":"Maar te Gibeon hadden gewoond Jeiel, de vader van Gibeon; de naam zijner zuster nu was Maacha.","36":"En Abdon was zijn eerstgeboren zoon, daarna Zur, en Kis, en Baäl, en Ner, en Nadab.","37":"En Gedor, en Ahio, en Zacharja, en Mikloth.","38":"Mikloth nu gewon Simeam; dezen woonden ook te Jeruzalem, tegenover hun broederen, met hun broederen.","39":"En Ner gewon Kis, en Kis gewon Saul, en Saul gewon Jonathan, en Malchi-sua, en Abinadab, en Esbaal.","40":"En Jonathans zoon van Merib-baal, en Merib-baal gewon Micha.","41":"De kinderen van Micha nu waren Pithon, en Melech, en Thaerea.","42":"En Achaz gewon Jaera, en Jaera gewon Alemeth, en Azmaveth, en Zimri; en Zimri gewon Moza;","43":"En Moza gewon Bina; wiens zoon was Refaja; wiens zoon was Elasa; wiens zoon was Azel.","44":"Azel nu had zes zonen, en dit zijn hun namen: Azrikam, Bochru, en Ismaël, en Searja, en Obadja, en Hanan; dezen zijn Azels zonen."},"KJV":{"1":"So all Israel were reckoned by genealogies; and, behold, they were written in the book of the kings of Israel and Judah, who were carried away to Babylon for their transgression.","2":"Now the first inhabitants that dwelt in their possessions in their cities were, the Israelites, the priests, Levites, and the Nethinims.","3":"And in Jerusalem dwelt of the children of Judah, and of the children of Benjamin, and of the children of Ephraim, and Manasseh;","4":"Uthai the son of Ammihud, the son of Omri, the son of Imri, the son of Bani, of the children of Pharez the son of Judah.","5":"And of the Shilonites; Asaiah the firstborn, and his sons.","6":"And of the sons of Zerah; Jeuel, and their brethren, six hundred and ninety.","7":"And of the sons of Benjamin; Sallu the son of Meshullam, the son of Hodaviah, the son of Hasenuah,","8":"And Ibneiah the son of Jeroham, and Elah the son of Uzzi, the son of Michri, and Meshullam the son of Shephathiah, the son of Reuel, the son of Ibnijah;","9":"And their brethren, according to their generations, nine hundred and fifty and six. All these men were chief of the fathers in the house of their fathers.","10":"And of the priests; Jedaiah, and Jehoiarib, and Jachin,","11":"And Azariah the son of Hilkiah, the son of Meshullam, the son of Zadok, the son of Meraioth, the son of Ahitub, the ruler of the house of God;","12":"And Adaiah the son of Jeroham, the son of Pashur, the son of Malchijah, and Maasiai the son of Adiel, the son of Jahzerah, the son of Meshullam, the son of Meshillemith, the son of Immer;","13":"And their brethren, heads of the house of their fathers, a thousand and seven hundred and threescore; very able men for the work of the service of the house of God.","14":"And of the Levites; Shemaiah the son of Hasshub, the son of Azrikam, the son of Hashabiah, of the sons of Merari;","15":"And Bakbakkar, Heresh, and Galal, and Mattaniah the son of Micah, the son of Zichri, the son of Asaph;","16":"And Obadiah the son of Shemaiah, the son of Galal, the son of Jeduthun, and Berechiah the son of Asa, the son of Elkanah, that dwelt in the villages of the Netophathites.","17":"And the porters were, Shallum, and Akkub, and Talmon, and Ahiman, and their brethren: Shallum was the chief;","18":"Who hitherto waited in the king's gate eastward: they were porters in the companies of the children of Levi.","19":"And Shallum the son of Kore, the son of Ebiasaph, the son of Korah, and his brethren, of the house of his father, the Korahites, were over the work of the service, keepers of the gates of the tabernacle: and their fathers, being over the host of the LORD, were keepers of the entry.","20":"And Phinehas the son of Eleazar was the ruler over them in time past, and the LORD was with him.","21":"And Zechariah the son of Meshelemiah was porter of the door of the tabernacle of the congregation.","22":"All these which were chosen to be porters in the gates were two hundred and twelve. These were reckoned by their genealogy in their villages, whom David and Samuel the seer did ordain in their set office.","23":"So they and their children had the oversight of the gates of the house of the LORD, namely, the house of the tabernacle, by wards.","24":"In four quarters were the porters, toward the east, west, north, and south.","25":"And their brethren, which were in their villages, were to come after seven days from time to time with them.","26":"For these Levites, the four chief porters, were in their set office, and were over the chambers and treasuries of the house of God.","27":"And they lodged round about the house of God, because the charge was upon them, and the opening thereof every morning pertained to them.","28":"And certain of them had the charge of the ministering vessels, that they should bring them in and out by tale.","29":"Some of them also were appointed to oversee the vessels, and all the instruments of the sanctuary, and the fine flour, and the wine, and the oil, and the frankincense, and the spices.","30":"And some of the sons of the priests made the ointment of the spices.","31":"And Mattithiah, one of the Levites, who was the firstborn of Shallum the Korahite, had the set office over the things that were made in the pans.","32":"And other of their brethren, of the sons of the Kohathites, were over the shewbread, to prepare it every sabbath.","33":"And these are the singers, chief of the fathers of the Levites, who remaining in the chambers were free: for they were employed in that work day and night.","34":"These chief fathers of the Levites were chief throughout their generations; these dwelt at Jerusalem.","35":"And in Gibeon dwelt the father of Gibeon, Jehiel, whose wife's name was Maachah:","36":"And his firstborn son Abdon, then Zur, and Kish, and Baal, and Ner, and Nadab,","37":"And Gedor, and Ahio, and Zechariah, and Mikloth.","38":"And Mikloth begat Shimeam. And they also dwelt with their brethren at Jerusalem, over against their brethren.","39":"And Ner begat Kish; and Kish begat Saul; and Saul begat Jonathan, and Malchishua, and Abinadab, and Eshbaal.","40":"And the son of Jonathan was Meribbaal: and Meribbaal begat Micah.","41":"And the sons of Micah were, Pithon, and Melech, and Tahrea, and Ahaz.","42":"And Ahaz begat Jarah; and Jarah begat Alemeth, and Azmaveth, and Zimri; and Zimri begat Moza;","43":"And Moza begat Binea; and Rephaiah his son, Eleasah his son, Azel his son.","44":"And Azel had six sons, whose names are these, Azrikam, Bocheru, and Ishmael, and Sheariah, and Obadiah, and Hanan: these were the sons of Azel."}},"tsk":{"1":[{"kopje":"Heel Israël","refs":["Ezra 2:59","Ezra 2:62","Ezra 2:63","Neh 7:5","Neh 7:64","Matt 1:1-16","Luk 3:28-38"]},{"kopje":"weggevoerd","refs":["2 Kron 33:11","2 Kron 36:9","2 Kron 36:10","2 Kron 36:18-20","Jer 39:9","Jer 52:14","Jer 52:15","Dan 1:2"]}],"2":[{"kopje":"De eerste","refs":["Ezra 2:70","Neh 8:1","Neh 11:3"]},{"kopje":"de Nethinim","refs":["Joz 9:21-27","Ezra 2:43","Ezra 2:58","Ezra 8:20","Neh 7:60","Neh 8:1","Neh 11:3","Neh 11:21"]}],"3":[{"kopje":"Jeruzalem","refs":["Neh 11:1","Neh 11:4-9"]},{"kopje":"van de kinderen van Efraïm","refs":["2 Kron 11:16","2 Kron 30:11"]}],"4":[{"kopje":"Bani","refs":["Neh 8:8","Neh 10:13"]},{"kopje":"Perez","refs":["1 Kron 2:5","1 Kron 4:1","Gen 46:12","Num 26:20","Neh 11:4","Neh 11:6"]}],"5":[{"kopje":"Silonieten","refs":["Num 26:20","Neh 11:5"]}],"6":[{"kopje":"Zerah","refs":["1 Kron 2:4","1 Kron 2:6","Gen 38:30","Num 26:20"]}],"7":[{"kopje":"Sallu","refs":["Neh 8:5","Neh 10:20","Neh 11:7"]}],"10":[{"kopje":"Jojarib","refs":["Neh 11:10-24","Neh 12:19"]}],"11":[{"kopje":"Azarja","refs":["1 Kron 6:8-15","Neh 10:2","Neh 11:11"]},{"kopje":"leider","refs":["1 Kron 24:5","Num 4:15","Num 4:16","Num 4:28","Num 4:33","2 Kon 23:4","2 Kon 25:18","Neh 11:11","Hand 5:24","Hand 5:26"]}],"12":[{"kopje":"Mesillemith","refs":["Neh 11:12","Neh 11:13"]},{"kopje":"Immer","refs":["1 Kron 24:14","Ezra 2:37","Neh 7:40"]}],"13":[{"kopje":"kloeke helden","refs":["1 Kron 26:6","1 Kron 26:30","1 Kron 26:32","Neh 11:14"]}],"14":[{"kopje":"Semaja","refs":["Neh 11:15"]},{"kopje":"Hasabja","refs":["Neh 10:11","Neh 12:24"]},{"kopje":"van de kinderen","refs":["1 Kron 6:19","1 Kron 6:29","1 (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
