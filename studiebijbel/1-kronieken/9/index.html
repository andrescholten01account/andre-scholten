ers geteld, en zie, zij zijn geschreven in het boek van de koningen van Israël. En die van Juda waren weggevoerd naar Babel, vanwege hun overtredingen.", "2": "De eerste inwoners nu, die in hun bezitting, in hun steden *kwamen*, waren de Israëlieten, de priesters, de Levieten en de Nethinim.", "3": "Maar te Jeruzalem woonden van de kinderen van Juda, en van de kinderen van Benjamin, en van de kinderen van Efraïm en Manasse;", "4": "Uthai, de zoon van Ammihud, de zoon van Omri, de zoon van Imri, de zoon van Bani, van de kinderen van Perez, de zoon van Juda.", "5": "En van de Silonieten was Asaja, de eerstgeborene, en zijn kinderen.", "6": "En van de kinderen van Zerah was Jeüel, en van hun broeders waren zeshonderd negentig.", "7": "En van de kinderen van Benjamin waren Sallu, de zoon van Mesullam, de zoon van Hodavia, de zoon van Hassenua;", "8": "En Jibnea, de zoon van Jeroham, en Ela, de zoon van Uzzi, de zoon van Michri; en Mesullam, de zoon van Sefatja, de zoon van Reüel, de zoon van Jibnija;", "9": "En hun broeders naar hun geslachten, negenhonderdzesenvijftig; al deze mannen waren hoofden van de vaderen in de huizen van hun vaderen.", "10": "Van de priesters nu, Jedaja, en Jojarib, en Jachin,", "11": "En Azarja, de zoon van Hilkija, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, leider van het huis van God;", "12": "En Adaja, de zoon van Jeroham, de zoon van Pashur, de zoon van Malchija; en Massi, de zoon van Adiël, de zoon van Jahzera, de zoon van Mesullam, de zoon van Mesillemith, de zoon van Immer.", "13": "Daartoe hun broeders, hoofden in de huizen van hun vaderen, duizend zevenhonderdzestig, kloeke helden voor het werk van de dienst van het huis van God.", "14": "Van de Levieten nu waren Semaja, de zoon van Hasub, de zoon van Azrikam, de zoon van Hasabja, van de kinderen van Merari;", "15": "En Bakbakkar, Heres, en Galal, en Mattanja, de zoon van Micha, de zoon van Zichri, de zoon van Asaf;", "16": "En Obadja, de zoon van Semaja, de zoon van Galal, de zoon van Jeduthun; en Berechja, de zoon van Asa, de zoon van Elkana, woonachtig in de dorpen van de Netofathieten.", "17": "De poortwachters nu waren: Sallum, en Akkub, en Talmon, en Ahiman, en hun broeders; Sallum was het hoofd.", "18": "Ook tot nu toe, aan de poort van de koning oostwaarts, waren dezen de poortwachters onder de legers van de kinderen van Levi.", "19": "En Sallum, de zoon van Kore, de zoon van Ebjasaf, de zoon van Korah, en zijn broeders van het huis van zijn vader, de Korahieten, waren over het werk van de dienst, wachters van de dorpels van de tabernakel; zoals hun vaders in het leger van de HEERE geweest waren bewaarders van de ingang;", "20": "Zoals Pinehas, de zoon van Eleazar, vroeger voorganger over hen was, met wie de HEERE was.", "21": "Zacharja, de zoon van Meselemja, was poortwachter aan de deur van de tent van de samenkomst.", "22": "Allen die uitgekozen waren tot poortwachters aan de dorpels, waren tweehonderdtwaalf. Dezen waren in het geslachtsregister ingeschreven naar hun dorpen. David en Samuël, de ziener, hadden hen in hun ambt bevestigd.", "23": "Zij dan en hun zonen waren aan de poorten van het huis van de HEERE, in het huis van de tent, aan de wachten.", "24": "Die poortwachters waren aan de vier windstreken, tegen het oosten, tegen het westen, tegen het noorden en tegen het zuiden.", "25": "En hun broeders waren op hun dorpen, en kwamen elke zevende dag van tijd tot tijd bij hen om *te dienen*;", "26": "Want in dat ambt waren vier leidende poortwachters, die Levieten waren; en zij waren over de kamers en over de schatten van het huis van God.", "27": "En zij bleven overnachten rondom het huis van God; want op hen was de wacht, en zij waren over de opening, en dat elke morgen.", "28": "En *enigen* van hen waren over de voorwerpen van de dienst; want zij droegen ze in op basis van getal, en op basis van getal droegen zij ze uit.", "29": "Want uit hen zijn er aangesteld over de voorwerpen, en over al de heilige voorwerpen, en over de meelbloem, en wijn, en olie, en wierook, en specerijen.", "30": "En uit de zonen van de priesters waren van het bereider van het reukwerk van de specerijen.", "31": "En Mattithja uit de Levieten, hij was de eerstgeborene van Sallum, de Korahiet, was in het ambt over het werk dat in pannen gebakken wordt.", "32": "En uit de kinderen van de Kahathieten, uit hun broeders, waren *enigen* over de broden van de bereiding, om die elke sabbat te bereiden.", "33": "*Uit* dezen zijn ook de zangers, hoofden van de vaderen onder de Levieten, in de kamers, vrijgesteld van andere dienst; want dag en nacht waren zij bezig met dat werk.", "34": "Dit zijn de hoofden van de vaderen onder de Levieten, hoofden in hun geslachten; dezen woonden te Jeruzalem.", "35": "Maar te Gibeon hadden gewoond Jeiel, de vader van Gibeon; de naam van zijn zuster nu was Maächa.", "36": "En Abdon was zijn eerstgeboren zoon, daarna Zur, en Kis, en Baäl, en Ner, en Nadab.", "37": "En Gedor, en Ahio, en Zacharja, en Mikloth.", "38": "Mikloth nu verwekte Simeam; dezen woonden ook te Jeruzalem, tegenover hun broeders, met hun broeders.", "39": "En Ner verwekte Kis, en Kis verwekte Saul, en Saul verwekte Jonathan, en Malchi-sua, en Abinadab, en Esbaal.", "40": "En Jonathans zoon was Merib-baal, en Merib-baal verwekte Micha.", "41": "De kinderen van Micha nu waren Pithon, en Melech, en Thaerea.", "42": "En Achaz verwekte Jaera, en Jaera verwekte Alemeth, en Azmaveth, en Zimri; en Zimri verwekte Moza;", "43": "En Moza verwekte Bina; wiens zoon was Refaja; wiens zoon was Elasa; wiens zoon was Azel.", "44": "Azel nu had zes zonen, en dit zijn hun namen: Azrikam, Bochru, en Ismaël, en Searja, en Obadja, en Hanan; dezen zijn Azels zonen."}, "SV": {"1": "En gans Israël werd in geslachtsregisters geteld, en ziet, zij zijn geschreven in het boek der koningen van Israël. En die van Juda waren weggevoerd naar Babel, om hunner overtredingen wil.", "2": "De eerste inwoners nu, die in hun bezitting, in hun steden *kwamen*, waren de Israëlieten, de priesters, de Levieten, en de Nethinim.", "3": "Maar te Jeruzalem woonden van de kinderen van Juda, en van de kinderen van Benjamin, en van de kinderen van Efraïm en Manasse;", "4": "Uthai, de zoon van Ammihud, den zoon van Omri, den zoon van Imri, den zoon van Bani, van de kinderen van Perez, den zoon van Juda.", "5": "En van de Silonieten was Asaja, de eerstgeborene, en zijn kinderen.", "6": "En van de kinderen van Zerah was Jeüel, en van hun broederen waren zeshonderd en negentig.", "7": "En van de kinderen van Benjamin waren Sallu, de zoon van Mesullam, den zoon van Hodavia, den zoon van Hassenua;", "8": "En Jibnea, de zoon van Jeroham, en Ela, de zoon van Uzzi, den zoon van Michri; en Mesullam, de zoon van Sefatja, den zoon van Reüel, den zoon van Jibnija;", "9": "En hun broederen naar hun geslachten, negenhonderd zes en vijftig; al deze mannen waren hoofden der vaderen in de huizen hunner vaderen.", "10": "Van de priesteren nu, Jedaja, en Jojarib, en Jachin,", "11": "En Azarja, de zoon van Hilkija, den zoon van Mesullam, den zoon van Zadok, den zoon van Merajoth, den zoon van Ahitub, overste van het huis Gods;", "12": "En Adaja, de zoon van Jeroham, den zoon van Pashur, den zoon van Malchija; en Massi, de zoon van Adiël, den zoon van Jahzera, den zoon van Mesullam, den zoon van Mesillemith, den zoon van Immer.", "13": "Daartoe hun broeders, hoofden in de huizen hunner vaderen, duizend zevenhonderd en zestig, kloeke helden aan het werk van den dienst van het huis Gods.", "14": "Van de Levieten nu waren Semaja, de zoon van Hasub, den zoon van Azrikam, den zoon van Hasabja, van de kinderen van Merari;", "15": "En Bakbakkar, Heres, en Galal, en Mattanja, de zoon van Micha, den zoon van Zichri, den zoon van Asaf;", "16": "En Obadja, de zoon van Semaja, den zoon van Galal, den zoon van Jeduthun; en Berechja, de zoon van Asa, den zoon van Elkana, woonachtig in de dorpen der Netofathieten.", "17": "De poortiers nu waren: Sallum, en Akkub, en Talmon, en Ahiman, en hun broeders; Sallum was het hoofd.", "18": "Ook tot nog toe, aan de poort des konings oostwaarts, waren dezen de poortiers onder de legers der kinderen van Levi.", "19": "En Sallum, de zoon van Kore, den zoon van Ebjasaf, den zoon van Korah, en zijn broeders van het huis zijns vaders, de Korahieten, waren over het werk van den dienst, wachters der dorpelen des tabernakels; gelijk hun vaders in het leger des HEEREN geweest waren bewaarders van den ingang;", "20": "Als Pinehas, de zoon van Eleazar, te voren voorganger bij hen was, met welken de HEERE was.", "21": "Zacharja, de zoon van Meselemja, was poortier aan de deur van de tent der samenkomst.", "22": "Allen, die uitgelezen waren tot poortiers aan de dorpelen, waren tweehonderd en twaalf. Dezen waren in het geslachtsregister gesteld naar hun dorpen. David en Samuël, de ziener, hadden hen in hun ambt bevestigd.", "23": "Zij dan en hun zonen waren aan de poorten van het huis des HEEREN, in het huis der tent, aan de wachten.", "24": "Die poortiers waren aan de vier winden, tegen het oosten, tegen het westen, tegen het noorden, en tegen het zuiden.", "25": "En hun broeders waren op hun dorpen, inkomende ten zevenden dage van tijd tot tijd, om met hen *te* *dienen*;", "26": "Want in dat ambt waren vier overste poortiers, die Levieten waren; en zij waren over de kameren en over de schatten van het huis Gods.", "27": "En zij bleven over nacht rondom het huis Gods; want op hen was de wacht, en zij waren over de opening, en dat allen morgen.", "28": "En *enigen* van hen waren over de vaten van den dienst; want bij getal droegen zij ze in, en bij getal droegen zij ze uit.", "29": "Want uit dezelve zijn er besteld over de vaten, en over al de heilige vaten, en over de meelbloem, en wijn, en olie, en wierook, en specerij.", "30": "En uit de zonen der priesteren waren de bereiders van het reukwerk der specerijen.", "31": "En Mattithja uit de Levieten, dewelke was de eerstgeborene van Sallum, den Korahiet, was in het ambt over het werk, dat in pannen gekookt wordt.", "32": "En uit de kinderen der Kahathieten, uit hun broederen, waren *enigen* over de broden der toerichting, om *die* alle sabbatten te bereiden.", "33": "*Uit* dezen zijn ook de zangers, hoofden der vaderen onder de Levieten in de kameren, dienstvrij ; want dag en nacht was het op hen, in dat werk te zijn.", "34": "Dit zijn de hoofden der vaderen onder de Levieten, hoofden in hun geslachten; dezen woonden te Jeruzalem.", "35": "Maar te Gibeon hadden gewoond Jeiel, de vader van Gibeon; de naam zijner zuster nu was Maacha.", "36": "En Abdon was zijn eerstgeboren zoon, daarna Zur, en Kis, en Baäl, en Ner, en Nadab.", "37": "En Gedor, en Ahio, en Zacharja, en Mikloth.", "38": "Mikloth nu gewon Simeam; dezen woonden ook te Jeruzalem, tegenover hun broederen, met hun broederen.", "39": "En Ner gewon Kis, en Kis gewon Saul, en Saul gewon Jonathan, en Malchi-sua, en Abinadab, en Esbaal.", "40": "En Jonathans zoon van Merib-baal, en Merib-baal gewon Micha.", "41": "De kinderen van Micha nu waren Pithon, en Melech, en Thaerea.", "42": "En Achaz gewon Jaera, en Jaera gewon Alemeth, en Azmaveth, en Zimri; en Zimri gewon Moza;", "43": "En Moza gewon Bina; wiens zoon was Refaja; wiens zoon was Elasa; wiens zoon was Azel.", "44": "Azel nu had zes zonen, en dit zijn hun namen: Azrikam, Bochru, en Ismaël, en Searja, en Obadja, en Hanan; dezen zijn Azels zonen."}, "KJV": {"1": "So all Israel were reckoned by genealogies; and, behold, they were written in the book of the kings of Israel and Judah, who were carried away to Babylon for their transgression.", "2": "Now the first inhabitants that dwelt in their possessions in their cities were, the Israelites, the priests, Levites, and the Nethinims.", "3": "And in Jerusalem dwelt of the children of Judah, and of the children of Benjamin, and of the children of Ephraim, and Manasseh;", "4": "Uthai the son of Ammihud, the son of Omri, the son of Imri, the son of Bani, of the children of Pharez the son of Judah.", "5": "And of the Shilonites; Asaiah the firstborn, and his sons.", "6": "And of the sons of Zerah; Jeuel, and their brethren, six hundred and ninety.", "7": "And of the sons of Benjamin; Sallu the son of Meshullam, the son of Hodaviah, the son of Hasenuah,", "8": "And Ibneiah the son of Jeroham, and Elah the son of Uzzi, the son of Michri, and Meshullam the son of Shephathiah, the son of Reuel, the son of Ibnijah;", "9": "And their brethren, according to their generations, nine hundred and fifty and six. All these men were chief of the fathers in the house of their fathers.", "10": "And of the priests; Jedaiah, and Jehoiarib, and Jachin,", "11": "And Azariah the son of Hilkiah, the son of Meshullam, the son of Zadok, the son of Meraioth, the son of Ahitub, the ruler of the house of God;", "12": "And Adaiah the son of Jeroham, the son of Pashur, the son of Malchijah, and Maasiai the son of Adiel, the son of Jahzerah, the son of Meshullam, the son of Meshillemith, the son of Immer;", "13": "And their brethren, heads of the house of their fathers, a thousand and seven hundred and threescore; very able men for the work of the service of the house of God.", "14": "And of the Levites; Shemaiah the son of Hasshub, the son of Azrikam, the son of Hashabiah, of the sons of Merari;", "15": "And Bakbakkar, Heresh, and Galal, and Mattaniah the son of Micah, the son of Zichri, the son of Asaph;", "16": "And Obadiah the son of Shemaiah, the son of Galal, the son of Jeduthun, and Berechiah the son of Asa, the son of Elkanah, that dwelt in the villages of the Netophathites.", "17": "And the porters were, Shallum, and Akkub, and Talmon, and Ahiman, and their brethren: Shallum was the chief;", "18": "Who hitherto waited in the king's gate eastward: they were porters in the companies of the children of Levi.", "19": "And Shallum the son of Kore, the son of Ebiasaph, the son of Korah, and his brethren, of the house of his father, the Korahites, were over the work of the service, keepers of the gates of the tabernacle: and their fathers, being over the host of the LORD, were keepers of the entry.", "20": "And Phinehas the son of Eleazar was the ruler over them in time past, and the LORD was with him.", "21": "And Zechariah the son of Meshelemiah was porter of the door of the tabernacle of the congregation.", "22": "All these which were chosen to be porters in the gates were two hundred and twelve. These were reckoned by their genealogy in their villages, whom David and Samuel the seer did ordain in their set office.", "23": "So they and their children had the oversight of the gates of the house of the LORD, namely, the house of the tabernacle, by wards.", "24": "In four quarters were the porters, toward the east, west, north, and south.", "25": "And their brethren, which were in their villages, were to come after seven days from time to time with them.", "26": "For these Levites, the four chief porters, were in their set office, and were over the chambers and treasuries of the house of God.", "27": "And they lodged round about the house of God, because the charge was upon them, and the opening thereof every morning pertained to them.", "28": "And certain of them had the charge of the ministering vessels, that they should bring them in and out by tale.", "29": "Some of them also were appointed to oversee the vessels, and all the instruments of the sanctuary, and the fine flour, and the wine, and the oil, and the frankincense, and the spices.", "30": "And some of the sons of the priests made the ointment of the spices.", "31": "And Mattithiah, one of the Levites, who was the firstborn of Shallum the Korahite, had the set office over the things that were made in the pans.", "32": "And other of their brethren, of the sons of the Kohathites, were over the shewbread, to prepare it every sabbath.", "33": "And these are the singers, chief of the fathers of the Levites, who remaining in the chambers were free: for they were employed in that work day and night.", "34": "These chief fathers of the Levites were chief throughout their generations; these dwelt at Jerusalem.", "35": "And in Gibeon dwelt the father of Gibeon, Jehiel, whose wife's name was Maachah:", "36": "And his firstborn son Abdon, then Zur, and Kish, and Baal, and Ner, and Nadab,", "37": "And Gedor, and Ahio, and Zechariah, and Mikloth.", "38": "And Mikloth begat Shimeam. And they also dwelt with their brethren at Jerusalem, over against their brethren.", "39": "And Ner begat Kish; and Kish begat Saul; and Saul begat Jonathan, and Malchishua, and Abinadab, and Eshbaal.", "40": "And the son of Jonathan was Meribbaal: and Meribbaal begat Micah.", "41": "And the sons of Micah were, Pithon, and Melech, and Tahrea, and Ahaz.", "42": "And Ahaz begat Jarah; and Jarah begat Alemeth, and Azmaveth, and Zimri; and Zimri begat Moza;", "43": "And Moza begat Binea; and Rephaiah his son, Eleasah his son, Azel his son.", "44": "And Azel had six sons, whose names are these, Azrikam, Bocheru, and Ishmael, and Sheariah, and Obadiah, and Hanan: these were the sons of Azel."}}, "tsk": {"1": [{"kopje": "Heel Israël", "refs": ["Ezra 2:59", "Ezra 2:62", "Ezra 2:63", "Neh 7:5", "Neh 7:64", "Matt 1:1-16", "Luk 3:28-38"]}, {"kopje": "weggevoerd", "refs": ["2 Kron 33:11", "2 Kron 36:9", "2 Kron 36:10", "2 Kron 36:18-20", "Jer 39:9", "Jer 52:14", "Jer 52:15", "Dan 1:2"]}], "2": [{"kopje": "De eerste", "refs": ["Ezra 2:70", "Neh 8:1", "Neh 11:3"]}, {"kopje": "de Nethinim", "refs": ["Joz 9:21-27", "Ezra 2:43", "Ezra 2:58", "Ezra 8:20", "Neh 7:60", "Neh 8:1", "Neh 11:3", "Neh 11:21"]}], "3": [{"kopje": "Jeruzalem", "refs": ["Neh 11:1", "Neh 11:4-9"]}, {"kopje": "van de kinderen van Efraïm", "refs": ["2 Kron 11:16", "2 Kron 30:11"]}], "4": [{"kopje": "Bani", "refs": ["Neh 8:8", "Neh 10:13"]}, {"kopje": "Perez", "refs": ["1 Kron 2:5", "1 Kron 4:1", "Gen 46:12", "Num 26:20", "Neh 11:4", "Neh 11:6"]}], "5": [{"kop genendertig.", "Lev 19:3": "Want ieder zal zijn moeder en zijn vader vrezen, en Mijn sabbatten houden; Ik ben de HEERE, uw God!", "2 Kron 22:12": "En hij was bij hen verborgen in het huis van God, zes jaar; en Athalia regeerde over het land.", "Matt 12:4": "Hoe hij het huis van God binnenging, en de toonbroden at, die hij niet mocht eten, en ook zij die bij hem waren niet, maar alleen de priesters?", "1 Kron 25:3": "Aangaande Jeduthun: de kinderen van Jeduthun waren Gedalja, en Zeri, en Jesaja, Hasabja en Mattithja, zes; onder leiding van hun vader Jeduthun, die op harpen profeteerde om de HEERE te danken en te loven.", "1 Kron 25:2": "Van de kinderen van Asaf waren Zakkur, en Jozef, en Nethanja, en Asarela, kinderen van Asaf; onder leiding van Asaf, die onder leiding van de koning profeteerde.", "Neh 11:14": "En hun broeders, dappere helden, waren honderdachtentwintig; en opziener over hen was Zabdiël, de zoon van Gedolim.", "Ex 31:13-17": "Spreek u nu tot de kinderen van Israël: U zult zeker Mijn sabbatten onderhouden; want dit is een teken tussen Mij en u, bij uw geslachten; opdat men weet, dat Ik de HEERE ben, Die u heilig maakt. Onderhoud dan de sabbat, omdat hij u heilig is! Wie hem ontheiligt, zal zeker gedood worden; want ieder die daarop enig werk doet, die ziel zal uitgeroeid worden uit het midden van haar volken. Zes dagen zal men het werk doen; maar op de zevende dag is de sabbat van de rust, een heiligheid van de HEERE! Wie op de sabbatdag arbeid doet, zal zeker gedood worden.", "1 Kron 15:24": "En Sebanja, en Josafat, en Nethaneel, en Amasai, en Zecharja, en Benaja, en Eliëzer, de priesters, bliezen op trompetten voor de ark van God; en Obed-edom en Jehia waren poortwachters van de ark.", "Ezra 5:8": "De koning zij bekend, dat wij naar het landschap Juda getrokken zijn, naar het huis van de grote God, dat gebouwd wordt met grote stenen, en het hout wordt gelegd in de wanden; en dat werk wordt snel gedaan en gaat voorspoedig door hun handen voort.", "Neh 11:21": "En de Nethinim woonden in Ofel; en Ziha en Gispa waren over de Nethinim.", "Klaagl 1:7": "Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "Num 26:9-11": "En de zonen van Eliab waren Nemuël, en Dathan, en Abiram; deze Dathan en Abiram waren de geroepenen van de vergadering, die geschil maakten tegen Mozes en tegen Aäron, in de groep van Korach, toen zij geschil maakten tegen de HEERE. En de aarde opende haar mond, en verslond hen met Korach, toen die groep stierf, toen het vuur tweehonderdvijftig mannen verteerde, en zij werden tot een teken. Maar de kinderen van Korach stierven niet.", "Jes 66:23": "En het zal gebeuren, dat van de ene nieuwe maan tot de andere, en van de ene sabbat tot de andere, alle vlees zal komen om te aanbidden voor Mijn aangezicht, zegt de HEERE.", "Neh 10:13": "Hodia, Bani, Beninu;", "2 Kon 11:9": "De leiders van honderd deden naar alles wat de priester Jojada geboden had, en namen ieder zijn mannen, die op de sabbat de dienst ingingen, met hen die op de sabbat de dienst uitgingen; en zij kwamen bij de priester Jojada.", "2 Kon 22:12": "En de koning gebood Hilkia, de priester, en Ahikam, de zoon van Safan, en Achbor, de zoon van Michaja, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei:", "Num 4:28": "Dit is de dienst van de geslachten van de zonen van de Gersonieten, in de tent der samenkomst; en hun taak zal zijn onder de hand van Ithamar, de zoon van Aäron, de priester.", "1 Kron 12:35": "En uit de Danieten, toegerust voor de strijd, achtentwintigduizend zeshonderd;", "2 Kron 26:22": "Het overige nu van de geschiedenissen van Uzzia, de eerste en de laatste, heeft de profeet Jesaja, de zoon van Amos, beschreven.", "1 Kron 15:20": "En Zecharja, en Aziël, en Semiramoth, en Jehiel, en Unni, en Eliab, en Maaseja, en Benaja, met luiten op Alamoth.", "Ezra 8:20": "en van de Nethinim, die David en de vorsten ten dienste van de Levieten gegeven hadden, tweehonderdtwintig Nethinim, die allen bij naam genoemd werden.", "Num 7:9": "Maar aan de zonen van Kohath gaf hij niets; want de dienst van de heilige dingen die op hen rustte, moesten zij op de schouders dragen.", "Jer 38:1": "Toen Sefatja, de zoon van Matthan, en Gedalia, de zoon van Pashur, en Juchal, de zoon van Selemja, en Pashur, de zoon van Malchia, de woorden hoorden die Jeremia tot al het volk sprak:", "Ex 16:5": "En het zal gebeuren op de zesde dag, dat zij klaarmaken wat zij ingebracht zullen hebben; dat zal dubbel zijn boven wat zij dagelijks verzamelen.", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "2 Kron 20:8": "Zij nu hebben daarin gewoond, en zij hebben U daarin een heiligdom gebouwd voor Uw Naam, en zeiden:", "1 Kron 8:37": "En Moza verwekte Bina; zijn zoon was Rafa; zijn zoon was Elasa; zijn zoon was Azel.", "Num 4:12": "Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Ezra 8:24-34": "Toen scheidde ik twaalf uit van de leiders van de priesters: Serebja, Hasabja, en tien van hun broeders met hen. En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis van onze God die de koning en zijn raadsheren, en zijn vorsten, en heel Israël, die daar gevonden werden, geofferd hadden; ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten;", "Jer 39:9": "Het overige nu van het volk, dat in de stad was overgebleven, en de overlopers, die naar hem overgelopen waren, met het overige van het volk, dat overgebleven was, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk naar Babel.", "1 Kron 2:45": "De kinderen van Sammai nu waren Maon; en Maon was de vader van Beth-zur.", "Zach 7:2": "Toen men naar het huis van God had gezonden Sarezer en Regem-Melech en hun mannen, om het aangezicht van de HEERE te smeken,", "Neh 11:1": "Verder woonden de leiders van het volk te Jeruzalem; maar het overige van het volk wierp loten, om uit tien er één uit te brengen, die in de heilige stad Jeruzalem zou wonen, en negen delen in de andere steden.", "1 Kron 26:13-19": "En zij wierpen het lot, zowel de kleinen als de groten, naar hun families, voor elke poort. Het lot nu voor het oosten viel op Salemja; maar voor zijn zoon Zecharja, die een verstandig raadsman was, wierp men het lot, en zijn lot kwam uit voor het noorden; Obed-Edom voor het zuiden; en voor zijn kinderen het huis van de schatkamers.", "Ezech 44:24": "En bij een rechtszaak zullen zij staan om te oordelen; naar Mijn rechten zullen zij hen oordelen; en zij zullen Mijn wetten en Mijn inzettingen op al Mijn vastgestelde hoogtijden houden, en Mijn sabbatten heiligen.", "Num 26:20": "Zo waren de zonen van Juda naar hun geslachten: van Sela het geslacht der Selanieten; van Perez het geslacht der Perezieten; van Zerah het geslacht der Zerahieten.", "Luk 23:54": "En het was de dag van de voorbereiding, en de sabbat brak aan.", "1 Kron 29:8": "En bij wie stenen gevonden werden, die gaven ze aan de schat van het huis van de HEERE, onder toezicht van Jehiël, de Gersoniet.", "2 Kron 31:5-12": "Toen dat bevel nu bekend werd, brachten de kinderen van Israël veel eerstelingen van koren, most, en olie, en honing, en van alle opbrengsten van het veld; ook brachten zij de tienden van alles in met overvloed. En de kinderen van Israël en Juda, die in de steden van Juda woonden, brachten ook tienden van de runderen en van de schapen, en tienden van de heilige dingen die aan de HEERE, hun God, geheiligd waren, en maakten er veel hopen van. In de derde maand begonnen zij de grond voor die hopen te leggen, en in de zevende maand maakten zij het af.", "Neh 10:20": "Magpias, Mesullam, Hezir,", "2 Kron 36:10": "En bij de terugkeer van het jaar zond koning Nebukadnezar heen, en liet hem naar Babel halen, met de kostbare voorwerpen van het huis van de HEERE; en hij maakte zijn broer Zedekia koning over Juda en Jeruzalem.", "Gen 28:22": "En deze steen, die ik als opgericht teken gezet heb, zal een huis van God zijn; en van alles wat U mij geven zult, zal ik U zeker de tienden geven!", "Mark 2:27": "En Hij zei tegen hen: De sabbat is gemaakt om de mens, niet de mens om de sabbat.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Ex 23:12": "Zes dagen zult u uw werk doen; maar op de zevende dag zult u rusten; opdat uw os en uw ezel rusten, en de zoon van uw dienstmaagd en de vreemdeling op adem komen.", "Ezech 23:38": "Nog hebben zij Mij dit aangedaan: zij hebben Mijn heiligdom op diezelfde dag verontreinigd, en Mijn sabbatten ontheiligd.", "Hand 17:2": "En Paulus ging, zoals hij gewoon was, bij hen naar binnen, en drie sabbatten lang sprak hij met hen uit de Schriften,", "1 Kron 25:1-31": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst. Van de kinderen van Asaf waren Zakkur, en Jozef, en Nethanja, en Asarela, kinderen van Asaf; onder leiding van Asaf, die onder leiding van de koning profeteerde. Aangaande Jeduthun: de kinderen van Jeduthun waren Gedalja, en Zeri, en Jesaja, Hasabja en Mattithja, zes; onder leiding van hun vader Jeduthun, die op harpen profeteerde om de HEERE te danken en te loven.", "Neh 10:12": "Zakkur, Serebja, Sebanja,", "2 Kon 4:23": "En hij zei: Waarom gaat u vandaag naar hem toe? Het is geen nieuwe maan, en ook geen sabbat. En zij zei: Het zal goed zijn.", "2 Kron 32:32": "Het overige van de geschiedenissen van Jehizkia, en zijn goeddadigheden, zie, die zijn geschreven in het visioen van de profeet Jesaja, de zoon van Amoz, en in het boek van de koningen van Juda en Israël.", "Hand 5:24": "Toen nu de hogepriester en de hoofdman van de tempel, en de overpriesters deze woorden hoorden, werden zij vol twijfel over hen, wat hier toch uit zou worden.", "Ps 73:17": "Totdat ik in Gods heiligdommen inging, en op hun einde lette.", "2 Kron 33:7": "Hij stelde ook de gelijkenis van een gesneden beeld, dat hij gemaakt had, in het huis van God, waarvan God gezegd had tot David en tot zijn zoon Salomo: In dit huis, en te Jeruzalem, dat Ik uit alle stammen van Israël verkozen heb, zal Ik Mijn Naam zetten tot in eeuwigheid.", "Ezech 44:10": "Maar de Levieten die ver van Mij weggegaan zijn, toen Israël ging dolen, die van Mij zijn afgedwaald, hun drekgoden  achterna, zullen wel hun ongerechtigheid dragen;", "2 Kron 34:20": "En de koning gebood Hilkia, en Ahikam, de zoon van Safan, en Abdon, de zoon van Micha, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei:", "1 Kron 9:27-29": "En zij bleven overnachten rondom het huis van God; want op hen was de wacht, en zij waren over de opening, en dat elke morgen. En enigen van hen waren over de voorwerpen van de dienst; want zij droegen ze in op basis van getal, en op basis van getal droegen zij ze uit. Want uit hen zijn er aangesteld over de voorwerpen, en over al de heilige voorwerpen, en over de meelbloem, en wijn, en olie, en wierook, en specerijen.", "Ex 30:33": "De man die zo'n zalf maakt als deze, of die daarvan op een vreemde doet, die zal uitgeroeid worden uit zijn volk.", "Neh 11:19": "En de poortwachters: Akkub, Talmon, met hun broeders, die wacht hielden in de poorten, waren honderdtweeënzeventig.", "Ex 37:29": "Hij maakte ook de heilige zalfolie, en het reukwerk van zuivere welriekende specerijen, zoals een apotheker dat maakt.", "Ezech 44:14": "Daarom zal Ik hen stellen tot wachters van de wacht van het huis, over al zijn dienst, en over alles wat daarin gedaan zal worden.", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "Lev 21:12": "En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!", "1 Kron 26:20-27": "Ook was, van de Levieten, Ahia over de schatten van het huis van God, en over de schatten van de geheiligde dingen. Van de kinderen van Ladan, kinderen van de Gersoniet Ladan; van Ladan, de Gersoniet, waren hoofden van de families Jehiëli. De kinderen van Jehiëli waren Zetham en Joël, zijn broer; dezen waren over de schatten van het huis van de HEERE.", "Neh 10:11": "Micha, Rehob, Hasabja,", "Neh 10:38": "En dat er een priester, een zoon van Aäron, bij de Levieten zou zijn, als de Levieten de tienden ontvangen; en dat de Levieten de tienden zouden opbrengen naar het huis van onze God, in de kamers van het schathuis.", "Neh 10:31": "Ook als de volken van het land waren en alle koren op de sabbatdag ten verkoop zouden brengen, dat wij op de sabbat, of op een andere heilige dag, niets van hen zouden nemen; en dat wij het zevende jaar zouden vrij laten, alsook allerlei bezwaarnis.", "Jes 1:13": "Breng niet meer een nutteloos offer; het reukwerk is Mij een gruwel; de nieuwe manen, en sabbatten, en het bijeenroepen van de samenkomsten kan Ik niet verdragen, het is ongerechtigheid, zelfs de verbodsdagen.", "1 Kron 16:4-6": "En hij stelde voor de ark van de HEERE sommigen uit de Levieten aan tot dienaars, en dat om de HEERE, de God van Israël, te vermelden, en te loven, en te prijzen. Asaf was het hoofd, en Zecharja de tweede na hem; Jeïel, en Semiramoth, en Jehiël, en Mattithja, en Eliab, en Benaja, en Obed-Edom, en Jeïel, met instrumenten van luiten en met harpen; en Asaf liet zich horen met cimbalen; Maar Benaja en Jahaziël, de priesters, voortdurend met trompetten voor de ark van het verbond van God.", "Jes 63:18": "Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.", "1 Sam 14:50": "En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.", "Luk 3:28-38": "de zoon van Melchi, de zoon van Addi, de zoon van Kosam, de zoon van Elmodam, de zoon van Er, de zoon van Joses, de zoon van Eliëzer, de zoon van Jorim, de zoon van Matthat, de zoon van Levi, de zoon van Simeon, de zoon van Juda, de zoon van Jozef, de zoon van Jonan, de zoon van Eljakim,", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "1 Kron 8:35": "De kinderen van Micha nu waren Pithon, en Melech, en Thaarea, en Achaz.", "Num 28:10": "Het is het brandoffer van de sabbat op elke sabbat, boven het voortdurende brandoffer, en zijn drankoffer.", "Num 31:6": "En Mozes zond hen ten strijde, duizend van elke stam, hen en Pinehas, de zoon van Eleazar, de priester, ten strijde, met de heilige voorwerpen en de trompetten om te schallen in zijn hand.", "Hos 9:8": "De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.", "Ex 30:25": "En maak daarvan een olie van de heilige zalving, een zalf, heel kunstig gemaakt, volgens het werk van een apotheker; het zal een olie van de heilige zalving zijn.", "Matt 24:20": "Bid dat uw vlucht niet gebeurt in de winter, en ook niet op een sabbat.", "Num 3:9": "U zult dan, aan Aäron en aan zijn zonen, de Levieten geven; zij zijn gegeven, zij zijn hem gegeven, uit de kinderen van Israël.", "Richt 20:26": "Toen trokken alle kinderen van Israël en heel het volk op, en kwamen bij het huis van God, en weenden, en bleven daar voor het aangezicht van de HEERE, en vastten die dag tot de avond; en zij offerden brandoffers en dankoffers voor het aangezicht van de HEERE.", "Neh 11:1-15": "Verder woonden de leiders van het volk te Jeruzalem; maar het overige van het volk wierp loten, om uit tien er één uit te brengen, die in de heilige stad Jeruzalem zou wonen, en negen delen in de andere steden. En het volk zegende alle mannen, die vrijwillig aanboden te Jeruzalem te wonen. En dit zijn de hoofden van het landschap, die te Jeruzalem woonden; (maar in de steden van Juda woonden, ieder op zijn bezitting, in hun steden, Israël, de priesters, en de Levieten, en de Nethinim, en de kinderen van de knechten van Salomo).", "Luk 4:31": "En Hij kwam af naar Kapernaüm, een stad van Galilea, en leerde hen op de sabbatdagen.", "Neh 11:10-24": "Van de priesters: Jedaja, de zoon van Jojarib, Jachin; Seraja, de zoon van Hilkia, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, was voorganger van Gods huis; En hun broeders, die het werk in het huis deden, waren achthonderdtweeëntwintig. En Adaja, de zoon van Jeroham, de zoon van Pelalja, de zoon van Amzi, de zoon van Zacharja, de zoon van Pashur, de zoon van Malchia;", "1 Kron 25:1": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst.", "Lev 24:8": "Op elke sabbatdag zal men dat voortdurend in orde houden voor het aangezicht van de HEERE, vanwege de Israëlieten, tot een eeuwig verbond.", "Gen 2:3": "En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.", "Luk 6:1-10": "En het gebeurde op de tweede eerste sabbat, dat Hij door het gezaaide ging; en Zijn discipelen plukten aren en aten ze, terwijl ze die met hun handen fijnwreven. En sommigen van de Farizeeën zeiden tegen hen: Waarom doet u wat niet geoorloofd is te doen op de sabbatten? En Jezus antwoordde hun en zei: Hebt u ook dat niet gelezen, wat David deed toen hij honger had, hij en zij die met hem waren?", "Micha 3:7": "En de zieners zullen beschaamd, en de waarzeggers schaamrood worden; en zij zullen allen samen de bovenlip bewimpelen; want er zal geen antwoord van God zijn.", "Ezech 20:13": "Maar het huis van Israël werd opstandig tegen Mij in de woestijn; zij wandelden niet in Mijn inzettingen, en verwierpen Mijn rechten, die, als een mens ze doet, hij daardoor zal leven; en zij ontheiligden Mijn sabbatten zeer, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten in de woestijn, om hen te verdelgen.", "1 Kron 6:31-33": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen. En zij dienden voor de tabernakel van de tent der samenkomst met gezangen, totdat Salomo het huis van de HEERE in Jeruzalem bouwde; en zij stonden naar hun beurt in hun ambt. Dezen nu zijn het die daar stonden met hun zonen; van de zonen van de Kahathieten, Heman de zanger, de zoon van Joël, de zoon van Samuël,", "Jer 52:14": "En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.", "1 Kron 2:4": "Maar Thamar, zijn schoondochter, baarde hem Perez en Zerah. Al de zonen van Juda waren vijf.", "Num 4:33": "Dit is de dienst van de geslachten van de zonen van Merari, naar hun hele dienst, in de tent der samenkomst, onder de hand van Ithamar, de zoon van Aäron, de priester.", "1 Kron 6:22": "De kinderen van Kahath waren: zijn zoon Amminadab; zijn zoon Korah; zijn zoon Assir;", "Neh 7:40": "De kinderen van Immer, duizendtweeënvijftig;", "Ezra 2:59": "Dezen trokken ook op van Tel-melah, Tel-harsa, Cherub, Addan en Immer; maar zij konden van het huis van hun vaderen en hun nageslacht niet bewijzen of zij uit Israël waren.", "Neh 12:28-30": "Zo werden de kinderen van de zangers verzameld, zowel uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten; En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem. En de priesters en de Levieten reinigden zichzelf; daarna reinigden zij het volk, en de poorten, en de muur.", "1 Kron 8:34": "En Jonathans zoon was Merib-baal, en Merib-baal verwekte Micha.", "Joz 9:21-27": "Verder zeiden de leiders tegen hen: Laat hen leven, en laat ze houthakkers en waterputters zijn voor de hele vergadering, zoals de leiders tot hen gezegd hebben. En Jozua riep hen, en sprak tot hen, en zei: Waarom hebt u ons bedrogen, door te zeggen: Wij wonen zeer ver van u, terwijl u te midden van ons woont? Nu dan, vervloekt bent u! en onder u zullen altijd knechten blijven, houthakkers en waterputters voor het huis van mijn God.", "1 Kron 26:6": "Ook werden zijn zoon Semaja kinderen geboren, die heersten over het huis van hun vader; want zij waren dappere helden.", "Num 3:8": "En dat zij al het gereedschap van de tent der samenkomst, en de wacht van de kinderen van Israël waarnemen, om de dienst van de tabernakel te bedienen.", "Num 10:21": "Toen trokken de Kohathieten op, dragend het heiligdom; en de anderen richtten de tabernakel op, tegen dat dezen kwamen.", "1 Kron 8:17": "En Zebadja, en Mesullam, en Hizki, en Heber,", "1 Kron 6:19": "De kinderen van Merari waren Maheli en Musi. En dit zijn de families van de Levieten, naar hun vaderen.", "1 Kron 16:5": "Asaf was het hoofd, en Zecharja de tweede na hem; Jeïel, en Semiramoth, en Jehiël, en Mattithja, en Eliab, en Benaja, en Obed-Edom, en Jeïel, met instrumenten van luiten en met harpen; en Asaf liet zich horen met cimbalen;", "Richt 18:31": "Zo stelden zij voor zich het gesneden beeld van Micha op, dat hij gemaakt had, al de dagen dat het huis van God te Silo was.", "Hebr 10:21": "en omdat wij een grote Priester hebben over het huis van God,", "2 Kon 23:4": "En de koning gebood de hogepriester Hilkia, en de priesters van de tweede rang, en de bewakers van de drempel, dat zij uit de tempel van de HEERE al het gereedschap, dat voor Baäl, en voor het beeld van het bos en voor heel het leger van de hemel gemaakt was, naar buiten zouden brengen; en hij verbrandde dat buiten Jeruzalem in de velden van Kidron, en liet het stof daarvan naar Beth-el brengen.", "Num 3:32": "De aanvoerder nu van de aanvoerders van Levi zal zijn Eleazar, de zoon van Aäron, de priester; zijn opzicht zal zijn over degenen, die de wacht van het heiligdom waarnemen.", "Num 4:16": "Het toezicht nu van Eleazar, de zoon van Aäron, de priester, zal zijn over de olie van het licht, en het reukwerk van de welriekende specerijen, en het gedurige spijsoffer, en de zalfolie; het toezicht over de hele tabernakel, en alles wat daarin is, over het heiligdom en zijn gereedschap.", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Neh 7:46": "De Nethinim: de kinderen van Ziha, de kinderen van Hasufa, de kinderen van Tabbaoth;", "Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "1 Kron 2:54": "De kinderen van Salma waren de Bethlehemieten, en de Netofathieten, Atroth, Beth-joab, en de helft van de Manathieten, en de Zorieten.", "Neh 7:5": "Zo gaf mijn God het in mijn hart, dat ik de edelen, en de overheden, en het volk verzamelde, om de geslachten te tellen; en ik vond het geslachtsregister van hen die het eerst waren opgetrokken, en vond daarin geschreven het volgende:", "1 Sam 14:51": "En Kis was Sauls vader, en Ner, Abners vader, was een zoon van Abiël.", "Ezech 20:24": "Omdat zij Mijn rechten niet gedaan hadden, maar Mijn inzettingen verworpen en Mijn sabbatten ontheiligd hadden, en hun ogen achter de drekgoden van hun vaderen aan gingen.", "1 Kron 28:13": "en van de afdelingen van de priesters en de Levieten, en van al het werk van de dienst van het huis van de HEERE, en van alle voorwerpen van de dienst van het huis van de HEERE.", "Dan 1:2": "En de Heere gaf Jojakim, de koning van Juda, in zijn hand, alsook een deel van de voorwerpen van het huis van God; en hij bracht ze naar het land Sinear, naar het huis van zijn god; en de voorwerpen bracht hij naar het schathuis van zijn god.", "1 Sam 13:22": "En het gebeurde op de dag van de strijd, dat er geen zwaard of speer gevonden werd in de hand van het hele volk dat bij Saul en bij Jonathan was; maar bij Saul en bij Jonathan, zijn zoon, werden ze wel gevonden.", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Ps 42:2": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God!", "Neh 13:11": "En ik twistte met de overheden, en zei: Waarom is het huis van God verlaten? Doch ik verzamelde hen, en herstelde ze op hun plaats.", "2 Kron 30:8": "Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Num 15:32-36": "Toen de kinderen van Israël in de woestijn waren, vonden zij een man die hout las op de sabbatdag. En zij die hem hout zagen lezen, brachten hem tot Mozes en tot Aäron en tot de hele vergadering. En zij stelden hem in bewaring; want het was niet duidelijk gemaakt wat hem gedaan moest worden.", "Joh 7:21-24": "Jezus antwoordde en zei tegen hen: Eén werk heb Ik gedaan, en u verwondert u allen. Daarom heeft Mozes u de besnijdenis gegeven (niet dat ze uit Mozes is, maar uit de vaderen), en u besnijdt een mens op de sabbat. Als een mens de besnijdenis ontvangt op de sabbat, zodat de wet van Mozes niet gebroken wordt, bent u dan boos op Mij, omdat Ik een heel mens gezond gemaakt heb op de sabbat?", "Jes 30:10": "Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen.", "Micha 4:2": "En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Ezech 46:1": "Zo zegt de Heere HEERE: De poort van het binnenste voorhof, die naar het oosten kijkt, moet de zes werkdagen gesloten zijn; maar op de sabbatdag moet zij geopend worden; ook moet zij geopend worden op de dag van de nieuwe maan.", "2 Sam 24:11": "Toen David 's morgens opstond, kwam het woord van de HEERE tot de profeet Gad, Davids ziener, en zei:", "Hand 18:4": "En hij sprak op elke sabbat in de synagoge, en bracht Joden en Grieken tot geloof.", "1 Kron 26:30": "Van de Hebronieten was Hasabja, en zijn broers, dappere mannen, duizend zevenhonderd, over de ambten van Israël aan deze kant van de Jordaan naar het westen, over al het werk van de HEERE, en tot de dienst van de koning.", "Ex 30:35-38": "En daarvan moet u een reukwerk maken, een mengsel, volgens het werk van een apotheker, dooreengemengd, rein, heilig. En daarvan moet u een deel heel fijn stoten, en daarvan moet u leggen vóór de getuigenis, in de tent van de samenkomst, waar Ik tot u komen zal; het zal voor u allerheiligst zijn. Maar het reukwerk dat u volgens dit recept gemaakt hebt, mag u voor uzelf niet namaken; het zal u heilig zijn, voor de HEERE.", "Ex 35:28": "En specerijen en olie, voor de luchter en voor de zalfolie, en welriekende specerijen voor het roken.", "Ps 44:2": "O God! Wij hebben het met onze oren gehoord, onze vaders hebben het ons verteld: Wat een werk hebt U gedaan in hun dagen, in de dagen van vroeger.", "Neh 11:13": "En zijn broeders, hoofden van de vaderen, waren tweehonderdtweeënveertig. En Amassai, de zoon van Azareël, de zoon van Achzai, de zoon van Mesillemoth, de zoon van Immer;", "Num 26:21": "En de zonen van Perez waren: van Hezron het geslacht der Hezronieten; van Hamul het geslacht der Hamulieten.", "Ezra 2:43": "De Nethinim. De kinderen van Ziha, de kinderen van Hasufa, de kinderen van Tabbaoth;", "1 Kron 25:6": "Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Num 18:1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "1 Kron 6:8-15": "En Ahitub verwekte Zadok, en Zadok verwekte Ahimaäz; En Ahimaäz verwekte Azarja, en Azarja verwekte Johanan; En Johanan verwekte Azarja. Hij is het die het priesterambt bediende in het huis dat Salomo in Jeruzalem gebouwd had.", "Lev 6:21": "Het zal in een pan met olie gemaakt worden; geroosterd zult u het brengen; en de gebakken stukken van het spijsoffer zult u offeren, tot een liefelijke reuk voor de HEERE.", "Neh 11:7": "En dit zijn de kinderen van Benjamin: Sallu, de zoon van Mesullam, de zoon van Joed, de zoon van Pedaja, de zoon van Kolaja, de zoon van Maaseja, de zoon van Ithiël, de zoon van Jesaja;", "Ezra 2:62": "Dezen zochten hun register, onder hen die in het geslachtsregister opgenomen waren, maar zij werden niet gevonden; daarom werden zij als onreinen van het priesterschap geweerd.", "Neh 13:4": "Eljasib nu, de priester, die gesteld was over de kamer van het huis van onze God, was voor deze tijd een nabestaande van Tobia geworden.", "1 Sam 9:19": "En Samuel antwoordde Saul en zei: Ik ben de ziener; ga voor mij uit naar de hoogte, zodat u vandaag met mij eet; dan zal ik u morgenvroeg laten gaan, en alles wat in uw hart is, zal ik u bekendmaken.", "Ex 16:23-30": "Hij dan zei tegen hen: Dit is het, wat de HEERE gesproken heeft: Morgen is de rustdag, de heilige sabbat van de HEERE! Wat u bakken wilt, bak dat, en kook wat u koken wilt; en al wat overblijft, legt dat voor uzelf weg in bewaring tot de morgen. En zij legden het weg tot de morgen, zoals Mozes geboden had; en het stonk niet, en er zat geen worm in. Toen zei Mozes: Eet dat vandaag, want vandaag is het de sabbat van de HEERE; vandaag zult u het op het veld niet vinden.", "1 Kron 6:63": "De kinderen van Merari, naar hun families, hadden van de stam van Ruben, en van de stam van Gad, en van de stam van Zebulon, bij het lot, twaalf steden.", "Amos 8:5": "En zegt: Wanneer is de nieuwe maan voorbij, zodat wij koren mogen verkopen? en de sabbat, zodat wij graan mogen aanbieden? terwijl u de efa verkleint en de sikkel vergroot, en verkeerd handelt met bedrieglijke weegschalen;", "2 Kon 23:24": "En ook deed Josia de waarzeggers weg, en de duivelskunstenaars, en de terafim, en de drekgoden, en alle verfoeiselen die in het land van Juda en in Jeruzalem gezien werden; opdat hij de woorden van de wet zou bevestigen, die geschreven waren in het boek dat de priester Hilkia in het huis van de HEERE gevonden had.", "2 Kron 29:21": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren.", "Richt 20:18": "En de kinderen van Israël maakten zich op, en trokken op naar het huis van God, en vroegen God om raad, en zeiden: Wie zal onder ons als eerste optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zei: Juda als eerste.", "Matt 1:1-16": "Het geslachtsregister van JEZUS CHRISTUS, de Zoon van David, de zoon van Abraham. Abraham verwekte Izak, en Izak verwekte Jakob, en Jakob verwekte Juda en zijn broers; en Juda verwekte Fares en Zara bij Thamar; en Fares verwekte Esrom, en Esrom verwekte Aram;", "Num 8:19": "En Ik heb de Levieten aan Aäron en aan zijn zonen als gift gegeven, uit het midden van de kinderen van Israël, om de dienst van de kinderen van Israël in de tent van de samenkomst te verrichten, en om voor de kinderen van Israël verzoening te doen, zodat er geen plaag onder de kinderen van Israël komt, als de kinderen van Israël tot het heiligdom zouden naderen.", "Ex 25:30": "En u zult op deze tafel altijd het toonbrood voor Mijn aangezicht leggen.", "Jes 58:14": "Dan zult u zich verlustigen in de HEERE, en Ik zal u doen rijden op de hoogten van de aarde, en Ik zal u voeden met het erfdeel van uw vader Jakob; want de mond van de HEERE heeft het gesproken.", "1 Kron 8:30": "En zijn eerstgeboren zoon was Abdon, daarna Zur, en Kis, en Baäl, en Nadab,", "Ex 34:21": "Zes dagen zult u werken, maar op de zevende dag zult u rusten; in de ploegtijd en in de oogst zult u rusten.", "1 Kron 23:5": "En vierduizend poortwachters, en vierduizend lofzangers van de HEERE, met instrumenten die ik gemaakt heb, zei David, om lof te zingen.", "Hand 13:42": "En toen de Joden de synagoge uitgegaan waren, vroegen de heidenen of tegen de volgende sabbat dezelfde woorden tot hen gesproken zouden worden.", "1 Kron 26:12-19": "Uit dezen waren de verdelingen van de poortwachters onder de hoofden van de mannen, met wachtdiensten tegenover hun broers, om te dienen in het huis van de HEERE. En zij wierpen het lot, zowel de kleinen als de groten, naar hun families, voor elke poort. Het lot nu voor het oosten viel op Salemja; maar voor zijn zoon Zecharja, die een verstandig raadsman was, wierp men het lot, en zijn lot kwam uit voor het noorden;", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "1 Kron 26:22-26": "De kinderen van Jehiëli waren Zetham en Joël, zijn broer; dezen waren over de schatten van het huis van de HEERE. Voor de Amramieten, van de Jizharieten, van de Hebronieten, van de Uzziëlieten, En Sebuël, de zoon van Gersom, de zoon van Mozes, was leider over de schatten.", "Ezech 48:8": "Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend meetrieten in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn.", "1 Kron 8:31": "En Gedor, en Ahio, en Zecher.", "2 Kron 35:18": "Er was ook geen pascha zoals dat in Israël gehouden, vanaf de dagen van Samuël, de profeet, af; en geen koningen van Israël hadden zulk een pascha gehouden, zoals Josia hield met de priesters en de Levieten, en heel Juda en Israël, dat er gevonden werd, en de inwoners van Jeruzalem.", "Hand 16:13": "En op de dag van de sabbat gingen wij de stad uit, naar de rivier, waar men gewoonlijk bad; en wij gingen zitten en spraken tot de vrouwen die daar samengekomen waren.", "Num 25:11-13": "Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, heeft Mijn grimmigheid van over de kinderen van Israël afgewend, omdat hij Mijn ijver geijverd heeft in hun midden, zodat Ik de kinderen van Israël in Mijn ijver niet vernietigd heb. Zeg daarom: Zie, Ik geef hem Mijn verbond van vrede. En hij zal hebben, en zijn nageslacht na hem, het verbond van het eeuwige priesterschap, omdat hij voor zijn God geijverd heeft, en verzoening gedaan heeft voor de kinderen van Israël.", "2 Kron 20:34": "Het overige nu van de geschiedenissen van Josafat, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Jehu, de zoon van Hanani, die men optekende in het boek van de koningen van Israël.", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "1 Kron 2:50-52": "Dit waren de kinderen van Kaleb, de zoon van Hur, de eerstgeborene van Efratha: Sobal, de vader van Kirjath-jearim; Salma, de vader van de Bethlehemieten; Haref, de vader van Beth-gader. De kinderen van Sobal, de vader van Kirjath-jearim, waren Haroe en Hazihammenuchoth.", "Neh 7:26": "De mannen van Bethlehem en Netofa, honderdachtentachtig;", "Neh 11:5": "En Maaseja, de zoon van Baruch, de zoon van Kol-hose, de zoon van Hazaja, de zoon van Adaja, de zoon van Jojarib, de zoon van Zacharja, de zoon van Siloni.", "Neh 3:26": "De Nethinim nu, die op Ofel woonden, tot tegenover de Waterpoort aan het oosten, en de uitstekende toren.", "Ezra 5:15": "En hij zei tegen hem: Neem deze vaten, ga ze afvoeren naar de tempel die te Jeruzalem is, en laat het huis van God gebouwd worden op zijn plaats.", "Neh 10:2": "Seraja, Azarja, Jeremia,", "Num 19:20": "Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden van de gemeenschap uitgeroeid worden; want hij heeft het heiligdom van de HEERE verontreinigd, het water van de afzondering is niet op hem gesprenkeld, hij is onrein.", "Ezech 46:2": "En de vorst zal binnengaan door de weg van het voorhuis van die poort van buiten, en zal staan bij de post van de poort; en de priesters zullen zijn brandoffers en zijn dankoffers bereiden, en hij zal aanbidden bij de drempel van de poort, en daarna uitgaan; maar de poort zal niet gesloten worden tot de avond.", "Neh 11:25-30": "In de dorpen nu, op hun akkers, woonden sommigen van de kinderen van Juda, in Kirjath-arba en haar onderhorige plaatsen, en in Dibon en haar onderhorige plaatsen, en in Jekabzeel en haar dorpen; En te Jesua, en te Molada, en te Beth-pelet, En te Hazar-sual, en in Berseba, en haar onderhorige plaatsen,", "2 Kron 11:16": "Na hen kwamen ook uit alle stammen van Israël naar Jeruzalem, mensen die hun hart erop gericht hadden om de HEERE, de God van Israël, te zoeken, om aan de HEERE, de God van hun vaderen, offers te brengen.", "Neh 11:10": "Van de priesters: Jedaja, de zoon van Jojarib, Jachin;", "Lev 26:34": "Dan zal het land aan zijn sabbatten een welgevallen hebben, al de dagen van de verwoesting, terwijl u in het land van uw vijanden bent; dan zal het land rusten, en aan zijn sabbatten een welgevallen hebben.", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "2 Kron 36:18-20": "En alle voorwerpen van het huis van God, de grote en de kleine, en de schatten van het huis van de HEERE, en de schatten van de koning en zijn vorsten, dit alles bracht hij naar Babel. En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan. En wie overgebleven was van het zwaard, voerde hij weg naar Babel, en zij werden hem en zijn zonen tot knechten, totdat het koninkrijk van Perzië ging regeren;", "Deut 5:12-15": "Onderhoud de sabbatdag, dat u die heiligt, zoals de HEERE, uw God, u geboden heeft. Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw os, noch uw ezel, noch enig van uw vee, noch de vreemdeling die in uw poorten is; opdat uw dienstknecht en uw dienstmaagd rusten, net als u.", "Mark 6:2": "En toen het sabbat geworden was, begon Hij in de synagoge te onderwijzen; en velen die Hem hoorden, waren verbaasd, en zeiden: Waar komen Deze deze dingen vandaan, en wat is dit voor wijsheid die Hem gegeven is, dat ook zulke krachten door Zijn handen gebeuren?", "Luk 13:10-17": "En Hij gaf onderwijs op de sabbat in een van de synagogen. En zie, er was een vrouw die al achttien jaar lang een geest van ziekte had, en zij was samengebogen en kon zich totaal niet oprichten. En Jezus zag haar, riep haar bij Zich en zei tegen haar: Vrouw, u bent verlost van uw ziekte.", "Ex 25:8": "En zij zullen Mij een heiligdom maken, dat Ik in hun midden woon.", "2 Kon 17:13": "Toen nu de HEERE tegen Israël en tegen Juda, door de dienst van alle profeten en van alle zieners, gewaarschuwd had en zei: Bekeer u van uw slechte wegen en houd Mijn geboden en Mijn inzettingen, naar de hele wet die Ik uw vaderen geboden heb, en die Ik u door de hand van Mijn knechten, de profeten, gezonden heb;", "Joh 5:5-14": "En daar was een zeker mens, die achtendertig jaar ziek geweest was. Toen Jezus hem zag liggen en wist dat hij al lange tijd zo was, zei Hij tegen hem: Wilt u gezond worden? De zieke antwoordde Hem: Heere, ik heb geen mens om mij in het badwater te brengen, wanneer het water bewogen wordt; en terwijl ik kom, gaat een ander vóór mij naar beneden.", "1 Kron 26:1-32": "Aangaande de verdelingen van de poortwachters: van de Korahieten was Meselemja, de zoon van Kore, van de kinderen van Asaf. Meselemja nu had kinderen; Zecharja was de eerstgeborene, Jediaël de tweede, Zebadja de derde, Jathniël de vierde, Elam de vijfde, Johanan de zesde, Eljehoenai de zevende.", "1 Kron 2:23": "En hij nam Gesur en Aram, met de vlekken van Jaïr, van hen, met Kenath en haar onderhorige plaatsen, zestig steden. Deze allen zijn zonen van Machir, de vader van Gilead.", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "Lev 24:5-8": "U zult ook meelbloem nemen en er twaalf koeken van bakken; van twee tienden zal één koek zijn. En u zult ze in twee rijen leggen, zes in een rij, op de reine tafel, voor het aangezicht van de HEERE. En op elke rij zult u zuivere wierook leggen, die het brood tot een gedenkoffer zal zijn; het is een vuuroffer voor de HEERE.", "2 Kron 26:18": "En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Ps 74:7": "Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.", "2 Kron 29:30": "Daarna zeiden koning Hizkia en de leiders tegen de Levieten, dat zij de HEERE zouden loven, met de woorden van David en van Asaf, de ziener; en zij loofden met blijdschap; en zij bogen hun hoofden, en bogen zich neer.", "2 Kron 5:14": "En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.", "Neh 6:10": "Toen ik in het huis kwam van Semaja, de zoon van Delaja, de zoon van Mehetabeel — hij was namelijk opgesloten — zei hij: Laten wij samenkomen in het huis van God, binnen in de tempel, en laten wij de deuren van de tempel sluiten; want zij zullen komen om u te doden, ja, 's nachts zullen zij komen om u te doden.", "1 Kron 8:33": "Ner nu verwekte Kis, en Kis verwekte Saul, en Saul verwekte Jonathan, en Malchi-sua, Abinadab, en Esbaal.", "Luk 14:1-6": "En het gebeurde, toen Hij in het huis van een van de leiders van de Farizeeën gekomen was, op de sabbat, om brood te eten, dat zij Hem in de gaten hielden. En zie, er was een zeker waterzuchtig mens voor Hem. En Jezus antwoordde en zei tegen de wetgeleerden en Farizeeën: Is het ook geoorloofd op de sabbat gezond te maken?", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "Matt 12:10-12": "En kijk, er was een mens die een verschrompelde hand had, en zij vroegen Hem: Is het geoorloofd op de sabbatdagen te genezen? (om Hem te kunnen beschuldigen.) En Hij zei tegen hen: Wie onder u is er die een schaap heeft, en als dat op een sabbatdag in een greppel valt, zal hij het niet vastpakken en eruit heffen? Hoeveel gaat een mens dan een schaap te boven! Daarom is het op de sabbatdagen geoorloofd goed te doen.", "Ezech 46:3": "Ook zal het volk van het land aanbidden voor de deur van die poort, op de sabbatten en op de nieuwe manen, voor het aangezicht van de HEERE.", "1 Kron 27:24": "Joab, de zoon van Zeruja, had begonnen te tellen, maar hij maakte het niet af, omdat er vanwege deze telling grote toorn over Israël gekomen was; daarom is het getal niet opgenomen in de rekening van de kronieken van koning David.", "Neh 12:25": "Matthanja en Bakbukja, Obadja, Mesullam, Talmon en Akkub, waren poortwachters, die de wacht waarnamen bij de schatkamers van de poorten.", "Ezra 8:29": "Waak en bewaar het, totdat u het opweegt, in tegenwoordigheid van de leiders van de priesters en Levieten, en van de vorsten van de vaderen van Israël, te Jeruzalem, in de kamers van het huis van de HEERE.", "1 Kron 26:14-18": "Het lot nu voor het oosten viel op Salemja; maar voor zijn zoon Zecharja, die een verstandig raadsman was, wierp men het lot, en zijn lot kwam uit voor het noorden; Obed-Edom voor het zuiden; en voor zijn kinderen het huis van de schatkamers. Suppim en Hosa voor het westen, bij de poort Schallechet, bij de oplopende weg, wacht tegenover wacht.", "2 Kron 23:4-10": "Dit is de zaak die u doen zult: een derde deel van u, die op de sabbat aantreden, van de priesters en van de Levieten, zullen poortwachters van de dorpels zijn; en een derde deel zal bij het huis van de koning zijn; en een derde deel bij de Fondamentpoort; en heel het volk zal in de voorhoven van het huis van de HEERE zijn. Maar dat niemand het huis van de HEERE binnenkomt, behalve de priesters en de Levieten die dienstdoen; die zullen naar binnen gaan, want zij zijn heilig; maar heel het volk zal de wacht van de HEERE waarnemen.", "Ezra 7:20": "Het overige nu, dat nodig zal zijn voor het huis van uw God, dat u zult moeten uitgeven, zult u geven uit het schathuis van de koning.", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Ps 134:2": "Hef uw handen op naar het heiligdom, en loof de HEERE.", "Neh 11:11": "Seraja, de zoon van Hilkia, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, was voorganger van Gods huis;", "2 Kron 35:15": "En de zangers, de zonen van Asaf, waren op hun standplaats, naar het gebod van David, en Asaf, en Heman, en Jeduthun, de ziener van de koning, alsook de poortwachters bij elke poort; zij hoefden niet te wijken van hun dienst, want hun broeders, de Levieten, bereidden voor hen.", "1 Kron 23:2-32": "En hij verzamelde alle vorsten van Israël, ook de priesters en de Levieten. En de Levieten werden geteld, van dertig jaar af en daarboven; en hun aantal was, naar hun hoofden, aan mannen, achtendertigduizend. Uit dezen waren er vierentwintigduizend om het werk van het huis van de HEERE aan te sturen; en zesduizend opzichters en rechters;", "1 Sam 9:9": "(Eertijds zei ieder in Israël dit, als hij ging om God te vragen: Kom, laten wij gaan naar de ziener; want wie tegenwoordig een profeet genoemd wordt, werd eertijds een ziener genoemd.)", "2 Kron 24:5": "Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.", "Gen 38:30": "En daarna kwam zijn broer naar buiten, aan wiens hand de scharlaken draad was; en men noemde hem Zera.", "Luk 4:16": "En Hij kwam in Nazareth, waar Hij was opgevoed, en ging, naar Zijn gewoonte, op de dag van de sabbat naar de synagoge; en stond op om te lezen.", "Neh 13:5": "En hij had hem een grote kamer gemaakt, waar zij tevoren het spijsoffer, de wierook en de vaten heenleidden, en de tienden van koren, van most en van olie, die bevolen waren voor de Levieten, en de zangers, en de poortwachters, alsook het hefoffer van de priesters.", "Jer 32:2": "(Het leger van de koning van Babel belegerde toen Jeruzalem, en de profeet Jeremia zat opgesloten in het voorhof van de bewaking, dat bij het huis van de koning van Juda is.", "1 Kron 6:33-48": "Dezen nu zijn het die daar stonden met hun zonen; van de zonen van de Kahathieten, Heman de zanger, de zoon van Joël, de zoon van Samuël, De zoon van Elkana, de zoon van Jeroham, de zoon van Eliël, de zoon van Toah, De zoon van Zuf, de zoon van Elkana, de zoon van Mahath, de zoon van Amasai,", "1 Kron 8:29-40": "En te Gibeon woonde de vader van Gibeon; en de naam van zijn vrouw was Maächa. En zijn eerstgeboren zoon was Abdon, daarna Zur, en Kis, en Baäl, en Nadab, En Gedor, en Ahio, en Zecher.", "Ps 92:2-16": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste! Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten; Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.", "Gen 28:17": "En hij vreesde, en zei: Hoe ontzagwekkend is deze plaats! Dit is niets anders dan een huis van God, en dit is de poort van de hemel!", "1 Kron 26:1": "Aangaande de verdelingen van de poortwachters: van de Korahieten was Meselemja, de zoon van Kore, van de kinderen van Asaf.", "1 Kron 2:5": "De kinderen van Perez waren Hezron en Hamul.", "Ex 35:3": "U zult geen vuur aansteken in enige van uw woningen op de sabbatdag.", "Neh 10:39": "Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "1 Kron 9:26-29": "Want in dat ambt waren vier leidende poortwachters, die Levieten waren; en zij waren over de kamers en over de schatten van het huis van God. En zij bleven overnachten rondom het huis van God; want op hen was de wacht, en zij waren over de opening, en dat elke morgen. En enigen van hen waren over de voorwerpen van de dienst; want zij droegen ze in op basis van getal, en op basis van getal droegen zij ze uit.", "1 Kon 11:41": "Het overige nu van de geschiedenissen van Salomo, en alles wat hij gedaan heeft, en zijn wijsheid, is dat niet geschreven in het boek van de geschiedenissen van Salomo?", "Ps 150:1": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte!", "1 Kon 14:19": "Het overige nu van de geschiedenis van Jerobeam, hoe hij oorlog voerde, en hoe hij geregeerd heeft, zie, dat staat geschreven in het boek van de kronieken van de koningen van Israël.", "Num 3:28": "In getal van al wat mannelijk was, van een maand oud en daarboven, waren achtduizend zeshonderd, die de wacht van het heiligdom waarnamen.", "Ezra 2:37": "De kinderen van Immer, duizend tweeënvijftig.", "Luk 23:56": "En zij keerden terug en bereidden specerijen en zalven; en op de sabbat rustten zij, volgens het gebod.", "1 Kron 29:29": "De geschiedenissen nu van koning David, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Samuel, de ziener, en in de geschiedenissen van de profeet Nathan, en in de geschiedenissen van Gad, de ziener;", "Ezech 20:12": "Daarbij gaf Ik hun ook Mijn sabbatten, om een teken te zijn tussen Mij en hen, opdat zij zouden weten dat Ik de HEERE ben, Die hen heiligt.", "Matt 12:1-8": "In die tijd ging Jezus, op een sabbatdag, door het gezaaide land, en Zijn discipelen kregen honger, en begonnen aren te plukken en te eten. En de Farizeeën zagen dat en zeiden tegen Hem: Kijk, Uw discipelen doen wat niet geoorloofd is te doen op de sabbat. Maar Hij zei tegen hen: Hebt u niet gelezen wat David deed, toen hij honger had, en zij die bij hem waren?", "Neh 7:39": "De priesters: de kinderen van Jedaja, van het huis van Jesua, negenhonderddrieënzeventig;", "1 Kron 2:6": "En de kinderen van Zerah waren Zimri, en Ethan, en Heman, en Chalcol, en Dara. Deze allen zijn vijf.", "2 Kon 21:25": "Het overige van de geschiedenis van Amon, wat hij gedaan heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "1 Kron 6:23": "Zijn zoon Elkana; en zijn zoon Ebjasaf; en zijn zoon Assir;", "1 Kron 24:7": "Het eerste lot nu ging uit voor Jojarib, het tweede voor Jedaja,", "1 Kron 9:10-13": "Van de priesters nu, Jedaja, en Jojarib, en Jachin, En Azarja, de zoon van Hilkija, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, leider van het huis van God; En Adaja, de zoon van Jeroham, de zoon van Pashur, de zoon van Malchija; en Massi, de zoon van Adiël, de zoon van Jahzera, de zoon van Mesullam, de zoon van Mesillemith, de zoon van Immer.", "Hebr 9:1": "Zo had dan het eerste verbond wel regels van de eredienst, en het aardse heiligdom.", "2 Kron 36:17-21": "Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand. En alle voorwerpen van het huis van God, de grote en de kleine, en de schatten van het huis van de HEERE, en de schatten van de koning en zijn vorsten, dit alles bracht hij naar Babel. En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Ps 49:2": "Hoort dit, alle volken! Neemt het ter oor, alle inwoners van de wereld,", "Neh 8:1": "Toen de zevende maand aankwam, en de kinderen van Israël in hun steden waren,", "Ps 84:11": "Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.", "2 Kron 34:18": "Verder maakte Safan, de schrijver, aan de koning bekend en zei: Hilkia, de priester, heeft mij een boek gegeven. En Safan las erin voor voor het aangezicht van de koning.", "Lev 2:5": "En indien uw offer een spijsoffer is, in de pan gebakken, zal het van ongezuurde meelbloem zijn, met olie gemengd.", "2 Kron 12:15": "De geschiedenis van Rehabeam nu, van begin tot eind, is die niet geschreven in de woorden van Semaja, de profeet, en Iddo, de ziener, die de geslachtsregisters vermelden? Daarbij ook de oorlogen van Rehabeam en Jerobeam, al hun dagen door.", "1 Kron 12:25": "Van de kinderen van Simeon, kloeke helden voor het leger, zevenduizend honderd;", "1 Kron 8:28": "Dezen waren de hoofden van de vaderen, hoofden naar hun geslachten; dezen woonden te Jeruzalem.", "Ezra 7:7": "Ook sommigen van de kinderen van Israël, en van de priesters en de Levieten, en de zangers, en de poortwachters, en de Nethinim, trokken op naar Jeruzalem, in het zevende jaar van koning Arthahsasta.", "1 Kron 2:39": "En Azaria verwekte Helez, en Helez verwekte Elasa,", "2 Kron 30:11": "Toch verootmoedigden sommigen zich uit Aser, en Manasse, en uit Zebulon, en kwamen te Jeruzalem.", "2 Kon 11:7": "En de twee delen van u, allen die op de sabbat de dienst uitgaan, zullen de wacht van het huis van de HEERE waarnemen bij de koning.", "Neh 9:14": "En U hebt Uw heilige sabbat bekendgemaakt; en U hebt hun geboden, en inzettingen en een wet bevolen, door de hand van Uw knecht Mozes.", "1 Kron 8:29": "En te Gibeon woonde de vader van Gibeon; en de naam van zijn vrouw was Maächa.", "Jer 17:22": "Ook zult u geen last uitvoeren uit uw huizen op de sabbatdag, en geen enkel werk doen; maar u zult de sabbatdag heiligen, zoals Ik uw vaderen geboden heb.", "Ezra 7:1": "Na deze geschiedenissen, in het koninkrijk van Arthahsasta, koning van Perzië: Ezra, de zoon van Seraja, de zoon van Azarja, de zoon van Hilkia,", "2 Kron 34:13": "Zij waren ook aangesteld over de lastdragers, en de opzichters van allen die in enig werk arbeidden; want uit de Levieten waren er schrijvers, en beambten, en poortwachters.", "Hebr 8:2": "Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.", "1 Kron 28:10": "Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.", "2 Kron 31:19": "Ook waren er onder de kinderen van Aäron, de priesters, op de velden van de voorsteden van hun steden, in elke stad, mannen die met naam waren aangewezen, om aan alle mannen onder de priesters en aan allen die in het geslachtsregister onder de Levieten opgenomen waren, delen te geven.", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "2 Kron 36:19": "En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Num 4:19": "Maar dit zult u voor hen doen, opdat zij leven en niet sterven, wanneer zij tot het allerheiligste naderen: Aäron en zijn zonen zullen komen, en hen ieder aanstellen over zijn dienst en zijn last.", "Num 18:5": "U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "Mark 2:28": "Zo is dan de Zoon des mensen ook Heere van de sabbat.", "1 Sam 14:1": "Het gebeurde nu op een dag dat Jonathan, de zoon van Saul, tegen de jongen die zijn wapens droeg, zei: Kom, laten we naar de bezetting van de Filistijnen oversteken, die aan de overkant is. Maar hij vertelde het zijn vader niet.", "1 Kron 8:32": "En Mikloth verwekte Simea; en dezen woonden ook tegenover hun broeders te Jeruzalem, samen met hun broeders.", "1 Kron 9:17-26": "De poortwachters nu waren: Sallum, en Akkub, en Talmon, en Ahiman, en hun broeders; Sallum was het hoofd. Ook tot nu toe, aan de poort van de koning oostwaarts, waren dezen de poortwachters onder de legers van de kinderen van Levi. En Sallum, de zoon van Kore, de zoon van Ebjasaf, de zoon van Korah, en zijn broeders van het huis van zijn vader, de Korahieten, waren over het werk van de dienst, wachters van de dorpels van de tabernakel; zoals hun vaders in het leger van de HEERE geweest waren bewaarders van de ingang;", "1 Kron 24:5": "En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.", "Ezra 7:3": "de zoon van Amarja, de zoon van Azarja, de zoon van Merajoth,", "1 Kron 26:7": "De kinderen van Semaja waren Othni, en Refaël, en Obed, en Elzabad, zijn broers, dappere mannen; Elihu, en Semachja.", "Gen 46:12": "En de zonen van Juda: Er, en Onan, en Sela, en Perez, en Zerah. Maar Er en Onan waren gestorven in het land Kanaän; en de zonen van Perez waren Hezron en Hamul.", "Neh 11:15": "En van de Levieten: Semaja, de zoon van Hassub, de zoon van Azrikam, de zoon van Hasabja, de zoon van Buni.", "2 Kron 9:29": "Het overige nu van de geschiedenissen van Salomo, van de eerste tot de laatste, is dat niet geschreven in de woorden van Nathan, de profeet, en in de profetie van Ahia, de Siloniet, en in de gezichten van Jedi, de ziener, over Jerobeam, de zoon van Nebat?", "Hos 2:10": "En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "Ezra 10:20": "En van de kinderen van Immer: Hanani en Zebadja.", "1 Kron 6:29": "De kinderen van Merari waren Maheli; zijn zoon Libni; zijn zoon Simeï; zijn zoon Uzza;", "Ex 27:20": "U nu moet de kinderen van Israël gebieden, dat zij tot u brengen zuivere olie van olijven, gestoten voor het licht, zodat men voortdurend de lampen aansteekt.", "Neh 11:22": "En de opziener van de Levieten te Jeruzalem was Uzzi, de zoon van Bani, de zoon van Hasabja, de zoon van Matthanja, de zoon van Micha; van de kinderen van Asaf waren de zangers verantwoordelijk voor het werk van Gods huis.", "Dan 9:17": "En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf.", "Hand 3:11": "En terwijl de kreupele, die genezen was, zich vasthield aan Petrus en Johannes, liep al het volk gezamenlijk verbaasd naar hen toe, in de zuilengang die de zuilengang van Salomo genoemd wordt.", "Neh 11:4-9": "Te Jeruzalem dan woonden sommigen van de kinderen van Juda, en van de kinderen van Benjamin. Van de kinderen van Juda: Athaja, de zoon van Uzzia, de zoon van Zacharja, de zoon van Amarja, de zoon van Sefatja, de zoon van Mahalaleël, van de kinderen van Perez; En Maaseja, de zoon van Baruch, de zoon van Kol-hose, de zoon van Hazaja, de zoon van Adaja, de zoon van Jojarib, de zoon van Zacharja, de zoon van Siloni. Alle kinderen van Perez, die te Jeruzalem woonden, waren vierhonderdachtenzestig dappere mannen.", "Ps 63:3": "Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;", "Neh 11:4": "Te Jeruzalem dan woonden sommigen van de kinderen van Juda, en van de kinderen van Benj
