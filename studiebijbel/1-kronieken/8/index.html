 hij zijn vrouwen weggezonden had) uit Husim en Baara, zijn vrouwen;","9":"En uit Hodes, zijn vrouw, verwekte hij Jobab, en Zibja, en Mesa, en Malcham,","10":"En Jeuz, en Sochja, en Mirma; dezen zijn zijn zonen, hoofden van de vaderen.","11":"En uit Husim verwekte hij Abitub en Elpaal.","12":"De kinderen van Elpaal nu waren Eber, en Misam, en Semed; deze heeft Ono gebouwd, en Lod en haar onderhorige plaatsen;","13":"En Beria, en Sema; dezen waren hoofden van de vaderen van de inwoners van Ajalon; dezen hebben de inwoners van Gath verdreven.","14":"En Ahjo, Sasak en Jeremoth,","15":"En Zebadja, en Arad, en Eder,","16":"En Michaël, en Jispa, en Joha waren kinderen van Beria.","17":"En Zebadja, en Mesullam, en Hizki, en Heber,","18":"En Jismerai, en Jizlia en Jobab, de kinderen van Elpaal.","19":"En Jakim, en Zichri, en Zabdi,","20":"En Eljoenai, en Zillethai, en Eliël,","21":"En Adaja, en Beraja, en Simrath waren kinderen van Simeï.","22":"En Jispan, en Eber, en Eliël,","23":"En Abdon, en Zichri, en Hanan,","24":"En Hananja, en Elam, en Antothija,","25":"En Jifdeja, en Pnuël waren zonen van Sasak.","26":"En Samserai, en Seharja, en Athalja,","27":"En Jaaresja, en Elia, en Zichri waren zonen van Jeroham.","28":"Dezen waren de hoofden van de vaderen, hoofden naar hun geslachten; dezen woonden te Jeruzalem.","29":"En te Gibeon woonde de vader van Gibeon; en de naam van zijn vrouw was Maächa.","30":"En zijn eerstgeboren zoon was Abdon, daarna Zur, en Kis, en Baäl, en Nadab,","31":"En Gedor, en Ahio, en Zecher.","32":"En Mikloth verwekte Simea; en dezen woonden ook tegenover hun broeders te Jeruzalem, samen met hun broeders.","33":"Ner nu verwekte Kis, en Kis verwekte Saul, en Saul verwekte Jonathan, en Malchi-sua, Abinadab, en Esbaal.","34":"En Jonathans zoon was Merib-baal, en Merib-baal verwekte Micha.","35":"De kinderen van Micha nu waren Pithon, en Melech, en Thaarea, en Achaz.","36":"En Achaz verwekte Jehoadda, en Jehoadda verwekte Alemeth, en Azmaveth, en Zimri; Zimri nu verwekte Moza;","37":"En Moza verwekte Bina; zijn zoon was Rafa; zijn zoon was Elasa; zijn zoon was Azel.","38":"Azel nu had zes zonen, en dit zijn hun namen: Azrikam, Bochru, en Ismaël, en Searja, en Obadja, en Hanan. Al dezen waren zonen van Azel.","39":"En de zonen van Esek, zijn broer, waren Ulam, zijn eerstgeborene, Jeus, de tweede, en Elifelet, de derde.","40":"En de zonen van Ulam waren dappere helden, die de boog spanden, en zij hadden veel zonen, en kleinzonen, honderdvijftig. Al dezen waren van de kinderen van Benjamin."},"SV":{"1":"Benjamin nu gewon Bela, zijn eerstgeborene, Asbel, den tweede, en Ahrah, den derde,","2":"Naho, den vierde, en Rafa, den vijfde,","3":"Bela nu had deze kinderen: Addar, en Gera, en Abihud,","4":"En Abisua, en Naäman, en Ahoah,","5":"En Gera, en Sefufan, en Huram.","6":"Dezen nu zijn de kinderen van Ehud; dezen waren hoofden der vaderen van de inwoners te Geba, en hij voerde hen over naar Manahath;","7":"En Naäman, en Ahia, en Gera; dezen voerde hij weg; en hij gewon Uzza en Ahihud.","8":"En Saharaim gewon kinderen in het land van Moab ( nadat hij dezelve weggezonden had) uit Husim en Baara, zijn vrouwen;","9":"En uit Hodes, zijn huisvrouw, gewon hij Jobab, en Zibja, en Mesa, en Malcham,","10":"En Jeuz, en Sochja, en Mirma; dezen zijn zijne zonen, hoofden der vaderen.","11":"En uit Husim gewon hij Abitub en Elpaal.","12":"De kinderen van Elpaal nu waren Eber, en Misam, en Semed; deze heeft Ono gebouwd, en Lod en haar onderhorige plaatsen;","13":"En Beria, en Sema; dezen waren hoofden der vaderen van de inwoners te Ajalon; dezen hebben de inwoners van Gath verdreven.","14":"En Ahjo, Sasak en Jeremoth,","15":"En Zebadja, en Arad, en Eder,","16":"En Michaël, en Jispa, en Joha waren kinderen van Beria.","17":"En Zebadja, en Mesullam, en Hizki, en Heber,","18":"En Jismerai, en Jizlia en Jobab, de kinderen van Elpaal.","19":"En Jakim, en Zichri, en Zabdi,","20":"En Eljoenai, en Zillethai, en Eliël,","21":"En Adaja, en Beraja, en Simrath waren kinderen van Simeï.","22":"En Jispan, en Eber, en Eliël,","23":"En Abdon, en Zichri, en Hanan,","24":"En Hananja, en Elam, en Antothija,","25":"En Jifdeja, en Pnuël waren zonen van Sasak.","26":"En Samserai, en Seharja, en Athalja,","27":"En Jaaresja, en Elia, en Zichri waren zonen van Jeroham.","28":"Dezen waren de hoofden der vaderen, hoofden naar hun geslachten; dezen woonden te Jeruzalem.","29":"En te Gibeon woonde de vader van Gibeon; en de naam zijner huisvrouw was Maacha.","30":"En zijn eerstgeboren zoon was Abdon, daarna Zur, en Kis, en Baäl, en Nadab,","31":"En Gedor, en Ahio, en Zecher.","32":"En Mikloth gewon Simea; en dezen woonden ook tegenover hun broederen te Jeruzalem, met hun broederen.","33":"Ner nu gewon Kis, en Kis gewon Saul, en Saul gewon Jonathan, en Malchi-sua, Abinadab, en Esbaal.","34":"En Jonathans zoon was Merib-baal, en Merib-baal gewon Micha.","35":"De kinderen van Micha nu waren Pithon, en Melech, en Thaarea, en Achaz.","36":"En Achaz gewon Jehoadda, en Jehoadda gewon Alemeth, en Azmaveth, en Zimri; Zimri nu gewon Moza;","37":"En Moza gewon Bina; zijn zoon was Rafa; zijn zoon was Elasa; zijn zoon was Azel.","38":"Azel nu had zes zonen, en dit zijn hun namen; Azrikam, Bochru, en Ismaël, en Searja, en Obadja, en Hanan. Al dezen waren zonen van Azel.","39":"En de zonen van Esek, zijn broeder, waren Ulam, zijn eerstgeborene, Jeus, de tweede, en Elifelet, de derde.","40":"En de zonen van Ulam waren mannen, kloeke helden, den boog spannende, en zij hadden vele zonen, en zoons zonen, honderd en vijftig. Al dezen waren van de kinderen van Benjamin."},"KJV":{"1":"Now Benjamin begat Bela his firstborn, Ashbel the second, and Aharah the third,","2":"Nohah the fourth, and Rapha the fifth.","3":"And the sons of Bela were, Addar, and Gera, and Abihud,","4":"And Abishua, and Naaman, and Ahoah,","5":"And Gera, and Shephuphan, and Huram.","6":"And these are the sons of Ehud: these are the heads of the fathers of the inhabitants of Geba, and they removed them to Manahath:","7":"And Naaman, and Ahiah, and Gera, he removed them, and begat Uzza, and Ahihud.","8":"And Shaharaim begat children in the country of Moab, after he had sent them away; Hushim and Baara were his wives.","9":"And he begat of Hodesh his wife, Jobab, and Zibia, and Mesha, and Malcham,","10":"And Jeuz, and Shachia, and Mirma. These were his sons, heads of the fathers.","11":"And of Hushim he begat Abitub, and Elpaal.","12":"The sons of Elpaal; Eber, and Misham, and Shamed, who built Ono, and Lod, with the towns thereof:","13":"Beriah also, and Shema, who were heads of the fathers of the inhabitants of Aijalon, who drove away the inhabitants of Gath:","14":"And Ahio, Shashak, and Jeremoth,","15":"And Zebadiah, and Arad, and Ader,","16":"And Michael, and Ispah, and Joha, the sons of Beriah;","17":"And Zebadiah, and Meshullam, and Hezeki, and Heber,","18":"Ishmerai also, and Jezliah, and Jobab, the sons of Elpaal;","19":"And Jakim, and Zichri, and Zabdi,","20":"And Elienai, and Zilthai, and Eliel,","21":"And Adaiah, and Beraiah, and Shimrath, the sons of Shimhi;","22":"And Ishpan, and Heber, and Eliel,","23":"And Abdon, and Zichri, and Hanan,","24":"And Hananiah, and Elam, and Antothijah,","25":"And Iphedeiah, and Penuel, the sons of Shashak;","26":"And Shamsherai, and Shehariah, and Athaliah,","27":"And Jaresiah, and Eliah, and Zichri, the sons of Jeroham.","28":"These were heads of the fathers, by their generations, chief men. These dwelt in Jerusalem.","29":"And at Gibeon dwelt the father of Gibeon; whose wife's name was Maachah:","30":"And his firstborn son Abdon, and Zur, and Kish, and Baal, and Nadab,","31":"And Gedor, and Ahio, and Zacher.","32":"And Mikloth begat Shimeah. And these also dwelt with their brethren in Jerusalem, over against them.","33":"And Ner begat Kish, and Kish begat Saul, and Saul begat Jonathan, and Malchishua, and Abinadab, and Eshbaal.","34":"And the son of Jonathan was Meribbaal; and Meribbaal begat Micah.","35":"And the sons of Micah were, Pithon, and Melech, and Tarea, and Ahaz.","36":"And Ahaz begat Jehoadah; and Jehoadah begat Alemeth, and Azmaveth, and Zimri; and Zimri begat Moza,","37":"And Moza begat Binea: Rapha was his son, Eleasah his son, Azel his son:","38":"And Azel had six sons, whose names are these, Azrikam, Bocheru, and Ishmael, and Sheariah, and Obadiah, and Hanan. All these were the sons of Azel.","39":"And the sons of Eshek his brother were, Ulam his firstborn, Jehush the second, and Eliphelet the third.","40":"And the sons of Ulam were mighty men of valour, archers, and had many sons, and sons' sons, an hundred and fifty. All these are of the sons of Benjamin."}},"tsk":{"1":[{"kopje":"Bela","refs":["1 Kron 7:6-12","Gen 46:21"]},{"kopje":"Ahrah","refs":["Num 26:38"]}],"3":[{"kopje":"Addar","refs":["Gen 46:21","Num 26:40"]}],"5":[{"kopje":"Gera","refs":["Richt 3:15"]},{"kopje":"Sefufan","refs":["1 Kron 7:12","Num 26:39"]}],"6":[{"kopje":"Ehud","refs":["1 Kron 7:10","Richt 3:20-30","Richt 4:1","Gen 46:21"]},{"kopje":"Geba","refs":["1 Kron 6:60"]},{"kopje":"Manahath","refs":["1 Kron 2:25","1 Kron 2:54"]}],"8":[{"kopje":"in het land","refs":["Ruth 1:1"]},{"kopje":"weggezonden had","refs":["Gen 25:6"]}],"9":[{"kopje":"Hodes","refs":["1 Kron 8:11"]}],"10":[{"kopje":"Mirma","refs":["1 Kron 8:10"]}],"12":[{"kopje":"Ono","refs":["Ezra 2:33","Neh 6:2","Neh 7:37","Neh 11:35"]}],"13":[{"kopje":"Sema","refs":["1 Kron 8:21"]},{"kopje":"de vaderen","refs":["1 Kron 2:49","1 Kron 2:50","1 Kron 2:52","1 Kron 4:4"]},{"kopje":"Ajalon","refs":["Joz 19:42"]}],"16":[{"kopje":"Beria","refs":["1 Kron 8:13"]}],"21":[{"kopje":"Simeï","refs":["1 Kron 8:13"]}],"28":[{"kopje":"woonden","refs":["Joz 15:63","Joz 18:28","Richt 1:21","Neh 11:1","Neh 11:7-9"]},{"kopje":"Jeruzalem","refs":["Ps 125:2","1 Kron 9:34"]}],"29":[{"kopje":"de vader","refs":["1 Kron 9:35","1 Kron 9:36"]}],"30":[{"kopje":"Abdon","refs":["1 Kron 9:36","1 Kron 9:37"]}],"31":[{"kopje":"Zecher","refs":["1 Kron iah","kinderen":[{"label":"4. Son of Azel","href":"../../nave/o/?hl=1Chr.8.38#i14755","refs":[{"disp":"1 Kron 8:38","href":"../../1-kronieken/8/#v38","ref":"1 Kron 8:38","svLabel":null},{"disp":"1 Kron 9:44","href":"../../1-kronieken/9/#v44","ref":"1 Kron 9:44","svLabel":null}],"kinderen":[]}]},{"topic":"Sheariah","href":"../../nave/s/#t-sheariah","kinderen":[{"label":"Son of Azel","href":"../../nave/s/?hl=1Chr.8.38#i18584","refs":[{"disp":"1 Kron 8:38","href":"../../1-kronieken/8/#v38","ref":"1 Kron 8:38","svLabel":null},{"disp":"1 Kron 9:44","href":"../../1-kronieken/9/#v44","ref":"1 Kron 9:44","svLabel":null}],"kinderen":[]}]}]},"39":{"nave":[{"topic":"Eliphelet","href":"../../nave/e/#t-eliphelet","kinderen":[{"label":"4. A descendant of Saul","href":"../../nave/e/?hl=1Chr.8.39#i6112","refs":[{"disp":"1 Kron 8:39","href":"../../1-kronieken/8/#v39","ref":"1 Kron 8:39","svLabel":null}],"kinderen":[]}]},{"topic":"Eshek","href":"../../nave/e/#t-eshek","kinderen":[{"label":"A Benjamite","href":"../../nave/e/?hl=1Chr.8.39#i6419","refs":[{"disp":"1 Kron 8:39","href":"../../1-kronieken/8/#v39","ref":"1 Kron 8:39","svLabel":null}],"kinderen":[]}]},{"topic":"Jehush","href":"../../nave/j/#t-jehush","kinderen":[{"label":"A Benjamite","href":"../../nave/j/?hl=1Chr.8.39#i10485","refs":[{"disp":"1 Kron 8:39","href":"../../1-kronieken/8/#v39","ref":"1 Kron 8:39","svLabel":null}],"kinderen":[]}]},{"topic":"Ulam","href":"../../nave/u/#t-ulam","kinderen":[{"label":"2. Son of Eshek","href":"../../nave/u/?hl=1Chr.8.39#i21052","refs":[{"disp":"1 Kron 8:39","href":"../../1-kronieken/8/#v39","ref":"1 Kron 8:39","svLabel":null},{"disp":"1 Kron 8:40","href":"../../1-kronieken/8/#v40","ref":"1 Kron 8:40","svLabel":null}],"kinderen":[]}]}]},"40":{"nave":[{"topic":"Archery","href":"../../nave/a/#t-archery","kinderen":[{"label":"Practiced by the sons of Ulam","href":"../../nave/a/?hl=1Chr.8.40#i1316","refs":[{"disp":"1 Kron 8:40","href":"../../1-kronieken/8/#v40","ref":"1 Kron 8:40","svLabel":null}],"kinderen":[]}]},{"topic":"Benjamin","href":"../../nave/b/#t-benjamin","kinderen":[{"label":"During the reign of Jehoshaphat","href":"../../nave/b/?hl=1Chr.8.40#i2342","refs":[],"kinderen":[{"label":"Skill in archery and as slingers of stones","href":"../../nave/b/?hl=1Chr.8.40#i2343","refs":[{"disp":"Richt 3:15","href":"../../richteren/3/#v15","ref":"Richt 3:15","svLabel":null},{"disp":"Richt 20:16","href":"../../richteren/20/#v16","ref":"Richt 20:16","svLabel":null},{"disp":"1 Kron 8:40","href":"../../1-kronieken/8/#v40","ref":"1 Kron 8:40","svLabel":null},{"disp":"1 Kron 12:2","href":"../../1-kronieken/12/#v2","ref":"1 Kron 12:2","svLabel":null}],"kinderen":[]}]}]},{"topic":"Ulam","href":"../../nave/u/#t-ulam","kinderen":[{"label":"2. Son of Eshek","href":"../../nave/u/?hl=1Chr.8.40#i21052","refs":[{"disp":"1 Kron 8:39","href":"../../1-kronieken/8/#v39","ref":"1 Kron 8:39","svLabel":null},{"disp":"1 Kron 8:40","href":"../../1-kronieken/8/#v40","ref":"1 Kron 8:40","svLabel":null}],"kinderen":[]}]}]}},"extern":{"1 Kron 2:49":"En de huisvrouw van Saaf, de vader van Madmanna, baarde Seva, de vader van Machbena, en de vader van Gibea; en de dochter van Kaleb was Achsa.","2 Sam 19:24-30":"Mefiboseth, Sauls zoon, kwam ook de koning tegemoet; en hij had zijn voeten niet verzorgd, noch zijn baard geknipt, noch zijn kleren gewassen, vanaf de dag dat de koning weggegaan was, tot de dag dat hij met vrede terugkwam. En het gebeurde, toen hij in Jeruzalem de koning tegemoet kwam, dat de koning tegen hem zei: Waarom bent u niet met mij meegegaan, Mefiboseth? En hij zei: Mijn heer koning, mijn knecht heeft mij bedrogen; want uw knecht zei: Ik zal voor mij een ezel zadelen, en daarop rijden, en naar de koning trekken, want uw knecht is kreupel.","1 Kron 2:54":"De kinderen van Salma waren de Bethlehemieten, en de Netofathieten, Atroth, Beth-joab, en de helft van de Manathieten, en de Zorieten.","1 Sam 14:51":"En Kis was Sauls vader, en Ner, Abners vader, was een zoon van Abiël.","1 Kon 2:8":"En zie, bij u is Simeï, de zoon van Gera, de zoon van Jemini, uit Bahurim, die mij vervloekte met een zware vloek, op de dag dat ik naar Mahanaïm ging; maar hij kwam mij tegemoet bij de Jordaan, en ik zwoer hem bij de HEERE en zei: Ik zal u niet met het zwaard doden!","Neh 11:7-9":"En dit zijn de kinderen van Benjamin: Sallu, de zoon van Mesullam, de zoon van Joed, de zoon van Pedaja, de zoon van Kolaja, de zoon van Maaseja, de zoon van Ithiël, de zoon van Jesaja; En na hem Gabbai, Sallai; negenhonderdachtentwintig. En Joël, de zoon van Zichri, was opziener over hen; en Juda, de zoon van Senua, was de tweede over de stad.","Ezra 9:2":"Want zij hebben van hun dochters genomen voor zichzelf en voor hun zonen, zodat het heilig zaad zich vermengd heeft met de volken van deze landen; ja, de hand van de vorsten en overheden is de eerste geweest in deze overtreding.","1 Kron 7:7":"En de kinderen van Bela waren Ezbon, en Uzzi, en Uzziël, en Jerimoth, en Iri; vijf hoofden van de huizen van de vaderen, kloeke helden; die, toen zij in de geslachtsregisters werden opgenomen, tweeëntwintigduizend vierendertig waren.","1 Kron 9:41":"De kinderen van Micha nu waren Pithon, en Melech, en Thaerea.","1 Sam 31:2":"En de Filistijnen zaten Saul en zijn zonen dicht op de hielen; en de Filistijnen versloegen Jonathan, en Abinadab, en Malchisua, de zonen van Saul.","1 Kron 9:43":"En Moza verwekte Bina; wiens zoon was Refaja; wiens zoon was Elasa; wiens zoon was Azel.","2 Kron 14:8":"Asa nu had een leger van driehonderdduizend uit Juda, die rondas en spies droegen, en tweehonderdtachtigduizend uit Benjamin, die het schild droegen en de boog spanden; al dezen waren kloeke helden.","Num 26:39":"Van Sefufam het geslacht der Sufamieten; van Hufam het geslacht der Hufamieten.","1 Kron 2:39":"En Azaria verwekte Helez, en Helez verwekte Elasa,","1 Kron 9:40":"En Jonathans zoon was Merib-baal, en Merib-baal verwekte Micha.","Neh 7:37":"De kinderen van Lod, Hadid en Ono, zevenhonderdeenentwintig;","2 Sam 16:5":"Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte.","1 Kron 9:36":"En Abdon was zijn eerstgeboren zoon, daarna Zur, en Kis, en Baäl, en Ner, en Nadab.","2 Sam 9:10":"Daarom zult u voor hem het land bewerken, u, en uw zonen, en uw knechten, en de opbrengst inbrengen, zodat de zoon van uw heer brood heeft om te eten; en Mefiboseth, de zoon van uw heer, zal voortdurend brood eten aan mijn tafel. Ziba nu had vijftien zonen en twintig knechten.","Joz 19:42":"En Saalabbin, en Ajalon, en Jithla,","Ps 125:2":"Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid.","Neh 11:1":"Verder woonden de leiders van het volk te Jeruzalem; maar het overige van het volk wierp loten, om uit tien er één uit te brengen, die in de heilige stad Jeruzalem zou wonen, en negen delen in de andere steden.","2 Sam 5:25":"En David deed zo, zoals de HEERE hem geboden had; en hij versloeg de Filistijnen van Geba af, tot waar u bij Gezer komt.","2 Sam 19:18":"Toen het veer overstak, om het huis van de koning over te brengen, en te doen wat goed was in zijn ogen, viel Simeï, de zoon van Gera, neer voor het gezicht van de koning, toen hij de Jordaan overstak;","Jes 10:29":"Zij trekken door de doorgang, te Geba houden zij hun overnachting; Rama beeft, Gibea van Saul vlucht.","Zach 14:10":"Dit hele land zal rondom als een vlak veld gemaakt worden, van Geba tot Rimmon toe, zuidwaarts van Jeruzalem; en zij zal verhoogd en bewoond worden op haar plaats; van de poort van Benjamin af, tot aan de plaats van de eerste poort, tot aan de Hoekpoort toe; en van de toren van Hananeel, tot aan de wijnbakken van de koning toe.","1 Kron 9:8":"En Jibnea, de zoon van Jeroham, en Ela, de zoon van Uzzi, de zoon van Michri; en Mesullam, de zoon van Sefatja, de zoon van Reüel, de zoon van Jibnija;","1 Kron 9:39":"En Ner verwekte Kis, en Kis verwekte Saul, en Saul verwekte Jonathan, en Malchi-sua, en Abinadab, en Esbaal.","1 Kron 7:6":"De kinderen van Benjamin waren Bela, en Becher, en Jediaël; drie.","Hand 13:21":"En vanaf toen verlangden zij naar een koning; en God gaf hun Saul, de zoon van Kis, een man uit de stam van Benjamin, veertig jaar lang.","Richt 3:20-30":"En Ehud kwam bij hem binnen, terwijl hij zat in een koele bovenzaal, die hij voor zich alleen had; zo zei Ehud: Ik heb een woord van God aan u. Toen stond hij op van de stoel. Ehud dan stak zijn linkerhand uit, en nam het zwaard van zijn rechterheup, en stak het in zijn buik; zodat ook het heft achter het lemmet ingleed, en het vet zich om het lemmet sloot (want hij trok het zwaard niet uit zijn buik), en de darmuitwerpselen kwamen naar buiten.","1 Kron 9:34":"Dit zijn de hoofden van de vaderen onder de Levieten, hoofden in hun geslachten; dezen woonden te Jeruzalem.","1 Kron 9:7":"En van de kinderen van Benjamin waren Sallu, de zoon van Mesullam, de zoon van Hodavia, de zoon van Hassenua;","Neh 13:23":"Ook zag ik in die dagen Joden die Asdodische, Ammonietische en Moabietische vrouwen bij zich hadden laten wonen.","Neh 11:31":"De kinderen van Benjamin nu woonden, van Geba af, in Michmas, en Aja, en Beth-el, en haar onderhorige plaatsen,","Jer 29:3":"Door de hand van Elasa, de zoon van Safan, en Gemarja, de zoon van Hilkia, die Zedekia, de koning van Juda, naar Babel zond, naar Nebukadnezar, de koning van Babel, en hij zei:","Ezra 2:33":"De kinderen van Lod, Hadid en Ono, zevenhonderdvijfentwintig.","Neh 11:35":"Lod, en Ono, in het dal van de werkmeesters.","Ps 127:3-5":"Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning. Zoals de pijlen zijn in de hand van een held, zo zijn de zonen van de jeugd. Gelukkig is de man die zijn pijlkoker ermee gevuld heeft; zij zullen niet beschaamd worden als zij met de vijanden spreken zullen in de poort.","1 Sam 14:49":"De zonen van Saul nu waren: Jonathan, en Isvi, en Malchi-sua; en de namen van zijn twee dochters waren deze: de naam van de oudste was Merab, en de naam van de jongste Michal.","1 Kon 15:22":"Toen liet de koning Asa door heel Juda uitroepen (niemand was vrijgesteld), dat zij de stenen van Rama, en het hout daarvan, zouden wegdragen, waarmee Baësa gebouwd had; en de koning Asa bouwde daarmee Geba-Benjamins, en Mizpa.","1 Sam 9:1":"Er was nu een man van Benjamin, wiens naam Kis was, een zoon van Abiël, de zoon van Zeror, de zoon van Bechorath, de zoon van Afiah, de zoon van een man van Jemini, een dapper held.","1 Kron 6:60":"Van de stam van Benjamin nu: Geba en haar voorsteden, en Allemeth en haar voorsteden, en Anathoth en haar voorsteden. Al hun steden, in hun families, waren dertien steden.","Richt 1:21":"Doch de Benjaminieten hebben de Jebusieten, die in Jeruzalem woonden, niet verdreven; maar de Jebusieten woonden met de Benjaminieten in Jeruzalem, tot op deze dag.","1 Sam 13:3":"Toen versloeg Jonathan de bezetting van de Filistijnen die te Geba was, en de Filistijnen hoorden dat. Daarom liet Saul de bazuin blazen door het hele land en zei: Laat de Hebreeën het horen.","1 Kron 9:42":"En Achaz verwekte Jaera, en Jaera verwekte Alemeth, en Azmaveth, en Zimri; en Zimri verwekte Moza;","1 Kron 2:25":"De kinderen van Jerahmeel nu, de eerstgeborene van Hezron, waren deze: de eerstgeborene was Ram, daartoe Buna, en Oren, en Ozem en Ahia.","Neh 12:29":"En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.","Richt 4:1":"Maar de Israëlieten gingen door met doen wat kwaad was in de ogen van de HEERE, nadat Ehud gestorven was.","Num 26:40":"En de zonen van Bela waren Ard en Naäman; van Ard het geslacht der Ardieten; van Naäman het geslacht der Naamieten.","Neh 6:2":"dat Sanballat en Gesem naar mij stuurden om te zeggen: Kom, laten wij samen bijeenkomen in de dorpen, in het dal Ono. Maar zij waren van plan mij kwaad te doen.","1 Sam 14:50":"En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.","Ruth 1:4":"Die namen voor zich Moabitische vrouwen; de naam van de ene was Orpa, en de naam van de andere Ruth; en zij bleven daar ongeveer tien jaar.","Gen 46:21":"En de zonen van Benjamin: Bela, Becher en Asbel, Gera en Naäman, Echi en Ros, Muppim en Huppim, en Ard.","2 Sam 4:4":"En Jonathan, Sauls zoon, had een zoon die aan beide voeten gewond was; hij was vijf jaar oud toen het bericht over Saul en Jonathan uit Jizreël kwam; en zijn voedster nam hem op en vluchtte; en het gebeurde, toen zij zich haastte om te vluchten, dat hij viel en kreupel werd; en zijn naam was Mefiboseth.","1 Kron 9:38":"Mikloth nu verwekte Simeam; dezen woonden ook te Jeruzalem, tegenover hun broeders, met hun broeders.","1 Kron 7:10":"De kinderen van Jediaël nu waren Bilhan; en de kinderen van Bilhan waren Jeüs en Benjamin, en Ehud, en Chenaäna, en Zethan, en Tharsis, en Ahi-sahar.","Ps 128:3-6":"Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel. Zie, zo zal die man zeker gezegend worden, die de HEERE vreest. De HEERE zal u zegenen uit Sion, en u zult het goede van Jeruzalem zien al de dagen van uw leven;","Ezra 9:1":"Toen deze dingen voltooid waren, kwamen de vorsten naar mij toe en zeiden: Het volk van Israël, en de priesters, en de Levieten, hebben zich niet afgezonderd van de volken van deze landen, naar hun gruwelen, namelijk van de Kanaänieten, de Hethieten, de Ferezieten, de Jebusieten, de Ammonieten, de Moabieten, de Egyptenaren en de Amorieten.","1 Kron 7:12":"Daartoe waren Suppim en Huppim kinderen van Ir, en Husim, kinderen van Aher.","Richt 3:15":"Toen riepen de kinderen van Israël tot de HEERE, en de HEERE verwekte hun een verlosser, Ehud, de zoon van Gera, een zoon van Jemini, een man die links was. En de kinderen van Israël zonden door zijn hand een geschenk aan Eglon, de koning van de Moabieten.","1 Kron 2:50":"Dit waren de kinderen van Kaleb, de zoon van Hur, de eerstgeborene van Efratha: Sobal, de vader van Kirjath-jearim;","1 Kron 4:4":"En Pnuël was de vader van Gedor, en Ezer de vader van Husah. Dit zijn de kinderen van Hur, de eerstgeborene van Efratha, de vader van Bethlehem.","Ruth 1:1":"In de dagen dat de rechters rechtspraken, gebeurde het dat er honger in het land was; daarom trok een man van Bethlehem-juda weg om als vreemdeling te wonen in de velden van Moab, hij, en zijn vrouw, en zijn twee zonen.","Gen 25:6":"Maar aan de zonen van de bijvrouwen die Abraham had, gaf Abraham geschenken; en zond hen weg van zijn zoon Izak, terwijl hij nog leefde, oostwaarts naar het land van het Oosten.","1 Kron 12:2":"Gewapend met bogen, rechts en links met stenen werpend, en met pijlen schietend uit de boog; zij waren van de broers van Saul, uit Benjamin.","1 Kron 9:44":"Azel nu had zes zonen, en dit zijn hun namen: Azrikam, Bochru, en Ismaël, en Searja, en Obadja, en Hanan; dezen zijn Azels zonen.","1 Kron 9:37":"En Gedor, en Ahio, en Zacharja, en Mikloth.","1 Kon 11:1":"En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen;","2 Sam 9:12":"Mefiboseth nu had een kleine zoon, wiens naam Micha was; en allen die in het huis van Ziba woonden, waren knechten van Mefiboseth.","2 Sam 2:8":"Abner nu, de zoon van Ner, de legeraanvoerder die Saul gehad had, nam Isboseth, Sauls zoon, en voerde hem over naar Mahanaim,","Joz 15:63":"Maar de kinderen van Juda konden de Jebusieten, inwoners van Jeruzalem, niet verdrijven; zo woonden de Jebusieten bij de kinderen van Juda te Jeruzalem, tot op deze dag.","2 Sam 19:16":"En Simeï, de zoon van Gera, een Benjaminiet, die uit Bahurim was, haastte zich, en kwam met de mannen van Juda naar beneden, koning David tegemoet;","Richt 20:16":"Onder al dit volk waren zevenhonderd uitgelezen mannen, die linkshandig waren; deze allen slingerden met een steen op een haar nauwkeurig, zodat het hun niet miste.","Num 25:1-3":"Israël verbleef te Sittim, en het volk begon te hoereren met de dochters van de Moabieten. En zij nodigden het volk tot de offers van hun goden; en het volk at, en boog zich neer voor hun goden. Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.","2 Sam 4:12":"En David gaf zijn knechten bevel, en zij doodden hen, en hakten hun handen en hun voeten af, en hingen ze op bij de vijver te Hebron; maar het hoofd van Isboseth namen zij en begroeven het in Abners graf te Hebron.","Joz 21:17":"En van de stam van Benjamin, Gibeon en haar voorsteden, Geba en haar voorsteden;","Joz 18:28":"En Zela, Elef en Jebusi (dat is Jeruzalem), Gibath, Kirjath: veertien steden alsook de bijbehorende dorpen. Dit is het erfdeel van de kinderen van Benjamin, naar hun huisgezinnen.","Num 26:38":"De zonen van Benjamin, naar hun geslachten: van Bela het geslacht der Belaieten; van Asbel het geslacht der Asbelieten; van Ahiram het geslacht der Ahiramieten;","1 Kron 9:35":"Maar te Gibeon hadden gewoond Jeiel, de vader van Gibeon; de naam van zijn zuster nu was Maächa.","2 Kon 23:8":"En hij bracht al de priesters uit de steden van Juda, en verontreinigde de hoogten, waar die priesters gerookt hadden, van Geba af tot Berseba toe; en hij brak de hoogten van de poorten af, ook die welke bij de deur van de poort van Jozua, de leider van de stad, was, welke aan iemands linkerhand lag, als men de stadspoort binnenging.","1 Kron 10:2":"En de Filistijnen bleven Saul en zijn zonen op de hielen zitten; en de Filistijnen sloegen Jonathan, en Abinadab, en Malchi-sua, de zonen van Saul.","2 Sam 9:6":"Toen nu Mefiboseth, de zoon van Jonathan, de zoon van Saul, bij David kwam, viel hij op zijn aangezicht en boog zich neer. En David zei: Mefiboseth! En hij zei: Zie, hier is uw knecht.","2 Kron 16:6":"Toen nam de koning Asa heel Juda, en zij droegen de stenen van Rama weg, en het hout ervan, waarmee Baësa gebouwd had; en hij bouwde daarmee Geba en Mizpa.","1 Kron 2:52":"De kinderen van Sobal, de vader van Kirjath-jearim, waren Haroe en Hazihammenuchoth.","1 Kron 7:6-12":"De kinderen van Benjamin waren Bela, en Becher, en Jediaël; drie. En de kinderen van Bela waren Ezbon, en Uzzi, en Uzziël, en Jerimoth, en Iri; vijf hoofden van de huizen van de vaderen, kloeke helden; die, toen zij in de geslachtsregisters werden opgenomen, tweeëntwintigduizend vierendertig waren. De kinderen van Becher nu waren Zemira, en Joas, en Eliëzer, en Eljoenai, en Omri, en Jeremoth, en Abija, en Anathoth, en Alemeth; deze allemaal waren kinderen van Becher."},"noten":{},"koppeling":{"1":"<span class=\"wl\" data-l=\"L1\" data-code=\"H1144\">Benjamin</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3205\">verwekte</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1106\">Bela</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H1106\">zijn</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1060\">eerstgeborene</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H788\">Asbel</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H788\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8145\">tweede</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H315\">en</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H315\">Ahrah</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H315\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H7992\">derde</span>,","2":"<span class=\"wl\" data-l=\"L1\" data-code=\"H5119\">Naho</span>, <span class=\"wl\" data-l=\"L1\" data-code=\"H5119\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7243\">vierde</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H7498\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7498\">Rafa</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H7498\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2549\">vijfde</span>.","3":"<span class=\"wl\" dat code=\"H1661\">Gath:</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H283\">Ahio,</span> <span class=\"wl wl-kjv\" data-code=\"H8349\">Shashak,</span> and <span class=\"wl wl-kjv\" data-code=\"H3406\">Jeremoth,</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H2069\">Zebadiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6166\">Arad,</span> and <span class=\"wl wl-kjv\" data-code=\"H5738\">Ader,</span>","16":"And <span class=\"wl wl-kjv\" data-code=\"H4317\">Michael,</span> and <span class=\"wl wl-kjv\" data-code=\"H3472\">Ispah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3109\">Joha,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1283\">Beriah;</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H2069\">Zebadiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H4918\">Meshullam,</span> and <span class=\"wl wl-kjv\" data-code=\"H2395\">Hezeki,</span> and <span class=\"wl wl-kjv\" data-code=\"H2268\">Heber,</span>","18":"<span class=\"wl wl-kjv\" data-code=\"H3461\">Ishmerai</span> also, and <span class=\"wl wl-kjv\" data-code=\"H3152\">Jezliah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3103\">Jobab,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H508\">Elpaal;</span>","19":"And <span class=\"wl wl-kjv\" data-code=\"H3356\">Jakim,</span> and <span class=\"wl wl-kjv\" data-code=\"H2147\">Zichri,</span> and <span class=\"wl wl-kjv\" data-code=\"H2067\">Zabdi,</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H462\">Elienai,</span> and <span class=\"wl wl-kjv\" data-code=\"H6769\">Zilthai,</span> and <span class=\"wl wl-kjv\" data-code=\"H447\">Eliel,</span>","21":"And <span class=\"wl wl-kjv\" data-code=\"H5718\">Adaiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H1256\">Beraiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H8119\">Shimrath,</span> the <span class=\"wl wl-kjv\" data-code=\ 3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan,</span> and <span class=\"wl wl-kjv\" data-code=\"H4444\">Malchishua,</span> and <span class=\"wl wl-kjv\" data-code=\"H41\">Abinadab,</span> and <span class=\"wl wl-kjv\" data-code=\"H792\">Eshbaal.</span>","34":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> was <span class=\"wl wl-kjv\" data-code=\"H4807\">Meribbaal;</span> and <span class=\"wl wl-kjv\" data-code=\"H4807\">Meribbaal</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H4318\">Micah.</span>","35":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4318\">Micah</span> were, <span class=\"wl wl-kjv\" data-code=\"H6377\">Pithon,</span> and <span class=\"wl wl-kjv\" data-code=\"H4429\">Melech,</span> and <span class=\"wl wl-kjv\" data-code=\"H8390\">Tarea,</span> and <span class=\"wl wl-kjv\" data-code=\"H271\">Ahaz.</span>","36":"And <span class=\"wl wl-kjv\" data-code=\"H271\">Ahaz</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H3085\">Jehoadah;</span> and <span class=\"wl wl-kjv\" data-code=\"H3085\">Jehoadah</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H5964\">Alemeth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5820\">Azmaveth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2174\">Zimri;</span> and <span class=\"wl wl-kjv\" data-code=\"H2174\">Zimri</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H4162\">Moza,</span>","37":"And <span class=\"wl wl-kjv\" data-code=\"H4162\">Moza</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H1150\">Binea:</span> <span class=\"wl wl-kjv\" data-code=\"H7498\">Rapha</span> was his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H501\">Eleasah</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H682\">Azel</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son:</span>","38":"And <span class=\"wl wl-kjv\" data-code=\"H682\">Azel</span> had <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> are these, <span class=\"wl wl-kjv\" data-code=\"H5840\">Azrikam,</span> <span class=\"wl wl-kjv\" data-code=\"H1074\">Bocheru,</span> and <span class=\"wl wl-kjv\" data-code=\"H3458\">Ishmael,</span> and <span class=\"wl wl-kjv\" data-code=\"H8187\">Sheariah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5662\">Obadiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2605\">Hanan.</span> All these were the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H682\">Azel.</span>","39":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6232\">Eshek</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> were, <span class=\"wl wl-kjv\" data-code=\"H198\">Ulam</span> his <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> <span class=\"wl wl-kjv\" data-code=\"H3266\">Jehush</span> the <span class=\"wl wl-kjv\" data-code=\"H8145\">second,</span> and <span class=\"wl wl-kjv\" data-code=\"H467\">Eliphelet</span> the <span class=\"wl wl-kjv\" data-code=\"H7992\">third.</span>","40":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H198\">Ulam</span> were <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour,</span> const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
