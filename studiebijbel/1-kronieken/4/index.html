en Temeni, en Haahastari. Dit zijn de kinderen van Naära.","7":"En de kinderen van Hela waren Zereth, Jezohar, en Ethnan.","8":"En Koz verwekte Anub en Hazobeba, en de huisgezinnen van Aharlel, de zoon van Harum.","9":"Jabez nu was aanzienlijker dan zijn broeders; en zijn moeder had hem Jabez genoemd, en zei: Want ik heb hem met smarten gebaard.","10":"Want Jabez riep de God van Israël aan, en zei: Als U mij rijkelijk zegent, en mijn gebied vermeerdert, en Uw hand met mij zal zijn, en U mij zo voor het kwade behoedt, dat het mij geen smart doet! En God liet komen wat hij begeerde.","11":"En Chelub, de broeder van Suha, verwekte Mechir; hij is de vader van Eston.","12":"Eston nu verwekte Beth-Rafa, en Pasea, en Tehinna, de vader van Ir-Nahas; dit zijn de mannen van Recha.","13":"En de kinderen van Kenaz waren Othniël en Seraja; en de kinderen van Othniël, Hathath.","14":"En Meonothai verwekte Ofra; en Seraja verwekte Joab, de vader van het dal van de werkmeesters; want zij waren werkmeesters.","15":"De kinderen van Kaleb nu, de zoon van Jefunne, waren Iru, Ela en Naäm; en de kinderen van Ela, te weten Kenaz.","16":"En de kinderen van Jehalelel waren Zif en Zifa, Thirea en Asareel.","17":"En de kinderen van Ezra waren Jether, en Mered, en Efer, en Jalon; en zij baarde Mirjam, en Sammai, en Isbah, de vader van Esthemoa.","18":"En zijn Joodse vrouw baarde Jered, de vader van Gedor, en Heber, de vader van Socho, en Jekuthiel, de vader van Zanoah; en dit zijn de kinderen van Bitja, de dochter van de farao, die Mered genomen had.","19":"En de kinderen van de vrouw van Hodija, de zuster van Naham, waren Abi-Kehila, de Garmiet, en Esthemoa, de Maachathiet.","20":"En de kinderen van Simon nu waren Amnon en Rinna, Ben-Hanan en Tilon; en de kinderen van Isei waren Zoheth en Ben-Zoheth.","21":"De kinderen van Sela, de zoon van Juda, waren Er, de vader van Lecha, en Lada, de vader van Maresa; en de huisgezinnen van het huis van de linnenwerkers in het huis Asbea.","22":"Daartoe Jokim, en de mannen van Chozeba, en Joas, en Saraf (die over de Moabieten geheerst hebben) en de Jasubilehem; deze dingen zijn echter oud.","23":"Dezen waren pottenbakkers, wonend bij plantages en tuinen; zij zijn daar gebleven bij de koning in zijn werk.","24":"De kinderen van Simeon waren Nemuël en Jamin, Jarib, Zerah, Saul.","25":"Sallum was zijn zoon; Mibsam was zijn zoon; Misma was zijn zoon.","26":"De kinderen van Misma waren *dezen*: Hammuël zijn zoon, Zaccur zijn zoon, Simeï zijn zoon.","27":"Simeï nu had zestien zonen en zes dochters; maar zijn broeders hadden niet veel kinderen; en heel hun huisgezin werd niet zo vermeerderd als dat van de kinderen van Juda.","28":"En zij woonden te Ber-Seba, en te Molada, en te Hazar-Sual,","29":"En te Bilha, en te Ezem, en te Tholad,","30":"En te Bethuël, en te Horma, en te Ziklag,","31":"En te Beth-Markaboth, en te Hazar-Susim, en te Beth-Biri, en te Saaraim. Dit waren hun steden, totdat David koning werd.","32":"En hun dorpen waren Etam en Ain, Rimmon en Tochen, en Asan; vijf steden.","33":"En al hun dorpen, die rondom deze steden lagen, tot Baäl toe. Dit zijn hun woonplaatsen en hun geslachtsregister voor hen.","34":"Doch Mesobab, en Jamlech, en Josa, de zoon van Amazia,","35":"En Joël, en Jehu, de zoon van Jesibja, de zoon van Seraja, de zoon van Asiël,","36":"En Eljoenai, en Jaakoba, en Jesohaja, en Asaja, en Adiël, en Jesimeel, en Benaja,","37":"En Ziza, de zoon van Sifei, de zoon van Allon, de zoon van Jedaja, de zoon van Simri, de zoon van Semaja;","38":"Dezen waren met naam bekend, vorsten in hun huisgezinnen, en de huisgezinnen van hun vaders braken in menigte uit.","39":"En zij gingen tot aan de ingang van Gedor tot het oosten van het dal, om weide te zoeken voor hun schapen.","40":"En zij vonden vette en goede weide, en een land, wijd van omvang, en stil, en gerust; want zij die van Cham waren, woonden daar al eerder.","41":"Dezen nu, die met naam beschreven zijn, kwamen in de dagen van Hizkia, de koning van Juda, en zij sloegen de tenten en woningen van hen die daar gevonden werden; en zij verbanden hen, tot op deze dag; en zij woonden op hun plaats, want daar was weide voor hun schapen.","42":"Ook trokken van hen, te weten van de kinderen van Simeon, vijfhonderd mannen uit naar het gebergte van Seïr; en Pelatja, en Nearja, en Refaja, en Uzziël, de zonen van Isei, waren hun tot hoofden.","43":"En zij sloegen de rest van hen die van de Amalekieten ontkomen waren, en zij woonden daar tot op deze dag."},"SV":{"1":"De kinderen van Juda waren Perez, Hezron en Charmi, en Hur, en Sobal.","2":"En Reaja, de zoon van Sobal, gewon Jahath, en Jahath gewon Ahumai en Lahad; dit zijn de huisgezinnen der Zorathieten;","3":"En dezen zijn van den vader Etam: Jizreël, en Isma, en Idbas; en de naam hunner zuster was Hazelelponi.","4":"En Pnuël was de vader van Gedor, en Ezer de vader van Husah. Dit zijn de kinderen van Hur, den eerstgeborene van Efratha, den vader van Bethlehem.","5":"Asschur nu, de vader van Thekoa, had twee vrouwen, Hela en Naära.","6":"En Naära baarde hem Ahuzzam, en Hefer, en Temeni, en Haahastari. Dit zijn de kinderen van Naära.","7":"En de kinderen van Hela waren Zereth, Jezohar, en Ethnan.","8":"En Koz gewon Anub en Hazobeba, en de huisgezinnen van Aharlel, den zoon van Harum.","9":"Jabez nu was heerlijker dan zijn broeders; en zijn moeder had zijn naam Jabez genoemd, zeggende: Want ik heb hem met smarten gebaard.","10":"Want Jabez riep den God Israëls aan, zeggende: Indien Gij mij rijkelijk zegenen, en mijn landpale vermeerderen zult, en Uw hand met mij zijn zal, en met het kwade *alzo* maakt, dat het mij niet smarte! En God liet komen, wat hij begeerde.","11":"En Chelub, de broeder van Suha, gewon Mechir; hij is de vader van Eston.","12":"Eston nu gewon Beth-rafa, en Pasea, en Tehinna, den vader van Ir-nahas; dit zijn de mannen van Recha.","13":"En de kinderen van Kenaz waren Othniël en Seraja; en de kinderen van Othniël, Hathath.","14":"En Meonothai gewon Ofra; en Seraja gewon Joab, den vader des dals der werkmeesters; want zij waren werkmeesters.","15":"De kinderen van Kaleb nu, den zoon van Jefunne, waren Iru, Ela en Naäm; en de kinderen van Ela, te weten Kenaz.","16":"En de kinderen van Jehalelel waren Zif en Zifa, Thirea en Asareel.","17":"En de kinderen van Ezra waren Jether, en Mered, en Efer, en Jalon; en zij baarde Mirjam, en Sammai, en Isbah, den vader van Esthemoa.","18":"En zijn Joodse huisvrouw baarde Jered, den vader van Gedor, en Heber, den vader van Socho, en Jekuthiel, den vader van Zanoah; en die zijn kinderen van Bitja, de dochter van Farao, die Mered genomen had.","19":"En de kinderen van de huisvrouw Hodija, de zuster van Naham, waren Abi- kehila, de Garmiet, en Esthemoa, de Maachathiet.","20":"En de kinderen van Simon nu waren Amnon en Rinna, Ben-hanan en Tilon; en de kinderen van Isei waren Zoheth en Ben-zoheth.","21":"De kinderen van Sela, den zoon van Juda, waren Er, de vader van Lecha, en Lada, de vader van Maresa; en de huisgezinnen van het huis der linnenwerkers in het huis Asbea.","22":"Daartoe Jokim, en de mannen van Chozeba, en Joas, en Saraf ( die over de Moabieten geheerst hebben) en de Jasubilehem; doch deze dingen zijn oud.","23":"Dezen waren pottenbakkers, wonende bij plantages en tuinen; zij zijn daar gebleven bij den koning in zijn werk.","24":"De kinderen van Simeon waren Nemuël en Jamin, Jarib, Zerah, Saul.","25":"Sallum was zijn zoon; Mibsam was zijn zoon; Misma was zijn zoon.","26":"De kinderen van Misma waren *dezen*: Hammuël zijn zoon, Zaccur zijn zoon, Simeï zijn zoon.","27":"Simeï nu had zestien zonen en zes dochteren; maar zijn broeders hadden niet veel kinderen; en hun ganse huisgezin werd zo zeer niet vermenigvuldigd, als van de kinderen van Juda.","28":"En zij woonden te Ber-seba, en te Molada, en te Hazar-sual,","29":"En te Bilha, en te Ezem, en te Tholad,","30":"En te Bethuël, en te Horma, en te Ziklag,","31":"En te Beth-markaboth, en te Hazar-susim, en te Beth-biri, en te Saaraim. Dit waren hun steden, totdat David koning werd.","32":"En hun dorpen waren Etam en Ain, Rimmon en Tochen, en Asan; vijf steden.","33":"En al haar dorpen, die in den omloop dezer steden waren, tot Baäl toe. Dit zijn hun woningen en hun geslachtsrekening voor hen.","34":"Doch Mesobab, en Jamlech, en Josa, de zoon van Amazia,","35":"En Joël, en Jehu, de zoon van Jesibja, den zoon van Seraja, den zoon van Asiël,","36":"En Eljoenai, en Jaakoba, en Jesohaja, en Asaja, en Adiël, en Jesimeel, en Benaja,","37":"En Ziza, de zoon van Sifei, den zoon van Allon, den zoon van Jedaja, den zoon van Simri, den zoon van Semaja;","38":"Dezen kwamen tot namen, zijnde vorsten in hun huisgezinnen, en de huisgezinnen hunner vaderen braken uit in menigte.","39":"En zij gingen tot aan den ingang van Gedor tot het oosten des dals, om weide te zoeken voor hun schapen.","40":"En zij vonden vette en goede weide, en een land, wijd van begrip, en stil, en gerust; want die van Cham woonden daar te voren.","41":"Dezen nu, die met namen beschreven zijn, kwamen in de dagen van Hizkia, den koning van Juda, en zij sloegen de tenten en woningen dergenen, die daar gevonden werden; en zij verbanden hen, tot op dezen dag; en zij woonden aan hun plaats, want daar was weide voor hun schapen.","42":"Ook gingen uit hen, *te* *weten* uit de kinderen van Simeon, vijfhonderd mannen, tot het gebergte van Seir; en Pelatja, en Nearja, en Refaja, en Uzziël, de zonen van Isei, waren hun tot hoofden.","43":"En zij sloegen de overigen der ontkomenen onder de Amalekieten, en zij woonden aldaar tot op dezen dag."},"KJV":{"1":"The sons of Judah; Pharez, Hezron, and Carmi, and Hur, and Shobal.","2":"And Reaiah the son of Shobal begat Jahath; and Jahath begat Ahumai, and Lahad. These are the families of the Zorathites.","3":"And these were of the father of Etam; Jezreel, and Ishma, and Idbash: and the name of their sister was Hazelelponi:","4":"And Penuel the father of Gedor, and Ezer the father of Hushah. These are the sons of Hur, the firstborn of Ephratah, the father of Bethlehem.","5":"And Ashur the father of Tekoa had two wives, Helah and Naarah.","6":"And Naarah bare him Ahuzam, and Hepher, and Temeni, and Haahashtari. These were the sons of Naarah.","7":"And the sons of Helah were, Zereth, and Jezoar, and Ethnan.","8":"And Coz begat Anub, and Zobebah, and the families of Aharhel the son of Harum.","9":"And Jabez was more honourable than his brethren: and his mother called his name Jabez, saying, Because I bare him with sorrow.","10":"And Jabez called on the God of Israel, saying, Oh that thou wouldest bless me indeed, and enlarge my coast, and that thine hand might be with me, and that thou wouldest keep me from evil, that it may not grieve me! And God granted him that which he requested.","11":"And Chelub the brother of Shuah begat Mehir, which was the father of Eshton.","12":"And Eshton begat Bethrapha, and Paseah, and Tehinnah the father of Irnahash. These are the men of Rechah.","13":"And the sons of Kenaz; Othniel, and Seraiah: and the sons of Othniel; Hathath.","14":"And Meonothai begat Ophrah: and Seraiah begat Joab, the father of the valley of Charashim; for they were craftsmen.","15":"And the sons of Caleb the son of Jephunneh; Iru, Elah, and Naam: and the sons of Elah, even Kenaz.","16":"And the sons of Jehaleleel; Ziph, and Ziphah, Tiria, and Asareel.","17":"And the sons of Ezra were, Jether, and Mered, and Epher, and Jalon: and she bare Miriam, and Shammai, and Ishbah the father of Eshtemoa.","18":"And his wife Jehudijah bare Jered the father of Gedor, and Heber the father of Socho, and Jekuthiel the father of Zanoah. And these are the sons of Bithiah the daughter of Pharaoh, which Mered took.","19":"And the sons of his wife Hodiah the sister of Naham, the father of Keilah the Garmite, and Eshtemoa the Maachathite.","20":"And the sons of Shimon were, Amnon, and Rinnah, Benhanan, and Tilon. And the sons of Ishi were, Zoheth, and Benzoheth.","21":"The sons of Shelah the son of Judah were, Er the father of Lecah, and Laadah the father of Mareshah, and the families of the house of them that wrought fine linen, of the house of Ashbea,","22":"And Jokim, and the men of Chozeba, and Joash, and Saraph, who had the dominion in Moab, and Jashubilehem. And these are ancient things.","23":"These were the potters, and those that dwelt among plants and hedges: there they dwelt with the king for his work.","24":"The sons of Simeon were, Nemuel, and Jamin, Jarib, Zerah, and Shaul:","25":"Shallum his son, Mibsam his son, Mishma his son.","26":"And the sons of Mishma; Hamuel his son, Zacchur his son, Shimei his son.","27":"And Shimei had sixteen sons and six daughters; but his brethren had not many children, neither did all their family multiply, like to the children of Judah.","28":"And they dwelt at Beersheba, and Moladah, and Hazarshual,","29":"And at Bilhah, and at Ezem, and at Tolad,","30":"And at Bethuel, and at Hormah, and at Ziklag,","31":"And at Bethmarcaboth, and Hazarsusim, and at Bethbirei, and at Shaaraim. These were their cities unto the reign of David.","32":"And their villages were, Etam, and Ain, Rimmon, and Tochen, and Ashan, five cities:","33":"And all their villages that were round about the same cities, unto Baal. These were their habitations, and their genealogy.","34":"And Meshobab, and Jamlech, and Joshah the son of Amaziah,","35":"And Joel, and Jehu the son of Josibiah, the son of Seraiah, the son of Asiel,","36":"And Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah,","37":"And Ziza the son of Shiphi, the son of Allon, the son of Jedaiah, the son of Shimri, the son of Shemaiah;","38":"These mentioned by their names were princes in their families: and the house of their fathers increased greatly.","39":"And they went to the entrance of Gedor, even unto the east side of the valley, to seek pasture for their flocks.","40":"And they found fat pasture and good, and the land was /span> of their <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> was <span class=\"wl wl-kjv\" data-code=\"H6753\">Hazelelponi:</span>","4":"And <span class=\"wl wl-kjv\" data-code=\"H6439\">Penuel</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H1446\">Gedor,</span> and <span class=\"wl wl-kjv\" data-code=\"H5829\">Ezer</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H2364\">Hushah.</span> These are the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2354\">Hur,</span> the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of <span class=\"wl wl-kjv\" data-code=\"H672\">Ephratah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem.</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H806\">Ashur</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H8620\">Tekoa</span> had <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> <span class=\"wl wl-kjv\" data-code=\"H2458\">Helah</span> and <span class=\"wl wl-kjv\" data-code=\"H5292\">Naarah.</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H5292\">Naarah</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> him <span class=\"wl wl-kjv\" data-code=\"H275\">Ahuzam,</span> and <span class=\"wl wl-kjv\" data-code=\"H2660\">Hepher,</span> and <span class=\"wl wl-kjv\" data-code=\"H8488\">Temeni,</span> and <span class=\"wl wl-kjv\" data-code=\"H326\">Haahashtari.</span> These were the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H5292\">Naarah.</span>","7":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2458 l-kjv\" data-code=\"H3212\">went</span> to the <span class=\"wl wl-kjv\" data-code=\"H3996\">entrance</span> of <span class=\"wl wl-kjv\" data-code=\"H1446\">Gedor,</span> even unto the east <span class=\"wl wl-kjv\" data-code=\"H4217\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley,</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> <span class=\"wl wl-kjv\" data-code=\"H4829\">pasture</span> for their <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks.</span>","40":"And they <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H8082\">fat</span> <span class=\"wl wl-kjv\" data-code=\"H4829\">pasture</span> and <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> was <span class=\"wl wl-kjv\" data-code=\"H7342\">wide,</span> and <span class=\"wl wl-kjv\" data-code=\"H8252\">quiet,</span> and <span class=\"wl wl-kjv\" data-code=\"H7961\">peaceable;</span> for they of <span class=\"wl wl-kjv\" data-code=\"H2526\">Ham</span> had <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> there of <span class=\"wl wl-kjv\" data-code=\"H6440\">old.</span>","41":"And these <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> by <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> their <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4583\">habitations</span> that were <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> there, and <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed</span> them utterly unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in their rooms: because there was <span class=\"wl wl-kjv\" data-code=\"H4829\">pasture</span> there for their <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks.</span>","42":"And some of them, even of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H8095\">Simeon,</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> having for their <span class=\"wl wl-kjv\" data-code=\"H7218\">captains</span> <span class=\"wl wl-kjv\" data-code=\"H6410\">Pelatiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5294\">Neariah,</span> and <span class=\"wl wl-kjv\" data-code=\"H7509\">Rephaiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5816\">Uzziel,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3469\">Ishi.</span>","43":"And they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H7611\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalekites</span> that were <span class=\"wl wl-kjv\" data-code=\"H6413\">escaped,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> there unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Perez,","tekst":"Perez is, eigenlijk te spreken, de zoon van Juda geweest, maar die na hem hier genoemd zijn, zijn uit Perez gesproten."},{"catchword":"Charmi,","tekst":"Hij wordt Chelubai genoemd, 1Ch 2:9 , en ook Kaleb, 1Ch 2:18 ."},{"catchword":"Hur,","tekst":"Hur is Sobals grootvader geweest, boven, 1Ch 2:50 , zodat Kaleb, de zoon van Hur, hier wordt uitgelaten."}],"2":[{"catchword":"Reája,","tekst":"Hij wordt Haroë genaamd, een zoon Sobals, 1Ch 2:52 ."},{"catchword":"Zorathieten;","tekst":"Dezen hebben gewoond te Zora, gelegen in den stam van Juda; Jos 15:33 ."}],"3":[{"catchword":"Etam","tekst":"Dat is, die te Etam gewoond heeft. Zie 2Ch 11:6 ."}],"4":[{"catchword":"Pnuël","tekst":"1Ch 2:51 wordt hij Haref genoemd."},{"catchword":"Husah","tekst":"Hij wordt vs.11, door een verzetting der letters, Suha genoemd."},{"catchword":"Hur,","tekst":"Is te weten, dat deze Hur maar ten dele vader van de Bethlemieten geweest is, want dit wordt ook aan Salma toegeschreven, 1Ch 2:51 , 1Ch 2:54 . Zie de aantekening aldaar."},{"catchword":"Efratha,","tekst":"Zie 1Ch 2:19 ."}],"5":[{"catchword":"Asschur nu,","tekst":"Hij is geboren na Hezrons zijns vaders dood. Zie 1Ch 2:24 ."}],"7":[{"catchword":"*","tekst":"Versta hierbij: En Koz, [uit vs.8] die een zoon van Hela was. Of men kan het begin van vs.8 aldus overzetten, en Koz, [die] gewon Anub. Zie gelijke verzetting 1Ch 2:47 , en hieronder, vs.14."}],"9":[{"catchword":"Jabez","tekst":"Hij is een van de voornaamsten, van welken de geslachten Aharhels gekomen zijn, waar vs.8 van staat."},{"catchword":"ik heb hem","tekst":"Jabez, omgekeerd uit Jazeb, wordt vertaald, een smartenmaker."}],"10":[{"catchword":"Want Jabez","tekst":"Dit wordt hier bijgevoegd om te kennen te geven waarom Jabez heerlijker en treffelijker was geworden dan zijn broeders, namelijk, omdat hij door het gebed tot God den zegen Gods overvloediger over zijn huis gekregen had."},{"catchword":"rijkelijk","tekst":"Hebreeuws, zegenende mij zegent. Dit is een afgekorte en onvolmaakte manier van spreken, waarin de belofte verzwegen wordt, die deze man Gode gedaan heeft, zo hij de zegening verwierf, waar hij God om bad; gelijk de Hebreën in het eedzweren de straf verzwijgen, die zij zichzelven toewensen zo zij valselijk zweren; alzo verzwijgen zij somtijds de beloften in hun wensen. Gen 28:20-22 staat het in zijn geheel."}],"11":[{"catchword":"Suha,","tekst":"vs.4"}],"12":[{"catchword":"den vader van","tekst":"Anders, de vader der stad Nahas."}],"13":[{"catchword":"Kenaz","tekst":"Hij was de vader van Jefunne, wiens zoon was Kaleb, die daarom ook een Keniziet genoemd wordt; Num 32:12 ."},{"catchword":"*","tekst":"Versta hierbij: en Meonothai [uit vs.14], welke naam in het Hebreeuws niet staat, maar hij moet er noodzakelijk bij verstaan worden."}],"14":[{"catchword":"vader des dals","tekst":"Dat is, overste dergenen, die in het dal der werkmeesters woonden. Zie boven, 1Ch 2:21 ; dit dal is gelegen aan de landpalen van Juda en Benjamin, zodat het tweeherig was, Neh 11:35 ."},{"catchword":"werkmeesters;","tekst":"Of, der smeden. Eenigen zetten het over ambachtslieden, of handwerklieden, gelijk Neh 11:35 ."},{"catchword":"zij","tekst":"Te weten, de nakomelingen van Joab."},{"catchword":"waren werkmeesters","tekst":"De zin dezer woorden is: Daarom is dit dal genoemd geworden het dal der timmerlieden, omdat diegenen, die dat bewoonden, timmerlieden waren."}],"15":[{"catchword":"kinderen van Kaleb","tekst":"Zie Num 32:12 ."},{"catchword":"weten Kenaz","tekst":"Anders, Ukenaz."}],"17":[{"catchword":"zij baarde","tekst":"Te weten, Bitja, Farao's dochter, Mereds vrouw. Zie vs.18."}],"18":[{"catchword":"Joodse huisvrouw","tekst":"Deze wordt aldus onderscheiden van Mereds andere huisvrouw, namelijk, van Bitja, die vreemd was, zijnde een dochter van Farao uit Egypte. Eenigen menen dat dit, te weten, Jehudijah, dat is Joodse of jodin, haar eigen naam geweest is; of immers Hodijah, gelijk zij vs.19 genoemd wordt, hetwelk ook een Jodin betekent. Anderen menen dat Hodijah een derde vrouw van Mereb is geweest, en dat hij alzo drieërlei kinderen heeft gehad."},{"catchword":"dezen zijn","tekst":"Te weten, die vs.17 genoemd staan."}],"19":[{"catchword":"huisvrouw Hodija,","tekst":"Anders, de Joodse."}],"20":[{"catchword":"Tilon;","tekst":"Anders, Tulon."}],"21":[{"catchword":"linnenwerkers","tekst":"Dat is, dergenen, die daar arbeiden in kostelijk fijn lijnwaad, dat men van fijn Egyptisch vlas maakte. Dit vlas was zo fijn als zijde, en daarom vertalen enigen hier, handwerkers in zijde, of zijdewerkers."}],"22":[{"catchword":"Chozeba,","tekst":"Deze stad wordt Chezib genoemd, Gen 38:5 . Zie de aantekening aldaar."},{"catchword":"die over de Moabieten","tekst":"Dat is, die in des konings plaats over de Moabieten geheerst hebben."},{"catchword":"doch deze dingen","tekst":"Alsof hij zeide: Het is onnodig veel van deze dingen te zeggen of te schrijven, want ofschoon wel velen van dezen in hun tijd treffelijke mannen geweest zijn, zo zijn hun nakomelingen zulke slechte en kleinhartige personen geweest, dat zij liever pottenbakkers, hoveniers, enz. geworden zijn, dan dat zij, in hun land wederkerende, hun vaderlijke vrijheid zouden behouden hebben, gelijk vs.23 verhaald wordt."}],"23":[{"catchword":"tuinen;","tekst":"Of, heggen, heiningen."},{"catchword":"bij den koning","tekst":"Sommigen verstaan hier den koning der Moabieten, uit vs.22; anderen den koning van Babylonië, in dit verstand, dat de nakomelingen van Sela liever in Babylonië zijn gebleven dienende, dan dat zij tehuis komende hun vrijheid zouden genoten hebben; en daaruit besluiten die, dat dit boek van Ezra geschreven is na de Babylonische gevangenis. Anderen verstaan hier door het woord koning, den koning van Juda, welken de nakomelingen van Selah dien dienst zouden gedaan hebben, dat zij de hoven der koningen van Juda en hun tuinbouw hebben waargenomen en verzorgd."},{"catchword":"in zijn werk","tekst":"Te weten, in het beplanten zijner hoven."}],"24":[{"catchword":"Nemuël en Jamin,","tekst":"Anders, Jemuel."},{"catchword":"Jarib,","tekst":"Anders, Jakin."},{"catchword":"Zerah,","tekst":"Anders, Tsohar. Zie van deze drie Gen 46:10 ."}],"25":[{"catchword":"Mibsam","tekst":"Zie Gen 25:13 ."}],"27":[{"catchword":"zo zeer","tekst":"Hebreeuws, niet vermenigvuldigd tot de kinderen van Juda toe."}],"28":[{"catchword":"zij woonden","tekst":"Zie Jos 19:2 , waar deze steden ook genoemd staan, alhoewel in de namen derzelver wat verandering valt."}],"31":[{"catchword":"totdat David","tekst":"Anders, zolang als David regeerde. Versta dit alzo, te weten, zolang als David en zijn nakomelingen regeerden, en het koninkrijk Juda nog stond, namelijk tot de Babylonische wegvoering; maar als dat is verstoord geworden, zo zijn ook de nakomelingen van Simeon [die in den stam van Juda woonden] uit hun woningen verstoord en verdreven."}],"32":[{"catchword":"steden","tekst":"Te weten, onbemuurde. Anders kan men het voorgaande dus nemen: En benevens haar dorpen waren Etham en, enz. vijf steden."}],"38":[{"catchword":"Dezen","tekst":"Te weten, die vanaf vs.34 af tot vs.38 genoemd staan."},{"catchword":"kwamen tot namen,","tekst":"Dat is, zij zijn vermaarde mannen geworden."},{"catchword":"huisgezinnen hunner vaderen","tekst":"Dat is, zij werden grotelijks vermenigvuldigd."}],"39":[{"catchword":"Gedor","tekst":"Anders, Gedera, of, Giderothaïm; Jos 15:36 ."},{"catchword":"des dals,","tekst":"Versta hier, dat dal, hetwelk van Efes Dammin reikte tot Ekron toe; gelijk af te nemen is uit 1Sa 17:1 , 1Sa 17:52 ."}],"40":[{"catchword":"wijd van begrip,","tekst":"Hebreeuws, wijd van handen."},{"catchword":"die van Cham","tekst":"Dit woord hier bij gezet, om te tonen dat de Israëlieten recht en reden hadden deze steden in te nemen en de oude inwoners daaruit te drijven, te weten, omdat de nakomelingen van den vervloekten Cham die hadden ingenomen. Zie van Cham Gen 9:25 ."}],"41":[{"catchword":"dergenen","tekst":"Te weten, der Chamieten tenten, en versta hier de inwoners der tenten en der woningen."},{"catchword":"verbanden hen,","tekst":"Dat is, zij roeiden hen uit, als hetgeen dat van God verbannen is."},{"catchword":"tot op dezen dag;","tekst":"Te weten, in welken dit beschreven is; versta, tot de tijden van Ezra, die dit boek beschreven heeft, omtrent welken tijd het rijk van David en zijn nakomelingen een einde genomen heeft. Zie de aantekening boven, vs.31."}],"43":[{"catchword":"de overigen","tekst":"Te weten, die, die overgebleven en ontslopen waren, toen hen Saul uitroeide, 1Sa 14:48 . En die daarna ook Davids handen ontkomen waren, 2Sa 8:12 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The children of Juda were Perez, [Perez (to speak properly) was the son of Juda, but those that are named here after him, sprung from Perez] Hezron, and Charmi, [he is called Chelubai, chap.2.9. and also Caleb, chap.2.v.18.] and Hur, and Sobal. [Hur was Sobals grand-father, above chap.2.50. so that Caleb the son of Hur is here left out.]"}],"2":[{"catchword":null,"tekst":"And Reaja the son of Sabal [This Reaja is called Haroe a son of Sabal, chap.2.vers.52.] begat Johath, and Johath begat Ahamai, and Lahad: These are the household of the Zoathites; [these dwelt at Zora, lying in the tribe of Judsa, Jos.15.33.]"}],"3":[{"catchword":null,"tekst":"And these are of the Father of Etam: [i.e. which dwelt at Etam. See 2 Chron.11.6.] Jizreel, and Isma, and Jobas, and their sisters name was Hazelelponi."}],"4":[{"catchword":null,"tekst":"And Pnuel [Chap.2.v.51. he is called Hareph] was the father of Gedor, and Eser the Father of Husah: [v.11. by a transposition of the letters he is called Suha] these are the children of Hur the first-born of Ephrata [see 1 Chron.2.v.9.] the Father of Bethlehem. [it is to be noted that this Hur was but in part the Father of Bethlehem, for this is also ascribed unto Salomon, 1 Chron.2.51. and 5.4. See the annotate there.]"}],"5":[{"catchword":null,"tekst":"Now Asschur [He was born after his Father Hezrons death. See chap.2.v.24.] the Father of tekoa had two wives, Hela and Naara."}],"6":[{"catchword":null,"tekst":"And Naara bare him Ahuzzam, and Hepher, and Teneni, and Haahastari; These are the children of Naara."}],"7":[{"catchword":null,"tekst":"And the children of Hela were Zereth, Jozohar, and Ethnam. [Understand withal; and Roz, (out of the following verse) who was a son of Hela, or the beginning of the 8.verse may be thus translated, and Roz (who) begat Anub. See the like transposition above chap.2.47. and here below v.14.]"}],"8":[{"catchword":null,"tekst":"And Roz begat Anub, and Hazobeba, and the households of Aharhel the son of Harum."}],"9":[{"catchword":null,"tekst":"Now Jahez was more honorable then his brethren: [He was one of the chiefest, of whom the families of Aharmel came, whereof mentioned is made v.8.] and his mother had called his name Jahez, saying; For I bare him with sorrow. [Jabez converted or turned out of Jazeb, signifieth a maker, or causer of sorrow.]"}],"10":[{"catchword":null,"tekst":"For Jabez called on the God of Israel, saying; if thou shalt richly bless me, [Hebr. blessing bless me] and enlarge my border, and thine hand shall be with me, and (shalt) (so) deal with the evil, that it may not grieve me: [this is an imperfect phrase or manner of speaking , wherein the promise is concealed ,which this man made unto God, if he should obtain the blessing, which he had craved of God. As the Hebrews in swearing do usually conceal the punishment, which they do imprecate or wish unto themselves, if they do swear falsely; so do they sometimes conceal the promise in their wishes, and desires, or prayers. In Gen.28.vers.20.21,22. Its set down fully, namely, both the prayer, and the promise] And God caused (the thing) to come to pass, which he desired. [that which is recorded in this verse, is added as by a reason, to shew why Jabez was become more honorable and more excellent the his brethren, namely, because he by his prayer unto God, had obtained the blessing of God in a more abundant manner upon his house.]"}],"11":[{"catchword":null,"tekst":"And Chelub the father of Suba [Called vers.4. Husa] begat Nechir, he is the Father of Eston."}],"12":[{"catchword":null,"tekst":"Now Eston begat Bethrapha, and Pasea, and Tehima, the Father of Ir-Nahas: [Oth. The Father of the city of Nahas] These are the men of Kecha."}],"13":[{"catchword":null,"tekst":"And the children of Kenaz [He was the Father of Jephunne, whose son was Caleb, who is therefore also called a Kenezite, Num 32:12.] were Othiel, and Seraja: And the children of Othiel, Hathath: [Understand withal: and Meonothai (out of the following verse) which name is not set down in the Hebrew but it must of necessity be also understood.]"}],"14":[{"catchword":null,"tekst":"And Meonothai begat Ophra: And Seraja begat vernor of those that dwelt in the valley of craftmen: See above chap.2.on v.21. This valley lyeth by the border of Juda and Benjamin, so that it is under two jurisdictions, Nehem.11.25. The valley of Craftmen, or smiths. Some translate it tradesmen, or, Handicraftmen, as Nehem.11.35.] for they [to wit, Joabs posterity] were craftsmen, [the meaning of these words is, therefore was this valley called the valley of trademen, because they that inhabited the same were craftmen or carpenters.]"}],"15":[{"catchword":null,"tekst":"Now the children of Caleb the son of Jephunne [See Num 32:12.] were Iru, Ela, and Naami; and the children of Ela, to wit, Kenaz. [oth. Ukenaz.]"}],"16":[{"catchword":null,"tekst":"And the children of Jehalelel were Ziph, and Zipha, Thirea, and Asareel."}],"17":[{"catchword":null,"tekst":"And the children of Ezra were Jether, and Mered; and Zepher, and Jalon: And she [To wit, Bitja, Pharaos daughter, Mereds wife. See v.18.] bare Mirjam, and Sammai, and Isbah, the Father of Estemoa."}],"18":[{"catchword":null,"tekst":"And his jewish wife [This woman is thus distinguished from Mereds other wise, namely, from Bithja, who was an alien, being a daughter of Pharao out of Egypt. Some conceive that this, to wit, Jehudijah, that is, Jewish (woman) was a proper name: Or, at least Hodijah, as she is called ver.19. which also signifieth Jewels. Others are of opinion that Hodija was Mereds third wife, and that consequently he had three sorts of children] bare Jered the Father of Gedor, and Heber the father of Socho, and Jekuthiel the Father of Zanoah: And those [to wit, that are mentioned v.17. are the children of Bitja the daughter of Pharaoh, which Mered had taken (to wife)."}],"19":[{"catchword":null,"tekst":"And the children of (his) wife Hodijah, [Oth. The Jewish (woman), or, Jewess] the sister of Naham, were Abikehila the Garmite, and Estemoa the Maachathite."}],"20":[{"catchword":null,"tekst":"Now the children of Simeon were Amnon, and Rinna, Ben-Hanan, and Tilon: [Oth. Tulon] and the children of Isei were Zoheth, and Ben Zoheth."}],"21":[{"catchword":null,"tekst":"The children of Selah the son of Juda were Er, the Father of Lecha, and Lada the Father of Lecha, and Lada the father of Maresa: And the families of the house of the linen-workers [i.e. of those that wrought in costly fine linen, which is made fine Egyptians flax. This flax was as fine as silk, and therefore some do render it handicraftsmen in silk, or, silk-workers] in the house of Asbea."}],"22":[{"catchword":null,"tekst":"Besides, Jokim, and the men of Cozeba, [This city is called Chezib, Gen 38:5. See the annot. There] and Joas, and Saraph, (who had dominion over the Moabites) [that is, who in the Kings stead had dominion over the Moabites] and Jasubi-Lehem. But these things are old. [as if he had said, its superfluous to speak or write much of these, for although many of these in their time were men of note, yet their posterity were such base and low spirited persons, that they had rather be potters, gardeners, &c. then that returning to their own land, they should have kept their ancient and fatherly freedom, as v.23. is related.]"}],"23":[{"catchword":null,"tekst":"These were potters dwelling by plants and hedges: [Or, paled fences] There they abode with the King, [some understand here the King of the Moabites, from v.22. Others the King of Babylon, in this sense, that the posterity of Selah had rather to tarry in Babylon, and to be servants there, then to return home to their own country, and there to enjoy their ancient liberty, and from thence they conclude that this Book was written by Ezra, after the Babylon captivity. Others understand here by the word king, the king of Juda, unto whom Selah&acirc;&euro;&trade;s posterity performed that service, that they kept and took care of the gardens and plantation s of the Kings of Juda] in his work. [to wit, in the planting of, and looking to his gardens.]"}],"24":[{"catchword":null,"tekst":"The Children of Jamin, Jerib, [otherwise called Jakin] Zerah, [otherwise called Tsohar] Saul. [see of the three last, Gen 46:10.]"}],"25":[{"catchword":null,"tekst":"Sallum was his son, Mibsam [See Gen 25:13.] was his son, Misma was his son."}],"26":[{"catchword":null,"tekst":"The children of Misma were (these) Hammuel his son, Zacchur his son, Simei his son."}],"27":[{"catchword":null,"tekst":"Now Simei had sixteen sons, and six daughters, but his brethren had not many children: And their whole family was not so much increased, as (the family) of the house Juda (was). [Hebr. not increased to the children of Juda.]"}],"28":[{"catchword":null,"tekst":"And they dwelt at Ber-Seba, and at Molada, and at Hazra-Saul. [See Jos.19.2, &c. where these cities mentioned in this and the following verses are likewise rehearsed, though with some alteration in the names of them.]"}],"29":[{"catchword":null,"tekst":"And at Bilha, and at Ezem, and at Tholad."}],"30":[{"catchword":null,"tekst":"And at Bethuel, and at Horma, and at Ziglag."}],"31":[{"catchword":null,"tekst":"And at Beth-Marboth, and at Hazar-Susim, and at Bethbiri, and at Saaraim: These were their cities, the David became king. [Oth. As long as David reigned. Understand this thus, to wit, as long as David and his posterity reigned, and the kingdom of Juda yet stood, namely, unto the Babylonish Captivity, but when that was disturbed, then were the posterity of Salomon (that dwelt in the tribe of Juda) likewise disturbed and cast out of their dwellings.]"}],"32":[{"catchword":null,"tekst":"And their villages were Etam, and Ain, Rimmon, and Tochen, and Asan, five cities: [For wit unwalled. Otherwise that which goeth before may be thus Taken: And besides their villages were Etham, etc. five cities.]"}],"33":[{"catchword":null,"tekst":"And all the villages that were in the circumference of these cities unto Baal: These are their habitations, and their genealogy for them."}],"34":[{"catchword":null,"tekst":"But Mesobab, and Janlech, and Josa, the son of Amazia."}],"35":[{"catchword":null,"tekst":"And Joel, and Jehu the son of Jesibja, the son of Seraja, the son of Asiel."}],"36":[{"catchword":null,"tekst":"And Eljoenai, and Jaacoba, and Isohaja, and Asaja, and Adiel, and Jesimeel, and Benaja."}],"37":[{"catchword":null,"tekst":"And Ziza the son of Ziphi, the son of Allon, the son of Jejada, the son of Zimri, the son of Semaja."}],"38":[{"catchword":null,"tekst":"These [To wit, that are named from v.34. hitherto] came to names, [i.e. they came to be men of note] being Princes in their families, and the families of their Fathers brake forth in multitude. [i.e. they were greatly increased or multiplied.]"}],"39":[{"catchword":null,"tekst":"And they went to the entrance of Gedor [Otherwise called Gedera, or, Giderothaim, Judg.15.36.] to the East-(side) of the valley, [understand here that valley which reached from Ephes-Dammim unto Ekron, as appeareth by 1 Sam.17.1. and 52.] to seek pasture for their sheep."}],"40":[{"catchword":null,"tekst":"And they found fat and good pasture, and a land wide in compass, [Heb. wide in hands] and still, and quiet; for those of Cham dwelt there in former time. [this is here added, to shew that the Israelites had just cause to take these cities, and to drive out thence the ancient inhabitants, to wit, because the posterity of cursed Cham had th (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
