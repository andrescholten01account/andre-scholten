":"Zacharia","href":"../../zacharia/1/"},{"naam":"Maleachi","href":"../../maleachi/1/"},{"naam":"Mattheüs","href":"../../mattheus/1/"},{"naam":"Markus","href":"../../markus/1/"},{"naam":"Lukas","href":"../../lukas/1/"},{"naam":"Johannes","href":"../../johannes/1/"},{"naam":"Handelingen","href":"../../handelingen/1/"},{"naam":"Romeinen","href":"../../romeinen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}]},"vertalingen":{"SVnu":{"1":"Dit zijn de kinderen van Israël: Ruben, Simeon, Levi en Juda, Issaschar en Zebulon,","2":"Dan, Jozef en Benjamin, Nafthali, Gad en Aser.","3":"De kinderen van Juda zijn: Er, en Onan, en Sela; drie zijn hem geboren van de dochter van Sua, de Kanaänietische; en Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde Hij hem.","4":"Maar Thamar, zijn schoondochter, baarde hem Perez en Zerah. Al de zonen van Juda waren vijf.","5":"De kinderen van Perez waren Hezron en Hamul.","6":"En de kinderen van Zerah waren Zimri, en Ethan, en Heman, en Chalcol, en Dara. Deze allen zijn vijf.","7":"En de kinderen van Charmi waren Achan, de beroerder van Israël, die zich aan het verbannene* vergreep.","8":"De kinderen van Ethan nu waren Azaria.","9":"En de kinderen van Hezron, die hem geboren zijn, waren Jerahmeel, en Ram, en Chelubai.","10":"Ram nu verwekte Amminadab, en Amminadab verwekte Nahesson, de vorst van de kinderen van Juda;","11":"En Nahesson verwekte Salma, en Salma verwekte Boaz,","12":"En Boaz verwekte Obed, en Obed verwekte Isaï,","13":"En Isaï verwekte Eliab, zijn eerstgeborene, en Abinadab, de tweede, en Simea, de derde,","14":"Nethaneel, de vierde, Raddai, de vijfde,","15":"Ozem, de zesde, David, de zevende.","16":"En hun zusters waren Zeruja en Abigaïl. De kinderen nu van Zeruja waren Abisai, en Joab, en Asa-el; drie.","17":"En Abigaïl baarde Amasa; en de vader van Amasa was Jether, een Ismaëliet.","18":"Kaleb nu, de zoon van Hezron, verwekte kinderen bij Azuba, *zijn* vrouw, en bij Jerioth. En de zonen van deze zijn: Jeser, en Sobab, en Ardon.","19":"Toen Azuba gestorven was, nam Kaleb voor zich Efrath, die baarde hem Hur.","20":"En Hur verwekte Uri, en Uri verwekte Bezaleël.","21":"Daarna ging Hezron naar de dochter van Machir, de vader van Gilead, en hij nam haar, toen hij zestig jaar oud was; en zij baarde hem Segub.","22":"Segub nu verwekte Jaïr; en hij had drieëntwintig steden in het land van Gilead.","23":"En hij nam Gesur en Aram, met de vlekken van Jaïr, van hen, met Kenath en haar onderhorige plaatsen, zestig steden. Deze allen zijn zonen van Machir, de vader van Gilead.","24":"En na de dood van Hezron, in Kaleb-efratha, heeft Abia, Hezrons huisvrouw, hem ook Asschur gebaard, de vader van Thekoa.","25":"De kinderen van Jerahmeel nu, de eerstgeborene van Hezron, waren *deze*: de eerstgeborene was Ram, daartoe Buna, en Oren, en Ozem *en* Ahia.","26":"Jerahmeel had nog een andere vrouw, wier naam was Atara; zij was de moeder van Onam.","27":"En de kinderen van Ram, de eerstgeborene van Jerahmeel, waren Maaz, en Jamin, en Eker.","28":"En de kinderen van Onam waren Sammai en Jada. En de kinderen van Sammai: Nadab en Abisur.","29":"De naam nu van de huisvrouw van Abisur was Abihaïl: die baarde hem Achban en Molid.","30":"En de kinderen van Nadab waren Seled en Appaïm; en Seled stierf zonder kinderen.","31":"En de kinderen van Appaïm waren Jisei; en de kinderen van Jisei waren Sesan; en de kinderen van Sesan, Achlai.","32":"En de kinderen van Jada, de broer van Sammai, waren Jether en Jonathan; en Jether is gestorven zonder kinderen.","33":"De kinderen van Jonathan nu waren Peleth en Zaza. Dit waren de kinderen van Jerahmeel.","34":"En Sesan had geen zonen, maar dochters. En Sesan had een Egyptische knecht, wiens naam was Jarha.","35":"Sesan nu gaf zijn dochter aan zijn knecht Jarha tot vrouw; en zij baarde hem Attai.","36":"Attai nu verwekte Nathan, en Nathan verwekte Zabad,","37":"En Zabad verwekte Eflal, en Eflal verwekte Obed,","38":"En Obed verwekte Jehu, en Jehu verwekte Azaria,","39":"En Azaria verwekte Helez, en Helez verwekte Elasa,","40":"En Elasa verwekte Sismai, en Sismai verwekte Sallum,","41":"En Sallum verwekte Jekamja, en Jekamja verwekte Elisama.","42":"De kinderen van Kaleb nu, de broer van Jerahmeel, zijn Mesa, zijn eerstgeborene (die is de vader van Zif), en de kinderen van Maresa, de vader van Hebron.","43":"De kinderen van Hebron nu waren Korah, en Tappuah, en Rekem, en Sema.","44":"Sema nu verwekte Raham, de vader van Jorkeam, en Rekem verwekte Sammai.","45":"De kinderen van Sammai nu waren Maon; en Maon was de vader van Beth-zur.","46":"En Efa, het bijwijf van Kaleb, baarde Haran, en Moza, en Gazez; en Haran verwekte Gazez.","47":"De kinderen van Jochdai nu waren Regem, en Jotham, en Gesan, en Pelet, en Efa, en Saaf.","48":"Uit het bijwijf Maächa verwekte Kaleb: Seber en Tirhana.","49":"En *de huisvrouw* van Saaf, de vader van Madmanna, baarde Seva, de vader van Machbena, en de vader van Gibea; en de dochter van Kaleb was Achsa.","50":"Dit waren de kinderen van Kaleb, de zoon van Hur, de eerstgeborene van Efratha: Sobal, de vader van Kirjath-jearim;","51":"Salma, de vader van de Bethlehemieten; Haref, de vader van Beth-gader.","52":"De kinderen van Sobal, de vader van Kirjath-jearim, waren Haroe *en* Hazihammenuchoth.","53":"En de geslachten van Kirjath-jearim waren de Jithrieten, en de Futhieten, en de Sumathieten, en de Misraieten; van dezen zijn uitgegaan de Zoraieten en de Esthaolieten.","54":"De kinderen van Salma waren de Bethlehemieten, en de Netofathieten, Atroth, Beth-joab, en de helft van de Manathieten, *en* de Zorieten.","55":"En de huisgezinnen van de schrijvers, die te Jabes woonden, de Tirathieten, de Simeathieten, de Suchathieten; dezen zijn de Kenieten, die gekomen zijn van Hammath, de vader van het huis van Rechab."},"SV":{"1":"Dezen zijn de kinderen van Israël: Ruben, Simeon, Levi en Juda, Issaschar en Zebulon,","2":"Dan, Jozef en Benjamin, Nafthali, Gad en Aser.","3":"De kinderen van Juda zijn: Er, en Onan, en Sela; drie zijn er hem geboren van de dochter van Sua, de Kanaänietische; en Er, de eerstgeborene van Juda, was kwaad in de ogen des HEEREN; daarom doodde Hij hem.","4":"Maar Thamar, zijn schoondochter, baarde hem Perez en Zerah. Al de zonen van Juda waren vijf.","5":"De kinderen van Perez waren Hezron en Hamul.","6":"En de kinderen van Zerah waren Zimri, en Ethan, en Heman, en Chalcol, en Dara. Deze allen zijn vijf.","7":"En de kinderen van Charmi waren Achan, de beroerder van Israël, die zich aan het verbannene vergreep.","8":"De kinderen van Ethan nu waren Azaria.","9":"En de kinderen van Hezron, die hem geboren zijn, waren Jerahmeel, en Ram, en Chelubai.","10":"Ram nu gewon Amminadab, en Amminadab gewon Nahesson, den vorst der kinderen van Juda;","11":"En Nahesson gewon Salma, en Salma gewon Boaz,","12":"En Boaz gewon Obed, en Obed gewon Isaï,","13":"En Isaï gewon Eliab, zijn eerstgeborene, en Abinadab, den tweede, en Simea, den derde,","14":"Nethaneel, den vierde, Raddai, den vijfde,","15":"Ozem, den zesde, David, den zevende.","16":"En hun zusters waren Zeruja en Abigaïl. De kinderen nu van Zeruja waren Abisai, en Joab, en Asa-el; drie.","17":"En Abigaïl baarde Amasa; en de vader van Amasa was Jether, een Ismaëliet.","18":"Kaleb nu, de zoon van Hezron, gewon kinderen uit Azuba, *zijn* vrouw, en uit Jerioth. En de zonen van deze zijn: Jeser, en Sobab, en Ardon.","19":"Als nu Azuba gestorven was, zo nam zich Kaleb Efrath, die baarde hem Hur.","20":"En Hur gewon Uri, en Uri gewon Bezaleël.","21":"Daarna ging Hezron in tot de dochter van Machir, den vader van Gilead, en hij nam ze, toen hij zestig jaren oud was; en zij baarde hem Segub.","22":"Segub nu gewon Jaïr; en hij had drie en twintig steden in het land van Gilead.","23":"En hij nam Gesur en Aram, met de vlekken van Jaïr, van dezelve, met Kenath en haar onderhorige plaatsen, zestig steden. Deze allen zijn zonen van Machir, den vader van Gilead.","24":"En na den dood van Hezron, in Kaleb-efratha, heeft Abia, Hezrons huisvrouw, hem ook gebaard Asschur, de vader van Thekoa.","25":"De kinderen van Jerahmeel nu, den eerstgeborene van Hezron, waren *deze*: de eerstgeborene was Ram, daartoe Buna, en Oren, en Ozem *en* Ahia.","26":"Jerahmeel had nog een andere vrouw, welker naam was Atara; zij was de moeder van Onam.","27":"En de kinderen van Ram, den eerstgeborene van Jerahmeel waren Maaz, en Jamin, en Eker.","28":"En de kinderen van Onam waren Sammai en Jada. En de kinderen van Sammai: Nadab en Abisur.","29":"De naam nu der huisvrouw van Abisur was Abihaïl: die baarde hem Achban en Molid.","30":"En de kinderen van Nadab waren Seled en Appaïm; en Seled stierf zonder kinderen.","31":"En de kinderen van Appaïm waren Jisei; en de kinderen van Jisei waren Sesan; en de kinderen van Sesan, Achlai.","32":"En de kinderen van Jada, den broeder van Sammai, waren Jether en Jonathan; en Jether is gestorven zonder kinderen.","33":"De kinderen van Jonathan nu waren Peleth en Zaza. Dit waren de kinderen van Jerahmeel.","34":"En Sesan had geen zonen, maar dochteren. En Sesan had een Egyptischen knecht, wiens naam was Jarha.","35":"Sesan nu gaf zijn dochter aan zijn knecht Jarha tot een vrouw; en zij baarde hem Attai.","36":"Attai nu gewon Nathan, en Nathan gewon Zabad,","37":"En Zabad gewon Eflal, en Eflal gewon Obed,","38":"En Obed gewon Jehu, en Jehu gewon Azaria,","39":"En Azaria gewon Helez, en Helez gewon Elasa,","40":"En Elasa gewon Sismai, en Sismai gewon Sallum,","41":"En Sallum gewon Jekamja, en Jekamja gewon Elisama.","42":"De kinderen van Kaleb nu, den broeder van Jerahmeel, zijn Mesa, zijn eerstgeborene ( die is de vader van Zif), en de kinderen van Maresa, den vader van Hebron.","43":"De kinderen van Hebron nu waren Korah, en Tappuah, en Rekem, en Sema.","44":"Sema nu gewon Raham, den vader van Jorkeam, en Rekem gewon Sammai.","45":"De kinderen van Sammai nu waren Maon; en Maon was de vader van Beth-zur.","46":"En Efa, het bijwijf van Kaleb, baarde Haran, en Moza, en Gazez; en Haran gewon Gazez.","47":"De kinderen van Jochdai nu waren Regem, en Jotham, en Gesan, en Pelet, en Efa, en Saaf.","48":"Uit het bijwijf Maacha gewon Kaleb: Seber en Tirhana.","49":"En *de* *huisvrouw* van Saaf, den vader van Madmanna, baarde Seva, den vader van Machbena, en den vader van Gibea; en de dochter van Kaleb was Achsa.","50":"Dit waren de kinderen van Kaleb, den zoon van Hur, den eerstgeborene van Efratha: Sobal, de vader van Kirjath-jearim;","51":"Salma, de vader der Bethlehemieten; Haref, de vader van Beth-gader.","52":"De kinderen van Sobal, den vader van Kirjath-jearim, waren Haroe *en* Hazihammenuchoth.","53":"En de geslachten van Kirjath-jearim waren de Jithrieten, en de Futhieten, en de Sumathieten, en de Misraieten; van dezen zijn uitgegaan de Zoraieten en de Esthaolieten.","54":"De kinderen van Salma waren de Bethlehemieten, en de Netofathieten, Atroth, Beth-joab, en de helft der Manathieten, *en* de Zorieten.","55":"En de huisgezinnen der schrijvers, die te Jabes woonden , de Tirathieten, de Simeathieten, de Suchathieten; dezen zijn de Kenieten, die gekomen zijn van Hammath, den vader van het huis van Rechab."},"KJV":{"1":"These are the sons of Israel; Reuben, Simeon, Levi, and Judah, Issachar, and Zebulun,","2":"Dan, Joseph, and Benjamin, Naphtali, Gad, and Asher.","3":"The sons of Judah; Er, and Onan, and Shelah: which three were born unto him of the daughter of Shua the Canaanitess. And Er, the firstborn of Judah, was evil in the sight of the LORD; and he slew him.","4":"And Tamar his daughter in law bare him Pharez and Zerah. All the sons of Judah were five.","5":"The sons of Pharez; Hezron, and Hamul.","6":"And the sons of Zerah; Zimri, and Ethan, and Heman, and Calcol, and Dara: five of them in all.","7":"And the sons of Carmi; Achar, the troubler of Israel, who transgressed in the thing accursed.","8":"And the sons of Ethan; Azariah.","9":"The sons also of Hezron, that were born unto him; Jerahmeel, and Ram, and Chelubai.","10":"And Ram begat Amminadab; and Amminadab begat Nahshon, prince of the children of Judah;","11":"And Nahshon begat Salma, and Salma begat Boaz,","12":"And Boaz begat Obed, and Obed begat Jesse,","13":"And Jesse begat his firstborn Eliab, and Abinadab the second, and Shimma the third,","14":"Nethaneel the fourth, Raddai the fifth,","15":"Ozem the sixth, David the seventh:","16":"Whose sisters were Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three.","17":"And Abigail bare Amasa: and the father of Amasa was Jether the Ishmeelite.","18":"And Caleb the son of Hezron begat children of Azubah his wife, and of Jerioth: her sons are these; Jesher, and Shobab, and Ardon.","19":"And when Azubah was dead, Caleb took unto him Ephrath, which bare him Hur.","20":"And Hur begat Uri, and Uri begat Bezaleel.","21":"And afterward Hezron went in to the daughter of Machir the father of Gilead, whom he married when he was threescore years old; and she bare him Segub.","22":"And Segub begat Jair, who had three and twenty cities in the land of Gilead.","23":"And he took Geshur, and Aram, with the towns of Jair, from them, with Kenath, and the towns thereof, even threescore cities. All these belonged to the sons of Machir the father of Gilead.","24":"And after that Hezron was dead in Calebephratah, then Abiah Hezron's wife bare him Ashur the father of Tekoa.","25":"And the sons of Jerahmeel the firstborn of Hezron were, Ram the firstborn, and Bunah, and Oren, and Ozem, and Ahijah.","26":"Jerahmeel had also another wife, whose name was Atarah; she was the mother of Onam.","27":"And the sons of Ram the firstborn of Jerahmeel were, Maaz, and Jamin, and Eker.","28":"And the sons of Onam were, Shammai, and Jada. And the sons of Shammai; Nadab, and Abishur.","29":"And the name of the wife of Abishur was Abihail, and she bare him Ahban, and Molid.","30":"And the sons of Nadab; Seled, and Appaim: but Seled died without children.","31":"And the sons of Appaim; Ishi. And the sons of Ishi; Sheshan. And the children of Sheshan; Ahlai.","32":"And the sons of Jada the brother of Shammai; Jether, and Jonathan: and Jether died without children.","33":"And the sons of Jonathan; Peleth, and Zaza. These were the sons of Jerahmeel.","34":"Now Sheshan had no sons, but daughters. And Sheshan had a servant, an Egyptian, whose name was Jarha.","35":"And Sheshan gave his daughter to Jarha his servant to wife; and she bare him Attai.","36":"And Attai begat Nathan, and Nathan begat Zabad,","37":"And Zabad begat Ephlal, and Ephlal begat Obed,","38":"And Obed begat Jehu, and Jehu begat Azariah,","39":"And Azariah begat Helez, and Helez begat Eleasah,","40":"And Eleasah begat Sisamai, and Sisamai begat Shallum,","41":"And Shallum begat Jekamiah, and Jekamiah begat Elishama.","42":"Now the sons of Caleb the brother of Jerahmeel were, Mesha his firstborn, which was the father of Ziph; and the sons of Mareshah the father of Hebron.","43":"And the sons of Hebron; Korah, and Tappuah, and Rekem, and Shema.","44":"And Shema begat Raham, the father of Jorkoam: and Rekem begat Shammai.","45":"And the son of Shammai was Maon: and Maon was the father of Bethzur.","46":"And Ephah, Caleb's concubine, bare Haran, and Moza, and Gazez: and Haran begat Gazez.","47":"And the sons of Jahdai; Regem, and Jotham, and Geshan, and Pelet, and Ephah, and Shaaph.","48":"Maachah, Caleb's concubine, bare Sheber, and Tirhanah.","49":"She bare also Shaaph the father of Madmannah, Sheva the father of Machbenah, and the father of Gibea: and the daughter of Caleb was Achsah.","50":"These were the sons of Caleb the son of Hur, the firstborn of Ephratah; Shobal the father of Kirjathjearim,","51":"Salma the father of Bethlehem, Hareph the father of Bethgader.","52":"And Shobal the father of Kirjathjearim had sons; Haroeh, and half of the Manahethites.","53":"And the families of Kirjathjearim; the Ithrites, and the Puhites, and the Shumathites, and the Mishraites; of them came the Zareathites, and the Eshtaulites.","54":"The sons of Salma; Bethlehem, and the Netophathites, Ataroth, the house of Joab, and half of the Manahethites, the Zorites.","55":"And the families of the scribes which dwelt at Jabez; the Tirathites, the Shimeathites, and Suchathites. These are the Kenites that came of Hemath, the father of the house of Rechab."}},"tsk":{"1":[{"kopje":"Israël","refs":["Gen 32:28","Gen 49:2"]},{"kopje":"Ruben","refs":["Gen 29:32-35","Gen 30:5-24","Gen 35:18","Gen 35:22-26","Gen 46:8-27","Gen 49:4-28","Ex 1:2-4","Num 1:5-15","Num 13:4-15","Num 26:5-65","Openb 7:5-8"]}],"2":[{"kopje":"Dan","refs":["Gen 30:6"]},{"kopje":"Jozef","refs":["Gen 30:24"]},{"kopje":"Benjamin","refs":["Gen 35:18"]},{"kopje":"Nafthali","refs":["Gen 30:8"]},{"kopje":"Gad","refs":["Gen 30:11"]},{"kopje":"Aser","refs":["Gen 30:13","Gen 35:26","Gen 46:17","Gen 49:20","Num 1:40","Num 1:41","Deut 33:24","Joz 19:24-31"]}],"3":[{"kopje":"en","refs":["1 Kron 9:5","Gen 38:2-10","Gen /10/#v15","ref":"2 Kon 10:15","svLabel":null},{"disp":"2 Kon 10:23","href":"../../2-koningen/10/#v23","ref":"2 Kon 10:23","svLabel":null},{"disp":"1 Kron 2:55","href":"../../1-kronieken/2/#v55","ref":"1 Kron 2:55","svLabel":null},{"disp":"Jer 35:6","href":"../../jeremia/35/#v6","ref":"Jer 35:6","svLabel":null},{"disp":"Jer 35:8","href":"../../jeremia/35/#v8","ref":"Jer 35:8","svLabel":null},{"disp":"Jer 35:16","href":"../../jeremia/35/#v16","ref":"Jer 35:16","svLabel":null},{"disp":"Jer 35:19","href":"../../jeremia/35/#v19","ref":"Jer 35:19","svLabel":null}],"kinderen":[]}]},{"topic":"Rechabites","href":"../../nave/r/#t-rechabites","kinderen":[{"label":"A family of Kenites descended from Rechab, through Jonadab","href":"../../nave/r/?hl=1Chr.2.55#i17001","refs":[{"disp":"1 Kron 2:55","href":"../../1-kronieken/2/#v55","ref":"1 Kron 2:55","svLabel":null},{"disp":"Jer 35:6","href":"../../jeremia/35/#v6","ref":"Jer 35:6","svLabel":null}],"kinderen":[]}]},{"topic":"Shimeathites","href":"../../nave/s/#t-shimeathites","kinderen":[{"label":"A family of scribes","href":"../../nave/s/?hl=1Chr.2.55#i18869","refs":[{"disp":"1 Kron 2:55","href":"../../1-kronieken/2/#v55","ref":"1 Kron 2:55","svLabel":null}],"kinderen":[]}]}],"torrey":[{"topic":"Kenites, The","href":"../../torrey/k/#t-kenites-the","kinderen":[{"label":"The Rechabites descended from","href":"../../torrey/k/?hl=1Chr.2.55#i10895","refs":[{"disp":"1 Kron 2:55","href":"../../1-kronieken/2/#v55","ref":"1 Kron 2:55","svLabel":null}],"kinderen":[]}]},{"topic":"Rechabites","href":"../../torrey/r/#t-rechabites","kinderen":[{"label":"Descended from Hemath","href":"../../torrey/r/?hl=1Chr.2.55#i17072","refs":[{"disp":"1 Kron 2:55","href":"../../1-kronieken/2/#v55","ref":"1 Kron 2:55","svLabel":null}],"kinderen":[]}]},{"topic":"Scribes","href":"../../torrey/s/#t-scribes","kinderen":[{"label":"Families Celebrated For Furnishing","href":"../../torrey/s/?hl=1Chr.2.55#i18697","refs":[],"kinderen":[{"label":"Kenites","href":"../../torrey/s/?hl=1Chr.2.55#i18698","refs":[{"disp":"1 Kron 2:55","href":"../../1-kronieken/2/#v55","ref":"1 Kron 2:55","svLabel":null}],"kinderen":[]}]}]}]}},"extern":{"Ex 1:3":"Issaschar, Zebulon en Benjamin;","2 Sam 2:18":"Nu waren daar drie zonen van Zeruja, Joab, en Abisai en Asahel; en Asahel was licht op zijn voeten, als een van de reeën die in het veld zijn.","Num 1:40":"Van de zonen van Aser, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van twintig jaar oud en daarboven, allen die ten leger uittrokken,","Gen 49:13":"Zebulon zal aan de haven van de zeeën wonen, en hij zal aan de haven van de schepen wezen; en zijn grens zal zijn naar Sidon.","1 Kron 11:41":"Uria, de Hethiet; Zabad, de zoon van Ahlai;","Ezra 2:22":"De mannen van Netofa, zesenvijftig.","Gen 30:20":"En Lea zei: God heeft mij, mij heeft Hij begiftigd met een goede gift; deze keer zal mijn man mij bijwonen; want ik heb hem zes zonen gebaard; en zij noemde zijn naam Zebulon.","1 Sam 26:6":"Toen antwoordde David en sprak tegen Achimelech, de Hethiet, en tegen Abisai, de zoon van Zeruja, de broer van Joab, en zei: Wie zal met mij naar Saul in het leger afgaan? Toen zei Abisai: Ik zal met u afgaan.","Gen 38:4":"Daarna werd zij opnieuw zwanger, en baarde een zoon, en zij noemde hem Onan.","Joz 15:58":"Halhul, Beth-zur, en Gedor,","2 Sam 23:24":"Asahel, Joabs broer, was onder de dertig; Elhanan, de zoon van Dodo, van Bethlehem;","Gen 38:8-10":"Toen zei Juda tegen Onan: Ga naar de vrouw van uw broer, en trouw met haar volgens het zwagerrecht, en verwek voor uw broer nageslacht. Maar Onan wist dat dit nageslacht niet voor hem zou zijn; en het gebeurde, wanneer hij bij de vrouw van zijn broer inging, dat hij het verspilde op de grond, om zijn broer geen nageslacht te geven. En het was slecht in de ogen van de HEERE, wat hij deed; daarom doodde Hij ook hem.","2 Kron 5:12":"en de Levieten, die zangers waren, van hen allen, van Asaf, van Heman, van Jeduthun, en van hun zonen, en van hun broeders, in fijn linnen gekleed, met cimbalen, en met luiten, en harpen, stonden aan de oostzijde van het altaar, en met hen tot honderdtwintig priesters toe, die op trompetten trompetten);","Richt 13:2":"Er was een man uit Zora, uit het geslacht van een Daniet, wiens naam Manoach was; en zijn vrouw was onvruchtbaar en had geen kinderen gebaard.","Gen 29:32":"En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben.","Ex 1:4":"Dan en Nafthali, Gad en Aser.","Joz 7:17":"Toen hij het geslacht van Juda liet aankomen, wees hij het geslacht van Zarchi aan. Toen hij het geslacht van Zarchi liet aankomen, man voor man, werd Zabdi aangewezen;","Num 2:3":"Die zich nu oostwaarts, naar de opgang, legeren zullen, zal zijn de banier van het leger van Juda, naar hun legers; en Nahesson, de zoon van Amminadab, zal de leider van de zonen van Juda zijn.","1 Kron 8:37":"En Moza verwekte Bina; zijn zoon was Rafa; zijn zoon was Elasa; zijn zoon was Azel.","2 Kron 11:20":"En na haar nam hij Maächa, de dochter van Absalom; deze baarde hem Abia, en Attai, en Ziza, en Selomith.","1 Sam 23:19":"Toen trokken de Zifieten op naar Saul in Gibea, en zeiden: Heeft David zich niet bij ons verborgen in de vestingen in het woud, op de heuvel van Hachila, die ten zuiden van de wildernis ligt?","Num 26:20":"Zo waren de zonen van Juda naar hun geslachten: van Sela het geslacht der Selanieten; van Perez het geslacht der Perezieten; van Zerah het geslacht der Zerahieten.","Gen 30:8":"Toen zei Rachel: Ik heb worstelingen van God met mijn zuster geworsteld; ook heb ik de overhand gehad; en zij noemde zijn naam Nafthali.","1 Kron 2:3-15":"De kinderen van Juda zijn: Er, en Onan, en Sela; drie zijn hem geboren van de dochter van Sua, de Kanaänietische; en Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde Hij hem. Maar Thamar, zijn schoondochter, baarde hem Perez en Zerah. Al de zonen van Juda waren vijf. De kinderen van Perez waren Hezron en Hamul.","2 Sam 19:13":"En tegen Amasa moet u zeggen: Bent u niet mijn gebeente en mijn vlees? God doe mij zo, en meer dan dat, als u niet legeraanvoerder wordt voor mijn aangezicht, alle dagen, in de plaats van Joab.","Ex 6:13-26":"Dit zijn de hoofden van ieder huis van hun vaderen: de zonen van Ruben, de eerstgeborene van Israël, zijn Hanoch en Pallu, Hezron en Charmi; dit zijn de huisgezinnen van Ruben. En de zonen van Simeon: Jemuël, en Jamin, en Ohad, en Jachin, en Zohar, en Saul, de zoon van een Kanaänitische vrouw; dit zijn de huisgezinnen van Simeon. Dit nu zijn de namen van de zonen van Levi, naar hun geboorten: Gerson, en Kehath, en Merari. En de jaren van het leven van Levi waren honderdzevenendertig jaren.","Gen 10:22":"Sems zonen waren Elam, en Assur, en Arfachsad, en Lud, en Aram.","1 Sam 17:13":"En de drie oudste zonen van Isaï gingen op weg; zij volgden Saul na in de strijd. De namen nu van zijn drie zonen die in de strijd gingen, waren: Eliab, de eerstgeborene, en zijn tweede Abinadab, en de derde Samma.","1 Kron 1:39":"De kinderen van Lotan nu waren Hori en Homam; en de zuster van Lotan was Timna.","Joz 17:3":"Zelafead nu, de zoon van Hefer, de zoon van Gilead, de zoon van Machir, de zoon van Manasse, had geen zonen, maar dochters; en dit zijn de namen van zijn dochters: Machla en Noa, Hogla, Milka en Tirza.","2 Kron 23:1":"Maar in het zevende jaar bemoedigde Jojada zich, en hij nam de leiders van de honderdtallen, Azarja, de zoon van Jeroham, en Ismaël, de zoon van Johanan, en Azarja, de zoon van Obed, en Maaseja, de zoon van Adaja, en Elisafat, de zoon van Zichri, met zich in een verbond.","1 Kron 1:17":"De kinderen van Sem waren Elam, en Assur, en Arfachsad, en Lud, en Aram, en Uz, en Hul, en Gether, en Mesech.","1 Kon 2:32":"Zo zal de HEERE zijn bloed op zijn eigen hoofd doen terugkeren, omdat hij twee mannen heeft aangevallen die rechtvaardi e lammeren. Dit was de offergave van Nahesson, de zoon van Amminadab.","Num 13:4-15":"En dit zijn hun namen: van de stam van Ruben, Sammua, de zoon van Zaccur. Van de stam van Simeon, Safat, de zoon van Hori. Van de stam van Juda, Kaleb, de zoon van Jefunne.","1 Kron 27:7":"De vierde, in de vierde maand, was Asaël, de broer van Joab, en na hem Zebadja, zijn zoon; in zijn verdeling waren er ook vierentwintigduizend.","2 Sam 23:26":"Helez, de Paltiet; Ira, de zoon van Ikes, de Thekoiet;","Gen 46:14":"En de zonen van Zebulon: Sered, en Elon, en Jahleel.","Gen 50:23":"En Jozef zag van Efraïm kinderen, van het derde geslacht; ook werden de zonen van Machir, de zoon van Manasse, op de knieën van Jozef geboren.","1 Kron 13:6":"Toen trok David op met heel Israël naar Baäla, dat is Kirjath-jearim, dat in Juda ligt, om vandaar de ark van God op te halen, van de HEERE, Die tussen de cherubs woont, waar de Naam wordt aangeroepen.","Num 26:21":"En de zonen van Perez waren: van Hezron het geslacht der Hezronieten; van Hamul het geslacht der Hamulieten.","1 Kron 25:6":"Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.","Luk 3:3":"En hij kwam in heel het omliggende land van de Jordaan, en predikte de doop van bekering tot vergeving van zonden,","Gen 49:20":"Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.","1 Kron 27:18":"Over Juda was Elihu, uit de broers van David; over Issaschar was Omri, de zoon van Michaël;","Joz 22:20":"Heeft Achan, de zoon van Zerah, geen overtreding begaan met het verbannene, en kwam er niet een verbolgenheid over de hele vergadering van Israël? En die man stierf niet alleen in zijn ongerechtigheid.","1 Sam 16:1":"Toen zei de HEERE tegen Samuël: Hoe lang draagt u leed om Saul, die Ik toch verworpen heb, dat hij geen koning meer zal zijn over Israël? Vul uw hoorn met olie, en ga op weg; Ik zal u zenden naar Isaï, de Bethlehemiet; want Ik heb Mij een koning uitgekozen onder zijn zonen.","Joz 19:41":"En het gebied van hun erfdeel was: Zora, en Esthaol, en Ir-semes,","Hand 13:22":"En nadat Hij hem afgezet had, verwekte Hij hun David tot koning; aan wie Hij ook getuigenis gaf, en zei: Ik heb David gevonden, de zoon van Isaï, een man naar Mijn hart, die al Mijn wil zal doen.","Gen 49:3":"Ruben! U bent mijn eerstgeborene, mijn kracht, en het begin van mijn macht; de voortreffelijkste in hoogheid, en de voortreffelijkste in sterkte!","1 Kron 16:41":"En met hen Heman en Jeduthun, en de overige uitgelezen mannen, die met naam uitgedrukt zijn om de HEERE te loven; want Zijn goedertierenheid is tot in eeuwigheid.","Micha 5:1":"En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.","Jer 2:28":"Waar zijn dan uw goden, die u zich gemaakt hebt? Laat ze opstaan, of zij u ten tijde van uw kwaad zullen verlossen; want naar het getal van uw steden zijn uw goden, Juda!","1 Kron 15:19":"De zangers nu, Heman, Asaf en Ethan, lieten zich horen met koperen cimbalen;","Ex 4:23":"En Ik heb tegen u gezegd: Laat Mijn zoon gaan, opdat hij Mij dient! maar u hebt geweigerd hem te laten gaan; zie, Ik zal uw zoon, uw eerstgeborene, doden!","Deut 3:15":"En aan Machir gaf ik Gilead.","2 Sam 21:6":"Laat ons zeven mannen van zijn zonen gegeven worden, zodat wij hen voor de HEERE ophangen te Gibea van Saul, o, u verkorene van de HEERE! En de koning zei: Ik zal hen geven.","Luk 3:32":"de zoon van Isaï, de zoon van Obed, de zoon van Boaz, de zoon van Salmon, de zoon van Nahasson,","Openb 7:5-8":"Uit het geslacht van Juda waren twaalfduizend verzegeld; uit het geslacht van Ruben waren twaalfduizend verzegeld; uit het geslacht van Gad waren twaalfduizend verzegeld; uit het geslacht van Aser waren twaalfduizend verzegeld; uit het geslacht van Naftali waren twaalfduizend verzegeld; uit het geslacht van Manasse waren twaalfduizend verzegeld; uit het geslacht van Simeon waren twaalfduizend verzegeld; uit het geslacht van Levi waren twaalfduizend verzegeld; uit het geslacht van Issaschar waren twaalfduizend verzegeld;","Joz 15:33":"In de laagte zijn: Esthaol, en Zora, en Asna,","2 Sam 17:25":"En Absalom had Amasa in de plaats van Joab aangesteld over het leger. Amasa nu was de zoon van een man wiens naam Jethra was, de Israëliet, die bij Abigaïl was ingegaan, de dochter van Nahas, zuster van Zeruja, de moeder van Joab.","Matt 1:3":"en Juda verwekte Fares en Zara bij Thamar; en Fares verwekte Esrom, en Esrom verwekte Aram;","Joz 7:1":"Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël.","Neh 7:26":"De mannen van Bethlehem en Netofa, honderdachtentachtig;","Rom 8:29":"Want die Hij van tevoren gekend heeft, die heeft Hij ook van tevoren bestemd om gelijkvormig te zijn aan het beeld van Zijn Zoon, opdat Hij de Eerstgeborene zou zijn onder veel broeders.","Gen 46:8-27":"En dit zijn de namen van de zonen van Israël die naar Egypte kwamen: Jakob en zijn zonen. De eerstgeborene van Jakob: Ruben. En de zonen van Ruben: Hanoch, en Pallu, en Hezron, en Karmi. En de zonen van Simeon: Jemuël, en Jamin, en Ohad, en Jachin, en Zohar, en Saul, de zoon van een Kanaänitische vrouw.","Deut 7:26":"U zult dan de gruwel niet in uw huis brengen, anders wordt u zelf net zo verbannen als dat is; u zult het helemaal verafschuwen, en er volledig een gruwel van hebben, want het is verbannen.","Gen 30:6":"Toen zei Rachel: God heeft mij recht gedaan, en heeft ook mijn stem verhoord, en heeft mij een zoon gegeven; daarom noemde zij zijn naam Dan.","2 Kon 15:10":"En Sallum, de zoon van Jabes, ar niet verkopen, omdat hij trouweloos met haar gehandeld heeft. Maar als hij haar aan zijn zoon tot vrouw geeft, zal hij met haar doen naar het recht van de dochters.","Gen 38:11":"Toen zei Juda tegen Thamar, zijn schoondochter: Blijf weduwe in het huis van uw vader, totdat mijn zoon Sela groot wordt; want hij zei: Anders sterft misschien ook deze, net als zijn broers! Zo ging Thamar heen, en bleef in het huis van haar vader.","2 Kon 10:15":"En van daar weggegaan zijnde, vond hij Jonadab, de zoon van Rechab, hem tegemoet; die hem groette; en hij zei tot hem: Is uw hart oprecht, zoals mijn hart met uw hart is? En Jonadab zei: Het is zo, ja, het is zo; geef mij uw hand. En hij gaf zijn hand, en hij liet hem bij zich op de wagen klimmen.","Num 1:41":"Waren hun getelden van de stam van Aser eenenveertigduizend vijfhonderd.","Gen 29:33":"En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon.","Num 26:19":"De zonen van Juda waren Er en Onan; maar Er en Onan stierven in het land Kanaän.","Gen 30:13":"Toen zei Lea: Tot mijn geluk! Want de dochters zullen mij gelukkig noemen; en zij noemde zijn naam Aser.","Deut 3:14":"Jaïr, de zoon van Manasse, kreeg de hele landstreek van Argob, tot aan het gebied van de Gezurieten en Maächatieten; en hij noemde ze naar zijn naam, Bazan-Havvoth-Jaïr, tot op deze dag.","Matt 1:4":"en Aram verwekte Aminadab, en Aminadab verwekte Nahasson, en Nahasson verwekte Salmon;","Richt 16:31":"Toen kwamen zijn broers naar beneden, en het hele huis van zijn vader, en namen hem op, en brachten hem omhoog, en begroeven hem tussen Zora en Esthaol, in het graf van zijn vader Manoach; hij had Israël twintig jaar geleid.","2 Kron 35:15":"En de zangers, de zonen van Asaf, waren op hun standplaats, naar het gebod van David, en Asaf, en Heman, en Jeduthun, de ziener van de koning, alsook de poortwachters bij elke poort; zij hoefden niet te wijken van hun dienst, want hun broeders, de Levieten, bereidden voor hen.","Jes 10:31":"Madmena vlucht weg, de inwoners van Gebim vluchten met groepen.","Gen 38:30":"En daarna kwam zijn broer naar buiten, aan wiens hand de scharlaken draad was; en men noemde hem Zera.","Gen 38:6":"Juda nam een vrouw voor Er, zijn eerstgeborene, en haar naam was Thamar.","1 Kon 16:10":"Zo kwam Zimri binnen, en sloeg hem, en doodde hem, in het zevenentwintigste jaar van Asa, de koning van Juda; en hij werd koning in zijn plaats.","Neh 3:16":"Na hem verbeterde Nehemia, de zoon van Azbuk, leider van het halve deel van Beth-Zur, tot tegenover Davids graven, en tot aan de aangelegde vijver, en tot aan het huis van de helden.","2 Sam 16:9-11":"Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen. Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.","Ex 35:30":"Daarna zei Mozes tegen de kinderen van Israël: Ziet, de HEERE heeft met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda.","Joz 13:2-13":"Dit is het land, dat overgebleven is: alle gebieden van de Filistijnen en het hele Gesuri; Van de Sichor af, die voor aan Egypte is, tot aan de grens van Ekron toe naar het noorden, dat aan de Kanaänieten toegerekend wordt; vijf vorsten van de Filistijnen, de Gazatiet en de Asdodiet, de Askeloniet, de Gathiet en de Ekroniet, en de Avvieten. Vanaf het zuiden, het hele land van de Kanaänieten, en Meara, die van de Sidoniërs is, tot Afek toe, tot aan de grens van de Amorieten.","Gen 38:2-10":"En Juda zag daar de dochter van een Kanaänitische man, wiens naam Sua was; en hij nam haar, en ging tot haar in. En zij werd zwanger en baarde een zoon, en hij noemde hem Er. Daarna werd zij opnieuw zwanger, en baarde een zoon, en zij noemde hem Onan.","1 Kron 4:2":"En Reaja, de zoon van Sobal, verwekte Jahath, en Jahath verwekte Ahumai en Lahad; dit zijn de huisgezinnen van de Zorathieten;","1 Kon 16:20":"Het overige nu van de geschiedenis van Zimri, en zijn verraad, dat hij gepleegd heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Israël?","1 Kon 4:13":"De zoon van Geber was te Ramoth in Gilead; hij had de dorpen van Jaïr, de zoon van Manasse, die in Gilead zijn; ook had hij de streek van Argob, die in Basan is, zestig grote steden met muren en koperen grendels.","2 Sam 13:38":"Zo vluchtte Absalom, en ging naar Gesur; en hij was daar drie jaar.","Ruth 4:20":"En Amminadab verwekte Nahesson; en Nahesson verwekte Salma;","Ex 31:2":"Zie, Ik heb met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda.","Joz 15:9":"Daarna zal deze grens zich uitstrekken van de top van de berg tot aan de waterbron Nefthoah, en uitgaan tot de steden van het gebergte Efron. Verder zal deze grens zich uitstrekken naar Baäla; dat is Kirjath-jearim.","1 Kron 2:25-33":"De kinderen van Jerahmeel nu, de eerstgeborene van Hezron, waren deze: de eerstgeborene was Ram, daartoe Buna, en Oren, en Ozem en Ahia. Jerahmeel had nog een andere vrouw, wier naam was Atara; zij was de moeder van Onam. En de kinderen van Ram, de eerstgeborene van Jerahmeel, waren Maaz, en Jamin, en Eker.","Num 1:5-15":"Dit zijn nu de namen van de mannen die bij u zullen staan: van Ruben, Elizur, de zoon van Sedeur. Van Simeon, Selumiël, de zoon van Zurisaddai. Van Juda, Nahesson, de zoon van Amminadab.","1 Kron 9:43":"En Moza verwekte Bina; wiens zoon was Refaja; wiens zoon was Elasa; wiens zoon was Azel.","2 Sam 14:2":"Zo zond Joab iemand naar Thekoa, en liet vandaar een wijze vrouw halen; en hij zei tegen haar: Doe toch alsof u rouw draagt, en trek nu rouwkleren aan, en zalf u niet met olie, en wees als een vrouw die al veel dagen rouw heeft gedragen over een dode;","Joz 7:18":"Diens huisgezin liet hij aankomen, man voor man, en Achan werd aangewezen, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda.","Gen 35:18":"En het gebeurde, toen haar ziel heenging (want zij stierf), dat zij zijn naam Ben-Oni noemde; maar zijn vader noemde hem Benjamin.","Ex 1:1-5":"Dit zijn de namen van de zonen van Israël, die met Jakob in Egypte gekomen zijn; ieder kwam er met zijn huisgezin. Ruben, Simeon, Levi en Juda; Issaschar, Zebulon en Benjamin;","Hebr 12:23":"Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;","Num 26:13":"Van Zerah het geslacht der Zerahieten; van Saul het geslacht der Saulieten.","1 Kron 8:29":"En te Gibeon woonde de vader van Gibeon; en de naam van zijn vrouw was Maächa.","Jer 35:16":"Omdat de kinderen van Jonadab, de zoon van Rechab, het gebod van hun vader, dat hij hun geboden heeft, bevestigd hebben, maar dit volk naar Mij niet luistert;","1 Kron 9:5":"En van de Silonieten was Asaja, de eerstgeborene, en zijn kinderen.","1 Kron 11:40":"Ira, de Jithriet; Gareb, de Jithriet;","Num 36:10":"Zoals de HEERE Mozes geboden had, zo deden de dochters van Zelafead:","Num 26:6":"Van Hezron het geslacht der Hezronieten; van Karmi het geslacht der Karmieten.","Ruth 1:19":"Zo gingen die twee verder, totdat zij in Bethlehem aankwamen; en het gebeurde, toen zij in Bethlehem aankwamen, dat de hele stad over hen in opschudding raakte, en zij zeiden: Is dit Naomi?","Gen 46:17":"En de zonen van Aser: Jimna, en Jisva, en Jisvi, en Berija, en Sera, hun zuster; en de zonen van Berija: Heber en Malchiël.","Num 27:4":"Waarom zou de naam van onze vader verdwijnen uit zijn geslacht, omdat hij geen zoon heeft? Geef ons een bezitting onder de broers van onze vader.","2 Sam 23:29":"Heleb, de zoon van Baëna, de Netofathiet; Ithai, de zoon van Ribai, van Gibea van de kinderen van Benjamin;","Gen 46:12":"En de zonen van Juda: Er, en Onan, en Sela, en Perez, en Zerah. Maar Er en Onan waren gestorven in het land Kanaän; en de zonen van Perez waren Hezron en Hamul.","Num 36:1":"En de familiehoofden van het geslacht van de kinderen van Gilead, de zoon van Machir, de zoon van Manasse, uit de geslachten van de kinderen van Jozef, traden naar voren en spraken voor Mozes en voor de leiders, de familiehoofden van de kinderen van Israël.","2 Kron 11:7":"En Beth-zur, en Socho, en Adullam,","Richt 1:16":"De nakomelingen van de Keniet, de schoonvader van Mozes, trokken ook op uit de Palmstad, met de Judeeërs, naar de woestijn van Juda, die ten zuiden van Harad ligt; en zij gingen heen en woonden bij het volk.","Num 26:30":"Dit zijn de zonen van Gilead: van Jezer het geslacht der Jezerieten; van Helek het geslacht der Helekieten.","Neh 11:4":"Te Jeruzalem dan woonden sommigen van de kinderen van Juda, en van de kinderen van Benjamin. Van de kinderen van Juda: Athaja, de zoon van Uzzia, de zoon van Zacharja, de zoon van Amarja, de zoon van Sefatja, de zoon van Mahalaleël, van de kinderen van Perez;","1 Kron 3:18":"Zijn zonen waren Malchiram, en Pedaja, en Senazar, Jekamja, Hosama en Nedabja.","1 Kron 11:26":"De helden nu van de legers waren: Asahel, de broer van Joab; Elhanan, de zoon van Dodo, van Bethlehem;","Ps 89:2":"Ik zal de goedertierenheid van de HEERE eeuwig zingen; ik zal Uw waarheid met mijn mond bekend maken, van geslacht tot geslacht.","Matt 2:1":"Toen Jezus geboren was in Bethlehem, in Judea, in de dagen van koning Herodes, zie, kwamen er wijzen uit het Oosten in Jeruzalem aan.","1 Kon 16:12":"Zo vernietigde Zimri het hele huis van Baësa, naar het woord van de HEERE, dat Hij over Baësa gesproken had, door de dienst van de profeet Jehu;","Num 26:29":"De zonen van Manasse waren: van Machir het geslacht der Machirieten; Machir nu verwekte Gilead; van Gilead was het geslacht der Gileadieten.","1 Kron 6:44":"Hun broeders nu, de kinderen van Merari, stonden aan de linker zijde, namelijk Ethan, de zoon van Kisi, de zoon van Abdi, de zoon van Malluch,","1 Kron 15:17":"Zo stelden de Levieten Heman aan, de zoon van Joël, en uit zijn broeders Asaf, de zoon van Berechja; en uit de zonen van Merari, hun broeders, Ethan, de zoon van Kusaja;","Gen 35:22-26":"En het gebeurde, toen Israël in dat land woonde, dat Ruben heenging en lag bij Bilha, het bijvrouw van zijn vader; en Israël hoorde het. En de zonen van Jakob waren twaalf. De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon. De zonen van Rachel: Jozef en Benjamin.","Num 32:42":"En Nobah ging op weg en nam Kenath in, met de bijbehorende plaatsen, en noemde het Nobah naar zijn eigen naam.","Ex 1:2-4":"Ruben, Simeon, Levi en Juda; Issaschar, Zebulon en Benjamin; Dan en Nafthali, Gad en Aser.","Num 26:5-65":"Ruben was de eerstgeborene van Israël. De zonen van Ruben waren: Hanoch, van wie het geslacht der Hanochieten was; van Pallu het geslacht der Palluieten; Van Hezron het geslacht der Hezronieten; van Karmi het geslacht der Karmieten. Dit zijn de geslachten der Rubenieten; en hun getelden waren drieënveertigduizend zevenhonderddertig.","1 Kron 6:7":"En Merajoth verwekte Amarja, en Amarja verwekte Ahitub;","Gen 38:7":"Maar Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde de HEERE hem.","1 Sam 16:6-13":"En het gebeurde, toen zij binnenkwamen, dat hij Eliab aanzag, en dacht: Zeker, deze staat hier voor de HEERE, Zijn gezalfde. Doch de HEERE zei tegen Samuël: Kijk niet naar zijn gestalte, en ook niet naar zijn lange lengte, want Ik heb hem verworpen; want het is niet zoals de mens ziet; want de mens kijkt naar wat voor ogen is, maar de HEERE kijkt naar het hart. Toen riep Isaï Abinadab, en liet hem voor Samuël langslopen; doch hij zei: Ook deze heeft de HEERE niet uitgekozen.","1 Kron 9:4":"Uthai, de zoon van Ammihud, de zoon van Omri, de zoon van Imri, de zoon van Bani, van de kinderen van Perez, de zoon van Juda.","Gen 30:1-24":"Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood. Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft? En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.","1 Kon 2:5":"U weet ook zelf wat Joab, de zoon van Zeruja, mij heeft aangedaan, en wat hij heeft gedaan aan de twee legeraanvoerders van Israël, Abner, de zoon van Ner, en Amasa, de zoon van Jether, die hij heeft gedood, en hij heeft krijgsbloed vergoten in vredestijd; en hij heeft krijgsbloed gedaan aan zijn gordel, die om zijn middel was, en aan zijn schoenen, die aan zijn voeten waren.","Jer 35:2-8":"Ga naar het huis van de Rechabieten, en spreek met hen, en breng hen in het huis van de HEERE, in een van de kamers, en geef hun wijn te drinken. Toen nam ik Jaazanja, de zoon van Jeremia, de zoon van Habazzinja, alsook zijn broers, en al zijn zonen, en het hele huis van de Rechabieten; En bracht hen in het huis van de HEERE, in de kamer van de zonen van Hanan, de zoon van Jigdalia, de man Gods; die is bij de kamer van de leiders, die daar is boven de kamer van Maaseja, de zoon van Sallum, de dorpelbewaarder.","Jer 35:8":"Zo hebben wij naar de stem van Jonadab, de zoon van Rechab, onze vader, geluisterd in alles wat hij ons geboden heeft; zodat wij geen wijn drinken al onze dagen, wij, onze vrouwen, onze zonen, en onze dochters;","1 Kron 12:11":"Attai de zesde; Eliël de zevende;","2 Kon 9:31":"Toen Jehu nu door de poort naar binnen kwam, zei zij: Is het goed, o Zimri, doodslager van zijn heer?","2 Sam 2:18-24":"Nu waren daar drie zonen van Zeruja, Joab, en Abisai en Asahel; en Asahel was licht op zijn voeten, als een van de reeën die in het veld zijn. En Asahel jaagde Abner achterna; en hij week niet af, om van achter Abner naar rechts of naar links af te gaan. Toen keek Abner achter zich om, en zei: Bent u dit, Asahel? En hij zei: Ik ben het.","Gen 38:5":"En zij werd nog een keer zwanger, en baarde een zoon, en noemde hem Sela; en hij was in Chezib, toen zij hem baarde.","1 Kron 6:42":"De zoon van Ethan, de zoon van Zimma, de zoon van Simeï,","Num 1:7":"Van Juda, Nahesson, de zoon van Amminadab.","Ruth 4:19":"En Hezron verwekte Ram; en Ram verwekte Amminadab;","Joz 6:17":"Doch deze stad zal de HEERE verbannen zijn, zij en al wat daarin is; alleen zal de hoer Rachab levend blijven, zij en allen die met haar in het huis zijn, omdat zij de boden, die wij uitgezonden hadden, verborgen heeft.","Num 27:3":"Onze vader is gestorven in de woestijn, en hij is niet geweest onder hen die zich tegen de HEERE verzameld hebben, in de groep van Korach; maar hij is in zijn eigen zonde gestorven, en had geen zonen.","1 Kron 7:14":"De kinderen van Manasse waren Asriël, die de vrouw van Gilead baarde; maar zijn bijvrouw, de Syrische, baarde Machir, de vader van Gilead.","Ex 1:1":"Dit zijn de namen van de zonen van Israël, die met Jakob in Egypte gekomen zijn; ieder kwam er met zijn huisgezin.","1 Kron 20:7":"En hij hoonde Israël, maar Jonathan, de zoon van Simea, de broer van David, versloeg hem.","Gen 25:6":"Maar aan de zonen van de bijvrouwen die Abraham had, gaf Abraham geschenken; en zond hen weg van zijn zoon Izak, terwijl hij nog leefde, oostwaarts naar het land van het Oosten.","1 Kon 16:16":"Het volk nu, dat zich gelegerd had, hoorde zeggen: Zimri heeft een verbond gesloten, ja, heeft ook de koning verslagen; daarom maakte heel Israël diezelfde dag Omri, de legeraanvoerder, koning over Israël, in het leger.","1 Kron 10:14":"en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.","Richt 4:11":"Heber nu, de Keniet, had zich afgezonderd van Kaïn, uit de kinderen van Hobab, Mozes' schoonvader; en hij had zijn tenten opgeslagen tot aan de eik in Zaanaim, die bij Kedes is.","Jer 35:6":"Maar zij zeiden: Wij zullen geen wijn drinken; want Jonadab, de zoon van Rechab, onze vader, heeft ons geboden en gezegd: U zult geen wijn drinken, u, noch uw kinderen, tot in eeuwigheid.","1 Kon 4:31":"Ja, hij was wijzer dan alle mensen; dan Ethan, de Ezrahiet, en Heman, en Chalcol, en Darda, de zonen van Mahol; en zijn naam was bekend onder alle heidenvolken rondom.","Joz 7:1-5":"Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël. Toen Jozua mannen zond van Jericho naar Ai, dat bij Beth-aven ligt, ten oosten van Beth-el, sprak hij tot hen: Trek op en verken het land. Die mannen trokken op en verkenden Ai. Daarna keerden zij terug naar Jozua, en zeiden tegen hem: Laat niet het hele volk optrekken; laat er ongeveer tweeduizend man, of ongeveer drieduizend man, optrekken om Ai te verslaan; vermoei daar niet het hele volk mee, want zij zijn met weinigen.","Ruth 4:18":"Dit nu zijn de geboorten van Perez: Perez verwekte Hezron;","Jes 11:10":"Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.","1 Kron 4:5":"Asschur nu, de vader van Thekoa, had twee vrouwen, Hela en Naära.","Jer 25:25":"En alle koningen van Zimri, en alle koningen van Elam, en alle koningen van Medië;","1 Kon 16:9":"En Zimri, zijn knecht, aanvoerder van de helft van de wagens, maakte een verbond tegen hem, toen hij te Thirza was, zich dronken drinkend in het huis van Arza, die hofmeester te Thirza was.","Gen 10:23":"En Arams zonen waren Uz, en Hul, en Gether, en Maz.","Gen 29:34":"En zij werd nog zwanger, en baarde een zoon, en zei: Nu zal mijn man zich ditmaal aan mij hechten, omdat ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.","Joz 15:21":"De steden nu, van het uiterste van de stam van de kinderen van Juda tot het gebied van Edom, tegen het zuiden, zijn: Kabzeel, en Eder, en Jagur,","1 Sam 17:12":"David nu was de zoon van de Efrathitische man uit Bethlehem-Juda, wiens naam Isaï was, en die acht zonen had, en in de dagen van Saul was hij een man, oud, hoogbejaard onder de mannen.","Jes 11:1":"Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.","Gen 30:18":"Toen zei Lea: God heeft mij mijn loon gegeven, omdat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar.","Ex 4:22":"Dan zult u tegen Farao zeggen: Zo zegt de HEERE: Mijn zoon, Mijn eerstgeborene, is Israël.","1 Kron 2:46-48":"En Efa, het bijwijf van Kaleb, baarde Haran, en Moza, en Gazez; en Haran verwekte Gazez. De kinderen van Jochdai nu waren Regem, en Jotham, en Gesan, en Pelet, en Efa, en Saaf. Uit het bijwijf Maächa verwekte Kaleb: Seber en Tirhana.","Joh 7:42":"Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?","1 Sam 26:1":"De Zifieten kwamen bij Saul in Gibea en zeiden: Houdt David zich niet verborgen op de heuvel van Hachila, tegenover de wildernis?","Neh 12:28":"Zo werden de kinderen van de zangers verzameld, zowel uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten;","Gen 38:16-18":"En hij ging naar haar toe, opzij van de weg, en zei: Kom toch, laat mij bij u ingaan; want hij wist niet dat zij zijn schoondochter was. En zij zei: Wat zult u mij geven, dat u bij mij ingaat? En hij zei: Ik zal u een geitenbokje uit de kudde sturen. En zij zei: Zult u mij een onderpand geven, totdat u het stuurt? Toen zei hij: Wat voor onderpand zal ik u geven? En zij zei: Uw zegelring en uw snoer en uw staf, die u in uw hand heeft; dat gaf hij haar, en hij ging bij haar in, en zij werd zwanger van hem.","Joz 17:1":"De stam van Manasse had ook een lot, omdat hij de eerstgeborene van Jozef was: te weten Machir, de eerstgeborene van Manasse, de vader van Gilead; omdat hij een krijgsman was, had hij Gilead en Bazan.","Ex 6:22":"En Aäron nam zich Eliseba, dochter van Amminadab, zuster van Nahesson, tot een vrouw; en zij baarde hem Nadab en Abihu, Eleazar en Ithamar.","Joz 16:2":"En het komt van Beth-el uit naar Luz; en het gaat door tot het gebied van de Archiet, tot Ataroth toe;","Ruth 4:18-20":"Dit nu zijn de geboorten van Perez: Perez verwekte Hezron; En Hezron verwekte Ram; en Ram verwekte Amminadab; En Amminadab verwekte Nahesson; en Nahesson verwekte Salma;","1 Kon 3:1":"En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.","1 Kon 16:15":"In het zevenentwintigste jaar van Asa, de koning van Juda, regeerde Zimri zeven dagen te Thirza; en het volk had zich gelegerd tegen Gibbethon, dat van de Filistijnen is.","Ex 36:2":"Want Mozes had Bezaleël en Aholiab geroepen, en ieder man die wijs van hart was, in wiens hart God wijsheid gegeven had, ieder wiens hart hem ertoe bewoog om naar het werk te gaan om dat te maken.","Gen 38:14":"Toen legde zij de kleren van haar weduwschap af, en bedekte zich met een sluier, en wikkelde zich in, en ging bij de ingang van de twee bronnen zitten, die aan de weg naar Timna liggen; want zij had gezien dat Sela groot geworden was, en dat zij hem niet tot vrouw was gegeven.","1 Sam 16:9":"Daarna liet Isaï Samma langslopen; doch hij zei: Ook deze heeft de HEERE niet uitgekozen.","2 Kron 1:5":"Ook was het koperen altaar, dat Bezaleël, de zoon van Uri, de zoon van Hur, gemaakt had, daar gezet voor de tabernakel van de HEERE; Salomo nu en de gemeente zochten het.","1 Kron 25:4":"Aangaande Heman: de kinderen van Heman waren Bukkia, Mattanja, Uzziël, Sebuël, en Jerimoth, Hananja, Hanani, Eliatha, Giddalti, en Romamthi-ezer, Josbekasa, Mallothi, Hothir, Mahazioth.","Num 1:10":"Van de kinderen van Jozef: van Efraïm, Elisama, de zoon van Ammihud; van Manasse, Gamaliël, de zoon van Pedazur.","Num 27:8":"En tegen de kinderen van Israël zult u zeggen: Wanneer iemand sterft, en geen zoon heeft, dan zult u zijn erfenis op zijn dochter laten overgaan.","Luk 3:33":"de zoon van Aminadab, de zoon van Aram, de zoon van Esrom, de zoon van Fares, de zoon van Juda,","Rom 15:12":"En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.","Ezra 10:22":"En van de kinderen van Pashur: Eljoenai, Maaseja, Ismaël, Nethaneel, Jozabad en Elasa.","Gen 35:23-26":"De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon. De zonen van Rachel: Jozef en Benjamin. En de zonen van Bilha, Rachels dienstmaagd: Dan en Naftali.","Ex 37:1":"Zo maakte Bezaleël de ark van acaciahout; twee en een halve el was haar lengte, anderhalve el haar breedte, en anderhalve el haar hoogte.","2 Sam 2:32":"En zij namen Asahel op, en begroeven hem in het graf van zijn vader, dat te Bethlehem was. Joab nu en zijn mannen gingen de hele nacht, tot het licht hun aanbrak te Hebron.","2 Sam 3:39":"Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.","1 Kron 4:9":"Jabez nu was aanzienlijker dan zijn broeders; en zijn moeder had hem Jabez genoemd, en zei: Want ik heb hem met smarten gebaard.","Gen 38:26":"En Juda herkende ze, en zei: Zij is rechtvaardiger dan ik, omdat ik haar niet aan mijn zoon Sela gegeven heb. En hij had daarna geen gemeenschap meer met haar.","1 Sam 16:6":"En het gebeurde, toen zij binnenkwamen, dat hij Eliab aanzag, en dacht: Zeker, deze staat hier voor de HEERE, Zijn gezalfde.","Ruth 4:22":"En Obed verwekte Isaï; en Isaï verwekte David.","Ruth 4:11":"En al het volk dat in de poort was, alsook de oudsten, zeiden: Wij zijn getuigen; de HEERE make deze vrouw, die in uw huis komt, als Rachel en als Lea, die beiden het huis van Israël gebouwd hebben; en handel kloek in Efratha, en maak uw naam vermaard in Bethlehem!","Jer 35:19":"Daarom, zo zegt de HEERE van de heerscharen, de God van Israël: Er zal Jonadab, de zoon van Rechab, geen man worden afgesneden, die voor Mijn aangezicht staat, al de dagen.","1 Kron 8:36":"En Achaz verwekte Jehoadda, en Jehoadda verwekte Alemeth, en Azmaveth, en Zimri; Zimri nu verwekte Moza;","1 Kron 4:21":"De kinderen van Sela, de zoon van Juda, waren Er, de vader van Lecha, en Lada, de vader van Maresa; en de huisgezinnen van het huis van de linnenwerkers in het huis Asbea.","Num 32:40":"Zo gaf Mozes Gilead aan Machir, de zoon van Manasse; en hij woonde daarin.","Matt 1:5":"en Salmon verwekte Boaz bij Rachab, en Boaz verwekte Obed bij Ruth, en Obed verwekte Isaï;","2 Sam 20:4-12":"Verder zei de koning tegen Amasa: Roep mij de mannen van Juda samen, tegen de derde dag; en u, stel u dan hier op. En Amasa ging heen om Juda bijeen te roepen; maar hij bleef langer weg dan de gezette tijd die hij hem gezet had. Toen zei David tegen Abisai: Nu zal Seba, de zoon van Bichri, ons meer kwaad doen dan Absalom; neem u de knechten van uw heer, en jaag hem achterna, opdat hij niet misschien vaste steden voor zich vindt, en zich aan onze ogen onttrekt.","Gen 29:32-35":"En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben. En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon. En zij werd nog zwanger, en baarde een zoon, en zei: Nu zal mijn man zich ditmaal aan mij hechten, omdat ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.","Jer 29:3":"Door de hand van Elasa, de zoon van Safan, en Gemarja, de zoon van Hilkia, die Zedekia, de koning van Juda, naar Babel zond, naar Nebukadnezar, de koning van Babel, en hij zei:","Gen 38:29":"Maar het gebeurde, toen hij zijn hand terugtrok, zie, dat zijn broer naar buiten kwam; en zij zei: Hoe bent u doorgebroken? Op u komt de breuk! En men noemde hem Perez.","2 Kon 10:23":"En Jehu kwam met Jonadab, de zoon van Rechab, in het huis van Baäl; en hij zei tot de dienaren van Baäl: Onderzoekt, en kijkt goed toe, dat hier misschien niemand bij u is van de dienaren van de HEERE, maar alleen van de dienaren van Baäl.","Ezra 7:6":"Deze Ezra trok op uit Babel; en hij was een vaardig schriftgeleerde in de wet van Mozes, die de HEERE, de God van Israël, gegeven heeft; en de koning gaf hem, naar de hand van de HEERE, zijn God, over hem, al zijn verzoek.","Ruth 2:4":"En zie, Boaz kwam van Bethlehem, en zei tegen de maaiers: De HEERE zij met u! En zij zeiden tegen hem: De HEERE zegent u!","1 Kron 4:1":"De kinderen van Juda waren Perez, Hezron en Charmi, en Hur, en Sobal.","Ex 1:5":"Alle zielen die uit Jakobs heup voortgekomen zijn, waren zeventig zielen; Jozef was echter al in Egypte.","1 Kron 9:6":"En van de kinderen van Zerah was Jeüel, en van hun broeders waren zeshonderd negentig.","Ruth 4:12":"En uw huis zij als het huis van Perez (die Thamar aan Juda baarde), door het nageslacht dat de HEERE u geven zal uit deze jonge vrouw.","Gen 35:23":"De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon.","Num 32:41":"Jaïr nu, de zoon van Manasse, ging op weg en nam hun dorpen in, en hij noemde die Havvoth-Jaïr.","1 Kon 11:19":"En Hadad vond grote genade in de ogen van Farao, zodat hij hem tot vrouw gaf de zuster van zijn eigen vrouw, de zuster van Tachpenes, de koningin.","Num 25:14":"De naam nu van de gedode Israëlitische man, die gedood werd met de Midianietische vrouw, was Zimri, de zoon van Salu, een leider van een vaderlijk huis van de Simeonieten.","1 Sam 16:11":"Vervolgens zei Samuël tegen Isaï: Zijn dit al de jongens? En hij zei: De jongste is nog over, en zie, hij weidt de schapen. Samuël zei toen tegen Isaï: Stuur iemand en laat hem halen; want wij zullen niet aan tafel gaan totdat hij hier gekomen is.","1 Sam 15:6":"En Saul liet de Kenieten zeggen: Ga weg, wijk, trek weg uit het midden van de Amalekieten, opdat ik u niet met hen wegruim; want u hebt barmhartigheid gedaan aan al de kinderen van Israël, toen zij uit Egypte optrokken. Zo weken de Kenieten uit het midden van de Amalekieten.","2 Kon 9:2":"Als u daar gekomen bent, kijk dan waar Jehu, de zoon van Josafat, de zoon van Nimsi, is; ga naar binnen, en laat hem opstaan uit het midden van zijn broeders, en breng hem in een binnenste kamer.","2 Sam 23:38":"Ira, de Jethriet; Gareb, de Jethriet;","Joz 19:24-31":"Toen kwam het vijfde lot uit voor de stam van de kinderen van Aser, naar hun huisgezinnen. En hun grens was Helkath, en Hali, en Beten, en Achsaf, En Allammelech, en Am-ad, en Mis-al; en zij reikt aan Karmel westwaarts, en aan Sichor-libnath;","Deut 21:23":"Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.","Gen 49:4-28":"Snelle afloop als van water, u zult niet de voortreffelijkste zijn! Want u hebt het bed van uw vader beklommen; toen hebt u het geschonden; hij heeft mijn bed beklommen! Simeon en Levi zijn broers! Hun wapens zijn werktuigen van geweld! Mijn ziel, kom niet in hun verborgen raad; mijn eer, wordt niet verenigd met hun vergadering! Want in hun toorn hebben zij de mannen doodgeslagen, en in hun moedwil hebben zij de ossen verlamd.","1 Sam 17:28":"Toen Eliab, zijn oudste broer, hem tegen die mannen hoorde spreken, ontstak de toorn van Eliab tegen David, en hij zei: Waarom bent u nu hierheen gekomen, en bij wie hebt u die paar schapen in de woestijn gelaten? Ik ken uw overmoed en de slechtheid van uw hart wel; want u bent gekomen om de strijd te zien.","Num 16:1":"Korach nu, de zoon van Jizhar, zoon van Kohath, zoon van Levi, nam tot zich zowel Dathan als Abiram, zonen van Eliab, en On, de zoon van Peleth, zonen van Ruben.","Jer 8:8":"Hoe zegt u dan: Wij zijn wijs en de wet van de HEERE is bij ons! Zie, waarlijk, tevergeefs werkt de valse pen van de schriftgeleerden.","Gen 38:2":"En Juda zag daar de dochter van een Kanaänitische man, wiens naam Sua was; en hij nam haar, en ging tot haar in.","1 Sam 17:12-14":"David nu was de zoon van de Efrathitische man uit Bethlehem-Juda, wiens naam Isaï was, en die acht zonen had, en in de dagen van Saul was hij een man, oud, hoogbejaard onder de mannen. En de drie oudste zonen van Isaï gingen op weg; zij volgden Saul na in de strijd. De namen nu van zijn drie zonen die in de strijd gingen, waren: Eliab, de eerstgeborene, en zijn tweede Abinadab, en de derde Samma. En David was de jongste; en de drie oudsten waren Saul nagevolgd.","1 Sam 16:10":"Zo liet Isaï zijn zeven zonen voor Samuël langslopen; doch Samuël zei tegen Isaï: De HEERE heeft dezen niet uitgekozen.","Ruth 4:17-22":"En de buurvrouwen gaven hem een naam en zeiden: Aan Naomi is een zoon geboren; en zij noemden zijn naam Obed; deze is de vader van Isaï, Davids vader. Dit nu zijn de geboorten van Perez: Perez verwekte Hezron; En Hezron verwekte Ram; en Ram verwekte Amminadab;","1 Kron 7:17":"De kinderen van Ulam nu waren Bedan; dezen zijn de kinderen van Gilead, de zoon van Machir, de zoon van Manasse.","Gen 38:13-30":"En men liet Thamar weten: Zie, uw schoonvader gaat naar Timna om zijn schapen te scheren. Toen legde zij de kleren van haar weduwschap af, en bedekte zich met een sluier, en wikkelde zich in, en ging bij de ingang van de twee bron const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
