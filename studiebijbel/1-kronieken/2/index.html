ra. Deze allen zijn vijf.","7":"En de kinderen van Charmi waren Achan, de beroerder van Israël, die zich aan het verbannene* vergreep.","8":"De kinderen van Ethan nu waren Azaria.","9":"En de kinderen van Hezron, die hem geboren zijn, waren Jerahmeel, en Ram, en Chelubai.","10":"Ram nu verwekte Amminadab, en Amminadab verwekte Nahesson, de vorst van de kinderen van Juda;","11":"En Nahesson verwekte Salma, en Salma verwekte Boaz,","12":"En Boaz verwekte Obed, en Obed verwekte Isaï,","13":"En Isaï verwekte Eliab, zijn eerstgeborene, en Abinadab, de tweede, en Simea, de derde,","14":"Nethaneel, de vierde, Raddai, de vijfde,","15":"Ozem, de zesde, David, de zevende.","16":"En hun zusters waren Zeruja en Abigaïl. De kinderen nu van Zeruja waren Abisai, en Joab, en Asa-el; drie.","17":"En Abigaïl baarde Amasa; en de vader van Amasa was Jether, een Ismaëliet.","18":"Kaleb nu, de zoon van Hezron, verwekte kinderen bij Azuba, *zijn* vrouw, en bij Jerioth. En de zonen van deze zijn: Jeser, en Sobab, en Ardon.","19":"Toen Azuba gestorven was, nam Kaleb voor zich Efrath, die baarde hem Hur.","20":"En Hur verwekte Uri, en Uri verwekte Bezaleël.","21":"Daarna ging Hezron naar de dochter van Machir, de vader van Gilead, en hij nam haar, toen hij zestig jaar oud was; en zij baarde hem Segub.","22":"Segub nu verwekte Jaïr; en hij had drieëntwintig steden in het land van Gilead.","23":"En hij nam Gesur en Aram, met de vlekken van Jaïr, van hen, met Kenath en haar onderhorige plaatsen, zestig steden. Deze allen zijn zonen van Machir, de vader van Gilead.","24":"En na de dood van Hezron, in Kaleb-efratha, heeft Abia, Hezrons huisvrouw, hem ook Asschur gebaard, de vader van Thekoa.","25":"De kinderen van Jerahmeel nu, de eerstgeborene van Hezron, waren *deze*: de eerstgeborene was Ram, daartoe Buna, en Oren, en Ozem *en* Ahia.","26":"Jerahmeel had nog een andere vrouw, wier naam was Atara; zij was de moeder van Onam.","27":"En de kinderen van Ram, de eerstgeborene van Jerahmeel, waren Maaz, en Jamin, en Eker.","28":"En de kinderen van Onam waren Sammai en Jada. En de kinderen van Sammai: Nadab en Abisur.","29":"De naam nu van de huisvrouw van Abisur was Abihaïl: die baarde hem Achban en Molid.","30":"En de kinderen van Nadab waren Seled en Appaïm; en Seled stierf zonder kinderen.","31":"En de kinderen van Appaïm waren Jisei; en de kinderen van Jisei waren Sesan; en de kinderen van Sesan, Achlai.","32":"En de kinderen van Jada, de broer van Sammai, waren Jether en Jonathan; en Jether is gestorven zonder kinderen.","33":"De kinderen van Jonathan nu waren Peleth en Zaza. Dit waren de kinderen van Jerahmeel.","34":"En Sesan had geen zonen, maar dochters. En Sesan had een Egyptische knecht, wiens naam was Jarha.","35":"Sesan nu gaf zijn dochter aan zijn knecht Jarha tot vrouw; en zij baarde hem Attai.","36":"Attai nu verwekte Nathan, en Nathan verwekte Zabad,","37":"En Zabad verwekte Eflal, en Eflal verwekte Obed,","38":"En Obed verwekte Jehu, en Jehu verwekte Azaria,","39":"En Azaria verwekte Helez, en Helez verwekte Elasa,","40":"En Elasa verwekte Sismai, en Sismai verwekte Sallum,","41":"En Sallum verwekte Jekamja, en Jekamja verwekte Elisama.","42":"De kinderen van Kaleb nu, de broer van Jerahmeel, zijn Mesa, zijn eerstgeborene (die is de vader van Zif), en de kinderen van Maresa, de vader van Hebron.","43":"De kinderen van Hebron nu waren Korah, en Tappuah, en Rekem, en Sema.","44":"Sema nu verwekte Raham, de vader van Jorkeam, en Rekem verwekte Sammai.","45":"De kinderen van Sammai nu waren Maon; en Maon was de vader van Beth-zur.","46":"En Efa, het bijwijf van Kaleb, baarde Haran, en Moza, en Gazez; en Haran verwekte Gazez.","47":"De kinderen van Jochdai nu waren Regem, en Jotham, en Gesan, en Pelet, en Efa, en Saaf.","48":"Uit het bijwijf Maächa verwekte Kaleb: Seber en Tirhana.","49":"En *de huisvrouw* van Saaf, de vader van Madmanna, baarde Seva, de vader van Machbena, en de vader van Gibea; en de dochter van Kaleb was Achsa.","50":"Dit waren de kinderen van Kaleb, de zoon van Hur, de eerstgeborene van Efratha: Sobal, de vader van Kirjath-jearim;","51":"Salma, de vader van de Bethlehemieten; Haref, de vader van Beth-gader.","52":"De kinderen van Sobal, de vader van Kirjath-jearim, waren Haroe *en* Hazihammenuchoth.","53":"En de geslachten van Kirjath-jearim waren de Jithrieten, en de Futhieten, en de Sumathieten, en de Misraieten; van dezen zijn uitgegaan de Zoraieten en de Esthaolieten.","54":"De kinderen van Salma waren de Bethlehemieten, en de Netofathieten, Atroth, Beth-joab, en de helft van de Manathieten, *en* de Zorieten.","55":"En de huisgezinnen van de schrijvers, die te Jabes woonden, de Tirathieten, de Simeathieten, de Suchathieten; dezen zijn de Kenieten, die gekomen zijn van Hammath, de vader van het huis van Rechab."},"SV":{"1":"Dezen zijn de kinderen van Israël: Ruben, Simeon, Levi en Juda, Issaschar en Zebulon,","2":"Dan, Jozef en Benjamin, Nafthali, Gad en Aser.","3":"De kinderen van Juda zijn: Er, en Onan, en Sela; drie zijn er hem geboren van de dochter van Sua, de Kanaänietische; en Er, de eerstgeborene van Juda, was kwaad in de ogen des HEEREN; daarom doodde Hij hem.","4":"Maar Thamar, zijn schoondochter, baarde hem Perez en Zerah. Al de zonen van Juda waren vijf.","5":"De kinderen van Perez waren Hezron en Hamul.","6":"En de kinderen van Zerah waren Zimri, en Ethan, en Heman, en Chalcol, en Dara. Deze allen zijn vijf.","7":"En de kinderen van Charmi waren Achan, de beroerder van Israël, die zich aan het verbannene vergreep.","8":"De kinderen van Ethan nu waren Azaria.","9":"En de kinderen van Hezron, die hem geboren zijn, waren Jerahmeel, en Ram, en Chelubai.","10":"Ram nu gewon Amminadab, en Amminadab gewon Nahesson, den vorst der kinderen van Juda;","11":"En Nahesson gewon Salma, en Salma gewon Boaz,","12":"En Boaz gewon Obed, en Obed gewon Isaï,","13":"En Isaï gewon Eliab, zijn eerstgeborene, en Abinadab, den tweede, en Simea, den derde,","14":"Nethaneel, den vierde, Raddai, den vijfde,","15":"Ozem, den zesde, David, den zevende.","16":"En hun zusters waren Zeruja en Abigaïl. De kinderen nu van Zeruja waren Abisai, en Joab, en Asa-el; drie.","17":"En Abigaïl baarde Amasa; en de vader van Amasa was Jether, een Ismaëliet.","18":"Kaleb nu, de zoon van Hezron, gewon kinderen uit Azuba, *zijn* vrouw, en uit Jerioth. En de zonen van deze zijn: Jeser, en Sobab, en Ardon.","19":"Als nu Azuba gestorven was, zo nam zich Kaleb Efrath, die baarde hem Hur.","20":"En Hur gewon Uri, en Uri gewon Bezaleël.","21":"Daarna ging Hezron in tot de dochter van Machir, den vader van Gilead, en hij nam ze, toen hij zestig jaren oud was; en zij baarde hem Segub.","22":"Segub nu gewon Jaïr; en hij had drie en twintig steden in het land van Gilead.","23":"En hij nam Gesur en Aram, met de vlekken van Jaïr, van dezelve, met Kenath en haar onderhorige plaatsen, zestig steden. Deze allen zijn zonen van Machir, den vader van Gilead.","24":"En na den dood van Hezron, in Kaleb-efratha, heeft Abia, Hezrons huisvrouw, hem ook gebaard Asschur, de vader van Thekoa.","25":"De kinderen van Jerahmeel nu, den eerstgeborene van Hezron, waren *deze*: de eerstgeborene was Ram, daartoe Buna, en Oren, en Ozem *en* Ahia.","26":"Jerahmeel had nog een andere vrouw, welker naam was Atara; zij was de moeder van Onam.","27":"En de kinderen van Ram, den eerstgeborene van Jerahmeel waren Maaz, en Jamin, en Eker.","28":"En de kinderen van Onam waren Sammai en Jada. En de kinderen van Sammai: Nadab en Abisur.","29":"De naam nu der huisvrouw van Abisur was Abihaïl: die baarde hem Achban en Molid.","30":"En de kinderen van Nadab waren Seled en Appaïm; en Seled stierf zonder kinderen.","31":"En de kinderen van Appaïm waren Jisei; en de kinderen van Jisei waren Sesan; en de kinderen van Sesan, Achlai.","32":"En de kinderen van Jada, den broeder van Sammai, waren Jether en Jonathan; en Jether is gestorven zonder kinderen.","33":"De kinderen van Jonathan nu waren Peleth en Zaza. Dit waren de kinderen van Jerahmeel.","34":"En Sesan had geen zonen, maar dochteren. En Sesan had een Egyptischen knecht, wiens naam was Jarha.","35":"Sesan nu gaf zijn dochter aan zijn knecht Jarha tot een vrouw; en zij baarde hem Attai.","36":"Attai nu gewon Nathan, en Nathan gewon Zabad,","37":"En Zabad gewon Eflal, en Eflal gewon Obed,","38":"En Obed gewon Jehu, en Jehu gewon Azaria,","39":"En Azaria gewon Helez, en Helez gewon Elasa,","40":"En Elasa gewon Sismai, en Sismai gewon Sallum,","41":"En Sallum gewon Jekamja, en Jekamja gewon Elisama.","42":"De kinderen van Kaleb nu, den broeder van Jerahmeel, zijn Mesa, zijn eerstgeborene ( die is de vader van Zif), en de kinderen van Maresa, den vader van Hebron.","43":"De kinderen van Hebron nu waren Korah, en Tappuah, en Rekem, en Sema.","44":"Sema nu gewon Raham, den vader van Jorkeam, en Rekem gewon Sammai.","45":"De kinderen van Sammai nu waren Maon; en Maon was de vader van Beth-zur.","46":"En Efa, het bijwijf van Kaleb, baarde Haran, en Moza, en Gazez; en Haran gewon Gazez.","47":"De kinderen van Jochdai nu waren Regem, en Jotham, en Gesan, en Pelet, en Efa, en Saaf.","48":"Uit het bijwijf Maacha gewon Kaleb: Seber en Tirhana.","49":"En *de* *huisvrouw* van Saaf, den vader van Madmanna, baarde Seva, den vader van Machbena, en den vader van Gibea; en de dochter van Kaleb was Achsa.","50":"Dit waren de kinderen van Kaleb, den zoon van Hur, den eerstgeborene van Efratha: Sobal, de vader van Kirjath-jearim;","51":"Salma, de vader der Bethlehemieten; Haref, de vader van Beth-gader.","52":"De kinderen van Sobal, den vader van Kirjath-jearim, waren Haroe *en* Hazihammenuchoth.","53":"En de geslachten van Kirjath-jearim waren de Jithrieten, en de Futhieten, en de Sumathieten, en de Misraieten; van dezen zijn uitgegaan de Zoraieten en de Esthaolieten.","54":"De kinderen van Salma waren de Bethlehemieten, en de Netofathieten, Atroth, Beth-joab, en de helft der Manathieten, *en* de Zorieten.","55":"En de huisgezinnen der schrijvers, die te Jabes woonden , de Tirathieten, de Simeathieten, de Suchathieten; dezen zijn de Kenieten, die gekomen zijn van Hammath, den vader van het huis van Rechab."},"KJV":{"1":"These are the sons of Israel; Reuben, Simeon, Levi, and Judah, Issachar, and Zebulun,","2":"Dan, Joseph, and Benjamin, Naphtali, Gad, and Asher.","3":"The sons of Judah; Er, and Onan, and Shelah: which three were born unto him of the daughter of Shua the Canaanitess. And Er, the firstborn of Judah, was evil in the sight of the LORD; and he slew him.","4":"And Tamar his daughter in law bare him Pharez and Zerah. All the sons of Judah were five.","5":"The sons of Pharez; Hezron, and Hamul.","6":"And the sons of Zerah; Zimri, and Ethan, and Heman, and Calcol, and Dara: five of them in all.","7":"And the sons of Carmi; Achar, the troubler of Israel, who transgressed in the thing accursed.","8":"And the sons of Ethan; Azariah.","9":"The sons also of Hezron, that were born unto him; Jerahmeel, and Ram, and Chelubai.","10":"And Ram begat Amminadab; and Amminadab begat Nahshon, prince of the children of Judah;","11":"And Nahshon begat Salma, and Salma begat Boaz,","12":"And Boaz begat Obed, and Obed begat Jesse,","13":"And Jesse begat his firstborn Eliab, and Abinadab the second, and Shimma the third,","14":"Nethaneel the fourth, Raddai the fifth,","15":"Ozem the sixth, David the seventh:","16":"Whose sisters were Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three.","17":"And Abigail bare Amasa: and the father of Amasa was Jether the Ishmeelite.","18":"And Caleb the son of Hezron begat children of Azubah his wife, and of Jerioth: her sons are these; Jesher, and Shobab, and Ardon.","19":"And when Azubah was dead, Caleb took unto him Ephrath, which bare him Hur.","20":"And Hur begat Uri, and Uri begat Bezaleel.","21":"And afterward Hezron went in to the daughter of Machir the father of Gilead, whom he married when he was threescore years old; and she bare him Segub.","22":"And Segub begat Jair, who had three and twenty cities in the land of Gilead.","23":"And he took Geshur, and Aram, with the towns of Jair, from them, with Kenath, and the towns thereof, even threescore cities. All these belonged to the sons of Machir the father of Gilead.","24":"And after that Hezron was dead in Calebephratah, then Abiah Hezron's wife bare him Ashur the father of Tekoa.","25":"And the sons of Jerahmeel the firstborn of Hezron were, Ram the firstborn, and Bunah, and Oren, and Ozem, and Ahijah.","26":"Jerahmeel had also another wife, whose name was Atarah; she was the mother of Onam.","27":"And the sons of Ram the firstborn of Jerahmeel were, Maaz, and Jamin, and Eker.","28":"And the sons of Onam were, Shammai, and Jada. And the sons of Shammai; Nadab, and Abishur.","29":"And the name of the wife of Abishur was Abihail, and she bare him Ahban, and Molid.","30":"And the sons of Nadab; Seled, and Appaim: but Seled died without children.","31":"And the sons of Appaim; Ishi. And the sons of Ishi; Sheshan. And the children of Sheshan; Ahlai.","32":"And the sons of Jada the brother of Shammai; Jether, and Jonathan: and Jether died without children.","33":"And the sons of Jonathan; Peleth, and Zaza. These were the sons of Jerahmeel.","34":"Now Sheshan had no sons, but daughters. And Sheshan had a servant, an Egyptian, whose name was Jarha.","35":"And Sheshan gave his daughter to Jarha his servant to wife; and she bare him Attai.","36":"And Attai begat Nathan, and Nathan begat Zabad,","37":"And Zabad begat Ephlal, and Ephlal begat Obed,","38":"And Obed begat Jehu, and Jehu begat Azariah,","39":"And Azariah begat Helez, and Helez begat Eleasah,","40":"And Eleasah begat Sisamai, and Sisamai begat Shallum,","41":"And Shallum begat Jekamiah, and Jekamiah begat Elishama.","42":"Now the sons of Caleb the brother of Jerahmeel were, Mesha his firstborn, which was the father of Ziph; and the sons of Mareshah the father of Hebron.","43":"And the sons of Hebron; Korah, and Tappuah, and Rekem, and Shema.","44":"And Shema begat Raham, the father of Jorkoam: and Rekem begat Shammai.","45":"And the son of Shammai was Maon: and Maon was the father of Bethzur.","46":"And Ephah, Caleb's concubine, bare Haran, and Moza, and Gazez: and Haran begat Gazez.","47":"And the sons of Jahdai; Regem, and Jotham, and Geshan, and Pelet, and Ephah, and Shaaph.","48":"Maachah, Caleb's concubine, bare Sheber, and Tirhanah.","49":"She bare also Shaaph the father of Madmannah, Sheva the father of Machbenah, and the father of Gibea: and the daughter of Caleb was Achsah.","50":"These were the sons of Caleb the son of Hur, the firstborn of Ephratah; Shobal the father of Kirjathjearim,","51":"Salma the father of Bethlehem, Hareph the father of Bethgader.","52":"And Shobal the father of Kirjathjearim had sons; Haroeh, and half of the Manahethites.","53":"And the families of Kirjathjearim; the Ithrites, and the Puhites, and the Shumathites, and the Mishraites; of them came the Zareathites, and the Eshtaulites.","54":"The sons of Salma; Bethlehem, and the Netophathites, Ataroth, the house of Joab, and half of the Manahethites, the Zorites.","55":"And the families of the scribes which dwelt at Jabez; the Tirathites, the Shimeathites, and Suchathites. These are the Kenites that came of Hemath, the father of the house of Rechab."}},"tsk":{"1":[{"kopje":"Israël","refs":["Gen 32:28","Gen 49:2"]},{"kopje":"Ruben","refs":["Gen 29:32-35","Gen 30:5-24","Gen 35:18","Gen 35:22-26","Gen 46:8-27","Gen 49:4-28","Ex 1:2-4","Num 1:5-15","Num 13:4-15","Num 26:5-65","Openb 7:5-8"]}],"2":[{"kopje":"Dan","refs":["Gen 30:6"]},{"kopje":"Jozef","refs":["Gen 30:24"]},{"kopje":"Benjamin","refs":["Gen 35:18"]},{"kopje":"Nafthali","refs":["Gen 30:8"]},{"kopje":"Gad","refs":["Gen 30:11"]},{"kopje":"Aser","refs":["Gen 30:13","Gen 35:26","Gen 46:17","Gen 49:20","Num 1:40","Num 1:41","Deut 33:24","Joz 19:24-31"]}],"3":[{"kopje":"en","refs":["1 Kron 9:5","Gen 38:2-10","Gen 46:12","Num 26:19"]}],"4":[{ l-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> whom he <span class=\"wl wl-kjv\" data-code=\"H3947\">married</span> when he was <span class=\"wl wl-kjv\" data-code=\"H8346\">threescore</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old;</span> and she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> him <span class=\"wl wl-kjv\" data-code=\"H7687\">Segub.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H7687\">Segub</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H2971\">Jair,</span> who had <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead.</span>","23":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H1650\">Geshur,</span> and <span class=\"wl wl-kjv\" data-code=\"H758\">Aram,</span> with the <span class=\"wl wl-kjv\" data-code=\"H2333\">towns</span> of <span class=\"wl wl-kjv\" data-code=\"H2971\">Jair,</span> from them, with <span class=\"wl wl-kjv\" data-code=\"H7079\">Kenath,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1323\">towns</span> thereof, even <span class=\"wl wl-kjv\" data-code=\"H8346\">threescore</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities.</span> All these belonged to the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4353\">Machir</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead.</span>","24":"And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that <span class=\"wl wl-kjv\" data-code=\"H2696\">Hezron</span> was <span class=\"wl wl-kjv\" data-code=\"H4194\">dead</span> in <span class=\"wl wl-kjv\" data-code=\"H3613\">Calebephratah,</span> then <span class=\"wl wl-kjv\" data-code=\"H29\">Abiah</span> <span class=\"wl wl-kjv\" data-code=\"H2696\">Hezron's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> him <span class=\"wl wl-kjv\" data-code=\"H806\">Ashur</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H8620\">Tekoa.</span>","25":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3396\">Jerahmeel</span> the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of <span class=\"wl wl-kjv\" data-code=\"H2696\">Hezron</span> were, <span class=\"wl wl-kjv\" data-code=\"H7410\">Ram</span> the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> and <span class=\"wl wl-kjv\" data-code=\"H946\">Bunah,</span> and <span class=\"wl wl-kjv\" data-code=\"H767\">Oren,</span> and <span class=\"wl wl-kjv\" data-code=\"H684\">Ozem,</span> and <span class=\"wl wl-kjv\" data-code=\"H281\">Ahijah.</span>","26":"<span class=\"wl wl-kjv\" data-code=\"H3396\">Jerahmeel</span> had also <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H5851\">Atarah;</span> she was the <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> of <span class=\"wl wl-kjv\" data-code=\"H208\">Onam.</span>","27":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7410\">Ram</span> the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of <span class=\"wl wl-kjv\" data-code=\"H3396\">Jerahmeel</span> were, <span class=\"wl wl-kjv\" data-code=\"H4619\"  wl-kjv\" data-code=\"H7967\">Shallum,</span>","41":"And <span class=\"wl wl-kjv\" data-code=\"H7967\">Shallum</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H3359\">Jekamiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3359\">Jekamiah</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H476\">Elishama.</span>","42":"Now the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3612\">Caleb</span> the <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> of <span class=\"wl wl-kjv\" data-code=\"H3396\">Jerahmeel</span> were, <span class=\"wl wl-kjv\" data-code=\"H4337\">Mesha</span> his <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> which was the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H2128\">Ziph;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4762\">Mareshah</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron.</span>","43":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron;</span> <span class=\"wl wl-kjv\" data-code=\"H7141\">Korah,</span> and <span class=\"wl wl-kjv\" data-code=\"H8599\">Tappuah,</span> and <span class=\"wl wl-kjv\" data-code=\"H7552\">Rekem,</span> and <span class=\"wl wl-kjv\" data-code=\"H8087\">Shema.</span>","44":"And <span class=\"wl wl-kjv\" data-code=\"H8087\">Shema</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H7357\">Raham,</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H3421\">Jorkoam:</span> and <span class=\"wl wl-kjv\" data-code=\"H7552\">Rekem</span> <span class=\"wl ">These</span> are the <span class=\"wl wl-kjv\" data-code=\"H7017\">Kenites</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> of <span class=\"wl wl-kjv\" data-code=\"H2574\">Hemath,</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7394\">Rechab.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"3":[{"catchword":"kinderen van Juda","tekst":"Ofschoon Juda de oudste onder de kinderen Jakobs niet is geweest, nochtans begint de schrijver van dit boek de beschrijving van het geslachtsregister der kinderen Jakobs van Juda af, zo ten aanzien der koninklijke waardigheid, die zijnen nakomelingen wordt beloofd, Gen 49:8 , alsook daarom, omdat Christus uit den stam van Juda zou geboren worden."}],"6":[{"catchword":"Zimri,","tekst":"Jos 7:1 wordt hij Zabdi genoemd, en was de vader van Charmi, van denwelken vs.7 gesproken wordt."},{"catchword":"en Dara","tekst":"Hij wordt Darda genoemd, 1Ki 4:31 ."}],"7":[{"catchword":"Achan,","tekst":"Jos 7:1 wordt hij Achan genoemd, maar hier Achar, dat is, beroerder, of verstoorder, zie Jos 7:25 ."},{"catchword":"de beroerder van Israël,","tekst":"Of, verstoorder."}],"8":[{"catchword":"De kinderen van Ethan","tekst":"Hier staat kinderen, of zonen in het getal van velen, daar nochtans maar een genoemd wordt, alzo ook Gen 46:23 ."}],"9":[{"catchword":"Ram,","tekst":"Hij wordt Aram genoemd, Mat 1:3 ; Luk 3:33 ."},{"catchword":"Chelúbai","tekst":"Anders, Kaleb, vs.18, 42."}],"11":[{"catchword":"Salma,","tekst":"Rth 4:21 , en Mat 1:4 , wordt hij Salmon genoemd."}],"13":[{"catchword":"Eliab,","tekst":"Anders, Elihu, 1Ch 27:18 ."},{"catchword":"Simea,","tekst":"Ook Samma, 1Sa 16:9 , genoemd."}],"15":[{"catchword":"den zevende","tekst":"1Sa 16:10-11 , en 1Sa 17:12 , worden acht zonen van Isaï geteld. Het kan zijn, dat een zonder kinderen na te laten gestorven mag zijn, of dat hij hier is uitgelaten om nadere redenen, ons onbekend."}],"16":[{"catchword":"Abigaïl","tekst":"Abigal, 2Sa 17:25 ."},{"catchword":"Abisai,","tekst":"Of, Abisai."}],"17":[{"catchword":"Jether,","tekst":"Anders, Jethro, hij wordt hier een Ismaëliet genoemd, omdat hij van het geslacht Ismaëls was, maar 2Sa 17:25 , wordt hij een Israëliet genoemd, omdat hij de Israëlietische religie had aangenomen."}],"18":[{"catchword":"Kaleb","tekst":"Hij is die Kaleb niet, dien Mozes heeft uitgezonden om het land Kanaän te verspieden, Num 13:6 , want die was de zoon van Jefunne, van welken hierna 1Ch 4:15 zal gesproken worden; maar in dit 18 vs. wordt gesproken van Kaleb, den zoon van Hezron, en hij wordt vs.9 genoemd Chelubai."},{"catchword":"de zonen van deze","tekst":"Te weten, die hij bij Jerioth gewonnen heeft; want de kinderen, die hij bij Azuba gewonnen heeft, worden hierna vs.42 verhaald."}],"21":[{"catchword":"ging Hezron in","tekst":"Dat is, hij besliep haar, of hij bekende haar, gelijk de Heilige Schrift spreekt, Gen 4:1 , en Gen 6:4 ."},{"catchword":"Machir,","tekst":"Hij is geweest een zoon van Manasse."},{"catchword":"vader van Gilead,","tekst":"Dat is, naar sommiger gevoelen, zoveel als hoofd, overste, regent. Alzo in verscheidene volgende plaatsen. Anderen verstaan hier door Gilead den eigenlijken zoon van Machir. Zie Num 26:29-30 , alzo onder, 1Ch 7:14 ."},{"catchword":"toen hij","tekst":"Hebreeuws, toen hij een zoon was van zestig jaar."}],"22":[{"catchword":"Jaïr;","tekst":"Die een zoon van Manasse genoemd wordt, Num 32:41 , omdat zijn grootmoeder van den stam van Manasse was, te weten een dochter van Machir, vs.21. Doch Machir was een zoon van Manasse; Num 26:29 ."}],"23":[{"catchword":"Kenath,","tekst":"Een Nobach heeft deze stad ingenomen, Num 32:42 . Dit is eertijds een machtige stad geweest, gelijk daaraan blijkt, dat zij zestig steden onder haar gebied gehad heeft."},{"catchword":"onderhorige","tekst":"Hebreeuws, dochters, gelijk elders dikwijls."},{"catchword":"Deze allen","tekst":"Te wet (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
