a, de dochter van Thalmai, de koning te Gesur; de vierde Adonia, de zoon van Haggith;","3":"De vijfde Sefatja, van Abital; de zesde Jithream, van zijn huisvrouw Egla.","4":"Zes zijn hem te Hebron geboren; want hij regeerde daar zeven jaren en zes maanden; en drie en dertig jaren regeerde hij te Jeruzalem.","5":"Dezen nu zijn hem te Jeruzalem geboren: Simea, en Sobab, en Nathan, en Salomo; *deze* vier zijn van Bath-sua, de dochter van Ammiël;","6":"Daartoe Jibchar, en Elisama, en Elifelet,","7":"En Nogah, en Nefeg, en Jafia,","8":"En Elisama, en Eljada, en Elifelet, negen.","9":"*Deze* allen zijn zonen van David, behalve de kinderen der bijwijven, en Thamar hun zuster.","10":"Salomo’s zoon nu was Rehabeam; zijn zoon was Abia; zijn zoon was Asa; zijn zoon was Josafat;","11":"Zijn zoon was Joram; zijn zoon was Ahazia; zijn zoon was Joas;","12":"Zijn zoon was Amazia; zijn zoon was Azaria; zijn zoon was Jotham;","13":"Zijn zoon was Achaz; zijn zoon was Hizkia; zijn zoon was Manasse;","14":"Zijn zoon was Amon; zijn zoon was Josia.","15":"De zonen van Josia nu waren *dezen*: de eerstgeborene Johanan, de tweede Jojakim, de derde Zedekia, de vierde Sallum.","16":"De kinderen van Jojakim nu waren: Jechonia zijn zoon, Zedekia zijn zoon.","17":"En de kinderen van Jechonia waren Assir; zijn zoon was Sealthiël;","18":"Dezes *zonen* waren Malchiram, en Pedaja, en Senazar, Jekamja, Hosama en Nedabja.","19":"De kinderen van Pedaja nu waren Zerubbabel en Simeï; en de kinderen van Zerubbabel waren Mesullam en Hananja; en Selomith was hunlieder zuster;","20":"En Hasuba, en Ohel, en Berechja, en Hasadja, Jusabhesed; vijf.","21":"De kinderen van Hananja nu waren Pelatja en Jesaja. De kinderen van Refaja, de kinderen van Arnan, de kinderen van Obadja, de kinderen van Sechanja.","22":"De kinderen nu van Sechanja waren Semaja; en de kinderen van Semaja waren Hattus, en Jigeal, en Bariah, en Nearja, en Safat; zes.","23":"En de kinderen van Nearja waren Eljoenai, en Hizkia, en Azrikam; drie.","24":"En de kinderen van Eljoenai waren Hodajeva, en Eljasib, en Pelaja, en Akkub, en Johanan, en Delaja, en Anani; zeven."},"KJV":{"1":"Now these were the sons of David, which were born unto him in Hebron; the firstborn Amnon, of Ahinoam the Jezreelitess; the second Daniel, of Abigail the Carmelitess:","2":"The third, Absalom the son of Maachah the daughter of Talmai king of Geshur: the fourth, Adonijah the son of Haggith:","3":"The fifth, Shephatiah of Abital: the sixth, Ithream by Eglah his wife.","4":"These six were born unto him in Hebron; and there he reigned seven years and six months: and in Jerusalem he reigned thirty and three years.","5":"And these were born unto him in Jerusalem; Shimea, and Shobab, and Nathan, and Solomon, four, of Bathshua the daughter of Ammiel:","6":"Ibhar also, and Elishama, and Eliphelet,","7":"And Nogah, and Nepheg, and Japhia,","8":"And Elishama, and Eliada, and Eliphelet, nine.","9":"These were all the sons of David, beside the sons of the concubines, and Tamar their sister.","10":"And Solomon's son was Rehoboam, Abia his son, Asa his son, Jehoshaphat his son,","11":"Joram his son, Ahaziah his son, Joash his son,","12":"Amaziah his son, Azariah his son, Jotham his son,","13":"Ahaz his son, Hezekiah his son, Manasseh his son,","14":"Amon his son, Josiah his son.","15":"And the sons of Josiah were, the firstborn Johanan, the second Jehoiakim, the third Zedekiah, the fourth Shallum.","16":"And the sons of Jehoiakim: Jeconiah his son, Zedekiah his son.","17":"And the sons of Jeconiah; Assir, Salathiel his son,","18":"Malchiram also, and Pedaiah, and Shenazar, Jecamiah, Hoshama, and Nedabiah.","19":"And the sons of Pedaiah were, Zerubbabel, and Shimei: and the sons of Zerubbabel; Meshullam, and Hananiah, and Shelomith their sister:","20":"And Hashubah, and Ohel, and Berechiah, and Hasadiah, Jushabhesed, five.","21":"And the sons of Hananiah; Pelatiah, and Jesaiah: the sons of Rephaiah, the sons of Arnan, the sons of Obadiah, the sons of Shechaniah.","22":"And the sons of Shechaniah; Shemaiah: and the sons of Shemaiah; Hattush, and Igeal, and Bariah, and Neariah, and Shaphat, six.","23":"And the sons of Neariah; Elioenai, and Hezekiah, and Azrikam, three.","24":"And the sons of Elioenai were, Hodaiah, and Eliashib, and Pelaiah, and Akkub, and Johanan, and Dalaiah, and Anani, seven."}},"tsk":{"1":[{"kopje":"de kinderen van David","refs":["2 Sam 3:2-5"]},{"kopje":"Amnon","refs":["2 Sam 13:1","2 Sam 13:29"]},{"kopje":"Ahinoam","refs":["1 Sam 25:42","1 Sam 25:43","1 Sam 27:3"]},{"kopje":"Jizreëlietische","refs":["Joz 15:56"]},{"kopje":"Daniël","refs":["2 Sam 3:3"]},{"kopje":"van Abigaïl","refs":["1 Sam 25:39-42"]}],"2":[{"kopje":"Absalom","refs":["2 Sam 13:1","2 Sam 13:20-28","2 Sam 13:38","2 Sam 18:14","2 Sam 18:18","2 Sam 18:33","2 Sam 19:4-10"]},{"kopje":"Gesur","refs":["1 Kron 2:23","Joz 13:13","2 Sam 14:23","2 Sam 14:32","2 Sam 15:8"]},{"kopje":"Adonia","refs":["2 Sam 3:4","1 Kon 1:5","1 Kon 2:24","1 Kon 2:25"]}],"3":[{"kopje":"Egla","refs":["2 Sam 6:23","2 Sam 3:5"]}],"4":[{"kopje":"hij regeerde daar","refs":["2 Sam 2:11","2 Sam 5:4","2 Sam 5:5","1 Kon 2:11"]},{"kopje":"in Jeruzalem","refs":["2 Sam 5:4","2 Sam 5:14-16"]}],"5":[{"kopje":"Simea","refs":["1 Kron 14:4","2 Sam 5:14"]},{"kopje":"Nathan","refs":["2 Sam 7:2-4","2 Sam 12:1-15","Luk 3:31"]},{"kopje":"Salomo","refs":["1 Kron 28:5","1 Kron 28:6","2 Sam 12:24","2 Sam 12:25"]},{"kopje":"Bath-Sua","refs":["2 Sam 11:3","Matt 1:6"]},{"kopje":"Ammiël","refs":["2 Sam 11:3"]}],"6":[{"kopje":"Elisama","refs":["1 Kron 14:5","2 Sam 5:15"]},{"kopje":"Elifelet","refs":["1 Sam 14:5"]}],"7":[{"kopje":"Nogah","refs":["2 Sam 5:15","2 Sam 5:16"]}],"8":[{"kopje":"Eljada","refs":["1 Kron 14:7"]},{"kopje":"Elifelet","refs":["1 Kron 14:7","2 Sam 5:14-16"]}],"9":[{"kopje":"de bijvrouwen","refs":["2 Sam 5:13"]},{"kopje":"Thamar","refs":["2 Sam 13:1-20"]}],"10":[{"kopje":"Rehabeam","refs":["1 Kon 11:43","1 Kon 14:31","1 Kon 15:6","Matt 1:7"]},{"kopje":"Abia","re oenai","href":"../../nave/e/?hl=1Chr.3.24#i6031","refs":[{"disp":"1 Kron 3:24","href":"../../1-kronieken/3/#v24","ref":"1 Kron 3:24","svLabel":null}],"kinderen":[]}]},{"topic":"Elioenai","href":"../../nave/e/#t-elioenai","kinderen":[{"label":"5. Son of Neariah","href":"../../nave/e/?hl=1Chr.3.24#i6102","refs":[{"disp":"1 Kron 3:23","href":"../../1-kronieken/3/#v23","ref":"1 Kron 3:23","svLabel":null},{"disp":"1 Kron 3:24","href":"../../1-kronieken/3/#v24","ref":"1 Kron 3:24","svLabel":null}],"kinderen":[]}]},{"topic":"Hodaiah","href":"../../nave/h/#t-hodaiah","kinderen":[{"label":"Son of Elioenai","href":"../../nave/h/?hl=1Chr.3.24#i8892","refs":[{"disp":"1 Kron 3:24","href":"../../1-kronieken/3/#v24","ref":"1 Kron 3:24","svLabel":null}],"kinderen":[]}]},{"topic":"Johanan","href":"../../nave/j/#t-johanan","kinderen":[{"label":"3. A son of Elioenai","href":"../../nave/j/?hl=1Chr.3.24#i11587","refs":[{"disp":"1 Kron 3:24","href":"../../1-kronieken/3/#v24","ref":"1 Kron 3:24","svLabel":null}],"kinderen":[]}]},{"topic":"Pelaiah","href":"../../nave/p/#t-pelaiah","kinderen":[{"label":"1. Son of Elioenai","href":"../../nave/p/?hl=1Chr.3.24#i15432","refs":[{"disp":"1 Kron 3:24","href":"../../1-kronieken/3/#v24","ref":"1 Kron 3:24","svLabel":null}],"kinderen":[]}]}]}},"extern":{"2 Sam 13:1-20":"Het gebeurde daarna dat Absalom, Davids zoon, een mooie zuster had, wier naam Thamar was, en Amnon, Davids zoon, kreeg haar lief. En Amnon werd zo door haar in beslag genomen dat hij er ziek van werd, vanwege zijn zuster Thamar; want zij was een maagd, zodat het in Amnons ogen onmogelijk leek haar iets te doen. Maar Amnon had een vriend, wiens naam Jonadab was, een zoon van Simea, Davids broer; en Jonadab was een zeer sluwe man.","2 Sam 14:32":"En Absalom zei tegen Joab: Zie, ik heb naar u gestuurd, en gezegd: Kom hierheen, zodat ik u naar de koning kan sturen, om te zeggen: Waarom ben ik uit Gesur gekomen? Het was beter voor mij geweest, als ik daar nog was; nu dan, laat mij het gezicht van de koning zien; en is er dan nog een misdaad in mij, laat hij mij dan doden.","2 Sam 3:4":"en de vierde, Adonia, de zoon van Haggith; en de vijfde Sefatja, de zoon van Abital;","2 Kron 34:1":"Josia was acht jaar oud, toen hij koning werd, en hij regeerde eenendertig jaar te Jeruzalem.","2 Kron 17:1":"En zijn zoon Josafat werd koning in zijn plaats, en hij maakte zich sterk tegen Israël.","1 Kon 22:51":"En Josafat ontsliep met zijn vaderen, en werd bij zijn vaderen begraven in de stad van zijn vader David; en zijn zoon Joram werd koning in zijn plaats.","2 Kron 25:1":"Amazia werd koning toen hij vijfentwintig jaar oud was, en hij regeerde negenentwintig jaar in Jeruzalem; en de naam van zijn moeder was Joaddan, van Jeruzalem.","1 Kon 14:31":"En Rehabeam ontsliep met zijn vaderen, en werd begraven bij zijn vaderen in de stad van David; en de naam van zijn moeder was Naäma, de Ammonietische; en zijn zoon Abiam regeerde in zijn plaats.","1 Kron 22:1-6":"En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn. En David zei dat men de vreemdelingen moest verzamelen die in het land Israël waren; en hij stelde steenhouwers aan om stenen uit te houwen, om het huis van God te bouwen. En David bereidde ijzer in overvloed, voor de nagelen aan de deuren van de poorten en voor de verbindingen; ook koper in overvloed, zonder gewicht;","2 Kon 23:34":"Ook maakte Farao Necho Eljakim, de zoon van Josia, koning, in de plaats van zijn vader Josia, en veranderde zijn naam in Jojakim; maar Joahaz nam hij mee, en hij kwam in Egypte, en stierf daar.","1 Kron 14:7":"En Elisama, en Beëljada, en Elifelet.","2 Sam 12:24":"Daarna troostte David zijn vrouw Bathseba, en ging naar haar toe, en lag bij haar; en zij baarde een zoon, wiens naam zij Salomo noemde; en de HEERE had hem lief,","1 Sam 14:5":"De ene rots lag naar het noorden, tegenover Michmas, en de andere naar het zuiden, tegenover Geba.","2 Sam 13:38":"Zo vluchtte Absalom, en ging naar Gesur; en hij was daar drie jaar.","2 Kron 33:20":"En Manasse ontsliep met zijn vaderen, en zij begroeven hem in zijn huis; en zijn zoon Amon werd koning in zijn plaats.","1 Kron 14:4":"Dit nu zijn de namen van de kinderen die hij te Jeruzalem had: Sammua, en Sobab, Nathan en Salomo,","2 Kon 16:1":"In het zeventiende jaar van Pekah, de zoon van Remalia, werd Achaz koning, de zoon van Jotham, de koning van Juda.","2 Kon 8:16":"In het vijfde jaar van Joram, de zoon van Achab, de koning van Israël, toen Josafat koning was van Juda, begon Jehoram, de zoon van Josafat, de koning van Juda, te regeren.","2 Kon 11:21":"Joas was zeven jaar oud, toen hij koning werd.","2 Kon 23:31":"Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem; en de naam van zijn moeder was Hamutal, de dochter van Jeremia, van Libna.","Matt 1:6":"en Isaï verwekte David, de koning; en David, de koning, verwekte Salomo bij haar die de vrouw van Uria geweest was;","2 Kon 16:20":"En Achaz ontsliep met zijn vaderen, en werd begraven bij zijn vaderen, in de stad van David; en Hizkia, zijn zoon, werd koning in zijn plaats.","Hagg 2:3":"Spreek nu tot Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en tot Josua, de zoon van Jozadak, de hogepriester, en tot het overblijfsel van het volk. Zeg:","1 Kron 12:23-40":"En dit zijn de aantallen van de aanvoerders van hen die toegerust waren voor het leger, die naar David te Hebron kwamen om het koninkrijk van Saul aan hem over te dragen, naar het woord van de HEERE: Van de kinderen van Juda, die rond schild en speer droegen, waren zesduizend achthonderd toegerust voor het leger; Van de kinderen van Simeon, kloeke helden voor het leger, zevenduizend honderd;","1 Kron 3:5-8":"Dit nu zijn hem in Jeruzalem geboren: Simea, en Sobab, en Nathan, en Salomo; deze vier zijn van Bath-Sua, de dochter van Ammiël; daartoe Jibchar, en Elisama, en Elifelet, en Nogah, en Nefeg, en Jafia,","1 Kron 28:5":"En uit al mijn zonen (want de HEERE heeft mij veel zonen gegeven) heeft Hij mijn zoon Salomo verkoren, dat hij zou zitten op de troon van het koninkrijk van de HEERE over Israël.","1 Kon 15:6":"En er was oorlog geweest tussen Rehabeam en Jerobeam, al de dagen van zijn leven.","1 Kon 11:43":"Daarna ontsliep Salomo met zijn vaderen, en werd begraven in de stad van zijn vader David; en Rehabeam, zijn zoon, werd koning in zijn plaats.","Luk 3:31":"de zoon van Meleas, de zoon van Mainan, de zoon van Mattatha, de zoon van Nathan, de zoon van David,","2 Kron 33:1":"Manasse was twaalf jaar oud, toen hij koning werd, en hij regeerde vijfenvijftig jaar te Jeruzalem.","2 Sam 3:2":"En David werden zonen geboren in Hebron. Zijn eerstgeborene was Amnon, van Ahinoam, de Jizreëlietische;","2 Sam 13:29":"En Absaloms knechten deden met Amnon zoals Absalom geboden had. Toen stonden alle zonen van de koning op, en reden ieder op zijn muildier, en vluchtten.","Matt 1:8":"en Asa verwekte Josafat, en Josafat verwekte Joram, en Joram verwekte Uzzia;","2 Sam 18:18":"Absalom nu had tijdens zijn leven voor zichzelf een gedenkzuil opgericht, die in het koningsdal staat; want hij zei: Ik heb geen zoon om aan mijn naam te doen denken; en hij had die zuil naar zijn eigen naam genoemd; daarom wordt die tot op deze dag Absaloms hand genoemd.","2 Sam 15:8":"Want uw knecht heeft een gelofte gedaan, toen ik te Gesur in Syrië woonde, en zei: Als de HEERE mij werkelijk terug naar Jeruzalem zal brengen, dan zal ik de HEERE dienen.","2 Sam 5:13":"En David nam nog meer bijvrouwen en vrouwen uit Jeruzalem, nadat hij uit Hebron gekomen was; en David werden nog meer zonen en dochters geboren.","2 Kron 26:21-23":"Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land. Het overige nu van de geschiedenissen van Uzzia, de eerste en de laatste, heeft de profeet Jesaja, de zoon van Amos, beschreven. En Uzzia ontsliep met zijn vaderen, en zij begroeven hem bij zijn vaderen, in het veld van de begrafenis dat van de koningen was; want zij zeiden: hij is melaats; en zijn zoon Jotham werd koning in zijn plaats.","2 Kon 24:6":"En Jojakim ontsliep met zijn vaderen; en zijn zoon Jojachin werd koning in zijn plaats.","2 Kon 18:2":"Vijfentwintig jaar was hij oud, toen hij koning werd, en hij regeerde negenentwintig jaar te Jeruzalem, en de naam van zijn moeder was Abi, een dochter van Zacharia.","2 Sam 5:5":"In Hebron regeerde hij over Juda zeven jaar en zes maanden; en in Jeruzalem regeerde hij drieëndertig jaar over heel Israël en Juda.","Hagg 2:24":"Op die dag, spreekt de HEERE van de heerscharen, zal Ik u nemen, Zerubbabel, zoon van Sealthiël, Mijn dienstknecht! spreekt de HEERE, en Ik zal u stellen als een zegelring; want Ik heb u verkozen, spreekt de HEERE van de heerscharen.","Matt 1:11":"en Josia verwekte Jechonia en zijn broers, ten tijde van de Babylonische wegvoering.","Ezra 3:2":"En Jesua, de zoon van Jozadak, maakte zich op, en zijn broeders, de priesters, en Zerubbabel, de zoon van Sealthiël, en zijn broeders, en zij bouwden het altaar van de God van Israël, om daarop brandoffers te offeren, zoals geschreven is in de wet van Mozes, de man Gods.","2 Sam 6:23":"Michal nu, de dochter van Saul, had geen kind, tot de dag van haar dood toe.","Ezra 2:2":"Die kwamen met Zerubbabel: Jesua, Nehemia, Seraja, Reelaja, Mordechai, Bilsan, Mizpar, Bigvai, Rehum en Baëna. Dit is het aantal mannen van het volk van Israël.","1 Kon 2:11":"De dagen nu dat David over Israël geregeerd heeft, zijn veertig jaar; zeven jaar heeft hij geregeerd in Hebron, en in Jeruzalem heeft hij drieëndertig jaar geregeerd.","2 Kron 36:9":"Acht jaar was Jojachin oud, toen hij koning werd, en hij regeerde drie maanden en tien dagen te Jeruzalem, en deed wat slecht was in de ogen van de HEERE.","1 Kon 15:24":"En Asa ontsliep met zijn vaderen, en werd begraven met zijn vaderen, in de stad van zijn vader David; en zijn zoon Josafat werd koning in zijn plaats.","2 Kron 36:10":"En bij de terugkeer van het jaar zond koning Nebukadnezar heen, en liet hem naar Babel halen, met de kostbare voorwerpen van het huis van de HEERE; en hij maakte zijn broer Zedekia koning over Juda en Jeruzalem.","Matt 1:7":"en Salomo verwekte Rehabeam, en Rehabeam verwekte Abia, en Abia verwekte Asa;","2 Kron 26:1":"Toen nam heel het volk van Juda Uzzia (die nu zestien jaar oud was), en maakte hem koning in de plaats van zijn vader Amazia.","1 Kon 2:25":"En de koning Salomo stuurde Benaja, de zoon van Jojada; die viel op hem aan, zodat hij stierf.","2 Kon 25:27":"Het gebeurde daarna in het zevenendertigste jaar van de wegvoering van Jojachin, de koning van Juda, in de twaalfde maand, op de zevenentwintigste van de maand, dat Evilmerodach, de koning van Babel, in het jaar dat hij koning werd, het hoofd van Jojachin, de koning van Juda, uit de gevangenis verhief.","1 Sam 25:43":"Ook nam David Ahinoam van Jizreël; zo werden ook die beiden hem tot vrouwen.","Hagg 1:12":"Toen luisterden Zerubbabel, de zoon van Sealthiël, en Josua, de zoon van Jozadak, de hogepriester, en heel het overblijfsel van het volk, naar de stem van de HEERE, hun God, en naar de woorden van de profeet Haggai, zoals de HEERE, hun God, hem gezonden had; en het volk vreesde voor het aangezicht van de HEERE.","1 Sam 27:3":"En David bleef bij Achis in Gath, hij en zijn mannen, ieder met zijn huisgezin; David met zijn beide vrouwen, Ahinoam, de Jizreëlietische, en Abigaïl, de vrouw van Nabal, de Karmelietische.","2 Sam 5:14-16":"En dit zijn de namen van hen die hem in Jeruzalem geboren zijn: Schammua, en Schobab, en Nathan, en Salomo. En Ibchar, en Elischua, en Nefeg, en Jafia, En Elischama, en Eljada, en Elifeleth.","Hagg 1:14":"En de HEERE wekte de geest op van Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en de geest van Josua, de zoon van Jozadak, de hogepriester, en de geest van heel het overblijfsel van het volk; en zij kwamen en gingen aan het werk in het huis van de HEERE van de heerscharen, hun God,","2 Kron 21:5":"Tweeëndertig jaar was Joram oud toen hij koning werd, en hij regeerde acht jaar in Jeruzalem.","2 Kon 8:24":"En Joram stierf en werd bij zijn voorvaderen begraven, in de stad van David; en Ahazia, zijn zoon, werd koning in zijn plaats.","2 Sam 14:23":"Zo maakte Joab zich op, en ging naar Gesur; en hij bracht Absalom naar Jeruzalem.","2 Kon 15:38":"En Jotham stierf en werd bij zijn voorouders begraven in de stad van zijn vader David; en zijn zoon Achaz werd koning in zijn plaats.","1 Kon 1:5":"Adonia nu, de zoon van Haggith, verhief zich en zei: Ik zal koning zijn; en hij bereidde zich wagens en ruiters, en vijftig mannen die voor hem uit liepen.","2 Kron 14:1":"Zo ontsliep Abia met zijn vaderen, en zij begroeven hem in de stad van David, en zijn zoon Asa werd koning in zijn plaats. In zijn dagen was het land tien jaren stil.","1 Kron 14:5":"En Jibchar, en Elisua, en Elpelet,","2 Kron 29:1":"Hizkia werd koning toen hij vijfentwintig jaar oud was, en regeerde negenentwintig jaar in Jeruzalem; en de naam van zijn moeder was Abia, een dochter van Zacharia.","Jer 22:24":"Zo waarachtig als Ik leef, spreekt de HEERE, al was Chonia, de zoon van Jojakim, de koning van Juda, een zegelring aan Mijn rechterhand, toch zal Ik u vandaar wegrukken.","2 Kron 13:1":"In het achttiende jaar van koning Jerobeam werd Abia koning over Juda.","2 Kon 21:1":"Manasse was twaalf jaar oud, toen hij koning werd, en hij regeerde vijfenvijftig jaar te Jeruzalem; en de naam van zijn moeder was Hefzi-bah.","2 Kon 23:30":"En zijn knechten voerden hem dood op een wagen van Megiddo, en brachten hem naar Jeruzalem, en begroeven hem in zijn graf; en het volk van het land nam Joahaz, de zoon van Josia, en zalfde hem, en maakte hem koning in de plaats van zijn vader.","Joz 15:56":"en Jizreël, en Jokdeam, en Zanoah,","1 Kron 29:27":"De dagen nu dat hij over Israël geregeerd heeft, zijn veertig jaar; in Hebron regeerde hij zeven jaar, en in Jeruzalem regeerde hij drieëndertig jaar.","2 Sam 3:5":"en de zesde, Jithream, van Egla, Davids vrouw. Deze zonen werden David geboren in Hebron.","2 Kon 14:21":"En het hele volk van Juda nam Azaria (die toen zestien jaar oud was), en maakte hem koning in de plaats van zijn vader Amazia.","Hagg 2:5":"Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen;","Ezra 5:2":"Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.","1 Sam 25:42":"Abigaïl nu haastte zich, en maakte zich op, en zij reed op een ezel, met haar vijf jonge dienaressen, die haar voetstappen navolgden; zij dan volgde de boden van David na, en zij werd hem tot vrouw.","Matt 1:9":"en Uzzia verwekte Jotham, en Jotham verwekte Achaz, en Achaz verwekte Hizkia;","2 Sam 7:2-4":"Dat de koning zei tegen de profeet Nathan: Zie toch, ik woon in een huis van cederhout, en de ark van God woont in het midden van de tentkleden. En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei:","1 Sam 25:39-42":"Toen David hoorde dat Nabal dood was, zei hij: Gezegend zij de HEERE, Die de twist om mijn smaad getwist heeft met de hand van Nabal, en Zijn knecht onthouden heeft van het kwade, en dat de HEERE het kwaad van Nabal op zijn eigen hoofd heeft doen wederkeren! En David zond heen, en liet met Abigaïl spreken, om haar tot vrouw te nemen. Toen de knechten van David bij Abigaïl gekomen waren te Karmel, spraken zij tegen haar en zeiden: David heeft ons tot u gezonden, om u tot vrouw te nemen. Toen stond zij op, en boog zich met het aangezicht ter aarde, en zij zei: Zie, uw dienstmaagd zij een dienares, om de voeten van de knechten van mijn heer te wassen.","2 Sam 11:3":"En David zond iemand, en liet naar deze vrouw navragen; en men zei: Is dat niet Bathseba, de dochter van Eliam, de vrouw van Uria, de Hethiet?","2 Sam 3:3":"en zijn tweede was Chileab, van Abigaïl, de vrouw van Nabal, de Karmeliet; en de derde, Absalom, de zoon van Maächa, de dochter van Thalmai, koning van Gesur;","2 Kron 24:1":"Joas was zeven jaar oud, toen hij koning werd, en hij regeerde veertig jaar te Jeruzalem; en de naam van zijn moeder was Zibja, van Ber-seba.","Matt 1:10":"en Hizkia verwekte Manasse, en Manasse verwekte Amon, en Amon verwekte Josia;","2 Kon 22:1":"Josia was acht jaar oud, toen hij koning werd, en regeerde eenendertig jaar te Jeruzalem; en de naam van zijn moeder was Jedida, een dochter van Adaja, uit Bozkath.","Jer 22:18":"Daarom zegt de HEERE zo van Jojakim, zoon van Josia, koning van Juda: Zij zullen hem niet beklagen: Och, mijn broeder! of, och, zuster! Zij zullen hem niet beklagen: Och, heer! of, och, zijn majesteit!","Jer 24:1":"De HEERE liet mij zien, en zie, er waren twee vijgenkorven gezet voor de tempel van de HEERE; nadat Nebukadnezar, de koning van Babel, Jechonia, de zoon van Jojakim, de koning van Juda, gevankelijk had weggevoerd, alsook de vorsten van Juda, en de timmerlieden, en de smeden van Jeruzalem, en hen naar Babel had gebracht.","1 Kon 1:6":"En zijn vader had hem nooit bedroefd door te zeggen: Waarom hebt u zo gedaan? En ook was hij zeer knap van gedaante, en Haggith had hem gebaard na Absalom.","1 Kon 2:24":"En nu, zo waarachtig als de HEERE leeft, Die mij bevestigd heeft, en mij heeft doen zitten op de troon van mijn vader David, en Die mij een huis gemaakt heeft, zoals Hij gesproken had; zeker, Adonia zal vandaag gedood worden!","2 Kron 33:25":"Maar het volk van het land sloeg allen die de samenzwering tegen de koning Amon gemaakt hadden; en het volk van het land maakte zijn zoon Josia koning in zijn plaats.","2 Kron 33:21":"Amon was tweeëntwintig jaar oud, toen hij koning werd, en hij regeerde twee jaar te Jeruzalem.","2 Kron 27:1":"Jotham was vijfentwintig jaar oud toen hij koning werd, en hij regeerde zestien jaar in Jeruzalem; en de naam van zijn moeder was Jerusa, een dochter van Zadok.","2 Sam 2:11":"Het getal nu van de dagen dat David koning geweest is te Hebron, over het huis van Juda, is zeven jaar en zes maanden.","Jer 22:11":"Want zo zegt de HEERE van Sallum, de zoon van Josia, koning van Juda, die in de plaats van zijn vader Josia regeerde, die uit deze plaats is weggegaan: Hij zal daar nooit meer terugkomen.","1 Kron 11:1-3":"Toen kwam heel Israël bijeen bij David in Hebron, en zei: Zie, wij zijn uw gebeente en uw vlees. Zelfs al eerder, toen Saul nog koning was, hebt u Israël uitgeleid en ingeleid; ook heeft de HEERE, uw God, tot u gezegd: U zult Mijn volk Israël weiden, en u zult voorganger zijn over Mijn volk Israël. Ook kwamen alle oudsten van Israël naar de koning in Hebron, en David maakte een verbond met hen te Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël, naar het woord van de HEERE, door de dienst van Samuël.","Luk 3:27":"de zoon van Johannes, de zoon van Rhesa, de zoon van Zorobabel, de zoon van Salathiël, de zoon van Neri,","1 Kon 1:11-31":"Toen sprak Nathan tot Bathseba, de moeder van Salomo, en zei: Hebt u niet gehoord dat Adonia, de zoon van Haggith, koning is? En onze heer David weet dat niet. Nu dan, kom, laat ik u toch een raad geven, zodat u uw leven redt en het leven van uw zoon Salomo. Ga heen, en ga naar binnen bij de koning David, en zeg tegen hem: Hebt u niet, mijn heer koning, uw dienstmaagd gezworen: Zeker, uw zoon Salomo zal na mij koning zijn, en hij zal op mijn troon zitten! Waarom is dan Adonia koning geworden?","2 Kron 21:17":"Zij trokken op tegen Juda, braken erin door en voerden al het bezit weg dat in het huis van de koning gevonden werd, zelfs ook zijn kinderen en zijn vrouwen; zodat hem geen zoon overbleef, behalve Joahaz, de jongste van zijn zonen.","1 Kon 15:8":"En Abiam ontsliep met zijn vaderen, en zij begroeven hem in de stad van David; en Asa, zijn zoon, regeerde in zijn plaats.","Matt 1:12":"En na de Babylonische wegvoering verwekte Jechonia Sealthiël, en Sealthiël verwekte Zerubbabel;","1 Kon 1:11":"Toen sprak Nathan tot Bathseba, de moeder van Salomo, en zei: Hebt u niet gehoord dat Adonia, de zoon van Haggith, koning is? En onze heer David weet dat niet.","2 Kon 15:5":"En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.","1 Kron 2:23":"En hij nam Gesur en Aram, met de vlekken van Jaïr, van hen, met Kenath en haar onderhorige plaatsen, zestig steden. Deze allen zijn zonen van Machir, de vader van Gilead.","2 Kron 36:11":"Eenentwintig jaar was Zedekia oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem.","2 Kon 24:17":"En de koning van Babel maakte Mattanja, diens oom, koning in zijn plaats, en veranderde zijn naam in Zedekia.","2 Sam 18:33":"Toen raakte de koning zeer ontroerd, en ging naar boven, naar de bovenzaal boven de poort, en huilde; en al gaande zei hij dit: Mijn zoon Absalom, mijn zoon, mijn zoon Absalom! Was ik maar, was ik maar in uw plaats gestorven, Absalom, mijn zoon, mijn zoon!","1 Kon 22:41":"Josafat nu, de zoon van Asa, werd koning over Juda, in het vierde jaar van Achab, de koning van Israël.","2 Kron 28:1-8":"Achaz was twintig jaar oud toen hij koning werd, en hij regeerde zestien jaar in Jeruzalem; en hij deed niet wat recht was in de ogen van de HEERE, zoals zijn vader David. Maar hij wandelde in de wegen van de koningen van Israël; daartoe maakte hij ook gegoten beelden voor de Baäls. Hij brandde ook reukwerk in het dal van de zoon van Hinnom, en hij verbrandde zijn zonen in het vuur, naar de gruwelen van de heidenen die de HEERE voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.","2 Sam 3:2-5":"En David werden zonen geboren in Hebron. Zijn eerstgeborene was Amnon, van Ahinoam, de Jizreëlietische; en zijn tweede was Chileab, van Abigaïl, de vrouw van Nabal, de Karmeliet; en de derde, Absalom, de zoon van Maächa, de dochter van Thalmai, koning van Gesur; en de vierde, Adonia, de zoon van Haggith; en de vijfde Sefatja, de zoon van Abital;","2 Kron 36:5":"Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en hij deed wat slecht was in de ogen van de HEERE, zijn God.","2 Sam 5:16":"En Elischama, en Eljada, en Elifeleth.","Neh 12:1":"Dit zijn de priesters en de Levieten die met Zerubbabel, de zoon van Sealthiël, en Jesua optrokken: Seraja, Jeremia, Ezra,","2 Kon 15:30":"En Hosea, de zoon van Ela, smeedde een samenzwering tegen Pekah, de zoon van Remalia, en sloeg hem neer, en doodde hem, en werd koning in zijn plaats; in het twintigste jaar van Jotham, de zoon van Uzzia.","2 Sam 12:25":"en zond een boodschap door de hand van de profeet Nathan, en noemde zijn naam Jedid-jah, omwille van de HEERE.","1 Kon 2:13-21":"Toen kwam Adonia, de zoon van Haggith, naar Bathseba, de moeder van Salomo; en zij zei: Komt u in vrede? En hij zei: In vrede. Daarna zei hij: Ik heb een woord voor u. En zij zei: Spreek. Hij zei dan: U weet dat het koninkrijk van mij was, en dat heel Israël zijn aangezicht op mij gericht had, dat ik koning zou worden; hoewel het koninkrijk is omgewend en van mijn broer geworden is; want het is van de HEERE aan hem gekomen.","1 Kron 14:4-7":"Dit nu zijn de namen van de kinderen die hij te Jeruzalem had: Sammua, en Sobab, Nathan en Salomo, En Jibchar, en Elisua, en Elpelet, En Nogah, en Nefeg, en Jafia,","2 Sam 2:1-4":"Daarna gebeurde het, dat David de HEERE vroeg en zei: Zal ik optrekken in een van de steden van Juda? En de HEERE zei tegen hem: Trek op. En David zei: Waarheen zal ik optrekken? En Hij zei: Naar Hebron. Zo trok David daarheen op, en ook zijn twee vrouwen, Ahinoam, de Jizreëlietische, en Abigaïl, de vrouw van Nabal, de Karmeliet. Ook liet David zijn mannen optrekken, die bij hem waren, ieder met zijn huisgezin; en zij woonden in de steden van Hebron.","2 Sam 18:14":"Toen zei Joab: Ik zal hier zo niet langer bij u blijven wachten; en hij nam drie pijlen in zijn hand, en stak ze in het hart van Absalom, terwijl hij nog leefde, midden in de eik.","1 Kon 2:13":"Toen kwam Adonia, de zoon van Haggith, naar Bathseba, de moeder van Salomo; en zij zei: Komt u in vrede? En hij zei: In vrede.","Joz 13:13":"Maar de kinderen van Israël verdreven de Gezurieten en de Maachathieten niet; maar Gezur en Maachath woonden midden in Israël tot op deze dag.","2 Kon 24:18":"Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, uit Libna.","2 Kon 15:32":"In het tweede jaar van Pekah, de zoon van Remalia, de koning van Israël, werd Jotham koning, de zoon van Uzzia, de koning van Juda.","2 Kon 18:1":"Het gebeurde nu in het derde jaar van Hosea, de zoon van Ela, de koning van Israël, dat Hizkia koning werd, de zoon van Achaz, koning van Juda.","2 Sam 13:20-28":"En haar broer Absalom zei tegen haar: Is uw broer Amnon bij u geweest? Nu dan, mijn zuster, zwijg stil, hij is uw broer; zet uw hart niet op deze zaak. Zo bleef Thamar, eenzaam, in het huis van haar broer Absalom. Toen koning David al deze dingen hoorde, werd hij zeer boos. Doch Absalom sprak niet met Amnon, noch kwaad noch goed; maar Absalom haatte Amnon, vanwege het feit dat hij zijn zuster Thamar verkracht had.","2 Sam 13:1":"Het gebeurde daarna dat Absalom, Davids zoon, een mooie zuster had, wier naam Thamar was, en Amnon, Davids zoon, kreeg haar lief.","1 Kon 15:8-24":"En Abiam ontsliep met zijn vaderen, en zij begroeven hem in de stad van David; en Asa, zijn zoon, regeerde in zijn plaats. In het twintigste jaar van Jerobeam, de koning van Israël, werd Asa koning over Juda. En hij regeerde eenenveertig jaren te Jeruzalem, en de naam van zijn moeder was Maächa, een dochter van Abisalom.","Ezra 8:2":"Van de kinderen van Pinehas, Gersom; van de kinderen van Ithamar, Daniël; van de kinderen van David, Hattus.","2 Sam 13:37":"(Absalom nu vluchtte, en ging naar Thalmai, de zoon van Ammihur, koning van Gesur.) En hij droeg rouw over zijn zoon, al die dagen.","2 Sam 5:4":"Dertig jaar was David oud, toen hij koning werd; veertig jaar heeft hij geregeerd.","Jer 22:28":"Is dan deze man Chonia een veracht, verbrijzeld afgodsbeeld? Of is hij een vat waaraan men geen lust heeft? Waarom zijn hij en zijn nageslacht weggeworpen, ja, weggeworpen in een land dat zij niet kennen?","1 Kron 14:6":"En Nogah, en Nefeg, en Jafia,","2 Kon 21:19":"Amon was tweeëntwintig jaar oud, toen hij koning werd, en hij regeerde twee jaar te Jeruzalem; en de naam van zijn moeder was Mesullemet, een dochter van Haruz uit Jotba.","2 Sam 13:1-32":"Het gebeurde daarna dat Absalom, Davids zoon, een mooie zuster had, wier naam Thamar was, en Amnon, Davids zoon, kreeg haar lief. En Amnon werd zo door haar in beslag genomen dat hij er ziek van werd, vanwege zijn zuster Thamar; want zij was een maagd, zodat het in Amnons ogen onmogelijk leek haar iets te doen. Maar Amnon had een vriend, wiens naam Jonadab was, een zoon van Simea, Davids broer; en Jonadab was een zeer sluwe man.","Hagg 1:1":"In het tweede jaar van koning Darius, in de zesde maand, op de eerste dag van de maand, kwam het woord van de HEERE, door de dienst van Haggai, de profeet, tot Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en tot Josua, de zoon van Jozadak, de hogepriester, en Hij zei:","2 Kon 24:8":"Jojachin was achttien jaar oud toen hij koning werd, en regeerde drie maanden in Jeruzalem; en de naam van zijn moeder was Nehusta, een dochter van Elnathan, uit Jeruzalem.","1 Kon 15:1":"In het achttiende jaar van koning Jerobeam, de zoon van Nebat, werd Abiam koning over Juda.","2 Kron 21:1":"Daarna stierf Josafat en werd bij zijn voorouders begraven, in de stad van David; en zijn zoon Joram werd koning in zijn plaats.","Hagg 1:12-14":"Toen luisterden Zerubbabel, de zoon van Sealthiël, en Josua, de zoon van Jozadak, de hogepriester, en heel het overblijfsel van het volk, naar de stem van de HEERE, hun God, en naar de woorden van de profeet Haggai, zoals de HEERE, hun God, hem gezonden had; en het volk vreesde voor het aangezicht van de HEERE. Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE. En de HEERE wekte de geest op van Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en de geest van Josua, de zoon van Jozadak, de hogepriester, en de geest van heel het overblijfsel van het volk; en zij kwamen en gingen aan het werk in het huis van de HEERE van de heerscharen, hun God,","1 Kron 28:6":"En Hij heeft tegen mij gezegd: Uw zoon Salomo, die zal Mijn huis en Mijn voorhoven bouwen; want Ik heb hem voor Mij verkoren tot een zoon, en Ik zal hem tot een Vader zijn.","2 Sam 12:1-15":"En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm. De rijke had heel veel schapen en runderen. Maar de arme had helemaal niets, dan één enkel klein ooilam, dat hij gekocht had. Hij had het gevoed, zodat het groot werd bij hem en bij zijn kinderen samen; het at van zijn eigen stuk brood, en dronk uit zijn eigen beker, en sliep in zijn schoot, en het was voor hem als een dochter.","2 Sam 19:4-10":"De koning nu had zijn gezicht bedekt, en de koning riep met luide stem: Mijn zoon Absalom, Absalom, mijn zoon, mijn zoon! Toen kwam Joab bij de koning in huis, en zei: U hebt vandaag het gezicht van al uw knechten beschaamd gemaakt, terwijl zij vandaag uw leven hebben gered, en het leven van uw zonen en uw dochters, en het leven van uw vrouwen, en het leven van uw bijvrouwen; Door hen lief te hebben die u haten, en te haten die u liefhebben; want u geeft vandaag te kennen dat leiders en knechten voor u niets betekenen; want ik merk vandaag dat als Absalom in leven was gebleven, en wij vandaag allemaal dood waren, dat het u dan goed zou uitkomen.","2 Sam 5:14":"En dit zijn de namen van hen die hem in Jeruzalem geboren zijn: Schammua, en Schobab, en Nathan, en Salomo.","Ezra 3:8":"In het tweede jaar van hun aankomst bij het huis van God te Jeruzalem, in de tweede maand, begonnen Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, en de rest van hun broeders, de priesters en de Levieten, en allen die uit de gevangenschap te Jeruzalem gekomen waren; en zij stelden de Levieten aan, van twintig jaar oud en daarboven, om toezicht te houden op het werk van het huis van de HEERE.","Jer 37:1":"Zedekia, de zoon van Josia, werd koning in plaats van Chonja, de zoon van Jojakim; hem had Nebukadrezar, de koning van Babel, koning gemaakt in het land van Juda.","2 Kon 21:24-26":"Maar het volk van het land versloeg allen die tegen koning Amon een samenzwering gesmeed hadden; en het volk van het land maakte zijn zoon Josia koning in zijn plaats. Het overige van de geschiedenis van Amon, wat hij gedaan heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Juda? En men begroef hem in zijn graf, in de tuin van Uzza; en zijn zoon Josia werd koning in zijn plaats.","Zach 4:6-9":"Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen. Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem! Het woord van de HEERE kwam verder tot mij:","2 Kon 14:1":"In het tweede jaar van Joas, de zoon van Joahaz, de koning van Israël, werd Amazia koning, de zoon van Joas, de koning van Juda.","2 Kron 36:1":"Toen nam het volk van het land Joahaz, de zoon van Josia, en zij maakten hem koning in de plaats van zijn vader, te Jeruzalem.","2 Sam 5:15":"En Ibchar, en Elischua, en Nefeg, en Jafia,","2 Kon 15:5-7":"En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak. Het overige nu van de geschiedenis van Azaria, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda? En Azaria stierf en werd bij zijn voorouders begraven, in de stad van David; en zijn zoon Jotham werd koning in zijn plaats."},"noten":{},"koppeling":{"1":"Dit <span class=\"wl\" data-l=\"L1\" data-code=\"H1971\">waren</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1971\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1732\">David</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H834\">die</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2275\">hem</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2275\">in</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2275\">Hebron</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3205\">geboren</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3205\">zijn</span>: <span class=\"wl\" data-l=\"L7\" data-code=\"H1060\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1060\">eerstgeborene</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H550\">Amnon</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H550\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H293\">Ahinoam</span>, <span class=\"wl\" data-l=\"L9\" data-code=\"H293\">de</span> <span class=\"wl\" data-l=\"L10\" data- /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
