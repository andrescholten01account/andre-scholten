e vermelden, en te loven, en te prijzen.","5":"Asaf was het hoofd, en Zecharja de tweede na hem; Jeïel, en Semiramoth, en Jehiël, en Mattithja, en Eliab, en Benaja, en Obed-Edom, en Jeïel, met instrumenten van luiten en met harpen; en Asaf liet zich horen met cimbalen;","6":"Maar Benaja en Jahaziël, de priesters, voortdurend met trompetten voor de ark van het verbond van God.","7":"Op diezelfde dag gaf David voor het eerst *deze psalm*, om de HEERE te loven, door de dienst van Asaf en zijn broeders.","8":"Looft de HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken.","9":"Zingt Hem, zingt psalmen voor Hem, spreekt met aandacht van al Zijn wonderwerken.","10":"Roemt u in de Naam van Zijn heiligheid; laat het hart van hen die de HEERE zoeken zich verblijden.","11":"Vraagt naar de HEERE en Zijn sterkte, zoekt Zijn aangezicht voortdurend.","12":"Gedenkt Zijn wonderwerken, die Hij gedaan heeft, Zijn wondertekenen, en de oordelen van Zijn mond;","13":"U, nageslacht van Israël, Zijn dienaar, u, kinderen van Jakob, Zijn uitverkorenen!","14":"Hij is de HEERE, onze God; Zijn oordelen zijn over de hele aarde.","15":"Gedenkt tot in eeuwigheid van Zijn verbond, van het woord dat Hij ingesteld heeft tot in het duizendste geslacht;","16":"*Van het verbond*, dat Hij met Abraham heeft gemaakt, en van Zijn eed aan Izak;","17":"Welke Hij ook aan Jakob heeft bevestigd tot een inzetting, *aan* Israël tot een eeuwig verbond;","18":"Zeggende: Ik zal u het land Kanaän geven, een snoer van uw erfdeel;","19":"Toen u weinige mensen in aantal waren; ja, weinigen en vreemdelingen daarin.","20":"En zij trokken van volk tot volk, en van het ene koninkrijk tot een ander volk.","21":"Hij liet niemand toe hen te onderdrukken; ook bestrafte Hij koningen om hunnentwil, *en zei*:","22":"Raak Mijn gezalfden niet aan, en doet Mijn profeten geen kwaad.","23":"Zingt de HEERE, u, hele aarde, verkondigt Zijn heil van dag tot dag.","24":"Vertelt Zijn eer onder de heidenen, Zijn wonderwerken onder alle volken.","25":"Want de HEERE is groot, en zeer te prijzen, en Hij is te vrezen boven alle goden.","26":"Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemelen gemaakt.","27":"Majesteit en heerlijkheid zijn voor Zijn aangezicht, sterkte en vrolijkheid zijn in Zijn plaats.","28":"Geeft de HEERE, u, geslachten van de volken, geeft de HEERE eer en sterkte.","29":"Geeft de HEERE de eer van Zijn Naam, brengt offer, en komt voor Zijn aangezicht; aanbidt de HEERE in de heerlijkheid van het heiligdom.","30":"Schrikt voor Zijn aangezicht, u, hele aarde! Ook zal de wereld bevestigd worden, zodat zij niet bewogen wordt.","31":"Laat de hemelen zich verblijden, en de aarde zich verheugen, en laat men onder de heidenen zeggen: De HEERE regeert.","32":"Laat de zee bruisen met haar volheid, laat het veld huppelen van vreugde, met alles wat daarin is.","33":"Dan zullen de bomen van het woud juichen voor het aangezicht van de HEERE, omdat Hij komt om de aarde te richten.","34":"Looft de HEERE, want Hij is goed, want Zijn goedertierenheid is tot in eeuwigheid.","35":"En zegt: Verlos ons, o God van ons heil, en verzamel ons, en red ons van de heidenen, opdat wij Uw heilige Naam loven, en opdat wij ons in Uw lof roemen.","36":"Geloofd zij de HEERE, de God van Israël, van eeuwigheid tot eeuwigheid! En al het volk zei: Amen! en het loofde de HEERE.","37":"Zo liet hij daar, voor de ark van het verbond van de HEERE, Asaf en zijn broeders, om voortdurend te dienen voor de ark, naarmate op elke dag besteld was.","38":"Obed-Edom nu, met hun broeders, waren achtenzestig; en *hij stelde* Obed-Edom, de zoon van Jeduthun, en Hosa, aan tot poortwachters;","39":"En de priester Zadok, en zijn broeders, de priesters, voor de tabernakel van de HEERE op de hoogte, die te Gibeon is;","40":"Om de HEERE de brandoffers voortdurend te offeren op het brandofferaltaar, 's morgens en 's avonds; en dat naar alles wat er geschreven staat in de wet van de HEERE, die Hij Israël geboden had.","41":"En met hen Heman en Jeduthun, en de overige uitgelezen mannen, die met naam uitgedrukt zijn om de HEERE te loven; want Zijn goedertierenheid is tot in eeuwigheid.","42":"Met hen dan waren Heman en Jeduthun, *met* trompetten en cimbalen voor hen die zich lieten horen, en *met* instrumenten van de muziek van God; maar de zonen van Jeduthun waren aan de poort.","43":"Zo ging het hele volk heen, ieder naar zijn huis; en David keerde zich om, om zijn huis te gaan zegenen."},"SV":{"1":"Toen zij de ark Gods inbrachten, zo stelden zij ze in het midden der tent, welke David voor haar gespannen had; en zij offerden brandofferen en dankofferen voor het aangezicht Gods.","2":"Als David het brandoffer en de dankofferen geëindigd had te offeren, zo zegende hij het volk in den Naam des HEEREN.","3":"En hij deelde een iegelijk in Israël, van den man tot de vrouw, een iegelijk een bol broods, en een schoon stuk *vlees*, en een fles *wijn*.","4":"En hij stelde voor de ark des HEEREN *sommigen* uit de Levieten tot dienaars, en dat, om den HEERE, den God Israëls, te vermelden, en te loven, en te prijzen.","5":"Asaf was het hoofd, en Zecharja de tweede na hem; Jeiel, en Semiramoth, en Jehiel, en Mattithja, en Eliab, en Benaja, en Obed-edom, en Jeiel, met instrumenten der luiten en met harpen; en Asaf liet zich horen met cimbalen;","6":"Maar Benaja en Jahaziel, de priesters, steeds met trompetten voor de ark des verbonds van God.","7":"Te dienzelven dage gaf David ten eerste *dezen* *psalm*, om den HEERE te loven, door den dienst van Asaf, en zijn broederen.","8":"Looft den HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken.","9":"Zingt Hem, psalmzingt Hem, spreekt aandachtelijk van al Zijn wonderwerken.","10":"Roemt u in den Naam Zijner heiligheid; dat zich het hart dergenen, die den HEERE zoeken, verblijde.","11":"Vraagt naar den HEERE en Zijn sterkte, zoekt Zijn aangezicht geduriglijk.","12":"Gedenkt Zijner wonderwerken, die Hij gedaan heeft, Zijner wondertekenen, en de oordelen Zijns monds;","13":"Gij, zaad van Israël, Zijn dienaar, gij, kinderen van Jakob, Zijn uitverkorenen!","14":"Hij is de HEERE, onze God; Zijn oordelen zijn over de gehele aarde.","15":"Gedenkt tot in der eeuwigheid Zijns verbonds, des woords, *dat* Hij ingesteld heeft tot in het duizendste geslacht;","16":"*Des* *verbonds*, dat Hij met Abraham heeft gemaakt, en Zijns eeds aan Izak;","17":"Welken Hij ook aan Jakob heeft gesteld tot een inzetting, *aan* Israël tot een eeuwig verbond;","18":"Zeggende: Ik zal u het land Kanaän geven, een snoer van ulieder erfdeel;","19":"Als gij weinige mensen in getal waart; ja, weinigen en vreemdelingen daarin.","20":"En zij wandelden van volk tot volk, en van het ene koninkrijk tot een ander volk.","21":"Hij liet niemand toe hen te onderdrukken; ook bestrafte Hij koningen om hunnentwil, *zeggende*:","22":"Tast Mijn gezalfden niet aan, en doet Mijn profeten geen kwaad.","23":"Zingt den HEERE, gij, ganse aarde, boodschapt Zijn heil van dag tot dag.","24":"Vertelt Zijn eer onder de heidenen, Zijn wonderwerken onder alle volken.","25":"Want de HEERE is groot, en zeer te prijzen, en Hij is vreselijk boven alle goden.","26":"Want al de goden der volken zijn afgoden; maar de HEERE heeft de hemelen gemaakt.","27":"Majesteit en heerlijkheid zijn voor Zijn aangezicht, sterkte en vrolijkheid zijn in Zijn plaats.","28":"Geeft den HEERE, gij, geslachten der volken, geeft den HEERE eer en sterkte.","29":"Geeft den HEERE de eer Zijns Naams, brengt offer, en komt voor Zijn aangezicht; aanbidt den HEERE in de heerlijkheid des heiligdoms.","30":"Schrikt voor Zijn aangezicht, gij, gehele aarde! Ook zal de wereld bevestigd worden, dat zij niet bewogen worde.","31":"Dat de hemelen zich verblijden, en de aarde verheuge zich, en dat men onder de heidenen zegge: De HEERE regeert.","32":"Dat de zee bruise met haar volheid, dat het veld huppele van vreugde, met al wat daarin is.","33":"Dan zullen de bomen des wouds juichen voor het aangezicht des HEEREN, omdat Hij komt, om de aarde te richten.","34":"Looft den HEERE, want Hij is goed, want Zijn goedertierenheid is tot in eeuwigheid.","35":"En zegt: Verlos ons, o God onzes heils, en verzamel ons, en red ons van de heidenen, dat wij Uw heiligen Naam loven, en dat wij ons Uws lofs roemen.","36":"Geloofd zij de HEERE, de God Israëls, van eeuwigheid tot eeuwigheid! En al het volk zeide: Amen! en het loofde den HEERE.","37":"Alzo liet hij daar, voor de ark des verbonds des HEEREN, Asaf en zijn broederen, om geduriglijk te dienen voor de ark, naardat op elken dag besteld was.","38":"Obed-edom nu, met hunlieder broederen, waren acht en zestig; en *hij* *stelde* Obed-edom, den zoon van Jeduthun, en Hosa, tot poortiers;","39":"En den priester Zadok, en zijn broederen, de priesters, voor den tabernakel des HEEREN op de hoogte, welke te Gibeon is;","40":"Om den HEERE de brandofferen geduriglijk te offeren op het brandofferaltaar, des morgens en des avonds; en zulks naar alles, wat er geschreven staat in de wet des HEEREN, die Hij Israël geboden had.","41":"En met hen Heman en Jeduthun, en de overige uitgelezenen, die met namen uitgedrukt zijn om den HEERE te loven; want Zijn goedertierenheid is tot in der eeuwigheid.","42":"Met hen dan waren Heman en Jeduthun, *met* trompetten en cimbalen voor degenen, die zich lieten horen, en *met* instrumenten der muziek Gods; maar de zonen van Jeduthun waren aan de poort.","43":"Alzo toog het ganse volk henen, een iegelijk in zijn huis; en David keerde zich, om zijn huis te gaan zegenen."},"KJV":{"1":"So they brought the ark of God, and set it in the midst of the tent that David had pitched for it: and they offered burnt sacrifices and peace offerings before God.","2":"And when David had made an end of offering the burnt offerings and the peace offerings, he blessed the people in the name of the LORD.","3":"And he dealt to every one of Israel, both man and woman, to every one a loaf of bread, and a good piece of flesh, and a flagon of wine.","4":"And he appointed certain of the Levites to minister before the ark of the LORD, and to record, and to thank and praise the LORD God of Israel:","5":"Asaph the chief, and next to him Zechariah, Jeiel, and Shemiramoth, and Jehiel, and Mattithiah, and Eliab, and Benaiah, and Obededom: and Jeiel with psalteries and with harps; but Asaph made a sound with cymbals;","6":"Benaiah also and Jahaziel the priests with trumpets continually before the ark of the covenant of God.","7":"Then on that day David delivered first this psalm to thank the LORD into the hand of Asaph and his brethren.","8":"Give thanks unto the LORD, call upon his name, make known his deeds among the people.","9":"Sing unto him, sing psalms unto him, talk ye of all his wondrous works.","10":"Glory ye in his holy name: let the heart of them rejoice that seek the LORD.","11":"Seek the LORD and his strength, seek his face continually.","12":"Remember his marvellous works that he hath done, his wonders, and the judgments of his mouth;","13":"O ye seed of Israel his servant, ye children of Jacob, his chosen ones.","14":"He is the LORD our God; his judgments are in all the earth.","15":"Be ye mindful always of his covenant; the word which he commanded to a thousand generations;","16":"Even of the covenant which he made with Abraham, and of his oath unto Isaac;","17":"And hath confirmed the same to Jacob for a law, and to Israel for an everlasting covenant,","18":"Saying, Unto thee will I give the land of Canaan, the lot of your inheritance;","19":"When ye were but few, even a few, and strangers in it.","20":"And when they went from nation to nation, and from one kingdom to another people;","21":"He suffered no man to do them wrong: yea, he reproved kings for their sakes,","22":"Saying, Touch not mine anointed, and do my prophets no harm.","23":"Sing unto the LORD, all the earth; shew forth from day to day his salvation.","24":"Declare his glory among the heathen; his marvellous works among all nations.","25":"For great is the LORD, and greatly to be praised: he also is to be feared above all gods.","26":"For all the gods of the people are idols: but the LORD made the heavens.","27":"Glory and honour are in his presence; strength and gladness are in his place.","28":"Give unto the LORD, ye kindreds of the people, give unto the LORD glory and strength.","29":"Give unto the LORD the glory due unto his name: bring an offering, and come before him: worship the LORD in the beauty of holiness.","30":"Fear before him, all the earth: the world also shall be stable, that it be not moved.","31":"Let the heavens be glad, and let the earth rejoice: and let men say among the nations, The LORD reigneth.","32":"Let the sea roar, and the fulness thereof: let the fields rejoice, and all that is therein.","33":"Then shall the trees of the wood sing out at the presence of the LORD, because he cometh to judge the earth.","34":"O give thanks unto the LORD; for he is good; for his mercy endureth for ever.","35":"And say ye, Save us, O God of our salvation, and gather us together, and deliver us from the heathen, that we may give thanks to thy holy name, and glory in thy praise.","36":"Blessed be the LORD God of Israel for ever and ever. And all the people said, Amen, and praised the LORD.","37":"So he left there before the ark of the covenant of the LORD Asaph and his brethren, to minister before the ark continually, as every day's work required:","38":"And Obededom with their brethren, threescore and eight; Obededom also the son of Jeduthun and Hosah to be porters:","39":"And Zadok the priest, and his brethren the priests, before the tabernacle of the LORD in the high place that was at Gibeon,","40":"To offer burnt offerings unto the LORD upon the altar of the burnt offering continually morning and evening, and to do according to all that is written in the law of the LORD, which he commanded Israel;","41":"And with them Heman and Jeduthun, and the rest that were chosen /span> with <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpets</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","7":"Then on that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">first</span> this psalm to <span class=\"wl wl-kjv\" data-code=\"H3034\">thank</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren.</span>","8":"Give <span class=\"wl wl-kjv\" data-code=\"H3034\">thanks</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> upon his <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> make <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> his <span class=\"wl wl-kjv\" data-code=\"H5949\">deeds</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","9":"<span class=\"wl wl-kjv\" data-code=\"H7891\">Sing</span> unto him, sing <span class=\"wl wl-kjv\" data-code=\"H2167\">psalms</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7878\">talk</span> ye of all his <span class=\"wl wl-kjv\" data-code=\"H6381\">wondrous</span> works.","10":"<span class=\"wl wl-kjv\" data-code=\"H1984\">Glory</span> ye in his <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> let the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of them <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","11":"<span class=\"wl wl-kjv\" data-code=\"H1875\">Seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> and his <span class=\"wl wl-kjv\" data-code=\"H5797\">strength,</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually.</span>","12":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> his <span class=\"wl wl-kjv\" data-code=\"H6381\">marvellous</span> works that he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> his <span class=\"wl wl-kjv\" data-code=\"H4159\">wonders,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> of his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth;</span>","13":"O ye <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> ye <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> his chosen <span class=\"wl wl-kjv\" data-code=\"H972\">ones.</span>","14":"He is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> his <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments</span> are in all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth.</span>","15":"Be ye <span class=\"wl wl-kjv\" data-code=\"H2142\">mindful</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">always</span> of his <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant;</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> which he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> to a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H1755\">generations;</span>","16":"Even of the covenant which he <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> with <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> and of his <span class=\"wl wl-kjv\" data-code=\"H7621\">oath</span> unto <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac;</span>","17":"And hath <span class=\"wl wl-kjv\" data-code=\"H5975\">confirmed</span> the same to <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> for a <span class=\"wl wl-kjv\" data-code=\"H2706\">law,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> for an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span>","18":"<span class=\"wl wl-kjv\" data-code=\"H559\">Saying,</span> Unto thee will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> the <span class=\"wl wl-kjv\" data-code=\"H2256\">lot</span> of your <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance;</span>","19":"When ye were but <span class=\"wl wl-kjv\" data-code=\"H4557\">few,</span> even a <span class=\"wl wl-kjv\" data-code=\"H4592\">few,</span> and <span class=\"wl wl-kjv\" data-code=\"H1481\">strangers</span> in it.","20":"And when they <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> from <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> to <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> and from one <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> to <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span>","21":"He <span class=\"wl wl-kjv\" data-code=\"H3240\">suffered</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to do them <span class=\"wl wl-kjv\" data-code=\"H6231\">wrong:</span> yea, he <span class=\"wl wl-kjv\" data-code=\"H3198\">reproved</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> for their sakes,","22":"Saying, <span class=\"wl wl-kjv\" data-code=\"H5060\">Touch</span> not mine <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed,</span> and do my <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> no <span class=\"wl wl-kjv\" data-code=\"H7489\">harm.</span>","23":"<span class=\"wl wl-kjv\" data-code=\"H7891\">Sing</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> shew <span class=\"wl wl-kjv\" data-code=\"H1319\">forth</span> from <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> his <span class=\"wl wl-kjv\" data-code=\"H3444\">salvation.</span>","24":"<span class=\"wl wl-kjv\" data-code=\"H5608\">Declare</span> his <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen;</span> his marvellous <span class=\"wl wl-kjv\" data-code=\"H6381\">works</span> among all <span class=\"wl wl-kjv\" data-code=\"H5971\">nations.</span>","25":"For <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> to be <span class=\"wl wl-kjv\" data-code=\"H1984\">praised:</span> he also is to be <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> above all <span class=\"wl wl-kjv\" data-code=\"H430\">gods.</span>","26":"For all the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are <span class=\"wl wl-kjv\" data-code=\"H457\">idols:</span> but the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens.</span>","27":"<span class=\"wl wl-kjv\" data-code=\"H1935\">Glory</span> and <span class=\"wl wl-kjv\" data-code=\"H1926\">honour</span> are in his <span class=\"wl wl-kjv\" data-code=\"H6440\">presence;</span> <span class=\"wl wl-kjv\" data-code=\"H5797\">strength</span> and <span class=\"wl wl-kjv\" data-code=\"H2304\">gladness</span> are in his <span class=\"wl wl-kjv\" data-code=\"H4725\">place.</span>","28":"<span class=\"wl wl-kjv\" data-code=\"H3051\">Give</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> ye <span class=\"wl wl-kjv\" data-code=\"H4940\">kindreds</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H3051\">give</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> and <span class=\"wl wl-kjv\" data-code=\"H5797\">strength.</span>","29":"<span class=\"wl wl-kjv\" data-code=\"H3051\">Give</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> due unto his <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">bring</span> an <span class=\"wl wl-kjv\" data-code=\"H4503\">offering,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him: <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H1927\">beauty</span> of <span class=\"wl wl-kjv\" data-code=\"H6944\">holiness.</span>","30":"<span class=\"wl wl-kjv\" data-code=\"H2342\">Fear</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> also shall be <span class=\"wl wl-kjv\" data-code=\"H3559\">stable,</span> that it be not <span class=\"wl wl-kjv\" data-code=\"H4131\">moved.</span>","31":"Let the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> be <span class=\"wl wl-kjv\" data-code=\"H8055\">glad,</span> and let the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H1523\">rejoice:</span> and let men <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigneth.</span>","32":"Let the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> <span class=\"wl wl-kjv\" data-code=\"H7481\">roar,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4393\">fulness</span> thereof: let the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields</span> <span class=\"wl wl-kjv\" data-code=\"H5970\">rejoice,</span> and all that is therein.","33":"Then shall the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of the <span class=\"wl wl-kjv\" data-code=\"H3293\">wood</span> sing <span class=\"wl wl-kjv\" data-code=\"H7442\">out</span> at the <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> because he <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> to <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth.</span>","34":"O give <span class=\"wl wl-kjv\" data-code=\"H3034\">thanks</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> for he is <span class=\"wl wl-kjv\" data-code=\"H2896\">good;</span> for his <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> endureth for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>","35":"And <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> ye, <span class=\"wl wl-kjv\" data-code=\"H3467\">Save</span> us, O <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of our <span class=\"wl wl-kjv\" data-code=\"H3468\">salvation,</span> and gather us <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> us from the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> that we may give <span class=\"wl wl-kjv\" data-code=\"H3034\">thanks</span> to thy <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H7623\">glory</span> in thy <span class=\"wl wl-kjv\" data-code=\"H8416\">praise.</span>","36":"<span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> and <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span> And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H543\">Amen,</span> and <span class=\"wl wl-kjv\" data-code=\"H1984\">praised</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","37":"So he <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> there <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> to <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually,</span> as every <span class=\"wl wl-kjv\" data-code=\"H3117\">day's</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">work</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">required:</span>","38":"And <span class=\"wl wl-kjv\" data-code=\"H5654\">Obededom</span> with their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> <span class=\"wl wl-kjv\" data-code=\"H8346\">threescore</span> and <span class=\"wl wl-kjv\" data-code=\"H8083\">eight;</span> <span class=\"wl wl-kjv\" data-code=\"H5654\">Obededom</span> also the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3038\">Jeduthun</span> and <span class=\"wl wl-kjv\" data-code=\"H2621\">Hosah</span> to be <span class=\"wl wl-kjv\" data-code=\"H7778\">porters:</span>","39":"And <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> that was at <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon,</span>","40":"To <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> and <span class=\"wl wl-kjv\" data-code=\"H6153\">evening,</span> and to do according to all that is <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span>","41":"And with them <span class=\"wl wl-kjv\" data-code=\"H1968\">Heman</span> and <span class=\"wl wl-kjv\" data-code=\"H3038\">Jeduthun,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7605\">rest</span> that were <span class=\"wl wl-kjv\" data-code=\"H1305\">chosen,</span> who were <span class=\"wl wl-kjv\" data-code=\"H5344\">expressed</span> by <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> to give <span class=\"wl wl-kjv\" data-code=\"H3034\">thanks</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> because his <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> endureth for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever;</span>","42":"And with them <span class=\"wl wl-kjv\" data-code=\"H1968\">Heman</span> and <span class=\"wl wl-kjv\" data-code=\"H3038\">Jeduthun</span> with <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpets</span> and <span class=\"wl wl-kjv\" data-code=\"H4700\">cymbals</span> for those that should make a <span class=\"wl wl-kjv\" data-code=\"H8085\">sound,</span> and with <span class=\"wl wl-kjv\" data-code=\"H7892\">musical</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">instruments</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span> And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3038\">Jeduthun</span> were <span class=\"wl wl-kjv\" data-code=\"H8179\">porters.</span>","43":"And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ark Gods","tekst":"Dat is, de ark des verbonds, ter ere Gods gemaakt."},{"catchword":"offerden","tekst":"Versta dit, van extraordinaire en bijzondere offeranden, die David en het volk van Israël in dezen tijd gedaan hebben."},{"catchword":"voor het aangezicht Gods","tekst":"Zie boven, 1Ch 13:8 ."}],"2":[{"catchword":"zegende hij","tekst":"Dat is, hij liet het volk wederom naar huis gaan, God den Heere voor hen biddende."}],"3":[{"catchword":"een schoon stuk vlees","tekst":"Te weten, een stuk rundvlees bij het vuur gebraden, gelijk het Hebreeuwse woord van enigen wordt uitgelegd. Zie 2Sa 6:19 ."}],"5":[{"catchword":"de tweede na hem;","tekst":"Hebreeuws, zijn tweede."}],"6":[{"catchword":"steeds","tekst":"Dat is, alle dagen op zekere uren."}],"7":[{"catchword":"ten eerste","tekst":"Hebreeuws, in den hoofde; dat is, in den beginne, of eerste maal. En dit is zo te vers aan dat David dezen psalm eerst den Levieten heeft gegeven, om God daarmede te loven in den openlijken godsdienst; daarna heeft David nog meer psalmen gedicht en den Levieten gegeven, om te zingen. Zie 2Sa 23:1 ."},{"catchword":"door den dienst","tekst":"Hebreeuws, door de hand."},{"catchword":"broederen","tekst":"Dat is, verwanten."}],"8":[{"catchword":"Looft den HEERE,","tekst":"Dit vs. en de veertien naastvolgende zijn een deel van Psa 105 , vergelijk zij met elkander."},{"catchword":"roept Zijn Naam aan,","tekst":"Anders, predikt."}],"10":[{"catchword":"Roemt u","tekst":"Alsof hij zeide: Gedenkt dat dit een zonderlinge genade van God is, dat het u gegeven is den Heere te zoeken, daarin moogt gij u wel verheugen."}],"11":[{"catchword":"sterkte,","tekst":"Dat is, naar den sterken en almachtigen God. Zie 2Ch 6:41 ."},{"catchword":"Zijn aangezicht","tekst":"Te weten, des HEEREN, die zijn tegenwoordigheid boven de ark openbaarde, tussen de cherubim. Zie Jos 4:13 , enz."}],"12":[{"catchword":"oordelen","tekst":"Dat is, aan de straffen en plagen, die Hij Mozes bevolen heeft uit te spreken tegen Farao en de Egyptenaars, welke beschreven staan Exo 7 , Exo 8 , Exo 9 , Exo 10 , Exo 11 , Exo 12 ."}],"14":[{"catchword":"Zijn oordelen","tekst":"Dat is, hoewel Hij een regeerder is over de ganse wereld, is nochtans Israël zijn eigendom uit genade. Of, zijn gerichten; dat is, zijn straffen, die Hij over de vijanden zijns volks heeft laten komen, zijn bekend en ruchtbaar geworden over de gehele wereld."}],"15":[{"catchword":"ingesteld","tekst":"Zie Psa 105:8 ."}],"16":[{"catchword":"met Abraham","tekst":"Zie Gen 15:18 in de verklaring."}],"18":[{"catchword":"een snoer","tekst":"Dat is, het land met het snoer afgemeten en verdeeld. Zie van deze manier van spreken, Deu 32:9 ."}],"19":[{"catchword":"weinige mensen","tekst":"Hebreeuws, lieden of mensen des getals; dat is, lieden die men lichtelijk kon tellen, omdat zij weinig waren. Zie Gen 34:30 ; Deu 4:27 , en Deu 33:6 ."},{"catchword":"weinigen en vreemdelingen","tekst":"Te weten, ten aanzien van het groot getal der Kanaänieten."}],"20":[{"catchword":"zij wandelden","tekst":"Te weten, uw vader Abram, Izak en Jakob, gelijk daarvan te lezen is in het boek Genesis vanaf het elfde hfdst. Tot het einde Des boeks."},{"catchword":"van volk tot volk,","tekst":"Dat is, van het ene volk tot het andere."}],"21":[{"catchword":"onderdrukken;","tekst":"Of, onrecht doen."},{"catchword":"bestrafte Hij","tekst":"Of, schold Hij, berispte Hij."},{"catchword":"koningen","tekst":"Te weten, den koning van Egypte, Gen 12:17 , en den koning te Gerar, Gen 20:3 ."}],"22":[{"catchword":"Tast","tekst":"Welverstaande niet ten kwade, dat is, kwetst mijne gezalfden niet."},{"catchword":"gezalfden","tekst":"Dat is, mijn profeten, gelijk straks volgt. Want de profeten waren begaafd met de zalving des Heiligen Geestes; gelijk God ook belast heeft Elisa uiterlijk te zalven. En hier worden vooreerst verstaan Abraham, Izak en Jakob, die profeten mogen genoemd worden, omdat zich de Heere hun heeft geopenbaard en aangesproken, opdat zij ook anderen van den wil Gods zouden onderrichten. Gen 20:7 wordt Abraham een profeet genoemd; van Izak, zie Gen 27:4 , Gen 28"}],"23":[{"catchword":"Zingt","tekst":"vs.23 en de tien naastvolgende staan in Psa 96 ."},{"catchword":"gij, ganse aarde,","tekst":"Dat is, gij inwoners des gansen lands, of gij Israëlieten altegaar."},{"catchword":"Zijn heil","tekst":"Te weten, dat Hij ons doet en bewijst."}],"25":[{"catchword":"Hij is vreselijk","tekst":"Dat is, Hij is meer te vrezen en te ontzien dan de goden der heidenen. De mening is, men moet hem vrezen en voor hem schrikken, en niet voor de afgoden; want hier worden deze dingen alzo niet tegen elkander in vergelijking gesteld, alsof men den waren God zou vrezen moeten, en de afgoden ook; alleen dat men den waren God meer zou vrezen dan de afgoden. Maar door een absolute tegenstelling, aldus, dat men voor God moet schrikken en beven, en niet voor de afgoden, die helpen noch schaden kunnen. Zie dergelijke tegenstelling Luk 18:14 , waar de mening is dat de tollenaar gerechtvaardigd in zijn huis gegaan is, en niet de Farizeër."}],"26":[{"catchword":"afgoden;","tekst":"Hebreeuws, Elilim; dat is, ijdelheden, nietigheden. De apostel Paulus zegt, 1Co 8:4 :Wij weten dat de afgod niets is. Zie Lev 19:4 ."}],"27":[{"catchword":"Majesteit","tekst":"Anders, glorie, of sieraad."},{"catchword":"sterkte","tekst":"Dat is, Hij is een oorzaak van sterkte en van vrolijkheid, of vreugde des geestes, dengene in wien Hij woont door zijn Geest."},{"catchword":"in Zijn plaats","tekst":"Dat is, bij hem, te weten, in den hemel, of in zijn heiligdom waar Hij zich openbaart. Zie Psa 96:6 ."}],"28":[{"catchword":"Geeft den HEERE,","tekst":"Dat is, kent en prijst des Heeren eer en macht."},{"catchword":"geeft den HEERE eer en sterkte","tekst":"Dat is, erkent zijn eer en sterkte, hem gevende de eer, die hem toekomt."}],"29":[{"catchword":"de eer Zijns Naams,","tekst":"Dat is, de eer, die gij hem schuldig zijt."},{"catchword":"brengt offer,","tekst":"Of, brengt hiertoe het spijsoffer, of een gave. Door een deel van den godsdienst verstaat hij den gehelen godsdienst."},{"catchword":"aanbidt","tekst":"Zie Gen 22:5 ."},{"catchword":"in de heerlijkheid","tekst":"Dat is, in het heerlijke heiligdom."}],"30":[{"catchword":"gij, gehele aarde","tekst":"Dat is, al gij inwoners der aarde."}],"31":[{"catchword":"de hemelen","tekst":"Dat is, de engelen in den hemel."},{"catchword":"de aarde","tekst":"Dat is, de inwoners der aarde."},{"catchword":"De HEERE regeert","tekst":"Dat is, Hij betoont en doet met der daad blijken dat Hij een koning is, die het al regeert."}],"32":[{"catchword":"bruise","tekst":"Hebreeuws, dondere; dat is, geluid geve, gelijk de donder doet, dat is, ruise, tiere, bruise."},{"catchword":"volheid,","tekst":"Dat is, al hetgeen dat daarin is, te weten, vissen en monsters die daarin zijn."}],"33":[{"catchword":"aarde te richten","tekst":"Dat is, de mensen op de aarde."}],"34":[{"catchword":"Hij is goed,","tekst":"Anders, want het is goed."}],"35":[{"catchword":"verzamel ons,","tekst":"Dat is, nu we met elkander verenigd zijn, houd ons tezamen bij elkander, dat wij niet wederom van elkander scheuren, gelijk wij vóór dezen zijn gescheurd en verdeeld geweest. Zie hiervan boven, 1Ch 12:29 . Doch dit kan men voorts verstaan van alle toekomende zwarigheid en nood der kerk Gods."},{"catchword":"dat wij ons Uws lofs roemen","tekst":"Te weten, daarvan en daarover, dat wij oorzaak en vrijheid hebben om U te loven."}],"36":[{"catchword":"al het volk","tekst":"Dat is, al het volk gaf te kennen dat zij zulk een lof toestemden en prezen, en dat hetgeen er gezongen werd, ook huns harten wens was. Zie Deu 27:15 ."},{"catchword":"en het loofde den HEERE","tekst":"Anders, ook lovende den HEERE."}],"37":[{"catchword":"hij daar,","tekst":"De koning David."},{"catchword":"zijn broederen,","tekst":"Dit is bloedverwanten, nakomelingen."},{"catchword":"naardat","tekst":"Of, naar den eis van elken dag. Hebreeuws, naar het woord of de zaak des daags in zijn dag."}],"38":[{"catchword":"hunlieder","tekst":"Te weten, van hem en Hosa, waarvan in het vervolg."},{"catchword":"broederen,","tekst":"Dat is, bloedverwanten, nakomelingen."},{"catchword":"Jedúthun,","tekst":"Anders, Jeduthun."}],"39":[{"catchword":"te Gibeon is;","tekst":"Hier was de tabernakel gevoerd en opgericht, nadat Saul de priesters te Nob gedood had, 1Sa 22:19 . Zie ook 1Ch 21:29 ; 2Ch 1:3 ."}],"41":[{"catchword":"uitgelezenen,","tekst":"Te weten, tot het zangersambt."}],"42":[{"catchword":"Met hen dan","tekst":"Anders, en met hen, [te weten] Heman en Jeduthun, waren trompetten."},{"catchword":"met instrumenten","tekst":"Of, met muzikale instrumenten Gods; dat is, waarmede men God loofde, heilige gezangen daarop zingende en spelende."}],"43":[{"catchword":"om zijn huis te gaan zegenen","tekst":"Dat is, om God den Heere voor den welstand deszelven te bidden, gelijk boven, vs.2."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"When they brought in the Ark of God, [That is, the Ark of the covenant made to the honor of God] then they set in the midst of the tent that David had pitched for it: And they offered burnt-offerings and thank-offerings [understand this of extraordinary special offerings which David and the people of Israel offered at this time] before the face of God. [see above chap.13.on v.8.]"}],"2":[{"catchword":null,"tekst":"When David had made an end of offering burnt-offering and the thank-offerings: then he blessed the people in the name of the LORD. [That is, he let the people return home to their own dwelling places, praying unto God for them.]"}],"3":[{"catchword":null,"tekst":"And he dealt to every one in Israel, from the man to the woman, to every one a loaf of bread, and a fair piece (of flesh), [To wit, a piece of beef roasted at the fire, as the Hebrew word is interpreted by some. See 2 Sam.6.on v.19.] and a bottles (of wine)"}],"4":[{"catchword":null,"tekst":"And he appointed (certain) of the Levites (to be0 ministers before the Ark of the LORD: and that to record, and to land, and to praise the LORD the God of Israel."}],"5":[{"catchword":null,"tekst":"Asaph was the head; and Zecharja the second after him: [Heb. his second] Jeiel, and Seniramoth, and Jehiel, and Maitithja, and Eliab, and Benaja, and Obed-Edom, and Jeiel with Istruments lute, and with Harps: and Asaph caused himself to be heard with Cymbals."}],"6":[{"catchword":null,"tekst":"But Benaja, and Jabaziel the Priests, continually [That is, every day at certain hours] with Trumpets before the Ark of the covenant of God."}],"7":[{"catchword":null,"tekst":"Then on that day David delivered first (this psalm) to praise the LORD by the ministery [Heb. hand] of Asaph and his brethren. [That kis, kinsmen. The word rendered here first, is I the Hebrew, in the head; that is, in the beginning, or the first time. And this is so to be understood, that David first delivered this Psalm to the Levites to praise the LORDF therewith in the public service of god; after that he endited more Psalms. And delivered them to the Levites to be sung. See 2 Sam.23.1.]"}],"8":[{"catchword":null,"tekst":"Praise the LORD, call upon [Oth. Preach, publish] his name, make known his deeds among the nations [this verse, and the 14. Next following verses, are a part of the 105. Psalm. Compare them together.]"}],"9":[{"catchword":null,"tekst":"Sing unto him, sing Psalm unto him, speak attentively of all his wonderous works."}],"10":[{"catchword":null,"tekst":"Glory ye in the name of his holiness, let the heart of them that seek the LORD, rejoice. [As if he had said, remember that this is a special favor of God: That it is given to you to seek the LORD, therein you may rejoice indeed.]"}],"11":[{"catchword":null,"tekst":"Enquire after the LORD and his strength, [That is, after the strong and Almighty God, See 2 Chron.6.41.] seek his face [to wit, the Lords face, who manifesteth his presence above the ark between the Cherubims. See Jos.4.13, etc.] continually."}],"12":[{"catchword":null,"tekst":"Remember his marvelous works which he hath done, his wonder-tokens, and the Judgements of his mouth. [That is, the punishments and plagues, which he commanded Moseh to denounce against Pharao and the Egyptians, which are described Exod. Chap.7. ver.8,9.10,11,12.]"}],"13":[{"catchword":null,"tekst":"Ye seed of Israel his servant, the children of Jacob his chosen."}],"14":[{"catchword":null,"tekst":"He is the LORD our God, his judgements are over all the whole Earth. [That is, although he be a governor over the whole world, yet is Israel his peculiar and proper people by grace. Or, his judgements, that is, his punishments, which he hath caused to come upon the Enemies of his people, are made known and become famous throughout all the world.]"}],"15":[{"catchword":null,"tekst":"Remember his covenant for ever, the word (which) he instituted [See Psa.105. on v.1.] to the thousandeth generation."}],"16":[{"catchword":null,"tekst":"(The covenant) which he made with Abraham, [See Gen.15.v.18. in the exposition] and his oath unto Isaac."}],"17":[{"catchword":null,"tekst":"Which he also appointed unto Jacob for a statute, (unto) Israel for an everlasting covenant:"}],"18":[{"catchword":null,"tekst":"Saying; I will give thee the land of Canaan, a line [That is the land measured and divided with a line, See of this phrase, Due.32.9.] of your inheritance."}],"19":[{"catchword":null,"tekst":"When ye were few men in number; [Hebr. people, or, men of number, that is, people that could easily be told, because they were few. See Gen 34:30. Deu.4.27. and 33.6.] yea few [to wit, in respect of the great number of the Canaanites] and strangers in it."}],"20":[{"catchword":null,"tekst":"And they [To wit, your fathers, Abraham, Isaac and Jacob, as ye may read of them in the book of Genesis, from the eleventh chapter to the end of the book] walked from people to people, [that is, from one people to another] and from one kingdom to another people."}],"21":[{"catchword":null,"tekst":"He suffered no man to oppress them, [Or, to do them wrong] he also reproved [or he checked, he rebuked] kings [to wit, the King of Egypt, Gen 12:17. and the king at Gerar, Gen 20:3.] for their sake (saying.)"}],"22":[{"catchword":null,"tekst":"Touch not [Meaning so as to do them hurt, hurt not] mine anointed, [that is, my prophets, as immediately followeth: for the Prophets were endowed with the anointing of the Holy Ghost: as God also commanded to anoint Elisa outwardly. And here are first understood Abraham, Isaac, and Jacob, which may be called Prophets, because the Lord revealed himself unto them, and communed with them, to that end that they might likewise instinct others concerning the will of God, Gen 20:7. Abraham is called a Prophet. Concerning Isaac, see Gen 27:4,28,29,30,40. And of Jacob, Gen.49. As concerning the anointing of the Holy Ghost, the same may likewise be understood of all the elect and faithful, that have received the anointing of the Holy Ghost, 1 Job 2:27.] and do my Prophets no harm."}],"23":[{"catchword":null,"tekst":"Sing unto the LORD ye all the earth, [That is, the inhabitants of all the land, or the Israelites all together] publish his salvation [to wit, which he performeth or sheweth towards us] from day to day. [This verse, and the ten next following are recorded in the 96. Psalm.]"}],"24":[{"catchword":null,"tekst":"Declare his glory among the Heathen, his marvelous works among all Nations."}],"25":[{"catchword":null,"tekst":"For the LORD is great, and greatly to be praised, and he is terrible above all Gods. [That is, he is more to be feared and dreaded then the gods of the Heathen. The meaning is, men ought to fear and stand in awe of him, and not the Idols; for here these things are not so set one against another, by way of comparison, as if the true God were to be feared, and Idols also, saving that the true God should be feared more then Idols. But by an absolute opposition, thus that we ought to fear and tremble before God, and not before Idols, who can neither help nor hurt. See the like opposition, Luk 18:14. where the meaning is, that the publican went to his house justified, and not the Pharisee.]"}],"26":[{"catchword":null,"tekst":"For all the Gods of the Nations are Idols: [Heb.Elilim, that is, valianties, nothings. The Apostle Paul saith, 1 Cor.8.4. We know that the Idols is nothing. See Levit.19.4.] but the LORD hath made the Heavens."}],"27":[{"catchword":null,"tekst":"Majesty [Oth. Glory, or, ornament] and glory are before his face, strength and gladness are in his place. [That is with him, to wit, in heaven, or in his sanctuary, where he revealeth himself. See Psal.96.6. The Meaning is, he is a cause of strength, and of gladness, or joy of the Spirit, to those in whom he dwelleth by his Spirit.]"}],"28":[{"catchword":null,"tekst":"Give unto the LORD, ye of the Nations, give unto the LORD honor and strength. [That is, know and praise the LORDS honor and might: acknowledge his glory and strength, giving him that honor that belongeth to him.]"}],"29":[{"catchword":null,"tekst":"Give unto the LORD the honor of his Name, [That is, the honor which thou doest owe him] bring (an) offering, [or, bring hither the meat-offering, or, a gift. By a part of Gods worship, he understandeth the whole worship of God] and come before his face: worship the LORD [see Gen.22.on ver.5.] in the glory of the sanctuary. [that is in the glorious sanctuary.]"}],"30":[{"catchword":null,"tekst":"Tremble before his face, ye all the earth, [that is, all the inhabitants of the earth] the world also shall be established, that it be not moved."}],"31":[{"catchword":null,"tekst":"Let the heavens [That is, the Angels in Heaven] be glad, and let the earth [that is, the inhabitants of the earth] rejoice, and let them say among the Heathen, the LORD reigneth. [that is, he sheweth and maketh it appear indeed, that he is a King that government all things."}],"32":[{"catchword":null,"tekst":"Let the Sea roar [Heb. Thunder; that is, give a sound, as the thunder doth; that is, roar, rage, make a noise] with the fullness thereof, [that is, all that is in it. To wit, the fishes, and monsters that are in it] let the field leap for joy, with all that therein is."}],"33":[{"catchword":null,"tekst":"Then shall the tree of the wood shout before the face of the LORD, because he cometh to judge the earth. [That is, the men on the earth.]"}],"34":[{"catchword":null,"tekst":"Praise the LORD for he is good, [Otherwise, for it is good] for his kindness is for forever."}],"35":[{"catchword":null,"tekst":"And say, Deliver us, O God of our salvation, and gather us together, [That is, seeing we are now united together, keep us together still, that we do to again rent asunder, as we have been formerly rent and divided. See hereof above chap.12.29. But this may further be understood of all future misery and calamity befalling the Church of God] and deliver us from the Heathen, that we may praise thy holy Name, and that we may glory in thy praise. [to wit, thereof, or therein, that we have cause and liberty to praise thee.]"}],"36":[{"catchword":null,"tekst":"Praised be the LORD the God of Israel from eternity: and all the people said, Amen, [That is, all the people shewed, that they assented unto, and commanded such kind of praise, and that which was sung, was also the desire of their heart. See Deut.27.15.] and they praised the LORD. [Others, also // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [

    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`

    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };

    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

function toggle(n) {

document.addEventListener('click', e => {

        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
