erlijkheid van de zalige God, dat aan mij toevertrouwd is.", "1 Kor 3:1": "En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Matt 20:6": "En hij ging uit, omtrent het elfde uur, en vond anderen werkloos staan, en zei tegen hen: Wat staat u hier de hele dag werkloos?", "1 Tess 2:1": "Want u weet zelf, broeders, hoe onze komst tot u niet zonder vrucht is geweest;", "2 Tim 2:24": "En een dienstknecht van de Heere moet niet twisten, maar vriendelijk zijn tegen allen, bekwaam om te leren, en in staat om kwaad te verdragen;", "Dan 3:27": "Toen verzamelden zich de stadhouders, de overheden, de landvoogden, en de raadsheren van de koning, en zij zagen deze mannen, dat het vuur geen macht had gehad over hun lichamen, en dat het haar van hun hoofd niet verbrand was, en hun mantels niet veranderd waren, ja, dat de geur van het vuur er zelfs niet doorheen gegaan was.", "Hand 5:20": "Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.", "Hand 26:1-29": "En Agrippa zei tegen Paulus: Het is u toegestaan voor uzelf te spreken. Toen strekte Paulus de hand uit en verantwoordde zich aldus: Ik acht mijzelf gelukkig, o koning Agrippa, dat ik mij vandaag voor u zal verantwoorden over alles waarvan ik door de Joden beschuldigd word; Vooral omdat ik weet dat u kennis hebt van alle gewoonten en vragen die er onder de Joden zijn. Daarom bid ik u dat u mij lankmoedig hoort.", "Ef 4:2": "Met alle nederigheid en zachtmoedigheid, met geduld, terwijl u elkaar verdraagt in liefde;", "1 Kor 9:9": "Want in de wet van Mozes staat geschreven: U zult een dorsende os niet muilbanden. Zorgt God soms voor de ossen?", "Luk 10:42": "maar één ding is nodig; en Maria heeft het goede deel uitgekozen, dat niet van haar zal worden weggenomen.", "Fil 3:17": "Weest samen mijn navolgers, broeders, en let op degenen die zo wandelen, zoals u ons tot een voorbeeld hebt.", "Matt 18:5": "En wie zo'n kind ontvangt in Mijn Naam, die ontvangt Mij.", "Spr 14:23": "In alle smartelijke arbeid is winst; maar het woord van de lippen leidt alleen tot gebrek.", "Rom 16:24": "De genade van onze Heere Jezus Christus zij met u allen. Amen.", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Job 34:29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "2 Petr 1:16": "Want wij hebben geen kunstig verzonnen fabels nagevolgd, toen wij u de kracht en toekomst van onze Heere Jezus Christus bekendmaakten, maar wij zijn ooggetuigen geweest van Zijn majesteit.", "1 Tim 5:19": "Neem tegen een ouderling geen beschuldiging aan, dan alleen op grond van twee of drie getuigen.", "2 Kor 13:13": "Al de heiligen groeten u.", "Mark 12:30": "En u zult de Heere, uw God, liefhebben uit heel uw hart, en uit heel uw ziel, en uit heel uw verstand, en uit heel uw kracht. Dit is het eerste gebod.", "Mark 1:7": "En hij predikte en zei: Na mij komt Hij Die sterker is dan ik, van Wie ik niet waard ben mij te bukken en de riem van Zijn schoenen los te maken.", "Openb 18:4": "En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.", "Lev 10:8-11": "En de HEERE sprak tegen Aäron: Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties; En om onderscheid te maken tussen het heilige en het onheilige, en tussen het onreine en het reine;", "Hebr 10:35": "Werp dan uw vrijmoedigheid niet weg, die een grote beloning van loon heeft.", "Joh 9:22": "Dit zeiden zijn ouders, omdat zij de Joden vreesden; want de Joden hadden al met elkaar afgesproken dat als iemand beleed dat Hij de Christus was, die uit de synagoge geworpen zou worden.", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Ps 120:5-7": "O, wee mij, dat ik een vreemdeling ben in Mesech, dat ik in de tenten van Kedar woont. Mijn ziel heeft lang gewoond bij hen die de vrede haten. Ik ben vreedzaam; maar als ik spreek, zijn zij uit op oorlog.", "2 Tess 2:15": "Welnu dan, broeders, staat vast en houdt vast aan de overleveringen, die u geleerd zijn, hetzij door ons woord, hetzij door onze brief.", "Rom 5:1": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus;", "Matt 16:19": "En Ik zal u de sleutels geven van het Koninkrijk der hemelen; en alles wat u zult binden op de aarde, zal in de hemelen gebonden zijn; en alles wat u zult ontbinden op de aarde, zal in de hemelen ontbonden zijn.", "2 Kor 6:14-17": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "1 Kor 7:19": "De besnijdenis is niets, en de voorhuid is niets, maar het onderhouden van de geboden van God.", "1 Kor 8:1-13": "Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht. En als iemand meent iets te weten, die heeft nog niets gekend, zoals men behoort te kennen. Maar als iemand God liefheeft, die is door Hem gekend.", "Luk 10:7": "En blijf in dat huis, etend en drinkend wat zij u geven; want de arbeider is zijn loon waard. Ga niet van het ene huis naar het andere.", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "1 Tess 3:8": "want nu leven wij, als u vast staat in de Heere.", "1 Kor 15:28": "En wanneer Hem alle dingen onderworpen zullen zijn, dan zal ook de Zoon Zelf onderworpen worden aan Hem Die Hem alle dingen onderworpen heeft, opdat God alles in allen zal zijn.", "2 Kor 1:15": "En op dit vertrouwen wilde ik eerder naar u toe komen, opdat u een tweede keer weldaad zou ontvangen;", "Hand 14:1-28": "En het gebeurde in Ikonium, dat zij samen naar de synagoge van de Joden gingen, en zo spraken, dat een grote menigte, zowel van Joden als Grieken, geloofde. Maar de Joden die ongehoorzaam waren, zetten de heidenen aan en verbitterden hun harten tegen de broeders. Zij bleven dan daar een lange tijd, en spraken vrijmoedig in de Heere, Die getuigenis gaf aan het Woord van Zijn genade, en gaf dat er tekenen en wonderen gebeurden door hun handen.", "Num 20:13": "Dit zijn de wateren van Meriba, waar de kinderen van Israël met de HEERE getwist hebben; en Hij werd aan hen geheiligd.", "Matt 5:5": "Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "Job 11:18": "En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen;", "2 Tim 4:5": "Maar u, wees waakzaam in alles, verdraag verdrukkingen, doe het werk van een evangelist, vervul uw dienst ten volle.", "2 Tess 3:7-10": "Want u zelf weet hoe men ons behoort na te volgen; want wij hebben ons niet ongeregeld gedragen onder u; En wij hebben geen brood bij iemand gegeten voor niets, maar in arbeid en moeite, nacht en dag werkend, opdat wij niemand van u lastig zouden zijn; Niet dat wij de macht niet hebben, maar opdat wij onszelf u zouden geven tot een voorbeeld, om ons na te volgen.", "Judas 1:24": "Aan Hem nu, Die machtig is u voor struikelen te bewaren, en onstraffelijk te stellen voor Zijn heerlijkheid, in vreugde,", "Hand 1:20": "Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.", "1 Kor 7:20": "Ieder moet blijven in de roeping waarin hij geroepen is.", "Tit 2:13": "Verwachtend de zalige hoop en verschijning van de heerlijkheid van de grote God en onze Zaligmaker Jezus Christus;", "Hand 3:20": "En Hij Jezus Christus zal gezonden hebben, Die u van tevoren gepredikt is;", "Mark 10:43-45": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die zal uw dienaar zijn. En wie van u de eerste wil worden, die zal ieders dienstknecht zijn. Want ook de Zoon des mensen is niet gekomen om gediend te worden, maar om te dienen, en Zijn leven te geven als losprijs voor velen.", "Kol 1:19": "Want het is het welbehagen van de Vader geweest, dat in Hem heel de volheid wonen zou;", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Gen 31:3": "En de HEERE zei tegen Jakob: Keer terug naar het land van uw vaderen, en naar uw familie, en Ik zal met u zijn.", "Joz 23:11": "Daarom bewaart uw zielen zorgvuldig, dat u de HEERE, uw God, liefhebt.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "Deut 13:12-18": "Wanneer u van een van uw steden, die de HEERE, uw God, u geeft om daar te wonen, zult horen zeggen: Er zijn mannen, kinderen van Belial, uit uw midden uitgegaan, en hebben de inwoners van hun stad aangedreven, en gezegd: Laat ons gaan, en andere goden dienen, die u niet gekend hebt; dan zult u onderzoeken, en naspeuren, en goed navragen; en zie, als het de waarheid is, de zaak zeker vaststaat, zo'n gruwel in uw midden gedaan is;", "Pred 10:18": "Door grote luiheid verzwakt het gebint, en door slapheid van de handen lekt het huis door.", "Ps 17:15": "Maar ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal ontwaken.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Ezech 9:6": "Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren.", "Luk 24:26": "Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan?", "2 Tess 2:12": "opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "1 Tim 4:6": "Als u deze dingen aan de broeders voorhoudt, zult u een goede dienaar van Jezus Christus zijn, gevoed door de woorden van het geloof en van de goede leer, die u gevolgd hebt.", "1 Petr 2:19-23": "Want dat is genade, als iemand omwille van het geweten voor God moeite verdraagt, terwijl hij ten onrechte lijdt. Want wat lof is het, als u het verdraagt wanneer u zondigt en daarvoor geslagen wordt? Maar als u het verdraagt wanneer u goeddoet en daarvoor lijdt, dat is genade bij God. Want hiertoe bent u geroepen, omdat ook Christus voor ons geleden heeft, ons een voorbeeld nalatend, opdat u Zijn voetstappen zou navolgen;", "Matt 13:58": "En Hij heeft daar niet veel krachten gedaan, vanwege hun ongeloof.", "Hebr 6:1": "Laten wij daarom het beginsel van de leer van Christus achterlaten en doorgaan tot de volmaaktheid; niet opnieuw het fundament leggend van de bekering van dode werken en van het geloof in God,", "Fil 1:21": "Want het leven is voor mij Christus, en het sterven is winst.", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "1 Kor 1:22": "Omdat de Joden een teken begeren, en de Grieken wijsheid zoeken;", "Joh 7:18": "Wie uit zichzelf spreekt, zoekt zijn eigen eer; maar wie de eer zoekt van Hem die hem gezonden heeft, die is waarachtig, en er is geen ongerechtigheid in Hem.", "Spr 2:19": "Allen die tot haar ingaan, zullen niet terugkomen, en zullen de paden van het leven niet bereiken;", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "1 Kor 16:14": "Laat al uw dingen in de liefde gebeuren.", "Mark 13:20": "En als de Heere de dagen niet verkort had, zou geen vlees behouden worden; maar omwille van de uitverkorenen, die Hij uitverkoren heeft, heeft Hij de dagen verkort.", "Kol 3:8": "Maar leg nu ook u dit alles af: gramschap, toorn, kwaadheid, lastering, vuil spreken uit uw mond.", "Matt 18:6": "Maar wie een van deze kleinen die in Mij geloven, doet struikelen, voor hem zou het beter zijn dat een molensteen aan zijn hals gehangen werd en dat hij in de diepte van de zee verzonken werd.", "Ps 139:22": "Ik haat hen met volkomen haat, tot vijanden zijn zij mij.", "Ps 95:8-11": "Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn; Waar uw vaders Mij verzochten, Mij beproefden, ook Mijn werk zagen. Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd: Zij zijn een volk dat dwaalt van hart, en zij kennen Mijn wegen niet.", "Ezech 11:16": "Daarom, zeg: Zo zegt de Heere HEERE: Hoewel Ik hen ver onder de heidenvolken weggedaan heb, en hoewel Ik hen in de landen verstrooid heb, zal Ik hun toch een korte tijd tot een heiligdom zijn, in de landen waar zij naartoe gekomen zijn.", "Num 20:12": "Daarom zei de HEERE tot Mozes en tot Aäron: Omdat u Mij niet geloofd hebt, door Mij te heiligen voor de ogen van de kinderen van Israël, daarom zult u deze gemeente niet brengen in het land, dat Ik hun gegeven heb.", "Fil 3:8": "Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen,", "Ps 124:1-8": "Een lied Hammaäloth, van David. Als de HEERE niet bij ons geweest was, laat Israël dat nu zeggen: Als de HEERE niet bij ons geweest was, toen de mensen tegen ons opstonden, dan zouden zij ons levend verslonden hebben, toen hun toorn tegen ons ontstak.", "Spr 14:29": "Wie lankmoedig is, is groot van verstand; maar wie haastig is van gemoed, verheft de dwaasheid.", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "1 Kor 14:37": "Als iemand meent een profeet te zijn, of geestelijke, die erkent dat hetgeen ik u schrijf, geboden van de Heere zijn.", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Gen 31:13": "Ik ben die God van Bethel, waar u het opgerichte teken gezalfd hebt, waar u Mij een gelofte beloofd hebt; nu, maak u op, vertrek uit dit land, en keer terug naar het land van uw familie.", "2 Tess 2:5": "Herinnert u zich niet, dat ik, toen ik nog bij u was, u deze dingen gezegd heb?", "Joh 16:27": "Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Spr 13:4": "De ziel van de luiaard is begerig, doch er is niets; maar de ziel van de vlijtigen zal vet gemaakt worden.", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Spr 16:26": "De ziel van de arbeidzame arbeidt voor zichzelf; want zijn mond dringt hem daartoe.", "Spr 17:1": "Een droge bete brood, en rust daarbij, is beter, dan een huis vol geslachte beesten met twist.", "2 Kor 10:3": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Ps 60:6": "Maar nu hebt U hun die U vrezen een banier gegeven, om die op te werpen, vanwege de waarheid. Sela.", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "2 Kor 2:11": "opdat de satan geen voordeel over ons krijgt; want zijn gedachten zijn ons niet onbekend.", "Matt 10:11-13": "En in welke stad of dorp u ook ingaat, onderzoekt wie daarin waardig is; en blijft daar, totdat u vertrekt. En als u het huis ingaat, groet het dan. En als dat huis waardig is, laat uw vrede dan over dat huis komen; maar als het niet waardig is, laat uw vrede dan naar u terugkeren.", "Ezech 34:25": "En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden.", "1 Joh 3:18": "Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid.", "Kol 2:20-23": "Als u dan met Christus afgestorven bent aan de eerste beginselen van de wereld, waarom laat u zich, alsof u nog in de wereld leefde, inzettingen opleggen, Namelijk: raak niet, en proef niet, en roer niet aan? Al die dingen vergaan door het gebruik ervan, en zijn ingevoerd naar de geboden en leringen van mensen;", "Ps 106:34": "Zij hebben die volken niet verdelgd, die de HEERE hun gezegd had;", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "2 Kor 6:4-6": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten, in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,", "Jer 22:13": "Wee hem die zijn huis bouwt met ongerechtigheid, en zijn bovenzalen met onrecht; die de dienst van zijn naaste voor niets gebruikt, en hem zijn arbeidsloon niet geeft!", "Mal 1:13": "Verder zegt u: Zie, wat een vermoeidheid! maar u zou het kunnen wegblazen, zegt de HEERE van de heerscharen; u brengt ook wat geroofd is, en wat kreupel en krank is; u brengt ook spijsoffer; zou Mij dat aangenaam zijn van uw hand? zegt de HEERE.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Lev 7:27": "Elke ziel die enig bloed eet, die ziel zal uit haar volk uitgeroeid worden.", "2 Petr 2:7": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft;", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Hebr 3:16-19": "Want sommigen, toen zij die gehoord hadden, hebben Hem verbitterd, maar niet allen die uit Egypte door Mozes weggetrokken zijn. Over wie nu is Hij veertig jaar lang vertoornd geweest? Was het niet over hen die gezondigd hadden, van wie de lichamen gevallen zijn in de woestijn? En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "Rom 10:7": "Of: wie zal in de afgrond neerdalen? Dat is: om Christus uit de doden op te brengen.", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "1 Tess 5:12": "En wij bidden u, broeders, erken hen die onder u arbeiden, en uw voorstanders zijn in de Heere, en u vermanen;", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "Deut 10:9": "Daarom heeft Levi geen deel, en ook geen erfdeel met zijn broeders; de HEERE is zijn erfdeel, zoals de HEERE, uw God, tegen hem gesproken heeft.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Mark 9:1": "En Hij zei tegen hen: Voorwaar, Ik zeg u, dat er sommigen zijn van hen die hier staan, die de dood niet zullen smaken, totdat zij gezien zullen hebben dat het Koninkrijk van God met kracht gekomen is.", "Jes 58:12": "En zij die uit u voortkomen, zullen de oude verwoeste plaatsen bouwen; de fundamenten, van geslacht tot geslacht verwoest, zult u oprichten; en u zult genoemd worden: Die de bressen dichtmuurt, die de paden weer opmaakt, om te bewonen.", "Openb 22:11": "Die onrecht doet, laat hij nog onrecht doen; en die vuil is, laat hij nog vuil worden; en die rechtvaardig is, laat hij nog gerechtvaardigd worden; en die heilig is, laat hij nog geheiligd worden.", "1 Tim 5:16-21": "Als een gelovige man of gelovige vrouw weduwen heeft, moet die haar voldoende hulp geven, en moet de gemeente niet belast worden, opdat zij hun die echt weduwen zijn voldoende hulp kan geven. De oudsten die goed leiding geven, moeten dubbele eer waardig geacht worden, vooral wie arbeiden in het Woord en de leer. Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Matt 10:15": "Voorwaar, Ik zeg u: het zal voor het land van Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Jer 31:18-20": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God! Zeker, nadat ik bekeerd ben, heb ik berouw gehad, en nadat ik mijzelf ben bekendgemaakt, heb ik op de heup geklopt, ik ben beschaamd, ja, ook schaamrood geworden, omdat ik de smaad van mijn jeugd gedragen heb. Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "Joh 15:27": "En u zult ook getuigen, want u bent van het begin met Mij geweest.", "Num 11:21-23": "En Mozes zei: Zeshonderdduizend man te voet is dit volk, in wiens midden ik ben; en U hebt gezegd: Ik zal hun vlees geven, en zij zullen een hele maand eten! Zullen dan voor hen schapen en runderen geslacht worden, zodat het voor hen genoeg is? Zullen alle vissen van de zee voor hen verzameld worden, zodat het voor hen genoeg is? Maar de HEERE zei tegen Mozes: Zou dan de hand van de HEERE verkort zijn? U zult nu zien of Mijn woord u zal overkomen, of niet.", "Micha 7:14": "Weid Ú dan Uw volk met Uw staf, de kudde van Uw erfenis, die alleen woont, in het woud, midden in een vruchtbaar land; laat ze weiden in Basan en Gilead, als in de dagen van ouds.", "1 Tess 4:11": "En dat u zich beijvert om stil te zijn, en uw eigen zaken te doen, en te werken met uw eigen handen, zoals wij u bevolen hebben;", "1 Joh 4:19": "Wij hebben Hem lief, omdat Hij ons eerst lief heeft gehad.", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Klaagl 3:28-30": "Jod. Hij zit eenzaam, en zwijgt stil, omdat Hij het hem opgelegd heeft. Jod. Hij stekt zijn mond in het stof, en zegt: Misschien is er verwachting. Jod. Hij geeft zijn wang aan hem die hem slaat, hij wordt zat van smaad.", "1 Petr 5:9": "Weersta hem, vast staand in het geloof, in de wetenschap dat hetzelfde lijden wordt volbracht aan uw broederschap die in de wereld is.", "Ef 3:14-19": "Om deze reden buig ik mijn knieën voor de Vader van onze Heere Jezus Christus, uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt, opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "Joh 17:26": "En Ik heb hun Uw Naam bekendgemaakt, en zal Hem bekendmaken; opdat de liefde waarmee U Mij liefgehad hebt, in hen is, en Ik in hen.", "Jes 26:3": "Het is een vast voornemen: U zult allerlei vrede bewaren, want men heeft op U vertrouwd.", "Hand 16:10": "Toen hij nu dit visioen gezien had, zochten wij meteen naar Macedonië te reizen, omdat wij daaruit opmaakten dat de Heere ons geroepen had om hun het Evangelie te verkondigen.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Tit 2:7": "Laat uzelf in alles zien als een voorbeeld van goede werken, in de leer onvervalstheid, deftigheid, oprechtheid;", "Ps 85:9-11": "Ik zal horen wat God, de HEERE, spreken zal; want Hij zal tot Zijn volk en tot Zijn gunstgenoten van vrede spreken; maar laat hen niet weer tot dwaasheid terugkeren. Zeker, Zijn heil is nabij hen die Hem vrezen, opdat in ons land eer woont. De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Matt 25:1-13": "Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen. En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Rom 1:8": "Eerst dank ik mijn God door Jezus Christus voor u allen, dat uw geloof verkondigd wordt in de hele wereld.", "Hebr 12:16": "Dat niemand een hoereerder is, of een onheilige, zoals Ezau, die om één voedsel zijn eerstgeboorterecht wegdeed.", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Spr 30:25-28": "De mieren zijn een volk zonder kracht; toch bereiden zij in de zomer hun voedsel. De klipdassen zijn een machteloos volk; toch bouwen zij hun huis in de rots. De sprinkhanen hebben geen koning; toch trekken zij allen uit, verdeeld in groepen.", "Hand 17:21": "(Want alle Atheners en de vreemdelingen die zich daar ophielden, besteedden hun tijd aan niets anders dan om iets nieuws te vertellen of te horen.)", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen hen die het loon van de dagloner met geweld inhouden, die de weduwe, en de wees, en de vreemdeling het recht verdraaien, en Mij niet vrezen, zegt de HEERE van de heerscharen.", "Ef 4:14": "Opdat wij niet meer kinderen zouden zijn, die heen en weer bewogen en meegevoerd worden met elke wind van leer, door het bedrog van de mensen, door arglistigheid, om listig tot dwaling te brengen;", "Spr 2:12": "Om u te redden van de kwade weg, van de man die verkeerdheden spreekt;", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Lev 19:5-8": "En wanneer u een dankoffer de HEERE offeren zult, naar uw welgevallen zult u dat offeren. Op de dag van uw offeren, en de volgende dag, zal het gegeten worden; maar wat tot op de derde dag overblijft, zal met vuur verbrand worden. En als het op de derde dag toch gegeten wordt, is het een afschuwelijk ding, het zal niet aangenaam zijn.", "Joh 15:12": "Dit is Mijn gebod, dat u elkaar liefhebt, zoals Ik u liefgehad heb.", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "Openb 12:6": "En de vrouw vluchtte naar de woestijn, waar zij een plaats had, door God voor haar bereid, opdat zij haar daar zouden voeden duizend tweehonderd zestig dagen.", "Hand 13:40": "Kijk dan uit, dat over u niet komt wat gezegd is in de profeten:", "1 Tess 1:2": "Wij danken God altijd voor u allen, terwijl wij aan u denken in onze gebeden;", "Joh 1:11": "Hij is gekomen tot het Zijne, en de Zijnen hebben Hem niet aangenomen.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Joh 6:71": "En Hij zei dit over Judas, de zoon van Simon, Iskariot; want deze zou Hem verraden, hoewel hij een van de twaalf was.", "Ps 31:7": "Ik haat hen die op valse ijdelheden acht slaan, en ik vertrouw op de HEERE.", "Hebr 10:23": "Laten wij de onwankelbare belijdenis van de hoop vasthouden (want Die het beloofd heeft, is trouw);", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Hebr 6:12": "opdat u niet traag wordt, maar navolgers bent van hen die door geloof en geduld de beloften beërven.", "Filem 1:21": "Ik heb aan u geschreven, vertrouwend op uw gehoorzaamheid; en ik weet dat u ook meer zult doen dan wat ik zeg.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Joh 21:17": "Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "2 Petr 1:2-4": "Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere; Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd; Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Ps 147:3": "Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "Rom 8:33-35": "Wie zal een beschuldiging inbrengen tegen de uitverkorenen van God? God is het Die rechtvaardigt. Wie is het die veroordeelt? Christus is het Die gestorven is; ja, meer nog, Die ook opgewekt is, Die ook aan de rechterhand van God is, Die ook voor ons bidt. Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard?", "Lev 22:3": "Zeg tegen hen: Elke man onder uw geslachten, uit uw hele nageslacht, die tot de heilige dingen zal naderen die de kinderen van Israël de HEERE heiligen, terwijl zijn onreinheid op hem is; die mens zal van voor Mijn aangezicht uitgeroeid worden; Ik ben de HEERE!", "Spr 10:30": "De rechtvaardige zal in eeuwigheid niet wankelen; maar de goddelozen zullen de aarde niet bewonen.", "Matt 24:1-51": "En Jezus ging weg en vertrok van de tempel; en Zijn discipelen kwamen bij Hem om Hem de gebouwen van de tempel te tonen. En Jezus zei tegen hen: Ziet u niet al deze dingen? Voorwaar, Ik zeg u: hier zal geen steen op de andere steen gelaten worden, die niet zal worden afgebroken. En toen Hij op de Olijfberg zat, kwamen de discipelen alleen bij Hem en zeiden: Zeg ons, wanneer zullen deze dingen gebeuren? En wat zal het teken zijn van Uw komst en van het einde van de wereld?", "1 Tim 5:20": "Bestraf hen die zondigen in aanwezigheid van allen, opdat ook de anderen ontzag mogen hebben.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Jer 33:6": "Zie, Ik zal haar gezondheid en genezing laten opkomen, en Ik zal hen genezen, en Ik zal hun een overvloed van vrede en waarheid openbaren.", "Rom 10:14": "Hoe zullen zij Hem dan aanroepen, in Wie zij niet geloofd hebben? En hoe zullen zij in Hem geloven, van Wie zij niet gehoord hebben? En hoe zullen zij horen, zonder iemand die hun predikt?", "Ps 15:4": "In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Jes 33:20": "Bekijk Sion, de stad van onze samenkomsten; uw ogen zullen Jeruzalem zien, een rustige woonplaats, een tent, die niet neergehaald zal worden, waarvan de pinnen in eeuwigheid niet uitgetrokken zullen worden, en waarvan geen touwen verscheurd zullen worden.", "1 Kon 8:29": "Dat Uw ogen open zijn, nacht en dag, over dit huis, over deze plaats, waarvan U gezegd hebt: Mijn Naam zal daar zijn; om te horen naar het gebed, dat Uw dienaar bidden zal op deze plaats.", "Jes 56:7": "Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.", "2 Kor 2:6-8": "Voor zo iemand is deze bestraffing genoeg, die door velen is gegeven. Zodat u hem daarentegen juist moet vergeven en vertroosten, opdat zo iemand niet door al te overvloedige droefheid verzwolgen wordt. Daarom bid ik u dat u de liefde voor hem bevestigt.", "Joz 23:7": "Dat u niet ingaat tot deze volken: deze, die overgebleven zijn bij u; gedenkt ook niet aan de naam van hun goden, en laat er niet bij zweren, en dient hen niet, en buigt u voor hen niet;", "Ps 42:2": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God!", "Joh 5:42": "maar Ik ken u, dat u de liefde van God niet in uzelf hebt.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Matt 18:18": "Voorwaar, Ik zeg u: alles wat u op de aarde bindt, zal in de hemel gebonden zijn; en alles wat u op de aarde ontbindt, zal in de hemel ontbonden zijn.", "2 Tess 1:2": "Genade zij u, en vrede, van God, onze Vader, en de Heere Jezus Christus.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Deut 9:3": "Zo zult u vandaag weten, dat de HEERE, uw God, Degene is die voor uw aangezicht doorgaat, een verterend vuur: Die zal hen verdelgen, en Die zal hen voor uw aangezicht neerwerpen; en u zult ze uit de bezitting verdrijven, en zult hen snel te niet doen, zoals de HEERE tot u gesproken heeft.", "2 Kor 7:12": "Hoewel ik dan aan u geschreven heb, was dat niet om diegene die onrecht gedaan had, en ook niet om diegene die onrecht gedaan was, maar opdat onze vlijtigheid voor u bij u openbaar zou worden, in de tegenwoordigheid van God.", "1 Tess 2:8-11": "zo hebben wij, omdat wij zeer aan u gehecht waren, u graag niet alleen het Evangelie van God willen geven, maar ook onze eigen zielen, omdat u ons lief geworden was. Want u herinnert zich, broeders, onze inspanning en moeite; want terwijl wij nacht en dag werkten, om niemand van u tot last te zijn, hebben wij het Evangelie van God onder u gepredikt. U bent getuigen, en God ook, hoe heilig, en rechtvaardig, en onberispelijk wij ons onder u, die gelooft, gedragen hebben.", "1 Tess 5:15": "Zie erop toe dat niemand kwaad met kwaad vergeldt bij wie dan ook; maar jaag altijd het goede na, zowel tegenover elkaar als tegenover allen.", "Kol 1:4": "sinds wij van uw geloof in Christus Jezus gehoord hebben, en van de liefde die u hebt tot alle heiligen.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "Jes 10:27": "En het zal gebeuren op diezelfde dag, dat zijn last zal afwijken van uw schouder, en zijn juk van uw hals; en het juk zal verdorven worden, vanwege de Gezalfde.", "1 Petr 2:8": "En een steen des aanstoots, en een rots der ergernis; namelijk voor hen die zich aan het Woord stoten, ongehoorzaam als zij zijn, waartoe zij ook bestemd zijn.", "Hand 21:13": "Maar Paulus antwoordde: Wat doet u, dat u weent en mijn hart week maakt? Want ik ben bereid niet alleen gebonden te worden, maar ook te sterven te Jeruzalem, voor de Naam van de Heere Jezus.", "Hand 13:50": "Maar de Joden zetten de godsdienstige en aanzienlijke vrouwen op, en de voornaamsten van de stad, en verwekten vervolging tegen Paulus en Barnabas, en verdreven hen uit hun gebied.", "Hebr 12:14": "Jaag de vrede na met allen, en de heiligmaking, zonder welke niemand de Heere zien zal;", "Ps 20:2-5": "De HEERE verhoort u in de dag van benauwdheid; de Naam van de God van Jakob zet u in een hoog vertrek. Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion. Hij gedenkt al uw spijsoffers, en maakt uw brandoffer tot as. Sela.", "Hand 17:16": "En terwijl Paulus hen te Athene verwachtte, werd zijn geest in hem geprikkeld, toen hij zag dat de stad zo vol afgoden was.", "Mark 4:22": "Want er is niets verborgen, dat niet openbaar zal worden; en er is niets gebeurd om verborgen te blijven, maar opdat het openbaar zou worden.", "Hebr 7:2": "aan wie Abraham ook van alles de tienden gaf; hij wordt eerst vertaald met 'koning van de gerechtigheid', en daarna was hij ook koning van Salem, dat is: koning van de vrede;", "Zef 3:15": "De HEERE heeft uw oordelen weggenomen, Hij heeft uw vijand weggevaagd; de Koning van Israël, de HEERE, is in uw midden, u zult geen kwaad meer zien.", "Ps 108:2": "O God! Mijn hart is bereid; ik zal zingen en psalmzingen, ook mijn eer.", "Matt 27:55-61": "En daar waren veel vrouwen, die van veraf toekeken, die Jezus vanuit Galilea gevolgd waren om Hem te dienen. Onder hen waren Maria Magdalena, en Maria, de moeder van Jakobus en Joses, en de moeder van de zonen van Zebedeüs. En toen het avond geworden was, kwam er een rijk man uit Arimathea, genaamd Jozef, die ook zelf een discipel van Jezus was.", "2 Kor 12:17-19": "Heb ik door iemand van hen die ik naar u toe gezonden heb, van u mijn voordeel gezocht? Ik heb Titus gevraagd, en de broeder meegezonden; heeft ook Titus van u zijn voordeel gezocht? Hebben wij niet in dezelfde geest gewandeld? Hebben wij niet in dezelfde voetstappen gewandeld? Denkt u opnieuw dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw opbouw.", "Hebr 12:3": "Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Openb 5:4": "En ik huilde erg, omdat niemand waard bevonden werd om dat boek te openen en te lezen, of erin te zien.", "Ps 37:28": "Want de HEERE heeft het recht lief, en zal Zijn gunstgenoten niet verlaten; in eeuwigheid worden zij bewaard; maar het nageslacht van de goddelozen wordt uitgeroeid.", "Ezech 33:1-9": "En het woord van de HEERE kwam tot mij: Mensenkind! Spreek tot de kinderen van uw volk, en zeg tegen hen: Wanneer Ik het zwaard over een land breng, en het volk van het land een man uit hun gebied neemt en hem voor zichzelf tot een wachter stelt; En hij het zwaard over het land ziet komen, en op de bazuin blaast en het volk waarschuwt;", "Mark 13:1-37": "En toen Hij de tempel uitging, zei een van Zijn discipelen tegen Hem: Meester, kijk, wat voor stenen, en wat voor gebouwen! En Jezus antwoordde en zei tegen hem: Ziet u deze grote gebouwen? Er zal niet één steen op de andere steen gelaten worden, die niet afgebroken zal worden. En toen Hij op de Olijfberg zat, tegenover de tempel, vroegen Petrus, en Jakobus, en Johannes, en Andreas Hem apart:", "Ps 80:18": "Uw hand zij over de man van Uw rechterhand, over de zoon van de mens, die U voor Uzelf gesterkt hebt.", "Deut 30:6": "En de HEERE, uw God, zal uw hart besnijden, en het hart van uw nageslacht, om de HEERE, uw God, lief te hebben met uw ganse hart en met uw ganse ziel, opdat u leeft.", "Ezech 3:17-21": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd.", "Fil 3:20": "Maar onze wandel is in de hemelen, waaruit wij ook de Zaligmaker verwachten, namelijk de Heere Jezus Christus;", "Rom 13:8-14": "Wees niemand iets schuldig, dan elkaar lief te hebben; want hij die de ander liefheeft, heeft de wet vervuld. Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf. De liefde doet de naaste geen kwaad. Dus is de liefde de vervulling van de wet.", "3 Joh 1:10": "Daarom zal ik, als ik kom, zijn werken in herinnering brengen die hij doet, doordat hij met boze woorden tegen ons snatert; en hij is daarmee niet tevreden, want hij neemt zelf de broeders niet aan en verhindert hen die het willen doen, en werpt hen uit de gemeente.", "1 Tess 1:5": "Want ons Evangelie is bij u niet alleen met woorden gekomen, maar ook met kracht, en met de Heilige Geest, en met veel zekerheid; zoals u weet wat voor mensen wij bij u geweest zijn, ter wille van u.", "Jes 32:18": "En mijn volk zal in een woonplaats van vrede wonen, en in welverzekerde woningen, en in stille geruste plaatsen.", "Mark 12:32": "En de schriftgeleerde zei tegen Hem: Meester, U hebt naar waarheid goed gezegd dat er een enig God is, en er is geen ander dan Hij;", "Deut 24:14": "U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.", "Ps 1:6": "Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Hand 8:15": "die, toen zij aangekomen waren, voor hen baden, opdat zij de Heilige Geest zouden ontvangen.", "Mark 14:62": "En Jezus zei: Ik ben het. En u zult de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen met de wolken van de hemel.", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "Num 19:13": "Ieder die een dode, het dode lichaam van een mens die gestorven is, aanraakt, en zich niet ontzondigd zal hebben, die verontreinigt de tabernakel van de HEERE; daarom zal die ziel uitgeroeid worden uit Israël; omdat het water van de afzondering niet op hem gesprenkeld is, zal hij onrein zijn; zijn onreinheid is nog in hem.", "Luk 2:26-29": "En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen, nam hij Hem in zijn armen, en loofde God, en zei:", "Jer 31:9": "Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "Jak 2:5": "Luister, mijn geliefde broeders, heeft God niet de armen van deze wereld uitverkoren, om rijk te zijn in het geloof, en erfgenamen van het Koninkrijk, dat Hij belooft aan hen die Hem liefhebben?", "1 Petr 5:3": "ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "Hand 13:41": "Zie, u verachters, verwonder u, en verdwijn; want Ik doe een werk in uw dagen, een werk dat u beslist niet zult geloven, ook al vertelt iemand het u.", "Ps 145:14": "Samech. De HEERE ondersteunt allen die vallen, en Hij richt op alle gebogenen.", "Pred 7:9": "Wees niet haastig in uw geest om te toornen; want de toorn rust in de boezem van de dwazen.", "Ps 17:7": "Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan!", "Luk 22:35": "En Hij zei tegen hen: Toen Ik u uitzond zonder buidel en tas en schoenen, heeft u toen iets ontbroken? En zij zeiden: Niets.", "Spr 22:13": "De luiaard zegt: Er is een leeuw buiten; ik zou wel eens midden op straat gedood kunnen worden!", "Fil 2:12-16": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven: Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen. Doe alle dingen zonder murmureren en tegenspreken;", "Spr 6:6-11": "Ga naar de mier, u luiaard! Bekijk haar wegen, en word wijs; terwijl zij geen leider, opzichter of heerser heeft, bereidt zij haar brood in de zomer, verzamelt zij haar voedsel in de oogst.", "Ps 96:10": "Zegt onder de heidenen: De HEERE regeert; ook zal de wereld vaststaan, zij zal niet wankelen; Hij zal de volken oordelen in alle rechtvaardigheid.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "Rom 15:14": "Doch, mijn broeders, ook ik zelf ben ervan verzekerd dat u ook zelf vol bent van goedheid, vervuld met alle kennis, in staat om ook elkaar te vermanen.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Deut 16:12": "En u zult gedenken dat u een dienstknecht geweest bent in Egypte; en u zult deze inzettingen houden en doen.", "Pred 11:6": "Zaai uw zaad in de morgenstond, en trek uw hand 's avonds niet terug; want u weet niet wat goed uit zal komen, of dit of dat, of dat die beide samen goed zullen zijn.", "Pred 2:17-22": "Daarom haatte ik dit leven, want dit werk dat onder de zon gebeurt, leek mij slecht; want het is allemaal ijdelheid en kwelling van de geest. Ik haatte ook al mijn arbeid die ik onder de zon verricht had, omdat ik die zou moeten achterlaten aan een mens die na mij komen zal. Want wie weet of hij wijs zal zijn of dwaas? Toch zal hij heersen over al mijn arbeid, die ik met inspanning verricht heb en waarin ik mij wijs heb betoond onder de zon. Dat is ook ijdelheid.", "1 Kor 2:14": "Maar de natuurlijke mens begrijpt niet de dingen die van de Geest van God zijn; want ze zijn hem dwaasheid, en hij kan ze niet verstaan, omdat ze geestelijk beoordeeld worden.", "2 Tess 3:7-9": "Want u zelf weet hoe men ons behoort na te volgen; want wij hebben ons niet ongeregeld gedragen onder u; En wij hebben geen brood bij iemand gegeten voor niets, maar in arbeid en moeite, nacht en dag werkend, opdat wij niemand van u lastig zouden zijn; Niet dat wij de macht niet hebben, maar opdat wij onszelf u zouden geven tot een voorbeeld, om ons na te volgen.", "2 Kor 8:22": "Wij hebben ook met hen gezonden onze broeder, die wij in veel dingen dikwijls beproefd hebben, dat hij naarstig is; en nu veel naarstiger, door het grote vertrouwen, dat hij heeft tot u.", "Jer 23:4": "En Ik zal herders over hen doen opstaan, die ze weiden zullen; en zij zullen niet meer vrezen, noch verschrikt worden, noch gemist worden, spreekt de HEERE.", "1 Kor 4:1": "Zo houdt men ons voor, ieder mens: als dienaars van Christus, en uitdelers van de verborgenheden van God.", "Kol 2:7": "Geworteld en opgebouwd in Hem, en bevestigd in het geloof, zoals u geleerd bent, overvloedig zijnde daarin, met dankzegging.", "2 Sam 24:25": "En David bouwde daar de HEERE een altaar, en offerde brandoffers en dankoffers. Zo werd de HEERE verbeden voor het land, en deze plaag werd van over Israël opgehouden.", "2 Tim 2:25": "met zachtmoedigheid onderwijzend hen die tegenstand bieden; of God hun misschien op enig moment bekering zou geven tot erkenning van de waarheid;", "Ps 149:4": "Want de HEERE heeft een welgevallen aan Zijn volk; Hij zal de zachtmoedigen versieren met heil.", "1 Kron 29:18": "O HEERE, God van onze vaders, Abraham, Izak en Israël, bewaar dit voor eeuwig in de gedachten van het hart van Uw volk, en richt hun hart op U.", "Fil 1:20": "Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood.", "Openb 3:5": "Wie overwint, die zal bekleed worden met witte kleren; en Ik zal zijn naam beslist niet uitwissen uit het boek van het leven, en Ik zal zijn naam belijden voor Mijn Vader en voor Zijn engelen.", "Ps 25:22": "O God! verlos Israël uit al zijn benauwdheden.", "Deut 21:18-21": "Wanneer iemand een koppige en opstandige zoon heeft, die niet luistert naar de stem van zijn vader en de stem van zijn moeder; en zij hem gestraft hebben, en hij toch niet naar hen wil horen, Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats. En zij zullen tegen de oudsten van zijn stad zeggen: Deze zoon van ons is koppig en opstandig, hij wil niet naar ons luisteren; hij is een brasser en een dronkaard.", "Ps 116:6": "De HEERE bewaart de eenvoudigen; ik was uitgeteerd, maar Hij heeft mij verlost.", "Joh 12:48": "Wie Mij verwerpt en Mijn woorden niet ontvangt, heeft iemand die hem oordeelt; het woord dat Ik gesproken heb, dat zal hem oordelen op de laatste dag.", "Ps 28:3": "Trek mij niet weg met de goddelozen, en met de werkers van de ongerechtigheid, die van vrede spreken met hun naasten, maar kwaad is er in hun hart.", "Jak 1:7": "Want laat die mens niet menen dat hij iets ontvangen zal van de Heere.", "Dan 12:3": "De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "1 Kor 14:33": "Want God is geen God van verwarring, maar van vrede, zoals in al de Gemeenten der heiligen.", "Rom 10:15": "En hoe zullen zij prediken, als zij niet gezonden worden? Zoals geschreven is: Hoe lieflijk zijn de voeten van hen die vrede verkondigen, van hen die het goede verkondigen!", "Joh 1:10": "Hij was in de wereld, en de wereld is door Hem gemaakt; en de wereld heeft Hem niet gekend.", "Gal 1:3": "Genade zij u en vrede van God de Vader, en onze Heere Jezus Christus;", "2 Kor 1:17-19": "Toen ik dit dan van plan was, heb ik dan lichtvaardig gehandeld? Of neem ik mijn voornemens naar het vlees, zodat bij mij zou zijn: ja, ja, en nee, nee? Maar God is getrouw: ons woord aan u is niet ja en nee geweest. Want de Zoon van God, Jezus Christus, Die onder u door ons gepredikt is, namelijk door mij, en Silvanus, en Timotheüs, was niet ja en nee, maar is geweest ja in Hem.", "Pred 4:5": "De dwaas vouwt zijn handen samen, en eet zijn eigen vlees.", "1 Kor 11:1": "Wees mijn navolgers, zoals ik ook navolger ben van Christus.", "Jes 32:17": "En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "Gen 19:15": "En toen de dageraad opging, drongen de engelen bij Lot aan en zeiden: Maak u klaar, neem uw vrouw, en uw twee dochters die hier zijn, opdat u niet omkomt door de ongerechtigheid van deze stad.", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "Gal 6:6": "En wie onderwezen wordt in het Woord, moet delen van alle goederen met hem die hem onderwijst.", "2 Tim 1:3": "Ik dank God, aan Wie ik dien vanaf mijn voorouders met een rein geweten, zoals ik zonder ophouden aan u denk in mijn gebeden, nacht en dag;", "1 Petr 1:8": "Hem, Die u niet gezien hebt en toch liefhebt, in Wie u nu, hoewel u Hem niet ziet, maar gelooft, zich verheugt met een onuitsprekelijke en heerlijke vreugde;", "Rom 1:14": "Aan Grieken en barbaren, aan wijzen en onwijzen ben ik een schuldenaar.", "Ex 16:15": "Toen de Israëlieten het zagen, zeiden zij tegen elkaar: Wat is dit? Want zij wisten niet wat het was. Mozes dan zei tegen hen: Dit is het brood, dat de HEERE u te eten gegeven heeft.", "Jes 54:14": "U zult door gerechtigheid bevestigd worden; wees ver van verdrukking, want u zult niet vrezen; en ver van verschrikking, want zij zal tot u niet naderen.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "1 Kor 5:9": "Ik heb u in de brief geschreven dat u zich niet moet inlaten met de hoereerders;", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Jes 31:4": "Want zo heeft de HEERE tegen mij gezegd: Zoals een leeuw, en een jonge leeuw over zijn prooi brult, wanneer ook een volle menigte herders tegen hem samengeroepen wordt, verschrikt hij voor hun stem niet, en vernedert zich niet vanwege hun grote aantal; zo zal de HEERE van de heerscharen neerdalen, om te strijden voor de berg Sion en voor haar heuvel.", "1 Tess 2:13": "Daarom danken wij ook God zonder ophouden, dat u, toen u het Woord van de prediking van God van ons ontvangen had, dat aangenomen hebt niet als een woord van mensen, maar (zoals het werkelijk is) als het Woord van God, dat ook werkt in u die gelooft.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Hand 19:9": "Maar toen sommigen verhard werden en ongehoorzaam waren, en kwaadspraken van de weg des Heeren voor de menigte, ging hij bij hen weg, en zonderde de discipelen af, dagelijks sprekend in de school van een zekere Tyrannus.", "2 Kor 11:7": "Heb ik zonde gedaan, toen ik mijzelf vernederd heb opdat u verhoogd zou worden, omdat ik u het Evangelie van God om niet verkondigd heb?", "Gal 4:11": "Ik ben bang voor u, dat ik niet misschien tevergeefs onder u gearbeid heb.", "Ps 32:6": "Hierom zal iedere heilige U aanbidden in de tijd dat U te vinden bent; ja, in een overstroming van grote wateren zullen zij hem niet aanraken.", "Ps 84:11": "Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.", "Ex 14:29": "Maar de kinderen van Israël gingen op het droge, in het midden van de zee; en de wateren waren hun een muur, aan hun rechterhand en aan hun linkerhand.", "Rom 4:20": "En hij heeft aan de belofte van God niet getwijfeld door ongeloof; maar is gesterkt geweest in het geloof, en heeft God de eer gegeven;", "Ps 68:23": "De Heere heeft gezegd: Ik zal terugbrengen uit Basan; Ik zal terugbrengen uit de diepten van de zee;", "Luk 10:2": "Hij zei dan tegen hen: De oogst is wel groot, maar de arbeiders zijn weinige; bid daarom de Heere van de oogst, dat Hij arbeiders in Zijn oogst uitstuurt.", "Hand 13:49": "En het Woord van de Heere werd door het hele land verspreid.", "Jer 15:17": "Ik heb in de raad van de spotters niet gezeten, en ben ook niet van vreugde opgesprongen; vanwege Uw hand heb ik alleen gezeten, want U hebt mij met gramschap vervuld.", "Hand 24:14-25": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is; Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen. En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Jak 1:23-25": "Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel; Want hij heeft zichzelf bekeken, en is weggegaan, en heeft meteen vergeten hoe hij eruitzag. Maar wie zich verdiept in de volmaakte wet, die van de vrijheid is, en daarbij blijft, die is geen vergeetachtige hoorder geworden, maar een dader van het werk, die zal, zeg ik, gelukzalig zijn in dit zijn doen.", "Joh 14:18": "Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Ps 80:3": "Wek Uw macht op voor het aangezicht van Efraïm, en Benjamin, en Manasse, en kom tot onze verlossing.", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "1 Kor 1:16": "Overigens heb ik ook het huisgezin van Stefanus gedoopt; verder weet ik niet, of ik iemand anders gedoopt heb.", "2 Kor 4:3": "Maar als ons Evangelie ook bedekt is, dan is het bedekt bij hen die verloren gaan;", "Ef 6:23": "Vrede zij de broeders, en liefde met geloof, van God de Vader, en de Heere Jezus Christus.", "Num 16:21-26": "Scheid u af uit het midden van deze vergadering, en Ik zal hen in een ogenblik verteren! Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden? En de HEERE sprak tot Mozes, en zei:", "1 Kor 9:4-14": "Hebben wij geen macht om te eten en te drinken? Hebben wij geen macht om een vrouw, een zuster zijnde, met ons mee te nemen, zoals ook de andere apostelen, en de broeders van de Heere, en Cefas? Of hebben alleen ik en Barnabas geen macht om niet te werken?", "Num 18:20": "Ook zei de HEERE tegen Aäron: U zult in hun land niet erven, en u zult geen deel te midden van hen hebben; Ik ben uw deel en uw erfenis, te midden van de kinderen van Israël.", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "2 Kor 10:14-16": "Want wij strekken onszelf niet te wijd uit, alsof wij u niet zouden bereiken; want wij zijn ook tot u toe gekomen, in het Evangelie van Christus; Niet roemend buiten de maat over de arbeid van andere mensen, maar hebbende de hoop dat, als uw geloof meer wordt, wij onder u overvloedig vergroot zullen worden naar onze regel; Om het Evangelie te verkondigen in de gebieden die verder weg liggen dan u; niet om te roemen op de regel van iemand anders over wat al gereed is.", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Luk 8:16": "En niemand die een kaars aansteekt, bedekt die met een vat of zet hem onder een bed; maar hij zet hem op een kandelaar, opdat wie binnenkomen het licht kunnen zien.", "2 Kor 2:3": "En dat heb ik u geschreven, opdat ik, als ik daar kom, niet de droefheid zou hebben van hen door wie ik juist verblijd zou moeten worden; en ik vertrouw van u allen dat mijn blijdschap ook de blijdschap van u allen is.", "Spr 12:27": "Een bedrieger zal zijn jachtbuit niet braden; maar het kostelijke goed van de mens is voor de vlijtige.", "Rom 5:3": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt;", "Spr 2:16": "Om u te redden van de vreemde vrouw, van de onbekende, die met haar woorden vleit;", "Ps 45:3": "U bent veel mooier dan de mensenkinderen; genade is uitgestort op Uw lippen; daarom heeft God U gezegend voor eeuwig.", "Hebr 11:15": "En als zij aan dat vaderland gedacht hadden waar zij uit weggegaan waren, zouden zij de tijd gehad hebben om terug te keren;", "Kol 4:12": "U groet Epafras, die één van u is, een dienstknecht van Christus, die altijd voor u strijdt in de gebeden, opdat u volmaakt en volkomen mag staan in heel de wil van God.", "Jes 27:3": "Ik, de HEERE, behoed die, elk ogenblik zal Ik hem bevochtigen; opdat de vijand hem niet bezoekt, zal Ik hem bewaren, nacht en dag.", "1 Tess 2:9": "Want u herinnert zich, broeders, onze inspanning en moeite; want terwijl wij nacht en dag werkten, om niemand van u tot last te zijn, hebben wij het Evangelie van God onder u gepredikt.", "Spr 11:30": "De vrucht van de rechtvaardige is een boom des levens; en wie zielen vangt, is wijs.", "1 Kon 18:21": "Toen naderde Elia tot heel het volk, en zei: Hoe lang hinkt u op twee gedachten? Als de HEERE God is, volg Hem na, en als het Baäl is, volg hem na! Maar het volk antwoordde hem geen woord.", "Jes 7:9": "Ondertussen zal Samaria het hoofd van Efraïm zijn, en de zoon van Remalia het hoofd van Samaria. Als u niet gelooft, zult u zeker niet standhouden.", "2 Tim 2:1": "U dan, mijn zoon, word gesterkt in de genade die in Christus Jezus is;", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Hand 20:34": "En u weet zelf, dat deze handen gediend hebben voor mijn behoeften, en voor die van hen die met mij waren.", "1 Kor 1:8": "Die God u ook zal bevestigen tot het einde toe, om onberispelijk te zijn in de dag van onze Heere Jezus Christus.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Openb 1:4": "Johannes aan de zeven gemeenten die in Azië zijn: genade zij u en vrede van Hem, Die is, en Die was, en Die komen zal; en van de zeven geesten die voor Zijn troon zijn;", "Rom 5:4": "En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop;", "1 Joh 3:17": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem?", "Ps 40:2": "Ik heb de HEERE lang verwacht; en Hij heeft Zich tot mij geneigd, en mijn geroep gehoord.", "Joz 23:6": "Zo weest zeer sterk, om te bewaren en om te doen alles, wat geschreven is in het wetboek van Mozes; opdat u daarvan niet afwijkt naar rechts noch naar links;", "Jes 11:6-9": "En de wolf zal bij het lam wonen, en de luipaard zal bij de geitenbok neerliggen; en het kalf, en de jonge leeuw, en het mestvee samen, en een klein jongetje zal ze drijven. De koe en de berin zullen samen weiden, hun jongen zullen samen neerliggen, en de leeuw zal stro eten, net als de os. En een zuigeling zal zich vermaken bij het hol van een adder; en een gespeend kind zal zijn hand uitsteken naar de kuil van de basilisk.", "1 Tess 2:4-8": "maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft. Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige! Wij hebben ook geen eer gezocht bij mensen, niet bij u, en ook niet bij anderen; hoewel wij u tot last hadden kunnen zijn als apostelen van Christus;", "Spr 15:1": "Een zacht antwoord keert de grimmigheid af; maar een smartend woord doet de toorn oprijzen.", "Deut 18:2": "Daarom zal hij geen erfdeel hebben tussen zijn broeders; de HEERE is zijn Erfdeel, zoals Hij tot hem gesproken heeft.", "Gal 4:18": "Maar in het goede te allen tijde te ijveren is goed, en niet alleen wanneer ik bij u ben;", "2 Tim 1:18": "De Heere geve hem, dat hij barmhartigheid vindt bij de Heere, op die dag; en hoezeer hij mij in Efeze gediend heeft, weet u zeer goed.", "1 Tim 5:2": "De oudere vrouwen als moeders; de jongeren als zusters, in alle reinheid.", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "1 Petr 5:11": "Aan Hem zij de heerlijkheid en de kracht, tot in alle eeuwigheid. Amen.", "Hand 17:28": "Want in Hem leven wij, en bewegen wij ons, en zijn wij; zoals ook enkelen van uw eigen dichters gezegd hebben: Want wij zijn ook Zijn geslacht.", "Job 11:19": "En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.", "Zef 3:20": "In die tijd zal Ik u hierheen brengen, in de tijd namelijk dat Ik u verzamelen zal; zeker zal Ik u stellen tot een naam en tot een lof, onder alle volken van de aarde, als Ik uw gevangenschap voor uw ogen terugbrengen zal, zegt de HEERE.", "Luk 6:29": "Wie u op de ene wang slaat, biedt hem ook de andere aan; en wie u de mantel afneemt, weerhoud hem niet ook uw hemd te nemen.", "Mark 6:8": "En Hij gebood hun dat zij niets zouden meenemen voor onderweg, dan alleen een staf: geen reistas, geen brood, geen geld in de gordel;", "Luk 2:30": "want mijn ogen hebben Uw zaligheid gezien,", "Hand 28:30": "En Paulus bleef twee volle jaren in zijn eigen gehuurde woning; en ontving allen die naar hem toe kwamen;", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "Matt 27:3": "Toen Judas, die Hem verraden had, zag dat Hij veroordeeld was, kreeg hij berouw en heeft hij de dertig zilverstukken aan de overpriesters en de oudsten teruggebracht,", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Spr 2:8": "Opdat zij de paden van het recht bewaren; en Hij zal de weg van Zijn gunstgenoten bewaren.", "Hand 15:30-36": "Zij dan, hun afscheid ontvangen hebbend, kwamen in Antiochië; en nadat zij de menigte hadden samengeroepen, gaven zij de brief af. En toen zij die gelezen hadden, verblijdden zij zich over de bemoediging. Judas nu en Silas, die zelf ook profeten waren, bemoedigden de broeders met veel woorden, en versterkten hen.", "Gal 5:26": "Laten wij niet zoeken naar ijdele eer, elkaar tergen, elkaar benijden.", "Ruth 2:12": "De HEERE vergeldt u uw daad, en uw loon zij volkomen, vanwege de HEERE, de God van Israël, onder Wiens vleugels u gekomen bent om toevlucht te nemen!", "1 Tess 4:12": "Opdat u eerlijk wandelt bij hen die buiten zijn, en niets nodig hebt.", "Openb 22:21": "De genade van onze Heere Jezus Christus zij met u allen. Amen.", "Spr 22:25": "opdat u zijn paden niet leert, en een strik over uw ziel haalt.", "Hos 12:7": "U dan, bekeer u tot uw God, bewaar goedertierenheid en recht, en wacht voortdurend op uw God.", "Jes 53:9": "En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.", "1 Kon 8:45": "hoor dan in de hemel hun gebed en hun smeking, en voer hun recht uit.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "1 Tim 6:4": "is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens,", "Rom 9:1-3": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest), dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "Joh 3:12": "Als Ik u de aardse dingen gezegd heb en u gelooft niet, hoe zult u geloven als Ik u de hemelse dingen zou zeggen?", "Joh 13:15": "Want Ik heb u een voorbeeld gegeven, opdat u, zoals Ik u gedaan heb, ook zult doen.", "1 Petr 5:4": "En als de opperste Herder verschenen zal zijn, zult u de onverwelkbare kroon van de heerlijkheid ontvangen.", "Ps 130:6": "Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "Kol 4:5": "Wandel met wijsheid bij hen die buiten zijn, en maak gebruik van elke gelegenheid.", "1 Kor 10:24": "Niemand zoekt zijn eigen belang, maar ieder zoekt dat van de ander.", "1 Kor 5:4": "In de Naam van onze Heere Jezus Christus, wanneer u en mijn geest samen vergaderd zijn, met de kracht van onze Heere Jezus Christus,", "Job 33:18": "Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Jes 11:5": "Want gerechtigheid zal de gordel van Zijn lendenen zijn; ook zal de trouw de gordel van Zijn lendenen zijn.", "Ps 27:13": "Als ik niet had geloofd dat ik het goede van de HEERE zou zien in het land van de levenden, dan was ik vergaan.", "Rom 12:1-3": "Ik smeek u dan, broeders, door de ontfermingen van God, dat u uw lichamen stelt tot een levend, heilig en Gode welbehaaglijk offer, dat is uw redelijke godsdienst. En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is. Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld.", "Spr 4:15": "Verwerp die, ga er niet doorheen; wijk ervan af, en ga voorbij.", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "Gal 6:10": "Zo dan, terwijl we tijd hebben, laten we goeddoen aan allen, maar vooral aan de huisgenoten van het geloof.", "1 Tim 1:4": "Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is.", "2 Kor 7:8": "Want hoewel ik u in de brief bedroefd heb, heb ik daar geen berouw over, hoewel ik er wel berouw over heb gehad; want ik zie dat die brief, al was het maar voor een korte tijd, u bedroefd heeft.", "Openb 2:4": "Maar Ik heb tegen u, dat u uw eerste liefde hebt verlaten.", "2 Kor 11:9": "Want mijn gebrek hebben de broeders vervuld die van Macedonië kwamen; en ik heb mijzelf in alles gehouden zonder u te bezwaren, en ik zal mij nog zo houden.", "Joh 3:7": "Verwonder u niet dat Ik u gezegd heb: U moet opnieuw geboren worden.", "2 Petr 3:14": "Daarom, geliefden, terwijl u deze dingen verwacht, doe uw best om onbevlekt en onberispelijk door Hem bevonden te worden, in vrede;", "Joz 24:15": "Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen!", "Hand 13:43": "En toen de synagoge uiteengegaan was, volgden velen van de Joden en van de godsdienstige Jodengenoten Paulus en Barnabas; die tot hen spraken en hen aanspoorden te blijven bij de genade van God.", "Kol 2:2": "Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus;", "2 Kor 10:1-11": "Verder, ik Paulus zelf bid u, door de zachtmoedigheid en goedertierenheid van Christus, die – tegenwoordig zijnde – wel gering ben onder u, maar afwezig stout ben tegen u; Ik bid dan, dat ik, tegenwoordig zijnde, niet stout hoef te zijn met die vrijmoedigheid, waarmee ik denk stout te moeten optreden tegen sommigen, die ons zo beoordelen alsof wij naar het vlees wandelden. Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Deut 31:3": "De HEERE, uw God, Die zal voor u overtrekken; Die zal deze volken van voor u wegvagen, zodat u hen erfelijk bezit. Jozua zal voor u overtrekken, zoals de HEERE gesproken heeft.", "Joh 5:40": "En u wilt niet tot Mij komen, opdat u het leven zou hebben.", "Ezech 6:11": "Zo zegt de Heere HEERE: Sla met uw hand, en stamp met uw voet, en zeg: Ach, over alle gruwelen van de slechte daden van het huis van Israël; want zij zullen door het zwaard, door de honger en door de pest vallen.", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "Matt 16:28": "Voorwaar, Ik zeg u: Er zijn sommigen van hen die hier staan, die de dood niet zullen smaken, totdat zij de Zoon des mensen zullen hebben zien komen in Zijn Koninkrijk.", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "1 Tess 5:23": "En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.", "Rom 8:38": "Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal,", "Gal 5:23": "Tegen zulke mensen is de wet niet.", "Matt 10:22": "En u zult door allen gehaat worden om Mijn Naam; maar wie volhardt tot het einde, die zal behouden worden.", "Hebr 12:25": "Zie erop toe dat u Hem, Die spreekt, niet verwerpt; want als dezen niet ontkomen zijn, die hem verwierpen die op aarde Goddelijke antwoorden gaf, hoeveel te meer zullen wij niet ontkomen, als wij ons afkeren van Hem Die van de hemelen is;", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "2 Kron 19:2": "En Jehu, de zoon van Hanani, de ziener, ging naar buiten, hem tegemoet, en zei tegen koning Josafat: Zou u de goddeloze helpen, en hen liefhebben die de HEERE haten? Daarom is er nu van het aangezicht van de HEERE grote toorn over u.", "Rom 1:15": "Zo ben ik, voor zover het aan mij ligt, gereed om ook aan u die in Rome bent het Evangelie te verkondigen.", "Ps 139:21": "Zou ik niet haten, HEERE, wie U haten? En verdriet hebben over wie tegen U opstaan?", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "1 Kor 15:58": "Daarom, mijn geliefde broeders! Wees standvastig, onwankelbaar, altijd overvloedig in het werk van de Heere, in de wetenschap dat uw arbeid niet tevergeefs is in de Heere.", "2 Kor 13:11": "Verder, broeders, wees blij, wordt volmaakt, wees getroost, wees eensgezind, leef in vrede; en de God van de liefde en van de vrede zal met u zijn.", "Ezech 34:11-16": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Luk 9:48": "en zei tegen hen: Wie dit kind ontvangt in Mijn Naam, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem Die Mij gezonden heeft. Want wie de minste is onder u allen, die zal groot zijn.", "Spr 22:10": "Jaag de spotter weg, en het gekijf zal weggaan, en het geschil met de schande zal ophouden.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Luk 7:23": "En zalig is hij
