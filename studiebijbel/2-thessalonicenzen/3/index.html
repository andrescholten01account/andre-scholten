 Jonathan, en zo doet Hij daar nog meer bij! Als het mijn vader behaagt kwaad over u te brengen, zal ik het u bekendmaken, en ik zal u laten gaan, dat u in vrede weggaat; en de HEERE zij met u, zoals Hij met mijn vader geweest is.", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Gal 4:19": "mijn kinderen, voor wie ik opnieuw weeën lijd totdat Christus gestalte in u krijgt.", "Nahum 1:15": "Zie op de bergen de voeten van hem die het goede nieuws brengt, die vrede laat horen; vier uw feestdagen, o Juda! Betaal uw geloften; want de man van Belial zal voortaan niet meer door u heen gaan, hij is helemaal uitgeroeid.", "Kol 3:13": "verdraag elkaar en vergeef elkaar, als iemand tegen iemand enige klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo.", "Luk 24:44": "En Hij zei tegen hen: Dit zijn de woorden die Ik tot u sprak, toen Ik nog bij u was, namelijk dat alles moest vervuld worden wat over Mij geschreven is in de Wet van Mozes, en de Profeten, en de Psalmen.", "Ex 12:23": "Want de HEERE zal doorgaan, om de Egyptenaren te slaan; doch wanneer Hij het bloed zien zal aan de bovendorpel en aan de twee zijposten, zal de HEERE de deur voorbijgaan, en de verderver niet toelaten in uw huizen te komen om te slaan.", "Fil 1:6": "Ervan overtuigd dat Hij, Die in u een goed werk begonnen is, dat zal voleindigen tot op de dag van Jezus Christus;", "Pred 2:10": "En al wat mijn ogen begeerden, dat onthield ik hun niet; ik weerhield mijn hart niet van enige blijdschap, maar mijn hart was blij vanwege al mijn arbeid; en dit was mijn deel van al mijn arbeid.", "Spr 22:29": "Hebt u een man gezien die vaardig is in zijn werk? Hij zal voor koningen komen te staan; hij zal niet voor onaanzienlijke mensen staan.", "Matt 6:10": "Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.", "Ex 23:20-31": "Zie, Ik zend een Engel voor uw aangezicht, om u te behoeden op deze weg, en om u te brengen naar de plaats die Ik voorbereid heb. Wees op uw hoede voor Zijn aangezicht, en wees Zijn stem gehoorzaam, en verbitter Hem niet; want Hij zal uw overtredingen niet vergeven; want Mijn Naam is in Hem. Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ex 19:4": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb.", "Rom 1:9": "Want God is mijn Getuige, Die ik dien in mijn geest, in het Evangelie van Zijn Zoon, hoe ik zonder ophouden aan u denk;", "Luk 22:36": "Hij zei dan tegen hen: Maar nu, wie een buidel heeft, neem hem, en net zo ook een tas; en wie er geen heeft, verkoopt zijn kleed en koopt een zwaard.", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Ps 125:4": "HEERE! doe het goede aan hen die goed zijn, en aan hen die oprecht zijn in hun hart.", "Jes 49:17": "Uw zonen zullen zich haasten; maar uw verstoorders en uw verwoesters zullen van u uitgaan.", "Rom 12:10": "Heb elkaar hartelijk lief met broederlijke liefde; in eerbetoon de een de ander voorgaand.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "1 Tess 1:1": "Paulus, en Silvanus, en Timotheüs, aan de Gemeente van de Thessalonicenzen, die is in God de Vader, en de Heere Jezus Christus: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Hebr 4:6": "Omdat het dan blijft gelden dat sommigen die rust ingaan, en zij aan wie het Evangelie eerst verkondigd was, niet ingegaan zijn vanwege de ongehoorzaamheid,", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "1 Kor 13:1": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn.", "Luk 21:18": "Toch zal er geen haar van uw hoofd verloren gaan.", "Luk 22:31": "En de Heere zei: Simon, Simon, zie, de satan heeft u dringend willen ziften als de tarwe;", "Ef 2:14-17": "Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken; en opdat Hij die beiden met God in één lichaam zou verzoenen door het kruis, nadat Hij de vijandschap daaraan gedood had.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Hos 4:17": "Efraïm is met de afgoden verbonden; laat hem begaan.", "1 Kor 7:8": "Maar ik zeg de ongetrouwden en de weduwen: het is goed voor hen als zij blijven zoals ik.", "Ef 6:19": "en voor mij, opdat mij het Woord gegeven wordt bij het openen van mijn mond, met vrijmoedigheid, om de verborgenheid van het Evangelie bekend te maken;", "Zach 9:8": "En Ik zal Mij rondom Mijn huis legeren, vanwege het leger, vanwege de doorgaande, en vanwege de wederkerende, opdat de drijver niet meer door hen doorga; want nu heb Ik het met Mijn ogen aangezien.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Spr 24:30-34": "Ik ging voorbij de akker van een luiaard, en voorbij de wijngaard van een verstandeloos mens; En zie, hij was helemaal opgeschoten van distels; zijn gedaante was met netels bedekt, en zijn stenen scheidsmuur was afgebroken. Toen ik dat aanschouwde, nam ik het ter harte; ik zag het, en nam onderwijzing aan;", "1 Tim 2:2": "voor koningen en allen die in hoge positie zijn, opdat wij een rustig en stil leven kunnen leiden in alle godsvrucht en eerbaarheid.", "Kol 3:2": "Bedenk de dingen die boven zijn, niet die op de aarde zijn.", "Job 5:18-24": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen. In zes benauwdheden zal Hij u verlossen, en in de zevende zal het kwaad u niet aanraken. In de honger zal Hij u verlossen van de dood, en in de oorlog van het geweld van het zwaard.", "Gal 5:1": "Sta dan vast in de vrijheid waarmee Christus ons vrijgemaakt heeft, en laat u niet weer met het juk van de slavernij vangen.", "Ex 8:23": "En Ik zal een verlossing zetten tussen Mijn volk en uw volk; tegen morgen zal dit teken gebeuren!", "1 Kor 2:7": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;", "Ex 35:2": "Zes dagen zal men het werk doen; maar op de zevende dag zal het voor u heiligheid zijn, een sabbat van rust voor de HEERE; ieder die daarop werk doet, zal gedood worden.", "Luk 12:37-40": "Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen. En als hij komt in de tweede nachtwake, of komt in de derde nachtwake, en hen zo aantreft, zalig zijn die dienstknechten. Maar weet dit, dat als de heer des huizes geweten had op welk moment de dief zou komen, hij gewaakt zou hebben, en zijn huis niet had laten openbreken.", "Ps 141:4": "Neig mijn hart niet tot een kwade zaak, om enige handel in goddeloosheid te bedrijven, met mannen die ongerechtigheid bedrijven; en laat mij niet eten van hun lekkernijen.", "Joh 14:3": "En wanneer Ik heen zal zijn gegaan en u plaats zal hebben bereid, kom Ik terug en zal u tot Mij nemen, opdat u ook mag zijn waar Ik ben.", "Joh 20:23": "Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.", "Ps 9:10": "En de HEERE zal een Hoog Vertrek zijn voor de verdrukte, een Hoog Vertrek in tijden van benauwdheid.", "Spr 19:15": "Luiheid doet in een diepe slaap vallen; en een lui mens zal hongeren.", "Num 6:26": "De HEERE verheft Zijn aangezicht over u, en geeft u vrede!", "Jes 37:35": "Want Ik zal deze stad beschermen om die te verlossen, omwille van Mijzelf, en omwille van David, Mijn knecht.", "Pred 11:4": "Wie op de wind let, die zal niet zaaien, en wie op de wolken ziet, die zal niet maaien.", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "1 Kor 15:1-32": "Verder, broeders, ik maak u het Evangelie bekend, dat ik u verkondigd heb, dat u ook aangenomen hebt, en waarin u ook staat; door wie u ook zalig wordt, als u het vasthoudt op de manier zoals ik het u verkondigd heb; tenzij u tevergeefs geloofd hebt. Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften;", "Joh 5:38": "En Zijn woord hebt u niet in u blijven, want u gelooft Hem niet, Die Hij gezonden heeft.", "Jak 5:7-9": "Wees dan geduldig, broeders, tot de komst van de Heere. Zie, de boer verwacht de kostbare vrucht van het land, en is daarover geduldig, totdat het de vroege en late regen zal hebben ontvangen. Wees ook u geduldig, versterk uw harten; want de komst van de Heere is nabij. Zucht niet tegen elkaar, broeders, opdat u niet veroordeeld wordt; zie, de Rechter staat voor de deur.", "Ps 12:8": "U, HEERE, zult hen bewaren; U zult hen behoeden voor dit geslacht, tot in eeuwigheid.", "Luk 12:37": "Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "Luk 24:25": "En Hij zei tegen hen: O onverstandigen en tragen van hart om te geloven al wat de profeten gesproken hebben!", "Rom 5:5": "En de hoop beschaamt niet, omdat de liefde van God in onze harten uitgestort is door de Heilige Geest, Die ons gegeven is.", "Tit 3:1": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn;", "Matt 18:17": "En als hij naar hen niet luistert, zeg het dan aan de gemeente; en als hij ook naar de gemeente niet luistert, laat hij dan voor u zijn als de heiden en de tollenaar.", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "1 Joh 5:10": "Wie in de Zoon van God gelooft, heeft het getuigenis in zichzelf; wie God niet gelooft, heeft Hem tot een leugenaar gemaakt, omdat hij niet geloofd heeft het getuigenis dat God getuigd heeft van Zijn Zoon.", "Deut 11:22": "Want als u zorgvuldig al deze geboden houdt, die ik u gebied om die te doen, de HEERE, uw God, liefhebbend, wandelend in al Zijn wegen, en Hem aanhangend;", "Luk 19:13": "En hij riep zijn tien dienstknechten, gaf hun tien ponden, en zei tegen hen: Doe er zaken mee totdat ik terugkom.", "Luk 9:27": "En Ik zeg u naar waarheid: er zijn sommigen van hen die hier staan, die de dood niet zullen smaken, totdat zij het Koninkrijk van God gezien hebben.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Ezra 9:2": "Want zij hebben van hun dochters genomen voor zichzelf en voor hun zonen, zodat het heilig zaad zich vermengd heeft met de volken van deze landen; ja, de hand van de vorsten en overheden is de eerste geweest in deze overtreding.", "1 Kor 10:32": "Wees zonder aanstoot te geven, zowel voor de Joden als voor de Grieken als voor de gemeente van God.", "Ps 45:12": "Zo zal de Koning verlangen naar uw schoonheid; omdat Hij uw Heere is, buig u voor Hem neer.", "Kol 4:3": "bid meteen ook voor ons, dat God ons de deur van het Woord opent, om de verborgenheid van Christus te spreken, waarvoor ik ook gebonden ben;", "Deut 30:4": "Al waren uw verdrevenen aan het einde van de hemel, van daar zal de HEERE, uw God, u bijeenbrengen, en van daar zal Hij u halen.", "Kol 1:10": "opdat u mag wandelen op een manier die de Heere waardig is, tot alle behagelijkheid, terwijl u in alle goede werken vrucht draagt en meer wordt in de kennis van God;", "Spr 24:16": "Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.", "1 Sam 12:23": "Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.", "1 Joh 3:2": "Geliefden, nu zijn wij kinderen van God, en het is nog niet openbaar geworden wat wij zijn zullen. Maar wij weten dat, als Hij geopenbaard zal zijn, wij Hem gelijk zullen zijn; want wij zullen Hem zien zoals Hij is.", "Hebr 13:1-3": "Laat de broederlijke liefde blijven. Vergeet de herbergzaamheid niet; want hierdoor hebben sommigen zonder het te weten engelen geherbergd. Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Jes 66:12": "Want zo zegt de HEERE: Zie, Ik zal de vrede over haar uitstrekken als een rivier, en de heerlijkheid van de heidenen als een overlopende beek; dan zult u zuigen; u zult op de zijde gedragen worden, en op de knieën heel vriendelijk getroeteld worden.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Ps 19:14": "Houd Uw knecht ook terug van trotsheden; laat ze niet over mij heersen; dan zal ik oprecht zijn en rein van grote overtreding.", "Openb 3:11": "Zie, Ik kom haastig; houd vast wat u hebt, opdat niemand uw kroon neemt.", "Spr 5:13": "En heb niet geluisterd naar de stem van mijn onderwijzers, mijn oren niet geneigd tot mijn leraars!", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Ps 4:9": "Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.", "Ps 72:7": "In zijn dagen zal de rechtvaardige bloeien, en de veelheid van vrede, totdat de maan niet meer is.", "Hand 13:16-52": "En Paulus stond op, en wenkte met de hand, en zei: Israëlitische mannen, en u die God vreest, hoor toe. De God van dit volk Israël heeft onze vaderen uitverkoren, en het volk verhoogd, toen zij als vreemdelingen in het land Egypte woonden, en heeft hen met een sterke arm daaruit geleid. En Hij heeft ongeveer veertig jaar lang hun gedrag verdragen in de woestijn.", "Ps 147:2": "De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël.", "2 Kor 13:10": "Daarom schrijf ik deze dingen, terwijl ik afwezig ben, opdat ik niet, wanneer ik aanwezig ben, strengheid zou hoeven te gebruiken, naar de macht die de Heere mij gegeven heeft tot opbouw, en niet tot afbraak.", "Ps 125:5": "Maar die zich neigen tot hun kromme wegen, die zal de HEERE weg doen gaan met de werkers van de ongerechtigheid. Vrede zal over Israël zijn!", "Luk 19:15": "En het gebeurde, toen hij terugkwam nadat hij het koninkrijk ontvangen had, dat hij zei dat die dienstknechten aan wie hij het geld gegeven had bij hem geroepen moesten worden, opdat hij zou weten wat ieder met handel verdiend had.", "Rom 2:6": "Die ieder zal vergelden naar zijn werken:", "1 Joh 2:28": "En nu, kinderen, blijft in Hem; opdat, wanneer Hij geopenbaard zal zijn, wij vrijmoedigheid hebben, en wij bij Zijn komst niet beschaamd worden voor Hem.", "Ps 122:7": "Vrede zij binnen uw vesting, welvaart in uw paleizen.", "1 Tess 1:6": "En u bent navolgers geworden van ons en van de Heere, doordat u het Woord aannam onder veel verdrukking, met blijdschap van de Heilige Geest;", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Jak 1:25": "Maar wie zich verdiept in de volmaakte wet, die van de vrijheid is, en daarbij blijft, die is geen vergeetachtige hoorder geworden, maar een dader van het werk, die zal, zeg ik, gelukzalig zijn in dit zijn doen.", "Jak 1:6": "Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt.", "Pred 4:6": "Een hand vol met rust is beter dan beide de vuisten vol met moeite en najagen van de wind.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Luk 1:79": "om te verschijnen aan hen die gezeten zijn in duisternis en schaduw van de dood, om onze voeten te richten op de weg van de vrede.", "Matt 25:40": "En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Num 16:26": "En hij sprak tot de vergadering en zei: Ga toch weg van de tenten van deze goddeloze mannen, en raak niets aan van wat van hen is, anders wordt u misschien meegesleurd in al hun zonden.", "Tit 2:9-12": "Vermaan de dienstknechten dat zij hun eigen heren onderdanig zijn, dat zij in alles welgevallig zijn, niet tegensprekend; Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren. Want de genade van God die zaligmakend is, is verschenen aan alle mensen.", "Ezech 11:13": "Het gebeurde nu, toen ik profeteerde, dat Pelatja, de zoon van Benaja, stierf. Toen viel ik neer op mijn gezicht, en riep met luide stem, en zei: Ach, Heere HEERE! Zult U een volledig einde maken met het overblijfsel van Israël?", "Ps 116:1": "Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen;", "Tit 2:1": "Maar u, spreek wat past bij de gezonde leer.", "Ps 91:1-16": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige. Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie.", "Ps 96:3": "Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Kol 3:12-17": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld; verdraag elkaar en vergeef elkaar, als iemand tegen iemand enige klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo. En doe boven dit alles de liefde aan, die de band van de volmaaktheid is.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Deut 33:25-29": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen! Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken. De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "Joh 9:35": "Jezus hoorde dat zij hem eruit geworpen hadden, en toen Hij hem vond, zei Hij tegen hem: Gelooft u in de Zoon van God?", "Deut 23:14": "Want de HEERE, uw God, wandelt in het midden van uw leger, om u te verlossen, en om uw vijanden aan u over te geven; daarom zal uw leger heilig zijn, opdat Hij niets schandelijks onder u ziet, en Zich niet van u afkeert.", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Kol 3:17": "En alles wat u doet, met woorden of met werken, doe dat alles in de Naam van de Heere Jezus, terwijl u God en de Vader dankt door Hem.", "Spr 3:24": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn.", "2 Petr 3:3": "Dit moet u eerst weten, dat er in de laatste dagen spotters zullen komen, die naar hun eigen begeerten zullen wandelen,", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Gal 6:1": "Broeders, als een mens door een misdaad vervallen is, moet u, die geestelijk bent, hem die zo is terechtbrengen met een geest van zachtmoedigheid; en let daarbij op uzelf, zodat ook u niet in verzoeking komt.", "Pred 10:4": "Als de geest van de heerser tegen u oprijst, verlaat uw plaats niet; want het is medicijn, het stilt grote zonden.", "1 Kor 6:7": "Er is dan nu al helemaal een tekortkoming onder u, dat u met elkaar rechtszaken hebt. Waarom lijdt u niet liever ongelijk? Waarom lijdt u niet liever schade?", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Joh 5:30": "Ik kan van Mijzelf niets doen. Zoals Ik hoor, oordeel Ik, en Mijn oordeel is rechtvaardig; want Ik zoek niet Mijn eigen wil, maar de wil van de Vader, Die Mij gezonden heeft.", "Rom 12:12": "Verblijd u in de hoop. Wees geduldig in de verdrukking. Volhard in het gebed.", "2 Petr 1:12-16": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt. En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken; Want ik weet dat het afleggen van mijn tent spoedig zal zijn, zoals ook onze Heere Jezus Christus mij heeft geopenbaard.", "Rom 3:3": "Want wat is het, al zijn sommigen ongelovig geweest? Zal hun ongeloof het geloof van God tenietdoen?", "Ps 63:6": "Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Matt 10:27": "Wat Ik u zeg in het duister, zegt dat in het licht; en wat u hoort in het oor, predikt dat op de daken.", "Hand 17:22-31": "En Paulus stond op in het midden van de plaats die Areopagus heet, en zei: Mannen van Athene, ik bemerk dat u in alles buitengewoon godsdienstig bent. Want toen ik door de stad liep en uw heiligdommen bekeek, vond ik ook een altaar waarop een opschrift stond: AAN DE ONBEKENDE GOD. Hem dan, Die u niet kent en toch dient, verkondig ik u. De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn;", "Hand 15:26": "mensen die hun leven overgegeven hebben voor de Naam van onze Heere Jezus Christus.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Gal 5:16": "En ik zeg: Wandel door de Geest en u zult de begeerten van het vlees niet volbrengen.", "Matt 12:42": "De koningin van het zuiden zal opstaan in het oordeel met dit geslacht, en zal het veroordelen; want zij is gekomen van het einde van de aarde, om de wijsheid van Salomo te horen; en zie, meer dan Salomo is hier!", "Ps 26:9": "Raap mijn ziel niet weg met de zondaars, en mijn leven niet met de mannen van het bloed;", "Joh 8:52": "De Joden zeiden dan tegen Hem: Nu weten wij dat U de duivel hebt. Abraham is gestorven, en de profeten ook; en U zegt: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet proeven?", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "Rom 15:18": "Want ik zou niet durven iets zeggen dat Christus niet door mij gewerkt heeft, tot gehoorzaamheid van de heidenen, met woorden en werken;", "Spr 1:10": "Mijn zoon! als de zondaars u aanlokken, stem er niet mee in;", "1 Kor 10:31": "Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.", "Spr 9:9": "Leer de wijze, dan zal hij nog wijzer worden; onderwijs de rechtvaardige, dan zal hij toenemen in kennis.", "Hebr 3:6-8": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden. Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "1 Tim 5:7-11": "En beveel dit, opdat zij onberispelijk zijn. Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige. Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Matt 25:34-40": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "1 Kor 13:4": "De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen;", "1 Petr 1:13": "Omgord daarom de lenden van uw verstand, wees nuchter, en hoop volkomen op de genade die u gebracht wordt bij de openbaring van Jezus Christus.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Luk 8:15": "En wat in de goede aarde valt, dat zijn zij die het Woord gehoord hebben en het in een eerlijk en goed hart bewaren, en met volharding vruchten voortbrengen.", "Lev 18:3": "U zult niet doen naar de werken van het Egyptische land, waarin u gewoond hebt; en naar de werken van het land Kanaän, waarheen Ik u breng, zult u niet doen, en u zult in hun inzettingen niet wandelen.", "Num 12:14": "En de HEERE zei tegen Mozes: Als haar vader smadelijk in haar gezicht had gespuwd, zou zij dan niet zeven dagen beschaamd zijn? Laat haar zeven dagen buiten het kamp opgesloten worden, en daarna weer toegelaten worden!", "Matt 25:27": "Dan had u mijn geld naar de wisselaars moeten brengen, en zou ik bij mijn komst het mijne met rente teruggekregen hebben."}, "noten": {"1": "Vers 5, \"richte\": SV \"richte\" (aanvoegende wijs); betekent hier: leidt of stuurt."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"G3063\">Verder</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"G80\">broeders</span>, bid <span class=\"wl\" data-l=\"L3\" data-code=\"G4012\">voor</span> <span class=\"wl\" data-l=\"L4\" data-code=\"G2257\">ons</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"G2443\">opdat</span> <span class=\"wl\" data-l=\"L5\" data-code=\"G2443\">het</span> <span class=\"wl\" data-l=\"L6\" data-code=\"G3056\">Woord</span> <span class=\"wl\" data-l=\"L6\" data-code=\"G3056\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"G2962\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"G2962\">Heere</span> <span class=\"wl\" data-l=\"L7\" data-code=\"G2962\">zijn</span> <span class=\"wl\" data-l=\"L8\" data-code=\"G5143\">loop</span> <span class=\"wl\" data-l=\"L8\" data-code=\"G5143\">heeft</span>, <span class=\"wl\" data-l=\"L9\" data-code=\"G2532\">en</span> <span class=\"wl\" data-l=\"L10\" data-cod /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
