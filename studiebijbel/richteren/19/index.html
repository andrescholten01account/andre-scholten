-code=\"H2543\">asses:</span> and she <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him into her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and when the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him, he <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced</span> to meet", "4": "And his father in <span class=\"wl wl-kjv\" data-code=\"H2859\">law,</span> the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">retained</span> him; and he <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> with him <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> so they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and lodged", "5": "And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> when they arose <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> that he rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">depart:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his son in <span class=\"wl wl-kjv\" data-code=\"H2860\">law,</span> <span class=\"wl wl-kjv\" data-code=\"H5582\">Comfort</span> thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> with a <span class=\"wl wl-kjv\" data-code=\"H6595\">morsel</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> go your way.", "6": "And they sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down,</span> and did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> of them <span class=\"wl wl-kjv\" data-code=\"H3162\">together:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> Be <span class=\"wl wl-kjv\" data-code=\"H2974\">content,</span> I pray thee, and tarry all <span class=\"wl wl-kjv\" data-code=\"H3885\">night,</span> and let thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> be merry.", "7": "And when the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">depart,</span> his father in <span class=\"wl wl-kjv\" data-code=\"H2859\">law</span> <span class=\"wl wl-kjv\" data-code=\"H6484\">urged</span> him: therefore he <span class=\"wl wl-kjv\" data-code=\"H3885\">lodged</span> there again.", "8": "And he arose <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> on the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">depart:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5582\">Comfort</span> thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> I pray thee. And they <span class=\"wl wl-kjv\" data-code=\"H4102\">tarried</span> until <span class=\"wl wl-kjv\" data-code=\"H3117\">afternoon,</span> and they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> both", "9": "And when the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">depart,</span> he, and his <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> his father in <span class=\"wl wl-kjv\" data-code=\"H2859\">law,</span> the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Behold, now the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H7503\">draweth</span> toward <span class=\"wl wl-kjv\" data-code=\"H6150\">evening,</span> I pray you tarry all <span class=\"wl wl-kjv\" data-code=\"H3885\">night:</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> groweth to an <span class=\"wl wl-kjv\" data-code=\"H2583\">end,</span> <span class=\"wl wl-kjv\" data-code=\"H3885\">lodge</span> here, that thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> may be <span class=\"wl wl-kjv\" data-code=\"H3190\">merry;</span> and to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> get you <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> on your <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> home.", "10": "But the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not tarry that <span class=\"wl wl-kjv\" data-code=\"H3885\">night,</span> but he rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> over <span class=\"wl wl-kjv\" data-code=\"H5227\">against</span> <span class=\"wl wl-kjv\" data-code=\"H2982\">Jebus,</span> which is <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> and there were with him <span class=\"wl wl-kjv\" data-code=\"H6776\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2543\">asses</span> <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled,</span> his concubine", "11": "And when they were by <span class=\"wl wl-kjv\" data-code=\"H2982\">Jebus,</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">far</span> <span class=\"wl wl-kjv\" data-code=\"H7286\">spent;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> I pray thee, and let us turn <span class=\"wl wl-kjv\" data-code=\"H5493\">in</span> into this <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of the <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusites,</span> and lodge", "12": "And his <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, We will not turn <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> hither into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of a <span class=\"wl wl-kjv\" data-code=\"H5237\">stranger,</span> that is not of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> we will pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> to Gibeah.", "13": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and let us draw <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of these <span class=\"wl wl-kjv\" data-code=\"H4725\">places</span> to lodge all <span class=\"wl wl-kjv\" data-code=\"H3885\">night,</span> in <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah,</span> or in Ramah.", "14": "And they passed <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> and went their <span class=\"wl wl-kjv\" data-code=\"H3212\">way;</span> and the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">down</span> upon them when they were <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah,</span> which belongeth to Benjamin.", "15": "And they turned <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> thither, to go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> and to <span class=\"wl wl-kjv\" data-code=\"H3885\">lodge</span> in <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah:</span> and when he went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> he sat him <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> in a <span class=\"wl wl-kjv\" data-code=\"H7339\">street</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> for there was no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H622\">took</span> them into his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to lodging.", "16": "And, behold, there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> an <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> from his <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> out of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> at <span class=\"wl wl-kjv\" data-code=\"H6153\">even,</span> which was <span class=\"wl wl-kjv\" data-code=\"H376\">also</span> of <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim;</span> and he <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourned</span> in <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah:</span> but the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> were Benjamites.", "17": "And when he had lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> a <span class=\"wl wl-kjv\" data-code=\"H732\">wayfaring</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in the <span class=\"wl wl-kjv\" data-code=\"H7339\">street</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Whither <span class=\"wl wl-kjv\" data-code=\"H3212\">goest</span> thou? and <span class=\"wl wl-kjv\" data-code=\"H370\">whence</span> comest", "18": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, We are <span class=\"wl wl-kjv\" data-code=\"H5674\">passing</span> from <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehemjudah</span> toward the <span class=\"wl wl-kjv\" data-code=\"H3411\">side</span> of <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim;</span> from thence am I: and I <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehemjudah,</span> but I am now <span class=\"wl wl-kjv\" data-code=\ "H398\">eat</span> and drink.", "22": "Now as they were making their <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> <span class=\"wl wl-kjv\" data-code=\"H3190\">merry,</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H582\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial,</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">beset</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> round <span class=\"wl wl-kjv\" data-code=\"H5437\">about,</span> and <span class=\"wl wl-kjv\" data-code=\"H1849\">beat</span> at the <span class=\"wl wl-kjv\" data-code=\"H1817\">door,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> to the <span class=\"wl wl-kjv\" data-code=\"H1167\">master</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> the <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> that we may know", "23": "And the <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> the <span class=\"wl wl-kjv\" data-code=\"H1167\">master</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> unto them, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H408\">Nay,</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> nay, I pray you, do not so <span class=\"wl wl-kjv\" data- /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

  if (!code) return null;

    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [

).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';

      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');

  }
  if (tab === 'bijbeluitleg') {

  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];

        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;

  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>

      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

}

    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
