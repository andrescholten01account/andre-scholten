, "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Het gebeurde ook in die dagen, toen er geen koning in Israël was, dat er een Levitisch man was, die als vreemdeling verkeerde aan de zijden van het gebergte van Efraïm, die zich een vrouw, een bijvrouw, nam van Bethlehem-Juda.", "2": "Maar zijn bijvrouw pleegde ontucht tegen hem, en ging bij hem weg naar het huis van haar vader, naar Bethlehem-Juda; en zij was daar enige dagen, namelijk vier maanden.", "3": "En haar man maakte zich op, en trok haar achterna, om vriendelijk tegen haar te spreken, om haar terug te halen; en zijn knecht was bij hem, en een paar ezels. En zij bracht hem in het huis van haar vader. En toen de vader van de jonge vrouw hem zag, werd hij blij dat hij hem ontmoette.", "4": "En zijn schoonvader, de vader van de jonge vrouw, hield hem tegen, zodat hij drie dagen bij hem bleef; en zij aten en dronken, en overnachtten daar.", "5": "Op de vierde dag nu gebeurde het, dat zij 's morgens vroeg op waren, en hij opstond om weg te trekken; toen zei de vader van de jonge dochter tegen zijn schoonzoon: Sterk uw hart met een stukje brood, en daarna zult u weggaan.", "6": "Zo gingen zij zitten, en zij beiden aten samen, en dronken. Toen zei de vader van de jonge vrouw tegen de man: Blijf toch, en overnacht, en laat uw hart vrolijk zijn.", "7": "Maar de man stond op, om weg te trekken. Toen drong zijn schoonvader er bij hem op aan, dat hij daar weer overnachtte.", "8": "Toen hij op de vijfde dag 's morgens vroeg op was, om weg te trekken, zei de vader van de jonge vrouw: Sterk toch uw hart. En zij bleven, totdat de dag zich neigde; en zij beiden aten samen.", "9": "Toen maakte de man zich op, om weg te trekken, hij, en zijn bijvrouw, en zijn knecht; en zijn schoonvader, de vader van de jonge vrouw, zei: Zie toch, de dag is afgenomen, het wordt avond, overnacht toch; zie, de dag loopt ten einde, overnacht hier, en laat uw hart vrolijk zijn, en maak u morgen vroeg op voor uw reis, en ga naar uw tent.", "10": "Doch de man wilde niet overnachten, maar stond op, en trok weg, en kwam tot tegenover Jebus (dat is Jeruzalem), met hem het paar gezadelde ezels; ook was zijn bijvrouw bij hem.", "11": "Toen zij nu bij Jebus waren, was de dag ver gedaald; en de knecht zei tegen zijn heer: Kom toch, laten we naar deze stad van de Jebusieten gaan, en daarin overnachten.", "12": "Maar zijn heer zei tegen hem: Wij zullen hierheen niet afwijken naar een vreemde stad, die niet van de kinderen van Israël is; maar wij zullen doortrekken tot aan Gibea.", "13": "Verder zei hij tegen zijn knecht: Kom, laten wij naderen tot een van die plaatsen, en overnachten in Gibea of in Rama.", "14": "Zo trokken zij verder, en gingen hun weg; en de zon ging voor hen onder bij Gibea, dat aan Benjamin toebehoort;", "15": "En zij weken daarheen af, om daar in te gaan en in Gibea te overnachten. Toen hij nu naar binnen ging, ging hij zitten op een plein van de stad, want er was niemand die hen in huis nam om te overnachten.", "16": "En zie, een oude man kwam 's avonds van zijn werk uit het veld, welke man ook van het gebergte van Efraïm was, maar als vreemdeling verkeerde in Gibea; de mensen van die plaats waren echter kinderen van Jemini.", "17": "Toen hij nu zijn ogen opsloeg, zag hij die reizende man op het plein van de stad; en de oude man zei: Waar gaat u heen, en waar komt u vandaan?", "18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "19": "Terwijl toch onze ezels zowel stro als voer hebben, en ook brood en wijn is er voor mij, en voor uw dienstmaagd, en voor de knecht die bij uw dienaren is; er is aan geen ding gebrek.", "20": "Toen zei de oude man: Vrede zij u! Al wat u ontbreekt, is toch voor mijn rekening; alleen overnacht niet op het plein.", "21": "En hij bracht hem in zijn huis, en gaf voer aan de ezels; en nadat zij hun voeten gewassen hadden, aten en dronken zij.", "22": "Toen zij nu hun hart vrolijk maakten, zie, omringden de mannen van die stad (mannen, die kinderen van Belial waren) het huis, en klopten op de deur; en zij spraken tegen de oude man, de heer van het huis, en zeiden: Breng de man die in uw huis gekomen is naar buiten, zodat wij hem *bekennen*[1].", "23": "En de man, de heer van het huis, ging naar hen toe naar buiten, en zei tegen hen: Nee, mijn broeders, doe toch zo'n kwaad niet; omdat deze man in mijn huis gekomen is, doe zo'n dwaasheid niet.", "24": "Zie, mijn dochter die maagd is, en zijn bijvrouw, die zal ik nu naar buiten brengen, opdat u hen schendt, en met hen doet wat goed is in uw ogen; maar doe aan deze man zo'n dwaze zaak niet.", "25": "Maar de mannen wilden niet naar hem luisteren. Toen greep de man zijn bijvrouw, en bracht haar naar buiten naar hen toe; en zij *bekenden*[1] haar, en waren de hele nacht tot aan de morgen met haar bezig, en lieten haar gaan toen de dageraad aanbrak.", "26": "En deze vrouw kwam tegen het aanbreken van de morgenstond, en viel neer voor de deur van het huis van de man, waar haar heer was, totdat het licht werd.", "27": "Toen nu haar heer 's morgens opstond en de deuren van het huis opende, en naar buiten ging om zijn weg te gaan, zie, zo lag de vrouw, zijn bijvrouw, aan de deur van het huis, met haar handen op de drempel.", "28": "En hij zei tegen haar: Sta op, laten wij gaan; maar niemand antwoordde. Toen nam hij haar op de ezel, en de man maakte zich op, en trok naar zijn plaats.", "29": "Toen hij nu in zijn huis kwam, nam hij een mes, en greep zijn bijvrouw, en verdeelde haar met haar botten in twaalf stukken; en hij zond ze naar alle gebieden van Israël.", "30": "En het gebeurde, dat ieder die het zag, zei: Zoiets is niet gebeurd of gezien, vanaf de dag dat de kinderen van Israël uit het land Egypte zijn opgetrokken, tot op deze dag; overweeg het, beraadslaag, en spreek uw gedachten uit!"}, "SV": {"1": "Het geschiedde ook in die dagen, als er geen koning was in Israël, dat er een Levietisch man was, verkerende als vreemdeling aan de zijden van het gebergte van Efraïm, die zich een vrouw, een bijwijf, nam van Bethlehem-juda.", "2": "Maar zijn bijwijf hoereerde, bij hem zijnde, en toog van hem weg naar haars vaders huis, tot Bethlehem-juda; en zij was aldaar enige dagen, *te* *weten* vier maanden.", "3": "En haar man maakte zich op, en toog haar na, om naar haar hart te spreken, om haar weder te halen; en zijn jongen was bij hem, en een paar ezels. En zij bracht hem in het huis haars vaders. En als de vader van de jonge vrouw hem zag, werd hij vrolijk over zijn ontmoeting.", "4": "En zijn schoonvader, de vader van de jonge vrouw, behield hem, dat hij drie dagen bij hem bleef; en zij aten en dronken, en vernachtten aldaar.", "5": "Op den vierden dag nu geschiedde het, dat zij des morgens vroeg op waren, en hij opstond om weg te trekken; toen zeide de vader van de jonge dochter tot zijn schoonzoon: Sterk uw hart met een bete broods, en daarna zult gijlieden wegtrekken.", "6": "Zo zaten zij neder, en zij beiden aten te zamen, en dronken. Toen zeide de vader van de jonge vrouw tot den man: Bewillig toch en vernacht, en laat uw hart vrolijk zijn.", "7": "Maar de man stond op, om weg te trekken. Toen drong hem zijn schoonvader, dat hij aldaar wederom vernachtte.", "8": "Als hij op den vijfden dag des morgens vroeg op was, om weg te trekken, zo zeide de vader van de jonge vrouw: Sterk toch uw hart. En zij vertoefden, totdat de dag zich neigde; en zij beiden aten *te* *zamen*.", "9": "Toen maakte zich de man op, om weg te trekken, hij, en zijn bijwijf, en zijn jongen; en zijn schoonvader, de vader van de jonge vrouw, zeide: Zie toch, de dag heeft afgenomen, dat het avond zal worden, vernacht toch; zie, de dag legert zich, vernacht hier, en laat uw hart vrolijk zijn, en maak u morgen vroeg op uws weegs, en ga naar uw tent.", "10": "Doch de man wilde niet vernachten, maar stond op, en trok weg, en kwam tot tegenover Jebus ( dewelke is Jeruzalem), en met hem het paar gezadelde ezelen; ook was zijn bijwijf met hem.", "11": "Als zij nu bij Jebus waren, zo was de dag zeer gedaald; en de jongen zeide tot zijn heer: Trek toch voort, en laat ons in deze stad der Jebusieten wijken, en daarin vernachten.", "12": "Maar zijn heer zeide tot hem: Wij zullen herwaarts niet wijken tot een vreemde stad, die niet is van de kinderen Israëls; maar wij zullen voorttrekken tot Gibea toe.", "13": "Voorts zeide hij tot zijn jongen: Ga voort, dat wij tot een van die plaatsen naderen, en te Gibea of te Rama vernachten.", "14": "Alzo togen zij voort, en wandelden; en de zon ging hun onder bij Gibea, dewelke Benjamins is;", "15": "En zij weken daarheen, dat zij inkwamen, om in Gibea te vernachten. Toen hij nu inkwam, zat hij neder in een straat der stad, want er was niemand, die hen in huis nam, om te vernachten.", "16": "En ziet, een oud man kwam van zijn werk van het veld in den avond, welke man ook was van het gebergte van Efraïm, doch als vreemdeling verkeerde te Gibea; maar de lieden dezer plaats waren kinderen van Jemini.", "17": "Als hij nu zijn ogen ophief, zo zag hij dien reizenden man op de straat der stad; en de oude man zeide: Waar trekt gij henen, en van waar komt gij?", "18": "En hij zeide tot hem: Wij trekken door van Bethlehem-juda tot aan de zijden van het gebergte van Efraïm, van waar ik ben; en ik was naar Bethlehem-juda getogen, maar ik trek *nu* naar het huis des HEEREN; en er is niemand, die mij in huis neemt.", "19": "Daar toch onze ezelen zowel stro als voeder hebben, en ook brood en wijn is voor mij, en voor uw dienstmaagd, en voor den jongen, *die* bij uw knechten is; er is aan geen ding gebrek.", "20": "Toen zeide de oude man: Vrede zij u! al wat u ontbreekt, is toch bij mij; alleenlijk vernacht niet op de straat.", "21": "En hij bracht hem in zijn huis, en gaf aan de ezelen voeder; en hun voeten gewassen hebbende, zo aten en dronken zij.", "22": "Toen zij nu hun hart vrolijk maakten, ziet, zo omringden de mannen van die stad ( mannen, die Belials kinderen waren) het huis, kloppende op de deur; en zij spraken tot den ouden man, den heer des huizes, zeggende: Breng den man, die in uw huis gekomen is, uit, opdat wij hem bekennen.", "23": "En de man, de heer des huizes, ging tot hen uit, en zeide tot hen: Niet, mijn broeders, doet toch *zo* kwalijk niet; naardien deze man in mijn huis gekomen is, zo doet zulke dwaasheid niet.", "24": "Ziet, mijn dochter die maagd is, en zijn bijwijf, die zal ik nu uitbrengen, dat gij die schendt, en haar doet, wat goed is in uw ogen; maar doet aan dezen man zulk een dwaas ding niet.", "25": "Maar de mannen wilden naar hem niet horen. Toen greep de man zijn bijwijf, en bracht haar uit tot hen daarbuiten; en zij bekenden haar, en waren met haar bezig den ganse nacht tot aan den morgen, en lieten haar gaan, als de dageraad oprees.", "26": "En deze vrouw kwam tegen het aanbreken van den morgenstond, en viel neder voor de deur van het huis des mans, waarin haar heer was, totdat het licht werd.", "27": "Als nu haar heer des morgens opstond en de deuren van het huis opendeed, en uitging om zijns weegs te gaan, ziet, zo lag de vrouw, zijn bijwijf, aan de deur van het huis, en haar handen op den dorpel.", "28": "En hij zeide tot haar: Sta op, en laat ons trekken; maar niemand antwoordde. Toen nam hij haar op den ezel, en de man maakte zich op, en toog naar zijn plaats.", "29": "Als hij nu in zijn huis kwam, zo nam hij een mes, en greep zijn bijwijf, en deelde haar met haar beenderen in twaalf stukken; en hij zond ze in alle landpalen van Israël.", "30": "En het geschiedde, dat al wie het zag, zeide: Zulks is niet geschied noch gezien, van dien dag af, dat de kinderen Israëls uit Egypteland zijn opgetogen, tot op dezen dag; legt uw *hart* daarop en spreekt!"}, "KJV": {"1": "And it came to pass in those days, when *there was* no king in Israel, that there was a certain Levite sojourning on the side of mount Ephraim, who took to him a concubine out of Bethlehemjudah.", "2": "And his concubine played the whore against him, and went away from him unto her father's house to Bethlehemjudah, and was there four whole months.", "3": "And her husband arose, and went after her, to speak friendly unto her, *and* to bring her again, having his servant with him, and a couple of asses: and she brought him into her father's house: and when the father of the damsel saw him, he rejoiced to meet", "4": "And his father in law, the damsel's father, retained him; and he abode with him three days: so they did eat and drink, and lodged", "5": "And it came to pass on the fourth day, when they arose early in the morning, that he rose up to depart: and the damsel's father said unto his son in law, Comfort thine heart with a morsel of bread, and afterward go your way.", "6": "And they sat down, and did eat and drink both of them together: for the damsel's father had said unto the man, Be content, I pray thee, and tarry all night, and let thine heart be merry.", "7": "And when the man rose up to depart, his father in law urged him: therefore he lodged there again.", "8": "And he arose early in the morning on the fifth day to depart: and the damsel's father said, Comfort thine heart, I pray thee. And they tarried until afternoon, and they did eat both", "9": "And when the man rose up to depart, he, and his concubine, and his servant, his father in law, the damsel's father, said unto him, Behold, now the day draweth toward evening, I pray you tarry all night: behold, the day groweth to an end, lodge here, that thine heart may be merry; and to morrow get you early on your way, that thou mayest go home.", "10": "But the man would not tarry that night, but he rose up and departed, and came over against Jebus, which *is* Jerusalem; and *there were* with him two asses saddled, his concubine", "11": "*And* when they *were* by Jebus, the day was far spent; and the servant said unto his master, Come, I pray thee, and let us turn in into this city of the Jebusites, and lodge", "12": "And his master said unto him, We will not turn aside hither into the city of a stranger, that *is* not of the children of Israel; we will pass over to Gibeah.", "13": "And he said unto his servant, Come, and let us draw near to one of these places to lodge all night, in Gibeah, or in Ramah.", "14": "And they passed on and went their way; and the sun went down upon them *when they were* by Gibeah, which *belongeth* to Benjamin.", "15": "And they turned aside thither, to go in *and* to lodge in Gibeah: and when he went in, he sat him down in a street of the city: for *there was* no man that took them into his house to lodging.", "16": "And, behold, there came an old man from his work out of the field at even, which *was* also of mount Ephraim; and he sojourned in Gibeah: but the men of the place *were* Benjamites.", "17": "And when he had lifted up his eyes, he saw a wayfaring man in the street of the city: and the old man said, Whither goest thou? and whence comest", "18": "And he said unto him, We *are* passing from Bethlehemjudah toward the side of mount Ephraim; from thence *am* I: and I went to Bethlehemjudah, but I *am now* going to the house of the LORD; and there *is* no man that receiveth me to house.", "19": "Yet there is both straw and provender for our asses; and there is bread and wine also for me, and for thy handmaid, and for the young man *which is* with thy servants: *there is* no want of any thing.", "20": "And the old man said, Peace *be* with thee; howsoever *let* all thy wants *lie* upon me; only lodge not in the street.", "21": "So he brought him into his house, and gave provender unto the asses: and they washed their feet, and did eat and drink.", "22": "*Now* as they were making their hearts merry, behold, the men of the city, certain sons of Belial, beset the house round about, *and* beat at the door, and spake to the master of the house, the old man, saying, Bring forth the man that came into thine house, that we may know", "23": "And the man, the master of the house, went out unto them, and said unto them, Nay, my brethren, *nay*, I pray you, do not *so* wickedly; seeing that this man is come into mine house, do not this folly.", "24": "Behold, *here is* my daughter a maiden, and his concubine; them I will bring out now, and humble ye them, and do with them what seemeth good unto you: but unto this man do not so vile a thing.", "25": "But the men would not hearken to him: so the man took his concubine, and brought her forth unto them; and they knew her, and abused her all the night until the morning: and when the day began to spring, they let her go.", "26": "Then came the woman in the dawning of the day, and fell down at the door of the man's house where her lord *was*, till it was light.", "27": "And her lord rose up in the morning, and opened the doors of the house, and went out to go his way: and, behold, the woman his concubine was fallen down *at* the door of the house, and her hands *were* upon the threshold.", "28": "And he said unto her, Up, and let us be going. But none answered. Then the man took her *up* upon an ass, and the man rose up, and gat him unto his place.", "29": "And when he was come into his house, he took a knife, and laid hold on his concubine, and divided her, *together* with her bones, into twelve pieces, and sent her into all the coasts of Israel.", "30": "And it was so, that all that saw it said, There was no such deed done nor seen from the day that the children of Israel came up out of the land of Egypt unto this day: consider of it, take advice, and speak"}}, "tsk": {"1": [{"kopje": "toen er geen", "refs": ["Richt 17:6", "Richt 18:1", "Richt 21:25"]}, {"kopje": "gebergte", "refs": ["Richt 17:1", "Richt 17:8", "Joz 24:30", "Joz 24:33"]}, {"kopje": "een bijvrouw", "refs": ["Gen 22:24", "Gen 25:6", "2 Sam 3:7", "2 Sam 5:13", "2 Sam 16:22", "2 Sam 19:5", "2 Sam 20:3", "1 Kon 11:3", "2 Kron 11:21", "Est 2:14", "Hoogl 6:8", "Hoogl 6:9", "Dan 5:3", "Mal 2:15", "Richt 17:8", "Gen 35:19", "Matt 2:6"]}], "2": [{"kopje": "pleegde ontucht", "refs": ["Lev 21:9", "Deut 22:21", "Ezech 16:28"]}], "3": [{"kopje": "trok haar achterna", "refs": ["Richt 15:1"]}, {"kopje": "spreken", "refs": ["Gen 50:21" : []}]}]}, {"topic": "Jews, The", "href": "../../torrey/j/#t-jews-the", "kinderen": [{"label": "Obliged to unite against enemies", "href": "../../torrey/j/?hl=Judg.19.29#i10327", "refs": [{"disp": "Num 32:20-22", "href": "../../numeri/32/#v20", "ref": "Num 32:20-22", "svLabel": null}, {"disp": "Richt 19:29", "href": "../../richteren/19/#v29", "ref": "Richt 19:29", "svLabel": null}, {"disp": "Richt 20:1-48", "href": "../../richteren/20/#v1", "ref": "Richt 20:1-48", "svLabel": null}, {"disp": "1 Sam 11:7", "href": "../../1-samuel/11/#v7", "ref": "1 Sam 11:7", "svLabel": null}, {"disp": "1 Sam 11:8", "href": "../../1-samuel/11/#v8", "ref": "1 Sam 11:8", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ezra 7:27": "Geloofd zij de HEERE, de God van onze vaderen, Die zoiets in het hart van de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "Gen 24:24": "En zij had tegen hem gezegd: Ik ben de dochter van Bethuël, de zoon van Milka, die zij Nahor gebaard heeft.", "Gen 19:5": "En zij riepen Lot toe, en zeiden tegen hem: Waar zijn die mannen die deze nacht bij u gekomen zijn? Breng hen naar buiten, naar ons toe, opdat wij met hen gemeenschap hebben.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "1 Tim 1:9": "En als hij dit weet, dat de wet niet gemaakt is voor de rechtvaardige, maar voor de onrechtvaardigen en de weerspannigen, de goddelozen en de zondaars, de onheiligen en de ongodsdienstigen, de vadermoordenaars en de moedermoordenaars, de doodslagers,", "2 Kron 8:16": "Zo werd al het werk van Salomo klaargemaakt, tot de dag van de grondlegging van het huis van de HEERE, en tot het voltooien ervan, zodat het huis van de HEERE volmaakt werd.", "1 Kon 13:7": "En de koning zei tegen de man van God: Kom met mij mee naar huis, en sterk u, en ik zal u een geschenk geven.", "Joh 8:10": "En Jezus richtte Zich op, en toen Hij niemand zag dan de vrouw, zei Hij tegen haar: Vrouw, waar zijn uw beschuldigers? Heeft niemand u veroordeeld?", "Hoogl 6:9": "Eén is Mijn duif, Mijn volmaakte, de enige van haar moeder, zij is de zuivere van hen die haar gebaard heeft; als de dochters haar zien, zullen zij haar gelukkig prijzen, de koninginnen en de bijvrouwen; en zij zullen haar loven.", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "Gen 18:12": "Zo lachte Sara bij zichzelf en zei: Zal ik nog wellust hebben, nu ik oud geworden ben, en mijn heer ook oud is?", "Gen 18:3-8": "En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga toch niet aan Uw knecht voorbij. Laat er toch een beetje water gebracht worden, en was Uw voeten, en rust onder deze boom. En ik zal een stuk brood halen, dat U Uw hart sterkt; daarna kunt U verdergaan, want daarom bent U immers naar Uw knecht gekomen. En zij zeiden: Doe zoals u gesproken hebt.", "Gen 27:17": "En zij gaf de smakelijke spijzen, en het brood, dat zij klaargemaakt had, in de hand van Jakob, haar zoon.", "Spr 24:6": "Want door wijze raadslagen zult u voor u de oorlog voeren, en in de veelheid van raadgevers is de overwinning.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Lev 20:13": "Wanneer ook een man gemeenschap heeft met een man, zoals met een vrouw, hebben zij beiden een gruwel gedaan; zij zullen zeker gedood worden; hun bloed is op hen!", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "Jer 36:5": "En Jeremia gebood Baruch: Ik word tegengehouden, ik zal niet in het huis van de HEERE kunnen gaan.", "Job 31:32": "De vreemdeling overnachtte niet op de straat; mijn deuren opende ik naar de weg;", "Joz 18:25": "Gibeon, en Rama, en Beeroth,", "2 Sam 11:8": "Daarna zei David tegen Uria: Ga naar uw huis, en was uw voeten. En toen Uria uit het huis van de koning wegging, volgde hem een gerecht van de koning achterna.", "2 Kron 36:14": "Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.", "Matt 25:43": "Ik was een vreemdeling; en u hebt Mij geen onderkomen gegeven; naakt, en u hebt Mij niet gekleed; ziek, en in de gevangenis, en u hebt Mij niet bezocht.", "Rom 1:27": "en evenzo hebben ook de mannen het natuurlijke gebruik van de vrouw verlaten, en zijn in hun begeerte naar elkaar in vuur geraakt, mannen die met mannen schandelijkheid bedrijven, en de vergelding voor hun dwaling, die daarbij hoorde, in zichzelf ontvangend.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "1 Joh 3:18": "Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid.", "Gen 24:31-33": "En hij zei: Kom binnen, gezegende van de HEERE! Waarom zou u buiten blijven staan? Want ik heb het huis gereedgemaakt, en de plaats voor de kamelen. Toen kwam die man het huis binnen, en men maakte de kamelen los, en men gaf de kamelen stro en voer; en water om zijn voeten te wassen, en de voeten van de mannen die bij hem waren. Daarna werd hem te eten voorgezet; maar hij zei: Ik zal niet eten, totdat ik mijn woorden gesproken heb. En hij zei: Spreek!", "Jer 20:1": "Toen Pashur, de zoon van Immer, de priester (deze was aangesteld als voorganger in het huis van de HEERE), Jeremia hoorde deze woorden profeteren,", "Jak 2:16": "en iemand van u zou tegen hen zeggen: Ga heen in vrede, word warm en word verzadigd; maar u zou hun niet geven wat nodig is voor het lichaam, wat voor nut is dat?", "Luk 24:29": "En zij drongen bij Hem aan en zeiden: Blijf bij ons, want het is bijna avond, en de dag is bijna voorbij. En Hij ging naar binnen om bij hen te blijven.", "Richt 20:1": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa.", "Rom 1:26": "Daarom heeft God hen overgegeven aan oneerlijke driften; want ook hun vrouwen hebben het natuurlijke gebruik veranderd in het gebruik tegen de natuur;", "2 Kon 12:9": "Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Lev 20:10": "Een man ook, die met de vrouw van een ander overspel doet, omdat hij overspel doet met de vrouw van zijn naaste, zal zeker gedood worden, de overspeler en de overspeelster.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Gen 19:7": "en hij zei: Mijn broeders! Doe toch geen kwaad!", "Richt 19:22-30": "Toen zij nu hun hart vrolijk maakten, zie, omringden de mannen van die stad (mannen, die kinderen van Belial waren) het huis, en klopten op de deur; en zij spraken tegen de oude man, de heer van het huis, en zeiden: Breng de man die in uw huis gekomen is naar buiten, zodat wij hem bekennen. En de man, de heer van het huis, ging naar hen toe naar buiten, en zei tegen hen: Nee, mijn broeders, doe toch zo'n kwaad niet; omdat deze man in mijn huis gekomen is, doe zo'n dwaasheid niet. Zie, mijn dochter die maagd is, en zijn bijvrouw, die zal ik nu naar buiten brengen, opdat u hen schendt, en met hen doet wat goed is in uw ogen; maar doe aan deze man zo'n dwaze zaak niet.", "2 Sam 5:6": "En de koning trok met zijn mannen naar Jeruzalem, tegen de Jebusieten, die in dat land woonden. En zij zeiden tegen David: U zult hier niet binnenkomen, maar de blinden en kreupelen zullen u wegjagen; dat wil zeggen: David zal hier niet binnenkomen.", "Joz 24:30": "En zij begroeven hem in het gebied van zijn erfdeel, te Timnath-Serah, dat op een berg van Efraïm ligt, ten noorden van de berg Gaäs.", "2 Kon 11:4": "In het zevende jaar zond Jojada, en nam de leiders van honderd met de hoofdmannen en met de lijfwacht, en hij bracht hen bij zich, in het huis van de HEERE; en hij sloot een verbond met hen en beëdigde hen in het huis van de HEERE, en hij toonde hun de zoon van de koning.", "Gen 19:5-8": "En zij riepen Lot toe, en zeiden tegen hem: Waar zijn die mannen die deze nacht bij u gekomen zijn? Breng hen naar buiten, naar ons toe, opdat wij met hen gemeenschap hebben. Toen ging Lot naar buiten naar hen toe, bij de deur, en hij sloot de deur achter zich toe; en hij zei: Mijn broeders! Doe toch geen kwaad!", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "1 Kon 6:37": "In het vierde jaar werd de grond van het huis van de HEERE gelegd, in de maand Ziv;", "Pred 1:13": "En ik richtte mijn hart erop om met wijsheid te onderzoeken en na te speuren alles wat er gebeurt onder de hemel. Deze moeilijke bezigheid heeft God de kinderen der mensen gegeven, om zich daarmee bezig te houden.", "Gen 19:3": "En hij hield sterk bij hen aan, zodat zij bij hem introkken, en in zijn huis kwamen; en hij maakte hun een maaltijd, en bakte ongezuurde koeken, en zij aten.", "Jer 17:26": "En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Joh 14:27": "Vrede laat Ik u na, Mijn vrede geef Ik u; niet zoals de wereld die geeft, geef Ik hem u. Laat uw hart niet ontroerd worden en niet bevreesd zijn.", "Matt 25:35": "Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven.", "Spr 27:1": "Beroem u niet over de dag van morgen; want u weet niet, wat de dag zal baren.", "Hos 7:4-7": "Zij plegen allemaal samen overspel, zij zijn als een bakoven, die heet gemaakt is door de bakker; die ophoudt met opstoken nadat hij het deeg heeft gekneed, totdat het doorgezuurd is. Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters. Want zij brengen hun hart klaar, als een bakoven, voor hun listen; hun bakker slaapt de hele nacht; 's morgens brandt hij als een vlammend vuur.", "Hos 2:13": "Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken.", "Gen 19:6-8": "Toen ging Lot naar buiten naar hen toe, bij de deur, en hij sloot de deur achter zich toe; en hij zei: Mijn broeders! Doe toch geen kwaad! Zie toch, ik heb twee dochters, die nog met geen man gemeenschap gehad hebben; ik zal ze nu naar buiten brengen, naar u toe, en doe met hen zoals het goed is in uw ogen; alleen, doe deze mannen niets; want daarom zijn zij onder de bescherming van mijn dak gekomen.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Gen 22:24": "En zijn bijvrouw, wier naam Reüma was, die baarde ook Tebah, en Gaham, en Tahas, en Maächa.", "1 Kron 22:11": "Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.", "1 Tess 4:11": "En dat u zich beijvert om stil te zijn, en uw eigen zaken te doen, en te werken met uw eigen handen, zoals wij u bevolen hebben;", "Gen 10:16": "En de Jebusiet, en de Amoriet, en de Girgasiet,", "Gen 42:27": "Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "Joz 15:8": "En deze grens zal opgaan door het dal van de zoon van Hinnom, aan de kant van de Jebusiet van het zuiden, dat is Jeruzalem; en deze grens zal opwaarts gaan tot de top van de berg, die voor het dal van Hinnom is, westwaarts, wat in het uiterste van het dal van de Refaïeten is, tegen het noorden.", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "2 Sam 16:22": "Zo spanden zij voor Absalom een tent op op het dak; en Absalom ging naar de bijvrouwen van zijn vader, voor de ogen van heel Israël.", "Joh 15:6": "Als iemand in Mij niet blijft, die is buiten geworpen, zoals de rank, en is verdord; en men verzamelt ze, en men werpt ze in het vuur, en zij worden verbrand.", "Ps 104:15": "En de wijn, die het hart van de mens verheugt, zodat het gezicht blinkt van olie; en het brood, dat het hart van de mens sterkt.", "Richt 17:6": "In die dagen was er geen koning in Israël; ieder deed wat recht was in zijn eigen ogen.", "Pred 5:11": "De slaap van de arbeider is zoet, of hij nu weinig of veel gegeten heeft; maar de overvloed van de rijke laat hem niet slapen.", "Jer 5:8": "Als goed gevoede hengsten zijn zij vroeg op; zij hunkeren, ieder naar de vrouw van zijn naaste.", "1 Sam 1:24": "Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.", "Jer 5:7": "Hoe zou Ik u om deze dingen vergeven? Uw kinderen hebben Mij verlaten, en zweren bij hen die geen God zijn; toen Ik hen verzadigd had, bedreven zij overspel, en verzamelden zich in troepen in het hoerenhuis.", "Gen 4:1": "En Adam had gemeenschap met Eva, zijn vrouw, en zij werd zwanger en baarde Kaïn, en zei: Ik heb een man van de HEERE verkregen!", "Jer 28:5": "Toen zei de profeet Jeremia tegen de profeet Hananja, voor de ogen van de priesters en voor de ogen van het hele volk, dat in het huis van de HEERE stond;", "Ezech 16:28": "Verder hebt u gehoereerd met de zonen van Assur, omdat u onverzadigbaar was; ja, ook toen u met hen gehoereerd had, was u nog niet verzadigd.", "Lev 20:15": "Verder, als een man gemeenschap heeft met enig dier, zal hij zeker gedood worden; ook zult u het dier doden.", "Spr 15:22": "Plannen worden tenietgedaan als er geen overleg is; maar door veel raadgevers komen ze tot stand.", "2 Sam 13:12": "Maar zij zei tegen hem: Nee, mijn broer, verkracht mij niet, want zo doet men niet in Israël; doe deze dwaasheid niet.", "Rom 10:2": "Want ik geef hun getuigenis, dat zij een ijver voor God hebben, maar niet met verstand.", "Jer 26:7": "En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis van de HEERE.", "Richt 19:22-25": "Toen zij nu hun hart vrolijk maakten, zie, omringden de mannen van die stad (mannen, die kinderen van Belial waren) het huis, en klopten op de deur; en zij spraken tegen de oude man, de heer van het huis, en zeiden: Breng de man die in uw huis gekomen is naar buiten, zodat wij hem bekennen. En de man, de heer van het huis, ging naar hen toe naar buiten, en zei tegen hen: Nee, mijn broeders, doe toch zo'n kwaad niet; omdat deze man in mijn huis gekomen is, doe zo'n dwaasheid niet. Zie, mijn dochter die maagd is, en zijn bijvrouw, die zal ik nu naar buiten brengen, opdat u hen schendt, en met hen doet wat goed is in uw ogen; maar doe aan deze man zo'n dwaze zaak niet.", "1 Sam 1:7": "En zo deed hij jaar op jaar; van toen af dat zij opging naar het huis van de HEERE, zo tergde zij haar steeds; daarom weende zij en at niet.", "Ex 30:21": "Dan moeten zij hun handen en voeten wassen, zodat zij niet sterven; en dit zal voor hen een eeuwige instelling zijn, voor hem en zijn nageslacht, bij hun geslachten.", "Gen 34:3": "En zijn ziel hechtte zich aan Dina, Jakobs dochter; en hij had de jonge vrouw lief, en sprak naar het hart van de jonge vrouw.", "2 Kon 25:9": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.", "Richt 18:31": "Zo stelden zij voor zich het gesneden beeld van Micha op, dat hij gemaakt had, al de dagen dat het huis van God te Silo was.", "Lev 21:9": "Als nu de dochter van een priester zal beginnen te hoereren, ontheiligt zij haar vader; met vuur zal zij verbrand worden.", "Gen 35:19": "Zo stierf Rachel; en zij werd begraven aan de weg naar Efrath, dat is Bethlehem.", "2 Sam 19:5": "Toen kwam Joab bij de koning in huis, en zei: U hebt vandaag het gezicht van al uw knechten beschaamd gemaakt, terwijl zij vandaag uw leven hebben gered, en het leven van uw zonen en uw dochters, en het leven van uw vrouwen, en het leven van uw bijvrouwen;", "Joh 8:11": "En zij zei: Niemand, Heere! En Jezus zei tegen haar: Dan veroordeel Ik u ook niet; ga heen, en zondig niet meer.", "1 Petr 3:6": "zoals Sara Abraham gehoorzaam is geweest, hem heer noemend, van wie u dochters geworden bent, als u goed doet en voor geen enkele verschrikking bang bent.", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "1 Kron 22:14": "Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe.", "Spr 13:11": "Goed, dat door ijdelheid gekomen is, zal verminderd worden; maar die met de hand verzamelt, zal het vermeerderen.", "Luk 10:5": "En in welk huis u ook binnengaat, zeg eerst: Vrede zij dit huis!", "2 Kon 23:2": "En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was.", "Hoogl 5:3": "Ik heb mijn rok uitgetrokken, hoe zal ik hem weer aantrekken? Ik heb mijn voeten gewassen, hoe zal ik ze weer bezoedelen?", "2 Kron 11:21": "En Rehabeam had Maächa, Absaloms dochter, liever dan al zijn vrouwen en zijn bijvrouwen; want hij had achttien vrouwen genomen, en zestig bijvrouwen; en hij verwekte achtentwintig zonen en zestig dochters.", "2 Tess 3:10": "Want ook toen wij bij u waren, hebben wij u dit bevolen: dat als iemand niet wil werken, hij ook niet moet eten.", "Joz 6:24": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Gen 37:2": "Dit zijn Jakobs geschiedenissen. Jozef, een zoon van zeventien jaren, weidde de kudde met zijn broeders (en hij was een jongeling), met de zonen van Bilha en de zonen van Zilpa, de vrouwen van zijn vader; en Jozef bracht hun kwaad gerucht over aan hun vader.", "1 Kron 26:12": "Uit dezen waren de verdelingen van de poortwachters onder de hoofden van de mannen, met wachtdiensten tegenover hun broers, om te dienen in het huis van de HEERE.", "Richt 19:12-30": "Maar zijn heer zei tegen hem: Wij zullen hierheen niet afwijken naar een vreemde stad, die niet van de kinderen van Israël is; maar wij zullen doortrekken tot aan Gibea. Verder zei hij tegen zijn knecht: Kom, laten wij naderen tot een van die plaatsen, en overnachten in Gibea of in Rama. Zo trokken zij verder, en gingen hun weg; en de zon ging voor hen onder bij Gibea, dat aan Benjamin toebehoort;", "Lev 19:17": "U zult uw broeder in uw hart niet haten; u zult uw naaste zeker berispen, en zult de zonde in hem niet laten voortbestaan.", "Jak 4:13": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken.", "Jes 10:29": "Zij trekken door de doorgang, te Geba houden zij hun overnachting; Rama beeft, Gibea van Saul vlucht.", "Gen 43:23": "En hij zei: Vrede zij u, wees niet bang! Uw God en de God van uw vader heeft u een schat in uw zakken gegeven; uw geld is bij mij aangekomen. En hij bracht Simeon naar hen toe.", "Richt 20:18": "En de kinderen van Israël maakten zich op, en trokken op naar het huis van God, en vroegen God om raad, en zeiden: Wie zal onder ons als eerste optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zei: Juda als eerste.", "Jes 37:14": "Toen Hizkia de brieven uit de hand van de boden ontvangen had, en die gelezen had, ging hij naar het huis van de HEERE, en Hizkia spreidde die uit voor het aangezicht van de HEERE.", "1 Kon 15:12": "Want hij nam de schandjongens weg uit het land, en deed alle drekgoden weg, die zijn vaders gemaakt hadden.", "2 Kon 23:11": "En hij schafte de paarden af, die de koningen van Juda voor de zon gesteld hadden, bij de ingang van het huis van de HEERE, tot de kamer van Nathan-melech, de hoveling, die in Parvarim was; en de wagens van de zon verbrandde hij met vuur.", "Richt 1:8": "Want de Judeeërs hadden tegen Jeruzalem gestreden, en hadden het ingenomen, en met de scherpte van het zwaard geslagen; en zij hadden de stad in brand gestoken.", "1 Sam 25:41": "Toen stond zij op, en boog zich met het aangezicht ter aarde, en zij zei: Zie, uw dienstmaagd zij een dienares, om de voeten van de knechten van mijn heer te wassen.", "Gen 19:4": "Eer zij zich te slapen legden, omsingelden de mannen van die stad, de mannen van Sodom, van de jongste tot de oudste toe, dat huis, het hele volk, van alle kanten.", "Ef 4:19": "Zij hebben, ongevoelig geworden, zichzelf overgegeven aan losbandigheid, om alle onreinheid gierig te bedrijven.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Richt 19:16-21": "En zie, een oude man kwam 's avonds van zijn werk uit het veld, welke man ook van het gebergte van Efraïm was, maar als vreemdeling verkeerde in Gibea; de mensen van die plaats waren echter kinderen van Jemini. Toen hij nu zijn ogen opsloeg, zag hij die reizende man op het plein van de stad; en de oude man zei: Waar gaat u heen, en waar komt u vandaan? En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "1 Sam 10:27": "Doch de verdorven mensen zeiden: Wat zou deze man ons kunnen redden? En zij verachtten hem, en brachten hem geen geschenk. Doch hij deed alsof hij het niet hoorde.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "1 Kon 8:63": "En Salomo offerde als dankoffer, dat hij de HEERE offerde, tweeëntwintigduizend runderen, en honderdtwintigduizend schapen. Zo hebben zij het huis van de HEERE ingewijd, de koning en al de kinderen van Israël.", "2 Kron 29:5": "En hij zei tegen hen: Hoor mij, Levieten; heilig nu uzelf, en heilig het huis van de HEERE, de God van uw vaderen, en breng de onreinheid naar buiten, uit het heiligdom.", "Lev 20:16": "Zo ook, wanneer een vrouw tot enig dier nadert, om daarmee gemeenschap te hebben, zult u die vrouw en dat dier doden; zij zullen zeker gedood worden; hun bloed is op hen!", "Jer 20:2": "sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt.", "Luk 7:38": "en ging huilend achter Zijn voeten staan, en begon Zijn voeten nat te maken met tranen, en droogde ze af met het haar van haar hoofd, en kuste Zijn voeten, en zalfde ze met de zalf.", "Joh 13:5": "Daarna goot Hij water in het bekken en begon de voeten van de discipelen te wassen, en af te drogen met de linnen doek waarmee Hij omgord was.", "Hos 5:8": "Blaas de bazuin te Gibea, de trompet te Rama; roep luid te Beth-Aven; achter u, Benjamin!", "Jer 28:1": "Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:", "Judas 1:7": "Zoals Sodom en Gomorra, en de steden daaromheen, die op vergelijkbare wijze als deze gehoereerd hebben, en ander vlees zijn nagegaan, tot een voorbeeld voorgesteld zijn, en de straf van het eeuwige vuur dragen.", "Luk 7:44": "En Hij keerde Zich om naar de vrouw, en zei tegen Simon: Ziet u deze vrouw? Ik ben uw huis binnengekomen; water hebt u Mij niet over de voeten gegeven; maar deze heeft Mijn voeten met tranen nat gemaakt, en met het haar van haar hoofd afgedroogd.", "Num 22:22": "Doch de toorn van God ontstak, omdat hij heenging; en de Engel van de HEERE stelde Zich in de weg, als tegenpartij tegen hem; hij reed op zijn ezelin, en twee van zijn knechten waren bij hem.", "1 Sam 25:36": "Toen Abigaïl nu bij Nabal kwam, zie, zo had hij een maaltijd in zijn huis, als een koningsmaaltijd; en het hart van Nabal was vrolijk in hem, en hij was zeer dronken; daarom vertelde zij hem niets, klein of groot, tot het morgenlicht.", "Ruth 1:1": "In de dagen dat de rechters rechtspraken, gebeurde het dat er honger in het land was; daarom trok een man van Bethlehem-juda weg om als vreemdeling te wonen in de velden van Moab, hij, en zijn vrouw, en zijn twee zonen.", "Richt 17:7-9": "Nu was er een jongeman uit Bethlehem-Juda, van het geslacht van Juda; deze was een Leviet, en verbleef daar als vreemdeling. En deze man was uit die stad, uit Bethlehem-Juda vertrokken, om te verblijven waar hij gelegenheid zou vinden. Toen hij nu kwam bij het gebergte van Efraïm tot aan het huis van Micha, om zijn weg te gaan, zei Micha tegen hem: Waar komt u vandaan? En hij zei tegen hem: Ik ben een Leviet, uit Bethlehem-Juda, en ik reis rond om te verblijven waar ik gelegenheid zal vinden.", "Ex 23:19": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE uw God brengen. U zult een bokje niet koken in de melk van zijn moeder.", "Richt 18:1": "In die dagen was er geen koning in Israël; en in dezelfde dagen zocht de stam van Dan voor zich een erfenis om te wonen; want tot op die dag was hun onder de stammen van Israël niet genoeg ter erfenis toegevallen.", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "Luk 10:6": "En als daar een zoon van de vrede is, zal uw vrede op hem rusten; maar zo niet, dan zal uw vrede tot u terugkeren.", "Gen 24:32": "Toen kwam die man het huis binnen, en men maakte de kamelen los, en men gaf de kamelen stro en voer; en water om zijn voeten te wassen, en de voeten van de mannen die bij hem waren.", "Joz 15:63": "Maar de kinderen van Juda konden de Jebusieten, inwoners van Jeruzalem, niet verdrijven; zo woonden de Jebusieten bij de kinderen van Juda te Jeruzalem, tot op deze dag.", "Ex 34:26": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE, uw God, brengen. U zult het bokje niet koken in de melk van zijn moeder.", "Richt 17:8": "En deze man was uit die stad, uit Bethlehem-Juda vertrokken, om te verblijven waar hij gelegenheid zou vinden. Toen hij nu kwam bij het gebergte van Efraïm tot aan het huis van Micha, om zijn weg te gaan,", "Gal 6:6": "En wie onderwezen wordt in het Woord, moet delen van alle goederen met hem die hem onderwijst.", "Deut 23:18": "U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.", "Richt 6:23": "Doch de HEERE zei tegen hem: Vrede zij u, vrees niet, u zult niet sterven.", "Jak 4:14": "U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt.", "1 Sam 2:12": "Doch de zonen van Eli waren kinderen van Belial; zij kenden de HEERE niet.", "Richt 16:25": "En het gebeurde, toen hun hart vrolijk was, dat zij zeiden: Roept Simson, dat hij voor ons speelt. En zij riepen Simson uit de gevangenis; en hij speelde voor hun aangezicht, en zij lieten hem staan tussen de pilaren.", "Ef 4:28": "Wie gestolen heeft, moet niet meer stelen, maar moet liever arbeiden, terwijl hij met de handen doet wat goed is, opdat hij kan delen met hem die het nodig heeft.", "1 Petr 4:9": "Wees gastvrij voor elkaar, zonder gemopper.", "Joz 7:15": "En het zal gebeuren: wie aangewezen wordt met de ban, die zal met vuur verbrand worden, hij en alles wat hij heeft; omdat hij het verbond van de HEERE overtreden heeft, en omdat hij dwaasheid in Israël gedaan heeft.", "Mal 2:15": "Heeft Hij niet maar één gemaakt, hoewel Hij van de Geest overvloed had? En waarom die ene? Hij zocht een zaad van God. Daarom, wees op uw hoede met uw geest, en laat niemand trouweloos handelen tegen de vrouw van zijn jeugd.", "Gen 24:33": "Daarna werd hem te eten voorgezet; maar hij zei: Ik zal niet eten, totdat ik mijn woorden gesproken heb. En hij zei: Spreek!", "Deut 21:14": "En het zal gebeuren, als u geen behagen meer in haar hebt, dat u haar zult laten gaan waarheen zij wil; maar u zult haar beslist niet voor geld verkopen, u zult geen handel met haar drijven, omdat u haar vernederd hebt.", "Jer 6:4": "Heiligt de krijg tegen haar, maakt u op, en laat ons optrekken op de middag; o, wee ons! Want de dag heeft zich gewend, want de avondschaduwen neigen zich.", "Gen 3:19": "In het zweet van uw gezicht zult u brood eten, totdat u tot de aarde terugkeert, omdat u daaruit genomen bent; want u bent stof, en u zult tot stof terugkeren.", "Lev 18:23": "Insgelijks zult u bij geen dier liggen, om daarmee onrein te worden; een vrouw zal ook niet gaan staan voor een dier, om daarmee gemeenschap te hebben; het is een gruwelijke vermenging.", "Richt 20:7": "Zie, u bent allen kinderen van Israël, geef hier voor u woord en raad!", "1 Sam 10:26": "En Saul ging ook naar zijn huis te Gibea, en met hem gingen mannen uit het leger, van wie God het hart geraakt had.", "Ex 22:19": "Al wie met een dier gemeenschap heeft, moet zeker gedood worden.", "Joh 8:5": "En Mozes heeft ons in de wet geboden, dat zulke vrouwen gestenigd moeten worden; Wat zegt U dan?", "2 Sam 5:13": "En David nam nog meer bijvrouwen en vrouwen uit Jeruzalem, nadat hij uit Hebron gekomen was; en David werden nog meer zonen en dochters geboren.", "Richt 19:3-9": "En haar man maakte zich op, en trok haar achterna, om vriendelijk tegen haar te spreken, om haar terug te halen; en zijn knecht was bij hem, en een paar ezels. En zij bracht hem in het huis van haar vader. En toen de vader van de jonge vrouw hem zag, werd hij blij dat hij hem ontmoette. En zijn schoonvader, de vader van de jonge vrouw, hield hem tegen, zodat hij drie dagen bij hem bleef; en zij aten en dronken, en overnachtten daar. Op de vierde dag nu gebeurde het, dat zij 's morgens vroeg op waren, en hij opstond om weg te trekken; toen zei de vader van de jonge dochter tegen zijn schoonzoon: Sterk uw hart met een stukje brood, en daarna zult u weggaan.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "2 Kon 23:7": "Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.", "1 Kon 11:3": "En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.", "Jer 3:1": "Men zegt: Als een man zijn vrouw verlaat, en zij gaat van hem weg en wordt de vrouw van een andere man, zal hij dan nog naar haar terugkeren? Zou dat land niet ernstig ontheiligd worden? U hebt met veel minnaars gehoereerd, en toch zou u weer naar Mij terugkeren, spreekt de HEERE.", "Deut 27:21": "Vervloekt is hij die bij enig beest ligt! En heel het volk zal zeggen: Amen.", "Richt 17:1": "Er was een man van het gebergte van Efraïm, wiens naam Micha was.", "Hagg 1:2": "Zo spreekt de HEERE van de heerscharen: Dit volk zegt: De tijd is niet gekomen, de tijd dat het huis van de HEERE gebouwd moet worden.", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "1 Sam 25:6": "en u zult zo zeggen tegen die welvarende man: Vrede zij u, en uw huis zij vrede, en alles wat u hebt, zij vrede!", "Ruth 3:7": "Toen Boaz nu gegeten en gedronken had, en zijn hart vrolijk was, kwam hij om neer te liggen aan het uiterste van een korenhoop. Daarna kwam zij stilletjes binnen, en sloeg zijn voetdeksel open, en ging liggen.", "Hebr 13:2": "Vergeet de herbergzaamheid niet; want hierdoor hebben sommigen zonder het te weten engelen geherbergd.", "Gen 18:5": "En ik zal een stuk brood halen, dat U Uw hart sterkt; daarna kunt U verdergaan, want daarom bent U immers naar Uw knecht gekomen. En zij zeiden: Doe zoals u gesproken hebt.", "Richt 20:6": "Toen greep ik mijn bijvrouw, en deelde haar in stukken, en zond haar in het hele land van de erfenis van Israël, omdat zij een schandelijke daad en dwaasheid in Israël gedaan hadden.", "2 Kon 12:13": "Toch werden er voor het huis van de HEERE geen zilveren schalen, gaffelen, sprenkelschalen, trompetten, of enig gouden of zilveren voorwerp gemaakt, van het geld dat naar het huis van de HEERE gebracht werd.", "2 Kon 16:18": "Daarbij haalde hij het overdekte gedeelte van de sabbat, dat zij in het huis gebouwd hadden, en de buitenste ingang van de koning weg van het huis van de HEERE, vanwege de koning van Assyrië.", "Jer 51:51": "U zou kunnen zeggen: Wij zijn beschaamd geworden, want wij hebben smaad gehoord, schaamte heeft ons gezicht bedekt; omdat vreemden over de heiligdommen van het huis van de HEERE gekomen zijn;", "Gen 32:17": "En hij gebood de eerste: Wanneer Ezau, mijn broer, u tegenkomt en u vraagt: Van wie bent u? En waar gaat u heen? En van wie zijn deze dieren voor u?", "2 Sam 3:7": "Saul had een bijvrouw gehad, met de naam Rizpa, dochter van Aja; en Isboseth zei tegen Abner: Waarom bent u naar mijn vaders bijvrouw gegaan?", "Rom 1:24": "Daarom heeft God hen ook overgegeven in de begeerten van hun harten tot onreinheid, om hun lichamen onder elkaar te onteren;", "Gen 34:2": "Sichem nu, de zoon van Hemor de Heviet, de landvorst, zag haar, en hij nam haar, en lag bij haar, en verkrachtte haar.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Gen 50:21": "Nu dan, vreest niet! Ik zal u en uw kleine kinderen onderhouden. Zo troostte hij hen, en sprak naar hun hart.", "Hoogl 6:8": "Er zijn zestig koninginnen en tachtig bijvrouwen, en meisjes zonder aantal.", "Deut 21:22": "Verder, wanneer iemand een zonde heeft begaan die de doodstraf verdient, zodat hij gedood wordt, en u hem aan het hout hebt opgehangen;", "2 Kron 29:15": "En zij verzamelden hun broeders, en heiligden zich, en kwamen, volgens het gebod van de koning, door de woorden van de HEERE, om het huis van de HEERE te reinigen.", "Joz 9:12": "Dit brood van ons hebben wij warm als reisproviand uit onze huizen meegenomen, op de dag dat wij vertrokken om naar u te reizen; maar zie, nu is het droog, en het is beschimmeld;", "1 Sam 14:27-29": "Maar Jonathan had het niet gehoord, toen zijn vader het volk bezworen had, en hij stak het uiteinde van de staf die in zijn hand was uit, en doopte die in een honigraat; en toen hij zijn hand naar zijn mond bracht, werden zijn ogen weer helder. Toen antwoordde iemand uit het volk en zei: Uw vader heeft het volk streng bezworen en gezegd: Vervloekt is de man die vandaag brood eet! Daarom bezwijkt het volk. Toen zei Jonathan: Mijn vader heeft het land in moeilijkheden gebracht; kijk toch hoe helder mijn ogen zijn geworden, omdat ik een beetje van deze honing geproefd heb.", "Ex 40:31": "En Mozes en Aäron en zijn zonen wasten daaruit hun handen en hun voeten.", "Joh 13:14": "Als Ik dan, de Heere en de Meester, uw voeten gewassen heb, dan bent u ook verplicht, elkaars voeten te wassen.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Gen 21:14": "Toen stond Abraham 's morgens vroeg op, en nam brood en een fles water, en gaf ze aan Hagar, die hij op haar schouder legde; ook gaf hij haar het kind, en stuurde haar weg. En zij ging op weg, en dwaalde rond in de woestijn Berseba.", "Richt 15:1": "En het gebeurde na enige dagen, in de dagen van de tarweoogst, dat Simson zijn vrouw bezocht met een geitenbokje, en hij zei: Laat mij bij mijn vrouw ingaan, in de kamer; maar haar vader liet hem niet toe naar binnen te gaan.", "Deut 23:17": "Er zal geen hoer zijn onder de dochters van Israël; en er zal geen schandjongen zijn onder de zonen van Israël.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Joz 18:26": "En Mizpe, en Chefira, en Moza,", "1 Kron 23:4": "Uit dezen waren er vierentwintigduizend om het werk van het huis van de HEERE aan te sturen; en zesduizend opzichters en rechters;", "1 Tess 4:12": "Opdat u eerlijk wandelt bij hen die buiten zijn, en niets nodig hebt.", "Gen 25:6": "Maar aan de zonen van de bijvrouwen die Abraham had, gaf Abraham geschenken; en zond hen weg van zijn zoon Izak, terwijl hij nog leefde, oostwaarts naar het land van het Oosten.", "Ezech 44:4": "Daarna bracht hij mij de weg van de noorderpoort, voor het huis; en ik zag, en zie, de heerlijkheid van de HEERE had het huis van de HEERE vervuld; toen viel ik op mijn aangezicht.", "1 Sam 30:12": "Zij gaven hem ook een stuk van een klomp vijgen, en twee stukken rozijnen; en hij at, en zijn geest kwam weer in hem terug; want hij had drie dagen en drie nachten geen brood gegeten, en geen water gedronken.", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "Ps 116:19": "in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "1 Sam 17:12": "David nu was de zoon van de Efrathitische man uit Bethlehem-Juda, wiens naam Isaï was, en die acht zonen had, en in de dagen van Saul was hij een man, oud, hoogbejaard onder de mannen.", "Deut 13:13": "Er zijn mannen, kinderen van Belial, uit uw midden uitgegaan, en hebben de inwoners van hun stad aangedreven, en gezegd: Laat ons gaan, en andere goden dienen, die u niet gekend hebt;", "Pred 10:16": "Wee u, land, waarvan de koning een kind is, en waarvan de vorsten al in de morgenstond eten!", "Joh 13:15": "Want Ik heb u een voorbeeld gegeven, opdat u, zoals Ik u gedaan heb, ook zult doen.", "Joz 9:11": "Daarom spraken tot ons onze oudsten, en al de inwoners van ons land, en zeiden: Neemt reiskost met u in uw handen op de reis, en gaat hun tegemoet, en zegt tegen hen: Wij zijn uw knechten, sluit dan nu een verbond met ons.", "1 Sam 11:8": "En hij telde hen in Bezek; en van de kinderen van Israël waren er driehonderdduizend, en van de mannen van Juda dertigduizend.", "Gen 16:8": "En hij zei: Hagar, dienstmaagd van Sarai, waar komt u vandaan, en waar zult u heengaan? En zij zei: Ik vlucht van het aangezicht van mijn meesteres Sarai!", "Hos 9:9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "Hos 10:9": "Sinds de dagen van Gibea hebt u gezondigd, o Israël; daar zijn zij blijven staan; de strijd te Gibea tegen de kinderen van de verkeerdheid zal hen niet inhalen.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Jer 35:2": "Ga naar het huis van de Rechabieten, en spreek met hen, en breng hen in het huis van de HEERE, in een van de kamers, en geef hun wijn te drinken.", "Gen 19:6": "Toen ging Lot naar buiten naar hen toe, bij de deur, en hij sloot de deur achter zich toe;", "Rom 12:13": "Deel mee in de behoeften van de heiligen. Streef naar gastvrijheid.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "2 Sam 20:3": "Toen nu David in zijn huis te Jeruzalem kwam, nam de koning de tien vrouwen, zijn bijvrouwen, die hij achtergelaten had om het huis te bewaken, en bracht ze in een huis van bewaring, en onderhield ze, maar ging niet bij hen naar binnen. En zij bleven opgesloten tot de dag van hun dood, levend als weduwen.", "2 Kon 12:16": "Het geld van het schuldoffer en het geld van de zondoffers werd niet naar het huis van de HEERE gebracht; het was voor de priesters.", "Pred 10:17": "Gelukkig bent u, land, waarvan de koning een zoon van edelen is, en waarvan de vorsten op de juiste tijd eten, tot sterkte en niet tot drinkerij.", "Gen 34:7": "En de zonen van Jakob kwamen van het veld toen zij dit hoorden; en het deed deze mannen verdriet, en zij ontstaken in grote woede, omdat hij dwaasheid in Israël gedaan had door bij Jakobs dochter te liggen, wat zo niet gedaan had mogen worden.", "1 Kor 1:3": "Genade zij u en vrede van God onze Vader, en van de Heere Jezus Christus.", "1 Kon 3:1": "En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.", "2 Kon 11:18": "Daarna ging al het volk van het land naar het huis van Baäl en brak dat af; zijn altaren en zijn beelden verbraken zij helemaal; en Mattan, de priester van Baäl, sloegen zij dood voor de altaren. De priester stelde toen ambtsdragers aan over het huis van de HEERE.", "Est 2:14": "'s Avonds ging zij daarin, en 's morgens ging zij weer terug naar het tweede huis van de vrouwen, onder de hand van Saasgaz, de kamerling van de koning, bewaarder van de bijvrouwen; zij kwam niet meer bij de koning, behalve als de koning lust naar haar had, en zij bij naam geroepen werd.", "Dan 5:3": "Toen bracht men de gouden vaten, die men uit de tempel van het huis van God, die te Jeruzalem geweest was, weggevoerd had; en de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen dronken daaruit.", "Rom 3:8": "En zeggen wij niet liever (zoals wij belasterd worden, en zoals sommigen zeggen dat wij zeggen): Laat ons het kwade doen, opdat het goede daaruit komt? Hun veroordeling is rechtvaardig.", "2 Sam 12:20": "Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "Ex 2:20": "En hij zei tegen zijn dochters: Waar is hij dan? Waarom hebt u de man daar gelaten? Roep hem, dat hij brood eet.", "Ps 122:1": "Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar het huis van de HEERE gaan.", "Richt 20:35": "Toen sloeg de HEERE Benjamin voor Israëls aangezicht; zodat de kinderen van Israël op die dag van Benjamin vijfentwintigduizend en honderd man velden; die allen trokken het zwaard uit.", "2 Kron 33:15": "En hij nam de vreemde goden en die gelijkenis weg uit het huis van de HEERE, alsook alle altaren die hij gebouwd had op de berg van het huis van de HEERE, en te Jeruzalem; en hij wierp ze buiten de stad.", "2 Kron 26:21": "Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land.", "Jer 29:26": "De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.", "Jes 2:2": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien.", "Openb 11:10": "En zij die op de aarde wonen, die zullen zich verblijden over hen, en zullen vreugde bedrijven, en zullen elkaar geschenken zenden; omdat deze twee profeten hen die op de aarde wonen, gepijnigd hadden.", "1 Kon 7:40": "Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:", "Joh 4:34": "Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.", "2 Kon 11:15": "Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.", "Joh 8:4": "En zij zetten haar in het midden, en zeiden tegen Hem: Meester, deze vrouw is op heterdaad betrapt, terwijl zij overspel pleegde.", "1 Sam 11:7": "En hij nam een paar runderen en hakte ze in stukken, en stuurde die door de hand van de boden naar alle grensgebieden van Israël, en zei: Wie niet zelf uittrekt achter Saul en achter Samuël aan, met zijn runderen zal hetzelfde gedaan worden. Toen viel de vreze van de HEERE op het volk, en zij gingen uit als één man.", "1 Kon 10:5": "en het voedsel van zijn tafel, en het zitten van zijn knechten, en het staan van zijn dienaren, en hun kleding, en zijn schenkers, en zijn opgang waarlangs hij naar boven ging in het huis van de HEERE, toen was er in haar geen geest meer.", "Richt 19:25-28": "Maar de mannen wilden niet naar hem luisteren. Toen greep de man zijn bijvrouw, en bracht haar naar buiten naar hen toe; en zij bekenden haar, en waren de hele nacht tot aan de morgen met haar bezig, en lieten haar gaan toen de dageraad aanbrak. En deze vrouw kwam tegen het aanbreken van de morgenstond, en viel neer voor de deur van het huis van de man, waar haar heer was, totdat het licht werd. Toen nu haar heer 's morgens opstond en de deuren van het huis opende, en naar buiten ging om zijn weg te gaan, zie, zo lag de vrouw, zijn bijvrouw, aan de deur van het huis, met haar handen op de drempel.", "1 Sam 1:3": "Deze man ging elk jaar op uit zijn stad om te aanbidden en om te offeren aan de HEERE van de heerscharen te Silo; en daar waren priesters van de HEERE, Hofni en Pinehas, de twee zonen van Eli.", "Richt 9:27": "En zij trokken het veld in en oogstten hun wijngaarden af, en persten de druiven, en hielden een oogstfeest; en zij gingen het huis van hun god binnen, en aten en dronken, en vervloekten Abimelech.", "Joz 24:33": "Ook stierf Eleazar, de zoon van Aäron; en zij begroeven hem op de heuvel van Pinehas, zijn zoon, die hem gegeven was op het gebergte van Efraïm.", "2 Kon 11:3": "En hij was met haar verborgen in het huis van de HEERE, zes jaar; en Athalia regeerde over het land.", "Ps 134:1": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!", "Hand 9:19": "En toen hij voedsel had genomen, werd hij sterker. En Saulus was enkele dagen bij de discipelen die in Damaskus waren.", "Richt 19:1-4": "Het gebeurde ook in die dagen, toen er geen koning in Israël was, dat er een Levitisch man was, die als vreemdeling verkeerde aan de zijden van het gebergte van Efraïm, die zich een vrouw, een bijvrouw, nam van Bethlehem-Juda. Maar zijn bijvrouw pleegde ontucht tegen hem, en ging bij hem weg naar het huis van haar vader, naar Bethlehem-Juda; en zij was daar enige dagen, namelijk vier maanden. En haar man maakte zich op, en trok haar achterna, om vriendelijk tegen haar te spreken, om haar terug te halen; en zijn knecht was bij hem, en een paar ezels. En zij bracht hem in het huis van haar vader. En toen de vader van de jonge vrouw hem zag, werd hij blij dat hij hem ontmoette.", "Richt 21:25": "In die dagen was er geen koning in Israël; ieder deed wat recht was in zijn eigen ogen.", "Luk 9:12": "En de dag begon te dalen; en de twaalf kwamen naar Hem toe en zeiden tegen Hem: Stuur de menigte weg, zodat zij naar de omliggende dorpen en gehuchten kunnen gaan om onderdak te vinden en voedsel, want hier zijn wij op een eenzame plaats.", "Spr 14:23": "In alle smartelijke arbeid is winst; maar het woord van de lippen leidt alleen tot gebrek.", "Gen 18:4": "Laat er toch een beetje water gebracht worden, en was Uw voeten, en rust onder deze boom.", "Richt 1:21": "Doch de Benjaminieten hebben de Jebusieten, die in Jeruzalem woonden, niet verdreven; maar de Jebusieten woonden met de Benjaminieten in Jeruzalem, tot op deze dag.", "Lev 18:22": "Bij een man zult u niet liggen zoals bij een vrouw; dit is een gruwel.", "Gen 19:8": "Zie toch, ik heb twee dochters, die nog met geen man gemeenschap gehad hebben; ik zal ze nu naar buiten brengen, naar u toe, en doe met hen zoals het goed is in uw ogen; alleen, doe deze mannen niets; want daarom zijn zij onder de bescherming van mijn dak gekomen.", "Num 32:20-22": "Toen zei Mozes tegen hen: Als u deze zaak doen zult, als u zich voor het aangezicht van de HEERE toerust ten strijde, en ieder van u die toegerust is, over de Jordaan trekt voor het aangezicht van de HEERE, totdat Hij Zijn vijanden voor Zijn aangezicht uit de bezitting verdreven heeft, en het land voor het aangezicht van de HEERE onderworpen is, dan zult u daarna terugkeren en onschuldig zijn voor de HEERE en voor Israël, en dit land zal u ter bezitting zijn voor het aangezicht van de HEERE.", "1 Sam 25:25": "Laat mijn heer toch zijn hart niet richten op deze Belials man, op Nabal; want zoals zijn naam is, zo is hij; zijn naam is Nabal, en dwaasheid is bij hem; en ik, uw dienstmaagd, heb de jongemannen van mijn heer niet gezien, die u gezonden hebt.", "Gal 6:1": "Broeders, als een mens door een misdaad vervallen is, moet u, die geestelijk bent, hem die zo is terechtbrengen met een geest van zachtmoedigheid; en let daarbij op uzelf, zodat ook u niet in verzoeking komt.", "1 Sam 1:16": "Beschouw uw dienstmaagd toch niet als een dochter van Belial; want ik heb tot nu toe gesproken uit de veelheid van mijn gedachten en van mijn verdriet.", "Gen 18:2-8": "En hij hief zijn ogen op en keek; en zie, daar stonden drie mannen tegenover hem; toen hij hen zag, liep hij hun tegemoet vanuit de deur van de tent, en boog zich tot op de grond. En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga toch niet aan Uw knecht voorbij. Laat er toch een beetje water gebracht worden, en was Uw voeten, en rust onder deze boom.", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Jer 38:14": "Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij.", "Jak 2:15": "Als er nu een broeder of zuster naakt zouden zijn, en gebrek zouden hebben aan dagelijks voedsel;", "Deut 22:21": "Dan zullen zij deze jonge dochter naar de deur van haar vaders huis brengen, en de mannen van haar stad zullen haar met stenen stenigen, zodat zij sterft, omdat zij een dwaasheid in Israël gedaan heeft door in haars vaders huis te hoereren; zo zult u het kwaad uit uw midden wegdoen.", "Gen 19:2": "En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten.", "Joz 18:1": "En de hele gemeenschap van de kinderen van Israël verzamelde zich te Silo, en zij richtten daar de tent van de samenkomst op, nadat het land aan hen onderworpen was.", "Ex 30:19": "Zodat Aäron en zijn zonen zich daarmee kunnen wassen, hun handen en voeten.", "1 Kon 14:24": "Er waren ook schandjongens in het land; zij deden naar al de gruwelen van de heidenvolken, die de HEERE van voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.", "Matt 1:19": "Jozef nu, haar man, wilde haar, omdat hij rechtvaardig was en haar niet in het openbaar te schande wilde maken, in stilte verlaten.", "Ps 26:9": "Raap mijn ziel niet weg met de zondaars, en mijn leven niet met de mannen van het bloed;", "1 Kon 22:47": "Ook verwijderde hij uit het land de overige schandjongens, die in de dagen van zijn vader Asa overgebleven waren.", "Est 1:10": "Op de zevende dag, toen het hart van de koning vrolijk was van de wijn, zei hij tegen Mehuman, Biztha, Charbona, Bigtha en Abagtha, Zethar en Charchas, de zeven kamerlingen die dienden voor het aangezicht van de koning Ahasveros,", "Openb 11:13": "En op datzelfde uur gebeurde er een grote aardbeving, en het tiende deel van de stad viel, en er werden in de aardbeving zevenduizend namen van mensen gedood, en de overigen werden zeer bevreesd, en gaven de God van de hemel heerlijkheid.", "Richt 17:7": "Nu was er een jongeman uit Bethlehem-Juda, van het geslacht van Juda; deze was een Leviet, en verbleef daar als vreemdeling.", "Ps 128:2": "Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan.", "Joh 13:4": "stond op van het avondmaal en legde Zijn kleren af, en nam een linnen doek en omgordde Zichzelf.", "Richt 20:5": "En de burgers van Gibea maakten zich tegen mij op, en omringden het huis in de nacht om mij heen; zij waren van plan mij te doden, en mijn bijvrouw hebben zij verkracht, zodat zij gestorven is.", "2 Kor 6:15": "En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige?", "Luk 12:19": "en ik zal tegen mijn ziel zeggen: Ziel, je hebt veel goederen liggen, voor vele jaren; neem rust, eet, drink, wees vrolijk.", "2 Kron 34:15": "En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.", "Spr 11:14": "Als er geen wijs beleid is, valt het volk; maar de behoudenis is in de veelheid van raadslieden.", "Richt 19:3-5": "En haar man maakte zich op, en trok haar achterna, om vriendelijk tegen haar te spreken, om haar terug te halen; en zijn knecht was bij hem, en een paar ezels. En zij bracht hem in het huis van haar vader. En toen de vader van de jonge vrouw hem zag, werd hij blij dat hij hem ontmoette. En zijn schoonvader, de vader van de jonge vrouw, hield hem tegen, zodat hij drie dagen bij hem bleef; en zij aten en dronken, en overnachtten daar. Op de vierde dag nu gebeurde het, dat zij 's morgens vroeg op waren, en hij opstond om weg te trekken; toen zei de vader van de jonge dochter tegen zijn schoonzoon: Sterk uw hart met een stukje brood, en daarna zult u weggaan.", "2 Kon 20:8": "Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?", "Joz 18:28": "En Zela, Elef en Jebusi (dat is Jeruzalem), Gibath, Kirjath: veertien steden alsook de bijbehorende dorpen. Dit is het erfdeel van de kinderen van Benjamin, naar hun huisgezinnen.", "Gen 43:24": "Daarna bracht de man deze mannen in het huis van Jozef, en hij gaf water; en zij wasten hun voeten; hij gaf ook aan hun ezels voer.", "Spr 20:18": "Elke gedachte wordt door raad bevestigd, voer daarom oorlog met wijze raadslagen.", "2 Kon 11:19": "En hij nam de leiders van honderd, en de hoofdmannen, en de lijfwacht, en al het volk van het land; en zij brachten de koning af uit het huis van de HEERE, en kwamen door de weg van de poort van de lijfwacht naar het huis van de koning, en hij zat op de troon der koningen.", "Spr 24:27": "Regel uw werk daarbuiten, en maak het voor u gereed op de akker, en bouw daarna uw huis.", "Richt 20:1-48": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa. En de leiders van heel het volk stelden zich op, alle stammen van Israël, in de vergadering van het volk van God, vierhonderdduizend man te voet, die het zwaard uittrokken. (De kinderen van Benjamin nu hoorden dat de kinderen van Israël opgetrokken waren naar Mizpa.) En de kinderen van Israël zeiden: Vertel ons, hoe is dit kwaad gebeurd?", "Ps 104:23": "De mens gaat dan uit tot zijn werk, en naar zijn arbeid tot de avond toe.", "1 Kon 18:29": "En het gebeurde, toen de middag voorbij was, dat zij profeteerden totdat men het spijsoffer zou offeren; maar er was geen stem, en geen die antwoordde, en geen die er acht op sloeg.", "1 Tim 5:10": "Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd."}, "noten": {"1": "SV: bekennen. D.i.: gemeenschap met haar/hem hebben."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">Het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">gebeurde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1992\">ook</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1992\">in</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1992\">die</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3117\">dagen</span>, toen <span class=\"wl\" data-l=\"L4\" data-code=\"H369\">er</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H369\">geen</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4428\">in</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3478\">Israël</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3478\">was</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H3881\">dat</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3881\">er</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H38
