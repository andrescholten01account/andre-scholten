Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het gebeurde ook in die dagen, toen er geen koning in Israël was, dat er een Levitisch man was, die als vreemdeling verkeerde aan de zijden van het gebergte van Efraïm, die zich een vrouw, een bijvrouw, nam van Bethlehem-Juda.","2":"Maar zijn bijvrouw pleegde ontucht tegen hem, en ging bij hem weg naar het huis van haar vader, naar Bethlehem-Juda; en zij was daar enige dagen, namelijk vier maanden.","3":"En haar man maakte zich op, en trok haar achterna, om vriendelijk tegen haar te spreken, om haar terug te halen; en zijn knecht was bij hem, en een paar ezels. En zij bracht hem in het huis van haar vader. En toen de vader van de jonge vrouw hem zag, werd hij blij dat hij hem ontmoette.","4":"En zijn schoonvader, de vader van de jonge vrouw, hield hem tegen, zodat hij drie dagen bij hem bleef; en zij aten en dronken, en overnachtten daar.","5":"Op de vierde dag nu gebeurde het, dat zij 's morgens vroeg op waren, en hij opstond om weg te trekken; toen zei de vader van de jonge dochter tegen zijn schoonzoon: Sterk uw hart met een stukje brood, en daarna zult u weggaan.","6":"Zo gingen zij zitten, en zij beiden aten samen, en dronken. Toen zei de vader van de jonge vrouw tegen de man: Blijf toch, en overnacht, en laat uw hart vrolijk zijn.","7":"Maar de man stond op, om weg te trekken. Toen drong zijn schoonvader er bij hem op aan, dat hij daar weer overnachtte.","8":"Toen hij op de vijfde dag 's morgens vroeg op was, om weg te trekken, zei de vader van de jonge vrouw: Sterk toch uw hart. En zij bleven, totdat de dag zich neigde; en zij beiden aten samen.","9":"Toen maakte de man zich op, om weg te trekken, hij, en zijn bijvrouw, en zijn knecht; en zijn schoonvader, de vader van de jonge vrouw, zei: Zie toch, de dag is afgenomen, het wordt avond, overnacht toch; zie, de dag loopt ten einde, overnacht hier, en laat uw hart vrolijk zijn, en maak u morgen vroeg op voor uw reis, en ga naar uw tent.","10":"Doch de man wilde niet overnachten, maar stond op, en trok weg, en kwam tot tegenover Jebus (dat is Jeruzalem), met hem het paar gezadelde ezels; ook was zijn bijvrouw bij hem.","11":"Toen zij nu bij Jebus waren, was de dag ver gedaald; en de knecht zei tegen zijn heer: Kom toch, laten we naar deze stad van de Jebusieten gaan, en daarin overnachten.","12":"Maar zijn heer zei tegen hem: Wij zullen hierheen niet afwijken naar een vreemde stad, die niet van de kinderen van Israël is; maar wij zullen doortrekken tot aan Gibea.","13":"Verder zei hij tegen zijn knecht: Kom, laten wij naderen tot een van die plaatsen, en overnachten in Gibea of in Rama.","14":"Zo trokken zij verder, en gingen hun weg; en de zon ging voor hen onder bij Gibea, dat aan Benjamin toebehoort;","15":"En zij weken daarheen af, om daar in te gaan en in Gibea te overnachten. Toen hij nu naar binnen ging, ging hij zitten op een plein van de stad, want er was niemand die hen in huis nam om te overnachten.","16":"En zie, een oude man kwam 's avonds van zijn werk uit het veld, welke man ook van het gebergte van Efraïm was, maar als vreemdeling verkeerde in Gibea; de mensen van die plaats waren echter kinderen van Jemini.","17":"Toen hij nu zijn ogen opsloeg, zag hij die reizende man op het plein van de stad; en de oude man zei: Waar gaat u heen, en waar komt u vandaan?","18":"En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.","19":"Terwijl toch onze ezels zowel stro als voer hebben, en ook brood en wijn is er voor mij, en voor uw dienstmaagd, en voor de knecht die bij uw dienaren is; er is aan geen ding gebrek.","20":"Toen zei de oude man: Vrede zij u! Al wat u ontbreekt, is toch voor mijn rekening; alleen overnacht niet op het plein.","21":"En hij bracht hem in zijn huis, en gaf voer aan de ezels; en nadat zij hun voeten gewassen hadden, aten en dronken zij.","22":"Toen zij nu hun hart vrolijk maakten, zie, omringden de mannen van die stad (mannen, die kinderen van Belial waren) het huis, en klopten op de deur; en zij spraken tegen de oude man, de heer van het huis, en zeiden: Breng de man die in uw huis gekomen is naar buiten, zodat wij hem *bekennen*[1].","23":"En de man, de heer van het huis, ging naar hen toe naar buiten, en zei tegen hen: Nee, mijn broeders, doe toch zo'n kwaad niet; omdat deze man in mijn huis gekomen is, doe zo'n dwaasheid niet.","24":"Zie, mijn dochter die maagd is, en zijn bijvrouw, die zal ik nu naar buiten brengen, opdat u hen schendt, en met hen doet wat goed is in uw ogen; maar doe aan deze man zo'n dwaze zaak niet.","25":"Maar de mannen wilden niet naar hem luisteren. Toen greep de man zijn bijvrouw, en bracht haar naar buiten naar hen toe; en zij *bekenden*[1] haar, en waren de hele nacht tot aan de morgen met haar bezig, en lieten haar gaan toen de dageraad aanbrak.","26":"En deze vrouw kwam tegen het aanbreken van de morgenstond, en viel neer voor de deur van het huis van de man, waar haar heer was, totdat het licht werd.","27":"Toen nu haar heer 's morgens opstond en de deuren van het huis opende, en naar buiten ging om zijn weg te gaan, zie, zo lag de vrouw, zijn bijvrouw, aan de deur van het huis, met haar handen op de drempel.","28":"En hij zei tegen haar: Sta op, laten wij gaan; maar niemand antwoordde. Toen nam hij haar op de ezel, en de man maakte zich op, en trok naar zijn plaats.","29":"Toen hij nu in zijn huis kwam, nam hij een mes, en greep zijn bijvrouw, en verdeelde haar met haar botten in twaalf stukken; en hij zond ze naar alle gebieden van Israël.","30":"En het gebeurde, dat ieder die het zag, zei: Zoiets is niet gebeurd of gezien, vanaf de dag dat de kinderen van Israël uit het land Egypte zijn opgetrokken, tot op deze dag; overweeg het, beraadslaag, en spreek uw gedachten uit!"},"SV":{"1":"Het geschiedde ook in die dagen, als er geen koning was in Israël, dat er een Levietisch man was, verkerende als vreemdeling aan de zijden van het gebergte van Efraïm, die zich een vrouw, een bijwijf, nam van Bethlehem-juda.","2":"Maar zijn bijwijf hoereerde, bij hem zijnde, en toog van hem weg naar haars vaders huis, tot Bethlehem-juda; en zij was aldaar enige dagen, *te* *weten* vier maanden.","3":"En haar man maakte zich op, en toog haar na, om naar haar hart te spreken, om haar weder te halen; en zijn jongen was bij hem, en een paar ezels. En zij bracht hem in het huis haars vaders. En als de vader van de jonge vrouw hem zag, werd hij vrolijk over zijn ontmoeting.","4":"En zijn schoonvader, de vader van de jonge vrouw, behield hem, dat hij drie dagen bij hem bleef; en zij aten en dronken, en vernachtten aldaar.","5":"Op den vierden dag nu geschiedde het, dat zij des morgens vroeg op waren, en hij opstond om weg te trekken; toen zeide de vader van de jonge dochter tot zijn schoonzoon: Sterk uw hart met een bete broods, en daarna zult gijlieden wegtrekken.","6":"Zo zaten zij neder, en zij beiden aten te zamen, en dronken. Toen zeide de vader van de jonge vrouw tot den man: Bewillig toch en vernacht, en laat uw hart vrolijk zijn.","7":"Maar de man stond op, om weg te trekken. Toen drong hem zijn schoonvader, dat hij aldaar wederom vernachtte.","8":"Als hij op den vijfden dag des morgens vroeg op was, om weg te trekken, zo zeide de vader van de jonge vrouw: Sterk toch uw hart. En zij vertoefden, totdat de dag zich neigde; en zij beiden aten *te* *zamen*.","9":"Toen maakte zich de man op, om weg te trekken, hij, en zijn bijwijf, en zijn jongen; en zijn schoonvader, de vader van de jonge vrouw, zeide: Zie toch, de dag heeft afgenomen, dat het avond zal worden, vernacht toch; zie, de dag legert zich, vernacht hier, en laat uw hart vrolijk zijn, en maak u morgen vroeg op uws weegs, en ga naar uw tent.","10":"Doch de man wilde niet vernachten, maar stond op, en trok weg, en kwam tot tegenover Jebus ( dewelke is Jeruzalem), en met hem het paar gezadelde ezelen; ook was zijn bijwijf met hem.","11":"Als zij nu bij Jebus waren, zo was de dag zeer gedaald; en de jongen zeide tot zijn heer: Trek toch voort, en laat ons in deze stad der Jebusieten wijken, en daarin vernachten.","12":"Maar zijn heer zeide tot hem: Wij zullen herwaarts niet wijken tot een vreemde stad, die niet is van de kinderen Israëls; maar wij zullen voorttrekken tot Gibea toe.","13":"Voorts zeide hij tot zijn jongen: Ga voort, dat wij tot een van die plaatsen naderen, en te Gibea of te Rama vernachten.","14":"Alzo togen zij voort, en wandelden; en de zon ging hun onder bij Gibea, dewelke Benjamins is;","15":"En zij weken daarheen, dat zij inkwamen, om in Gibea te vernachten. Toen hij nu inkwam, zat hij neder in een straat der stad, want er was niemand, die hen in huis nam, om te vernachten.","16":"En ziet, een oud man kwam van zijn werk van het veld in den avond, welke man ook was van het gebergte van Efraïm, doch als vreemdeling verkeerde te Gibea; maar de lieden dezer plaats waren kinderen van Jemini.","17":"Als hij nu zijn ogen ophief, zo zag hij dien reizenden man op de straat der stad; en de oude man zeide: Waar trekt gij henen, en van waar komt gij?","18":"En hij zeide tot hem: Wij trekken door van Bethlehem-juda tot aan de zijden van het gebergte van Efraïm, van waar ik ben; en ik was naar Bethlehem-juda getogen, maar ik trek *nu* naar het huis des HEEREN; en er is niemand, die mij in huis neemt.","19":"Daar toch onze ezelen zowel stro als voeder hebben, en ook brood en wijn is voor mij, en voor uw dienstmaagd, en voor den jongen, *die* bij uw knechten is; er is aan geen ding gebrek.","20":"Toen zeide de oude man: Vrede zij u! al wat u ontbreekt, is toch bij mij; alleenlijk vernacht niet op de straat.","21":"En hij bracht hem in zijn huis, en gaf aan de ezelen voeder; en hun voeten gewassen hebbende, zo aten en dronken zij.","22":"Toen zij nu hun hart vrolijk maakten, ziet, zo omringden de mannen van die stad ( mannen, die Belials kinderen waren) het huis, kloppende op de deur; en zij spraken tot den ouden man, den heer des huizes, zeggende: Breng den man, die in uw huis gekomen is, uit, opdat wij hem bekennen.","23":"En de man, de heer des huizes, ging tot hen uit, en zeide tot hen: Niet, mijn broeders, doet toch *zo* kwalijk niet; naardien deze man in mijn huis gekomen is, zo doet zulke dwaasheid niet.","24":"Ziet, mijn dochter die maagd is, en zijn bijwijf, die zal ik nu uitbrengen, dat gij die schendt, en haar doet, wat goed is in uw ogen; maar doet aan dezen man zulk een dwaas ding niet.","25":"Maar de mannen wilden naar hem niet horen. Toen greep de man zijn bijwijf, en bracht haar uit tot hen daarbuiten; en zij bekenden haar, en waren met haar bezig den ganse nacht tot aan den morgen, en lieten haar gaan, als de dageraad oprees.","26":"En deze vrouw kwam tegen het aanbreken van den morgenstond, en viel neder voor de deur van het huis des mans, waarin haar heer was, totdat het licht werd.","27":"Als nu haar heer des morgens opstond en de deuren van het huis opendeed, en uitging om zijns weegs te gaan, ziet, zo lag de vrouw, zijn bijwijf, aan de deur van het huis, en haar handen op den dorpel.","28":"En hij zeide tot haar: Sta op, en laat ons trekken; maar niemand antwoordde. Toen nam hij haar op den ezel, en de man maakte zich op, en toog naar zijn plaats.","29":"Als hij nu in zijn huis kwam, zo nam hij een mes, en greep zijn bijwijf, en deelde haar met haar beenderen in twaalf stukken; en hij zond ze in alle landpalen van Israël.","30":"En het geschiedde, dat al wie het zag, zeide: Zulks is niet geschied noch gezien, van dien dag af, dat de kinderen Israëls uit Egypteland zijn opgetogen, tot op dezen dag; legt uw *hart* daarop en spreekt!"},"KJV":{"1":"And it came to pass in those days, when *there was* no king in Israel, that there was a certain Levite sojourning on the side of mount Ephraim, who took to him a concubine out of Bethlehemjudah.","2":"And his concubine played the whore against him, and went away from him unto her father's house to Bethlehemjudah, and was there four whole months.","3":"And her husband arose, and went after her, to speak friendly unto her, *and* to bring her again, having his servant with him, and a couple of asses: and she brought him into her father's house: and when the father of the damsel saw him, he rejoiced to meet","4":"And his father in law, the damsel's father, retained him; and he abode with him three days: so they did eat and drink, and lodged","5":"And it came to pass on the fourth day, when they arose early in the morning, that he rose up to depart: and the damsel's father said unto his son in law, Comfort thine heart with a morsel of bread, and afterward go your way.","6":"And they sat down, and did eat and drink both of them together: for the damsel's father had said unto the man, Be content, I pray thee, and tarry all night, and let thine heart be merry.","7":"And when the man rose up to depart, his father in law urged him: therefore he lodged there again.","8":"And he arose early in the morning on the fifth day to depart: and the damsel's father said, Comfort thine heart, I pray thee. And they tarried until afternoon, and they did eat both","9":"And when the man rose up to depart, he, and his concubine, and his servant, his father in law, the damsel's father, said unto him, Behold, now the day draweth toward evening, I pray you tarry all night: behold, the day groweth to an end, lodge here, that thine heart may be merry; and to morrow get you early on your way, that thou mayest go home.","10":"But the man would not tarry that night, but he rose up and departed, and came over against Jebus, which *is* Jerusalem; and *there were* with him two asses saddled, his concubine","11":"*And* when they *were* by Jebus, the day was far spent; and the servant said unto his master, Come, I pray thee, and let us turn in into this city of the Jebusites, and lodge","12":"And his master said unto him, We will not turn aside hither into the city of a stranger, that *is* not of the children of Israel; we will pass over to Gibeah.","13":"And he said unto his servant, Come, and let us draw near to one of these places to lodge all night, in Gibeah, or in Ramah.","14":"And they passed on and went their way; and the sun went down upon them *when they were* by Gibeah, which *belongeth* to Benjamin.","15":"And they turned aside thither, to go in *and* to lodge in Gibeah: and when he went in, he sat him down in a street of the city: for *there was* no man that took them into his house to lodging.","16":"And, behold, there came an old man from his work out of the field at even, which *was* also of mount Ephraim; and he sojourned in Gibeah: but the men of the place *were* Benjamites.","17":"And when he had lifted up his eyes, he saw a wayfaring man in the street of the city: and the old man said, Whither goest thou? and whence comest","18":"And he said unto him, We *are* passing from Bethlehemjudah toward the side of mount Ephraim; from thence *am* I: and I went to Bethlehemjudah, but I *am now* going to the house of the LORD; and there *is* no man that receiveth me to house.","19":"Yet there is both straw and provender for our asses; and there is bread and wine also for me, and for thy handmaid, and for the young man *which is* with thy servants: *there is* no want of any thing.","20":"And the old man said, Peace *be* with thee; howsoever *let* all thy wants *lie* upon me; only lodge not in the street.","21":"So he brought him into his house, and gave provender unto the asses: and they washed their feet, and did eat and drink.","22":"*Now* as they were making their hearts merry, behold, the men of the city, certain sons of Belial, beset the house round about, *and* beat at the door, and spake to the master of the house, the old man, saying, Bring forth the man that came into thine house, that we may know","23":"And the man, the master of the house, went out unto them, and said unto them, Nay, my brethren, *nay*, I pray you, do not *so* wickedly; seeing that this man is come into mine house, do not this folly.","24":"Behold, *here is* my daughter a maiden, and his concubine; them I will bring out now, and humble ye them, and do with them what seemeth good unto you: but unto this man do not so vile a thing.","25":"But the men would not hearken to him: so the man took his concubine, and brought her forth unto them; and they knew her, and abused her all the night until the morning: and when the day began to spring, they let her go.","26":"Then came the woman in the dawning of the day, and fell down at the door of the man's house where her lord *was*, till it was light.","27":"And her lord rose up in the morning, and opened the doors of the house, and went out to go his way: and, behold, the woman his concu  <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehemjudah.</span>","2":"And his <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine</span> played the <span class=\"wl wl-kjv\" data-code=\"H2181\">whore</span> against him, and went <span class=\"wl wl-kjv\" data-code=\"H3212\">away</span> from him unto her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehemjudah,</span> and was there <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> whole <span class=\"wl wl-kjv\" data-code=\"H2320\">months.</span>","3":"And her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> her, to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">friendly</span> unto her, and to bring her <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> having his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> with him, and a <span class=\"wl wl-kjv\" data-code=\"H6776\">couple</span> of <span class=\"wl wl-kjv\" data-code=\"H2543\">asses:</span> and she <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him into her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and when the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him, he <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced</span> to meet","4":"And his father in <span class=\"wl wl-kjv\" data-code=\"H2859\">law,</span> the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">retained</span> him; and he <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> with him <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> so they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and lodged","5":"And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> when they arose <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> that he rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">depart:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his son in <span class=\"wl wl-kjv\" data-code=\"H2860\">law,</span> <span class=\"wl wl-kjv\" data-code=\"H5582\">Comfort</span> thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> with a <span class=\"wl wl-kjv\" data-code=\"H6595\">morsel</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> go your way.","6":"And they sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down,</span> and did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> of them <span class=\"wl wl-kjv\" data-code=\"H3162\">together:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> Be <span class=\"wl wl-kjv\" data-code=\"H2974\">content,</span> I pray thee, and tarry all <span class=\"wl wl-kjv\" data-code=\"H3885\">night,</span> and let thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> be merry.","7":"And when the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">depart,</span> his father in <span class=\"wl wl-kjv\" data-code=\"H2859\">law</span> <span class=\"wl wl-kjv\" data-code=\"H6484\">urged</span> him: therefore he <span class=\"wl wl-kjv\" data-code=\"H3885\">lodged</span> there again.","8":"And he arose <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> on the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">depart:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5582\">Comfort</span> thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> I pray thee. And they <span class=\"wl wl-kjv\" data-code=\"H4102\">tarried</span> until <span class=\"wl wl-kjv\" data-code=\"H3117\">afternoon,</span> and they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> both","9":"And when the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">depart,</span> he, and his <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> his father in <span class=\"wl wl-kjv\" data-code=\"H2859\">law,</span> the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Behold, now the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H7503\">draweth</span> toward <span class=\"wl wl-kjv\" data-code=\"H6150\">evening,</span> I pray you tarry all <span class=\"wl wl-kjv\" data-code=\"H3885\">night:</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> groweth to an <span class=\"wl wl-kjv\" data-code=\"H2583\">end,</span> <span class=\"wl wl-kjv\" data-code=\"H3885\">lodge</span> here, that thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> may be <span class=\"wl wl-kjv\" data-code=\"H3190\">merry;</span> and to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> get you <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> on your <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> home.","10":"But the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not tarry that <span class=\"wl wl-kjv\" data-code=\"H3885\">night,</span> but he rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> over <span class=\"wl wl-kjv\" data-code=\"H5227\">against</span> <span class=\"wl wl-kjv\" data-code=\"H2982\">Jebus,</span> which is <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> and there were with him <span class=\"wl wl-kjv\" data-code=\"H6776\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2543\">asses</span> <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled,</span> his concubine","11":"And when they were by <span class=\"wl wl-kjv\" data-code=\"H2982\">Jebus,</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">far</span> <span class=\"wl wl-kjv\" data-code=\"H7286\">spent;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> I pray thee, and let us turn <span class=\"wl wl-kjv\" data-code=\"H5493\">in</span> into this <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of the <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusites,</span> and lodge","12":"And his <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, We will not turn <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> hither into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of a <span class=\"wl wl-kjv\" data-code=\"H5237\">stranger,</span> that is not of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> we will pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> to Gibeah.","13":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and let us draw <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of these <span class=\"wl wl-kjv\" data-code=\"H4725\">places</span> to lodge all <span class=\"wl wl-kjv\" data-code=\"H3885\">night,</span> in <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah,</span> or in Ramah.","14":"And they passed <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> and went their <span class=\"wl wl-kjv\" data-code=\"H3212\">way;</span> and the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">down</span> upon them when they were <span class=\"wl wl-kjv\" data-code=\"H681\">by</span> <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah,</span> which belongeth to Benjamin.","15":"And they turned <span class=\"wl wl-kjv\" data-code=\"H5493\">aside</span> thither, to go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> and to <span class=\"wl wl-kjv\" data-code=\"H3885\">lodge</span> in <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah:</span> and when he went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> he sat him <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> in a <span class=\"wl wl-kjv\" data-code=\"H7339\">street</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> for there was no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H622\">took</span> them into his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to lodging.","16":"And, behold, there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> an <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> from his <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> out of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> at <span class=\"wl wl-kjv\" data-code=\"H6153\">even,</span> which was <span class=\"wl wl-kjv\" data-code=\"H376\">also</span> of <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim;</span> and he <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourned</span> in <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah:</span> but the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> were Benjamites.","17":"And when he had lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> a <span class=\"wl wl-kjv\" data-code=\"H732\">wayfaring</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in the <span class=\"wl wl-kjv\" data-code=\"H7339\">street</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Whither <span class=\"wl wl-kjv\" data-code=\"H3212\">goest</span> thou? and <span class=\"wl wl-kjv\" data-code=\"H370\">whence</span> comest","18":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, We are <span class=\"wl wl-kjv\" data-code=\"H5674\">passing</span> from <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehemjudah</span> toward the <span class=\"wl wl-kjv\" data-code=\"H3411\">side</span> of <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim;</span> from thence am I: and I <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehemjudah,</span> but I am now <span class=\"wl wl-kjv\" data-code=\"H1980\">going</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and there is no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H622\">receiveth</span> me to house.","19":"Yet there <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> both <span class=\"wl wl-kjv\" data-code=\"H8401\">straw</span> and <span class=\"wl wl-kjv\" data-code=\"H4554\">provender</span> for our <span class=\"wl wl-kjv\" data-code=\"H2543\">asses;</span> and there is <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> also for me, and for thy const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],

).join('');

function paneelInhoud(n, tab) {

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
