dus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Maar de Israëlieten gingen door met doen wat kwaad was in de ogen van de HEERE, nadat Ehud gestorven was.","2":"Zo verkocht de HEERE hen in de hand van Jabin, koning van de Kanaänieten, die te Hazor regeerde; en zijn legeraanvoerder was Sisera; hij woonde in Haroseth der heidenen.","3":"Toen riepen de Israëlieten tot de HEERE; want hij had negenhonderd ijzeren wagens, en hij had de Israëlieten met geweld onderdrukt, twintig jaar.","4":"Debora nu, een vrouw die een profetes was, de vrouw van Lappidoth, zij richtte in die tijd Israël.","5":"En zij woonde onder de palmboom van Debora, tussen Rama en Beth-el, op het gebergte van Efraïm; en de Israëlieten gingen naar haar toe voor de rechtspraak.","6":"En zij zond heen en riep Barak, de zoon van Abinoam, van Kedes-nafthali; en zij zei tegen hem: Heeft de HEERE, de God van Israël, niet geboden: Ga heen en trek op naar de berg Thabor, en neem met u tienduizend man, van de kinderen van Nafthali en van de kinderen van Zebulon?","7":"En Ik zal aan de beek Kison tot u trekken Sisera, de legeraanvoerder van Jabin, met zijn wagens en zijn menigte; en Ik zal hem in uw hand geven?","8":"Toen zei Barak tegen haar: Als u met mij mee zult trekken, zal ik heen trekken; maar als u niet met mij mee zult trekken, zal ik niet trekken.","9":"En zij zei: Ik zal zeker met u meetrekken, maar de eer zal niet voor u zijn op deze weg die u gaat; want de HEERE zal Sisera verkopen in de hand van een vrouw. Zo maakte Debora zich op, en trok met Barak naar Kedes.","10":"Toen riep Barak Zebulon en Nafthali bijeen te Kedes, en hij trok op, te voet, *met* tienduizend man; ook trok Debora met hem op.","11":"Heber nu, de Keniet, had zich afgezonderd van Kaïn, uit de kinderen van Hobab, Mozes' schoonvader; en hij had zijn tenten opgeslagen tot aan de eik in Zaanaim, die bij Kedes is.","12":"Toen berichtten zij aan Sisera dat Barak, de zoon van Abinoam, naar de berg Thabor getrokken was.","13":"Zo riep Sisera al zijn wagens bijeen, negenhonderd ijzeren wagens, en al het volk dat met hem was, van Haroseth der heidenen tot de beek Kison.","14":"Debora dan zei tegen Barak: Maak u op; want dit is de dag waarop de HEERE Sisera in uw hand gegeven heeft; is de HEERE niet voor u uit getrokken? Zo trok Barak van de berg Thabor af, en tienduizend man achter hem.","15":"En de HEERE versloeg Sisera, met al *zijn* wagens, en het hele leger, door de scherpte van het zwaard, voor Barak; zodat Sisera van de wagen afklom, en te voet vluchtte.","16":"En Barak achtervolgde hen, achter de wagens en achter het leger, tot aan Haroseth der heidenen. En het hele leger van Sisera viel door de scherpte van het zwaard, zodat er niemand overbleef.","17":"Maar Sisera vluchtte te voet naar de tent van Jaël, de vrouw van Heber, de Keniet; want er was vrede tussen Jabin, de koning van Hazor, en het huis van Heber, de Keniet.","18":"Jaël nu ging naar buiten, Sisera tegemoet, en zei tegen hem: Kom binnen, mijn heer, kom bij mij binnen, wees niet bang! En hij kwam bij haar binnen in de tent, en zij bedekte hem met een deken.","19":"Daarna zei hij tegen haar: Geef mij toch een beetje water te drinken, want ik heb dorst. Toen opende zij een melkfles, en gaf hem te drinken, en dekte hem toe.","20":"Ook zei hij tegen haar: Sta in de deuropening van de tent; en als er iemand komt en u vraagt: Is hier iemand? dan moet u zeggen: Niemand.","21":"Daarna nam Jaël, de vrouw van Heber, een tentpin, en greep een hamer in haar hand, en ging stilletjes naar hem toe, en dreef de pin in zijn slaap, zodat hij in de aarde vastzat; want hij was in diepe slaap en uitgeput, en stierf.","22":"En zie, Barak achtervolgde Sisera; en Jaël ging naar buiten hem tegemoet, en zei tegen hem: Kom, en ik zal u de man wijzen die u zoekt. Zo kwam hij bij haar binnen, en zie, Sisera lag dood, en de pin was in zijn slaap.","23":"Zo heeft God op die dag Jabin, de koning van Kanaän, onderworpen, voor de ogen van de Israëlieten.","24":"En de hand van de Israëlieten ging steeds voort, en werd zwaarder over Jabin, de koning van Kanaän, totdat zij Jabin, de koning van Kanaän, uitgeroeid hadden."},"SV":{"1":"Maar de kinderen Israëls voeren voort te doen, dat kwaad was in de ogen des HEEREN, als Ehud gestorven was.","2":"Zo verkocht hen de HEERE in de hand van Jabin, koning der Kanaänieten, die te Hazor regeerde; en zijn krijgsoverste was Sisera; dezelve nu woonde in Haroseth der heidenen.","3":"Toen riepen de kinderen Israëls tot den HEERE; want hij had negenhonderd ijzeren wagenen, en hij had de kinderen Israëls met geweld onderdrukt, twintig jaren.","4":"Debora nu, een vrouw, die een profetesse was, de huisvrouw van Lappidoth, deze richtte te dier tijd Israël.","5":"En zij woonde onder den palmboom van Debora, tussen Rama en tussen Beth-el, op het gebergte van Efraïm; en de kinderen Israëls gingen op tot haar ten gerichte.","6":"En zij zond heen en riep Barak, den zoon van Abinoam, van Kedes-nafthali; en zij zeide tot hem: Heeft de HEERE, de God Israëls, niet geboden: Ga heen en trek op den berg Thabor, en neem met u tien duizend man, van de kinderen van Nafthali, en van de kinderen van Zebulon?","7":"En Ik zal aan de beek Kison tot u trekken Sisera, den krijgsoverste van Jabin, met zijn wagenen en zijn menigte; en Ik zal hem in uw hand geven?","8":"Toen zeide Barak tot haar: Indien gij met mij trekken zult, zo zal ik heen trekken; maar indien gij niet met mij zult trekken, zo zal ik niet trekken.","9":"En zij zeide: Ik zal zekerlijk met u trekken, behalve dat de eer de uwe niet zal zijn op dezen weg, dien gij wandelt; want de HEERE zal Sisera verkopen in de hand ener vrouw. Alzo maakte Debora zich op, en toog met Barak naar Kedes.","10":"Toen riep Barak Zebulon en Nafthali bijeen te Kedes, en hij toog op, op zijn voeten, *met* tien duizend man; ook toog Debora met hem op.","11":"Heber nu, de Keniet, had zich afgezonderd van Kaïn, uit de kinderen van Hobab, Mozes’ schoonvader; en hij had zijn tenten opgeslagen tot aan den eik in Zaanaim, die bij Kedes is.","12":"Toen boodschapten zij Sisera, dat Barak, de zoon van Abinoam, op den berg Thabor getogen was.","13":"Zo riep Sisera al zijn wagenen bijeen, negenhonderd ijzeren wagenen, en al het volk, dat met hem was, van Haroseth der heidenen tot de beek Kison.","14":"Debora dan zeide tot Barak: Maak u op; want dit is de dag, in welken de HEERE Sisera in uw hand gegeven heeft; is de HEERE niet voor uw aangezicht henen uitgetogen? Zo trok Barak van den berg Thabor af, en tien duizend man achter hem.","15":"En de HEERE versloeg Sisera, met al *zijn* wagenen, en het ganse heirleger, door de scherpte des zwaards, voor het aangezicht van Barak; dat Sisera van den wagen afklom, en vluchtte op zijn voeten.","16":"En Barak jaagde ze na, achter de wagenen en achter het heirleger, tot aan Haroseth der heidenen. En het ganse heirleger van Sisera viel door de scherpte des zwaards, dat er niet overbleef tot een toe.","17":"Maar Sisera vluchtte op zijn voeten naar de tent van Jaël, de huisvrouw van Heber, den Keniet; want er was vrede tussen Jabin, den koning van Hazor, en tussen het huis van Heber, den Keniet.","18":"Jaël nu ging uit, Sisera tegemoet, en zeide tot hem: Wijk in, mijn heer, wijk in tot mij, vrees niet! En hij week tot haar in de tent, en zij bedekte hem met een deken.","19":"Daarna zeide hij tot haar: Geef mij toch een weinig waters te drinken, want mij dorst. Toen opende zij een melkfles, en gaf hem te drinken, en dekte hem toe.","20":"Ook zeide hij tot haar: Sta in de deur der tent; en het zij, zo iemand zal komen, en u vragen, en zeggen: Is hier iemand? dat gij zegt: Niemand.","21":"Daarna nam Jaël, de huisvrouw van Heber, een nagel der tent, en greep een hamer in haar hand, en ging stilletjes tot hem in, en dreef den nagel in den slaap zijns hoofds, dat hij in de aarde vast werd; hij nu was met een diepen slaap bevangen en vermoeid, en stierf.","22":"En ziet, Barak vervolgde Sisera; en Jaël ging uit hem tegemoet, en zeide tot hem: Kom, en ik zal u den man wijzen, dien gij zoekt. Zo kwam hij tot haar in, en ziet, Sisera lag dood, en de nagel was in den slaap zijns hoofds.","23":"Alzo heeft God te dien dage Jabin, den koning van Kanaän, te ondergebracht, voor het aangezicht der kinderen Israëls.","24":"En de hand der kinderen Israëls ging steeds voort, en werd hard over Jabin, den koning van Kanaän, totdat zij Jabin, den koning van Kanaän, hadden uitgeroeid."},"KJV":{"1":"And the children of Israel again did evil in the sight of the LORD, when Ehud was dead.","2":"And the LORD sold them into the hand of Jabin king of Canaan, that reigned in Hazor; the captain of whose host *was* Sisera, which dwelt in Harosheth of the Gentiles.","3":"And the children of Israel cried unto the LORD: for he had nine hundred chariots of iron; and twenty years he mightily oppressed the children of Israel.","4":"And Deborah, a prophetess, the wife of Lapidoth, she judged Israel at that time.","5":"And she dwelt under the palm tree of Deborah between Ramah and Bethel in mount Ephraim: and the children of Israel came up to her for judgment.","6":"And she sent and called Barak the son of Abinoam out of Kedeshnaphtali, and said unto him, Hath not the LORD God of Israel commanded, *saying*, Go and draw toward mount Tabor, and take with thee ten thousand men of the children of Naphtali and of the children of Zebulun?","7":"And I will draw unto thee to the river Kishon Sisera, the captain of Jabin's army, with his chariots and his multitude; and I will deliver him into thine hand.","8":"And Barak said unto her, If thou wilt go with me, then I will go: but if thou wilt not go with me, *then* I will not go.","9":"And she said, I will surely go with thee: notwithstanding the journey that thou takest shall not be for thine honour; for the LORD shall sell Sisera into the hand of a woman. And Deborah arose, and went with Barak to Kedesh.","10":"And Barak called Zebulun and Naphtali to Kedesh; and he went up with ten thousand men at his feet: and Deborah went up","11":"Now Heber the Kenite, *which was* of the children of Hobab the father in law of Moses, had severed himself from the Kenites, and pitched his tent unto the plain of Zaanaim, which *is* by Kedesh.","12":"And they shewed Sisera that Barak the son of Abinoam was gone up to mount Tabor.","13":"And Sisera gathered together all his chariots, *even* nine hundred chariots of iron, and all the people that *were* with him, from Harosheth of the Gentiles unto the river of Kishon.","14":"And Deborah said unto Barak, Up; for this *is* the day in which the LORD hath delivered Sisera into thine hand: is not the LORD gone out before thee? So Barak went down from mount Tabor, and ten thousand men after","15":"And the LORD discomfited Sisera, and all *his* chariots, and all *his* host, with the edge of the sword before Barak; so that Sisera lighted down off *his* chariot, and fled away on his feet.","16":"But Barak pursued after the chariots, and after the host, unto Harosheth of the Gentiles: and all the host of Sisera fell upon the edge of the sword; *and* there was not a man left.","17":"Howbeit Sisera fled away on his feet to the tent of Jael the wife of Heber the Kenite: for *there was* peace between Jabin the king of Hazor and the house of Heber the Kenite.","18":"And Jael went out to meet Sisera, and said unto him, Turn in, my lord, turn in to me; fear not. And when he had turned in unto her into the tent, she covered him with a mantle.","19":"And he said unto her, Give me, I pray thee, a little water to drink; for I am thirsty. And she opened a bottle of milk, and gave him drink, and covered","20":"Again he said unto her, Stand in the door of the tent, and it shall be, when any man doth come and enquire of thee, and say, Is there any man here? that thou shalt say,","21":"Then Jael Heber's wife took a nail of the tent, and took an hammer in her hand, and went softly unto him, and smote the nail into his temples, and fastened it into the ground: for he was fast asleep and weary. So he died.","22":"And, behold, as Barak pursued Sisera, Jael came out to meet him, and said unto him, Come, and I will shew thee the man whom thou seekest. And when he came into her *tent*, behold, Sisera lay dead, and the nail *was* in his temples.","23":"So God subdued on that day Jabin the king of Canaan before the children of Israel.","24":"And the hand of the children of Israel prospered, and prevailed against Jabin the king of Canaan, until they had destroyed Jabin king of Canaan."}},"tsk":{"1":[{"kopje":"deden ... kwaad","refs":["Richt 2:11","Richt 2:19","Richt 2:20","Richt 3:7","Richt 3:12","Richt 6:1","Richt 10:6","Lev 26:23-25","Neh 9:23-30","Ps 106:43-45","Jer 5:3"]}],"2":[{"kopje":"verkocht","refs":["Richt 2:14","Richt 2:15","Richt 10:7","Jes 50:1","Matt 18:25"]},{"kopje":"Ha \">Deborah</span> between <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah</span> and <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to her for judgment.","6":"And she <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H1301\">Barak</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H42\">Abinoam</span> out of <span class=\"wl wl-kjv\" data-code=\"H6943\">Kedeshnaphtali,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Hath not the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded,</span> saying, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and <span class=\"wl wl-kjv\" data-code=\"H4900\">draw</span> toward <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H8396\">Tabor,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> with thee <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Zebulun?","7":"And I will <span class=\"wl wl-kjv\" data-code=\"H4900\">draw</span> unto thee to the <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> <span class=\"wl wl-kjv\" data-code=\"H7028\">Kishon</span> <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera,</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of <span class=\"wl wl-kjv\" data-code=\"H2985\">Jabin's</span> <span class=\"wl wl-kjv\" data-code=\"H6635\">army,</span> with his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> and his <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> him into thine hand.","8":"And <span class=\"wl wl-kjv\" data-code=\"H1301\">Barak</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, If thou wilt <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with me, then I will <span class=\"wl wl-kjv\" data-code=\"H1980\">go:</span> but if thou wilt not <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with me, then I will not go.","9":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H1980\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thee: <span class=\"wl wl-kjv\" data-code=\"H657\">notwithstanding</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">journey</span> that thou <span class=\"wl wl-kjv\" data-code=\"H1980\">takest</span> shall not be for thine <span class=\"wl wl-kjv\" data-code=\"H8597\">honour;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of a <span class=\"wl wl-kjv\" data-code=\"H802\">woman.</span> And <span class=\"wl wl-kjv\" data-code=\"H1683\">Deborah</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with <span class=\"wl wl-kjv\" data-code=\"H1301\">Barak</span> to Kedesh.","10":"And <span class=\"wl wl-kjv\" data-code=\"H1301\">Barak</span> <span class=\"wl wl-kjv\" data-code=\"H2199\">called</span> <span class=\"wl wl-kjv\" data-code=\"H2074\">Zebulun</span> and <span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali</span> to <span class=\"wl wl-kjv\" data-code=\"H6943\">Kedesh;</span> and he went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> with <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> at his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet:</span> and <span class=\"wl wl-kjv\" data-code=\"H1683\">Deborah</span> went up","11":"Now <span class=\"wl wl-kjv\" data-code=\"H2268\">Heber</span> the <span class=\"wl wl-kjv\" data-code=\"H7017\">Kenite,</span> which was of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H2246\">Hobab</span> the father in <span class=\"wl wl-kjv\" data-code=\"H2859\">law</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> had <span class=\"wl wl-kjv\" data-code=\"H6504\">severed</span> himself from the <span class=\"wl wl-kjv\" data-code=\"H7017\">Kenites,</span> and <span class=\"wl wl-kjv\" data-code=\"H5186\">pitched</span> his <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> unto the <span class=\"wl wl-kjv\" data-code=\"H436\">plain</span> of <span class=\"wl wl-kjv\" data-code=\"H6815\">Zaanaim,</span> which is by Kedesh.","12":"And they <span class=\"wl wl-kjv\" data-code=\"H5046\">shewed</span> <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera</span> that <span class=\"wl wl-kjv\" data-code=\"H1301\">Barak</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H42\">Abinoam</span> was gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Tabor.","13":"And <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera</span> gathered <span class=\"wl wl-kjv\" data-code=\"H2199\">together</span> all his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> even <span class=\"wl wl-kjv\" data-code=\"H8672\">nine</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him, from <span class=\"wl wl-kjv\" data-code=\"H2800\">Harosheth</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> of Kishon.","14":"And <span class=\"wl wl-kjv\" data-code=\"H1683\">Deborah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1301\">Barak,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Up;</span> for this is the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera</span> into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> is not the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> gone <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee? So <span class=\"wl wl-kjv\" data-code=\"H1301\">Barak</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H8396\">Tabor,</span> and <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> after","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2000\">discomfited</span> <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H4264\">host,</span> with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H1301\">Barak;</span> so that <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera</span> lighted <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> off his <span class=\"wl wl-kjv\" data-code=\"H4818\">chariot,</span> and fled <span class=\"wl wl-kjv\" data-code=\"H5127\">away</span> on his feet.","16":"But <span class=\"wl wl-kjv\" data-code=\"H1301\">Barak</span> <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and after the <span class=\"wl wl-kjv\" data-code=\"H4264\">host,</span> unto <span class=\"wl wl-kjv\" data-code=\"H2800\">Harosheth</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles:</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> and there was not a <span class=\"wl wl-kjv\" data-code=\"H259\">man</span> left.","17":"Howbeit <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera</span> fled <span class=\"wl wl-kjv\" data-code=\"H5127\">away</span> on his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> to the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> of <span class=\"wl wl-kjv\" data-code=\"H3278\">Jael</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H2268\">Heber</span> the <span class=\"wl wl-kjv\" data-code=\"H7017\">Kenite:</span> for there was <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> between <span class=\"wl wl-kjv\" data-code=\"H2985\">Jabin</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2674\">Hazor</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H2268\">Heber</span> the Kenite.","18":"And <span class=\"wl wl-kjv\" data-code=\"H3278\">Jael</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Turn <span class=\"wl wl-kjv\" data-code=\"H5493\">in,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> turn <span class=\"wl wl-kjv\" data-code=\"H5493\">in</span> to me; <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> not. And when he had turned <span class=\"wl wl-kjv\" data-code=\"H5493\">in</span> unto her into the <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> she <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> him with a mantle.","19":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Give me, I pray thee, a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> to <span class=\"wl wl-kjv\" data-code=\"H8248\">drink;</span> for I am <span class=\"wl wl-kjv\" data-code=\"H6770\">thirsty.</span> And she <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> a <span class=\"wl wl-kjv\" data-code=\"H4997\">bottle</span> of <span class=\"wl wl-kjv\" data-code=\"H2461\">milk,</span> and gave him <span class=\"wl wl-kjv\" data-code=\"H8248\">drink,</span> and covered","20":"Again he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Stand <span class=\"wl wl-kjv\" data-code=\"H5975\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and it shall be, when any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> doth <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H7592\">enquire</span> of thee, and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Is <span class=\"wl wl-kjv\" data-code=\"H3426\">there</span> any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3426\">here?</span> that thou shalt say,","21":"Then <span class=\"wl wl-kjv\" data-code=\"H3278\">Jael</span> <span class=\"wl wl-kjv\" data-code=\"H2268\">Heber's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H3489\">nail</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">took</span> an <span class=\"wl wl-kjv\" data-code=\"H4718\">hammer</span> in her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> <span class=\"wl wl-kjv\" data-code=\"H3814\">softly</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H8628\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H3489\">nail</span> into his <span class=\"wl wl-kjv\" data-code=\"H7541\">temples,</span> and <span class=\"wl wl-kjv\" data-code=\"H6795\">fastened</span> it into the <span class=\"wl wl-kjv\" data-code=\"H776\">ground:</span> for he was fast <span class=\"wl wl-kjv\" data-code=\"H7290\">asleep</span> and <span class=\"wl wl-kjv\" data-code=\"H5774\">weary.</span> So he died.","22":"And, behold, as <span class=\"wl wl-kjv\" data-code=\"H1301\">Barak</span> <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera,</span> <span class=\"wl wl-kjv\" data-code=\"H3278\">Jael</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H7200\">shew</span> thee the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> whom thou <span class=\"wl wl-kjv\" data-code=\"H1245\">seekest.</span> And when he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into her tent, behold, <span class=\"wl wl-kjv\" data-code=\"H5516\">Sisera</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">lay</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3489\">nail</span> was in his temples.","23":"So <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H3665\">subdued</span> on that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H2985\">Jabin</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","24":"And the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">prospered,</span> and < ":"Een stad in Nafthali, Jos 19:32, Jos 19:37. Geordineerd tot een vrijstad, Jos 20:7; mede den Levieten gegeven, Jos 21:32; zie ook 2Ki 15:29. Zij was gelegen op een berg tussen de wateren van Merom en de zee Gennesareth. Een ander Kedes was er in Issaschar, 1Ch 6:72."},{"catchword":"Heeft de HEERE,","tekst":"Alsof zij zeide: Immers, of zekerlijk heeft Hij het u geboden. Zulk een manier van vragen bevestigt zekerlijk hetgeen vraaggewijs gezegd wordt; alzo onder, vs.14, en Jdg 6:14, enz."},{"catchword":"trek op den berg","tekst":"Versta: trek tot u, dat is, vergader tot u, breng tezamen, doe tot u komen; gebruikende daartoe de redenen, die ik u nu heb bekendgemaakt, en de hulp der oversten onder de stammen; vergelijk onder, Jdg 5:14. Waartegen God in vs.7 zegt: Ik zal Sisera tot u trekken"},{"catchword":"Thabor,","tekst":"Gelegen in den stam Zebulon, naar het westen, bij de beek Kison; zie Psa 89:13; 1Sa 10:3; Jer 46:18; Hos 5:1."}],"7":[{"catchword":"trekken Sisera,","tekst":"Dat is, Ik zal door mijn goddelijke kracht en regering hem aldaar tot u doen komen. De beek of rivier Kison liep uit de zee Gennesareth naar het westen bij den berg Karmel in de Middellandse zee, zijnde als een scheiding tussen Issaschar en Zebulon."}],"9":[{"catchword":"zal zekerlijk met u trekken,","tekst":"Hebreeuws, gaande gaan, of trekkende trekken"},{"catchword":"op dezen weg,","tekst":"Of, op dezen tocht, dien gij doet. Anders, om des wegs wil dien gij gaat; dat is, omdat gij zo zwak van vertrouwen zijt, dat gij zonder mij het gebod des Heeren niet wilt achtervolgen, zo zal ook een vrouw daarvan de eer hebben."},{"catchword":"verkopen","tekst":"Dat is, overleveren. Zie boven, Jdg 2:14."},{"catchword":"vrouw","tekst":"Dit kan men verstaan van Jaël, of ook van Debora zelve."}],"10":[{"catchword":"en hij toog op,","tekst":"Anders, deed tien duizend man nevens zich optrekken. Hebreeuws, met, nevens, of, aan zijn voeten; dat is, die hem volgden, zijn voetstappen natraden. Zie Exo 11:8; 1Ki 20:10."}],"11":[{"catchword":"Heber nu,","tekst":"De man van Jaël, van welken onder, vs.17, enz. Hebreeuws, Cheber."},{"catchword":"Keniet,","tekst":"Zie Num 24:21-22; boven, Jdg 1:16, en de aantekeningen aldaar."},{"catchword":"Kaïn,","tekst":"Dat is, van de Kenieten hebbende hun woonplaats in de woestijn van Juda. Zie boven, Jdg 1:16."},{"catchword":"Hobab,","tekst":"Zie Num 10:29. Anders genaamd Jethro."}],"13":[{"catchword":"riep Sisera al zijn wagenen bijeen,","tekst":"Dat is, hij deed hen door uitroeping bijeenkomen, of, hij ontbood hen."}],"14":[{"catchword":"is de HEERE","tekst":"Zie van zulke vragen boven, vs.6."},{"catchword":"voor uw aangezicht henen uitgetogen?","tekst":"Als de opperste krijgsoverste, om voor u te strijden en u de victorie te beschikken. Zie onder, Jdg 5:20; 2Sa 5:24."}],"15":[{"catchword":"versloeg Sisera,","tekst":"Zie Jdg 5:20."},{"catchword":"scherpte des zwaards,","tekst":"Hebreeuws, door, of, aan den mond des zwaards; alzo in vs.16. Anders, verschrikte, enz., voor de, enz., waarvan de zin zou wezen dat God hen op een bijzondere wijze verbaasd heeft gemaakt, opdat zij zonder tegenstand door der Israëlieten zwaard mochten vallen."}],"16":[{"catchword":"tot een toe","tekst":"Dat is, dat er ook niet een overbleEf. Vergelijk Psa 14:3, en Psa 53:4; Rom 3:12, enz."}],"18":[{"catchword":"deken","tekst":"Of, een ruige, ruwe sprei."}],"20":[{"catchword":"Niemand","tekst":"Of, neen."}],"21":[{"catchword":"Daarna nam Jaël,","tekst":"Deze daad van Jaël wordt van den Geest des Heeren in het volgende [ Jdg 5:23, enz.] hogelijk geroemd, als gedaan zijnde uit een bijzonderen ijver van God ingegeven en op zijn bevel van Debora en Barak gepubliceerd."},{"catchword":"der tent,","tekst":"Dien men gebruikte in het spannen en hechten van de tenten, zijnde van zulk een lengte, dat hij door het hoofd van Sisera kon reiken in de aarde; van gelijke is de hamer naar evenredigheid geweest. Zie onder, Jdg 5:26."},{"catchword":"vast werd;","tekst":"Of, indrong, te weten, de nagel, of zij vestigde [hem] in de aarde."}],"24":[{"catchword":"ging steeds voort,","tekst":"Hebreeuws, ging gaande; dat is, hunlieder macht nam steeds toe, zodat zij Jabin overweldigden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But the children of Israel went on to do that which was evil in the evil in the eyes of the LORD: when Ehud was dead."}],"2":[{"catchword":null,"tekst":"So the LORD sold them [See above chap. 2. on v. 14.] into the hand of Jabin, [see of another Jabin, jos.11. 1.] King of the Canaanites, [hereby is sometimes in general understood all the heathen Nations which dwelt in Canaan, sometimes, as here, a particular Nation amongst them all, which dwelt on the North-borders of Canaan] who reigned at Hazor: [see jos. Chap. 11.ver.10,11. And 19.36. Also jer.49.28.] And his chief Captain was Sisera: the same [viz. Sisera, or, (as some) Jabin] now dwelt at Haroseth, of the Gentiles. [A city situate at the waters of Merom, of which see jos.11.5,7. It may be, that divers remaining Heathenish Nations pitched their habitations here, to be secured under Jabin and Sisera&acirc;&euro;&trade;s power against Israel. Heb. Charoseheth.]"}],"3":[{"catchword":null,"tekst":"Then the children of Israel cried unto the LORD: for he had nine hundred iron charets, and he bad had violently oppressed the children of Israel twenty years."}],"4":[{"catchword":null,"tekst":"Now Debora, a woman, which was a Prophetess, [Heb. a women a Prophetess: so below chap.6.8. a man a Prophet] the wife of Lappidoth, [a man&acirc;&euro;&trade;s name, whereof the Scripture no where else maketh mention: some take Lappidoth for the name of Debora&acirc;&euro;&trade;s birth-place] this (said woman) judged Israel at that time."}],"5":[{"catchword":null,"tekst":"And she dwelt under the Palm-tree of Debora, [So called from Debora] between Bethel, or mount Ephraim, and the children of Israel went up to her for judgment. [To inquite of her (being a Prophetess) the will of the Lord, in things, wherein they knew not how to find out the issue of themselves; or by the ordinary ways of instruction, or Judicature]"}],"6":[{"catchword":null,"tekst":"And she sent forth, and called Barak, the son of Abinoam, from Rodes Naphtali: [A city in the tribe of Naphtali, jos.19.32, 37. Appointed for a city of refuge, jos. 20.7. Also given to the Levites, jos. 21.32. See also 2 King .15.29. It lay upon hill between the waters of Merom, and the sea of Genesareth. There was another Rodes in the tribe of Issachar, 1 Chron.6.72.] And she said him: hath not the LORD the God of Israel command? [As if he said, judged, or certainly he hath commanded thee: such kind of queries strongly confirm that which is spoken by way question. So below v.14. chap.6, 14,&c.] go forth and draw [Understand, draw unto thee, i.e. assemble unto thee, bring together, cause to come unto thee, using for that purpose the reasons and arguments, wherewith I have made thee Acquainted, and the help of the chiefest, or heads of the tribes. Compare below chap. 5. On v.14. As on the contrary, the Lord saith in the following verse, I will draw Sisera unto thee.] On mount Tabor, [lying in the tribe of Zebulon, toward the west, by the brook Kison. See Psal. 89.13. and 1Sam.10.3, 19. Jer. 46.18. Hos. 5.1.] And take with thee ten thousand men, of the children of Naphtali, and of the children of Zebulon."}],"7":[{"catchword":null,"tekst":"And I will draw unto thee at the brook Kison, Sisera, jabins chief Captain, [i.e. I will by my Divine Power and ordering, cause him to meet thee there. The brook or river of Kison, ran out of the sea of Gennesareth, toward the west by Mount Carmel into the midland sea, being as a partition between Issachar and Zebulon] with his charets, and his multitude: and I will give him into thine hand."}],"8":[{"catchword":null,"tekst":"Then said Barak unto her, if thou wilt go with me, I will go forth: but if thou wilt not go with me, then I will not go."}],"9":[{"catchword":null,"tekst":"And she said, I will certainly go with thee, [Heb. going go, or marching march] saving that the honour shall not be thine, on this way which thou walkest: [or, in this expedition which thou makest. Oth. because of the way which thou goest; i.e. because thou art so weak in confidence, that thou without me wilt not follow the command of the Lord, therefore a woman shall go away with the honour thereof] for the LORD shall sell Sisera [i.e. deliver him up. See above chap.2. on ver.14.] Into the hand of a women: [this may be meant of Israel, or also of Debora herself] so Debora arose, and went with Barak to Kedes."}],"10":[{"catchword":null,"tekst":"Then Barak called Zebulon and Naphtali together unto Kedes, and he went up on his feet (with) ten thousand men: [Oth. caused ten thousand men to march up before him: Heb. together with, beside, or at his feet; i.e. which followed him, and trod after his footsteps. See Exo 11:8. & 1 Kings 20.10.] Also Debora went up with him."}],"11":[{"catchword":null,"tekst":"Now Heber [The husband of Jail, of whom below ver.17, etc. Heb. Cheber] the Kenite, [See Num 24:21, 22. and above chap.1.16. and the Annot. there] had severed himself from Kain; [i.e. from the Kenites, which had their dwelling place in the wilderness of Juda. See above chap 1.16.] (of the children of Hobab, [See Num.10. ver.29. Otherwise called Jethro] Moseh his father in law;) and he pitched his tents unto the oak in Zaanaim, which is by Kedes."}],"12":[{"catchword":null,"tekst":"Then they brought word to Sisera, that Barak the son of Abinoam, was gone up to mount Tabor."}],"16":[{"catchword":null,"tekst":"And Barak pursued after them, after the charets, and after the host, unto Haroseth of the gentiles: and all the camp of Sisera fell by the edge of the sword, so that there remained not unto one. [i.e. so that there remained not so much as one; or, there was not one left. Compare Psal.14.3. and 53.3. Rom.2 12, etc.]"}],"17":[{"catchword":null,"tekst":"But Sisera fled on his feet to the tent of Jael the wife of Heber, the Kenite. for there was peace between Jabin in the King of Hazor, and between the house of Heber the Kenites."}],"18":[{"catchword":null,"tekst":"Now Jael went forth to meet Sisera, and said unto him, turn in, my Lord, turn into me, fear not: and he turned to her into the tent, and she covered him with a coverled. [Or, course rough covering spread upon him]"}],"19":[{"catchword":null,"tekst":"Afterward he said unto her, give me (I pray) a little water to drink, for I am thirsty: then she opened a milk-bottle, and gave him to drink, and covered him close."}],"20":[{"catchword":null,"tekst":"Also he said unto her, stand in the door of the tent: and it shall be, if any man shall come, and ask thee, and say, is any man here? that thou shalt say, no man. [Or, No]"}],"21":[{"catchword":null,"tekst":"Then Jael the wife of Heber took a nail of the tent, [Which they used in spreading and fastening their tents, being of such a length, that it could pierce through Sisera&acirc;&euro;&trade;s head to the ground; and so also was the hammer proportioned. See below chap.5.25.] and caught a hammer in her hand, and went softly into him, and drove the nail into his temples, that it stuck fast in the ground, [or, forced it self in, or, she fastened (it) in the ground: this act of Jael is highly commended by the Spirit of God in the following chap.5 23, etc. as being done out of a special zeal infused by God, and as his command published by Debora and Barak] now he was fallen into a deep sleep, and (was) tired, and died."}],"22":[{"catchword":null,"tekst":"And behold, Barak pursued Sisera, and Jael went forth to meet him, come, and I will shew thee the man whom thou sleekest; so he came into her, and behold, Sisera lay dead, and the nail was in his temples."}],"23":[{"catchword":null,"tekst":"So God on that day subdued Jabin, the King of Canaan, before the face of the children of Israel."}],"24":[{"catchword":null, (function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
