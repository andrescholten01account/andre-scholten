xodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Maar de Israëlieten deden wat slecht was in de ogen van de HEERE; daarom gaf de HEERE hen zeven jaar lang in de hand van de Midianieten.","2":"Toen de hand van de Midianieten sterk werd over Israël, maakten de Israëlieten voor zichzelf, vanwege de Midianieten, de holen die in de bergen zijn, en de spelonken, en de vestingen.","3":"Want het gebeurde, als Israël gezaaid had, dan kwamen de Midianieten op, en de Amalekieten, en zij die uit het oosten kwamen, kwamen ook tegen hen op.","4":"En zij legerden zich tegen hen, en vernielden de opbrengst van het land, tot waar u bij Gaza komt; en zij lieten geen middelen van bestaan over in Israël, geen klein vee, geen os, geen ezel.","5":"Want zij kwamen op met hun vee en hun tenten; zij kwamen in zo'n grote menigte als de sprinkhanen, zodat men hen en hun kamelen niet tellen kon; en zij kwamen in het land om het te vernielen.","6":"Zo werd Israël zeer arm vanwege de Midianieten. Toen riepen de Israëlieten tot de HEERE.","7":"En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten,","8":"dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid;","9":"en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;","10":"en Ik zei tegen u: Ik ben de HEERE, uw God; vrees de goden van de Amorieten niet, in wier land u woont; maar u bent Mijn stem niet gehoorzaam geweest.","11":"Toen kwam een Engel van de HEERE, en ging zitten onder de eik die in Ofra is, die aan Joas, de Abiëzriet, toebehoorde; en zijn zoon Gideon dorste tarwe bij de wijnpers, om die te verbergen voor de Midianieten.","12":"Toen verscheen de Engel van de HEERE aan hem, en zei tegen hem: De HEERE is met u, dappere held!","13":"Maar Gideon zei tegen Hem: Och, mijn heer! Als de HEERE met ons is, waarom is ons dan dit alles overkomen? En waar zijn al Zijn wonderen, die onze vaders ons verteld hebben en zeiden: Heeft de HEERE ons niet uit Egypte opgevoerd? Maar nu heeft de HEERE ons verlaten, en heeft ons in de hand van de Midianieten gegeven.","14":"Toen keerde de HEERE Zich tot hem, en zei: Ga heen in deze kracht van u, en u zult Israël uit de hand van de Midianieten verlossen; heb Ik u niet gezonden?","15":"En hij zei tegen Hem: Och, mijn Heere! Waarmee zal ik Israël verlossen? Zie, mijn geslacht is het armste in Manasse, en ik ben de kleinste in mijn vaders huis.","16":"En de HEERE zei tegen hem: Omdat Ik met u zal zijn, zult u de Midianieten verslaan alsof het één man was.","17":"En hij zei tegen Hem: Als ik nu genade gevonden heb in Uw ogen, doe mij dan een teken, dat U het bent Die met mij spreekt.","18":"Ga toch niet vanhier weg, totdat ik tot U kom, en mijn geschenk uitbreng, en het U voorzet. En Hij zei: Ik zal blijven, totdat u terugkomt.","19":"En Gideon ging naar binnen, en maakte een geitenbokje klaar, en ongezuurde *koeken* van een efa[1] meel; het vlees legde hij in een mand, en het vleesnat deed hij in een pot; en hij bracht het naar Hem toe, onder de eik, en zette het neer.","20":"Doch de Engel van God zei tegen hem: Neem het vlees en de ongezuurde *koeken*, en leg ze op die rotssteen, en giet het vleesnat eruit; en hij deed zo.","21":"En de Engel van de HEERE stak het uiteinde van de staf uit, die in Zijn hand was, en raakte het vlees en de ongezuurde *koeken* aan; toen ging er vuur op uit de rots, en verteerde het vlees en de ongezuurde *koeken*. En de Engel van de HEERE verdween uit zijn ogen.","22":"Toen zag Gideon dat het een Engel van de HEERE was; en Gideon zei: Ach, Heere HEERE! Want ik heb een Engel van de HEERE gezien, van aangezicht tot aangezicht.","23":"Doch de HEERE zei tegen hem: Vrede zij u, vrees niet, u zult niet sterven.","24":"Toen bouwde Gideon daar voor de HEERE een altaar, en noemde het: De Heere is vrede! Het staat nog tot op deze dag in Ofra van de Abiëzrieten.","25":"En het gebeurde in diezelfde nacht, dat de HEERE tegen hem zei: Neem de jonge stier van de ossen, die van uw vader zijn, namelijk de tweede stier, van zeven jaar oud; en breek het altaar van Baäl af, dat van uw vader is, en hak het gewijde bos om, dat daarbij is.","26":"En bouw voor de HEERE, uw God, een altaar op de top van deze rots, op een geschikte plaats; en neem de tweede stier, en offer een brandoffer met het hout van het gewijde bos, dat u zult hebben omgehakt.","27":"Toen nam Gideon tien mannen uit zijn knechten, en deed zoals de HEERE tegen hem gesproken had. Doch het gebeurde, omdat hij bang was voor zijn vaders huis en de mannen van die stad om het overdag te doen, dat hij het 's nachts deed.","28":"Toen de mannen van die stad vroeg in de morgen opstonden, zie, daar was het altaar van Baäl omgeworpen, en het gewijde bos dat daarbij was, omgehakt, en die tweede stier was geofferd op het gebouwde altaar.","29":"Toen zeiden zij, de een tegen de ander: Wie heeft dit gedaan? En toen zij onderzochten en navraagden, zei men: Gideon, de zoon van Joas, heeft dit gedaan.","30":"Toen zeiden de mannen van die stad tegen Joas: Breng uw zoon naar buiten, opdat hij sterft, omdat hij het altaar van Baäl heeft omgeworpen, en omdat hij het gewijde bos dat daarbij was, heeft omgehakt.","31":"Maar Joas zei tegen allen die bij hem stonden: Wilt u voor Baäl strijden? Wilt u hem redden? Wie voor hem strijdt, zal nog deze morgen gedood worden! Als hij een god is, laat hij dan voor zichzelf strijden, omdat men zijn altaar heeft omgeworpen.","32":"Daarom noemde hij hem op die dag Jerubbaäl, en zei: Laat Baäl tegen hem strijden, omdat hij zijn altaar heeft omgeworpen.","33":"Alle Midianieten nu, en Amalekieten, en de mensen uit het oosten, waren bijeengebracht, en zij trokken over, en legerden zich in het dal van Jizreël.","34":"Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.","35":"Ook zond hij boden door heel Manasse, en die werden ook achter hem bijeengeroepen; eveneens zond hij boden naar Aser, en naar Zebulon, en naar Naftali; en zij trokken op, hun tegemoet.","36":"En Gideon zei tegen God: Als U Israël door mijn hand zult verlossen, zoals U gesproken hebt,","37":"zie, ik zal een wollen vlies op de dorsvloer leggen; als er dauw op het vlies alleen zal zijn, en droogte op de hele aarde, dan zal ik weten dat U Israël door mijn hand zult verlossen, zoals U gesproken hebt.","38":"En het gebeurde zo; want hij stond de volgende morgen vroeg op, en kneep het vlies uit, en hij wrong de dauw uit het vlies, een schaal vol water.","39":"En Gideon zei tegen God: Laat Uw toorn niet tegen mij ontsteken, dat ik alleen deze ene keer spreek; laat mij toch alleen deze ene keer met het vlies op de proef stellen; laat er toch droogte zijn op het vlies alleen, en op de hele aarde laat er dauw zijn.","40":"En God deed zo in diezelfde nacht; want de droogte was op het vlies alleen, en op de hele aarde was dauw."},"SV":{"1":"Maar de kinderen Israëls deden, dat kwaad was in de ogen des HEEREN; zo gaf hen de HEERE in de hand der Midianieten, zeven jaren.","2":"Als nu de hand der Midianieten sterk werd over Israël, maakten zich de kinderen Israëls, vanwege de Midianieten, de holen, die in de bergen zijn, en de spelonken, en de vestingen.","3":"want het geschiedde, als Israël gezaaid had, zo kwamen de Midianieten op, en de Amalekieten, en die van het oosten kwamen ook op tegen hen.","4":"En zij legerden zich tegen hen, en verdierven de opkomst des lands, tot daar gij komt te Gaza; en zij lieten geen leeftocht overig in Israël, noch klein vee, noch os, noch ezel.","5":"want zij kwamen op met hun vee en hun tenten; zij kwamen gelijk de sprinkhanen in menigte, dat men hen en hun kemelen niet tellen kon; en zij kwamen in het land, om dat te verderven.","6":"Alzo werd Israël zeer verarmd, vanwege de Midianieten. Toen riepen de kinderen Israëls tot den HEERE.","7":"En het geschiedde, als de kinderen Israëls tot den HEERE riepen, ter oorzake van de Midianieten;","8":"Zo zond de HEERE een man, die een profeet was, tot de kinderen Israëls; die zeide tot hen: Alzo zegt de HEERE, de God Israëls: Ik heb u uit Egypte doen opkomen, en u uit het diensthuis uitgevoerd;","9":"En Ik heb u verlost van de hand der Egyptenaren, en van de hand van allen, die u drukten; en Ik heb hen voor uw aangezicht uitgedreven, en u hun land gegeven;","10":"En Ik zeide tot ulieden: Ik ben de HEERE, uw God; vreest de goden der Amorieten niet, in welker land gij woont; maar gij zijt Mijner stem niet gehoorzaam geweest.","11":"Toen kwam een Engel des HEEREN, en zette Zich onder den eik, die te Ofra is, welke aan Joas, den Abi-ezriet, toekwam; en zijn zoon Gideon dorste tarwe bij de pers, om *die* te vluchten voor het aangezicht der Midianieten.","12":"Toen verscheen hem de Engel des HEEREN, en zeide tot hem: De HEERE is met u, gij, strijdbare held!","13":"Maar Gideon zeide tot Hem: Och, mijn Heer! zo de HEERE met ons is, waarom is ons dan dit alles wedervaren? en waar zijn al Zijn wonderen, die onze vaders ons verteld hebben, zeggende: Heeft ons de HEERE niet uit Egypte opgevoerd? Doch nu heeft ons de HEERE verlaten, en heeft ons in der Midianieten hand gegeven.","14":"Toen keerde zich de HEERE tot hem, en zeide: Ga heen in deze uw kracht, en gij zult Israël uit der Midianieten hand verlossen; heb Ik u niet gezonden?","15":"En hij zeide tot Hem: Och, mijn Heer! waarmede zal ik Israël verlossen? Zie, mijn duizend is het armste in Manasse, en ik ben de kleinste in mijns vaders huis.","16":"En de HEERE zeide tot hem: omdat Ik met u zal zijn, zo zult gij de Midianieten slaan, als een enigen man.","17":"En hij zeide tot Hem: Indien ik nu genade gevonden heb in Uw ogen, zo doe mij een teken, dat Gij het zijt, Die met mij spreekt.","18":"Wijk toch niet van hier, totdat ik tot U kome, en mijn geschenk uitbrenge, en U voorzette. En Hij zeide: Ik zal blijven, totdat gij wederkomt.","19":"En Gideon ging in, en bereidde een geitenbokje, en ongezuurde *koeken* van een efa meels; het vlees leide hij in een korf, en het sop deed hij in een pot; en hij bracht het tot Hem uit, tot onder den eik, en zette het neder.","20":"Doch de Engel Gods zeide tot hem: Neem het vlees en de ongezuurde *koeken*, en leg ze op dien rotssteen, en giet het sop uit; en hij deed alzo.","21":"En de Engel des HEEREN stak het uiterste van den staf uit, die in Zijn hand was, en roerde het vlees en de ongezuurde *koeken* aan; toen ging er vuur op uit de rots, en verteerde het vlees en de ongezuurde *koeken*. En de Engel des HEEREN bekwam uit zijn ogen.","22":"Toen zag Gideon, dat het een Engel des HEEREN was; en Gideon zeide: Ach, Heere, HEERE! daarom, omdat ik een Engel des HEEREN gezien heb van aangezicht tot aangezicht.","23":"Doch de HEERE zeide tot hem: Vrede zij u, vrees niet, gij zult niet sterven.","24":"Toen bouwde Gideon aldaar den HEERE een altaar, en noemde het: De Heere is vrede! het is nog tot op dezen dag in Ofra der Abi-ezrieten.","25":"En het geschiedde in dienzelven nacht, dat de HEERE tot hem zeide: Neem een var van de ossen, die van uw vader zijn, te weten, den tweeden var, van zeven jaren; en breek af het altaar van Baäl, dat van uw vader is, en houw af het bos, dat daarbij is.","26":"En bouw den HEERE, uw God, een altaar, op de hoogte dezer sterkte, in een bekwame plaats; en neem den tweeden var, en offer een brandoffer met het hout der hage, die gij zult hebben afgehouwen.","27":"Toen nam Gideon tien mannen uit zijn knechten, en deed, gelijk als de HEERE tot hem gesproken had. Doch het geschiedde, dewijl hij zijns vaders huis en de mannen van die stad vreesde, van het te doen bij dag, dat hij het deed bij nacht.","28":"Als nu de mannen van die stad des morgens vroeg opstonden, ziet, zo was het altaar van Baäl omgeworpen, en de haag, die daarbij was, afgehouwen, en die tweede var was op het gebouwde altaar geofferd.","29":"Zo zeiden zij, de een tot den ander: Wie heeft dit stuk gedaan? En als zij onderzochten en navraagden, zo zeide men: Gideon, de zoon van Joas, heeft dit stuk gedaan.","30":"Toen zeiden de mannen van die stad tot Joas: Breng uw zoon uit, dat hij sterve, omdat hij het altaar van Baäl heeft omgeworpen, en omdat hij de haag, die daarbij was, afgehouwen heeft.","31":"Joas daarentegen zeide tot allen, die bij hem stonden: Zult gij voor den Baäl twisten; zult gij hem verlossen? Die voor hem zal twisten, zal nog dezen morgen gedood worden! Indien hij een god is, hij twiste voor zichzelven, omdat men zijn altaar heeft omgeworpen.","32":"Daarom noemde hij hem te dien dage Jerubbaäl, zeggende: Baäl twiste tegen hem, omdat hij zijn altaar heeft omgeworpen.","33":"Alle Midianieten nu, en Amalekieten, en de kinderen van het oosten, waren samenvergaderd, en zij trokken over, en legerden zich in het dal van Jizreël.","34":"Toen toog de Geest des HEEREN Gideon aan, en hij blies met de bazuin, en de Abi-ezrieten werden achter hem bijeengeroepen.","35":"Ook zond hij boden in gans Manasse, en die werden ook achter hem bijeengeroepen; desgelijks zond hij boden in Aser, en in Zebulon, en in Nafthali; en zij kwamen op, hun tegemoet.","36":"En Gideon zeide tot God: Indien Gij Israël door mijn hand zult verlossen, gelijk als Gij gesproken hebt;","37":"Zie, ik zal een wollen vlies op den vloer leggen; indien er dauw op het vlies alleen zal zijn, en droogte op de ganse aarde, zo zal ik weten, dat Gij Israël door mijn hand zult verlossen, gelijk als Gij gesproken hebt.","38":"En het geschiedde alzo; want hij stond des anderen daags vroeg op, en drukte het vlies uit, en hij wrong den dauw uit het vlies, een schaal vol waters.","39":"En Gideon zeide tot God: Uw toorn ontsteke niet tegen mij, dat ik alleenlijk ditmaal spreke; laat mij toch alleenlijk ditmaal met het vlies verzoeken; er zij toch droogte op het vlies alleen, en op de ganse aarde zij dauw.","40":"En God deed alzo in denzelven nacht; want de droogte was op het vlies alleen, en op de ganse aarde was dauw."},"KJV":{"1":"And the children of Israel did evil in the sight of the LORD: and the LORD delivered them into the hand of Midian seven years.","2":"And the hand of Midian prevailed against Israel: *and* because of the Midianites the children of Israel made them the dens which *are* in the mountains, and caves, and strong holds.","3":"And *so* it was, when Israel had sown, that the Midianites came up, and the Amalekites, and the children of the east, even they came up","4":"And they encamped against them, and destroyed the increase of the earth, till thou come unto Gaza, and left no sustenance for Israel, neither sheep, nor ox, nor ass.","5":"For they came up with their cattle and their tents, and they came as grasshoppers for multitude; *for* both they and their camels were without number: and they entered into the land to destroy","6":"And Israel was greatly impoverished because of the Midianites; and the children of Israel cried unto the LORD.","7":"And it came to pass, when the children of Israel cried unto the LORD because of the Midianites,","8":"That the LORD sent a prophet unto the children of Israel, which said unto them, Thus saith the LORD God of Israel, I brought you up from Egypt, and brought you forth out of the house of bondage;","9":"And I delivered you out of the hand of the Egyptians, and out of the hand of all that oppressed you, and drave them out from before you, and gave you their land;","10":"And I said unto you, I *am* the LORD your God; fear not the gods of the Amorites, in whose land ye dwell: but ye have not obeyed my voice.","11":"And there came an angel of the LORD, and sat under an oak which *was* in Ophrah, that *pertained* unto Joash the Abiezrite: and his son Gideon threshed wheat by the winepress, to hide *it* from the Midianites.","12":"And the angel of the LORD appeared unto him, and said unto him, The LORD *is* with thee, thou mighty man of valour.","13":"And Gideon said unto him, Oh my Lord, if the LORD be with us, why then is all this befallen us? and where *be* all his miracles which our fathers told us of, saying, Did not the LORD bring us up from Egypt? but now the LORD hath forsaken us, and delivered us into the hands of the Midianites.","14":"And the LORD looked upon him, and said, Go in this thy might, and thou shalt save Israel from the hand of the Midianites: have not I sent","15":"And he said unto him, Oh my Lord, wherewith shall I save Israel? behold, my family *is* poor in Manasseh, and I *am* the least in my father's house.","16":"And the LORD said unto him, Surely I will be with thee, and thou shalt smite the Midianites as one man.","17":"And he said unto him, If now I have found grace in thy sight, then shew me a sign that thou talkest","18":"Depart not hence, I pray thee, until I come unto thee, and bring forth my present, and set *it* before thee. And he said, I will tarry until thou come again.","19":"And Gideon went in, and made ready a kid, and unleavened cakes of an ephah of flour: the flesh he put in a basket, and he put the broth in a pot, and brought *it* out unto him under the oak, and presented","20":"And the angel of God said unto him, Take the flesh and the unleavened cakes, and lay *them* upon this rock, and pour out the broth. And he did","21":"Then the angel of the LORD put forth the end of the staff that *was* in his hand, and touched the flesh and the unleavened cakes; and there rose up fire out of the rock, and consumed the flesh and the unleavened cakes. Then the angel of the LORD departed out of his sight.","22":"And when Gideon perceived that he *was* an angel of the LORD, Gideon said, Alas, O Lord GOD! for because I have seen an angel of the LORD face to face.","23":"And the LORD said unto him, Peace *be* unto thee; fear not: thou shalt not die.","24":"Then Gideon built an altar there unto the LORD, and called it Jehovahshalom: unto this day it *is* yet in Ophrah of the Abiezrites.","25":"And it came to pass the same night, that the LORD said unto him, Take thy father's young bullock, even the second bullock of seven years old, and throw down the altar of Baal that thy father hath, and cut down the grove","26":"And build an altar unto the LORD thy God upon the top of this rock, in the ordered place, and take the second bullock, and offer a burnt sacrifice with the wood of the grove which thou shalt cut down.","27":"Then Gideon took ten men of his servants, and did as the LORD had said unto him: and *so* it was, because he feared his father's household, and the men of the city, that he could not do *it* by day, that he did *it* by night.","28":"And when the men of the city arose early in the morning, behold, the altar of Baal was cast down, and the grove was cut down that *was* by it, and the second bullock was offered upon the altar *that was* built.","29":"And they said one to another, Who hath done this thing? And when they enquired and asked, they said, Gideon the son of Joash hath done this thing.","30":"Then the men of the city said unto Joash, Bring out thy son, that he may die: because he hath cast down the altar of Baal, and because he hath cut down the grove","31":"And Joash said unto all that stood against him, Will ye plead for Baal? will ye save him? he that will plead for him, let him be put to death whilst *it is yet* morning: if he *be* a god, let him plead for himself, because *one* hath cast down his altar.","32":"Therefore on that day he called him Jerubbaal, saying, Let Baal plead against him, because he hath thrown down his altar.","33":"Then all the Midianites and the Amalekites and the children of the east were gathered together, and went over, and pitched in the valley of Jezreel.","34":"But the Spirit of the LORD came upon Gideon, and he blew a trumpet; and Abiezer was gathered after","35":"And he sent messengers throughout all Manasseh; who also was gathered after him: and he sent messengers unto Asher, and unto Zebulun, and unto Naphtali; and they came up to meet","36":"And Gideon said unto God, If thou wilt save Israel by mine hand, as thou hast said,","37":"Behold, I will put a fleece of wool in the floor; *and* if the dew be on the fleece only, and *it be* dry upon all the earth *beside*, then shall I know that thou wilt save Israel by mine hand, as thou hast said.","38":"And it was so: for he rose up early on the morrow, and thrust the fleece together, and wringed the dew out of the fleece, a bowl full of water.","39":"And Gideon said unto God, Let not thine anger be hot against me, and I will speak but this once: let me prove, I pray thee, but this once with the fleece; let it now be dry only upon the fleece, and upon all the ground let there be dew.","40":"And God did so that night: for it was dry upon the fleece  data-code=\"H4080\">Midianites</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalekites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H6924\">east,</span> even they came up","4":"And they <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> against them, and <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> the <span class=\"wl wl-kjv\" data-code=\"H2981\">increase</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> till thou <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto <span class=\"wl wl-kjv\" data-code=\"H5804\">Gaza,</span> and <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> no <span class=\"wl wl-kjv\" data-code=\"H4241\">sustenance</span> for <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> neither <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep,</span> nor <span class=\"wl wl-kjv\" data-code=\"H7794\">ox,</span> nor ass.","5":"For they came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> with their <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> and their <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H1767\">as</span> <span class=\"wl wl-kjv\" data-code=\"H697\">grasshoppers</span> for <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude;</span> for both they and their <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> were without <span class=\"wl wl-kjv\" data-code=\"H4557\">number:</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> to destroy","6":"And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H1809\">impoverished</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> unto the LORD.","7":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H182\">because</span> of the Midianites,","8":"That the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">prophet</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> I brought you <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and brought you <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of bondage;","9":"And I <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> you out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians,</span> and out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of all that <span class=\"wl wl-kjv\" data-code=\"H3905\">oppressed</span> you, and drave them <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you, and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> you their land;","10":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto you, I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> not the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> in whose <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> ye <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell:</span> but ye have not <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> my voice.","11":"And there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> under an <span class=\"wl wl-kjv\" data-code=\"H424\">oak</span> which was in <span class=\"wl wl-kjv\" data-code=\"H6084\">Ophrah,</span> that pertained unto <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> the <span class=\"wl wl-kjv\" data-code=\"H33\">Abiezrite:</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H2251\">threshed</span> <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat</span> by the <span class=\"wl wl-kjv\" data-code=\"H1660\">winepress,</span> to <span class=\"wl wl-kjv\" data-code=\"H5127\">hide</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> the Midianites.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is with thee, thou <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> man of valour.","13":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H994\">Oh</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H3426\">if</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be with us, why then is all this <span class=\"wl wl-kjv\" data-code=\"H4672\">befallen</span> us? and where be all his <span class=\"wl wl-kjv\" data-code=\"H6381\">miracles</span> which our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> us of, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Did not the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> bring us <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt?</span> but now the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5203\">forsaken</span> us, and <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> us into the <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> of the Midianites.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">looked</span> upon him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> in this thy <span class=\"wl wl-kjv\" data-code=\"H3581\">might,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> from the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites:</span> have not I sent","15":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H994\">Oh</span> my <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H4100\">wherewith</span> shall I <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> behold, my <span class=\"wl wl-kjv\" data-code=\"H504\">family</span> is <span class=\"wl wl-kjv\" data-code=\"H1800\">poor</span> in <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> and I am the <span class=\"wl wl-kjv\" data-code=\"H6810\">least</span> in my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> house.","16":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Surely I will be with thee, and thou shalt <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites</span> as <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> man.","17":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, If now I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> then <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> me a <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> that thou talkest","18":"<span class=\"wl wl-kjv\" data-code=\"H4185\">Depart</span> not hence, I pray thee, until I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto thee, and bring <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> my <span class=\"wl wl-kjv\" data-code=\"H4503\">present,</span> and <span class=\"wl wl-kjv\" data-code=\"H3240\">set</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3427\">tarry</span> until thou come again.","19":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and made <span class=\"wl wl-kjv\" data-code=\"H6213\">ready</span> a <span class=\"wl wl-kjv\" data-code=\"H5795\">kid,</span> and unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">cakes</span> of an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> of <span class=\"wl wl-kjv\" data-code=\"H7058\">flour:</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> he <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> in a <span class=\"wl wl-kjv\" data-code=\"H5536\">basket,</span> and he <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H4839\">broth</span> in a <span class=\"wl wl-kjv\" data-code=\"H6517\">pot,</span> and brought it <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> unto him under the <span class=\"wl wl-kjv\" data-code=\"H424\">oak,</span> and presented","20":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> and the unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">cakes,</span> and <span class=\"wl wl-kjv\" data-code=\"H3240\">lay</span> them upon <span class=\"wl wl-kjv\" data-code=\"H1975\">this</span> <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> and pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H4839\">broth.</span> And he did","21":"Then the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H4938\">staff</span> that was in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> and the unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">cakes;</span> and there rose <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">consumed</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> and the unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">cakes.</span> Then the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">departed</span> out of his sight.","22":"And when <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">perceived</span> that he was an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H162\">Alas,</span> O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD!</span> for <span class=\"wl wl-kjv\" data-code=\"H3651\">because</span> I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> to face.","23":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7965\">Peace</span> be unto thee; <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> not: thou shalt not die.","24":"Then <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> there unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> it <span class=\"wl wl-kjv\" data-code=\"H3073\">Jehovahshalom:</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> it is yet in <span class=\"wl wl-kjv\" data-code=\"H6084\">Ophrah</span> of the Abiezrites.","25":"And it came to pass the same <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">young</span> <span class=\"wl wl-kjv\" data-code=\"H7794\">bullock,</span> even the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> of <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> years <span class=\"wl wl-kjv\" data-code=\"H8141\">old,</span> and throw <span class=\"wl wl-kjv\" data-code=\"H2040\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal</span> that thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> hath, and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">down</span> the grove","26":"And <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of this <span class=\"wl wl-kjv\" data-code=\"H4581\">rock,</span> in the ordered <span class=\"wl wl-kjv\" data-code=\"H4634\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">sacrifice</span> with the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> of the <span class=\"wl wl-kjv\" data-code=\"H842\">grove</span> which thou shalt cut down.","27":"Then <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto him: and so it was, because he <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> that he could not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it by <span class=\"wl wl-kjv\" data-code=\"H3119\">day,</span> that he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> it by night.","28":"And when the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> arose <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> behold, the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal</span> was cast <span class=\"wl wl-kjv\" data-code=\"H5422\">down,</span> and the <span class=\"wl wl-kjv\" data-code=\"H842\">grove</span> was cut <span class=\"wl wl-kjv\" data-code=\"H3772\">down</span> that was by it, and the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> was <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> that was built.","29":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H7453\">another,</span> Who hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing?</span> And when they <span class=\"wl wl-kjv\" data-code=\"H1875\">enquired</span> and <span class=\"wl wl-kjv\" data-code=\"H1245\">asked,</span> they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this thing.","30":"Then the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash,</span> Bring <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> because he hath cast <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal,</span> and because he hath cut <span class=\"wl wl-kjv\" data-code=\"H3772\">down</span> the grove","31":"And <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all that <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> against him, Will ye <span class=\"wl wl-kjv\" data-code=\"H7378\">plead</span> for <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal?</span> will ye <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> him? he that will <span class=\"wl wl-kjv\" data-code=\"H7378\">plead</span> for him, let him be put to <span class=\"wl wl-kjv\" data-code=\"H4191\">death</span> whilst it is yet <span class=\"wl wl-kjv\" data-code=\"H1242\">morning:</span> if he be a <span class=\"wl wl-kjv\" data-code=\"H430\">god,</span> let him <span class=\"wl wl-kjv\" data-code=\"H7378\">plead</span> for himself, because one hath cast <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> his altar.","32":"Therefore on that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> him <span class=\"wl wl-kjv\" data-code=\"H3378\">Jerubbaal,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Let <span class=\"wl wl-kjv\" data-code=\"H1168\">Baal</span> <span class=\"wl wl-kjv\" data-code=\"H7378\">plead</span> against him, because he hath thrown <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> his altar.","33":"Then all the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites</span> and the <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalekites</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H6924\">east</span> were <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5674\">over,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of Jezreel.","34":"But the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3847\">came</span> upon <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> and he <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> a <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet;</span> and <span class=\"wl wl-kjv\" data-code=\"H44\">Abiezer</span> was <span class=\"wl wl-kjv\" data-code=\"H2199\">gathered</span> after","35":"And he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> throughout all <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh;</span> who also was <span class=\"wl wl-kjv\" data-code=\"H2199\">gathered</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him: and he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> unto <span class=\"wl wl-kjv\" data-code=\"H836\">Asher,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H2074\">Zebulun,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali;</span> and they came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to meet","36":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> If thou <span class=\"wl wl-kjv\" data-code=\"H3426\">wilt</span> <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> by mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> as thou hast said,","37":"Behold, I will <span class=\"wl wl-kjv\" data-code=\"H3322\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H1492\">fleece</span> of <span class=\"wl wl-kjv\" data-code=\"H6785\">wool</span> in the <span class=\"wl wl-kjv\" data-code=\"H1637\">floor;</span> and if the <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> be on the <span class=\"wl wl-kjv\" data-code=\"H1492\">fleece</span> only, and it be <span class=\"wl wl-kjv\" data-code=\"H2721\">dry</span> upon all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> beside, then shall I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that thou wilt <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> by mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> as thou hast said.","38":"And it was so: for he rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> and <span class=\"wl wl-kjv\" data-code=\"H2115\">thrust</span> the <span class=\"wl wl-kjv\" data-code=\"H1492\">fleece</span> <span class=\"wl wl-kjv\" data-code=\"H2115\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H4680\">wringed</span> the <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1492\">fleece,</span> a <span class=\"wl wl-kjv\" data-code=\"H5602\">bowl</span> <span class=\"wl wl-kjv\" data-code=\"H4393\">full</span> of water.","39":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> Let not thine <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> be <span class=\"wl wl-kjv\" data-code=\"H2734\">hot</span> against me, and I will <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> but this <span class=\"wl wl-kjv\" data-code=\"H6471\">once:</span> let me <span class=\"wl wl-kjv\" data-code=\"H5254\">prove,</span> I pray thee, but this <span class=\"wl wl-kjv\" data-code=\"H6471\">once</span> with the <span class=\"wl wl-kjv\" data-code=\"H1492\">fleece;</span> let it now be <span class=\"wl wl-kjv\" data-code=\"H2721\">dry</span> only upon the <span class=\"wl wl-kjv\" data-code=\"H1492\">fleece,</span> and upon all the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> let there be dew.","40":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> so that <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> for it was <span class=\"wl wl-kjv\" data-code=\"H2721\">dry</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1492\">fleece</span> only, and there was <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> on all the ground."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Midianieten,","tekst":"Hebreeuws, van Midian, en alzo in deze ganse historie. Zie van deze Num 25:17-18, en Num 31:2, enz."}],"2":[{"catchword":"maakten zich de kinderen Israëls,","tekst":"Of, zij bereidden, vermaakten, maakten toe."},{"catchword":"de holen,","tekst":"Om zich daarin tegen de Midianieten te verbergen en te verzekeren."}],"3":[{"catchword":"kwamen de Midianieten op,","tekst":"Dit hadden zij tevoren jaarlijks gedaan en deden het nu in het zevende jaar wedeRom."},{"catchword":"oosten kwamen","tekst":"Die oostwaarts woonden, inzonderheid de Arabieren, die in tenten gewoon waren zich te onthouden. Zie onder, Jdg 8:10-11; Gen 29:1, en Job 1:3. Hebreeuws, kinderen van het oosten"},{"catchword":"hen","tekst":"Namelijk, Israël, gelijk in het begin van vs.3 staat."}],"4":[{"catchword":"Gaza;","tekst":"Gelegen in het westen aan de grote zee, verdervende alzo het ganse land van het oosten tot het westen."}],"5":[{"catchword":"sprinkhanen","tekst":"Want hunlieder heirleger was wel honderd en vijftig en dertig duizend strijdende mannen sterk, gelijk te zien is onder, Jdg 8:10, buiten het andere gespuis, dat zulke legers, die geen tegenstand verwachtten, placht te volgen."},{"catchword":"niet tellen kon;","tekst":"Hebreeuws, hadden geen getal; dat is, zij waren zeer kwalijk, vanwege de veelheid, te tellen. Alzo Jdg 7:12. Daarentegen wordt van een kleinen hoop volks gezegd, dat zij lieden van getal zijn; dat is, licht om te tellen. Zie Gen 34:30."}],"6":[{"catchword":"vanwege de Midianieten","tekst":"Hebreeuws, voor het aangezicht; dat is, voor, of om hun tegenwoordigheid."}],"8":[{"catchword":"profeet was,","tekst":"Hebreeuws, een man, een profeet. Vergelijk boven, Jdg 4:4."}],"11":[{"catchword":"Engel des HEEREN,","tekst":"Versta, den Zoon Gods, die onder, vs.14, 16, met Gods eigen naam, de Heere, of Jehova, genoemd wordt. Vergelijk Gen 18:17, en Gen 48:16. Zie ook boven, Jdg 5:23."},{"catchword":"Joas,","tekst":"Omdat Joas aldaar [zoals men meent] de voornaamste was, of het ambt der overheid bediende. Vergelijk onder, vs.31,32."},{"catchword":"Abi-ezriet,","tekst":"Uit den stam van Manasse. Zie Jos 17:2, en onder, vs.34,35; 1Ch 7:14, 1Ch 7:18. Daar was een ander Ofra in den stam van Benjamin gelegen, Jos 18:23."},{"catchword":"dorste tarwe","tekst":"Niet met ossen [waarvan Deu 25:4] ] , maar met een stok of dorsvlegel, zoals enigen verklaren, om te minder opzien te geven, of in der haast wat voorraad te hebben."},{"catchword":"bij de pers,","tekst":"Dat is, in de plaats, waar de wijnpers of oliepers stond, waar men, naar sommiger gevoelen, niet gewoon was te dorsen; opdat niemand daarop acht mocht slaan, en deze tarwe voor den aanstaanden nood te zekerder geborgen kon worden."},{"catchword":"om die te vluchten","tekst":"Dat is, om de tarwe in het vluchten mede te nemen, of om zijns vaders huis te doen vluchten, als hij deze tarwe tot provisie zou hebben gedorst."},{"catchword":"Midianieten","tekst":"Die reeds in aantocht waren. Zie onder, vs.33, en Jdg 7."}],"13":[{"catchword":"Och mijn","tekst":"Van deze manier van spreken zie Gen 43:20, alzo onder, vs.15."},{"catchword":"Heer","tekst":"Gideon bewijst hem burgerlijke eer, vooralsnog niet anders wetende of hij was een mens, daar hij in mansgedaante verscheen."},{"catchword":"wedervaren?","tekst":"Hebreeuws, heeft ons dit alles gevonden? Dat is, getroffen, is ons overgekomen."}],"14":[{"catchword":"keerde Zich de HEERE tot hem,","tekst":"Of, de Heere zag hem aan, zag op hem; gevende hem meteen bevel en de nodige krachten om Israël te verlossen, gelijk volgt."},{"catchword":"deze uw kracht,","tekst":"Die gij nu van mij ontvangt."},{"catchword":"heb Ik u niet gezonden?","tekst":"Immers ja, wil de Heere zeggen: want gij hoort mij zeggen ga, met belofte van een goede uitkomst. Daarom twijfel niet, of gij zult verrichten, waartoe Ik u zend. Vergelijk boven, Jdg 4:6."}],"15":[{"catchword":"Och, mijn Heer","tekst":"Zie vs.13."},{"catchword":"waarmede zal ik Israël verlossen?","tekst":"Aldus vraagt hij, om van deze hoge en zware beroeping enig nader bescheid en volle verzekering te bekomen. Vergelijk Luk 1:34."},{"catchword":"duizend","tekst":"Tot welke ik behoor. Uit Exo 18:25; Deu 1:15 blijkt dat het volk in duizenden door Mozes was afgedeeld, hebbende elk duizend zijn overste, enz."}],"16":[{"catchword":"enigen man","tekst":"Alsof gij maar met één man te doen hadt; dat is, gij zult hen lichtelijk verstaan."}],"17":[{"catchword":"teken,","tekst":"Om mij te verzekeren dat gij van God hiertoe gezonden zijt, opdat ik deze beroeping met een goede conscientie moge aannemen."}],"18":[{"catchword":"geschenk uitbrenge,","tekst":"Alsnog niet anders denkende dan dat hij een mens en profeet was, wil hij hem, naar de wijze der oudvaders, in der haast met spijs en drank onthalen. vs.22 wordt hij eerst gewaar dat hij een engel was. Vergelijk hiermede onder, Jdg 13:15."}],"19":[{"catchword":"efa meels;","tekst":"Zie Exo 16:36."}],"20":[{"catchword":"giet het sop uit;","tekst":"Op het vlees en de koeken, om het wonder te heerlijker en klaarder te maken. Vergelijk 1Ki 18:34."}],"21":[{"catchword":"vuur op uit de rots,","tekst":"Vergelijk Lev 9:24; 1Ki 18:38; 2Ch 7:1."},{"catchword":"uit zijn ogen","tekst":"Versta, zeer haastelijk en onvoorziens, zodat hij hem gans niet meer zag; waardoor hij verschrikt en bevreesd werd, gelijk volgt."}],"22":[{"catchword":"daarom,","tekst":"Te weten, zal ik moeten sterven. Gideon vreest dat hij zal moeten sterven vanwege dit gezicht, gelijk blijkt uit de woorden Gods in vs.23. Vergelijk onder, Jdg 13:22; Gen 16:13, en Gen 32:30; Exo 33:20; Deu 5:24, Deu 5:26."},{"catchword":"aangezicht tot aangezicht","tekst":"Vergelijk Deu 5:4."}],"24":[{"catchword":"De HEERE is vrede","tekst":"Hebreeuws, JHWH Schalom. De zin is: De Heere is onze vrede; belooft, geeft en zendt ons nu den vrede. Want ten eerste, is deze engel, die de Heere Christus zelf was, onze vrede en de rechte vredevorst, Isa 9:5, en Isa 53:5; Mic 5:4; Luk 2:14; Act 10:36; Heb 7:2. Alzo wordt Hij ook genaamd de Heere onze gerechtigheid; Jer 23:6. Ten tweede, had Hij hier Gideon zijn vrede toegezegd, mitsgaders aan zijn volk vrede en verlossing van de Midianieten."},{"catchword":"Abi-ezrieten","tekst":"Zie boven, vs.11, en vergelijk onder, vs.34."}],"25":[{"catchword":"te weten, den tweeden var,","tekst":"Anders, en den anderen, of tweeden; verstaande dat God bevolen heeft twee varren te nemen; maar dewijl in het volgende alleen vermaand wordt van dien zevenjarigen, en ganselijk niets van een anderen bevolen, wat men dien zou doen, wordt de overzetting, die in den tekst staat, door de meesten voor de beste gehouden."},{"catchword":"zeven jaren;","tekst":"Even oud en zoveel jaren gemest zijnde als Israëls ellende onder de Midianieten geduurd had. Dezen var meent men, dat Joas gehouden en gemest heeft, om naar de afgodische wijze van dien tijd den Baäl te offeren."},{"catchword":"houw af het bos,","tekst":"God wil dat Gideon zijn beroep zal beginnen met de zuivering van den godsdienst."}],"26":[{"catchword":"hoogte","tekst":"Hebreeuws, hoofd."},{"catchword":"sterkte,","tekst":"Versta, den rotssteen, uit welken het vuur was uitgegaan, dat de spijs met het sap verteerd had, vs.21. Zulke rotsstenen gebruikte zij in tijd van nood voor een sterkte en toevlucht."},{"catchword":"bekwame plaats;","tekst":"Of, ordentelijk, geschiktelijk. Hebreeuws, in, of, met ordening, schikking, bekwaamheid. Anders, met een laag [hout] omdat ordelijk te leggen onder den var ten brandoffer."},{"catchword":"offer een brandoffer","tekst":"Dit was een bijzonder bevel des Heeren in dezen tijd van verval; anders was het offeren ordinairlijk den priesters bevolen."}],"29":[{"catchword":"de een tot den ander","tekst":"Hebreeuws, de man tot zijn naasten."},{"catchword":"stuk gedaan?","tekst":"Hebreeuws, woord, ding, zaak; alzo in het volgende."}],"31":[{"catchword":"twisten;","tekst":"Pleiten, rechten. Alzo in het volgende."},{"catchword":"zal twisten,","tekst":"Dat is, wie wijders zijn zaak meer zal durven opnemen en daarvoor spreken. Het schijnt dat Joas tevoren, door menselijke zwakheid, des volks boosheid heeft toegegeven, maar nu door deze goddelijke openbaring gesterkt zijnde, recht daartegen gaat."},{"catchword":"voor zichzelven,","tekst":"Of, hij rechte tegen hem [Gideon] dat hij, enz."}],"32":[{"catchword":"hij hem te dien dage Jerubbaäl,","tekst":"Joas noemde zijnen zoon Gideon Jerubbaäl, dat is, Baäl twiste, of, zal twisten. Zie onder, Jdg 7:1."},{"catchword":"twiste tegen hem,","tekst":"Of, zal twisten, rechten. Sommigen menen dat het volk, als in afgoderij verzopen zijnde, verwacht heeft dat Baäl dezen Gideon op een bijzondere wijze straffen zou, maar het contrarie merkende, hem, als een held Gods, te vuriger gevolgd heeft."}],"33":[{"catchword":"over,","tekst":"Over de Jordaan. Zie onder, Jdg 7:24."},{"catchword":"Jizreël","tekst":"Zijnde gelegen in Issaschar aan de andere zijde van het gebergte Gilboa, dat tussen Manasse en Issaschar was. Zie Jos 19:18, eindigende westwaarts bij de stad Jizreël. Een ander Jizreël was er in Juda; Jos 15:56."}],"34":[{"catchword":"toog de Geest des HEEREN","tekst":"Of, bekleedde hem; te weten, met zulke gaven van wijsheid, ijver, kloekmoedigheid en dapperheid, gelijk de Geest des Heeren wist dat hem tot dit werk, als wapenen nodig zouden zijn. Zie deze manier van spreken ook 1Ch 12:18; 2Ch 24:20; Luk 24:49; Rom 13:14, en vergelijk Gal 3:27; Eph 4:24; Col 3:12."},{"catchword":"blies met de bazuin,","tekst":"Dat is, liet hen blazen, gelijk boven, Jdg 3:27."},{"catchword":"Abi-ezrieten","tekst":"Hebreeuws, Abi-Ezer; dat is, die van dat geslacht van Gideon en van zijn vader Joas waren [boven, vs.11], werden bijeengeroepen en vergaderden zich bij hem, om hem te volgen. Alzo in het volgende."}],"35":[{"catchword":"gans Manasse,","tekst":"Omdat de halve stam aan deze en de andere helft aan de andere zijde der Jordaan woonde."},{"catchword":"Aser,","tekst":"Deze drie stammen waren naast en aan elkander gelegen, tegen het noorden en aan de zee. In Issaschar, liggende tussen Manasse en Zebulon, was het ganse heirleger des vijands, gelijk boven, vs.33."}],"36":[{"catchword":"zeide tot God","tekst":"Anders, Gideon had gezegd; menende dat dit al tevoren geschied is, eer Gideon zich opmaakte tegen de Midianieten, en dat hier verhaald wordt als ene reden, waardoor Gideon ten volle in zijn geloof gesterkt zijnde, de beroeping met ijver heeft aangenomen en uitgevoerd. Het is opmerkelijk dat God Gideon zijn verzoek zonder enige berisping heeft toegestaan, waaruit, alsook uit de manier van zijn begeren, blijkt dat hij het niet uit wantrouwen en ongeloof, maar ootmoediglijk tot versterking zijns geloofs begeerd heeft."}],"37":[{"catchword":"vloer leggen;","tekst":"Of, grond, erf, werf. Versta, een effen, onbetimmerde plaats, die buitenshuis onder de open lucht was."},{"catchword":"ganse aarde,","tekst":"Versta, de andere aarde daaromtrent, en alzo onder, vs.39."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But the children of Israel did that which was evil in the eyes of the Lord so the Lord delivered them into the hands of the Medianites [Heb. of Median and so in this whole history see of these Num 25:17,18 and 31.2 &c.] seven years."}],"2":[{"catchword":null,"tekst":"Now when the hands of the Medianites waxed strong against Israel because of the Medianites the children of Israel made [ or prepared repaired fitted] themselves the dens which are in the mountains and the caves and the strong holds [to hide and secure themselves in them against the Medianites.]"}],"3":[{"catchword":null,"tekst":"For it came to pass when Israel had sowen that the Medianites came up this they had done formerly every year and now they did it in the seventh year again and the Amalekites and those of the east [that is who dwealt eastwards especially the Arabians who were wont to abide in tents see below chapter 8.10,11 and Genesis 29 on verse 10 and Job 1 on verse 3 Heb. children of the east] came also up against him [Viz. against Israel as is said in the beginning of this verse.]"}],"6":[{"catchword":null,"tekst":"So Israel was much impoverished because of [Heb. before the face that is before or because of their presence ] the Medianites then the children of Israel cried unto the Lord."}],"7":[{"catchword":null,"tekst":"And it came to pass when the children of Israel cried unto the Lord because of the Medianites."}],"8":[{"catchword":null,"tekst":"That the Lord sent unto the children of Israel a man that was a prophet [Heb. A man a prophet compare above chapter 4 on verse 4] who said unto them thus saith the Lord the God of Israel I have caused you to come up out of Egypt and led you forth out of the house of bondage."}],"9":[{"catchword":null,"tekst":"And I have delivered you out of the hand of the Egyptians and out of the ahnd of all that oppressed you and I have driven them out of your face and given you their land."}],"10":[{"catchword":null,"tekst":"And I said unto ye I am the Lord your Godfear not the gods of the Amorites in whose land ye dwelt but ye obey not my voice."}],"11":[{"catchword":null,"tekst":"Then came an angel of the Lord [understand the the son of God who below verse 14 and 16 is called by the proper name of God the Lord or Jehovah compare Genesis 18 on verse 17 and 48.16 see also above chapter 5.23.] and set himself under an oak which is an Ophra which he longeth unto Joas[because Joas as it is thought was the chiefest man there or executed the magistrate&acirc;&euro;&trade;s office compare below verse 31.32] the Abi-Ezrites [ of the tribe of Manasseh see Jos 17:2 and below verse 34,35, 1Ch 7:14,18 there was another Ophra situate in the tribe of Benjamin Jos 18:23] and is son Gideon thressed wheat [not with oxen whereof Detronomy 25 on verse 4 but with a stick of flail as some expound it to give the less suspition or to get speedily some provision] by the press [that is in the place where the wine press or olive press stood where according to the opinion of some they wont to thresh that no man might perceive it and that this wheat might be safer hid and laid up against the approaching want or necessity ] to flee the same [that is to take that wheat along with him in his flight or to make his fathers house flee when he should have threshed his wheat for their provision ]before the face of the Medianites[ who already where upon the march see below verse 33 an dteh following chapter.]"}],"12":[{"catchword":null,"tekst":"Then the angel of the Lord appeared unto him and said unto him the Lord is with thee thou mighty man of valour."}],"13":[{"catchword":null,"tekst":"But Gideon said unto him oh![of this phrase or manner of speaking see Genesis 43 on verse 20 so below verse 15.] my Lord [Gideon sheweth him civil honor and respect for as much as he yet knew him to be no more then a man for that he appeared to him in the form of the shape of a man ] if the Lord be with us why then should this befallen us?[ Heb. hath all this found us ?that is come upon us ] and where be all his wonders which our forefathers told us of saying did the Lord not bring us up from Egypt ? But now the Lord hath forsaken us and hath delivered us into the hands of the Medianites."}],"14":[{"catchword":null,"tekst":"then the Lord turned himself unto him [ or the Lord beheld him looked upon him giving him with all the command and power requisite to deliver Israel as followeth ] and said go thy way in this thy might[which thou now receives of me ] and thou salt deliver Israel out of the hand of the Medianites have I not sent the?[ye indeed will the Lord say for thou hearest say go with promise of a good issue or event therefore doubt not but thou salt accomplishor bring to good effect that for which I give thee a commission compare above chapter 4 on verse 6.]"}],"15":[{"catchword":null,"tekst":"And he said unto him oh! My Lord [see on verse 13] wherewith shall I deliver Israel? [thus he asketh to have further satisfaction and fuller assurance of this high and weighty calling compare Luk 1:34] behold my thousand [viz. unto which belong it appeared from Exo 18:25 Deu 1:15that the people of Moseh were divided into thousand each thousand having their Governors and superiors &c.] it is the poorest in Manasseh and I am the least in my fathers house."}],"16":[{"catchword":null,"tekst":"And the Lord said unto him because I will be with thee therefore thou salt smite the Medianites as one man [as if thou hadst to deal but with one man that is thou salt easily slay them.]"}],"17":[{"catchword":null,"tekst":"And he said unto him if now I have found grace in thine eyes do or shew me a token that it is thou that speaketh with me [that is to assure me thou art for this purpose sent of God that I ,may entertain and embrace this calling with a good conscience.]"}],"18":[{"catchword":null,"tekst":"Depart not hence I pray thee until I come unto thee and bring forth my present and set it before thee [as yet he thanks him to be but a man and a prophet and therefore according to the manner and custome of the patriarchs desire in hast to entertain and welcome him with meat and drink verse 22 he first perceives that it was an angel compare herewith below chapter 13.15] and he said I will tarry until thou come again."}],"19":[{"catchword":null,"tekst":"And Gideon went in made ready a kid and unleavened cakes and lay them upon the rocks and pour out the broth [viz. upon the meat and cakes to make the miracle the clearer and the word illustrious compare 1 Kings 18.34] and he did so."}],"20":[{"catchword":null,"tekst":"But the Angel of God said unto him: Take the flesh and the unleavened (cakes) and lay then upon the rock, and pour out the broth: [viz. upon the meat and the cakes, to make the miracle the clearer, and the word illustrious. Compare 1 King. 18.34] and he did so."}],"21":[{"catchword":null,"tekst":"And the angel of the Lord put forth the uttermost part of the staff that was in the hand and touched the flesh and the unleavened cakes [compare Lev 9:24 1Ki 18:38 2Ch 7:1 and the angel of the Lord vanished of his eyes [understand very quickly and unawares so that he saw him no more whereby he was sore terrified and affrighted as followeth.]"}],"22":[{"catchword":null,"tekst":"Then Gideon perceived that it was an angel of the Lord [viz. I must die Gideon feareth that he must die because he hath seen this vision as appeareth by the ways of God in the following verse compare below chapter 13.2 Genesis 16 on verse 13 and 32.30Exo 33:20 Deu 5:24,26] from face to face[compare Deuteronomy 5 on verse 4.]"}],"23":[{"catchword":null,"tekst":"But the Lord said unto him peace be unto thee fear not thou salt not die."}],"24":[{"catchword":null,"tekst":"Then Gideon built there an altar unto Lord and called it is the Lord is peace [Heb. Jehovah Schalom meaning the Lord is our peace promiseth giveth and sendeth us peace Isa 9:6 and 53.5 Micah 5.5 Luk 2:14 Act 10:36 Heb 7:2 so is he called the lord our righteousness Prov 23:6 2 he had promised here Gideon unto his peace as also unto his people peace and deliverance from the Medianites] it is yet unto this day in Ophar of Abi-Ezrites [see above on verse 11 and compare below verse 34.]"}],"25":[{"catchword":null,"tekst":"And it came to pass the same night that the Lord said unto him take a steer of the oxen which are thy fathers to wit the second steer [others and the other or second understanding that God had commanded to take two steers but as much as in the sequel only mention is made of that steer of seven years old and no command given concerning another what therewith should be done therefore the translation in the text is of the most interpreters approved ] of seven years old [even so and which have been fatted so many years as Israel&acirc;&euro;&trade;s miseries under the Medianites had lasted this steer is thought to have been kept and satted by Joas for to offer the same unto Baal according to the idolatrous custom of that time] and break down the altar of Baal, which is thy fathers and cut down the grove that is by it. [God will have Gideon to begin his calling from the purging of Religion.]"}],"26":[{"catchword":null,"tekst":"And build an altar unto the LORD thy God upon the top [Heb. head] of this strong hold, [Understand the rock, out of which the fire issued that consumed the meat with the broth, ver.21. Such kind of rocks they used in time of need for a strong hold and refuge] in a convenient place: [Or, orderly, decently. Heb. in, or, with order, decency, fitness. Oth. With a log (of wood) to place it orderly under the steer for burnt-offering] and take the second bullock, and offer a burnt-offering with the wood of the grove which thou salt have cut down. [This was a special command of God in this back-sliding time, otherwise the offering or sacrificing was ordinarily enjoyed the Priests]"}],"27":[{"catchword":null,"tekst":"Then Gideon took ten men of his servants, and die according as the LORD had spoken to him: but it came to pass, because he seared his Fathers house, and the men of the city, to do it by day, that he did it by night."}],"28":[{"catchword":null,"tekst":"Now when the men of the city arose early in the morning; behold, the altar of Baal was cast down, and the grove that was by it: and that second bullock was offered upon the altar."}],"29":[{"catchword":null,"tekst":"So they said the one to the other; [Heb. the man to his neighbor] who hath done this thing? [Heb. word, matter, thing. so in the sequel] and when they enquired, and asked, it was said, Gideon, the son of Joas, hath committed this."}],"30":[{"catchword":null,"tekst":"Then said the men of that city unto Joas; bring forth thy son that he may die: because he hath cast down the altar of Baal, and because he hath cut down the grove that was by it."}],"31":[{"catchword":null,"tekst":"On the contrary Joas said unto all that stood by him; will ye contend [Plead, argue, dispute; so in the sequel] for Baal? Will ye deliver him? He that shall contend for him, [i.e. he that shall further dare to own his cause, and plead or speak before him. It seemeth that Joas before through humane frailty, yielded or connived at the people wickedness, but now being strengthened and confirmed by this divine apparition, he setteth himself strongly against it] shall yet this morning be put to death: if he be a God, let him contend for himself [or, let him plead against him (viz. Gideon) that he, etc.] because he hath cast down his altar."}],"32":[{"catchword":null,"tekst":"Therefore he called him on that day Jerubaal, [i.e. Joas called his son Gideon, Jerubaal, i.e. let Baal contend, or Baal shall contend. See below chap.7.1.] saying: Let Baal contend [or, shall contend, plead. Some conceive that the people being as it were drowned in Idolatary, expected that Baal should plague this Gideon in a special manner, but finding the contrary, followed him the more eagerly, as a stout and valiant champion of God] against him, because he hath cast down his altar."}],"33":[{"catchword":null,"tekst":"Now all the Midianites, and the Amalekites, and the children of the East, were gathered together: and they passes over, [i.e. over the Jordan. See below chap. 7.v.24.] And they camped themselves in the valley of Jisreel [Which lay in Issachar, on the other side of mount Gilboa, which was between Manasseh and Issachar. See Jos.19.18. ending Westward by the city of Jisreel. There was another Jisreel in Juda, Jos.15.16.]"}],"34":[{"catchword":null,"tekst":"Then the spirit of the LORD arrayed Gideon, [Or, clothed him, viz. with such gifts of wild dome, zeal, courage, and valour, as the spirit of the Lord knew to be needful for him, as weapons for this work. See of this phrase also, 1 Chron. 12.18. 2 Chron. 24.20. Luk 24:49. Rom 13.14. And compare Gal. 3.27. Ezr.4.24. Col.3.12.] and he blew with the trumpet [i.e. caused it to be blown: as above chap.3.24.] and the Abi-Ezrites were called together after him. [Heb. Abi-Ezer, i.e. they that were of the family or kindred of Gideon and his father Joas, (above v 11.) were called together, and gathered themselves unto him. So in the sequel.]"}],"35":[{"catchword":null,"tekst":"Also he sent messengers into all Manasseh [Because the one halt tribe dwelt on this, and the other half on the other side Jordan] and they also were called together after him: likewise he sent messengers into Aser, and into Zebulon, and into Naphtali, [these three tribes were nearest, and lay one by another, toward the North, and at the sea. In Issachar which lay between Manasseh and Zebulon, was the whole army of the enemy as above, vers.33.] And they came up to meet them."}],"36":[{"catchword":null,"tekst":"And Gideon said unto God: [Otherwise, Gideon had said: conceiving that this was done aforetime, before Gideon went up against the Midianites: and that it is here again re-iterated as a reason or ground, whereby Gideon being fully strengthened and confirmed in his faith, embraced and executed the calling with zeal and servancy of spirit, it is worthy our observation, that God granted Gideons request without any reprehension at all from whence, as also from the manner of his request, it plainly appeareth, that he requested it not out of diffidence and unbelief, but out of humility, for the strengthening and confirming of his faith] if thou wilt deliver Israel by mine hand, according as thou hast said."}],"38":[{"catchword":null,"tekst":"And it was so: for he rose up early the next day, and he crushed the fleece together, and he wrang the dew out of the fleece, a bowl full of water."}],"39":[{"catchword":null,"tekst":"And Gideon said unto God; Let not thine anger kindle against me, that I may speak but this once: let me prove I pray thee, but this once with the fleece; let there I pray thee be driness onely upon the fleece, and let dew be upon all the earth."}],"40":[{"catchword":null,"tekst":"And God did so the same night: for dryness was onely upon the fleece, and (there) was dew upon all the earth."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}
