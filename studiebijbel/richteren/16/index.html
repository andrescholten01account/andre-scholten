, "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Simson ging weg naar Gaza; en hij zag daar een vrouw, die een hoer was; en hij ging naar haar toe.", "2": "Toen werd aan de inwoners van Gaza gezegd: Simson is hier binnengekomen; zo gingen zij rondom, en legden hem de hele nacht een hinderlaag bij de stadspoort; maar zij hielden zich de hele nacht stil, en zeiden: Tot aan het morgenlicht, dan zullen wij hem doden.", "3": "Maar Simson lag tot middernacht toe; toen stond hij op te middernacht, en hij greep de deuren van de stadspoort met de beide posten, en nam ze weg met de grendelboom, en legde ze op zijn schouders, en droeg ze omhoog naar de top van de berg, die tegenover Hebron ligt.", "4": "En daarna gebeurde het, dat hij een vrouw lief kreeg, bij de beek Sorek, wier naam Delila was.", "5": "Toen kwamen de vorsten van de Filistijnen naar haar toe, en zeiden tegen haar: Overreed hem, en zie waarin zijn grote kracht ligt, en waarmee wij hem machtig zouden kunnen worden, en hem binden, om hem te onderwerpen; dan zullen wij u geven, ieder, duizend en honderd zilverstukken.", "6": "Delila dan zei tegen Simson: Vertel mij toch, waarin uw grote kracht ligt, en waarmee u gebonden zou kunnen worden, zodat men u kan onderwerpen.", "7": "En Simson zei tegen haar: Als zij mij binden met zeven verse pezen, die niet verdroogd zijn, dan zou ik zwak worden, en zijn als een ander mens.", "8": "Toen brachten de vorsten van de Filistijnen haar zeven verse pezen, die niet verdroogd waren; en zij bond hem daarmee.", "9": "De hinderlaag zat bij haar in een kamer. Zo zei zij tegen hem: De Filistijnen over u, Simson! Toen verbrak hij de pezen, zoals een sliertje grof vlas verbroken wordt, als het vuur het raakt. Zo werd zijn kracht niet bekend.", "10": "Toen zei Delila tegen Simson: Zie, u hebt met mij gespot, en leugens tegen mij gesproken; vertel mij toch nu, waarmee u gebonden zou kunnen worden.", "11": "En hij zei tegen haar: Als zij mij stevig vastbinden met nieuwe touwen, waarmee geen werk gedaan is, dan zou ik zwak worden, en zijn als een ander mens.", "12": "Toen nam Delila nieuwe touwen, en bond hem daarmee, en zei tegen hem: De Filistijnen over u, Simson! (De hinderlaag zat namelijk in een kamer.) Toen verbrak hij ze van zijn armen als een draad.", "13": "En Delila zei tegen Simson: Tot nu toe hebt u met mij gespot, en leugens tegen mij gesproken; vertel mij *toch* *nu*, waarmee u gebonden zou kunnen worden. En hij zei tegen haar: Als u de zeven haarlokken van mijn hoofd zou vlechten met een weefsel op een weversboom.", "14": "En zij maakte ze vast met een pin, en zei tegen hem: De Filistijnen over u, Simson! Toen werd hij wakker uit zijn slaap, en nam de pin van het weefsel weg, en de weversboom.", "15": "Toen zei zij tegen hem: Hoe kunt u zeggen: Ik heb u lief, terwijl uw hart niet bij mij is? U hebt nu driemaal met mij gespot, en mij niet verteld waarin uw grote kracht ligt.", "16": "En het gebeurde, toen zij hem alle dagen met haar woorden onder druk zette, en hem lastigviel, dat zijn ziel verdrietig werd tot de dood toe;", "17": "Zo maakte hij haar zijn hele hart bekend, en zei tegen haar: Er is nooit een scheermes op mijn hoofd gekomen, want ik ben een nazireeër van God vanaf de buik van mijn moeder af; als ik geschoren werd, zou mijn kracht van mij wijken, en ik zou zwak worden, en zijn als alle mensen.", "18": "Toen Delila nu zag, dat hij haar zijn hele hart bekend had gemaakt, zond zij mensen weg, en riep de vorsten van de Filistijnen, en zei: Komt ditmaal, want hij heeft mij zijn hele hart bekendgemaakt. En de vorsten van de Filistijnen kwamen naar haar toe, en brachten dat geld in hun hand.", "19": "Toen liet zij hem slapen op haar knieën, en riep een man, en liet hem de zeven haarlokken van zijn hoofd afscheren, en zij begon hem te onderwerpen; en zijn kracht week van hem.", "20": "En zij zei: De Filistijnen over u, Simson! En hij werd wakker uit zijn slaap, en zei: Ik zal ditmaal uitgaan, zoals de andere keren, en mij uitschudden; want hij wist niet, dat de HEERE van hem geweken was.", "21": "Toen grepen de Filistijnen hem, en groeven zijn ogen uit; en zij voerden hem af naar Gaza, en bonden hem met twee koperen ketenen, en hij moest malen in de gevangenis.", "22": "En het haar van zijn hoofd begon *weer* te groeien, zoals toen hij geschoren werd.", "23": "Toen verzamelden de vorsten van de Filistijnen zich, om hun god Dagon een groot offer te brengen, en tot vrolijkheid; en zij zeiden: Onze god heeft onze vijand Simson in onze hand gegeven.", "24": "Toen het volk hem zag, loofden zij hun god, want zij zeiden: Onze god heeft onze vijand in onze hand gegeven, die ons land verwoestte, en die velen van ons doodde!", "25": "En het gebeurde, toen hun hart vrolijk was, dat zij zeiden: Roept Simson, dat hij voor ons speelt. En zij riepen Simson uit de gevangenis; en hij speelde voor hun aangezicht, en zij lieten hem staan tussen de pilaren.", "26": "Toen zei Simson tegen de jongen, die hem bij de hand hield: Laat mij los, dat ik de pilaren kan betasten, waarop het huis gevestigd is, zodat ik daartegen kan leunen.", "27": "Het huis nu was vol mannen en vrouwen; ook waren daar alle vorsten van de Filistijnen; en op het dak waren ongeveer drieduizend mannen en vrouwen, die toekeken, terwijl Simson speelde.", "28": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.", "29": "En Simson greep de twee middelste pilaren, waarop het huis gevestigd was, en waarop het steunde, de ene met zijn rechterhand, en de andere met zijn linkerhand;", "30": "En Simson zei: Laat mijn ziel sterven met de Filistijnen; en hij boog zich met kracht, en het huis viel op de vorsten, en op al het volk, dat daarin was. En de doden, die hij bij zijn sterven gedood heeft, waren meer dan die hij tijdens zijn leven had gedood.", "31": "Toen kwamen zijn broers naar beneden, en het hele huis van zijn vader, en namen hem op, en brachten hem omhoog, en begroeven hem tussen Zora en Esthaol, in het graf van zijn vader Manoach; hij had Israël twintig jaar geleid."}, "SV": {"1": "Simson nu ging heen naar Gaza; en hij zag aldaar een vrouw, die een hoer was; en hij ging tot haar in.", "2": "Toen werd den Gazieten gezegd: Simson is hier ingekomen; zo gingen zij rondom, en leiden hem den ganse nacht lagen in de stadspoort; doch zij hielden zich den ganse nacht stil, zeggende: Tot aan het morgenlicht, dan zullen wij hem doden.", "3": "Maar Simson lag tot middernacht toe; toen stond hij op ter middernacht, en hij greep de deuren der stadspoort met de beide posten, en nam ze weg met den grendelboom, en leide ze op zijn schouderen, en droeg ze opwaarts op de hoogte des bergs, die in het gezicht van Hebron is.", "4": "En het geschiedde daarna, dat hij een vrouw lief kreeg, aan de beek Sorek, welker naam was Delila.", "5": "Toen kwamen de vorsten der Filistijnen tot haar op, en zeiden tot haar: Overreed hem, en zie, waarin zijn grote kracht zij, en waarmede wij hem zouden machtig worden, en hem binden, om hem te plagen; zo zullen wij u geven, een iegelijk, duizend en honderd zilverlingen.", "6": "Delila dan zeide tot Simson: Verklaar mij toch, waarin uw grote kracht zij, en waarmede gij zoudt kunnen gebonden worden, dat men u plage.", "7": "En Simson zeide tot haar: Indien zij mij bonden met zeven verse zelen, die niet verdroogd zijn, zo zou ik zwak worden, en wezen als een ander mens.", "8": "Toen brachten de vorsten der Filistijnen tot haar op zeven verse zelen, die niet verdroogd waren; en zij bond hem daarmede.", "9": "De achterlage nu zat bij haar in een kamer. Zo zeide zij tot hem: De Filistijnen over u, Simson! Toen verbrak hij de zelen, gelijk als een snoertje van grof vlas verbroken wordt, als het vuur riekt. Alzo werd zijn kracht niet bekend.", "10": "Toen zeide Delila tot Simson: Zie, gij hebt met mij gespot, en leugenen tot mij gesproken; verklaar mij toch nu, waarmede gij zoudt kunnen gebonden worden?", "11": "En hij zeide tot haar: Indien zij mij vastbonden met nieuwe touwen, met dewelke geen werk gedaan is, zo zou ik zwak worden, en wezen als een ander mens.", "12": "Toen nam Delila nieuwe touwen, en bond hem daarmede, en zeide tot hem: De Filistijnen over u, Simson! (De achterlage nu was zittende in een kamer.) Toen verbrak hij ze van zijn armen als een draad.", "13": "En Delila zeide tot Simson: Tot hiertoe hebt gij met mij gespot, en leugenen tot mij gesproken; verklaar mij *toch* *nu*, waarmede gij zoudt kunnen gebonden worden. En hij zeide tot haar: Indien gij de zeven haarlokken mijns hoofds vlochtet aan een weversboom.", "14": "En zij maakte ze vast met een pin, en zeide tot hem: De Filistijnen over u, Simson! Toen waakte hij op uit zijn slaap, en nam weg de pin der gevlochten *haarlokken*, en den weversboom.", "15": "Toen zeide zij tot hem: Hoe zult gij zeggen: Ik heb u lief, daar uw hart niet met mij is? Gij hebt nu driemaal met mij gespot, en mij niet verklaard, waarin uw grote kracht zij.", "16": "En het geschiedde, als zij hem alle dagen met haar woorden perste, en hem moeilijk viel, dat zijn ziel verdrietig werd tot stervens toe;", "17": "Zo verklaarde hij haar zijn ganse hart, en zeide tot haar: Er is nooit een scheermes op mijn hoofd gekomen, want ik ben een Nazireër Gods van mijn moeders buik af; indien ik geschoren wierd, zo zou mijn kracht van mij wijken, en ik zou zwak worden, en wezen als alle de mensen.", "18": "Als nu Delila zag, dat hij haar zijn ganse hart verklaard had, zo zond zij heen, en riep de vorsten der Filistijnen, zeggende: Komt ditmaal op, want hij heeft mij zijn ganse hart verklaard. En de vorsten der Filistijnen kwamen tot haar op, en brachten dat geld in hun hand.", "19": "Toen deed zij hem slapen op haar knieën, en riep een man en liet hem de zeven haarlokken zijns hoofds afscheren, en zij begon hem te plagen; en zijn kracht week van hem.", "20": "En zij zeide: De Filistijnen over u, Simson! En hij ontwaakte uit zijn slaap, en zeide: Ik zal ditmaal uitgaan, als op andere malen, en mij uitschudden; want hij wist niet, dat de HEERE van hem geweken was.", "21": "Toen grepen hem de Filistijnen, en groeven zijn ogen uit; en zij voerden hem af naar Gaza, en bonden hem met twee koperen ketenen, en hij was malende in het gevangenhuis.", "22": "En het haar zijns hoofds begon *weder* te wassen, gelijk toen hij geschoren werd.", "23": "Toen verzamelden zich de vorsten der Filistijnen, om hun god Dagon een groot offer te offeren, en tot vrolijkheid; en zij zeiden: Onze god heeft onze vijand Simson in onze hand gegeven.", "24": "Desgelijks als hem het volk zag, loofden zij hun god, want zij zeiden: Onze god heeft in onze hand gegeven onzen vijand, en die ons land verwoestte, en die onzer verslagenen velen maakte!", "25": "En het geschiedde, als hun hart vrolijk was, dat zij zeiden: Roept Simson, dat hij voor ons spele. En zij riepen Simson uit het gevangenhuis; en hij speelde voor hun aangezichten, en zij deden hem staan tussen de pilaren.", "26": "Toen zeide Simson tot den jongen, die hem bij de hand hield: Laat mij gaan, dat ik de pilaren betaste , op dewelke het huis gevestigd is, dat ik daaraan leune.", "27": "Het huis nu was vol mannen en vrouwen; ook waren daar alle vorsten der Filistijnen; en op het dak waren omtrent drie duizend mannen en vrouwen, die toezagen, als Simson speelde.", "28": "Toen riep Simson tot den HEERE, en zeide: Heere, HEERE! gedenk toch mijner, en sterk mij toch alleenlijk ditmaal, o God! dat ik mij met een wrake voor mijn twee ogen aan de Filistijnen wreke.", "29": "En Simson vatte de twee middelste pilaren, op dewelke het huis was gevestigd, en waarop het steunde, den enen met zijn rechterhand, en den anderen met zijn linkerhand;", "30": "En Simson zeide: Mijn ziel sterve met de Filistijnen; en hij boog zich met kracht, en het huis viel op de vorsten, en op al het volk, dat daarin was. En de doden, die hij in zijn sterven gedood heeft, waren meer, dan die hij in zijn leven gedood had.", "31": "Toen kwamen zijn broeders af, en het ganse huis zijns vaders, en namen hem op, en brachten *hem* opwaarts, en begroeven hem tussen Zora en tussen Esthaol, in het graf van zijn vader Manoach; hij nu had Israël gericht twintig jaren."}, "KJV": {"1": "Then went Samson to Gaza, and saw there an harlot, and went in", "2": "*And it was told* the Gazites, saying, Samson is come hither. And they compassed *him* in, and laid wait for him all night in the gate of the city, and were quiet all the night, saying, In the morning, when it is day, we shall kill", "3": "And Samson lay till midnight, and arose at midnight, and took the doors of the gate of the city, and the two posts, and went away with them, bar and all, and put *them* upon his shoulders, and carried them up to the top of an hill that *is* before Hebron.", "4": "And it came to pass afterward, that he loved a woman in the valley of Sorek, whose name *was* Delilah.", "5": "And the lords of the Philistines came up unto her, and said unto her, Entice him, and see wherein his great strength *lieth*, and by what *means* we may prevail against him, that we may bind him to afflict him: and we will give thee every one of us eleven hundred *pieces* of silver.", "6": "And Delilah said to Samson, Tell me, I pray thee, wherein thy great strength *lieth*, and wherewith thou mightest be bound to afflict", "7": "And Samson said unto her, If they bind me with seven green withs that were never dried, then shall I be weak, and be as another man.", "8": "Then the lords of the Philistines brought up to her seven green withs which had not been dried, and she bound", "9": "Now *there were* men lying in wait, abiding with her in the chamber. And she said unto him, The Philistines *be* upon thee, Samson. And he brake the withs, as a thread of tow is broken when it toucheth the fire. So his strength was not known.", "10": "And Delilah said unto Samson, Behold, thou hast mocked me, and told me lies: now tell me, I pray thee, wherewith thou mightest be bound.", "11": "And he said unto her, If they bind me fast with new ropes that never were occupied, then shall I be weak, and be as another man.", "12": "Delilah therefore took new ropes, and bound him therewith, and said unto him, The Philistines *be* upon thee, Samson. And *there were* liers in wait abiding in the chamber. And he brake them from off his arms like a thread.", "13": "And Delilah said unto Samson, Hitherto thou hast mocked me, and told me lies: tell me wherewith thou mightest be bound. And he said unto her, If thou weavest the seven locks of my head with the web.", "14": "And she fastened *it* with the pin, and said unto him, The Philistines *be* upon thee, Samson. And he awaked out of his sleep, and went away with the pin of the beam, and with the web.", "15": "And she said unto him, How canst thou say, I love thee, when thine heart *is* not with me? thou hast mocked me these three times, and hast not told me wherein thy great strength", "16": "And it came to pass, when she pressed him daily with her words, and urged him, *so* that his soul was vexed unto death;", "17": "That he told her all his heart, and said unto her, There hath not come a razor upon mine head; for I *have been* a Nazarite unto God from my mother's womb: if I be shaven, then my strength will go from me, and I shall become weak, and be like any *other* man.", "18": "And when Delilah saw that he had told her all his heart, she sent and called for the lords of the Philistines, saying, Come up this once, for he hath shewed me all his heart. Then the lords of the Philistines came up unto her, and brought money in their hand.", "19": "And she made him sleep upon her knees; and she called for a man, and she caused him to shave off the seven locks of his head; and she began to afflict him, and his strength went", "20": "And she said, The Philistines *be* upon thee, Samson. And he awoke out of his sleep, and said, I will go out as at other times before, and shake myself. And he wist not that the LORD was departed", "21": "But the Philistines took him, and put out his eyes, and brought him down to Gaza, and bound him with fetters of brass; and he did grind in the prison house.", "22": "Howbeit the hair of his head began to grow again after he was shaven.", "23": "Then the lords of the Philistines gathered them together for to offer a great sacrifice unto Dagon their god, and to rejoice: for they said, Our god hath delivered Samson our enemy into our hand.", "24": "And when the people saw him, they praised their god: for they said, Our god hath delivered into our hands our enemy, and the destroyer of our country, which slew many", "25": "And it came to pass, when their hearts were merry, that they said, Call for Samson, that he may make us sport. And they called for Samson out of the prison house; and he made them sport: and they set him between the pillars.", "26": "And Samson said unto the lad that held him by the hand, Suffer me that I may feel the pillars whereupon the house standeth, that I may lean", "27": "Now the house was full of men and women; and all the lords of the Philistines *were* there; and *there were* upon the roof about three thousand men and women, that beheld while Samson made sport.", "28": "And Samson called unto the LORD, and said, O Lord GOD, remember me, I pray thee, and strengthen me, I pray thee, only this once, O God, that I may be at once avenged of the Philistines for my two eyes.", "29": "And Samson took hold of the two middle pillars upon which the house stood, and on which it was borne up, of the one with his right hand, and of the other with his left.", "30": "And Samson said, Let me die with the Philistines. And he bowed himself with *all his* might; and the house fell upon the lords, and upon all the people that *were* therein. So the dead which he slew at his death were more than *they* which he slew in his life.", "31": "Then his brethren and all the house of his father came down, and took him, and brought *him* up, and buried him between Zorah and Eshtaol in the buryingplace of Manoah his father. And he judged Israel twenty years."}}, "tsk": {"1": [{"kopje": "Gaza", "refs": ["Gen 10:19", "Joz 15:47"]}, {"kopje": "en hij ging", "refs": ["Gen 38:16-18", "Ezra 9:1 "../../torrey/j/?hl=Judg.16.31#i10647", "refs": [], "kinderen": [{"label": "Samson", "href": "../../torrey/j/?hl=Judg.16.31#i10660", "refs": [{"disp": "Richt 13:24", "href": "../../richteren/13/#v24", "ref": "Richt 13:24", "svLabel": null}, {"disp": "Richt 13:25", "href": "../../richteren/13/#v25", "ref": "Richt 13:25", "svLabel": null}, {"disp": "Richt 16:31", "href": "../../richteren/16/#v31", "ref": "Richt 16:31", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"2 Tess 2:12": "opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "Hand 18:18": "En Paulus bleef daar nog veel dagen, en nam toen afscheid van de broeders, en voer vandaar naar Syrië; en Priscilla en Aquila gingen met hem mee, nadat hij in Kenchreeën zijn hoofd had laten scheren; want hij had een gelofte gedaan.", "Gen 33:16": "Zo keerde Ezau die dag terug, zijn weg naar Seïr op.", "1 Sam 5:11": "En zij zonden heen, en verzamelden alle vorsten van de Filistijnen, en zeiden: Zend de ark van de God van Israël heen, dat die terugkeert naar haar plaats, opdat zij mij en mijn volk niet doodt; want er was een dodelijke kwelling in de hele stad, en de hand van God was daar zeer zwaar.", "Gal 4:8": "Maar toen u God niet kende, diende u hen die van nature geen goden zijn;", "Spr 12:23": "Een schrander mens bedekt de wetenschap; maar het hart van de zotten roept dwaasheid uit.", "Spr 27:22": "Al stampte u de dwaas in een vijzel met een stamper, midden tussen het gestoten graan, zijn dwaasheid zou niet van hem wijken.", "Jer 5:5": "Ik zal naar de groten gaan, en met hen spreken, want die kennen de weg van de HEERE, het recht van hun God; maar zij hadden samen het juk verbroken, en de banden verscheurd.", "Joh 3:9-12": "Nicodemus antwoordde en zei tegen Hem: Hoe kunnen deze dingen gebeuren? Jezus antwoordde en zei tegen hem: Bent u een leraar van Israël, en weet u deze dingen niet? Voorwaar, voorwaar, Ik zeg u: Wij spreken wat Wij weten, en getuigen wat Wij gezien hebben; en u neemt Ons getuigenis niet aan.", "Ps 59:16": "Laat hen zelfs omzwerven om eten; en laat hen vernachten, ook al zijn zij niet verzadigd.", "Richt 16:21-31": "Toen grepen de Filistijnen hem, en groeven zijn ogen uit; en zij voerden hem af naar Gaza, en bonden hem met twee koperen ketenen, en hij moest malen in de gevangenis. En het haar van zijn hoofd begon weer te groeien, zoals toen hij geschoren werd. Toen verzamelden de vorsten van de Filistijnen zich, om hun god Dagon een groot offer te brengen, en tot vrolijkheid; en zij zeiden: Onze god heeft onze vijand Simson in onze hand gegeven.", "1 Kor 8:5": "Want al zijn er ook die goden genoemd worden, hetzij in de hemel, hetzij op de aarde (zoals er veel goden en veel heren zijn),", "Micha 7:8-10": "Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn. Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid. En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "Hoogl 8:6": "Zet mij als een zegel op Uw hart, als een zegel op Uw arm; want de liefde is sterk als de dood; de ijver is hard als het graf; haar kolen zijn vurige kolen, vlammen van de Heere.", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Spr 29:25": "De angst voor mensen legt een strik; maar wie op de HEERE vertrouwt, zal veilig gesteld worden.", "Mark 14:24": "En Hij zei tegen hen: Dat is Mijn bloed, het bloed van het nieuwe testament, dat voor velen vergoten wordt.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "Richt 14:15": "Daarna gebeurde het op de zevende dag, dat zij tegen de vrouw van Simson zeiden: Overreed uw man, dat hij ons dat raadsel verklaart, opdat wij niet misschien u en het huis van uw vader met vuur verbranden. Hebt u ons genodigd om ons van ons bezit te beroven? Is het zo niet?", "Hand 3:17": "En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.", "Spr 2:19": "Allen die tot haar ingaan, zullen niet terugkomen, en zullen de paden van het leven niet bereiken;", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "Ps 35:16": "Onder spotachtige tafelbroeders die huichelden, knerste men over mij met de tanden.", "Spr 10:21": "De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Hand 19:2": "zei hij tegen hen: Hebt u de Heilige Geest ontvangen, toen u tot geloof kwam? En zij zeiden tegen hem: Wij hebben zelfs niet gehoord of er een Heilige Geest is.", "Matt 17:20": "En Jezus zei tegen hen: Vanwege uw ongeloof; want voorwaar, Ik zeg u: als u een geloof had als een mosterdzaad, zou u tegen deze berg zeggen: Ga van hier daarheen, en hij zou gaan; en niets zou voor u onmogelijk zijn.", "Num 3:48-51": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten. Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten. Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig sikkels, naar de sikkel van het heiligdom.", "Mark 4:11": "En Hij zei tegen hen: Aan u is het gegeven het geheimenis van het Koninkrijk van God te verstaan; maar aan hen die buiten zijn, gebeurt dit alles door gelijkenissen;", "Ps 102:3": "Verberg Uw aangezicht niet voor mij, neig Uw oor tot mij ten dage van mijn benauwdheid; ten dage als ik roep, verhoor mij haastig.", "Jer 17:18": "Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen de dag van het kwaad, en verbreek hen met een dubbele verbreking.", "Spr 29:12": "Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.", "Klaagl 3:32": "Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid.", "Ps 14:4": "Hebben dan alle werkers van de ongerechtigheid geen kennis, die mijn volk opeten alsof zij brood aten? Zij roepen de HEERE niet aan.", "Ps 109:29": "Laat mijn tegenstanders met schande bekleed worden, en laat hen zich met hun schande bedekken, als met een mantel.", "Ps 69:29": "Laat hen uitgedelgd worden uit het boek van het leven, en met de rechtvaardigen niet aangeschreven worden.", "Ps 17:6": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden.", "Jes 28:13": "Zo zal het woord van de HEERE voor hen zijn: gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig; opdat zij heengaan, en achterwaarts vallen, en gebroken, en verstrikt en gevangen worden.", "Richt 13:2": "Er was een man uit Zora, uit het geslacht van een Daniet, wiens naam Manoach was; en zijn vrouw was onvruchtbaar en had geen kinderen gebaard.", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Ps 62:10": "Zeker, de gewone mensen zijn nietigheid, de aanzienlijke mensen zijn leugen; in de weegschaal gewogen, zouden zij samen lichter zijn dan de nietigheid.", "Mark 14:11": "En zij, die dit hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "Deut 11:29": "En het zal gebeuren, als de HEERE, uw God, u zal hebben binnengebracht in het land, waar u naartoe gaat, om dat te erven; dan zult u de zegen uitspreken op de berg Gerizim, en de vloek op de berg Ebal.", "Lev 27:15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "Gen 29:20": "Zo diende Jakob zeven jaar voor Rachel; en die waren in zijn ogen als enkele dagen, omdat hij haar liefhad.", "Luk 19:23": "Waarom hebt u dan mijn geld niet bij de bank gebracht, zodat ik het bij mijn komst met rente had kunnen opeisen?", "1 Sam 7:7": "Toen de Filistijnen hoorden dat de kinderen van Israël zich verzameld hadden te Mizpa, kwamen de leiders van de Filistijnen op tegen Israël. Toen de kinderen van Israël dat hoorden, werden zij bang voor de Filistijnen.", "Spr 18:8": "De woorden van de kwaadspreker zijn als klappen, en dalen af tot in het binnenste van de buik.", "Jes 53:1": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard?", "Matt 27:39-44": "En zij die voorbijgingen, beschimpten Hem en schudden hun hoofd, en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af. En evenzo zeiden ook de overpriesters, met de schriftgeleerden en oudsten, en Farizeeën, terwijl zij Hem bespotten:", "Spr 22:14": "De mond van vreemde vrouwen is een diepe kuil; op wie de HEERE vertoornd is, zal daarin vallen.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "Joz 7:12": "Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt.", "1 Kor 10:6": "En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben.", "Ps 69:13": "Die in de poort zitten, praten over mij; en ik ben een lied voor hen die sterke drank drinken.", "Deut 14:25": "Zo maak het tot geld, en bind het geld in uw hand, en ga naar de plaats die de HEERE, uw God, zal uitkiezen;", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Ef 5:8": "Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht.", "Deut 11:30": "Zijn zij niet aan de overkant van de Jordaan, achter de weg van de ondergang van de zon, in het land van de Kanaänieten, die in het vlakke veld wonen, tegenover Gilgal, bij de eikenbossen van More?", "Joh 14:15": "Als u Mij liefhebt, bewaar dan Mijn geboden.", "Hos 7:9": "Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwheid over hem verspreid, en hij merkt het niet.", "1 Kon 20:12": "En het gebeurde, toen hij dit woord hoorde, terwijl hij aan het drinken was, hij en de koningen in de tenten, dat hij zei tegen zijn knechten: Legt aan! En zij legden aan tegen de stad.", "Ps 55:10": "Verslind hen, Heere! verdeel hun tong; want ik zie geweld en twist in de stad.", "1 Kor 2:15": "Maar de geestelijke mens beoordeelt wel alle dingen, maar hijzelf wordt door niemand beoordeeld.", "Spr 13:3": "Die zijn mond bewaart, behoudt zijn ziel; maar voor hem is verstoring, die zijn lippen wijd opendoet.", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "Deut 29:4": "Maar de HEERE heeft u geen hart gegeven om te verstaan, geen ogen om te zien, en geen oren om te horen, tot op deze dag.", "Joh 8:33": "Zij antwoordden Hem: Wij zijn Abrahams nageslacht, en hebben nog nooit iemand gediend; hoe kunt U dan zeggen: U zult vrij worden?", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "1 Sam 21:3": "En nu, wat is er onder uw hand? Geef mij vijf broden in mijn hand, of wat er te vinden is.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Jes 22:1": "De last van het dal van het gezicht. Wat is er nu met u, dat u helemaal naar de daken bent geklommen?", "Spr 1:30": "Zij hebben in Mijn raad niet toegestemd; al Mijn bestraffingen hebben zij versmaad;", "Jer 18:21-23": "Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd. Laat er een geschrei uit hun huizen gehoord worden, wanneer U snel een bende over hen brengt; omdat zij een kuil gegraven hebben om mij te vangen, en strikken verborgen hebben voor mijn voeten. Doch U, HEERE, weet al hun plannen tegen mij, om mij te doden; maak geen verzoening over hun ongerechtigheid, en delg hun zonde niet uit van voor Uw aangezicht; maar laat hen neergeveld worden voor Uw aangezicht; handel zo met hen, in de tijd van Uw toorn.", "Jes 40:21": "Weet u het niet? Hoort u het niet? Is het u van het begin af aan niet bekendgemaakt? Hebt u niet gelet op de grondvesten van de aarde?", "Num 22:7": "Toen gingen de oudsten van Moab en de oudsten van Midian, met het loon voor de waarzeggerij in hun hand; zo kwamen zij bij Bileam, en spraken tot hem de woorden van Balak.", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "Ps 10:2": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben.", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "2 Petr 3:16": "Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.", "Spr 1:29": "Omdat zij de wetenschap gehaat hebben, en de vrees van de HEERE niet hebben verkozen.", "1 Sam 6:4": "Toen zeiden zij: Welk schuldoffer is dat, dat wij Hem teruggeven zullen? En zij zeiden: Vijf gouden gezwellen en vijf gouden muizen, naar het aantal van de vorsten van de Filistijnen; want het is één en dezelfde plaag over u allen en over uw vorsten.", "Ps 142:2": "Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem.", "2 Sam 21:19": "Verder was er nog een oorlog te Gob tegen de Filistijnen; en Elhanan, de zoon van Jaäre-Oregim, de Bethlehemiet, sloeg de broer van Goliath, de Gethiet, wiens speersteel was als een weversboom.", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "Ps 119:18": "Ontdek mijn ogen, dat ik aanschouw de wonderen van Uw wet.", "Richt 16:28-30": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken. En Simson greep de twee middelste pilaren, waarop het huis gevestigd was, en waarop het steunde, de ene met zijn rechterhand, en de andere met zijn linkerhand; En Simson zei: Laat mijn ziel sterven met de Filistijnen; en hij boog zich met kracht, en het huis viel op de vorsten, en op al het volk, dat daarin was. En de doden, die hij bij zijn sterven gedood heeft, waren meer dan die hij tijdens zijn leven had gedood.", "Joh 8:27": "Zij begrepen niet dat Hij tot hen over de Vader sprak.", "Spr 23:33": "Uw ogen zullen naar vreemde vrouwen zien, en uw hart zal verkeerde dingen spreken.", "Gen 47:14-18": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao. Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "Hos 4:14": "Ik zal over uw dochters geen straf² brengen, omdat zij hoereren, en over uw bruiden, omdat zij overspel plegen; want zij zelf zonderen zich af met de hoeren, en offeren met de snoodste hoeren; het volk dan, dat geen verstand heeft, zal ten onder gaan.", "Ps 116:4": "Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.", "Richt 16:15-17": "Toen zei zij tegen hem: Hoe kunt u zeggen: Ik heb u lief, terwijl uw hart niet bij mij is? U hebt nu driemaal met mij gespot, en mij niet verteld waarin uw grote kracht ligt. En het gebeurde, toen zij hem alle dagen met haar woorden onder druk zette, en hem lastigviel, dat zijn ziel verdrietig werd tot de dood toe; Zo maakte hij haar zijn hele hart bekend, en zei tegen haar: Er is nooit een scheermes op mijn hoofd gekomen, want ik ben een nazireeër van God vanaf de buik van mijn moeder af; als ik geschoren werd, zou mijn kracht van mij wijken, en ik zou zwak worden, en zijn als alle mensen.", "1 Kon 21:2": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven.", "Jona 2:1": "En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Matt 28:15": "En zij namen het geld, en deden zoals hun geleerd was. En dit verhaal is onder de Joden verspreid geraakt tot op deze huidige dag.", "Joz 8:34": "En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.", "Ex 22:7": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.", "1 Petr 1:14": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had;", "Richt 5:19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.", "Ps 35:4": "Laat hen beschaamd worden en te schande, die mijn ziel zoeken; laat hen achterwaarts gedreven worden en schaamrood, die kwaad tegen mij bedenken.", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Richt 16:1-20": "Simson ging weg naar Gaza; en hij zag daar een vrouw, die een hoer was; en hij ging naar haar toe. Toen werd aan de inwoners van Gaza gezegd: Simson is hier binnengekomen; zo gingen zij rondom, en legden hem de hele nacht een hinderlaag bij de stadspoort; maar zij hielden zich de hele nacht stil, en zeiden: Tot aan het morgenlicht, dan zullen wij hem doden. Maar Simson lag tot middernacht toe; toen stond hij op te middernacht, en hij greep de deuren van de stadspoort met de beide posten, en nam ze weg met de grendelboom, en legde ze op zijn schouders, en droeg ze omhoog naar de top van de berg, die tegenover Hebron ligt.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "Ps 88:2": "O HEERE, God van mijn heil! Bij dag, bij nacht roep ik voor U.", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "Joh 1:5": "En het Licht schijnt in de duisternis, en de duisternis heeft het niet begrepen.", "Fil 2:17": "Ja, ook al word ik tot een drankoffer geofferd over de offerande en bediening van uw geloof, dan verblijd ik mij, en verblijd ik mij met u allen.", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "Jes 1:3": "Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "Kol 3:9": "Lieg niet tegen elkaar, omdat u de oude mens met zijn werken hebt uitgedaan,", "Luk 11:52": "Wee u, wetgeleerden, want u hebt de sleutel van de kennis weggenomen; u zelf bent niet naar binnen gegaan, en hen die naar binnen gingen, hebt u tegengehouden.", "Klaagl 5:13": "Zij hebben de jongemannen weggenomen om te malen, en de jongens struikelden onder het hout.", "Hab 1:16": "Daarom offert hij aan zijn sleepnet, en brandt reukwerk aan zijn net; want daardoor is zijn deel vet geworden, en zijn voedsel smoutig.", "Micha 4:12": "Maar zij kennen de gedachten van de HEERE niet, en begrijpen Zijn raadsbesluit niet; dat Hij hen bijeengebracht heeft als schoven op de dorsvloer.", "2 Sam 16:22": "Zo spanden zij voor Absalom een tent op op het dak; en Absalom ging naar de bijvrouwen van zijn vader, voor de ogen van heel Israël.", "Richt 6:36-40": "En Gideon zei tegen God: Als U Israël door mijn hand zult verlossen, zoals U gesproken hebt, zie, ik zal een wollen vlies op de dorsvloer leggen; als er dauw op het vlies alleen zal zijn, en droogte op de hele aarde, dan zal ik weten dat U Israël door mijn hand zult verlossen, zoals U gesproken hebt. En het gebeurde zo; want hij stond de volgende morgen vroeg op, en kneep het vlies uit, en hij wrong de dauw uit het vlies, een schaal vol water.", "Hand 20:24": "Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.", "Spr 5:22": "De goddeloze zullen zijn eigen ongerechtigheden vangen, en met de banden van zijn zonden zal hij vastgehouden worden.", "1 Kon 21:6": "En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.", "Joh 3:4": "Nicodemus zei tegen Hem: Hoe kan een mens geboren worden als hij al oud is? Kan hij soms voor de tweede keer in de buik van zijn moeder ingaan en geboren worden?", "Pred 7:25": "Ik keerde mij om, en mijn hart, om te weten, en om na te sporen, en te zoeken wijsheid en een verklaring; en om te weten de goddeloosheid van de dwaasheid, en de onzinnigheid van de waanzin.", "Richt 13:7": "Maar Hij zei tegen mij: Zie, u zult zwanger worden en een zoon baren; drink dus nu geen wijn of sterke drank, en eet niets van het onreine; want dat jongetje zal een Nazireeër van God zijn, vanaf de moederschoot tot de dag van zijn dood.", "Jes 60:2": "Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden.", "Richt 14:16": "En de vrouw van Simson weende voor hem en zei: U haat mij maar, en hebt mij niet lief; u hebt de kinderen van mijn volk een raadsel te raden gegeven, en hebt het mij niet verklaard. En hij zei tegen haar: Zie, ik heb het mijn vader en mijn moeder niet verklaard, zou ik het u dan verklaren?", "Ps 25:3": "Gimel. Ja, allen die U verwachten, zullen niet beschaamd worden; zij zullen beschaamd worden, die trouweloos handelen zonder oorzaak.", "Matt 25:18": "Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.", "Ps 74:18-23": "Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd. Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig. Zie naar het verbond; want de duistere plaatsen van het land zijn vol woningen van geweld.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Job 21:4": "Is mijn klacht tot de mens? En al was het zo, waarom zou mijn geest niet verdrietig zijn?", "Hos 4:1": "Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is;", "2 Tim 3:7": "vrouwtjes die altijd leren, en nooit tot kennis van de waarheid kunnen komen.", "Gal 1:8": "Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Matt 28:12": "En zij kwamen samen met de oudsten, en namen samen een besluit, en gaven de soldaten veel geld,", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "Ps 54:7": "Hij zal dit kwaad aan mijn belagers vergelden; roei hen uit door Uw waarheid.", "Ex 32:32": "Nu dan, als Gij hun zonde wilt vergeven! Maar zo niet, delg mij dan nu uit Uw boek, dat Gij geschreven hebt.", "Spr 7:7-23": "En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling; Die voorbijging op de straat, naast haar hoek, en hij trad op de weg naar haar huis. In de schemering, in de avond van de dag, in de zwarte nacht en de donkerheid;", "Joh 3:19": "En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht.", "Jer 9:6": "Uw woning is in het midden van bedrog; door bedrog weigeren zij Mij te kennen, spreekt de HEERE.", "Luk 23:34": "En Jezus zei: Vader, vergeef het hun; want zij weten niet wat zij doen. En zij verdeelden Zijn kleren en wierpen erom het lot.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 70:4": "Laat hen terugkeren tot loon van hun beschaming, die daar zeggen: Ha, ha!", "2 Tim 4:15": "Wees ook u voor hem op uw hoede, want hij heeft onze woorden sterk tegengestaan.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Lev 27:18": "Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "Num 22:18": "Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.", "1 Sam 19:11": "Maar Saul zond boden naar Davids huis, om hem te bewaken, en om hem 's morgens te doden. Dit maakte Michal, zijn vrouw, aan David bekend, en zei: Als u vannacht uw leven niet redt, zult u morgen gedood worden.", "Spr 23:26": "Mijn zoon! geef mij uw hart, en laat uw ogen mijn wegen behartigen.", "Jer 5:21": "Hoor nu dit, dwaas en harteloos volk! die ogen hebben, maar niet zien, die oren hebben, maar niet horen.", "Jes 5:13": "Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Jes 42:18-20": "Hoort, u doven! En kijkt toe, u blinden, om te zien. Wie is er blind als Mijn knecht, en doof, zoals Mijn bode, die Ik zend? Wie is blind, zoals de volmaakte, en blind, zoals de knecht van de HEERE? U ziet wel veel dingen, maar u bewaart ze niet; en al doet hij de oren open, toch hoort hij niet.", "Joh 4:22": "U aanbidt wat u niet weet; wij aanbidden wat wij weten; want de zaligheid is uit de Joden.", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "1 Kor 8:4": "Wat betreft dan het eten van de dingen die aan de afgoden geofferd zijn: wij weten dat een afgod niets is in de wereld, en dat er geen andere God is dan Eén.", "Fil 2:8": "En in gedaante gevonden als een mens, heeft Hij Zichzelf vernederd, gehoorzaam geworden tot de dood, ja, de dood van het kruis.", "Ps 5:11": "Verklaar hen schuldig, o God; laat hen vervallen van hun raadslagen; drijf hen weg om de veelheid van hun overtredingen, want zij zijn opstandig tegen U.", "Ps 88:14": "Maar ik, HEERE, roep tot U, en mijn gebed komt U al voor in de morgenstond.", "Ps 69:25": "Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.", "Luk 11:5-8": "En Hij zei tegen hen: Wie van u zal een vriend hebben, en zal midden in de nacht naar hem toe gaan, en tegen hem zeggen: Vriend! leen mij drie broden; Omdat mijn vriend van de reis bij mij gekomen is, en ik heb niets, dat ik hem kan voorzetten; En dat die van binnen dan zou antwoorden en zeggen: Val mij niet lastig; de deur is al gesloten, en mijn kinderen zijn met mij in de slaapkamer; ik kan niet opstaan om u te geven.", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Job 30:9": "Maar nu ben ik hun een spotlied geworden, en ik ben hun tot een spreekwoord.", "Matt 21:38": "Maar toen de landbouwers de zoon zagen, zeiden zij onder elkaar: Deze is de erfgenaam, kom, laten we hem doden en zijn erfenis voor onszelf houden.", "Ps 35:8": "De verwoesting overkomt hem, zodat hij het niet weet, en zijn net, dat hij verborgen heeft, vangt hemzelf; hij valt daarin met verwoesting.", "Joh 8:54": "Jezus antwoordde: Als Ik Mijzelf eer, is Mijn eer niets; Mijn Vader is het, Die Mij eert, van Wie u zegt dat Hij uw God is.", "Deut 22:8": "Wanneer u een nieuw huis bouwt, zult u op uw dak een leuning maken; opdat u geen bloedschuld op uw huis legt, wanneer iemand ervan afvalt.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Lev 22:11": "Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.", "Matt 15:22-28": "En zie, een Kananese vrouw, die uit die omgeving kwam, riep tot Hem en zei: Heere! U Zoon van David, ontferm U over mij! mijn dochter is ernstig door de duivel bezeten. Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na. Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Micha 4:5": "Want alle volken zullen wandelen, ieder in de naam van zijn god; maar wij zullen wandelen in de Naam van de HEERE, onze God, eeuwig en altijd.", "Richt 16:4-18": "En daarna gebeurde het, dat hij een vrouw lief kreeg, bij de beek Sorek, wier naam Delila was. Toen kwamen de vorsten van de Filistijnen naar haar toe, en zeiden tegen haar: Overreed hem, en zie waarin zijn grote kracht ligt, en waarmee wij hem machtig zouden kunnen worden, en hem binden, om hem te onderwerpen; dan zullen wij u geven, ieder, duizend en honderd zilverstukken. Delila dan zei tegen Simson: Vertel mij toch, waarin uw grote kracht ligt, en waarmee u gebonden zou kunnen worden, zodat men u kan onderwerpen.", "Joh 12:38-41": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard? Daarom konden zij niet geloven, omdat Jesaja opnieuw gezegd heeft: Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Richt 15:18": "Toen hij nu erge dorst had, riep hij tot de HEERE, en zei: U hebt door de hand van Uw knecht dit grote heil gegeven; zou ik dan nu van dorst sterven, en vallen in de hand van deze onbesnedenen?", "1 Sam 19:17": "Toen zei Saul tegen Michal: Waarom hebt u mij zo bedrogen en mijn vijand laten gaan, zodat hij ontkomen is? Michal nu zei tegen Saul: Hij zei tegen mij: Laat mij gaan, waarom zou ik u doden?", "Mark 4:15": "En dezen zijn zij die langs de weg bezaaid worden, waarin het Woord gezaaid wordt; en wanneer zij het gehoord hebben, komt de satan meteen, en neemt het Woord weg, dat in hun hart gezaaid was.", "2 Sam 11:2": "Zo gebeurde het tegen de avondtijd, dat David van zijn bed opstond, en wandelde op het dak van het koningshuis, en zag van het dak een vrouw die zich waste; deze vrouw nu was zeer schoon van uiterlijk.", "Jes 38:2": "Toen keerde Hizkia zijn gezicht om naar de wand, en hij bad tot de HEERE.", "Hebr 12:1-4": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is; Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God. Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "1 Joh 2:9": "Wie zegt, dat hij in het licht is, en zijn broeder haat, die is tot nu toe in de duisternis.", "Hand 23:15": "Laat u dan nu, samen met de raad, de aanvoerder weten dat hij hem morgen naar u toe brengt, alsof u nadere kennis van zijn zaak zou willen nemen; en wij zijn bereid om hem te doden voordat hij bij u komt.", "Ps 94:8": "Let op, u onverstandigen onder het volk! En u dwazen! Wanneer zult u verstandig worden?", "Ps 55:17": "Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.", "Ps 119:58": "Ik heb Uw aanschijn met ernst gebeden van ganser harte, wees mij genadig naar Uw toezegging.", "Jer 12:3": "Maar U, HEERE, kent mij, U ziet mij, en proeft mijn hart, dat het met U is. Ruk hen uit als schapen ter slachting, en heilig hen tot de dag van de doding.", "Spr 24:28": "Wees niet zonder reden getuige tegen uw naaste; want zou u misleiden met uw lip?", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "2 Kon 22:9": "Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE.", "Jer 9:4-6": "Wacht u, ieder voor zijn vriend, en vertrouw niet op enige broeder; want elke broeder doet niet dan bedriegen, en elke vriend gaat om met achterklap. En zij bedriegen, ieder zijn vriend, en spreken de waarheid niet; zij leren hun tong leugen spreken, zij maken zich moe met verkeerd te handelen. Uw woning is in het midden van bedrog; door bedrog weigeren zij Mij te kennen, spreekt de HEERE.", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "Matt 13:13-16": "Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken. Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Matt 26:15": "en zei: Wat wilt u mij geven, en ik zal Hem aan u overleveren? En zij hebben hem dertig zilveren munten toegezegd.", "Ps 14:1": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet.", "1 Sam 18:12": "En Saul vreesde voor David, want de HEERE was met hem, en Hij was van Saul geweken.", "Job 30:10": "Zij hebben een afschuw van mij, zij houden zich ver van mij, ja, zij weerhouden zich er niet van om voor mijn aangezicht te spugen.", "Hand 21:13": "Maar Paulus antwoordde: Wat doet u, dat u weent en mijn hart week maakt? Want ik ben bereid niet alleen gebonden te worden, maar ook te sterven te Jeruzalem, voor de Naam van de Heere Jezus.", "Hos 5:4": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet.", "Ps 22:20": "Maar U, HEERE! Wees niet ver; mijn Sterkte! Haast U tot mijn hulp.", "1 Sam 29:7": "Keer nu dan om en ga in vrede, opdat u geen kwaad doet in de ogen van de vorsten van de Filistijnen.", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Est 3:15": "De lopers gingen uit, aangespoord door het woord van de koning, en de wet werd uitgegeven in de burcht Susan. En de koning en Haman gingen zitten om te drinken, doch de stad Susan was in verwarring.", "Joz 19:41": "En het gebied van hun erfdeel was: Zora, en Esthaol, en Ir-semes,", "Ps 40:13": "Want kwaden, tot zonder getal toe, hebben mij omgeven; mijn ongerechtigheden hebben mij aangegrepen, zodat ik niet heb kunnen zien; ze zijn menigvuldiger dan de haren van mijn hoofd, en mijn hart heeft mij verlaten.", "Joh 17:25": "Rechtvaardige Vader, de wereld heeft U niet gekend; maar Ik heb U gekend, en dezen hebben erkend dat U Mij gezonden hebt.", "Ps 107:10-12": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer; Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden. Daarom heeft Hij hun hart door zwarigheid vernederd; zij zijn gestruikeld, en er was geen helper.", "Ps 88:10": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit.", "Spr 14:14": "Wie afvallig van hart is, zal verzadigd worden van zijn eigen wegen; maar een goed man van zichzelf.", "Jer 39:7": "En hij verblindde de ogen van Zedekia, en bond hem met twee koperen ketenen, om hem naar Babel te voeren.", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "Fil 2:30": "Want om het werk van Christus is hij dicht bij de dood gekomen, terwijl hij zijn leven niet ontzag, opdat hij het gebrek van uw bediening aan mij zou aanvullen.", "Ps 143:12": "En roei mijn vijanden uit, om Uw goedertierenheid, en breng hen om, allen die mijn ziel beangstigen; want ik ben Uw knecht.", "Micha 2:13": "De doorbreker zal voor hen uittrekken; zij zullen doorbreken en door de poort gaan, en daardoor naar buiten trekken; en hun koning zal voor hen uit heengaan, en de HEERE aan hun spits.", "Luk 8:12": "Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden.", "Kol 2:14": "Hij heeft het handschrift uitgewist dat tegen ons was, bestaande in inzettingen, dat ons op enigerlei wijze tegenwerkte, en Hij heeft dat uit het midden weggenomen door het aan het kruis te nagelen;", "Joh 4:11": "De vrouw zei tegen Hem: Heere, U hebt niets om mee te putten, en de put is diep; waar hebt U dan het levende water vandaan?", "1 Joh 4:8": "Wie niet liefheeft, kent God niet; want God is liefde.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "Luk 12:48": "Maar wie het niet geweten heeft, en dingen gedaan heeft die slagen verdienen, die zal met weinig slagen geslagen worden. En ieder aan wie veel gegeven is, van hem zal veel geëist worden; en aan wie men veel toevertrouwd heeft, van hem zal men des te meer eisen.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "Num 24:10": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend!", "Ps 106:45": "En Hij dacht tot hun voordeel aan Zijn verbond, en het berouwde Hem naar de veelheid van Zijn blijken van goedertierenheid.", "Richt 17:2": "Die zei tegen zijn moeder: De duizend en honderd zilverlingen, die u ontnomen zijn, waarom u gevloekt hebt, en ook voor mijn oren gesproken hebt, zie, dat geld is bij mij, ik heb dat genomen. Toen zei zijn moeder: Gezegend zij mijn zoon door de HEERE!", "Luk 22:5": "En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.", "Spr 17:16": "Waarom toch zou de dwaas geld in zijn hand hebben, om wijsheid te kopen, terwijl hij geen verstand heeft?", "Jer 9:3": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Matt 23:26": "Blinde Farizeeër, reinig eerst wat binnen in de drinkbeker en de schotel is, opdat ook de buitenkant daarvan rein wordt.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Matt 14:7": "Daarom beloofde hij haar met een eed te geven wat zij ook zou vragen.", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "Ps 95:10": "Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd: Zij zijn een volk dat dwaalt van hart, en zij kennen Mijn wegen niet.", "Ps 109:9-20": "Laat zijn kinderen wezen worden, en zijn vrouw weduwe. En laat zijn kinderen hier en daar omzwerven, en bedelen, en de nooddruft uit hun verwoeste plaatsen zoeken. Laat de schuldeiser aanslaan al wat hij heeft, en laat de vreemden zijn arbeid roven.", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "Jes 27:11": "Als haar takken verdord zijn, zullen ze afgebroken worden, en de vrouwen zullen komen en ze aansteken; want het is een volk zonder enig verstand; daarom zal Hij, Die het gemaakt heeft, Zich niet over hen ontfermen, en Die het geformeerd heeft, zal hun geen genade bewijzen.", "Num 14:9": "Wees alleen niet opstandig tegen de HEERE! En vrees het volk van dit land niet; want zij zijn ons brood! Hun bescherming is van hen geweken, en de HEERE is met ons; vrees hen niet!", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "Gal 6:7": "Dwaal niet; God laat Zich niet bespotten; want wat de mens ook zaait, dat zal hij ook maaien.", "2 Petr 1:9": "Want bij wie deze dingen niet aanwezig zijn, die is blind, kan niet ver zien, en is vergeten dat hij gereinigd is van zijn vroegere zonden.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Spr 19:3": "De dwaasheid van de mens verdraait zijn weg; en zijn hart is boos op de HEERE.", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Ps 107:16": "Want Hij heeft de koperen deuren gebroken, en de ijzeren grendels in stukken gehouwen.", "1 Sam 6:12": "De koeien nu gingen recht op die weg, op de weg naar Beth-Semes op één straat; zij gingen steeds voort, al loeiend, en weken noch naar rechts noch naar links af; en de vorsten van de Filistijnen gingen achter hen aan tot aan het gebied van Beth-Semes.", "Job 3:1-10": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Jona 1:14": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd.", "1 Sam 5:2-5": "En de Filistijnen namen de ark van God, en zij brachten die in het huis van Dagon, en zetten die naast Dagon. Maar toen die van Asdod de volgende dag vroeg opstonden, zie, toen was Dagon voorover op de aarde gevallen voor de ark van de HEERE. En zij namen Dagon en zetten hem weer op zijn plaats. Toen zij nu de volgende dag 's morgens vroeg opstonden, zie, Dagon lag voorover op de aarde gevallen voor de ark van de HEERE; maar het hoofd van Dagon, en de beide palmen van zijn handen, afgehouwen, lagen bij de drempel; alleen de romp van Dagon was ervan overgebleven.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "1 Kor 2:14": "Maar de natuurlijke mens begrijpt niet de dingen die van de Geest van God zijn; want ze zijn hem dwaasheid, en hij kan ze niet verstaan, omdat ze geestelijk beoordeeld worden.", "Jes 42:24": "Wie heeft Jakob tot een plundering overgegeven, en Israël aan de rovers? Is het niet de HEERE, Hij, tegen Wie wij gezondigd hebben? Want zij wilden niet wandelen in Zijn wegen, en zij luisterden niet naar Zijn wet.", "Jes 37:20": "Nu dan, HEERE, onze God, verlos ons uit zijn hand, zodat alle koninkrijken van de aarde weten dat U alleen de HEERE bent.", "Spr 7:21-23": "Zij bewoog hem door de veelheid van haar onderricht, zij dreef hem aan door het gevlei van haar lippen. Hij ging haar meteen achterna, zoals een os naar de slachting gaat, en zoals een dwaas naar de bestraffing van de boeien. Totdat de pijl zijn lever doorsneed; zoals een vogel zich haast naar de strik, en niet weet dat die tegen zijn leven is.", "Num 16:15": "Toen ontstak Mozes zeer, en hij zei tegen de HEERE: Zie hun offer niet aan! Ik heb niet één ezel van hen genomen, en niemand van hen kwaad gedaan.", "1 Kor 10:20": "Nee, maar ik zeg dat wat de heidenen offeren, zij dat aan de duivelen offeren en niet aan God; en ik wil niet dat u gemeenschap hebt met de duivelen.", "Jer 4:22": "Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.", "Joz 15:47": "Asdod, haar onderhorige plaatsen en haar dorpen; Gaza, haar onderhorige plaatsen en haar dorpen, tot aan de rivier van Egypte; en de grote zee, en haar gebied.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "1 Sam 5:8": "Daarom zonden zij heen, en verzamelden bij zich alle vorsten van de Filistijnen, en zij zeiden: Wat zullen wij met de ark van de God van Israël doen? En die zeiden: Laat de ark van de God van Israël naar Gath gebracht worden. Zo brachten zij de ark van de God van Israël daarheen.", "Joh 8:43": "Waarom begrijpt u Mijn spraak niet? Het is omdat u Mijn woord niet kunt horen.", "Tit 1:16": "Zij belijden dat zij God kennen, maar zij verloochenen Hem met hun werken, omdat zij verfoeilijk zijn en ongehoorzaam, en voor elk goed werk ongeschikt.", "Dan 5:4": "Zij dronken de wijn, en prezen de gouden, zilveren, koperen, ijzeren, houten en stenen goden.", "Ezra 9:5": "En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God;", "Spr 6:24-26": "om u te bewaren voor de slechte vrouw, voor het gevlei van de tong van de vreemde vrouw. Begeer haar schoonheid niet in uw hart, en laat u door haar niet vangen met haar oogleden. Want door een vrouw die een hoer is, komt men tot een stuk brood; en de huisvrouw van een andere man jaagt op het kostbare leven.", "Num 23:7": "Toen begon hij zijn spreuk, en zei: Uit Syrië heeft Balak, de koning van de Moabieten, mij laten halen, van het gebergte in het oosten, en zei: Kom, vervloek Jakob voor mij, en kom, scheld Israël uit!", "Deut 9:25": "En ik wierp mij neer voor het aangezicht van de HEERE, die veertig dagen en veertig nachten waarin ik mij neerwierp, omdat de HEERE gezegd had dat Hij u verdelgen zou.", "Ps 22:3": "Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte.", "Richt 13:25": "En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Spr 19:2": "Ook is het niet goed als de ziel zonder kennis is; en die met de voeten haastig is, zondigt.", "Jer 8:7-9": "Zelfs een ooievaar aan de hemel kent zijn vaste tijden, en een tortelduif, en kraanvogel, en zwaluw, nemen de tijd van hun aankomst waar; maar Mijn volk kent het recht van de HEERE niet. Hoe zegt u dan: Wij zijn wijs en de wet van de HEERE is bij ons! Zie, waarlijk, tevergeefs werkt de valse pen van de schriftgeleerden. De wijzen zijn beschaamd, verschrikt en gevangen; zie, zij hebben het woord van de HEERE verworpen; wat wijsheid zouden zij dan hebben?", "Ezra 9:1": "Toen deze dingen voltooid waren, kwamen de vorsten naar mij toe en zeiden: Het volk van Israël, en de priesters, en de Levieten, hebben zich niet afgezonderd van de volken van deze landen, naar hun gruwelen, namelijk van de Kanaänieten, de Hethieten, de Ferezieten, de Jebusieten, de Ammonieten, de Moabieten, de Egyptenaren en de Amorieten.", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "Ps 59:12": "Dood hen niet, opdat mijn volk het niet vergeet; laat hen omzwerven door Uw macht, en werp hen neer, o Heere, ons Schild!", "Joh 9:29-39": "Wij weten dat God tot Mozes gesproken heeft; maar van Deze weten wij niet vanwaar Hij is. De man antwoordde en zei tegen hen: Hierin zit toch iets wonderlijks, dat u niet weet vanwaar Hij is, en Hij heeft toch mijn ogen geopend. En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.", "Ps 10:5": "Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.", "Matt 5:15": "Ook steekt men geen kaars aan om die onder een korenmaat te zetten, maar op een kandelaar, en zij schijnt voor allen die in het huis zijn.", "Num 22:6-11": "En nu, kom toch, vervloek voor mij dit volk, want het is machtiger dan ik; misschien kan ik het dan verslaan, of uit het land verdrijven; want ik weet dat wie u zegent, gezegend is, en wie u vervloekt, vervloekt is. Toen gingen de oudsten van Moab en de oudsten van Midian, met het loon voor de waarzeggerij in hun hand; zo kwamen zij bij Bileam, en spraken tot hem de woorden van Balak. Hij zei toen tegen hen: Overnacht hier deze nacht, dan zal ik u een antwoord terugbrengen, zoals de HEERE tot mij zal gesproken hebben. Toen bleven de vorsten van Moab bij Bileam.", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Hebr 2:15": "en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren.", "1 Sam 11:2": "Maar Nahas, de Ammoniet, zei tegen hen: Op deze voorwaarde zal ik een verbond met u sluiten, dat ik bij u allen het rechteroog uitsteek, en dat ik deze schande op heel Israël leg.", "Ps 61:2": "O God! hoor mijn geschrei, merk op mijn gebed.", "1 Sam 9:25": "Daarna gingen zij van de hoogte af naar de stad; en hij sprak met Saul op het dak.", "Richt 13:24": "Daarna baarde deze vrouw een zoon, en zij noemde hem Simson; en dat jongetje werd groot, en de HEERE zegende hem.", "Num 6:3": "Van wijn en sterke drank zal hij zich afzonderen; wijnazijn en azijn van sterke drank zal hij niet drinken, ook geen vocht van druiven zal hij drinken, en geen verse of gedroogde druiven eten.", "Ps 55:3": "Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier;", "1 Tess 4:4": "Dat ieder van u weet zijn eigen lichaam te bezitten in heiliging en eer;", "Joh 1:10": "Hij was in de wereld, en de wereld is door Hem gemaakt; en de wereld heeft Hem niet gekend.", "Richt 16:23-25": "Toen verzamelden de vorsten van de Filistijnen zich, om hun god Dagon een groot offer te brengen, en tot vrolijkheid; en zij zeiden: Onze god heeft onze vijand Simson in onze hand gegeven. Toen het volk hem zag, loofden zij hun god, want zij zeiden: Onze god heeft onze vijand in onze hand gegeven, die ons land verwoestte, en die velen van ons doodde! En het gebeurde, toen hun hart vrolijk was, dat zij zeiden: Roept Simson, dat hij voor ons speelt. En zij riepen Simson uit de gevangenis; en hij speelde voor hun aangezicht, en zij lieten hem staan tussen de pilaren.", "1 Kon 11:1": "En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen;", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "Ps 130:2": "Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen.", "1 Kor 1:21": "Want omdat de wereld God, in de wijsheid van God, niet door de wijsheid heeft gekend, heeft het God behaagd om door de dwaasheid van de prediking zalig te maken hen die geloven;", "Luk 11:8": "Ik zeg u: Al zou hij niet opstaan en het hem geven omdat hij zijn vriend is, toch zal hij, om zijn onbeschaamdheid, opstaan en hem geven zoveel als hij nodig heeft.", "Ps 31:18": "HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.", "Ps 140:11": "Vurige kolen moeten op hen geschud worden; Hij doet hen vallen in het vuur, in diepe kuilen, zodat zij niet meer opstaan.", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Ps 31:19": "Laat de valse lippen stom worden, die hard spreken tegen de rechtvaardige, in hoogmoed en verachting.", "Luk 22:48": "En Jezus zei tegen hem: Judas, verraadt u de Zoon des mensen met een kus?", "Deut 32:27": "Ware het niet, dat Ik de toorn van de vijand vreesde, dat hun tegenpartijen zich niet vreemd zouden houden; dat zij niet zouden zeggen: Onze hand is hoog geweest; de HEERE heeft dit alles niet gedaan.", "2 Kron 24:5": "Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levie
