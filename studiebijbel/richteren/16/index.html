code=\"H2677\">midnight,</span> and <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> at <span class=\"wl wl-kjv\" data-code=\"H2677\">midnight,</span> and <span class=\"wl wl-kjv\" data-code=\"H270\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">doors</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H4201\">posts,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5265\">away</span> with them, <span class=\"wl wl-kjv\" data-code=\"H1280\">bar</span> and all, and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> them upon his <span class=\"wl wl-kjv\" data-code=\"H3802\">shoulders,</span> and carried them <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of an <span class=\"wl wl-kjv\" data-code=\"H2022\">hill</span> that is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Hebron.", "4": "And it came to pass <span class=\"wl wl-kjv\" data-code=\"H310\">afterward,</span> that he <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> in the <span class=\"wl wl-kjv\" data-code=\"H5158\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H7796\">Sorek,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was Delilah.", "5": "And the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto her, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H6601\">Entice</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> wherein his <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> lieth, and by what means we may <span class=\"wl wl-kjv\" data-code=\"H3201\">prevail</span> against him, that we may <span class=\"wl wl-kjv\" data-code=\"H631\">bind</span> him to <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> him: and we will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of us eleven <span class=\"wl wl-kjv\" data-code=\"H505\">hundred</span> pieces of silver.", "6": "And <span class=\"wl wl-kjv\" data-code=\"H1807\">Delilah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">Tell</span> me, I pray thee, wherein thy <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> lieth, and wherewith thou mightest be <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> to afflict", "7": "And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, If they <span class=\"wl wl-kjv\" data-code=\"H631\">bind</span> me with <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3892\">green</span> <span class=\"wl wl-kjv\" data-code=\"H3499\">withs</span> that were never <span class=\"wl wl-kjv\" data-code=\"H2717\">dried,</span> then shall I be <span class=\"wl wl-kjv\" data-code=\"H2470\">weak,</span> and be as <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> man.", "8": "Then the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to her <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3892\">green</span> <span class=\"wl wl-kjv\" data-code=\"H3499\">withs</span> which had not been <span class=\"wl wl-kjv\" data-code=\"H2717\">dried,</span> and she bound", "9": "Now there were men lying in <span class=\"wl wl-kjv\" data-code=\"H693\">wait,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abiding</span> with her in the <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber.</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, The <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> be upon thee, <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson.</span> And he <span class=\"wl wl-kjv\" data-code=\"H5423\">brake</span> the <span class=\"wl wl-kjv\" data-code=\"H3499\">withs,</span> as a <span class=\"wl wl-kjv\" data-code=\"H6616\">thread</span> of <span class=\"wl wl-kjv\" data-code=\"H5296\">tow</span> is <span class=\"wl wl-kjv\" data-code=\"H5423\">broken</span> when it <span class=\"wl wl-kjv\" data-code=\"H7306\">toucheth</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire.</span> So his <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> was not known.", "10": "And <span class=\"wl wl-kjv\" data-code=\"H1807\">Delilah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson,</span> Behold, thou hast <span class=\"wl wl-kjv\" data-code=\"H2048\">mocked</span> me, and <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> me <span class=\"wl wl-kjv\" data-code=\"H3577\">lies:</span> now <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, I pray thee, wherewith thou mightest be bound.", "11": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, If they <span class=\"wl wl-kjv\" data-code=\"H631\">bind</span> me <span class=\"wl wl-kjv\" data-code=\"H631\">fast</span> with <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H5688\">ropes</span> that never were <span class=\"wl wl-kjv\" data-code=\"H4399\">occupied,</span> then shall I be <span class=\"wl wl-kjv\" data-code=\"H2470\">weak,</span> and be as <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> man.", "12": "<span class=\"wl wl-kjv\" data-code=\"H1807\">Delilah</span> therefore <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H5688\">ropes,</span> and <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> him therewith, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, The <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> be upon thee, <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson.</span> And there were liers in <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abiding</span> in the <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber.</span> And he <span class=\"wl wl-kjv\" data-code=\"H5423\">brake</span> them from off his <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> like a thread.", "13": "And <span class=\"wl wl-kjv\" data-code=\"H1807\">Delilah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson,</span> <span class=\"wl wl-kjv\" data-code=\"H2008\">Hitherto</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H2048\">mocked</span> me, and <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> me <span class=\"wl wl-kjv\" data-code=\"H3577\">lies:</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me wherewith thou mightest be <span class=\"wl wl-kjv\" data-code=\"H631\">bound.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, If thou <span class=\"wl wl-kjv\" data-code=\"H707\">weavest</span> the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H4253\">locks</span> of my <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> with the web.", "14": "And she <span class=\"wl wl-kjv\" data-code=\"H8628\">fastened</span> it with the <span class=\"wl wl-kjv\" data-code=\"H3489\">pin,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, The <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> be upon thee, <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3364\">awaked</span> out of his <span class=\"wl wl-kjv\" data-code=\"H8142\">sleep,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5265\">away</span> with the <span class=\"wl wl-kjv\" data-code=\"H3489\">pin</span> of the <span class=\"wl wl-kjv\" data-code=\"H708\">beam,</span> and with the web.", "15": "And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H349\">How</span> canst thou <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> thee, when thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is not with me? thou hast <span class=\"wl wl-kjv\" data-code=\"H2048\">mocked</span> me these <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times,</span> and hast not <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> me wherein thy <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> strength", "16": "And it came to pass, when she <span class=\"wl wl-kjv\" data-code=\"H6693\">pressed</span> him <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> with her <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> and <span class=\"wl wl-kjv\" data-code=\"H509\">urged</span> him, so that his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> was <span class=\"wl wl-kjv\" data-code=\"H7114\">vexed</span> unto death;", "17": "That he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> her all his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, There hath not <span class=\"wl wl-kjv\" data-code=\"H5927\">come</span> a <span class=\"wl wl-kjv\" data-code=\"H4177\">razor</span> upon mine <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> for I have been a <span class=\"wl wl-kjv\" data-code=\"H5139\">Nazarite</span> unto <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> from my <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H990\">womb:</span> if I be <span class=\"wl wl-kjv\" data-code=\"H1548\">shaven,</span> then my <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> will <span class=\"wl wl-kjv\" data-code=\"H5493\">go</span> from me, and I shall become <span class=\"wl wl-kjv\" data-code=\"H2470\">weak,</span> and be like any other man.", "18": "And when <span class=\"wl wl-kjv\" data-code=\"H1807\">Delilah</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that he had <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> her all his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> she <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> this <span class=\"wl wl-kjv\" data-code=\"H6471\">once,</span> for he hath <span class=\"wl wl-kjv\" data-code=\"H5046\">shewed</span> me all his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart.</span> Then the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto her, and <span class=\"wl wl-kjv\" data-code=\"H5927\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> in their hand.", "19": "And she made him <span class=\"wl wl-kjv\" data-code=\"H3462\">sleep</span> upon her <span class=\"wl wl-kjv\" data-code=\"H1290\">knees;</span> and she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for a <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and she caused him to shave <span class=\"wl wl-kjv\" data-code=\"H1548\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H4253\">locks</span> of his <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> and she <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> to <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> him, and his <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> went", "20": "And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> be upon thee, <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3364\">awoke</span> out of his <span class=\"wl wl-kjv\" data-code=\"H8142\">sleep,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> as at other times <span class=\"wl wl-kjv\" data-code=\"H6471\">before,</span> and <span class=\"wl wl-kjv\" data-code=\"H5287\">shake</span> myself. And he <span class=\"wl wl-kjv\" data-code=\"H3045\">wist</span> not that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was departed", "21": "But the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H270\">took</span> him, and put <span class=\"wl wl-kjv\" data-code=\"H5365\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and brought him <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H5804\">Gaza,</span> and <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> him with fetters of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass;</span> and he did <span class=\"wl wl-kjv\" data-code=\"H2912\">grind</span> in the <span class=\"wl wl-kjv\" data-code=\"H631\">prison</span> house.", "22": "Howbeit the <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> of his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> to grow <span class=\"wl wl-kjv\" data-code=\"H6779\">again</span> <span class=\"wl wl-kjv\" data-code=\"H834\">after</span> he was shaven.", "23": "Then the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> gathered them <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> for to <span class=\"wl wl-kjv\" data-code=\"H2076\">offer</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> unto <span class=\"wl wl-kjv\" data-code=\"H1712\">Dagon</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">god,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8057\">rejoice:</span> for they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Our <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> our <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> into our hand.", "24": "And when the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him, they <span class=\"wl wl-kjv\" data-code=\"H1984\">praised</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">god:</span> for they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Our <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into our <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> our <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2717\">destroyer</span> of our <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> which <span class=\"wl wl-kjv\" data-code=\"H2491\">slew</span> many", "25": "And it came to pass, when their <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> were <span class=\"wl wl-kjv\" data-code=\"H2896\">merry,</span> that they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> for <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson,</span> that he may make us <span class=\"wl wl-kjv\" data-code=\"H7832\">sport.</span> And they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> out of the <span class=\"wl wl-kjv\" data-code=\"H631\">prison</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and he made <span class=\"wl wl-kjv\" data-code=\"H6440\">them</span> <span class=\"wl wl-kjv\" data-code=\"H6711\">sport:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> him between the pillars.", "26": "And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> that <span class=\"wl wl-kjv\" data-code=\"H2388\">held</span> him by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> <span class=\"wl wl-kjv\" data-code=\"H3240\">Suffer</span> me that I may <span class=\"wl wl-kjv\" data-code=\"H4184\">feel</span> the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> whereupon the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H3559\">standeth,</span> that I may lean", "27": "Now the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> was <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> were there; and there were upon the <span class=\"wl wl-kjv\" data-code=\"H1406\">roof</span> about <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> that <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld</span> while <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> made sport.", "28": "And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> me, I pray thee, and <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthen</span> me, I pray thee, only this <span class=\"wl wl-kjv\" data-code=\"H6471\">once,</span> O <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that I may be at <span class=\"wl wl-kjv\" data-code=\"H259\">once</span> <span class=\"wl wl-kjv\" data-code=\"H5358\">avenged</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> for my <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> eyes.", "29": "And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> took <span class=\"wl wl-kjv\" data-code=\"H3943\">hold</span> of the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">middle</span> <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> upon which the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H3559\">stood,</span> and on which it was borne <span class=\"wl wl-kjv\" data-code=\"H5564\">up,</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> with his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> with his left.", "30": "And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let me <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> with the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span> And he <span class=\"wl wl-kjv\" data-code=\"H5186\">bowed</span> himself with all his <span class=\"wl wl-kjv\" data-code=\"H3581\">might;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords,</span> and upon all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were therein. So the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> which he <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> at his <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> were <span class=\"wl wl-kjv\" data-code=\"H7227\">more</span> than they which he <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> in his life.", "31": "Then his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">took</span> him, and brought him <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him between <span class=\"wl wl-kjv\" data-code=\"H6881\">Zorah</span> and <span class=\"wl wl-kjv\" data-code=\"H847\">Eshtaol</span> in the <span class=\"wl wl-kjv\" data-code=\"H6913\">buryingplace</span> of <span class=\"wl wl-kjv\" data-code=\"H4495\">Manoah</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span> And he <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> years."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
