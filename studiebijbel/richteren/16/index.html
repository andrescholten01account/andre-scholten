":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Simson ging weg naar Gaza; en hij zag daar een vrouw, die een hoer was; en hij ging naar haar toe.","2":"Toen werd aan de inwoners van Gaza gezegd: Simson is hier binnengekomen; zo gingen zij rondom, en legden hem de hele nacht een hinderlaag bij de stadspoort; maar zij hielden zich de hele nacht stil, en zeiden: Tot aan het morgenlicht, dan zullen wij hem doden.","3":"Maar Simson lag tot middernacht toe; toen stond hij op te middernacht, en hij greep de deuren van de stadspoort met de beide posten, en nam ze weg met de grendelboom, en legde ze op zijn schouders, en droeg ze omhoog naar de top van de berg, die tegenover Hebron ligt.","4":"En daarna gebeurde het, dat hij een vrouw lief kreeg, bij de beek Sorek, wier naam Delila was.","5":"Toen kwamen de vorsten van de Filistijnen naar haar toe, en zeiden tegen haar: Overreed hem, en zie waarin zijn grote kracht ligt, en waarmee wij hem machtig zouden kunnen worden, en hem binden, om hem te onderwerpen; dan zullen wij u geven, ieder, duizend en honderd zilverstukken.","6":"Delila dan zei tegen Simson: Vertel mij toch, waarin uw grote kracht ligt, en waarmee u gebonden zou kunnen worden, zodat men u kan onderwerpen.","7":"En Simson zei tegen haar: Als zij mij binden met zeven verse pezen, die niet verdroogd zijn, dan zou ik zwak worden, en zijn als een ander mens.","8":"Toen brachten de vorsten van de Filistijnen haar zeven verse pezen, die niet verdroogd waren; en zij bond hem daarmee.","9":"De hinderlaag zat bij haar in een kamer. Zo zei zij tegen hem: De Filistijnen over u, Simson! Toen verbrak hij de pezen, zoals een sliertje grof vlas verbroken wordt, als het vuur het raakt. Zo werd zijn kracht niet bekend.","10":"Toen zei Delila tegen Simson: Zie, u hebt met mij gespot, en leugens tegen mij gesproken; vertel mij toch nu, waarmee u gebonden zou kunnen worden.","11":"En hij zei tegen haar: Als zij mij stevig vastbinden met nieuwe touwen, waarmee geen werk gedaan is, dan zou ik zwak worden, en zijn als een ander mens.","12":"Toen nam Delila nieuwe touwen, en bond hem daarmee, en zei tegen hem: De Filistijnen over u, Simson! (De hinderlaag zat namelijk in een kamer.) Toen verbrak hij ze van zijn armen als een draad.","13":"En Delila zei tegen Simson: Tot nu toe hebt u met mij gespot, en leugens tegen mij gesproken; vertel mij *toch* *nu*, waarmee u gebonden zou kunnen worden. En hij zei tegen haar: Als u de zeven haarlokken van mijn hoofd zou vlechten met een weefsel op een weversboom.","14":"En zij maakte ze vast met een pin, en zei tegen hem: De Filistijnen over u, Simson! Toen werd hij wakker uit zijn slaap, en nam de pin van het weefsel weg, en de weversboom.","15":"Toen zei zij tegen hem: Hoe kunt u zeggen: Ik heb u lief, terwijl uw hart niet bij mij is? U hebt nu driemaal met mij gespot, en mij niet verteld waarin uw grote kracht ligt.","16":"En het gebeurde, toen zij hem alle dagen met haar woorden onder druk zette, en hem lastigviel, dat zijn ziel verdrietig werd tot de dood toe;","17":"Zo maakte hij haar zijn hele hart bekend, en zei tegen haar: Er is nooit een scheermes op mijn hoofd gekomen, want ik ben een nazireeër van God vanaf de buik van mijn moeder af; als ik geschoren werd, zou mijn kracht van mij wijken, en ik zou zwak worden, en zijn als alle mensen.","18":"Toen Delila nu zag, dat hij haar zijn hele hart bekend had gemaakt, zond zij mensen weg, en riep de vorsten van de Filistijnen, en zei: Komt ditmaal, want hij heeft mij zijn hele hart bekendgemaakt. En de vorsten van de Filistijnen kwamen naar haar toe, en brachten dat geld in hun hand.","19":"Toen liet zij hem slapen op haar knieën, en riep een man, en liet hem de zeven haarlokken van zijn hoofd afscheren, en zij begon hem te onderwerpen; en zijn kracht week van hem.","20":"En zij zei: De Filistijnen over u, Simson! En hij werd wakker uit zijn slaap, en zei: Ik zal ditmaal uitgaan, zoals de andere keren, en mij uitschudden; want hij wist niet, dat de HEERE van hem geweken was.","21":"Toen grepen de Filistijnen hem, en groeven zijn ogen uit; en zij voerden hem af naar Gaza, en bonden hem met twee koperen ketenen, en hij moest malen in de gevangenis.","22":"En het haar van zijn hoofd begon *weer* te groeien, zoals toen hij geschoren werd.","23":"Toen verzamelden de vorsten van de Filistijnen zich, om hun god Dagon een groot offer te brengen, en tot vrolijkheid; en zij zeiden: Onze god heeft onze vijand Simson in onze hand gegeven.","24":"Toen het volk hem zag, loofden zij hun god, want zij zeiden: Onze god heeft onze vijand in onze hand gegeven, die ons land verwoestte, en die velen van ons doodde!","25":"En het gebeurde, toen hun hart vrolijk was, dat zij zeiden: Roept Simson, dat hij voor ons speelt. En zij riepen Simson uit de gevangenis; en hij speelde voor hun aangezicht, en zij lieten hem staan tussen de pilaren.","26":"Toen zei Simson tegen de jongen, die hem bij de hand hield: Laat mij los, dat ik de pilaren kan betasten, waarop het huis gevestigd is, zodat ik daartegen kan leunen.","27":"Het huis nu was vol mannen en vrouwen; ook waren daar alle vorsten van de Filistijnen; en op het dak waren ongeveer drieduizend mannen en vrouwen, die toekeken, terwijl Simson speelde.","28":"Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.","29":"En Simson greep de twee middelste pilaren, waarop het huis gevestigd was, en waarop het steunde, de ene met zijn rechterhand, en de andere met zijn linkerhand;","30":"En Simson zei: Laat mijn ziel sterven met de Filistijnen; en hij boog zich met kracht, en het huis viel op de vorsten, en op al het volk, dat daarin was. En de doden, die hij bij zijn sterven gedood heeft, waren meer dan die hij tijdens zijn leven had gedood.","31":"Toen kwamen zijn broers naar beneden, en het hele huis van zijn vader, en namen hem op, en brachten hem omhoog, en begroeven hem tussen Zora en Esthaol, in het graf van zijn vader Manoach; hij had Israël twintig jaar geleid."},"SV":{"1":"Simson nu ging heen naar Gaza; en hij zag aldaar een vrouw, die een hoer was; en hij ging tot haar in.","2":"Toen werd den Gazieten gezegd: Simson is hier ingekomen; zo gingen zij rondom, en leiden hem den ganse nacht lagen in de stadspoort; doch zij hielden zich den ganse nacht stil, zeggende: Tot aan het morgenlicht, dan zullen wij hem doden.","3":"Maar Simson lag tot middernacht toe; toen stond hij op ter middernacht, en hij greep de deuren der stadspoort met de beide posten, en nam ze weg met den grendelboom, en leide ze op zijn schouderen, en droeg ze opwaarts op de hoogte des bergs, die in het gezicht van Hebron is.","4":"En het geschiedde daarna, dat hij een vrouw lief kreeg, aan de beek Sorek, welker naam was Delila.","5":"Toen kwamen de vorsten der Filistijnen tot haar op, en zeiden tot haar: Overreed hem, en zie, waarin zijn grote kracht zij, en waarmede wij hem zouden machtig worden, en hem binden, om hem te plagen; zo zullen wij u geven, een iegelijk, duizend en honderd zilverlingen.","6":"Delila dan zeide tot Simson: Verklaar mij toch, waarin uw grote kracht zij, en waarmede gij zoudt kunnen gebonden worden, dat men u plage.","7":"En Simson zeide tot haar: Indien zij mij bonden met zeven verse zelen, die niet verdroogd zijn, zo zou ik zwak worden, en wezen als een ander mens.","8":"Toen brachten de vorsten der Filistijnen tot haar op zeven verse zelen, die niet verdroogd waren; en zij bond hem daarmede.","9":"De achterlage nu zat bij haar in een kamer. Zo zeide zij tot hem: De Filistijnen over u, Simson! Toen verbrak hij de zelen, gelijk als een snoertje van grof vlas verbroken wordt, als het vuur riekt. Alzo werd zijn kracht niet bekend.","10":"Toen zeide Delila tot Simson: Zie, gij hebt met mij gespot, en leugenen tot mij gesproken; verklaar mij toch nu, waarmede gij zoudt kunnen gebonden worden?","11":"En hij zeide tot haar: Indien zij mij vastbonden met nieuwe touwen, met dewelke geen werk gedaan is, zo zou ik zwak worden, en wezen als een ander mens.","12":"Toen nam Delila nieuwe touwen, en bond hem daarmede, en zeide tot hem: De Filistijnen over u, Simson! (De achterlage nu was zittende in een kamer.) Toen verbrak hij ze van zijn armen als een draad.","13":"En Delila zeide tot Simson: Tot hiertoe hebt gij met mij gespot, en leugenen tot mij gesproken; verklaar mij *toch* *nu*, waarmede gij zoudt kunnen gebonden worden. En hij zeide tot haar: Indien gij de zeven haarlokken mijns hoofds vlochtet aan een weversboom.","14":"En zij maakte ze vast met een pin, en zeide tot hem: De Filistijnen over u, Simson! Toen waakte hij op uit zijn slaap, en nam weg de pin der gevlochten *haarlokken*, en den weversboom.","15":"Toen zeide zij tot hem: Hoe zult gij zeggen: Ik heb u lief, daar uw hart niet met mij is? Gij hebt nu driemaal met mij gespot, en mij niet verklaard, waarin uw grote kracht zij.","16":"En het geschiedde, als zij hem alle dagen met haar woorden perste, en hem moeilijk viel, dat zijn ziel verdrietig werd tot stervens toe;","17":"Zo verklaarde hij haar zijn ganse hart, en zeide tot haar: Er is nooit een scheermes op mijn hoofd gekomen, want ik ben een Nazireër Gods van mijn moeders buik af; indien ik geschoren wierd, zo zou mijn kracht van mij wijken, en ik zou zwak worden, en wezen als alle de mensen.","18":"Als nu Delila zag, dat hij haar zijn ganse hart verklaard had, zo zond zij heen, en riep de vorsten der Filistijnen, zeggende: Komt ditmaal op, want hij heeft mij zijn ganse hart verklaard. En de vorsten der Filistijnen kwamen tot haar op, en brachten dat geld in hun hand.","19":"Toen deed zij hem slapen op haar knieën, en riep een man en liet hem de zeven haarlokken zijns hoofds afscheren, en zij begon hem te plagen; en zijn kracht week van hem.","20":"En zij zeide: De Filistijnen over u, Simson! En hij ontwaakte uit zijn slaap, en zeide: Ik zal ditmaal uitgaan, als op andere malen, en mij uitschudden; want hij wist niet, dat de HEERE van hem geweken was.","21":"Toen grepen hem de Filistijnen, en groeven zijn ogen uit; en zij voerden hem af naar Gaza, en bonden hem met twee koperen ketenen, en hij was malende in het gevangenhuis.","22":"En het haar zijns hoofds begon *weder* te wassen, gelijk toen hij geschoren werd.","23":"Toen verzamelden zich de vorsten der Filistijnen, om hun god Dagon een groot offer te offeren, en tot vrolijkheid; en zij zeiden: Onze god heeft onze vijand Simson in onze hand gegeven.","24":"Desgelijks als hem het volk zag, loofden zij hun god, want zij zeiden: Onze god heeft in onze hand gegeven onzen vijand, en die ons land verwoestte, en die onzer verslagenen velen maakte!","25":"En het geschiedde, als hun hart vrolijk was, dat zij zeiden: Roept Simson, dat hij voor ons spele. En zij riepen Simson uit het gevangenhuis; en hij speelde voor hun aangezichten, en zij deden hem staan tussen de pilaren.","26":"Toen zeide Simson tot den jongen, die hem bij de hand hield: Laat mij gaan, dat ik de pilaren betaste , op dewelke het huis gevestigd is, dat ik daaraan leune.","27":"Het huis nu was vol mannen en vrouwen; ook waren daar alle vorsten der Filistijnen; en op het dak waren omtrent drie duizend mannen en vrouwen, die toezagen, als Simson speelde.","28":"Toen riep Simson tot den HEERE, en zeide: Heere, HEERE! gedenk toch mijner, en sterk mij toch alleenlijk ditmaal, o God! dat ik mij met een wrake voor mijn twee ogen aan de Filistijnen wreke.","29":"En Simson vatte de twee middelste pilaren, op dewelke het huis was gevestigd, en waarop het steunde, den enen met zijn rechterhand, en den anderen met zijn linkerhand;","30":"En Simson zeide: Mijn ziel sterve met de Filistijnen; en hij boog zich met kracht, en het huis viel op de vorsten, en op al het volk, dat daarin was. En de doden, die hij in zijn sterven gedood heeft, waren meer, dan die hij in zijn leven gedood had.","31":"Toen kwamen zijn broeders af, en het ganse huis zijns vaders, en namen hem op, en brachten *hem* opwaarts, en begroeven hem tussen Zora en tussen Esthaol, in het graf van zijn vader Manoach; hij nu had Israël gericht twintig jaren."},"KJV":{"1":"Then went Samson to Gaza, and saw there an harlot, and went in","2":"*And it was told* the Gazites, saying, Samson is come hither. And they compassed *him* in, and laid wait for him all night in the gate of the city, and were quiet all the night, saying, In the morning, when it is day, we shall kill","3":"And Samson lay till midnight, and arose at midnight, and took the doors of the gate of the city, and the two posts, and went away with them, bar and all, and put *them* upon his shoulders, and carried them up to the top of an hill that *is* before Hebron.","4":"And it came to pass afterward, that he loved a woman in the valley of Sorek, whose name *was* Delilah.","5":"And the lords of the Philistines came up unto her, and said unto her, Entice him, and see wherein his great strength *lieth*, and by what *means* we may prevail against him, that we may bind him to afflict him: and we will give thee every one of us eleven hundred *pieces* of silver.","6":"And Delilah said to Samson, Tell me, I pray thee, wherein thy great strength *lieth*, and wherewith thou mightest be bound to afflict","7":"And Samson said unto her, If they bind me with seven green withs that were never dried, then shall I be weak, and be as another man.","8":"Then the lords of the Philistines brought up to her seven green withs which had not been dried, and she bound","9":"Now *there were* men lying in wait, abiding with her in the chamber. And she said unto him, The Philistines *be* upon thee, Samson. And he brake the withs, as a thread of tow is broken when it toucheth the fire. So his strength was not known.","10":"And Delilah said unto Samson, Behold, thou hast mocked me, and told me lies: now tell me, I pray thee, wherewith thou mightest be bound.","11":"And he said unto her, If they bind me fast with new ropes that never were occupied, then shall I be weak, and be as another man.","12":"Delilah therefore took new ropes, and bound him therewith, and said unto him, The Philistines *be* upon thee, Samson. And *there were* liers in wait abiding in the chamber. And he brake them from off his arms like a thread.","13":"And Delilah said unto Samson, Hitherto thou hast mocked me, and told me lies: tell me wherewith thou mightest be bound. And he said unto her, If thou weavest the seven locks of my head with the web.","14":"And she fastened *it* with the pin, and said unto him, The Philistines *be* upon thee, Samson. And he awaked out of his sleep, and went away with the pin of the beam, and with the web.","15":"And she said unto him, How canst thou say, I love thee, when thine heart *is* not with me? thou hast mocked me these three times, and hast not told me wherein thy great strength","16":"And it came to pass, when she pressed him daily with her words, and urged him, *so* that his soul was vexed unto death;","17":"That he told her all his heart, and said unto her, There hath not come a razor upon mine head; for I *have been* a Nazarite unto God from my mother's womb: if I be shaven, then my strength will go from me, and I shall become weak, and be like any *other* man.","18":"And when Delilah saw that he had told her all his heart, she sent and called for the lords of the Philistines, saying, Come up this once, for he hath shewed me all his heart. Then the lords of the Philistines came up unto her, and brought money in their hand.","19":"And she made him sleep upon her knees; and she called for a man, and she caused him to shave off the seven locks of his head; and she began to afflict him, and his strength went","20":"And she said, The Philistines *be* upon thee, Samson. And he awoke out of his sleep, and said, I will go out as at other times before, and shake myself. And he wist not that the LORD was departed","21":"But the Philistines took him, and put out his eyes, and brought him down to Gaza, and bound him with fetters of brass; and he did grind in the prison house.","22":"Howbeit the hair of his head began to grow again after he was shaven.","23":"Then the lords of the Philistines gathered them together for to offer a great sacrifice unto Dagon their god, and to rejoice: for they said, Our god hath delivered Samson our enemy into our hand.","24":"And when the people saw him, they praised their god: for they said, Our god hath delivered into our hands our enemy, and the destroyer of our country, which slew many","25":"And it came to pass, when their hearts were merry, that they said, Call for Samson, that he may make us sport. And they called for Samson out of the prison house; and he made them sport: and they set him between the pillars.","26":"And Samson said unto the lad that held him by the hand, Suffer me that I may feel the pillars whereupon the house standeth, that I may lean","27":"Now the house was full of men and women; and all the lords of the Philistines *were* there; and *there were* upon the roof about three thousand men and women, that beheld while Samson made sport.","28":"And Samson called unto the LORD, and said, O Lord GOD, remember me, I pray thee, and strengthen me, I pray thee, only this once, O God, that I may be at once avenged of the Philistines for my two eyes.","29":"And Samson took hold of the two middle pillars upon which the house stood, and on which it was borne up, of the one with his right hand, and of the other with his left.","30":"And Samson said, Let me die with the Philistines. And he bowed himself with *all his* might; and the house fell upon the lords, and upon all the people that *were* therein. So the dead which he slew at his death were more than *they* which he slew in his life.","31":"Then his brethren and all the house of his father came down, and took him, and brought *him* up, and buried him between Zorah and Eshtaol in the buryingplace of Manoah his father. And he judged Israel twenty years."}},"tsk":{"1":[{"kopje":"Gaza","refs":["Gen 10:19","Joz 15:47"]},{"kopje":"en hij ging","refs":["Gen 38:16-18","Ezra 9:1","Ezra 9:2"]}],"2":[{"kopje":"rondom","refs":["1 Sam 19:11","1 Sam 23:26","Ps 118:10-12","Hand 9:24","2 Kor 11:32","2 Kor 11:33"]},{"kopje":"hem doden","refs":["Richt 15:18","Matt 21:38","Matt 27:1","Hand 23:15"]}],"3":[{"kopje":"nam ze weg","refs":["Ps 107:16","Jes 63:1-5","Micha 2:13","Hand 2:24"]}],"4":[{"kopje":"kreeg lief","refs":["1 Kon 11:1","Neh 13:26","Spr 22:14","Spr 23:27","Spr 26:11","Spr 27:22","1 Kor 10:6"]}],"5":[{"kopje":"de vorsten","refs":["Richt 3:3","Joz 13:3","1 Sam 29:6"]},{"kopje":"Overreed","refs":["Richt 14:15","Spr 2:16-19","Spr 5:3-11","Spr 6:24-26","Spr 7:21-27","1 Kor 6:15-18"]},{"kopje":"wij zullen","refs":["Richt 17:2","Gen 33:16","Num 22:17","Num 22:18","Micha 7:3","Matt  wl-kjv\" data-code=\"H1280\">bar</span> and all, and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> them upon his <span class=\"wl wl-kjv\" data-code=\"H3802\">shoulders,</span> and carried them <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of an <span class=\"wl wl-kjv\" data-code=\"H2022\">hill</span> that is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Hebron.","4":"And it came to pass <span class=\"wl wl-kjv\" data-code=\"H310\">afterward,</span> that he <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> in the <span class=\"wl wl-kjv\" data-code=\"H5158\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H7796\">Sorek,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was Delilah.","5":"And the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto her, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H6601\">Entice</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> wherein his <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> lieth, and by what means we may <span class=\"wl wl-kjv\" data-code=\"H3201\">prevail</span> against him, that we may <span class=\"wl wl-kjv\" data-code=\"H631\">bind</span> him to <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> him: and we will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of us eleven <span class=\"wl wl-kjv\" data-code=\"H505\">hundred</span> pieces of silver.","6":"And <span class=\"wl wl-kjv\" data-code=\"H1807\">Delilah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">Tell</span> me, I pray thee, wherein thy <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> lieth, and wherewith thou mightest be <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> to afflict","7":"And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, If they <span class=\"wl wl-kjv\" data-code=\"H631\">bind</span> me with <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3892\">green</span> <span class=\"wl wl-kjv\" data-code=\"H3499\">withs</span> that were never <span class=\"wl wl-kjv\" data-code=\"H2717\">dried,</span> then shall I be <span class=\"wl wl-kjv\" data-code=\"H2470\">weak,</span> and be as <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> man.","8":"Then the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to her <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3892\">green</span> <span class=\"wl wl-kjv\" data-code=\"H3499\">withs</span> which had not been <span class=\"wl wl-kjv\" data-code=\"H2717\">dried,</span> and she bound","9":"Now there were men lying in <span class=\"wl wl-kjv\" data-code=\"H693\">wait,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abiding</span> with her in the <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber.</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, The <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> be upon thee, <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson.</span> And he <span class=\"wl wl-kjv\" data-code=\"H5423\">brake</span> the <span class=\"wl wl-kjv\" data-code=\"H3499\">withs,</span> as a <span class=\"wl wl-kjv\" data-code=\"H6616\">thread</span> of <span class=\"wl wl-kjv\" data-code=\"H5296\">tow</span> is <span class=\"wl wl-kjv\" data-code=\"H5423\">broken</span> when it <span class=\"wl wl-kjv\" data-code=\"H7306\">toucheth</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire.</span> So his <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> was not known.","10":"And <span class=\"wl wl-kjv\" data-code=\"H1807\">Delilah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson,</span> Behold, thou hast <span class=\"wl wl-kjv\" data-code=\"H2048\">mocked</span> me, and <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> me <span class=\"wl wl-kjv\" data-code=\"H3577\">lies:</span> now <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, I pray thee, wherewith thou mightest be bound.","11":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, If they <span class=\"wl wl-kjv\" data-code=\"H631\">bind</span> me <span class=\"wl wl-kjv\" data-code=\"H631\">fast</span> with <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H5688\">ropes</span> that never were <span class=\"wl wl-kjv\" data-code=\"H4399\">occupied,</span> then shall I be <span class=\"wl wl-kjv\" data-code=\"H2470\">weak,</span> and be as <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> man.","12":"<span class=\"wl wl-kjv\" data-code=\"H1807\">Delilah</span> therefore <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H5688\">ropes,</span> and <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> him therewith, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, The <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> be upon thee, <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson.</span> And there were liers in <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abiding</span> in the <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber.</span> And he <span class=\"wl wl-kjv\" data-code=\"H5423\">brake</span> them from off his <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> like a thread.","13":"And <span class=\"wl wl-kjv\" data-code=\"H1807\">Delilah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson,</span> <span class=\"wl wl-kjv\" data-code=\"H2008\">Hitherto</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H2048\">mocked</span> me, and <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> me <span class=\"wl wl-kjv\" data-code=\"H3577\">lies:</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me wherewith thou mightest be <span class=\"wl wl-kjv\" data-code=\"H631\">bound.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, If thou <span class=\"wl wl-kjv\" data-code=\"H707\">weavest</span> the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H4253\">locks</span> of my <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> with the web.","14":"And she <span class=\"wl wl-kjv\" data-code=\"H8628\">fastened</span> it with the <span class=\"wl wl-kjv\" data-code=\"H3489\">pin,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, The <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> be upon thee, <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3364\">awaked</span> out of his <span class=\"wl wl-kjv\" data-code=\"H8142\">sleep,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5265\">away</span> with the <span class=\"wl wl-kjv\" data-code=\"H3489\">pin</span> of the <span class=\"wl wl-kjv\" data-code=\"H708\">beam,</span> and with the web.","15":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H349\">How</span> canst thou <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> thee, when thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is not with me? thou hast <span class=\"wl wl-kjv\" data-code=\"H2048\">mocked</span> me these <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times,</span> and hast not <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> me wherein thy <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> strength","16":"And it came to pass, when she <span class=\"wl wl-kjv\" data-code=\"H6693\">pressed</span> him <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> with her <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> and <span class=\"wl wl-kjv\" data-code=\"H509\">urged</span> him, so that his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> was <span class=\"wl wl-kjv\" data-code=\"H7114\">vexed</span> unto death;","17":"That he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> her all his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, There hath not <span class=\"wl wl-kjv\" data-code=\"H5927\">come</span> a <span class=\"wl wl-kjv\" data-code=\"H4177\">razor</span> upon mine <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> for I have been a <span class=\"wl wl-kjv\" data-code=\"H5139\">Nazarite</span> unto <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> from my <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H990\">womb:</span> if I be <span class=\"wl wl-kjv\" data-code=\"H1548\">shaven,</span> then my <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> will <span class=\"wl wl-kjv\" data-code=\"H5493\">go</span> from me, and I shall become <span class=\"wl wl-kjv\" data-code=\"H2470\">weak,</span> and be like any other man.","18":"And when <span class=\"wl wl-kjv\" data-code=\"H1807\">Delilah</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that he had <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> her all his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> she <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> this <span class=\"wl wl-kjv\" data-code=\"H6471\">once,</span> for he hath <span class=\"wl wl-kjv\" data-code=\"H5046\">shewed</span> me all his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart.</span> Then the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto her, and <span class=\"wl wl-kjv\" data-code=\"H5927\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> in their hand.","19":"And she made him <span class=\"wl wl-kjv\" data-code=\"H3462\">sleep</span> upon her <span class=\"wl wl-kjv\" data-code=\"H1290\">knees;</span> and she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for a <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and she caused him to shave <span class=\"wl wl-kjv\" data-code=\"H1548\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H4253\">locks</span> of his <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> and she <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> to <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> him, and his <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> went","20":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> be upon thee, <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3364\">awoke</span> out of his <span class=\"wl wl-kjv\" data-code=\"H8142\">sleep,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> as at other times <span class=\"wl wl-kjv\" data-code=\"H6471\">before,</span> and <span class=\"wl wl-kjv\" data-code=\"H5287\">shake</span> myself. And he <span class=\"wl wl-kjv\" data-code=\"H3045\">wist</span> not that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was departed","21":"But the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H270\">took</span> him, and put <span class=\"wl wl-kjv\" data-code=\"H5365\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and brought him <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H5804\">Gaza,</span> and <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> him with fetters of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass;</span> and he did <span class=\"wl wl-kjv\" data-code=\"H2912\">grind</span> in the <span class=\"wl wl-kjv\" data-code=\"H631\">prison</span> house.","22":"Howbeit the <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> of his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> to grow <span class=\"wl wl-kjv\" data-code=\"H6779\">again</span> <span class=\"wl wl-kjv\" data-code=\"H834\">after</span> he was shaven.","23":"Then the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> gathered them <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> for to <span class=\"wl wl-kjv\" data-code=\"H2076\">offer</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> unto <span class=\"wl wl-kjv\" data-code=\"H1712\">Dagon</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">god,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8057\">rejoice:</span> for they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Our <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> our <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> into our hand.","24":"And when the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him, they <span class=\"wl wl-kjv\" data-code=\"H1984\">praised</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">god:</span> for they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Our <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into our <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> our <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2717\">destroyer</span> of our <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> which <span class=\"wl wl-kjv\" data-code=\"H2491\">slew</span> many","25":"And it came to pass, when their <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> were <span class=\"wl wl-kjv\" data-code=\"H2896\">merry,</span> that they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> for <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson,</span> that he may make us <span class=\"wl wl-kjv\" data-code=\"H7832\">sport.</span> And they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> out of the <span class=\"wl wl-kjv\" data-code=\"H631\">prison</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and he made <span class=\"wl wl-kjv\" data-code=\"H6440\">them</span> <span class=\"wl wl-kjv\" data-code=\"H6711\">sport:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> him between the pillars.","26":"And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> that <span class=\"wl wl-kjv\" data-code=\"H2388\">held</span> him by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> <span class=\"wl wl-kjv\" data-code=\"H3240\">Suffer</span> me that I may <span class=\"wl wl-kjv\" data-code=\"H4184\">feel</span> the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> whereupon the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H3559\">standeth,</span> that I may lean","27":"Now the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> was <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> were there; and there were upon the <span class=\"wl wl-kjv\" data-code=\"H1406\">roof</span> about <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> that <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld</span> while <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> made sport.","28":"And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> me, I pray thee, and <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthen</span> me, I pray thee, only this <span class=\"wl wl-kjv\" data-code=\"H6471\">once,</span> O <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that I may be at <span class=\"wl wl-kjv\" data-code=\"H259\">once</span> <span class=\"wl wl-kjv\" data-code=\"H5358\">avenged</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> for my <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> eyes.","29":"And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> took <span class=\"wl wl-kjv\" data-code=\"H3943\">hold</span> of the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">middle</span> <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> upon which the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H3559\">stood,</span> and on which it was borne <span class=\"wl wl-kjv\" data-code=\"H5564\">up,</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> with his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> with his left.","30":"And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let me <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> with the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span> And he <span class=\"wl wl-kjv\" data-code=\"H5186\">bowed</span> himself with all his <span class=\"wl wl-kjv\" data-code=\"H3581\">might;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon the <span class=\"wl wl-kjv\" data-code=\"H5633\">lords,</span> and upon all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were therein. So the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> which he <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> at his <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> were <span class=\"wl wl-kjv\" data-code=\"H7227\">more</span> than they which he <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> in his life.","31":"Then his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">took</span> him, and brought him <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him between <span class=\"wl wl-kjv\" data-code=\"H6881\">Zorah</span> and <span class=\"wl wl-kjv\" data-code=\"H847\">Eshtaol</span> in the <span class=\"wl wl-kjv\" data-code=\"H6913\">buryingplace</span> of <span class=\"wl wl-kjv\" data-code=\"H4495\">Manoah</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span> And he <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> years."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ging heen","tekst":"Na den slag der Filistijnen, in Jdg 15 beschreven."},{"catchword":"Gaza;","tekst":"Een van de voornaamste hoofdsteden der Filistijnen, gelegen aan de Middellandse zee, in het land van Simeon."},{"catchword":"een vrouw,","tekst":"Hebreeuws, een vrouw, een hoer. Anders, waardin"},{"catchword":"ging tot haar in","tekst":"Zie Gen 6:4. Sommigen verstaan dat hij bij haar ter herberg gelegen heeft."}],"2":[{"catchword":"Toen werd den Gazieten gezegd","tekst":"Hebreeuws, den Gazieten zeggende; welke afgebroken rede aldus wordt aangevuld, [toen werd] den Gazieten [aangezegd] mits te zeggen; of, [men gaf het] den Gazieten [te kennen], zeggende. Dit beduidt, naar sommiger gevoelen, dat zij terstond gewaarschuwd zijn van Simsons aankomst, om deze occasie geenszins te verliezen."},{"catchword":"rondom,","tekst":"De een den ander aanzeggende dat men met algemene hand moest op zijn en op Simson loeren, opdat hij nu niet ontkwam."},{"catchword":"hielden zich den gansen nacht stil,","tekst":"Hebreeuws, zij zwegen; dat is, zij hielden zich stil, en deden niets. Zie onder, Jdg 18:19, en 1Ki 22:3."},{"catchword":"Tot aan het morgenlicht,","tekst":"Versta hierop, laat ons stil zijn totdat het licht wordt."}],"3":[{"catchword":"op de hoogte des bergs,","tekst":"Hebreeuws, op het hoofd. Dit was een hoge berg, gelegen oostwaarts voor Gaza, op welks spits [gelijk uit dezen tekst is af te nemen] men zag op Hebron, mede gelegen op een hogen berg bij de westelijke grenzen van Juda. Hiermede komen ook de kaarten overeen. Sommigen menen dat hij die gedragen heeft tot op het gebergte van Juda, dicht bij Hebron."}],"4":[{"catchword":"Sorek,","tekst":"Lopende bij het dal Eskol, of het druivendal [waarvan Deu 1:24 ] uit het gebergte van Juda in de Middellandse zee, en scheidende de stammen Dan en Simeon van elkander. Naar het gevoelen van anderen zouden Eskol en Sorek namen moeten zijn van een en dezelfde beek. Maar Num 13:24 staat dat de plaats [niet beek] door de Israëlieten genoemd is Nahal-Eskol."}],"5":[{"catchword":"vorsten der Filistijnen","tekst":"Zie boven, Jdg 3:3."},{"catchword":"Overreed hem,","tekst":"Zie boven, Jdg 14:15."},{"catchword":"plagen;","tekst":"Of, te verootmoedigen; alzo vs.6."},{"catchword":"zilverlingen","tekst":"Zie Gen 20:16."}],"7":[{"catchword":"verse zelen,","tekst":"Anders, verse, of frisse, groene, tenen roeden, of tenen banden, wissenbanden, wilgenbanden"},{"catchword":"ander mens","tekst":"Of, als een der mensen, of als een enig mens, alzo vs.11."}],"8":[{"catchword":"brachten de vorsten der Filistijnen","tekst":"Hebreeuws, deden tot haar opkomen; dat is, zij brachten, of schikten, deden haar brengen."}],"9":[{"catchword":"achterlage nu zat bij haar in een kamer","tekst":"Dat is, die Filistijnen, die daarop loerden en pasten."},{"catchword":"Filistijnen over u, Simson","tekst":"Dat is, daar zijn de Filistijnen, die u willen overvallen."},{"catchword":"grof vlas verbroken wordt","tekst":"Of, werk."},{"catchword":"riekt","tekst":"Dat is, nabij vuur komt, of vuur [gelijk men ook zegt] gevoelt, gewaar wordt. Vergelijk Psa 58:10."}],"11":[{"catchword":"vastbonden met nieuwe touwen,","tekst":"Hebreeuws, bindende bonden."}],"12":[{"catchword":"hij ze van zijn armen","tekst":"Te weten, de dikke touwen."}],"13":[{"catchword":"zeven haarlokken mijns hoofds","tekst":"Dat is, het ganse haar van mijn hoofd, in zoveel lokken als het afgedeeld is; vergelijk onder, vs.19, 22."},{"catchword":"weversboom","tekst":"Anders, web om een weversboom gewonden zijnde. Versta hierop: [zoals in het voorgaande] zo zou ik zwak worden en zijn als een ander mens."}],"14":[{"catchword":"maakte ze vast met een pin,","tekst":"Versta, nadat zij volgens zijn zeggen met de gevlochten haarlokken gedaan had, zo maakte zij dezelve nog, voor de zekerheid, vast met een pin aan den weversboom. Anderen verstaan dat zij den weversboom heeft vastgenageld, opdat Simson dien niet van de plaats zou kunnen vertrekken, of losmaken."},{"catchword":"nam weg de pin","tekst":"Of, ging weg met den nagel en met den weversboom; tonende zijn vorige kracht, en dat dit het middel niet was om hem te vangen en te bedwingen."},{"catchword":"der gevlochten haarlokken,","tekst":"Dat is, waarmede Delila de gevlochten haarlokken had vastgemaakt. Hebreeuws, der vlechting."}],"16":[{"catchword":"verdrietig werd tot stervens toe;","tekst":"Hebreeuws, verkort werd; gelijk vruchten, die men afmaait, afoogst. De zin is dat hem al zijn moed en lust verging, ja [gelijk wij ook spreken] de adem hem kort werd, en zijn geest na aan het bezwijken was, vanwege benauwdheid; waardoor hijzich ten laatste van Delila liet overwinnen. Een zeer opmerkelijk en deerlijk exempel van menselijke zwakheid en onbedachtheid in zulk een voortreffelijken held Gods, gelijk Simson was. Vergelijk Job 21:4."}],"17":[{"catchword":"nazireër Gods","tekst":"Zie boven, Jdg 13:5."},{"catchword":"kracht van mij wijken,","tekst":"Niet dat zijn kracht in het haar gelegen was, maar omdat het afscheren van zijn haar een verbreking was van de gelofte zijns nazireërschaps [ Num 6:5; boven, Jdg 13:5 ] , waaraan hij verplicht was door het bevel Gods, die hem door zijn Geest met deze extra-ordinaire sterkte begaafde, zolang hij zijn nazireërschap onderhield, maar hem daarvan ontblootte toen hij aan de inbreuk daarvan schuldig werd."}],"18":[{"catchword":"riep de vorsten der Filistijnen,","tekst":"Dat is, liet roepen, ontbood, en liet zeggen."},{"catchword":"geld in hun hand","tekst":"Of, zilver. Zie boven, vs.5."}],"19":[{"catchword":"riep een man","tekst":"Dat is, liet roepen, ontbood."},{"catchword":"plagen;","tekst":"Dat is, aan te stoten, of anderszins aan te roeren, prikkelen, enz. om hem wakker te maken en van de aankomst der Filistijnen [gelijk tevoren] te waarschuwen, opdat men zag of hij te vangen en te dwingen ware, of niet."}],"20":[{"catchword":"als op andere malen,","tekst":"Hebreeuws, gelijk maal in [of, op ] maal; dat is, gelijk tevoren meermalen."},{"catchword":"uitschudden;","tekst":"Gelijk iemand die geschoren is, of zich verwakkert en zijn kracht vergadert tot enig werk. Anders, ik zal mij schudden [uit hun handen]; alsof hij zeide: Ik zal mij lichtelijk uit hun handen redden."},{"catchword":"geweken was","tekst":"Versta, zover, en ten aanzien daarvan, dat Hij hem die vorige kracht onttrokken had."}],"21":[{"catchword":"ogen uit;","tekst":"Opdat hij hunlieden niet meer kwaad zou kunnen doen; latende hem nochtans leven, tot een schouwspel en roem van hun afgod Dagon. Zie vs.23,24. Maar God, die alles regeert, had hierin wat anders voor, gelijk de uitkomst geleerd heeft."},{"catchword":"gevangenhuis","tekst":"Hebreeuws, in het huis der gebondenen."}],"22":[{"catchword":"wassen,","tekst":"En Simson door een oprecht berouw weder te komen tot zijn vorigen stand des nazireërschaps, en van God te ontvangen de voorgaande krachten. Hebreeuws, te groenen, uit te spruiten; gelijk gras en kruid."},{"catchword":"gelijk toen hij geschoren werd","tekst":"Of, gelijk dien, die geschoren was. Of, gelijk als het afgeschoren was; dat is, het haar begon weder zo lang te worden als het was ten tijde, toen hij geschoren werd door bedrog van Delila. Anders, nadat hij geschoren was."}],"23":[{"catchword":"Dagon","tekst":"De afgod der Filistijnen, alzo genoemd omdat hij met zijn onderste deel een vis gelijk was [de Filistijnen woonden aan de zee], en het bovenste een menselijke gedaante had. Zie van dezen 1Sa 5:2-5. Alzo hebben andere heidenen hun zeeafgoden gehad, als: Neptunus, Triton, Leucothea, enz. Sommigen menen dat deze afgod alzo genoemd is van het Hebreeuwse woord dagan, dat is, koren, omdat zij hem voor den god van den landbouw hielden. Van zulke afgoderij zie Rom 1:23, Rom 1:25."}],"24":[{"catchword":"velen maakte","tekst":"Dat is, die een menigte van Filistijnen voor en na verslagen heeft."}],"2 // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
