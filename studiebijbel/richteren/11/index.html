":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Jeftha nu, de Gileadiet, was een strijdbaar held, maar hij was een hoerenkind; toch had Gilead Jeftha verwekt.","2":"Gileads huisvrouw baarde hem ook zonen; en toen de zonen van deze vrouw groot geworden waren, stootten zij Jeftha uit en zeiden tegen hem: U zult niet erven in het huis van onze vader, want u bent een zoon van een andere vrouw.","3":"Toen vluchtte Jeftha weg van zijn broers, en woonde in het land Tob; en ijdele mannen verzamelden zich bij Jeftha, en trokken met hem uit.","4":"En het gebeurde, na enige dagen, dat de kinderen van Ammon streden tegen Israël.","5":"Toen nu de kinderen van Ammon tegen Israël streden, gingen de oudsten van Gilead heen om Jeftha te halen uit het land van Tob.","6":"En zij zeiden tegen Jeftha: Kom, en word onze aanvoerder, zodat wij kunnen strijden tegen de kinderen van Ammon.","7":"Maar Jeftha zei tegen de oudsten van Gilead: Hebt u mij niet gehaat, en mij uit het huis van mijn vader verstoten? Waarom bent u dan nu naar mij toegekomen, nu u in benauwdheid verkeert?","8":"En de oudsten van Gilead zeiden tegen Jeftha: Daarom zijn wij nu naar u teruggekomen, dat u met ons meegaat en tegen de kinderen van Ammon strijdt; en u zult ons tot hoofd zijn, over alle inwoners van Gilead.","9":"Toen zei Jeftha tegen de oudsten van Gilead: Als u mij terughaalt om te strijden tegen de kinderen van Ammon, en de HEERE hen aan mij overgeeft, zal ik dan uw hoofd zijn?","10":"En de oudsten van Gilead zeiden tegen Jeftha: De HEERE zij getuige tussen ons, als wij niet zo doen naar uw woord.","11":"Zo ging Jeftha met de oudsten van Gilead, en het volk stelde hem tot hoofd en aanvoerder over zich. En Jeftha sprak al zijn woorden voor het aangezicht van de HEERE te Mizpa.","12":"Vervolgens zond Jeftha boden naar de koning van de kinderen van Ammon, en zei: Wat hebben ik en u met elkaar te maken, dat u naar mij toe bent gekomen om tegen mijn land te strijden?","13":"En de koning van de kinderen van Ammon zei tegen de boden van Jeftha: Omdat Israël, toen het optrok uit Egypte, mijn land heeft afgenomen, van de Arnon af tot aan de Jabbok, en tot aan de Jordaan; geef mij dat nu dus in vrede terug.","14":"Maar Jeftha ging verder, en zond opnieuw boden naar de koning van de kinderen van Ammon.","15":"En hij zei tegen hem: Zo zegt Jeftha: Israël heeft het land van de Moabieten, en het land van de kinderen van Ammon, niet afgenomen;","16":"want toen zij uit Egypte optrokken, wandelde Israël door de woestijn tot aan de Schelfzee, en kwam bij Kades.","17":"En Israël zond boden naar de koning van de Edomieten, en zei: Laat mij toch door uw land trekken; maar de koning van de Edomieten wilde niet luisteren. En hij zond ook naar de koning van de Moabieten, die ook niet wilde. Zo bleef Israël in Kades.","18":"Daarna trok het door de woestijn, en trok om het land van de Edomieten en het land van de Moabieten heen, en kwam vanaf de opgang van de zon aan het land van de Moabieten, en zij legerden zich aan de overkant van de Arnon; maar zij kwamen niet binnen het gebied van de Moabieten; want de Arnon is de grens van de Moabieten.","19":"Maar Israël zond boden naar Sihon, de koning van de Amorieten, koning van Hesbon, en Israël zei tegen hem: Laat ons toch door uw land trekken tot aan mijn plaats.","20":"Doch Sihon vertrouwde het niet dat Israël door zijn gebied zou trekken; maar Sihon verzamelde al zijn volk, en zij legerden zich te Jaza; en hij streed tegen Israël.","21":"En de HEERE, de God van Israël, gaf Sihon met al zijn volk in de hand van Israël, zodat zij hen versloegen; zo nam Israël het hele land van de Amorieten, die in dat land woonden, in erfelijk bezit.","22":"En zij namen het hele gebied van de Amorieten in erfelijk bezit, van de Arnon af tot aan de Jabbok, en van de woestijn tot aan de Jordaan.","23":"Zo heeft nu de HEERE, de God van Israël, de Amorieten voor het aangezicht van Zijn volk Israël uit hun bezit verdreven; en zou u dan hun erfgenaam zijn?","24":"Zou u niet erven wat uw god Kamos voor u uit het bezit verdreef? Zo zullen wij alles erven wat de HEERE, onze God, voor ons aangezicht uit het bezit verdrijft.","25":"Nu verder, bent u soms veel beter dan Balak, de zoon van Zippor, de koning van de Moabieten? Heeft hij ooit met Israël getwist? Heeft hij ooit tegen hem gestreden?","26":"Terwijl Israël driehonderd jaar gewoond heeft in Hesbon en de bijbehorende steden, en in Aroer en de bijbehorende steden, en in al de steden die aan de zijde van de Arnon liggen; waarom hebt u het dan in die tijd niet teruggehaald?","27":"Ik heb ook niet tegen u gezondigd, maar u doet mij onrecht aan door tegen mij te strijden. De HEERE, Die Rechter is, oordele vandaag tussen de kinderen van Israël en de kinderen van Ammon!","28":"Maar de koning van de kinderen van Ammon luisterde niet naar de woorden van Jeftha, die hij naar hem toe gezonden had.","29":"Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.","30":"En Jeftha beloofde de HEERE een gelofte, en zei: Als U de kinderen van Ammon werkelijk in mijn hand geeft,","31":"dan zal het zo zijn, dat wat uit de deur van mijn huis mij tegemoet komt, wanneer ik in vrede terugkeer van de kinderen van Ammon, dat zal van de HEERE zijn, en ik zal het offeren als brandoffer.","32":"Zo trok Jeftha door naar de kinderen van Ammon, om tegen hen te strijden; en de HEERE gaf hen in zijn hand.","33":"En hij versloeg hen van Aroer af tot waar u komt bij Minnith, twintig steden, en tot aan Abel-Keramim, met een zeer grote slag. Zo werden de kinderen van Ammon onderworpen voor het aangezicht van de kinderen van Israël.","34":"Toen Jeftha nu bij Mizpa bij zijn huis kwam, zie, zo kwam zijn dochter hem tegemoet, met trommels en met reidansen. Zij was zijn enige *kind*; hij had *verder* geen zoon of dochter.","35":"En het gebeurde, toen hij haar zag, dat hij zijn kleren scheurde, en zei: Ach, mijn dochter! U hebt mij helemaal terneergeslagen, en u bent onder degenen die mij in het ongeluk storten; want ik heb mijn mond opengedaan tegen de HEERE, en ik kan niet terug.","36":"En zij zei tegen hem: Mijn vader! Hebt u uw mond opengedaan tegen de HEERE, doe met mij zoals uit uw mond is gekomen; aangezien de HEERE u volkomen wraak gegeven heeft op uw vijanden, op de kinderen van Ammon.","37":"Verder zei zij tegen haar vader: Laat mij dit vragen: Laat mij twee maanden met rust, dat ik heenga en naar de bergen ga, en mijn maagdelijkheid beween, ik en mijn vriendinnen.","38":"En hij zei: Ga heen; en hij liet haar twee maanden gaan. Toen ging zij heen met haar vriendinnen, en beweende haar maagdelijkheid op de bergen.","39":"En het gebeurde, aan het einde van twee maanden, dat zij naar haar vader terugkwam, die met haar deed naar zijn gelofte die hij beloofd had; en zij had geen man bekend. Verder werd het een gewoonte in Israël,","40":"dat de dochters van Israël van jaar tot jaar heengingen, om de dochter van Jeftha, de Gileadiet, te herdenken, vier dagen in het jaar."},"SV":{"1":"Jeftha nu, de Gileadiet, was een strijdbaar held, maar hij was een hoerekind; doch Gilead had Jeftha gegenereerd.","2":"Gileads huisvrouw baarde hem ook zonen; en de zonen dezer vrouw, groot geworden zijnde, stieten Jeftha uit, en zeiden tot hem: Gij zult in het huis onzes vaders niet erven, want gij zijt een zoon van een andere vrouw.","3":"Toen vlood Jeftha voor het aangezicht zijner broederen, en woonde in het land Tob; en ijdele mannen vergaderden zich tot Jeftha, en togen met hem uit.","4":"En het geschiedde, na enige dagen, dat de kinderen Ammons tegen Israël krijgden.","5":"Zo geschiedde het, als de kinderen Ammons tegen Israël krijgden, dat de oudsten van Gilead heengingen, om Jeftha te halen uit het land van Tob.","6":"En zij zeiden tot Jeftha: Kom, en wees ons tot een overste, opdat wij strijden tegen de kinderen Ammons.","7":"Maar Jeftha zeide tot de oudsten van Gilead: Hebt gijlieden mij niet gehaat, en mij uit mijn vaders huis verstoten? waarom zijt gij dan nu tot mij gekomen, terwijl gij in benauwdheid zijt?","8":"En de oudsten van Gilead zeiden tot Jeftha: Daarom zijn wij nu tot u wedergekomen, dat gij met ons trekt, en tegen de kinderen Ammons strijdt; en gij zult ons tot een hoofd zijn, over alle inwoners van Gilead.","9":"Toen zeide Jeftha tot de oudsten van Gilead: Zo gijlieden mij wederhaalt, om te strijden tegen de kinderen Ammons, en de HEERE hen voor mijn aangezicht geven zal, zal ik u dan tot een hoofd zijn?","10":"En de oudsten van Gilead zeiden tot Jeftha: De HEERE zij toehoorder tussen ons, indien wij niet alzo naar uw woord doen.","11":"Alzo ging Jeftha met de oudsten van Gilead, en het volk stelde hem tot een hoofd en overste over zich. En Jeftha sprak al zijn woorden voor het aangezicht des HEEREN te Mizpa.","12":"Voorts zond Jeftha boden tot den koning der kinderen Ammons, zeggende: Wat hebben ik en gij met elkander te doen, dat gij tot mij gekomen zijt, om tegen mijn land te krijgen?","13":"En de koning der kinderen Ammons zeide tot de boden van Jeftha: omdat Israël, als hij uit Egypte optoog, mijn land genomen heeft, van de Arnon af tot aan de Jabbok, en tot aan de Jordaan; zo geef mij dat nu weder met vrede.","14":"Maar Jeftha voer wijders voort, en zond boden tot den koning der kinderen Ammons.","15":"En hij zeide tot hem: Zo zegt Jeftha: Israël heeft het land der Moabieten, en het land der kinderen Ammons niet genomen;","16":"want als zij uit Egypte optogen, zo wandelde Israël door de woestijn tot aan de Schelfzee, en kwam te Kades.","17":"En Israël zond boden tot den koning der Edomieten, zeggende: Laat mij toch door uw land doortrekken; maar de koning der Edomieten gaf geen gehoor. En hij zond ook tot den koning der Moabieten, die ook niet wilde. Alzo bleef Israël in Kades.","18":"Daarna wandelde hij in de woestijn, en toog om het land der Edomieten en het land der Moabieten, en kwam van den opgang der zon aan het land der Moabieten, en zij legerden zich op gene zijde van de Arnon; maar zij kwamen niet binnen de landpale der Moabieten; want de Arnon is de landpale der Moabieten.","19":"Maar Israël zond boden tot Sihon, den koning der Amorieten, koning van Hesbon, en Israël zeide tot hem: Laat ons toch door uw land doortrekken tot aan mijn plaats.","20":"Doch Sihon betrouwde Israël niet door zijn landpale door te trekken; maar Sihon verzamelde al zijn volk, en zij legerden zich te Jaza; en hij streed tegen Israël.","21":"En de HEERE, de God Israëls, gaf Sihon met al zijn volk in de hand van Israël, dat zij hen sloegen; alzo nam Israël erfelijk in het ganse land der Amorieten, die in datzelve land woonden.","22":"En zij namen erfelijk in de ganse landpale der Amorieten, van de Arnon af tot aan de Jabbok, en van de woestijn tot aan de Jordaan.","23":"Zo heeft nu de HEERE, de God Israëls, de Amorieten voor het aangezicht van Zijn volk Israël uit de bezitting verdreven; en zoudt gij hunlieder erfgenaam zijn?","24":"Zoudt gij niet dengene erven, dien uw god Kamos voor u uit de bezitting verdreef? Alzo zullen wij al dengene erven, dien de HEERE, onze God, voor ons aangezicht uit de bezitting verdrijft.","25":"Nu voorts, zijt gij veel beter dan Balak, de zoon van Zippor, de koning der Moabieten? heeft hij ooit met Israël getwist? heeft hij ook ooit tegen hem gekrijgd?","26":"Terwijl Israël driehonderd jaren gewoond heeft in Hesbon, en in haar stedekens, en in Aroer en in de stedekens, en in al de steden, die aan de zijde van de Arnon zijn; waarom hebt gij het dan in dien tijd niet gered?","27":"Ook heb ik tegen u niet gezondigd, maar gij doet kwalijk bij mij, dat gij tegen mij krijgt; de HEERE, Die Rechter is, richte heden tussen de kinderen Israëls en tussen de kinderen Ammons!","28":"Maar de koning der kinderen Ammons hoorde niet naar de woorden van Jeftha, die hij tot hem gezonden had.","29":"Toen kwam de Geest des HEEREN op Jeftha, dat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door tot de kinderen Ammons.","30":"En Jeftha beloofde den HEERE een gelofte, en zeide: Indien Gij de kinderen Ammons ganselijk in mijn hand zult geven;","31":"Zo zal het uitgaande, dat uit de deur van mijn huis mij tegemoet zal uitgaan, als ik met vrede van de kinderen Ammons wederkom, dat zal des HEEREN zijn, en ik zal het offeren ten brandoffer.","32":"Alzo trok Jeftha door naar de kinderen Ammons, om tegen hen te strijden; en de HEERE gaf hen in zijn hand.","33":"En hij sloeg hen van Aroer af tot daar gij komt te Minnith, twintig steden, en tot aan Abel-keramim, met een zeer groten slag. Alzo werden de kinderen Ammons te ondergebracht voor het aangezicht der kinderen Israëls.","34":"Toen nu Jeftha te Mizpa bij zijn huis kwam, ziet, zo ging zijn dochter uit hem tegemoet, met trommelen en met reien. Zij nu was alleen, een enig *kind*; hij had uit zich *anders* geen zoon of dochter.","35":"En het geschiedde, als hij haar zag, zo verscheurde hij zijn klederen, en zeide: Ach, mijn dochter! gij hebt mij ganselijk nedergebogen, en gij zijt onder degenen, die mij beroeren; want ik heb mijn mond opengedaan tot den HEERE, en ik zal niet kunnen teruggaan.","36":"En zij zeide tot hem: Mijn vader! hebt gij uw mond opengedaan tot den HEERE, doe mij, gelijk als uit uw mond gegaan is; naardien u de HEERE volkomene wraak gegeven heeft van uw vijanden, van de kinderen Ammons.","37":"Voorts zeide zij tot haar vader: Laat deze zaak aan mij geschieden: Laat twee maanden van mij af, dat ik heenga, en ga tot de bergen, en bewene mijn maagdom, ik en mijn gezellinnen.","38":"En hij zeide: Ga heen; en hij liet haar twee maanden gaan. Toen ging zij heen met haar gezellinnen, en beweende haar maagdom op de bergen.","39":"En het geschiedde ten einde van twee maanden dat zij tot haar vader wederkwam, die aan haar volbracht zijn gelofte, die hij beloofd had; en zij heeft geen man bekend. Voorts werd het een gewoonheid in Israël,","40":"*Dat* de dochteren Israëls van jaar tot jaar heengingen, om de dochter van Jeftha, den Gileadiet, aan te spreken, vier dagen in het jaar."},"KJV":{"1":"Now Jephthah the Gileadite was a mighty man of valour, and he *was* the son of an harlot: and Gilead begat Jephthah.","2":"And Gilead's wife bare him sons; and his wife's sons grew up, and they thrust out Jephthah, and said unto him, Thou shalt not inherit in our father's house; for thou *art* the son of a strange woman.","3":"Then Jephthah fled from his brethren, and dwelt in the land of Tob: and there were gathered vain men to Jephthah, and went out","4":"And it came to pass in process of time, that the children of Ammon made war against Israel.","5":"And it was so, that when the children of Ammon made war against Israel, the elders of Gilead went to fetch Jephthah out of the land of Tob:","6":"And they said unto Jephthah, Come, and be our captain, that we may fight with the children of Ammon.","7":"And Jephthah said unto the elders of Gilead, Did not ye hate me, and expel me out of my father's house? and why are ye come unto me now when ye are in distress?","8":"And the elders of Gilead said unto Jephthah, Therefore we turn again to thee now, that thou mayest go with us, and fight against the children of Ammon, and be our head over all the inhabitants of Gilead.","9":"And Jephthah said unto the elders of Gilead, If ye bring me home again to fight against the children of Ammon, and the LORD deliver them before me, shall I be your head?","10":"And the elders of Gilead said unto Jephthah, The LORD be witness between us, if we do not so according to thy words.","11":"Then Jephthah went with the elders of Gilead, and the people made him head and captain over them: and Jephthah uttered all his words before the LORD in Mizpeh.","12":"And Jephthah sent messengers unto the king of the children of Ammon, saying, What hast thou to do with me, that thou art come against me to fight in my land?","13":"And the king of the children of Ammon answered unto the messengers of Jephthah, Because Israel took away my land, when they came up out of Egypt, from Arnon even unto Jabbok, and unto Jordan: now therefore restore those *lands* again peaceably.","14":"And Jephthah sent messengers again unto the king of the children of Ammon:","15":"And said unto him, Thus saith Jephthah, Israel took not away the land of Moab, nor the land of the children of Ammon:","16":"But when Israel came up from Egypt, and walked through the wilderness unto the Red sea, and came to Kadesh;","17":"Then Israel sent messengers unto the king of Edom, saying, Let me, I pray thee, pass through thy land: but the king of Edom would not hearken *thereto*. And in like manner they sent unto the king of Moab: but he would not *consent*: and Israel abode in Kadesh.","18":"Then they went along through the wilderness, and compassed the land of Edom, and the land of Moab, and came by the east side of the land of Moab, and pitched on the other side of Arnon, but came not within the border of Moab: for Arnon *was* the border of Moab.","19":"And Israel sent messengers unto Sihon king of the Amorites, the king of Heshbon; and Israel said unto him, Let us pass, we pray thee, through thy land into my place.","20":"But Sihon trusted not Israel to pass through his coast: but Sihon gathered all his people together, and pitched in Jahaz, and fought against Israel.","21":"And the LORD God of Israel delivered Sihon and all his people into the hand of Israel, and they smote them: so Israel possessed all the land of the Amorites, the inhabitants of that country.","22":"And they possessed all the coasts of the Amorites, from Arnon even unto Jabbok, and from the wilderness even unto Jordan.","23":"So now the LORD God of Israel hath dispossessed the Amorites from before his people Israel, and shouldest thou possess","24":"Wilt not thou possess that which Chemosh thy god giveth thee to possess? So whomsoever the LORD our God shall drive out from before us, them will we possess.","25":"And now *art* thou any thing better than Balak the son of Zippor, king of Moab? did he ever strive against Israel, or did he ever fight","26":"While Israel dwelt in Heshbon and her towns, and in Aroer and her towns, and in all the cities that *be* along by the coasts of Arnon, three hundred years? why therefore did ye not recover *them* within that time?","27":"Wherefore I have not sinned against thee, but thou doest me wrong to war against me: the LORD the Judge be judge this day between the children of Israel and the children of Ammon.","28":"Howbeit the king of the children of Ammon hearkened not unto the words of Jephthah which he sent","29":"Then the Spirit of the LORD came upon Jephthah, and he passed over Gilead, and Manasseh, and passed over Mizpeh of Gilead, and from Mizpeh of Gilead he passed over *unto* the children of Ammon.","30":"And Jephthah vowed a vow unto the LORD, and said, If thou shalt without fail deliver the children of Ammon into mine hands,","31":"Then it shall be, that whatsoever cometh forth of the doors of my house to meet me, when I return in peace from the children of Ammon, shall surely be the LORD'S, and I will offer it up for a burnt offering.","32":"So Jephthah passed over unto the children of Ammon to fight against them; and the LORD delivered them into his hands.","33":"And he smote them from Aroer, even till thou come to Minnith, *even* twenty cities, and unto the plain of the vineyards, with a very great slaughter. Thus the children of Ammon were subdued before the children of Israel.","34":"And Jephthah came to Mizpeh unto his house, and, behold, his daughter came out to meet him with timbrels and with dances: and she *was his* only child; beside her he had neither son nor daughter.","35":"And it came to pass, when he saw her, that he rent his clothes, and said, Alas, my daughter! thou hast brought me very low, and thou art one of them that trouble me: for I have opened my mouth unto the LORD, and I cannot go back.","36":"And she said unto him, My father, *if* thou hast opened thy mouth unto the LORD, do to me according to that which hath proceeded out of thy mouth; forasmuch as the LORD hath taken vengeance for thee of thine enemies, *even* of the children of Ammon.","37":"And she said unto her father, Let this thing be done for me: let me alone two months, that I may go up and down upon the mountains, and bewail my virginity, I and my fellows.","38":"And he said, Go. And he sent her away *for* two months: and she went with her companions, and bewailed her virginity upon the mountains.","39":"And it came to pass at the end of two months, that she returned unto her father, who did with her *according* to his vow which he had vowed: and she knew no man. And it was a custom in Israel,","40":"*That* the daug lass=\"wl wl-kjv\" data-code=\"H5157\">inherit</span> in our <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> for thou art the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of a <span class=\"wl wl-kjv\" data-code=\"H312\">strange</span> woman.","3":"Then <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H2897\">Tob:</span> and there were <span class=\"wl wl-kjv\" data-code=\"H3950\">gathered</span> <span class=\"wl wl-kjv\" data-code=\"H7386\">vain</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> to <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah,</span> and went out","4":"And it came to pass in process of <span class=\"wl wl-kjv\" data-code=\"H3117\">time,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> made <span class=\"wl wl-kjv\" data-code=\"H3898\">war</span> against Israel.","5":"And it was so, that when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> made <span class=\"wl wl-kjv\" data-code=\"H3898\">war</span> against <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">fetch</span> <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Tob:","6":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and be our <span class=\"wl wl-kjv\" data-code=\"H7101\">captain,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Ammon.","7":"And <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> Did not ye <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> me, and <span class=\"wl wl-kjv\" data-code=\"H1644\">expel</span> me out of my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house?</span> and why are ye <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto me now when ye are in distress?","8":"And the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah,</span> Therefore we turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to thee now, that thou mayest <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> with us, and <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> and be our <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> over all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of Gilead.","9":"And <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> If ye bring me home <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me, shall I be your head?","10":"And the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be <span class=\"wl wl-kjv\" data-code=\"H8085\">witness</span> between us, if we <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> not so according to thy words.","11":"Then <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> him <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> and <span class=\"wl wl-kjv\" data-code=\"H7101\">captain</span> over them: and <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">uttered</span> all his <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in Mizpeh.","12":"And <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> What hast thou to do with me, that thou art <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> against me to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> in my land?","13":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> of <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah,</span> Because <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> took <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> my <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> when they came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> from <span class=\"wl wl-kjv\" data-code=\"H769\">Arnon</span> even unto <span class=\"wl wl-kjv\" data-code=\"H2999\">Jabbok,</span> and unto <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan:</span> now therefore restore those lands <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> peaceably.","14":"And <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Ammon:","15":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah,</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> took not <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> nor the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Ammon:","16":"But when <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> through the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to Kadesh;","17":"Then <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Let me, I pray thee, pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> thy <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> but the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> would not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> thereto. And in like manner they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab:</span> but he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not consent: and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> in Kadesh.","18":"Then they went <span class=\"wl wl-kjv\" data-code=\"H3212\">along</span> through the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> by the east <span class=\"wl wl-kjv\" data-code=\"H4217\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> on the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> of <span class=\"wl wl-kjv\" data-code=\"H769\">Arnon,</span> but <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> not within the <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab:</span> for <span class=\"wl wl-kjv\" data-code=\"H769\">Arnon</span> was the <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> of Moab.","19":"And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> unto <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon;</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Let us <span class=\"wl wl-kjv\" data-code=\"H5674\">pass,</span> we pray thee, through thy <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">into</span> my place.","20":"But <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon</span> <span class=\"wl wl-kjv\" data-code=\"H539\">trusted</span> not <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> through his <span class=\"wl wl-kjv\" data-code=\"H1366\">coast:</span> but <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon</span> <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> all his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in <span class=\"wl wl-kjv\" data-code=\"H3096\">Jahaz,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against Israel.","21":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> <span class=\"wl wl-kjv\" data-code=\"H5511\">Sihon</span> and all his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them: so <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3423\">possessed</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of that country.","22":"And they <span class=\"wl wl-kjv\" data-code=\"H3423\">possessed</span> all the <span class=\"wl wl-kjv\" data-code=\"H1366\">coasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> from <span class=\"wl wl-kjv\" data-code=\"H769\">Arnon</span> even unto <span class=\"wl wl-kjv\" data-code=\"H2999\">Jabbok,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> even unto Jordan.","23":"So now the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> hath <span class=\"wl wl-kjv\" data-code=\"H3423\">dispossessed</span> the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and shouldest thou possess","24":"Wilt not thou <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> that which <span class=\"wl wl-kjv\" data-code=\"H3645\">Chemosh</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> giveth thee to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess?</span> So whomsoever the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall drive <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> us, them will we possess.","25":"And now art thou any thing <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> than <span class=\"wl wl-kjv\" data-code=\"H1111\">Balak</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6834\">Zippor,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab?</span> did he <span class=\"wl wl-kjv\" data-code=\"H7378\">ever</span> <span class=\"wl wl-kjv\" data-code=\"H7378\">strive</span> against <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> or did he <span class=\"wl wl-kjv\" data-code=\"H3898\">ever</span> fight","26":"While <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H2809\">Heshbon</span> and her <span class=\"wl wl-kjv\" data-code=\"H1323\">towns,</span> and in <span class=\"wl wl-kjv\" data-code=\"H6177\">Aroer</span> and her <span class=\"wl wl-kjv\" data-code=\"H1323\">towns,</span> and in all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> that be along by the <span class=\"wl wl-kjv\" data-code=\"H3027\">coasts</span> of <span class=\"wl wl-kjv\" data-code=\"H769\">Arnon,</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years?</span> why therefore did ye not <span class=\"wl wl-kjv\" data-code=\"H5337\">recover</span> them within that time?","27":"Wherefore I have not <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against thee, but thou <span class=\"wl wl-kjv\" data-code=\"H6213\">doest</span> me <span class=\"wl wl-kjv\" data-code=\"H7451\">wrong</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">war</span> against me: the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> the <span class=\"wl wl-kjv\" data-code=\"H8199\">Judge</span> be <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> between the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Ammon.","28":"Howbeit the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not unto the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> which he sent","29":"Then the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came upon <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah,</span> and he passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> and <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> and passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H4708\">Mizpeh</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> and from <span class=\"wl wl-kjv\" data-code=\"H4708\">Mizpeh</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> he passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Ammon.","30":"And <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed</span> a <span class=\"wl wl-kjv\" data-code=\"H5088\">vow</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If thou shalt without <span class=\"wl wl-kjv\" data-code=\"H5414\">fail</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> into mine hands,","31":"Then it shall be, that <span class=\"wl wl-kjv\" data-code=\"H3318\">whatsoever</span> cometh <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> of the <span class=\"wl wl-kjv\" data-code=\"H1817\">doors</span> of my <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> me, when I <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> from the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> shall surely be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S,</span> and I will offer it <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> for a burnt offering.","32":"So <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against them; and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into his hands.","33":"And he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them from <span class=\"wl wl-kjv\" data-code=\"H6177\">Aroer,</span> even till thou <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H4511\">Minnith,</span> even <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and unto the <span class=\"wl wl-kjv\" data-code=\"H58\">plain</span> of the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> with a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter.</span> Thus the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> were <span class=\"wl wl-kjv\" data-code=\"H3665\">subdued</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","34":"And <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpeh</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and, behold, his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him with <span class=\"wl wl-kjv\" data-code=\"H8596\">timbrels</span> and with <span class=\"wl wl-kjv\" data-code=\"H4246\">dances:</span> and she was his only <span class=\"wl wl-kjv\" data-code=\"H3173\">child;</span> beside her he had neither <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H176\">nor</span> daughter.","35":"And it came to pass, when he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> her, that he <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H162\">Alas,</span> my <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter!</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H3766\">brought</span> me <span class=\"wl wl-kjv\" data-code=\"H3766\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3766\">low,</span> and thou art one of them that <span class=\"wl wl-kjv\" data-code=\"H5916\">trouble</span> me: for I have <span class=\"wl wl-kjv\" data-code=\"H6475\">opened</span> my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> go back.","36":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, My <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> if thou hast <span class=\"wl wl-kjv\" data-code=\"H6475\">opened</span> thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> to me according to that <span class=\"wl wl-kjv\" data-code=\"H834\">which</span> hath <span class=\"wl wl-kjv\" data-code=\"H3318\">proceeded</span> out of thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth;</span> <span class=\"wl wl-kjv\" data-code=\"H310\">forasmuch</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5360\">vengeance</span> for thee of thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> even of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Ammon.","37":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> Let this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> for me: let me <span class=\"wl wl-kjv\" data-code=\"H7503\">alone</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">months,</span> that I may go <span class=\"wl wl-kjv\" data-code=\"H3212\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">bewail</span> my <span class=\"wl wl-kjv\" data-code=\"H1331\">virginity,</span> I and my <span class=\"wl wl-kjv\" data-code=\"H7464\">fellows.</span>","38":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go.</span> And he sent her <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> for <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">months:</span> and she <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with her <span class=\"wl wl-kjv\" data-code=\"H7464\">companions,</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">bewailed</span> her <span class=\"wl wl-kjv\" data-code=\"H1331\">virginity</span> upon the mountains.","39":"And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">months,</span> that she <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto her <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> who <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> with her according to his <span class=\"wl wl-kjv\" data-code=\"H5088\">vow</span> which he had <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed:</span> and she <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">man.</span> And it was a <span class=\"wl wl-kjv\" data-code=\"H2706\">custom</span> in Israel,","40":"That the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">yearly</span> to <span class=\"wl wl-kjv\" data-code=\"H8567\">lament</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> the <span class=\"wl wl-kjv\" data-code=\"H1569\">Gileadite</span> <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> in a year."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Gileadiet,","tekst":"Zie boven, Jdg 10:3."},{"catchword":"hoerekind;","tekst":"Hebreeuws, was een zoon ener vrouw, ener hoer. Zie Deu 23:2. Anders, de zonen ener waardin"},{"catchword":"Gilead had Jeftha gegenereerd","tekst":"Te onderscheiden van Gilead, den zoon van Machir, Jos 17:1, Jos 17:3, zijnde nochtans een zijner nakomelingen, van denzelfden naam."}],"2":[{"catchword":"dezer vrouw,","tekst":"Te weten, van zijn echte vrouw."},{"catchword":"andere vrouw","tekst":"Dat is, een vreemde, die geen echte vrouw van onzen vader geweest is."}],"3":[{"catchword":"Tob;","tekst":"Een landstreek, gelegen langs het gebergte Gilead, bij den ingang van Woest- Arabië, aan de grenzen der Ammonieten. Zie ook 2Sa 10:6, 2Sa 10:8."},{"catchword":"ijdele mannen vergaderden zich tot Jeftha,","tekst":"Of, ledige, behoeftige, geen middel hebbende om te leven."},{"catchword":"togen met hem uit","tekst":"Om buit te halen, vermoedelijk van de Ammonieten, hetwelk de Israëlieten te meer heeft kunnen bewegen om hem in den krijg te gebruiken tegen de Ammonieten."}],"4":[{"catchword":"En het geschiedde,","tekst":"Hier wordt nu vervolgd de historie, die in Jdg 10:18 was begonnen, nadat er tussen ingevoegd was het voorgaande verhaal van Jeftha."},{"catchword":"na enige dagen,","tekst":"Na de verklaring, die door de oversten der Gileadieten gedaan was, Jdg 10:18, of na den tijd, die in Jdg 10:8, is uitgedrukt."}],"5":[{"catchword":"oudsten van Gilead heengingen,","tekst":"Of, op een bevel des Heeren, wien zij mogen hebben raad gevraagd, of immers door zijn bijzonder ingeven en regering."},{"catchword":"Tob","tekst":"Zie vs.3."}],"6":[{"catchword":"overste,","tekst":"Of, hertog, generaal, krijgsoverste; maar geen koning, gelijk de Sichemieten Abimélech hadden gemaakt."}],"7":[{"catchword":"terwijl gij in benauwdheid zijt?","tekst":"Hebreeuws, terwijl ulieden angst, of benauwdheid is."}],"10":[{"catchword":"toehoorder tussen ons,","tekst":"Om getuige te zijn, of als rechter tussen beiden, ons te straffen zo wij anders bij u doen. Vergelijk Deu 1:16; 1Ki 3:11; Lam 3:61-62; Mal 2:14."}],"11":[{"catchword":"woorden","tekst":"Die hij tevoren tot de gezanten des volks gesproken had."},{"catchword":"aangezicht des HEEREN te Mizpa","tekst":"Niet bij de ark des verbonds [gelijk dit dikwijls genomen is] maar in de generale vergadering des volks deed hij zijne verklaring [gelijk een hels des geloofs, Heb 11:32 ] met religieuze aandacht, als in Gods tegenwoordigheid, of met aanroeping zijns heiligen naams, en onderlingen eed. De ark des verbonds was ten tijde van Jozua gebracht te Silo, Jos 18:1, en was nog aldaar ten tijde van Eli; 1Sa 1:3."}],"12":[{"catchword":"zeggende","tekst":"Versta, door de gezanten. Alzo onder, vs.17, en in het volgende."},{"catchword":"Wat hebben ik en gij met elkander te doen,","tekst":"Hebreeuws, wat is mij en u, of wat hebben ik en gij? Zie deze manier van spreken ook 2Sa 16:10; Joh 2:4, enz."},{"catchword":"tegen mijn land te krijgen?","tekst":"Jeftha spreekt hier in den naam des volks, welks voorvechter hij was."}],"13":[{"catchword":"Arnon af tot aan de Jabbok,","tekst":"Zie van Arnon, Num 21:13-15; van Jabbok, Gen 32:22, enz."},{"catchword":"aan de Jordaan;","tekst":"Van het gebergte Gileads oostwaarts, tot aan de Jordaan westwaarts."}],"14":[{"catchword":"voer wijders voort,","tekst":"Dit is een zeer wijze en opmerkelijke daad van Jeftha, dat hij Gods bevel betrachtende, Deu 2:19, eerst begeerd heeft te weten de oorzaken, die de Ammonieten tot dezen krijg mochten hebben bewogen, en daarop hun koning met vele zeer bondige redenen zoekt te overtuigen en tot afstand te bewegen; dienende dit alles tot kwijting en gerustheid zijner conscientie, alsook tot versterking van Israël."}],"15":[{"catchword":"zeide tot hem","tekst":"Door de gezanten, of liet hem zeggen."},{"catchword":"Moabieten,","tekst":"Want God had van beiden tegenbevel gegeven, omdat zij Lots nakomelingen waren. Zie Deu 2:9, Deu 2:19."}],"16":[{"catchword":"Kades","tekst":"Anders genaamd Zin, te onderscheiden van Kades Barnea. Zie Gen 14:7; Num 13:26, en Num 20:14, en Num 33:36."}],"17":[{"catchword":"Moabieten,","tekst":"Dit kan men ook afnemen uit Deu 2:29."}],"18":[{"catchword":"hij in de woestijn,","tekst":"Namelijk, Israël."},{"catchword":"zij legerden zich","tekst":"Het volk Israëls."},{"catchword":"Arnon;","tekst":"Zie boven, vs.13."}],"19":[{"catchword":"zeide tot hem","tekst":"Zie boven, vs.12."},{"catchword":"mijn plaats","tekst":"Dat is, onze, te weten, Israëls; onze, dat is, die ons van God gegeven is, namelijk het land Kanaän."}],"20":[{"catchword":"landpale door te trekken;","tekst":"Dat is, door zijn land; alzo onder, vs.22."}],"22":[{"catchword":"landpale der Amorieten,","tekst":"Dat is, het ganse land Sihon, besloten tussen deze palen, de Arnon in het zuiden, de Jabbok in het noorden, de woestijn of Woest Arabië in het oosten, en de Jordaan in het westen."}],"23":[{"catchword":"hunlieder erfgenaam zijn?","tekst":"Hebreeuws, zoudt gij hem erven? Hem, namelijk, den Amoriet; dat is, het land der Amorieten; alsook in vs.24, Deu 9:1, en elders dikwijls. Jeftha wil zeggen dat dit is tegen recht en billijkheid."}],"24":[{"catchword":"Kamos","tekst":"Een afgod der Moabieten, en [gelijk hier blijkt] der Ammonieten. Zie Num 21:29; 1Ki 11:7; Jer 48:7, Jer 48:13, Jer 48:46."},{"catchword":"wij al dengene erven,","tekst":"Met recht, alzo onze God de enige ware God is, wien alles toekomt."}],"25":[{"catchword":"veel beter dan Balak,","tekst":"Hebreeuws, beter beter. De zin is: Hebt gij nu zoveel meerder of groter recht dan Balak, die Israël nooit daarover lastig gevallen is? Zie van Balak Num 22, Num 23, Num 24."},{"catchword":"getwist?","tekst":"Hebreeuws, twistende getwist, en alzo: strijdende gestreden, of krijgende gekrijgd."}],"26":[{"catchword":"driehonderd jaren","tekst":"Hier [alsook elders in de Heilige Schrift] wordt een rond getal gesteld; alhoewel, naar sommiger rekening, enige weinige jaren zouden overschieten, als men de jaren neemt van den uittocht der kinderen Israëls uit Egypte, waarvan Jeftha dit verhaal begonnen heeft, en meer jaren onder de drie honderd zijn dan men zou rekenen van de victorie van Israël tegen Sihon bekomen. Zie van dit gebruik der Heilige Schrift Gen 15:13, en onder, Jdg 20:46; 2Sa 5:5."},{"catchword":"gered?","tekst":"Dat de Ammonieten in zo langen tijd zonder twijfel eens zouden hebben bestaan, indien zij zulk een recht vermeend hadden te hebben."}],"27":[{"catchword":"ik tegen u niet gezondigd,","tekst":"Jeftha wil zeggen dat Israël den Ammonieten hiertoe geen oorzaak gegeven heeft."},{"catchword":"doet kwalijk bij mij,","tekst":"Hebreeuws, gij doet kwaad met mij."}],"28":[{"catchword":"gezonden had","tekst":"Dat is, door de gezanten hem hadden laten aanzeggen."}],"29":[{"catchword":"kwam de Geest des HEEREN op Jeftha,","tekst":"Hebreeuws, was, werd; dat is, toog hem aan, gelijk boven, Jdg 6:34, en Jdg 3:10."},{"catchword":"Gilead en Manasse doortrok;","tekst":"Dat is, door het gedeelte des lands Gilead, dat de halve stam van Manasse over de Jordaan bewoonde."},{"catchword":"in Gilead,","tekst":"Onderscheiden van andere plaatsen, hebbende denzelfden naam. Zie boven, Jdg 10:17."}],"30":[{"catchword":"ganselijk in mijn hand zult geven;","tekst":"Of, zekerlijk. Hebreeuws, gevende geven zult."}],"31":[{"catchword":"des HEEREN zijn,","tekst":"Of, den HEERE; te weten, geheiligd zijn."},{"catchword":"en ik zal","tekst":"Anders, of, alsof hij zeide: Mag het geofferd worden, ik zal het offeren; zo niet, het zal evenwel den HEERE geheiligd zijn."},{"catchword":"offeren ten brandoffer","tekst":"Welverstaande, indien het zo is, dat het naar Gods wet geoorloofd is te offeren; nu was het niet alleen verboden mensen te offeren, maar ook onreine beesten. Zie Lev 27:11-13."}],"33":[{"catchword":"Aróër af","tekst":"Liggende aan de beek Arnon; Deu 3:12. Niet waar deze beek van het gebergte Gilead westwaarts afloopt in de Jordaan, maar uit het zuidelijke einde van dit gebergte zuidwaarts heenloopt en eindelijk valt in de Zoutzee."},{"catchword":"Minnith,","tekst":"Gelegen in het oosten over de beek Arnon."},{"catchword":"Abél-kerámim,","tekst":"Dit wordt door sommigen overgezet: Het plein der wijngaarden."}],"34":[{"catchword":"uit zich","tekst":"Dat is, die uit hem was voortgekomen."}],"35":[{"catchword":"ganselijk nedergebogen,","tekst":"Hebreeuws, gij hebt mij nederbuigende nedergebogen. Aldus ontstelt Jeftha, omdat zijn enig kind in den maagdelijken staat zou moeten blijven, en hem geen nakomelingen van haar geboren mochten worden."},{"catchword":"onder degenen,","tekst":"Dat is, gij verstoort mij in deze zaak, gelijk anderen in andere zaken mij verstoord hebben. Vergelijk Psa 54:6."},{"catchword":"teruggaan","tekst":"Dat is, ik zal van mijn gelofte niet kunnen afwijken, ik zal ze moeten volbrengen; niet denkende dat hij ze met dertig sikkelen zilvers, naar den sikkel des heiligdoms, had kunnen lossen, naar de wet Gods; Lev 27:4-5. Of hij heeft gemeend dat hij zijn gelofte zo hoog en sterk gedaan had, dat de lossing geen plaats had, of van zichzelf was uitgesloten."}],"36":[{"catchword":"doe mij,","tekst":"De dochter onderwerpt zich aan de gelofte haars vaders, onder wiens macht zij nog stond, en met wiens toestemming zij buiten dat vermocht een gelofte te doen. Zie Num 30:4-5. Vergelijk ook Luk 2:37; 1Co 7:25-28."},{"catchword":"volkomene wraak gegeven heeft","tekst":"Hebreeuws, wraken gedaan heeft."}],"37":[{"catchword":"Laat twee maanden van mij af,","tekst":"Dat is, vergun mij twee maanden tijds."},{"catchword":"af tot de bergen,","tekst":"Hieruit nemen sommigen af dat Jeftha's huis op een hogen berg gelegen is geweest, gelijk de plaatsen, Mizpa genoemd, gemeenlijk, als wachtplaatsen, op hoge bergen gelegen waren. Zie boven, Jdg 10:17."},{"catchword":"bewene mijn maagdom,","tekst":"Omdat het voortbrengen van kinderen te dien tijde zeer veel geacht, en het contrarie voor smadelijk gehouden werd. Zie Gen 30:23. Merk hier en in het volgende, dat zij niet wil gaan wenen, omdat zij geslacht of gedood en ten brandoffer zal moeten worden opgeofferd, maar alleenlijk spreekt van haar maagdom, overeenkomende met hetgeen in de volgende verzen verhaald wordt."}],"39":[{"catchword":"volbracht zijn gelofte,","tekst":"Doende haar blijven [gelijk in het volgende verhaald wordt] in haar maagdelijken stand, en haar den Heere heiligende en afzonderende volgens zijn belofte vs.37. Vergelijk 1Sa 1:22; Luk 2:37; 1Co 7:32."},{"catchword":"bekend","tekst":"Zie Gen 4:1, en Gen 19:8. Deze woorden zijn een platte en naakte verklaring van hetgeen Jeftha aan zijne dochter, volgens den zin zijner gelofte, gedaan heeft."},{"catchword":"gewoonheid in Israël,","tekst":"Hebreeuws, inzetting, ordinantie."}],"40":[{"catchword":"van jaar tot jaar heengingen,","tekst":"Hebreeuws, van dagen tot dagen; dat is, van jaar tot jaar, of jaarlijks; gelijk de laatste woorden van dit vs. verklaren. Zie ook Lev 25:29."},{"catchword":"aan te spreken,","tekst":"Of, samenspreken, kouten; te weten, om haar te vergezelschappen en in haar maagdelijken stand te troosten en te verkwikken. Het Hebreeuwse woord wordt ook gevonden boven, Jdg 5:11, waar het dezelfde betekenis heeft, die hier in den tekst gevolgd is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now Jephtah the Gileadite [See above chap.10.on verse.3.] was a mighty man of valour; he was a child of an harlot: [Hebrew. Was arson of a woman, and harlot? See Deut.23.on verse 2. Otherwise, the son of a hostess] but Gilead had begotten Jephtah. [To distinguish him from the son of Machiz, Josua.17.1,3. Being nevertheless of his posterity, of the same name]"}],"2":[{"catchword":null,"tekst":"Gileads wife bare him also sons: and the sons of this woman [To wit, of his lawful wife,] being grown great, thrust Jephtah out, and said unto him; thou shalt not inherit in the house of our father, for thou art a son of another woman. [That is, of a strange woman, which was no legitimate or lawful wife of our father]"}],"3":[{"catchword":null,"tekst":"then Jephtah fled before the face of his brethren, and dwelt in the land of Tob: [A country lying along the mountain of Gilead, by the entering of the West-Arabia, on the borders of the Ammonites. See also 2 Samuel.10.6, 8.] And vain [or idle, necessitous, that had no means, or took no course for a livelihood] men assembled themselves unto Jephtaah, and went out with him. [to wit, to fetch, or take prey, perhaps from the Ammonites, which the more might move the Isrealites to make use of him in their war against the Ammonites]"}],"4":[{"catchword":null,"tekst":"And it came to pass, after certain days, that the children of Ammon made a war against Israel, [Here is now prosecuted the history, which was begun in the end of the former chapter, after that there was inserted the precedent relation concerning Jephtah] after certain days [viz. after the Declaration made by the Rulers or Governours of the Gileadites, chap.10.18. or after the time expressed in the same chap.v.8.]"}],"5":[{"catchword":null,"tekst":"So it came to pass, when the children of Ammon made war against Israel, that the eldest of Gilead went their way to fetch Jephtah [To wit, either by the Lords command, of whom they peradventure might have asked counsel, or at least by his special instinct and providence] out of the land of Tob. [See on verse.3.]"}],"6":[{"catchword":null,"tekst":"And they said unto Jephtah; Come, and be a Governour to us [Or, Duke, General, but no King, as the Sichemites had made Abimelech] that we may fight against the children of Ammon."}],"7":[{"catchword":null,"tekst":"But Jephtah said unto the eldest of the Gilead; did ye not hate me, and thrust me out of my fathers house? Wherefore then ye come unto me now, while ye are in distress? [Hebrew. While anguish or, distress is to you]"}],"8":[{"catchword":null,"tekst":"And the Eldest of Gilead said unto Jephtah; Therefore are we now come unto thee again, that thou mayest go with us, and fight against the children of Ammon: and thou salt be a head unto us, over all the inhabitants of Gilead."}],"9":[{"catchword":null,"tekst":"Then said Jephtah unto the eldest of Gilead; If ye fetch me back again to fight against the children of Ammon, and the LORD shall deliver them up before my face, shall I then be an head unto you?"}],"10":[{"catchword":null,"tekst":"And the eldest of Israel said unto Jephtah; the LORD be an hearer between us, [For to be witness, or as judge between us both, to punish us, if we deal otherwise by thee. Compare Deut.1.16. 1 King.3.11. Lam 3:61,62. Malach. 2. 14.] If we do not so according to thy word."}],"11":[{"catchword":null,"tekst":"So Jephtah went with the Eldest of Gilead, and the people made him an head and Ruler over them: and Jephtah and spake all his words [which he had spoken before the ambassadors of the people ] before the face of the Lord at Mispa [not by or before the ark of the covenant as this is often so taken but in the general assembly of the people made he this speech or declaration as a champion of faith Heb 11:31 with religious attention as in the presence of God or with calling upon his name and mutual oath the ark of the covenant was in Joshua&acirc;&euro;&trade;s time brought unto Silo Jos 18:1 and was yet there in Bila&acirc;&euro;&trade;s time 1Sa 1:3.]"}],"12":[{"catchword":null,"tekst":"Moreover Jepther sent passengers unto the king of the children of Ammon saying [understand by the ambassadors so below verse 17 and in the following] what have I and thou to do one with another [Heb. what is it to me and thee? Or what have I and thou? See this Phrase also 2Samuel 16 on verses 19 Joh 2:4 &c.] That thou art come unto me to make war against my land?[Jupiter speaketh here in the name of the people whose champion he was.]"}],"13":[{"catchword":null,"tekst":"And the king of the children of Ammon said unto the messengers of Jephtar because Israel when he went up out of Egypt took my land from Ammon unto Jabbok [see of Ammon Num 21:13,14,15 of Jabbok Gen 32:22 &c.] and unto Jordan [from the mountain of Gilead eastwards unto Jordan westwards ] therefore restore now that again unto peaceably."}],"14":[{"catchword":null,"tekst":"But Jephtah proceedeth yet further and sent messengers unto the king of children of Ammon [this is a very discreet and remarkable act of Jephtah that he considering Gods command Deu 2:19 first desisteth to know the cause which have moved the Ammonites unto this war and thereupon seeketh to convince their king with many very strong and impregnable arguments and to draw him to desist all the tending to quitting and quieting of his conscience as also to the confirming and strengthening of Israel.]"}],"15":[{"catchword":null,"tekst":"And he said unto him [that is by the messengers or ambassadors or sent this message to him ] then said Japthah Israel hath not taken the land of the Moabites nor the land of the children of Ammon [For God hath given command to the contrary concerning both because they were lots offsprings or posterity see Deu 2:9,19.]"}],"16":[{"catchword":null,"tekst":"For when they were come up out of Egypt Israel then walked through the wilderness unto the red sea and came unto Kades [otherwise called Zin distinct or different from Cades Barnea see Genesis 14 on verse 7 Numbers 13 on verse 26 and chapter 20.14 and 33.36.]"}],"17":[{"catchword":null,"tekst":"And Israel sent messengers unto the king of the Edomites saying let me I pray thee pass through thy land but the king of the Edomites gave no hearing and he sent also unto the king of the Moabites who would also not [this also may be gathered from Deu 2:29] so Israel also abode kades."}],"18":[{"catchword":null,"tekst":"Afterwards he :"But the king of the children of Ammon hearken not unto the words of Jephtah which he had sent unto him [that is had caused to be told him to the ambassadors.]"}],"29":[{"catchword":null,"tekst":"Then the spirit of the Lord came [ Heb. was waxed that is endued him as above chapter 6.34 and chapter 3.10] upon Gideon that he passed through Gilead and Mannasseh [ Through the division of the land of Gilead which the half of Mannasseh beyond the Jordan inhabited ] for he passed through unto Mizpa in Gilead [distinct from other places bearing the same name see above chapter 10. On verse 17] and from Mizpa in Gilead he passed through unto the children of Ammon."}],"33":[{"catchword":null,"tekst":"And smote them from the Aroer [lying at the brook Arnon Deu 3:12 now where this brook runneth down from the mountain Gilead westward into the Jordan but out of the south end of the mountain runneth along southwards & at length falleth into the salt sea] till thou come to Minnith [lying in the east beyond the brook Arnon] twenty cities and unto Abel Rearming [this is by some translated the plain of the vineyards ] with a very great slaughter thus the children of Ammon were subdued before the face of the children of Israel."}],"34":[{"catchword":null,"tekst":"Now when when Japhtah came to Mizpa near his house behold his daughter went to meet him with drums and dances now she was a lone and only child he had not of him [ that which came or sprung from him ] else any other son or daughter."}],"35":[{"catchword":null,"tekst":"And it came to pass when he saw her that he rent his clothes and said Ah! My daughter thou hast quiet bowed me down [Heb. bowing down thou hast bowed me bowed me down thus is Jephtah troubled because his only child was to continue a virgin and no offspring or posterity was to be born unto him for her] and thou art among those that trouble me [that is thou troublest me in this thing as others have troubled me in other things compare Psalms 54 on verse 6] for I have opened my mouth unto the Lord and I shall not be able to go back [ that is I shall not be able to recede from my vow so high and strong that it could no ways be loosened nor broken.]"}],"39":[{"catchword":null,"tekst":"And it came to pass at the end of two months that she returned to her father who towards her fulfilled his vow [causing her to abide as is mentioned in that which followeth in her maiden state and condition and consencrating her apart from the Lord according to his vow verse 31 compare 1Sa 2:22 Luk 2:37 1Co 7:32] which he had promised and she knew no man [see Genesis 4 on verse 1 and 19 on verse 8 these words are a plain and naked exposition of that which Jephthah did unto hi daughter according to the sense and meaning of his vow ] moreover it became a custom [Heb. statute ordinance ] in Israel."}],"40":[{"catchword":null,"tekst":"That the daughters of Israel went their ways from year to year to speak with [talk together with discourse] the daughter of Jephtah the Gileadite [Viz. to accompany her and to comfort and cherish her in her maiden condition the Hebrew word is also found above chapter 5.11 where it hath the same signification which is here followed in the text] four days in the year."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
