Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In die dagen was er geen koning in Israël; en in dezelfde dagen zocht de stam van Dan voor zich een erfenis om te wonen; want tot op die dag was hun onder de stammen van Israël niet *genoeg* ter erfenis toegevallen.","2":"Zo zonden de kinderen van Dan uit hun geslacht vijf mannen uit hun gebied, strijdbare mannen, van Zora en van Esthaol, om het land te verkennen en te doorzoeken; en zij zeiden tegen hen: Ga, doorzoek het land. En zij kwamen aan het gebergte van Efraïm, tot aan het huis van Micha, en overnachtten daar.","3":"Toen zij bij het huis van Micha waren, herkenden zij de stem van de jongeman, de Leviet; en zij weken daarheen af, en zeiden tegen hem: Wie heeft u hier gebracht, en wat doet u hier, en wat hebt u hier?","4":"En hij zei tegen hen: Zo en zo heeft Micha met mij gedaan; en hij heeft mij gehuurd, en ik ben zijn priester geworden.","5":"Toen zeiden zij tegen hem: Vraag toch God, dat wij mogen weten of onze weg, waarop wij gaan, voorspoedig zal zijn.","6":"En de priester zei tegen hen: Ga in vrede; uw weg, die u zult gaan, is voor het aangezicht van de HEERE.","7":"Toen gingen die vijf mannen heen, en kwamen bij Lais; en zij zagen het volk dat daar te midden woonde, levend in zekerheid, naar de gewoonte van de Sidoniërs, rustig en zorgeloos; en er was geen machthebber die *iemand* om enige zaak schande aandeed in dat land; ook waren zij ver van de Sidoniërs, en hadden met niemand iets te maken.","8":"En zij kwamen bij hun broeders te Zora en te Esthaol, en hun broeders zeiden tegen hen: Wat *zegt* u?","9":"En zij zeiden: Maak u op, en laat ons tegen hen optrekken; want wij hebben dat land bekeken, en zie, het is zeer goed; zult u dan stil blijven? Wees niet lui om te gaan, en om erin te trekken, om dat land in erfelijk bezit te nemen;","10":"(Als u daarheen gaat, zult u komen bij een zorgeloos volk, en dat land is wijd van omvang) want God heeft het in uw hand gegeven; een plaats waar geen gebrek is aan iets van wat op de aarde is.","11":"Toen vertrokken van daar, uit het geslacht van Dan, van Zora en van Esthaol, zeshonderd man, aangegord met oorlogswapens.","12":"En zij trokken op en legerden zich bij Kirjath-jearim, in Juda; daarom noemden zij die plaats Machane-dan, tot op deze dag; zie, het ligt achter Kirjath-jearim.","13":"En van daar trokken zij door naar het gebergte van Efraïm, en zij kwamen tot aan het huis van Micha.","14":"Toen antwoordden de vijf mannen die gegaan waren om het land van Lais te verkennen, en zeiden tegen hun broeders: Weet u ook dat er in die huizen een efod is, en terafim, en een gesneden beeld en een gegoten beeld? Bedenk dus nu wat u te doen hebt.","15":"Toen weken zij daarheen af, en kwamen bij het huis van de jongeman, de Leviet, ten huize van Micha; en zij vroegen hem naar zijn welzijn.","16":"En de zeshonderd mannen die van de kinderen van Dan waren, met hun oorlogswapens aangegord, bleven staan bij de ingang van de poort.","17":"Maar de vijf mannen die gegaan waren om het land te verkennen, gingen naar binnen, kwamen daar aan, *en* namen het gesneden beeld weg, en de efod, en de terafim, en het gegoten beeld; de priester bleef staan bij de ingang van de poort, met de zeshonderd mannen die met oorlogswapens aangegord waren.","18":"Toen dezen dus het huis van Micha waren binnengegaan, en het gesneden beeld, de efod, en de terafim, en het gegoten beeld hadden weggenomen, zei de priester tegen hen: Wat doet u?","19":"En zij zeiden tegen hem: Zwijg, leg uw hand op uw mond, en ga met ons mee, en wees ons tot een vader en tot een priester! Is het beter dat u priester bent voor het huis van één man, of dat u priester bent voor een stam en een geslacht in Israël?","20":"Toen werd het hart van de priester vrolijk, en hij nam de efod, en de terafim, en het gesneden beeld, en hij ging te midden van het volk.","21":"Zo keerden zij zich om en trokken verder; en zij stelden de kinderen, en het vee, en de bagage voor zich uit.","22":"Toen zij nu ver van het huis van Micha gekomen waren, werden de mannen die in de huizen woonden die bij het huis van Micha waren, bijeengeroepen, en zij haalden de kinderen van Dan in.","23":"En zij riepen de kinderen van Dan achterna; en dezen keerden zich om, en zeiden tegen Micha: Wat is er met u, dat u zo bent bijeengeroepen?","24":"Toen zei hij: U hebt mijn goden die ik gemaakt had weggenomen, alsook de priester, en bent weggegaan; wat heb ik nu nog? Wat is dit dan, dat u tegen mij zegt: Wat is er met u?","25":"Maar de kinderen van Dan zeiden tegen hem: Laat uw stem bij ons niet horen, anders vallen misschien mannen met een verbitterd gemoed u aan, en verliest u uw leven, en het leven van uw huis.","26":"Zo gingen de kinderen van Dan hun weg; en toen Micha zag dat zij sterker waren dan hij, keerde hij zich om en ging terug naar zijn huis.","27":"Zij namen dus wat Micha gemaakt had, en de priester die hij gehad had, en kwamen bij Lais, bij een rustig en zorgeloos volk, en sloegen hen met de scherpte van het zwaard, en de stad verbrandden zij met vuur.","28":"En er was niemand die hen bevrijdde; want zij lag ver van Sidon, en zij hadden met niemand iets te maken; en zij *lag* in het dal dat bij Beth-rechob is. Daarna herbouwden zij de stad, en woonden daarin.","29":"En zij noemden de naam van de stad Dan, naar de naam van hun vader Dan, die aan Israël geboren was; hoewel de naam van deze stad voorheen Lais was.","30":"En de kinderen van Dan richtten voor zich dat gesneden beeld op; en Jonathan, de zoon van Gersom, de zoon van Manasse, hij en zijn zonen waren priesters voor de stam van Dan, tot aan de dag dat het land gevankelijk werd weggevoerd.","31":"Zo stelden zij voor zich het gesneden beeld van Micha op, dat hij gemaakt had, al de dagen dat het huis van God te Silo was."},"SV":{"1":"In die dagen was er geen koning in Israël; en in dezelve dagen zocht de stam der Danieten voor zich een erfenis om te wonen; want hun was tot op dien dag onder de stammen van Israël niet *genoegzaam* ter erfenis toegevallen.","2":"Zo zonden de kinderen van Dan uit hun geslacht vijf mannen uit hun einden, mannen, die strijdbaar waren, van Zora en van Esthaol, om het land te verspieden, en dat te doorzoeken; en zij zeiden tot hen: Gaat, doorzoekt het land. En zij kwamen aan het gebergte van Efraïm, tot aan het huis van Micha, en vernachtten aldaar.","3":"Zijnde bij het huis van Micha, zo kenden zij de stem van den jongeling, den Leviet; en zij weken daarheen, en zeiden tot hem: Wie heeft u hier gebracht, en wat doet gij alhier, en wat hebt gij hier?","4":"En hij zeide tot hen: Zo en zo heeft Micha mij gedaan; en hij heeft mij gehuurd, en ik ben hem tot een priester.","5":"Toen zeiden zij tot hem: Vraag toch God, dat wij mogen weten, of onze weg, op welken wij wandelen, voorspoedig zal zijn.","6":"En de priester zeide tot hen: Gaat in vrede; uw weg, welken gij zult heentrekken, is voor den HEERE.","7":"Toen gingen die vijf mannen heen, en kwamen te Lais; en zij zagen het volk, hetwelk in derzelver midden was, zijnde gelegen in zekerheid, naar de wijze der Sidoniërs, stil en zeker zijnde; en daar was geen erfheer, die *iemand* om enige zaak schande aandeed in dat land; ook waren zij verre van de Sidoniërs, en hadden niets te doen met enigen mens.","8":"En zij kwamen tot hun broederen te Zora en te Esthaol, en hun broeders zeiden tot hen: Wat *zegt* gijlieden?","9":"En zij zeiden: Maakt u op, en laat ons tot hen optrekken; want wij hebben dat land bezien, en ziet, het is zeer goed; zoudt gij dan stil zijn? Weest niet lui om te trekken, dat gij henen inkomt, om dat land in erfelijke bezitting te nemen;","10":"(Als gij daarhenen komt, zo zult gij komen tot een zorgeloos volk, en dat land is wijd van ruimte) want God heeft het in uw hand gegeven; een plaats, alwaar geen gebrek is van enig ding, dat op de aarde is.","11":"Toen reisden van daar uit het geslacht der Danieten, van Zora en van Esthaol, zeshonderd man, aangegord met krijgswapenen.","12":"En zij togen op, en legerden zich bij Kirjath-jearim, in Juda; daarom noemden zij deze plaats, Machane-dan, tot op dezen dag; ziet, het is achter Kirjath-jearim.","13":"En van daar togen zij door naar het gebergte van Efraïm, en zij kwamen tot aan het huis van Micha.","14":"Toen antwoordden de vijf mannen, die gegaan waren om het land van Lais te verspieden, en zeiden tot hun broederen: Weet gijlieden ook, dat in die huizen een efod is, en terafim, en een gesneden en een gegoten beeld? Zo weet nu, wat u te doen zij.","15":"Toen weken zij daarheen, en kwamen aan het huis van den jongeling, den Leviet, ten huize van Micha; en zij vraagden hem naar vrede.","16":"En de zeshonderd mannen, die van de kinderen van Dan waren, met hun krijgswapenen aangegord, bleven staan aan de deur van de poort.","17":"Maar de vijf mannen, die gegaan waren om het land te verspieden, gingen op, kwamen daarhenen in, *en* namen weg het gesneden beeld, en den efod, en de terafim, en het gegoten beeld; de priester nu bleef staan aan de deur van de poort, met de zeshonderd mannen, die met krijgswapenen aangegord waren.","18":"Als die nu ten huize van Micha waren ingegaan, en het gesneden beeld, den efod, en de terafim, en het gegoten beeld weggenomen hadden, zo zeide de priester tot hen: Wat doet gijlieden?","19":"En zij zeiden tot hem: Zwijg, leg uw hand op uw mond, en ga met ons, en wees ons tot een vader en tot een priester! Is het beter, dat gij een priester zijt voor het huis van een man, of dat gij een priester zijt boeten voor een stam, en een geslacht in Israël?","20":"Toen werd het hart van den priester vrolijk, en hij nam den efod, en de terafim, en het gesneden beeld, en hij kwam in het midden des volks.","21":"Alzo keerden zij zich, en togen voort; en zij stelden de kinderkens, en het vee, en de bagage voor zich.","22":"Als zij nu verre van Micha’s huis gekomen waren, zo werden de mannen, zijnde in de huizen, die bij het huis van Micha waren, bijeengeroepen, en zij achterhaalden de kinderen van Dan.","23":"En zij riepen de kinderen van Dan na; dewelke hun aangezichten omkeerden, en zeiden tot Micha: Wat is u, dat gij bijeengeroepen zijt?","24":"Toen zeide hij: Gijlieden hebt mijn goden, die ik gemaakt had, weggenomen, mitsgaders den priester, en zijt weggegaan; wat heb ik nu meer? Wat is het dan, dat gij tot mij zegt: Wat is u?","25":"Maar de kinderen van Dan zeiden tot hem: Laat uw stem bij ons niet horen, opdat niet misschien mannen, van bitteren gemoede, op u aanvallen, en gij uw leven verliest, en het leven van uw huis.","26":"Alzo gingen de kinderen van Dan huns weegs; en Micha, ziende, dat zij sterker waren dan hij, zo keerde hij om, en kwam weder tot zijn huis.","27":"Zij dan namen wat Micha gemaakt had, en den priester, die hij gehad had, en kwamen te Lais, tot een stil en zeker volk, en sloegen hen met de scherpte des zwaards, en de stad verbrandden zij met vuur.","28":"En er was niemand, die hen verloste; want zij was verre van Sidon, en zij hadden niets met enigen mens te doen; en zij *lag* in het dal, dat bij Beth-rechob is. Daarna herbouwden zij de stad, en woonden daarin.","29":"En zij noemden den naam der stad Dan, naar den naam huns vaders Dan, die aan Israël geboren was; hoewel de naam dezer stad te voren Lais was.","30":"En de kinderen van Dan richtten voor zich dat gesneden beeld op; en Jonathan, de zoon van Gersom, den zoon van Manasse, hij en zijn zonen waren priesters voor den stam der Danieten, tot den dag toe, dat het land gevankelijk is weggevoerd.","31":"Alzo stelden zij onder zich het gesneden beeld van Micha, dat hij gemaakt had, al de dagen, dat het huis Gods te Silo was."},"KJV":{"1":"In those days *there was* no king in Israel: and in those days the tribe of the Danites sought them an inheritance to dwell in; for unto that day *all their* inheritance had not fallen unto them among the tribes of Israel.","2":"And the children of Dan sent of their family five men from their coasts, men of valour, from Zorah, and from Eshtaol, to spy out the land, and to search it; and they said unto them, Go, search the land: who when they came to mount Ephraim, to the house of Micah, they lodged","3":"When they *were* by the house of Micah, they knew the voice of the young man the Levite: and they turned in thither, and said unto him, Who brought thee hither? and what makest","4":"And he said unto them, Thus and thus dealeth Micah with me, and hath hired me, and I am his priest.","5":"And they said unto him, Ask counsel, we pray thee, of God, that we may know whether our way which we go shall be prosperous.","6":"And the priest said unto them, Go in peace: before the LORD *is* your way wherein ye go.","7":"Then the five men departed, and came to Laish, and saw the people that *were* therein, how they dwelt careless, after the manner of the Zidonians, quiet and secure; and *there was* no magistrate in the land, that might put *them* to shame in *any* thing; and they *were* far from the Zidonians, and had no business with *any* man.","8":"And they came unto their brethren to Zorah and Eshtaol: and their brethren said","9":"And they said, Arise, that we may go up against them: for we have seen the land, and, behold, it *is* very good: and *are* ye still? be not slothful to go, *and* to enter to possess the land.","10":"When ye go, ye shall come unto a people secure, and to a large land: for God hath given it into your hands; a place where *there is* no want of any thing that *is* in the earth.","11":"And there went from thence of the family of the Danites, out of Zorah and out of Eshtaol, six hundred men appointed with weapons of war.","12":"And they went up, and pitched in Kirjathjearim, in Judah: wherefore they called that place Mahanehdan unto this day: behold, *it is* behind Kirjathjearim.","13":"And they passed thence unto mount Ephraim, and came unto the house of Micah.","14":"Then answered the five men that went to spy out the country of Laish, and said unto their brethren, Do ye know that there is in these houses an ephod, and teraphim, and a graven image, and a molten image? now therefore consider what ye have to do.","15":"And they turned thitherward, and came to the house of the young man the Levite, *even* unto the house of Micah, and saluted","16":"And the six hundred men appointed with their weapons of war, which *were* of the children of Dan, stood by the entering of the gate.","17":"And the five men that went to spy out the land went up, *and* came in thither, *and* took the graven image, and the ephod, and the teraphim, and the molten image: and the priest stood in the entering of the gate with the six hundred men *that were* appointed with weapons of war.","18":"And these went into Micah's house, and fetched the carved image, the ephod, and the teraphim, and the molten image. Then said the priest unto them, What do","19":"And they said unto him, Hold thy peace, lay thine hand upon thy mouth, and go with us, and be to us a father and a priest: *is it* better for thee to be a priest unto the house of one man, or that thou be a priest unto a tribe and a family in Israel?","20":"And the priest's heart was glad, and he took the ephod, and the teraphim, and the graven image, and went in the midst of the people.","21":"So they turned and departed, and put the little ones and the cattle and the carriage before","22":"*And* when they were a good way from the house of Micah, the men that *were* in the houses near to Micah's house were gathered together, and overtook the children of Dan.","23":"And they cried unto the children of Dan. And they turned their faces, and said unto Micah, What aileth thee, that thou comest with such a company?","24":"And he said, Ye have taken away my gods which I made, and the priest, and ye are gone away: and what have I more? and what *is* this *that* ye say","25":"And the children of Dan said unto him, Let not thy voice be heard among us, lest angry fellows run upon thee, and thou lose thy life, with the lives of thy household.","26":"And the children of Dan went their way: and when Micah saw that they *were* too strong for him, he turned and went back unto his house.","27":"And they took *the things* which Micah had made, and the priest which he had, and came unto Laish, unto a people *that were* at quiet and secure: and they smote them with the edge of the sword, and burnt the city with fire.","28":"And *there was* no deliverer, because it *was* far from Zidon, and they had no business with *any* man; and it was in the valley that *lieth* by Bethrehob. And they built a city, and dwelt","29":"And they called the name of the city Dan, after the name of Dan their father, who was born unto Israel: howbeit the name of the city *was* Laish at the first.","30":"And the children of Dan set up the graven image: and Jonathan, the son of Gershom, the son of Manas \">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H2713\">search</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> who when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H4318\">Micah,</span> they lodged","3":"When they were by the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H4318\">Micah,</span> they <span class=\"wl wl-kjv\" data-code=\"H5234\">knew</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite:</span> and they turned <span class=\"wl wl-kjv\" data-code=\"H5493\">in</span> thither, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Who <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> thee <span class=\"wl wl-kjv\" data-code=\"H1988\">hither?</span> and what makest","4":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H2090\">Thus</span> and <span class=\"wl wl-kjv\" data-code=\"H2090\">thus</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">dealeth</span> <span class=\"wl wl-kjv\" data-code=\"H4318\">Micah</span> with me, and hath <span class=\"wl wl-kjv\" data-code=\"H7936\">hired</span> me, and I am his priest.","5":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Ask <span class=\"wl wl-kjv\" data-code=\"H7592\">counsel,</span> we pray thee, of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> whether our <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> which we <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> shall be prosperous.","6":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace:</span> <span class=\"wl wl-kjv\" data-code=\"H5227\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is your <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> wherein ye go.","7":"Then the <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3919\">Laish,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were <span class=\"wl wl-kjv\" data-code=\"H7130\">therein,</span> how they <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> <span class=\"wl wl-kjv\" data-code=\"H983\">careless,</span> after the <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> of the <span class=\"wl wl-kjv\" data-code=\"H6722\">Zidonians,</span> <span class=\"wl wl-kjv\" data-code=\"H8252\">quiet</span> and <span class=\"wl wl-kjv\" data-code=\"H982\">secure;</span> and there was no <span class=\"wl wl-kjv\" data-code=\"H3423\">magistrate</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> that might put them to <span class=\"wl wl-kjv\" data-code=\"H3637\">shame</span> in any <span class=\"wl wl-kjv\" data-code=\"H1697\">thing;</span> and they were <span class=\"wl wl-kjv\" data-code=\"H7350\">far</span> from the <span class=\"wl wl-kjv\" data-code=\"H6722\">Zidonians,</span> and had no <span class=\"wl wl-kjv\" data-code=\"H1697\">business</span> with any man.","8":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> to <span class=\"wl wl-kjv\" data-code=\"H6881\">Zorah</span> and <span class=\"wl wl-kjv\" data-code=\"H847\">Eshtaol:</span> and their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> said","9":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> that we may go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against them: for we have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and, behold, it is <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> and are ye <span class=\"wl wl-kjv\" data-code=\"H2814\">still?</span> be not <span class=\"wl wl-kjv\" data-code=\"H6101\">slothful</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> and to <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> to <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the land.","10":"When ye <span class=\"wl wl-kjv\" data-code=\"H935\">go,</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H982\">secure,</span> and to a <span class=\"wl wl-kjv\" data-code=\"H7342\">large</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> for <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> it into your <span class=\"wl wl-kjv\" data-code=\"H3027\">hands;</span> a <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where there is no <span class=\"wl wl-kjv\" data-code=\"H4270\">want</span> of any <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> that is in the earth.","11":"And there <span class=\"wl wl-kjv\" data-code=\"H5265\">went</span> from thence of the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H1839\">Danites,</span> out of <span class=\"wl wl-kjv\" data-code=\"H6881\">Zorah</span> and out of <span class=\"wl wl-kjv\" data-code=\"H847\">Eshtaol,</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> <span class=\"wl wl-kjv\" data-code=\"H2296\">appointed</span> with <span class=\"wl wl-kjv\" data-code=\"H3627\">weapons</span> of war.","12":"And they went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in <span class=\"wl wl-kjv\" data-code=\"H7157\">Kirjathjearim,</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah:</span> wherefore they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> that <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H4265\">Mahanehdan</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> behold, it is <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> Kirjathjearim.","13":"And they <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> thence unto <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Micah.","14":"Then <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> to spy <span class=\"wl wl-kjv\" data-code=\"H7270\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> of <span class=\"wl wl-kjv\" data-code=\"H3919\">Laish,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> Do ye <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that there <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> in these <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> an <span class=\"wl wl-kjv\" data-code=\"H646\">ephod,</span> and <span class=\"wl wl-kjv\" data-code=\"H8655\">teraphim,</span> and a graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image,</span> and a molten <span class=\"wl wl-kjv\" data-code=\"H4541\">image?</span> now therefore <span class=\"wl wl-kjv\" data-code=\"H3045\">consider</span> what ye have to do.","15":"And they <span class=\"wl wl-kjv\" data-code=\"H5493\">turned</span> thitherward, and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite,</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H4318\">Micah,</span> and <span class=\"wl wl-kjv\" data-code=\"H7592\">saluted</span>","16":"And the <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> <span class=\"wl wl-kjv\" data-code=\"H2296\">appointed</span> with their <span class=\"wl wl-kjv\" data-code=\"H3627\">weapons</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> which were of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan,</span> <span class=\"wl wl-kjv\" data-code=\"H5324\">stood</span> by the <span class=\"wl wl-kjv\" data-code=\"H6607\">entering</span> of the gate.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> to spy <span class=\"wl wl-kjv\" data-code=\"H7270\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and came <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> thither, and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image,</span> and the <span class=\"wl wl-kjv\" data-code=\"H646\">ephod,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8655\">teraphim,</span> and the molten <span class=\"wl wl-kjv\" data-code=\"H4541\">image:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H5324\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">entering</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> with the <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that were <span class=\"wl wl-kjv\" data-code=\"H2296\">appointed</span> with <span class=\"wl wl-kjv\" data-code=\"H3627\">weapons</span> of war.","18":"And these <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into <span class=\"wl wl-kjv\" data-code=\"H4318\">Micah's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">fetched</span> the carved <span class=\"wl wl-kjv\" data-code=\"H6459\">image,</span> the <span class=\"wl wl-kjv\" data-code=\"H646\">ephod,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8655\">teraphim,</span> and the molten <span class=\"wl wl-kjv\" data-code=\"H4541\">image.</span> Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> unto them, What do","19":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Hold thy <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with us, and be to <span class=\"wl wl-kjv\" data-code=\"H1961\">us</span> a <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and a <span class=\"wl wl-kjv\" data-code=\"H3548\">priest:</span> is it <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> for thee to be a <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> or that thou be a <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> unto a <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> and a <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> in Israel?","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> was <span class=\"wl wl-kjv\" data-code=\"H3190\">glad,</span> and he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H646\">ephod,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8655\">teraphim,</span> and the graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image,</span> and went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of the people.","21":"So they <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones</span> and the <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> and the <span class=\"wl wl-kjv\" data-code=\"H3520\">carriage</span> before","22":"And when they were a good <span class=\"wl wl-kjv\" data-code=\"H7368\">way</span> from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H4318\">Micah,</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> near to <span class=\"wl wl-kjv\" data-code=\"H4318\">Micah's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> were gathered <span class=\"wl wl-kjv\" data-code=\"H2199\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H1692\">overtook</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Dan.","23":"And they <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan.</span> And they <span class=\"wl wl-kjv\" data-code=\"H5437\">turned</span> their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4318\">Micah,</span> What aileth thee, that thou comest with such a company?","24":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Ye have taken <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> which I <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and ye are gone <span class=\"wl wl-kjv\" data-code=\"H3212\">away:</span> and what have I more? and what is this that ye say","25":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span clas -code=\"H6459\">image:</span> and <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1647\">Gershom,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> he and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> were <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> to the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> of <span class=\"wl wl-kjv\" data-code=\"H1839\">Dan</span> until the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H1540\">captivity</span> of the land.","31":"And they set them <span class=\"wl wl-kjv\" data-code=\"H7760\">up</span> <span class=\"wl wl-kjv\" data-code=\"H4318\">Micah's</span> graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image,</span> which he <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> that the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was in Shiloh."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
