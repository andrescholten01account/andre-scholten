sen; en men sloot de poort dicht, nadat zij naar buiten gegaan waren die hen achtervolgden.", "Ps 85:3": "De misdaad van Uw volk hebt U weggenomen; U hebt al hun zonden bedekt. Sela.", "Hos 4:6": "Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.", "Openb 14:11": "En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Ezech 28:24": "En het huis van Israël zal geen pijnlijke doorn meer hebben, en geen pijn veroorzakende distel, van allen die rondom hen zijn, die hen beroven; en zij zullen weten dat Ik de Heere HEERE ben.", "Ps 39:10": "Ik ben verstomd, ik zal mijn mond niet opendoen, want U hebt het gedaan.", "2 Kron 24:19": "Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.", "Hand 17:23": "Want toen ik door de stad liep en uw heiligdommen bekeek, vond ik ook een altaar waarop een opschrift stond: AAN DE ONBEKENDE GOD. Hem dan, Die u niet kent en toch dient, verkondig ik u.", "2 Kron 33:12": "En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,", "Deut 5:29": "Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "Kol 3:6": "Om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Ps 78:35": "En zij dachten eraan, dat God hun Rotssteen was, en God, de Allerhoogste, hun Verlosser.", "Dan 5:23": "Maar u hebt uzelf verheven tegen de Heere van de hemel, en men heeft de vaten van Zijn huis voor u gebracht, en u, en uw leiders, uw vrouwen, en uw bijvrouwen hebben daaruit wijn gedronken, en de goden van zilver en goud, koper, ijzer, hout en steen, die niet zien, niet horen, en niet weten, hebt u geprezen; maar die God, in Wiens hand uw adem is, en aan Wie al uw wegen toebehoren, hebt u niet verheerlijkt.", "Luk 1:77": "om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,", "Ezech 22:18": "Mensenkind, zij die van het huis van Israël zijn, zijn Mij tot schuim geworden; zij zijn allemaal koper, of tin, of ijzer, of lood, in het midden van de oven; zilverschuim zijn zij geworden.", "Jer 2:6": "En zij zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw van de dood, in een land waar niemand doorheen ging, en waar geen mens woonde?", "2 Kron 12:1": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem.", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "1 Sam 12:9": "Maar zij vergaten de HEERE, hun God; zo verkocht Hij hen in de hand van Sisera, de legeraanvoerder van Hazor, en in de hand van de Filistijnen, en in de hand van de koning van de Moabieten, die tegen hen streden.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Job 11:6": "En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Deut 4:28": "En daar zult u goden dienen, die het werk van mensenhanden zijn, hout en steen, die niet zien, niet horen, niet eten en niet ruiken.", "Richt 3:31": "Na hem nu was Samgar, een zoon van Anath, die de Filistijnen sloeg, zeshonderd man, met een ossenstok; zo verloste ook hij Israël.", "Jes 65:3": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "Ps 106:8-11": "Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte. En Hij bestrafte de Schelfzee, zodat zij verdroogde, en Hij deed hen wandelen door de afgronden, als door een woestijn. En Hij verloste hen uit de hand van de hater, en Hij bevrijdde hen van de hand van de vijand.", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Deut 32:18": "De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "2 Sam 16:11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "Job 1:13-22": "Er was nu een dag, dat zijn zonen en zijn dochters aten en wijn dronken in het huis van hun broer, de eerstgeborene. Dat er een bode tot Job kwam en zei: De runderen waren aan het ploegen, en de ezelinnen weidden aan hun zijden. Doch de Sabeeërs deden een inval, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "2 Sam 22:8": "Toen daverde en beefde de aarde; de fundamenten van de hemel beroerden zich, en daverden, omdat Hij in toorn ontstoken was.", "Ex 20:2": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Hos 14:2-4": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Ps 89:3": "Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:", "Jes 46:6": "Zij verkwisten het goud uit de beurs, en wegen het zilver met de weegschaal; zij huren een goudsmid, en die maakt het tot een god, zij knielen neer, ook buigen zij zich daarvoor.", "Ps 86:15": "Maar Gij, Heere! zijt een barmhartig en genadig God, geduldig, en groot van goedertierenheid en waarheid.", "Ezech 25:14-17": "En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE. Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Ezra 9:5-15": "En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God; En ik zei: Mijn God, ik ben beschaamd en schaamrood om mijn aangezicht tot U op te heffen, mijn God; want onze ongerechtigheden zijn vermenigvuldigd tot boven ons hoofd, en onze schuld is groot geworden tot aan de hemel. Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag.", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "Jes 41:24": "Zie, u bent minder dan niets, en uw werk is erger dan een adder; hij is een gruwel, die u verkiest.", "Jer 2:17": "Doet u dit niet zelf, doordat u de HEERE, uw God, verlaat, ten tijde als Hij u op de weg leidt?", "Hos 9:1-17": "Verblijd u niet, Israël, tot uitbundige vreugde toe, zoals de volken; want u hoereert van uw God af; u hebt hoerenloon lief, op alle dorsvloeren van het koren. De dorsvloer en de wijnkuip zullen hen niet voeden, en de most zal hen bedriegen. Zij zullen in het land van de Heere niet blijven; maar Efraïm zal weer naar Egypte terugkeren, en zij zullen in Assyrië het onreine eten.", "Ezra 9:15": "O HEERE, God van Israël! U bent rechtvaardig; want wij zijn overgelaten ter ontkoming, zoals het is op deze dag. Zie, wij zijn voor Uw aangezicht in onze schuld; want er is niemand die voor Uw aangezicht zou kunnen bestaan, om hiervan.", "2 Kron 28:22": "Ja, in de tijd toen men hem benauwde, ging hij nog meer overtreden tegen de HEERE; dit was koning Achaz.", "Num 32:41": "Jaïr nu, de zoon van Manasse, ging op weg en nam hun dorpen in, en hij noemde die Havvoth-Jaïr.", "Ps 106:44": "Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Jer 10:17-22": "Raap uw koopwaar weg uit het land, u inwoonster van de vesting! Want zo zegt de HEERE: Ziet, Ik zal de inwoners van het land op deze keer wegslingeren, en zal hen benauwen, opdat zij het vinden. O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "Ps 103:10": "Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "Richt 11:5-8": "Toen nu de kinderen van Ammon tegen Israël streden, gingen de oudsten van Gilead heen om Jeftha te halen uit het land van Tob. En zij zeiden tegen Jeftha: Kom, en word onze aanvoerder, zodat wij kunnen strijden tegen de kinderen van Ammon. Maar Jeftha zei tegen de oudsten van Gilead: Hebt u mij niet gehaat, en mij uit het huis van mijn vader verstoten? Waarom bent u dan nu naar mij toegekomen, nu u in benauwdheid verkeert?", "Jes 1:21": "Hoe is de trouwe stad tot een hoer geworden! Zij was vol recht, gerechtigheid herbergde daarin, maar nu doodslagers.", "Hand 14:15": "Mannen, waarom doet u deze dingen? Ook wij zijn mensen net als u, en wij verkondigen u dat u zich van deze nutteloze dingen zou bekeren tot de levende God, Die de hemel, en de aarde, en de zee, en alles wat daarin is, gemaakt heeft;", "Num 16:45": "Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "Ps 66:10-12": "Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert; U had ons in het net gebracht; U had een engs band om onze lenden gelegd; U had de mens over ons hoofd laten rijden; wij waren in het vuur en in het water gekomen; maar U hebt ons uitgevoerd naar een overvloeiende verversing.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Num 14:43": "Want de Amalekieten en de Kanaänieten zijn daar vóór u, en u zult door het zwaard vallen; want omdat u zich hebt afgekeerd van de HEERE, zal de HEERE niet met u zijn.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "1 Sam 5:3": "Maar toen die van Asdod de volgende dag vroeg opstonden, zie, toen was Dagon voorover op de aarde gevallen voor de ark van de HEERE. En zij namen Dagon en zetten hem weer op zijn plaats.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Richt 3:11-15": "Toen was het land veertig jaren stil, en Othniël, de zoon van Kenaz, stierf. Maar de kinderen van Israël gingen door met doen wat kwaad was in de ogen van de HEERE; toen sterkte de HEERE Eglon, de koning van de Moabieten, tegen Israël, omdat zij deden wat kwaad was in de ogen van de HEERE. En hij verzamelde bij zich de kinderen van Ammon en de Amalekieten, en hij trok op en sloeg Israël, en zij namen de Palmstad in bezit.", "Jona 2:1-10": "En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis. En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.", "2 Sam 22:9": "Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daardoor aangestoken.", "1 Sam 8:8": "Naar de werken die zij gedaan hebben, vanaf de dag dat Ik hen uit Egypte geleid heb, tot op deze dag toe, en Mij hebben verlaten en andere goden gediend; zo doen zij u ook.", "Neh 1:10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Jes 57:17": "Ik was toornig over de ongerechtigheid van zijn hebzucht, en sloeg hem; Ik verborg Mij, en was toornig; toch ging hij afkerig zijn eigen weg, de weg van zijn hart.", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "Job 23:2-6": "Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten. Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.", "1 Kon 11:7": "Toen bouwde Salomo een hoogte voor Kamos, het verfoeisel van de Moabieten, op de berg die tegenover Jeruzalem ligt, en voor Molech, het verfoeisel van de kinderen Ammons.", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "Zach 1:16": "Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "Ezech 11:1-21": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk. En Hij zei tegen mij: Mensenkind, dit zijn de mannen die onrecht bedenken, en die slechte raad geven in deze stad. Die zeggen: Men moet niet snel huizen bouwen; deze stad is de pot, en wij zijn het vlees.", "Richt 12:6": "dan zeiden zij tegen hem: Zeg dan Schibboleth; maar hij zei: Sibbolet, en kon het zo niet goed uitspreken; dan grepen zij hem en doodden hem bij de doorwaadbare plaatsen van de Jordaan, zodat er in die tijd van Efraïm tweeënveertigduizend vielen.", "Jer 13:24": "Daarom zal Ik hen verstrooien als een stoppel die wegwaait door een wind uit de woestijn.", "Luk 6:36": "Wees dan barmhartig, zoals ook uw Vader barmhartig is.", "Deut 32:5": "Hij heeft het tegen Hem verdorven; het zijn Zijn kinderen niet; de schandvlek is hun; het is een verkeerd en verdraaid geslacht.", "2 Kon 14:26": "Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Jer 11:13": "Want naar het getal van uw steden zijn uw goden geweest, o Juda! en naar het getal van de straten van Jeruzalem hebt u altaren gesteld voor die schaamte, altaren om Baäl te beroken.", "Deut 6:15": "Want de HEERE, uw God, is een na-ijverig God in uw midden; dat de toorn van de HEERE, uw God, tegen u niet ontsteekt, en Hij u van de aardbodem verdelgt.", "Ex 32:10": "En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken.", "Jes 31:6": "Bekeer u tot Hem, van Wie de kinderen van Israël diep afgeweken zijn.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Hos 1:1-9": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël. Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan. Zo ging hij heen, en nam Gomer, een dochter van Diblaim; en zij ontving, en baarde hem een zoon.", "Jes 37:19": "En hebben hun goden in het vuur geworpen, want het waren geen goden, maar het werk van mensenhanden, hout en steen; daarom hebben zij die vernietigd.", "Jes 1:2": "Hoor, hemelen! en neem het ter oor, aarde! Want de HEERE spreekt: Ik heb kinderen groot gemaakt en verhoogd, maar zij hebben tegen Mij overtreden.", "Jes 50:1": "Zo zegt de HEERE: Waar is de scheidbrief van uw moeder, waarmee Ik haar weggezonden heb? Of wie is er van Mijn schuldeisers, aan wie Ik u verkocht heb? Zie, om uw ongerechtigheden bent u verkocht, en om uw overtredingen is uw moeder weggezonden.", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "Jer 11:12": "Dan zullen de steden van Juda en de inwoners van Jeruzalem heengaan, en roepen tot de goden aan wie zij wierook gebracht hebben; maar die zullen hen zeker niet kunnen verlossen ten tijde van hun kwaad.", "1 Kor 12:2": "U weet dat u heidenen was, meegetrokken naar de stomme afgoden, naardat u geleid werd.", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Jer 2:27": "Die tot een stuk hout zeggen: U bent mijn vader; en tot een steen: U hebt mij verwekt; want zij keren Mij de nek toe, en niet het aangezicht; maar ten tijde van hun kwaad zeggen zij: Sta op en verlos ons.", "Jes 26:16": "HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.", "Num 25:3": "Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Richt 8:4": "Toen Gideon nu bij de Jordaan gekomen was, ging hij eroverheen, met de driehonderd mannen die bij hem waren, moe, maar toch nog vervolgend.", "Num 21:21-25": "Toen zond Israël boden tot Sihon, de koning van de Amorieten, en zei: Laat mij door uw land trekken. Wij zullen niet afwijken naar de akkers, noch naar de wijngaarden; wij zullen het water van de putten niet drinken; wij zullen op de koninklijke weg gaan, totdat wij uw grondgebied doorgetrokken zijn. Doch Sihon liet Israël niet toe door zijn gebied te trekken; maar Sihon verzamelde al zijn volk, en hij ging uit, Israël tegemoet, naar de woestijn, en hij kwam te Jahza, en streed tegen Israël;", "Job 39:34-38": "En de HEERE antwoordde Job, en zei: Is het twisten met de Almachtige onderrichten? Wie God bestraft, die antwoordt daarop. Toen antwoordde Job de HEERE, en zei:", "2 Sam 16:10": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan?", "Deut 31:16": "En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Richt 11:33": "En hij versloeg hen van Aroer af tot waar u komt bij Minnith, twintig steden, en tot aan Abel-Keramim, met een zeer grote slag. Zo werden de kinderen van Ammon onderworpen voor het aangezicht van de kinderen van Israël.", "Micha 6:3": "O Mijn volk! Wat heb Ik u gedaan, en waarmee heb Ik u vermoeid? Getuig tegen Mij.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "Gen 35:2": "Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren;", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "Luk 17:17": "En Jezus antwoordde en zei: Zijn niet de tien gereinigd? Maar waar zijn de negen?", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Jer 27:3": "En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.", "Hos 13:6": "Daarna zijn zij, naarmate hun weide was, verzadigd geworden; toen zij verzadigd waren geworden, heeft hun hart zich verheven; daarom hebben zij Mij vergeten.", "Micha 6:4": "Zeker heb Ik u uit Egypteland opgevoerd, en u uit het diensthuis verlost; en Ik heb voor uw aangezicht Mozes, Aäron en Mirjam heen gezonden.", "2 Sam 15:26": "Maar als Hij zo zal zeggen: Ik heb geen behagen in u; zie, hier ben ik, laat Hij met mij doen zoals het goed is in Zijn ogen.", "2 Sam 12:13": "Toen zei David tegen Nathan: Ik heb gezondigd tegen de HEERE! En Nathan zei tegen David: De HEERE heeft ook uw zonde weggenomen, u zult niet sterven.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Klaagl 2:3": "Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.", "Richt 12:14": "En hij had veertig zonen, en dertig kleinzonen, die op zeventig ezelsveulens reden; en hij richtte Israël acht jaren.", "Hebr 8:12": "Want Ik zal hun ongerechtigheden genadig zijn, en aan hun zonden en hun overtredingen zal Ik geenszins meer denken.", "Hos 4:10": "En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen in aantal; want zij hebben nagelaten de Heere in acht te nemen.", "Ps 44:13": "U verkoopt Uw volk voor niets; en U verhoogt hun prijs niet.", "Hos 6:4-11": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat. Daarom heb Ik hen gehakt door de profeten; Ik heb hen gedood door de woorden van Mijn mond; en uw oordelen zullen voortkomen als het licht. Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "Num 21:35": "En zij sloegen hem, en zijn zonen, en al zijn volk, zodat hem niemand overbleef; en zij namen zijn land in erfelijk bezit.", "2 Kon 18:12": "Omdat zij de stem van de HEERE, hun God, niet gehoorzaam waren geweest, maar Zijn verbond overtreden hadden; en al wat Mozes, de knecht van de HEERE, geboden had, dat hadden zij niet gehoord, noch gedaan.", "2 Sam 17:27": "En het gebeurde, toen David te Mahanaïm gekomen was, dat Sobi, de zoon van Nahas, uit Rabba van de kinderen van Ammon, en Machir, de zoon van Ammiël, uit Lodebar, en Barzillai, de Gileadiet, uit Rogelim,", "Deut 32:16-22": "Zij hebben Hem tot ijver verwekt door vreemde goden; door gruwelen hebben zij Hem tot toorn verwekt. Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben. De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Jes 43:9": "Laat alle heidenvolken samen vergaderd worden, en laat de volken verzameld worden; wie onder hen zal dit verkondigen? Of laat hen ons de vorige dingen doen horen, laat hen hun getuigen voortbrengen, opdat zij gerechtvaardigd worden, en men het hoort en zegt: Het is de waarheid.", "Ps 107:13": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Richt 7:24": "Ook zond Gideon boden naar heel het gebergte van Efraïm, en zei: Kom naar beneden, de Midianieten tegemoet, en neem hun de wateren af, tot aan Beth-bara, namelijk de Jordaan; zo werd elke man van Efraïm bijeengeroepen, en zij namen hun de wateren af tot aan Beth-bara, en de Jordaan.", "Ps 135:11": "Sihon, de koning van de Amorieten, en Og, de koning van Basan, en al de koninkrijken van Kanaän,", "Richt 10:3-5": "Na hem stond Jaïr op, de Gileadiet; hij richtte Israël tweeëntwintig jaar. Hij had dertig zonen, die op dertig ezelsveulens reden, en zij hadden dertig steden, die tot op deze dag Havvoth-jair genoemd worden en die in het land Gilead liggen. Jaïr stierf, en werd begraven te Kamon.", "Jer 32:30": "Want de kinderen van Israël en de kinderen van Juda hebben van hun jeugd af alleen maar gedaan wat kwaad was in Mijn ogen; want de kinderen van Israël hebben Mij door het werk van hun handen alleen maar vertoornd, spreekt de HEERE.", "Ps 36:6": "O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe.", "Deut 9:13": "Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Jes 3:1-8": "Want zie, de Heere, HEERE van de heerscharen, zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water; De held en de krijgsman, de rechter en de profeet, en de waarzegger, en de oude; De leider van vijftig, en de aanzienlijke, en de raadsman, en de wijze onder de werkmeesters, en hem die welbespraakt is.", "Hebr 11:29": "Door het geloof zijn zij door de Rode Zee getrokken, als over droog land; en toen de Egyptenaren dat ook probeerden, zijn zij verdronken.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Jes 24:5": "Want het land is bevlekt vanwege zijn inwoners; want zij overtreden de wetten, zij veranderen de inzettingen, zij vernietigen het eeuwige verbond.", "Deut 9:14": "Laat Mij begaan, dat Ik hen verdelg, en hun naam van onder de hemel uitwis; en Ik zal u tot een machtiger en groter volk maken dan dit is.", "Ef 1:6-8": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde; In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade, Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;", "Richt 10:15-18": "Maar de Israëlieten zeiden tegen de HEERE: Wij hebben gezondigd; doe met ons naar alles wat goed is in Uw ogen; verlos ons toch alleen op deze dag! En zij deden de vreemde goden uit hun midden weg, en dienden de HEERE. Toen werd Zijn ziel verdrietig over de ellende van Israël. En de Ammonieten werden bijeengeroepen, en legerden zich in Gilead; daartegenover werden de Israëlieten verzameld, en legerden zich te Mizpa.", "Amos 6:2": "Ga over naar Kalne, en zie toe; en ga vandaar naar Hamath, de grote stad, en trek af naar Gath van de Filistijnen; zijn zij beter dan deze koninkrijken, of is hun gebied groter dan uw gebied?", "Joz 15:48": "Op het gebergte nu: Samir, en Jatthir, en Socho,"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H310\">Na</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H40\">Abimelech</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6965\">stond</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8439\">Thola</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8439\">op</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3478\">om</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3478\">Israël</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3478\">te</span> bevrijden, <span class=\"wl\" data-l=\"L6\" data-code=\"H1121\">een</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6312\">Pua</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1734\">Dodo</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H1734\">een</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H376\">man</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H376\">van</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3485\">Issaschar</span>; <span class=\"wl\" data-l=\"L11\" data-code=\"H1931\">hij</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H3427\">woonde</span> <span class ode=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Did not I deliver you from the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> from the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> and from the Philistines?", "12": "The <span class=\"wl wl-kjv\" data-code=\"H6722\">Zidonians</span> also, and the <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalekites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4584\">Maonites,</span> did <span class=\"wl wl-kjv\" data-code=\"H3905\">oppress</span> you; and ye <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> to me, and I <span class=\"wl wl-kjv\" data-code=\"H3467\">delivered</span> you out of their hand.", "13": "Yet ye have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> me, and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods:</span> wherefore I will <span class=\"wl wl-kjv\" data-code=\"H3467\">deliver</span> you no more.", "14": "<span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and <span class=\"wl wl-kjv\" data-code=\"H2199\">cry</span> unto the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> which ye have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen;</span> let <span class=\"wl wl-kjv\" data-code=\"H1992\">them</span> <span class=\"wl wl-kjv\" data-code=\"H3467\">deliver</span> you in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of your tribulation.", "15": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> We have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned:</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> thou unto us whatsoever <span class=\"wl wl-kjv\" data-code=\"H5869\">seemeth</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto thee; <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> us only, we pray thee, this day.", "16": "And they put <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H5236\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> from <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> was <span class=\"wl wl-kjv\" data-code=\"H7114\">grieved</span> for the <span class=\"wl wl-kjv\" data-code=\"H5999\">misery</span> of Israel.", "17": "Then the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> were gathered <span class=\"wl wl-kjv\" data-code=\"H6817\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead.</span> And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> assembled themselves <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> in Mizpeh.", "18": "And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H7453\">another,</span> What <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> is he that will <span class=\"wl wl-kjv\" data-code=\"H2490\">begin</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon?</span> he shall be <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> over all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of Gilead."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
