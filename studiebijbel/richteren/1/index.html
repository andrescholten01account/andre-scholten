s","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En het gebeurde na de dood van Jozua, dat de Israëlieten de HEERE vroegen: Wie zal onder ons het eerst optrekken naar de Kanaänieten, om tegen hen te strijden?","2":"En de HEERE zei: Juda zal optrekken; zie, Ik heb dat land in zijn hand gegeven.","3":"Toen zei Juda tegen zijn broeder Simeon: Trek met mij op in mijn lot, en laten we tegen de Kanaänieten strijden, dan zal ik ook met u optrekken in uw lot. Zo ging Simeon met hem mee.","4":"En Juda trok op, en de HEERE gaf de Kanaänieten en de Ferezieten in hun hand; en zij versloegen hen bij Bezek, tienduizend man.","5":"En zij vonden Adoni-bezek te Bezek, en streden tegen hem; en zij versloegen de Kanaänieten en de Ferezieten.","6":"Maar Adoni-bezek vluchtte; en zij achtervolgden hem, en grepen hem, en hieuwen de duimen van zijn handen en zijn voeten af.","7":"Toen zei Adoni-bezek: Zeventig koningen, van wie de duimen van hun handen en voeten waren afgehouwen, verzamelden de *kruimen* onder mijn tafel; zoals ik gedaan heb, zo heeft God mij vergolden! En zij brachten hem naar Jeruzalem, en hij stierf daar.","8":"Want de Judeeërs hadden tegen Jeruzalem gestreden, en hadden het ingenomen, en met de scherpte van het zwaard geslagen; en zij hadden de stad in brand gestoken.","9":"En daarna waren de Judeeërs afgetrokken, om te strijden tegen de Kanaänieten die woonden in het gebergte, in het zuiden, en in de laagte.","10":"En Juda was heengetrokken tegen de Kanaänieten die in Hebron woonden (de naam van Hebron was voorheen Kirjath-arba), en zij versloegen Sesai, Ahiman, en Thalmai.","11":"En vandaar was hij heengetrokken tegen de inwoners van Debir; de naam van Debir was voorheen Kirjath-sefer.","12":"En Kaleb zei: Wie Kirjath-sefer verslaat, en het inneemt, aan hem zal ik mijn dochter Achsa tot vrouw geven.","13":"Toen nam Othniël het in, de zoon van Kenaz, broeder van Kaleb, die jonger was dan hij; en Kaleb gaf hem Achsa, zijn dochter, tot vrouw.","14":"En het gebeurde, toen zij *bij hem* kwam, dat zij hem aanspoorde om van haar vader een veld te vragen; en zij sprong van de ezel af; toen zei Kaleb tegen haar: Wat wilt u?","15":"En zij zei tegen hem: Geef mij een zegen; omdat u mij een dor land gegeven hebt, geef mij ook waterbronnen. Toen gaf Kaleb haar hoger gelegen bronnen en lager gelegen bronnen.","16":"De nakomelingen van de Keniet, de schoonvader van Mozes, trokken ook op uit de Palmstad, met de Judeeërs, naar de woestijn van Juda, die ten zuiden van Harad ligt; en zij gingen heen en woonden bij het volk.","17":"Juda dan trok op met zijn broeder Simeon, en zij versloegen de Kanaänieten die in Zefat woonden, en zij verbanden hen; en men noemde de naam van deze stad Horma.","18":"Daartoe nam Juda Gaza in, met zijn gebied, en Askelon met zijn gebied, en Ekron met zijn gebied.","19":"En de HEERE was met Juda, zodat hij *de inwoners* van het gebergte verdreef; maar hij *kon* niet *doorgaan* om de inwoners van het dal te verdrijven, omdat zij ijzeren wagens hadden.","20":"En zij gaven Hebron aan Kaleb, zoals Mozes gesproken had; en hij verdreef vandaar de drie zonen van Enak.","21":"Doch de Benjaminieten hebben de Jebusieten, die in Jeruzalem woonden, niet verdreven; maar de Jebusieten woonden met de Benjaminieten in Jeruzalem, tot op deze dag.","22":"En het huis van Jozef trok ook op naar Beth-el. En de HEERE was met hen.","23":"En het huis van Jozef stuurde verspieders naar Beth-el; de naam van deze stad was voorheen Luz.","24":"En de wachters zagen een man de stad uitgaan; en zij zeiden tegen hem: Wijs ons toch de ingang van de stad, en wij zullen goedheid bij u bewijzen.","25":"En toen hij hun de ingang van de stad had gewezen, sloegen zij de stad met de scherpte van het zwaard; maar die man en zijn hele familie lieten zij gaan.","26":"Toen trok deze man naar het land van de Hethieten, en hij bouwde een stad, en noemde die Luz; dit is haar naam tot op deze dag.","27":"En Manasse verdreef Beth-sean niet, noch de bijbehorende plaatsen, noch Thaanach met de bijbehorende plaatsen, noch de inwoners van Dor met de bijbehorende plaatsen, noch de inwoners van Jibleam met de bijbehorende plaatsen, noch de inwoners van Megiddo met de bijbehorende plaatsen; en de Kanaänieten wilden in dat land blijven wonen.","28":"En het gebeurde, toen Israël sterk werd, dat het de Kanaänieten aan zich dienstbaar maakte; maar het verdreef hen niet volledig.","29":"Ook verdreef Efraïm de Kanaänieten niet die in Gezer woonden; maar de Kanaänieten woonden in zijn midden te Gezer.","30":"Zebulon verdreef de inwoners van Kitron niet, noch de inwoners van Nahalol; maar de Kanaänieten woonden in zijn midden, en werden dienstbaar.","31":"Aser verdreef de inwoners van Acco niet, noch de inwoners van Sidon, noch Achlab, noch Achsib, noch Chelba, noch Afik, noch Rechob;","32":"Maar de Aserieten woonden in het midden van de Kanaänieten die in het land woonden; want zij verdreven hen niet.","33":"Nafthali verdreef de inwoners van Beth-semes niet, noch de inwoners van Beth-anath, maar woonde in het midden van de Kanaänieten die in het land woonden; doch de inwoners van Beth-semes en Beth-anath werden hun dienstbaar.","34":"En de Amorieten drongen de nakomelingen van Dan terug het gebergte in; want zij lieten hun niet toe af te komen naar het dal.","35":"Ook wilden de Amorieten wonen op het gebergte van Heres, te Ajalon, en te Saalbim; maar de hand van het huis van Jozef werd zwaar, zodat zij dienstbaar werden.","36":"En het gebied van de Amorieten liep van de pas van Akrabbim, van de rots, en verder omhoog."},"SV":{"1":"En het geschiedde na den dood van Jozua, dat de kinderen Israëls den HEERE vraagden, zeggende: Wie zal onder ons het eerst optrekken naar de Kanaänieten, om tegen hen te krijgen?","2":"En de HEERE zeide: Juda zal optrekken; ziet, Ik heb dat land in zijn hand gegeven.","3":"Toen zeide Juda tot zijn broeder Simeon: Trek met mij op in mijn lot, en laat ons tegen de Kanaänieten krijgen, zo zal ik ook met u optrekken in uw lot. Alzo toog Simeon op met hem.","4":"En Juda toog op, en de HEERE gaf de Kanaänieten en de Ferezieten in hun hand; en zij sloegen hen bij Bezek, tien duizend man.","5":"En zij vonden Adoni-bezek te Bezek, en streden tegen hem; en zij sloegen de Kanaänieten en de Ferezieten.","6":"Doch Adoni-bezek vluchtte; en zij jaagden hem na, en zij grepen hem, en hieuwen de duimen zijner handen en zijner voeten af.","7":"Toen zeide Adoni-bezek: Zeventig koningen, met afgehouwen duimen van hun handen en van hun voeten, waren onder mijn tafel, *de* *kruimen* oplezende; gelijk als ik gedaan heb, alzo heeft mij God vergolden! En zij brachten hem te Jeruzalem, en hij stierf aldaar.","8":"Want de kinderen van Juda hadden tegen Jeruzalem gestreden, en hadden haar ingenomen, en met de scherpte des zwaards geslagen; en zij hadden de stad in het vuur gezet.","9":"En daarna waren de kinderen van Juda afgetogen, om te krijgen tegen de Kanaänieten, wonende in het gebergte, en in het zuiden, en in de laagte.","10":"En Juda was heengetogen tegen de Kanaänieten, die te Hebron woonden (de naam nu van Hebron was te voren Kirjath-arba), en zij sloegen Sesai, en Ahiman, en Thalmai.","11":"En van daar was hij heengetogen tegen de inwoners van Debir; de naam nu van Debir was te voren Kirjath-sefer.","12":"En Kaleb zeide: Wie Kirjath-sefer zal slaan, en haar innemen, dien zal ik ook mijn dochter Achsa tot een vrouw geven.","13":"Toen nam Othniël haar in, de zoon van Kenaz, broeder van Kaleb, die jonger was dan hij; en *Kaleb* gaf hem Achsa, zijn dochter, tot een vrouw.","14":"En het geschiedde, als zij *tot* *hem* kwam, dat zij hem aanporde, om van haar vader een veld te begeren; en zij sprong van den ezel af; toen zeide Kaleb tot haar: Wat is u?","15":"En zij zeide tot hem: Geef mij een zegen; dewijl gij mij een dor land gegeven hebt, geef mij ook waterwellingen. Toen gaf Kaleb haar hoge wellingen en lage wellingen.","16":"De kinderen van den Keniet, den schoonvader van Mozes, togen ook uit de Palmstad op, met de kinderen van Juda, naar de woestijn van Juda, die tegen het zuiden van Harad is; en zij gingen heen en woonden met het volk.","17":"Juda dan toog met zijn broeder Simeon, en zij sloegen de Kanaänieten, wonende te Zefat, en zij verbanden hen; en men noemde den naam dezer stad Horma.","18":"Daartoe nam Juda Gaza in, met haar landpale, en Askelon met haar landpale, en Ekron met haar landpale.","19":"En de HEERE was met Juda, dat hij *de* *inwoners* van het gebergte verdreef; maar hij *ging* niet *voort* om de inwoners des dals te verdrijven, omdat zij ijzeren wagenen hadden.","20":"En zij gaven Hebron aan Kaleb, gelijk als Mozes gesproken had; en hij verdreef van daar de drie zonen van Enak.","21":"Doch de kinderen van Benjamin hebben de Jebusieten, te Jeruzalem wonende, niet verdreven; maar de Jebusieten woonden met de kinderen van Benjamin te Jeruzalem, tot op dezen dag.","22":"En het huis van Jozef toog ook op naar Beth-el. En de HEERE was met hen.","23":"En het huis van Jozef bestelde verspieders bij Beth-el; de naam nu dezer stad was te voren Luz.","24":"En de wachters zagen een man, uitgaande uit de stad; en zij zeiden tot hem: Wijs ons toch den ingang der stad, en wij zullen weldadigheid bij u doen.","25":"En als hij hun den ingang der stad gewezen had, zo sloegen zij de stad met de scherpte des zwaards; maar dien man en zijn ganse huis lieten zij gaan.","26":"Toen toog deze man in het land der Hethieten, en hij bouwde een stad, en noemde haar naam Luz; dit is haar naam tot op dezen dag.","27":"En Manasse verdreef Beth-sean niet, noch haar onderhorige plaatsen, noch Thaanach met haar onderhorige plaatsen, noch de inwoners van Dor met haar onderhorige plaatsen, noch de inwoners van Jibleam met haar onderhorige plaatsen, noch de inwoners van Megiddo met haar onderhorige plaatsen; en de Kanaänieten wilden wonen in hetzelve land.","28":"En het geschiedde, als Israël sterk werd, dat hij de Kanaänieten op cijns stelde; maar hij verdreef hen niet ganselijk.","29":"Ook verdreef Efraïm de Kanaänieten niet, die te Gezer woonden; maar de Kanaänieten woonden in het midden van hem te Gezer.","30":"Zebulon verdreef de inwoners van Kitron niet, noch de inwoners van Nahalol; maar de Kanaänieten woonden in het midden van hem, en waren cijnsbaar.","31":"Aser verdreef de inwoners van Acco niet, noch de inwoners van Sidon, noch Achlab, noch Achsib, noch Chelba, noch Afik, noch Rechob;","32":"Maar de Aserieten woonden in het midden der Kanaänieten, die in het land woonden; want zij verdreven hen niet.","33":"Nafthali verdreef de inwoners van Beth-semes niet, noch de inwoners van Beth-anath, maar woonde in het midden der Kanaänieten, die in het land woonden; doch de inwoners van Beth-semes en Beth-anath werden hun cijnsbaar.","34":"En de Amorieten drongen de kinderen van Dan in het gebergte; want zij lieten hun niet toe, af te komen in het dal.","35":"Ook wilden de Amorieten wonen op het gebergte van Heres, te Ajalon, en te Saalbim; maar de hand van het huis van Jozef werd zwaar, zodat zij cijnsbaar werden.","36":"En de landpale der Amorieten was van den opgang van Akrabbim, van den rotssteen, en opwaarts heen."},"KJV":{"1":"Now after the death of Joshua it came to pass, that the children of Israel asked the LORD, saying, Who shall go up for us against the Canaanites first, to fight","2":"And the LORD said, Judah shall go up: behold, I have delivered the land into his hand.","3":"And Judah said unto Simeon his brother, Come up with me into my lot, that we may fight against the Canaanites; and I likewise will go with thee into thy lot. So Simeon went","4":"And Judah went up; and the LORD delivered the Canaanites and the Perizzites into their hand: and they slew of them in Bezek ten thousand men.","5":"And they found Adonibezek in Bezek: and they fought against him, and they slew the Canaanites and the Perizzites.","6":"But Adonibezek fled; and they pursued after him, and caught him, and cut off his thumbs and his great toes.","7":"And Adonibezek said, Threescore and ten kings, having their thumbs and their great toes cut off, gathered *their meat* under my table: as I have done, so God hath requited me. And they brought him to Jerusalem, and there he died.","8":"Now the children of Judah had fought against Jerusalem, and had taken it, and smitten it with the edge of the sword, and set the city on fire.","9":"And afterward the children of Judah went down to fight against the Canaanites, that dwelt in the mountain, and in the south, and in the valley.","10":"And Judah went against the Canaanites that dwelt in Hebron: (now the name of Hebron before *was* Kirjatharba:) and they slew Sheshai, and Ahiman, and Talmai.","11":"And from thence he went against the inhabitants of Debir: and the name of Debir before *was* Kirjathsepher:","12":"And Caleb said, He that smiteth Kirjathsepher, and taketh it, to him will I give Achsah my daughter to wife.","13":"And Othniel the son of Kenaz, Caleb's younger brother, took it: and he gave him Achsah his daughter to wife.","14":"And it came to pass, when she came *to him*, that she moved him to ask of her father a field: and she lighted from off *her* ass; and Caleb said","15":"And she said unto him, Give me a blessing: for thou hast given me a south land; give me also springs of water. And Caleb gave her the upper springs and the nether springs.","16":"And the children of the Kenite, Moses' father in law, went up out of the city of palm trees with the children of Judah into the wilderness of Judah, which *lieth* in the south of Arad; and they went and dwelt among the people.","17":"And Judah went with Simeon his brother, and they slew the Canaanites that inhabited Zephath, and utterly destroyed it. And the name of the city was called Hormah.","18":"Also Judah took Gaza with the coast thereof, and Askelon with the coast thereof, and Ekron with the coast","19":"And the LORD was with Judah; and he drave out *the inhabitants of* the mountain; but could not drive out the inhabitants of the valley, because they had chariots of iron.","20":"And they gave Hebron unto Caleb, as Moses said: and he expelled thence the three sons of Anak.","21":"And the children of Benjamin did not drive out the Jebusites that inhabited Jerusalem; but the Jebusites dwell with the children of Benjamin in Jerusalem unto this day.","22":"And the house of Joseph, they also went up against Bethel: and the LORD","23":"And the house of Joseph sent to descry Bethel. (Now the name of the city before *was* Luz.)","24":"And the spies saw a man come forth out of the city, and they said unto him, Shew us, we pray thee, the entrance into the city, and we will shew thee mercy.","25":"And when he shewed them the entrance into the city, they smote the city with the edge of the sword; but they let go the man and all his family.","26":"And the man went into the land of the Hittites, and built a city, and called the name thereof Luz: which *is* the name thereof unto this day.","27":"Neither did Manasseh drive out *the inhabitants of* Bethshean and her towns, nor Taanach and her towns, nor the inhabitants of Dor and her towns, nor the inhabitants of Ibleam and her towns, nor the inhabitants of Megiddo and her towns: but the Canaanites would dwell in that land.","28":"And it came to pass, when Israel was strong, that they put the Canaanites to tribute, and did not utterly drive them out.","29":"Neither did Ephraim drive out the Canaanites that dwelt in Gezer; but the Canaanites dwelt in Gezer among","30":"Neither did Zebulun drive out the inhabitants of Kitron, nor the inhabitants of Nahalol; but the Canaanites dwelt among them, and became tributaries.","31":"Neither did Asher drive out the inhabitants of Accho, nor the inhabitants of Zidon, nor of Ahlab, nor of Achzib, nor of Helbah, nor of Aphik, nor of Rehob:","32":"But the Asherites dwelt among the Canaanites, the inhabitants of the land: for they did not drive them out.","33":"Neither did Naphtali drive out the inhabitants of Bethshemesh, nor the inhabitants of Bethanath; but he dwelt among the Canaanites, the inhabitants of the land: nevertheless the inhabitants of Bethshemesh and of Bethanath became tributaries","34":"And the Amorites forced the children of Dan into the mountain: for they would not suffer them to come down to the valley:","35":"But the Amorites would dwell in mount Heres in Aijalon, and in Shaalbim: yet the hand of the house of Joseph prevailed, so that they became tributaries.","36":"And the coast of the Amorites *was* from the going up to Akrabbim, from the rock, and upward."}},"tsk":{"1":[{"kopje":"En","refs":["Joz 24:29","Joz 24:30"]},{"kopje":"vroegen","refs":["Richt 20:18","Richt 20:28","Ex 28:30","Num 27:21","1 Sam 22:9","1 Sam 22:10","1 Sam 23:9","1 Sam 23:10"]}],"3":[{"kopje":"Simeon","refs":["Gen 29:33","Joz that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5045\">south,</span> and in the valley.","10":"And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> against the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron:</span> (now the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> was <span class=\"wl wl-kjv\" data-code=\"H7153\">Kirjatharba:)</span> and they <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H8344\">Sheshai,</span> and <span class=\"wl wl-kjv\" data-code=\"H289\">Ahiman,</span> and Talmai.","11":"And from thence he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> against the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H1688\">Debir:</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of <span class=\"wl wl-kjv\" data-code=\"H1688\">Debir</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> was Kirjathsepher:","12":"And <span class=\"wl wl-kjv\" data-code=\"H3612\">Caleb</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He that <span class=\"wl wl-kjv\" data-code=\"H5221\">smiteth</span> <span class=\"wl wl-kjv\" data-code=\"H7158\">Kirjathsepher,</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">taketh</span> it, to him will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H5915\">Achsah</span> my <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> to wife.","13":"A l,"tekst":"But Adoni Bezek fled and they pursued after him and they took him and cut off the thumbs of his hands and of his feet [the cause of this was of the abominable tyranny mentioned in the following verse.]"}],"7":[{"catchword":null,"tekst":"Then said Adoni Bezek threescore and ten kings with the thumbs of their hands of their feet cut off under my table were gathering up the crumbs [that is that which fell from the table or was cast to them] according as I have done so hath God rewarded me and they brought him to Jerusalem and he died there."}],"8":[{"catchword":null,"tekst":"For the children of Judah had against Jerusalem [others fought or did fight but the opinion of the most is that here by occasion that is in the foregoing verse it is said that they brought down Adoni Bezek to Jerusalem the taking of Jerusalem and some other passages unto the 17 verse were repeated out of the book of Joshua as may be seen Joshua chapter 15 ]and had taken it [understand the part of the city which was fallen to their share, nor the other part which appertained to Benjamin together with them, and the strong hold: See Jos.15.8,13. & 18.11,28. Also below ver.21. With the Annot.] And smote it with the edge of the sword: [Heb. At the mouth of the sword] and they had set [Heb. sent] the city on fire. [i.e. they had cast fire into it: So below chap.21 48.]"}],"9":[{"catchword":null,"tekst":"And after that [i.e. after the taking of Jerusalem] the children of Judah were gone down to war against the Canaanites, dwelling in the south and in the low grounds."}],"10":[{"catchword":null,"tekst":"And Judah was gone against the Canaanites [Under the conduct of Joshua and Caleb, Jos.15.14.] that dwelt at Hebron, [See Jos.15.13.] (Now the name of Hebron was formerly Kiriath-Arba) and they smote Sefia and Abiman, and Thalmai. [Three Giants, children of Enak, as is related below ver.20.]"}],"11":[{"catchword":null,"tekst":"And from thence he [viz. Judah] was marched forth against the inhabitants of Debir: now the name of Debir was formerly Kiriath-Sepher. [See Jos. 12.13.]"}],"12":[{"catchword":null,"tekst":"And Caleb said, He that shall smite Sepher, and take it, to him will l also give my daughter Achsa to wife."}],"13":[{"catchword":null,"tekst":"Then Othniel the son of Kenaz, [i.e. one of Kenaz his posterity, as some do understand this] brother of Caleb,[i.e. cousin, near kinsman: some understand this of Othiel, others of Kenaz: compare Num 32:12. Jos 15.17. below Chap.3.9,11. 1 Chron.4.13, 15.] who was younger then be, [Heb. smaller, or lesser then he, namely, Kenaz. Oth.who (viz. Othiel) was the youngest of, or out of him, namely, Kenaz; i.e. the youngest and meanest to see to among all the posterity of Kenaz, and yet not withstanding honoured and exalted above others, by this courageous and valiant act, the match that followed, and also the office of judge: below chap.3.9,etc.] took it: and Caleb gave him aches his daughter to wife."}],"14":[{"catchword":null,"tekst":"And it came to pass, when she came (unto him) [See of this relation, Jos.15.18,19. And the Annotat. There] that she moved him [Or, sought unto him] to ask a field of her father; and she lighted off the ass. Then said Caleb unto her, what (aileth) thee?"}],"15":[{"catchword":null,"tekst":"And she said unto him, give me a blessing: [See Gen.33. on ver.11.] seeing thou hast given me a dry land, [Heb. south-land] give me also water (or springs of water) then Caleb gave her high wells, and low wells."}],"16":[{"catchword":null,"tekst":"Also the children of the Kenite, [Understand Jethro: See Num 24:21,22.] Moseh his father in law, went up out of the Palm-city [viz. Jericho. See Duet.34. On ver.3.] With the children of Juda, toward the wilderness of Judah, which is toward the south of Harad: [the name of a city lying near mount Seir, and peradventure also of a King of the same place. See Num 21:1. ] and they went and dwelt with the people. [ Heb. and he went and dwelt, or abode with, or by the people. He, namely, the Kenite, that is Jethro posterity. Some translate it thus: for he (the Kenite) was (along with them) and had remained, or had dwelt with the people, namely, Israel. See Numbs 10.29. and 24.21,22. 1 Sam. 15.6.]"}],"17":[{"catchword":null,"tekst":"Juda then went with his brother Simeon, [Here the history, which above ver.8. was intermitted, is reassumed, and pursued] and they smote the Canaanites dwelling at Zephath, [this place is no where else mentioned; onely we find 2 Chron.14.9,10. The valley of Zephata, by Maresa in Juda: Some there translate it, the valley (lying) towards Zephath] and they banned it, [See Duet.2.onver.34.] and the name of this city was called Horma. [i.e. Bun banning. Compare Numb. 14 45. and 21.3. Some conceive, that this Horma was the Royal City, situate on the southern borders of Canaan] at the west-end of Mount Seir: See Jos.12.14. and 15.30. and 19.4. 1 Sam. 30.30. 1 Chron. 4.30.]"}],"18":[{"catchword":null,"tekst":"Also Juda took Gaza with her border, [i.e. the circumjacent country: So in the following] and Askelon with her border, and Ekron with her border. [These Cities were situate in the Philistines country, at the mid-land Zea, and are often mentioned in the holy Scripture]"}],"19":[{"catchword":null,"tekst":"And the Lord was with Juda, that he drave out (the inhabitants) of the mountain: but he. [viz. Juda (proceeded not) to drive out [Oth. But not driving out] the inhabitant of the valley, because they had iron charets. [although the Lord was with Judah in the subduing and taking of the mountain, yet notwithstanding he was not courageous enough for to pursue the rest through humane fear, which here prevailed more with him, then the command and promise of God, Jos.13.6. and 17.18. Of the iron charets then used in battle, see Jos.17.18.]"}],"20":[{"catchword":null,"tekst":"And they gave Hebron unto Caleb, [See the History hereof, Jos.14, from the end of the Chapter] according as Moseh had spoken: and the expelled thence the three sons of Enak. [Of whom mention is made above, ver.10. Of Enak and his posterity which were Giants, see Numb.13. On ver .22. Oth. Of the Giant]"}],"21":[{"catchword":null,"tekst":"But the children of Benjamin did not drive out the Jebusites dwelling at Jerusalem: [Underst. In the upper part of the City, and the strong hold which was fallen unto Benjamin&acirc;&euro;&trade;s share, in regard their inheritances lay partly among those of Juda, Jos.1811. Judah had taken his, as above ver.8. Out of strong hold the Jebusites were not expelled till Davids time, 2 Sam.5.6,7.] But the Jebusites dwelt with the children of Benjamin at Jerusalem unto this day. [viz. when this was written by the Author of this book]"}],"22":[{"catchword":null,"tekst":"And the house of Joseph went up also toward Bethel: and the Lord was with them."}],"23":[{"catchword":null,"tekst":"And the house of Joseph set spies near Bethel: now the name of this city was before-time Luz. [See Gen.28 ver.19.]"}],"24":[{"catchword":null,"tekst":"And the watchmen [That were sent forth to spy out the situation of the City] saw a man going forth out of the city: and they said unto him, shew us, we pray, the entrance of the city, and we will shew kindness unto thee."}],"25":[{"catchword":null,"tekst":"And when he had shewed them the entrance of the city, they smote the city with the edge of the sword, but they let go that man, and all his family."}],"26":[{"catchword":null,"tekst":"Then went this man into the land of the Hethites. [Which dwelt on the north-side of mount Ephraim] and he built a city, and called the name thereof Luz: this is the name thereof unto this day."}],"27":[{"catchword":null,"tekst":"And Manasseh [Understand, the half tribe which dwelt in Canaan, not those which dwelt beyond Jordan in Gilead, and Basan] drave not out Beth-Sean, [i.e. the inhabitants of Beth-Sean; as in the sequel is set forth. Beth-Sean lay by Jordan on the west-side: see Jos.1711.] nor her dependant places, [i.e. the circumjacent places, resorting under them] neither Taanach, situate in mount Gilboa. See also Jos.17.v.11. And 21.25.] With her dependant places, nor the inhabitants of Dor, with her dependant places, nor the inhabitants of Jibleam, [Jos.17.11. both these places lay near to the mid-land Sea] with her her dependant places, nor the inhabitants of Meggido, with her dependant places: and the Canaanites would dwell in the same land. [Or, found good, consented, or began (Heb. the Canaanite would, etc.) viz. either out of willfulness, or on condition of Tribute, as some expound this out of the following verse. So below ver. 35. See also Jos.17.12,13.]"}],"28":[{"catchword":null,"tekst":"And it came to pass, when Isreal grew strong, that he put the Canaanites upon tribute: but he drave them not quite out. [Heb. driving out, he drave them not out; to wit, the Canaanites]"}],"29":[{"catchword":null,"tekst":"Also Ephraim drave not out the Canaanites which dwelt at Gezer: [Situate by the brook of Gaas, toward the midland Sea; being also a City of the Levites; Jos. At 21. 21.] But the Canaanites dwelt in the midst of them at Gezer."}],"30":[{"catchword":null,"tekst":"Zebulon drave not out the inhabitant of Kitron, [Situate by the mountain of Zebulon, westward, near unto the source of the brook Jiphtahel] nor the inhabitants of Nuhalel: see Jos .19.15.] but the Canaanites dwelt in the midst of him, [viz. Zebulon] and were tributary."}],"33":[{"catchword":null,"tekst":"Naphtali drave not the inhabitants of Beth-Semes, nor the inhabitants of Beth-Anath, [See of both these cities lying in Naphtali, Jos. 19.38.] but dwelt in the midst of the Canaanites which dwelt in the land: but the inhabitants of Beth-Semes and Beth-Anath became tributary unto them."}],"34":[{"catchword":null,"tekst":"And the Amorites forced the children of Dan into the mountain, for they suffered them not to come down into the valley. [i.e. the lower parts, or plains]."}],"35":[{"catchword":null,"tekst":"Also the Amorites would dwell [See above on ver.27.] on mount Heres, at Ajalon, and at Saalbim: [see Jos.19.42. and 21. 24. Saalbim lay in the valley of Escol, Ajalon from thence in the northwest, toward the west sea, on the borders of Dan. Of other places of this name, see below chap 12.12.] but the hand of house of the house of Joseph became heavy, so that they became tributary. [Heb. became, or were tributary. The meaning is, those of the house of Joseph came to succor Dan, and compelled or forced the Amorites so far, that they became tributary unto them]"}],"36":[{"catchword":null,"tekst":"And the border of the Amorites was from the going up of Akrabbim, [Lying by the south-end of the salt-sea, and on the east-end of mount Seer, upon the uttermost borders of Canaan toward the south. see Jos.15.2,3,] from the rock. [Oth. Sela, or Petra Arabia; a famous City, lying upon a rock] and along upwards."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
