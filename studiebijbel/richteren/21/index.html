\">Israël</span>; <span class=\"wl\" data-l=\"L6\" data-code=\"H376\">ieder</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6213\">deed</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3477\">wat</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3477\">recht</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3477\">was</span> in zijn eigen <span class=\"wl\" data-l=\"L9\" data-code=\"H5869\">ogen</span>."}, "koppeling_kjv": {"1": "Now the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> in <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpeh,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> There shall not <span class=\"wl wl-kjv\" data-code=\"H376\">any</span> of us <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> unto <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> to wife.", "2": "And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> there till <span class=\"wl wl-kjv\" data-code=\"H6153\">even</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voices,</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> sore;", "3": "And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> why is this come to pass in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that there should be to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">lacking</span> in Israel?", "4": "And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> that the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> rose <span class=\"wl wl-kjv\" data-code=\"H7925\">early,</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> there an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> and peace offerings.", "5": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who is there among all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H834\">that</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">came</span> not up with the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span> For they had made a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7621\">oath</span> concerning him that came not <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpeh,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> He shall <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> be put to death.", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5162\">repented</span> them for <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> their <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> There is <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> cut <span class=\"wl wl-kjv\" data-code=\"H1438\">off</span> from <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> this day.", "7": "How shall we <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> for <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> for them that <span class=\"wl wl-kjv\" data-code=\"H3498\">remain,</span> seeing we have <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that we will not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them of our <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> to wives?", "8": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> is there of the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> that came not <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpeh</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span> And, behold, there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H376\">none</span> to the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> from <span class=\"wl wl-kjv\" data-code=\"H3003\">Jabeshgilead</span> to the assembly.", "9": "For the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered,</span> and, behold, there were <span class=\"wl wl-kjv\" data-code=\"H376\">none</span> of the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3003\">Jabeshgilead</span>", "10": "And the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> thither <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">valiantest,</span> and <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3003\">Jabeshgilead</span> with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> with the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> and the children.", "11": "And this is the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> that ye shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> Ye shall utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroy</span> every <span class=\"wl wl-kjv\" data-code=\"H2145\">male,</span> and every <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> that hath <span class=\"wl wl-kjv\" data-code=\"H4904\">lain</span> by man.", "12": "And they <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> among the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3003\">Jabeshgilead</span> <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H5291\">young</span> <span class=\"wl wl-kjv\" data-code=\"H1330\">virgins,</span> that had <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> by <span class=\"wl wl-kjv\" data-code=\"H4904\">lying</span> with any <span class=\"wl wl-kjv\" data-code=\"H2145\">male:</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> to <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Canaan.", "13": "And the whole <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> some to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> <span class=\"wl wl-kjv\" data-code=\"H7417\">Rimmon,</span> and to <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> peaceably", "14": "And <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> came <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> which they had saved <span class=\"wl wl-kjv\" data-code=\"H2421\">alive</span> of the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> of <span class=\"wl wl-kjv\" data-code=\"H3003\">Jabeshgilead:</span> and yet so they sufficed", "15": "And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5162\">repented</span> them for <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> because that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H6556\">breach</span> in the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of Israel.", "16": "Then the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> How shall we <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> for <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> for them that <span class=\"wl wl-kjv\" data-code=\"H3498\">remain,</span> seeing the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> are <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> out of Benjamin?", "17": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> There must be an <span class=\"wl wl-kjv\" data-code=\"H3425\">inheritance</span> for them that be <span class=\"wl wl-kjv\" data-code=\"H6413\">escaped</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> that a <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> be not <span class=\"wl wl-kjv\" data-code=\"H4229\">destroyed</span> out of Israel.", "18": "Howbeit we <span class=\"wl wl-kjv\" data-code=\"H3201\">may</span> not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> of our <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> have <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> be he that <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> to Benjamin.", "19": "Then they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, there is a <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">yearly</span> in a place which is on the north <span class=\"wl wl-kjv\" data-code=\"H6828\">side</span> of <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> on the east <span class=\"wl wl-kjv\" data-code=\"H4217\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H4546\">highway</span> that goeth <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> to <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem,</span> and on the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> of Lebonah.", "20": "Therefore they <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and lie in <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> in the vineyards;", "21": "And <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H2342\">dance</span> in <span class=\"wl wl-kjv\" data-code=\"H4246\">dances,</span> then come ye <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
