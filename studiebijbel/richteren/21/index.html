ood worden.","6":"En het berouwde de kinderen van Israël over Benjamin, hun broeder; en zij zeiden: Vandaag is één stam van Israël afgesneden.","7":"Wat zullen wij doen, als het gaat om vrouwen voor hen die overgebleven zijn? Want wij hebben bij de HEERE gezworen dat wij hun geen van onze dochters tot vrouwen zullen geven.","8":"En zij zeiden: Is er iemand van de stammen van Israël, die niet is opgekomen tot de HEERE te Mizpa? En zie, van Jabes in Gilead was niemand opgekomen naar het leger, naar de gemeente.","9":"Want het volk werd geteld, en zie, er was niemand van de inwoners van Jabes in Gilead.","10":"Toen zond de vergadering daarheen twaalfduizend man, van de strijdbaarste; en zij geboden hun: Trekt heen, en slaat met de scherpte van het zwaard de inwoners van Jabes in Gilead, met de vrouwen en de kinderen.","11":"Doch dit is de zaak die u doen zult: al wat mannelijk is, en alle vrouwen die gemeenschap met een man gehad hebben, zult u met de ban slaan.","12":"En zij vonden onder de inwoners van Jabes in Gilead vierhonderd jonge maagden, die geen man bekend hadden in gemeenschap met een man; en zij brachten hen naar het leger te Silo, dat in het land Kanaän is.","13":"Toen zond de hele vergadering heen, en sprak tot de kinderen van Benjamin die in de rots Rimmon waren, en zij riepen hun vrede toe.","14":"Zo kwamen de Benjaminieten in diezelfde tijd terug; en zij gaven hun de vrouwen die zij van de vrouwen van Jabes in Gilead in leven hadden gelaten; maar zo waren er nog niet genoeg voor hen.","15":"Toen berouwde het aan het volk over Benjamin, omdat de HEERE een scheur gemaakt had in de stammen van Israël.","16":"En de oudsten van de vergadering zeiden: Wat zullen wij doen, als het gaat om vrouwen voor hen die overgebleven zijn? Want de vrouwen zijn uit Benjamin uitgeroeid.","17":"Verder zeiden zij: De erfenis van hen die ontkomen zijn, is van Benjamin, en er moet geen stam uit Israël weggevaagd worden.","18":"Maar wij zullen hun geen vrouwen van onze dochters kunnen geven; want de kinderen van Israël hebben gezworen: Vervloekt is hij die aan de Benjaminieten een vrouw geeft!","19":"Toen zeiden zij: Zie, er is een feest van de HEERE te Silo, van jaar tot jaar, dat gehouden wordt ten noorden van het huis van God, ten oosten* van de hoge weg die opgaat van het huis van God naar Sichem, en ten zuiden van Lebona.","20":"En zij geboden de kinderen van Benjamin: Gaat heen, en verberg u in de wijngaarden.","21":"En let erop, en zie, als de dochters van Silo uitgegaan zijn om in reidansen te dansen, dan komt u tevoorschijn uit de wijngaarden, en schaakt u ieder zijn vrouw, uit de dochters van Silo; en gaat heen naar het land van Benjamin.","22":"En het zal gebeuren, wanneer hun vaders of hun broeders komen om bij ons te klagen, dat wij tegen hen zullen zeggen: Weest hun om onzentwil genadig, omdat wij niet voor ieder van hen een vrouw genomen hebben in deze oorlog; want u hebt ze hun niet gegeven, zodat u nu niet schuldig zou zijn.","23":"En de kinderen van Benjamin deden zo, en voerden naar hun aantal vrouwen weg van de danseressen die zij roofden, en zij trokken heen, en keerden terug naar hun erfenis, en herbouwden de steden, en woonden daarin.","24":"Ook trokken de kinderen van Israël in die tijd vandaar, ieder naar zijn stam en naar zijn geslacht; zo trokken zij vandaar uit, ieder naar zijn erfenis.","25":"In die dagen was er geen koning in Israël; ieder deed wat recht was in zijn eigen ogen."},"SV":{"1":"De mannen van Israël nu hadden te Mizpa gezworen, zeggende: Niemand van ons zal zijn dochter aan de Benjaminieten ter vrouwe geven.","2":"Zo kwam het volk tot het huis Gods, en zij bleven daar tot op den avond, voor Gods aangezicht; en zij hieven hun stem op en weenden met groot geween.","3":"En zeiden: O HEERE, God van Israël! Waarom is dit geschied in Israël, dat er heden een stam van Israël gemist wordt?","4":"En het geschiedde des anderen daags, dat zich het volk vroeg opmaakte, en bouwde aldaar een altaar; en zij offerden brandofferen en dankofferen.","5":"En de kinderen Israëls zeiden: Wie is er, die niet is opgekomen in de vergadering uit al de stammen van Israël tot den HEERE? want er was een grote eed geschied aangaande dengene, die niet opkwam tot den HEERE te Mizpa, zeggende: Hij zal zekerlijk gedood worden.","6":"En het berouwde den kinderen Israëls over Benjamin, hun broeder; en zij zeiden: Heden is een stam van Israël afgesneden.","7":"Wat zullen wij, belangende de vrouwen, doen aan degenen, die overgebleven zijn? want wij hebben bij den HEERE gezworen, dat wij hun van onze dochteren geen tot vrouwen zullen geven.","8":"En zij zeiden: Is er iemand van de stammen van Israël, die niet opgekomen is tot den HEERE te Mizpa? En ziet, van Jabes in Gilead was niemand opgekomen in het leger, tot de gemeente.","9":"want het volk werd geteld, en ziet, er was niemand van de inwoners van Jabes in Gilead.","10":"Toen zond de vergadering daarheen twaalf duizend mannen, van de strijdbaarste; en zij geboden hun, zeggende: Trekt heen, en slaat met de scherpte des zwaards de inwoners van Jabes in Gilead, met de vrouwen en de kinderkens.","11":"Doch dit is de zaak, die ge doen zult; al wat mannelijk is, en alle vrouwen, die de bijligging eens mans bekend hebben, zult gij verbannen.","12":"En zij vonden onder de inwoners van Jabes in Gilead vierhonderd jonge dochters, die maagden waren, die geen man bekend hadden in bijligging des mans; en zij brachten die in het leger te Silo, dewelke is in het land Kanaän.","13":"Toen zond de ganse vergadering heen, en sprak tot de kinderen van Benjamin, die in den rotssteen van Rimmon waren, en zij riepen hun vrede toe.","14":"Alzo kwamen de Benjaminieten ter zelfder tijd weder; en zij gaven hun de vrouwen, die zij in het leven behouden hadden van de vrouwen van Jabes in Gilead; maar alzo waren er nog niet genoeg voor hen.","15":"Toen berouwde het den volke over Benjamin, omdat de HEERE een scheur gemaakt had in de stammen van Israël.","16":"En de oudsten der vergadering zeiden: Wat zullen wij, belangende de vrouwen, doen aan degenen, die overgebleven zijn? want de vrouwen zijn uit Benjamin verdelgd.","17":"Wijders zeiden zij: De erfenis dergenen, die ontkomen zijn, is van Benjamin, en er moet geen stam uitgedelgd worden uit Israël.","18":"Maar wij zullen hun geen vrouwen van onze dochteren kunnen geven; want de kinderen Israëls hebben gezworen, zeggende: Vervloekt zij, die den Benjaminieten een vrouw geeft!","19":"Toen zeiden zij: Ziet, er is een feest des HEEREN te Silo, van jaar tot jaar, dat *gehouden* *wordt* tegen het noorden van het huis Gods, tegen den opgang der zon, aan den hogen weg, die opgaat van het huis Gods naar Sichem, en tegen het zuiden van Lebona.","20":"En zij geboden den kinderen van Benjamin, zeggende: Gaat heen, en loert in de wijngaarden.","21":"En let er op, en zie, als de dochters van Silo zullen uitgegaan zijn om met reien te dansen, zo komt gij voort uit de wijngaarden, en schaakt u, een ieder zijn huisvrouw, uit de dochteren van Silo; en gaat heen in het land van Benjamin.","22":"En het zal geschieden, wanneer haar vaders of haar broeders zullen komen, om voor ons te rechten, dat wij tot hen zullen zeggen: Zijt hun om onzentwil genadig, omdat wij geen huisvrouw voor een ieder van hen in dezen krijg genomen hebben; want gijlieden hebt ze hun niet gegeven, dat gij te dezer tijd schuldig zoudt zijn.","23":"En de kinderen van Benjamin deden alzo, en voerden naar hun getal vrouwen weg, van de reiende dochters, die zij roofden, en zij togen heen, en keerden weder tot hun erfenis, en herbouwden de steden, en woonden daarin.","24":"Ook togen de kinderen Israëls te dier tijd van daar, een iegelijk naar zijn stam en naar zijn geslacht; alzo togen zij uit van daar, een iegelijk naar zijn erfenis.","25":"In die dagen was er geen koning in Israël; een iegelijk deed, wat recht was in zijn ogen."},"KJV":{"1":"Now the men of Israel had sworn in Mizpeh, saying, There shall not any of us give his daughter unto Benjamin to wife.","2":"And the people came to the house of God, and abode there till even before God, and lifted up their voices, and wept sore;","3":"And said, O LORD God of Israel, why is this come to pass in Israel, that there should be to day one tribe lacking in Israel?","4":"And it came to pass on the morrow, that the people rose early, and built there an altar, and offered burnt offerings and peace offerings.","5":"And the children of Israel said, Who *is there* among all the tribes of Israel that came not up with the congregation unto the LORD? For they had made a great oath concerning him that came not up to the LORD to Mizpeh, saying, He shall surely be put to death.","6":"And the children of Israel repented them for Benjamin their brother, and said, There is one tribe cut off from Israel this day.","7":"How shall we do for wives for them that remain, seeing we have sworn by the LORD that we will not give them of our daughters to wives?","8":"And they said, What one *is there* of the tribes of Israel that came not up to Mizpeh to the LORD? And, behold, there came none to the camp from Jabeshgilead to the assembly.","9":"For the people were numbered, and, behold, *there were* none of the inhabitants of Jabeshgilead","10":"And the congregation sent thither twelve thousand men of the valiantest, and commanded them, saying, Go and smite the inhabitants of Jabeshgilead with the edge of the sword, with the women and the children.","11":"And this *is* the thing that ye shall do, Ye shall utterly destroy every male, and every woman that hath lain by man.","12":"And they found among the inhabitants of Jabeshgilead four hundred young virgins, that had known no man by lying with any male: and they brought them unto the camp to Shiloh, which *is* in the land of Canaan.","13":"And the whole congregation sent *some* to speak to the children of Benjamin that *were* in the rock Rimmon, and to call peaceably","14":"And Benjamin came again at that time; and they gave them wives which they had saved alive of the women of Jabeshgilead: and yet so they sufficed","15":"And the people repented them for Benjamin, because that the LORD had made a breach in the tribes of Israel.","16":"Then the elders of the congregation said, How shall we do for wives for them that remain, seeing the women are destroyed out of Benjamin?","17":"And they said, *There must be* an inheritance for them that be escaped of Benjamin, that a tribe be not destroyed out of Israel.","18":"Howbeit we may not give them wives of our daughters: for the children of Israel have sworn, saying, Cursed *be* he that giveth a wife to Benjamin.","19":"Then they said, Behold, *there is* a feast of the LORD in Shiloh yearly *in a place* which *is* on the north side of Bethel, on the east side of the highway that goeth up from Bethel to Shechem, and on the south of Lebonah.","20":"Therefore they commanded the children of Benjamin, saying, Go and lie in wait in the vineyards;","21":"And see, and, behold, if the daughters of Shiloh come out to dance in dances, then come ye out of the vineyards, and catch you every man his wife of the daughters of Shiloh, and go to the land of Benjamin.","22":"And it shall be, when their fathers or their brethren come unto us to complain, that we will say unto them, Be favourable unto them for our sakes: because we reserved not to each man his wife in the war: for ye did not give unto them at this time, *that* ye should be guilty.","23":"And the children of Benjamin did so, and took *them* wives, according to their number, of them that danced, whom they caught: and they went and returned unto their inheritance, and repaired the cities, and dwelt","24":"And the children of Israel departed thence at that time, every man to his tribe and to his family, and they went out from thence every man to his inheritance.","25":"In those days *there was* no king in Israel: every man did *that which was* right in his own eyes."}},"tsk":{"1":[{"kopje":"hadden g e=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H5291\">young</span> <span class=\"wl wl-kjv\" data-code=\"H1330\">virgins,</span> that had <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> by <span class=\"wl wl-kjv\" data-code=\"H4904\">lying</span> with any <span class=\"wl wl-kjv\" data-code=\"H2145\">male:</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> to <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Canaan.","13":"And the whole <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> some to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> <span class=\"wl wl-kjv\" data-code=\"H7417\">Rimmon,</span> and to <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> peaceably","14":"And <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> came <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> which they had saved <span class=\"wl wl-kjv\" data-code=\"H2421\">alive</span> of the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> of <span class=\"wl wl-kjv\" data-code=\"H3003\">Jabeshgilead:</span> and yet so they sufficed","15":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5162\">repented</span> them for <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> because that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H6556\">breach</span> in the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of Israel.","16":"Then the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> How shall we <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> for <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> for them that <span class=\"wl wl-kjv\" data-code=\"H3498\">remain,</span> seeing the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> are <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> out of Benjamin?","17":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> There must be an <span class=\"wl wl-kjv\" data-code=\"H3425\">inheritance</span> for them that be <span class=\"wl wl-kjv\" data-code=\"H6413\">escaped</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> that a <span class=\"wl wl-kjv\" data-code=\"H7626\">tribe</span> be not <span class=\"wl wl-kjv\" data-code=\"H4229\">destroyed</span> out of Israel.","18":"Howbeit we <span class=\"wl wl-kjv\" data-code=\"H3201\">may</span> not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> of our <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> have <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> be he that <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> to Benjamin.","19":"Then they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, there is a <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">yearly</span> in a place which is on the north <span class=\"wl wl-kjv\" data-code=\"H6828\">side</span> of <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> on the east <span class=\"wl wl-kjv\" data-code=\"H4217\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H4546\">highway</span> that goeth <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> to <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem,</span> and on the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> of Lebonah.","20":"Therefore they <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and lie in <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> in the vineyards;","21":"And <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> and, behold, if the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H7887\">Shiloh</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H2342\">dance</span> in <span class=\"wl wl-kjv\" data-code=\"H4246\">dances,</span> then come ye <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> and <spa chword":"tot den HEERE?","tekst":"Zie boven, Jdg 20:1."},{"catchword":"zekerlijk gedood worden","tekst":"Hebreeuws, hij zal stervende gedood worden, of, men zal hem stervende doen sterven."}],"6":[{"catchword":"Heden is een stam van Israël afgesneden","tekst":"Of, zouden wij heden een stam van Israël afsnijden?"}],"7":[{"catchword":"belangende de vrouwen,","tekst":"Dat is, opdat zij vrouwen mogen bekomen, en de stam onderhouden worde."}],"8":[{"catchword":"van Jabes","tekst":"Gelegen over de Jordaan, waar dezelve loopt door de zee Gennesareth, tegen het oosten. Zie ook 1Sa 11:1, 1Sa 11:3, 1Sa 11:9, enz., en 1Sa 31:11, enz."}],"10":[{"catchword":"strijdbaarste;","tekst":"Hebreeuws, van de kinderen, of, zonen der strijdbaarheid, of, des heirs."}],"11":[{"catchword":"verbannen","tekst":"Dat is, uitroeien, ombrengen. Zie Deu 2:34."}],"12":[{"catchword":"Silo,","tekst":"Zie Jos 18:1."},{"catchword":"dewelke is","tekst":"Of, hetwelk [te weten, leger] was, enz."},{"catchword":"Kanaän","tekst":"Over de Jordaan tegen het westen, te rekenen van Gilead, dat gelegen was aan gene zijde der Jordaan, tegen het oosten."}],"13":[{"catchword":"zond de ganse vergadering heen,","tekst":"Hebreeuws, zonden en spraken, enz. Dat is, zond enigen en liet door dezelve met hen spreken."}],"14":[{"catchword":"die zij in het leven behouden hadden","tekst":"De anderen altemaal verbannen of omgebracht zijnde, gelijk vs.10 bevolen was."},{"catchword":"waren er nog niet genoeg voor hen","tekst":"Hebreeuws, en vonden zij niet voor hen. Zie van deze manier van spreken Num 11:22; Jos 17:17, enz."}],"15":[{"catchword":"berouwde het den volke over Benjamin,","tekst":"Omdat er geen middel meer overig scheen te wezen om de resterenden met vrouwen te voorzien."}],"16":[{"catchword":"degenen,","tekst":"Versta, de anderen, die nog twee honderd in getal waren."},{"catchword":"de vrouwen zijn uit Benjamin verdelgd","tekst":"Hebreeuws, de vrouw is verdelgd."}],"17":[{"catchword":"dergenen,","tekst":"Hebreeuws, der ontkoming; dat is, dergenen die ontkomen zijn. De zin is: De overgeblevenen moeten behouden de ganse erfenis, die den stam Benjamins ten tijde van Jozua bij het lot ten deel gevallen is; men mag geen anderen stam een gedeelte daarvan ingeven. Dewijl nu deze overgeblevenen weinig in getal zijn, zo dienen zij immers allen van vrouwen verzorgd opdat de stam, weder uitgebreid zijnde, in wezen blijve, zijn erfenis besla, en bewone. Anders, degenen, die van Benjamin ontkomen zijn, [moeten hun] erfenis [behouden] dat er geen stam, enz."}],"19":[{"catchword":"feest des HEEREN te Silo,","tekst":"Wat dit voor een feest geweest is, is onzeker. Sommigen gissen dat het is geweest het feest der loofhutten."},{"catchword":"jaar tot jaar,","tekst":"Hebreeuws, van dagen tot dagen; dat is, van jaar tot jaar; de zin is: Alle jaren, of jaarlijks. Zie deze betekenis van het woord dagen Lev 25:29, en de aantekeningen aldaar."},{"catchword":"tegen het noorden","tekst":"Dit wordt door de meeste uitleggers gehouden voor een beschrijving der plaatsen, waar zich het volk, bij menigten van alle kwartieren opkomende, placht te verspreiden en te vermaken, dewijl zij geen ruimte daartoe binnen Silo hadden. Deze beschrijving diende den Benjaminieten om daarop te letten, gelijk volgt."},{"catchword":"het huis Gods,","tekst":"Anders, Behtel."}],"21":[{"catchword":"reien te dansen,","tekst":"Of, met pijpen te pijpen, met fluiten te fluiten."},{"catchword":"schaakt u,","tekst":"Of, grijpt, rooft."},{"catchword":"in het land van Benjamin","tekst":"Naar de plaatsen, die gij tevoren bewoond hebt, om die weder op te bouwen. Zie vs.23."}],"22":[{"catchword":"Zijt hun om onzentwil genadig,","tekst":"De zin is: Staat ons deze Benjaminieten gunstiglijk toe, dat wij hen ditmaal verschonen: of [naar sommiger mening] staat ons deze dochters voor ditmaal toe, geeft, schenkt haar ons uit gratie, om de volgende redenen. Anders, zijt hun [dezen Benjaminieten] onzenthalve genadig, of, hebt om onzentwil medelijden // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;

      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
