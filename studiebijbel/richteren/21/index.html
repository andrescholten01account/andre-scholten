een.", "3": "En zij zeiden: O HEERE, God van Israël! Waarom is dit gebeurd in Israël, dat er vandaag één stam van Israël gemist wordt?", "4": "En het gebeurde de volgende dag, dat het volk zich vroeg opmaakte en daar een altaar bouwde; en zij offerden brandoffers en dankoffers.", "5": "En de kinderen van Israël zeiden: Wie is er, van al de stammen van Israël, die niet is opgekomen in de vergadering tot de HEERE? Want er was een grote eed gezworen aangaande hem die niet opkwam tot de HEERE te Mizpa: Hij zal zeker gedood worden.", "6": "En het berouwde de kinderen van Israël over Benjamin, hun broeder; en zij zeiden: Vandaag is één stam van Israël afgesneden.", "7": "Wat zullen wij doen, als het gaat om vrouwen voor hen die overgebleven zijn? Want wij hebben bij de HEERE gezworen dat wij hun geen van onze dochters tot vrouwen zullen geven.", "8": "En zij zeiden: Is er iemand van de stammen van Israël, die niet is opgekomen tot de HEERE te Mizpa? En zie, van Jabes in Gilead was niemand opgekomen naar het leger, naar de gemeente.", "9": "Want het volk werd geteld, en zie, er was niemand van de inwoners van Jabes in Gilead.", "10": "Toen zond de vergadering daarheen twaalfduizend man, van de strijdbaarste; en zij geboden hun: Trekt heen, en slaat met de scherpte van het zwaard de inwoners van Jabes in Gilead, met de vrouwen en de kinderen.", "11": "Doch dit is de zaak die u doen zult: al wat mannelijk is, en alle vrouwen die gemeenschap met een man gehad hebben, zult u met de ban slaan.", "12": "En zij vonden onder de inwoners van Jabes in Gilead vierhonderd jonge maagden, die geen man bekend hadden in gemeenschap met een man; en zij brachten hen naar het leger te Silo, dat in het land Kanaän is.", "13": "Toen zond de hele vergadering heen, en sprak tot de kinderen van Benjamin die in de rots Rimmon waren, en zij riepen hun vrede toe.", "14": "Zo kwamen de Benjaminieten in diezelfde tijd terug; en zij gaven hun de vrouwen die zij van de vrouwen van Jabes in Gilead in leven hadden gelaten; maar zo waren er nog niet genoeg voor hen.", "15": "Toen berouwde het aan het volk over Benjamin, omdat de HEERE een scheur gemaakt had in de stammen van Israël.", "16": "En de oudsten van de vergadering zeiden: Wat zullen wij doen, als het gaat om vrouwen voor hen die overgebleven zijn? Want de vrouwen zijn uit Benjamin uitgeroeid.", "17": "Verder zeiden zij: De erfenis van hen die ontkomen zijn, is van Benjamin, en er moet geen stam uit Israël weggevaagd worden.", "18": "Maar wij zullen hun geen vrouwen van onze dochters kunnen geven; want de kinderen van Israël hebben gezworen: Vervloekt is hij die aan de Benjaminieten een vrouw geeft!", "19": "Toen zeiden zij: Zie, er is een feest van de HEERE te Silo, van jaar tot jaar, dat gehouden wordt ten noorden van het huis van God, ten oosten* van de hoge weg die opgaat van het huis van God naar Sichem, en ten zuiden van Lebona.", "20": "En zij geboden de kinderen van Benjamin: Gaat heen, en verberg u in de wijngaarden.", "21": "En let erop, en zie, als de dochters van Silo uitgegaan zijn om in reidansen te dansen, dan komt u tevoorschijn uit de wijngaarden, en schaakt u ieder zijn vrouw, uit de dochters van Silo; en gaat heen naar het land van Benjamin.", "22": "En het zal gebeuren, wanneer hun vaders of hun broeders komen om bij ons te klagen, dat wij tegen hen zullen zeggen: Weest hun om onzentwil genadig, omdat wij niet voor ieder van hen een vrouw genomen hebben in deze oorlog; want u hebt ze hun niet gegeven, zodat u nu niet schuldig zou zijn.", "23": "En de kinderen van Benjamin deden zo, en voerden naar hun aantal vrouwen weg van de danseressen die zij roofden, en zij trokken heen, en keerden terug naar hun erfenis, en herbouwden de steden, en woonden daarin.", "24": "Ook trokken de kinderen van Israël in die tijd vandaar, ieder naar zijn stam en naar zijn geslacht; zo trokken zij vandaar uit, ieder naar zijn erfenis.", "25": "In die dagen was er geen koning in Israël; ieder deed wat recht was in zijn eigen ogen."}, "SV": {"1": "De mannen van Israël nu hadden te Mizpa gezworen, zeggende: Niemand van ons zal zijn dochter aan de Benjaminieten ter vrouwe geven.", "2": "Zo kwam het volk tot het huis Gods, en zij bleven daar tot op den avond, voor Gods aangezicht; en zij hieven hun stem op en weenden met groot geween.", "3": "En zeiden: O HEERE, God van Israël! Waarom is dit geschied in Israël, dat er heden een stam van Israël gemist wordt?", "4": "En het geschiedde des anderen daags, dat zich het volk vroeg opmaakte, en bouwde aldaar een altaar; en zij offerden brandofferen en dankofferen.", "5": "En de kinderen Israëls zeiden: Wie is er, die niet is opgekomen in de vergadering uit al de stammen van Israël tot den HEERE? want er was een grote eed geschied aangaande dengene, die niet opkwam tot den HEERE te Mizpa, zeggende: Hij zal zekerlijk gedood worden.", "6": "En het berouwde den kinderen Israëls over Benjamin, hun broeder; en zij zeiden: Heden is een stam van Israël afgesneden.", "7": "Wat zullen wij, belangende de vrouwen, doen aan degenen, die overgebleven zijn? want wij hebben bij den HEERE gezworen, dat wij hun van onze dochteren geen tot vrouwen zullen geven.", "8": "En zij zeiden: Is er iemand van de stammen van Israël, die niet opgekomen is tot den HEERE te Mizpa? En ziet, van Jabes in Gilead was niemand opgekomen in het leger, tot de gemeente.", "9": "want het volk werd geteld, en ziet, er was niemand van de inwoners van Jabes in Gilead.", "10": "Toen zond de vergadering daarheen twaalf duizend mannen, van de strijdbaarste; en zij geboden hun, zeggende: Trekt heen, en slaat met de scherpte des zwaards de inwoners van Jabes in Gilead, met de vrouwen en de kinderkens.", "11": "Doch dit is de zaak, die ge doen zult; al wat mannelijk is, en alle vrouwen, die de bijligging eens mans bekend hebben, zult gij verbannen.", "12": "En zij vonden onder de inwoners van Jabes in Gilead vierhonderd jonge dochters, die maagden waren, die geen man bekend hadden in bijligging des mans; en zij brachten die in het leger te Silo, dewelke is in het land Kanaän.", "13": "Toen zond de ganse vergadering heen, en sprak tot de kinderen van Benjamin, die in den rotssteen van Rimmon waren, en zij riepen hun vrede toe.", "14": "Alzo kwamen de Benjaminieten ter zelfder tijd weder; en zij gaven hun de vrouwen, die zij in het leven behouden hadden van de vrouwen van Jabes in Gilead; maar alzo waren er nog niet genoeg voor hen.", "15": "Toen berouwde het den volke over Benjamin, omdat de HEERE een scheur gemaakt had in de stammen van Israël.", "16": "En de oudsten der vergadering zeiden: Wat zullen wij, belangende de vrouwen, doen aan degenen, die overgebleven zijn? want de vrouwen zijn uit Benjamin verdelgd.", "17": "Wijders zeiden zij: De erfenis dergenen, die ontkomen zijn, is van Benjamin, en er moet geen stam uitgedelgd worden uit Israël.", "18": "Maar wij zullen hun geen vrouwen van onze dochteren kunnen geven; want de kinderen Israëls hebben gezworen, zeggende: Vervloekt zij, die den Benjaminieten een vrouw geeft!", "19": "Toen zeiden zij: Ziet, er is een feest des HEEREN te Silo, van jaar tot jaar, dat *gehouden* *wordt* tegen het noorden van het huis Gods, tegen den opgang der zon, aan den hogen weg, die opgaat van het huis Gods naar Sichem, en tegen het zuiden van Lebona.", "20": "En zij geboden den kinderen van Benjamin, zeggende: Gaat heen, en loert in de wijngaarden.", "21": "En let er op, en zie, als de dochters van Silo zullen uitgegaan zijn om met reien te dansen, zo komt gij voort uit de wijngaarden, en schaakt u, een ieder zijn huisvrouw, uit de dochteren van Silo; en gaat heen in het land van Benjamin.", "22": "En het zal geschieden, wanneer haar vaders of haar broeders zullen komen, om voor ons te rechten, dat wij tot hen zullen zeggen: Zijt hun om onzentwil genadig, omdat wij geen huisvrouw voor een ieder van hen in dezen krijg genomen hebben; want gijlieden hebt ze hun niet gegeven, dat gij te dezer tijd schuldig zoudt zijn.", "23": "En de kinderen van Benjamin deden alzo, en voerden naar hun getal vrouwen weg, van de reiende dochters, die zij roofden, en zij togen heen, en keerden weder tot hun erfenis, en herbouwden de steden, en woonden daarin.", "24": "Ook togen de kinderen Israëls te dier tijd van daar, een iegelijk naar zijn stam en naar zijn geslacht; alzo togen zij uit van daar, een iegelijk naar zijn erfenis.", "25": "In die dagen was er geen koning in Israël; een iegelijk deed, wat recht was in zijn ogen."}, "KJV": {"1": "Now the men of Israel had sworn in Mizpeh, saying, There shall not any of us give his daughter unto Benjamin to wife.", "2": "And the people came to the house of God, and abode there till even before God, and lifted up their voices, and wept sore;", "3": "And said, O LORD God of Israel, why is this come to pass in Israel, that there should be to day one tribe lacking in Israel?", "4": "And it came to pass on the morrow, that the people rose early, and built there an altar, and offered burnt offerings and peace offerings.", "5": "And the children of Israel said, Who *is there* among all the tribes of Israel that came not up with the congregation unto the LORD? For they had made a great oath concerning him that came not up to the LORD to Mizpeh, saying, He shall surely be put to death.", "6": "And the children of Israel repented them for Benjamin their brother, and said, There is one tribe cut off from Israel this day.", "7": "How shall we do for wives for them that remain, seeing we have sworn by the LORD that we will not give them of our daughters to wives?", "8": "And they said, What one *is there* of the tribes of Israel that came not up to Mizpeh to the LORD? And, behold, there came none to the camp from Jabeshgilead to the assembly.", "9": "For the people were numbered, and, behold, *there were* none of the inhabitants of Jabeshgilead", "10": "And the congregation sent thither twelve thousand men of the valiantest, and commanded them, saying, Go and smite the inhabitants of Jabeshgilead with the edge of the sword, with the women and the children.", "11": "And this *is* the thing that ye shall do, Ye shall utterly destroy every male, and every woman that hath lain by man.", "12": "And they found among the inhabitants of Jabeshgilead four hundred young virgins, that had known no man by lying with any male: and they brought them unto the camp to Shiloh, which *is* in the land of Canaan.", "13": "And the whole congregation sent *some* to speak to the children of Benjamin that *were* in the rock Rimmon, and to call peaceably", "14": "And Benjamin came again at that time; and they gave them wives which they had saved alive of the women of Jabeshgilead: and yet so they sufficed", "15": "And the people repented them for Benjamin, because that the LORD had made a breach in the tribes of Israel.", "16": "Then the elders of the congregation said, How shall we do for wives for them that remain, seeing the women are destroyed out of Benjamin?", "17": "And they said, *There must be* an inheritance for them that be escaped of Benjamin, that a tribe be not destroyed out of Israel.", "18": "Howbeit we may not give them wives of our daughters: for the children of Israel have sworn, saying, Cursed *be* he that giveth a wife to Benjamin.", "19": "Then they said, Behold, *there is* a feast of the LORD in Shiloh yearly *in a place* which *is* on the north side of Bethel, on the east side of the highway that goeth up from Bethel to Shechem, and on the south of Lebonah.", "20": "Therefore they commanded the children of Benjamin, saying, Go and lie in wait in the vineyards;", "21": "And see, and, behold, if the daughters of Shiloh come out to dance in dances, then come ye out of the vineyards, and catch you every man his wife of the daughters of Shiloh, and go to the land of Benjamin.", "22": "And it shall be, when their fathers or their brethren come unto us to complain, that we will say unto them, Be favourable unto them for our sakes: because we reserved not to each man his wife in the war: for ye did not give unto them at this time, *that* ye should be guilty.", "23": "And the children of Benjamin did so, and took *them* wives, according to their number, of them that danced, whom they caught: and they went and returned unto their inheritance, and repaired the cities, and dwelt", "24": "And the children of Israel departed thence at that time, every man to his tribe and to his family, and they went out from thence every man to his inheritance.", "25": "In those days *there was* no king in Israel: every man did *that which was* right in his own eyes."}}, "tsk": {"1": [{"kopje": "hadden gezworen", "refs": ["Richt 20:1", "Richt 20:8", "Richt 20:10", "Jer 4:2"]}, {"kopje": "Niemand", "refs": ["Richt 21:5", "Richt 11:30", "Richt 11:31", "1 Sam 14:24", "1 Sam 14:28", "1 Sam 14:29", "Pred 5:1", "Mark 6:23", "Hand 23:12", "Rom 10:2"]}, {"kopje": "zijn dochter", "refs": ["Ex 34:12-16", "Deut 7:2", "Deut 7:3"]}], "2": [{"kopje": "het huis", "refs": ["Richt 21:12", "Richt 20:18", "Richt 20:23", "Richt 20:26", "Joz 18:1"]}, {"kopje": "hieven", "refs": ["Richt 2:4", "Gen 27:38", "1 Sam 30:4"]}], "3": [{"kopje": "waarom is", "refs": ["Deut 29:24", "Joz 7:7-9", "Ps 74:1", "Ps 80:13", "Spr 19:3", "Jes 63:17", "Jer 12:1"]}], "4": [{"kopje": "vroeg opmaakte", "refs": ["Ps 78:34", "Ps 78:35", "Hos 5:15"]}, {"kopje": "daar een altaar bouwde", "refs": ["Richt 6:26", "Ex 20:24", "Ex 20:25", "2 Sam 24:18", "2 Sam 24:25", "1 Kon 8:64", "Hebr 13:10"]}], "5": [{"kopje": "een grote eed", "refs": ["Richt 21:1", "Richt 21:18", "Richt 5:23", "Lev 27:28", "Lev 27:29", "1 Sam 11:7", "Jer 48:10"]}], "6": [{"kopje": "het berouwde", "refs": ["Richt 21:15", "Richt 11:35", "Richt 20:23", "2 Sam 2:26", "Hos 11:8", "Luk 19:41", "Luk 19:42"]}], "7": [{"kopje": "gezworen", "refs": ["Richt 21:1", "Richt 21:18", "1 Sam 14:28", "1 Sam 14:29", "1 Sam 14:45"]}], "8": [{"kopje": "Jabes in Gilead", "refs": ["1 Sam 31:11", "1 Sam 11:1-3", "1 -woman", "kinderen": [{"label": "Young", "href": "../../torrey/w/?hl=Judg.21.21#i23535", "refs": [], "kinderen": [{"label": "Gay and merry", "href": "../../torrey/w/?hl=Judg.21.21#i23539", "refs": [{"disp": "Richt 11:34", "href": "../../richteren/11/#v34", "ref": "Richt 11:34", "svLabel": null}, {"disp": "Richt 21:21", "href": "../../richteren/21/#v21", "ref": "Richt 21:21", "svLabel": null}, {"disp": "Jer 31:13", "href": "../../jeremia/31/#v13", "ref": "Jer 31:13", "svLabel": null}, {"disp": "Zach 9:17", "href": "../../zacharia/9/#v17", "ref": "Zach 9:17", "svLabel": null}], "kinderen": []}]}]}]}, "25": {"nave": [{"topic": "Liberty", "href": "../../nave/l/#t-liberty", "kinderen": [{"label": "Political", "href": "../../nave/l/?hl=Judg.21.25#i12663", "refs": [{"disp": "Richt 17:6", "href": "../../richteren/17/#v6", "ref": "Richt 17:6", "svLabel": null}, {"disp": "Richt 21:25", "href": "../../richteren/21/#v25", "ref": "Richt 21:25", "svLabel": null}, {"disp": "Hand 22:28", "href": "../../handelingen/22/#v28", "ref": "Hand 22:28", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Judges, Extraordinary", "href": "../../torrey/j/#t-judges-extraordinary", "kinderen": [{"label": "Not without intermission", "href": "../../torrey/j/?hl=Judg.21.25#i10664", "refs": [{"disp": "Richt 17:6", "href": "../../richteren/17/#v6", "ref": "Richt 17:6", "svLabel": null}, {"disp": "Richt 18:1", "href": "../../richteren/18/#v1", "ref": "Richt 18:1", "svLabel": null}, {"disp": "Richt 19:1", "href": "../../richteren/19/#v1", "ref": "Richt 19:1", "svLabel": null}, {"disp": "Richt 21:25", "href": "../../richteren/21/#v25", "ref": "Richt 21:25", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "Richt 20:8": "Toen maakte heel het volk zich op, als één man, en zei: Wij zullen niet gaan, ieder naar zijn tent, en niet wijken, ieder naar zijn huis.", "1 Sam 11:1-3": "Toen trok Nahas, de Ammoniet, op en belegerde Jabes in Gilead. En alle mannen van Jabes zeiden tegen Nahas: Sluit een verbond met ons, en wij zullen u dienen. Maar Nahas, de Ammoniet, zei tegen hen: Op deze voorwaarde zal ik een verbond met u sluiten, dat ik bij u allen het rechteroog uitsteek, en dat ik deze schande op heel Israël leg. Toen zeiden de oudsten van Jabes tegen hem: Geef ons zeven dagen de tijd, zodat wij boden kunnen sturen naar alle grensgebieden van Israël; is er dan niemand die ons verlost, dan zullen wij naar u uitgaan.", "Richt 6:26": "En bouw voor de HEERE, uw God, een altaar op de top van deze rots, op een geschikte plaats; en neem de tweede stier, en offer een brandoffer met het hout van het gewijde bos, dat u zult hebben omgehakt.", "Richt 7:25": "En zij vingen twee vorsten van de Midianieten, Oreb en Zeëb, en doodden Oreb op de rots Oreb, en Zeëb doodden zij bij de perskuip van Zeëb, en achtervolgden de Midianieten; en zij brachten de hoofden van Oreb en Zeëb naar Gideon, aan de overkant van de Jordaan.", "2 Kron 22:12": "En hij was bij hen verborgen in het huis van God, zes jaar; en Athalia regeerde over het land.", "Matt 12:4": "Hoe hij het huis van God binnenging, en de toonbroden at, die hij niet mocht eten, en ook zij die bij hem waren niet, maar alleen de priesters?", "1 Sam 2:14": "En sloeg die in de teil, of in de ketel, of in de pan, of in de pot; al wat de vork optrok, dat nam de priester voor zich. Zo deden zij aan alle Israëlieten die in Silo kwamen.", "Num 31:17": "Nu dan, dood alles wat mannelijk is onder de kinderen; en dood elke vrouw die door gemeenschap met een man, een man heeft gekend.", "Luk 17:25": "Maar eerst moet Hij veel lijden, en verworpen worden door dit geslacht.", "Gen 27:38": "En Ezau zei tegen zijn vader: Hebt u maar deze ene zegen, mijn vader? Zegen mij, ook mij, mijn vader! En Ezau verhief zijn stem, en weende.", "Deut 16:13": "Het feest van de loofhutten zult u zeven dagen houden, als u van uw dorsvloer en van uw wijnpers ingezameld hebt.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Ex 32:19": "En het gebeurde, toen hij bij het kamp kwam en het kalf en de reidansen zag, dat de toorn van Mozes ontstak, en dat hij de tafelen uit zijn handen wierp en ze onder aan de berg verbrak.", "Hand 23:12": "En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben.", "Deut 31:9": "En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël.", "Lev 23:2": "Spreek tot de kinderen van Israël, en zeg tegen hen: De vaste feesttijden van de HEERE, die u uitroepen zult, zullen heilige samenkomsten zijn; deze zijn Mijn vaste feesttijden.", "Richt 21:2-4": "Zo kwam het volk naar het huis van God, en zij bleven daar tot de avond, voor het aangezicht van God; en zij hieven hun stem op en weenden met groot geween. En zij zeiden: O HEERE, God van Israël! Waarom is dit gebeurd in Israël, dat er vandaag één stam van Israël gemist wordt? En het gebeurde de volgende dag, dat het volk zich vroeg opmaakte en daar een altaar bouwde; en zij offerden brandoffers en dankoffers.", "Neh 13:11": "En ik twistte met de overheden, en zei: Waarom is het huis van God verlaten? Doch ik verzamelde hen, en herstelde ze op hun plaats.", "Lev 23:6": "En op de vijftiende dag van diezelfde maand is het feest van de ongezuurde broden van de HEERE; zeven dagen zult u ongezuurde broden eten.", "Joz 7:24": "Toen nam Jozua, en heel Israël met hem, Achan, de zoon van Zerah, en het zilver, en het sierlijke overkleed, en de gouden staaf, en zijn zonen, en zijn dochters, en zijn ossen, en zijn ezels, en zijn vee, en zijn tent, en alles wat hij had; en zij brachten ze naar het dal Achor.", "Richt 21:16-25": "En de oudsten van de vergadering zeiden: Wat zullen wij doen, als het gaat om vrouwen voor hen die overgebleven zijn? Want de vrouwen zijn uit Benjamin uitgeroeid. Verder zeiden zij: De erfenis van hen die ontkomen zijn, is van Benjamin, en er moet geen stam uit Israël weggevaagd worden. Maar wij zullen hun geen vrouwen van onze dochters kunnen geven; want de kinderen van Israël hebben gezworen: Vervloekt is hij die aan de Benjaminieten een vrouw geeft!", "Richt 20:45": "Toen keerden zij zich om, en vluchtten naar de woestijn, tot de rots van Rimmon; maar zij deden een nalezing onder hen op de wegen, van vijfduizend man; verder kleefden zij hen achteraan tot aan Gideom, en sloegen van hen tweeduizend man.", "Zach 9:17": "Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "Ezra 5:8": "De koning zij bekend, dat wij naar het landschap Juda getrokken zijn, naar het huis van de grote God, dat gebouwd wordt met grote stenen, en het hout wordt gelegd in de wanden; en dat werk wordt snel gedaan en gaat voorspoedig door hun handen voort.", "Micha 4:2": "En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Luk 10:5": "En in welk huis u ook binnengaat, zeg eerst: Vrede zij dit huis!", "Joz 10:15-40": "Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal. Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda.", "Richt 21:5-12": "En de kinderen van Israël zeiden: Wie is er, van al de stammen van Israël, die niet is opgekomen in de vergadering tot de HEERE? Want er was een grote eed gezworen aangaande hem die niet opkwam tot de HEERE te Mizpa: Hij zal zeker gedood worden. En het berouwde de kinderen van Israël over Benjamin, hun broeder; en zij zeiden: Vandaag is één stam van Israël afgesneden. Wat zullen wij doen, als het gaat om vrouwen voor hen die overgebleven zijn? Want wij hebben bij de HEERE gezworen dat wij hun geen van onze dochters tot vrouwen zullen geven.", "Ps 84:11": "Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.", "Deut 21:10": "Wanneer u uittrekt ten strijde tegen uw vijanden, en de HEERE, uw God, hen in uw hand gegeven heeft, zodat u hun gevangenen gevankelijk wegvoert;", "2 Sam 6:14-16": "En David huppelde met alle macht voor het aangezicht van de HEERE; en David was omgord met een linnen lijfrok. Zo brachten David en het hele huis van Israël de ark van de HEERE op, met gejuich en met geluid van bazuinen. En het gebeurde, toen de ark van de HEERE in de stad van David kwam, dat Michal, de dochter van Saul, door het venster uitkeek. Toen zij nu koning David zag, springend en huppelend voor het aangezicht van de HEERE, verachtte zij hem in haar hart.", "1 Sam 14:29": "Toen zei Jonathan: Mijn vader heeft het land in moeilijkheden gebracht; kijk toch hoe helder mijn ogen zijn geworden, omdat ik een beetje van deze honing geproefd heb.", "Ex 23:14-16": "Drie keer per jaar zult u Mij feest houden. Het feest van de ongezuurde broden zult u houden; zeven dagen zult u ongezuurde broden eten (zoals Ik u geboden heb), op de vastgestelde tijd in de maand Abib, want in die maand bent u uit Egypte getrokken; en men zal niet met lege handen voor Mijn aangezicht verschijnen. En het feest van de oogst, van de eerste vruchten van uw arbeid, die u op het veld gezaaid zult hebben. En het feest van de inzameling, aan het einde van het jaar, wanneer u de opbrengst van uw arbeid van het veld ingezameld zult hebben.", "Pred 4:17": "Let op uw voet, als u naar het huis van God gaat, en wees liever bereid om te horen, dan om het offer van dwazen te geven; want zij weten niet dat zij kwaad doen.", "2 Sam 2:5": "Toen zond David boden naar de mannen van Jabes in Gilead, en hij zei tegen hen: Gezegend bent u door de HEERE, dat u deze weldadigheid gedaan hebt aan uw heer, aan Saul, en hem begraven hebt.", "Ex 17:6": "Zie, Ik zal daar voor u op de rots bij Horeb staan; en u zult op de rots slaan, dan zal er water uit komen, zodat het volk kan drinken. Mozes deed dat voor de ogen van de oudsten van Israël.", "1 Sam 4:4": "Het volk zond dan naar Silo, en men bracht vandaar de ark van het verbond van de HEERE van de heerscharen, die tussen de cherubs† woont; en de twee zonen van Eli, Hofni en Pinehas, waren daar bij de ark van het verbond van God.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Richt 8:21": "Toen zeiden Zebah en Tsalmuna: Sta zelf op en val ons aan, want zoals de man is, zo is zijn kracht. Toen stond Gideon op en doodde Zebah en Tsalmuna, en nam de maantjes die aan de halzen van hun kamelen zaten.", "Joz 22:12": "Toen de kinderen van Israël dit hoorden, verzamelde de hele vergadering van de kinderen van Israël zich te Silo, om tegen hen op te trekken met een leger.", "Joz 20:7": "Toen wijdden zij Kedes in Galilea, op het gebergte van Naftali, en Sichem op het gebergte van Efraïm, en Kirjath-arba, dat is Hebron, op het gebergte van Juda.", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "Richt 21:21-23": "En let erop, en zie, als de dochters van Silo uitgegaan zijn om in reidansen te dansen, dan komt u tevoorschijn uit de wijngaarden, en schaakt u ieder zijn vrouw, uit de dochters van Silo; en gaat heen naar het land van Benjamin. En het zal gebeuren, wanneer hun vaders of hun broeders komen om bij ons te klagen, dat wij tegen hen zullen zeggen: Weest hun om onzentwil genadig, omdat wij niet voor ieder van hen een vrouw genomen hebben in deze oorlog; want u hebt ze hun niet gegeven, zodat u nu niet schuldig zou zijn. En de kinderen van Benjamin deden zo, en voerden naar hun aantal vrouwen weg van de danseressen die zij roofden, en zij trokken heen, en keerden terug naar hun erfenis, en herbouwden de steden, en woonden daarin.", "Joh 5:1": "Na deze dingen was er een feest van de Joden, en Jezus ging op naar Jeruzalem.", "Deut 5:23": "En het gebeurde, toen u die stem uit het midden van de duisternis hoorde, terwijl de berg van vuur brandde, dat u tot mij naderde, alle hoofden van uw stammen, en uw oudsten,", "Deut 20:13": "En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard;", "Num 31:9-20": "Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit. Verder verbrandden zij al hun steden met hun woonplaatsen, en al hun burchten, met vuur. En zij namen alle buit en alle roof, van mensen en van beesten.", "Joz 7:7-9": "En Jozua zei: Ach, Heere HEERE! Waarom hebt U dit volk ooit de Jordaan laten oversteken, om ons te geven in de hand van de Amorieten, om ons te vernietigen? Was het toch maar zo dat wij tevreden waren geweest en gebleven waren aan de overkant van de Jordaan! Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd? Als de Kanaänieten en alle inwoners van het land dit horen, zullen zij ons omsingelen, en onze naam van de aarde uitroeien; wat zult U dan doen voor Uw grote Naam?", "Richt 20:48": "En de mannen van Israël keerden terug tot de kinderen van Benjamin, en sloegen hen met de scherpte van het zwaard, van de hele stad tot de dieren toe, ja, al wat gevonden werd; ook staken zij alle steden die gevonden werden in brand.", "Luk 15:23-25": "en breng het gemeste kalf, en slacht het; en laten wij eten en vrolijk zijn. Want deze zoon van mij was dood, en is weer levend geworden; en hij was verloren, en is gevonden! En zij begonnen vrolijk te zijn. En zijn oudste zoon was op het veld; en toen hij kwam en het huis naderde, hoorde hij het gezang en het gedans,", "Lev 23:4": "Deze zijn de vaste feesttijden van de HEERE, de heilige samenkomsten, die u uitroepen zult op hun vastgestelde tijd.", "1 Sam 31:11-13": "Toen de inwoners van Jabes in Gilead hoorden wat de Filistijnen met Saul gedaan hadden, maakten alle strijdbare mannen zich op, en gingen de hele nacht, en zij namen het lichaam van Saul en de lichamen van zijn zonen van de muur bij Beth-San; en zij kwamen bij Jabes en verbrandden ze daar. En zij namen hun beenderen en begroeven ze onder het geboomte bij Jabes; en zij vastten zeven dagen.", "Jes 30:13": "Daarom zal deze misdaad voor u zijn als een vallende scheur, uitwaarts gebogen in een hoge muur, waarvan de breuk snel, in een ogenblik, komen zal.", "Matt 10:17": "Maar wees op uw hoede voor de mensen; want zij zullen u overleveren aan de raadsvergaderingen, en zij zullen u geselen in hun synagogen;", "Lev 27:28": "Toch, niets wat verboden is, dat iemand aan de HEERE verboden heeft, van alles wat hij heeft, van een mens, of van een dier, of van de akker van zijn eigendom, zal verkocht of afgekocht worden; alles wat verboden is, zal voor de HEERE allerheiligst zijn.", "1 Sam 21:11": "Doch de knechten van Achis zeiden tegen hem: Is dit niet David, de koning van het land? Zong men niet van hem in de reidansen, en zei: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden?", "Gen 7:13": "Op diezelfde dag ging Noach, en Sem, en Cham, en Jafeth, de zonen van Noach, evenals ook de vrouw van Noach, en de drie vrouwen van zijn zonen met hem in de ark;", "Richt 20:47": "Doch zeshonderd man keerden zich om, en vluchtten naar de woestijn, tot de rots van Rimmon, en bleven bij de rots van Rimmon, vier maanden.", "Deut 12:8": "U zult niet doen naar alles wat wij hier vandaag doen, ieder al wat in zijn ogen recht is.", "Klaagl 5:15": "De vreugde van ons hart houdt op, onze dans is in treurigheid veranderd.", "Ps 78:60": "Daarom verliet Hij de tabernakel te Silo, de tent, die Hij tot een woning gesteld had onder de mensen.", "Zach 7:2": "Toen men naar het huis van God had gezonden Sarezer en Regem-Melech en hun mannen, om het aangezicht van de HEERE te smeken,", "Matt 11:17": "En zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben u klaagliederen gezongen, en u hebt niet geweend.", "Joz 7:6": "Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd.", "Jer 4:2": "Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.", "1 Sam 11:7": "En hij nam een paar runderen en hakte ze in stukken, en stuurde die door de hand van de boden naar alle grensgebieden van Israël, en zei: Wie niet zelf uittrekt achter Saul en achter Samuël aan, met zijn runderen zal hetzelfde gedaan worden. Toen viel de vreze van de HEERE op het volk, en zij gingen uit als één man.", "Luk 19:41": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,", "1 Kon 3:15": "En Salomo werd wakker, en zie, het was een droom. En hij kwam naar Jeruzalem en stond voor de ark van het verbond van de HEERE, en offerde brandoffers en bereidde dankoffers, en maakte een maaltijd voor al zijn knechten.", "2 Kron 36:19": "En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Ps 78:35": "En zij dachten eraan, dat God hun Rotssteen was, en God, de Allerhoogste, hun Verlosser.", "Richt 20:23": "En de kinderen van Israël trokken op, en weenden voor het aangezicht van de HEERE tot de avond, en vroegen de HEERE en zeiden: Zal ik weer naderen ten strijde tegen de kinderen van Benjamin, mijn broeder? En de HEERE zei: Trek tegen hem op.", "1 Sam 1:9": "Toen stond Hanna op, nadat men in Silo gegeten en gedronken had. En Eli, de priester, zat op een stoel bij een post van de tempel van de HEERE.", "Richt 20:18": "En de kinderen van Israël maakten zich op, en trokken op naar het huis van God, en vroegen God om raad, en zeiden: Wie zal onder ons als eerste optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zei: Juda als eerste.", "Micha 2:1": "Wee hun die onrecht bedenken en kwaad beramen op hun slaapplaatsen; in het licht van de morgen doen zij het, omdat het in de macht van hun hand is.", "Richt 11:30": "En Jeftha beloofde de HEERE een gelofte, en zei: Als U de kinderen van Ammon werkelijk in mijn hand geeft,", "Richt 21:1-23": "De mannen van Israël hadden in Mizpa gezworen: Niemand van ons zal zijn dochter aan de Benjaminieten tot vrouw geven. Zo kwam het volk naar het huis van God, en zij bleven daar tot de avond, voor het aangezicht van God; en zij hieven hun stem op en weenden met groot geween. En zij zeiden: O HEERE, God van Israël! Waarom is dit gebeurd in Israël, dat er vandaag één stam van Israël gemist wordt?", "1 Kron 24:5": "En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.", "Gen 28:22": "En deze steen, die ik als opgericht teken gezet heb, zal een huis van God zijn; en van alles wat U mij geven zult, zal ik U zeker de tienden geven!", "1 Sam 1:3": "Deze man ging elk jaar op uit zijn stad om te aanbidden en om te offeren aan de HEERE van de heerscharen te Silo; en daar waren priesters van de HEERE, Hofni en Pinehas, de twee zonen van Eli.", "1 Sam 30:4": "Toen verhieven David en het volk dat bij hem was hun stem, en huilden, tot er geen kracht meer in hen was om te huilen.", "Num 16:25": "Toen stond Mozes op, en ging naar Dathan en Abiram; en achter hem gingen de oudsten van Israël.", "Richt 2:4": "En het gebeurde, toen de Engel van de HEERE deze woorden tot alle kinderen van Israël gesproken had, dat het volk zijn stem verhief en weende.", "Lev 23:10": "Spreek tot de kinderen van Israël, en zeg tegen hen: Als u in het land zult gekomen zijn, dat Ik u geven zal, en u uw oogst zult inoogsten, dan zult u een schoof van de eerstelingen van uw oogst tot de priester brengen.", "Joz 9:23": "Nu dan, vervloekt bent u! en onder u zullen altijd knechten blijven, houthakkers en waterputters voor het huis van mijn God.", "Richt 20:1": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa.", "Ps 55:15": "Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Joz 22:9": "Zo keerden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse terug, en trokken weg van de kinderen van Israël, van Silo, dat in het land Kanaän is, om te gaan naar het land van Gilead, naar het land van hun bezitting, waarin zij bezitters gemaakt waren, naar het bevel van de HEERE, door de dienst van Mozes.", "1 Sam 18:6": "Het gebeurde nu, toen zij kwamen, en David terugkeerde van het verslaan van de Filistijn, dat de vrouwen uit al de steden van Israël uitgingen, met gezang en reidansen, koning Saul tegemoet, met tamboerijnen, met vreugde en met muziekinstrumenten.", "Richt 20:31": "Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.", "Mark 10:6-8": "Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt. Daarom zal een man zijn vader en zijn moeder verlaten, en zich aan zijn vrouw hechten; en die twee zullen tot één vlees zijn, zodat zij niet meer twee zijn, maar één vlees.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Ex 20:24": "Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen.", "Jer 7:12": "Want ga nu naar Mijn plaats die te Silo was, waar Ik Mijn Naam in het begin had laten wonen; en zie wat Ik daaraan gedaan heb vanwege de slechtheid van Mijn volk Israël.", "Ex 17:5": "Toen zei de HEERE tegen Mozes: Ga voor het volk uit, en neem enkele van de oudsten van Israël met u mee; en neem uw staf, waarmee u de rivier sloeg, in uw hand, en ga op weg.", "Ex 4:29-31": "Toen ging Mozes en Aäron, en zij verzamelden al de oudsten van de kinderen van Israël. En Aäron sprak al de woorden, die de HEERE tot Mozes gesproken had; en hij deed de tekenen voor de ogen van het volk. En het volk geloofde, en zij hoorden, dat de HEERE de kinderen van Israël bezocht had, en dat Hij hun verdrukking gezien had, en zij bogen hun hoofden, en aanbaden.", "Ef 2:17": "En toen Hij kwam, heeft Hij door het Evangelie vrede verkondigd aan u, die ver weg was, en aan hen die nabij waren.", "Num 11:30": "Daarna verzamelde Mozes zich met het leger, hij en de oudsten van Israël.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Ex 34:12-16": "Wacht u ervoor dat u toch geen verbond maakt met de inwoner van het land, waarin u komen zult; dat hij misschien niet tot een valstrik wordt in uw midden. Maar hun altaren zult u omverwerpen, en hun opgerichte beelden zult u verbreken, en hun gewijde palen zult u afhouwen. (Want u zult zich niet buigen voor een andere god; want de Naam van de HEERE is IJveraar! Een ijverig God is Hij!)", "Joh 4:3-5": "verliet Hij Judea, en ging weer naar Galilea. En Hij moest door Samaria gaan. Hij kwam dan in een stad van Samaria, genaamd Sichar, dicht bij het stuk land dat Jakob aan zijn zoon Jozef gaf.", "Joz 15:32": "en Lebaoth, en Silhim, en Aïn, en Rimmon. Al deze steden zijn negenentwintig, met haar dorpen.", "1 Sam 14:24": "En de mannen van Israël werden uitgeput op die dag, want Saul had het volk bezworen en gezegd: Vervloekt is de man die voedsel eet vóór de avond, totdat ik mij op mijn vijanden gewroken heb! Daarom proefde heel het volk geen voedsel.", "1 Sam 15:3": "Ga nu heen, en sla Amalek, en verban alles wat hij heeft, en verschoon hem niet; maar dood van de man af tot de vrouw toe, van de kinderen tot de zuigelingen, van de ossen tot de schapen, van de kamelen tot de ezels toe.", "Spr 3:5": "Vertrouw op de HEERE met heel uw hart, en steun op uw eigen verstand niet.", "2 Kron 33:7": "Hij stelde ook de gelijkenis van een gesneden beeld, dat hij gemaakt had, in het huis van God, waarvan God gezegd had tot David en tot zijn zoon Salomo: In dit huis, en te Jeruzalem, dat Ik uit alle stammen van Israël verkozen heb, zal Ik Mijn Naam zetten tot in eeuwigheid.", "2 Sam 24:18": "En Gad kwam diezelfde dag bij David, en zei tegen hem: Ga op, richt de HEERE een altaar op, op de dorsvloer van Arauna, de Jebusiet.", "Deut 16:10": "Daarna zult u de HEERE, uw God, het feest van de weken houden; het zal een vrijwillige schatting van uw hand zijn, die u geven zult, naarmate de HEERE, uw God, u gezegend zal hebben.", "Pred 3:4": "Een tijd om te huilen, en een tijd om te lachen; een tijd om te rouwen, en een tijd om op te springen;", "Matt 14:7": "Daarom beloofde hij haar met een eed te geven wat zij ook zou vragen.", "Num 11:16-18": "En de HEERE zei tegen Mozes: Verzamel voor Mij zeventig mannen uit de oudsten van Israël, van wie u weet dat zij de oudsten van het volk en zijn opzichters zijn; en u zult hen brengen naar de tent van de samenkomst, en zij zullen zich daar bij u opstellen. Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt. En tegen het volk zult u zeggen: Heilig u tegen morgen, en u zult vlees eten; want u hebt voor de oren van de HEERE geweend en gezegd: Wie zal ons vlees te eten geven? Want het ging ons goed in Egypte! Daarom zal de HEERE u vlees geven, en u zult eten.", "Joz 8:33": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen.", "1 Kor 7:2": "Maar om de hoererijen te vermijden zal ieder man zijn eigen vrouw hebben, en iedere vrouw zal haar eigen man hebben.", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "Joz 23:2": "Zo riep Jozua heel Israël, hun oudsten, en hun hoofden, en hun rechters, en hun opzichters, en hij zei tegen hen: Ik ben oud geworden, en wel bedaagd;", "Hand 5:21-41": "Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen. Maar toen de dienaars daar kwamen, vonden zij hen niet in de gevangenis, maar keerden terug, en berichtten dit, en zeiden: Wij vonden de kerker met alle zorgvuldigheid gesloten, en de wachters buiten staand voor de deuren; maar toen wij die geopend hadden, vonden wij niemand daarbinnen.", "Richt 19:1": "Het gebeurde ook in die dagen, toen er geen koning in Israël was, dat er een Levitisch man was, die als vreemdeling verkeerde aan de zijden van het gebergte van Efraïm, die zich een vrouw, een bijvrouw, nam van Bethlehem-Juda.", "Joz 7:10-26": "Toen zei de HEERE tegen Jozua: Sta op; waarom ligt u zo neer op uw gezicht? Israël heeft gezondigd; en zij hebben ook Mijn verbond, dat Ik hun geboden had, overtreden; en ook hebben zij van het verbannene genomen, en ook gestolen, en ook gelogen, en hebben het ook onder hun eigen spullen gelegd. Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt.", "Joz 18:1-10": "En de hele gemeenschap van de kinderen van Israël verzamelde zich te Silo, en zij richtten daar de tent van de samenkomst op, nadat het land aan hen onderworpen was. En er bleven over onder de kinderen van Israël, aan wie zij hun erfdeel nog niet uitgedeeld hadden, zeven stammen. En Jozua zei tegen de kinderen van Israël: Hoe lang houdt u zich zo slap, om verder te trekken, om het land in bezit te nemen, dat de HEERE, de God van uw vaderen, u gegeven heeft?", "Richt 20:27": "En de kinderen van Israël vroegen de HEERE, want daar was de ark van het verbond van God in die dagen.", "Hand 22:28": "En de leider antwoordde: Ik heb dit burgerrecht voor een grote som geld verkregen. En Paulus zei: Maar ik ben zelfs als burger geboren.", "1 Sam 31:11": "Toen de inwoners van Jabes in Gilead hoorden wat de Filistijnen met Saul gedaan hadden,", "Deut 29:24": "En alle volken zullen zeggen: Waarom heeft de HEERE dit land zo aangedaan? Wat betekent de gloed van deze grote toorn?", "Joz 24:24": "En het volk zei tegen Jozua: Wij zullen de HEERE, onze God, dienen, en wij zullen Zijn stem gehoorzamen.", "Joz 23:6": "Zo weest zeer sterk, om te bewaren en om te doen alles, wat geschreven is in het wetboek van Mozes; opdat u daarvan niet afwijkt naar rechts noch naar links;", "Deut 20:10": "Wanneer u nadert tot een stad om tegen haar te strijden, dan zult u haar vrede toeroepen.", "Ex 19:7": "En Mozes kwam en riep de oudsten van het volk, en legde hun al deze woorden voor, die de HEERE hem geboden had.", "Spr 19:3": "De dwaasheid van de mens verdraait zijn weg; en zijn hart is boos op de HEERE.", "2 Sam 6:14": "En David huppelde met alle macht voor het aangezicht van de HEERE; en David was omgord met een linnen lijfrok.", "1 Sam 15:33": "Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.", "Ezra 5:15": "En hij zei tegen hem: Neem deze vaten, ga ze afvoeren naar de tempel die te Jeruzalem is, en laat het huis van God gebouwd worden op zijn plaats.", "Jes 58:12": "En zij die uit u voortkomen, zullen de oude verwoeste plaatsen bouwen; de fundamenten, van geslacht tot geslacht verwoest, zult u oprichten; en u zult genoemd worden: Die de bressen dichtmuurt, die de paden weer opmaakt, om te bewonen.", "Deut 29:10-15": "U staat heden allen voor het aangezicht van de HEERE, uw God: uw hoofden van uw stammen, uw oudsten, en uw opzichters, alle mannen van Israël; Uw kinderen, uw vrouwen, en uw vreemdeling, die in het midden van uw kamp is, van uw houthakker tot uw waterputter toe; Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;", "Ps 150:4": "Loof Hem met de trommel en fluit; loof Hem met snarenspel en orgel!", "Num 10:10": "Ook op de dag van uw vrolijkheid, en op uw vastgestelde hoogtijden, en aan de begin van uw maanden, zult u ook met de trompetten blazen over uw brandoffers en over uw dankoffers; en zij zullen u ter gedachtenis zijn voor het aangezicht van uw God; Ik ben de HEERE, uw God!", "Num 26:55": "Het land zal echter door het lot verdeeld worden; naar de namen van de stammen van hun vaderen zullen zij erven.", "Jer 31:4": "Ik zal u weer bouwen, en u zult gebouwd worden, o jonkvrouw Israël! U zult weer versierd zijn met uw tamboerijnen, en uitgaan met de rei van de spelende mensen.", "2 Sam 2:26": "Toen riep Abner naar Joab en zei: Zal het zwaard dan eeuwig verslinden? Weet u niet, dat het uiteindelijk bitterheid zal zijn? En hoe lang zal het duren voordat u het volk zegt dat zij terugkeren van hun broeders te vervolgen?", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Ps 149:3": "Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "Ex 3:18": "En zij zullen naar uw stem luisteren; en u zult gaan, u en de oudsten van Israël, naar de koning van Egypte, en u zult tegen hem zeggen: De HEERE, de God van de Hebreeën, is ons ontmoet; zo laat ons nu toch gaan, drie dagreizen ver de woestijn in, opdat wij de HEERE, onze God, offeren!", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Deut 1:13-15": "Neem voor u wijze, verstandige en ervaren mannen, uit uw stammen, zodat ik hen tot uw hoofden stel. Toen antwoordde u mij, en zei: Dit woord dat u gesproken hebt, is goed om te doen. Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen.", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "Joz 8:32": "Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël.", "Joz 19:51": "Dit zijn de erfdelen die Eleazar, de priester, en Jozua, de zoon van Nun, en de hoofden van de vaders van de stammen van de kinderen van Israël door het lot erfelijk uitdeelden te Silo, voor het aangezicht van de HEERE, aan de deur van de tent van de samenkomst. Zo maakten zij een einde aan het uitdelen van het land.", "Joz 21:21": "En zij gaven hun Sichem, een vrijstad voor de doodslager, en haar voorsteden, op het gebergte van Efraïm, en Gezer en haar voorsteden;", "Jer 7:14": "daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb.", "1 Sam 30:16": "En hij leidde hem naar beneden, en zie, zij lagen verspreid over het hele land, etend, en drinkend, en dansend, vanwege al de grote buit die zij genomen hadden uit het land van de Filistijnen, en uit het land van Juda.", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Job 21:11": "Hun jonge kinderen zenden zij uit als een kudde, en hun kinderen huppelen.", "Richt 21:8-15": "En zij zeiden: Is er iemand van de stammen van Israël, die niet is opgekomen tot de HEERE te Mizpa? En zie, van Jabes in Gilead was niemand opgekomen naar het leger, naar de gemeente. Want het volk werd geteld, en zie, er was niemand van de inwoners van Jabes in Gilead. Toen zond de vergadering daarheen twaalfduizend man, van de strijdbaarste; en zij geboden hun: Trekt heen, en slaat met de scherpte van het zwaard de inwoners van Jabes in Gilead, met de vrouwen en de kinderen.", "Ex 19:8": "Toen antwoordde al het volk gezamenlijk en zei: Al wat de HEERE gesproken heeft, zullen wij doen! En Mozes bracht de woorden van het volk terug naar de HEERE.", "Joz 24:1": "Daarna verzamelde Jozua al de stammen van Israël te Sichem, en hij riep de oudsten van Israël, en hun hoofden, en hun rechters, en hun opzichters; en zij stelden zich voor het aangezicht van God.", "Richt 11:35": "En het gebeurde, toen hij haar zag, dat hij zijn kleren scheurde, en zei: Ach, mijn dochter! U hebt mij helemaal terneergeslagen, en u bent onder degenen die mij in het ongeluk storten; want ik heb mijn mond opengedaan tegen de HEERE, en ik kan niet terug.", "Ex 12:21": "Mozes riep dan alle oudsten van Israël, en zei tegen hen: Kiest en neemt lammeren voor uw huisgezinnen, en slacht het pascha.", "2 Sam 24:25": "En David bouwde daar de HEERE een altaar, en offerde brandoffers en dankoffers. Zo werd de HEERE verbeden voor het land, en deze plaag werd van over Israël opgehouden.", "Hos 9:8": "De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.", "Joz 8:10": "En Jozua maakte zich 's morgens vroeg op, en hij monsterde het volk; en hij trok op, hij en de oudsten van Israël, voor het volk uit, naar Ai.", "Neh 5:7": "En mijn hart beraadslaagde in mij; daarna berispte ik de edelen en de overheden, en zei tegen hen: U vordert een last, ieder van zijn broeder. Vervolgens riep ik een grote vergadering tegen hen bijeen.", "Richt 21:5-11": "En de kinderen van Israël zeiden: Wie is er, van al de stammen van Israël, die niet is opgekomen in de vergadering tot de HEERE? Want er was een grote eed gezworen aangaande hem die niet opkwam tot de HEERE te Mizpa: Hij zal zeker gedood worden. En het berouwde de kinderen van Israël over Benjamin, hun broeder; en zij zeiden: Vandaag is één stam van Israël afgesneden. Wat zullen wij doen, als het gaat om vrouwen voor hen die overgebleven zijn? Want wij hebben bij de HEERE gezworen dat wij hun geen van onze dochters tot vrouwen zullen geven.", "2 Sam 6:21": "Maar David zei tegen Michal: Voor het aangezicht van de HEERE, Die mij verkozen heeft boven uw vader en boven zijn hele huis, om mij aan te stellen tot een voorganger over het volk van de HEERE, over Israël; ja, ik zal spelen voor het aangezicht van de HEERE.", "Richt 11:31": "dan zal het zo zijn, dat wat uit de deur van mijn huis mij tegemoet komt, wanneer ik in vrede terugkeer van de kinderen van Ammon, dat zal van de HEERE zijn, en ik zal het offeren als brandoffer.", "1 Kron 13:11": "En David ontstak, omdat de HEERE een scheur gescheurd had aan Uza; daarom noemde hij die plaats Perez-uza, tot op deze dag.", "Num 36:7": "Zo zal de erfenis van de kinderen van Israël niet overgaan van stam naar stam; want de kinderen van Israël zullen vasthouden, ieder aan de erfenis van de stam van zijn vaderen.", "Richt 11:34": "Toen Jeftha nu bij Mizpa bij zijn huis kwam, zie, zo kwam zijn dochter hem tegemoet, met trommels en met reidansen. Zij was zijn enige kind; hij had verder geen zoon of dochter.", "Ex 18:12": "Toen nam Jethro, de schoonvader van Mozes, voor God een brandoffer en slachtoffers; en Aäron kwam, en al de leiders van Israël, om brood te eten met de schoonvader van Mozes, voor het aangezicht van God.", "Ps 30:12": "U hebt mijn weeklagen veranderd in een reidans; U hebt mijn rouwkleed losgemaakt, en mij met blijdschap omgord;", "1 Sam 14:45": "Maar het volk zei tegen Saul: Zou Jonathan sterven, die deze grote verlossing in Israël teweeggebracht heeft? Dat zij verre! Zo waarachtig als de HEERE leeft: geen haar van zijn hoofd zal op de aarde vallen, want hij heeft dit vandaag met God gedaan. Zo redde het volk Jonathan, zodat hij niet stierf.", "Richt 5:23": "Vloek Meroz, zegt de Engel van de HEERE, vloek haar inwoners voortdurend; omdat zij niet gekomen zijn tot de hulp van de HEERE, tot de hulp van de HEERE, met de helden.", "Ezra 9:5": "En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God;", "Deut 23:7": "De Edomiet zult u voor geen gruwel houden, want hij is uw broeder; de Egyptenaar zult u voor geen gruwel houden, want u bent een vreemdeling geweest in zijn land.", "1 Sam 14:28": "Toen antwoordde iemand uit het volk en zei: Uw vader heeft het volk streng bezworen en gezegd: Vervloekt is de man die vandaag brood eet! Daarom bezwijkt het volk.", "Richt 20:10": "En wij zullen tien mannen nemen van honderd, van alle stammen van Israël, en honderd van duizend, en duizend van tienduizend, om proviand te nemen voor het volk, zodat zij, wanneer zij komen te Gibea-van-Benjamin, met haar doen naar al de dwaasheid die zij in Israël gedaan heeft.", "Deut 7:3": "U zult zich ook niet met hen verzwageren; uw dochters zult u niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen.", "Filem 1:9-12": "Vraag ik u nochtans liever door de liefde, aangezien ik zo iemand ben, namelijk Paulus, een oud man, en nu ook een gevangene van Jezus Christus. Ik vraag u dan voor mijn zoon, aan wie ik in mijn boeien het leven gaf, namelijk Onesimus; Die eertijds voor u onnut was, maar nu voor u en mij zeer nuttig; hem heb ik teruggezonden.", "Micha 2:2": "En zij begeren akkers en roven ze, en huizen, en nemen ze weg; zo doen zij de man en zijn huis geweld aan, ja, ieder en zijn erfenis.", "Richt 20:26": "Toen trokken alle kinderen van Israël en heel het volk op, en kwamen bij het huis van God, en weenden, en bleven daar voor het aangezicht van de HEERE, en vastten die dag tot de avond; en zij offerden brandoffers en dankoffers voor het aangezicht van de HEERE.", "Joz 8:29": "En de koning van Ai hing hij aan een paal, tot de avond; en omtrent het ondergaan van de zon gebood Jozua dat men zijn dode lichaam van de paal zou afnemen; en zij wierpen het bij de ingang van de stadspoort, en richtten daarop een grote steenhoop op, die er is tot op deze dag.", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Deut 2:34": "En wij namen in die tijd al zijn steden in, en wij verbanden alle steden, mannen, en vrouwen, en kinderen; wij lieten niemand overblijven.", "Richt 21:20-23": "En zij geboden de kinderen van Benjamin: Gaat heen, en verberg u in de wijngaarden. En let erop, en zie, als de dochters van Silo uitgegaan zijn om in reidansen te dansen, dan komt u tevoorschijn uit de wijngaarden, en schaakt u ieder zijn vrouw, uit de dochters van Silo; en gaat heen naar het land van Benjamin. En het zal gebeuren, wanneer hun vaders of hun broeders komen om bij ons te klagen, dat wij tegen hen zullen zeggen: Weest hun om onzentwil genadig, omdat wij niet voor ieder van hen een vrouw genomen hebben in deze oorlog; want u hebt ze hun niet gegeven, zodat u nu niet schuldig zou zijn.", "Ex 20:25": "Maar als u Mij een stenen altaar zult maken, dan zult u dit niet bouwen van gehouwen steen; want als u uw houwijzer daarover heft, zult u het ontheiligen.", "Richt 17:6": "In die dagen was er geen koning in Israël; ieder deed wat recht was in zijn eigen ogen.", "2 Sam 2:6": "Zo doe de HEERE nu aan u weldadigheid en trouw! En ik ook, ik zal u dit goede doen, omdat u deze zaak gedaan hebt.", "Ezra 7:23": "Alles wat naar het bevel van de God van de hemel is, dat dat vlijtig gedaan wordt, voor het huis van de God van de hemel; want waartoe zou er grote toorn zijn over het koninkrijk van de koning en zijn kinderen?", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "2 Kron 5:14": "En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.", "Neh 6:10": "Toen ik in het huis kwam van Semaja, de zoon van Delaja, de zoon van Mehetabeel — hij was namelijk opgesloten — zei hij: Laten wij samenkomen in het huis van God, binnen in de tempel, en laten wij de deuren van de tempel sluiten; want zij zullen komen om u te doden, ja, 's nachts zullen zij komen om u te doden.", "Jer 39:6": "En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda.", "Deut 27:1": "En Mozes gebood, samen met de oudsten van Israël, het volk: Houd al deze geboden die ik u vandaag gebied.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "1 Kron 9:11": "En Azarja, de zoon van Hilkija, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, leider van het huis van God;", "Richt 21:19-21": "Toen zeiden zij: Zie, er is een feest van de HEERE te Silo, van jaar tot jaar, dat gehouden wordt ten noorden van het huis van God, ten oosten van de hoge weg die opgaat van het huis van God naar Sichem, en ten zuiden van Lebona. En zij geboden de kinderen van Benjamin: Gaat heen, en verberg u in de wijngaarden. En let erop, en zie, als de dochters van Silo uitgegaan zijn om in reidansen te dansen, dan komt u tevoorschijn uit de wijngaarden, en schaakt u ieder zijn vrouw, uit de dochters van Silo; en gaat heen naar het land van Benjamin.", "Deut 13:15": "dan zult u de inwoners van die stad zeker slaan met de scherpte van het zwaard, haar met de ban slaan, en alles wat daarin is, ook haar beesten, met de scherpte van het zwaard.", "2 Kon 8:12": "Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden.", "Hand 5:17": "En de hogepriester stond op, en allen die met hem waren (dat was de sekte van de Sadduceeën), en werden vervuld met nijd;", "Joh 7:2": "En het feest van de Joden, namelijk het loofhuttenfeest, was nabij.", "Spr 20:25": "Het is een strik voor de mens, dat hij het heilige verslindt, en na gedane geloften onderzoek te doen.", "Joz 18:1": "En de hele gemeenschap van de kinderen van Israël verzamelde zich te Silo, en zij richtten daar de tent van de samenkomst op, nadat het land aan hen onderworpen was.", "Hebr 13:10": "Wij hebben een altaar waarvan zij die de tabernakel dienen, geen macht hebben om te eten.", "1 Sam 1:24": "Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.", "Joz 11:11": "En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur.", "Lev 9:1": "Het gebeurde op de achtste dag, dat Mozes Aäron en zijn zonen riep, en de oudsten van Israël;", "1 Sam 4:3": "Toen het volk weer in het leger gekomen was, zeiden de oudsten van Israël: Waarom heeft de HEERE ons vandaag verslagen voor de Filistijnen? Laten wij uit Silo de ark van het verbond van de HEERE tot ons nemen, en laat die in ons midden komen, zodat zij ons verlost uit de hand van onze vijanden.", "Num 28:16": "En in de eerste maand, op de veertiende dag van de maand, is het Pascha voor de HEERE.", "Joël 2:12": "Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen.", "Deut 31:28": "Verzamel bij mij alle oudsten van uw stammen, en uw opzichters; opdat ik ten aanhoren van hen deze woorden spreek, en tegen hen de hemel en de aarde tot getuigen neem.", "Num 28:26": "Ook op de dag van de eerstelingen, als u een nieuw spijsoffer de HEERE zult offeren naar uw weken, zult u een heilige samenkomst hebben; geen dienstwerk zult u doen.", "Lev 23:34": "Spreek tot de kinderen van Israël, en zeg: Op de vijftiende dag van deze zevende maand zal het feest van de loofhutten zeven dagen voor de HEERE zijn.", "Num 29:12": "Evenzo, op de vijftiende dag van deze zevende maand zult u een heilige samenkomst hebben; geen dienstwerk zult u doen; maar zeven dagen zult u de HEERE een feest vieren.", "Ps 80:13": "Waarom hebt U zijn muren doorgebroken, zodat allen die de weg voorbijgaan, hem plukken?", "1 Kon 8:64": "Op diezelfde dag heiligde de koning het middelste van de voorhof, dat voor het huis van de HEERE was, omdat hij daar het brandoffer en het spijsoffer bereid had, alsook het vet van de dankoffers; want het koperen altaar, dat voor het aangezicht van de HEERE was, was te klein, om de brandoffers, en de spijsoffers, en het vet van de dankoffers te bevatten.", "Richt 18:1": "In die dagen was er geen koning in Israël; en in dezelfde dagen zocht de stam van Dan voor zich een erfenis om te wonen; want tot op die dag was hun onder de stammen van Israël niet genoeg ter erfenis toegevallen.", "Deut 16:1": "Neem waar dat het de maand Abib is, als u de HEERE, uw God, pascha viert; want in de maand Abib heeft de HEERE, uw God, u bij nacht uit Egypteland uitgevoerd.", "Lev 27:29": "Alles wat verboden is, dat van de mensen verboden zal zijn, zal niet afgekocht worden; het zal zeker gedood worden.", "Ezra 7:20": "Het overige nu, dat nodig zal zijn voor het huis van uw God, dat u zult moeten uitgeven, zult u geven uit het schathuis van de koning.", "Joël 1:16": "Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God?", "Deut 7:2": "en de HEERE, uw God, hen aan u zal hebben overgegeven, zodat u hen verslaat, dan moet u hen helemaal met de ban vernietigen; u zult geen verbond met hen maken, en hun ook niet genadig zijn.", "Rom 10:2": "Want ik geef hun getuigenis, dat zij een ijver voor God hebben, maar niet met verstand.", "Richt 18:7": "Toen gingen die vijf mannen heen, en kwamen bij Lais; en zij zagen het volk dat daar te midden woonde, levend in zekerheid, naar de gewoonte van de Sidoniërs, rustig en zorgeloos; en er was geen machthebber die iemand om enige zaak schande aandeed in dat land; ook waren zij ver van de Sidoniërs, en hadden met niemand iets te maken.", "Num 31:18": "Maar laat al de kinderen van vrouwelijk geslacht, die geen gemeenschap met een man hebben gehad, voor u leven.", "Pred 5:1": "Wees niet te snel met uw mond, en laat uw hart niet haasten om een woord voort te brengen voor Gods aangezicht; want God is in de hemel, en u bent op de aarde; daarom laat uw woorden weinig zijn.", "Matt 26:72": "En hij loochende het opnieuw met een eed: Ik ken de Mens niet.", "Ps 78:34": "Toen Hij hen doodde, zochten zij Hem, en keerden weer, en zochten God vroeg;", "Neh 11:11": "Seraja, de zoon van Hilkia, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, was voorganger van Gods huis;", "Ex 24:14": "En hij zei tegen de oudsten: Blijft u hier voor ons, totdat wij weer tot u komen; en zie, Aäron en Hur zijn bij u; wie een zaak heeft, moet naar hen toe gaan.", "Ex 3:16": "Ga heen, en verzamel de oudsten van Israël, en zeg tegen hen: De HEERE, de God van uw vaderen, is mij verschenen, de God van Abraham, Izak en Jakob, en Hij zei: Ik heb u getrouw bezocht, en gezien wat u in Egypte is aangedaan;", "Mark 6:23": "En hij zwoer haar: Wat u mij ook zult vragen, ik zal het u geven, zelfs tot de helft van mijn koninkrijk!", "2 Kron 7:13": "Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend;", "1 Sam 1:21": "En die man, Elkana, trok op met zijn hele huis, om aan de HEERE het jaarlijkse offer te offeren, en zijn gelofte.", "Richt 21:8-11": "En zij zeiden: Is er iemand van de stammen van Israël, die niet is opgekomen tot de HEERE te Mizpa? En zie, van Jabes in Gilead was niemand opgekomen naar het leger, naar de gemeente. Want het volk werd geteld, en zie, er was niemand van de inwoners van Jabes in Gilead. Toen zond de vergadering daarheen twaalfduizend man, van de strijdbaarste; en zij geboden hun: Trekt heen, en slaat met de scherpte van het zwaard de inwoners van Jabes in Gilead, met de vrouwen en de kinderen.", "1 Sam 15:32": "Toen zei Samuël: Breng Agag, de koning van de Amalekieten, hier bij mij. Agag nu ging vol vertrouwen naar hem toe; en Agag zei: Voorwaar, de bitterheid van de dood is geweken!", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Jer 31:13": "Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis.", "2 Sam 8:2": "Ook sloeg hij de Moabieten, en mat hen met een snoer, en liet hen op de aarde neerliggen; en hij mat met twee snoeren om te doden, en met een vol snoer om in het leven te laten. Zo werden de Moabieten David tot knechten, en zij brachten geschenken.", "Ps 12:5": "Die zeggen: Wij zullen de overhand hebben met onze tong; onze lippen zijn onze! Wie is heer over ons?", "Jes 63:17": "HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "Gen 28:17": "En hij vreesde, en zei: Hoe ontzagwekkend is deze plaats! Dit is niets anders dan een huis van God, en dit is de poort van de hemel!", "Ezra 9:4": "Toen verzamelden zich bij mij allen die voor de woorden van de God van Israël beefden, om de overtreding van de weggevoerden; maar ik bleef verbaasd zitten tot aan het avondoffer.", "1 Sam 10:8": "U nu zult voor mijn aangezicht naar Gilgal afgaan, en zie, ik zal naar u toe komen, om brandoffers te offeren, en om dankoffers te offeren; zeven dagen zult u daar wachten, totdat ik naar u toe kom, en u bekendmaak wat u doen zult.", "Joz 23:3": "En u hebt gezien alles, wat de HEERE, uw God, gedaan heeft aan al deze volken voor uw aangezicht; want de HEERE, uw God, Zelf, is het, Die voor u gestreden heeft.", "Ex 15:20": "En Mirjam, de profetes, de zuster van Aäron, nam een trommel in haar hand; en alle vrouwen gingen achter haar aan, met trommels en met reidansen.", "Hand 5:18": "en zij sloegen hun handen aan de apostelen, en zetten hen in de gemeenschappelijke gevangenis.", "Ex 24:1": "Daarna zei Hij tegen Mozes: Klim op tot de HEERE, u en Aäron, Nadab en Abihu, en zeventig van de oudsten van Israël; en buig u neer van verre!", "Richt 18:31": "Zo stelden zij voor zich het gesneden beeld van Micha op, dat hij gemaakt had, al de dagen dat het huis van God te Silo was.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Hebr 10:21": "en omdat wij een grote Priester hebben over het huis van God,", "2 Kron 24:13": "Zo deden de verzorgers van het werk, dat de vooruitgang van het werk door hun hand toenam; en zij herstelden het huis van God naar zijn gestalte, en maakten het vast.", "Lev 4:15": "En de oudsten van de gemeenschap zullen hun handen op het hoofd van de var leggen, voor het aangezicht van de HEERE; en men zal de var slachten voor het aangezicht van de HEERE.", "Joz 24:25": "Zo sloot Jozua op die dag een verbond met het volk; en hij stelde het hun tot een inzetting en recht te Sichem.", "Ps 81:4": "Blaast de bazuin in de nieuwe maan, op de bestemde tijd, op onze feestdag."}, "noten": {"1": "Vers 19 SV: \"tegen den opgang der zon\" — D.i.: ten oosten."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H376\">De</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H376\">mannen
