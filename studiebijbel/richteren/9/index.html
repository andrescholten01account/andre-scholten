odus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Abimelech nu, de zoon van Jerubbaäl, ging naar Sichem, naar de broers van zijn moeder; en hij sprak tot hen, en tot het hele geslacht van het huis van de vader van zijn moeder, en zei:","2":"Spreekt toch ten aanhoren van alle burgers van Sichem: Wat is voor u beter, dat zeventig mannen, allemaal zonen van Jerubbaäl, over u heersen, of dat één man over u heerst? Bedenkt ook dat ik uw eigen vlees en bloed ben.","3":"Toen spraken de broers van zijn moeder over hem, ten aanhoren van alle burgers van Sichem, al deze woorden; en hun hart neigde zich naar Abimelech; want zij zeiden: Hij is onze broer.","4":"En zij gaven hem zeventig zilverlingen, uit het huis van Baäl-berith; en Abimelech huurde daarmee nietswaardige en lichtzinnige mannen, die hem volgden.","5":"En hij kwam in het huis van zijn vader te Ofra, en doodde zijn broers, de zonen van Jerubbaäl, zeventig mannen, op één steen; maar Jotham, de jongste zoon van Jerubbaäl, bleef over, want hij had zich verstopt.","6":"Toen verzamelden zich alle burgers van Sichem, en het hele huis van Millo, en gingen heen en maakten Abimelech tot koning, bij de hoge eik die bij Sichem is.","7":"Toen ze dit aan Jotham vertelden, ging hij heen en ging op de top van de berg Gerizim staan, en verhief zijn stem, en riep, en hij zei tegen hen: Luistert naar mij, burgers van Sichem! Dan zal God ook naar u luisteren.","8":"De bomen gingen eens op weg om een koning over zich te zalven, en zij zeiden tegen de olijfboom: Wees u koning over ons.","9":"Maar de olijfboom zei tegen hen: Zou ik mijn vettigheid opgeven, waarmee men God en de mensen eert door mij? En zou ik heengaan om te zweven boven de bomen?","10":"Toen zeiden de bomen tegen de vijgenboom: Kom u, wees koning over ons.","11":"Maar de vijgenboom zei tegen hen: Zou ik mijn zoetigheid en mijn goede vrucht opgeven? En zou ik heengaan om te zweven boven de bomen?","12":"Toen zeiden de bomen tegen de wijnstok: Kom u, wees koning over ons.","13":"Maar de wijnstok zei tegen hen: Zou ik mijn most opgeven, die God en mensen vrolijk maakt? En zou ik heengaan om te zweven boven de bomen?","14":"Toen zeiden alle bomen tegen de doornstruik: Kom u, wees koning over ons.","15":"En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.","16":"Als u dus nu werkelijk en oprecht gehandeld hebt door Abimelech koning te maken, en als u goed gedaan hebt aan Jerubbaäl en zijn huis, en als u hem behandeld hebt naar wat zijn handen verdienen,","17":"(want mijn vader heeft voor u gestreden, en hij heeft zijn leven ver weggeworpen, en heeft u gered uit de hand van de Midianieten;","18":"maar u bent vandaag opgestaan tegen het huis van mijn vader, en hebt zijn zonen, zeventig mannen, op één steen gedood; en u hebt Abimelech, een zoon van zijn dienstmaagd, koning gemaakt over de burgers van Sichem, omdat hij uw broer is);","19":"als u dan vandaag werkelijk en oprecht gehandeld hebt met Jerubbaäl en zijn huis, wees dan vrolijk over Abimelech, en laat hij ook vrolijk zijn over u.","20":"Maar zo niet, laat er dan vuur uitgaan van Abimelech, dat de burgers van Sichem en het huis van Millo verteert; en laat er vuur uitgaan van de burgers van Sichem en van het huis van Millo, dat Abimelech verteert!","21":"Toen vluchtte Jotham, en ging naar Beer; en hij woonde daar vanwege zijn broer Abimelech.","22":"Toen Abimelech drie jaar over Israël geheerst had,","23":"zond God een boze geest tussen Abimelech en de burgers van Sichem; en de burgers van Sichem handelden trouweloos tegen Abimelech;","24":"opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.","25":"En de burgers van Sichem legden mannen in hinderlaag op de toppen van de bergen, en al wie voorbij hen langs de weg trok, beroofden zij; en het werd Abimelech verteld.","26":"Gaal, de zoon van Ebed, kwam met zijn broers, en zij trokken door naar Sichem; en de burgers van Sichem stelden hun vertrouwen op hem.","27":"En zij trokken het veld in en oogstten hun wijngaarden af, en persten de druiven, en hielden een oogstfeest; en zij gingen het huis van hun god binnen, en aten en dronken, en vervloekten Abimelech.","28":"En Gaal, de zoon van Ebed, zei: Wie is Abimelech, en wat is Sichem, dat wij hem zouden dienen? Is hij niet een zoon van Jerubbaäl, en Zebul zijn aanvoerder? Dient liever de mannen van Hemor, de vader van Sichem; want waarom zouden wij hem dienen?","29":"Och, was dit volk maar in mijn hand! Ik zou Abimelech wel verdrijven. En hij zei tegen Abimelech: Vermeerder uw leger, en trek uit.","30":"Toen Zebul, de leider van de stad, de woorden van Gaal, de zoon van Ebed, hoorde, ontstak zijn toorn.","31":"En hij zond in het geheim boden naar Abimelech, en zei: Zie, Gaal, de zoon van Ebed, en zijn broers zijn naar Sichem gekomen, en zie, zij zetten deze stad tegen u op.","32":"Maak u dus nu klaar in de nacht, u en het volk dat bij u is, en leg een hinderlaag in het veld.","33":"En het gebeurt in de morgen, zodra de zon opgaat, maak u dan vroeg op en overval deze stad; en zie, als hij en het volk dat bij hem is naar u uittrekken, doe hem dan zoals uw hand het vinden zal.","34":"Abimelech dan maakte zich op, en al het volk dat bij hem was, in de nacht; en zij legden een hinderlaag bij Sichem, met vier groepen.","35":"En Gaal, de zoon van Ebed, ging naar buiten, en ging bij de ingang van de stadspoort staan; en Abimelech kwam op, met het volk dat bij hem was, vanuit de hinderlaag.","36":"Toen Gaal dat volk zag, zei hij tegen Zebul: Zie, er komt volk af van de toppen van de bergen. Zebul zei daarentegen tegen hem: U ziet de schaduw van de bergen aan voor mensen.","37":"Maar Gaal ging verder met spreken en zei: Zie daar, er komt volk af uit het midden van het land, en één groep komt van de weg van de eik van Meonenim.","38":"Toen zei Zebul tegen hem: Waar is nu uw grote mond, waarmee u zei: Wie is Abimelech, dat wij hem zouden dienen? Is dit niet het volk dat u veracht hebt? Trek toch nu uit en strijd tegen hem!","39":"En Gaal trok uit voor het aangezicht van de burgers van Sichem, en hij streed tegen Abimelech.","40":"En Abimelech joeg hem na, want hij vluchtte voor hem; en er vielen veel gewonden tot aan de ingang van de stadspoort.","41":"Abimelech nu bleef in Aruma; en Zebul verdreef Gaal en zijn broers, zodat zij niet in Sichem mochten wonen.","42":"En het gebeurde de volgende dag dat het volk het veld introk, en zij vertelden het aan Abimelech.","43":"Toen nam hij het volk, en verdeelde hen in drie groepen, en legde een hinderlaag in het veld; en hij zag toe, en zie, het volk trok de stad uit, en hij kwam tegen hen op en sloeg hen.","44":"Want Abimelech en de groep die bij hem was overvielen hen, en bleven staan bij de ingang van de stadspoort; en de twee andere groepen overvielen allen die in het veld waren, en sloegen hen.","45":"Verder streed Abimelech die hele dag tegen de stad, en nam de stad in, en doodde het volk dat erin was; en hij brak de stad af, en bezaaide haar met zout.","46":"Toen alle burgers van de toren van Sichem dat hoorden, gingen zij de vesting binnen, in het huis van de god Berith.","47":"En het werd Abimelech verteld dat alle burgers van de toren van Sichem zich verzameld hadden.","48":"Toen ging Abimelech de berg Zalmon op, hij en al het volk dat bij hem was; en Abimelech nam een bijl in zijn hand, en hakte een tak van de bomen af, en nam hem op, en legde hem op zijn schouder; en hij zei tegen het volk dat bij hem was: Wat u mij hebt zien doen, haast u, doe hetzelfde als ik.","49":"Zo hakte ook al het volk ieder zijn tak af, en zij volgden Abimelech na, en legden ze tegen de vesting, en verbrandden daarmee de vesting met vuur; zodat ook alle mensen van de toren van Sichem stierven, ongeveer duizend mannen en vrouwen.","50":"Verder trok Abimelech naar Thebez, en legerde zich tegen Thebez, en nam haar in.","51":"Maar er was een sterke toren midden in de stad; daarheen vluchtten alle mannen en vrouwen, en alle burgers van de stad, en zij sloten zich voor zichzelf op; en zij klommen op het dak van de toren.","52":"Toen kwam Abimelech tot aan de toren, en bestormde die; en hij naderde tot aan de deur van de toren, om die met vuur te verbranden.","53":"Maar een vrouw wierp een stuk van een molensteen op het hoofd van Abimelech, en verpletterde zijn schedel.","54":"Toen riep hij haastig de jongen die zijn wapens droeg, en zei tegen hem: Trek uw zwaard, en dood mij, opdat men niet van mij zegt: Een vrouw heeft hem gedood. En zijn jongen doorstak hem, zodat hij stierf.","55":"Toen de mannen van Israël zagen dat Abimelech dood was, gingen zij ieder naar zijn eigen plaats.","56":"Zo liet God het kwaad van Abimelech, dat hij aan zijn vader gedaan had door zijn zeventig broers te doden, op hem terugkomen.","57":"Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen."},"SV":{"1":"Abimelech nu, de zoon van Jerubbaäl, ging henen naar Sichem, tot de broeders zijner moeder; en hij sprak tot hen, en tot het ganse geslacht van het huis van den vader zijner moeder, zeggende:","2":"Spreekt toch voor de oren van alle burgers van Sichem: Wat is u beter, dat zeventig mannen, alle zonen van Jerubbaäl, over u heersen, of dat een man over u heerse? Gedenkt ook, dat ik uw been en uw vlees ben.","3":"Toen spraken de broeders zijner moeder van hem, voor de oren van alle burgers van Sichem, al dezelve woorden; en hun hart neigde zich naar Abimelech; want zij zeiden: Hij is onze broeder.","4":"En zij gaven hem zeventig zilverlingen, uit het huis van Baäl-berith; en Abimelech huurde daarmede ijdele en lichtvaardige mannen, die hem navolgden.","5":"En hij kwam in zijns vaders huis te Ofra, en doodde zijn broederen, de zonen van Jerubbaäl, zeventig mannen, op een steen; doch Jotham, de jongste zoon van Jerubbaäl werd overgelaten, want hij had zich verstoken.","6":"Toen vergaderden zich alle burgeren van Sichem, en het ganse huis van Millo, en gingen heen en maakten Abimelech ten koning, bij den hogen eik, die bij Sichem is.","7":"Als zij dit Jotham aanzeiden, zo ging hij heen, en stond op de hoogte des bergs Gerizim, en verhief zijn stem, en riep, en hij zeide tot hen: Hoort naar mij, gij, burgers van Sichem! en God zal naar ulieden horen.","8":"De bomen gingen eens heen, om een koning over zich te zalven, en zij zeiden tot den olijfboom: Wees gij koning over ons.","9":"Maar de olijfboom zeide tot hen: Zoude ik mijn vettigheid verlaten, die God en de mensen in mij prijzen? En zoude ik heengaan om te zweven over de bomen?","10":"Toen zeiden de bomen tot den vijgeboom: Kom gij, wees koning over ons.","11":"Maar de vijgeboom zeide tot hen: Zou ik mijn zoetigheid en mijn goede vrucht verlaten? En zou ik heengaan om te zweven over de bomen?","12":"Toen zeiden de bomen tot den wijnstok: Kom gij, wees koning over ons.","13":"Maar de wijnstok zeide tot hen: Zou ik mijn most verlaten, die God en mensen vrolijk maakt? En zou ik heengaan om te zweven over de bomen?","14":"Toen zeiden al de bomen tot den doornenbos: Kom gij, wees koning over ons.","15":"En de doornenbos zeide tot de bomen: Indien gij mij in waarheid tot een koning over u zalft, zo komt, vertrouwt u onder mijn schaduw; maar indien niet, zo ga vuur uit den doornenbos, en vertere de cederen van den Libanon.","16":"Alzo nu, indien gij het in waarheid en oprechtheid gedaan hebt, dat gij Abimelech koning gemaakt hebt, en indien gij welgedaan hebt bij Jerubbaäl en bij zijn huis, en indien gij hem naar de verdienste zijner handen gedaan hebt.","17":"( want mijn vader heeft voor ulieden gestreden, en hij heeft zijn ziel verre weggeworpen, en u uit der Midianieten hand gered;","18":"Maar gij zijt heden opgestaan tegen het huis mijns vaders, en hebt zijn zonen, zeventig mannen, op een steen gedood; en gij hebt Abimelech, een zoon zijner dienstmaagd, koning gemaakt over de burgers van Sichem, omdat hij uw broeder is);","19":"Indien gij dan in waarheid en in oprechtheid bij Jerubbaäl en bij zijn huis te dezen dage gehandeld hebt, zo weest vrolijk over Abimelech, en hij zij ook vrolijk over ulieden.","20":"Maar indien niet, zo ga vuur uit van Abimelech, en vertere de burgers van Sichem, en het huis van Millo; en vuur ga uit van de burgers van Sichem, en van het huis van Millo, en vertere Abimelech!","21":"Toen vlood Jotham, en vluchtte, en ging naar Beer; en hij woonde aldaar vanwege zijn broeder Abimelech.","22":"Als nu Abimelech drie jaren over Israël geheerst had,","23":"Zo zond God een bozen geest tussen Abimelech en tussen de burgers van Sichem; en de burgers van Sichem handelden trouweloos tegen Abimelech;","24":"Opdat het geweld, *gedaan* aan de zeventig zonen van Jerubbaäl, kwame, en opdat hun bloed gelegd wierd op Abimelech, hun broeder, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broeders te doden.","25":"En de burgers van Sichem bestelden tegen hem, die op de hoogten der bergen lagen leiden, en al wie voorbij hen op den weg doorging, beroofden zij; en het werd Abimelech aangezegd.","26":"Gaal, de zoon van Ebed, kwam ook met zijn broederen, en zij gingen over in Sichem; en de burgeren van Sichem verlieten zich op hem.","27":"En zij togen uit in het veld, en lazen hun wijnbergen af, en traden *de* *druiven*, en maakten lofliederen; en zij gingen in het huis huns gods, en aten en dronken, en vloekten Abimelech.","28":"En Gaal, de zoon van Ebed, zeide: Wie is Abimelech, en wat is Sichem, dat wij hem dienen zouden? is hij niet een zoon van Jerubbaäl? en Zebul zijn bevelhebber? dient *liever* de mannen van Hemor, den vader van Sichem; want waarom zouden wij hem dienen?","29":"Och, dat dit volk in mijn hand ware! ik zoude Abimelech wel verdrijven. En tot Abimelech zeide hij: Vermeerder uw heir, en trek uit.","30":"Als Zebul, de overste der stad, de woorden van Gaal, den zoon van Ebed, hoorde, zo ontstak zijn toorn.","31":"En hij zond listiglijk boden tot Abimelech, zeggende: Zie, Gaal, de zoon van Ebed, en zijn broeders zijn te Sichem gekomen, en zie, zij, met deze stad, handelen vijandiglijk tegen u.","32":"Zo maak u nu op bij nacht, gij en het volk, dat met u is, en leg lagen in het veld.","33":"En het geschiede in den morgen, als de zon opgaat, zo maak u vroeg op, en overval deze stad; en zie, zo hij en het volk, dat met hem is, tot u uittrekken, zo doe hem, gelijk als uw hand vinden zal.","34":"Abimelech dan maakte zich op, en al het volk, dat met hem was, bij nacht; en zij leiden lagen op Sichem, met vier hopen.","35":"En Gaal, de zoon van Ebed, ging uit, en stond aan de deur van de stadspoort; en Abimelech rees op, en *al* het volk, dat met hem was, uit de achterlage.","36":"Als Gaal dat volk zag, zo zeide hij tot Zebul: Zie, er komt volk af van de hoogten der bergen. Zebul daarentegen zeide tot hem: Gij ziet de schaduw der bergen voor mensen aan.","37":"Maar Gaal voer wijders voort te spreken en zeide: Zie daar volk, afkomende uit het midden des lands, en een hoop komt van den weg van den eik Meonenim.","38":"Toen zeide Zebul tot hem: Waar is nu uw mond, waarmede gij zeidet: Wie is Abimelech, dat wij hem zouden dienen? is niet dit het volk, dat gij veracht hebt? trek toch nu uit en strijd tegen hem!","39":"En Gaal trok uit voor het aangezicht der burgeren van Sichem, en hij streed tegen Abimelech.","40":"En Abimelech jaagde hem na, want hij vlood voor zijn aangezicht; en er vielen vele verslagenen tot aan de deur der *stads* poort.","41":"Abimelech nu bleef te Aruma; en Zebul verdreef Gaal en zijn broederen, dat zij te Sichem niet mochten wonen.","42":"En het geschiedde des anderen daags dat het volk uittrok in het veld, en zij zeiden het Abimelech aan.","43":"Toen nam hij het volk, en deelde hen in drie hopen, en hij leide lagen in het veld; en hij zag toe, en ziet, het volk trok uit de stad, zo maakte hij zich tegen hen op, en sloeg hen.","44":"want Abimelech en de hopen, die bij hem waren, overvielen hen, en bleven staan aan de deur der stadspoort; en de twee *andere* hopen overvielen allen, die in het veld waren, en sloegen hen.","45":"Voorts streed Abimelech tegen de stad dienzelven ganse dag, en nam de stad in, en doodde het volk, dat daarin was; en hij brak de stad af, en bezaaide haar met zout.","46":"Als alle burgers des torens van Sichem dat hoorden, zo gingen zij in de sterkte, in het huis van den god Berith.","47":"En het werd Abimelech aangezegd, dat alle burgeren des torens van Sichem zich verzameld hadden.","48":"Zo ging Abimelech op den berg Zalmon, hij en al het volk, dat met hem was; en Abimelech nam een bijl in zijn hand, en hieuw een tak van de bomen, en nam hem op, en leide hem op zijn schouder; en hij zeide tot het volk, dat bij hem was: Wat gij mij hebt zien doen, haast u, doet als ik.","49":"Zo hieuw ook al het volk een iegelijk zijn tak af, en zij volgden Abimelech na, en leiden ze aan de sterkte, en verbrandden daardoor de sterkte met vuur; dat ook alle lieden des torens van Sichem stierven, omtrent duizend mannen en vrouwen.","50":"Voorts toog Abimelech naar Thebez, en hij legerde zich tegen Thebez, en nam haar in.","51":"Doch er was een sterke toren in het midden der stad; zo vloden daarheen al de mannen en de vrouwen, en alle burgers van de stad, en sloten voor zich toe; en zij klommen op het dak des torens.","52":"Toen kwam Abimelech tot aan den toren, en bestormde dien; en hij genaakte tot aan de deur des torens, om dien met vuur te verbranden.","53":"Maar een vrouw wierp een stuk van een molensteen op Abimelechs hoofd; en zij verpletterde zijn hersenpan.","54":"Toen riep hij haastelijk, den jongen, die zijn wapenen droeg, en zeide tot hem: Trek uw zwaard uit, en dood mij, opdat zij niet van mij zeggen: Een vrouw heeft hem gedood. En zijn jongen doorstak hem, dat hij stierf.","55":"Als nu de mannen van Israël zagen, dat Abimelech dood was, zo gingen zij een iegelijk naar zijn plaats.","56":"Alzo deed God wederkeren het kwaad van Abimelech, dat hij aan zijn vader gedaan had, dodende zijn zeventig broederen.","57":"Desgelijks al het kwaad der lieden van Sichem deed God wederkeren op hun hoofd; en de vloek van Jotham, den zoon van Jerubbaäl, kwam over hen."},"KJV":{"1":"And Abimelech the son of Jerubbaal went to Shechem unto his mother's brethren, and communed with them, and with all the family of the house of his mother's father, saying,","2":"Speak, I pray you, in the ears of all the men of Shechem, Whether *is* better for you, either that all the sons of Jerubbaal, *which are* threescore and ten persons, reign over you, or that one reign over you? remember also that I *am* your bone and your flesh.","3":"And his mother's brethren spake of him in the ears of all the men of Shechem all these words: and their hearts inclined to follow Abimelech; for they said, He *is* our brother.","4":"And they gave him threescore and ten *pieces* of silver out of the house of Baalberith, wherewith Abimelech hired vain and light persons, which followed him.","5":"And he went unto his father's house at Ophrah, and slew his brethren the sons of Jerubbaal, *being* threescore and ten persons, upon one stone: notwithstanding yet Jotham the youngest son of Jerubbaal was left; for he hid","6":"And all the men of Shechem gathered together, and all the house of Millo, and went, and made Abimelech king, by the plain of the pillar that *was* in Shechem.","7":"And when they told *it* to Jotham, he went and stood in the top of mount Gerizim, and lifted up his voice, and cried, and said unto them, Hearken unto me, ye men of Shechem, that God may hearken","8":"The trees went forth *on a time* to anoint a king over them; and they said unto the olive tree, Reign","9":"But the olive tree said unto them, Should I leave my fatness, wherewith by me they honour God and man, and go to be promoted over the trees?","10":"And the trees said to the fig tree, Come thou, *and* reign","11":"But the fig tree said unto them, Should I forsake my sweetness, and my good fruit, and go to be promoted over the trees?","12":"Then said the trees unto the vine, Come thou, *and* reign","13":"And the vine said unto them, Should I leave my wine, which cheereth God and man, and go to be promoted over the trees?","14":"Then said all the trees unto the bramble, Come thou, *and* reign","15":"And the bramble said unto the trees, If in truth ye anoint me king over you, *then* come *and* put your trust in my shadow: and if not, let fire come out of the bramble, and devour the cedars of Lebanon.","16":"Now therefore, if ye have done truly and sincerely, in that ye have made Abimelech king, and if ye have dealt well with Jerubbaal and his house, and have done unto him according to the deserving of his hands;","17":"(For my father fought for you, and adventured his life far, and delivered you out of the hand of Midian:","18":"And ye are risen up against my father's house this day, and have slain his sons, threescore and ten persons, upon one stone, and have made Abimelech, the son of his maidservant, king over the men of Shechem, because he *is* your brother;)","19":"If ye then have dealt truly and sincerely with Jerubbaal and with his house this day, *then* rejoice ye in Abimelech, and let him also rejoice","20":"But if not, let fire come out from Abimelech, and devour the men of Shechem, and the house of Millo; and let fire come out from the men of Shechem, and from the house of Millo, and devour Abimelech.","21":"And Jotham ran away, and fled, and went to Beer, and dwelt there, for fear of Abimelech his brother.","22":"When Abimelech had reigned three years over Israel,","23":"Then God sent an evil spirit between Abimelech and the men of Shechem; and the men of Shechem dealt treacherously with Abimelech:","24":"That the cruelty *done* to the threescore and ten sons of Jerubbaal might come, and their blood be laid upon Abimelech their brother, which slew them; and upon the men of Shechem, which aided him in the killing of his brethren.","25":"And the men of Shechem set liers in wait for him in the top of the mountains, and they robbed all that came along that way by them: and it was told Abimelech.","26":"And Gaal the son of Ebed came with his brethren, and went over to Shechem: and the men of Shechem put their confidence","27":"And they went out into the fields, and gathered their vineyards, and trode *the grapes*, and made merry, and went into the house of their god, and did eat and drink, and cursed Abimelech.","28":"And Gaal the son of Ebed said, Who *is* Abimelech, and who *is* Shechem, that we should serve him? *is* not *he* the son of Jerubbaal? and Zebul his officer? serve the men of Hamor the father of Shechem: for why should we serve","29":"And would to God this people were under my hand! then would I remove Abimelech. And he said to Abimelech, Increase thine army, and come out.","30":"And when Zebul the ruler of the city heard the words of Gaal the son of Ebed, his anger was kindled.","31":"And he sent messengers unto Abimelech privily, saying, Behold, Gaal the son of Ebed and his brethren be come to Shechem; and, behold, they fortify the city","32":"Now therefore up by night, thou and the people that *is* with thee, and lie in wait in the field:","33":"And it shall be, *that* in the morning, as soon as the sun is up, thou shalt rise early, and set upon the city: and, behold, *when* he and the people that *is* with him come out against thee, then mayest thou do to them as thou shalt find occasion.","34":"And Abimelech rose up, and all the people that *were* with him, by night, and they laid wait against Shechem in four companies.","35":"And Gaal the son of Ebed went out, and stood in the entering of the gate of the city: and Abimelech rose up, and the people that *were* with him, from lying in wait.","36":"And when Gaal saw the people, he said to Zebul, Behold, there come people down from the top of the mountains. And Zebul said unto him, Thou seest the shadow of the mountains as *if they were* men.","37":"And Gaal spake again and said, See there come people down by the middle of the land, and another company come along by the plain of Meonenim.","38":"Then said Zebul unto him, Where *is* now thy mouth, wherewith thou saidst, Who *is* Abimelech, that we should serve him? *is* not this the people that thou hast despised? go out, I pray now, and fight","39":"And Gaal went out before the men of Shechem, and fought with Abimelech.","40":"And Abimelech chased him, and he fled before him, and many were overthrown *and* wounded, *even* unto the entering of the gate.","41":"And Abimelech dwelt at Arumah: and Zebul thrust out Gaal and his brethren, that they should not dwell in Shechem.","42":"And it came to pass on the morrow, that the people went out into the field; and they told Abimelech.","43":"And he took the people, and divided them into three companies, and laid wait in the field, and looked, and, behold, the people *were* come forth out of the city; and he rose up against them, and smote","44":"And Abimelech, and the company that *was* with him, rushed forward, and stood in the entering of the gate of the city: and the two *other* companies ran upon all *the people* that *were* in the fields, and slew","45":"And Abimelech fought against the city all that day; and he took the city, and slew the people that *was* therein, and beat down the city, and sowed it with salt.","46":"And when all the men of the tower of Shechem heard *that*, they entered into an hold of the house of the god Berith.","47":"And it was told Abimelech, that all the men of the tower of Shechem were gathered together.","48":"And Abimelech gat him up to mount Zalmon, he and all the people that *were* with him; and Abimelech took an axe in his hand, and cut down a bough from the trees, and took it, and laid *it* on his shoulder, and said unto the people that *were* with him, What ye have seen me do, make haste, *and* do as I","49":"And all the people likewise cut down every man his bough, and followed Abimelech, and put *them* to the hold, and set the hold on fire upon them; so that all the men of the tower of Shechem died also, about a thousand men and women.","50":"Then went Abimelech to Thebez, and encamped against Thebez, and took","51":"But there was a strong tower within the city, and thither fled all the men and women, and all they of the city, and shut *it* to them, and gat them up to the top of the tower.","52":"And Abimelech came unto the tower, and fought against it, and went hard unto the door of the tower to burn it with fire.","53":"And a certain woman cast a piece of a millstone upon Abimelech's head, and all to brake his skull.","54":"Then he called hastily unto the young man his armourbearer, and said unto him, Draw thy sword, and slay me, that men say not of me, A woman slew him. And his young man thrust him through, and he died.","55":"And when the men of Israel saw that Abimelech was dead, they departed every man unto his place.","56":"Thus God rendered the wickedness of Abimelech, which he did unto his father, in slaying his seventy brethren:","57":"And all the evil of the men of Shechem did God render upon their heads: and upon them came the curse of Jotham the son of Jerubbaal."}},"tsk":{"1":[{"kopje":"Abimelech","refs":["Richt 8:31"]},{"kopje":"Sichem","refs":["Gen 33:18","Gen 34:2","1 Kon 12:1"]},{"kopje":"sprak","refs":["2 Sam 15:6","1 Kon 12:3","1 Kon 12:20","Ps 83:3-5","Jer 18:18"]}],"2":[{"kopje":"zeventig","refs":["Richt 8:30"]},{"kopje":"uw eigen vlees en bloed","refs":["Gen 29:14","2 Sam 19:13","1 Kron 11:1","Ef 5:30","Hebr 2:14"]}],"3":[{"kopje":"spraken","refs":["Ps 10:3","Spr 1:11-14"]},{"kopje":"onze broer","refs":["Gen 29:15"]}],"4":[{"kopje":"huis","refs":["Richt 9:46-49","Richt 8:33"]},{"kopje":"nietswaardige","refs":["Richt 11:3","1 Sam 22:2","2 Kron 13:7","Job 30:8","Spr 12:11","Hand 17:5"]}],"5":[{"kopje":"te Ofra","refs":["Richt 6:24"]},{"kopje":"doodde","refs":["2 Kon 10:17","2 Kon 11:1","2 Kon 11:2","2 Kron 21:4","Matt 2:16","Matt 2:20"]}],"6":[{"kopje":"het huis","refs":["2 Sam 5:9","2 Kon 12:20"]},{"kopje":"eik","refs":["Joz 24:26","1 Kon 12:1","1 Kon 12:20","1 Kon 12:25"]}],"7":[{"kopje":"berg Gerizim","refs":["Deut 11:29","Deut 27:12","Joz 8:33","Joh 4:20"]},{"kopje":"Luistert","refs":["Ps 18:41","Ps 18:42","Ps 50:15-21","Spr 1:28","Spr 1:29","Spr 21:13","Spr 28:9","Jes 1:15","Jes 58:6-10","Matt 18:26-34","Jak 2:13"]}],"8":[{"kopje":"De bomen","refs":["2 Kon 14:9","Ezech 17:3-10","Dan 4:10-18"]},{"kopje":"koning","refs":["Ric pan> unto his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">communed</span> with them, and with all the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> saying,","2":"<span class=\"wl wl-kjv\" data-code=\"H1696\">Speak,</span> I pray you, in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem,</span> Whether is <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> for you, either that all the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3378\">Jerubbaal,</span> which are threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H376\">persons,</span> <span class=\"wl wl-kjv\" data-code=\"H4910\">reign</span> over you, or that <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H4910\">reign</span> over you? <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> also that I am your <span class=\"wl wl-kjv\" data-code=\"H6106\">bone</span> and your flesh.","3":"And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> of him in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem</span> all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words:</span> and their <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> <span class=\"wl wl-kjv\" data-code=\"H5186\">inclined</span> to <span class=\"wl wl-kjv\" data-code=\"H310\">follow</span> <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech;</span> for they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He is our brother.","4":"And they <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> pieces of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1170\">Baalberith,</span> wherewith <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H7936\">hired</span> <span class=\"wl wl-kjv\" data-code=\"H7386\">vain</span> and <span class=\"wl wl-kjv\" data-code=\"H6348\">light</span> <span class=\"wl wl-kjv\" data-code=\"H582\">persons,</span> which <span class=\"wl wl-kjv\" data-code=\"H3212\">followed</span> him.","5":"And he <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> at <span class=\"wl wl-kjv\" data-code=\"H6084\">Ophrah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3378\">Jerubbaal,</span> being threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H376\">persons,</span> upon <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone:</span> notwithstanding yet <span class=\"wl wl-kjv\" data-code=\"H3147\">Jotham</span> the <span class=\"wl wl-kjv\" data-code=\"H6996\">youngest</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3378\">Jerubbaal</span> was <span class=\"wl wl-kjv\" data-code=\"H3498\">left;</span> for he hid","6":"And all the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem</span> gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H4407\">Millo,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H4427\">made</span> <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> by the <span class=\"wl wl-kjv\" data-code=\"H436\">plain</span> of the <span class=\"wl wl-kjv\" data-code=\"H5324\">pillar</span> that was in Shechem.","7":"And when they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> it to <span class=\"wl wl-kjv\" data-code=\"H3147\">Jotham,</span> he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H1630\">Gerizim,</span> and lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">cried,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H8085\">Hearken</span> unto me, ye <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem,</span> that <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> may hearken","8":"The <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> went <span class=\"wl wl-kjv\" data-code=\"H1980\">forth</span> on a time to <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over them; and they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the olive <span class=\"wl wl-kjv\" data-code=\"H2132\">tree,</span> Reign","9":"But the olive <span class=\"wl wl-kjv\" data-code=\"H2132\">tree</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Should I <span class=\"wl wl-kjv\" data-code=\"H2308\">leave</span> my <span class=\"wl wl-kjv\" data-code=\"H1880\">fatness,</span> wherewith by me they <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> and <span class=\"wl wl-kjv\" data-code=\"H582\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> to be <span class=\"wl wl-kjv\" data-code=\"H5128\">promoted</span> over the trees?","10":"And the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the fig <span class=\"wl wl-kjv\" data-code=\"H8384\">tree,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come</span> thou, and reign","11":"But the fig <span class=\"wl wl-kjv\" data-code=\"H8384\">tree</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Should I <span class=\"wl wl-kjv\" data-code=\"H2308\">forsake</span> my <span class=\"wl wl-kjv\" data-code=\"H4987\">sweetness,</span> and my <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H8570\">fruit,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> to be <span class=\"wl wl-kjv\" data-code=\"H5128\">promoted</span> over the trees?","12":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come</span> thou, and reign","13":"And the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Should I <span class=\"wl wl-kjv\" data-code=\"H2308\">leave</span> my <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> which <span class=\"wl wl-kjv\" data-code=\"H8055\">cheereth</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> and <span class=\"wl wl-kjv\" data-code=\"H582\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> to be <span class=\"wl wl-kjv\" data-code=\"H5128\">promoted</span> over the trees?","14":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> all the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> unto the <span class=\"wl wl-kjv\" data-code=\"H329\">bramble,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come</span> thou, and reign","15":"And the <span class=\"wl wl-kjv\" data-code=\"H329\">bramble</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees,</span> If in <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> ye <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> me <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over you, then <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and put your <span class=\"wl wl-kjv\" data-code=\"H2620\">trust</span> in my <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow:</span> and if not, let <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H329\">bramble,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> the <span class=\"wl wl-kjv\" data-code=\"H730\">cedars</span> of Lebanon.","16":"Now therefore, if ye have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> <span class=\"wl wl-kjv\" data-code=\"H571\">truly</span> and <span class=\"wl wl-kjv\" data-code=\"H8549\">sincerely,</span> in that ye have made <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">king,</span> and if ye have <span class=\"wl wl-kjv\" data-code=\"H6213\">dealt</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">well</span> with <span class=\"wl wl-kjv\" data-code=\"H3378\">Jerubbaal</span> and his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto him according to the <span class=\"wl wl-kjv\" data-code=\"H1576\">deserving</span> of his hands;","17":"(For my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> for you, and <span class=\"wl wl-kjv\" data-code=\"H7993\">adventured</span> his <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> <span class=\"wl wl-kjv\" data-code=\"H5048\">far,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> you out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of Midian:","18":"And ye are risen <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> against my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and have <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H376\">persons,</span> upon <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> and have made <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of his <span class=\"wl wl-kjv\" data-code=\"H519\">maidservant,</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">king</span> over the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem,</span> because he is your brother;)","19":"If ye then have <span class=\"wl wl-kjv\" data-code=\"H6213\">dealt</span> <span class=\"wl wl-kjv\" data-code=\"H571\">truly</span> and <span class=\"wl wl-kjv\" data-code=\"H8549\">sincerely</span> with <span class=\"wl wl-kjv\" data-code=\"H3378\">Jerubbaal</span> and with his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> then <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> ye in <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech,</span> and let him also rejoice","20":"But if not, let <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H4407\">Millo;</span> and let <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H4407\">Millo,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> Abimelech.","21":"And <span class=\"wl wl-kjv\" data-code=\"H3147\">Jotham</span> ran <span class=\"wl wl-kjv\" data-code=\"H1272\">away,</span> and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H876\">Beer,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> there, for <span class=\"wl wl-kjv\" data-code=\"H6440\">fear</span> of <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> his brother.","22":"When <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> had <span class=\"wl wl-kjv\" data-code=\"H7786\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> over Israel,","23":"Then <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> an <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> between <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> and the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem</span> dealt <span class=\"wl wl-kjv\" data-code=\"H898\">treacherously</span> with Abimelech:","24":"That the <span class=\"wl wl-kjv\" data-code=\"H2555\">cruelty</span> done to the threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3378\">Jerubbaal</span> might <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> be <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> upon <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> their <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> which <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> them; and upon the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem,</span> which <span class=\"wl wl-kjv\" data-code=\"H2388\">aided</span> him in the <span class=\"wl wl-kjv\" data-code=\"H2026\">killing</span> of his brethren.","25":"And the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> liers in <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> for him in the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and they <span class=\"wl wl-kjv\" data-code=\"H1497\">robbed</span> all that <span class=\"wl wl-kjv\" data-code=\"H5674\">came</span> along that <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> by them: and it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> Abimelech.","26":"And <span class=\"wl wl-kjv\" data-code=\"H1603\">Gaal</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5651\">Ebed</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> with his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> to <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem</span> put their confidence","27":"And they went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields,</span> and <span class=\"wl wl-kjv\" data-code=\"H1219\">gathered</span> their <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards,</span> and <span class=\"wl wl-kjv\" data-code=\"H1869\">trode</span> the grapes, and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H1974\">merry,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of their <span class=\"wl wl-kjv\" data-code=\"H430\">god,</span> and did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> Abimelech.","28":"And <span class=\"wl wl-kjv\" data-code=\"H1603\">Gaal</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5651\">Ebed</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who is <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech,</span> and who is <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem,</span> that we should <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him? is not he the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3378\">Jerubbaal?</span> and <span class=\"wl wl-kjv\" data-code=\"H2083\">Zebul</span> his <span class=\"wl wl-kjv\" data-code=\"H6496\">officer?</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2544\">Hamor</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem:</span> for why should we serve","29":"And would to God this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H5414\">under</span> my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand!</span> then would I <span class=\"wl wl-kjv\" data-code=\"H5493\">remove</span> <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech,</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">Increase</span> thine <span class=\"wl wl-kjv\" data-code=\"H6635\">army,</span> and come out.","30":"And when <span class=\"wl wl-kjv\" data-code=\"H2083\">Zebul</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">ruler</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H1603\">Gaal</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5651\">Ebed,</span> his <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> was kindled.","31":"And he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> unto <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H8649\">privily,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H1603\">Gaal</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5651\">Ebed</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> be <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem;</span> and, behold, they <span class=\"wl wl-kjv\" data-code=\"H6696\">fortify</span> the city","32":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> thou and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that is with thee, and lie in <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> in the field:","33":"And it shall be, that in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> as soon as the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> is <span class=\"wl wl-kjv\" data-code=\"H2224\">up,</span> thou shalt rise <span class=\"wl wl-kjv\" data-code=\"H7925\">early,</span> and <span class=\"wl wl-kjv\" data-code=\"H6584\">set</span> upon the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and, behold, when he and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that is with him come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> against thee, then mayest thou <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> to them as <span class=\"wl wl-kjv\" data-code=\"H3027\">thou</span> shalt find occasion.","34":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him, by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and they laid <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> against <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem</span> in <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> companies.","35":"And <span class=\"wl wl-kjv\" data-code=\"H1603\">Gaal</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5651\">Ebed</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">entering</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him, from lying in wait.","36":"And when <span class=\"wl wl-kjv\" data-code=\"H1603\">Gaal</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H2083\">Zebul,</span> Behold, there <span class=\"wl wl-kjv\" data-code=\"H3381\">come</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains.</span> And <span class=\"wl wl-kjv\" data-code=\"H2083\">Zebul</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thou <span class=\"wl wl-kjv\" data-code=\"H7200\">seest</span> the <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> as if they were men.","37":"And <span class=\"wl wl-kjv\" data-code=\"H1603\">Gaal</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> See there <span class=\"wl wl-kjv\" data-code=\"H3381\">come</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> by the <span class=\"wl wl-kjv\" data-code=\"H2872\">middle</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">company</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> along by the <span class=\"wl wl-kjv\" data-code=\"H436\">plain</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">of</span> Meonenim.","38":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H2083\">Zebul</span> unto him, Where is <span class=\"wl wl-kjv\" data-code=\"H645\">now</span> thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> wherewith thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst,</span> Who is <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech,</span> that we should <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him? is not this the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H3988\">despised?</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> I pray <span class=\"wl wl-kjv\" data-code=\"H4994\">now,</span> and fight","39":"And <span class=\"wl wl-kjv\" data-code=\"H1603\">Gaal</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> with Abimelech.","40":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H7291\">chased</span> him, and he <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> were <span class=\"wl wl-kjv\" data-code=\"H5307\">overthrown</span> and <span class=\"wl wl-kjv\" data-code=\"H2491\">wounded,</span> even unto the <span class=\"wl wl-kjv\" data-code=\"H6607\">entering</span> of the gate.","41":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> at <span class=\"wl wl-kjv\" data-code=\"H725\">Arumah:</span> and <span class=\"wl wl-kjv\" data-code=\"H2083\">Zebul</span> thrust <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> <span class=\"wl wl-kjv\" data-code=\"H1603\">Gaal</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> that they should not <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in Shechem.","42":"And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> that the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> Abimelech.","43":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H2673\">divided</span> them into <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">companies,</span> and laid <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city;</span> and he rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> against them, and smote","44":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7218\">company</span> that was with him, rushed <span class=\"wl wl-kjv\" data-code=\"H6584\">forward,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H6607\">entering</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> other <span class=\"wl wl-kjv\" data-code=\"H7218\">companies</span> ran <span class=\"wl wl-kjv\" data-code=\"H6584\">upon</span> all the people that were in the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields,</span> and slew","45":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> all that <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> and he <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that was therein, and beat <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H2232\">sowed</span> it with salt.","46":"And when all the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that, they <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into an <span class=\"wl wl-kjv\" data-code=\"H6877\">hold</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H410\">god</span> Berith.","47":"And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech,</span> that all the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem</span> were gathered together.","48":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> gat him <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H6756\">Zalmon,</span> he and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him; and <span class=\"wl wl-kjv\" dat ">died</span> also, about a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> and women.","50":"Then <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> to <span class=\"wl wl-kjv\" data-code=\"H8405\">Thebez,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> against <span class=\"wl wl-kjv\" data-code=\"H8405\">Thebez,</span> and took","51":"But there was a <span class=\"wl wl-kjv\" data-code=\"H5797\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">within</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and thither <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> and all <span class=\"wl wl-kjv\" data-code=\"H1167\">they</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> it to them, and gat them <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H1406\">top</span> of the tower.","52":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against it, and went <span class=\"wl wl-kjv\" data-code=\"H5066\">hard</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> to <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> it with fire.","53":"And a <span class=\"wl wl-kjv\" data-code=\"H259\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> a <span class=\"wl wl-kjv\" data-code=\"H6400\">piece</span> of a <span class=\"wl wl-kjv\" data-code=\"H7393\">millstone</span> upon <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech's</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and all to <span class=\"wl wl-kjv\" data-code=\"H7533\">brake</span> his skull.","54":"Then he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H4120\">hastily</span> unto the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H5375\">armourbearer,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H8025\">Draw</span> thy <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> me, that men <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> not of me, A <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> him. And his young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> thrust him <span class=\"wl wl-kjv\" data-code=\"H1856\">through,</span> and he died.","55":"And when the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> they <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> unto his place.","56":"Thus <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">rendered</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> of <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech,</span> which he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> in <span class=\"wl wl-kjv\" data-code=\"H2026\">slaying</span> his <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> brethren:","57":"And all the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem</span> did <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">render</span> upon their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads:</span> and upon them <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> the <span class=\"wl wl-kjv\" data-code=\"H7045\">curse</span> of <span class=\"wl wl-kjv\" data-code=\"H3147\">Jotham</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Jerubbaal."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Sichem,","tekst":"Zie boven, Jdg 8:31."},{"catchword":"broeder zijner moeder;","tekst":"Dat is, bloedverwanten en vrienden. Alzo, vs.3, 18."}],"2":[{"catchword":"burgers van Sichem","tekst":"Hebreeuws, heren, meesters, mannen, burgers. Zie van het Hebreeuwse woord Baäl, Gen 14:13."},{"catchword":"een man over u heerse?","tekst":"Hij wil zeggen, dat het buiten twijfel het beste is, verstaande door dezen éénen man, zichzelven."},{"catchword":"been en uw vlees ben","tekst":"Van moeders zijde uit Sichem gesproten, en velen onder u in bloede bestaande. Zie van deze manier van spreken, Gen 2:23, en Gen 29:14."}],"3":[{"catchword":"naar Abimélech;","tekst":"Hebreeuws, achter; dat is, om hem na te volgen."}],"4":[{"catchword":"zilverlingen,","tekst":"Zie Gen 20:16."},{"catchword":"huis van Baäl-berith;","tekst":"Dat is, uit den afgodischen tempel van dezen afgod, staande op een hogen berg bij Sichem, naar uitwijzen der kaart. Zie ook van dezen afgod boven, Jdg 8:33."},{"catchword":"ijdele en lichtvaardige mannen,","tekst":"Dat is, een hoop van kaal, behoeftig en licht gespuis, bij welke geen vreze Gods was. Vergelijk 2Ch 13:7."},{"catchword":"die hem navolgden","tekst":"Hebreeuws, en zij gingen achter hem."}],"5":[{"catchword":"zeventig mannen,","tekst":"Er werden maar negen en zestig gedood [want Jotham ontkwam], maar de Heilige Schrift noemt naar gewoonte het volle getal. Zie Gen 42:13; Num 14:33; 1Co 15:5."}],"6":[{"catchword":"huis van Millo,","tekst":"Hebreeuws, Beth-millo; een stad, gelegen, naar uitwijzen der kaart, oostwaarts van Sichem, aan het gebergte Efraïms, niet ver van Beth-aven. Anderen verstaan hierdoor de sterkte, vermeld onder, vs.46, 49, gehouden als een raadhuis, of landhuis, waarin de volle raad placht te vergaderen, met enig garnizoen bezet, hetwelk in dezen handel mede gebruikt is. Het woord Millo komt van vullen, volheid, vervulling, waarom het sommigen nemen voor een diepen kuil of vallei, die met aarde en steengruis opgevuld zijnde, gediend heeft tot bouwing van een sterkte, daarvan genoemd Millo. Eenigen menen dat het geslacht van den vader van Abimélechs moeder hiervan alzo genoemd is. Het woord Millo wordt ook gevonden 2Sa 5:9; 1Ki 9:15, en 1Ki 11:27; 2Ki 12:20; 1Ch 11:8; 2Ch 32:5."},{"catchword":"maakten Abimélech ten koning,","tekst":"Hebreeuws alsof men zeide: zij koningden hem ten koning."},{"catchword":"hogen eik,","tekst":"Of, pilaareik. Zie Jos 24:26-27. Deze plaats hebben zij vermoedelijk verkozen, om dit werk met enigen schijn van heiligheid te bekleden, dat zij nochtans met een gruwelijke tirannie hadden begonnen, en zonder de andere stammen daarover te roepen, of God eens raad te vragen, voltrokken. Anders, bij het plein van den pilaar."}],"7":[{"catchword":"hoogte des bergs","tekst":"Hebreeuws, het hoofd."},{"catchword":"Gerizim,","tekst":"Die aan Sichem was gelegen en recht tegenover lag de berg Ebal, waarvan te zien is Deu 11:29-30; Jos 8:33."},{"catchword":"zeide tot hen","tekst":"Zo het schijnt, door Gods ingeven, die Jothams woorden bevestigd heeft; onder, vs.24, 57."}],"8":[{"catchword":"De bomen","tekst":"Zie ene gelijke versierde rede of gelijkenis, tot lering, 2Ki 14:9."},{"catchword":"gingen eens heen,","tekst":"Hebreeuws, gaande gingen zij."}],"9":[{"catchword":"mijn vettigheid","tekst":"Dat is, de olie."},{"catchword":"verlaten,","tekst":"Of, zal ik laten ophouden, of, gedwongen worden op te houden, en zo in het volgende."},{"catchword":"God en de mensen in mij prijzen?","tekst":"Want de olie werd gebruikt in de offeranden en lampen des tabernakels, alsook bij het zalven der priesters, koningen en [gelijk uit 1Ki 19:16 afgenomen wordt] profeten, en in het algemeen tot spijs, sieraad en smuk van 's mensen lichaam. Anders, waarmede men door mij God en de mensen vereert"},{"catchword":"zweven over de bomen?","tekst":"Dat is, om als koning te gaan omlopen, woelen en zorgen voor andere bomen."}],"13":[{"catchword":"God en mensen vrolijk maakt?","tekst":"Omdat de wijn in offeranden gebruikt werd en het hart des mensen verheugt; Psa 104:15. Anders, die goden; dat is, die grote heren, en mensen, dat is, gemene lieden verheugt."}],"15":[{"catchword":"Libanon","tekst":"Dit gebergte was zeer vermaard vanwege de schone, heerlijke cederbomen, zijnde zeer sterk en duurzaam, die in menigte daarop wiessen, waarvan verscheidene gelijkenissen in de Schrift genomen worden. Zie 2Ki 14:9; 2Ch 2:8; Psa 29:5, en Psa 92:13; Son 3:9, en Son 5:15; Isa 60:13; Jer 22:23; Eze 17:3, en Eze 31:3; Hos 14:6-8."}],"16":[{"catchword":"Alzo nu,","tekst":"Hier verklaart nu Jotham de voorgestelde gelijkenis."},{"catchword":"verdienste zijner handen gedaan hebt","tekst":"Of, weldaad."}],"17":[{"catchword":"zijn ziel","tekst":"Dat is, zijn leven en persoon niet gespaard, maar voor u gewaagd, of in groot perijkel gesteld."},{"catchword":"verre weggeworpen,","tekst":"Hebreeuws, van tegenover, of, van nabij; gelijk wanneer men iets uit de ogen ver van zich werpt, willende daarop niet zien, om hetzelve te bezorgen of acht er op te nemen. Vergelijk Deu 28:66, en onder, Jdg 12:3."}],"18":[{"catchword":"heden opgestaan","tekst":"Dat is, in dezen tijd."},{"catchword":"hebt zijn zonen,","tekst":"Dezen moord verwijt hij den Sichemieten, omdat zij Abimélech daarin gesterkt hadden. Zie vs.24."},{"catchword":"dienstmaagd,","tekst":"Alzo noemt hij verachtelijk zijns vaders bijwijf, om den Sichemieten de onbillijkheid hunner daad in te scherpen."}],"21":[{"catchword":"vluchtte,","tekst":"Het schijnt dat met deze samenvoeging van woorden, die één ding betekenen, te kennen gegeven wordt zijn haastigheid in het vluchten, om door zijn broeder niet achterhaald te worden."},{"catchword":"Beër;","tekst":"Waar deze plaats gelegen is, is onzeker. Sommigen gissen dat zij lag in den stam van Simeon, aan de uiterste palen van Kanaän, waar enige plaatsen zijn, die den naam Beër hebben, doch met enig bijvoegsel."}],"23":[{"catchword":"bozen geest","tekst":"Dit kan men verstaan van een bozen engel of satan, gelijk 1Sa 18:10, en 1Sa 19:9. Of van wederwil, onlust, tweedracht, die de Satan onder hen door een rechtvaardig oordeel Gods verwekt heeft. Vergelijk 1Sa 16:14, en 2Sa 16:10, en 2Sa 24:1."}],"24":[{"catchword":"geweld,","tekst":"Dat is, straf des gewelds."},{"catchword":"gedaan","tekst":"Hebreeuws, het geweld, of de wreedheid der zeventig zonen; dat is hun gedaan; aldus dikwijls."},{"catchword":"gelegd wierd op Abimélech,","tekst":"Te weten, op het hoofd van Abimélech en van de Sichemieten. Deze manieren van spreken zijn in de Heilige Schrift gebruikelijk, om te betekenen de wraak van geweld, doodslag of bloedvergieten. Vergelijk 1Sa 25:39; 2Sa 1:16; 1Ki 2:31-33; Est 9:25; Psa 7:17; Jer 51:35; Mat 23:34-35, en Mat 27:25; Act 5:28, en Act 18:6, enz. Zie ook onder, vs.56,57."},{"catchword":"zijn handen","tekst":"Die Abimélech in zijn boos voornemen gesterkt en geholpen hadden. Vergelijk boven, Jdg 7:11."}],"25":[{"catchword":"hoogten der bergen","tekst":"Hebreeuws, hoofden."},{"catchword":"al wie voorbij hen","tekst":"Zijnde Abimélech toegedaan. Sichem lag op den pas van en naar Jeruzalem, en de bergen Gerizim, Ebal, van Baäl-Berith, Zalmon, enz. lagen er dichtbij. Zie boven, vs.7, en onder, vs.46, 48."}],"26":[{"catchword":"gingen over in Sichem;","tekst":"Verlatende hun vorige woonplaats."},{"catchword":"hem","tekst":"Te weten, Gaäl, dien zij als een hoofd en krijgsoverste gebruikten tegen Abimélech."}],"27":[{"catchword":"veld,","tekst":"Tot een teken van vertrouwen en kleinachting van Abimélech."},{"catchword":"lofliederen;","tekst":"Anders, goede sier, gelijk zij gewoon waren te doen in den wijnoogst."},{"catchword":"huns gods,","tekst":"Baäl-Beriths afgodischen tempel. Zie boven, vs.4."}],"28":[{"catchword":"Wie is Abimélech,","tekst":"Zie gelijke verachtelijke manier van spreken 1Sa 25:10."},{"catchword":"wat is Sichem,","tekst":"Alsof zij zeiden: Sichem is al te heerlijk en hoog geacht dan dat de heren en burgers daarvan dezen Abimélech zouden dienen. Anders: Wie is Sichem? menende dat het hier de naam is van Hemors zoon, Gen 34 wien Jakobs zonen niet hebben willen dienen, maar hem gedood, of iemand zijner nakomelingen van dien naam, bij welken Abimélech, als een tiran en slecht van afkomst zijnde, niet is te vergelijken."},{"catchword":"hem dienen zouden?","tekst":"Abimélech."},{"catchword":"een zoon van JerubBaäl?","tekst":"Dat is, van Gideon, die een vijand was van onzen god Baäl en als een gemeen man zonder regering geleefd heeft."},{"catchword":"en Zebul zijn bevelhebber?","tekst":"Die van Abimélech als stadhouder te Sichem was gesteld, vs.30, en hier tegenwoordig, of immers in de stad, vs.36."},{"catchword":"Hemor,","tekst":"Dat is, die afkomstig, of nakomelingen zijn van Hemor, Sichems vader. Of, degenen, die niet tiranniek [gelijk Abimélech] maar vaderlijk regeren, gelijk Hemor eertijds deed, die als een vader van deze stad gehouden werd; sommigen nemen het aldus: Zo gij zoudt dienen, hadt gij toch Hemor en zijn nakomelingen
