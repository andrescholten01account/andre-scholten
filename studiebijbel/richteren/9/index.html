es compare 1Ch 13:7] which followed after him.]"}],"5":[{"catchword":null,"tekst":"And hecame into his fathers house at Ophra and slew his brethren the sons of Jerubaal seventy men [there were but sixty nine slain but Joas escaped but the holy scripture according to the custom nameth the full and perfect number see Gen 42:13 Num 14:33 1Ch 15:5] upon one storm but Jotham Jerubaal&acirc;&euro;&trade;s youngest son was left for he had hid himself."}],"6":[{"catchword":null,"tekst":"Then all the citizens of Sichem and all the house of Millo [Heb. Beth-millo a city lying as the map sheweth eastward from Sichem at the mountain of Ephraim not far from Beth-aven others understand hereby the strong hold mentioned below verse 46,49 which was the court or city hall where the council were wont to meet being beset or guarded with a garrison of soldiers which also was used in this transaction or dealing the word Millo cometh from filling fullness fulfilling whereby some take it from a deep valley or pit which being filled up with earth and rubbish served a building of a strong hold which from thence was called Millo some conceive that the generation or family of Abimelechs grandfather by the mothers side and from hence was also called the word Millo is also found 2 Samuel 5.9 1Ki 9:15 and 11.27 2Ki 12:20 1Ch 11:8,2Ch 32:5] assembled themselves and went and made Abimelech king [Heb. as if we should say that kinged him king] by the high oak or pillar oak [see Jos 24:26,27 this place they purposely made choice of to cloth their work with a shew of holiness which not withstanding they had begun with abominable tyranny and without calling thereunto the other tribes or asking counsel of God had finished others by the plain of the pillar ] which is by Sichem."}],"7":[{"catchword":null,"tekst":"When they told this to Jotham he went and stood on the top [ Heb. the head] of the mountain Gerizim mount Ebal whereof may be seen Deu 11:29,30 Jos 8:33] and lifted up his voice and cried and he said to them [as it seemeth by instinct or inspiration of God who confirmeth Jot hams words below verse 24.67] hearken to me ye citizens of Sichem and God will hearken to you."}],"8":[{"catchword":null,"tekst":"The trees [see a like rhetorical speech or parable serving for instruction 2Ki 14:9] went once [or at a time] forth [ Heb. going they went] to anoint a king over them and they said unto the olive tree be thou king over us."}],"9":[{"catchword":null,"tekst":"But the olive tree said unto them should I live [or shall I cause to cease or be compelled to cease so in the sequel] my fatness[ that is the oil] which God and men commend in me [for the oil was used in the sacrifices and lamps of the tarbenacle as also in the anointing of the priest kings and as is gathered from the 1Ki 19:16 prophet and usually for meat and ornament and to trick up mans body others wherewith by me they honor God and man ] and should I go forth to bear forth sway over the trees ?[ that is as king to go run about to turmoil and take care of other trees.]"}],"10":[{"catchword":null,"tekst":"Then said the tree unto the fig tree come thou and be the king over us."}],"11":[{"catchword":null,"tekst":"But the fig tree said unto them should I leave my sweetness and good fruits? And should I go forth to bear sway over the trees?"}],"15":[{"catchword":null,"tekst":"And the thorn-bush said unto the trees if you in truth anoint king over me come then put your confidence under my shadow but if not let fire go forth out of the thorn bush and consume the Cebars of Libanon [this mountain was very famous for very fair glorious cedar trees being exceeding strong and long lasting which grew in great abundance upon it whereof divers parable and similitudes are taken in scripture see 2Ki 14:9 2Chhronicles 2.8 Psa 29:6 and 92.13 Cant 3.9 and 5.15 Isa 60:13 Jer 22:23 Eze 17:3 and 31.3 Hosiah 14.6,7,8.]"}],"16":[{"catchword":null,"tekst":"So now [Here Jotham expounded the propounded parable] if ye have done it in truth and sincerity that ye have made Abimelech king and if ye have done well by Jerubaal an dby his house and if ye have done him according to the dessert [[or benefit] of his hands."}],"17":[{"catchword":null,"tekst":"for my father fought for ye and he cast his soul [that is spared not his life and persons but adventured or put the same in great danger for your sake] far away [Heb. from over against ye or from near at hand as when a man casts a thing out of his sight far from him asas not willing to look upon it to provide for it or to mind it compare Deu 28:66 and below chapter 12.3] and delivered ye out of the hand of the Medianites."}],"18":[{"catchword":null,"tekst":"But ye risen up this day [that is at this time] against the house of my father and have slay sons seventy men upon one stone [he upbraideth the Sichemites against this murder because they had assisted Abimelech in it see verse 24] and ye have made Abimelech a son of his maidservant [thus he calleth a disdaintful manner his fathers concubines to wet upon the Sichemites the seemliness an dinjustice of their act [king over the citizens of Sichem because he is your brother."}],"19":[{"catchword":null,"tekst":"If ye then have dealt in truth and sincerity with Jerubaal and his house this day then rejoice ye over Abimelech and let him also rejoice over ye."}],"20":[{"catchword":null,"tekst":"But if not then let fire go forth from Abimelech and consume the citizen of Sichem and the house of Millo an dlet fire go forth from the citizens of Sichem and from the house of Millo and consume Abimelech."}],"21":[{"catchword":null,"tekst":"Then Jotham ran away and fled [it seemeth that by this connexion of words which signify one and the same thing is intimateth his celerity and swiftness in fleeing that he might not be overtaken by his brother] and went to beer [where this place lieth is uncertain some do guess that in the tribe of Simeon on the uttermost border of Canaan where are some places that bear the name beer but with some addition] and he dwelt there because of his brother Abimelech."}],"22":[{"catchword":null,"tekst":"Now when Abimelech had reigned three years over Israel."}],"23":[{"catchword":null,"tekst":"Then God sent an evil spirit [this may be understood of an evil angel or Satan as 1Sa 18:9 and 19.9 or of a great disagreement or disaffection dissension which Satan by the just judgment of God stirred up between them compare 1 Samuel 16.14 and 2 Samuel 16 on verse 10 and 24 on verse 1] between Abimelech and between the citizens of Sichemdealt deceitfully towards Abimelech."}],"24":[{"catchword":null,"tekst":"That the violence [that is punish of violence ] e to the sons of Jerubaal [Heb. the violenvce or the cruelty of the seventy sons that is doneo them so o] might come an that their blood might be laid upon Abiech their brother who had slain him and upon the cizens of sicem[Viz. on the head of Abmelech and of the Sichemites these phrases the holy scripture useth to signify the revenge that shall be taken of violence murder and blood shed compare 1Sa 25:39 2Sa 1:16 1Ki 2:31 ,32,33 Est 9:25 Psa 7:17 Jer 51:35 Mat 23:34,35 & 27.25 Act 5:28 & 18.6 &c. see also below verse 56,57] who had strengthened his hands to kill his brethren[that is who had strengthened and assisted Abimelech in his wicked design compare above chapter 7 verse 11.]"}],"25":[{"catchword":null,"tekst":"And the citizens of Sichem set those that lay in wait for him upon the tops [Heb. heads] of the mountains and they robbed all [viz. that were affected to Abimelech] that passed along on the way by them [Sichem lay upon the pass from and towards Jerusalem and the mountains of Gerizim Ebal of the Baal berith Zalmon &c. lay close by it see above verse 7 and below verse 46,48.] and it was told Abimelech."}],"26":[{"catchword":null,"tekst":"Gaal the son of Ebed came also with his brethren and went over into Sachem [leaving their former dwelling place] an the citizens of Sichem relied on him [Viz. Gaal of whom they made use as their head and captain general against Abimelech.]"}],"27":[{"catchword":null,"tekst":"And they went out into the fields and gathered their vineyards and trod the grapes [in token of confidence and wilifying in Abimelech] and made songs of praises [others made good chear as they were wont to do in vintage time] and they went into the house of their god [viz. into the idolatrous temple of Baal berith see above verse 4] and did eat and drink and cursed Abimelech."}],"28":[{"catchword":null,"tekst":"And Gaal the son of Ebed said who is Abimelech? [See the like upbraiding phrase 1Sa 25:10] and what is Sichem? [as if they should say Sichem is to be accounted more excellent and honorable then so as that the Lords and citizens thereof should be servants to this abimelech others who is Sichem? Conceiving it here to be the son of hemor Genesis 34 whom the son of Jacob would not serve but slew him or some of his posterity hearing that name to whom Abimelech as being a tyranny and of mean descent is not to be compared ] that we should serve him? [viz. Abimelech] is he not the son of Jerubaal?[that is of Gideon who was an utter enemy of our God Baal and as a mean man lived in no place of government or authority] and Zebul his chief captain?[who by Abimelech was made governor of Sichem verse 30 and was here present at this time or at least wise in the city verse 36] serve rather men of Hemor the father of Sichem for why should we serve him?[the men of Hemer and see that is that are descended from or were of posterity of Hemor that father of Sichem or those that govern not tyrannically as abimelech but formerly as abimelech did who was esteemed as the father of this city some take it as that if ye must need serve would to God ye might serve Hemor and his posterity but our ancestors would not do that why then should we now serve this Abimelech.]"}],"32":[{"catchword":null,"tekst":"Now therefore get up by night thou and the people that is with thee and lie in wait in the field."}],"33":[{"catchword":null,"tekst":"And be it in the morning when the sun riseth that get up early and fall upon this city and behold if he [viz. Gal] and the people that is with thee came out against thee then do to him according as thy hand shall find [that is so as the opportunity shall offer itself according as the thing shall require and thou shalt find sitting see like signification of this phrase or manner of speaking Leviticus 25 on verse28 1Sa 10:7 & 25.8 Ecc 9:10.]"}],"34":[{"catchword":null,"tekst":"Then Abimelech rose up and all the people that was with by night and they laid wait against sichem with four heaps [Heb. heads so above chapter 7.16 and below verse 43.44]"}],"35":[{"catchword":null,"tekst":"And Gaal the son of Ebed went out and stood at the door or entering of the city gate and Abimelech rose up and all the people that was with him out of the ambush."}],"36":[{"catchword":null,"tekst":"When Gaal saw that people he said unto Zebul Behold there cometh people down from the tops [heb. heads] of the mountains but Zebul said unto him thou seestteh shadow of the mountains for men."}],"37":[{"catchword":null,"tekst":"But Jaal proceeded further to speak and said behold there come people down out of the midst [Heb. the navel a similitude taken from the mans body] often land [otherwise out of the top of the land] and the heap cometh from way of oak Meonenim [or even plain of the stone gazers sooth sayers jugglers.]"}],"38":[{"catchword":null,"tekst":"Then said Zebul unto him where is now thy mouth [that itchy boasting and big speaking] wherewith thou sadist who is Abimelech that we should serve him? Is not this the people thou hast dispised us? Go now out I pray thee and fight with him."}],"39":[{"catchword":null,"tekst":"And Gaal went out before the face of the citizen of Sichem and he fought against Abimelech."}],"40":[{"catchword":null,"tekst":"And Abimelech pursued after for he fled before his face and there fell many slain unto the door of the city gate."}],"41":[{"catchword":null,"tekst":"Now Abimelech abode at Aruma [a city lying southwad of Sichem not far off from the meeting of the led from Jerusalem and Silo to Sichem in the mid way between Silo and sichem] and Zebul thrust out of Gaal and his brethren that they might not dwell in Sichem."}],"42":[{"catchword":null,"tekst":"And it came topazes the next day that the people went to the field and they told it to Abimelech."}],"43":[{"catchword":null,"tekst":"then took the people and divided them into three heaps an he laid wait in the field and he looked an behold the people went out of the city then he rose up against them and he rose them."}],"44":[{"catchword":null,"tekst":"For Abimelech and the heaps or companies [that is one heap of the heaps or troops see below chapter 12 on verse 7] that were with him fell upon them and stood still at the door of the city gate and the two other heaps fell upon all that were in the field an demote them."}],"45":[{"catchword":null,"tekst":"Moreover Abimelech fought against the city that whole day and took the city and slew the people that were therein an he brake down the city and sowed it with salt[intending now fully an to triumph an not imagining what himself deserved he doth this out of pride for a token that Sichem should remain forever barren desolate and inhabitated for an everlasting memorial for an exemplary punishment of this rebellion compare Num 18:19 Deu 21:23 2Ch 13:5 Zeph2.9 but that Sichem was afterwards built and inhabitated appeareth 1Ki 12:1,25.]"}],"48":[{"catchword":null,"tekst":"Therefore Abimelech went up to the mountain Zalmon [which lay on the west side of Sichem see also of this mountain Psa 68:15] be all the people that was with him and Abimelech took an axe [Heb. axes] in his hand and cut down a bough from the trees and took in up and laid it upon his shoulder and he said unto the people that with him what ye have seen me do [otherwise I have done what ye have seen ] make haste do as I [to wit have done.]"}],"49":[{"catchword":null,"tekst":"So all the people likewise cut down every man his bough and followed abimelech and put them to the sword and burned the hold with fire so that also all the people of the tower of Sichem died about a thousand man and women."}],"50":[{"catchword":null,"tekst":"Moreover Abimelech went [imagining that these victories would continually follow him] to Thebez [a city lying north of Sichem between the mountains of Samaria and Gilboa] and he camped himself and took it."}],"51":[{"catchword":null,"tekst":"But there was a strong tower in the midst of the city so all men and women and the citizens of the city fled thither and shut the gate before them and went up to the roof of the tower."}],"52":[{"catchword":null,"tekst":"Then came Abimelch unto the tower and stormed the same [or fought against it] a he approached at the door of the tower to burn the same with fire."}],"53":[{"catchword":null,"tekst":"But a woman cast a piece of millstone [properly the uppermost piece of the millstone which is turned about upon the nether most stone] upon Abimelech head and brake his skull in pieces."}],"54":[{"catchword":null,"tekst":"Then called he hastily the youth that carried his arms and said unto him draw out thy sword and kill me that they may not say of me a woman hath killed him an his youth thrust him and he died."}],"55":[{"catchword":null,"tekst":"Now when the men of Israel [that had held with Abimelech or were of his side] saw that Abimelech was dead they departed everyone of his place."}],"56":[{"catchword":null,"tekst":"Thus God hath caused Abimelech&acirc;&euro;&trade;s wickedness to return [to wit upon Abimelechs head that is rewarded recompensed him see above verse 24] which he had done to his father killing his seventy brethren [his own brethren his father legitimate sons above verse 5 whereas he was but the son of concubines chapter 8.30,31.]"}],"57":[{"catchword":null,"tekst":"likewise all the e function md(t) {  // *cursief* -> <em>, noot [n] -> sup

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const popupCache = {};

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>

</html>
