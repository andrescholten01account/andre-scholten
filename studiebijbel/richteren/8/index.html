dus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen zeiden de mannen van Efraïm tegen hem: Wat is dit voor iets dat u ons hebt aangedaan, dat u ons niet riep toen u wegging om te strijden tegen de Midianieten? En zij verweten hem dat heftig.","2":"Hij daarentegen zei tegen hen: Wat heb ik nu gedaan, vergeleken bij u? Is niet de nalezing van Efraïm beter dan de wijnoogst van Abiëzer?","3":"God heeft de vorsten van de Midianieten, Oreb en Zeëb, in uw hand gegeven; wat heb ik dan kunnen doen, vergeleken bij u? Toen liet hun toorn van hem af, toen hij dit woord sprak.","4":"Toen Gideon nu bij de Jordaan gekomen was, ging hij eroverheen, met de driehonderd mannen die bij hem waren, moe, maar toch nog vervolgend.","5":"En hij zei tegen de mannen van Sukkoth: Geef toch enige broden aan het volk dat mij volgt, want zij zijn moe; en ik jaag Zebah en Tsalmuna, de koningen van de Midianieten, achterna.","6":"Maar de leiders van Sukkoth zeiden: Is de handpalm van Zebah en Tsalmuna dan al in uw hand, dat wij aan uw leger brood zouden geven?","7":"Toen zei Gideon: Daarom, als de HEERE Zebah en Tsalmuna in mijn hand geeft, zal ik uw vlees dorsen met doornen uit de woestijn en met distels.","8":"En hij trok vandaar op naar Pnuël, en sprak hen op dezelfde manier toe. En de mannen van Pnuël antwoordden hem, zoals de mannen van Sukkoth geantwoord hadden.","9":"Daarom sprak hij ook tot de mannen van Pnuël en zei: Als ik in vrede wederkom, zal ik deze toren afbreken.","10":"Zebah nu en Tsalmuna waren in Karkor, en hun legers met hen, ongeveer vijftienduizend man, alles wat er over was van het hele leger van de mensen uit het oosten; en de gesneuvelden waren honderdtwintigduizend man, die het zwaard hanteerden.","11":"En Gideon trok op, de weg van hen die in tenten wonen, ten oosten van Nobah en Jogbeha; en hij versloeg dat leger, want het leger voelde zich veilig.","12":"En Zebah en Tsalmuna vluchtten; maar hij achtervolgde hen, en ving de beide koningen van de Midianieten, Zebah en Tsalmuna, en bracht het hele leger in verwarring.","13":"Toen Gideon, de zoon van Joas, uit de strijd terugkeerde, vóór zonsopgang,","14":"ving hij een jongeman van de mensen van Sukkoth, en ondervroeg hem; die schreef voor hem de leiders van Sukkoth op, en hun oudsten, zevenenzeventig man.","15":"Toen kwam hij bij de mannen van Sukkoth en zei: Zie hier Zebah en Tsalmuna, over wie u mij smadelijk verweten hebt: Is de handpalm van Zebah en Tsalmuna dan al in uw hand, dat wij aan uw mannen, die moe zijn, brood zouden geven?","16":"En hij nam de oudsten van die stad, en doornen uit de woestijn, en distels, en liet het de mannen van Sukkoth daarmee ondervinden.","17":"En de toren van Pnuël brak hij af, en doodde de mannen van de stad.","18":"Daarna zei hij tegen Zebah en Tsalmuna: Wat voor mannen waren het die u bij Tabor gedood hebt? En zij zeiden: Zoals u, zo waren zij, allen leken ze op koningszonen.","19":"Toen zei hij: Het waren mijn broers, zonen van mijn moeder; zo waar de HEERE leeft, als u hen in leven had gelaten, zou ik u niet doden!","20":"En hij zei tegen Jether, zijn eerstgeborene: Sta op, dood hen; maar de jongeman trok zijn zwaard niet, want hij was bang, omdat hij nog een jongeman was.","21":"Toen zeiden Zebah en Tsalmuna: Sta zelf op en val ons aan, want zoals de man is, zo is zijn kracht. Toen stond Gideon op en doodde Zebah en Tsalmuna, en nam de maantjes die aan de halzen van hun kamelen zaten.","22":"Toen zeiden de mannen van Israël tegen Gideon: Heers over ons, zowel u als uw zoon en de zoon van uw zoon, omdat u ons uit de hand van de Midianieten verlost hebt.","23":"Maar Gideon zei tegen hen: Ik zal niet over u heersen; ook mijn zoon zal niet over u heersen; de HEERE zal over u heersen.","24":"Verder zei Gideon tegen hen: Eén ding wil ik van u vragen: geef mij ieder een voorhoofdsieraad uit uw buit; want zij hadden gouden voorhoofdsieraden, omdat zij Ismaëlieten waren.","25":"En zij zeiden: Wij zullen ze graag geven; en zij spreidden een kleed uit, en wierpen daarop ieder een voorhoofdsieraad uit zijn buit.","26":"En het gewicht van de gouden voorhoofdsieraden die hij gevraagd had, was zeventienhonderd *sikkel* goud, behalve de maantjes, en ketens, en purperen kleren die de koningen van de Midianieten gedragen hadden, en behalve de halsbanden die aan de halzen van hun kamelen hadden gezeten.","27":"En Gideon maakte daarvan een efod, en zette die neer in zijn stad, in Ofra; en heel Israël pleegde daar overspel door die na te lopen; en het werd voor Gideon en zijn huis een valstrik.","28":"Zo werden de Midianieten onderworpen voor de ogen van de Israëlieten, en zij durfden hun hoofd niet meer op te heffen. En het land had veertig jaar rust, in de dagen van Gideon.","29":"En Jerubbaäl, de zoon van Joas, ging weg en woonde in zijn huis.","30":"Gideon nu had zeventig zonen, die uit hem waren voortgekomen; want hij had veel vrouwen.","31":"En zijn bijvrouw, die in Sichem woonde, baarde hem ook een zoon; en hij noemde hem Abimelech.","32":"En Gideon, de zoon van Joas, stierf op hoge leeftijd; en hij werd begraven in het graf van zijn vader Joas, in Ofra van de Abiëzrieten.","33":"En het gebeurde, toen Gideon gestorven was, dat de Israëlieten zich weer afkeerden en de Baäls achterna liepen in overspel; en zij namen zich Baäl-Berith tot god.","34":"En de Israëlieten dachten niet meer aan de HEERE, hun God, Die hen gered had uit de hand van al hun vijanden rondom.","35":"En zij bewezen geen goedheid aan het huis van Jerubbaäl, dat is Gideon, ondanks al het goede dat hij voor Israël gedaan had."},"SV":{"1":"Toen zeiden de mannen van Efraïm tot hem: Wat stuk is dit, dat gij ons gedaan hebt, dat gij ons niet riept, toen gij heentoogt om te strijden tegen de Midianieten? En zij twistten sterk met hem.","2":"Hij daarentegen zeide tot hen: Wat heb ik nu gedaan, gelijk gijlieden; zijn niet de nalezingen van Efraïm beter dan de wijnoogst van Abi-ezer?","3":"God heeft de vorsten der Midianieten, Oreb en Zeëb, in uw hand gegeven; wat heb ik dan kunnen doen, gelijk gijlieden? Toen liet hun toorn van hem af, als hij dit woord sprak.","4":"Als nu Gideon gekomen was aan de Jordaan, ging hij over, met de driehonderd mannen, die bij hem waren, zijnde moede, nochtans vervolgende.","5":"En hij zeide tot de lieden van Sukkoth: Geeft toch enige bollen broods aan het volk, dat mijn voetstappen volgt, want zij zijn moede; en ik jaag Zebah en Tsalmuna, de koningen der Midianieten, achterna.","6":"Maar de oversten van Sukkoth zeiden: Is dan de handpalm van Zebah en Tsalmuna alrede in uw hand, dat wij aan uw heir brood zouden geven?","7":"Toen zeide Gideon: Daarom, als de HEERE Zebah en Tsalmuna in mijn hand geeft, zo zal ik uw vlees dorsen met doornen der woestijn, en met distelen.","8":"En hij toog van daar op naar Pnuël, en sprak tot hen desgelijks. En de lieden van Pnuël antwoordden hem, gelijk als de lieden van Sukkoth geantwoord hadden.","9":"Daarom sprak hij ook tot de lieden van Pnuël, zeggende: Als ik met vrede wederkome, zal ik deze toren afwerpen.","10":"Zebah nu en Tsalmuna waren te Karkor, en hun legers met hen, omtrent vijftien duizend, al de overgeblevenen van het ganse leger der kinderen van het oosten; en de gevallenen waren honderd en twintig duizend mannen, die het zwaard uittrokken.","11":"En Gideon toog opwaarts, den weg dergenen, die in tenten wonen, tegen het oosten van Nobah en Jogbeha; en hij sloeg dat leger, want het leger was zorgeloos.","12":"En Zebah en Tsalmuna vloden; doch hij jaagde hen na; en hij ving de beide koningen der Midianieten, Zebah en Tsalmuna, en verschrikte het ganse leger.","13":"Toen nu Gideon, de zoon van Joas, van den strijd wederkwam, voor den opgang der zon,","14":"Zo ving hij een jongen van de lieden te Sukkoth, en ondervraagde hem; die schreef hem op de oversten van Sukkoth, en hun oudsten, zeven en zeventig mannen.","15":"Toen kwam hij tot de lieden van Sukkoth, en zeide: Ziet daar Zebah en Tsalmuna, van dewelke gij mij smadelijk verweten hebt, zeggende: Is de handpalm van Zebah en Tsalmuna alrede in uw hand, dat wij aan uw mannen, die moede zijn, brood zouden geven?","16":"En hij nam de oudsten dier stad, en doornen der woestijn, en distelen, en deed het den lieden van Sukkoth door dezelve verstaan.","17":"En den toren van Pnuël wierp hij af, en doodde de lieden der stad.","18":"Daarna zeide hij tot Zebah en Tsalmuna: Wat waren het voor mannen, die gij te Thabor doodsloegt? En zij zeiden: Gelijk gij, alzo waren zij, enerlei, van gedaante als koningszonen.","19":"Toen zeide hij: Het waren mijn broeders, zonen mijner moeder; *zo* *waarlijk* *als* de HEERE leeft, zo gij hen hadt laten leven, ik zou ulieden niet doden!","20":"En hij zeide tot Jether, zijn eerstgeborene: Sta op, dood hen; maar de jongeling trok zijn zwaard niet uit, want hij vreesde, dewijl hij nog een jongeling was.","21":"Toen zeiden Zebah en Tsalmuna: Sta gij op, en val op ons aan, want naar dat de man is, zo is zijn macht. Zo stond Gideon op, en doodde Zebah en Tsalmuna, en nam de maantjes, die aan de halzen hunner kemelen waren.","22":"Toen zeiden de mannen van Israël tot Gideon: Heers over ons, zo gij als uw zoon en uws zoons zoon, dewijl gij ons van der Midianieten hand verlost hebt.","23":"Maar Gideon zeide tot hen: Ik zal over u niet heersen; ook zal mijn zoon over u niet heersen; de HEERE zal over u heersen.","24":"Voorts zeide Gideon tot hen: Een begeerte zal ik van u begeren: geeft mij maar een iegelijk een voorhoofdsiersel van zijn roof; want zij hadden gouden voorhoofdsierselen gehad, dewijl zij Ismaëlieten waren.","25":"En zij zeiden: Wij zullen ze gaarne geven; en zij spreidden een kleed uit, en wierpen daarop een iegelijk een voorhoofdsiersel van zijn roof.","26":"En het gewicht der gouden voorhoofdsierselen, die hij begeerd had, was duizend en zevenhonderd *sikkelen* gouds, zonder de maantjes, en ketenen, en purperen klederen, die de koningen der Midianieten aangehad hadden, en zonder de halsbanden, die aan de halzen hunner kemelen geweest waren.","27":"En Gideon maakte daarvan een efod, en stelde die in zijn stad, te Ofra; en gans Israël hoereerde aldaar denzelven na; en het werd Gideon en zijn huis tot een valstrik.","28":"Alzo werden de Midianieten te ondergebracht voor het aangezicht der kinderen Israëls, en hieven hun hoofd niet meer op. En het land was stil veertig jaren, in de dagen van Gideon.","29":"En Jerubbaäl, de zoon van Joas, ging henen en woonde in zijn huis.","30":"Gideon nu had zeventig zonen, die uit zijn heupe voortgekomen waren; want hij had vele vrouwen.","31":"En zijn bijwijf, hetwelk te Sichem was, baarde hem ook een zoon; en hij noemde zijn naam Abimelech.","32":"En Gideon, de zoon van Joas, stierf in goeden ouderdom; en hij werd begraven in het graf van zijn vader Joas, te Ofra, des Abi-ezriets.","33":"En het geschiedde, als Gideon gestorven was, dat de kinderen Israëls zich omkeerden, en de Baäls nahoereerden; en zij stelden zich Baäl-berith tot een God.","34":"En de kinderen Israëls dachten niet aan den HEERE, hun God, Die hen gered had van de hand van al hun vijanden van rondom.","35":"En zij deden geen weldadigheid bij het huis van Jerubbaäl, *dat* *is* Gideon, naar al het goede, dat hij bij Israël gedaan had."},"KJV":{"1":"And the men of Ephraim said unto him, Why hast thou served us thus, that thou calledst us not, when thou wentest to fight with the Midianites? And they did chide with him sharply.","2":"And he said unto them, What have I done now in comparison of you? *Is* not the gleaning of the grapes of Ephraim better than the vintage of Abiezer?","3":"God hath delivered into your hands the princes of Midian, Oreb and Zeeb: and what was I able to do in comparison of you? Then their anger was abated toward him, when he had said that.","4":"And Gideon came to Jordan, *and* passed over, he, and the three hundred men that *were* with him, faint, yet pursuing","5":"And he said unto the men of Succoth, Give, I pray you, loaves of bread unto the people that follow me; for they *be* faint, and I am pursuing after Zebah and Zalmunna, kings of Midian.","6":"And the princes of Succoth said, *Are* the hands of Zebah and Zalmunna now in thine hand, that we should give bread unto thine army?","7":"And Gideon said, Therefore when the LORD hath delivered Zebah and Zalmunna into mine hand, then I will tear your flesh with the thorns of the wilderness and with briers.","8":"And he went up thence to Penuel, and spake unto them likewise: and the men of Penuel answered him as the men of Succoth had answered","9":"And he spake also unto the men of Penuel, saying, When I come again in peace, I will break down this tower.","10":"Now Zebah and Zalmunna *were* in Karkor, and their hosts with them, about fifteen thousand *men*, all that were left of all the hosts of the children of the east: for there fell an hundred and twenty thousand men that drew sword.","11":"And Gideon went up by the way of them that dwelt in tents on the east of Nobah and Jogbehah, and smote the host: for the host was secure.","12":"And when Zebah and Zalmunna fled, he pursued after them, and took the two kings of Midian, Zebah and Zalmunna, and discomfited all the host.","13":"And Gideon the son of Joash returned from battle before the sun","14":"And caught a young man of the men of Succoth, and enquired of him: and he described unto him the princes of Succoth, and the elders thereof, *even* threescore and seventeen men.","15":"And he came unto the men of Succoth, and said, Behold Zebah and Zalmunna, with whom ye did upbraid me, saying, *Are* the hands of Zebah and Zalmunna now in thine hand, that we should give bread unto thy men *that are* weary?","16":"And he took the elders of the city, and thorns of the wilderness and briers, and with them he taught the men of Succoth.","17":"And he beat down the tower of Penuel, and slew the men of the city.","18":"Then said he unto Zebah and Zalmunna, What manner of men *were they* whom ye slew at Tabor? And they answered, As thou *art*, so *were* they; each one resembled the children of a king.","19":"And he said, They *were* my brethren, *even* the sons of my mother: *as* the LORD liveth, if ye had saved them alive, I would not slay","20":"And he said unto Jether his firstborn, Up, *and* slay them. But the youth drew not his sword: for he feared, because he *was* yet a youth.","21":"Then Zebah and Zalmunna said, Rise thou, and fall upon us: for as the man *is, so is* his strength. And Gideon arose, and slew Zebah and Zalmunna, and took away the ornaments that *were* on their camels' necks.","22":"Then the men of Israel said unto Gideon, Rule thou over us, both thou, and thy son, and thy son's son also: for thou hast delivered us from the hand of Midian.","23":"And Gideon said unto them, I will not rule over you, neither shall my son rule over you: the LORD shall rule","24":"And Gideon said unto them, I would desire a request of you, that ye would give me every man the earrings of his prey. (For they had golden earrings, because they *were* Ishmaelites.)","25":"And they answered, We will willingly give *them*. And they spread a garment, and did cast therein every man the earrings of his prey.","26":"And the weight of the golden earrings that he requested was a thousand and seven hundred *shekels* of gold; beside ornaments, and collars, and purple raiment that *was* on the kings of Midian, and beside the chains that *were* about their camels' necks.","27":"And Gideon made an ephod thereof, and put it in his city, *even* in Ophrah: and all Israel went thither a whoring after it: which thing became a snare unto Gideon, and to his house.","28":"Thus was Midian subdued before the children of Israel, so that they lifted up their heads no more. And the country was in quietness forty years in the days of Gideon.","29":"And Jerubbaal the son of Joash went and dwelt in his own house.","30":"And Gideon had threescore and ten sons of his body begotten: for he had many wives.","31":"And his concubine that *was* in Shechem, she also bare him a son, whose name he called Abimelech.","32":"And Gideon the son of Joash died in a good old age, and was buried in the sepulchre of Joash his father, in Ophrah of the Abiezrites.","33":"And it came to pass, as soon as Gideon was dead, that the children of Israel turned again, and went a whoring after Baalim, and made Baalberith their god.","34":"And the children of Israel remembered not the LORD their God, who had delivered them out of the hands of all their enemies on every side:","35":"Neither shewed they kindness to the house of Jerubbaal, *namely*, Gideon, according to all the goodness which he had shewed unto Israel."}},"tsk":{"1":[{"kopje":"de mannen","refs":["Richt 12:1-6","2 Sam 19:41","Job 5:2","Pred 4:4","Jak 4:5","Jak 4:6"]}],"2":[{"kopje":"Wat","refs":["1 Kor 13:4-7","Gal 5:14","Gal 5:15","F 378\">chide</span> with him sharply.","2":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, What have I <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> now in comparison of you? Is not the <span class=\"wl wl-kjv\" data-code=\"H5955\">gleaning</span> of the grapes of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> than the <span class=\"wl wl-kjv\" data-code=\"H1210\">vintage</span> of Abiezer?","3":"<span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into your <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> <span class=\"wl wl-kjv\" data-code=\"H6159\">Oreb</span> and <span class=\"wl wl-kjv\" data-code=\"H2062\">Zeeb:</span> and what was I <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> in comparison of you? Then their <span class=\"wl wl-kjv\" data-code=\"H7307\">anger</span> was <span class=\"wl wl-kjv\" data-code=\"H7503\">abated</span> toward him, when he had <span class=\"wl wl-kjv\" data-code=\"H1697\">said</span> that.","4":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> and passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over,</span> he, and the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that were with him, <span class=\"wl wl-kjv\" data-code=\"H5889\">faint,</span> yet pursuing","5":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H5523\">Succoth,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give,</span> I pray you, <span class=\"wl wl-kjv\" data-code=\"H3603\">loaves</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H7272\">follow</span> me; for they be <span class=\"wl wl-kjv\" data-code=\"H5889\">faint,</span> and I am <span class=\"wl wl-kjv\" data-code=\"H7291\">pursuing</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H2078\">Zebah</span> and <span class=\"wl wl-kjv\" data-code=\"H6759\">Zalmunna,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of Midian.","6":"And the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H5523\">Succoth</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Are the <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> of <span class=\"wl wl-kjv\" data-code=\"H2078\">Zebah</span> and <span class=\"wl wl-kjv\" data-code=\"H6759\">Zalmunna</span> now in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> that we should <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> unto thine army?","7":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Therefore when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> <span class=\"wl wl-kjv\" data-code=\"H2078\">Zebah</span> and <span class=\"wl wl-kjv\" data-code=\"H6759\">Zalmunna</span> into mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> then I will <span class=\"wl wl-kjv\" data-code=\"H1758\">tear</span> your <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> with the <span class=\"wl wl-kjv\" data-code=\"H6975\">thorns</span> of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> and with briers.","8":"And he went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> thence to <span class=\"wl wl-kjv\" data-code=\"H6439\">Penuel,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto them <span class=\"wl wl-kjv\" data-code=\"H2063\">likewise:</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H6439\">Penuel</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> him as the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H5523\">Succoth</span> had answered","9":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> also unto the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H6439\">Penuel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> When I come <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> I will break <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> this tower.","10":"Now <span class=\"wl wl-kjv\" data-code=\"H2078\">Zebah</span> and <span class=\"wl wl-kjv\" data-code=\"H6759\">Zalmunna</span> were in <span class=\"wl wl-kjv\" data-code=\"H7174\">Karkor,</span> and their <span class=\"wl wl-kjv\" data-code=\"H4264\">hosts</span> with them, about <span class=\"wl wl-kjv\" data-code=\"H2568\">fifteen</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> men, all that were <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> of all the <span class=\"wl wl-kjv\" data-code=\"H4264\">hosts</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H6924\">east:</span> for there <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H8025\">drew</span> sword.","11":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of them that <span class=\"wl wl-kjv\" data-code=\"H7931\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H168\">tents</span> on the <span class=\"wl wl-kjv\" data-code=\"H6924\">east</span> of <span class=\"wl wl-kjv\" data-code=\"H5025\">Nobah</span> and <span class=\"wl wl-kjv\" data-code=\"H3011\">Jogbehah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> was secure.","12":"And when <span class=\"wl wl-kjv\" data-code=\"H2078\">Zebah</span> and <span class=\"wl wl-kjv\" data-code=\"H6759\">Zalmunna</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled,</span> he <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them, and <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> <span class=\"wl wl-kjv\" data-code=\"H2078\">Zebah</span> and <span class=\"wl wl-kjv\" data-code=\"H6759\">Zalmunna,</span> and <span class=\"wl wl-kjv\" data-code=\"H2729\">discomfited</span> all the host.","13":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> from <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> <span class=\"wl wl-kjv\" data-code=\"H4608\">before</span> the sun","14":"And <span class=\"wl wl-kjv\" data-code=\"H3920\">caught</span> a young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H5523\">Succoth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7592\">enquired</span> of him: and he <span class=\"wl wl-kjv\" data-code=\"H3789\">described</span> unto him the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H5523\">Succoth,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> thereof, even threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">seventeen</span> men.","15":"And he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H5523\">Succoth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold <span class=\"wl wl-kjv\" data-code=\"H2078\">Zebah</span> and <span class=\"wl wl-kjv\" data-code=\"H6759\">Zalmunna,</span> with whom ye did <span class=\"wl wl-kjv\" data-code=\"H2778\">upbraid</span> me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Are the <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> of <span class=\"wl wl-kjv\" data-code=\"H2078\">Zebah</span> and <span class=\"wl wl-kjv\" data-code=\"H6759\">Zalmunna</span> now in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> that we should <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that are weary?","16":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H6975\">thorns</span> of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> and <span class=\"wl wl-kjv\" data-code=\"H1303\">briers,</span> and with them he <span class=\"wl wl-kjv\" data-code=\"H3045\">taught</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of Succoth.","17":"And he beat <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> of <span class=\"wl wl-kjv\" data-code=\"H6439\">Penuel,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the city.","18":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> he unto <span class=\"wl wl-kjv\" data-code=\"H2078\">Zebah</span> and <span class=\"wl wl-kjv\" data-code=\"H6759\">Zalmunna,</span> <span class=\"wl wl-kjv\" data-code=\"H375\">What</span> manner of <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were they whom ye <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> at <span class=\"wl wl-kjv\" data-code=\"H8396\">Tabor?</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> As <span class=\"wl wl-kjv\" data-code=\"H3644\">thou</span> art, so were they; each <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8389\">resembled</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of a king.","19":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> They were my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> even the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of my <span class=\"wl wl-kjv\" data-code=\"H517\">mother:</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> <span class=\"wl wl-kjv\" data-code=\"H3863\">if</span> ye had saved them <span class=\"wl wl-kjv\" data-code=\"H2421\">alive,</span> I would not slay","20":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3500\">Jether</span> his <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Up,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> them. But the <span class=\"wl wl-kjv\" data-code=\"H5288\">youth</span> <span class=\"wl wl-kjv\" data-code=\"H8025\">drew</span> not his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> for he <span class=\"wl wl-kjv\" data-code=\"H3372\">feared,</span> because he was yet a youth.","21":"Then <span class=\"wl wl-kjv\" data-code=\"H2078\">Zebah</span> and <span class=\"wl wl-kjv\" data-code=\"H6759\">Zalmunna</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Rise</span> thou, and <span class=\"wl wl-kjv\" data-code=\"H6293\">fall</span> upon us: for as the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> is, so is his <span class=\"wl wl-kjv\" data-code=\"H1369\">strength.</span> And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H2078\">Zebah</span> and <span class=\"wl wl-kjv\" data-code=\"H6759\">Zalmunna,</span> and took <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H7720\">ornaments</span> that were on their <span class=\"wl wl-kjv\" data-code=\"H1581\">camels'</span> necks.","22":"Then the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> <span class=\"wl wl-kjv\" data-code=\"H4910\">Rule</span> thou over us, both thou, and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> also: for thou hast <span class=\"wl wl-kjv\" data-code=\"H3467\">delivered</span> us from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of Midian.","23":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, I will not <span class=\"wl wl-kjv\" data-code=\"H4910\">rule</span> over you, neither shall my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4910\">rule</span> over you: the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall rule","24":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, I would <span class=\"wl wl-kjv\" data-code=\"H7592\">desire</span> a <span class=\"wl wl-kjv\" data-code=\"H7596\">request</span> of you, that ye would <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> the <span class=\"wl wl-kjv\" data-code=\"H5141\">earrings</span> of his <span class=\"wl wl-kjv\" data-code=\"H7998\">prey.</span> (For they had <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H5141\">earrings,</span> because they were Ishmaelites.)","25":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> We will <span class=\"wl wl-kjv\" data-code=\"H5414\">willingly</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them. And they <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> a <span class=\"wl wl-kjv\" data-code=\"H8071\">garment,</span> and did <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> therein every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> the <span class=\"wl wl-kjv\" data-code=\"H5141\">earrings</span> of his prey.","26":"And the <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> of the <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H5141\">earrings</span> that he <span class=\"wl wl-kjv\" data-code=\"H7592\">requested</span> was a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> shekels of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold;</span> beside <span class=\"wl wl-kjv\" data-code=\"H7720\">ornaments,</span> and <span class=\"wl wl-kjv\" data-code=\"H5188\">collars,</span> and <span class=\"wl wl-kjv\" data-code=\"H713\">purple</span> <span class=\"wl wl-kjv\" data-code=\"H899\">raiment</span> that was on the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> and beside the <span class=\"wl wl-kjv\" data-code=\"H6060\">chains</span> that were about their <span class=\"wl wl-kjv\" data-code=\"H1581\">camels'</span> necks.","27":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> an <span class=\"wl wl-kjv\" data-code=\"H646\">ephod</span> thereof, and <span class=\"wl wl-kjv\" data-code=\"H3322\">put</span> it in his <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> even in <span class=\"wl wl-kjv\" data-code=\"H6084\">Ophrah:</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went thither a <span class=\"wl wl-kjv\" data-code=\"H2181\">whoring</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> it: which thing became a <span class=\"wl wl-kjv\" data-code=\"H4170\">snare</span> unto <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> and to his house.","28":"Thus was <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian</span> <span class=\"wl wl-kjv\" data-code=\"H3665\">subdued</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> so that they lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> no <span class=\"wl wl-kjv\" data-code=\"H3254\">more.</span> And the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> was in <span class=\"wl wl-kjv\" data-code=\"H8252\">quietness</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of Gideon.","29":"And <span class=\"wl wl-kjv\" data-code=\"H3378\">Jerubbaal</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in his own house.","30":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> had threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of his <span class=\"wl wl-kjv\" data-code=\"H3409\">body</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">begotten:</span> for he had <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> wives.","31":"And his <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine</span> that was in <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem,</span> she also <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> him a <span class=\"wl wl-kjv\" data-c jn voeten is; dat is, mijn voetstappen volgt, of in mijn dienst, onder mijn beleid is. Vergelijk Exo 11:8."}],"6":[{"catchword":"zeiden","tekst":"Hebreeuws, zeide; te weten, een ieder van hen, of een, als president, uit aller naam."},{"catchword":"Is dan de handpalm van Zebah en Tsalmuna","tekst":"Dat is, hebt gij reeds hun macht in uw geweld? Zij weigeren niet alleen Gideons verzoek, maar verachten en bespotten hem daarenboven, als een, die zich te vroeg als victorieus gedraagt, roepende haring [zoals men zegt] eer hij gevangen is. Zij menen dat het anders zal uitvallen, en willen daarom met Gideon niet te doen hebben."}],"7":[{"catchword":"vlees dorsen","tekst":"Dat is, uw lichamen; straffende uw ontrouw en bespotting op een bijzondere wijze, die u tot smaad en spot zal strekken."},{"catchword":"woestijn,","tekst":"Die tussen Sukkoth en Pnuel gelegen was, bij de beek Jabbok, die Jakob passeerde toen hij met God geworsteld en tevoren de heirlegers der engelen gezien, en van die plaats gezegd had: dit is Gods veld, noemende de plaats Mahanaïm; dat is, twee heiren; Gen 32:1-2, Gen 32:22, Gen 32:24. Hiervan wordt deze woestijn [als dichtbij gelegen] genoemd de woestijn van Mahanaïm, uit 2Sa 17:27, 2Sa 17:29."}],"8":[{"catchword":"Pnuël,","tekst":"Zie Gen 32:30, en 1Ki 12:25."},{"catchword":"hen desgelijks","tekst":"Die van Pnuel."}],"9":[{"catchword":"toren afwerpen","tekst":"Op welken zij zich, als een vastigheid, mogen hebben verlaten, en daarom te trotser gesproken."}],"10":[{"catchword":"gevallenen","tekst":"Die tevoren omgekomen waren."},{"catchword":"uittrokken","tekst":"Hebreeuws, uittrok; dat is, ieder van hen was tot den krijg bekwaam geweest. Dit dient tot merkelijke vergroting van Gideons victorie. Zie ook deze manier van spreken van het uittrekken des zwaards, onder, Jdg 20:15, Jdg 20:17, Jdg 20:25, Jdg 20:46; 2Sa 24:9; 2Ki 3:26, enz."}],"11":[{"catchword":"tenten wonen,","tekst":"Te weten, der Arabieren, die daarvan Scenitae genoemd zijn, alsof men zeide // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;

  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
