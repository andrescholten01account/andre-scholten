: "En Jeftha zei tegen hen: Ik en mijn volk waren in hevige strijd met de kinderen van Ammon; en ik heb u geroepen, maar u hebt mij niet uit hun hand verlost.", "3": "Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "4": "En Jeftha verzamelde alle mannen van Gilead, en streed met Efraïm; en de mannen van Gilead versloegen Efraïm, want de Gileadieten zeiden: U bent vluchtelingen van Efraïm, [wonend] tussen Efraïm en tussen Manasse.", "5": "Want de Gileadieten namen de Efraïmieten de doorwaadbare plaatsen van de Jordaan af; en het gebeurde, toen de vluchtelingen van Efraïm zeiden: Laat mij oversteken, dat de mannen van Gilead tegen hem zeiden: Bent u een Efraïmiet? En wanneer hij zei: Nee;", "6": "dan zeiden zij tegen hem: Zeg dan Schibboleth; maar hij zei: Sibbolet, en kon het zo niet goed uitspreken; dan grepen zij hem en doodden hem bij de doorwaadbare plaatsen van de Jordaan, zodat er in die tijd van Efraïm tweeënveertigduizend vielen.", "7": "Jeftha nu richtte Israël zes jaren; en Jeftha, de Gileadiet, stierf, en werd begraven in de steden van Gilead.", "8": "En na hem richtte Ebzan uit Bethlehem Israël.", "9": "En hij had dertig zonen; en hij zond dertig dochters naar buiten, en bracht dertig dochters van buiten binnen voor zijn zonen; en hij richtte Israël zeven jaren.", "10": "Toen stierf Ebzan, en werd begraven te Bethlehem.", "11": "En na hem richtte Elon, de Zebuloniet, Israël, en hij richtte Israël tien jaren.", "12": "En Elon, de Zebuloniet, stierf, en werd begraven te Ajalon, in het land van Zebulon.", "13": "En na hem richtte Abdon, een zoon van Hillel, de Pirhathoniet, Israël.", "14": "En hij had veertig zonen, en dertig kleinzonen, die op zeventig ezelsveulens reden; en hij richtte Israël acht jaren.", "15": "Toen stierf Abdon, een zoon van Hillel, de Pirhathoniet; en hij werd begraven te Pirhathon, in het land van Efraïm, op de berg van de Amalekiet."}, "SV": {"1": "Toen werden de mannen van Efraïm bijeengeroepen, en trokken over naar het noorden; en zij zeiden tot Jeftha: Waarom zijt gij doorgetogen om te strijden tegen de kinderen Ammons, en hebt ons niet geroepen, om met u te gaan? wij zullen uw huis met u met vuur verbranden.", "2": "En Jeftha zeide tot hen: Ik en mijn volk waren zeer twistig met de kinderen Ammons; en ik heb ulieden geroepen, maar gij hebt mij uit hun hand niet verlost.", "3": "Als ik nu zag, dat gij niet verlostet, zo stelde ik mijn ziel in mijn hand, en toog door tot de kinderen Ammons, en de HEERE gaf hen in mijn hand; waarom zijt gij dan te dezen dage tot mij opgekomen, om tegen mij te strijden?", "4": "En Jeftha vergaderde alle mannen van Gilead, en streed met Efraïm; en de mannen van Gilead sloegen Efraïm, want de Gileadieten, zijnde tussen Efraïm *en* tussen Manasse, zeiden: Gijlieden zijt vluchtelingen van Efraïm.", "5": "want de Gileadieten namen den Efraïmieten de veren van de Jordaan af; en het geschiedde, als de vluchtelingen van Efraïm zeiden: Laat mij overgaan; zo zeiden de mannen van Gilead tot hem: Zijt gij een Efraïmiet? wanneer hij zeide: Neen;", "6": "Zo zeiden zij tot hem: Zeg nu Schibboleth; maar hij zeide: Sibbolet, en kon het alzo niet recht spreken; zo grepen zij hem, en versloegen hem aan de veren van de Jordaan, dat te dier tijd van Efraïm vielen twee en veertig duizend.", "7": "Jeftha nu richtte Israël zes jaren; en Jeftha, de Gileadiet, stierf, en werd begraven in de steden van Gilead.", "8": "En na hem richtte Israël Ebzan, van Bethlehem.", "9": "En hij had dertig zonen; en hij zond dertig dochteren naar buiten, en bracht dertig dochteren van buiten in voor zijn zonen; en hij richtte Israël zeven jaren.", "10": "Toen stierf Ebzan, en werd begraven te Bethlehem.", "11": "En na hem richtte Israël Elon, de Zebuloniet, en hij richtte Israël tien jaren.", "12": "En Elon, de Zebuloniet, stierf, en werd begraven te Ajalon, in het land van Zebulon.", "13": "En na hem richtte Israël Abdon, een zoon van Hillel, de Pirhathoniet.", "14": "En hij had veertig zonen, en dertig zoons zonen, rijdende op zeventig ezelveulens; en hij richtte Israël acht jaren.", "15": "Toen stierf Abdon, een zoon van Hillel, de Pirhathoniet; en hij werd begraven te Pirhathon, in het land van Efraïm, op den berg van den Amalekiet."}, "KJV": {"1": "And the men of Ephraim gathered themselves together, and went northward, and said unto Jephthah, Wherefore passedst thou over to fight against the children of Ammon, and didst not call us to go with thee? we will burn thine house upon thee with fire.", "2": "And Jephthah said unto them, I and my people were at great strife with the children of Ammon; and when I called you, ye delivered me not out of their hands.", "3": "And when I saw that ye delivered *me* not, I put my life in my hands, and passed over against the children of Ammon, and the LORD delivered them into my hand: wherefore then are ye come up unto me this day, to fight", "4": "Then Jephthah gathered together all the men of Gilead, and fought with Ephraim: and the men of Gilead smote Ephraim, because they said, Ye Gileadites *are* fugitives of Ephraim among the Ephraimites, *and* among the Manassites.", "5": "And the Gileadites took the passages of Jordan before the Ephraimites: and it was *so*, that when those Ephraimites which were escaped said, Let me go over; that the men of Gilead said unto him, *Art* thou an Ephraimite? If he said,", "6": "Then said they unto him, Say now Shibboleth: and he said Sibboleth: for he could not frame to pronounce *it* right. Then they took him, and slew him at the passages of Jordan: and there fell at that time of the Ephraimites forty and two thousand.", "7": "And Jephthah judged Israel six years. Then died Jephthah the Gileadite, and was buried in *one of* the cities of Gilead.", "8": "And after him Ibzan of Bethlehem judged Israel.", "9": "And he had thirty sons, and thirty daughters, *whom* he sent abroad, and took in thirty daughters from abroad for his sons. And he judged Israel seven years.", "10": "Then died Ibzan, and was buried at Bethlehem.", "11": "And after him Elon, a Zebulonite, judged Israel; and he judged Israel ten years.", "12": "And Elon the Zebulonite died, and was buried in Aijalon in the country of Zebulun.", "13": "And after him Abdon the son of Hillel, a Pirathonite, judged Israel.", "14": "And he had forty sons and thirty nephews, that rode on threescore and ten ass colts: and he judged Israel eight years.", "15": "And Abdon the son of Hillel the Pirathonite died, and was buried in Pirathon in the land of Ephraim, in the mount of the Amalekites."}}, "tsk": {"1": [{"kopje": "Waarom", "refs": ["Richt 8:1", "2 Sam 19:41-43", "Ps 109:4", "Pred 4:4", "Joh 10:32"]}, {"kopje": "zullen ... verbranden", "refs": ["Richt 14:15", "Richt 15:6", "Spr 27:3", "Spr 27:4", "Jak 3:16", "Jak 4:1", "Jak 4:2"]}], "2": [{"kopje": "Ik en mijn volk", "refs": ["Richt 11:12-33"]}], "3": [{"kopje": "zette", "refs": ["Richt 9:17", "1 Sam 19:5", "1 Sam 28:21", "Job 13:14", "Ps 119:109", "Rom 16:4", "Openb 12:11"]}, {"kopje": "waarom", "refs": ["Richt 11:27", "2 Kron 13:12"]}], "4": [{"kopje": "en de mannen", "refs": ["Richt 11:10", "Num 32:39", "Num 32:40", "Deut 3:12-17"]}, {"kopje": "vluchtelingen", "refs": ["1 Sam 25:10", "Neh 4:4", "Ps 78:9", "Spr 12:13", "Spr 15:1"]}], "6": [{"kopje": "Zeg dan", "refs": ["Matt 26:73", "Mark 14:70"]}, {"kopje": "Schibboleth", "refs": ["Ps 69:3", "Ps 69:16", "Jes 27:12", "Job 24:24", "Ex 6:5"]}, {"kopje": "vielen", "refs": ["Spr 17:14", "Spr 18:19", "Pred 10:12", "Matt 12:25", "Gal 5:15"]}, {"kopje": "tweeënveertigduizend", "refs": ["Num 26:37"]}], "8": [{"kopje": "Bethlehem", "refs": ["Gen 15:19", "1 Sam 16:1", "Micha 5:1", "Matt 2:1"]}], "12": [{"kopje": "Ajalon", "refs": ["Joz 19:42", "1 Kron 6:69", "1 Kron 8:13"]}], "14": [{"kopje": "reden", "refs": ["Richt 5:10", "Richt 10:4"]} ht 5:14", "svLabel": null}, {"disp": "Richt 12:15", "href": "../../richteren/12/#v15", "ref": "Richt 12:15", "svLabel": null}], "kinderen": []}]}, {"topic": "Mountains", "href": "../../torrey/m/#t-mountains", "kinderen": [{"label": "Mentioned In Scripture", "href": "../../torrey/m/?hl=Judg.12.15#i13498", "refs": [], "kinderen": [{"label": "Amalek", "href": "../../torrey/m/?hl=Judg.12.15#i13501", "refs": [{"disp": "Richt 12:15", "href": "../../richteren/12/#v15", "ref": "Richt 12:15", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Mark 14:70": "Maar hij ontkende het weer. En kort daarna zeiden zij die daarbij stonden weer tegen Petrus: Werkelijk, u bent een van hen; want u bent ook een Galileeër, en uw spraak lijkt erop.", "Richt 12:1-6": "Toen werden de mannen van Efraïm bijeengeroepen, en zij trokken naar het noorden; en zij zeiden tegen Jeftha: Waarom bent u doorgetrokken om te strijden tegen de kinderen van Ammon, en hebt u ons niet geroepen om met u mee te gaan? Wij zullen uw huis boven u met vuur verbranden. En Jeftha zei tegen hen: Ik en mijn volk waren in hevige strijd met de kinderen van Ammon; en ik heb u geroepen, maar u hebt mij niet uit hun hand verlost. Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "Jak 4:1": "Waar komen strijd en ruzies onder u vandaan? Komen ze niet hieruit voort, namelijk uit uw lusten, die in uw leden strijd voeren?", "1 Kon 14:30": "En er was oorlog tussen Rehabeam en Jerobeam, al hun dagen.", "1 Kron 11:31": "Ithai, de zoon van Ribai, uit Gibea van de kinderen van Benjamin; Benaja, de Pirhathoniet;", "Jes 19:2": "Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, zodat zij zullen strijden, ieder tegen zijn broeder, en ieder tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk.", "Richt 3:28": "En hij zei tegen hen: Volg mij na; want de HEERE heeft uw vijanden, de Moabieten, in uw hand gegeven. En zij trokken af, hem na, en namen de doorwaadbare plaatsen van de Jordaan in naar Moab, en lieten niemand oversteken.", "2 Kron 26:8": "En de Ammonieten gaven Uzzia geschenken; en zijn naam ging tot aan de ingang van Egypte, want hij sterkte zich tot het uiterste.", "Richt 14:15": "Daarna gebeurde het op de zevende dag, dat zij tegen de vrouw van Simson zeiden: Overreed uw man, dat hij ons dat raadsel verklaart, opdat wij niet misschien u en het huis van uw vader met vuur verbranden. Hebt u ons genodigd om ons van ons bezit te beroven? Is het zo niet?", "Jes 27:12": "En het zal op die dag gebeuren, dat de HEERE zal dorsen, van de stroom van de rivier af tot aan de rivier van Egypte; maar u zult opgeraapt worden, één voor één, o kinderen van Israël!", "2 Sam 2:29": "Abner dan en zijn mannen gingen diezelfde hele nacht over de vlakte; en zij gingen over de Jordaan en trokken heel Bithron door, en kwamen bij Mahanaim.", "Richt 10:9": "Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "2 Sam 3:1": "Er was een lange oorlog tussen het huis van Saul en het huis van David. Maar David werd steeds sterker, terwijl het huis van Saul steeds zwakker werd.", "Gal 5:15": "Maar als u elkaar bijt en verslindt, kijk dan uit dat u niet door elkaar verteerd wordt.", "1 Kron 19:17": "Toen dit aan David werd bericht, verzamelde hij heel Israël, en trok over de Jordaan, en kwam tot hen, en stelde de slagorde tegen hen op. Toen David de slagorde tegen de Syriërs opgesteld had, streden zij met hem.", "Richt 11:32": "Zo trok Jeftha door naar de kinderen van Ammon, om tegen hen te strijden; en de HEERE gaf hen in zijn hand.", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "1 Sam 19:5": "Want hij heeft zijn leven gewaagd, en hij heeft de Filistijn geslagen, en de HEERE heeft een grote overwinning aan heel Israël gegeven; u hebt het gezien, en u bent verblijd geweest; waarom zou u dan tegen onschuldig bloed zondigen, David zonder reden doden?", "2 Sam 8:12": "van Syrië, en van Moab, en van de kinderen van Ammon, en van de Filistijnen, en van Amalek, en van de buit van Hadad-Ezer, de zoon van Rechob, de koning van Zoba.", "1 Kron 18:11": "Deze heiligde koning David ook aan de HEERE, met het zilver en het goud dat hij had meegebracht van alle heidenvolken: van de Edomieten, en van de Moabieten, en van de kinderen van Ammon, en van de Filistijnen, en van de Amalekieten.", "1 Sam 25:10": "En Nabal antwoordde de knechten van David en zei: Wie is David, en wie is de zoon van Isaï? Er zijn tegenwoordig veel knechten die zich losscheuren, ieder van zijn heer.", "Joz 2:7": "Die mannen dan achtervolgden hen op de weg naar de Jordaan, tot aan de doorwaadbare plaatsen; en men sloot de poort dicht, nadat zij naar buiten gegaan waren die hen achtervolgden.", "Ps 78:9": "(De kinderen van Efraïm, gewapende boogschutters, keerden om ten dage van het strijd.)", "Joz 19:42": "En Saalabbin, en Ajalon, en Jithla,", "1 Sam 16:1": "Toen zei de HEERE tegen Samuël: Hoe lang draagt u leed om Saul, die Ik toch verworpen heb, dat hij geen koning meer zal zijn over Israël? Vul uw hoorn met olie, en ga op weg; Ik zal u zenden naar Isaï, de Bethlehemiet; want Ik heb Mij een koning uitgekozen onder zijn zonen.", "Pred 4:4": "Verder zag ik al de moeite en alle bekwaamheid van het werk, dat het de mens jaloezie van zijn naaste aanbrengt. Dat is ook vluchtigheid en najagen van de wind.", "1 Kon 10:25": "En zij brachten ieder zijn geschenk, zilveren vaten, en gouden vaten, en klederen, en wapenrusting, en specerijen, paarden en muilezels, elk jaar opnieuw.", "2 Sam 17:24": "David nu kwam te Mahanaïm, en Absalom trok de Jordaan over, hij en alle mannen van Israël met hem.", "Job 13:14": "Waarom zou ik mijn vlees in mijn tanden nemen, en mijn ziel in mijn hand stellen?", "2 Sam 23:30": "Benaja, de Pirhathoniet; Hiddai, van de beken van Gaäs;", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "1 Kon 16:21": "Toen werd het volk van Israël verdeeld in twee helften; de helft van het volk volgde Tibni, de zoon van Ginath, om hem koning te maken; en de andere helft volgde Omri.", "Richt 12:1-4": "Toen werden de mannen van Efraïm bijeengeroepen, en zij trokken naar het noorden; en zij zeiden tegen Jeftha: Waarom bent u doorgetrokken om te strijden tegen de kinderen van Ammon, en hebt u ons niet geroepen om met u mee te gaan? Wij zullen uw huis boven u met vuur verbranden. En Jeftha zei tegen hen: Ik en mijn volk waren in hevige strijd met de kinderen van Ammon; en ik heb u geroepen, maar u hebt mij niet uit hun hand verlost. Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "Richt 8:1": "Toen zeiden de mannen van Efraïm tegen hem: Wat is dit voor iets dat u ons hebt aangedaan, dat u ons niet riep toen u wegging om te strijden tegen de Midianieten? En zij verweten hem dat heftig.", "Richt 12:13-15": "En na hem richtte Abdon, een zoon van Hillel, de Pirhathoniet, Israël. En hij had veertig zonen, en dertig kleinzonen, die op zeventig ezelsveulens reden; en hij richtte Israël acht jaren. Toen stierf Abdon, een zoon van Hillel, de Pirhathoniet; en hij werd begraven te Pirhathon, in het land van Efraïm, op de berg van de Amalekiet.", "2 Kron 27:5": "Hij streed ook tegen de koning van de Ammonieten, en had de overhand over hen, zodat de Ammonieten hem in datzelfde jaar honderd talenten van het zilver gaven, en tienduizend kor tarwe, en tienduizend gerst; dit brachten de Ammonieten hem opnieuw, ook in het tweede en in het derde jaar.", "1 Sam 28:21": "De vrouw nu kwam bij Saul, en zag dat hij erg verbijsterd was; en zij zei tegen hem: Zie, uw dienstmaagd heeft naar uw stem geluisterd, en ik heb mijn leven in mijn hand gesteld, en ik heb uw woorden gehoord die u tegen mij gesproken hebt.", "2 Sam 19:43": "En de mannen van Israël antwoordden de mannen van Juda, en zeiden: Wij hebben tien delen aan de koning, en ook aan David hebben wij, meer dan jullie, recht; waarom hebben jullie ons dan geringschat, zodat ons woord niet het eerste geweest is bij het terughalen van onze koning? Maar het woord van de mannen van Juda was harder dan het woord van de mannen van Israël.", "2 Kron 9:24": "En zij brachten ieder zijn geschenk, zilveren vaten, en gouden vaten, en kleding, wapenrusting, en specerijen, paarden, en muilezels, elk jaar opnieuw.", "Richt 12:8-10": "En na hem richtte Ebzan uit Bethlehem Israël. En hij had dertig zonen; en hij zond dertig dochters naar buiten, en bracht dertig dochters van buiten binnen voor zijn zonen; en hij richtte Israël zeven jaren. Toen stierf Ebzan, en werd begraven te Bethlehem.", "Num 32:40": "Zo gaf Mozes Gilead aan Machir, de zoon van Manasse; en hij woonde daarin.", "Richt 11:12-33": "Vervolgens zond Jeftha boden naar de koning van de kinderen van Ammon, en zei: Wat hebben ik en u met elkaar te maken, dat u naar mij toe bent gekomen om tegen mijn land te strijden? En de koning van de kinderen van Ammon zei tegen de boden van Jeftha: Omdat Israël, toen het optrok uit Egypte, mijn land heeft afgenomen, van de Arnon af tot aan de Jabbok, en tot aan de Jordaan; geef mij dat nu dus in vrede terug. Maar Jeftha ging verder, en zond opnieuw boden naar de koning van de kinderen van Ammon.", "Spr 18:19": "Een broeder is moeilijker te winnen dan een sterke stad; en geschillen zijn als de grendel van een paleis.", "Richt 12:1-3": "Toen werden de mannen van Efraïm bijeengeroepen, en zij trokken naar het noorden; en zij zeiden tegen Jeftha: Waarom bent u doorgetrokken om te strijden tegen de kinderen van Ammon, en hebt u ons niet geroepen om met u mee te gaan? Wij zullen uw huis boven u met vuur verbranden. En Jeftha zei tegen hen: Ik en mijn volk waren in hevige strijd met de kinderen van Ammon; en ik heb u geroepen, maar u hebt mij niet uit hun hand verlost. Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "1 Kon 4:26": "Salomo had ook veertigduizend paardenstallen voor zijn wagens, en twaalfduizend ruiters.", "Richt 9:17": "(want mijn vader heeft voor u gestreden, en hij heeft zijn leven ver weggeworpen, en heeft u gered uit de hand van de Midianieten;", "Spr 27:3": "Een steen is zwaar, en het zand gewichtig; maar de toorn van de dwaas is zwaarder dan die beide.", "1 Sam 15:7": "Toen sloeg Saul de Amalekieten van Havila af, tot daar waar u komt bij Sur, dat voor Egypte ligt.", "Matt 2:1": "Toen Jezus geboren was in Bethlehem, in Judea, in de dagen van koning Herodes, zie, kwamen er wijzen uit het Oosten in Jeruzalem aan.", "Gen 14:7": "Daarna keerden zij terug en kwamen bij En-mispat, dat is Kades, en versloegen heel het land van de Amalekieten, en ook de Amoriet, die te Hazezon-thamar woonde.", "Rom 16:4": "die voor mijn leven hun hals gesteld hebben; hun dank ik niet alleen, maar ook alle Gemeenten van de heidenen.", "2 Sam 17:22": "Toen stond David op, en al het volk dat bij hem was; en zij gingen de Jordaan over. Bij het morgenlicht ontbrak er niet één die niet de Jordaan overgegaan was.", "Ex 6:5": "Daarom, zeg tegen de kinderen van Israël: Ik ben de HEERE! En Ik zal u uitleiden van onder de lasten van de Egyptenaren, en Ik zal u redden uit hun dienstbaarheid, en zal u verlossen door een uitgestrekte arm, en door grote gerichten;", "Joh 10:32": "Jezus antwoordde hun: Ik heb u veel goede werken getoond van Mijn Vader; om welk van die werken stenigt u Mij?", "1 Kron 6:69": "En Ajalon en haar voorsteden, en Gath-rimmon en haar voorsteden.", "2 Sam 19:31": "Barzillai, de Gileadiet, kwam ook naar beneden uit Rogelim; en hij trok met de koning de Jordaan over, om hem over de Jordaan te begeleiden.", "Richt 5:10": "U, die op witte ezelinnen rijdt, u, die aan het gericht zit, en u, die over de weg wandelt, spreek erover!", "Est 6:8": "laat men het koninklijke kleed brengen dat de koning gewoonlijk draagt, en het paard waarop de koning gewoonlijk rijdt, en laat de koninklijke kroon op zijn hoofd gezet worden.", "Spr 17:14": "Het begin van het krakeel is als iemand die het water opening geeft; laat daarom de twist varen, voordat hij losbarst.", "Spr 15:1": "Een zacht antwoord keert de grimmigheid af; maar een smartend woord doet de toorn oprijzen.", "Matt 12:25": "Maar Jezus kende hun gedachten, en zei tegen hen: Elk koninkrijk dat tegen zichzelf verdeeld is, wordt verwoest; en elke stad of elk huis dat tegen zichzelf verdeeld is, zal niet standhouden.", "Jak 3:16": "Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Ps 109:4": "Voor mijn liefde staan zij mij tegen; maar ik was steeds in het gebed.", "Richt 15:6": "Toen zeiden de Filistijnen: Wie heeft dit gedaan? En men zei: Simson, de schoonzoon van de Thimniet, omdat hij zijn vrouw heeft weggenomen, en haar aan zijn metgezel heeft gegeven. Toen kwamen de Filistijnen op, en verbrandden haar en haar vader met vuur.", "Job 24:24": "Zij zijn een korte tijd verheven, daarna is er niemand meer van hen; zij worden neergedrukt; net als alle anderen worden zij weggenomen; en net als de top van een aar worden zij afgesneden.", "Pred 10:12": "De woorden van de mond van een wijze zijn aangenaam; maar de lippen van een dwaas verslinden hemzelf.", "Jes 9:20": "Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Richt 3:13": "En hij verzamelde bij zich de kinderen van Ammon en de Amalekieten, en hij trok op en sloeg Israël, en zij namen de Palmstad in bezit.", "2 Sam 11:1": "En het gebeurde met de terugkeer van het jaar, ten tijde dat de koningen uittrekken, dat David Joab, en zijn knechten met hem, en heel Israël, uitzond om de kinderen van Ammon te verderven, en Rabba te belegeren. Doch David bleef te Jeruzalem.", "Richt 11:10": "En de oudsten van Gilead zeiden tegen Jeftha: De HEERE zij getuige tussen ons, als wij niet zo doen naar uw woord.", "Ps 119:109": "Mijn ziel is voortdurend in mijn hand; nochtans vergeet ik Uw wet niet.", "Gen 15:19": "De Kenieten, en de Kenizzieten, en de Kadmonieten,", "Deut 3:12-17": "Dit land nu namen wij in die tijd in bezit; vanaf Aroer, dat aan de beek Arnon ligt, en de helft van het gebergte van Gilead, met de steden ervan, gaf ik aan de Rubenieten en Gadieten. En het overige van Gilead, alsook heel Bazan, het koninkrijk van Og, gaf ik aan de halve stam van Manasse, de hele landstreek van Argob, door heel Bazan; dat werd het land van de reuzen genoemd. Jaïr, de zoon van Manasse, kreeg de hele landstreek van Argob, tot aan het gebied van de Gezurieten en Maächatieten; en hij noemde ze naar zijn naam, Bazan-Havvoth-Jaïr, tot op deze dag.", "Richt 10:7-18": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten. Die verdrukten en vertrapten de Israëlieten in datzelfde jaar; achttien jaar lang onderdrukten zij alle Israëlieten die aan de overkant van de Jordaan waren, in het land van de Amorieten, dat in Gilead ligt. Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "1 Kron 20:1-3": "Het gebeurde nu in de tijd dat het jaar weer omging, in de tijd dat de koningen ten strijde uittrokken, dat Joab het leger aanvoerde en het land van de kinderen Ammons verwoestte; en hij kwam en belegerde Rabba. Maar David bleef in Jeruzalem. En Joab sloeg Rabba en verwoestte het. En David nam de kroon van hun koning van zijn hoofd, en hij bevond dat die in gewicht een talent goud woog, en er zat edelgesteente aan; en die werd op Davids hoofd gezet, en hij bracht zeer veel van het roof uit de stad naar buiten. Hij bracht ook al het volk dat daarin was naar buiten, en hij zaagde hen met de zaag, en met ijzeren dorswagens, en met bijlen; en zo deed David met al de steden van de kinderen Ammons. Toen keerde David met al het volk terug naar Jeruzalem.", "Richt 8:4": "Toen Gideon nu bij de Jordaan gekomen was, ging hij eroverheen, met de driehonderd mannen die bij hem waren, moe, maar toch nog vervolgend.", "Jak 4:2": "U begeert, en hebt niet; u benijdt en jaagt naar dingen, en kunt ze niet krijgen; u vecht en voert strijd, maar u hebt niet, omdat u niet bidt.", "Openb 12:11": "En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "1 Kron 27:14": "De elfde, in de elfde maand, was Benaja, de Pirhathoniet, van de kinderen van Efraïm; in zijn verdeling waren er ook vierentwintigduizend.", "Ps 69:3": "Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij.", "Richt 3:27": "En het gebeurde, toen hij aankwam, dat hij op de bazuin blies op het gebergte van Efraïm; en de kinderen van Israël trokken met hem af van het gebergte, en hij zelf ging voor hen uit.", "Richt 11:33": "En hij versloeg hen van Aroer af tot waar u komt bij Minnith, twintig steden, en tot aan Abel-Keramim, met een zeer grote slag. Zo werden de kinderen van Ammon onderworpen voor het aangezicht van de kinderen van Israël.", "2 Kron 26:7": "En God hielp hem tegen de Filistijnen, en tegen de Arabieren die te Gur-baal woonden, en tegen de Meunieten.", "Ex 17:8": "Toen kwam Amalek en streed tegen Israël bij Rafidim.", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Richt 10:4": "Hij had dertig zonen, die op dertig ezelsveulens reden, en zij hadden dertig steden, die tot op deze dag Havvoth-jair genoemd worden en die in het land Gilead liggen.", "2 Sam 19:41-43": "En zie, alle mannen van Israël kwamen naar de koning; en zij zeiden tegen de koning: Waarom hebben onze broeders, de mannen van Juda, u gestolen, en hebben zij de koning en zijn huis over de Jordaan gebracht, en alle mannen van David met hem? Toen antwoordden alle mannen van Juda de mannen van Israël: Omdat de koning ons nauw verwant is; en waarom zijn jullie nu boos over deze zaak? Hebben wij dan ook maar iets gegeten op kosten van de koning, of heeft hij ons een geschenk gegeven? En de mannen van Israël antwoordden de mannen van Juda, en zeiden: Wij hebben tien delen aan de koning, en ook aan David hebben wij, meer dan jullie, recht; waarom hebben jullie ons dan geringschat, zodat ons woord niet het eerste geweest is bij het terughalen van onze koning? Maar het woord van de mannen van Juda was harder dan het woord van de mannen van Israël.", "Num 26:37": "Dat zijn de geslachten der zonen van Efraïm, naar hun getelden: tweeëndertigduizend vijfhonderd. Dat zijn de zonen van Jozef, naar hun geslachten.", "2 Sam 2:12-31": "Toen trok Abner, de zoon van Ner, uit, met de knechten van Isboseth, de zoon van Saul, van Mahanaim naar Gibeon. Joab, de zoon van Zeruja, en de knechten van David, trokken ook uit; en zij ontmoetten elkaar bij de vijver van Gibeon; en zij bleven zitten, dezen aan deze zijde van de vijver, en die aan gene zijde van de vijver. En Abner zei tegen Joab: Laat de jongens nu opstaan, en voor onze ogen spelen. En Joab zei: Laat hen opstaan.", "Richt 11:27": "Ik heb ook niet tegen u gezondigd, maar u doet mij onrecht aan door tegen mij te strijden. De HEERE, Die Rechter is, oordele vandaag tussen de kinderen van Israël en de kinderen van Ammon!", "2 Sam 12:26-31": "Joab nu streed tegen Rabba van de kinderen van Ammon; en hij nam de koninklijke stad in. Toen zond Joab boden naar David, en zei: Ik heb gestreden tegen Rabba, en ik heb ook de waterstad ingenomen. Verzamel u nu het overige van het volk, en beleger de stad, en neem haar in; anders zou het, als ík de stad zou innemen, naar mijn naam genoemd worden.", "Richt 12:1-7": "Toen werden de mannen van Efraïm bijeengeroepen, en zij trokken naar het noorden; en zij zeiden tegen Jeftha: Waarom bent u doorgetrokken om te strijden tegen de kinderen van Ammon, en hebt u ons niet geroepen om met u mee te gaan? Wij zullen uw huis boven u met vuur verbranden. En Jeftha zei tegen hen: Ik en mijn volk waren in hevige strijd met de kinderen van Ammon; en ik heb u geroepen, maar u hebt mij niet uit hun hand verlost. Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "1 Kron 8:13": "En Beria, en Sema; dezen waren hoofden van de vaderen van de inwoners van Ajalon; dezen hebben de inwoners van Gath verdreven.", "2 Sam 17:27": "En het gebeurde, toen David te Mahanaïm gekomen was, dat Sobi, de zoon van Nahas, uit Rabba van de kinderen van Ammon, en Machir, de zoon van Ammiël, uit Lodebar, en Barzillai, de Gileadiet, uit Rogelim,", "1 Kon 1:33": "En de koning zei tegen hen: Neem de knechten van uw heer met u mee, en laat mijn zoon Salomo rijden op de muilezelin die van mij is; en breng hem naar Gihon.", "Num 32:39": "En de kinderen van Machir, de zoon van Manasse, gingen naar Gilead, en namen het in, en zij verdreven de Amorieten die daarin waren, uit hun bezit.", "Richt 7:24": "Ook zond Gideon boden naar heel het gebergte van Efraïm, en zei: Kom naar beneden, de Midianieten tegemoet, en neem hun de wateren af, tot aan Beth-bara, namelijk de Jordaan; zo werd elke man van Efraïm bijeengeroepen, en zij namen hun de wateren af tot aan Beth-bara, en de Jordaan.", "Richt 12:4-6": "En Jeftha verzamelde alle mannen van Gilead, en streed met Efraïm; en de mannen van Gilead versloegen Efraïm, want de Gileadieten zeiden: U bent vluchtelingen van Efraïm, [wonend] tussen Efraïm en tussen Manasse. Want de Gileadieten namen de Efraïmieten de doorwaadbare plaatsen van de Jordaan af; en het gebeurde, toen de vluchtelingen van Efraïm zeiden: Laat mij oversteken, dat de mannen van Gilead tegen hem zeiden: Bent u een Efraïmiet? En wanneer hij zei: Nee; dan zeiden zij tegen hem: Zeg dan Schibboleth; maar hij zei: Sibbolet, en kon het zo niet goed uitspreken; dan grepen zij hem en doodden hem bij de doorwaadbare plaatsen van de Jordaan, zodat er in die tijd van Efraïm tweeënveertigduizend vielen.", "2 Kron 9:25": "Ook had Salomo vierduizend paardenstallen, en wagens, en twaalfduizend ruiters; en hij legerde ze in de wagensteden, en bij de koning te Jeruzalem.", "Matt 26:73": "En een weinig later kwamen zij die daar stonden bij Petrus en zeiden: Werkelijk, u bent ook één van hen, want ook uw spraak verraadt u.", "Richt 5:14": "Uit Efraïm was hun wortel tegen Amalek. Achter u was Benjamin onder uw volken. Uit Machir zijn de wetgevers afgetrokken, en uit Zebulon, die trekken door de staf van de schrijver.", "Ps 69:16": "Laat de watervloed mij niet overstromen, en laat de diepte mij niet verslinden; en laat de put zijn mond over mij niet toesluiten.", "2 Kron 13:12": "Zie daarom, God is met ons aan het hoofd, en Zijn priesters met de trompetten van het geschal, om alarm tegen u te laten klinken; o kinderen van Israël, strijd niet tegen de HEERE, de G pan class=\"wl\" data-l=\"L8\" data-code=\"H776\">land</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H776\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H669\">Efraïm</span>, <span class=\"wl\" data-l=\"L9\" data-code=\"H669\">op</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H2022\">de</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H2022\">berg</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H2022\">van</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H6003\">de</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H6003\">Amalekiet</span>."}, "koppeling_kjv": {"1": "And the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6817\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H5674\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6828\">northward,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah,</span> Wherefore passedst thou <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> and didst not <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> us to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thee? we will <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> upon thee with fire.", "2": "And <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, I and my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1961\">were</span> at <span class=\"wl wl-kjv\" data-code=\"H3966\">great</span> <span class=\"wl wl-kjv\" data-code=\"H376\">strife</span> with the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon;</span> and when I <span class=\"wl wl-kjv\" data-code=\"H2199\">called</span> you, ye <span class=\"wl wl-kjv\" data-code=\"H3467\">delivered</span> me not out of their hands.", "3": "And when I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that ye <span class=\"wl wl-kjv\" data-code=\"H3467\">delivered</span> me not, I <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> in my <span class=\"wl wl-kjv\" data-code=\"H3709\">hands,</span> and passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> against the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> wherefore then are ye come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto me this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> to fight", "4": "Then <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> gathered <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> with <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim:</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> because they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Ye <span class=\"wl wl-kjv\" data-code=\"H1568\">Gileadites</span> are <span class=\"wl wl-kjv\" data-code=\"H6412\">fugitives</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraimites,</span> and <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the Manassites.", "5": "And the <span class=\"wl wl-kjv\" data-code=\"H1568\">Gileadites</span> <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H4569\">passages</span> of <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> before the <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraimites:</span> and it was so, that when those <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraimites</span> which were <span class=\"wl wl-kjv\" data-code=\"H6412\">escaped</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let me go <span class=\"wl wl-kjv\" data-code=\"H5674\">over;</span> that the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Art thou an <span class=\"wl wl-kjv\" data-code=\"H673\">Ephraimite?</span> If he said,", "6": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> they unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> now <span class=\"wl wl-kjv\" data-code=\"H7641\">Shibboleth:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H5451\">Sibboleth:</span> for he could not <span class=\"wl wl-kjv\" data-code=\"H3559\">frame</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">pronounce</span> it <span class=\"wl wl-kjv\" data-code=\"H3559\">right.</span> Then they <span class=\"wl wl-kjv\" data-code=\"H270\">took</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7819\">slew</span> him at the <span class=\"wl wl-kjv\" data-code=\"H4569\">passages</span> of <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan:</span> and there <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of the <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraimites</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> thousand.", "7": "And <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span> Then <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> <span class=\"wl wl-kjv\" data-code=\"H3316\">Jephthah</span> the <span class=\"wl wl-kjv\" data-code=\"H1569\">Gileadite,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in one of the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of Gilead.", "8": "And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him <span class=\"wl wl-kjv\" data-code=\"H78\">Ibzan</span> of <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> Israel.", "9": "And he had <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> whom he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">took</span> in <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> from <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad</span> for his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons.</span> And he <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> years.", "10": "Then <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> <span class=\"wl wl-kjv\" data-code=\"H78\">Ibzan,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> at Bethlehem.", "11": "And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him <span class=\"wl wl-kjv\" data-code=\"H356\">Elon,</span> a <span class=\"wl wl-kjv\" data-code=\"H2075\">Zebulonite,</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and he <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> years.", "12": "And <span class=\"wl wl-kjv\" data-code=\"H356\">Elon</span> the <span class=\"wl wl-kjv\" data-code=\"H2075\">Zebulonite</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in <span class=\"wl wl-kjv\" data-code=\"H357\">Aijalon</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> of Zebulun.", "13": "And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him <span class=\"wl wl-kjv\" data-code=\"H5658\">Abdon</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1985\">Hillel,</span> a <span class=\"wl wl-kjv\" data-code=\"H6553\">Pirathonite,</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> Israel.", "14": "And he had <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</ /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
