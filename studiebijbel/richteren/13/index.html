de Filistijnen.","6":"Toen kwam deze vrouw binnen en sprak tegen haar man en zei: Er kwam een Man van God naar mij toe, Wiens gezicht was als het gezicht van een Engel van God, zeer ontzagwekkend; en ik heb Hem niet gevraagd waar Hij vandaan was, en Zijn naam heeft Hij mij niet bekendgemaakt.","7":"Maar Hij zei tegen mij: Zie, u zult zwanger worden en een zoon baren; drink dus nu geen wijn of sterke drank, en eet niets van het onreine; want dat jongetje zal een Nazireeër van God zijn, vanaf de moederschoot tot de dag van zijn dood.","8":"Toen bad Manoach vurig tot de HEERE en zei: Och, Heere! Laat toch de Man van God, Die U gezonden hebt, weer naar ons toe komen, en ons leren wat we met dat jongetje moeten doen dat geboren zal worden.","9":"En God verhoorde de stem van Manoach; en de Engel van God kwam weer naar de vrouw toe. Zij zat namelijk in het veld, maar haar man Manoach was niet bij haar.","10":"Toen haastte de vrouw zich en liep snel weg, en vertelde het haar man; en zij zei tegen hem: Zie, die Man is aan mij verschenen, Die op die dag naar mij toe kwam.","11":"Toen stond Manoach op en ging zijn vrouw achterna; en hij kwam bij die Man, en zei tegen Hem: Bent u die Man Die tegen deze vrouw gesproken heeft? En Hij zei: Ik ben het.","12":"Toen zei Manoach: Laat nu Uw woorden uitkomen; maar wat zal de manier van leven en het werk van het jongetje zijn?","13":"En de Engel van de HEERE zei tegen Manoach: Van alles wat Ik tegen de vrouw gezegd heb, moet zij zich weerhouden.","14":"Zij mag niets eten van wat van de wijnstok voortkomt; en wijn en sterke drank mag zij niet drinken, en ook niets van het onreine eten; alles wat Ik haar geboden heb, moet zij houden.","15":"Toen zei Manoach tegen de Engel van de HEERE: Laat ons U toch ophouden, en een geitenbokje voor U bereiden.","16":"Maar de Engel van de HEERE zei tegen Manoach: Al zou u Mij ophouden, Ik zal van uw brood niet eten; en als u een brandoffer wilt brengen, moet u dat aan de HEERE offeren. Want Manoach wist niet dat het een Engel van de HEERE was.","17":"En Manoach zei tegen de Engel van de HEERE: Wat is Uw naam, zodat wij U eren wanneer Uw woord uitkomt?","18":"En de Engel van de HEERE zei tegen hem: Waarom vraagt u zo naar Mijn naam? Die is immers wonderlijk.[1]","19":"Toen nam Manoach een geitenbokje en het spijsoffer, en offerde het op de rotssteen aan de HEERE. En Hij handelde wonderlijk in Zijn doen; en Manoach en zijn vrouw keken toe.","20":"En het gebeurde, toen de vlam van het altaar opsteeg naar de hemel, dat de Engel van de HEERE opsteeg in de vlam van het altaar. Toen Manoach en zijn vrouw dat zagen, vielen zij op hun gezicht ter aarde.","21":"En de Engel van de HEERE verscheen niet meer aan Manoach en aan zijn vrouw. Toen begreep Manoach dat het een Engel van de HEERE was.","22":"En Manoach zei tegen zijn vrouw: Wij zullen zeker sterven, omdat wij God gezien hebben.","23":"Maar zijn vrouw zei tegen hem: Als de HEERE ons had willen doden, had Hij het brandoffer en spijsoffer niet uit onze hand aangenomen, en had Hij ons dit alles niet getoond, en had Hij ons dit niet op dit moment laten horen.","24":"Daarna baarde deze vrouw een zoon, en zij noemde hem Simson; en dat jongetje werd groot, en de HEERE zegende hem.","25":"En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol."},"SV":{"1":"En de kinderen Israëls voeren voort te doen, dat kwaad was in de ogen des HEEREN; zo gaf de HEERE hen in de hand der Filistijnen veertig jaren.","2":"En er was een man van Zora, uit het geslacht van een Daniet, wiens naam was Manoach; en zijn huisvrouw was onvruchtbaar en baarde niet.","3":"En een Engel des HEEREN verscheen aan deze vrouw, en Hij zeide tot haar: Zie nu, gij zijt onvruchtbaar, en hebt niet gebaard; maar gij zult zwanger worden, en een zoon baren.","4":"Zo wacht u toch nu, en drink geen wijn noch sterken drank, en eet niets onreins.","5":"want zie, gij zult zwanger worden, en een zoon baren, op wiens hoofd geen scheermes zal komen; want dat knechtje zal een Nazireër Gods zijn, van *moeders* buik af; en hij zal beginnen Israël te verlossen uit der Filistijnen hand.","6":"Toen kwam deze vrouw in, en sprak tot haar man, zeggende: Er kwam een Man Gods tot mij, Wiens aangezicht was als het aangezicht van een Engel Gods, zeer vreselijk; en ik vraagde Hem niet, van waar Hij was, en Zijn naam gaf Hij mij niet te kennen.","7":"Maar Hij zeide tot mij: Zie, gij zult zwanger worden, en een zoon baren; zo drink nu geen wijn noch sterken drank, en eet niets onreins; want dat knechtje zal een Nazireër Gods zijn, van *moeders* buik af tot op den dag zijns doods.","8":"Toen aanbad Manoach den HEERE vuriglijk, en zeide: Och, Heere! dat toch de Man Gods, Dien Gij gezonden hebt, weder tot ons kome, en ons lere, wat we dat knechtje doen zullen, dat geboren zal worden.","9":"En God verhoorde de stem van Manoach; en de Engel Gods kwam wederom tot de vrouw. Zij nu zat in het veld, doch haar man Manoach was niet bij haar.","10":"Zo haastte de vrouw, en liep, en gaf het haar man te kennen; en zij zeide tot hem: Zie, die Man is mij verschenen, Welke op dien dag tot mij kwam.","11":"Toen stond Manoach op, en ging zijn huisvrouw na; en hij kwam tot dien Man, en zeide tot Hem: Zijt gij die Man, Dewelke tot deze vrouw gesproken hebt? En Hij zeide: Ik ben het.","12":"Toen zeide Manoach: Nu, dat Uw woorden komen; *maar* wat zal des knechtjes wijze en zijn werk zijn?","13":"En de Engel des HEEREN zeide tot Manoach: Van alles, wat Ik tot de vrouw gezegd heb, zal zij zich wachten.","14":"Zij zal niet eten van iets, dat van den wijnstok des wijns voortkomt; en wijn en sterken drank zal zij niet drinken, noch iets onreins eten; al wat Ik haar geboden heb, zal zij onderhouden.","15":"Toen zeide Manoach tot den Engel des HEEREN: Laat ons U toch ophouden, en een geitenbokje voor Uw aangezicht bereiden.","16":"Maar de Engel des HEEREN zeide tot Manoach: Indien gij Mij zult ophouden, Ik zal van uw brood niet eten; en indien gij een brandoffer zult doen, dat zult gij den HEERE offeren. Want Manoach wist niet, dat het een Engel des HEEREN was.","17":"En Manoach zeide tot den Engel des HEEREN: Wat is Uw naam, opdat wij U vereren, wanneer Uw woord zal komen.","18":"En de Engel des HEEREN zeide tot hem: Waarom vraagt gij dus naar Mijn naam? Die is toch Wonderlijk.","19":"Toen nam Manoach een geitenbokje, en het spijsoffer, en offerde het op den rotssteen, den HEERE. En Hij handelde wonderlijk in *Zijn* doen; en Manoach en zijn huisvrouw zagen toe.","20":"En het geschiedde, als de vlam van het altaar opvoer naar den hemel, zo voer de Engel des HEEREN op in de vlam des altaars. Als Manoach en zijn huisvrouw *dat* zagen, zo vielen zij op hun aangezichten ter aarde.","21":"En de Engel des HEEREN verscheen niet meer aan Manoach, en aan zijn huisvrouw. Toen bekende Manoach, dat het een Engel des HEEREN was.","22":"En Manoach zeide tot zijn huisvrouw: Wij zullen zekerlijk sterven, omdat wij God gezien hebben.","23":"Maar zijn huisvrouw zeide tot hem: Zo de HEERE lust had ons te doden, Hij had het brandoffer en spijsoffer van onze hand niet aangenomen, noch ons dit alles getoond, noch ons om dezen tijd laten horen, *zulks* als dit is.","24":"Daarna baarde deze vrouw een zoon, en zij noemde zijn naam Simson; en dat knechtje werd groot, en de HEERE zegende het.","25":"En de Geest des HEEREN begon hem bij wijlen te drijven in het leger van Dan, tussen Zora en tussen Esthaol."},"KJV":{"1":"And the children of Israel did evil again in the sight of the LORD; and the LORD delivered them into the hand of the Philistines forty years.","2":"And there was a certain man of Zorah, of the family of the Danites, whose name *was* Manoah; and his wife *was* barren, and bare","3":"And the angel of the LORD appeared unto the woman, and said unto her, Behold now, thou *art* barren, and bearest not: but thou shalt conceive, and bear a son.","4":"Now therefore beware, I pray thee, and drink not wine nor strong drink, and eat not any unclean","5":"For, lo, thou shalt conceive, and bear a son; and no razor shall come on his head: for the child shall be a Nazarite unto God from the womb: and he shall begin to deliver Israel out of the hand of the Philistines.","6":"Then the woman came and told her husband, saying, A man of God came unto me, and his countenance *was* like the countenance of an angel of God, very terrible: but I asked him not whence he *was*, neither told he me his name:","7":"But he said unto me, Behold, thou shalt conceive, and bear a son; and now drink no wine nor strong drink, neither eat any unclean *thing*: for the child shall be a Nazarite to God from the womb to the day of his death.","8":"Then Manoah intreated the LORD, and said, O my Lord, let the man of God which thou didst send come again unto us, and teach us what we shall do unto the child that shall be born.","9":"And God hearkened to the voice of Manoah; and the angel of God came again unto the woman as she sat in the field: but Manoah her husband","10":"And the woman made haste, and ran, and shewed her husband, and said unto him, Behold, the man hath appeared unto me, that came unto me the *other* day.","11":"And Manoah arose, and went after his wife, and came to the man, and said unto him, *Art* thou the man that spakest unto the woman? And he said,","12":"And Manoah said, Now let thy words come to pass. How shall we order the child, and *how* shall we do","13":"And the angel of the LORD said unto Manoah, Of all that I said unto the woman let her beware.","14":"She may not eat of any *thing* that cometh of the vine, neither let her drink wine or strong drink, nor eat any unclean *thing*: all that I commanded her let her observe.","15":"And Manoah said unto the angel of the LORD, I pray thee, let us detain thee, until we shall have made ready a kid for","16":"And the angel of the LORD said unto Manoah, Though thou detain me, I will not eat of thy bread: and if thou wilt offer a burnt offering, thou must offer it unto the LORD. For Manoah knew not that he *was* an angel of the LORD.","17":"And Manoah said unto the angel of the LORD, What *is* thy name, that when thy sayings come to pass we may do thee honour?","18":"And the angel of the LORD said unto him, Why askest thou thus after my name, seeing it *is* secret?","19":"So Manoah took a kid with a meat offering, and offered *it* upon a rock unto the LORD: and *the angel* did wondrously; and Manoah and his wife looked on.","20":"For it came to pass, when the flame went up toward heaven from off the altar, that the angel of the LORD ascended in the flame of the altar. And Manoah and his wife looked on *it*, and fell on their faces to the ground.","21":"But the angel of the LORD did no more appear to Manoah and to his wife. Then Manoah knew that he *was* an angel of the LORD.","22":"And Manoah said unto his wife, We shall surely die, because we have seen God.","23":"But his wife said unto him, If the LORD were pleased to kill us, he would not have received a burnt offering and a meat offering at our hands, neither would he have shewed us all these *things*, nor would as at this time have told us *such things* as these.","24":"And the woman bare a son, and called his name Samson: and the child grew, and the LORD blessed","25":"And the Spirit of the LORD began to move him at times in the camp of Dan between Zorah and Eshtaol."}},"tsk":{"1":[{"kopje":"deden","refs":["Richt 2:11","Richt 3:7","Richt 4:1","Richt 6:1","Richt 10:6","Rom 2:6"]},{"kopje":"in de ogen","refs":["Jer 13:23"]},{"kopje":"in de hand","refs":["1 Sam 12:9"]}],"2":[{"kopje":"Zora","refs":["Joz 15:33","Joz 19:41"]},{"kopje":"onvruchtbaar","refs":["Gen 16:1","Gen 25:21","1 Sam 1:2-6","Luk 1:7"]}],"3":[{"kopje":"de Engel","refs":["Richt 2:1","Richt 6:11","Richt 6:12","Gen 16:7-13","Luk 1:11","Luk 1:28-38"]},{"kopje":"maar u","refs":["Gen 17:16","Gen 18:10","1 Sam 1:20","2 Kon 4:16","Luk 1:13","Luk 1:31"]}],"4":[{"kopje":"drink geen","refs":["Richt 13:1 -code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> unto the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Behold now, thou art <span class=\"wl wl-kjv\" data-code=\"H6135\">barren,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bearest</span> not: but thou shalt <span class=\"wl wl-kjv\" data-code=\"H2029\">conceive,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bear</span> a son.","4":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H8104\">beware,</span> I pray thee, and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> not <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> nor strong <span class=\"wl wl-kjv\" data-code=\"H7941\">drink,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> not any unclean","5":"For, lo, thou shalt <span class=\"wl wl-kjv\" data-code=\"H2030\">conceive,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bear</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span> and no <span class=\"wl wl-kjv\" data-code=\"H4177\">razor</span> shall <span class=\"wl wl-kjv\" data-code=\"H5927\">come</span> on his <span class=\"wl wl-kjv\" data-code=\"H7218\">head:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H5139\">Nazarite</span> unto <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> from the <span class=\"wl wl-kjv\" data-code=\"H990\">womb:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H2490\">begin</span> to <span class=\"wl wl-kjv\" data-code=\"H3467\">deliver</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the Philistines.","6":"Then the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">told</span> her <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> A <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto me, and his <span class=\"wl wl-kjv\" data-code=\"H4758\">countenance</span> was like the <span class=\"wl wl-kjv\" data-code=\"H4758\">countenance</span> of an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">terrible:</span> but I <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> him not whence he was, neither <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> he me his name:","7":"But he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, Behold, thou shalt <span class=\"wl wl-kjv\" data-code=\"H2030\">conceive,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bear</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span> and now <span class=\"wl wl-kjv\" data-code=\"H7941\">drink</span> no <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> nor strong <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> neither <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> any <span class=\"wl wl-kjv\" data-code=\"H2932\">unclean</span> thing: for the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H5139\">Nazarite</span> to <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> from the <span class=\"wl wl-kjv\" data-code=\"H990\">womb</span> to the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of his death.","8":"Then <span class=\"wl wl-kjv\" data-code=\"H4495\">Manoah</span> <span class=\"wl wl-kjv\" data-code=\"H6279\">in s=\"wl wl-kjv\" data-code=\"H5930\">offering</span> and a meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> at our <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> neither would he have <span class=\"wl wl-kjv\" data-code=\"H7200\">shewed</span> us all these things, nor would as at this <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> have <span class=\"wl wl-kjv\" data-code=\"H8085\">told</span> us such things as these.","24":"And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> <span class=\"wl wl-kjv\" data-code=\"H1431\">grew,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> blessed","25":"And the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> to move him at <span class=\"wl wl-kjv\" data-code=\"H6470\">times</span> in the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan</span> between <span class=\"wl wl-kjv\" data-code=\"H6881\">Zorah</span> and Eshtaol."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
