 God van Israël, psalmzingen.", "4": "HEERE! toen U voorttrok van Seïr, toen U daarheen trad van het veld van Edom, beefde de aarde, ook droop de hemel, ook dropen de wolken van water.", "5": "De bergen vervloten van het aangezicht van de HEERE; zelfs Sinaï van het aangezicht van de HEERE, de God van Israël.", "6": "In de dagen van Samgar, de zoon van Anath, in de dagen van Jaël, hielden de wegen op, en die op paden wandelden, gingen kromme wegen.", "7": "De dorpen hielden op in Israël, ze hielden op; totdat ik, Debora, opstond, dat ik opstond, een moeder in Israël.", "8": "Verkoos hij nieuwe goden, dan was er krijg in de poorten; werd er ook een schild gezien, of een spies, onder veertigduizend in Israël?", "9": "Mijn hart is naar de wetgevers van Israël, die zich gewillig aangeboden hebben onder het volk; looft de HEERE!", "10": "U, die op witte ezelinnen rijdt, u, die aan het gericht zit, en u, die over de weg wandelt, spreek erover!", "11": "Van het gedruis van de schutters, tussen de plaatsen waar men water schept, spreekt men daar samen van de gerechtigheid van de HEERE, van de gerechtigheden, *bewezen* aan Zijn dorpen in Israël; toen ging het volk van de HEERE af naar de poorten.", "12": "Waak op, waak op, Debora, waak op, waak op, spreek een lied! Maak u op, Barak! En leid uw gevangenen gevangen, u zoon van Abinoam.", "13": "Toen deed Hij de overgeblevenen heersen over de heerlijke *onder* het volk; de HEERE doet mij heersen over de geweldigen.", "14": "Uit Efraïm was hun wortel tegen Amalek. Achter u was Benjamin onder uw volken. Uit Machir zijn de wetgevers afgetrokken, en uit Zebulon, die trekken door de staf van de schrijver.", "15": "Ook waren de vorsten in Issaschar met Debora; en *zoals* Issaschar, zo was Barak; op zijn voeten werd hij gezonden in het dal. In Rubens gedeelten waren de inbeeldingen van het hart groot.", "16": "Waarom bleef u zitten tussen de stallingen, om te horen het geblaat van de kudden? De gedeelten van Ruben hadden grote onderzoekingen van het hart.", "17": "Gilead bleef aan de andere zijde van de Jordaan; en Dan, waarom onthield hij zich in schepen! Aser zat aan de zeehaven, en bleef in zijn gescheurde plaatsen.", "18": "Zebulon, het is een volk, *dat* zijn ziel versmaad heeft ter dood, evenzo Nafthali, op de hoogten van het veld.", "19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.", "20": "Vanuit de hemel streden zij, de sterren uit hun loopplaatsen streden tegen Sisera.", "21": "De beek Kison wentelde hen weg, de beek Kedumin, de beek Kison; vertrap, o mijn ziel! de sterken.", "22": "Toen werden de paardenhoeven verpletterd, van het rennen, het rennen van zijn machtigen.", "23": "Vloek Meroz, zegt de Engel van de HEERE, vloek haar inwoners voortdurend; omdat zij niet gekomen zijn tot de hulp van de HEERE, tot de hulp van de HEERE, met de helden.", "24": "Gezegend zij boven de vrouwen Jaël, de huisvrouw van Heber, de Keniet; gezegend zij ze boven de vrouwen in de tent!", "25": "Water eiste hij, melk gaf zij; in een herenschaal bracht zij boter.", "26": "Haar hand sloeg zij aan de nagel, en haar rechterhand aan de hamer van de arbeidslieden; en zij klopte Sisera; zij streek zijn hoofd af, toen zij zijn slaap had doorgenageld en doorgedrongen.", "27": "Tussen haar voeten kromde hij zich, viel neer, lag daar neer; tussen haar voeten kromde hij zich; hij viel; waar hij zich kromde, daar lag hij geheel geschonden!", "28": "De moeder van Sisera keek uit door het venster, en schreeuwde door de traliën: Waarom vertoeft zijn wagen te komen! Waarom blijven de gangen van zijn wagens achter?", "29": "De wijste van haar staatsvrouwen antwoordden; ook beantwoordde zij haar redenen aan zichzelf:", "30": "Zouden zij dan de buit niet vinden *en* delen? Een liefje, *of* twee liefjes, voor ieder man? Voor Sisera een buit van verscheidene verven, een buit van verscheidene verven, gestikt; van verscheiden verf aan beide zijden gestikt, voor de buithalzen?", "31": "Zo moeten omkomen al Uw vijanden, o HEERE! Die Hem daarentegen liefhebben, *moeten* *zijn*, als wanneer de zon opgaat in haar kracht. En het land was stil, veertig jaren."}, "SV": {"1": "Voorts zong Debora, en Barak, de zoon van Abinoam, ten zelven dage, zeggende:", "2": "Looft den HEERE, van het wreken der wraken in Israël, van dat het volk zich gewillig heeft aangeboden.", "3": "Hoort, gij koningen, neemt ter oren, gij vorsten! Ik, den HEERE zal ik zingen, ik zal den HEERE, den God Israëls, psalmzingen.", "4": "HEERE! toen Gij voorttoogt van Seir, toen Gij daarheen traadt van het veld van Edom, beefde de aarde, ook droop de hemel, ook dropen de wolken van water.", "5": "De bergen vervloten van het aangezicht des HEEREN; zelfs Sinaï van het aangezicht des HEEREN, des Gods van Israël.", "6": "In de dagen van Samgar, den zoon van Anath, in de dagen van Jaël, hielden de wegen op, en die op paden wandelden, gingen kromme wegen.", "7": "De dorpen hielden op in Israël, zij hielden op; totdat ik, Debora, opstond, dat ik opstond, een moeder in Israël.", "8": "Verkoos hij nieuwe goden, dan was er krijg in de poorten; werd er ook een schild gezien, of een spies, onder veertig duizend in Israël?", "9": "Mijn hart is tot wetgevers van Israël, die zich gewillig aangeboden hebben onder het volk; looft den HEERE!", "10": "Gij, die op witte ezelinnen rijdt, gij, die aan het gerichte zit, en gij, die over weg wandelt, spreekt er van!", "11": "Van het gedruis der schutters, tussen de plaatsen, waar men water schept, spreekt aldaar te zamen van de gerechtigheid des HEEREN, van de gerechtigheden, *bewezen* aan zijn dorpen in Israël; toen ging des HEEREN volk af tot de poorten.", "12": "Waak op, waak op, Debora, waak op, waak op, spreek een lied! maak u op, Barak! en leid uw gevangenen gevangen, gij zoon van Abinoam.", "13": "Toen deed Hij de overgeblevenen heersen over de heerlijken *onder* het volk; de HEERE doet mij heersen over de geweldigen.", "14": "Uit Efraïm was hun wortel tegen Amalek. Achter u was Benjamin onder uw volken. Uit Machir zijn de wetgevers afgetogen, en uit Zebulon, trekkende door den staf des schrijvers.", "15": "Ook waren de vorsten in Issaschar met Debora; en *gelijk* Issaschar, alzo was Barak; op zijn voeten werd hij gezonden in het dal. In Rubens gedeelten waren de inbeeldingen des harten groot.", "16": "Waarom bleeft gij zitten tussen de stallingen, om te horen het geblaat der kudden? De gedeelten van Ruben hadden grote onderzoekingen des harten.", "17": "Gilead bleef aan gene zijde van de Jordaan; en Dan, waarom onthield hij zich in schepen! Aser zat aan de zeehaven, en bleef in zijn gescheurde plaatsen.", "18": "Zebulon, het is een volk, *dat* zijn ziel versmaad heeft ter dood, insgelijks Nafthali, op de hoogten des velds.", "19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan de wateren van Megiddo; zij brachten geen gewin des zilvers daarvan.", "20": "Van den hemel streden zij, de sterren uit haar loopplaatsen streden tegen Sisera.", "21": "De beek Kison wentelde hen weg, de beek Kedumin, de beek Kison; vertreed, o mijn ziel! de sterken.", "22": "Toen werden de paardenhoeven verpletterd, van het rennen, het rennen zijner machtigen.", "23": "Vloekt Meroz, zegt de Engel des HEEREN, vloekt haar inwoners geduriglijk; omdat zij niet gekomen zijn tot de hulp des HEEREN, tot de hulp des HEEREN, met de helden.", "24": "Gezegend zij boven de vrouwen Jaël, de huisvrouw van Heber, den Keniet; gezegend zij ze boven de vrouwen in de tent!", "25": "Water eiste hij, melk gaf zij; in een herenschaal bracht zij boter.", "26": "Haar hand sloeg zij aan den nagel, en haar rechterhand aan den hamer der arbeidslieden; en zij klopte Sisera; zij streek zijn hoofd af, als zij zijn slaap had doorgenageld en doorgedrongen.", "27": "Tussen haar voeten kromde hij zich, viel henen, lag daar neder; tussen haar voeten kromde hij zich; hij viel; alwaar hij zich kromde, daar lag hij geheel geschonden!", "28": "De moeder van Sisera keek uit door het venster, en schreeuwde door de traliën: Waarom vertoeft zijn wagen te komen! Waarom blijven de gangen zijner wagenen achter?", "29": "De wijsten harer staatsvrouwen antwoordden; ook beantwoordde zij haar redenen aan zichzelve:", "30": "Zouden zij dan den buit niet vinden *en* delen? een liefje, *of* twee liefjes, voor iegelijken man? Voor Sisera een buit van verscheidene verven, een buit van verscheidene verven, gestikt; van verscheiden verf aan beide zijden gestikt, voor de buithalzen?", "31": "Alzo moeten omkomen al Uw vijanden, o HEERE! die Hem daarentegen liefhebben, *moeten* *zijn*, als wanneer de zon opgaat in haar kracht. En het land was stil, veertig jaren."}, "KJV": {"1": "Then sang Deborah and Barak the son of Abinoam on that day, saying,", "2": "Praise ye the LORD for the avenging of Israel, when the people willingly offered", "3": "Hear, O ye kings; give ear, O ye princes; I, *even* I, will sing unto the LORD; I will sing *praise* to the LORD God of Israel.", "4": "LORD, when thou wentest out of Seir, when thou marchedst out of the field of Edom, the earth trembled, and the heavens dropped, the clouds also dropped water.", "5": "The mountains melted from before the LORD, *even* that Sinai from before the LORD God of Israel.", "6": "In the days of Shamgar the son of Anath, in the days of Jael, the highways were unoccupied, and the travellers walked through byways.", "7": "*The inhabitants of* the villages ceased, they ceased in Israel, until that I Deborah arose, that I arose a mother in Israel.", "8": "They chose new gods; then *was* war in the gates: was there a shield or spear seen among forty thousand in Israel?", "9": "My heart *is* toward the governors of Israel, that offered themselves willingly among the people. Bless ye the LORD.", "10": "Speak, ye that ride on white asses, ye that sit in judgment, and walk by the way.", "11": "*They that are delivered* from the noise of archers in the places of drawing water, there shall they rehearse the righteous acts of the LORD, *even* the righteous acts *toward the inhabitants* of his villages in Israel: then shall the people of the LORD go down to the gates.", "12": "Awake, awake, Deborah: awake, awake, utter a song: arise, Barak, and lead thy captivity captive, thou son of Abinoam.", "13": "Then he made him that remaineth have dominion over the nobles among the people: the LORD made me have dominion over the mighty.", "14": "Out of Ephraim *was there* a root of them against Amalek; after thee, Benjamin, among thy people; out of Machir came down governors, and out of Zebulun they that handle the pen of the writer.", "15": "And the princes of Issachar *were* with Deborah; even Issachar, and also Barak: he was sent on foot into the valley. For the divisions of Reuben *there were* great thoughts of heart.", "16": "Why abodest thou among the sheepfolds, to hear the bleatings of the flocks? For the divisions of Reuben *there were* great searchings of heart.", "17": "Gilead abode beyond Jordan: and why did Dan remain in ships? Asher continued on the sea shore, and abode in his breaches.", "18": "Zebulun and Naphtali *were* a people *that* jeoparded their lives unto the death in the high places of the field.", "19": "The kings came *and* fought, then fought the kings of Canaan in Taanach by the waters of Megiddo; they took no gain of money.", "20": "They fought from heaven; the stars in their courses fought against Sisera.", "21": "The river of Kishon swept them away, that ancient river, the river Kishon. O my soul, thou hast trodden down strength.", "22": "Then were the horsehoofs broken by the means of the pransings, the pransings of their mighty ones.", "23": "Curse ye Meroz, said the angel of the LORD, curse ye bitterly the inhabitants thereof; because they came not to the help of the LORD, to the help of the LORD against the mighty.", "24": "Blessed above women shall Jael the wife of Heber the Kenite be, blessed shall she be above women in the tent.", "25": "He asked water, *and* she gave *him* milk; she brought forth butter in a lordly dish.", "26": "She put her hand to the nail, and her right hand to the workmen's hammer; and with the hammer she smote Sisera, she smote off his head, when she had pierced and stricken through his temples.", "27": "At her feet he bowed, he fell, he lay down: at her feet he bowed, he fell: where he bowed, there he fell down dead.", "28": "The mother of Sisera looked out at a window, and cried through the lattice, Why is his chariot *so* long in coming? why tarry the wheels of his chariots?", "29": "Her wise ladies answered her, yea, she returned answer", "30": "Have they not sped? have they *not* divided the prey; to every man a damsel *or* two; to Sisera a prey of divers colours, a prey of divers colours of needlework, of divers colours of needlework on both sides, *meet* for the necks of *them that take* the spoil?", "31": "So let all thine enemies perish, O LORD: but *let* them that love him *be* as the sun when he goeth forth in his might. And the land had rest forty years."}}, "tsk": {"1": [{"kopje": "zong Debora", "refs": ["Ex 15:1", "Ex 15:21", "Num 21:17", "1 Sam 2:1", "2 Kron 20:21", "2 Kron 20:27", "Job 38:7", "Ps 18:2", "Jes 12:1-6", "Jes 25:1", "Jes 26:1", "Luk 1:46", "Luk 1:67", "Luk 1:68", "Openb 15:3", "Openb 15:4", "Openb 19:1-3"]}], "2": [{"kopje": "om het wreken", "refs": ["Deut 32:43", "2 Sam 22:47", "2 Sam 22:48", "Ps 18:48", "Ps 48:12", "Ps 94:1", "Ps 97:8", "Ps 136:15", "Ps 136:19", "Ps 136:20", "Ps 149:6-9", "Openb 16:5", "Openb 16:6", "Openb 18:20", "Openb 19:2"]}, {"kopje": "dat", "refs": ["Richt 5:9", "2 Kron 17:16", "Neh 11:2", "Ps 110:3", "1 Kor 9:17", "2 Kor 8:12", "2 Kor 9:7", "Fil 2:13", "Filem 1:14"]}], "3": [{"kopje": "u koningen", "refs": ["Deut 32:1", "Deut 32:3", "Ps 2:10-12", "Ps 49:2", "Ps 49:3", "Ps 119:46", "Ps 138:4", "Ps 138:5"]}, {"kopje": "Ik", "r abel": null}, {"disp": "Openb 1:16", "href": "../../openbaring/1/#v16", "ref": "Openb 1:16", "svLabel": null}, {"disp": "Openb 12:1", "href": "../../openbaring/12/#v1", "ref": "Openb 12:1", "svLabel": null}, {"disp": "Openb 19:17", "href": "../../openbaring/19/#v17", "ref": "Openb 19:17", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Saints, Compared To", "href": "../../torrey/s/#t-saints-compared-to", "kinderen": [{"label": "The sun", "href": "../../torrey/s/?hl=Judg.5.31#i18311", "refs": [{"disp": "Richt 5:31", "href": "../../richteren/5/#v31", "ref": "Richt 5:31", "svLabel": null}, {"disp": "Matt 13:43", "href": "../../mattheus/13/#v43", "ref": "Matt 13:43", "svLabel": null}], "kinderen": []}]}, {"topic": "Sun, The", "href": "../../torrey/s/#t-sun-the", "kinderen": [{"label": "The power and brilliancy of its rising alluded to", "href": "../../torrey/s/?hl=Judg.5.31#i20473", "refs": [{"disp": "Richt 5:31", "href": "../../richteren/5/#v31", "ref": "Richt 5:31", "svLabel": null}, {"disp": "2 Sam 23:4", "href": "../../2-samuel/23/#v4", "ref": "2 Sam 23:4", "svLabel": null}], "kinderen": []}, {"label": "Illustrative", "href": "../../torrey/s/?hl=Judg.5.31#i20501", "refs": [], "kinderen": [{"label": "(Its power,) of the triumph of saints", "href": "../../torrey/s/?hl=Judg.5.31#i20508", "refs": [{"disp": "Richt 5:31", "href": "../../richteren/5/#v31", "ref": "Richt 5:31", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Deut 32:43": "Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Micha 7:9": "Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "Richt 5:18-20": "Zebulon, het is een volk, dat zijn ziel versmaad heeft ter dood, evenzo Nafthali, op de hoogten van het veld. De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan. Vanuit de hemel streden zij, de sterren uit hun loopplaatsen streden tegen Sisera.", "Ps 48:5-7": "Want zie, de koningen waren verzameld; zij waren samen doorgetrokken. Zoals zij het zagen, zo waren zij verwonderd; zij werden verschrikt, zij haastten weg. Beving greep hen daar aan, smart als van een barende vrouw.", "1 Kron 16:36": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid tot eeuwigheid! En al het volk zei: Amen! en het loofde de HEERE.", "Jes 34:9": "En hun beken zullen in pek veranderd worden, en hun stof in zwavel; ja, hun land zal tot brandend pek worden.", "Gen 49:13": "Zebulon zal aan de haven van de zeeën wonen, en hij zal aan de haven van de schepen wezen; en zijn grens zal zijn naar Sidon.", "Ex 16:32": "Verder zei Mozes: Dit is het woord dat de HEERE geboden heeft: Vul een gomer daarvan tot bewaring voor uw geslachten, opdat zij het brood zien dat Ik u te eten gegeven heb in deze woestijn, toen Ik u uit Egypte leidde.", "Jes 5:28": "Hun pijlen zullen scherp zijn, en al hun bogen gespannen; de hoeven van hun paarden zullen als een rots geacht worden, en hun wielen als een wervelwind.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Ezech 27:19": "Ook leverden Dan en Javan, de omreizer, op uw markten; glad ijzer, kassie en kalmoes was in uw onderlinge koophandel.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "Openb 19:19": "En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Deut 4:12": "Zo sprak de HEERE tot u uit het midden van het vuur; u hoorde de stem van de woorden, maar u zag geen gelijkenis, alleen de stem.", "1 Kron 15:24": "En Sebanja, en Josafat, en Nethaneel, en Amasai, en Zecharja, en Benaja, en Eliëzer, de priesters, bliezen op trompetten voor de ark van God; en Obed-edom en Jehia waren poortwachters van de ark.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Filem 1:14": "Maar ik heb zonder uw goedvinden niets willen doen, opdat uw weldaad niet zou zijn als door dwang, maar vrijwillig.", "Ps 48:11": "Zoals Uw Naam is, o God! zo is Uw roem tot aan de einden van de aarde; Uw rechterhand is vol van gerechtigheid.", "Deut 12:18": "Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt.", "1 Kon 8:38": "elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Ps 111:1": "Halleluja! Aleph. Ik zal de HEERE loven van ganser harte; Beth. in de raad en vergadering van de oprechten.", "1 Kon 1:40": "En al het volk kwam achter hem aan omhoog, en het volk speelde op fluiten, en verblijdde zich met grote blijdschap, zodat de aarde van hun geluid barstte.", "Openb 19:2": "Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft.", "Ps 68:33-35": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.", "Num 10:35": "Het gebeurde nu bij het optrekken van de ark, dat Mozes zei: Sta op, HEERE! En laat Uw vijanden verstrooid worden, en laat Uw haters van Uw aangezicht vluchten!", "Jes 14:2": "En de volken zullen hen aannemen, en naar hun plaats brengen; en het huis van Israël zal hen erfelijk bezitten in het land van de HEERE tot knechten en tot dienstmeisjes; en zij zullen gevangen houden wie hen gevangen hielden, en zij zullen heersen over hun onderdrukkers.", "Ps 48:5": "Want zie, de koningen waren verzameld; zij waren samen doorgetrokken.", "Ps 144:9": "O God, ik zal U een nieuw lied zingen; met de luit en het tiensnarig instrument zal ik U lofzingen.", "Ps 104:32": "Als Hij de aarde aanschouwt, dan beeft zij; als Hij de bergen aanraakt, dan roken zij.", "Num 3:48-51": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten. Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten. Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig sikkels, naar de sikkel van het heiligdom.", "2 Kron 20:22": "Toen zij nu begonnen met vreugdegeroep en lofzang, stelde de HEERE hinderlagen tegen de kinderen van Ammon, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden verslagen.", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "2 Kron 5:12": "en de Levieten, die zangers waren, van hen allen, van Asaf, van Heman, van Jeduthun, en van hun zonen, en van hun broeders, in fijn linnen gekleed, met cimbalen, en met luiten, en harpen, stonden aan de oostzijde van het altaar, en met hen tot honderdtwintig priesters toe, die op trompetten trompetten);", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Mark 14:11": "En zij, die dit hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.", "Ps 145:11": "Caph. Zij zullen de heerlijkheid van Uw Koninkrijk vermelden, en Uw macht zullen zij uitspreken.", "Lev 27:15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "Ps 30:5": "Zingt psalmen voor de HEERE, u, Zijn gunstgenoten! en looft ter gedachtenis aan Zijn heiligheid.", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "Luk 19:23": "Waarom hebt u dan mijn geld niet bij de bank gebracht, zodat ik het bij mijn komst met rente had kunnen opeisen?", "Neh 3:5": "Vervolgens aan hun hand verbeterden de Thekoïeten; maar hun voortreffelijke mannen brachten hun hals niet onder de dienst van hun Heer.", "1 Sam 26:19": "En nu, laat mijn heer de koning toch luisteren naar de woorden van zijn dienaar. Als de HEERE u tegen mij opzet, laat Hem dan het spijsoffer ruiken; maar als het mensenkinderen zijn, dan zijn zij vervloekt voor het aangezicht van de HEERE, omdat zij mij vandaag verjaagd hebben, zodat ik niet vast verbonden kan blijven aan het erfdeel van de HEERE, en zeggen: Ga heen, dien andere goden.", "Jes 41:15": "Zie, Ik heb u gemaakt tot een scherpe nieuwe dorsslede, die scherpe punten heeft; u zult bergen dorsen en verpulveren, en heuvels zult u maken als kaf.", "1 Sam 17:19": "Saul nu, en zij, en alle mannen van Israël waren bij het eikendal met de Filistijnen aan het strijden.", "Gen 14:22": "Doch Abram zei tegen de koning van Sodom: Ik heb mijn hand opgeheven tot de HEERE, de allerhoogste God, Die hemel en aarde bezit;", "Ps 135:3": "Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "Rom 10:1": "Broeders, de toegenegenheid van mijn hart en het gebed dat ik tot God doe voor Israël, is tot hun zaligheid.", "2 Sam 19:35": "Ik ben vandaag tachtig jaar oud; zou ik nog kunnen onderscheiden tussen goed en kwaad? Zou uw knecht kunnen proeven wat ik eet en wat ik drink? Zou ik nog kunnen horen naar de stem van zangers en zangeressen? En waarom zou uw knecht mijn heer de koning nog langer tot last zijn?", "Ef 5:20": "en dank altijd voor alle dingen God en de Vader, in de Naam van onze Heere Jezus Christus,", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "1 Kor 8:3": "Maar als iemand God liefheeft, die is door Hem gekend.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Openb 2:27": "En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.", "Jes 14:11": "Uw hoogmoed is in het rijk van de dood neergestort, met het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.", "2 Kron 20:19": "En de Levieten uit de kinderen van de Kahathieten en uit de kinderen van de Korachieten stonden op om de HEERE, de God van Israël, met luide stem uitbundig te prijzen.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Ex 12:17": "Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "Deut 14:25": "Zo maak het tot geld, en bind het geld in uw hand, en ga naar de plaats die de HEERE, uw God, zal uitkiezen;", "Ps 50:14": "Offert God dank, en betaalt de Allerhoogste uw geloften.", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Deut 33:2": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen.", "Jer 7:2": "Sta in de poort van het huis van de HEERE, en roep daar dit woord uit, en zeg: Hoor het woord van de HEERE, heel Juda! U die door deze poorten ingaat om de HEERE te aanbidden.", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Ps 150:1-6": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte! Loof Hem vanwege Zijn machtige daden; loof Hem naar de overvloed van Zijn grootheid! Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Dan 3:7": "Daarom, op dat moment, toen al die volken het geluid hoorden van de hoorn, de pijp, de citer, de vedel, de psalters, en allerlei soorten muziek, vielen alle volken, naties en tongen neer en aanbaden het gouden beeld, dat de koning Nebukadnezar had opgericht.", "Ps 18:2": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte!", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Deut 4:11": "En u kwam dichterbij en stond onder aan die berg (die berg brandde nu van vuur tot aan het midden van de hemel; er was duisternis, wolken en donkerheid).", "1 Tim 4:3-5": "die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen. Want alles wat God geschapen heeft, is goed, en niets is verwerpelijk als het met dankzegging aangenomen wordt; want het wordt geheiligd door het Woord van God en door het gebed.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "Ex 14:12": "Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Micha 3:12": "Daarom, om uwentwil, zal Sion als een akker geploegd worden, en Jeruzalem zal tot steenhopen worden, en de berg van dit huis tot hoogten van een woud.", "Rom 3:4-6": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt. Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.) Dat zij verre, anders hoe zal God de wereld oordelen?", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "1 Kon 19:14": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "1 Sam 25:28": "Vergeef toch uw dienstmaagd de overtreding, want de HEERE zal mijn heer zeker een bestendig huis maken, omdat mijn heer de oorlogen van de HEERE voert, en er geen kwaad bij u gevonden is al uw dagen.", "Hand 15:39": "Er ontstond dan een verbittering, zodat zij van elkaar gescheiden zijn; en Barnabas nam Markus mee, en scheepte af naar Cyprus;", "Ps 95:2": "Laat ons Zijn aangezicht tegemoet gaan met lof; laat ons Hem juichen met psalmen.", "2 Kron 35:25": "En Jeremia maakte een klaaglied over Josia; evenzo spraken alle zangers en zangeressen in hun klaagliederen van Josia, tot op deze dag; want zij gaven ze tot een inzetting in Israël; en zie, zij zijn geschreven in de klaagliederen.", "Openb 17:12-14": "En de tien horens die u gezien hebt, zijn tien koningen, die het koninkrijk nog niet ontvangen hebben, maar die als koningen macht ontvangen voor één uur, samen met het beest. Dezen hebben één en dezelfde gezindheid, en zullen hun kracht en macht aan het beest overgeven. Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "1 Kon 18:22": "Toen zei Elia tegen het volk: Ik ben als enige profeet van de HEERE overgebleven, en de profeten van Baäl zijn vierhonderdvijftig mannen.", "Ps 103:1": "Een psalm van David. Loof de HEERE, mijn ziel, en al wat binnen in mij is, Zijn heilige Naam.", "2 Kron 31:2": "En Hizkia stelde de verdelingen van de priesters en de Levieten in, naar hun verdelingen, ieder naar zijn dienst, de priesters en de Levieten voor het brandoffer en voor de dankoffers, om te dienen, en om te loven, en om te prijzen in de poort van de legerplaatsen van de HEERE;", "Est 9:19": "Daarom maakten de Joden van de dorpen, die in de dorpsteden woonden, van de veertiende dag van de maand Adar een dag van vreugde en maaltijden, en een vrolijke dag, en van het zenden van gedeelten aan elkaar.", "Ps 100:1-5": "Een lofzang. Heel de aarde, juich voor de HEERE! Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang. Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "Richt 4:17": "Maar Sisera vluchtte te voet naar de tent van Jaël, de vrouw van Heber, de Keniet; want er was vrede tussen Jabin, de koning van Hazor, en het huis van Heber, de Keniet.", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Deut 32:3": "Want ik zal de Naam van de HEERE uitroepen; geef onze God grootheid!", "Rom 3:21": "Maar nu is de gerechtigheid van God geopenbaard, zonder de wet, met getuigenis van de wet en de profeten:", "1 Kron 22:5": "Want David zei: Mijn zoon Salomo is een jongeman en teder; en het huis dat men voor de HEERE bouwen zal, moet buitengewoon groot gemaakt worden, tot een naam en tot glorie in alle landen; ik zal er nu voorraad voor bereiden. Zo bereidde David voorraad in overvloed voor zijn dood.", "Ps 132:8-10": "Sta op, HEERE, tot Uw rust, U en de ark van Uw sterkte! Dat Uw priesters bekleed worden met gerechtigheid, en dat Uw gunstgenoten juichen. Wend het gezicht van Uw gezalfde niet af, om Davids wil, Uw dienaar.", "Rom 9:14": "Wat zullen wij dan zeggen? Is er onrechtvaardigheid bij God? Dat zij verre.", "Ps 136:20": "En Og, de koning van Basan; want Zijn goedertierenheid is voor eeuwig.", "Job 30:31": "Hierom is mijn harp tot een rouwklacht geworden, en mijn orgel tot een stem van hen die wenen.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "2 Kor 9:7": "Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief.", "Job 36:3": "Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "Ps 116:5": "De HEERE is genadig en rechtvaardig, en onze God ontfermt Zich.", "Ex 19:18": "En de hele berg Sinaï rookte, omdat de HEERE daarop neerkwam in vuur; en zijn rook steeg op, als de rook van een oven; en de hele berg beefde erg.", "Richt 4:18": "Jaël nu ging naar buiten, Sisera tegemoet, en zei tegen hem: Kom binnen, mijn heer, kom bij mij binnen, wees niet bang! En hij kwam bij haar binnen in de tent, en zij bedekte hem met een deken.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "Ps 99:5": "Verhef de HEERE, onze God, en buig u neer voor de voetbank van Zijn voeten; Hij is heilig!", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Gen 47:14-18": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao. Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "Ps 135:1": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE!", "Ezra 2:64": "Deze hele gemeente samen was tweeënveertigduizend driehonderdzestig.", "Jes 56:1": "Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "1 Kon 21:2": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven.", "Ps 134:3": "De HEERE zegent u uit Sion, Hij, Die de hemel en de aarde gemaakt heeft.", "Luk 1:67-75": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei: Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "1 Kor 16:22": "Als iemand de Heere Jezus Christus niet liefheeft, laat die een vervloeking zijn; Maran-atha!", "Ps 119:142": "Uw gerechtigheid is gerechtigheid in eeuwigheid, en Uw wet is de waarheid.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Jes 63:17-19": "HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel. Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden. Wij zijn geworden als zij over wie U van ouds niet hebt geheerst, en die naar Uw Naam niet genoemd zijn.", "Job 20:17": "De stromen, rivieren, beken van honing en boter zal hij niet zien.", "Matt 28:15": "En zij namen het geld, en deden zoals hun geleerd was. En dit verhaal is onder de Joden verspreid geraakt tot op deze huidige dag.", "Ex 34:9": "En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga dan nu de Heere in ons midden, want dit is een hardnekkig volk; maar vergeef onze ongerechtigheid en onze zonde, en neem ons aan tot een erfdeel!", "1 Sam 31:9": "En zij hakten zijn hoofd af, en trokken zijn wapenrusting uit, en zonden die in het land van de Filistijnen rondom, om het bekend te maken in het huis van hun afgoden en onder het volk.", "Ex 22:7": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.", "Fil 1:9": "En dit bid ik God, dat uw liefde nog meer en meer overvloedig wordt in kennis en alle inzicht;", "Ps 66:8": "Looft, volken, onze God; en laat de stem van Zijn roem horen.", "1 Joh 5:2": "Hieraan weten wij, dat wij de kinderen van God liefhebben, wanneer wij God liefhebben, en Zijn geboden bewaren.", "Ex 13:14-16": "Wanneer het zal gebeuren dat uw zoon u later zal vragen en zegt: Wat is dat, dan moet u tegen hem zeggen: De HEERE heeft ons door een sterke hand uit Egypte, uit het diensthuis, uitgevoerd. Want het gebeurde, toen de farao zich verhardde om ons te laten gaan, dat de HEERE alle eerstgeborenen in Egypteland doodde, van de eerstgeborene van de mens af tot de eerstgeborene van het vee; daarom offer ik aan de HEERE de mannetjes van alles wat de baarmoeder opent; maar alle eerstgeborenen van mijn zonen koop ik vrij. En het zal tot een teken zijn op uw hand, en tot voorhoofdsbanden tussen uw ogen; want de HEERE heeft ons door een sterke hand uit Egypte uitgevoerd.", "Neh 11:2": "En het volk zegende alle mannen, die vrijwillig aanboden te Jeruzalem te wonen.", "Ps 141:5": "Laat de rechtvaardige mij slaan, het zal weldadigheid zijn; en laat hij mij bestraffen, het zal olie van het hoofd zijn, het zal mijn hoofd niet breken; want ook dan zal mijn gebed voor hen zijn in hun tegenspoeden.", "Spr 25:20": "Wie liederen zingt bij een treurig hart, is als iemand die een kleed aflegt op de dag van de koude, en als azijn op salpeter.", "Jes 64:3": "Toen U vreselijke dingen deed, die wij niet verwachtten; U kwam neer, van Uw aangezicht smolten de bergen weg.", "2 Kon 1:2": "En Ahazia viel door een traliewerk in zijn bovenzaal, die te Samaria was, en werd ziek. En hij zond boden en zei tegen hen: Ga heen, vraag Baäl-Zebub, de god van Ekron, of ik van deze ziekte genezen zal worden.", "Ps 99:3": "Laat men Uw grote en ontzagwekkende Naam loven, die heilig is;", "Jes 38:18": "Want het graf zal U niet loven, de dood zal U niet prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "Ps 87:7": "En de zangers, evenals de speellieden, alsook al mijn bronnen, zullen binnen u zijn.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Ps 144:5": "Buig Uw hemelen, HEERE, en daal neer; raak de bergen aan, zodat ze roken.", "Micha 7:14": "Weid Ú dan Uw volk met Uw staf, de kudde van Uw erfenis, die alleen woont, in het woud, midden in een vruchtbaar land; laat ze weiden in Basan en Gilead, als in de dagen van ouds.", "Ps 101:1": "Een psalm van David. Ik zal van goedertierenheid en recht zingen; U zal ik psalmzingen, o HEERE!", "Jer 51:3": "De schutter spant zijn boog tegen wie spant, en tegen wie zich verheft in zijn pantser; en verschoont haar jongelingen niet, verbant heel haar leger;", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "Kol 1:12": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht;", "Kol 1:9": "Daarom houden ook wij, vanaf de dag dat wij het gehoord hebben, niet op voor u te bidden en te vragen dat u vervuld mag worden met de kennis van Zijn wil, in alle wijsheid en geestelijk verstand;", "Luk 24:52": "En zij aanbaden Hem, en keerden terug naar Jeruzalem met grote blijdschap.", "Ps 80:15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,", "2 Kor 13:7": "En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "Ps 107:8": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Richt 5:1-31": "Verder zong Debora, en Barak, de zoon van Abinoam, op dezelfde dag, en zei: Looft de HEERE, om het wreken van de wraken in Israël, om dat het volk zich gewillig heeft aangeboden. Hoor, u koningen, neem het ter ore, u vorsten! Ik, den HEERE zal ik zingen, ik zal den HEERE, de God van Israël, psalmzingen.", "Hand 20:24": "Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.", "Jes 25:10": "Want de hand van de HEERE zal op deze berg rusten; maar Moab zal onder Hem verdorst worden, zoals het stro verdorst wordt tot mest.", "Ef 3:14-19": "Om deze reden buig ik mijn knieën voor de Vader van onze Heere Jezus Christus, uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt, opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "Mark 14:26": "En nadat zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.", "1 Kon 21:6": "En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.", "Ps 89:6": "Daarom loven de hemelen Uw wonderen, o HEERE! ook is Uw getrouwheid in de gemeente van de heiligen.", "1 Sam 2:1": "Toen bad Hanna en zei: Mijn hart springt van vreugde op in de HEERE; mijn hoorn is verhoogd in de HEERE; mijn mond is wijd opengedaan over mijn vijanden; want ik verheug mij in Uw heil.", "Ps 45:2": "Mijn hart geeft een goede rede op; ik spreek mijn gedichten uit van een Koning; mijn tong is een pen van een vaardige schrijver.", "Ps 67:4": "De volken zullen U, o God, loven; de volken, allemaal, zullen U loven.", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Ps 147:1-20": "Looft de HEERE, want onze God te bezingen is goed, omdat Hij liefelijk is; de lof is Hem waardig. De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël. Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "Jer 15:9": "Zij die zeven kinderen baarde, is zwak geworden; zij heeft haar ziel uitgeblazen, haar zon is ondergegaan, toen het nog dag was; zij is beschaamd en te schande geworden; en hun overblijfsel zal Ik aan het zwaard overgeven, voor het aangezicht van hun vijanden, spreekt de HEERE.", "Dan 7:18-27": "Maar de heiligen van de hoge plaatsen zullen dat Koninkrijk ontvangen, en zij zullen het Rijk bezitten tot in eeuwigheid, ja, tot in eeuwigheid der eeuwigheden. Toen wilde ik de waarheid weten over het vierde dier, dat verschillend was van al de andere, zeer gruwelijk, welks tanden van ijzer waren, en zijn klauwen van koper; het at, het verbrijzelde, en vertrapte het overige met zijn voeten. En aangaande de tien horens die op zijn hoofd waren, en de andere, die opkwam, en voor wie er drie afgevallen waren, namelijk die horen, die ogen had, en een mond, die grote dingen sprak, en wiens aanzien groter was dan van zijn metgezellen.", "Ps 114:4": "De bergen sprongen als rammen, de heuvels als lammeren.", "2 Kor 6:1": "En wij, als medearbeiders, bidden u ook dat u de genade van God niet tevergeefs mag hebben ontvangen.", "2 Kron 30:18": "Want een menigte van het volk, velen uit Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet zoals geschreven is. Doch Hizkia bad voor hen, en zei: De HEERE, die goed is, doe verzoening voor ieder,", "Rom 11:36": "Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid tot in eeuwigheid. Amen.", "1 Kron 25:1": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst.", "Ex 12:42": "Deze nacht zal men de HEERE zeer nauwgezet houden, omdat Hij hen uit Egypteland geleid heeft; deze is de nacht van de HEERE, die zeer nauwgezet gehouden moet worden, door alle kinderen van Israël, onder hun geslachten.", "Matt 25:18": "Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.", "Richt 8:28": "Zo werden de Midianieten onderworpen voor de ogen van de Israëlieten, en zij durfden hun hoofd niet meer op te heffen. En het land had veertig jaar rust, in de dagen van Gideon.", "Richt 3:27": "En het gebeurde, toen hij aankwam, dat hij op de bazuin blies op het gebergte van Efraïm; en de kinderen van Israël trokken met hem af van het gebergte, en hij zelf ging voor hen uit.", "Ps 80:20": "HEERE, God van de heerscharen! Breng ons terug; laat Uw aanschijn lichten, zo zullen wij verlost worden.", "Jer 9:2": "Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop.", "1 Kron 16:34": "Looft de HEERE, want Hij is goed, want Zijn goedertierenheid is tot in eeuwigheid.", "Ps 119:171": "Mijn lippen zullen Uw lof overvloedig uitstorten, als U mij Uw inzettingen zult geleerd hebben.", "Ef 1:15-19": "Daarom ook ik, nadat ik gehoord heb van het geloof in de Heere Jezus, dat onder u is, en de liefde tot al de heiligen, Houd niet op voor u te danken, en u te gedenken in mijn gebeden; Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "Ps 7:18": "Ik zal de HEERE loven naar Zijn gerechtigheid, en voor de Naam van de HEERE, de Allerhoogste, psalmzingen.", "Gen 48:15-20": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag; Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land! Toen Jozef zag dat zijn vader zijn rechterhand op het hoofd van Efraïm legde, was dat niet goed in zijn ogen, en hij greep de hand van zijn vader vast, om die van het hoofd van Efraïm naar het hoofd van Manasse te brengen.", "Jer 8:11": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Terwijl er geen vrede is.", "Openb 14:2": "En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers;", "Num 11:21": "En Mozes zei: Zeshonderdduizend man te voet is dit volk, in wiens midden ik ben; en U hebt gezegd: Ik zal hun vlees geven, en zij zullen een hele maand eten!", "1 Tim 2:1": "Ik vermaan dan voor alle dingen, dat er smekingen, gebeden, voorbiddingen en dankzeggingen gedaan worden voor alle mensen;", "Matt 28:12": "En zij kwamen samen met de oudsten, en namen samen een besluit, en gaven de soldaten veel geld,", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "Richt 13:3": "En een Engel van de HEERE verscheen aan deze vrouw, en Hij zei tegen haar: Zie toch, u bent onvruchtbaar en hebt geen kinderen gebaard; maar u zult zwanger worden en een zoon baren.", "2 Sam 23:4": "En Hij zal zijn gelijk het licht van de morgen, wanneer de zon opgaat, een morgen zonder wolken, wanneer door de glans na de regen de grasscheutjes uit de aarde voortkomen.", "Jer 31:7": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël.", "Ex 32:32": "Nu dan, als Gij hun zonde wilt vergeven! Maar zo niet, delg mij dan nu uit Uw boek, dat Gij geschreven hebt.", "Deut 32:17": "Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.", "1 Tess 1:2": "Wij danken God altijd voor u allen, terwijl wij aan u denken in onze gebeden;", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "Est 4:16": "Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om.", "Ps 71:8": "Laat mijn mond vervuld worden met Uw lof, de hele dag met Uw heerlijkheid.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "1 Sam 25:23": "Toen Abigaïl nu David zag, haastte zij zich, en kwam van de ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde.", "Lev 27:18": "Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "1 Kron 16:42": "Met hen dan waren Heman en Jeduthun, met trompetten en cimbalen voor hen die zich lieten horen, en met instrumenten van de muziek van God; maar de zonen van Jeduthun waren aan de poort.", "Ezech 33:32": "En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.", "2 Tim 2:26": "en zij weer mochten ontwaken uit de strik van de duivel, door wie zij gevangen waren om diens wil te doen.", "Richt 5:16-18": "Waarom bleef u zitten tussen de stallingen, om te horen het geblaat van de kudden? De gedeelten van Ruben hadden grote onderzoekingen van het hart. Gilead bleef aan de andere zijde van de Jordaan; en Dan, waarom onthield hij zich in schepen! Aser zat aan de zeehaven, en bleef in zijn gescheurde plaatsen. Zebulon, het is een volk, dat zijn ziel versmaad heeft ter dood, evenzo Nafthali, op de hoogten van het veld.", "1 Sam 7:10": "En het gebeurde, terwijl Samuël dat brandoffer offerde, dat de Filistijnen naderden ten strijde tegen Israël; en de HEERE donderde die dag met een grote donder over de Filistijnen, en Hij bracht hen in verwarring, zodat zij verslagen werden voor het aangezicht van Israël.", "2 Tess 1:11": "Daarom bidden wij ook altijd voor u, dat onze God u waardig acht voor deze roeping, en al het welbehagen van Zijn goedheid vervult, en het werk van het geloof met kracht.", "Ps 19:5": "Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.", "Ps 128:6": "En u zult uw kleinkinderen zien. Vrede over Israël!", "Ps 143:1": "Een psalm van David. O HEERE, hoor mijn gebed, neig de oren tot mijn smekingen; verhoor mij naar Uw waarheid, naar Uw gerechtigheid.", "1 Sam 13:19-22": "En er werd geen smid gevonden in het hele land van Israël; want de Filistijnen hadden gezegd: Anders maken de Hebreeën zwaard of speer. Daarom moest heel Israël naar de Filistijnen aftrekken, om ieder zijn ploegijzer, of zijn spade, of zijn bijl, of zijn houweel te laten scherpen. Maar zij hadden tandige vijlen voor hun houwelen, en voor hun spaden, en voor de drietandige vorken, en voor de bijlen, en om de prikkels scherp te maken.", "Jes 52:2": "Schud u uit het stof, sta op, ga zitten, o Jeruzalem! Maak u los van de banden van uw hals, u gevangen dochter van Sion!", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Matt 6:33": "Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "Ps 65:2": "De lofzang is in stilte tot U, o God! in Sion; en U zal de gelofte betaald worden.", "Ps 119:40": "Zie, ik heb een begeerte tot Uw bevelen; maak mij levend door Uw gerechtigheid.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Openb 16:5": "En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt;", "Jak 1:9": "Maar de broeder die nederig is, moet roemen in zijn hoogheid.", "Richt 4:6": "En zij zond heen en riep Barak, de zoon van Abinoam, van Kedes-nafthali; en zij zei tegen hem: Heeft de HEERE, de God van Israël, niet geboden: Ga heen en trek op naar de berg Thabor, en neem met u tienduizend man, van de kinderen van Nafthali en van de kinderen van Zebulon?", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Ps 56:11": "In God zal ik het woord prijzen; in de HEERE zal ik het woord prijzen.", "Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "Ps 61:9": "Zo zal ik Uw Naam psalmzingen in eeuwigheid; opdat ik mijn geloften betaal, dag bij dag.", "Ps 97:5": "De bergen smelten als was voor het aangezicht van de HEERE, voor het aangezicht van de Heere van de hele aarde.", "Richt 5:20-31": "Vanuit de hemel streden zij, de sterren uit hun loopplaatsen streden tegen Sisera. De beek Kison wentelde hen weg, de beek Kedumin, de beek Kison; vertrap, o mijn ziel! de sterken. Toen werden de paardenhoeven verpletterd, van het rennen, het rennen van zijn machtigen.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Lev 22:11": "Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.", "1 Sam 18:17": "Daarom zei Saul tegen David: Zie, mijn oudste dochter Merab zal ik u tot vrouw geven; alleen, wees mij een dapper man en voer de oorlogen van de HEERE. Want Saul zei: Laat mijn hand niet tegen hem zijn, maar laat de hand van de Filistijnen tegen hem zijn.", "Jes 28:6": "en tot een Geest van het oordeel voor hem die te oordelen zit, en tot een sterkte voor hen die de strijd terugdrijven tot aan de poort toe.", "Ps 48:6": "Zoals zij het zagen, zo waren zij verwonderd; zij werden verschrikt, zij haastten weg.", "Ps 47:8": "Want God is een Koning van de hele aarde; zingt psalmen met verstand!", "Ex 17:8-16": "Toen kwam Amalek en streed tegen Israël bij Rafidim. Mozes zei toen tegen Jozua: Kies mannen voor ons uit, en trek eropuit, strijd tegen Amalek; morgen zal ik op de top van de heuvel staan, met de staf van God in mijn hand. Jozua deed zoals Mozes hem gezegd had, en streed tegen Amalek; maar Mozes, Aäron en Hur klommen op de top van de heuvel.", "1 Sam 13:22": "En het gebeurde op de dag van de strijd, dat er geen zwaard of speer gevonden werd in de hand van het hele volk dat bij Saul en bij Jonathan was; maar bij Saul en bij Jonathan, zijn zoon, werden ze wel gevonden.", "Ps 71:19": "Ook is Uw gerechtigheid, o God, tot in de hoogte; Gij, Die grote dingen gedaan hebt; o God! wie is U gelijk?", "1 Kon 8:29": "Dat Uw ogen open zijn, nacht en dag, over dit huis, over deze plaats, waarvan U gezegd hebt: Mijn Naam zal daar zijn; om te horen naar het gebed, dat Uw dienaar bidden zal op deze plaats.", "Neh 12:27-31": "Bij de inwijding nu van de muur van Jeruzalem, zochten zij de Levieten op uit al hun plaatsen, om hen naar Jeruzalem te brengen, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen. Zo werden de kinderen van de zangers verzameld, zowel uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten; En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.", "Ps 107:2": "Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft.", "Ps 51:17": "Heere, open mijn lippen, zo zal mijn mond Uw lof verkondigen.", "Ps 122:6": "Bid om de vrede van Jeruzalem; het moet goed gaan met hen die u liefhebben.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Num 22:21-33": "Toen stond Bileam 's morgens op, en zadelde zijn ezelin, en hij trok heen met de vorsten van Moab. Doch de toorn van God ontstak, omdat hij heenging; en de Engel van de HEERE stelde Zich in de weg, als tegenpartij tegen hem; hij reed op zijn ezelin, en twee van zijn knechten waren bij hem. De ezelin nu zag de Engel van de HEERE staan in de weg, met Zijn getrokken zwaard in Zijn hand; daarom week de ezelin van de weg af, en ging het veld in. Toen sloeg Bileam de ezelin, om haar weer op de weg te laten gaan.", "1 Joh 3:16": "Hieraan hebben wij de liefde gekend, dat Hij Zijn leven voor ons gesteld heeft; en wij zijn schuldig het leven te stellen voor de broeders.", "Jes 64:1-3": "Och, dat U de hemelen scheurde, dat U neerkwam, dat de bergen van Uw aangezicht wegsmolten; Zoals een smeltvuur brandt, en het vuur het water doet opborrelen, om Uw Naam aan Uw tegenstanders bekend te maken! Laat zo de heidenen voor Uw aangezicht beven. Toen U vreselijke dingen deed, die wij niet verwachtten; U kwam neer, van Uw aangezicht smolten de bergen weg.", "Jes 8:1": "Verder zei de HEERE tegen mij: Neem u een grote rol, en schrijf daarop met een gewone schrijfstift: Haastende tot de roof, is hij spoedig tot de buit!", "Ezra 3:11": "En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE.", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "2 Kron 17:16": "Naast hem was Amasia, de zoon van Zichri, die zich vrijwillig aan de HEERE overgegeven had; en met hem waren tweehonderdduizend kloeke helden.", "1 Kron 15:27": "David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.", "Richt 4:10": "Toen riep Barak Zebulon en Nafthali bijeen te Kedes, en hij trok op, te voet, met tienduizend man; ook trok Debora met hem op.", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Joz 13:31": "En het halve Gilead, en Astharoth, en Edrei, steden van het koninkrijk van Og in Bazan, waren voor de kinderen van Machir, de zoon van Manasse, namelijk voor de helft van de kinderen van Machir, naar hun huisgezinnen.", "Neh 2:1-20": "Toen gebeurde het in de maand Nisan, in het twintigste jaar van koning Arthahsasta, als er wijn voor hem was, dat ik de wijn opnam en aan de koning gaf; nu was ik nooit eerder treurig geweest voor hem. Zo zei de koning tegen mij: Waarom is uw gezicht treurig, terwijl u toch niet ziek bent? Dit is niets anders dan treurigheid van het hart. Toen werd ik erg bevreesd, en ik zei tegen de koning: De koning leve in eeuwigheid! Hoe zou mijn gezicht niet treurig zijn, terwijl de stad, de plaats van de graven van mijn vaderen, verwoest is, en haar poorten met vuur verteerd zijn?", "Ps 35:28": "Zo zal mijn tong Uw gerechtigheid vermelden, en Uw lof de hele dag.", "2 Kron 23:13": "En zij keek toe; en zie, de koning stond bij zijn pilaar, bij de ingang; en de leiders en de trompetten waren bij de koning; en heel het volk van het land was blij, en blies op de trompetten; en de zangers waren er met muzikale instrumenten, en gaven aanwijzingen om lof te zingen; toen scheurde Athalia haar kleren, en riep: Verraad, verraad!", "2 Kon 22:9": "Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE.", "Deut 22:24": "Dan zult u hen beiden naar de poort van die stad brengen, en u zult hen met stenen stenigen, zodat zij sterven; de jonge dochter, omdat zij niet geroepen heeft, terwijl zij in de stad was, en de man, omdat hij de vrouw van zijn naaste vernederd heeft; zo zult u het kwaad uit uw midden wegdoen.", "Gen 35:1": "Daarna zei God tegen Jakob: Maak u op, trek op naar Bethel, en woon daar; en maak daar een altaar voor de God Die u verscheen, toen u vluchtte voor het aangezicht van uw broer Ezau.", "Kol 1:4": "sinds wij van uw geloof in Christus Jezus gehoord hebben, en van de liefde die u hebt tot alle heiligen.", "Ps 57:9": "Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken.", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "Richt 4:3": "Toen riepen de Israëlieten tot de HEERE; want hij had negenhonderd ijzeren wagens, en hij had de Israëlieten met geweld onderdrukt, twintig jaar.", "1 Kor 3:9": "Want wij zijn medearbeiders van God; akkerwerk van God, gebouw van God bent u.", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Deut 26:1-11": "Verder zal het gebeuren, wanneer u gekomen bent in het land dat de HEERE, uw God, u als erfelijk bezit geven zal, en u dat erfelijk bezit en daarin woont; dan zult u van de eerstelingen van alle vrucht van het land nemen, die u opbrengt van uw land dat de HEERE, uw God, u geeft, en zult ze in een korf leggen; en u zult gaan naar de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; en u zult komen bij de priester die er in die dagen zal zijn, en tegen hem zeggen: Ik verklaar heden voor de HEERE, uw God, dat ik gekomen ben in het land dat de HEERE onze vaderen gezworen heeft ons te zullen geven.", "Rom 16:27": "Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.", "Lev 26:28": "Dan zal Ik ook in verhitte woede tegen u in gaan, en Ik zal u ook zevenvoudig over uw zonden tuchtigen.", "1 Kron 25:6": "Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Ps 116:12-14": "Wat zal ik de HEERE vergelden voor al Zijn weldaden aan mij bewezen? Ik zal de beker der verlossingen opnemen, en de Naam van de HEERE aanroepen. Mijn geloften zal ik de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk.", "Hand 4:24": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.", "Joël 2:17": "Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Richt 3:11": "Toen was het land veertig jaren stil, en Othniël, de zoon van Kenaz, stierf.", "Jer 8:22": "Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Ps 88:13": "Zullen Uw wonderen bekend worden in de duisternis, en Uw gerechtigheid in het land van de vergetelheid?", "Kol 1:3": "Wij danken de God en Vader van onze Heere Jezus Christus, terwijl wij altijd voor u bidden,", "Jes 33:8": "De gebaande wegen zijn verwoest, wie over de paden gaat, houdt op; hij vernietigt het verbond, hij veracht de steden, hij telt geen mens.", "Num 10:36": "En als zij rustte, zei hij: Kom terug, HEERE, tot de tienduizenden van de duizenden van Israël!", "Ef 6:24": "De genade zij met allen die onze Heere Jezus Christus liefhebben in onvergankelijkheid. Amen. Vanuit Rome aan de Efeziërs geschreven, door bemiddeling van Tychikus.", "Richt 4:22": "En zie, Barak achtervolgde Sisera; en Jaël ging naar buiten hem tegemoet, en zei tegen hem: Kom, en ik zal u de man wijzen die u zoekt. Zo kwam hij bij haar binnen, en zie, Sisera lag dood, en de pin was in zijn slaap.", "1 Kor 9:17": "Want als ik dat gewillig doe, heb ik loon, maar als onwillig, is de uitdeling mij toch toevertrouwd.", "Richt 21:9": "Want het volk werd geteld, en zie, er was niemand van de inwoners van Jabes in Gilead.", "Ps 28:9": "Verlos Uw volk, en zegen Uw erfdeel, en weid hen, en verhef hen tot in eeuwigheid.", "Joh 17:25": "Rechtvaardige Vader, de wereld heeft U niet gekend; maar Ik heb U gekend, en dezen hebben erkend dat U Mij gezonden hebt.", "Ps 20:2-5": "De HEERE verhoort u in de dag van benauwdheid; de Naam van de God van Jakob zet u in een hoog vertrek. Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion. Hij gedenkt al uw spijsoffers, en maakt uw brandoffer tot as. Sela.", "Ps 96:7-9": "Geeft de HEERE, geslachten van de volken! Geeft de HEERE eer en sterkte. Geeft de HEERE de eer van Zijn Naam; brengt een offer, en komt in Zijn voorhoven. Aanbidt de HEERE in de heerlijkheid van het heiligdom; beeft voor Zijn aangezicht, heel de aarde.", "Ps 122:8": "Om mijn broeders en mijn vrienden zal ik nu zeggen: Vrede zij in u!", "1 Kon 19:10": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "Jer 4:2": "Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.", "Kol 3:15-17": "En laat de vrede van God heersen in uw harten, waartoe u ook geroepen bent in één lichaam; en wees dankbaar. Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart. En alles wat u doet, met woorden of met werken, doe dat alles in de Naam van de Heere Jezus, terwijl u God en de Vader dankt door Hem.", "1 Kron 16:41": "En met hen Heman en Jeduthun, en de overige uitgelezen mannen, die met naam uitgedrukt zijn om de HEERE te loven; want Zijn goedertierenheid is tot in eeuwigheid.", "1 Kon 18:40": "En Elia zei tegen hen: Grijp de profeten van Baäl, laat niemand van hen ontkomen. En zij grepen hen; en Elia voerde hen af naar de beek Kison, en slachtte hen daar.", "Matt 5:44": "Maar Ik zeg u: heb uw vijanden lief; zegen hen die u vervloeken; doe goed aan hen die u haten; en bid voor hen die u geweld aandoen en die u vervolgen;", "Ps 138:5": "En zij zullen zingen van de wegen van de HEERE, want de heerlijkheid van de HEERE is groot.", "Hoogl 2:9": "Mijn Liefste is gelijk een ree, of een jong van de herten; zie, Hij staat achter onze muur, kijkend uit de vensters, blinkend door de traliën.", "Gen 49:18": "Op Uw zaligheid wacht ik, HEERE!", "Ps 135:21": "Geloofd zij de HEERE uit Sion, Die te Jeruzalem woont. Halleluja!", "Ps 2:10-12": "Nu dan, koningen, handelt verstandig; laat u onderwijzen, rechters van de aarde! Dient de HEERE met vrees, en verheugt u met beving. Kust de Zoon, opdat Hij niet toornt, en u op de weg vergaat, wanneer Zijn toorn maar een weinig zou ontbranden. Gelukkig zijn allen die op Hem vertrouwen.", "Jer 31:26": "(Hierop ontwaakte ik, en zag toe, en mijn slaap was mij zoet.)", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Ps 80:18": "Uw hand zij over de man van Uw rechterhand, over de zoon van de mens, die U voor Uzelf gesterkt hebt.", "Rom 1:17": "Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.", "2 Sam 20:19": "Ik ben een van de vreedzamen, van de getrouwen in Israël, en u zoekt een stad te doden, die een moeder is in Israël; waarom zou u het erfdeel van de HEERE verslinden?", "1 Sam 18:7": "En de vrouwen, spelend, antwoordden elkaar en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden!", "Luk 2:20": "En de herders keerden terug, terwijl zij God verheerlijkten en prezen om alles wat zij gehoord en gezien hadden, zoals tegen hen gesproken was.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Ps 89:17": "Zij zullen zich de hele dag verheugen in Uw Naam, en door Uw gerechtigheid verhoogd worden.", "Ps 136:15": "Farao met zijn leger stortte Hij in de Schelfzee; want Zijn goedertierenheid is voor eeuwig.", "Ps 48:12": "Laat de berg Sion blijde zijn; laat de dochters van Juda zich verheugen, om Uw oordelen wil.", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Ps 71:14": "Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.", "Ps 145:1-21": "Een lofzang van David. Aleph. O mijn God, U Koning! Ik zal U verhogen, en Uw Naam loven voor eeuwig en altijd. Beth. Elke dag zal ik U loven, en Uw Naam prijzen voor eeuwig en altijd. Gimel. De HEERE is groot en zeer te prijzen, en Zijn grootheid is ondoorgrondelijk.", "Jes 12:3": "En u zult water scheppen met vreugde uit de fonteinen van het heil;", "1 Kor 15:57": "Maar God zij dank, Die ons de overwinning geeft door onze Heere Jezus Christus.", "1 Kron 29:19": "En geef mijn zoon Salomo een volkomen hart, om Uw geboden, Uw getuigenissen en Uw inzettingen te houden; en om alles te doen, en om dit paleis te bouwen, dat ik klaargemaakt heb.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "1 Sam 18:6": "Het gebeurde nu, toen zij kwamen, en David terugkeerde van het verslaan van de Filistijn, dat de vrouwen uit al de steden van Israël uitgingen, met gezang en reidansen, koning Saul tegemoet, met tamboerijnen, met vreugde en met muziekinstrumenten.", "Richt 21:10": "Toen zond de vergadering daarheen twaalfduizend man, van de strijdbaarste; en zij geboden hun: Trekt heen, en slaat met de scherpte van het zwaard de inwoners van Jabes in Gilead, met de vrouwen en de kinderen.", "Ps 22:24": "U die de HEERE vreest, prijs Hem; al u nageslacht van Jakob, vereer Hem; en ontzie u voor Hem, al u nageslacht van Israël!", "Hand 8:15": "die, toen zij aangekomen waren, voor hen baden, opdat zij de Heilige Geest zouden ontvangen.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "2 Kron 20:27": "Daarna keerden alle mannen van Juda en Jeruzalem terug, en Josafat aan hun hoofd, om met blijdschap terug te keren naar Jeruzalem; want de HEERE had hen verblijd over hun vijanden.", "Matt 9:23": "En toen Jezus in het huis van de leider kwam, en de fluitspelers zag en de rumoerige menigte,", "Ex 31:6": "En Ik, zie, Ik heb hem Aholiab bijgevoegd, de zoon van Ahisamach, van de stam van Dan; en in het hart van ieder die wijs van hart is, heb Ik wijsheid gegeven; en zij zullen alles maken wat Ik u geboden heb.", "Ps 144:1": "Een psalm van David. Geprezen zij de HEERE, mijn Rotssteen, Die mijn handen leert voor de strijd, mijn vingers voor de oorlog;", "Joz 15:18": "En het gebeurde, toen zij bij hem kwam, dat zij hem aanspoorde om een veld van haar vader te vragen; en zij sprong van de ezel af; toen zei Kaleb tegen haar: Wat wilt u?", "Luk 22:5": "En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.", "Ps 105:1-45": "Looft de HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken. Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen. Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "Jes 30:32": "En overal waar die gegrondveste staf doorgegaan zal zijn (waarop de HEERE hem zal hebben doen rusten), daar zal men met trommels en harpen zijn; want met bewegende bestrijdingen zal Hij tegen hen strijden.", "Ef 5:14": "Daarom zegt Hij: Ontwaak, u die slaapt, en sta op uit de doden; en Christus zal over u lichten.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Gen 9:9": "Maar Ik, zie, Ik richt Mijn verbond op met u, en met uw nageslacht na u;", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "Neh 9:5": "En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!", "Ps 41:14": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid! Amen, ja, amen.", "Ps 57:8-10": "Mijn hart is standvastig, o God! mijn hart is standvastig; ik zal zingen en psalmzingen. Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o Heere! ik zal U psalmzingen onder de naties.", "Ps 109:30": "Ik zal de HEERE met mijn mond zeer loven, en te midden van velen zal ik Hem prijzen.", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "Ps 138:1": "Een psalm van David. Ik zal U loven met mijn hele hart; in de tegenwoordigheid van de goden zal ik U psalmzingen.", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "Jak 2:5": "Luister, mijn geliefde broeders, heeft God niet de armen van deze wereld uitverkoren, om rijk te zijn in het geloof, en erfgenamen van het Koninkrijk, dat Hij belooft aan hen die Hem liefhebben?", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Ps 19:6": "En die is als een bruidegom, die uitgaat uit zijn slaapkamer; zij is vrolijk als een held, om het pad te lopen.", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Ps 18:8-16": "Toen daverde en beefde de aarde, en de gronden van d
