e bergen beroerden zich en daverden, omdat Hij ontstoken was. Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daarvan aangestoken. En Hij boog de hemel, en daalde neer, en donkerheid was onder Zijn voeten.", "Rom 16:13": "Groet Rufus, de uitverkorene in de Heere, en zijn moeder, die ook de mijne is.", "Jer 47:4": "Vanwege de dag die eraan komt om alle Filistijnen te verstoren, om Tyrus en Sidon alle overgebleven helper af te snijden; want de HEERE zal de Filistijnen, het overblijfsel van het eiland Kafthor, verstoren.", "2 Kor 8:17": "Dat hij de vermaning heeft aangenomen, en zeer naarstig zijnde, gewillig naar u toe gereisd is.", "Spr 22:13": "De luiaard zegt: Er is een leeuw buiten; ik zou wel eens midden op straat gedood kunnen worden!", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Ps 107:43": "Wie is wijs? Laat hij op deze dingen letten; en laat men verstandig letten op de blijken van goedertierenheid van de HEERE.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Jes 7:22": "En het zal gebeuren, dat hij vanwege de overvloed van de melk, die zij geven zullen, boter zal eten; ja, ieder die overgebleven is in het midden van het land, die zal boter en honing eten.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Ps 119:137": "Tsade. HEERE! U bent rechtvaardig, en elk van Uw oordelen is recht.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Ps 21:14": "Verhoog U, HEERE! In Uw sterkte; zo zullen wij zingen, en Uw macht met psalmen loven.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Klaagl 5:1-22": "Denk, HEERE, aan wat ons gebeurd is, kijk ernaar en zie onze smaad aan. Ons erfdeel is overgegaan aan vreemden, onze huizen aan uitlanders. Wij zijn wezen zonder vader, onze moeders zijn als weduwen.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "Ps 77:7": "Ik dacht aan mijn snarenspel; in de nacht overlegde ik in mijn hart, en mijn geest onderzocht:", "Jona 2:9": "Maar ik zal U offeren met de stem van de dankzegging; wat ik beloofd heb, zal ik betalen. Het heil is van de HEERE.", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Micha 1:4": "En de bergen zullen onder Hem versmelten, en de dalen gekloofd worden, zoals was voor het vuur, zoals water dat uitgestort wordt in de laagte.", "Ex 20:18": "En al het volk zag de donderslagen, en de bliksemflitsen, en het geluid van de bazuin, en de rokende berg; toen het volk dit zag, weken zij terug en bleven op een afstand staan;", "2 Tim 2:7": "Bedenk wat ik zeg; en de Heere geeft u inzicht in alle dingen.", "Klaagl 3:41": "Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "Ps 69:35": "Dat Hem prijzen de hemel en de aarde, de zeeën, en al wat daarin wemelt.", "2 Kor 11:2": "Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus.", "1 Tim 1:17": "De Koning nu der eeuwen, de onverderfelijke, de onzichtbare, de alleen wijze God, zij eer en heerlijkheid in alle eeuwigheid. Amen.", "Jak 5:13": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen.", "Ps 68:9": "Daverde de aarde, ook dropen de hemelen voor Gods aanschijn; zelfs deze Sinaï, voor het aanschijn van God, de God van Israël.", "Ezech 17:24": "Zo zullen alle bomen van het veld weten dat Ik, de HEERE, de hoge boom vernederd heb, de nederige boom verheven heb, de groene boom verdroogd heb, en de droge boom bloeiend gemaakt heb; Ik, de HEERE, heb het gesproken, en zal het doen.", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Ps 91:14": "Omdat hij Mij zeer liefheeft, spreekt God, zo zal Ik hem uithelpen; Ik zal hem op een hoogte stellen, want hij kent Mijn Naam.", "Kol 2:7": "Geworteld en opgebouwd in Hem, en bevestigd in het geloof, zoals u geleerd bent, overvloedig zijnde daarin, met dankzegging.", "Richt 4:14": "Debora dan zei tegen Barak: Maak u op; want dit is de dag waarop de HEERE Sisera in uw hand gegeven heeft; is de HEERE niet voor u uit getrokken? Zo trok Barak van de berg Thabor af, en tienduizend man achter hem.", "Luk 1:46-55": "En Maria zei: Mijn ziel maakt de Heere groot, en mijn geest verheugt zich in God, mijn Zaligmaker; omdat Hij de nederigheid van Zijn dienstmaagd heeft aangezien; want zie, van nu af aan zullen alle geslachten mij zalig spreken.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "1 Kron 29:18": "O HEERE, God van onze vaders, Abraham, Izak en Israël, bewaar dit voor eeuwig in de gedachten van het hart van Uw volk, en richt hun hart op U.", "Jes 64:1": "Och, dat U de hemelen scheurde, dat U neerkwam, dat de bergen van Uw aangezicht wegsmolten;", "1 Kron 25:5": "Deze allen waren kinderen van Heman, de ziener van de koning, in de woorden van God, om de hoorn te verheffen; want God had Heman veertien zonen gegeven, en drie dochters.", "2 Kron 15:5": "En in die tijden was er geen vrede voor hem die uitging, en hem die inkwam; maar veel beroeringen waren er over alle inwoners van die landen;", "Ps 108:3": "Ontwaak, u luit en harp! Ik zal in de dageraad ontwaken.", "Ps 140:14": "Zeker, de rechtvaardigen zullen Uw Naam loven; de oprechten zullen voor Uw aangezicht blijven.", "Pred 7:14": "Geniet het goede op de dag van het voorspoed, maar op de dag van het tegenspoed, zie toe; want God maakt ook de een tegenover de ander, vanwege dat de mens niets zou vinden dat na hem zal zijn.", "Ps 25:22": "O God! verlos Israël uit al zijn benauwdheden.", "Ezech 9:8": "Het gebeurde nu, toen zij hen geslagen hadden en ik overgebleven was, dat ik op mijn aangezicht viel, en riep, en zei: Ach, Heere HEERE, zult U het hele overblijfsel van Israël verderven, door Uw grimmigheid uit te gieten over Jeruzalem?", "Ps 24:7-10": "Heft uw hoofden op, poorten, en verhef u, eeuwige deuren, opdat de Koning der ere ingaat! Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat!", "Ps 49:15": "Men zet hen als schapen in het graf, de dood zal hen afweiden; en de oprechten zullen over hen heersen in die morgenstond; en het graf zal hun gedaante verslijten, elk uit zijn woning.", "Joz 7:7-26": "En Jozua zei: Ach, Heere HEERE! Waarom hebt U dit volk ooit de Jordaan laten oversteken, om ons te geven in de hand van de Amorieten, om ons te vernietigen? Was het toch maar zo dat wij tevreden waren geweest en gebleven waren aan de overkant van de Jordaan! Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd? Als de Kanaänieten en alle inwoners van het land dit horen, zullen zij ons omsingelen, en onze naam van de aarde uitroeien; wat zult U dan doen voor Uw grote Naam?", "Richt 4:21": "Daarna nam Jaël, de vrouw van Heber, een tentpin, en greep een hamer in haar hand, en ging stilletjes naar hem toe, en dreef de pin in zijn slaap, zodat hij in de aarde vastzat; want hij was in diepe slaap en uitgeput, en stierf.", "Ps 66:1": "Een lied, een psalm, voor de koorleider. Juicht tot God, heel de aarde!", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "1 Sam 12:7": "En nu, ga hier staan, zodat ik met u in het gericht ga, voor het aangezicht van de HEERE, over al de rechtvaardige daden van de HEERE, die Hij aan u en aan uw vaderen gedaan heeft.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "Ps 147:11": "De HEERE schept vreugde in hen die Hem vrezen, die op Zijn goedertierenheid hopen.", "Dan 3:4": "En een heraut riep met kracht: Men zegt u aan, u volken, u naties en tongen!", "Job 21:12": "Zij heffen op met de trommel en de harp, en verblijden zich bij het geluid van de fluit.", "Openb 19:1-3": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God. Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft. En zij zeiden ten tweeden maal: Halleluja! En haar rook gaat op in alle eeuwigheid.", "2 Sam 24:17": "En David, toen hij de engel zag die het volk sloeg, sprak tot de HEERE, en zei: Zie, ik, ik heb gezondigd, en ik, ik heb onrecht gehandeld, maar wat hebben deze schapen gedaan? Laat toch Uw hand tegen mij zijn en tegen het huis van mijn vader.", "Richt 4:17-22": "Maar Sisera vluchtte te voet naar de tent van Jaël, de vrouw van Heber, de Keniet; want er was vrede tussen Jabin, de koning van Hazor, en het huis van Heber, de Keniet. Jaël nu ging naar buiten, Sisera tegemoet, en zei tegen hem: Kom binnen, mijn heer, kom bij mij binnen, wees niet bang! En hij kwam bij haar binnen in de tent, en zij bedekte hem met een deken. Daarna zei hij tegen haar: Geef mij toch een beetje water te drinken, want ik heb dorst. Toen opende zij een melkfles, en gaf hem te drinken, en dekte hem toe.", "Openb 18:20": "Bedrijf vreugde over haar, u hemel, en u heilige apostelen en profeten, want God heeft uw oordeel aan haar voltrokken.", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Job 29:7": "Toen ik uitging naar de poort door de stad, toen ik mijn stoel op de straat liet klaarzetten.", "Gen 22:3": "Toen stond Abraham 's morgens vroeg op, en zadelde zijn ezel, en nam twee van zijn knechten met zich, en Izak zijn zoon; en hij kloofde hout voor het brandoffer, en maakte zich op, en ging naar de plaats die God hem gezegd had.", "Ex 15:21": "Toen antwoordde Mirjam hun: Zingt de HEERE; want Hij is hoog verheven! Hij heeft het paard met zijn ruiter in de zee gestort!", "Dan 12:3": "De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Hebr 13:21": "Hij volmaakt u in alle goed werk, opdat u Zijn wil mag doen; terwijl Hij in u werkt wat voor Hem welgevallig is, door Jezus Christus; aan Wie de heerlijkheid is, tot in alle eeuwigheid. Amen.", "Jes 33:1": "Wee u, verwoester, die zelf niet verwoest bent, en u, die trouweloos handelt, terwijl men niet trouweloos tegen u gehandeld heeft! Als u het verwoesten volbracht zult hebben, zult u verwoest worden; als u het trouweloos handelen voltooid zult hebben, zal men trouweloos tegen u handelen.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Openb 2:26": "En wie overwint, en Mijn werken tot het einde toe bewaart, hem zal Ik macht geven over de heidenen;", "2 Kor 9:14": "En door hun gebed voor u, die naar u verlangen, om de uitnemende genade van God over u.", "Richt 4:4": "Debora nu, een vrouw die een profetes was, de vrouw van Lappidoth, zij richtte in die tijd Israël.", "Ps 33:17": "Het paard schiet tekort voor de overwinning, en bevrijdt niet door zijn grote sterkte.", "Richt 10:4": "Hij had dertig zonen, die op dertig ezelsveulens reden, en zij hadden dertig steden, die tot op deze dag Havvoth-jair genoemd worden en die in het land Gilead liggen.", "Ps 85:2-14": "U bent Uw land gunstig geweest, HEERE! De gevangenschap van Jakob hebt U gekeerd. De misdaad van Uw volk hebt U weggenomen; U hebt al hun zonden bedekt. Sela. U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Gal 1:3": "Genade zij u en vrede van God de Vader, en onze Heere Jezus Christus;", "1 Kron 16:31": "Laat de hemelen zich verblijden, en de aarde zich verheugen, en laat men onder de heidenen zeggen: De HEERE regeert.", "Ps 118:15": "In de tenten van de rechtvaardigen is een stem van gejuich en van het heil; de rechterhand van de HEERE doet krachtige daden.", "Ps 146:1-10": "Halleluja! O mijn ziel, prijs de HEERE. Ik zal de HEERE prijzen in mijn leven; ik zal mijn God psalmzingen, terwijl ik nog ben. Vertrouw niet op prinsen, op een mensenkind, bij wie geen heil is.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Luk 19:40": "En Hij antwoordde en zei tegen hen: Ik zeg u dat, als dezen zwijgen, de stenen het meteen zullen uitroepen.", "Jes 60:11": "En uw poorten zullen steeds openstaan, zij zullen overdag of 's nachts niet gesloten worden, opdat men bij u het leger van de heidenen inbrengt, en hun koningen naar u toe geleid worden.", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Richt 4:4-6": "Debora nu, een vrouw die een profetes was, de vrouw van Lappidoth, zij richtte in die tijd Israël. En zij woonde onder de palmboom van Debora, tussen Rama en Beth-el, op het gebergte van Efraïm; en de Israëlieten gingen naar haar toe voor de rechtspraak. En zij zond heen en riep Barak, de zoon van Abinoam, van Kedes-nafthali; en zij zei tegen hem: Heeft de HEERE, de God van Israël, niet geboden: Ga heen en trek op naar de berg Thabor, en neem met u tienduizend man, van de kinderen van Nafthali en van de kinderen van Zebulon?", "Job 38:7": "Toen de morgensterren samen vrolijk zongen, en al de kinderen van God juichten.", "Ps 134:2": "Hef uw handen op naar het heiligdom, en loof de HEERE.", "Num 32:24": "Bouw u steden voor uw kinderen, en kooien voor uw schapen; en doe wat uit uw mond gekomen is.", "2 Kron 35:15": "En de zangers, de zonen van Asaf, waren op hun standplaats, naar het gebod van David, en Asaf, en Heman, en Jeduthun, de ziener van de koning, alsook de poortwachters bij elke poort; zij hoefden niet te wijken van hun dienst, want hun broeders, de Levieten, bereidden voor hen.", "Ex 34:26": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE, uw God, brengen. U zult het bokje niet koken in de melk van zijn moeder.", "Spr 7:6": "Want door het venster van mijn huis, door mijn tralie keek ik uit;", "Jes 49:13": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.", "2 Kron 24:5": "Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.", "2 Kron 6:40": "Nu, mijn God, laat toch Uw ogen open zijn en Uw oren opmerkzaam op het gebed van deze plaats.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Ps 149:6": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand,", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Ps 12:2": "Behoud, o HEERE; want de goedertierene ontbreekt, want de getrouwen zijn weinig geworden onder de mensenkinderen.", "Ps 15:5": "Die zijn geld niet uitleent tegen woeker, en geen geschenk aanneemt tegen de onschuldige. Wie deze dingen doet, zal niet wankelen in eeuwigheid.", "Ps 68:8": "O God! Toen U voor het aangezicht van Uw volk uittrok, toen U daarheen trad in de woestijn; Sela.", "Lev 25:51": "Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "Jes 23:16": "Neem de harp, ga rond door de stad, u vergeten hoer! Speel mooi, zing veel liederen, opdat men weer aan u denkt!", "2 Tim 1:3": "Ik dank God, aan Wie ik dien vanaf mijn voorouders met een rein geweten, zoals ik zonder ophouden aan u denk in mijn gebeden, nacht en dag;", "1 Petr 1:8": "Hem, Die u niet gezien hebt en toch liefhebt, in Wie u nu, hoewel u Hem niet ziet, maar gelooft, zich verheugt met een onuitsprekelijke en heerlijke vreugde;", "2 Kon 22:7": "Doch er werd met hen geen rekening gehouden van het geld dat in hun hand geleverd was, want zij handelden trouw.", "Ps 136:1-26": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Loof de God der goden; want Zijn goedertierenheid is voor eeuwig. Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig.", "Ps 45:15": "In gestikte kleren zal zij tot de Koning geleid worden; de jonge dochters, die achter haar zijn, haar gezellinnen, zullen tot u gebracht worden.", "Ps 118:28": "U bent mijn God, daarom zal ik U loven; o mijn God, ik zal U verhogen.", "Ps 107:15": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "1 Kron 29:9": "En het volk was blij over hun vrijwillig geven; want zij gaven met een volkomen hart vrijwillig aan de HEERE; en koning David verblijdde zich ook met grote blijdschap.", "Ef 3:21": "Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.", "Ps 103:20-22": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord. Loof de HEERE, al Zijn heerscharen! U Zijn dienaars, die Zijn welbehagen doet! Loof de HEERE, al Zijn werken! Aan alle plaatsen van Zijn heerschappij. Loof de HEERE, mijn ziel!", "Spr 3:9": "Vereer de HEERE met uw goed, en met de eerstelingen van al uw inkomsten;", "Ps 135:2": "U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God!", "1 Sam 17:47": "En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Deut 32:1": "Neig de oren, hemel, en ik zal spreken; en de aarde hoort de woorden van mijn mond.", "Jes 30:26": "En het licht van de maan zal zijn als het licht van de zon, en het licht van de zon zal zevenvoudig zijn als het licht van zeven dagen; op de dag dat de HEERE de breuk van Zijn volk zal verbinden, en de wond waarmee het geslagen is, genezen.", "2 Sam 22:4": "Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.", "Ex 32:31": "Zo keerde Mozes terug tot de HEERE, en zei: Och, dit volk heeft een grote zonde gezondigd, doordat zij zich gouden goden gemaakt hebben.", "1 Joh 5:3": "Want dit is de liefde van God, dat wij Zijn geboden bewaren; en Zijn geboden zijn niet zwaar.", "1 Kron 12:32": "En van de kinderen van Issaschar, die verstand hadden van de tijden, om te weten wat Israël moest doen; hun hoofden waren tweehonderd, en al hun broeders volgden hun woord;", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "1 Kon 8:44": "Wanneer Uw volk in de oorlog tegen zijn vijand uittrekken zal, langs de weg die U hen zenden zult, en tot de HEERE bidden zullen in de richting van deze stad, die U verkoren hebt, en van dit huis, dat ik voor Uw Naam gebouwd heb;", "Fil 2:21": "Want zij zoeken allen hun eigen belang, niet wat van Christus Jezus is.", "Richt 6:11": "Toen kwam een Engel van de HEERE, en ging zitten onder de eik die in Ofra is, die aan Joas, de Abiëzriet, toebehoorde; en zijn zoon Gideon dorste tarwe bij de wijnpers, om die te verbergen voor de Midianieten.", "Ps 49:2": "Hoort dit, alle volken! Neemt het ter oor, alle inwoners van de wereld,", "Openb 19:3": "En zij zeiden ten tweeden maal: Halleluja! En haar rook gaat op in alle eeuwigheid.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "1 Petr 2:23": "Die, toen Hij uitgescholden werd, niet terugschold, en toen Hij leed, niet dreigde; maar het overgaf aan Hem Die rechtvaardig oordeelt;", "1 Kron 25:7": "En hun aantal, met hun broeders die onderwezen waren in het gezang van de HEERE, allen meesters, was tweehonderdachtentachtig.", "Ps 75:2": "Wij loven U, o God! Wij loven, dat Uw Naam nabij is; men vertelt Uw wonderen.", "Deut 21:14": "En het zal gebeuren, als u geen behagen meer in haar hebt, dat u haar zult laten gaan waarheen zij wil; maar u zult haar beslist niet voor geld verkopen, u zult geen handel met haar drijven, omdat u haar vernederd hebt.", "Jes 16:10": "zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.", "Ps 145:5": "He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden.", "Ps 97:12": "Rechtvaardigen, verblijd u in de HEERE, en spreek lof ter gedachtenis van Zijn heiligheid.", "Neh 5:10": "Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Gen 23:9": "Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.", "Matt 7:2": "Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.", "1 Kor 15:34": "Word op de juiste manier wakker, en zondig niet. Want sommigen hebben geen kennis van God. Ik zeg dit tot uw schaamte.", "Ps 80:3": "Wek Uw macht op voor het aangezicht van Efraïm, en Benjamin, en Manasse, en kom tot onze verlossing.", "1 Sam 15:14": "Toen zei Samuël: Wat is dan dit voor een geluid van schapen in mijn oren, en een geluid van runderen dat ik hoor?", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "1 Kron 15:28": "Zo bracht heel Israël de ark van het verbond van de HEERE op, met gejuich, en met geluid van de bazuin, en met trompetten, en met cimbalen, en maakte geluid met luiten en met harpen.", "Ps 149:1-3": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning. Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "2 Sam 20:22": "En de vrouw kwam bij al het volk, met haar wijsheid; en zij hieuwen Seba, de zoon van Bichri, het hoofd af, en wierpen het naar Joab. Toen blies hij op de bazuin, en zij verstrooiden zich van de stad, ieder naar zijn tenten; en Joab keerde terug naar Jeruzalem tot de koning.", "Openb 1:16": "En Hij had zeven sterren in Zijn rechterhand; en uit Zijn mond kwam een tweesnijdend scherp zwaard; en Zijn gezicht was als de zon wanneer die schijnt in haar kracht.", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Ps 119:172": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid.", "Luk 9:3": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Ps 80:16": "en de stam die Uw rechterhand geplant heeft, en dat om de zoon die U voor Uzelf gesterkt hebt!", "Luk 24:53": "En zij waren voortdurend in de tempel, waar zij God loofden en dankten. Amen.", "Lev 25:37": "Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "Spr 4:18": "Maar het pad van de rechtvaardigen is als een schijnend licht, dat voortgaat en meer licht geeft tot de volle dag toe.", "Ps 135:19": "U, huis van Israël! looft de HEERE; u, huis van Aäron! looft de HEERE.", "Ps 108:2-4": "O God! Mijn hart is bereid; ik zal zingen en psalmzingen, ook mijn eer. Ontwaak, u luit en harp! Ik zal in de dageraad ontwaken. Ik zal U loven onder de volken, o HEERE! En ik zal U psalmzingen onder de natiën.", "2 Kron 20:21": "Hij nu overlegde met het volk, en hij stelde voor de HEERE zangers aan, die de heilige Majesteit zouden prijzen, uitgaande voor de toegeruste troepen, en die zeiden: Loof de HEERE, want Zijn goedertierenheid is voor eeuwig!", "Hab 3:10": "De bergen zagen U, en leden smart; de waterstroom ging erdoorheen, de afgrond gaf zijn stem, hij hief zijn handen op in de hoogte.", "Amos 6:5": "Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "Deut 5:22-25": "Deze woorden sprak de HEERE tot uw hele gemeente, op de berg, uit het midden van het vuur, van de wolk en van de donkerheid, met een grote stem, en voegde er niets aan toe; en Hij schreef ze op twee stenen tafelen, en gaf ze aan mij. En het gebeurde, toen u die stem uit het midden van de duisternis hoorde, terwijl de berg van vuur brandde, dat u tot mij naderde, alle hoofden van uw stammen, en uw oudsten, en u zei: Zie, de HEERE, onze God, heeft ons Zijn heerlijkheid en Zijn grootheid laten zien, en wij hebben Zijn stem gehoord uit het midden van het vuur; vandaag hebben wij gezien dat God met de mens spreekt, en dat hij levend blijft.", "Ps 32:11": "Verblijd u in de HEERE, en verheug u, rechtvaardigen! En zing vrolijk, alle oprechten van hart!", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "2 Sam 10:12": "Wees sterk, en laten wij sterk zijn voor ons volk, en voor de steden van onze God; de HEERE nu doet, wat goed is in Zijn ogen.", "Jer 4:29": "Van het geroep van de ruiters en boogschutters vluchten alle steden; zij gaan de wouden in, en klimmen op de rotsen; alle steden zijn verlaten, zodat niemand erin woont.", "Ps 107:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Gen 44:1-8": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak; En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had. 's Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.", "2 Tess 3:5": "Doch de Heere richte uw harten op de liefde van God, en op de lijdzaamheid van Christus.", "Gen 6:17": "Want Ik, zie, Ik breng een watervloed over de aarde, om alle vlees waarin een geest van het leven is, van onder de hemel te verderven; alles wat op de aarde is, zal de geest geven.", "Ex 30:16": "U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Kol 4:2": "Houd sterk aan in het gebed, en waak daarin met dankzegging;", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Ps 104:13": "Hij drenkt de bergen uit Zijn opperzalen; de aarde wordt verzadigd van de vrucht van Uw werken.", "Richt 4:7": "En Ik zal aan de beek Kison tot u trekken Sisera, de legeraanvoerder van Jabin, met zijn wagens en zijn menigte; en Ik zal hem in uw hand geven?", "Gen 43:12-23": "En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man. En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Ps 145:17": "Tsade. De HEERE is rechtvaardig in al Zijn wegen, en goedertieren in al Zijn werken.", "Jes 34:10": "Het zal 's nachts of overdag niet uitgeblust worden, tot in eeuwigheid zal zijn rook opstijgen; van geslacht tot geslacht zal het woest zijn, tot in alle eeuwigheid zal niemand daar doorheen trekken.", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Ex 15:9": "De vijand zei: Ik zal vervolgen, ik zal achterhalen, ik zal de buit delen, mijn ziel zal van hen vervuld worden, ik zal mijn zwaard trekken, mijn hand zal hen uitroeien.", "Luk 1:46": "En Maria zei: Mijn ziel maakt de Heere groot,", "Dan 9:3-19": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as. Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden. Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten.", "Kol 4:12": "U groet Epafras, die één van u is, een dienstknecht van Christus, die altijd voor u strijdt in de gebeden, opdat u volmaakt en volkomen mag staan in heel de wil van God.", "Ps 118:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Ps 106:48": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid; en al het volk zegt: Amen, Halleluja!", "Ps 86:12": "Heere, mijn God! ik zal U met mijn hele hart loven, en ik zal Uw Naam eren tot in eeuwigheid;", "2 Kron 6:41": "En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.", "Richt 7:22": "Toen de driehonderd op de bazuinen bliezen, richtte de HEERE het zwaard van de een tegen de ander, door het hele leger heen; en het leger vluchtte tot Beth-sitta toe, naar Tseredath, tot aan de grens van Abel-mehola, boven Tabbath.", "2 Kon 5:26": "Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "Ps 135:1-3": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE! U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God! Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "Ps 117:1": "Loof de HEERE, alle heidenvolken; prijs Hem, alle natiën!", "Jes 52:1": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen.", "1 Sam 1:17": "Toen antwoordde Eli en zei: Ga heen in vrede, en de God van Israël geeft u wat u van Hem gebeden hebt.", "Ps 83:11": "die verdelgd zijn bij Endor; zij zijn geworden tot mest voor de aarde.", "1 Kon 21:15": "Het gebeurde nu, toen Izebel hoorde dat Naboth gestenigd en dood was, dat Izebel tegen Achab zei: Sta op, neem de wijngaard van Naboth, de Jizreëliet, in bezit, die hij u weigerde voor geld te geven; want Naboth leeft niet meer, maar is dood.", "Ps 104:14": "Hij doet het gras uitspruiten voor de dieren, en het gewas tot dienst van de mens, zodat brood uit de aarde voortkomt.", "Jes 51:17": "Word wakker, word wakker, sta op, Jeruzalem! U die gedronken hebt uit de hand van de HEERE de beker van Zijn grimmigheid; de droesem van de beker van de zwijmeling hebt u gedronken, ja, uitgezogen.", "Ps 89:53": "Geloofd zij de HEERE in eeuwigheid! Amen, ja, amen.", "1 Tess 3:10": "Nacht en dag zeer overvloedig biddend, om uw gezicht te mogen zien en te volmaken wat er aan uw geloof ontbreekt.", "Ex 21:17-20": "Wie ook zijn vader of zijn moeder vervloekt, die zal zeker gedood worden. En wanneer mannen ruzie hebben, en de een slaat de ander met een steen of met een vuist, en hij sterft niet, maar moet het bed houden; als hij weer opstaat en op straat gaat met behulp van zijn stok, zal hij die hem sloeg, onschuldig zijn; alleen zal hij vergoeden wat de ander door verzuim verloren heeft, en hij zal hem volledig laten helen.", "Zach 10:4": "Uit hem zal de hoeksteen voortkomen, uit hem de nagel, uit hem de strijdboog, samen zullen uit hem alle drijvers voortkomen.", "Jes 48:20": "Ga uit van Babel, vlucht van de Chaldeeën, verkondig met de stem van het gejuich, doe zulks horen, breng het uit tot aan het einde van de aarde, zeg: De HEERE heeft Zijn knecht Jakob verlost!", "Neh 5:4": "Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Ps 107:21": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen.", "Hebr 13:20": "De God nu van de vrede, Die de grote Herder van de schapen, door het bloed van het eeuwige testament, uit de doden heeft teruggebracht, namelijk onze Heere Jezus Christus,", "2 Kon 15:20": "Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.", "Deut 23:19": "U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.", "Ps 35:18": "Zo zal ik U loven in de grote gemeente; onder machtig veel volk zal ik U prijzen.", "Nahum 1:5": "De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.", "Ps 77:19": "Het geluid van uw donder was rondom; de bliksemen verlichtten de wereld; de aarde werd beroerd en daverde.", "Ps 51:20": "Doe goed bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.", "1 Kron 15:16-22": "En David zei tegen de leiders van de Levieten, dat zij hun broeders, de zangers, moesten aanstellen met muziekinstrumenten, met luiten, en harpen, en cimbalen, zodat zij zich lieten horen, terwijl zij de stem verhieven met blijdschap. Zo stelden de Levieten Heman aan, de zoon van Joël, en uit zijn broeders Asaf, de zoon van Berechja; en uit de zonen van Merari, hun broeders, Ethan, de zoon van Kusaja; En met hen hun broeders van de tweede orde: Zecharja, Ben en Jaaziel, en Semiramoth, en Jehiel, en Unni, Eliab, en Benaja, en Maaseja, en Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, de poortwachters.", "Joz 19:29": "En deze grens keert zich naar Rama, en tot aan de vaste stad Tyrus; dan keert deze grens naar Hosa, en haar uiteinden zijn aan de zee, vanaf het gebied dat naar Achzib strekt,", "Micha 6:5": "Mijn volk, gedenk toch wat Balak, de koning van Moab, beraamde, en wat Bileam, de zoon van Beor, hem antwoordde; en wat er gebeurd is van Sittim af tot Gilgal toe, opdat u de gerechtigheden van de HEERE kent.", "Dan 2:23": "Ik dank U en ik loof U, o God van mijn vaderen! Omdat U mij wijsheid en kracht gegeven hebt, en mij nu bekendgemaakt hebt wat wij van U gevraagd hebben, want U hebt ons de zaak van de koning bekendgemaakt.", "Luk 19:37": "En toen Hij nu in de buurt kwam van de afdaling van de Olijfberg, begon heel de menigte van de discipelen zich te verblijden, en God te loven met luide stem, vanwege alle krachtige daden die zij gezien hadden,", "Klaagl 3:34": "Lamed. Dat men al de gevangenen van de aarde onder Zijn voeten verbrijzelt;", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Richt 2:17": "maar zij hoorden ook niet naar hun richters, maar hoereerden andere goden na, en bogen zich voor die neer; haastig weken zij af van de weg die hun vaders bewandeld hadden door de geboden van de HEERE te horen; zo deden zij niet.", "Ps 83:10": "Doe hun als Midian, als Sisera, als Jabin bij de beek Kison;", "Ps 33:1-3": "Rechtvaardigen! Zingt vrolijk in de HEERE; lof past de oprechten. Looft de HEERE met de harp; zingt Hem psalmen met de luit, en het tiensnarig instrument. Zingt Hem een nieuw lied; speelt goed met vrolijk geschal.", "Joz 10:11": "Het gebeurde nu, toen zij voor het aangezicht van Israël vluchtten, terwijl ze in de afdaling van Beth-horon waren, dat de HEERE grote stenen op hen wierp van de hemel, tot Azeka toe, zodat zij stierven; er waren er meer die van de hagelstenen stierven, dan die de kinderen van Israël met het zwaard doodden.", "Richt 4:13": "Zo riep Sisera al zijn wagens bijeen, negenhonderd ijzeren wagens, en al het volk dat met hem was, van Haroseth der heidenen tot de beek Kison.", "Num 18:16": "Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "Neh 5:1-18": "Maar het geroep van het volk en van hun vrouwen was groot, tegen hun broeders, de Joden. Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven. Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.", "Jes 7:15": "Boter en honing zal Hij eten, totdat Hij weet het kwade te verwerpen en het goede te verkiezen.", "Jes 51:8": "Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.", "Ps 148:1-14": "Halleluja! Looft de HEERE uit de hemelen; looft Hem in de hoogste plaatsen! Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen! Looft Hem, zon en maan! Looft Hem, alle lichtende sterren!", "Ps 147:10": "Hij heeft geen behagen in de sterkte van het paard; Hij schept geen vreugde in de benen van de man.", "Joz 10:22-27": "Daarna zei Jozua: Open de mond van de grot, en breng tot mij die vijf koningen uit die grot. Zij nu deden zo, en brachten tot hem die vijf koningen uit de grot: de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon. En het gebeurde, toen zij die koningen uitgebracht hadden tot Jozua, dat Jozua al de mannen van Israël riep, en hij zei tot de aanvoerders van het krijgsvolk, die met hem opgetrokken waren: Treed toe, zet uw voeten op de nekken van deze koningen. En zij traden toe, en zetten hun voeten op hun nekken.", "Ex 22:25": "Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen.", "Matt 6:10": "Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.", "2 Tim 1:18": "De Heere geve hem, dat hij barmhartigheid vindt bij de Heere, op die dag; en hoezeer hij mij in Efeze gediend heeft, weet u zeer goed.", "Jes 26:1": "Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.", "Richt 3:13": "En hij verzamelde bij zich de kinderen van Ammon en de Amalekieten, en hij trok op en sloeg Israël, en zij namen de Palmstad in bezit.", "Jes 30:29": "Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.", "1 Petr 5:11": "Aan Hem zij de heerlijkheid en de kracht, tot in alle eeuwigheid. Amen.", "Hand 20:13": "Maar wij gingen vooruit naar het schip en voeren af naar Assus, waar wij Paulus zouden opnemen; want hij had het zo bevolen, en hij zou zelf te voet gaan.", "Rom 1:9": "Want God is mijn Getuige, Die ik dien in mijn geest, in het Evangelie van Zijn Zoon, hoe ik zonder ophouden aan u denk;", "Fil 4:20": "Onze God en Vader nu zij de heerlijkheid tot in alle eeuwigheid. Amen.", "Jes 64:8-12": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen. HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting.", "2 Kron 34:14": "En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.", "Ps 26:12": "Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.", "1 Sam 31:3": "En de strijd werd zwaar tegen Saul; en de mannen die met de boog schieten, troffen hem, en hij werd zeer bang voor de schutters.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Ezech 21:15": "Ik heb de punt van het zwaard gezet tegen al hun poorten, opdat het hart wegsmelt, en de aanstoten zich vermenigvuldigen; ach, het is gemaakt opdat het glinstert, het is ingewikkeld om te slachten.", "Hand 16:25": "En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen.", "Ps 107:31": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "1 Kron 22:6": "Toen riep hij zijn zoon Salomo, en gebood hem voor de HEERE, de God van Israël, een huis te bouwen.", "Ps 125:4": "HEERE! doe het goede aan hen die goed zijn, en aan hen die oprecht zijn in hun hart.", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Richt 11:34": "Toen Jeftha nu bij Mizpa bij zijn huis kwam, zie, zo kwam zijn dochter hem tegemoet, met trommels en met reidansen. Zij was zijn enige kind; hij had verder geen zoon of dochter.", "Ps 72:1": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning.", "Ps 68:33-36": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.", "Ex 13:8-10": "En u moet uw zoon op die dag laten weten en zeggen: Dit doe ik om wat de HEERE mij gedaan heeft, toen ik uit Egypte uittrok. En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft. Houd daarom deze inzetting op de vastgestelde tijd, van jaar tot jaar.", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "Ps 43:4": "En dat ik inga tot Gods altaar, tot de God van de blijdschap van mijn verheuging, en U met de harp loof, o God, mijn God!", "1 Kon 4:12": "Baäna, de zoon van Ahilud, had Taanach, en Megiddo, en heel Beth-sean, dat bij Zartana ligt, beneden Jizreël, van Beth-sean af tot Abel-mehola toe, tot aan de overkant van Jokmeam.", "2 Kon 12:7-16": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Job 20:5": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik?", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Joël 3:12": "De heidenvolken zullen zich opmaken en optrekken naar het dal van Josafat; want daar zal Ik zitten om te richten alle heidenvolken van rondom.", "Gen 31:27": "Waarom bent u heimelijk gevlucht, en hebt u zich aan mij ontstolen? En hebt u het mij niet verteld, zodat ik u had kunnen wegzenden met vreugde, en met gezangen, met tamboerijn en met harp?", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Deut 2:28": "Verkoop mij voedsel voor geld, dat ik eet, en geef mij water voor geld, dat ik drink; laat mij alleen te voet doortrekken;", "Ps 28:6": "Geprezen zij de HEERE, want Hij heeft de stem van mijn smekingen gehoord.", "Ps 18:48": "De God, Die mij volkomen wraak geeft, en de volken onder mij brengt;", "Ps 98:1-8": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven. De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen. Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "Richt 2:1": "En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid.", "Richt 2:12": "En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "Gen 42:25-35": "En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo. En zij laadden hun koren op hun ezels, en trokken vandaar weg. Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "Openb 12:11": "En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "Klaagl 5:9": "Wij moeten ons brood met gevaar voor ons leven halen, vanwege het zwaard van de woestijn.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Ps 94:1": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend!", "Richt 4:19-21": "Daarna zei hij tegen haar: Geef mij toch een beetje water te drinken, want ik heb dorst. Toen opende zij een melkfles, en gaf hem te drinken, en dekte hem toe. Ook zei hij tegen haar: Sta in de deuropening van de tent; en als er iemand komt en u vraagt: Is hier iemand? dan moet u zeggen: Niemand. Daarna nam Jaël, de vrouw van Heber, een tentpin, en greep een hamer in haar hand, en ging stilletjes naar hem toe, en dreef de pin in zijn slaap, zodat hij in de aarde vastzat; want hij was in diepe slaap en uitgeput, en stierf.", "Ex 13:3": "Verder zei Mozes tegen het volk: Denk aan deze dag, waarop u uit Egypte, uit het diensthuis, gegaan bent; want de HEERE heeft u door een sterke hand van hier uitgevoerd; daarom mag het gedesemde niet gegeten worden.", "Ruth 2:12": "De HEERE vergeldt u uw daad, en uw loon zij volkomen, vanwege de HEERE, de God van Israël, onder Wiens vleugels u gekomen bent om toevlucht te nemen!", "Hebr 12:18": "Want u bent niet gekomen tot de tastbare berg, en het brandende vuur, en donkerheid, en duisternis, en onweer,", "Ps 149:6-9": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand, om wraak te doen over de heidenvolken, en bestraffingen over de volken, om hun koningen te binden met ketenen, en hun aanzienlijken met ijzeren boeien,", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "Gen 23:13": "En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven.", "Richt 4:11": "Heber nu, de Keniet, had zich afgezonderd van Kaïn, uit de kinderen van Hobab, Mozes' schoonvader; en hij had zijn tenten opgeslagen tot aan de eik in Zaanaim, die bij Kedes is.", "1 Kron 16:33": "Dan zullen de bomen van het woud juichen voor het aangezicht van de HEERE, omdat Hij komt om de aarde te richten.", "Gen 37:3": "En Israël had Jozef lief, boven al zijn zonen; want hij was hem een zoon van het ouderdom; en hij maakte hem een veelkleurige rok.", "Ps 105:2": "Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen.", "Ps 81:2-4": "Zingt vrolijk voor God, onze Sterkte; juicht voor de God van Jakob. Heft een psalm op, en geeft de trommel; de liefelijke harp met de luit. Blaast de bazuin in de nieuwe maan, op de bestemde tijd, op onze feestdag.", "Rom 8:37": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Ps 116:17-19": "Ik zal U een offer van dankzegging offeren, en de Naam van de HEERE aanroepen. Ik zal mijn gelofte de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk, in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "2 Petr 1:1": "Simeon Petrus, een dienstknecht en apostel van Jezus Christus, aan hen die even kostbaar geloof met ons verkregen hebben, door de rechtvaardigheid van onze God en Zaligmaker, Jezus Christus;", "Openb 19:17": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God;", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Luk 17:16": "En hij viel op zijn gezicht voor Zijn voeten en dankte Hem; en dat was een Samaritaan.", "Deut 32:16": "Zij hebben Hem tot ijver verwekt door vreemde goden; door gruwelen hebben zij Hem tot toorn verwekt.", "2 Kor 8:4": "Ons met veel aandrang biddende, dat wij wilden aannemen de gave en de gemeenschap van deze bediening, die voor de heiligen gebeurt.", "Ex 14:11": "En zij zeiden tegen Mozes: Had u ons daarom, omdat er in Egypte helemaal geen graven waren, weggehaald, opdat wij in deze woestijn zouden sterven? Waarom heeft u ons dit aangedaan, dat u ons uit Egypte hebt weggevoerd?", "2 Kor 8:12": "Want als de bereidheid van het gemoed er eerst is, dan is iemand aangenaam naar wat hij heeft, niet naar wat hij niet heeft.", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "Jes 24:8": "De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houdt op, de vreugde van de harp rust.", "1 Kon 8:45": "hoor dan in de hemel hun gebed en hun smeking, en voer hun recht uit.", "Ps 68:13-15": "De koningen van de heerscharen vluchtten weg, zij vluchtten weg; en zij die thuis bleef, deelde de buit uit. Al lag u tussen twee rijen stenen, toch zult u worden als vleugels van een duif, overdekt met zilver, en waarvan de veren zijn van uitgegraven goudgeel goud. Toen de Almachtige de koningen daarin verstrooide, werd zij sneeuwwit als op Zalmon.", "Hoogl 8:14": "Kom haastig, mijn Liefste! En wees als een ree, of als een welp van de herten, op de bergen van de specerijen.", "Ps 136:19": "Sihon, de Amoritische koning; want Zijn goedertierenheid is voor eeuwig.", "Jes 12:1-6": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij. Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden. En u zult water scheppen met vreugde uit de fonteinen van het heil;", "Job 36:24": "Denk eraan, dat u Zijn werk groot maakt, dat de mensen aanschouwen.", "Joz 11:1-15": "Het gebeurde daarna, toen Jabin, de koning van Hazor, dit hoorde, dat hij een boodschap stuurde naar Jobab, de koning van Madon, en naar de koning van Simron, en naar de koning van Achsaf, En naar de koningen die tegen het noorden op het gebergte, en op het vlakke, tegen het zuiden van Cinneroth, en in de laagte, en in Nafoth-dor, aan de zee waren; Tot de Kanaänieten tegen het oosten en tegen het westen, en de Amorieten, en de Hethieten, en de Ferezieten; en de Jebusieten op het gebergte, en de Hevieten onder aan Hermon, in het land van Mizpa.", "Ps 47:7": "Zingt psalmen voor God, zingt psalmen! Zingt psalmen voor onze Koning, zingt psalmen!", "Jer 51:25": "Zie, Ik heb het tegen u, verdervende berg! spreekt de HEERE, u, die de hele aarde verderft, en Ik zal Mijn hand tegen u uitstrekken, en u van de rotsen afwentelen, en zal u stellen tot een berg van brand.", "Luk 19:38": "en zij zeiden: Gezegend is de Koning, Die komt in de Naam van de Heere! Vrede in de hemel, en heerlijkheid in de hoogste hemelen!", "Ex 21:35": "Wanneer nu iemands os de os van zijn naaste zo kwetst, dat hij sterft, dan zal men de levende os verkopen en het geld daarvan gelijk delen, en het dode dier zal men ook gelijk delen.", "Ex 15:20": "En Mirjam, de profetes, de zuster van Aäron, nam een trommel in haar hand; en alle vrouwen gingen achter haar aan, met trommels en met reidansen.", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "Est 4:7": "gaf Mordechai hem te kennen alles wat hem overkomen was, en de opgave van het zilver dat Haman gezegd had te zullen wegen in de schatten van de koning, voor de Joden, om hen om te brengen.", "Deut 26:10": "En nu, zie, ik heb de eerstelingen van de vrucht van dit land gebracht, dat U, HEERE, mij gegeven hebt! Dan zult u ze neerzetten voor het aangezicht van de HEERE, uw God, en u buigen voor het aangezicht van de HEERE, uw God;", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Gen 17:12": "Een zoontje van acht dagen zal bij u besneden worden, alles wat mannelijk is in uw geslachten: degene die in het huis geboren is, en degene die met geld gekocht is van elke vreemdeling die niet van uw nageslacht is;", "1 Tess 3:12": "En moge de Heere u doen toenemen en overvloedig maken in de liefde tot elkaar en tot allen, zoals wij ook zijn tot u,", "Pred 2:8": "Ik verzamelde mij ook zilver en goud, en kostbaarheden van koningen en landstreken; ik nam mij zangers en zangeressen aan, en wat mensenkinderen tot lust strekt: allerlei snarenspel.", "Ps 99:9": "Verhef de HEERE, onze God, en buig u voor de berg van Zijn heiligheid; want de HEERE, onze God, is heilig.", "Openb 15:4": "Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.", "Ps 49:3": "zowel eenvoudigen als aanzienlijken, samen rijk en arm!", "Fil 4:6": "Wees over niets bezorgd; maar laat in alles, door bidden en smeken, met dankzegging uw verlangens bekend worden bij God;", "Deut 14:26": "En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "Richt 5:16-23": "Waarom bleef u zitten tussen de stallingen, om te horen het geblaat van de kudden? De gedeelten van Ruben hadden grote onderzoekingen van het hart. Gilead bleef aan de andere zijde van de Jordaan; en Dan, waarom onthield hij zich in schepen! Aser zat aan de zeehaven, en bleef in zijn gescheurde plaatsen. Zebulon, het is een volk, dat zijn ziel versmaad heeft ter dood, evenzo Nafthali, op de hoogten van het veld.", "Ps 50:23": "Wie dank offert, die zal Mij eren; en wie zijn weg goed inricht, die zal Ik Gods heil doen zien.", "Spr 7:20": "Hij heeft een bundel van het geld in zijn hand genomen; op de vastgestelde dag zal hij naar zijn huis komen.", "Ps 98:4-6": "Juich de HEERE toe, heel de aarde! Roep uit van vreugde, en zing vrolijk, en zing psalmen. Zing psalmen voor de HEERE met de harp, met de harp en met de stem van het gezang, Met trompetten en bazuingeklank; juich voor het aangezicht van de Koning, de HEERE.", "Jes 22:7": "En het zal gebeuren, dat uw uitgelezen dalen vol wagens zullen zijn, en dat de ruiters zich zeker zullen opstellen bij de poorten.", "Richt 12:15": "Toen stierf Abdon, een zoon van Hillel, de Pirhathoniet; en hij werd begraven te Pirhathon, in het land van Efraïm, op de berg van de Amalekiet.", "Neh 5:11": "Geeft hun toch, nog vandaag, hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen terug; en het honderdste deel van het geld en van het koren, de most en de olie, die u van hen gevorderd hebt.", "Ps 34:2-4": "Aleph. Ik zal de HEERE loven te allen tijde; Zijn lof zal voortdurend in mijn mond zijn. Beth. Mijn ziel zal zich beroemen in de HEERE; de zachtmoedigen zullen het horen en zich verblijden. Gimel. Maakt de HEERE met mij groot, en laten wij Zijn Naam samen verhogen.", "Ps 96:1-4": "Zingt de HEERE een nieuw lied; zingt de HEERE, heel de aarde! Zingt de HEERE, looft Zijn Naam; verkondigt Zijn heil van dag tot dag. Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Jes 24:14-16": "Die zullen hun stem opheffen, zij zullen vrolijk zingen; vanwege de heerlijkheid van de HEERE zullen zij juichen vanaf de zee. Daarom eert de HEERE in de valleien, in de eilanden van de zee de Naam van de HEERE, de God van Israël. Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.", "1 Kor 1:3": "Genade zij u en vrede van God onze Vader, en van de Heere Jezus Christus.", "Ps 20:8": "Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "1 Sam 17:49-51": "En David stak zijn hand in de tas, en nam er een steen uit, en slingerde die, en trof de Filistijn in zijn voorhoofd, zodat de steen in zijn voorhoofd wegzonk, en hij viel voorover op de grond. Zo overweldigde David de Filistijn met een slinger en met een steen; en hij versloeg de Filistijn en doodde hem; doch David had geen zwaard in zijn hand. Daarom liep David, en ging op de Filistijn staan, en nam zijn zwaard, en trok het uit zijn schede, en doodde hem, en hakte hem daarmee het hoofd af. Toen de Filistijnen zagen dat hun geweldigste dood was, vluchtten zij.", "Ps 9:12": "Zingt psalmen voor de HEERE, Die te Sion woont; verkondigt onder de volken Zijn daden.", "Luk 17:15": "En een van hen, die zag dat hij genezen was, keerde terug en verheerlijkte God met luide stem.", "Ps 104:34": "Mijn overdenking van Hem zal zoet zijn; ik zal mij in de HEERE verblijden.", "Ps 50:6": "En de hemelen verkondigen Zijn gerechtigheid; want God Zelf is Rechter. Sela.", "Gen 18:8": "En hij nam boter en melk, en het kalf dat hij klaargemaakt had, en zette het hun voor, en stond zelf bij hen onder de boom, en zij aten.", "Openb 18:22": "En de stem van citerspelers, en zangers, en fluiters, en bazuinblazers, zal in u niet meer gehoord worden; en geen enkele kunstenaar van welke kunst dan ook zal meer in u gevonden worden; en het geluid van de molen zal in u niet meer gehoord worden.", "Job 31:39": "Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;", "Ps 95:6": "Komt, laat ons aanbidden en neerbukken; laat ons knielen voor de HEERE, Die ons gemaakt heeft.", "1 Sam 12:23": "Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.", "1 Sam 17:57": "Toen David terugkeerde van het verslaan van de Filistijn, nam Abner hem mee, en bracht hem voor Saul, met het hoofd van de Filistijn in zijn hand.", "2 Kor 8:3": "Want zij zijn naar vermogen (ik betuig het), ja, boven vermogen gewillig geweest;", "Ps 119:62": "Te middernacht sta ik op, om U te loven voor de rechten van Uw gerechtigheid.", "Ps 68:2-4": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten. U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht. Maar de rechtvaardigen zullen zich verblijden; zij zullen van vreugde opspringen voor Gods aangezicht, en van blijdschap vrolijk zijn.", "Ps 105:1-5": "Looft de HEERE, roept Zijn Naam aan, maakt Zijn daden bekend onder de volken. Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen. Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "Rom 10:4": "Want het einde van de wet is Christus, tot rechtvaardigheid voor ieder die gelooft.", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Richt 4:15": "En de HEERE versloeg Sisera, met al zijn wagens, en het hele leger, door de scherpte van het zwaard, voor Barak; zodat Sisera van de wagen afklom, en te voet vluchtte.", "Kol 2:2": "Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus;", "Rom 3:22": "namelijk de gerechtigheid van God door het geloof van Jezus Christus, tot allen, en over allen die geloven; want er is geen onderscheid.", "Ps 138:4": "Alle koningen van de aarde zullen U, o HEERE! loven, wanneer zij de redenen van Uw mond gehoord zullen hebben.", "Ps 92:2-4": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste! Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten; Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.", "Ps 115:18": "Maar wij zullen de HEERE loven van nu af tot in eeuwigheid. Halleluja!", "Ps 83:10-19": "Doe hun als Midian, als Sisera, als Jabin bij de beek Kison; die verdelgd zijn bij Endor; zij zijn geworden tot mest voor de aarde. Maak hen en hun vorsten als Oreb en als Zeëb, en al hun leiders als Zebah en als Zalmuna;", "Dan 3:6": "En wie niet neervalt en aanbidt, die zal op datzelfde moment in het midden van de brandende vuuroven geworpen worden.", "Gal 6:16": "En zovelen als er naar deze regel zullen wandelen, over hen zij vrede en barmhartigheid, en over het Israël van God.", "Deut 5:23": "En het gebeurde, toen u die stem uit het midden van de duisternis hoorde, terwijl de berg van vuur brandde, dat u tot mij naderde, alle hoofden van uw stammen, en uw oudsten,", "2 Tess 3:16": "De Heere nu van de vrede Zelf geeft u vrede te allen tijde, op allerlei wijze. De Heere zij met u allen.", "Ps 107:22": "En laat hen lofoffers offeren, en met gejuich Zijn werken vertellen.", "Ps 68:26": "De zangers gingen voorop, de speellieden erachteraan, in het midden de trommelende meisjes.", "2 Kor 9:5": "Ik heb dan nodig geacht deze broeders te vermanen, dat zij eerst tot u zouden komen en van tevoren uw eerder aangediende zegen klaarmaken; zodat die gereed is, als een zegen, en niet als een vrekkigheid.", "Gen 26:20-22": "En de herders van Gerar twistten met Izaks herders, en zeiden: Dit water hoort ons toe! Daarom noemde hij die put Esek, omdat zij met hem gekeven hadden. Toen groeven zij een andere put, en daar twistten zij ook over; daarom noemde hij die Sitna. En hij brak daarvandaan op, en groef een andere put, en daarover twistten zij niet; daarom noemde hij die Rehoboth, en zei: Want nu heeft de HEERE ons ruimte gemaakt, en wij zijn vruchtbaar geworden in dit land.", "Lev 23:14": "En u zult geen brood, noch geroosterd koren, noch groene aren eten, tot op diezelfde dag, dat u de offerande van uw God zult gebracht hebben; het is een eeuwige inzetting voor uw geslachten, in al uw woningen.", "Ex 21:34": "dan zal de eigenaar van de kuil het vergoeden; hij zal aan de eigenaar van het dier het geld teruggeven; maar het dode dier zal hem toebehoren.", "Openb 12:1": "En er werd een groot teken gezien in de hemel: namelijk een vrouw, bekleed met de zon; en de maan was onder haar voeten, en op haar hoofd een kroon van twaalf sterren;", "1 Kor 14:15": "Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen.", "Gen 20:16": "En tegen Sara zei hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, dat moet voor u een bedekking van de ogen zijn, voor allen die bij u zijn, ja, tegenover allen, en wees terechtgewezen.", "Ps 118:8-12": "Het is beter tot de HEERE toevlucht te nemen, dan op de mens te vertrouwen. Het is beter tot de HEERE toevlucht te nemen, dan op prinsen te vertrouwen. Alle heidenen hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "Ps 119:175": "Laat mijn ziel leven, en zij zal U loven, en laat Uw rechten mij helpen.", "2 Kron 23:18": "Jojada nu stelde de diensten van het huis van de HEERE aan, onder leiding van de Levitische priesters, die David in het huis van de HEERE ingedeeld had, om de brandoffers van de HEERE te offeren, zoals in de wet van Mozes geschreven staat, met blijdschap en met gezang, naar de instelling van David.", "Ex 18:13": "Doch het gebeurde de volgende dag, dat Mozes ging zitten om het volk te oordelen, en het volk stond bij Mozes, van de morgen tot de avond.", "Richt 17:4": "Maar hij gaf dat geld aan zijn moeder terug. En zijn moeder nam tweehonderd zilverlingen, en gaf ze aan de goudsmid, die maakte daarvan een gesneden beeld en een gegoten beeld; dat was in het huis van Micha.", "Ps 36:11": "Strek Uw goedertierenheid uit over degenen, die U kennen, en Uw gerechtigheid over de oprechten van hart.", "Matt 11:17": "En zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben u klaagliederen gezongen, en u hebt niet geweend.", "Ps 28:7": "De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.", "2 Kron 29:25-28": "En hij stelde de Levieten aan in het huis van de HEERE, met cimbalen, met luiten en harpen, naar het gebod van David, en van Gad, de ziener van de koning, en van Nathan, de profeet; want dit gebod kwam van de hand van de HEERE, door de hand van Zijn profeten. De Levieten nu stonden met de instrumenten van David, en de priesters met de trompetten. En Hizkia gaf bevel dat men het brandoffer op het altaar zou offeren; en op het moment dat het brandoffer begon, begon ook het gezang van de HEERE, met de trompetten en met de instrumenten van David, de koning van Israël.", "Ps 113:2": "De Naam van de HEERE zij geprezen, van nu af tot in eeuwigheid.", "Ps 125:5": "Maar die zich neigen tot hun kromme wegen, die zal de HEERE weg doen gaan met de werkers van de ongerechtigheid. Vrede zal over Israël zijn!", "Luk 19:15": "En het gebeurde, toen hij terugkwam nadat hij het koninkrijk ontvangen had, dat hij zei dat die dienstknechten aan wie hij het geld gegeven had bij hem geroepen moesten worden, opdat hij zou weten wat ieder met handel verdiend had.", "Ps 122:7": "Vrede zij binnen uw vesting, welvaart in uw paleizen.", "Ps 52:11": "Ik zal U loven voor eeuwig, omdat U het gedaan hebt; en ik zal Uw Naam verwachten; want hij is goed voor Uw gunstgenoten.", "1 Tess 5:23": "En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.", "Ezech 26:13": "Zo zal Ik het gedreun van uw liederen doen ophouden, en het geschal van uw harpen zal niet meer gehoord worden.", "Richt 7:8": "En het volk nam de teerkost in hun hand, en hun bazuinen; en hij liet alle andere mannen van Israël gaan, ieder naar zijn tent, maar die driehonderd man hield hij bij zich. En het leger van de Midianieten lag beneden hem in het dal.", "Ps 103:2": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden;", "Ps 119:7": "Ik zal U loven in oprechtheid van hart, als ik de rechten van Uw gerechtigheid geleerd zal hebben.", "Richt 1:27": "En Manasse verdreef Beth-sean niet, noch de bijbehorende plaatsen, noch Thaanach met de bijbehorende plaatsen, noch de inwoners van Dor met de bijbehorende plaatsen, noch de inwoners van Jibleam met de bijbehorende plaatsen, noch de inwoners van Megiddo met de bijbehorende plaatsen; en de Kanaänieten wilden in dat land blijven wonen.", "Rom 15:27": "Want het heeft hun zo goedgedacht; ook zijn zij hun schuldenaars; want als de heidenen deel hebben gekregen aan hun geestelijke goederen, dan zijn zij ook verplicht hen met stoffelijke goederen te dienen.", "Ps 84:5": "Gelukkig zijn zij, die in Uw huis wonen; zij prijzen U gestadig. Sela.", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "Jer 32:9": "Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Num 32:1-5": "De nakomelingen van Ruben en de nakomelingen van Gad hadden veel vee, heel veel; en zij bekeken het land Jaezer en het land Gilead, en zie, deze plaats was een plaats geschikt voor vee. Toen kwamen de kinderen van Gad en de kinderen van Ruben en spraken tot Mozes, tot Eleazar de priester, en tot de leiders van de vergadering, en zeiden: Ataroth, en Dibon, en Jaezer, en Nimra, en Hesbon, en Eleale, en Schebam, en Nebo, en Behon;", "1 Sam 12:9": "Maar zij vergaten de HEERE, hun God; zo verkocht Hij hen in de hand van Sisera, de legeraanvoerder van Hazor, en in de hand van de Filistijnen, en in de hand van de koning van de Moabieten, die tegen hen streden.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Ps 119:46": "Ook zal ik voor koningen spreken van Uw getuigenissen, en mij niet schamen.", "Richt 3:31": "Na hem nu was Samgar, een zoon van Anath, die de Filistijnen sloeg, zeshonderd man, met een ossenstok; zo verloste ook hij Israël.", "Num 32:40": "Zo gaf Mozes Gilead aan Machir, de zoon van Manasse; en hij woonde daarin.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "Pred 7:12": "Want de wijsheid is tot een schaduw, en het geld is tot een schaduw; maar de uitnemendheid van de wetenschap is, dat de wijsheid haar bezitters het leven geeft.", "Ezra 7:21": "En van mij, mij, koning Arthahsasta, wordt bevel gegeven aan alle schatmeesters die aan de overkant van de rivier zijn, dat alles wat Ezra, de priester, de schriftgeleerde van de wet van de God van de hemel, van u zal vragen, spoedig gedaan wordt;", "Num 21:17": "(Toen zong Israël dit lied: Spring op, put, zing daarvan bij beurte!", "Ps 69:31": "Ik zal de Naam van God prijzen met gezang, en Hem met dankzegging grootmaken.", "Ex 12:14": "En deze dag zal voor u een gedachtenis zijn, en u zult hem als een feest voor de HEERE vieren; u zult hem vieren onder uw geslachten, als een eeuwige inzetting.", "Ezech 11:13": "Het gebeurde nu, toen ik profeteerde, dat Pelatja, de zoon van Benaja, stierf. Toen viel ik neer op mijn gezicht, en riep met luide stem, en zei: Ach, Heere HEERE! Zult U een volledig einde maken met het overblijfsel van Israël?", "Lev 19:24": "Maar in het vierde jaar zal al zijn vrucht een heilig ding zijn, tot lofzegging voor de HEERE.", "2 Sam 22:8": "Toen daverde en beefde de aarde; de fundamenten van de hemel beroerden zich, en daverden, omdat Hij in toorn ontstoken was.", "Ps 22:26": "Van U zal mijn lof zijn in een grote gemeente; ik zal mijn geloften betalen in de tegenwoordigheid van hen die Hem vrezen.", "Ps 119:144": "De gerechtigheid van Uw getuigenissen is in de eeuwigheid; doe mij ze verstaan, zo zal ik leven.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "2 Sam 22:47": "De HEERE leeft, en geloofd zij mijn Rotssteen; en verhoogd zij God, de Rotssteen van mijn heil!", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Matt 13:43": "Dan zullen de rechtvaardigen stralen als de zon, in het Koninkrijk van hun Vader. Wie oren heeft om te horen, laat hij horen.", "Ps 68:27": "Looft God in de gemeenten, de Heere, u die uit de bron van Israël bent!", "Ps 134:1": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!", "1 Petr 4:11": "Als iemand spreekt, laat hij spreken als de woorden van God; als iemand dient, laat hij dienen als uit kracht die God verleent; opdat God in alles geprezen wordt door Jezus Christus, aan Wie de heerlijkheid en de kracht toekomt, tot in alle eeuwigheid. Amen.", "Ps 63:4-7": "Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen. Zo zou ik U loven in mijn leven; in Uw Naam zou ik mijn handen opheffen. Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen.", "Hand 2:46": "En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "Dan 9:7": "Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Ps 149:1-9": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. L
