pstond, dat ik opstond, een moeder in Israël.","8":"Verkoos hij nieuwe goden, dan was er krijg in de poorten; werd er ook een schild gezien, of een spies, onder veertigduizend in Israël?","9":"Mijn hart is naar de wetgevers van Israël, die zich gewillig aangeboden hebben onder het volk; looft de HEERE!","10":"U, die op witte ezelinnen rijdt, u, die aan het gericht zit, en u, die over de weg wandelt, spreek erover!","11":"Van het gedruis van de schutters, tussen de plaatsen waar men water schept, spreekt men daar samen van de gerechtigheid van de HEERE, van de gerechtigheden, *bewezen* aan Zijn dorpen in Israël; toen ging het volk van de HEERE af naar de poorten.","12":"Waak op, waak op, Debora, waak op, waak op, spreek een lied! Maak u op, Barak! En leid uw gevangenen gevangen, u zoon van Abinoam.","13":"Toen deed Hij de overgeblevenen heersen over de heerlijke *onder* het volk; de HEERE doet mij heersen over de geweldigen.","14":"Uit Efraïm was hun wortel tegen Amalek. Achter u was Benjamin onder uw volken. Uit Machir zijn de wetgevers afgetrokken, en uit Zebulon, die trekken door de staf van de schrijver.","15":"Ook waren de vorsten in Issaschar met Debora; en *zoals* Issaschar, zo was Barak; op zijn voeten werd hij gezonden in het dal. In Rubens gedeelten waren de inbeeldingen van het hart groot.","16":"Waarom bleef u zitten tussen de stallingen, om te horen het geblaat van de kudden? De gedeelten van Ruben hadden grote onderzoekingen van het hart.","17":"Gilead bleef aan de andere zijde van de Jordaan; en Dan, waarom onthield hij zich in schepen! Aser zat aan de zeehaven, en bleef in zijn gescheurde plaatsen.","18":"Zebulon, het is een volk, *dat* zijn ziel versmaad heeft ter dood, evenzo Nafthali, op de hoogten van het veld.","19":"De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.","20":"Vanuit de hemel streden zij, de sterren uit hun loopplaatsen streden tegen Sisera.","21":"De beek Kison wentelde hen weg, de beek Kedumin, de beek Kison; vertrap, o mijn ziel! de sterken.","22":"Toen werden de paardenhoeven verpletterd, van het rennen, het rennen van zijn machtigen.","23":"Vloek Meroz, zegt de Engel van de HEERE, vloek haar inwoners voortdurend; omdat zij niet gekomen zijn tot de hulp van de HEERE, tot de hulp van de HEERE, met de helden.","24":"Gezegend zij boven de vrouwen Jaël, de huisvrouw van Heber, de Keniet; gezegend zij ze boven de vrouwen in de tent!","25":"Water eiste hij, melk gaf zij; in een herenschaal bracht zij boter.","26":"Haar hand sloeg zij aan de nagel, en haar rechterhand aan de hamer van de arbeidslieden; en zij klopte Sisera; zij streek zijn hoofd af, toen zij zijn slaap had doorgenageld en doorgedrongen.","27":"Tussen haar voeten kromde hij zich, viel neer, lag daar neer; tussen haar voeten kromde hij zich; hij viel; waar hij zich kromde, daar lag hij geheel geschonden!","28":"De moeder van Sisera keek uit door het venster, en schreeuwde door de traliën: Waarom vertoeft zijn wagen te komen! Waarom blijven de gangen van zijn wagens achter?","29":"De wijste van haar staatsvrouwen antwoordden; ook beantwoordde zij haar redenen aan zichzelf:","30":"Zouden zij dan de buit niet vinden *en* delen? Een liefje, *of* twee liefjes, voor ieder man? Voor Sisera een buit van verscheidene verven, een buit van verscheidene verven, gestikt; van verscheiden verf aan beide zijden gestikt, voor de buithalzen?","31":"Zo moeten omkomen al Uw vijanden, o HEERE! Die Hem daarentegen liefhebben, *moeten* *zijn*, als wanneer de zon opgaat in haar kracht. En het land was stil, veertig jaren."},"SV":{"1":"Voorts zong Debora, en Barak, de zoon van Abinoam, ten zelven dage, zeggende:","2":"Looft den HEERE, van het wreken der wraken in Israël, van dat het volk zich gewillig heeft aangeboden.","3":"Hoort, gij koningen, neemt ter oren, gij vorsten! Ik, den HEERE zal ik zingen, ik zal den HEERE, den God Israëls, psalmzingen.","4":"HEERE! toen Gij voorttoogt van Seir, toen Gij daarheen traadt van het veld van Edom, beefde de aarde, ook droop de hemel, ook dropen de wolken van water.","5":"De bergen vervloten van het aangezicht des HEEREN; zelfs Sinaï van het aangezicht des HEEREN, des Gods van Israël.","6":"In de dagen van Samgar, den zoon van Anath, in de dagen van Jaël, hielden de wegen op, en die op paden wandelden, gingen kromme wegen.","7":"De dorpen hielden op in Israël, zij hielden op; totdat ik, Debora, opstond, dat ik opstond, een moeder in Israël.","8":"Verkoos hij nieuwe goden, dan was er krijg in de poorten; werd er ook een schild gezien, of een spies, onder veertig duizend in Israël?","9":"Mijn hart is tot wetgevers van Israël, die zich gewillig aangeboden hebben onder het volk; looft den HEERE!","10":"Gij, die op witte ezelinnen rijdt, gij, die aan het gerichte zit, en gij, die over weg wandelt, spreekt er van!","11":"Van het gedruis der schutters, tussen de plaatsen, waar men water schept, spreekt aldaar te zamen van de gerechtigheid des HEEREN, van de gerechtigheden, *bewezen* aan zijn dorpen in Israël; toen ging des HEEREN volk af tot de poorten.","12":"Waak op, waak op, Debora, waak op, waak op, spreek een lied! maak u op, Barak! en leid uw gevangenen gevangen, gij zoon van Abinoam.","13":"Toen deed Hij de overgeblevenen heersen over de heerlijken *onder* het volk; de HEERE doet mij heersen over de geweldigen.","14":"Uit Efraïm was hun wortel tegen Amalek. Achter u was Benjamin onder uw volken. Uit Machir zijn de wetgevers afgetogen, en uit Zebulon, trekkende door den staf des schrijvers.","15":"Ook waren de vorsten in Issaschar met Debora; en *gelijk* Issaschar, alzo was Barak; op zijn voeten werd hij gezonden in het dal. In Rubens gedeelten waren de inbeeldingen des harten groot.","16":"Waarom bleeft gij zitten tussen de stallingen, om te horen het geblaat der kudden? De gedeelten van Ruben hadden grote onderzoekingen des harten.","17":"Gilead bleef aan gene zijde van de Jordaan; en Dan, waarom onthield hij zich in schepen! Aser zat aan de zeehaven, en bleef in zijn gescheurde plaatsen.","18":"Zebulon, het is een volk, *dat* zijn ziel versmaad heeft ter dood, insgelijks Nafthali, op de hoogten des velds.","19":"De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan de wateren van Megiddo; zij brachten geen gewin des zilvers daarvan.","20":"Van den hemel streden zij, de sterren uit haar loopplaatsen streden tegen Sisera.","21":"De beek Kison wentelde hen weg, de beek Kedumin, de beek Kison; vertreed, o mijn ziel! de sterken.","22":"Toen werden de paardenhoeven verpletterd, van het rennen, het rennen zijner machtigen.","23":"Vloekt Meroz, zegt de Engel des HEEREN, vloekt haar inwoners geduriglijk; omdat zij niet gekomen zijn tot de hulp des HEEREN, tot de hulp des HEEREN, met de helden.","24":"Gezegend zij boven de vrouwen Jaël, de huisvrouw van Heber, den Keniet; gezegend zij ze boven de vrouwen in de tent!","25":"Water eiste hij, melk gaf zij; in een herenschaal bracht zij boter.","26":"Haar hand sloeg zij aan den nagel, en haar rechterhand aan den hamer der arbeidslieden; en zij klopte Sisera; zij streek zijn hoofd af, als zij zijn slaap had doorgenageld en doorgedrongen.","27":"Tussen haar voeten kromde hij zich, viel henen, lag daar neder; tussen haar voeten kromde hij zich; hij viel; alwaar hij zich kromde, daar lag hij geheel geschonden!","28":"De moeder van Sisera keek uit door het venster, en schreeuwde door de traliën: Waarom vertoeft zijn wagen te komen! Waarom blijven de gangen zijner wagenen achter?","29":"De wijsten harer staatsvrouwen antwoordden; ook beantwoordde zij haar redenen aan zichzelve:","30":"Zouden zij dan den buit niet vinden *en* delen? een liefje, *of* twee liefjes, voor iegelijken man? Voor Sisera een buit van verscheidene verven, een buit van verscheidene verven, gestikt; van verscheiden verf aan beide zijden gestikt, voor de buithalzen?","31":"Alzo moeten omkomen al Uw vijanden, o HEERE! die Hem daarentegen liefhebben, *moeten* *zijn*, als wanneer de zon opgaat in haar kracht. En het land was stil, veertig jaren."},"KJV":{"1":"Then sang Deborah and Barak the son of Abinoam on that day, saying,","2":"Praise ye the LORD for the avenging of Israel, when the people willingly offered","3":"Hear, O ye kings; give ear, O ye princes; I, *even* I, will sing unto the LORD; I will sing *praise* to the LORD God of Israel.","4":"LORD, when thou wentest out of Seir, when thou marchedst out of the field of Edom, the earth trembled, and the heavens dropped, the clouds also dropped water.","5":"The mountains melted from before the LORD, *even* that Sinai from before the LORD God of Israel.","6":"In the days of Shamgar the son of Anath, in the days of Jael, the highways were unoccupied, and the travellers walked through byways.","7":"*The inhabitants of* the villages ceased, they ceased in Israel, until that I Deborah arose, that I arose a mother in Israel.","8":"They chose new gods; then *was* war in the gates: was there a shield or spear seen among forty thousand in Israel?","9":"My heart *is* toward the governors of Israel, that offered themselves willingly among the people. Bless ye the LORD.","10":"Speak, ye that ride on white asses, ye that sit in judgment, and walk by the way.","11":"*They that are delivered* from the noise of archers in the places of drawing water, there shall they rehearse the righteous acts of the LORD, *even* the righteous acts *toward the inhabitants* of his villages in Israel: then shall the people of the LORD go down to the gates.","12":"Awake, awake, Deborah: awake, awake, utter a song: arise, Barak, and lead thy captivity captive, thou son of Abinoam.","13":"Then he made him that remaineth have dominion over the nobles among the people: the LORD made me have dominion over the mighty.","14":"Out of Ephraim *was there* a root of them against Amalek; after thee, Benjamin, among thy people; out of Machir came down governors, and out of Zebulun they that handle the pen of the writer.","15":"And the princes of Issachar *were* with Deborah; even Issachar, and also Barak: he was sent on foot into the valley. For the divisions of Reuben *there were* great thoughts of heart.","16":"Why abodest thou among the sheepfolds, to hear the bleatings of the flocks? For the divisions of Reuben *there were* great searchings of heart.","17":"Gilead abode beyond Jordan: and why did Dan remain in ships? Asher continued on the sea shore, and abode in his breaches.","18":"Zebulun and Naphtali *were* a people *that* jeoparded their lives unto the death in the high places of the field.","19":"The kings came *and* fought, then fought the kings of Canaan in Taanach by the waters of Megiddo; they took no gain of money.","20":"They fought from heaven; the stars in their courses fought against Sisera.","21":"The river of Kishon swept them away, that ancient river, the river Kishon. O my soul, thou hast trodden down strength.","22":"Then were the horsehoofs broken by the means of the pransings, the pransings of their mighty ones.","23":"Curse ye Meroz, said the angel of the LORD, curse ye bitterly the inhabitants thereof; because they came not to the help of the LORD, to the help of the LORD against the mighty.","24":"Blessed above women shall Jael the wife of Heber the Kenite be, blessed shall she be above women in the tent.","25":"He asked water, *and* she gave *him* milk; she brought forth butter in a lordly dish.","26":"She put her hand to the nail, and her right hand to the workmen's hammer; and with the hammer she smote Sisera, she smote off his head, when she had pierced and stricken through his temples.","27":"At her feet he bowed, he fell, he lay down: at her feet he bowed, he fell: where he bowed, there he fell down dead.","28":"The mother of Sisera looked out at a window, and cried through the lattice, Why is his chariot *so* long in coming? why tarry the wheels of his chariots?","29":"Her wise ladies answered her, yea, she returned answer","30":"Have they not sped? have they *not* divided the prey; to every man a damsel *or* two; to Sisera a prey of divers colours, a prey of divers colours of needlework, of divers colours of needlework on both sides, *meet* for the necks of *them that take* the spoil?","31":"So let all thine enemies perish, O LORD: but *let* them that love him *be* as the sun when he goeth forth in his might. And the land had rest forty years."}},"tsk":{"1":[{"kopje":"zong Debora","refs":["Ex 15:1","Ex 15:21","Num 21:17","1 Sam 2:1","2 Kron 20:21","2 Kron 20:27","Job 38:7","Ps 18:2","Jes 12:1-6","Jes 25:1","Jes 26:1","Luk 1:46","Luk 1:67","Luk 1:68","Openb 15:3","Openb 15:4","Openb 19:1-3"]}],"2":[{"kopje":"om het wreken","refs":["Deut 32:43","2 Sam 22:47","2 Sam 22:48","Ps 18:48","Ps 48:12","Ps 94:1","Ps 97:8","Ps 136:15","Ps 136:19","Ps 136:20","Ps 149:6-9","Openb 16:5","Openb 16:6","Openb 18:20","Openb 19:2"]},{"kopje":"dat","refs":["Richt 5:9","2 Kron 17:16","Neh 11:2","Ps 110:3","1 Kor 9:17","2 Kor 8:12","2 Kor 9:7","Fil 2:13","Filem 1:14"]}],"3":[{"kopje":"u koningen","refs":["Deut 32:1","Deut 32:3","Ps 2:10-12","Ps 49:2","Ps 49:3","Ps 119:46","Ps 138:4","Ps 138:5"]},{"kopje":"Ik","refs":["Richt 5:7","Gen 6:17","Gen 9:9","Ex 31:6","Lev 26:28","1 Kon 18:22","1 Kon 19:10","1 Kon 19:14","Ezra 7:21"]}],"4":[{"kopje":"HEERE","refs":["Deut 33:2","Ps 68:8","Ps 68:9","Hab 3:3-6"]},{"kopje":"de aarde","refs":["2 Sam 22:8","Job 9:6","Ps 18:8-16"]},{"kopje":"droop","refs":["Ps 77:18"]}],"5":[{"kopje":"bergen","refs":["Deut 4:11","Ps 97:5","Ps 114:4","Jes 64:1-3","Nahum 1:5","Hab 3:10"]},{"kopje":"zelfs Sinaï","refs":["Ex 19:18","Ex 20:18","Deut 4:11","Deut 4:12","Deut 5:22-25","Hebr 12:18"]}],"6":[{"kopje":"Samgar","refs":["Richt 3:31"]},{"kopje":"Jaël","refs":["Richt 4:17","Richt 4:18"]},{"kopje":"de wegen","refs":["Lev 26:22","2 Kron 15:5","Jes 33:8","Klaagl 1:4","Klaagl 4:18","Micha 3:12"]},{"kopje":"kromme wegen","refs":["Ps 125:5"]}],"7":[{"ko f herenwegen waren niet te gebruiken, vanwege rovers en straatschenders."},{"catchword":"die op paden wandelden,","tekst":"Hebreeuws, de wandelaars der paden; dat is, die de gemene wegen plachten te gebruiken, zochten moeilijke omwegen, om de stropers en vijanden te ontgaan."}],"7":[{"catchword":"dorpen hielden op","tekst":"Ongemuurde plaatsen, als vlekken, dorpen, kleine steden, omdat er niemand veilig wonen kon, zo vervielen die en lagen woest en onbewoond. Anders, de landman, of, het landvolk, inwoners der dorpen, dorpslieden"},{"catchword":"een moeder in Israël","tekst":"Die, als een profetes, het volk, zijnde mijn discipelen [die in de Schrift kinderen der profeten genoemd worden] van Gods wil heeft onderwezen, en als een richteres, de ellende der onderdanen met moederlijk medelijden ter harte genomen en afgewend heeft."}],"8":[{"catchword":"hij","tekst":"Namelijk, Israël."},{"catchword":"nieuwe goden,","tekst":"De afgoden der heidenen; zo strafte God hen telkens met overlast van krijg en oorlog."},{"catchword":"schild gezien,","tekst":"Zij waren zo moedeloos en verslagen dat men geen tegenweer zag."}],"9":[{"catchword":"wetgevers van Israël,","tekst":"De oversten des volks of der stammen, die het volk door bevelen en hun exempelen gewillig en hartig hebben gemaakt."},{"catchword":"gewillig aangeboden hebben","tekst":"Zie boven, vs.2, en Jdg 4:6, Jdg 4:10."}],"10":[{"catchword":"ezelinnen rijdt,","tekst":"Gelijk grote en aanzienlijke lieden gewoon waren te doen. Zie onder, Jdg 10:4, en Jdg 12:14."},{"catchword":"aan het gerichte zit,","tekst":"Anders, die gij aan Middin woont; verstaande een plaats, waar des vijands aanstoot meest gevallen is. Zie Jos 15:61."},{"catchword":"weg wandelt,","tekst":"Zie vs.6."},{"catchword":"spreekt er van","tekst":"Anders, denkt, peinst er aan."}],"11":[{"catchword":"Van het gedruis","tekst":"Anders, vanwege."},{"catchword":"schutters,","tekst":"Dat is, krijgslieden, die met gedruis aankwamen om de waterscheppers te storen en overlast aan te doen, met plunderen, roven en anderszins."},{"catchword":"spreekt aldaar te zamen","tekst":"Het Hebreeuwse woord wordt ook gevonden onder, Jdg 11:40."},{"catchword":"gerechtigheid des HEEREN,","tekst":"Dat is, de rechtvaardige daden des Heeren, door welke Hij zijn volk gewroken en van des vijands overlast bevrijd heeft. Vergelijk 1Sa 12:7; Mic 6:5, met de aantekeningen."},{"catchword":"gerechtigheden,","tekst":"Hebreeuws, gerechtigheden zijns dorps; dat is, bewezen aan de dorpen of landlieden. Vergelijk boven, vs.6."},{"catchword":"ging des HEEREN volk af","tekst":"Zij mochten weder vrijelijk of onbeschroomd de poorten uit en ingaan."}],"12":[{"catchword":"uw gevangenen gevangen,","tekst":"Hebreeuws, uw gevangenis."}],"13":[{"catchword":"Hij","tekst":"Dat is, de Heere gaf aan het overblijfsel van Israël de heerschappij over de groten en aanzienlijken des Kanaänietischen volks. Anders, Hij gaf de heerschappij des overgeblevenen [vijands] den heerlijken, of machtigen, groten des volks [Israëls]. Of, Hij deed het overgebleven volk heersen over de heerlijken"},{"catchword":"doet mij heersen","tekst":"Of, geeft mij heerschappij."}],"14":[{"catchword":"Efraïm","tekst":"Hier verhaalt Debora hoe de stammen zich in deze hebben gekweten; toeschrijvende lof en schande naar ieders verdienste."},{"catchword":"wortel tegen Amalek","tekst":"Dit verstaan sommigen van Debora, wonende op het gebergte Efraïms, boven, Jdg 4:5; die door Gods genade als de wortel en oorsprong was van dit ganse werk tegen de Kanaänieten, die ten aanzien hunner vijandschap en uitroeiing met Amalek mogen worden vergeleken. Anderen duiden het op Jozua, die ook uit Efraïm was en Amalek overwon, Exo 17:13. Anders, welker wortel is bij Amalek; dat is, Juda en Simeon, welker begin zich van Efraïms gebergte uitstrekte tot aan Amalek, gelijk te zien is uit vergelijking van boven, Jdg 1:16, met 1Sa 15:6."},{"catchword":"Achter u was Benjamin","tekst":"Dat is, de stam van Benjamin volgde U, o Heere, mede na, onder uw ander volk. Sommigen duiden het op Efraïm, dien Benjamin gevolgd heeft."},{"catchword":"Machir","tekst":"Dat is, de stam van Manasse, wiens eerstgeboren zoon Machir was, Jos 17:1."},{"catchword":"wetgevers afgetogen,","tekst":"Dat is, oudsten en richters des volks."},{"catchword":"trekkende","tekst":"Te weten, het volk tot haar. Zie boven, Jdg 4:6. Anders, die met den straf, of de pen des schrijvers trokken; dat is, met de schrijfpen omgingen, of door middel van brieven of missieven het volk bijeentrokken of deden vergaderen. Vergelijk boven, Jdg 4:6."}],"15":[{"catchword":"de vorsten","tekst":"Anders, mijn vorsten."},{"catchword":"op zijn voeten","tekst":"Zie boven, Jdg 4:10, Jdg 4:14."},{"catchword":"gedeelten","tekst":"Ruben, wonende aan de andere zijde der Jordaan, zich houdende als afgezonderd van zijn broeders."},{"catchword":"inbeeldingen des harten groot","tekst":"Of, inzettingen, opzetten, besluitingen; dat is, zij waren zeer traag, zwaarmoedig, hebbende [zoals men zegt] grote wijsheid in het hoofd, en voorwendende veel zwarigheden, die hen ophielden en verhinderden, dat zij hun broeders niet te hulp kwamen, maar zich tussen beiden, als neutraal hielden, hun particulier belang meer achtende dan het algemene. Anders, over, of van Rubens afzonderingen zijne grote gedachten des harten, dat is, daarover valt veel na te denken en te verwonderen; alzo in vs.16. Sommigen menen dat hier geroemd wordt de grote vromigheid die zij tevoren bewezen hadden in het trekken over de Jordaan voor hun broeders, waarmede deze hun slapheid niet overeenkwam."}],"16":[{"catchword":"gij zitten","tekst":"Of, Ruben. Deze stam was rijk aan vee. Zie Num 32:1, enz."},{"catchword":"stallingen,","tekst":"Of, twee rijen kooien, of stallen. Het Hebreeuwse woord schijnt daarop te zien, dat de stallen en kooien in twee rijen tegenover elkander [gelijk men nu ook gemeenlijk doet] gemaakt waren, tussen welke men doorging, en elk zijn voeder bekwamelijk kon geven. Anders, tussen twee lasten, gelijk een ezel, die, aan beide zijden beladen zijnde, zich nederlegt om te rusten. Vergelijk Gen 49:14."},{"catchword":"het geblaat der kudden?","tekst":"Of, schuifelingen, sijfelingen, pijpingen, sissingen."},{"catchword":"onderzoekingen des harten","tekst":"Zie op vs.15."}],"17":[{"catchword":"Gilead","tekst":"Dat is, de Gileadieten, waardoor verstaan wordt de halve stam van Manasse, wonende aan gene zijde der Jordaan. Gilead was een zoon van Machir. Zie Jos 17:1, Jos 17:3. Anders kan men ook door Gilead tezamen verstaan Ruben, Gad en den voornoemden halven stam van Manasse, als wonende in Gilead. Zie Num 32:5, Num 32:29, Num 32:33."},{"catchword":"schepen","tekst":"De erfenissen van Dan en Aser waren merendeels gelegen aan de zee. Zie van Dan Jos 19:40, Jos 19:46, en van Aser ook aldaar Jos 19:24, Jos 19:26. Deze stammen waren in dezen krijg ook tehuis gebleven, om het gevaar te ontgaan, of zich met hun have in schepe, of op hoge rotsen te redden."},{"catchword":"gescheurde plaatsen","tekst":"Dat is, in steden en vlekken, die vervallen en niet wel bemuurd waren, of in kreken, die door den vloed der zee in het land scheuren. Anders, op zijn kloven of hoge rotsen."}],"18":[{"catchword":"zijn ziel","tekst":"Dat is, zijn leven, hun personen, alzo ter dood gewaagd hebben, dat zij het leven schenen te verachten, en gewilliglijk zich daarheen te begeven, tot Israëls verlossing. Zie van het woord versmaden Job 27:6."},{"catchword":"ter dood,","tekst":"Hebreeuws, tot sterven."},{"catchword":"op de hoogten des velds","tekst":"Dat is, op den berg Thabor zich houdende bij Barak, en met hem ten strijde moediglijk aftrekkende. Zie boven, Jdg 4:10, Jdg 4:14."}],"19":[{"catchword":"Tháänach","tekst":"Plaatsen, behorende tot den halven stam van Manasse. Zie boven, Jdg 1:27, en vergelijk Jos 17:11."},{"catchword":"zilvers daarvan","tekst":"Of, gelds. Anders, zij brachten niet een stukje zilver daarvan, daar zij groten buit meenden te halen."}],"20":[{"catchword":"Van den hemel streden zij,","tekst":"Met deze manieren van spreken wordt te kennen gegeven, dat God van boven en beneden, door velerlei creaturen en middelen tegen Sisera en zijn heirleger gestreden heeft."}],"21":[{"catchword":"wentelde hen weg,","tekst":"Of, veegde hen, keerde hen weg, door verbolgenheid van den stroom, die van boven door storm en onweder was verwekt."},{"catchword":"beek Kedumin,","tekst":"Lopende van het gebergte in de beek Kison, naar uitwijzen van de kaart. Anders, beek der oudheden; dat is, zeer oude beek, die vanouds, van den beginne af geweest, en van God daartoe gemaakt en behouden is."},{"catchword":"vertreed,","tekst":"Dat is, veracht de macht des vijands. Anders, mijn ziel trad op de sterken; door het gebed en Gods ingeven vertrouwende, dat zij als vertreden en onder de voeten gelegd zouden worden."},{"catchword":"de sterken","tekst":"Hebreeuws, de sterkte; te weten des machtigen vijands, die nu onder onze voeten gelegd is."}],"22":[{"catchword":"rennen","tekst":"Of, stampen, draven, trotteren, klateren; dat is, van het veel en haastig lopen en rennen."},{"catchword":"machtigen","tekst":"Die, de vlucht nemende, door snelheid hunner paarden meenden te ontkomen, doch tevergeefs."}],"23":[{"catchword":"Meroz,","tekst":"Een stad of landstreek, nabij de beek Kison, niet ver van de plaats, waar de slag geschied is, aan de zuidelijke grenzen van Issaschar."},{"catchword":"Engel des HEEREN,","tekst":"Vergelijk onder, Jdg 6:11, enz."},{"catchword":"vloekt haar inwoners geduriglijk;","tekst":"Hebreeuws, vloekt vloekende."},{"catchword":"des HEEREN, tot de hulp des HEEREN,","tekst":"Dat is, tot Israëls hulp, die de Heere bevolen en beschikt heeft. Of, tot de hulp van des Heeren volk. Anders is het menselijkerwijze gesproken van God, die eigenlijk niemands hulp van doen heeft."},{"catchword":"de helden","tekst":"Die Barak en Debora gevolgd zijn."}],"24":[{"catchword":"Gezegend","tekst":"Zie Gen 14:19."},{"catchword":"de vrouwen Jaël,","tekst":"Te weten, andere vrouwen; alzo in het volgende."},{"catchword":"in de tent","tekst":"Dat is, in haar tent, waar zij dat loffelijk werk gedaan had. Of [die] in tenten [wonen]."}],"25":[{"catchword":"herenschaal","tekst":"Hebreeuws, in een schaal der heerlijken; dat is, in een zulke grote schaal, als doorluchtige, grootmachtige heren en vorsten wel plegen te gebruiken."},{"catchword":"boter","tekst":"Anders, botermelk, melk waar de boter nog in was."}],"26":[{"catchword":"hand sloeg zij aan den nagel,","tekst":"Te weten, de linkerhand; of aldus: haar handen strekten zich uit, de ene aan de nagel, de rechter aan den hamer der arbeidslieden"},{"catchword":"zij streek zijn hoofd af,","tekst":"Het Hebreeuwse woord wordt bij de Hebreën eigenlijk gebruikt van het afstrijken der maten, die te vol of opgehoopt zijn. De zin is: dat zij hem het hoofd heeft afgesneden."},{"catchword":"doordrongen","tekst":"Het Hebreeuwse woord betekent eigenlijk veranderen, ten goede of ten kwade; en voorts doorgaan, doordringen, van het ene tot het andere, idem, verderven."}],"27":[{"catchword":"kromde hij zich,","tekst":"Vanwege de pijn; of pogende zich op te richten, doch terstond daarheen vallende, enz."},{"catchword":"geheel geschonden","tekst":"Hebreeuws eigenlijk, verwoest; dat is, gans beroofd en ten enenmale verdorven. Want zulk een machtig en trots krijgsoverste, te voet gevlucht, verbaasd, vermoeid en door een vrouw verstoken en toegedekt zijnde, lag daar doornageld, gekromd, bebloed en dood."}],"28":[{"catchword":"traliën","tekst":"Of, door een kijkvenstertje."},{"catchword":"wagenen achter?","tekst":"Hebreeuws, de gangen, de voeten, of, voetstappen zijner wagens."}],"29":[{"catchword":"De wijsten","tekst":"Anders, een iegelijk van haar wijze staatsvrouwen antwoordde haar."},{"catchword":"staatsvrouwen","tekst":"Anders, vorstinnen."}],"30":[{"catchword":"Zouden zij","tekst":"Alsof zij zeide: Ik heb ongelijk, dat ik die zo haast tegemoet zie; want zij moeten toch eerst den buit uitvinden en delen, enz."},{"catchword":"vinden en delen?","tekst":"Dat is, aantreffen, bekomen."},{"catchword":"liefje,","tekst":"Of, boelke, meisje."},{"catchword":"voor iegelijken man?","tekst":"Hebreeuws, voor het hoofd eens mans; dat is, voor elk hoofd, voor elken man."},{"catchword":"voor de buithalzen?","tekst":"Hebreeuws, voor de halzen des buits; dat is, dergenen wien de beste buit toekomt, als krijgsoversten, of die in den strijd zich wel gekweten en goeden buit bekomen hebben, zodat hun een goed gedeelte toebehoort; of, die den buit op den hals nadroegen, of met gevaar van hun halzen gehaald hadden."}],"31":[{"catchword":"Hem daarentegen liefhebben,","tekst":"Den Heere."},{"catchword":"als wanneer","tekst":"Dat is, zij moeten in krachten en glans voortgaan, en toenemen, gelijk de zon oprijst en voortgaat. Vergelijk Isa 40:31."},{"catchword":"opgaat in haar kracht","tekst":"Of, voortgaat."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Further sang Debora, and Barak the son of Abinoam, on that day, saying."}],"2":[{"catchword":null,"tekst":"Praise the LORD for avenging the vengeances [That is, because he hath fully avenged himself and his people on his and their enemies] in Israel, [oth. for, or by Israel] for that people [to wit, Zebulon and Naphtali: see above chap.4.10. and below ver.18. together with some other tribes: see below ver.14, 15.] have willingly offered themselves."}],"3":[{"catchword":null,"tekst":"Hear, ye Kings, give ear, ye Princes, I will sing unto the LORD, I will sing psalms unto the LORD the God of Israel."}],"4":[{"catchword":null,"tekst":"LORD, when thou wentest forth, [That is, going before, and leading the people by thy pillar of cloud] from Seir, [that is, carrying thy people from Mount Hoi, (after the subduing of the Canaanitish King of Harad) along the borders of the Edomites, who denied them passage through their country, towards the land of the Kings, Sihon and Og, to destroy them, and to bring Israel into the land of promise. See Num 20:21. and 21.4, etc.] When thou steppedest on from the field of Edom, the earth trembled, also the heaven dropped, the clouds also dropped of water. [it was as if all creatures from beneath and from above were amazed at thy coming and presence. Compare Psal.68.8,9.]"}],"5":[{"catchword":null,"tekst":"The mountains dissolved (Or, flowed away) from the presence of the LORD, [it was so, or at least seemed not otherwise then if such things had happened. Compare Psal.68.16,17. and 97.5. This also may be applied to the heathenish nations, the Amorites and Canaanites, dwelling in the mountains, who, by reason of Israels coming against them, and of the great and mighty acts of God which thy heard of, trembled and quaked. Compare Duet.2.25. Jos.5.1.] even Sinai [i.e. all that they left behind them, as Sinai, as also the places to which they went, stood amazed; or, (according) as Sinai had done at the time when God gave his law. Compare Psal.78.9.] from the face of the LORD the God of Jacob."}],"6":[{"catchword":null,"tekst":"In the days of Samgar [See above chap.3.21.] the son of Anath, in the days of Jael, [see chap.4. 21, etc.] the ways ceased, [i.e. the common roads or high-ways could not be used or frequented, by reason of thieves and robbers] and they that walked on paths [Heb. the walkers of paths] went crooked ways. [i.e. they that were wont to use or ply the common roads, sought out hard and difficult by-ways, to escaped highway-men and enemies]"}],"7":[{"catchword":null,"tekst":"The villages ceased in Israel, they ceased [i.e. the walled places, as towns, villages, hamlets, because no man could dwell safeand secure there, they fell to ruine, and lay waste and uninhabited. Oth. the husbandman, or the country people, inhabitants of villages, or townsfolk] until that I Debora arose, that I arose a mother in Israel. [that is, who as a Prophetess have instructed the people, being my disciples or scholars (who in Scripture are called the children of the Prophets) touching the will of God, and as a judges, or she-judge, here with motherly pitty and compassion laid to heart the miseries of the subjects, and turned away the same]"}],"8":[{"catchword":null,"tekst":"(When) he [viz. Israel] chose new gods [i.e. the Idols of the heathen] then was war in the gates. [Thus God ever and anon punished them with war] Was there a shield or spear seen among forty thousand in Israel? [they were so heartless and cast down, that no defence could be seen]"}],"9":[{"catchword":null,"tekst":"My heart is toward the Law-givers of Israel, [That is, Governors of the people, or of the tribes, who made the people willing and courageous by their commands and examples] who willingly offered themselves [see above, v. 1. & chap.4 6.10.] among the people: praise ye the LORD."}],"10":[{"catchword":null,"tekst":"Ye that ride upon white she-asses, [As great and honorable persons were wont to do: see below chap.10.4. & 12.14.] Ye that sit in judgement, [oth. ye that dwell at Middin: understanding a place where the enemy received the greatest foil: see jos.15.61.] and ye that walk on the way, [see v.6.] speak of it. [oth. think, muse on it]"}],"11":[{"catchword":null,"tekst":"From [Oth. Because of] the noise of the archors, between the places where water is drawn, [That is, souldiers coming on with a great noise, to disturb and molest the drawers of waters, by plundering, robbing, and other ways] speak there together [the Hebrew verb is also found below, chap11.v.40.] of the righteousnesses of the LORD, [that is, the righteous acts of the Lord, whereby he hath averaged his people, and freed them from the oppression of the enemy. Compare 1 Sam.12.7. Mic 6.5. with the annot.] of the righteousnesses (shewed) to his villages in Israel: [Heb. righteounesses of his villages; that is, shewed to the villages, or country people. Comp.above,v.6.] then went the people of the LORD down to the gates. [that is, they might freely and without fear go in and out at the gates]"}],"12":[{"catchword":null,"tekst":"Awake, awake, Debora, awake, awake, utter a song: arise, Barak, and lead thy captives [Heb. thy captivity] captive, thou son of Abinoam:"}],"13":[{"catchword":null,"tekst":"Then he made him that remaineth, have dominion over the honorable. (among) the people: [That is, the Lord gave unto the remnant of Israel, the rule and dominion over the great and eminent ones of the Canaanitish people. Oth. he gave the dominion of the remaining (enemy) unto the honorable, or, mighty, great (ones) of the people (of Israel) or, he made the remaining people have dominion over the honorable (one)] the LORD maketh me to have dominion [or, giveth me dominion] over the mighty"}],"14":[{"catchword":null,"tekst":"Out of Ephraim [Here Debora relateth, how the tribes behaved themselves in this battle; attributing to some; praise: to others, shame and disgrace, according to every ones demerit] was their root against Amalek. [Some understand this of Debora, dwelling on Mount Ephraim, above chap.4, 5. Who, by the grace of God, was as it were the root and original of all this expedition against the Canaanites, who in respect of their enmity and ruine, may well be compare with Amalek. Others apply it unto Josua, who also was of Ephraim, and subdued Amalek, Exo 17:13. Oth. whose root is by Amalek; that is, Juda and Simeon, whose beginning extended it self from mount Ephraim unto Amalek, as appeareth, comparing above chap.1.16. with 1 Sam.15.6.] after thee was Benjamin among thy people: [that is, the tribe of Benjamin followed also after thee, O Lord, among the rest of thy people. Some apply it unto Ephraim, whom Benjamin should have followed] out of Machir [that is, the tribe of Manasseh, whose first-born son was Machir, jos.17.1.] marched down the Law-givers, [that is, the Eldest, and Judges of the people] and out of Zebulon, drawing by the staff of the writer. [viz. the people to them: see above chap.4. on v.6. oth. who drew with the staff, or pen of the writer; that is, used the writing pen, or, by means of letters or missives, drew the people together, or caused them to assemble together. Compare above, chap.4. on ver.6.]"}],"15":[{"catchword":null,"tekst":"The Princes [Oth. my Princes.] in Issachar, so was Barak, he was sent into the valley on his feet: [see above chap 4. 10,14.] in the divisions of Reuben dwelling on the other side of Jordan, keeping himself as it were separated from his brethren] the imaginations of hearts were great. [or, impressions, purposes, conclusions; that is, they were very show, dull, drowsie, having (as we say) great wisdom in the brain, and pretending many difficulties, which withheld and hindred them from coming to help their brethren, keeping themselves as neuters between both, having more regard to their own particular, then to the common interest. Oth. For, or, by reason of Ruebens separations, there be great thoughts of heart; that is, this causeth great jealousies and woundings: so in the following verse. Some conceive, that there is extolled the great valour and courage which they had formerly manifested in marching over the Jardon in the behalf their brethren, wherewith this remisness and backwardness of their now shewed, did not well agree]"}],"16":[{"catchword":null,"tekst":"Why remainedst thou [viz. O Rueben] sitting between the stalls [or two rowed folds, or, sheep-cotes. The Hebrew word seemeth to relate to this, that the stalls or sheep-cotes were formerly made in two rows, one opposite to the other, (as it is now also usually practiced) between which, a man might sitly pass, and give to each heir due food or nourishment. Oth. between two burthens, like an Ass that loaden on both sides, layeth himself down to take rest. Compare Gen.49. 14.] to hear the bleatings [or whistings, pipings, hissings] of the flocks? [this tribe, to wit, the tribe of Reuben was exceeding rich, and abounding in cattel. See Num.32,1,&c.] the divisions of Reuben had great searchings of heart. [See on // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +

    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
