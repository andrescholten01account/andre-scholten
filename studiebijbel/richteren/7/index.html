f": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Toen stond Jerubbaäl (dat is Gideon) vroeg op, en al het volk dat met hem was; en zij legerden zich bij de bron van Harod; het leger van de Midianieten lag ten noorden van hen, achter de heuvel More, in het dal.", "2": "En de HEERE zei tegen Gideon: Van het volk dat met u is, zijn er te veel, dan dat Ik de Midianieten in hun hand zou geven; anders zou Israël zich tegen Mij beroemen, en zeggen: Mijn eigen hand heeft mij verlost.", "3": "Nu dan, roep nu voor de oren van het volk, en zeg: Wie bang en angstig is, die keert terug en spoedt zich weg van het gebergte van Gilead! Toen keerden er van het volk tweeëntwintigduizend terug, zodat er tienduizend overbleven.", "4": "En de HEERE zei tegen Gideon: Nog is er van het volk te veel; laat hen afgaan naar het water, en Ik zal ze daar voor u beproeven; en het zal gebeuren: van wie Ik tegen u zal zeggen: Deze zal met u meegaan, die zal met u meegaan; maar ieder van wie Ik tegen u zal zeggen: Deze zal niet met u meegaan, die zal niet meegaan.", "5": "En hij liet het volk afgaan naar het water. Toen zei de HEERE tegen Gideon: Ieder die met zijn tong uit het water zal lekken, zoals een hond zou lekken, hem zult u apart zetten; evenzo ieder die op zijn knieën zal bukken om te drinken.", "6": "Toen was het aantal van hen die met hun hand naar hun mond gelekt hadden, driehonderd man; maar alle overigen van het volk hadden op hun knieën gebukt om water te drinken.", "7": "En de HEERE zei tegen Gideon: Door deze driehonderd mannen die gelekt hebben, zal Ik u verlossen, en de Midianieten in uw hand geven; laat daarom al het andere volk weggaan, ieder naar zijn eigen plaats.", "8": "En het volk nam de teerkost in hun hand, en hun bazuinen; en hij liet alle andere mannen van Israël gaan, ieder naar zijn tent, maar die driehonderd man hield hij bij zich. En het leger van de Midianieten lag beneden hem in het dal.", "9": "En het gebeurde in die nacht, dat de HEERE tegen hem zei: Sta op, ga naar beneden naar het leger, want Ik heb het in uw hand gegeven.", "10": "Maar als u ervoor terugschrikt naar beneden te gaan, ga dan af, u en Pura, uw knecht, naar het leger.", "11": "En u zult horen wat zij zullen zeggen, en daarna zullen uw handen gesterkt worden, zodat u naar het leger zult aftrekken. Toen ging hij af, met Pura, zijn knecht, tot aan het uiterste van de gewapende mannen die in het leger waren.", "12": "En de Midianieten, en Amalekieten, en al de mensen van het oosten, lagen in het dal, als een menigte sprinkhanen, en hun kamelen waren niet te tellen, als het zand dat aan de oever van de zee ligt, in menigte.", "13": "Toen Gideon nu aankwam, zie, daar was een man die aan zijn metgezel een droom vertelde, en zei: Zie, ik heb een droom gehad, en zie, een geroosterd gerstebrood tuimelde het leger van de Midianieten in, en het kwam tot aan de tent, en sloeg ertegen, zodat zij viel, en keerde haar ondersteboven, zodat de tent daar plat lag.", "14": "En zijn metgezel antwoordde en zei: Dit is niets anders dan het zwaard van Gideon, de zoon van Joas, de Israëlitische man; God heeft de Midianieten en dit hele leger in zijn hand gegeven.", "15": "En het gebeurde, toen Gideon het vertellen van deze droom, en de uitleg ervan, hoorde, dat hij aanbad; en hij keerde terug naar het leger van Israël, en zei: Maak u op, want de HEERE heeft het leger van de Midianieten in uw hand gegeven.", "16": "En hij deelde de driehonderd man in drie groepen; en hij gaf ieder een bazuin in zijn hand, en lege kruiken, en fakkels in het midden van de kruiken.", "17": "En hij zei tegen hen: Kijk naar mij en doe hetzelfde; en zie, wanneer ik aan het uiterste van het leger kom, zal het zo zijn: zoals ik zal doen, zo zult u doen.", "18": "Als ik met de bazuin blaas, ik en allen die met mij zijn, dan zult ook u met de bazuin blazen, rondom het hele leger, en u zult zeggen: Voor de HEERE en voor Gideon!", "19": "Zo kwam Gideon, en honderd mannen die met hem waren, aan het uiterste van het leger, aan het begin van de middelste nachtwaak, net toen zij de wachters gesteld hadden; en zij bliezen op de bazuinen, en sloegen de kruiken die in hun hand waren stuk.", "20": "Zo bliezen de drie groepen op de bazuinen, en braken de kruiken; en zij hielden met de linkerhand de fakkels vast, en met hun rechterhand de bazuinen om te blazen; en zij riepen: Het zwaard van de HEERE, en van Gideon!", "21": "En zij bleven staan, ieder op zijn plaats, rondom het leger. Toen liep het hele leger uiteen, en zij schreeuwden en vluchtten.", "22": "Toen de driehonderd op de bazuinen bliezen, richtte de HEERE het zwaard van de een tegen de ander, door het hele leger heen; en het leger vluchtte tot Beth-sitta toe, naar Tseredath, tot aan de grens van Abel-mehola, boven Tabbath.", "23": "Toen werden de mannen van Israël bijeengeroepen, uit Nafthali, en uit Aser, en uit heel Manasse; en zij achtervolgden de Midianieten.", "24": "Ook zond Gideon boden naar heel het gebergte van Efraïm, en zei: Kom naar beneden, de Midianieten tegemoet, en neem hun de wateren af, tot aan Beth-bara, namelijk de Jordaan; zo werd elke man van Efraïm bijeengeroepen, en zij namen hun de wateren af tot aan Beth-bara, en de Jordaan.", "25": "En zij vingen twee vorsten van de Midianieten, Oreb en Zeëb, en doodden Oreb op de rots Oreb, en Zeëb doodden zij bij de perskuip van Zeëb, en achtervolgden de Midianieten; en zij brachten de hoofden van Oreb en Zeëb naar Gideon, aan de overkant van de Jordaan."}, "SV": {"1": "Toen stond Jerubbaäl ( dewelke is Gideon) vroeg op, en al het volk, dat met hem was; en zij legerden zich aan de fontein van Harod; dat hij het heirleger der Midianieten had tegen het noorden, achter den heuvel More, in het dal.", "2": "En de HEERE zeide tot Gideon: Des volks is te veel, dat met u is, dan dat Ik de Midianieten in hun hand zou geven; opdat zich Israël niet tegen Mij beroeme, zeggende: Mijn hand heeft mij verlost.", "3": "Nu dan, roep nu uit voor de oren des volks, zeggende: Wie blode en versaagd is, die kere weder, en spoede zich naar het gebergte van Gilead! Toen keerden uit het volk weder twee en twintig duizend, dat er tien duizend overbleven.", "4": "En de HEERE zeide tot Gideon: Nog is des volks te veel; doe hen afgaan naar het water, en Ik zal ze u aldaar beproeven; en het zal geschieden, van welken Ik tot u zeggen zal: Deze zal met u trekken, die zal met u trekken; maar al degene, van welken Ik tot u zeggen zal: Deze zal niet met u trekken, die zal niet trekken.", "5": "En hij deed het volk afgaan naar het water. Toen zeide de HEERE tot Gideon: Al wie met zijn tong uit het water zal lekken, gelijk als een hond zou lekken, dien zult gij alleen stellen; desgelijks al wie op zijn knieën zal bukken om te drinken.", "6": "Toen was het getal dergenen, die met hun hand tot hun mond gelekt hadden, driehonderd man; maar alle overigen des volks hadden op hun knieën gebukt, om water te drinken.", "7": "En de HEERE zeide tot Gideon: Door deze driehonderd mannen, die gelekt hebben, zal Ik ulieden verlossen, en de Midianieten in uw hand geven; daarom laat al dat volk weggaan, een ieder naar zijn plaats.", "8": "En het volk nam den teerkost in hun hand, en hun bazuinen; en hij liet al die mannen van Israël gaan, een iegelijk naar zijn tent; maar die driehonderd man behield hij. En hij had het heirleger der Midianieten beneden in het dal.", "9": "En het geschiedde in denzelven nacht, dat de HEERE tot hem zeide: Sta op, ga henen af in het leger, want Ik heb het in uw hand gegeven.", "10": "Vreest gij dan nog af te gaan, zo ga af, gij, en Pura, uw jongen, naar het leger.", "11": "En gij zult horen, wat zij zullen spreken, en daarna zullen uw handen gesterkt worden, dat gij aftrekken zult in het leger. Toen ging hij af, met Pura, zijn jongen, tot het uiterste der schildwachten, die in het leger waren.", "12": "En de Midianieten, en Amalekieten, en al de kinderen van het oosten, lagen in het dal, gelijk sprinkhanen in menigte, en hun kemelen waren ontelbaar, gelijk het zand, dat aan den oever der zee is, in menigte.", "13": "Toen nu Gideon aankwam, ziet, zo was er een man, die zijn metgezel een droom vertelde, en zeide: Zie, ik heb een droom gedroomd, en zie, een geroost gerstebrood wentelde zich in het leger der Midianieten, en het kwam tot aan de tent, en sloeg haar, dat zij viel, en keerde haar om, het onderste boven, dat de tent er lag.", "14": "En zijn metgezel antwoordde, en zeide: Dit is niet anders, dan het zwaard van Gideon, den zoon van Joas, den Israëlietischen man; God heeft de Midianieten en dit ganse leger in zijn hand gegeven.", "15": "En het geschiedde, als Gideon de vertelling dezes drooms, en zijn uitlegging hoorde, zo aanbad hij; en hij keerde weder tot het leger van Israël, en zeide: Maakt u op, want de HEERE heeft het leger der Midianieten in ulieder hand gegeven.", "16": "En hij deelde de driehonderd man in drie hopen; en hij gaf een iegelijk een bazuin in zijn hand, en ledige kruiken, en fakkelen in het midden der kruiken.", "17": "En hij zeide tot hen: Ziet naar mij en doet alzo; en ziet, als ik zal komen aan het uiterste des legers, zo zal het geschieden, gelijk als ik zal doen, alzo zult gij doen.", "18": "Als ik met de bazuin zal blazen, ik en allen, die met mij zijn, dan zult gijlieden ook met de bazuin blazen, rondom het ganse leger, en gij zult zeggen: Voor den HEERE en voor Gideon!", "19": "Alzo kwam Gideon, en honderd mannen, die met hem waren, in het uiterste des legers, in het begin van de middelste nachtwaak, als zij maar even de wachters gesteld hadden; en zij bliezen met de bazuinen, ook sloegen zij de kruiken, die in hun hand waren, in stukken.", "20": "Alzo bliezen de drie hopen met de bazuinen, en braken de kruiken; en zij hielden met de linkerhand de fakkelen, en met hun rechterhand de bazuinen om te blazen; en zij riepen: Het zwaard van den HEERE, en van Gideon!", "21": "En zij stonden, een iegelijk in zijn plaats, rondom het leger. Toen verliep het ganse leger, en zij schreeuwden en vloden .", "22": "Als de driehonderd met de bazuinen bliezen, zo zette de HEERE het zwaard des een tegen den anderen, en *dat* in het ganse leger; en het leger vluchtte tot Beth-sitta toe naar Tseredath, tot aan de grens van Abel-mehola, boven Tabbath.", "23": "Toen werden de mannen van Israël bijeengeroepen, uit Nafthali, en uit Aser, en uit gans Manasse; en zij jaagden de Midianieten achterna.", "24": "Ook zond Gideon boden in het ganse gebergte van Efraïm, zeggende: Komt af den Midianieten tegemoet, en beneemt hunlieden de wateren, tot aan Beth-bara, te weten de Jordaan; alzo werd alle man van Efraïm bijeengeroepen, en zij benamen *hun* de wateren tot aan Beth-bara, en de Jordaan.", "25": "En zij vingen twee vorsten der Midianieten, Oreb en Zeëb, en doodden Oreb op den rotssteen Oreb, en Zeëb doodden zij in de perskuip van Zeëb, en vervolgden de Midianieten; en zij brachten de hoofden van Oreb en Zeëb tot Gideon, over de Jordaan."}, "KJV": {"1": "Then Jerubbaal, who *is* Gideon, and all the people that *were* with him, rose up early, and pitched beside the well of Harod: so that the host of the Midianites were on the north side of them, by the hill of Moreh, in the valley.", "2": "And the LORD said unto Gideon, The people that *are* with thee *are* too many for me to give the Midianites into their hands, lest Israel vaunt themselves against me, saying, Mine own hand hath saved", "3": "Now therefore go to, proclaim in the ears of the people, saying, Whosoever *is* fearful and afraid, let him return and depart early from mount Gilead. And there returned of the people twenty and two thousand; and there remained ten thousand.", "4": "And the LORD said unto Gideon, The people *are* yet *too* many; bring them down unto the water, and I will try them for thee there: and it shall be, *that* of whom I say unto thee, This shall go with thee, the same shall go with thee; and of whomsoever I say unto thee, This shall not go with thee, the same shall not go.", "5": "So he brought down the people unto the water: and the LORD said unto Gideon, Every one that lappeth of the water with his tongue, as a dog lappeth, him shalt thou set by himself; likewise every one that boweth down upon his knees to drink.", "6": "And the number of them that lapped, *putting* their hand to their mouth, were three hundred men: but all the rest of the people bowed down upon their knees to drink water.", "7": "And the LORD said unto Gideon, By the three hundred men that lapped will I save you, and deliver the Midianites into thine hand: and let all the *other* people go every man unto his place.", "8": "So the people took victuals in their hand, and their trumpets: and he sent all *the rest of* Israel every man unto his tent, and retained those three hundred men: and the host of Midian was beneath him in the valley.", "9": "And it came to pass the same night, that the LORD said unto him, Arise, get thee down unto the host; for I have delivered it into thine hand.", "10": "But if thou fear to go down, go thou with Phurah thy servant down to the host:", "11": "And thou shalt hear what they say; and afterward shall thine hands be strengthened to go down unto the host. Then went he down with Phurah his servant unto the outside of the armed men that *were* in the host.", "12": "And the Midianites and the Amalekites and all the children of the east lay along in the valley like grasshoppers for multitude; and their camels *were* without number, as the sand by the sea side for multitude.", "13": "And when Gideon was come, behold, *there was* a man that told a dream unto his fellow, and said, Behold, I dreamed a dream, and, lo, a cake of barley bread tumbled into the host of Midian, and came unto a tent, and smote it that it fell, and overturned it, that the tent lay along.", "14": "And his fellow answered and said, This *is* nothing else save the sword of Gideon the son of Joash, a man of Israel: *for* into his hand hath God delivered Midian, and all the host.", "15": "And it was *so*, when Gideon heard the telling of the dream, and the interpretation thereof, that he worshipped, and returned into the host of Israel, and said, Arise; for the LORD hath delivered into your hand the host of Midian.", "16": "And he divided the three hundred men *into* three companies, and he put a trumpet in every man's hand, with empty pitchers, and lamps within the pitchers.", "17": "And he said unto them, Look on me, and do likewise: and, behold, when I come to the outside of the camp, it shall be *that*, as I do, so shall ye do.", "18": "When I blow with a trumpet, I and all that *are* with me, then blow ye the trumpets also on every side of all the camp, and say, *The sword* of the LORD, and of Gideon.", "19": "So Gideon, and the hundred men that *were* with him, came unto the outside of the camp in the beginning of the middle watch; and they had but newly set the watch: and they blew the trumpets, and brake the pitchers that *were* in their hands.", "20": "And the three companies blew the trumpets, and brake the pitchers, and held the lamps in their left hands, and the trumpets in their right hands to blow *withal*: and they cried, The sword of the LORD, and of Gideon.", "21": "And they stood every man in his place round about the camp: and all the host ran, and cried, and fled.", "22": "And the three hundred blew the trumpets, and the LORD set every man's sword against his fellow, even throughout all the host: and the host fled to Bethshittah in Zererath, *and* to the border of Abelmeholah, unto Tabbath.", "23": "And the men of Israel gathered themselves together out of Naphtali, and out of Asher, and out of all Manasseh, and pursued after the Midianites.", "24": "And Gideon sent messengers throughout all mount Ephraim, saying, Come down against the Midianites, and take before them the waters unto Bethbarah and Jordan. Then all the men of Ephraim gathered themselves together, and took the waters unto Bethbarah and Jordan.", "25": "And they took two princes of the Midianites, Oreb and Zeeb; and they slew Oreb upon the rock Oreb, and Zeeb they slew at the winepress of Zeeb, and pursued Midian, and brought the heads of Oreb and Zeeb to Gideon on the other side Jordan."}}, "tsk": {"1": [{"kopje": "Jerubbaäl", "refs": ["Richt 6:32"]}, {"kopje": "stond...vroeg op",
