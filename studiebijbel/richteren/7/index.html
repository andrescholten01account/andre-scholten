 "href": "../../richteren/8/#v12", "ref": "Richt 8:12", "svLabel": null}, {"disp": "Richt 8:21", "href": "../../richteren/8/#v21", "ref": "Richt 8:21", "svLabel": null}], "kinderen": []}]}, {"topic": "Rocks", "href": "../../torrey/r/#t-rocks", "kinderen": [{"label": "Mentioned In Scripture", "href": "../../torrey/r/?hl=Judg.7.25#i18054", "refs": [], "kinderen": [{"label": "Oreb", "href": "../../torrey/r/?hl=Judg.7.25#i18061", "refs": [{"disp": "Richt 7:25", "href": "../../richteren/7/#v25", "ref": "Richt 7:25", "svLabel": null}, {"disp": "Jes 10:26", "href": "../../jesaja/10/#v26", "ref": "Jes 10:26", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Pred 9:10": "Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.", "Fil 4:13": "Ik kan alle dingen door Christus, Die mij kracht geeft.", "Deut 31:23": "En Hij gebood Jozua, de zoon van Nun, en zei: Wees sterk en heb goede moed, want u zult de kinderen van Israël brengen in het land, dat Ik hun gezworen heb; en Ik zal met u zijn.", "Num 23:5": "Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Spr 29:25": "De angst voor mensen legt een strik; maar wie op de HEERE vertrouwt, zal veilig gesteld worden.", "Gen 41:11": "En in één nacht droomden wij een droom, ik en hij; wij droomden ieder naar de uitleg van zijn droom.", "Gen 24:26": "Toen boog die man zijn hoofd, en aanbad de HEERE;", "Joh 20:31": "maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "1 Sam 14:16-20": "Toen de wachters van Saul te Gibea van Benjamin zagen dat, zie, de menigte wegsmolt en heen en weer liep en elkaar neersloeg, zei Saul tegen het volk dat bij hem was: Tel toch, en zie wie van ons weggegaan zijn. En zij telden, en zie, Jonathan en zijn wapendrager waren daar niet. Toen zei Saul tegen Ahia: Breng de ark van God hierheen. Want de ark van God was op die dag bij de kinderen van Israël.", "Job 15:24": "Angst en benauwdheid verschrikken hem; zij overweldigt hem, als een koning die bereid is ten strijde.", "Deut 21:10": "Wanneer u uittrekt ten strijde tegen uw vijanden, en de HEERE, uw God, hen in uw hand gegeven heeft, zodat u hun gevangenen gevankelijk wegvoert;", "1 Sam 16:7": "Doch de HEERE zei tegen Samuël: Kijk niet naar zijn gestalte, en ook niet naar zijn lange lengte, want Ik heb hem verworpen; want het is niet zoals de mens ziet; want de mens kijkt naar wat voor ogen is, maar de HEERE kijkt naar het hart.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Openb 17:14": "Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "2 Kron 20:22": "Toen zij nu begonnen met vreugdegeroep en lofzang, stelde de HEERE hinderlagen tegen de kinderen van Ammon, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden verslagen.", "Richt 7:7-23": "En de HEERE zei tegen Gideon: Door deze driehonderd mannen die gelekt hebben, zal Ik u verlossen, en de Midianieten in uw hand geven; laat daarom al het andere volk weggaan, ieder naar zijn eigen plaats. En het volk nam de teerkost in hun hand, en hun bazuinen; en hij liet alle andere mannen van Israël gaan, ieder naar zijn tent, maar die driehonderd man hield hij bij zich. En het leger van de Midianieten lag beneden hem in het dal. En het gebeurde in die nacht, dat de HEERE tegen hem zei: Sta op, ga naar beneden naar het leger, want Ik heb het in uw hand gegeven.", "Hand 8:6": "En de menigten hielden zich eensgezind aan wat door Filippus gezegd werd, omdat zij hoorden en zagen de tekenen die hij deed.", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "Deut 20:13": "En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard;", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Jes 41:15": "Zie, Ik heb u gemaakt tot een scherpe nieuwe dorsslede, die scherpe punten heeft; u zult bergen dorsen en verpulveren, en heuvels zult u maken als kaf.", "1 Sam 17:19": "Saul nu, en zij, en alle mannen van Israël waren bij het eikendal met de Filistijnen aan het strijden.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Jes 15:1": "De last die op Moab rust. Zeker, in de nacht is Ar-Moab verwoest, zij is uitgeroeid; zeker, in de nacht is Kir-Moab verwoest, zij is uitgeroeid!", "Dan 4:30": "Sprak de koning, en zei: Is dit niet het grote Babel, dat ik gebouwd heb tot een huis van het koninkrijk, door de sterkte van mijn macht, en tot eer van mijn heerlijkheid!", "Deut 20:4": "Want het is de HEERE, uw God, Die met u meegaat, om voor u te strijden tegen uw vijanden, om u te verlossen.", "2 Kron 20:19": "En de Levieten uit de kinderen van de Kahathieten en uit de kinderen van de Korachieten stonden op om de HEERE, de God van Israël, met luide stem uitbundig te prijzen.", "Joz 7:4": "Zo trokken van het volk ongeveer drieduizend man daarheen op; en zij vluchtten voor de mannen van Ai.", "2 Sam 17:24": "David nu kwam te Mahanaïm, en Absalom trok de Jordaan over, hij en alle mannen van Israël met hem.", "Gen 22:1": "Het gebeurde na deze dingen dat God Abraham beproefde; en Hij zei tegen hem: Abraham! En hij zei: Zie, hier ben ik!", "2 Kon 7:6": "Want de Heere had het leger van de Syriërs een geluid van wagens laten horen, en een geluid van paarden, het geluid van een groot leger; zodat zij tegen elkaar zeiden: Zie, de koning van Israël heeft tegen ons de koningen van de Hethieten en de koningen van de Egyptenaren gehuurd, om tegen ons op te trekken.", "Richt 6:29": "Toen zeiden zij, de een tegen de ander: Wie heeft dit gedaan? En toen zij onderzochten en navraagden, zei men: Gideon, de zoon van Joas, heeft dit gedaan.", "Richt 7:8-22": "En het volk nam de teerkost in hun hand, en hun bazuinen; en hij liet alle andere mannen van Israël gaan, ieder naar zijn tent, maar die driehonderd man hield hij bij zich. En het leger van de Midianieten lag beneden hem in het dal. En het gebeurde in die nacht, dat de HEERE tegen hem zei: Sta op, ga naar beneden naar het leger, want Ik heb het in uw hand gegeven. Maar als u ervoor terugschrikt naar beneden te gaan, ga dan af, u en Pura, uw knecht, naar het leger.", "Hand 18:9": "En de Heere zei tegen Paulus door een gezicht in de nacht: Wees niet bevreesd, maar spreek en zwijg niet.", "Joz 6:16": "En het gebeurde de zevende maal, toen de priesters op de bazuinen bliezen, dat Jozua tegen het volk sprak: Juicht, want de HEERE heeft u de stad gegeven!", "Richt 1:2": "En de HEERE zei: Juda zal optrekken; zie, Ik heb dat land in zijn hand gegeven.", "1 Sam 17:45-47": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Ps 48:5-8": "Want zie, de koningen waren verzameld; zij waren samen doorgetrokken. Zoals zij het zagen, zo waren zij verwonderd; zij werden verschrikt, zij haastten weg. Beving greep hen daar aan, smart als van een barende vrouw.", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Ps 119:148": "Mijn ogen komen de nachtwaken voor, om Uw rede te betrachten.", "Jes 10:13": "Omdat hij gezegd heeft: Door de kracht van mijn hand heb ik het gedaan, en door mijn wijsheid, want ik ben verstandig; en ik heb de landpalen van de volken weggenomen, en heb hun voorraad geroofd, en heb als een geweldige de inwoners doen neerdalen;", "1 Kon 20:28": "En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben.", "1 Kor 1:29": "Opdat geen vlees zou roemen voor Hem.", "Richt 7:16-23": "En hij deelde de driehonderd man in drie groepen; en hij gaf ieder een bazuin in zijn hand, en lege kruiken, en fakkels in het midden van de kruiken. En hij zei tegen hen: Kijk naar mij en doe hetzelfde; en zie, wanneer ik aan het uiterste van het leger kom, zal het zo zijn: zoals ik zal doen, zo zult u doen. Als ik met de bazuin blaas, ik en allen die met mij zijn, dan zult ook u met de bazuin blazen, rondom het hele leger, en u zult zeggen: Voor de HEERE en voor Gideon!", "Richt 6:16": "En de HEERE zei tegen hem: Omdat Ik met u zal zijn, zult u de Midianieten verslaan alsof het één man was.", "Joh 2:11": "Dit begin van de tekenen heeft Jezus gedaan te Kana in Galilea, en heeft Zijn heerlijkheid geopenbaard; en Zijn discipelen geloofden in Hem.", "1 Sam 14:12": "Verder antwoordden de mannen van de bezetting Jonathan en zijn wapendrager, en zeiden: Klim op naar ons, en wij zullen u iets duidelijk maken. En Jonathan zei tegen zijn wapendrager: Klim achter mij op, want de HEERE heeft hen gegeven in de hand van Israël.", "1 Kor 2:4": "En mijn spreken en mijn prediking bestond niet uit overtuigende woorden van menselijke wijsheid, maar uit het bewijs van de Geest en van kracht,", "Mal 3:2": "Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers.", "Richt 7:19-23": "Zo kwam Gideon, en honderd mannen die met hem waren, aan het uiterste van het leger, aan het begin van de middelste nachtwaak, net toen zij de wachters gesteld hadden; en zij bliezen op de bazuinen, en sloegen de kruiken die in hun hand waren stuk. Zo bliezen de drie groepen op de bazuinen, en braken de kruiken; en zij hielden met de linkerhand de fakkels vast, en met hun rechterhand de bazuinen om te blazen; en zij riepen: Het zwaard van de HEERE, en van Gideon! En zij bleven staan, ieder op zijn plaats, rondom het leger. Toen liep het hele leger uiteen, en zij schreeuwden en vluchtten.", "Num 10:1-10": "Verder sprak de HEERE tot Mozes en zei: Maak u twee zilveren trompetten; van dicht werk zult u ze maken; en zij zullen u zijn tot de heilige samenkomst en tot het optrekken van de legers. Als zij daarmee blazen zullen, dan zal de hele vergadering tot u verzameld worden, aan de deur van de tent der samenkomst.", "Num 2:33": "Maar de Levieten werden niet geteld onder de Israëlieten, zoals de HEERE Mozes geboden had.", "Deut 31:6-8": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten. En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven. De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Richt 6:3-5": "Want het gebeurde, als Israël gezaaid had, dan kwamen de Midianieten op, en de Amalekieten, en zij die uit het oosten kwamen, kwamen ook tegen hen op. En zij legerden zich tegen hen, en vernielden de opbrengst van het land, tot waar u bij Gaza komt; en zij lieten geen middelen van bestaan over in Israël, geen klein vee, geen os, geen ezel. Want zij kwamen op met hun vee en hun tenten; zij kwamen in zo'n grote menigte als de sprinkhanen, zodat men hen en hun kamelen niet tellen kon; en zij kwamen in het land om het te vernielen.", "Luk 14:25-33": "En er gingen grote menigten met Hem mee; en Hij keerde Zich om en zei tegen hen: Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn. En wie zijn kruis niet draagt en Mij navolgt, die kan Mijn discipel niet zijn.", "Ps 66:10": "Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert;", "Jes 35:3": "Versterkt de slappe handen, en maakt de struikelende knieën vast.", "2 Sam 19:31": "Barzillai, de Gileadiet, kwam ook naar beneden uit Rogelim; en hij trok met de koning de Jordaan over, om hem over de Jordaan te begeleiden.", "Jes 2:17": "En de hoogheid van de mensen zal gebogen worden, en de hoogheid van de mannen zal vernederd worden; en de HEERE alleen zal op die dag verheven zijn.", "1 Sam 15:33": "Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.", "1 Sam 17:45": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Job 1:17": "Terwijl deze nog sprak, kwam er een ander en zei: De Chaldeeën stelden drie groepen op, en vielen de kamelen aan, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Deut 8:17": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven.", "Rom 11:18": "Roem dan niet tegen de takken; en als u daartegen roemt, u draagt de wortel niet, maar de wortel u.", "Num 1:47-50": "Maar de Levieten werden naar de stam van hun vaderen niet onder hen geteld. Want de HEERE had tot Mozes gesproken en gezegd: Alleen de stam van Levi zult u niet tellen, en hun aantal niet opnemen onder de zonen van Israël.", "1 Kor 15:52": "in een ondeelbaar ogenblik, in een oogwenk, bij de laatste bazuin; want de bazuin zal klinken, en de doden zullen onvergankelijk opgewekt worden, en wij zullen veranderd worden.", "Num 31:6": "En Mozes zond hen ten strijde, duizend van elke stam, hen en Pinehas, de zoon van Eleazar, de priester, ten strijde, met de heilige voorwerpen en de trompetten om te schallen in zijn hand.", "Neh 4:16-22": "En het gebeurde van die dag af, dat de helft van mijn knechten bezig was met het werk, en de andere helft van hen de speren, de schilden, de bogen en de pantsers vasthield; en de aanvoerders stonden achter het hele huis van Juda. Zij die aan de muur bouwden en zij die de lasten droegen, en zij die inlaadden, waren ieder met de ene hand bezig met het werk, en met de andere hielden zij het wapen vast. En de bouwers hadden ieder zijn zwaard aan zijn heup gegord en bouwden; en hij die op de bazuin blies, was bij mij.", "Jer 19:1-11": "Zo zegt de HEERE: Ga heen en koop een pottenbakkerskruik, en neem tot u van de oudsten van het volk, en van de oudsten van de priesters. En ga uit naar het dal van de zoon van Hinnom, dat voor de deur van de Zonnepoort is, en roep daar de woorden uit, die Ik tot u spreken zal; En zeg: Hoort het woord van de HEERE, koningen van Juda en inwoners van Jeruzalem! Zo zegt de HEERE van de heerscharen, de God van Israël: Ziet, Ik zal een kwaad brengen over deze plaats, waarvan een ieder die het hoort, zijn oren zullen klinken;", "Richt 9:43": "Toen nam hij het volk, en verdeelde hen in drie groepen, en legde een hinderlaag in het veld; en hij zag toe, en zie, het volk trok de stad uit, en hij kwam tegen hen op en sloeg hen.", "Hab 1:16": "Daarom offert hij aan zijn sleepnet, en brandt reukwerk aan zijn net; want daardoor is zijn deel vet geworden, en zijn voedsel smoutig.", "Richt 6:36-40": "En Gideon zei tegen God: Als U Israël door mijn hand zult verlossen, zoals U gesproken hebt, zie, ik zal een wollen vlies op de dorsvloer leggen; als er dauw op het vlies alleen zal zijn, en droogte op de hele aarde, dan zal ik weten dat U Israël door mijn hand zult verlossen, zoals U gesproken hebt. En het gebeurde zo; want hij stond de volgende morgen vroeg op, en kneep het vlies uit, en hij wrong de dauw uit het vlies, een schaal vol water.", "Richt 6:35": "Ook zond hij boden door heel Manasse, en die werden ook achter hem bijeengeroepen; eveneens zond hij boden naar Aser, en naar Zebulon, en naar Naftali; en zij trokken op, hun tegemoet.", "Richt 6:17-22": "En hij zei tegen Hem: Als ik nu genade gevonden heb in Uw ogen, doe mij dan een teken, dat U het bent Die met mij spreekt. Ga toch niet vanhier weg, totdat ik tot U kom, en mijn geschenk uitbreng, en het U voorzet. En Hij zei: Ik zal blijven, totdat u terugkomt. En Gideon ging naar binnen, en maakte een geitenbokje klaar, en ongezuurde koeken van een efa meel; het vlees legde hij in een mand, en het vleesnat deed hij in een pot; en hij bracht het naar Hem toe, onder de eik, en zette het neer.", "Richt 3:10": "En de Geest van de HEERE kwam op hem, en hij richtte Israël, en trok uit ten strijde; en de HEERE gaf Cuschan-Rischataïm, de koning van Syrië, in zijn hand, zodat zijn hand sterk werd over Cuschan-Rischataïm.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "Joz 8:29": "En de koning van Ai hing hij aan een paal, tot de avond; en omtrent het ondergaan van de zon gebood Jozua dat men zijn dode lichaam van de paal zou afnemen; en zij wierpen het bij de ingang van de stadspoort, en richtten daarop een grote steenhoop op, die er is tot op deze dag.", "2 Sam 15:32-34": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd. En David zei tegen hem: Als u met mij meegaat, zult u mij tot een last zijn; maar als u teruggaat naar de stad, en tegen Absalom zegt: Uw knecht, ik zal van de koning zijn; ik ben eerder wel de knecht van uw vader geweest, maar nu zal ik uw knecht zijn; dan zou u voor mij de raad van Achitofel teniet doen.", "Ex 12:31-33": "Toen riep hij Mozes en Aäron in de nacht, en zei: Maakt u op, trekt uit het midden van mijn volk, u en de kinderen van Israël; en gaat heen, dient de HEERE, zoals u gesproken hebt. Neemt ook met u uw schapen en uw runderen, zoals u gesproken hebt, en gaat heen, en zegent mij ook. En de Egyptenaren drongen sterk aan bij het volk, om ze snel uit het land te drijven; want zij zeiden: Wij zijn allen dood!", "Jer 39:6": "En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda.", "2 Kor 10:4-6": "Want de wapens van onze strijd zijn niet vleselijk, maar krachtig door God, tot het neerwerpen van bolwerken; Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus; En gereed hebbend om alle ongehoorzaamheid te wreken, wanneer uw gehoorzaamheid vervuld zal zijn.", "Gen 24:27": "en hij zei: Geloofd zij de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en trouw niet onthouden heeft aan mijn heer; wat mij betreft, de HEERE heeft mij op deze weg geleid, naar het huis van de broers van mijn heer.", "Job 33:15": "In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger;", "Richt 20:29-43": "Toen stelde Israël hinderlagen op tegen Gibea rondom. En de kinderen van Israël trokken op, op de derde dag, tegen de kinderen van Benjamin; en zij schikten de strijd tegen Gibea, zoals de andere keren. Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.", "Richt 3:27": "En het gebeurde, toen hij aankwam, dat hij op de bazuin blies op het gebergte van Efraïm; en de kinderen van Israël trokken met hem af van het gebergte, en hij zelf ging voor hen uit.", "Jes 41:10-16": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid. Zie, zij zullen beschaamd worden en te schande gemaakt, allen die tegen u in woede ontstoken zijn; zij zullen worden als niets, en de mensen die met u twisten, zullen vergaan. U zult hen zoeken, maar zult hen niet vinden, de mensen die met u kijven; zij zullen worden als niets, en de mensen die met u oorlogen, als een nietig ding.", "1 Kor 1:27": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen;", "Richt 8:11": "En Gideon trok op, de weg van hen die in tenten wonen, ten oosten van Nobah en Jogbeha; en hij versloeg dat leger, want het leger voelde zich veilig.", "Richt 6:32": "Daarom noemde hij hem op die dag Jerubbaäl, en zei: Laat Baäl tegen hem strijden, omdat hij zijn altaar heeft omgeworpen.", "Ex 14:31": "Ook zag Israël de grote hand die de HEERE aan de Egyptenaren bewezen had; en het volk vreesde de HEERE, en geloofde in de HEERE, en in Mozes, Zijn dienaar.", "2 Sam 8:2": "Ook sloeg hij de Moabieten, en mat hen met een snoer, en liet hen op de aarde neerliggen; en hij mat met twee snoeren om te doden, en met een vol snoer om in het leven te laten. Zo werden de Moabieten David tot knechten, en zij brachten geschenken.", "2 Sam 5:22-24": "Daarna trokken de Filistijnen weer op; en zij verspreidden zich in het dal Refaïm. En David vroeg de HEERE, Die zei: U zult niet optrekken; maar trek om, tot achter hen, zodat u bij hen komt van tegenover de moerbeibomen; En het zal gebeuren, als u het geluid van een gang hoort in de toppen van de moerbeibomen, dat u zich dan haast; want dan is de HEERE voor uw aangezicht uitgegaan, om het leger van de Filistijnen te verslaan.", "Ex 15:14": "De volken hebben het gehoord, zij zullen sidderen; angst heeft de inwoners van Palestina bevangen.", "Job 4:13": "Onder de gedachten die kwamen bij de visioenen van de nacht, toen een diepe slaap valt op de mensen,", "1 Kon 19:16": "Ook zult u Jehu, de zoon van Nimsi, zalven tot koning over Israël; en Elisa, de zoon van Safat, uit Abel-Mehola, zult u tot profeet zalven in uw plaats.", "Joh 7:31": "En velen uit de menigte geloofden in Hem en zeiden: Zal de Christus, wanneer Hij gekomen zal zijn, meer tekenen doen dan deze, die Deze gedaan heeft?", "Job 1:10": "Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.", "2 Sam 19:15": "Toen keerde de koning terug, en kwam tot aan de Jordaan; en Juda kwam naar Gilgal, om de koning tegemoet te gaan, om de koning over de Jordaan te brengen.", "Joz 10:15-40": "Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal. Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Dan 4:3": "Hoe groot zijn Zijn tekenen! En hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.", "2 Kor 12:10": "Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus' wil; want als ik zwak ben, dan ben ik machtig.", "Richt 3:28": "En hij zei tegen hen: Volg mij na; want de HEERE heeft uw vijanden, de Moabieten, in uw hand gegeven. En zij trokken af, hem na, en namen de doorwaadbare plaatsen van de Jordaan in naar Moab, en lieten niemand oversteken.", "Ef 6:10": "Vervolgens, mijn broeders, word krachtig in de Heere, en in de sterkte van Zijn macht.", "2 Sam 22:18": "Hij verloste mij van mijn sterke vijand, van mijn haters, omdat zij machtiger waren dan ik.", "Ps 76:4": "Daar heeft Hij de vurige pijlen van de boog verbroken, het schild, en het zwaard, en de strijd. Sela.", "Ex 4:30": "En Aäron sprak al de woorden, die de HEERE tot Mozes gesproken had; en hij deed de tekenen voor de ogen van het volk.", "2 Sam 2:29": "Abner dan en zijn mannen gingen diezelfde hele nacht over de vlakte; en zij gingen over de Jordaan en trokken heel Bithron door, en kwamen bij Mahanaim.", "Matt 1:20": "En terwijl hij deze dingen overwoog, zie, de engel van de Heere verscheen hem in een droom en zei: Jozef, zoon van David! Wees niet bevreesd Maria, uw vrouw, tot u te nemen, want wat in haar ontvangen is, dat is uit de Heilige Geest;", "1 Kron 19:17": "Toen dit aan David werd bericht, verzamelde hij heel Israël, en trok over de Jordaan, en kwam tot hen, en stelde de slagorde tegen hen op. Toen David de slagorde tegen de Syriërs opgesteld had, streden zij met hem.", "Richt 7:4-8": "En de HEERE zei tegen Gideon: Nog is er van het volk te veel; laat hen afgaan naar het water, en Ik zal ze daar voor u beproeven; en het zal gebeuren: van wie Ik tegen u zal zeggen: Deze zal met u meegaan, die zal met u meegaan; maar ieder van wie Ik tegen u zal zeggen: Deze zal niet met u meegaan, die zal niet meegaan. En hij liet het volk afgaan naar het water. Toen zei de HEERE tegen Gideon: Ieder die met zijn tong uit het water zal lekken, zoals een hond zou lekken, hem zult u apart zetten; evenzo ieder die op zijn knieën zal bukken om te drinken. Toen was het aantal van hen die met hun hand naar hun mond gelekt hadden, driehonderd man; maar alle overigen van het volk hadden op hun knieën gebukt om water te drinken.", "Joh 6:9": "Hier is een jongen die vijf gerstebroden heeft en twee visjes; maar wat is dat onder zovelen?", "Ezech 23:2": "Mensenkind! Er waren twee vrouwen, dochters van één moeder.", "Richt 8:21": "Toen zeiden Zebah en Tsalmuna: Sta zelf op en val ons aan, want zoals de man is, zo is zijn kracht. Toen stond Gideon op en doodde Zebah en Tsalmuna, en nam de maantjes die aan de halzen van hun kamelen zaten.", "Gen 46:3": "En Hij zei: Ik ben die God, de God van uw vader; wees niet bang om af te trekken naar Egypte; want Ik zal u daar tot een groot volk maken.", "Job 23:10": "Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.", "Richt 8:29-32": "En Jerubbaäl, de zoon van Joas, ging weg en woonde in zijn huis. Gideon nu had zeventig zonen, die uit hem waren voortgekomen; want hij had veel vrouwen. En zijn bijvrouw, die in Sichem woonde, baarde hem ook een zoon; en hij noemde hem Abimelech.", "2 Kor 10:4": "Want de wapens van onze strijd zijn niet vleselijk, maar krachtig door God, tot het neerwerpen van bolwerken;", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "Gen 35:5": "En zij reisden verder; en er kwam een schrik van God over de steden die rondom hen waren, zodat zij de zonen van Jakob niet achterna joegen.", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "Deut 20:5-9": "Dan zullen de opzichters tot het volk spreken en zeggen: Wie is de man die een nieuw huis heeft gebouwd, en het niet heeft ingewijd? Die ga heen en keert terug naar zijn huis, opdat hij niet misschien sterft in de strijd, en iemand anders dat inwijdt. En wie is de man die een wijngaard geplant heeft, en de vrucht ervan nog niet heeft genoten? Die ga heen en keert terug naar zijn huis, opdat hij niet misschien in de strijd sterft en iemand anders die geniet. En wie is de man die een vrouw ondertrouwd heeft, en haar nog niet tot zich heeft genomen? Die ga heen en keert terug naar zijn huis; opdat hij niet misschien in die strijd sterft, en een andere man haar neemt.", "Jer 6:5": "Maakt u op, en laat ons optrekken in de nacht, en haar paleizen verderven!", "Richt 8:13": "Toen Gideon, de zoon van Joas, uit de strijd terugkeerde, vóór zonsopgang,", "Num 31:9-20": "Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit. Verder verbrandden zij al hun steden met hun woonplaatsen, en al hun burchten, met vuur. En zij namen alle buit en alle roof, van mensen en van beesten.", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Richt 6:5": "Want zij kwamen op met hun vee en hun tenten; zij kwamen in zo'n grote menigte als de sprinkhanen, zodat men hen en hun kamelen niet tellen kon; en zij kwamen in het land om het te vernielen.", "2 Kron 20:17": "U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Richt 6:3": "Want het gebeurde, als Israël gezaaid had, dan kwamen de Midianieten op, en de Amalekieten, en zij die uit het oosten kwamen, kwamen ook tegen hen op.", "Deut 20:8": "Daarna zullen de opzichters voortgaan met spreken tot het volk, en zeggen: Wie is de man die vreesachtig en week van hart is? Die ga heen en keert terug naar zijn huis, opdat het hart van zijn broeders niet smelt, zoals zijn hart.", "Richt 4:9": "En zij zei: Ik zal zeker met u meetrekken, maar de eer zal niet voor u zijn op deze weg die u gaat; want de HEERE zal Sisera verkopen in de hand van een vrouw. Zo maakte Debora zich op, en trok met Barak naar Kedes.", "Joz 3:1": "Jozua stond dus 's morgens vroeg op, en zij vertrokken van Sittim en kwamen tot aan de Jordaan, hij en al de kinderen van Israël; en zij overnachtten daar, voordat zij overtrokken.", "1 Sam 13:18": "en een groep sloeg de weg in naar Beth-horon; en een groep sloeg de weg in naar het gebied dat uitziet op het dal Zeboim, naar de woestijn toe.", "Gen 24:14": "laat het zo gebeuren, dat het meisje tegen wie ik zal zeggen: Neig toch uw kruik, zodat ik drink; en zij zal zeggen: Drink, en ik zal ook uw kamelen drenken; laat zíj degene zijn die U aan Uw knecht Izak toegewezen hebt, en laat ik daaraan bekennen dat U weldadigheid aan mijn heer bewezen hebt.", "2 Sam 17:1": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna.", "Dan 4:2": "Het behaagt mij te verkondigen de tekenen en wonderen, die de allerhoogste God aan mij gedaan heeft.", "Jer 13:13": "Maar u zult tegen hen zeggen: Zo zegt de HEERE: Zie, Ik zal alle inwoners van dit land, zelfs de koningen die op de troon van David zitten, en de priesters, en de profeten, en alle inwoners van Jeruzalem, vullen met dronkenschap.", "Matt 20:16": "Zo zullen de laatsten de eersten zijn, en de eersten de laatsten; want velen zijn geroepen, maar weinigen uitverkoren.", "Gen 12:6": "En Abram trok door dat land, tot aan de plaats Sichem, tot aan het eikenbos More; en de Kanaänieten waren toen in dat land.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Matt 25:6": "En te middernacht kwam er een geroep: Zie, de bruidegom komt, ga hem tegemoet!", "Openb 16:15": "Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "2 Sam 17:22": "Toen stond David op, en al het volk dat bij hem was; en zij gingen de Jordaan over. Bij het morgenlicht ontbrak er niet één die niet de Jordaan overgegaan was.", "Num 24:10-13": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend! En nu, pak u weg naar uw plaats! Ik had gezegd dat ik u hoog zou eren; maar zie, de HEERE heeft u die eer onthouden! Toen zei Bileam tegen Balak: Heb ik ook niet tegen uw boden, die u naar mij gezonden hebt, gesproken en gezegd:", "Matt 2:13": "Toen zij vertrokken waren, zie, de engel van de Heere verschijnt aan Jozef in de droom en zegt: Sta op, neem het Kindje en Zijn moeder tot u, en vlucht naar Egypte, en blijf daar totdat ik het u zeg; want Herodes zal het Kindje zoeken om Het te doden.", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "Ex 14:14": "De HEERE zal voor u strijden, en u zult stil zijn.", "Hand 27:23": "Want deze zelfde nacht heeft bij mij gestaan een engel van God, van Wie ik ben en Die ik ook dien,", "Jes 10:26": "Want de HEERE van de heerscharen zal tegen hem een gesel verwekken, gelijk de slachting van Midian was bij de rots van Oreb; en zoals Zijn staf over de zee was, die Hij verheffen zal, naar de wijze van de Egyptenaren.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "1 Sam 14:6-13": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen. Toen zei zijn wapendrager tegen hem: Doe alles wat in uw hart is; ga uw gang, zie, ik ben met u, naar uw hart. Jonathan nu zei: Zie, wij zullen naar die mannen oversteken, en wij zullen ons aan hen laten zien.", "Neh 12:9": "En Bakbukja, en Unni, hun broeders, waren tegenover hen bij de wachten.", "Joz 7:26": "En zij richtten over hem een grote steenhoop op, die er tot op deze dag nog is. Zo keerde de HEERE zich af van de gloed van Zijn toorn. Daarom noemde men de naam van die plaats het dal van Achor, tot op deze dag toe.", "Ex 14:24": "En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "Richt 6:33": "Alle Midianieten nu, en Amalekieten, en de mensen uit het oosten, waren bijeengebracht, en zij trokken over, en legerden zich in het dal van Jizreël.", "Joh 1:28": "Deze dingen zijn gebeurd in Bethabara, aan de overkant van de Jordaan, waar Johannes doopte.", "Gen 24:48": "en ik boog mijn hoofd, en aanbad de HEERE; en ik loofde de HEERE, de God van mijn heer Abraham, Die mij op de juiste weg geleid had, om de dochter van de broer van mijn heer voor zijn zoon te nemen.", "2 Kron 16:8": "Waren de Moren en de Libiërs niet een groot leger, met heel veel wagens en ruiters? Toen u echter op de HEERE steunde, heeft Hij hen in uw hand gegeven.", "Hoogl 6:5": "Wend uw ogen van Mij af, want zij overweldigen Mij; uw haar is als een kudde geiten, die van de berghellingen van Gilead afdalen.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "1 Sam 14:8": "Jonathan nu zei: Zie, wij zullen naar die mannen oversteken, en wij zullen ons aan hen laten zien.", "Joh 2:23": "En toen Hij te Jeruzalem was, op het Pascha, tijdens het feest, geloofden velen in Zijn Naam, omdat zij Zijn tekenen zagen die Hij deed.", "Luk 12:38": "En als hij komt in de tweede nachtwake, of komt in de derde nachtwake, en hen zo aantreft, zalig zijn die dienstknechten.", "Joz 8:3": "Toen maakte Jozua zich klaar, en al het krijgsvolk, om op te trekken naar Ai. En Jozua koos dertigduizend mannen, strijdbare helden, en hij stuurde hen 's nachts erop uit,", "Ex 15:14-16": "De volken hebben het gehoord, zij zullen sidderen; angst heeft de inwoners van Palestina bevangen. Dan zullen de vorsten van Edom verbaasd zijn; beving zal de machtigen van de Moabieten bevangen; alle inwoners van Kanaän zullen wegsmelten! Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Richt 4:14": "Debora dan zei tegen Barak: Maak u op; want dit is de dag waarop de HEERE Sisera in uw hand gegeven heeft; is de HEERE niet voor u uit getrokken? Zo trok Barak van de berg Thabor af, en tienduizend man achter hem.", "1 Sam 23:16": "Toen maakte Jonathan, de zoon van Saul, zich op, en ging naar David in het woud, en hij bemoedigde hem in God.", "1 Sam 17:20": "Toen maakte David zich 's morgens vroeg op, en hij liet de schapen bij de hoeder, en hij nam het op en ging heen, zoals Isaï hem bevolen had; en hij kwam bij de wagenburg, toen het leger in slagorde uittrok en men ten strijde riep.", "1 Sam 30:8": "Toen vroeg David de HEERE: Zal ik deze bende achternajagen? Zal ik ze inhalen? En Hij zei tegen hem: Jaag na, want u zult zeker inhalen, en u zult zeker verlossen.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "Richt 4:21": "Daarna nam Jaël, de vrouw van Heber, een tentpin, en greep een hamer in haar hand, en ging stilletjes naar hem toe, en dreef de pin in zijn slaap, zodat hij in de aarde vastzat; want hij was in diepe slaap en uitgeput, en stierf.", "Klaagl 2:19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "Num 10:9": "En wanneer u in uw land ten strijde zult trekken tegen de vijand die u benauwt, zult u ook met die trompetten alarm maken; zo zal aan u gedacht worden voor het aangezicht van de HEERE, uw God, en u zult van uw vijanden verlost worden.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "Job 39:23": "Zult u het beroeren als een sprinkhaan? De pracht van zijn gesnuif is een verschrikking.", "Ezech 28:2": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God.", "2 Kon 8:12": "Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden.", "Ex 13:18": "Maar God leidde het volk om, langs de weg van de woestijn bij de Schelfzee. De kinderen van Israël trokken nu gewapend op uit Egypteland.", "1 Sam 14:15": "En er kwam beving in het leger, op het veld en onder heel het volk; de bezetting en de plunderaars beefden ook zelf; ja, het land schudde, want het was een beving van God.", "Matt 14:25": "Maar in de vierde nachtwake kwam Jezus naar hen toe, lopend op de zee.", "Gen 22:3": "Toen stond Abraham 's morgens vroeg op, en zadelde zijn ezel, en nam twee van zijn knechten met zich, en Izak zijn zoon; en hij kloofde hout voor het brandoffer, en maakte zich op, en ging naar de plaats die God hem gezegd had.", "Jes 35:4": "Zegt tegen de onbedachtzamen van hart: Wees sterk, en vrees niet; zie, uw God zal ter wrake komen met de vergelding van God. Hij zal komen en u verlossen.", "Gen 32:7": "Toen werd Jakob erg bang en benauwd; en hij verdeelde het volk dat bij hem was, en de schapen, en de runderen, en de kamelen, in twee legers;", "Richt 8:3": "God heeft de vorsten van de Midianieten, Oreb en Zeëb, in uw hand gegeven; wat heb ik dan kunnen doen, vergeleken bij u? Toen liet hun toorn van hem af, toen hij dit woord sprak.", "Lev 23:24": "Spreek tot de kinderen van Israël, en zeg: In de zevende maand, op de eerste van de maand, zult u een rust hebben, een gedachtenis van het geschal, een heilige samenkomst.", "Ps 3:2": "O HEERE, hoe zijn mijn tegenstanders talrijk geworden; velen staan tegen mij op.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Deut 32:27": "Ware het niet, dat Ik de toorn van de vijand vreesde, dat hun tegenpartijen zich niet vreemd zouden houden; dat zij niet zouden zeggen: Onze hand is hoog geweest; de HEERE heeft dit alles niet gedaan.", "Joz 2:24": "En zij zeiden tegen Jozua: Zeker, de HEERE heeft dat hele land in onze handen gegeven; want ook alle inwoners van het land zijn voor ons vergaan van angst.", "Jes 30:15": "Want zo zegt de Heere HEERE, de Heilige van Israël: Door terugkering en rust zou u behouden worden, in stilte en in vertrouwen zou uw sterkte zijn; maar u hebt niet gewild.", "Rom 15:19": "door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Ex 17:9": "Mozes zei toen tegen Jozua: Kies mannen voor ons uit, en trek eropuit, strijd tegen Amalek; morgen zal ik op de top van de heuvel staan, met de staf van God in mijn hand.", "Joz 8:3-25": "Toen maakte Jozua zich klaar, en al het krijgsvolk, om op te trekken naar Ai. En Jozua koos dertigduizend mannen, strijdbare helden, en hij stuurde hen 's nachts erop uit, en gebood hun: Let op, u zult de stad in een hinderlaag lokken van achter de stad; houd u niet al te ver van de stad, en wees allen gereed. Ik nu, en al het volk dat bij mij is, zullen de stad naderen; en het zal gebeuren, wanneer zij ons tegemoet uittrekken zoals eerst, dat wij voor hen zullen vluchten.", "Joz 1:5-7": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten. Wees sterk en heb goede moed! Want u zult dit volk dat land als erfelijk bezit doen verkrijgen, dat Ik hun vaderen gezworen heb hun te geven. Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Ps 18:35": "Hij leert mijn handen ten strijde, zodat een stalen boog met mijn armen verbroken is.", "Jer 46:15": "Waarom zijn uw sterken weggeveegd? Zij stonden niet, omdat de HEERE hen voortdreef.", "Job 18:11": "De verschrikkingen zullen hem van alle kanten schrik aanjagen, en hem opjagen, hem op de voet volgend.", "Ex 10:7": "En de knechten van Farao zeiden tegen hem: Hoe lang zal deze man ons tot een valstrik zijn? Laat de mannen gaan, dat zij de HEERE, hun God, dienen! Weet u nog niet dat Egypte verloren is?", "1 Sam 17:47": "En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Deut 32:30": "Hoe zou één duizend achtervolgen, en twee tienduizend doen vluchten, als niet hun Rotssteen hen verkocht had, en de HEERE hen overgeleverd had?", "1 Sam 17:52": "Toen maakten de mannen van Israël en Juda zich op, en juichten, en achtervolgden de Filistijnen tot waar men bij de vallei komt, en tot aan de poorten van Ekron; en de gewonden van de Filistijnen vielen op de weg naar Saäraïm, en tot aan Gath, en tot aan Ekron.", "Ef 2:9": "niet uit de werken, opdat niemand roemt.", "Jes 19:2": "Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, zodat zij zullen strijden, ieder tegen zijn broeder, en ieder tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Ps 83:12": "Maak hen en hun vorsten als Oreb en als Zeëb, en al hun leiders als Zebah en als Zalmuna;", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Richt 6:11": "Toen kwam een Engel van de HEERE, en ging zitten onder de eik die in Ofra is, die aan Joas, de Abiëzriet, toebehoorde; en zijn zoon Gideon dorste tarwe bij de wijnpers, om die te verbergen voor de Midianieten.", "Richt 10:9": "Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "Gal 6:12": "Allen die een goed gezicht willen tonen naar het vlees, die dwingen u besneden te worden, alleen maar opdat zij vanwege het kruis van Christus niet vervolgd zouden worden.", "2 Sam 17:1-15": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "Gen 32:8": "want hij zei: Als Ezau op het ene leger afkomt en het verslaat, dan zal het overgebleven leger ontkomen.", "1 Sam 17:33": "Maar Saul zei tegen David: U zult niet kunnen gaan om tegen deze Filistijn te strijden; want u bent een jongeman, en hij is een krijgsman van jongs af aan.", "Ex 10:16": "Toen haastte Farao zich om Mozes en Aäron te roepen, en zei: Ik heb gezondigd tegen de HEERE, uw God, en tegen u.", "Gen 14:15": "En hij verdeelde zich tegen hen 's nachts, hij en zijn knechten, en versloeg hen; en hij achtervolgde hen tot Hoba toe, dat ten noorden van Damaskus ligt.", "Jer 46:23": "Zij hebben haar woud afgehouwen, spreekt de HEERE, hoewel het niet te onderzoeken is; want zij zijn meer dan de sprinkhanen, zodat men hen niet tellen kan.", "Hand 18:10": "Want Ik ben met u, en niemand zal de hand aan u leggen om u kwaad te doen; want Ik heb veel volk in deze stad.", "Jes 2:11": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn.", "Hand 9:32-42": "En het gebeurde, toen Petrus overal rondtrok, dat hij ook afkwam bij de heiligen die in Lydda woonden. En daar vond hij een zekere man, met de naam Eneas, die al acht jaar bedlegerig was, omdat hij verlamd was. En Petrus zei tegen hem: Eneas! Jezus Christus maakt u gezond; sta op en maak uzelf uw bed op. En hij stond meteen op.", "Ex 10:17": "En nu, vergeef mij toch mijn zonde alleen deze keer, en bid vurig tot de HEERE, uw God, dat Hij alleen deze dood van mij wegneemt.", "Joz 22:10-34": "Toen zij aankwamen bij de grenzen van de Jordaan, die in het land Kanaän zijn, bouwden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse daar een altaar bij de Jordaan, een altaar groot van aanzien. En de kinderen van Israël hoorden zeggen: Zie, de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse hebben een altaar gebouwd, tegenover het land Kanaän, aan de grenzen van de Jordaan, aan de zijde van de kinderen van Israël. Toen de kinderen van Israël dit hoorden, verzamelde de hele vergadering van de kinderen van Israël zich te Silo, om tegen hen op te trekken met een leger.", "Jes 30:7": "Want Egypte zal nutteloos en tevergeefs helpen; daarom heb Ik hierover geroepen: Stilzitten zal hun sterkte zijn.", "1 Kor 2:5": "Opdat uw geloof niet zou berusten op wijsheid van mensen, maar op de kracht van God.", "Ps 118:10-12": "Alle heidenen hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb. Zij hadden mij omringd, ja, zij hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb. Zij hadden mij omringd als bijen; zij zijn uitgeblust als een doornenvuur; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "Richt 8:12": "En Zebah en Tsalmuna vluchtten; maar hij achtervolgde hen, en ving de beide koningen van de Midianieten, Zebah en Tsalmuna, en bracht het hele leger in verwarring.", "Lev 26:36": "En wat betreft de overgeblevenen onder u, Ik zal in hun hart een angstige zwakheid laten komen in de landen van hun vijanden; zodat het geruis van een opgejaagd blad hen zal opjagen, en zij zullen vluchten, zoals men vlucht voor een zwaard, en zullen vallen, terwijl niemand hen opjaagt.", "Joh 11:43-45": "En toen Hij dit gezegd had, riep Hij met luide stem: Lazarus, kom naar buiten! En de gestorvene kwam naar buiten, gebonden aan handen en voeten met grafdoeken, en zijn gezicht was omwonden met een zweetdoek. Jezus zei tegen hen: Maak hem los, en laat hem gaan. Velen dan van de Joden, die naar Maria gekomen waren, en gezien hadden wat Jezus gedaan had, geloofden in Hem.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Lev 25:9": "Daarna zult u in de zevende maand, op de tiende van de maand, de bazuin van het geschal laten doorgaan; op de verzoendag zult u de bazuin laten doorgaan in uw hele land.", "Num 31:5": "Zo werden geleverd uit de duizenden van Israël, duizend van elke stam, twaalfduizend toegeruste strijders.", "2 Kor 4:7": "Maar wij hebben deze schat in aarden vaten, opdat de uitnemendheid van de kracht van God zou zijn, en niet uit ons;", "Richt 6:31": "Maar Joas zei tegen allen die bij hem stonden: Wilt u voor Baäl strijden? Wilt u hem redden? Wie voor hem strijdt, zal nog deze morgen gedood worden! Als hij een god is, laat hij dan voor zichzelf strijden, omdat men zijn altaar heeft omgeworpen.", "Ps 83:13": "die zeiden: Laten wij de mooie woningen van God voor onszelf in bezit nemen.", "1 Sam 14:16": "Toen de wachters van Saul te Gibea van Benjamin zagen dat, zie, de menigte wegsmolt en heen en weer liep en elkaar neersloeg,", "Job 33:16": "Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Ps 83:10": "Doe hun als Midian, als Sisera, als Jabin bij de beek Kison;", "Jes 9:3": "Want het juk van hun last, en de stok van hun schouders, en de staf van hem die hen dreef, hebt U verbroken, zoals op de dag van de Midianieten;", "Ezech 28:17": "Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "Joz 1:1": "Het gebeurde nu, na de dood van Mozes, de knecht van de HEERE, dat de HEERE tegen Jozua, de zoon van Nun, de dienaar van Mozes, sprak en zei:", "Jer 6:27-30": "Ik heb u onder Mijn volk gesteld, tot een wachttoren, tot een vesting; opdat u hun weg zou weten en beproeven. Zij zijn allen de ergste afvalligen; zij wandelen in achterklap; zij zijn koper en ijzer; zij zijn allemaal verdervers. De blaasbalg is verbrand, het lood is door het vuur verteerd; tevergeefs heeft de smelter zo vlijtig gesmolten, omdat de bozen niet afgetrokken zijn.", "Rom 3:27": "Waar is dan de roem? Hij is uitgesloten. Door welke wet? Van de werken? Nee, maar door de wet van het geloof.", "Joh 12:10": "En de overpriesters beraadslaagden om ook Lazarus te doden,", "1 Sam 14:15-20": "En er kwam beving in het leger, op het veld en onder heel het volk; de bezetting en de plunderaars beefden ook zelf; ja, het land schudde, want het was een beving van God. Toen de wachters van Saul te Gibea van Benjamin zagen dat, zie, de menigte wegsmolt en heen en weer liep en elkaar neersloeg, zei Saul tegen het volk dat bij hem was: Tel toch, en zie wie van ons weggegaan zijn. En zij telden, en zie, Jonathan en zijn wapendrager waren daar niet.", "1 Kon 4:12": "Baäna, de zoon van Ahilud, had Taanach, en Megiddo, en heel Beth-sean, dat bij Zartana ligt, beneden Jizreël, van Beth-sean af tot Abel-mehola toe, tot aan de overkant van Jokmeam.", "Richt 3:15": "Toen riepen de kinderen van Israël tot de HEERE, en de HEERE verwekte hun een verlosser, Ehud, de zoon van Gera, een zoon van Jemini, een man die links was. En de kinderen van Israël zonden door zijn hand een geschenk aan Eglon, de koning van de Moabieten.", "1 Tess 4:16": "Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan;", "Joh 20:30": "Jezus heeft nog wel veel andere tekenen gedaan, in aanwezigheid van Zijn discipelen, die niet in dit boek geschreven zijn;", "2 Kron 14:9-12": "En Zerah, de Moor, trok tegen hen op, met een leger van duizend maal duizend, en driehonderd wagens; en hij kwam tot Maresa toe. Toen trok Asa tegen hem uit; en zij stelden de slagorde op in het dal Zefatha bij Maresa. En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "2 Sam 18:2": "Verder zond David het volk uit, een derde deel onder leiding van Joab, en een derde deel onder leiding van Abisai, de zoon van Zeruja, Joabs broer, en een derde deel onder leiding van Ithai, de Gethiet. En de koning zei tegen het volk: Ik zal ook zelf zeker met u meetrekken.", "Richt 6:15": "En hij zei tegen Hem: Och, mijn Heere! Waarmee zal ik Israël verlossen? Zie, mijn geslacht is het armste in Manasse, en ik ben de kleinste in mijn vaders huis.", "Richt 12:5": "Want de Gileadieten namen de Efraïmieten de doorwaadbare plaatsen van de Jordaan af; en het gebeurde, toen de vluchtelingen van Efraïm zeiden: Laat mij oversteken, dat de mannen van Gilead tegen hem zeiden: Bent u een Efraïmiet? En wanneer hij zei: Nee;", "Joz 7:5": "En de mannen van Ai versloegen van hen ongeveer zesendertig man, en achtervolgden hen vanaf de poort tot Schebarim toe, en versloegen hen bij de afgang. Toen versmolt het hart van het volk, en het werd tot water.", "Richt 7:10-20": "Maar als u ervoor terugschrikt naar beneden te gaan, ga dan af, u en Pura, uw knecht, naar het leger. En u zult horen wat zij zullen zeggen, en daarna zullen uw handen gesterkt worden, zodat u naar het leger zult aftrekken. Toen ging hij af, met Pura, zijn knecht, tot aan het uiterste van de gewapende mannen die in het leger waren. En de Midianieten, en Amalekieten, en al de mensen van het oosten, lagen in het dal, als een menigte sprinkhanen, en hun kamelen waren niet te tellen, als het zand dat aan de oever van de zee ligt, in menigte.", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "2 Sam 16:20": "Toen zei Absalom tegen Achitofel: Geef onder u raad, wat zullen wij doen?", "Joh 4:48-53": "Jezus zei toen tegen hem: Als u geen tekenen en wonderen ziet, zult u niet geloven. De koninklijke hoveling zei tegen Hem: Heere, kom af voordat mijn kind sterft. Jezus zei tegen hem: Ga heen, uw zoon leeft. En de man geloofde het woord dat Jezus tegen hem gezegd had, en ging heen.", "Jes 43:1": "Maar nu, zo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! Vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, u bent van Mij.", "Deut 3:22": "Wees niet bang voor hen; want de HEERE, uw God, strijdt voor u.", "2 Petr 1:15": "Maar ik zal er ook mijn best voor doen, dat u bij elke gelegenheid, na mijn heengaan, hieraan kunt terugdenken.", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "Hand 19:13-18": "En sommigen van de Joden die rondtrokken, en die duivelbezweerders waren, hebben zich eraan gewaagd de Naam van de Heere Jezus te noemen over hen die boze geesten hadden, en zeiden: Wij bezweren u bij Jezus, Die Paulus predikt! Dit waren zeven zonen van een zekere Sceva, een Joodse overpriester, die dit deden. Maar de boze geest antwoordde en zei: Jezus ken ik, en Paulus weet ik; maar u, wie bent u?", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "Richt 8:10": "Zebah nu en Tsalmuna waren in Karkor, en hun legers met hen, ongeveer vijftienduizend man, alles wat er over was van het hele leger van de mensen uit het oosten; en de gesneuvelden waren honderdtwintigduizend man, die het zwaard hanteerden.", "Jes 27:13": "En het zal op die dag gebeuren, dat er met een grote bazuin geblazen zal worden; dan zullen zij komen die verloren dreigden te gaan in het land van Assur, en de weggejaagden in het land van Egypte; en zij zullen de HEERE aanbidden op de heilige berg te Jeruzalem.", "2 Kon 7:7": "Daarom hadden zij zich klaargemaakt, en waren in de schemering gevlucht, en hadden hun tenten achtergelaten, en hun paarden, en hun ezels, het leger precies zoals het was; en waren gevlucht om hun leven te redden.", "Gen 46:2": "En God sprak tot Israël in visioenen in de nacht, en zei: Jakob, Jakob! En hij zei: Zie, hier ben ik!", "Joz 6:12": "Daarna stond Jozua 's morgens vroeg op, en de priesters droegen de ark van de HEERE.", "1 Sam 13:17": "En de verwoesters trokken uit het leger van de Filistijnen, in drie groepen; de ene groep sloeg de weg in naar Ofra, naar het land Sual;", "Luk 5:4-11": "En toen Hij ophield met spreken, zei Hij tegen Simon: Steek af naar de diepte, en werp uw netten uit om te vangen. En Simon antwoordde en zei tegen Hem: Meester, we hebben de hele nacht gewerkt en niets gevangen; maar op Uw woord zal ik het net uitwerpen. En toen zij dat gedaan hadden, vingen ze een grote hoeveelheid vissen, en hun net scheurde.", "Ex 15:15": "Dan zullen de vorsten van Edom verbaasd zijn; beving zal de machtigen van de Moabieten bevangen; alle inwoners van Kanaän zullen wegsmelten!", "Jes 51:13": "En u vergeet de HEERE, Die u gemaakt heeft, Die de hemelen heeft uitgebreid, en de aarde gegrond heeft, en u vreest voortdurend de hele dag, vanwege de grimmigheid van de benauwer, wanneer hij zich bereidt om te verderven? Waar is dan de grimmigheid van de benauwer?", "Richt 4:15": "En de HEERE versloeg Sisera, met al zijn wagens, en het hele leger, door de scherpte van het zwaard, voor Barak; zodat Sisera van de wagen afklom, en te voet vluchtte.", "Rom 15:30": "En ik bid u, broeders, door onze Heere Jezus Christus, en door de liefde van de Geest, dat u met mij strijdt in de gebeden tot God voor mij;", "1 Sam 30:17": "En David sloeg hen van de schemering tot aan de avond van de volgende dag; en er ontkwam niet één man van hen, behalve vierhonderd jonge mannen, die op kamelen reden en vluchtten.", "Joz 6:4": "En zeven priesters zullen zeven ramsbazuinen dragen, voor de ark; en u zult op de zevende dag de stad zevenmaal omgaan; en de priesters zullen met de bazuinen blazen.", "1 Sam 19:5": "Want hij heeft zijn leven gewaagd, en hij heeft de Filistijn geslagen, en de HEERE heeft een grote overwinning aan heel Israël gegeven; u hebt het gezien, en u bent verblijd geweest; waarom zou u dan tegen onschuldig bloed zondigen, David zonder reden doden?", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Joz 2:7": "Die mannen dan achtervolgden hen op de weg naar de Jordaan, tot aan de doorwaadbare plaatsen; en men sloot de poort dicht, nadat zij naar buiten gegaan waren die hen achtervolgden.", "Zach 10:5": "En zij zullen zijn als de helden, die in het slijk van de straten treden in de strijd, en zij zullen strijden; want de HEERE zal met hen zijn, en zij zullen hen beschamen die op paarden rijden.", "Richt 7:16-22": "En hij deelde de driehonderd man in drie groepen; en hij gaf ieder een bazuin in zijn hand, en lege kruiken, en fakkels in het midden van de kruiken. En hij zei tegen hen: Kijk naar mij en doe hetzelfde; en zie, wanneer ik aan het uiterste van het leger kom, zal het zo zijn: zoals ik zal doen, zo zult u doen. Als ik met de bazuin blaas, ik en allen die met mij zijn, dan zult ook u met de bazuin blazen, rondom het hele leger, en u zult zeggen: Voor de HEERE en voor Gideon!", "Spr 28:1": "De goddelozen vluchten, terwijl geen vervolger er is; maar elke rechtvaardige is moedig, als een jonge leeuw.", "2 Kron 20:23": "Want de kinderen van Ammon en Moab stonden op tegen de inwoners van het gebergte Seir, om hen met de ban te treffen en te vernietigen; en toen zij een einde gemaakt hadden aan de inwoners van Seir, hielpen zij elkaar in het verderf.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Zach 12:7": "En de HEERE zal de tenten van Juda het eerst redden, opdat de heerlijkheid van het huis van David, en de heerlijkheid van de inwoners van Jeruzalem, zich niet verheft tegen Juda.", "Joz 2:9": "En zij sprak tot die mannen: Ik weet dat de HEERE u dit land gegeven heeft, en dat de schrik voor u op ons gevallen is, en dat alle inwoners van dit land voor u vergaan zijn van angst.", "Joz 6:20": "Het volk dan juichte, toen zij op de bazuinen bliezen; en het gebeurde, toen het volk het geluid van de bazuin hoorde, dat het volk juichte met een groot gejuich; en de muur viel onder zich, en het volk klom in de stad, ieder tegenover zich, en zij namen de stad in.", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Matt 13:21": "Doch hij heeft geen wortel in zichzelf, maar houdt maar even stand; en als er verdrukking of vervolging komt om het woord, dan struikelt hij meteen.", "Job 15:22": "Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Richt 3:31": "Na hem nu was Samgar, een zoon van Anath, die de Filistijnen sloeg, zeshonderd man, met een ossenstok; zo verloste ook hij Israël.", "Ex 4:31": "En het volk geloofde, en zij hoorden, dat de HEERE de kinderen van Israël bezocht had, en dat Hij hun verdrukking gezien had, en zij bogen hun hoofden, en aanbaden.", "Ex 4:28-31": "En Mozes maakte Aäron bekend al de woorden van de HEERE, Die hem gezonden had, en al de tekenen, die Hij hem bevolen had. Toen ging Mozes en Aäron, en zij verzamelden al de oudsten van de kinderen van Israël. En Aäron sprak al de woorden, die de HEERE tot Mozes gesproken had; en hij deed de tekenen voor de ogen van het volk.", "Dan 3:29": "Daarom wordt door mij een bevel gegeven, dat elk volk, natie en tong, die iets verkeerds spreekt tegen de God van Sadrach, Mesach en Abed-nego, in stukken gehouwen wordt, en zijn huis tot een puinhoop gemaakt wordt; want er is geen andere God die op zo'n manier kan verlossen.", "Joz 23:10": "Eén man onder u zal er duizend opjagen; want het is de HEERE, uw God, Zelf, Die voor u strijdt, zoals Hij tot u gesproken heeft.", "Deut 7:17-24": "Als u in uw hart zei: Deze volken zijn groter dan ik; hoe zou ik hen uit hun bezit kunnen verdrijven? — wees niet bevreesd voor hen; denk goed terug aan wat de HEERE, uw God, aan de farao en aan alle Egyptenaren gedaan heeft; de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.", "Ezra 6:22": "En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.", "Deut 20:1": "Wanneer u zult uittrekken tot de strijd tegen uw vijanden, en zult zien paarden en wagens, een volk, groter dan u, dan zult u voor hen niet vrezen; want de HEERE, uw God, is met u, Die u uit Egypteland heeft opgevoerd.", "Gen 14:14": "Toen Abram hoorde dat zijn broeder gevangen was genomen, wapende hij zijn geoefende mannen, geboren in zijn eigen huis, driehonderd achttien, en hij achtervolgde hen tot Dan toe.", "Joz 5:1": "En het gebeurde, toen alle koningen van de Amorieten, die aan deze zijde van de Jordaan naar het westen woonden, en alle koningen van de Kanaänieten, die aan de zee woonden, hoorden dat de HEERE de wateren van de Jordaan had uitgedroogd voor de kinderen van Israël, totdat wij daardoor gegaan waren, dat hun hart versmolt, en er was geen moed meer in hen, vanwege de kinderen van Israël.", "2 Kron 20:15-17": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God. Trek morgen tegen hen af; zie, zij komen op bij de weg naar Ziz; en u zult hen vinden aan het einde van het dal, voor de woestijn van Jeruël. U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Deut 3:21": "Ook gebood ik Jozua in die tijd: Uw ogen hebben alles gezien wat de HEERE, uw God, aan deze twee koningen gedaan heeft; zo zal de HEERE doen aan alle koninkrijken waar u doorheen trekt.", "Lev 26:37": "En zij zullen de een over de ander vallen als voor het zwaard, terwijl niemand hen opjaagt; en u zult niet kunnen standhouden voor het aangezicht van uw vijanden.", "Ex 14:25": "En Hij stootte de raderen van hun wagens weg, en deed ze zwaar voortgaan. Toen zeiden de Egyptenaren: Laten wij vluchten van voor Israël, want de HEERE strijdt voor hen tegen de Egyptenaren.", "Joz 1:5-9": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten. Wees sterk en heb goede moed! Want u zult dit volk dat land als erfelijk bezit doen verkrijgen, dat Ik hun vaderen gezworen heb hun te geven. Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Hand 13:8-12": "Maar Elymas, de tovenaar (want zo wordt zijn naam vertaald), weerstond hen, en probeerde de stadhouder van het geloof af te keren. Doch Saulus (die ook Paulus genoemd wordt), vervuld met de Heilige Geest, en de ogen op hem gericht houdend, zei: O kind van de duivel, vol van alle bedrog en van alle arglistigheid, vijand van alle gerechtigheid, zult u niet ophouden de rechte wegen van de Heere te verdraaien?", "Richt 5:15": "Ook waren de vorsten in Issaschar met Debora; en zoals Issaschar, zo was Barak; op zijn voeten werd hij gezonden in het dal. In Rubens gedeelten waren de inbeeldingen van het hart groot.", "1 Sam 30:7": "En David zei tegen de priester Abjathar, de zoon van Achimelech: Breng mij toch de efod hier. En Abjathar bracht de efod naar David.", "Job 15:21": "Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over.", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "1 Kor 1:27-29": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen; En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken; Opdat geen vlees zou roemen voor Hem.", "Richt 12:6": "dan zeiden zij tegen hem: Zeg dan Schibboleth; maar hij zei: Sibbolet, en kon het zo niet goed uitspreken; dan grepen zij hem en doodden hem bij de doorwaadbare plaatsen van de Jordaan, zodat er in die tijd van Efraïm tweeënveertigduizend vielen.", "2 Kron 20:18": "Toen boog Josafat zich met het gezicht ter aarde; en heel Juda en de inwoners van Jeruzalem vielen neer voor het aangezicht van de HEERE, en aanbaden de HEERE.", "1 Kon 4:30": "En de wijsheid van Salomo was groter dan de wijsheid van allen uit het oosten, en dan alle wijsheid van de Egyptenaren;", "Joh 2:22": "Daarom, toen Hij opgestaan was uit de doden, herinnerden Zijn discipelen zich dat Hij dit tegen hen had gezegd, en zij geloofden de Schrift en het woord dat Jezus gesproken had.", "Richt 8:4": "Toen Gideon nu bij de Jordaan gekomen was, ging hij eroverheen, met de driehonderd mannen die bij hem waren, moe, maar toch nog vervolgend.", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "Joz 11:11": "En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur.", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "Hoogl 4:1": "Zie, u bent mooi, Mijn vriendin! Zie, u bent mooi; uw ogen zijn duivenogen tussen uw vlechten; uw haar is als een kudde geiten, die van de berg Gilead afscheren.", "Richt 7:13-15": "Toen Gideon nu aankwam, zie, daar was een man die aan zijn metgezel een droom vertelde, en zei: Zie, ik heb een droom gehad, en zie, een geroosterd gerstebrood tuimelde het leger van de Midianieten in, en het kwam tot aan de tent, en sloeg ertegen, zodat zij viel, en keerde haar ondersteboven, zodat de tent daar plat lag. En zijn metgezel antwoordde en zei: Dit is niets anders dan het zwaard van Gideon, de zoon van Joas, de Israëlitische man; God heeft de Midianieten en dit hele leger in zijn hand gegeven. En het gebeurde, toen Gideon het vertellen van deze droom, en de uitleg ervan, hoorde, dat hij aanbad; en hij keerde terug naar het leger van Israël, en zei: Maak u op, want de HEERE heeft het leger van de Midianieten in uw hand gegeven.", "Rom 15:18": "Want ik zou niet durven iets zeggen dat Christus niet door mij gewerkt heeft, tot gehoorzaamheid van de heidenen, met woorden en werken;", "Ef 3:16": "opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "1 Sam 11:11": "Het gebeurde nu de volgende dag, dat Saul het volk in drie groepen indeelde, en zij kwamen midden in het leger, tijdens de morgenwake, en zij versloegen Ammon, totdat de dag heet werd; en het gebeurde dat de overgeblevenen zo verstrooid werden, dat er onder hen geen twee samen bleven.", "Openb 10:2": "En hij had in zijn hand een boekje, dat geopend was; en hij zette zijn rechtervoet op de zee, en de linker op de aarde.", "Spr 11:14": "Als er geen wijs beleid is, valt het volk; maar de behoudenis is in de veelheid van raadslieden.", "1 Sam 17:32": "En David zei tegen Saul: Laat aan niemand het hart ontvallen om hem. Uw knecht zal gaan en met deze Filistijn strijden.", "1 Sam 15:32": "Toen zei Samuël: Breng Agag, de koning van de Amalekieten, hier bij mij. Agag nu ging vol vertrouwen naar hem toe; en Agag zei: Voorwaar, de bitterheid van de dood is geweken!", "Spr 20:18": "Elke gedachte wordt door raad bevestigd, voer daarom oorlog met wijze raadslagen.", "Richt 21:11": "Doch dit is de zaak die u doen zult: al wat mannelijk is, en alle vrouwen die gemeenschap met een man gehad hebben, zult u met de ban slaan.", "1 Sam 17:50": "Zo overweldigde David de Filistijn met een slinger en met een steen; en hij versloeg de Filistijn en doodde hem; doch David had geen zwaard in zijn hand.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H7925\">Toen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7925\">stond</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3378\">Jerubbaäl</span> (<span class=\"wl\" data-l=\"L9\" data-code=\"H4264\">dat</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1439\">is</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1439\">Gideon</span>) <span class=\"wl\" data-l=\"L1\" data-code=\"H7925\">vroeg</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7925\">op</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H3605\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3605\">al</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3605\">het</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5971\">volk</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H834\">dat</span> <span class=\"wl\" data-l=\"L6\" dat
