verkant van <span class=\"wl\" data-l=\"L16\" data-code=\"H3383\">de</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H3383\">Jordaan</span>."}, "koppeling_kjv": {"1": "Then <span class=\"wl wl-kjv\" data-code=\"H3378\">Jerubbaal,</span> who is <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him, rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> beside the well of <span class=\"wl wl-kjv\" data-code=\"H5878\">Harod:</span> so that the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites</span> were on the north <span class=\"wl wl-kjv\" data-code=\"H6828\">side</span> of them, by the <span class=\"wl wl-kjv\" data-code=\"H1389\">hill</span> of <span class=\"wl wl-kjv\" data-code=\"H4176\">Moreh,</span> in the valley.", "2": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> The <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that are with thee are too <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> for me to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites</span> into their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> lest <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6286\">vaunt</span> themselves against me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Mine own <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> hath saved", "3": "Now therefore go <span class=\"wl wl-kjv\" data-code=\"H4994\">to,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaim</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Whosoever is <span class=\"wl wl-kjv\" data-code=\"H3373\">fearful</span> and <span class=\"wl wl-kjv\" data-code=\"H2730\">afraid,</span> let him <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> and depart <span class=\"wl wl-kjv\" data-code=\"H6852\">early</span> from <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead.</span> And there <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand;</span> and there <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> thousand.", "4": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> The <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are yet too <span class=\"wl wl-kjv\" data-code=\"H7227\">many;</span> bring them <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6884\">try</span> them for thee there: and it shall be, that of whom I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto thee, This shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thee, the same shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thee; and of whomsoever I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto thee, This shall not <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thee, the same shall not go.", "5": "So he brought <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4325\">water:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> Every one that <span class=\"wl wl-kjv\" data-code=\"H3952\">lappeth</span> of the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> with his <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue,</span> as a <span class=\"wl wl-kjv\" data-code=\"H3611\">dog</span> <span class=\"wl wl-kjv\" data-code=\"H3952\">lappeth,</span> him shalt thou <span class=\"wl wl-kjv\" data-code=\"H3322\">set</span> by himself; likewise every one that boweth <span class=\"wl wl-kjv\" data-code=\"H3766\">down</span> upon his <span class=\"wl wl-kjv\" data-code=\"H1290\">knees</span> to drink.", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of them that <span class=\"wl wl-kjv\" data-code=\"H3952\">lapped,</span> putting their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> were <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men:</span> but all the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> bowed <span class=\"wl wl-kjv\" data-code=\"H3766\">down</span> upon their <span class=\"wl wl-kjv\" data-code=\"H1290\">knees</span> to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> water.", "7": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> By the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H3952\">lapped</span> will I <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> you, and <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites</span> into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and let all the other <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> unto his place.", "8": "So the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H6720\">victuals</span> in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and their <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H376\">all</span> the rest of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> unto his <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">retained</span> those <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian</span> was beneath him in the valley.", "9": "And it came to pass the same <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> get thee <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">host;</span> for I have <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> it into thine hand.", "10": "But if thou <span class=\"wl wl-kjv\" data-code=\"H3373\">fear</span> to go <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">go</span> thou with <span class=\"wl wl-kjv\" data-code=\"H6513\">Phurah</span> thy <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the host:", "11": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> what they <span class=\"wl wl-kjv\" data-code=\"H1696\">say;</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> shall thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> be <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> to go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">host.</span> Then went he <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with <span class=\"wl wl-kjv\" data-code=\"H6513\">Phurah</span> his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7097\">outside</span> of the armed <span class=\"wl wl-kjv\" data-code=\"H2571\">men</span> that were in the host.", "12": "And the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites</span> and the <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalekites</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H6924\">east</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">lay</span> along in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> like <span class=\"wl wl-kjv\" data-code=\"H697\">grasshoppers</span> for <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude;</span> and their <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> were without <span class=\"wl wl-kjv\" data-code=\"H4557\">number,</span> as the <span class=\"wl wl-kjv\" data-code=\"H2344\">sand</span> by the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">side</span> for multitude.", "13": "And when <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> behold, there was a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> unto his <span class=\"wl wl-kjv\" data-code=\"H7453\">fellow,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, I <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed</span> a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> and, lo, a <span class=\"wl wl-kjv\" data-code=\"H6742\">cake</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> <span class=\"wl wl-kjv\" data-code=\"H2015\">tumbled</span> into the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto a <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> it that it <span class=\"wl wl-kjv\" data-code=\"H5307\">fell,</span> and <span class=\"wl wl-kjv\" data-code=\"H2015\">overturned</span> it, that the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> lay along.", "14": "And his <span class=\"wl wl-kjv\" data-code=\"H7453\">fellow</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This is nothing else save the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash,</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> for into his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> hath <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> and all the host.", "15": "And it was so, when <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H4557\">telling</span> of the <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7667\">interpretation</span> thereof, that he <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> into the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of Midian.", "16": "And he <span class=\"wl wl-kjv\" data-code=\"H2673\">divided</span> the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> into <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">companies,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> in every man's <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> with <span class=\"wl wl-kjv\" data-code=\"H7386\">empty</span> <span class=\"wl wl-kjv\" data-code=\"H3537\">pitchers,</span> and <span class=\"wl wl-kjv\" data-code=\"H3940\">lamps</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">within</span> the pitchers.", "17": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H7200\">Look</span> on me, and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> likewise: and, behold, when I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H7097\">outside</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> it shall be that, as I <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> so shall ye do.", "18": "When I <span class=\"wl wl-kjv\" data-code=\"H8628\">blow</span> with a <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> I and all that are with me, then <span class=\"wl wl-kjv\" data-code=\"H8628\">blow</span> ye the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets</span> also on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side</span> of all the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> The sword of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and of Gideon.", "19": "So <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that were w ata-code=\"H6159\">Oreb</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock</span> <span class=\"wl wl-kjv\" data-code=\"H6159\">Oreb,</span> and <span class=\"wl wl-kjv\" data-code=\"H2062\">Zeeb</span> they <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> at the <span class=\"wl wl-kjv\" data-code=\"H3342\">winepress</span> of <span class=\"wl wl-kjv\" data-code=\"H2062\">Zeeb,</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> of <span class=\"wl wl-kjv\" data-code=\"H6159\">Oreb</span> and <span class=\"wl wl-kjv\" data-code=\"H2062\">Zeeb</span> to <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> on the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> Jordan."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {

    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {

  }
  if (tab === 'verwijzingen') {

    const engels = D.tsk_kjv[n];

    } else {
      h += '<em>Geen verwijzingen</em>';

  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen

  const refChips = refs => {

  const knoop = nd => {

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;

  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
