dus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen stond Jerubbaäl (dat is Gideon) vroeg op, en al het volk dat met hem was; en zij legerden zich bij de bron van Harod; het leger van de Midianieten lag ten noorden van hen, achter de heuvel More, in het dal.","2":"En de HEERE zei tegen Gideon: Van het volk dat met u is, zijn er te veel, dan dat Ik de Midianieten in hun hand zou geven; anders zou Israël zich tegen Mij beroemen, en zeggen: Mijn eigen hand heeft mij verlost.","3":"Nu dan, roep nu voor de oren van het volk, en zeg: Wie bang en angstig is, die keert terug en spoedt zich weg van het gebergte van Gilead! Toen keerden er van het volk tweeëntwintigduizend terug, zodat er tienduizend overbleven.","4":"En de HEERE zei tegen Gideon: Nog is er van het volk te veel; laat hen afgaan naar het water, en Ik zal ze daar voor u beproeven; en het zal gebeuren: van wie Ik tegen u zal zeggen: Deze zal met u meegaan, die zal met u meegaan; maar ieder van wie Ik tegen u zal zeggen: Deze zal niet met u meegaan, die zal niet meegaan.","5":"En hij liet het volk afgaan naar het water. Toen zei de HEERE tegen Gideon: Ieder die met zijn tong uit het water zal lekken, zoals een hond zou lekken, hem zult u apart zetten; evenzo ieder die op zijn knieën zal bukken om te drinken.","6":"Toen was het aantal van hen die met hun hand naar hun mond gelekt hadden, driehonderd man; maar alle overigen van het volk hadden op hun knieën gebukt om water te drinken.","7":"En de HEERE zei tegen Gideon: Door deze driehonderd mannen die gelekt hebben, zal Ik u verlossen, en de Midianieten in uw hand geven; laat daarom al het andere volk weggaan, ieder naar zijn eigen plaats.","8":"En het volk nam de teerkost in hun hand, en hun bazuinen; en hij liet alle andere mannen van Israël gaan, ieder naar zijn tent, maar die driehonderd man hield hij bij zich. En het leger van de Midianieten lag beneden hem in het dal.","9":"En het gebeurde in die nacht, dat de HEERE tegen hem zei: Sta op, ga naar beneden naar het leger, want Ik heb het in uw hand gegeven.","10":"Maar als u ervoor terugschrikt naar beneden te gaan, ga dan af, u en Pura, uw knecht, naar het leger.","11":"En u zult horen wat zij zullen zeggen, en daarna zullen uw handen gesterkt worden, zodat u naar het leger zult aftrekken. Toen ging hij af, met Pura, zijn knecht, tot aan het uiterste van de gewapende mannen die in het leger waren.","12":"En de Midianieten, en Amalekieten, en al de mensen van het oosten, lagen in het dal, als een menigte sprinkhanen, en hun kamelen waren niet te tellen, als het zand dat aan de oever van de zee ligt, in menigte.","13":"Toen Gideon nu aankwam, zie, daar was een man die aan zijn metgezel een droom vertelde, en zei: Zie, ik heb een droom gehad, en zie, een geroosterd gerstebrood tuimelde het leger van de Midianieten in, en het kwam tot aan de tent, en sloeg ertegen, zodat zij viel, en keerde haar ondersteboven, zodat de tent daar plat lag.","14":"En zijn metgezel antwoordde en zei: Dit is niets anders dan het zwaard van Gideon, de zoon van Joas, de Israëlitische man; God heeft de Midianieten en dit hele leger in zijn hand gegeven.","15":"En het gebeurde, toen Gideon het vertellen van deze droom, en de uitleg ervan, hoorde, dat hij aanbad; en hij keerde terug naar het leger van Israël, en zei: Maak u op, want de HEERE heeft het leger van de Midianieten in uw hand gegeven.","16":"En hij deelde de driehonderd man in drie groepen; en hij gaf ieder een bazuin in zijn hand, en lege kruiken, en fakkels in het midden van de kruiken.","17":"En hij zei tegen hen: Kijk naar mij en doe hetzelfde; en zie, wanneer ik aan het uiterste van het leger kom, zal het zo zijn: zoals ik zal doen, zo zult u doen.","18":"Als ik met de bazuin blaas, ik en allen die met mij zijn, dan zult ook u met de bazuin blazen, rondom het hele leger, en u zult zeggen: Voor de HEERE en voor Gideon!","19":"Zo kwam Gideon, en honderd mannen die met hem waren, aan het uiterste van het leger, aan het begin van de middelste nachtwaak, net toen zij de wachters gesteld hadden; en zij bliezen op de bazuinen, en sloegen de kruiken die in hun hand waren stuk.","20":"Zo bliezen de drie groepen op de bazuinen, en braken de kruiken; en zij hielden met de linkerhand de fakkels vast, en met hun rechterhand de bazuinen om te blazen; en zij riepen: Het zwaard van de HEERE, en van Gideon!","21":"En zij bleven staan, ieder op zijn plaats, rondom het leger. Toen liep het hele leger uiteen, en zij schreeuwden en vluchtten.","22":"Toen de driehonderd op de bazuinen bliezen, richtte de HEERE het zwaard van de een tegen de ander, door het hele leger heen; en het leger vluchtte tot Beth-sitta toe, naar Tseredath, tot aan de grens van Abel-mehola, boven Tabbath.","23":"Toen werden de mannen van Israël bijeengeroepen, uit Nafthali, en uit Aser, en uit heel Manasse; en zij achtervolgden de Midianieten.","24":"Ook zond Gideon boden naar heel het gebergte van Efraïm, en zei: Kom naar beneden, de Midianieten tegemoet, en neem hun de wateren af, tot aan Beth-bara, namelijk de Jordaan; zo werd elke man van Efraïm bijeengeroepen, en zij namen hun de wateren af tot aan Beth-bara, en de Jordaan.","25":"En zij vingen twee vorsten van de Midianieten, Oreb en Zeëb, en doodden Oreb op de rots Oreb, en Zeëb doodden zij bij de perskuip van Zeëb, en achtervolgden de Midianieten; en zij brachten de hoofden van Oreb en Zeëb naar Gideon, aan de overkant van de Jordaan."},"SV":{"1":"Toen stond Jerubbaäl ( dewelke is Gideon) vroeg op, en al het volk, dat met hem was; en zij legerden zich aan de fontein van Harod; dat hij het heirleger der Midianieten had tegen het noorden, achter den heuvel More, in het dal.","2":"En de HEERE zeide tot Gideon: Des volks is te veel, dat met u is, dan dat Ik de Midianieten in hun hand zou geven; opdat zich Israël niet tegen Mij beroeme, zeggende: Mijn hand heeft mij verlost.","3":"Nu dan, roep nu uit voor de oren des volks, zeggende: Wie blode en versaagd is, die kere weder, en spoede zich naar het gebergte van Gilead! Toen keerden uit het volk weder twee en twintig duizend, dat er tien duizend overbleven.","4":"En de HEERE zeide tot Gideon: Nog is des volks te veel; doe hen afgaan naar het water, en Ik zal ze u aldaar beproeven; en het zal geschieden, van welken Ik tot u zeggen zal: Deze zal met u trekken, die zal met u trekken; maar al degene, van welken Ik tot u zeggen zal: Deze zal niet met u trekken, die zal niet trekken.","5":"En hij deed het volk afgaan naar het water. Toen zeide de HEERE tot Gideon: Al wie met zijn tong uit het water zal lekken, gelijk als een hond zou lekken, dien zult gij alleen stellen; desgelijks al wie op zijn knieën zal bukken om te drinken.","6":"Toen was het getal dergenen, die met hun hand tot hun mond gelekt hadden, driehonderd man; maar alle overigen des volks hadden op hun knieën gebukt, om water te drinken.","7":"En de HEERE zeide tot Gideon: Door deze driehonderd mannen, die gelekt hebben, zal Ik ulieden verlossen, en de Midianieten in uw hand geven; daarom laat al dat volk weggaan, een ieder naar zijn plaats.","8":"En het volk nam den teerkost in hun hand, en hun bazuinen; en hij liet al die mannen van Israël gaan, een iegelijk naar zijn tent; maar die driehonderd man behield hij. En hij had het heirleger der Midianieten beneden in het dal.","9":"En het geschiedde in denzelven nacht, dat de HEERE tot hem zeide: Sta op, ga henen af in het leger, want Ik heb het in uw hand gegeven.","10":"Vreest gij dan nog af te gaan, zo ga af, gij, en Pura, uw jongen, naar het leger.","11":"En gij zult horen, wat zij zullen spreken, en daarna zullen uw handen gesterkt worden, dat gij aftrekken zult in het leger. Toen ging hij af, met Pura, zijn jongen, tot het uiterste der schildwachten, die in het leger waren.","12":"En de Midianieten, en Amalekieten, en al de kinderen van het oosten, lagen in het dal, gelijk sprinkhanen in menigte, en hun kemelen waren ontelbaar, gelijk het zand, dat aan den oever der zee is, in menigte.","13":"Toen nu Gideon aankwam, ziet, zo was er een man, die zijn metgezel een droom vertelde, en zeide: Zie, ik heb een droom gedroomd, en zie, een geroost gerstebrood wentelde zich in het leger der Midianieten, en het kwam tot aan de tent, en sloeg haar, dat zij viel, en keerde haar om, het onderste boven, dat de tent er lag.","14":"En zijn metgezel antwoordde, en zeide: Dit is niet anders, dan het zwaard van Gideon, den zoon van Joas, den Israëlietischen man; God heeft de Midianieten en dit ganse leger in zijn hand gegeven.","15":"En het geschiedde, als Gideon de vertelling dezes drooms, en zijn uitlegging hoorde, zo aanbad hij; en hij keerde weder tot het leger van Israël, en zeide: Maakt u op, want de HEERE heeft het leger der Midianieten in ulieder hand gegeven.","16":"En hij deelde de driehonderd man in drie hopen; en hij gaf een iegelijk een bazuin in zijn hand, en ledige kruiken, en fakkelen in het midden der kruiken.","17":"En hij zeide tot hen: Ziet naar mij en doet alzo; en ziet, als ik zal komen aan het uiterste des legers, zo zal het geschieden, gelijk als ik zal doen, alzo zult gij doen.","18":"Als ik met de bazuin zal blazen, ik en allen, die met mij zijn, dan zult gijlieden ook met de bazuin blazen, rondom het ganse leger, en gij zult zeggen: Voor den HEERE en voor Gideon!","19":"Alzo kwam Gideon, en honderd mannen, die met hem waren, in het uiterste des legers, in het begin van de middelste nachtwaak, als zij maar even de wachters gesteld hadden; en zij bliezen met de bazuinen, ook sloegen zij de kruiken, die in hun hand waren, in stukken.","20":"Alzo bliezen de drie hopen met de bazuinen, en braken de kruiken; en zij hielden met de linkerhand de fakkelen, en met hun rechterhand de bazuinen om te blazen; en zij riepen: Het zwaard van den HEERE, en van Gideon!","21":"En zij stonden, een iegelijk in zijn plaats, rondom het leger. Toen verliep het ganse leger, en zij schreeuwden en vloden .","22":"Als de driehonderd met de bazuinen bliezen, zo zette de HEERE het zwaard des een tegen den anderen, en *dat* in het ganse leger; en het leger vluchtte tot Beth-sitta toe naar Tseredath, tot aan de grens van Abel-mehola, boven Tabbath.","23":"Toen werden de mannen van Israël bijeengeroepen, uit Nafthali, en uit Aser, en uit gans Manasse; en zij jaagden de Midianieten achterna.","24":"Ook zond Gideon boden in het ganse gebergte van Efraïm, zeggende: Komt af den Midianieten tegemoet, en beneemt hunlieden de wateren, tot aan Beth-bara, te weten de Jordaan; alzo werd alle man van Efraïm bijeengeroepen, en zij benamen *hun* de wateren tot aan Beth-bara, en de Jordaan.","25":"En zij vingen twee vorsten der Midianieten, Oreb en Zeëb, en doodden Oreb op den rotssteen Oreb, en Zeëb doodden zij in de perskuip van Zeëb, en vervolgden de Midianieten; en zij brachten de hoofden van Oreb en Zeëb tot Gideon, over de Jordaan."},"KJV":{"1":"Then Jerubbaal, who *is* Gideon, and all the people that *were* with him, rose up early, and pitched beside the well of Harod: so that the host of the Midianites were on the north side of them, by the hill of Moreh, in the valley.","2":"And the LORD said unto Gideon, The people that *are* with thee *are* too many for me to give the Midianites into their hands, lest Israel vaunt themselves against me, saying, Mine own hand hath saved","3":"Now therefore go to, proclaim in the ears of the people, saying, Whosoever *is* fearful and afraid, let him return and depart early from mount Gilead. And there returned of the people twenty and two thousand; and there remained ten thousand.","4":"And the LORD said unto Gideon, The people *are* yet *too* many; bring them down unto the water, and I will try them for thee there: and it shall be, *that* of whom I say unto thee, This shall go with thee, the same shall go with thee; and of whomsoever I say unto thee, This shall not go with thee, the same shall not go.","5":"So he brought down the people unto the water: and the LORD said unto Gideon, Every one that lappeth of the water with his tongue, as a dog lappeth, him shalt thou set by himself; likewise every one that boweth down upon his knees to drink.","6":"And the number of them that lapped, *putting* their hand to their mouth, were three hundred men: but all the rest of the people bowed down upon their knees to drink water.","7":"And the LORD said unto Gideon, By the three hundred men that lapped will I save you, and deliver the Midianites into thine hand: and let all the *other* people go every man unto his place.","8":"So the people took victuals in their hand, and their trumpets: and he sent all *the rest of* Israel every man unto his tent, and retained those three hundred men: and the host of Midian was beneath him in the valley.","9":"And it came to pass the same night, that the LORD said unto him, Arise, get thee down unto the host; for I have delivered it into thine hand.","10":"But if thou fear to go down, go thou with Phurah thy servant down to the host:","11":"And thou shalt hear what they say; and afterward shall thine hands be strengthened to go down unto the host. Then went he down with Phurah his servant unto the outside of the armed men that *were* in the host.","12":"And the Midianites and the Amalekites and all the children of the east lay along in the valley like grasshoppers for multitude; and their camels *were* without number, as the sand by the sea side for multitude.","13":"And when Gideon was come, behold, *there was* a man that told a dream unto his fellow, and said, Behold, I dreamed a dream, and, lo, a cake of barley bread tumbled into the host of Midian, and came unto a tent, and smote it that it fell, and overturned it, that the tent lay along.","14":"And his fellow answered and said, This *is* nothing else save the sword of Gideon the son of Joash, a man of Israel: *for* into his hand hath God delivered Midian, and all the host.","15":"And it was *so*, when Gideon heard the telling of the dream, and the interpretation thereof, that he worshipped, and returned into the host of Israel, and said, Arise; for the LORD hath delivered into your hand the host of Midian.","16":"And he divided the three hundred men *into* three companies, and he put a trumpet in every man's hand, with empty pitchers, and lamps within the pitchers.","17":"And he said unto them, Look on me, and do likewise: and, behold, when I come to the outside of the camp, it shall be *that*, as I do, so shall ye do.","18":"When I blow with a trumpet, I and all that *are* with me, then blow ye the trumpets also on every side of all the camp, and say, *The sword* of the LORD, and of Gideon.","19":"So Gideon, and the hundred men that *were* with him, came unto the outside of the camp in the beginning of the middle watch; and they had but newly set the watch: and they blew the trumpets, and brake the pitchers that *were* in their hands.","20":"And the three companies blew the trumpets, and brake the pitchers, and held the lamps in their left hands, and the trumpets in their right hands to blow *withal*: and they cried, The sword of the LORD, and of Gideon.","21":"And they stood every man in his place round about the camp: and all the host ran, and cried, and fled.","22":"And the three hundred blew the trumpets, and the LORD set every man's sword against his fellow, even throughout all the host: and the host fled to Bethshittah in Zererath, *and* to the border of Abelmeholah, unto Tabbath.","23":"And the men of Israel gathered themselves together out of Naphtali, and out of Asher, and out of all Manasseh, and pursued after the Midianites.","24":"And Gideon sent messengers throughout all mount Ephraim, saying, Come down against the Midianites, and take before them the waters unto Bethbarah and Jordan. Then all the men of Ephraim gathered themselves together, and took the waters unto Bethbarah and Jordan.","25":"And they took two princes of the Midianites, Oreb and Zeeb; and they slew Oreb upon the rock Oreb, and Zeeb they slew at the winepress of Zeeb, and pursued Midian, and brought the heads of Oreb and Zeeb to Gideon on the other side Jordan."}},"tsk":{"1":[{"kopje":"Jerubbaäl","refs":["Richt 6:32"]},{"kopje":"stond...vroeg op","refs":["Gen 22:3","Joz 3:1","Joz 6:12","Pred 9:10"]},{"kopje":"More","refs":["Gen 12:6"]}],"2":[{"kopje":"te veel","refs":["1 Sam 14:6","2 Kron 14:11","Zach 4:6","Zach 12:7","1 Kor 1:27-29","1 Kor 2:4","1 Kor 2:5","2 Kor 4:7","2 Kor 10:4","2 Kor 10:5"]},{"kopje":"Israël","refs":["Deut 32:27","Jes 2:11","Jes 2:17","Jer 9:23","Rom 3:27","Rom 11:18","1 Kor 1:29","Ef 2:9","Jak 4:6"]},{"kopje":"Mijn eigen","refs":["Deut 8:17","Jes 10:13","Ezech 28:2","Ezech 28:17","Dan 4:30","Hab 1:16"]}],"3":[{"kopje":"Wie","refs":["Deut 20:8","Matt 13:21","Luk 14:25-33","Openb 17:14","Openb 21:8"]},{"kopje":"tweeëntwintigduizend","refs":["Matt 20:16"]}],"4":[{"kopje":"volk","refs":["P jv\" data-code=\"H7725\">return</span> and depart <span class=\"wl wl-kjv\" data-code=\"H6852\">early</span> from <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead.</span> And there <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand;</span> and there <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> thousand.","4":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> The <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are yet too <span class=\"wl wl-kjv\" data-code=\"H7227\">many;</span> bring them <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6884\">try</span> them for thee there: and it shall be, that of whom I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto thee, This shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thee, the same shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thee; and of whomsoever I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto thee, This shall not <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thee, the same shall not go.","5":"So he brought <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4325\">water:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> Every one that <span class=\"wl wl-kjv\" data-code=\"H3952\">lappeth</span> of the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> with his <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue,</span> as a <span class=\"wl wl-kjv\" data-code=\"H3611\">dog</span> <span class=\"wl wl-kjv\" data-code=\"H3952\">lappeth,</span> him shalt thou <span class=\"wl wl-kjv\" data-code=\"H3322\">set</span> by himself; likewise every one that boweth <span class=\"wl wl-kjv\" data-code=\"H3766\">down</span> upon his <span class=\"wl wl-kjv\" data-code=\"H1290\">knees</span> to drink.","6":"And the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of them that <span class=\"wl wl-kjv\" data-code=\"H3952\">lapped,</span> putting their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to their <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> were <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men:</span> but all the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> bowed <span class=\"wl wl-kjv\" data-code=\"H3766\">down</span> upon their <span class=\"wl wl-kjv\" data-code=\"H1290\">knees</span> to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> water.","7":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> By the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H3952\">lapped</span> will I <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> you, and <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites</span> into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and let all the other <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> unto his place.","8":"So the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H6720\">victuals</span> in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and their <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H376\">all</span> the rest of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> unto his <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">retained</span> those <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian</span> was beneath him in the valley.","9":"And it came to pass the same <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> get thee <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">host;</span> for I have <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> it into thine hand.","10":"But if thou <span class=\"wl wl-kjv\" data-code=\"H3373\">fear</span> to go <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">go</span> thou with <span class=\"wl wl-kjv\" data-code=\"H6513\">Phurah</span> thy <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the host:","11":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> what they <span class=\"wl wl-kjv\" data-code=\"H1696\">say;</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> shall thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> be <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> to go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">host.</span> Then went he <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with <span class=\"wl wl-kjv\" data-code=\"H6513\">Phurah</span> his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7097\">outside</span> of the armed <span class=\"wl wl-kjv\" data-code=\"H2571\">men</span> that were in the host.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites</span> and the <span class=\"wl wl-kjv\" data-code=\"H6002\">Amalekites</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H6924\">east</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">lay</span> along in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> like <span class=\"wl wl-kjv\" data-code=\"H697\">grasshoppers</span> for <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude;</span> and their <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> were without <span class=\"wl wl-kjv\" data-code=\"H4557\">number,</span> as the <span class=\"wl wl-kjv\" data-code=\"H2344\">sand</span> by the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">side</span> for multitude.","13":"And when <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> behold, there was a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> unto his <span class=\"wl wl-kjv\" data-code=\"H7453\">fellow,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, I <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed</span> a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> and, lo, a <span class=\"wl wl-kjv\" data-code=\"H6742\">cake</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> <span class=\"wl wl-kjv\" data-code=\"H2015\">tumbled</span> into the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto a <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> it that it <span class=\"wl wl-kjv\" data-code=\"H5307\">fell,</span> and <span class=\"wl wl-kjv\" data-code=\"H2015\">overturned</span> it, that the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> lay along.","14":"And his <span class=\"wl wl-kjv\" data-code=\"H7453\">fellow</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This is nothing else save the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash,</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> for into his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> hath <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> and all the host.","15":"And it was so, when <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H4557\">telling</span> of the <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7667\">interpretation</span> thereof, that he <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> into the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of Midian.","16":"And he <span class=\"wl wl-kjv\" data-code=\"H2673\">divided</span> the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> into <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">companies,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> in every man's <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> with <span class=\"wl wl-kjv\" data-code=\"H7386\">empty</span> <span class=\"wl wl-kjv\" data-code=\"H3537\">pitchers,</span> and <span class=\"wl wl-kjv\" data-code=\"H3940\">lamps</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">within</span> the pitchers.","17":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H7200\">Look</span> on me, and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> likewise: and, behold, when I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H7097\">outside</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> it shall be that, as I <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> so shall ye do.","18":"When I <span class=\"wl wl-kjv\" data-code=\"H8628\">blow</span> with a <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> I and all that are with me, then <span class=\"wl wl-kjv\" data-code=\"H8628\">blow</span> ye the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets</span> also on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side</span> of all the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> The sword of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and of Gideon.","19":"So <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that were with him, <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7097\">outside</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> in the <span class=\"wl wl-kjv\" data-code=\"H7218\">beginning</span> of the <span class=\"wl wl-kjv\" data-code=\"H8484\">middle</span> <span class=\"wl wl-kjv\" data-code=\"H821\">watch;</span> and they had <span class=\"wl wl-kjv\" data-code=\"H389\">but</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">newly</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H8104\">watch:</span> and they <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets,</span> and <span class=\"wl wl-kjv\" data-code=\"H5310\">brake</span> the <span class=\"wl wl-kjv\" data-code=\"H3537\">pitchers</span> that were in their hands.","20":"And the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">companies</span> <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets,</span> and <span class=\"wl wl-kjv\" data-code=\"H7665\">brake</span> the <span class=\"wl wl-kjv\" data-code=\"H3537\">pitchers,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">held</span> the <span class=\"wl wl-kjv\" data-code=\"H3940\">lamps</span> in their <span class=\"wl wl-kjv\" data-code=\"H8040\">left</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets</span> in their <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> to <span class=\"wl wl-kjv\" data-code=\"H8628\">blow</span> withal: and they <span class=\"wl wl-kjv\" data-code=\"H7121\">cried,</span> The <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and of Gideon.","21":"And they <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in his place round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp:</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">ran,</span> and <span class=\"wl wl-kjv\" data-code=\"H7321\">cried,</span> and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled.</span>","22":"And the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> against his <span class=\"wl wl-kjv\" data-code=\"H7453\">fellow,</span> even throughout all the <span class=\"wl wl-kjv\" data-code=\"H4264\">host:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> to <span class=\"wl wl-kjv\" data-code=\"H1029\">Bethshittah</span> in <span class=\"wl wl-kjv\" data-code=\"H6888\">Zererath,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H8193\">border</span> of <span class=\"wl wl-kjv\" data-code=\"H65\">Abelmeholah,</span> unto Tabbath.","23":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6817\">together</span> out of <span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali,</span> and out of <span class=\"wl wl-kjv\" data-code=\"H836\">Asher,</span> and out of all <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the Midianites.","24":"And <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> throughout all <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites,</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> before them the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> unto <span class=\"wl wl-kjv\" data-code=\"H1012\">Bethbarah</span> and <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan.</span> Then all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6817\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> unto <span class=\"wl wl-kjv\" data-code=\"H1012\">Bethbarah</span> and Jordan.","25":"And they <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H4080\">Midianites,</span> <span class=\"wl wl-kjv\" data-code=\"H6159\">Oreb</span> and <span class=\"wl wl-kjv\" data-code=\"H2062\">Zeeb;</span> and they <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H6159\">Oreb</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock</span> <span class=\"wl wl-kjv\" data-code=\"H6159\">Oreb,</span> and <span class=\"wl wl-kjv\" data-code=\"H2062\">Zeeb</span> they <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> at the <span class=\"wl wl-kjv\" data-code=\"H3342\">winepress</span> of <span class=\"wl wl-kjv\" data-code=\"H2062\">Zeeb,</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">heads</span> of <span class=\"wl wl-kjv\" data-code=\"H6159\">Oreb</span> and <span class=\"wl wl-kjv\" data-code=\"H2062\">Zeeb</span> to <span class=\"wl wl-kjv\" data-code=\"H1439\">Gideon</span> on the other <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> Jordan."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"(dewelke is Gideon)","tekst":"Zie boven, Jdg 6:32."},{"catchword":"van Harod;","tekst":"Hebreeuws, Charod; gelegen aan de grenzen van Manasse, aan deze zijde van het gebergte, achter hetwelk de Midianieten gelegerd waren aan de andere zijde. Zie Jdg 6:33. Dezen naam mag de fontein gekregen hebben van het vrezen en sidderen der 22.000 Israëlieten, onder, vs.3. Een andere fontein was er bij Jizreël, aan het einde van dit gebergte, westwaarts. Zie 1Sa 29:1."},{"catchword":"More,","tekst":"Dit schijnt geweest te zijn een van de bergen Gilboa; alzo genoemd van den tijdigen regen; vallende zeer mildelijk op de velden, die op de hoogte van dien gelegen waren, gelijk sommigen afnemen uit vergelijking van 2Sa 1:21. Op dit gebergte Gilboa werd ook Saul van de Filistijnen verslagen, 1Sa 31:1."},{"catchword":"dal","tekst":"Jizreël, gelijk boven, Jdg 6:33."}],"2":[{"catchword":"hand heeft mij verlost","tekst":"Of, mijn hand, [dat is, macht] heeft mij heil, of verlossing beschikt, aangebracht, de overwinning gemaakt. Zie gelijke manier van spreken Exo 8:19."}],"3":[{"catchword":"roep nu uit voor de oren des volks,","tekst":"Dat is, laat uitroepen en zeggen."},{"catchword":"Wie blode","tekst":"Vergelijk Deu 20:8."},{"catchword":"versaagd is,","tekst":"Of, bevende, sidderende, vervaard."},{"catchword":"spoede zich","tekst":"Of, vliege heen, verpakke zich dezen morgen, of vroeg. Het Hebreeuwse woord schijnt te zien op het snel vliegen der vogeltjes, en alzo voorts te betekenen: haastelijk, spoediglijk doorgaan, enz."},{"catchword":"naar het gebergte van Gilead","tekst":"Hebreeuws, van, of tegen het gebergte Gileads; dat is, langs den weg, die naar en van dat gebergte gaat; zijnde dit gebergte gelegen recht tegenover Gideons leger, over de Jordaan, vanwaar die van den halven stam van Manasse tot hem gekomen waren. Zie boven, Jdg 6:35."}],"4":[{"catchword":"beproeven;","tekst":"Hebreeuws eigenlijk, scheiden, reinigen; gelijk een goudsmid het zilver reinigt, scheidende het goed zilver van het schuim."}],"5":[{"catchword":"uit het water zal lekken,","tekst":"Dat hij staande met de hand zal geschept hebben, gelijk verklaard wordt vs.6. Dit was een teken van kloekmoedigheid en wakkerheid, gelijk het bukken op de knieën een teken van lafhartigheid en traagheid."}],"7":[{"catchword":"al dat volk weggaan,","tekst":"Versta, het andere, overige volk."}],"8":[{"catchword":"En het volk nam den teerkost in hun hand,","tekst":"Anders, toen namen zij den teerkost des volks in hun hand, mitsgaders derzelver bazuinen; te weten, die drie honderd namen van het volk teerkost voor zich, zoveel hun nodig was, alsook bazuinen, te weten, drie honderd [ vs.16], houdende de weggaanden nog twintig, naar sommiger rekening, alzo het ganse heir van Gideon tevoren 32.000 sterk was; boven, vs.3; hebbende elke duizend tien bazuinen, of elke honderd een."},{"catchword":"hij liet","tekst":"Gideon."},{"catchword":"die mannen","tekst":"Te weten, de anderen; gelijk in vs.7."},{"catchword":"beneden in het dal","tekst":"Aan de andere zijde van het gebergte, zodat hij het voor zich had in het dal Jizreël, toen hij op den berg stond, waar ook het leger van Gideon voor een deel mag hebben gelegen, gelijk af te nemen is uit vs.9."}],"9":[{"catchword":"leger,","tekst":"Der Midianieten."}],"10":[{"catchword":"af te gaan,","tekst":"Te weten, alleen."}],"11":[{"catchword":"handen gesterkt worden,","tekst":"Dat is, gij zult moedig en vaardig worden om hun leger aan te grijpen."},{"catchword":"schildwachten,","tekst":"Het Hebreeuwse woord is eigenlijk te zeggen: gevijfde, die bij vijven, of vijf sterk in het gelid plegen te marcheren, gelijk te zien is Exo 13:18. Hiervan komt voorts de betekenis van gewapenden, gelijk de tochtorden, en inzonderheid schildwachten, gemeenlijk moeten zijn."}],"12":[{"catchword":"lagen in het dal,","tekst":"Hebreeuws, vielen, of waren gevallen in het dal; dat is, zij lagen verspreid in het dal."},{"catchword":"sprinkhanen in menigte,","tekst":"Zie boven, Jdg 6:5."},{"catchword":"ontelbaar,","tekst":"Gelijk boven, Jdg 6:5."},{"catchword":"oever der zee is,","tekst":"Hebreeuws, aan de lip der zee."}],"13":[{"catchword":"geroost gerstebrood","tekst":"Of, een taart van gerstebrood. Anders, een gedruis van een gerstebrood. Dit geeft te kennen de slechtigheid en verachtelijkheid van het middel, waardoor God Midian slaan en zijn volk verlossen zou."},{"catchword":"het onderste boven,","tekst":"Hebreeuws, keerde haar om naar boven."}],"15":[{"catchword":"uitlegging hoorde,","tekst":"Hebreeuws, breking; dat is, ontleding, uitlegging, oplossing. Het schijnt dat de manier van spreken ontleend is aan vruchten, die harde schillen hebben en gebroken moeten worden, eer men de kern kan eten."},{"catchword":"aanbad hij;","tekst":"Hebreeuws, boog hij zich. Eerende en dankende God vanwege zijn wonderlijke regering en dezen troost. Zie Gen 22:5."}],"16":[{"catchword":"hopen;","tekst":"Hebreeuws, hoofden; alzo onder, vs.20, en Jdg 9:34."},{"catchword":"een iegelijk","tekst":"Hebreeuws, hij gaf bazuinen in de hand van hen allen."}],"17":[{"catchword":"naar mij en doet","tekst":"Hebreeuws, ziet, of, gij zult zien van, of, uit mij; dat is, naar den aard der Hebreeuwse spraak somtijds zoveel als: na, of, op mij, tegen mij aan. Vergelijk boven, vs.3. Anders kan men het ook aldus overzetten: uit, of van mij zult gij zien en alzo doen; dat is, gij zult van mij, of uit mij leren en bemerken wat gij doen zult."},{"catchword":"alzo;","tekst":"Gelijk gij mij ziet doen."}],"18":[{"catchword":"Voor den HEERE en voor Gideon","tekst":"Versta hierop: wordt deze strijd gevoerd. Alzo wordt de Hebreeuwse letter lamed in zaken van strijd gebruikt, Exo 14:14, Exo 14:25, of aldus: den HEERE en Gideon; te weten, zij de overwinning. Of, des HEEREN en Gideons; te weten, is het zwaard, uit vs.20."}],"19":[{"catchword":"middelste nachtwaak,","tekst":"Dat is, omtrent middernacht, wanneer de wachten wel plegen veranderd te worden."},{"catchword":"als zij maar even","tekst":"Hebreeuws, stellende hadden zij gesteld. Anders, doch zij hadden de wachters al opgewekt, of zij wekten alleenlijk de wachters op"},{"catchword":"sloegen zij de kruiken,","tekst":"Of, sloegen haar tegen elkander, alzo dat de stukken hier en daar verstrooid werden. Vergelijk Psa 2:9; Jer 13:14, en Jer 48:12."}],"22":[{"catchword":"zette de HEERE","tekst":"Dat is, beschikte."},{"catchword":"een tegen den anderen,","tekst":"Hebreeuws, des mans tegen zijn naasten, of metgezel; dat is, de Heere beschikte dat zij elkander, als vijanden, door verbaasdheid op het lijf vielen en ombrachten."},{"catchword":"Beth-sitta","tekst":"Uit het dal waar zij waren gelegerd geweest, langs het gebergte naar de Jordaan, en weder langs de Jordaan landwaarts in; waar Abel-Mehola en Tabbath lagen in Manasse. Zie van Abel-Mehola 1Ki 4:12, en 1Ki 19:16."},{"catchword":"grens van Abel-mehóla,","tekst":"Hebreeuws, lip."}],"24":[{"catchword":"gebergte van Efraïm,","tekst":"Aan de andere zijde van Manasse zuidwaarts gelegen, opdat de Midianieten, van beide zijden besloten en van de Jordaan verstoken zijnde, nergens heen mochten ontkomen. Maar intussen waren Zebah en Tsalmuna met omtrent 15.000 man over de Jordaan geraakt, die Gideon met zijn 300 man nagejaagd en verslagen heeft. Zie Jdg 8:10, Jdg 8:12."},{"catchword":"Beth-bára,","tekst":"Nabij de Jordaan gelegen; dit houden sommigen voor Bethabara; Joh 1:28."},{"catchword":"en de Jordaan","tekst":"Dat is, hier, naar veler gevoelen, zoveel als: te weten."}],"25":[{"catchword":"Oreb,","tekst":"Gelegen bij het oosteinde van het gebergte Efraïms, niet ver van de Jordaan. Deze plaats is naderhand alzo genoemd vanwege deze geschiedenis, gelijk ook de andere plaats Zeëb."},{"catchword":"in de perskuip van Zeëb,","tekst":"Anders, bij, of, aan."},{"catchword":"over de Jordaan","tekst":"Of, aan deze zijde. Want het Hebreeuwse woord, naar gelegenheid der zaken, betekent beiden. In Jdg 8 wordt verhaald dat Gideon met zijn 300 mannen over de Jordaan getrokken is, om de Midianieten en de anderen van het oosten na te jagen. Zie aldaar Jdg 8:4. Het meeste gevoelen is, dat dit en hetgeen in Jdg 8:1-3, volgt, hier vooraf verhaald wordt, om hetgeen door die van Efraïm aan deze zijde der Jordaan kloekelijk verricht is, te voltrekken, doch dat het eerst gebeurd is, toen Gideon van het najagen over de Jordaan en de volle victorie wederkeerde. Maar de aandachtige lezer zal kunnen oordelen, uit vergelijking van vs.25 met Jdg 8:3. Zie de aantekeningen aldaar."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then Jerubbaal (who is Gideon), [See above chap. 6.33.] rose up early, and all the people that were with him, and they camped themselves at the fountain of Harod: [Heb. Charod, lying on the borders of Manasseh, on this side of the mountain, behind which the Midiates were camped on the other side. See chap.6. On v 33. This name the fountain might have obtained from the fear and trembling of the 22000. Israelites, below v.3. There was another fountain by Jisreel, at the end of this mountain Westward. See 1 Sam.29. 1.] so that he had the half of the Midianites toward the North, behind the hill More, [This seemeth to have been one of the mountains of Gilboa: so called from the timely, or seasonable rain, that fell in great abundance upon the fields that lay on the top of it; as some do gather, by comparing of 2 Sam.1.21. Upon this mountain Gilboa was Saul also slain by the Philistines, 1 Sam.31.1.] in the valley.[viz. Jizreel, as above chap.33.]"}],"2":[{"catchword":null,"tekst":"And the LORD said unto Gideon ;The people that are with thee are too many ,that l should deliver Midianites into they hand: left Israel vaunt themselves against me saying ,my hand hath deliver me.[Or my hand hath brought me salvation ,or deliverance, procured the victory. See the like phrase ,Exodus.8.9.]"}],"3":[{"catchword":null,"tekst":"Now then proclaim [that is cause to be proclaimed or published] now before (or in) the people saying; whoever is fearful [Deutronomy20.vs.8] and dismayed,[or quaketh, trembleth, is afraid] let him return and make baste [or fly away, pack himself away this morning, or early. The Hebrew word seemeth to look at go on speedily, quickly, hastily,] to the mountain Gilead: [Hebrews, from, or, towards the mountain of Gilead; i.e. along the way that goeth toward and from that mountain, being the same mountain that lay right over against Gideons army, beyond the Jordan, from whence those of the half tribe of Manasseh were come to him. See above chap 6.on v.36.] Then (there) returned of the people two and twenty thousand, (so) that they remained ten thousand."}],"4":[{"catchword":null,"tekst":"And the LORD said unto Gideon; the people are yet too many, make them go down to the water, and I will try them [Heb. properly, separate, purifie, as a Goldsmith purifieth the silver, separating the good metal from the dross] for thee there: and it shall be, (that) of whom I shall say unto thee; This shall go with thee, the same shall go with thee: but also those of whom I shall say: This shall not go with thee, the same shall not go with thee."}],"5":[{"catchword":null,"tekst":"And he made the people go down to the water: then said the LORD unto Gideon; Whosoever shall lap with his tongue of water. [viz. which he in a standing posture shall have taken up with hand, as is declared, v.6. This was a token of courage and nimbleness: as the bending of the knee was a token of flowness and laziness] according as a dog would lap, him shalt thou set alone by himself; likewise every one that shall bow down upon his knees for to drink."}],"6":[{"catchword":null,"tekst":"Then was the number of those that had lapped with their hand (put) to their mouth, three hundred men, but all the rest of the people had bowed down upon their knees to drink water."}],"7":[{"catchword":null,"tekst":"And the LORD said unto Gideon; by these three hundred man that have lapped, will I deliver you, and give the Midianites to thine hand: therefore let all that people [Understand the rest of the people] depart, every man unto his place."}],"8":[{"catchword":null,"tekst":"And the people took victual in their hand, and their trumpets; [Otherwise, then they took the victual of the people in their hand, as also their trumpets. To wit, those three hundred men took of the people victual for themselves, so much as was needful, as also trumpets, to wit, three hundred, (v.16.) holding in their march, as they went, yet twenty more, according to the account of some; for Gideons army was at first 32000 strong, as appeareth above v.3. each thousand having ten trumpets, or each hundred one] and he [viz. Gideon] let all those men of Israel [viz. all the rest, as in the former verse] go, every men unto the tent, but he kept those three hundred men: and he had the host of the Midiantes beneath in the valley. [On the other side of the mountain, so that he had it before him, in the valley of Jizreel, when he stood upon the mount, where also it may be a part of Gideons camp lay, as may be gathered from the following verse]"}],"9":[{"catchword":null,"tekst":"And it came to pass the same night, that the LORD said unto him; Arise, go thy ways into the camp: [viz. of the Midianites] for I have delivered it into thine hand."}],"10":[{"catchword":null,"tekst":"But if thou fear to go down, [viz. thy self alo // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {

// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)

  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
