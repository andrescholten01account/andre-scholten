God, vierhonderdduizend man te voet, die het zwaard uittrokken.", "3": "(De kinderen van Benjamin nu hoorden dat de kinderen van Israël opgetrokken waren naar Mizpa.) En de kinderen van Israël zeiden: Vertel ons, hoe is dit kwaad gebeurd?", "4": "Toen antwoordde de Levitische man, de man van de vrouw die gedood was, en zei: Ik kwam met mijn bijvrouw te Gibea, dat van Benjamin is, om te overnachten.", "5": "En de burgers van Gibea maakten zich tegen mij op, en omringden het huis in de nacht om mij heen; zij waren van plan mij te doden, en mijn bijvrouw hebben zij verkracht, zodat zij gestorven is.", "6": "Toen greep ik mijn bijvrouw, en deelde haar in stukken, en zond haar in het hele land van de erfenis van Israël, omdat zij een schandelijke daad en dwaasheid in Israël gedaan hadden.", "7": "Zie, u bent allen kinderen van Israël, geef hier voor u woord en raad!", "8": "Toen maakte heel het volk zich op, als één man, en zei: Wij zullen niet gaan, ieder naar zijn tent, en niet wijken, ieder naar zijn huis.", "9": "Maar nu, dit is de zaak die wij tegen Gibea zullen doen: tegen haar bij het lot!", "10": "En wij zullen tien mannen nemen van honderd, van alle stammen van Israël, en honderd van duizend, en duizend van tienduizend, om proviand te nemen voor het volk, zodat zij, wanneer zij komen te Gibea-van-Benjamin, met haar doen naar al de dwaasheid die zij in Israël gedaan heeft.", "11": "Zo werden alle mannen van Israël verzameld bij deze stad, verbonden als één man.", "12": "En de stammen van Israël zonden mannen door de hele stam van Benjamin, en zeiden: Wat voor een kwaad is dit, dat onder u gebeurd is?", "13": "Geef nu dan die mannen, die kinderen van Belial, die te Gibea zijn, zodat wij hen doden en het kwaad uit Israël wegdoen. Doch de kinderen van Benjamin wilden niet luisteren naar de stem van hun broeders, de kinderen van Israël.", "14": "Maar de kinderen van Benjamin verzamelden zich uit de steden naar Gibea, om uit te trekken ten strijde tegen de kinderen van Israël.", "15": "En de kinderen van Benjamin werden op die dag geteld uit de steden, zesentwintigduizend man, die het zwaard uittrokken, behalve de inwoners van Gibea, die geteld werden, zevenhonderd uitgelezen mannen.", "16": "Onder al dit volk waren zevenhonderd uitgelezen mannen, die linkshandig waren; deze allen slingerden met een steen op een haar nauwkeurig, zodat het hun niet miste.", "17": "En de mannen van Israël werden geteld, behalve Benjamin, vierhonderdduizend man, die het zwaard uittrokken; deze allen waren mannen van oorlog.", "18": "En de kinderen van Israël maakten zich op, en trokken op naar het huis van God, en vroegen God om raad, en zeiden: Wie zal onder ons als eerste optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zei: Juda als eerste.", "19": "Zo maakten de kinderen van Israël zich in de morgen op, en legerden zich tegen Gibea.", "20": "En de mannen van Israël trokken uit ten strijde tegen Benjamin; vervolgens schikten de mannen van Israël de strijd tegen hen bij Gibea.", "21": "Toen trokken de kinderen van Benjamin uit Gibea, en zij velden op die dag van Israël tweeëntwintigduizend man neer ter aarde.", "22": "Doch het volk versterkte zich, namelijk de mannen van Israël, en zij schikten de strijd opnieuw op de plaats waar zij die op de vorige dag geschikt hadden.", "23": "En de kinderen van Israël trokken op, en weenden voor het aangezicht van de HEERE tot de avond, en vroegen de HEERE en zeiden: Zal ik weer naderen ten strijde tegen de kinderen van Benjamin, mijn broeder? En de HEERE zei: Trek tegen hem op.", "24": "Zo naderden de kinderen van Israël tot de kinderen van Benjamin, op de tweede dag.", "25": "En die van Benjamin trokken hun tegemoet, uit Gibea, op de tweede dag, en velden van de kinderen van Israël nog achttienduizend man neer ter aarde; die allen trokken het zwaard uit.", "26": "Toen trokken alle kinderen van Israël en heel het volk op, en kwamen bij het huis van God, en weenden, en bleven daar voor het aangezicht van de HEERE, en vastten die dag tot de avond; en zij offerden brandoffers en dankoffers voor het aangezicht van de HEERE.", "27": "En de kinderen van Israël vroegen de HEERE, want daar was de ark van het verbond van God in die dagen.", "28": "En Pinehas, de zoon van Eleazar, de zoon van Aäron, stond voor Zijn aangezicht in die dagen, en zei: Zal ik nog meer uittrekken ten strijde tegen de kinderen van Benjamin, mijn broeder, of zal ik ophouden? En de HEERE zei: Trek op, want morgen zal Ik hem in uw hand geven.", "29": "Toen stelde Israël hinderlagen op tegen Gibea rondom.", "30": "En de kinderen van Israël trokken op, op de derde dag, tegen de kinderen van Benjamin; en zij schikten de strijd tegen Gibea, zoals de andere keren.", "31": "Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.", "32": "Toen zeiden de kinderen van Benjamin: Zij zijn voor ons aangezicht geslagen, zoals eerst; maar de kinderen van Israël zeiden: Laat ons vluchten, en hen van de stad aftrekken naar de wegen.", "33": "Toen maakten alle mannen van Israël zich op uit hun plaatsen, en schikten de strijd te Baäl-thamar; ook brak Israëls hinderlaag op uit haar plaats, vanuit de open plek bij Gibea.", "34": "En tienduizend uitgelezen mannen van heel Israël kwamen tegenover Gibea, en de strijd werd zwaar; doch zij wisten niet dat het kwaad hen treffen zou.", "35": "Toen sloeg de HEERE Benjamin voor Israëls aangezicht; zodat de kinderen van Israël op die dag van Benjamin vijfentwintigduizend en honderd man velden; die allen trokken het zwaard uit.", "36": "En de kinderen van Benjamin zagen dat zij geslagen waren; want de mannen van Israël gaven de Benjaminieten plaats, omdat zij vertrouwden op de hinderlaag die zij tegen Gibea gesteld hadden.", "37": "En de hinderlaag haastte zich, en brak voorwaarts naar Gibea toe; ja, de hinderlaag trok recht door, en sloeg de hele stad met de scherpte van het zwaard.", "38": "En de mannen van Israël hadden een afgesproken teken met de hinderlaag, dat zij een grote verheffing van rook uit de stad zouden laten opgaan.", "39": "Zo keerden de mannen van Israël zich om in de strijd; en Benjamin had begonnen te slaan en te doorsteken van de mannen van Israël ongeveer dertig man; want zij zeiden: Zeker, hij is zeker voor ons aangezicht geslagen, zoals in de vorige strijd.", "40": "Toen begon de verheffing op te gaan uit de stad, als een pilaar van rook; toen nu Benjamin achter zich omzag, ziet, zo ging de brand van de stad op naar de hemel.", "41": "En de mannen van Israël keerden zich om; en de mannen van Benjamin werden verbaasd, want zij zagen dat het kwaad hen treffen zou.", "42": "Zo wendden zij zich voor het aangezicht van de mannen van Israël naar de weg van de woestijn; maar de strijd haalde hen in, en die uit de steden vernielden hen in hun midden.", "43": "Zij omringden Benjamin, zij vervolgden hem, zij vertrapten hem gemakkelijk, tot voor Gibea, tegen de opgang van de zon.", "44": "En er vielen van Benjamin achttienduizend man; deze allen waren strijdbare mannen.", "45": "Toen keerden zij zich om, en vluchtten naar de woestijn, tot de rots van Rimmon; maar zij deden een nalezing onder hen op de wegen, van vijfduizend man; verder kleefden zij hen achteraan tot aan Gideom, en sloegen van hen tweeduizend man.", "46": "Zo waren allen die op die dag van Benjamin vielen, vijfentwintigduizend man, die het zwaard uittrokken; die allen waren strijdbare mannen.", "47": "Doch zeshonderd man keerden zich om, en vluchtten naar de woestijn, tot de rots van Rimmon, en bleven bij de rots van Rimmon, vier maanden.", "48": "En de mannen van Israël keerden terug tot de kinderen van Benjamin, en sloegen hen met de scherpte van het zwaard, van de hele stad tot de dieren toe, ja, al wat gevonden werd; ook staken zij alle steden die gevonden werden in brand."}, "SV": {"1": "Toen togen alle kinderen Israëls uit, en de vergadering verzamelde zich, als een enig man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot den HEERE te Mizpa.", "2": "En *uit* de hoeken des ganse volks stelden zich al de stammen van Israël in de vergadering van het volk Gods, vierhonderd duizend man te voet, die het zwaard uittrokken.", "3": "(De kinderen Benjamins nu hoorden, dat de kinderen Israëls opgetogen naar Mizpa.) En de kinderen Israëls zeiden: Spreekt, hoe is dit kwaad geschied?", "4": "Toen antwoordde de Levietische man, de man van de vrouw, die gedood was, en zeide: Ik kwam met mijn bijwijf te Gibea, dewelke Benjamins is, om te vernachten.", "5": "En de burgers van Gibea maakten zich tegen mij op, en omringden tegen mij het huis bij nacht; zij dachten mij te doden, en mijn bijwijf hebben zij geschonden, dat zij gestorven is.", "6": "Toen greep ik mijn bijwijf, en deelde haar, en zond haar in het ganse land der erfenis van Israël, omdat zij een schandelijke daad en dwaasheid in Israël gedaan hadden.", "7": "Ziet, gij allen zijt kinderen Israëls, geeft hier voor ulieden woord en raad!", "8": "Toen maakte zich al het volk op, als een enig man, zeggende: Wij zullen niet gaan, een ieder naar zijn tent, noch wijken, een ieder naar zijn huis.", "9": "Maar nu, dit is de zaak, die wij aan Gibea zullen doen: tegen haar bij het lot!", "10": "En wij zullen tien mannen nemen van honderd, van alle stammen Israëls, en honderd van duizend, en duizend van tienduizend, om teerkost te nemen voor het volk, opdat zij, komende te Gibea-benjamins, *haar* doen naar al de dwaasheid, die zij in Israël gedaan heeft.", "11": "Alzo werden alle mannen van Israël verzameld tot deze stad, verbonden als een enig man.", "12": "En de stammen van Israël zonden mannen door den ganse stam van Benjamin, zeggende: Wat voor een kwaad is dit, dat onder ulieden geschied is?", "13": "Zo geeft nu die mannen, die kinderen Belials, die te Gibea zijn, dat wij hen doden, en het kwaad uit Israël wegdoen. Doch de *kinderen* van Benjamin wilden niet horen naar de stem van hun broederen, de kinderen Israëls.", "14": "Maar de kinderen van Benjamin verzamelden zich uit de steden naar Gibea, om uit te trekken ten strijde tegen de kinderen Israëls.", "15": "En de kinderen van Benjamin werden te dien dage geteld uit de steden, zes en twintig duizend mannen, die het zwaard uittrokken, behalve dat de inwoners van Gibea geteld werden, zevenhonderd uitgelezene mannen.", "16": "Onder al dit volk waren zevenhonderd uitgelezene mannen, welke links waren; deze allen slingerden met een steen op een haar, dat het hun niet miste.", "17": "En de mannen van Israël werden geteld, behalve Benjamin, vierhonderd duizend mannen, die het zwaard uittrokken; deze allen waren mannen van oorlog.", "18": "En de kinderen Israëls maakten zich op, en togen opwaarts ten huize Gods, en vraagden God, en zeiden: Wie zal onder ons vooreerst optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zeide: Juda vooreerst.", "19": "Alzo maakten zich de kinderen Israëls in den morgenstond op, en legerden zich tegen Gibea.", "20": "En de mannen van Israël togen uit ten strijde tegen Benjamin; voorts schikten de mannen Israëls den strijd tegen hen bij Gibea.", "21": "Toen togen de kinderen van Benjamin uit van Gibea, en zij vernielden ter aarde op dien dag van Israël twee en twintig duizend man.", "22": "Doch het volk versterkte zich, *te* *weten* de mannen van Israël, en zij beschikten den strijd wederom ter plaatse, waar zij *dien* des vorigen daags geschikt hadden.", "23": "En de kinderen Israëls togen op, en weenden voor het aangezicht des HEEREN tot op den avond, en vraagden den HEERE zeggende: Zal ik weder genaken ten strijde tegen de kinderen van Benjamin, mijn broeder? En de HEERE zeide: Trekt tegen hem op.", "24": "Zo naderden de kinderen Israëls tot de kinderen van Benjamin, des anderen daags.", "25": "En die van Benjamin trokken uit hun tegemoet, uit Gibea, op den tweeden dag, en velden van de kinderen Israëls nog achttien duizend man neder ter aarde; die allen trokken het zwaard uit.", "26": "Toen togen alle kinderen Israëls en al het volk op, en kwamen ten huize Gods, en weenden, en bleven aldaar voor het aangezicht des HEEREN, en vastten dien dag tot op den avond; en zij offerden brandofferen en dankofferen voor het aangezicht des HEEREN.", "27": "En de kinderen Israëls vraagden den HEERE, want aldaar was de ark des verbonds van God in die dagen.", "28": "En Pinehas, de zoon van Eleazar, den zoon van Aäron, stond voor Zijn aangezicht, in die dagen, zeggende: Zal ik nog meer uittrekken ten strijde tegen de kinderen van Benjamin, mijn broeder, of zal ik ophouden? en de HEERE zeide: Trekt op, want morgen zal Ik hem in uw hand geven.", "29": "Toen bestelde Israël achterlagen op Gibea rondom.", "30": "En de kinderen Israëls togen op, aan den derden dag, tegen de kinderen van Benjamin; en zij schikten *den* *strijd* op Gibea, als op de andere malen.", "31": "Toen togen de kinderen van Benjamin uit, het volk tegemoet, *en* werden van de stad afgetrokken; en zij begonnen te slaan van het volk, *en* te doorsteken, gelijk de andere malen, op de straten, waarvan de een opgaat naar het huis Gods, en de ander naar Gibea, in het veld, omtrent dertig man van Israël.", "32": "Toen zeiden de kinderen van Benjamin: Zij zijn voor ons aangezicht geslagen, als te voren; maar de kinderen Israëls zeiden: Laat ons vlieden, en hen van de stad aftrekken naar de straten.", "33": "Toen maakten zich alle mannen van Israël op uit hun plaatsen, en schikten *den* *strijd* te Baäl-thamar; ook brak Israëls achterlage op uit haar plaats, na de ontbloting van Gibea.", "34": "En tien duizend uitgelezen mannen van gans Israël kwamen van tegenover Gibea, en de strijd werd zwaar; doch zij wisten niet, dat het kwaad hen treffen zou.", "35": "Toen sloeg de HEERE Benjamin voor Israëls aangezicht; dat de kinderen Israëls op dien dag van Benjamin vernielden vijf en twintig duizend en honderd mannen; die allen trokken het zwaard uit.", "36": "En de kinderen van Benjamin zagen, dat zij geslagen waren; want de mannen van Israël gaven den Benjaminieten plaats, omdat zij vertrouwden op de achterlage, die zij tegen Gibea gesteld hadden.", "37": "En de achterlage haastte, en brak voorwaarts naar Gibea toe; ja, de achterlage trok recht door, en sloeg de ganse stad met de scherpte des zwaards.", "38": "En de mannen van Israël hadden een bestemden tijd met de achterlage, wanneer zij een grote verheffing van rook van de stad zouden doen opgaan.", "39": "Zo keerden zich de mannen van Israël om in den strijd; en Benjamin had begonnen te slaan *en* te doorsteken van de mannen van Israël omtrent dertig man; want zij zeiden: Immers is hij zekerlijk voor ons aangezicht geslagen, als in den vorigen strijd.", "40": "Toen begon de verheffing op te gaan van de stad, *als* een pilaar van rook; als nu Benjamin achter zich omzag, ziet, zo ging de brand der stad op naar den hemel.", "41": "En de mannen van Israël keerden zich om; en de mannen van Benjamin werden verbaasd, want zij zagen, dat het kwaad hen treffen zou.", "42": "Zo wendden zij zich voor het aangezicht der mannen van Israël naar den weg der woestijn; maar de strijd kleefde hen aan, en die uit de steden vernielden ze in het midden van hen.", "43": "Zij omringden Benjamin, zij vervolgden hem, zij vertraden hem gemakkelijk, tot voor Gibea, tegen den opgang der zon.", "44": "En er vielen van Benjamin achttien duizend mannen; deze allen waren strijdbare mannen.", "45": "Toen keerden zij zich, en vloden naar de woestijn, tot den rotssteen van Rimmon; maar zij deden een nalezing onder hen op de straten, van vijf duizend man; voorts kleefden zij hen achteraan tot aan Gideom, en sloegen van hen twee duizend man.", "46": "Alzo waren allen, die op dien dag van Benjamin vielen, vijf en twintig duizend mannen, die het zwaard uittrokken; die allen waren strijdbare mannen.", "47": "Doch zeshonderd mannen keerden zich, en vloden naar de woestijn, tot den rotssteen van Rimmon, en bleven in den rotssteen van Rimmon, vier maanden.", "48": "En de mannen van Israël keerden weder tot de kinderen van Benjamin, en sloegen hen met de scherpte des zwaards, die van de gehele stad tot de beesten toe, ja, al wat gevonden werd; ook zetten zij alle steden, die gevonden werden, in het vuur."}, "KJV": {"1": "Then all the children of Israel went out, and the congregation was gathered together as one man, from Dan even to Beersheba, with the land of Gilead, unto the LORD in Mizpeh.", "2": "And the chief of all the people, *even* of all the tribes of Israel, presented themselves in the assembly of the people of God, four hundred thousand footmen that drew sword.", "3": "(Now the children of Benjamin heard that the children of Israel were gone up to Mizpeh.) Then said the children of Israel, Tell *us*, how was this wickedness?", "4": "And the Levite, the husband of the woman that was slain, answered and said, I came into Gibeah that *belongeth* to Benjamin, I and my concubine, to lodge.", "5": "And the men of Gibeah rose against me, and beset the house round about upon me by night, *and* thought to have slain me: and my concubine have they forced, that she is dead.", "6": "And I took my concubine, and cut her in pieces, and sent her throughout all the country of the inheritance of Israel: for they have committed lewdness and folly in Israel.", "7": "Behold, ye *are* all children of Israel; give here your advice and counsel.", "8": "And all the people arose as one man, saying, We will not any *of us* go to his tent, neither will we any *of us* turn into his house.", "9": "But now this *shall be* the thing which we will do to Gibeah; *we will go up* by lot", "10": "And we will take ten men of an hundred throughout all the tribes of Israel, and an hundred of a thousand, and a thousand out of ten thousand, to fetch victual for the people, that they may do, when they come to Gibeah of Benjamin, according to all the folly that they have wrought in Israel.", "11": "So all the men of Israel were gathered against the city, knit together as one man.", "12": "And the tribes of Israel sent men through all the tribe of Benjamin, saying, What wickedness *is* this that is done", "13": "Now therefore deliver *us* the men, the children of Belial, which *are* in Gibeah, that we may put them to death, and put away evil from Israel. But the children of Benjamin would not hearken to the voice of their brethren the children of Israel:", "14": "But the children of Benjamin gathered themselves together out of the cities unto Gibeah, to go out to battle against the children of Israel.", "15": "And the children of Benjamin were numbered at that time out of the cities twenty and six thousand men that drew sword, beside the inhabitants of Gibeah, which were numbered seven hundred chosen men.", "16": "Among all this people *there were* seven hundred chosen men lefthanded; every one could sling stones at an hair *breadth*, and not miss.", "17": "And the men of Israel, beside Benjamin, were numbered four hundred thousand men that drew sword: all these *were* men of war.", "18": "And the children of Israel arose, and went up to the house of God, and asked counsel of God, and said, Which of us shall go up first to the battle against the children of Benjamin? And the LORD said, Judah *shall go up* first.", "19": "And the children of Israel rose up in the morning, and encamped against Gibeah.", "20": "And the men of Israel went out to battle against Benjamin; and the men of Israel put themselves in array to fight against them at Gibeah.", "21": "And the children of Benjamin came forth out of Gibeah, and destroyed down to the ground of the Israelites that day twenty and two thousand men.", "22": "And the people the men of Israel encouraged themselves, and set their battle again in array in the place where they put themselves in array the first day.", "23": "(And the children of Israel went up and wept before the LORD until even, and asked counsel of the LORD, saying, Shall I go up again to battle against the children of Benjamin my brother? And the LORD said, Go up", "24": "And the children of Israel came near against the children of Benjamin the second day.", "25": "And Benjamin went forth against them out of Gibeah the second day, and destroyed down to the ground of the children of Israel again eighteen thousand men; all these drew the sword.", "26": "Then all the children of Israel, and all the people, went up, and came unto the house of God, and wept, and sat there before the LORD, and fasted that day until even, and offered burnt offerings and peace offerings before the LORD.", "27": "And the children of Israel enquired of the LORD, (for the ark of the covenant of God *was* there in those days,", "28": "And Phinehas, the son of Eleazar, the son of Aaron, stood before it in those days,) saying, Shall I yet again go out to battle against the children of Benjamin my brother, or shall I cease? And the LORD said, Go up; for to morrow I will deliver them into thine hand.", "29": "And Israel set liers in wait round about Gibeah.", "30": "And the children of Israel went up against the children of Benjamin on the third day, and put themselves in array against Gibeah, as at other times.", "31": "And the children of Benjamin went out against the people, *and* were drawn away from the city; and they began to smite of the people, *and* kill, as at other times, in the highways, of which one goeth up to the house of God, and the other to Gibeah in the field, about thirty men of Israel.", "32": "And the children of Benjamin said, They *are* smitten down before us, as at the first. But the children of Israel said, Let us flee, and draw them from the city unto the highways.", "33": "And all the men of Israel rose up out of their place, and put themselves in array at Baaltamar: and the
