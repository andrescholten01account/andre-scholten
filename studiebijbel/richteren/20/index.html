Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa.","2":"En de leiders van heel het volk stelden zich op, alle stammen van Israël, in de vergadering van het volk van God, vierhonderdduizend man te voet, die het zwaard uittrokken.","3":"(De kinderen van Benjamin nu hoorden dat de kinderen van Israël opgetrokken waren naar Mizpa.) En de kinderen van Israël zeiden: Vertel ons, hoe is dit kwaad gebeurd?","4":"Toen antwoordde de Levitische man, de man van de vrouw die gedood was, en zei: Ik kwam met mijn bijvrouw te Gibea, dat van Benjamin is, om te overnachten.","5":"En de burgers van Gibea maakten zich tegen mij op, en omringden het huis in de nacht om mij heen; zij waren van plan mij te doden, en mijn bijvrouw hebben zij verkracht, zodat zij gestorven is.","6":"Toen greep ik mijn bijvrouw, en deelde haar in stukken, en zond haar in het hele land van de erfenis van Israël, omdat zij een schandelijke daad en dwaasheid in Israël gedaan hadden.","7":"Zie, u bent allen kinderen van Israël, geef hier voor u woord en raad!","8":"Toen maakte heel het volk zich op, als één man, en zei: Wij zullen niet gaan, ieder naar zijn tent, en niet wijken, ieder naar zijn huis.","9":"Maar nu, dit is de zaak die wij tegen Gibea zullen doen: tegen haar bij het lot!","10":"En wij zullen tien mannen nemen van honderd, van alle stammen van Israël, en honderd van duizend, en duizend van tienduizend, om proviand te nemen voor het volk, zodat zij, wanneer zij komen te Gibea-van-Benjamin, met haar doen naar al de dwaasheid die zij in Israël gedaan heeft.","11":"Zo werden alle mannen van Israël verzameld bij deze stad, verbonden als één man.","12":"En de stammen van Israël zonden mannen door de hele stam van Benjamin, en zeiden: Wat voor een kwaad is dit, dat onder u gebeurd is?","13":"Geef nu dan die mannen, die kinderen van Belial, die te Gibea zijn, zodat wij hen doden en het kwaad uit Israël wegdoen. Doch de kinderen van Benjamin wilden niet luisteren naar de stem van hun broeders, de kinderen van Israël.","14":"Maar de kinderen van Benjamin verzamelden zich uit de steden naar Gibea, om uit te trekken ten strijde tegen de kinderen van Israël.","15":"En de kinderen van Benjamin werden op die dag geteld uit de steden, zesentwintigduizend man, die het zwaard uittrokken, behalve de inwoners van Gibea, die geteld werden, zevenhonderd uitgelezen mannen.","16":"Onder al dit volk waren zevenhonderd uitgelezen mannen, die linkshandig waren; deze allen slingerden met een steen op een haar nauwkeurig, zodat het hun niet miste.","17":"En de mannen van Israël werden geteld, behalve Benjamin, vierhonderdduizend man, die het zwaard uittrokken; deze allen waren mannen van oorlog.","18":"En de kinderen van Israël maakten zich op, en trokken op naar het huis van God, en vroegen God om raad, en zeiden: Wie zal onder ons als eerste optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zei: Juda als eerste.","19":"Zo maakten de kinderen van Israël zich in de morgen op, en legerden zich tegen Gibea.","20":"En de mannen van Israël trokken uit ten strijde tegen Benjamin; vervolgens schikten de mannen van Israël de strijd tegen hen bij Gibea.","21":"Toen trokken de kinderen van Benjamin uit Gibea, en zij velden op die dag van Israël tweeëntwintigduizend man neer ter aarde.","22":"Doch het volk versterkte zich, namelijk de mannen van Israël, en zij schikten de strijd opnieuw op de plaats waar zij die op de vorige dag geschikt hadden.","23":"En de kinderen van Israël trokken op, en weenden voor het aangezicht van de HEERE tot de avond, en vroegen de HEERE en zeiden: Zal ik weer naderen ten strijde tegen de kinderen van Benjamin, mijn broeder? En de HEERE zei: Trek tegen hem op.","24":"Zo naderden de kinderen van Israël tot de kinderen van Benjamin, op de tweede dag.","25":"En die van Benjamin trokken hun tegemoet, uit Gibea, op de tweede dag, en velden van de kinderen van Israël nog achttienduizend man neer ter aarde; die allen trokken het zwaard uit.","26":"Toen trokken alle kinderen van Israël en heel het volk op, en kwamen bij het huis van God, en weenden, en bleven daar voor het aangezicht van de HEERE, en vastten die dag tot de avond; en zij offerden brandoffers en dankoffers voor het aangezicht van de HEERE.","27":"En de kinderen van Israël vroegen de HEERE, want daar was de ark van het verbond van God in die dagen.","28":"En Pinehas, de zoon van Eleazar, de zoon van Aäron, stond voor Zijn aangezicht in die dagen, en zei: Zal ik nog meer uittrekken ten strijde tegen de kinderen van Benjamin, mijn broeder, of zal ik ophouden? En de HEERE zei: Trek op, want morgen zal Ik hem in uw hand geven.","29":"Toen stelde Israël hinderlagen op tegen Gibea rondom.","30":"En de kinderen van Israël trokken op, op de derde dag, tegen de kinderen van Benjamin; en zij schikten de strijd tegen Gibea, zoals de andere keren.","31":"Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.","32":"Toen zeiden de kinderen van Benjamin: Zij zijn voor ons aangezicht geslagen, zoals eerst; maar de kinderen van Israël zeiden: Laat ons vluchten, en hen van de stad aftrekken naar de wegen.","33":"Toen maakten alle mannen van Israël zich op uit hun plaatsen, en schikten de strijd te Baäl-thamar; ook brak Israëls hinderlaag op uit haar plaats, vanuit de open plek bij Gibea.","34":"En tienduizend uitgelezen mannen van heel Israël kwamen tegenover Gibea, en de strijd werd zwaar; doch zij wisten niet dat het kwaad hen treffen zou.","35":"Toen sloeg de HEERE Benjamin voor Israëls aangezicht; zodat de kinderen van Israël op die dag van Benjamin vijfentwintigduizend en honderd man velden; die allen trokken het zwaard uit.","36":"En de kinderen van Benjamin zagen dat zij geslagen waren; want de mannen van Israël gaven de Benjaminieten plaats, omdat zij vertrouwden op de hinderlaag die zij tegen Gibea gesteld hadden.","37":"En de hinderlaag haastte zich, en brak voorwaarts naar Gibea toe; ja, de hinderlaag trok recht door, en sloeg de hele stad met de scherpte van het zwaard.","38":"En de mannen van Israël hadden een afgesproken teken met de hinderlaag, dat zij een grote verheffing van rook uit de stad zouden laten opgaan.","39":"Zo keerden de mannen van Israël zich om in de strijd; en Benjamin had begonnen te slaan en te doorsteken van de mannen van Israël ongeveer dertig man; want zij zeiden: Zeker, hij is zeker voor ons aangezicht geslagen, zoals in de vorige strijd.","40":"Toen begon de verheffing op te gaan uit de stad, als een pilaar van rook; toen nu Benjamin achter zich omzag, ziet, zo ging de brand van de stad op naar de hemel.","41":"En de mannen van Israël keerden zich om; en de mannen van Benjamin werden verbaasd, want zij zagen dat het kwaad hen treffen zou.","42":"Zo wendden zij zich voor het aangezicht van de mannen van Israël naar de weg van de woestijn; maar de strijd haalde hen in, en die uit de steden vernielden hen in hun midden.","43":"Zij omringden Benjamin, zij vervolgden hem, zij vertrapten hem gemakkelijk, tot voor Gibea, tegen de opgang van de zon.","44":"En er vielen van Benjamin achttienduizend man; deze allen waren strijdbare mannen.","45":"Toen keerden zij zich om, en vluchtten naar de woestijn, tot de rots van Rimmon; maar zij deden een nalezing onder hen op de wegen, van vijfduizend man; verder kleefden zij hen achteraan tot aan Gideom, en sloegen van hen tweeduizend man.","46":"Zo waren allen die op die dag van Benjamin vielen, vijfentwintigduizend man, die het zwaard uittrokken; die allen waren strijdbare mannen.","47":"Doch zeshonderd man keerden zich om, en vluchtten naar de woestijn, tot de rots van Rimmon, en bleven bij de rots van Rimmon, vier maanden.","48":"En de mannen van Israël keerden terug tot de kinderen van Benjamin, en sloegen hen met de scherpte van het zwaard, van de hele stad tot de dieren toe, ja, al wat gevonden werd; ook staken zij alle steden die gevonden werden in brand."},"SV":{"1":"Toen togen alle kinderen Israëls uit, en de vergadering verzamelde zich, als een enig man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot den HEERE te Mizpa.","2":"En *uit* de hoeken des ganse volks stelden zich al de stammen van Israël in de vergadering van het volk Gods, vierhonderd duizend man te voet, die het zwaard uittrokken.","3":"(De kinderen Benjamins nu hoorden, dat de kinderen Israëls opgetogen naar Mizpa.) En de kinderen Israëls zeiden: Spreekt, hoe is dit kwaad geschied?","4":"Toen antwoordde de Levietische man, de man van de vrouw, die gedood was, en zeide: Ik kwam met mijn bijwijf te Gibea, dewelke Benjamins is, om te vernachten.","5":"En de burgers van Gibea maakten zich tegen mij op, en omringden tegen mij het huis bij nacht; zij dachten mij te doden, en mijn bijwijf hebben zij geschonden, dat zij gestorven is.","6":"Toen greep ik mijn bijwijf, en deelde haar, en zond haar in het ganse land der erfenis van Israël, omdat zij een schandelijke daad en dwaasheid in Israël gedaan hadden.","7":"Ziet, gij allen zijt kinderen Israëls, geeft hier voor ulieden woord en raad!","8":"Toen maakte zich al het volk op, als een enig man, zeggende: Wij zullen niet gaan, een ieder naar zijn tent, noch wijken, een ieder naar zijn huis.","9":"Maar nu, dit is de zaak, die wij aan Gibea zullen doen: tegen haar bij het lot!","10":"En wij zullen tien mannen nemen van honderd, van alle stammen Israëls, en honderd van duizend, en duizend van tienduizend, om teerkost te nemen voor het volk, opdat zij, komende te Gibea-benjamins, *haar* doen naar al de dwaasheid, die zij in Israël gedaan heeft.","11":"Alzo werden alle mannen van Israël verzameld tot deze stad, verbonden als een enig man.","12":"En de stammen van Israël zonden mannen door den ganse stam van Benjamin, zeggende: Wat voor een kwaad is dit, dat onder ulieden geschied is?","13":"Zo geeft nu die mannen, die kinderen Belials, die te Gibea zijn, dat wij hen doden, en het kwaad uit Israël wegdoen. Doch de *kinderen* van Benjamin wilden niet horen naar de stem van hun broederen, de kinderen Israëls.","14":"Maar de kinderen van Benjamin verzamelden zich uit de steden naar Gibea, om uit te trekken ten strijde tegen de kinderen Israëls.","15":"En de kinderen van Benjamin werden te dien dage geteld uit de steden, zes en twintig duizend mannen, die het zwaard uittrokken, behalve dat de inwoners van Gibea geteld werden, zevenhonderd uitgelezene mannen.","16":"Onder al dit volk waren zevenhonderd uitgelezene mannen, welke links waren; deze allen slingerden met een steen op een haar, dat het hun niet miste.","17":"En de mannen van Israël werden geteld, behalve Benjamin, vierhonderd duizend mannen, die het zwaard uittrokken; deze allen waren mannen van oorlog.","18":"En de kinderen Israëls maakten zich op, en togen opwaarts ten huize Gods, en vraagden God, en zeiden: Wie zal onder ons vooreerst optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zeide: Juda vooreerst.","19":"Alzo maakten zich de kinderen Israëls in den morgenstond op, en legerden zich tegen Gibea.","20":"En de mannen van Israël togen uit ten strijde tegen Benjamin; voorts schikten de mannen Israëls den strijd tegen hen bij Gibea.","21":"Toen togen de kinderen van Benjamin uit van Gibea, en zij vernielden ter aarde op dien dag van Israël twee en twintig duizend man.","22":"Doch het volk versterkte zich, *te* *weten* de mannen van Israël, en zij beschikten den strijd wederom ter plaatse, waar zij *dien* des vorigen daags geschikt hadden.","23":"En de kinderen Israëls togen op, en weenden voor het aangezicht des HEEREN tot op den avond, en vraagden den HEERE zeggende: Zal ik weder genaken ten strijde tegen de kinderen van Benjamin, mijn broeder? En de HEERE zeide: Trekt tegen hem op.","24":"Zo naderden de kinderen Israëls tot de kinderen van Benjamin, des anderen daags.","25":"En die van Benjamin trokken uit hun tegemoet, uit Gibea, op den tweeden dag, en velden van de kinderen Israëls nog achttien duizend man neder ter aarde; die allen trokken het zwaard uit.","26":"Toen togen alle kinderen Israëls en al het volk op, en kwamen ten huize Gods, en weenden, en bleven aldaar voor het aangezicht des HEEREN, en vastten dien dag tot op den avond; en zij offerden brandofferen en dankofferen voor het aangezicht des HEEREN.","27":"En de kinderen Israëls vraagden den HEERE, want aldaar was de ark des verbonds van God in die dagen.","28":"En Pinehas, de zoon van Eleazar, den zoon van Aäron, stond voor Zijn aangezicht, in die dagen, zeggende: Zal ik nog meer uittrekken ten strijde tegen de kinderen van Benjamin, mijn broeder, of zal ik ophouden? en de HEERE zeide: Trekt op, want morgen zal Ik hem in uw hand geven.","29":"Toen bestelde Israël achterlagen op Gibea rondom.","30":"En de kinderen Israëls togen op, aan den derden dag, tegen de kinderen van Benjamin; en zij schikten *den* *strijd* op Gibea, als op de andere malen.","31":"Toen togen de kinderen van Benjamin uit, het volk tegemoet, *en* werden van de stad afgetrokken; en zij begonnen te slaan van het volk, *en* te doorsteken, gelijk de andere malen, op de straten, waarvan de een opgaat naar het huis Gods, en de ander naar Gibea, in het veld, omtrent dertig man van Israël.","32":"Toen zeiden de kinderen van Benjamin: Zij zijn voor ons aangezicht geslagen, als te voren; maar de kinderen Israëls zeiden: Laat ons vlieden, en hen van de stad aftrekken naar de straten.","33":"Toen maakten zich alle mannen van Israël op uit hun plaatsen, en schikten *den* *strijd* te Baäl-thamar; ook brak Israëls achterlage op uit haar plaats, na de ontbloting van Gibea.","34":"En tien duizend uitgelezen mannen van gans Israël kwamen van tegenover Gibea, en de strijd werd zwaar; doch zij wisten niet, dat het kwaad hen treffen zou.","35":"Toen sloeg de HEERE Benjamin voor Israëls aangezicht; dat de kinderen Israëls op dien dag van Benjamin vernielden vijf en twintig duizend en honderd mannen; die allen trokken het zwaard uit.","36":"En de kinderen van Benjamin zagen, dat zij geslagen waren; want de mannen van Israël gaven den Benjaminieten plaats, omdat zij vertrouwden op de achterlage, die zij tegen Gibea gesteld hadden.","37":"En de achterlage haastte, en brak voorwaarts naar Gibea toe; ja, de achterlage trok recht door, en sloeg de ganse stad met de scherpte des zwaards.","38":"En de mannen van Israël hadden een bestemden tijd met de achterlage, wanneer zij een grote verheffing van rook van de stad zouden doen opgaan.","39":"Zo keerden zich de mannen van Israël om in den strijd; en Benjamin had begonnen te slaan *en* te doorsteken van de mannen van Israël omtrent dertig man; want zij zeiden: Immers is hij zekerlijk voor ons aangezicht geslagen, als in den vorigen strijd.","40":"Toen begon de verheffing op te gaan van de stad, *als* een pilaar van rook; als nu Benjamin achter zich omzag, ziet, zo ging de brand der stad op naar den hemel.","41":"En de mannen van Israël keerden zich om; en de mannen van Benjamin werden verbaasd, want zij zagen, dat het kwaad hen treffen zou.","42":"Zo wendden zij zich voor het aangezicht der mannen van Israël naar den weg der woestijn; maar de strijd kleefde hen aan, en die uit de steden vernielden ze in het midden van hen.","43":"Zij omringden Benjamin, zij vervolgden hem, zij vertraden hem gemakkelijk, tot voor Gibea, tegen den opgang der zon.","44":"En er vielen van Benjamin achttien duizend mannen; deze allen waren strijdbare mannen.","45":"Toen keerden zij zich, en vloden naar de woestijn, tot den rotssteen van Rimmon; maar zij deden een nalezing onder hen op de straten, van vijf duizend man; voorts kleefden zij hen achteraan tot aan Gideom, en sloegen van hen twee duizend man.","46":"Alzo waren allen, die op dien dag van Benjamin vielen, vijf en twintig duizend mannen, die het zwaard uittrokken; die allen waren strijdbare mannen.","47":"Doch zeshonderd mannen keerden zich, en vloden naar de woestijn, tot den rotssteen van Rimmon, en bleven in den rotssteen van Rimmon, vier maanden.","48":"En de mannen van Israël keerden weder tot de kinderen van Benjamin, en sloegen hen met de scherpte des zwaards, die van de gehele stad tot de beesten toe, ja, al wat gevonden werd; ook zetten zij alle steden, die gevonden werden, in het vuur."},"KJV":{"1":"Then all the children of Israel went out, and the congregation was gathered together as one man, from Dan even to Beersheba, with the land of Gilead, unto the LORD in Mizpeh.","2":"And the chief of all the people, *even* of all the tribes of Israel, presented themselves in the assembly of the people of God, four hundred thousand footmen that drew sword.","3":"(Now the children of Benjamin heard that the children of Israel were gone up to Mizpeh.) Then said the children of Israel, Tell *us*, how was this wickedness?","4":"And the Levite, the husband of the woman that was slain, answered and said, I came into Gibeah that *belongeth* to Benjamin, I and my concubine, to lodge.","5":"And the men of Gibeah rose against me, and beset the house round about upon me by night, *and* thought to have slain me: and my concubine have they forced, that she is dead.","6":"And I took my concubine, and cut her in pieces, and sent her throughout all the country of the inheritance of Israel: for they have committed lewdness and folly in Israel.","7":"Behold, ye *are* all children of Israel; give here your advice and counsel.","8":"And all the people arose as one man, saying, We will not any *of us* go to his tent, neither will we any *of us* turn into his house.","9":"But now this *shall be* the thing which we will do to Gibeah; *we will go up* by lot","10":"And we will take ten men of an hundred throughout all the tribes of Israel, and an hundred of a thousand, and a thousand out of ten thousand, to fetch victual for the people, that they may do, when they come to Gibeah of Benjamin, according to all the folly that they have wrought in Israel.","11":"So all the men of Israel were gathered against the city, knit together as one man.","12":"And the tribes of Israel sent men through all the tribe of Benjamin, saying, What wickedness *is* this that is done","13":"Now therefore deliver *us* the men, the children of Belial, which *are* in Gibeah, that we may put them to death, and put away evil from Israel. But the children of Benjamin would not hearken to the voice of their brethren the children of Israel:","14":"But the children of Benjamin gathered themselves together out of the cities unto Gibeah, to go out to battle against the children of Israel.","15":"And the children of Benjamin were numbered at that time out of the cities twenty and six thousand men that drew sword, beside the inhabitants of Gibeah, which were numbered seven hundred chosen men.","16":"Among all this people *there were* seven hundred chosen men lefthanded; every one could sling stones at an hair *breadth*, and not miss.","17":"And the men of Israel, beside Benjamin, were numbered four hundred thousand men that drew sword: all these *were* men of war.","18":"And the children of Israel arose, and went up to the house of God, and asked counsel of God, and said, Which of us shall go up first to the battle against the children of Benjamin? And the LORD said, Judah *shall go up* first.","19":"And the children of Israel rose up in the morning, and encamped against Gibeah.","20":"And the men of Israel went out to battle against Benjamin; and the men of Israel put themselves in array to fight against them at Gibeah.","21":"And the children of Benjamin came forth out of Gibeah, and destroyed down to the ground of the Israelites that day twenty and two thousand men.","22":"And the people the men of Israel encouraged themselves, and set their battle again in array in the place where they put themselves in array the first day.","23":"(And the children of Israel went up and wept before the LORD until even, and asked counsel of the LORD, saying, Shall I go up again to battle against the children of Benjamin my brother? And the LORD said, Go up","24":"And the children of Israel came near against the children of Benjamin the second day.","25":"And Benjamin went forth against them out of Gibeah the second day, and destroyed down to the ground of the children of Israel again eighteen thousand men; all these drew the sword.","26":"Then all the children of Israel, and all the people, went up, and came unto the house of God, and wept, and sat there before the LORD, and fasted that day until even, and offered burnt offerings and peace offerings before the LORD.","27":"And the children of Israel enquired of the LORD, (for the ark of the covenant of God *was* there in those days,","28":"And Phinehas, the son of Eleazar, the son of Aaron, stood before it in those days,) saying, Shall I yet again go out to battle against the children of Benjamin my brother, or shall I cease? And the LORD said, Go up; for to morrow I will deliver them into thine hand.","29":"And Israel set liers in wait round about Gibeah.","30":"And the children of Israel went up against the children of Benjamin on the third day, and put themselves in array against Gibeah, as at other times.","31":"And the children of Benjamin went out against the people, *and* were drawn away from the city; and they began to smite of the people, *and* kill, as at other times, in the highways, of which one goeth up to the house of God, and the other to Gibeah in the field, about thirty men of Israel.","32":"And the children of Benjamin said, They *are* smitten down before us, as at the first. But the children of Israel said, Let us flee, and draw them from the city unto the highways.","33":"And all the men of Israel rose up out of their place, and put themselves in array at Baaltamar: and the liers in wait of Israel came forth out of their places, *even* out of the meadows of Gibeah.","34":"And there came against Gibeah ten thousand chosen men out of all Israel, and the battle was sore: but they knew not that evil *was* near","35":"And the LORD smote Benjamin before Israel: and the children of Israel destroyed of the Benjamites that day twenty and five thousand and an hundred men: all these drew the sword.","36":"So the children of Benjamin saw that they were smitten: for the men of Israel gave place to the Benjamites, because they trusted unto the liers in wait which they had set beside Gibeah.","37":"And the liers in wait hasted, and rushed upon Gibeah; and the liers in wait drew *themselves* along, and smote all the city with the edge of the sword.","38":"Now there was an appointed sign between the men of Israel and the liers in wait, that they should make a great flame with smoke rise up out of the city.","39":"And when the men of Israel retired in the battle, Benjamin began to smite *and* kill of the men of Israel about thirty persons: for they said, Surely they are smitten down before us, as *in* the first battle.","40":"But when the flame began to arise up out of the city with a pillar of smoke, the Benjamites looked behind them, and, behold, the flame of the city ascended up to heaven.","41":"And when the men of Israel turned again, the men of Benjamin were amazed: for they saw that evil was come","42":"Therefore they turned *their backs* before the men of Israel unto the way of the wilderness; but the battle overtook them; and them which *came* out of the cities they destroyed in the midst","43":"*Thus* they inclosed the Benjamites round about, *and* chased them, *and* trode them down with ease over against Gibeah toward the sunrising.","44":"And there fell of Benjamin eighteen thousand men; all these *were* men of valour.","45":"And they turned and fled toward the wilderness unto the rock of Rimmon: and they gleaned of them in the highways five thousand men; and pursued hard after them unto Gidom, and slew two thousand men","46":"So that all which fell that day of Benjamin were twenty and five thousand men that drew the sword; all these *were* men of valour.","47":"But six hundred men turned and fled to the wilderness unto the rock Rimmon, and abode in the rock Rimmon four months.","48":"And the men of Israel turned again upon the children of Benjamin, and smote them with the edge of the sword, as well the men of *every* city, as the beast, and all that came to hand: also they set on fire all the cities that they came to."}},"tsk":{"1":[{"kopje":"Toen trokken alle","refs":["Richt 20:2","Richt 20:8","Richt 20:11","Richt 21:5","Deut 13:12-18","Joz 22:12"]},{"kopje":"als één man","refs":["1 Sam 11:7"," "wl wl-kjv\" data-code=\"H4217\">sunrising.</span>","44":"And there <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> <span class=\"wl wl-kjv\" data-code=\"H8083\">eighteen</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men;</span> all these were <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of valour.","45":"And they <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> toward the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> of <span class=\"wl wl-kjv\" data-code=\"H7417\">Rimmon:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5953\">gleaned</span> of them in the <span class=\"wl wl-kjv\" data-code=\"H4546\">highways</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men;</span> and <span class=\"wl wl-kjv\" data-code=\"H1692\">pursued</span> hard <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them unto <span class=\"wl wl-kjv\" data-code=\"H1440\">Gidom,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> two <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> men","46":"So that all which <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> were <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H8025\">drew</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> all these were <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of valour.","47":"But <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> to the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> <span class=\"wl wl-kjv\" data-code=\"H7417\">Rimmon,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> in the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> <span class=\"wl wl-kjv\" data-code=\"H7417\">Rimmon</span> <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> months.","48":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> turned <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> as well the <span class=\"wl wl-kjv\" data-code=\"H4974\">men</span> of every <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">as</span> the <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> and all that came to <span class=\"wl wl-kjv\" data-code=\"H4672\">hand:</span> also they <span class=\"wl wl-kjv\" data-code=\"H7971\">set</span> on <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> that they came to."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"alle kinderen Israëls uit,","tekst":"Uitgezonderd de Benjaminieten; zie vs.12,13, enz."},{"catchword":"als een enig man,","tekst":"Dat is, met zonderlinge eendracht en gewilligheid, onbezwaard; alzo onder, vs.8, 11; 1Sa 11:7; 2Sa 19:14; Ezr 3:1; Neh 8:2, enz."},{"catchword":"Dan af tot Ber-séba toe,","tekst":"De stad Dan was de noordelijke, en Ber-seba de zuidelijke landpale van Kanaän; zie 1Ki 4:25."},{"catchword":"land van Gilead,","tekst":"Dat is, de Israëlieten, die daar woonden, in het oosten over de Jordaan, te weten, Ruben, Gad en de halve stam van Manasse. Zie Num 32."},{"catchword":"HEERE","tekst":"Om hem te bidden en voorts te Silo raad te vragen."},{"catchword":"Mizpa","tekst":"Gelegen in Benjamin, Jos 18:26, westwaarts te Silo, mede naar uitwijzen der kaarten. Een plaats bekwaam tot een landdag, als zijnde vast, naar de lengte, in het midden van Kanaän gelegen. Zie 1Sa 7:5, 1Sa 7:16, en 1Sa 10:17, enz.; 2Ki 25:22, enz.; Jer 40:6, enz., en Jer 41:1, enz. Sommigen menen dat hier een bijzondere plaats is verordineerd geweest, tot gemene gebeden en oefening der godzaligheid, als een synagoge en dergelijken meer geweest zijn, hoewel de ceremoniele godsdienst, van offeranden te doen, enz., geschieden moest te Silo, waar de tabernakel en de ark waren. Van andere plaatsen, hebbende denzelfden naam, zie boven, Jdg 10:17."}],"2":[{"catchword":"hoeken des gansen volks","tekst":"Dat is, van alle, ook de uiterste kwartieren. Anders, alle hoofden des volks; verstaande, dat die de hoeken des volks genoemd worden bij gelijkenis, als zijnde de voornaamsten, en de vastigheid des volks, gelijk de hoeken in een huis."},{"catchword":"zwaard uittrokken","tekst":"Zie boven, Jdg 8:10."}],"3":[{"catchword":"hoorden,","tekst":"Maar verschenen niet mede te Mizpa."},{"catchword":"zeiden","tekst":"Versta, tot den Leviet, wiens bijwijf ter dood toe mishandeld was, en die hier tegenwoordig was, als ook vermoedelijk zijn jongen, die bij hem geweest was."},{"catchword":"hoe is dit kwaad geschied?","tekst":"Zij willen niet besluiten noch bij de hand nemen, zonder eerst de zaak wel onderzocht en overwogen te hebben."}],"4":[{"catchword":"antwoordde de Levietische man,","tekst":"Dat is, verlof hebbende om te spreken, zo nam hij het woord, en verhaalde de ganse zaak; zie Jdg 18:14."},{"catchword":"man van de vrouw,","tekst":"Hoewel de vrouw zij bijwijf was, werden zij nochtans voor echte lieden gehouden; zie Jdg 19:2."},{"catchword":"gedood was,","tekst":"Dat is, alzo mishandeld, dat zij er van gestorven was, gelijk in het volgende verhaald wordt."}],"5":[{"catchword":"tegen mij het huis bij nacht;","tekst":"Om mij gruwelijk te misbruiken."},{"catchword":"dachten mij te doden,","tekst":"Te weten, indien ik hun gruwelijke moedwilligheid niet zou hebben willen gehoorzamen; en ik had liever te sterven dan zulks te doen."}],"6":[{"catchword":"deelde haar,","tekst":"Te weten, in twaalf stukken, boven, Jdg 19:29."},{"catchword":"zij een schandelijke daad","tekst":"Die van Gibea."},{"catchword":"dwaasheid in Israël gedaan hadden","tekst":"Zie Gen 34:7. Alzo onder, vs.10."}],"7":[{"catchword":"kinderen Israëls,","tekst":"Wien het geenszins [als zijnde Gods volk en bondgenoten] betaamt zulk een gruwel ongestraft te laten."}],"8":[{"catchword":"niet gaan,","tekst":"Versta, tenzij wij eerst zullen hebben gedaan, hetgeen in het volgende verhaald wordt."}],"9":[{"catchword":"bij het lot","tekst":"Om uit te loten, wie het leger met proviand verzorgen en wie strijden zal."}],"10":[{"catchword":"volk,","tekst":"Dat strijden zal."},{"catchword":"Gibea-benjamins,","tekst":"In vs.9 en doorgaans in deze historie genoemd Gibea, dat is, den inwoners van Gibea doen naar hun verdiensten."}],"11":[{"catchword":"verbonden als een enig man","tekst":"Hebreeuws, gezellen, vergezelschapt, samengevoegd."}],"12":[{"catchword":"gansen stam van Benjamin,","tekst":"Hebreeuws, door alle stammen; dat is, de duizenden, waarin de stam Benjamins [gelijk anderen] was afgedeeld."}],"13":[{"catchword":"die mannen,","tekst":"Die aan dezen gruwel schuldig zijn."},{"catchword":"Belials,","tekst":"Gelijk boven, Jdg 19:22; zie Deu 13:13."},{"catchword":"wilden niet horen","tekst":"Makende zich alzo schuldig aan die gruwelijke daad der inwoners van Gibea."}],"15":[{"catchword":"zes en twintig duizend mannen,","tekst":"Van dit getal zijn vijf en twintig duizend en een honderd gebleven, vs.35. De overige negen honderd mogen gelaten zijn tot bezetting der steden, bij de bagage, en om proviand te beschikken. Deze zijn na den slag in de steden allen omgebracht, vs.48. Zes honderd [honderd minder dan die van Gibea alleen buiten de anderen uitmaakten] zijn ontkomen en overgebleven, vs.47."},{"catchword":"zwaard uittrokken,","tekst":"Zie Jdg 8:10, en onder, vs.17, 46."}],"16":[{"catchword":"links waren;","tekst":"Hebreeuws, gesloten aan hun rechterhand, of, wier rechterhand gesloten was; Zie boven, Jdg 3:15."},{"catchword":"deze allen slingerden met een steen op een haar,","tekst":"Of, een ieder van dezen slingerde met een steen, enz."},{"catchword":"dat het hun niet miste","tekst":"Hebreeuws, en deden [den steen] niet missen, of, feilen, afdwalen; te weten, van op een haar te treffen. In het Hebreeuws wordt hier gebruikt hetzelfde woord, dat overal zondigen, doen zondigen betekent, omdat de zonde een missing, feil, of afdwaling is van Gods wet, wanneer iets daarmede niet overeenkomt, of [gelijk de apostel Johannes zegt, in den 1n Brief, 1Jo 3:4 ] onwettigheid, of onwettelijkheid is. Vergelijk Job 5:24."}],"18":[{"catchword":"huize Gods,","tekst":"Zijnde te Silo, oostwaarts van Mizpa, en niet ver van Gibea gelegen. Zie boven, Jdg 19:18. Hebreeuws, Beth-el; dat is, huis Gods; zie onder, vs.26."},{"catchword":"vraagden God,","tekst":"Zie boven, Jdg 1:1."},{"catchword":"Wie zal onder ons","tekst":"Niet bekommerd zijnde om de rechtvaardigheid van dezen krijg, noch om de victorie, die zij nochtans [hoewel veel sterker zijnde dan Benjamin] van God behoorden te begeren en te verwachten, zo vragen zij alleenlijk naar de orde van den strijd, waarin zij schijnen het niet zo wel een geweest te zijn; vergelijk boven, Jdg 1:1."}],"20":[{"catchword":"schikten de mannen Israëls","tekst":"Dat is, zij stelden zich in orde om te strijden, zij stelden hun slagorde."}],"21":[{"catchword":"vernielden ter aarde","tekst":"Hebreeuws, zij verdierven; alzo onder, vs.25, 35, 42. Het Hebreeuwse woord dient tot verzwaring van het doden, alsof men zeide: Gans en al verdoen, vernielen; zie Eze 9:6, Eze 9:8."}],"22":[{"catchword":"versterkte zich,","tekst":"Dat is, zij grepen moed en vermanden zich, niettegenstaande deze nederlaag."},{"catchword":"beschikten den strijd","tekst":"Hebreeuws, zij voeren voort, of, deden toe, den strijd te schikken."}],"23":[{"catchword":"aangezicht des HEEREN","tekst":"Dat is, in de tent der samenkomst, waar de ark des verbonds was, een zichtbaar teken van Gods tegenwoordigheid en genade. Zie onder, vs.26,27, en Lev 1:3."},{"catchword":"ik","tekst":"Israël; alzo onder, vs.28."},{"catchword":"weder genaken ten strijde","tekst":"Hebreeuws, zal ik toedoen, of, voortvaren te genaken"},{"catchword":"mijn broeder?","tekst":"Het schijnt dat zij, vermits de geleden nederlaag, twijfelen of het Gode aangenaam is, dat zij als tegen hun broeders krijgen, zonder te vragen naar de uitkomst of de victorie."}],"25":[{"catchword":"velden","tekst":"Hebreeuws, verdierven"},{"catchword":"allen trokken het zwaard uit","tekst":"Dat is, deze allen waren strijdbare mannen; zie vs.15, 17."}],"26":[{"catchword":"huize Gods,","tekst":"Hebreeuws, Beth-El; dat is, Gods huis, gelijk het door de meeste overzetters in deze historie wordt vertaald. Dit is ook de naam van de vermaarde plaats Beth-El [zie Gen 28:19 ] . En omdat in vs.27 gezegd wordt, dat aldaar de ark des verbonds in dien tijd was, nemen sommigen daaruit af, dat zij te Bethel en niet te Silo [in deze historie nergens genoemd dan onder, Jdg 21:12, Jdg 21:19, Jdg 21:21 ] geweest is ers, van de lieden der stad tot de beesten toe"},{"catchword":"zetten zij alle steden,","tekst":"Hebreeuws, zonden, gelijk boven, Jdg 1:8."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then all the children of Israel [excepting the Benjamites see verse 12,13 &c.]] went out and the congregation gathered themselves together as one man [that is with special unanimity and willingness and disquieted or troubled at all so below verse 8,11 and 1Sa 11:7 2Sa 19:14 Ezra 3.1 Nehemiah 8.7 &c.] from Dan even to Beersheba [the city of Dan was the northern 1Kings 4 on verse 25] also the land of Gilead [that is the Israelites that dwealt there in the east beyond Jordan to wit Reuben Gad and the half tribe of Mannasseh see Numbers chapter 32] unto the Lord [to pray unto him and besides to ask counsel at Silo ] at Mizpa [ lying in Benjamin Jos 18:26 westwards from Silo as the map also sheweth a place fit for a solemn assembly as being strong according to the length lying in the midst off Canaan see1samuel 7 on verse 5,16 & 10.17 &c. 2Ki 25:222 &c. Jer 40:7 &c. & 41.1 &c. some are of opinion that here at special place was appointed for public prayers and exercise of piety as synagogue and dyers more have been although the ceremonial worship of offering sacrifices &c. were to be done at Silo where the tabernacle and the ark compare other places bearing the same name see above chapter 10 on verse 17.]"}],"2":[{"catchword":null,"tekst":"And from the corners of all the people [that is from all even the uttermost quarters others all the heads of the people meaning that those are called of the people by way of similitude as being the chiefest and firmness or strength of the people as the corners of a house] did all the tribe of Israel present themselves in the assemble of the people of God four hundred thousand man on foot that drew sword [see above chapter 8 on verse 10.]"}],"3":[{"catchword":null,"tekst":"Now the children of Benjamin heard [ but appeared not also at MiPad ] that the children of Israel were gone up to MiPad and the children of Israel said [meaning the Levites whose concubines was abused even to death and who was here present as also question less his servant that was with him at that time when he was so abused ] speak how was this wickedness done ? [they will not resolve nor attempt anything without first searching and sifting out the matter.]"}],"4":[{"catchword":null,"tekst":"Then answered the Levitish man [ that is having leave granted him to speak he uttered and related the whole business see chapter 18 on verse 14] the husband of the woman [although the woman was his concubine yet were they accounted lawful man and wife see chapter 19 on verse 2] that was killed [that is so abused that she died of it as is related in the following words ] and said I came with my concubines unto Gibea which is Benjamin&acirc;&euro;&trade;s to overnight."}],"5":[{"catchword":null,"tekst":"And the citizens of Gibea rose up against me and beset the house round against me [to abuse me abominable ] by night they thought to have killed me [viz. if I have would have not yielded to their abominable wickedness and had rather die then do so] and my concubines have they forced that she is dead."}],"6":[{"catchword":null,"tekst":"Then I took my concubines and divided her [into twelve pieces above chapter 19.29] and sent her into all the land of inheritance of Israel because they [that is those of Gibea ] had committed a leud act and folly [see Genesis 34 on verse 7so below verse 1] in Israel."}],"7":[{"catchword":null,"tekst":"Behold ye all children of Israel [whom as being Gods people in covenant in no ways besitteth such horrible wickedness to go unpunished.] give here for yourselves words and counsel."}],"8":[{"catchword":null,"tekst":"Then all the people arose as one man saying we will not go [meaning unless we shall first have acted that which is related in the following words ] every man to his rent nor turn every man into his house."}],"9":[{"catchword":null,"tekst":"But now this is the thing which we will do unto Gibea against her by Lot[to cast lots who shall victual the camp and who shall fight .]"}],"10":[{"catchword":null,"tekst":"And we will take ten men of an hundred out of all the tribes and a hundred of a thousand and thousand of a ten thousand to fetch victual for the people [which shall fight] to Gab of Benjamin[in the former verse and so continually in the history that is called Gibea of Benjamin] they may do unto it [viz. to the inhabitants of Gibea ]according to all the folly which it hath committed in Israel [that disaccording to their desert.]"}],"11":[{"catchword":null,"tekst":"So all man of Israel were gathered against this city combined together [Heb. Companioned accompanied joined together] as one man."}],"12":[{"catchword":null,"tekst":"And the tribes of Israel sent men through all tribe of Benjamin [Heb. throughout all the tribes that is the thousand into which the tribe of Benjamin as others was divided ] saying what wickedness is this that is done among ye?"}],"13":[{"catchword":null,"tekst":"Now therefore deliver in those men [who are guilty of his abomination ]those children of Belial[as above chapter 19.22 see Deuteronomy 13 on verse 13] which are at Gibea that we may put them to death and put away evil from Israel but the children of Benjamin will not hearken to the voice of Israel [making themselves thus guilty of that horrible fact of the inhabitants of Gibea.]"}],"14":[{"catchword":null,"tekst":"But the children of Benjamin gathered together out of the city unto Gibea to go forth to battle against the children of Israel."}],"15":[{"catchword":null,"tekst":"And the children of Benjamin were that day numbered out of the cities six and twenty thousand men [of this number were slain five and twenty thousand an done hundred verse35 the nine hundred were perhaps left to possess the cities to abide by the baggage and to victual the camp these after the fight were all slain in the cities verse 48 six hundred fewer than those of Gibea only excepting the rest set out escaped and remained alive verse 47,46 ] besides that the inhabitants of Gibea were numbered seven hundred chosen men."}],"16":[{"catchword":null,"tekst":"Among all the people were seven hundred chosen men which were left handed [Heb. locked up on their right hand or whose right hand was locked up see above chapter 3 on verse 15.] all these [or every one of these ]slung with a stone at an hair breadth that they missed not [Heb. and caused not the same to miss or fail to go astray even from hitting an hair here in the Hebrew text is the word used which signifieth every where to sin or cause t sin because sin is a missing failing or straying from the law of God when anything agreeth not therewith or as the apostle John saith in the 1Epistle chapter 3 verse 4 is unlawness or unlawfulness compare Job 5 on verse 24.]"}],"17":[{"catchword":null,"tekst":"And the men of Israel were numbered besides Benjamin four hundred thousand men that drew sword all these were man of war."}],"18":[{"catchword":null,"tekst":"And the children of Israel arose and went up to the house of God [which was at Silo eastward of Mizpa and nor far distant from Gibea see above chapter 19 on verse 18 Heb. Beth-el that is the house of God see below on verse 26] and asked counsel of God [see above chapter 1 on verse 1] and said [ not being troubled about the justness of this war nor about the victory which not withstanding they though much stronger then Benjamin were to desire and expect from God they only ask counsel concerning the ordering of the battle wherein they seem not to have agreed so well together compare above chapter 1.1] who among us shall go up first."}],"19":[{"catchword":null,"tekst":"So the children of Israel rose up in the morning and camped themselves against Gibea."}],"20":[{"catchword":null,"tekst":"And the men of Israel went up to battle against Benjamin moreover the men of Israel ordered the  house as is rendered by the most translators in this history this is also the name of the famous place Beth-el see Gen 18:14 and because in the following verse its said that there was the ark of the covenant at that time some gather from thence that is was at Bethel and not at silo no where mentioned in this history but only below chapter 21.12,19,21because the particle there seemeth not to agree so well if there had been no place before named but Beth-el was so far distant eastward from Gibea as the best maps tell us that the people could not easily go thither and come back again in so short time but Silo was close by Gibea the attentive reader will be able to judge hereof see above chapter 19 on verse 18and below chapter 21.12] and wept and tarried there before the face of the Lord."}],"27":[{"catchword":null,"tekst":"And the children of Israel asked counsel of the LORD for these[viz. In the house of God at Silo: others understand Bethel: see the annotate. On the former verse] was the Ark of the Covenant of God in those days."}],"28":[{"catchword":null,"tekst":"And Pinehas, [See above chap. 17 v.1] the son of Eleazar, the son of Aaron stood [i.e. ministered as High Priest, see Deut. 10.8 & 18.5, & c.] before his face[viz. the Lords, or, before it, to wit, the Ark on the Covenant] in those days, saying: Shall I yet any more go forth, Heb. shall I (namely Israel.) yet, or hence forth added, or procced to so forth] to battle against the children of Benjamin, my brother, or shall I cease? And the LORD said, Go up, for tomorrow will I deliver him[viz. Benjamin into thine hand."}],"29":[{"catchword":null,"tekst":"Then Israel set liars in wait round about Gibea."}],"30":[{"catchword":null,"tekst":"And the children of Israel went up on the third day, against the children of Benjamin: and thy ordered (the battle) against Gibea, as at other times."}],"31":[{"catchword":null,"tekst":"Then the children of Benjamin went out, to meet the people, [viz. Israel] (and) were drawn atchword":null,"tekst":"And the ambush hasted, and brakes forwards [Or, fell on, broke thorow] upon Gibea: yea the ambush drew right thorough, [or, drew, viz. the people that were hard by to them, to press thorough into the city. Compare above chapter, 4. On v.6. Otherwise, made a drawing sound, blew with along breath, drawing, viz. with the Trumpet, as Exodus.19.13. Josua.6.5.] and smote all the city, [i.e. all that were found in the city] with the edge of the sword. [Hebrew. At the mouth of the sword.]"}],"38":[{"catchword":null,"tekst":"And the men of Israel had an appointed time with the ambush: when they should cause a great rising up of smoke to rise up out of the city. [Hebrew. Should multiply a lifting up of smoke to cause it to rise up from the city: That then those of Israel should wheel about, and fall upon the Benjamites, for it should be a token that the city was taken.]"}],"39":[{"catchword":null,"tekst":"So the men of Israel turned themselves about in the battle: [As fleeing men, or fugitives, to draw those of Benjamin off from the city: as was related above verse.31.] and Benjamin had begun to smite, (and) to stab [Hebrew. stabbed; as v.31.] of the men of Israel, about thirty men, for they [viz. those of Benjamin] said; indeed be [to wit, Israel] is certainly smitten [Hebrew. being smitten, he is smitten] before our face, as in the former battle."}],"40":[{"catchword":null,"tekst":"Then the lifting up [Whereof above v.38.] began to rise up out of the city, (as) a piller of smoke: now when Benjamin looked behind him, behold the burning of the city, [Hebrew. the whole consumption, i.e. the burning, whereby the whole city was consumed] ascended up to heaven. [i.e. into the air, or skies.]"}],"41":[{"catchword":null,"tekst":"And the men of Israel turned themselves about, and the men of Benjamin were amazed: for they saw that the evil would hit them. [as above v.34.]"}],"42":[{"catchword":null,"tekst":"Therefore they turned themselves before the face of the men of Israel toward the wilderness; but the fight [i.e. the fighters] clave unto them, [i.e. nevertheless overtook them, hit them, as v.45.] and those out of the cities, destroyed them in the midst of them. [Hebrew. spoiled them in their middle: i.e. then round about on all sides, they smote them, as followeth]"}],"43":[{"catchword":null,"tekst":"They beset Benjamin [i.e. The men of Benjamin; or the Benjamites] round about, they pursued him, they trod him down easily. [Hebrew. (in, or, with) rest: i.e. without much trouble or pains. Some take it for the name of a place, called Menu, or Menucha] until before Gibea toward the Sun-rising. [Hence some do gather, that they was yet another Gibea, lying Eastward from Gibea, or Geba, continually mentioned in this history; as the maps also do place both these cities, calling the one Gibea, or Geba, and the other (which is also called Gibea) Gibeath, or Gabaath.]"}],"44":[{"catchword":null,"tekst":"And there fell of Benjamin eighteen thousand men: all these were men of war."}],"45":[{"catchword":null,"tekst":"Then they turned themselves, and fled towards the wilderness, unto the rock of Rimmon; [A city lying upon a rock between Bethel and Gibea, on the Southern borders of Benjamin] but they made gearing among them on the street, [Hebrew. they gleaned him (i.e. Benjamin) in the streets: i.e. they smote them here and there by parties, as they are wont to glean the remaining grapes in the vintage, and at last to cut them off that nothing might remain: see above chapter.8.2] of five thousand men: besides, they clave close to them behind, [i.e. they followed or pursued them close upon the heels, gave them no breathing time, no rest, or time to escape or flee away] unto Gideon, and smote of them two thousand men."}],"46":[{"catchword":null,"tekst":"So all that fell that day of Benjamin, were five and twenty thousand men, [In this number, are (according to the customer of the Scripture) left out the hundred (whereof above v. 35.     if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
