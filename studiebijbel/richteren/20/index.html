, "ref": "Richt 20:32", "svLabel": null}, {"disp": "Richt 20:45", "href": "../../richteren/20/#v45", "ref": "Richt 20:45", "svLabel": null}, {"disp": "Matt 7:13", "href": "../../mattheus/7/#v13", "ref": "Matt 7:13", "svLabel": null}], "kinderen": []}]}, {"topic": "Rocks", "href": "../../torrey/r/#t-rocks", "kinderen": [{"label": "Mentioned In Scripture", "href": "../../torrey/r/?hl=Judg.20.45#i18054", "refs": [], "kinderen": [{"label": "Rimmon", "href": "../../torrey/r/?hl=Judg.20.45#i18062", "refs": [{"disp": "Richt 20:45", "href": "../../richteren/20/#v45", "ref": "Richt 20:45", "svLabel": null}], "kinderen": []}]}]}]}, "47": {"nave": [{"topic": "Rimmon", "href": "../../nave/r/#t-rimmon", "kinderen": [{"label": "4. A rock in the territory of the tribe of Benjamin", "href": "../../nave/r/?hl=Judg.20.47#i17454", "refs": [{"disp": "Richt 20:45", "href": "../../richteren/20/#v45", "ref": "Richt 20:45", "svLabel": null}, {"disp": "Richt 20:47", "href": "../../richteren/20/#v47", "ref": "Richt 20:47", "svLabel": null}, {"disp": "Richt 21:13", "href": "../../richteren/21/#v13", "ref": "Richt 21:13", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Klaagl 1:3": "Gimel. Juda is in gevangenschap gegaan vanwege de ellende, en vanwege de veelheid van de dienstbaarheid; zij woont onder de heidenen, zij vindt geen rust; al haar vervolgers achterhalen haar tussen de engten.", "Pred 9:10": "Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.", "1 Kron 8:40": "En de zonen van Ulam waren dappere helden, die de boog spanden, en zij hadden veel zonen, en kleinzonen, honderdvijftig. Al dezen waren van de kinderen van Benjamin.", "2 Sam 24:2": "De koning zei toen tegen Joab, de legeraanvoerder die bij hem was: Trek nu rond door alle stammen van Israël, van Dan tot Ber-seba toe, en tel het volk, zodat ik het getal van het volk weet.", "2 Kron 22:12": "En hij was bij hen verborgen in het huis van God, zes jaar; en Athalia regeerde over het land.", "Matt 12:4": "Hoe hij het huis van God binnenging, en de toonbroden at, die hij niet mocht eten, en ook zij die bij hem waren niet, maar alleen de priesters?", "Matt 18:15-18": "Maar als uw broeder tegen u gezondigd heeft, ga naar hem toe en wijs hem terecht tussen u en hem alleen; als hij naar u luistert, hebt u uw broeder gewonnen. Maar als hij niet naar u luistert, neem dan nog één of twee mensen met u mee, zodat elk woord vaststaat door de mond van twee of drie getuigen. En als hij naar hen niet luistert, zeg het dan aan de gemeente; en als hij ook naar de gemeente niet luistert, laat hij dan voor u zijn als de heiden en de tollenaar.", "Joz 8:15-29": "Jozua dan, en heel Israël, deed alsof zij voor hen verslagen werden; en zij vluchtten via de weg naar de woestijn. Daarom werd al het volk dat in de stad was, samengeroepen om hen na te jagen; en zij joegen Jozua na, en werden van de stad weggetrokken. En er bleef geen man over in Ai of Beth-el, die niet uittrok, Israël na; en zij lieten de stad openstaan, en joegen Israël achterna.", "Richt 20:44-46": "En er vielen van Benjamin achttienduizend man; deze allen waren strijdbare mannen. Toen keerden zij zich om, en vluchtten naar de woestijn, tot de rots van Rimmon; maar zij deden een nalezing onder hen op de wegen, van vijfduizend man; verder kleefden zij hen achteraan tot aan Gideom, en sloegen van hen tweeduizend man. Zo waren allen die op die dag van Benjamin vielen, vijfentwintigduizend man, die het zwaard uittrokken; die allen waren strijdbare mannen.", "2 Sam 19:14": "Zo boog hij het hart van alle mannen van Juda, als van één man; en zij stuurden een boodschap naar de koning: Keer terug, u en al uw knechten.", "Ps 119:73": "Jod. Uw handen hebben mij gemaakt, en bereid; maak mij verstandig, opdat ik Uw geboden leer.", "Rom 12:18": "Als het mogelijk is, houd voor zover het van u afhangt vrede met alle mensen.", "Ezra 5:8": "De koning zij bekend, dat wij naar het landschap Juda getrokken zijn, naar het huis van de grote God, dat gebouwd wordt met grote stenen, en het hout wordt gelegd in de wanden; en dat werk wordt snel gedaan en gaat voorspoedig door hun handen voort.", "2 Sam 11:25": "Toen zei David tegen de bode: Zo moet u tegen Joab zeggen: Laat deze zaak niet kwaad zijn in uw ogen, want het zwaard verteert zowel de een als de ander; versterk uw strijd tegen de stad, en verstoor haar; bemoedig hem zo.", "Deut 21:21": "Dan zullen alle mannen van zijn stad hem met stenen stenigen, zodat hij sterft; en u zult het kwaad uit uw midden wegdoen; en heel Israël zal het horen en vrezen.", "Spr 24:6": "Want door wijze raadslagen zult u voor u de oorlog voeren, en in de veelheid van raadgevers is de overwinning.", "Klaagl 3:32": "Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid.", "Joz 22:12": "Toen de kinderen van Israël dit hoorden, verzamelde de hele vergadering van de kinderen van Israël zich te Silo, om tegen hen op te trekken met een leger.", "Luk 21:34": "En let op uzelf, dat uw harten niet op enig moment bezwaard worden met brasserij en dronkenschap, en zorgen van dit leven, en dat die dag u niet onvoorzien overkomt.", "1 Sam 30:6": "En David werd erg bang, want het volk sprak ervan hem te stenigen; want de zielen van heel het volk waren verbitterd, ieder over zijn zonen en over zijn dochters; maar David sterkte zich in de HEERE, zijn God.", "Ps 90:12": "Leer ons zo onze dagen tellen, dat wij een wijs hart bekomen.", "Ps 119:12": "HEERE! U bent gezegend; leer mij Uw inzettingen.", "Ps 77:20": "Uw weg was in de zee, en Uw pad in het grote water, en Uw voetstappen werden niet bekend.", "Kol 4:2-4": "Houd sterk aan in het gebed, en waak daarin met dankzegging; bid meteen ook voor ons, dat God ons de deur van het Woord opent, om de verborgenheid van Christus te spreken, waarvoor ik ook gebonden ben; opdat ik die openbaar maak, zoals ik moet spreken.", "1 Kon 21:13": "Toen kwamen de twee mannen, zonen van Belial, en gingen tegenover hem zitten; en de mannen van Belial getuigden tegen hem, tegen Naboth, voor het volk, en zeiden: Naboth heeft God en de koning gevloekt. En zij voerden hem de stad uit, en stenigden hem met stenen, zodat hij stierf.", "1 Kron 6:77": "De overige kinderen van Merari hadden van de stam van Zebulon: Rimmono en haar voorsteden, Thabor en haar voorsteden;", "2 Kon 3:25": "De steden nu braken zij af, en ieder wierp zijn steen op alle goede stukken land, en zij vulden ze, en stopten alle waterfonteinen dicht, en velden alle goede bomen, totdat zij in Kir-hareseth alleen de stenen daarvan lieten overblijven; en de slingeraars omsingelden en sloegen de stad.", "Jes 15:1": "De last die op Moab rust. Zeker, in de nacht is Ar-Moab verwoest, zij is uitgeroeid; zeker, in de nacht is Kir-Moab verwoest, zij is uitgeroeid!", "Jes 1:9": "Als de HEERE van de heerscharen ons niet nog een klein overblijfsel had gelaten, zouden wij als Sodom geworden zijn; wij zouden Gomorra gelijk zijn geworden.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Ps 78:60": "Daarom verliet Hij de tabernakel te Silo, de tent, die Hij tot een woning gesteld had onder de mensen.", "Neh 11:1": "Verder woonden de leiders van het volk te Jeruzalem; maar het overige van het volk wierp loten, om uit tien er één uit te brengen, die in de heilige stad Jeruzalem zou wonen, en negen delen in de andere steden.", "1 Sam 3:20": "En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.", "Zach 7:2": "Toen men naar het huis van God had gezonden Sarezer en Regem-Melech en hun mannen, om het aangezicht van de HEERE te smeken,", "1 Sam 10:17": "Doch Samuël riep het volk samen bij de HEERE, te Mizpa.", "Jona 1:7": "Vervolgens zeiden zij, ieder tegen zijn metgezel: Kom, laten we loten werpen, zodat wij mogen weten om wie het gaat dat dit kwaad ons overkomt. Zo wierpen zij loten, en het lot viel op Jona.", "Gen 19:28": "En hij keek uit naar Sodom en Gomorra, en naar het hele land van die vlakte; en hij zag, en zie, er steeg rook op van het land, als de rook van een oven.", "Richt 1:2": "En de HEERE zei: Juda zal optrekken; zie, Ik heb dat land in zijn hand gegeven.", "Deut 14:2": "Want u bent een heilig volk voor de HEERE, uw God; en de HEERE heeft u uitgekozen om Hem tot een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn.", "Joz 8:4": "en gebood hun: Let op, u zult de stad in een hinderlaag lokken van achter de stad; houd u niet al te ver van de stad, en wees allen gereed.", "Openb 18:5": "Want haar zonden zijn de een na de ander gevolgd tot aan de hemel toe, en God is haar ongerechtigheden gaan gedenken.", "Ps 78:61": "En Hij gaf Zijn sterkte in de gevangenis, en Zijn heerlijkheid in de hand van de tegenstander.", "Richt 19:14": "Zo trokken zij verder, en gingen hun weg; en de zon ging voor hen onder bij Gibea, dat aan Benjamin toebehoort;", "Gen 28:22": "En deze steen, die ik als opgericht teken gezet heb, zal een huis van God zijn; en van alles wat U mij geven zult, zal ik U zeker de tienden geven!", "Joz 14:2": "Door het lot van hun erfenis, zoals de HEERE door de dienst van Mozes geboden had, aangaande de negen stammen en de halve stam.", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "2 Kron 13:7": "Daarbij hebben zich nietswaardige mannen, kinderen van Belial, bij hem verzameld en zich sterk gemaakt tegen Rehabeam, de zoon van Salomo, toen Rehabeam jong was en teder van hart, zodat hij zich tegen hen niet kon verzetten.", "Neh 8:2": "verzamelde het hele volk zich als één man op het plein voor de Waterpoort; en zij zeiden tegen Ezra, de schriftgeleerde, dat hij het boek van de wet van Mozes zou halen, die de HEERE aan Israël geboden had.", "Ps 119:26": "Ik heb U mijn wegen verteld, en U hebt mij verhoord; leer mij Uw inzettingen.", "Deut 17:12": "De man nu die trots handelt door niet te luisteren naar de priester die daar staat om de HEERE, uw God, te dienen, of naar de rechter, die man zal sterven; en u moet het kwaad uit Israël wegdoen.", "Spr 22:3": "Een verstandig mens ziet het kwaad en verbergt zich; maar de eenvoudigen gaan door en worden gestraft.", "Richt 7:16-23": "En hij deelde de driehonderd man in drie groepen; en hij gaf ieder een bazuin in zijn hand, en lege kruiken, en fakkels in het midden van de kruiken. En hij zei tegen hen: Kijk naar mij en doe hetzelfde; en zie, wanneer ik aan het uiterste van het leger kom, zal het zo zijn: zoals ik zal doen, zo zult u doen. Als ik met de bazuin blaas, ik en allen die met mij zijn, dan zult ook u met de bazuin blazen, rondom het hele leger, en u zult zeggen: Voor de HEERE en voor Gideon!", "Matt 24:44": "Daarom, wees ook u bereid, want op een uur dat u het niet verwacht, zal de Zoon des mensen komen.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "Joz 7:6-9": "Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd. En Jozua zei: Ach, Heere HEERE! Waarom hebt U dit volk ooit de Jordaan laten oversteken, om ons te geven in de hand van de Amorieten, om ons te vernietigen? Was het toch maar zo dat wij tevreden waren geweest en gebleven waren aan de overkant van de Jordaan! Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd?", "Joz 15:32": "en Lebaoth, en Silhim, en Aïn, en Rimmon. Al deze steden zijn negenentwintig, met haar dorpen.", "Joz 8:19": "Toen kwam de hinderlaag snel omhoog van haar plaats, en zij liepen erheen, zodra hij zijn hand had uitgestrekt, en kwamen bij de stad, en zij namen haar in, en zij haastten zich, en staken de stad in brand.", "2 Kron 33:7": "Hij stelde ook de gelijkenis van een gesneden beeld, dat hij gemaakt had, in het huis van God, waarvan God gezegd had tot David en tot zijn zoon Salomo: In dit huis, en te Jeruzalem, dat Ik uit alle stammen van Israël verkozen heb, zal Ik Mijn Naam zetten tot in eeuwigheid.", "Ps 119:68": "U bent goed en goeddoend; leer mij Uw inzettingen.", "Richt 11:11": "Zo ging Jeftha met de oudsten van Gilead, en het volk stelde hem tot hoofd en aanvoerder over zich. En Jeftha sprak al zijn woorden voor het aangezicht van de HEERE te Mizpa.", "Ps 119:18": "Ontdek mijn ogen, dat ik aanschouw de wonderen van Uw wet.", "Ex 15:10": "U hebt met Uw wind geblazen; de zee heeft hen gedekt, zij zonken onder als lood in geweldige wateren!", "Richt 19:22-30": "Toen zij nu hun hart vrolijk maakten, zie, omringden de mannen van die stad (mannen, die kinderen van Belial waren) het huis, en klopten op de deur; en zij spraken tegen de oude man, de heer van het huis, en zeiden: Breng de man die in uw huis gekomen is naar buiten, zodat wij hem bekennen. En de man, de heer van het huis, ging naar hen toe naar buiten, en zei tegen hen: Nee, mijn broeders, doe toch zo'n kwaad niet; omdat deze man in mijn huis gekomen is, doe zo'n dwaasheid niet. Zie, mijn dochter die maagd is, en zijn bijvrouw, die zal ik nu naar buiten brengen, opdat u hen schendt, en met hen doet wat goed is in uw ogen; maar doe aan deze man zo'n dwaze zaak niet.", "Richt 1:1": "En het gebeurde na de dood van Jozua, dat de Israëlieten de HEERE vroegen: Wie zal onder ons het eerst optrekken naar de Kanaänieten, om tegen hen te strijden?", "Deut 20:10": "Wanneer u nadert tot een stad om tegen haar te strijden, dan zult u haar vrede toeroepen.", "Richt 10:17": "En de Ammonieten werden bijeengeroepen, en legerden zich in Gilead; daartegenover werden de Israëlieten verzameld, en legerden zich te Mizpa.", "Fil 1:9": "En dit bid ik God, dat uw liefde nog meer en meer overvloedig wordt in kennis en alle inzicht;", "Richt 19:30": "En het gebeurde, dat ieder die het zag, zei: Zoiets is niet gebeurd of gezien, vanaf de dag dat de kinderen van Israël uit het land Egypte zijn opgetrokken, tot op deze dag; overweeg het, beraadslaag, en spreek uw gedachten uit!", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Richt 20:1-3": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa. En de leiders van heel het volk stelden zich op, alle stammen van Israël, in de vergadering van het volk van God, vierhonderdduizend man te voet, die het zwaard uittrokken. (De kinderen van Benjamin nu hoorden dat de kinderen van Israël opgetrokken waren naar Mizpa.) En de kinderen van Israël zeiden: Vertel ons, hoe is dit kwaad gebeurd?", "2 Petr 2:12": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden;", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "Kol 1:9": "Daarom houden ook wij, vanaf de dag dat wij het gehoord hebben, niet op voor u te bidden en te vragen dat u vervuld mag worden met de kennis van Zijn wil, in alle wijsheid en geestelijk verstand;", "Hos 9:8": "De wachter van Efraïm is met mijn God, maar de profeet is een vogelvangersstrik op al zijn wegen, een haat in het huis van zijn God.", "1 Sam 4:7": "Daarom werden de Filistijnen bang, want zij zeiden: God is in het leger gekomen. En zij zeiden: Wee ons, want zoiets is eerder nooit gebeurd!", "Ef 3:14-19": "Om deze reden buig ik mijn knieën voor de Vader van onze Heere Jezus Christus, uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt, opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "Joz 8:14-16": "En het gebeurde, toen de koning van Ai dat zag, dat zij zich haastten en zich vroeg opmaakten, en de mannen van de stad kwamen naar buiten, Israël tegemoet, ten strijde, hij en al zijn volk, op de vastgestelde tijd, voor het vlakke veld; want hij wist niet dat men hem een hinderlaag had gelegd van achter de stad. Jozua dan, en heel Israël, deed alsof zij voor hen verslagen werden; en zij vluchtten via de weg naar de woestijn. Daarom werd al het volk dat in de stad was, samengeroepen om hen na te jagen; en zij joegen Jozua na, en werden van de stad weggetrokken.", "Rom 11:33": "O diepte van de rijkdom, én van de wijsheid én van de kennis van God, hoe ondoorzoekelijk zijn Zijn oordelen, en onnaspeurlijk Zijn wegen!", "2 Sam 15:32-34": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd. En David zei tegen hem: Als u met mij meegaat, zult u mij tot een last zijn; maar als u teruggaat naar de stad, en tegen Absalom zegt: Uw knecht, ik zal van de koning zijn; ik ben eerder wel de knecht van uw vader geweest, maar nu zal ik uw knecht zijn; dan zou u voor mij de raad van Achitofel teniet doen.", "Joz 7:16": "Toen stond Jozua 's morgens vroeg op, en liet Israël aankomen naar zijn stammen; en de stam van Juda werd aangewezen.", "1 Kron 9:11": "En Azarja, de zoon van Hilkija, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, leider van het huis van God;", "Richt 20:29-43": "Toen stelde Israël hinderlagen op tegen Gibea rondom. En de kinderen van Israël trokken op, op de derde dag, tegen de kinderen van Benjamin; en zij schikten de strijd tegen Gibea, zoals de andere keren. Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Ps 119:171": "Mijn lippen zullen Uw lof overvloedig uitstorten, als U mij Uw inzettingen zult geleerd hebben.", "1 Sam 4:3": "Toen het volk weer in het leger gekomen was, zeiden de oudsten van Israël: Waarom heeft de HEERE ons vandaag verslagen voor de Filistijnen? Laten wij uit Silo de ark van het verbond van de HEERE tot ons nemen, en laat die in ons midden komen, zodat zij ons verlost uit de hand van onze vijanden.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Jes 1:7": "Uw land is een verwoesting, uw steden zijn met het vuur verbrand; uw grond verteren de vreemden in uw tegenwoordigheid, en een verwoesting is er, als een omkering door de vreemden.", "Deut 14:1": "U bent kinderen van de HEERE, uw God. U zult uzelf niet snijden, en geen kaalheid maken tussen uw ogen, over een dode.", "2 Sam 13:12": "Maar zij zei tegen hem: Nee, mijn broer, verkracht mij niet, want zo doet men niet in Israël; doe deze dwaasheid niet.", "Est 4:16": "Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om.", "Richt 19:22": "Toen zij nu hun hart vrolijk maakten, zie, omringden de mannen van die stad (mannen, die kinderen van Belial waren) het huis, en klopten op de deur; en zij spraken tegen de oude man, de heer van het huis, en zeiden: Breng de man die in uw huis gekomen is naar buiten, zodat wij hem bekennen.", "2 Kron 17:14-18": "Dit nu is hun telling, naar de huizen van hun vaderen. In Juda waren leiders van de duizenden: Adna de aanvoerder, en met hem waren driehonderdduizend kloeke helden. Naast hem nu was de aanvoerder Johanan; en met hem waren tweehonderdtachtigduizend; Naast hem was Amasia, de zoon van Zichri, die zich vrijwillig aan de HEERE overgegeven had; en met hem waren tweehonderdduizend kloeke helden.", "Joz 8:20": "Toen de mannen van Ai zich omkeerden, zagen zij, en zie, de rook van de stad steeg op naar de hemel; en zij hadden geen mogelijkheid om deze of gene kant op te vluchten; want het volk dat naar de woestijn vluchtte, keerde zich om tegen hen die hen achtervolgden.", "Pred 9:1-3": "Zeker, dit alles heb ik in mijn hart overwogen, opdat ik dit alles klaar mocht verstaan: dat de rechtvaardigen en de wijzen en hun werken in de hand van God zijn; ook liefde, ook haat, weet de mens niet uit al wat voor zijn aangezicht is. Alles overkomt iedereen op dezelfde manier: eenzelfde lot treft de rechtvaardige en de goddeloze, de goede en de reine, als de onreine; zowel hem die offert, als hem die niet offert; zoals de goede, zo ook de zondaar, hij die zweert, evenals hij die de eed vreest. Dit is een kwaad onder alles wat er onder de zon gebeurt, dat eenzelfde lot allen treft, en dat ook het hart van de mensenkinderen vol boosheid is, en dat er in hun leven onzinnigheden zijn in hun hart; en daarna moeten zij naar de doden toe.", "Ef 1:16-19": "Houd niet op voor u te danken, en u te gedenken in mijn gebeden; Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem; Namelijk verlichte ogen van uw verstand, opdat u mag weten wat de hoop is van Zijn roeping, en wat de rijkdom is van de heerlijkheid van Zijn erfenis in de heiligen;", "Luk 14:32": "Anders stuurt hij, terwijl die ander nog ver weg is, gezanten en vraagt om vredesvoorwaarden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Richt 18:31": "Zo stelden zij voor zich het gesneden beeld van Micha op, dat hij gemaakt had, al de dagen dat het huis van God te Silo was.", "Hebr 10:21": "en omdat wij een grote Priester hebben over het huis van God,", "Ps 27:11": "HEERE, leer mij Uw weg, en leid mij op het rechte pad, omwille van mijn verspieders.", "Jes 47:11": "Daarom zal er over u een kwaad komen, u zult de dageraad daarvan niet weten; en een verderf zal er op u vallen, dat u niet zult kunnen verzoenen; want er zal snel een onstuimige verwoesting over u komen, zodat u het niet weten zult.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Richt 18:29": "En zij noemden de naam van de stad Dan, naar de naam van hun vader Dan, die aan Israël geboren was; hoewel de naam van deze stad voorheen Lais was.", "Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "1 Kor 5:10-12": "Maar niet geheel met de hoereerders van deze wereld, of met de gierigaards, of met de rovers, of met de afgodendienaars; want dan zou u wel uit de wereld moeten gaan. Maar nu heb ik u geschreven dat u zich niet moet inlaten namelijk met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten. Want wat heb ik ermee te maken hen die buiten zijn te oordelen? Oordeelt u niet over hen die binnen zijn?", "Ps 132:8": "Sta op, HEERE, tot Uw rust, U en de ark van Uw sterkte!", "Openb 18:8-10": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt. En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien; Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Deut 13:15-17": "dan zult u de inwoners van die stad zeker slaan met de scherpte van het zwaard, haar met de ban slaan, en alles wat daarin is, ook haar beesten, met de scherpte van het zwaard. En al haar buit zult u verzamelen midden op haar straat, en de stad en al haar buit geheel met vuur verbranden voor de HEERE, uw God; en zij zal een puinhoop zijn voor eeuwig, zij zal niet opnieuw gebouwd worden. Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;", "Neh 13:11": "En ik twistte met de overheden, en zei: Waarom is het huis van God verlaten? Doch ik verzamelde hen, en herstelde ze op hun plaats.", "Joz 22:13-16": "En de kinderen van Israël zonden naar de kinderen van Ruben, en naar de kinderen van Gad, en naar de halve stam van Manasse, in het land Gilead, Pinehas, de zoon van Eleazar, de priester; En tien leiders met hem, van elk vaderlijk huis één leider, uit al de stammen van Israël; en zij waren elk een hoofd van het huis van hun vaderen over de duizenden van Israël. Toen zij bij de kinderen van Ruben, en bij de kinderen van Gad, en bij de halve stam van Manasse aankwamen, in het land Gilead, spraken zij met hen, en zeiden:", "Ezech 22:10": "Men heeft de schaamte van de vader in u ontdekt; wie onrein was door afzondering, hebben zij in u verkracht.", "Micha 4:2": "En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "1 Kron 16:37": "Zo liet hij daar, voor de ark van het verbond van de HEERE, Asaf en zijn broeders, om voortdurend te dienen voor de ark, naarmate op elke dag besteld was.", "Jer 36:9": "Want het gebeurde in het vijfde jaar van Jojakim, de zoon van Josia, de koning van Juda, in de negende maand, dat zij een vasten voor het aangezicht van de HEERE uitriepen, voor het hele volk in Jeruzalem, alsook voor het hele volk dat uit de steden van Juda naar Jeruzalem kwam.", "Deut 34:1": "Toen ging Mozes op vanaf de vlakke velden van Moab, naar de berg Nebo, op de hoogten van Pisga, die recht tegenover Jericho ligt; en de HEERE liet hem het hele land zien: Gilead tot Dan toe;", "Jer 8:16": "Vanuit Dan wordt het gesnuif van zijn paarden gehoord; het hele land beeft van het geluid van het gebries van zijn sterke dieren; en zij komen daarheen om het land op te eten en al wat het bevat, de stad en wie daarin wonen.", "Deut 22:24": "Dan zult u hen beiden naar de poort van die stad brengen, en u zult hen met stenen stenigen, zodat zij sterven; de jonge dochter, omdat zij niet geroepen heeft, terwijl zij in de stad was, en de man, omdat hij de vrouw van zijn naaste vernederd heeft; zo zult u het kwaad uit uw midden wegdoen.", "Deut 24:7": "Wanneer iemand gevonden wordt die een mens steelt uit zijn broeders, uit de kinderen van Israël, en met hem handelt als koopwaar, en hem verkoopt; dan zal die dief sterven, en u zult het kwaad uit uw midden wegdoen.", "Ps 119:19": "Ik ben een vreemdeling op de aarde, verberg Uw geboden voor mij niet.", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "2 Sam 20:21": "De zaak is niet zo; maar een man van het gebergte van Efraïm, wiens naam Seba is, de zoon van Bichri, heeft zijn hand opgeheven tegen de koning, tegen David; lever hem alleen uit, dan zal ik van deze stad aftrekken. Toen zei de vrouw tegen Joab: Zie, zijn hoofd zal naar u toe over de muur geworpen worden.", "Jer 6:5": "Maakt u op, en laat ons optrekken in de nacht, en haar paleizen verderven!", "Gen 18:25": "Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen?", "Richt 3:21": "Ehud dan stak zijn linkerhand uit, en nam het zwaard van zijn rechterheup, en stak het in zijn buik;", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "2 Kron 20:17": "U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Ps 103:9": "Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden.", "Jes 10:29": "Zij trekken door de doorgang, te Geba houden zij hun overnachting; Rama beeft, Gibea van Saul vlucht.", "2 Sam 2:9": "en maakte hem koning over Gilead, en over de Aschurieten, en over Jizreël, en over Efraïm, en over Benjamin, en over heel Israël.", "Ps 73:19": "Hoe worden zij als in een ogenblik tot verwoesting, komen zij aan hun einde, gaan zij te niet van verschrikkingen!", "Joz 3:1": "Jozua stond dus 's morgens vroeg op, en zij vertrokken van Sittim en kwamen tot aan de Jordaan, hij en al de kinderen van Israël; en zij overnachtten daar, voordat zij overtrokken.", "Zach 14:10": "Dit hele land zal rondom als een vlak veld gemaakt worden, van Geba tot Rimmon toe, zuidwaarts van Jeruzalem; en zij zal verhoogd en bewoond worden op haar plaats; van de poort van Benjamin af, tot aan de plaats van de eerste poort, tot aan de Hoekpoort toe; en van de toren van Hananeel, tot aan de wijnbakken van de koning toe.", "Spr 18:19": "Een broeder is moeilijker te winnen dan een sterke stad; en geschillen zijn als de grendel van een paleis.", "1 Kon 3:7": "Nu dan, HEERE, mijn God! U hebt Uw knecht koning gemaakt in de plaats van mijn vader David; en ik ben een jonge man, ik weet niet uit te gaan of in te gaan.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "2 Sam 6:3": "En zij zetten de ark van God op een nieuwe wagen, en haalden die uit het huis van Abinadab, dat op een heuvel is; en Uza en Ahio, zonen van Abinadab, leidden de nieuwe wagen.", "Spr 3:5": "Vertrouw op de HEERE met heel uw hart, en steun op uw eigen verstand niet.", "Jer 14:7": "Hoewel onze ongerechtigheden tegen ons getuigen, o HEERE, doe het om Uw Naams wil; want onze afdwalingen zijn talrijk, wij hebben tegen U gezondigd.", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "2 Kron 25:13": "Maar de mannen van de troepen die Amazia had laten terugkeren, zodat zij niet met hem in de strijd zouden trekken, deden een inval in de steden van Juda, van Samaria af tot Beth-horon toe, en sloegen van hen drieduizend, en roofden veel van het roof.", "Luk 12:58": "Want als u met uw tegenpartij naar de overheid gaat, doe dan onderweg moeite om van hem verlost te worden; anders zou hij u misschien voor de rechter slepen, en de rechter zou u aan de gerechtsdienaar overleveren, en de gerechtsdienaar zou u in de gevangenis werpen.", "Ps 119:27": "Geef mij de weg van Uw bevelen te verstaan, opdat ik Uw wonderen betracht.", "Ef 6:18-20": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen; en voor mij, opdat mij het Woord gegeven wordt bij het openen van mijn mond, met vrijmoedigheid, om de verborgenheid van het Evangelie bekend te maken; waarvoor ik een gezant ben in een keten, opdat ik daarin vrijmoedig mag spreken, zoals het mij past te spreken.", "2 Kron 25:16": "En het gebeurde, toen hij tot hem sprak, dat hij hem zei: Heeft men u tot raadgever van de koning aangesteld? Houd op; waarom zou men u slaan? Toen hield de profeet op, en zei: Ik merk dat God besloten heeft u te vernietigen, omdat u dit gedaan hebt, en naar mijn raad niet hebt geluisterd.", "Ezra 5:15": "En hij zei tegen hem: Neem deze vaten, ga ze afvoeren naar de tempel die te Jeruzalem is, en laat het huis van God gebouwd worden op zijn plaats.", "1 Kron 16:4": "En hij stelde voor de ark van de HEERE sommigen uit de Levieten aan tot dienaars, en dat om de HEERE, de God van Israël, te vermelden, en te loven, en te prijzen.", "Joz 19:51": "Dit zijn de erfdelen die Eleazar, de priester, en Jozua, de zoon van Nun, en de hoofden van de vaders van de stammen van de kinderen van Israël door het lot erfelijk uitdeelden te Silo, voor het aangezicht van de HEERE, aan de deur van de tent van de samenkomst. Zo maakten zij een einde aan het uitdelen van het land.", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "2 Tim 2:7": "Bedenk wat ik zeg; en de Heere geeft u inzicht in alle dingen.", "2 Sam 20:1": "Toen was daar bij toeval een man van Belial, wiens naam was Seba, een zoon van Bichri, een man van Jemini; die blies op de bazuin, en zei: Wij hebben geen deel aan David, en wij hebben geen erfenis aan de zoon van Isaï, ieder naar zijn tenten, o Israël!", "2 Sam 13:13": "Want ik, waarheen zou ik mijn schande brengen? En u, u zou zijn als een van de dwazen in Israël; spreek toch nu met de koning, want hij zal mij niet aan u onthouden.", "Num 27:5": "En Mozes bracht hun rechtszaak voor de HEERE.", "2 Kron 30:5": "Zo besloten zij dit, dat men een oproep door heel Israël, van Berseba tot Dan, zou laten doorgaan, dat zij zouden komen om het pascha voor de HEERE, de God van Israël, te houden in Jeruzalem; want zij hadden het lange tijd niet gehouden, zoals het geschreven was.", "1 Sam 30:8": "Toen vroeg David de HEERE: Zal ik deze bende achternajagen? Zal ik ze inhalen? En Hij zei tegen hem: Jaag na, want u zult zeker inhalen, en u zult zeker verlossen.", "1 Sam 30:22": "Toen antwoordde ieder slecht en verdorven man onder de mannen die met David waren meegegaan, en zij zeiden: Omdat zij niet met ons zijn meegegaan, zullen wij hun van de buit die wij gered hebben, niets geven, maar aan ieder zijn vrouw en zijn kinderen; laat hen die meenemen en weggaan.", "1 Sam 7:6": "En zij werden verzameld te Mizpa, en zij schepten water en goten het uit voor het aangezicht van de HEERE; en zij vastten die dag, en zeiden daar: Wij hebben tegen de HEERE gezondigd. Zo richtte Samuël de kinderen van Israël te Mizpa.", "Ezra 9:5": "En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God;", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "2 Sam 5:23": "En David vroeg de HEERE, Die zei: U zult niet optrekken; maar trek om, tot achter hen, zodat u bij hen komt van tegenover de moerbeibomen;", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Joz 7:7": "En Jozua zei: Ach, Heere HEERE! Waarom hebt U dit volk ooit de Jordaan laten oversteken, om ons te geven in de hand van de Amorieten, om ons te vernietigen? Was het toch maar zo dat wij tevreden waren geweest en gebleven waren aan de overkant van de Jordaan!", "1 Kron 13:3": "En laten wij de ark van onze God naar ons terughalen, want wij hebben er in de dagen van Saul niet naar gevraagd.", "2 Kron 5:14": "En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.", "Neh 6:10": "Toen ik in het huis kwam van Semaja, de zoon van Delaja, de zoon van Mehetabeel — hij was namelijk opgesloten — zei hij: Laten wij samenkomen in het huis van God, binnen in de tempel, en laten wij de deuren van de tempel sluiten; want zij zullen komen om u te doden, ja, 's nachts zullen zij komen om u te doden.", "Kol 2:1-3": "Want ik wil dat u weet hoe zware strijd ik voor u heb, en voor hen die in Laodicea zijn, en voor allen die mijn gezicht in het vlees niet gezien hebben; Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus; In Wie al de schatten van de wijsheid en van de kennis verborgen zijn.", "Pred 8:11": "Omdat het oordeel over de boze daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen.", "Joz 8:4-22": "en gebood hun: Let op, u zult de stad in een hinderlaag lokken van achter de stad; houd u niet al te ver van de stad, en wees allen gereed. Ik nu, en al het volk dat bij mij is, zullen de stad naderen; en het zal gebeuren, wanneer zij ons tegemoet uittrekken zoals eerst, dat wij voor hen zullen vluchten. Laat hen dan achter ons aan komen, totdat wij hen van de stad weggetrokken hebben; want zij zullen zeggen: Zij vluchten voor ons, zoals eerst; zo zullen wij voor hen vluchten.", "1 Sam 2:25": "Wanneer een mens tegen een mens zondigt, zullen de goden hem oordelen; maar wanneer een mens tegen de HEERE zondigt, wie zal voor hem bidden? Maar zij luisterden niet naar de stem van hun vader, want de HEERE wilde hen doden.", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "2 Kron 28:6-9": "Want Pekah, de zoon van Remalia, doodde in Juda honderdtwintigduizend man op één dag, allen strijdbare mannen, omdat zij de HEERE, de God van hun vaderen, verlaten hadden. En Zichri, een geweldig man van Efraïm, doodde Maaseja, de zoon van de koning, en Azrikam, de leider van het huis, alsook Elkana, de tweede na de koning. En de kinderen van Israël voerden van hun broeders tweehonderdduizend gevangenen weg, vrouwen, zonen en dochters, en plunderden ook veel roof van hen; en zij brachten de roof naar Samaria.", "Job 34:32": "Behalve wat ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "1 Kron 12:2": "Gewapend met bogen, rechts en links met stenen werpend, en met pijlen schietend uit de boog; zij waren van de broers van Saul, uit Benjamin.", "Deut 17:7": "De hand van de getuigen zal eerst tegen hem zijn om hem te doden, en daarna de hand van het hele volk; zo moet u het kwaad uit uw midden wegdoen.", "Joël 2:30": "En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Gen 32:7": "Toen werd Jakob erg bang en benauwd; en hij verdeelde het volk dat bij hem was, en de schapen, en de runderen, en de kamelen, in twee legers;", "Ezra 7:20": "Het overige nu, dat nodig zal zijn voor het huis van uw God, dat u zult moeten uitgeven, zult u geven uit het schathuis van de koning.", "Richt 19:22-27": "Toen zij nu hun hart vrolijk maakten, zie, omringden de mannen van die stad (mannen, die kinderen van Belial waren) het huis, en klopten op de deur; en zij spraken tegen de oude man, de heer van het huis, en zeiden: Breng de man die in uw huis gekomen is naar buiten, zodat wij hem bekennen. En de man, de heer van het huis, ging naar hen toe naar buiten, en zei tegen hen: Nee, mijn broeders, doe toch zo'n kwaad niet; omdat deze man in mijn huis gekomen is, doe zo'n dwaasheid niet. Zie, mijn dochter die maagd is, en zijn bijvrouw, die zal ik nu naar buiten brengen, opdat u hen schendt, en met hen doet wat goed is in uw ogen; maar doe aan deze man zo'n dwaze zaak niet.", "Neh 11:11": "Seraja, de zoon van Hilkia, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, was voorganger van Gods huis;", "Joz 8:16": "Daarom werd al het volk dat in de stad was, samengeroepen om hen na te jagen; en zij joegen Jozua na, en werden van de stad weggetrokken.", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Num 14:44": "Toch waagden zij het roekeloos, om de top van de berg te beklimmen; maar de ark van het verbond van de HEERE en Mozes weken niet uit het midden van het leger.", "Gen 28:17": "En hij vreesde, en zei: Hoe ontzagwekkend is deze plaats! Dit is niets anders dan een huis van God, en dit is de poort van de hemel!", "Joz 8:3-25": "Toen maakte Jozua zich klaar, en al het krijgsvolk, om op te trekken naar Ai. En Jozua koos dertigduizend mannen, strijdbare helden, en hij stuurde hen 's nachts erop uit, en gebood hun: Let op, u zult de stad in een hinderlaag lokken van achter de stad; houd u niet al te ver van de stad, en wees allen gereed. Ik nu, en al het volk dat bij mij is, zullen de stad naderen; en het zal gebeuren, wanneer zij ons tegemoet uittrekken zoals eerst, dat wij voor hen zullen vluchten.", "1 Kor 5:1": "Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft.", "Ps 119:135": "Doe Uw aangezicht lichten over Uw knecht, en leer mij Uw inzettingen.", "Num 27:21": "En hij zal voor Eleazar, de priester, staan, die voor hem om raad zal vragen, volgens de wijze van Urim, voor de HEERE; naar zijn woord zullen zij uitgaan, en naar zijn woord zullen zij ingaan, hij, en alle kinderen van Israël met hem, en de hele vergadering.", "Richt 7:9": "En het gebeurde in die nacht, dat de HEERE tegen hem zei: Sta op, ga naar beneden naar het leger, want Ik heb het in uw hand gegeven.", "2 Kron 20:3": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda.", "1 Sam 2:14": "En sloeg die in de teil, of in de ketel, of in de pan, of in de pot; al wat de vork optrok, dat nam de priester voor zich. Zo deden zij aan alle Israëlieten die in Silo kwamen.", "Ps 39:5": "HEERE, maak mij mijn einde bekend, en welke de mate van mijn dagen is; dat ik weet, hoe vergankelijk ik ben.", "Joz 15:38": "en Dilan, en Mizpa, en Jokteël,", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Ps 119:80": "Laat mijn hart oprecht zijn tot Uw inzettingen, opdat ik niet beschaamd word.", "Joz 7:15": "En het zal gebeuren: wie aangewezen wordt met de ban, die zal met vuur verbrand worden, hij en alles wat hij heeft; omdat hij het verbond van de HEERE overtreden heeft, en omdat hij dwaasheid in Israël gedaan heeft.", "Ps 84:11": "Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.", "Openb 19:3": "En zij zeiden ten tweeden maal: Halleluja! En haar rook gaat op in alle eeuwigheid.", "1 Sam 14:37": "Toen vroeg Saul God: Zal ik de Filistijnen achterna trekken? Zult U ze in de hand van Israël overgeven? Maar Hij antwoordde hem die dag niet.", "1 Sam 25:29": "Wanneer een mens opstaat om u te vervolgen en om uw ziel te zoeken, dan zal de ziel van mijn heer ingebonden zijn in het bundeltje van de levenden bij de HEERE, uw God; maar de ziel van uw vijanden zal Hij wegslingeren uit de holte van de slinger.", "Ezech 22:11": "Daarbij heeft de een gruwel gedaan met de vrouw van zijn naaste, en een ander heeft de vrouw van zijn zoon met schandelijkheid verontreinigd; nog een ander heeft in u zijn zuster, de dochter van zijn vader, verkracht.", "Ps 119:66": "Leer mij een goede zin en wetenschap, want ik heb aan Uw geboden geloofd.", "Joël 2:12-18": "Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen. En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade. Wie weet, Hij mocht Zich wenden en berouw hebben; en Hij mocht een zegen achter Zich overlaten tot spijsoffer en drankoffer voor de HEERE, uw God.", "1 Sam 23:4-12": "Toen vroeg David de HEERE nog verder; en de HEERE antwoordde hem en zei: Maak u op, trek af naar Kehila; want Ik geef de Filistijnen in uw hand. Zo trok David met zijn mannen naar Kehila, en hij streed tegen de Filistijnen, en dreef hun vee weg, en hij bracht hun een grote slag toe; zo verloste David de inwoners van Kehila. En het gebeurde, toen Abjathar, de zoon van Achimelech, naar David vluchtte naar Kehila, dat hij afkwam met de efod in zijn hand.", "2 Sam 20:22": "En de vrouw kwam bij al het volk, met haar wijsheid; en zij hieuwen Seba, de zoon van Bichri, het hoofd af, en wierpen het naar Joab. Toen blies hij op de bazuin, en zij verstrooiden zich van de stad, ieder naar zijn tenten; en Joab keerde terug naar Jeruzalem tot de koning.", "Joz 8:20-22": "Toen de mannen van Ai zich omkeerden, zagen zij, en zie, de rook van de stad steeg op naar de hemel; en zij hadden geen mogelijkheid om deze of gene kant op te vluchten; want het volk dat naar de woestijn vluchtte, keerde zich om tegen hen die hen achtervolgden. En Jozua en heel Israël, ziende dat de hinderlaag de stad had ingenomen, en dat de rook van de stad opsteeg, keerden zich om, en sloegen de mannen van Ai. Ook kwamen zij die uit de stad kwamen, hun tegemoet, zodat zij midden tussen de Israëlieten waren, dezen van hier en genen van daar; en zij sloegen hen, totdat er niemand van hen overbleef, noch iemand ontkwam.", "Gen 32:8": "want hij zei: Als Ezau op het ene leger afkomt en het verslaat, dan zal het overgebleven leger ontkomen.", "Joz 22:13": "En de kinderen van Israël zonden naar de kinderen van Ruben, en naar de kinderen van Gad, en naar de halve stam van Manasse, in het land Gilead, Pinehas, de zoon van Eleazar, de priester;", "Gen 14:15": "En hij verdeelde zich tegen hen 's nachts, hij en zijn knechten, en versloeg hen; en hij achtervolgde hen tot Hoba toe, dat ten noorden van Damaskus ligt.", "Richt 20:12-48": "En de stammen van Israël zonden mannen door de hele stam van Benjamin, en zeiden: Wat voor een kwaad is dit, dat onder u gebeurd is? Geef nu dan die mannen, die kinderen van Belial, die te Gibea zijn, zodat wij hen doden en het kwaad uit Israël wegdoen. Doch de kinderen van Benjamin wilden niet luisteren naar de stem van hun broeders, de kinderen van Israël. Maar de kinderen van Benjamin verzamelden zich uit de steden naar Gibea, om uit te trekken ten strijde tegen de kinderen van Israël.", "2 Kon 25:23": "Toen nu alle aanvoerders van de legers, zij en hun mannen, hoorden dat de koning van Babel Gedalia tot leider had aangesteld, kwamen zij tot Gedalia naar Mizpa; namelijk Ismaël, de zoon van Nethanja, en Johanan, de zoon van Kareah, en Seraja, de zoon van Tanhumeth, de Netofathiet, en Jaazanja, de zoon van de Maachathiet, zij en hun mannen.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Pred 8:12": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.", "Luk 21:26": "En de mensen zal het hart bezwijken van vrees en verwachting van de dingen die het aardrijk zullen overkomen; want de krachten van de hemelen zullen bewogen worden.", "Spr 29:6": "In de overtreding van een boze man is een valstrik; maar de rechtvaardige juicht en is blij.", "2 Kron 36:19": "En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Jes 3:10": "Zegt de rechtvaardige, dat het hem goed zal gaan; dat zij de vrucht van hun werken zullen eten.", "Ps 73:18": "Zeker, U zet hen op gladde plaatsen; U doet hen vallen in verwoestingen.", "Richt 19:13": "Verder zei hij tegen zijn knecht: Kom, laten wij naderen tot een van die plaatsen, en overnachten in Gibea of in Rama.", "1 Kron 24:5": "En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.", "Joz 8:14": "En het gebeurde, toen de koning van Ai dat zag, dat zij zich haastten en zich vroeg opmaakten, en de mannen van de stad kwamen naar buiten, Israël tegemoet, ten strijde, hij en al zijn volk, op de vastgestelde tijd, voor het vlakke veld; want hij wist niet dat men hem een hinderlaag had gelegd van achter de stad.", "Richt 21:5": "En de kinderen van Israël zeiden: Wie is er, van al de stammen van Israël, die niet is opgekomen in de vergadering tot de HEERE? Want er was een grote eed gezworen aangaande hem die niet opkwam tot de HEERE te Mizpa: Hij zal zeker gedood worden.", "1 Sam 14:41": "Saul nu sprak tot de HEERE, de God van Israël: Toon de onschuldige. Toen werden Jonathan en Saul aangewezen, en het volk ging vrijuit.", "Ex 15:9": "De vijand zei: Ik zal vervolgen, ik zal achterhalen, ik zal de buit delen, mijn ziel zal van hen vervuld worden, ik zal mijn zwaard trekken, mijn hand zal hen uitroeien.", "Richt 19:15-28": "En zij weken daarheen af, om daar in te gaan en in Gibea te overnachten. Toen hij nu naar binnen ging, ging hij zitten op een plein van de stad, want er was niemand die hen in huis nam om te overnachten. En zie, een oude man kwam 's avonds van zijn werk uit het veld, welke man ook van het gebergte van Efraïm was, maar als vreemdeling verkeerde in Gibea; de mensen van die plaats waren echter kinderen van Jemini. Toen hij nu zijn ogen opsloeg, zag hij die reizende man op het plein van de stad; en de oude man zei: Waar gaat u heen, en waar komt u vandaan?", "Luk 14:31": "Of welke koning die ten strijde trekt om tegen een andere koning te vechten, gaat niet eerst zitten om te overleggen of hij wel in staat is om met tienduizend man degene te ontmoeten die met twintigduizend man tegen hem optrekt?", "2 Kron 6:41": "En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.", "Luk 12:59": "Ik zeg u: u zult daar geenszins uitgaan, totdat u ook de laatste penning betaald hebt.", "Ezra 8:21": "Toen riep ik daar een vasten uit bij de rivier Ahava, opdat wij ons zouden verootmoedigen voor het aangezicht van onze God, om van Hem te verzoeken een rechte weg, voor ons, en voor onze kinderen, en voor al onze have.", "Num 1:46": "Al de getelden dan waren zeshonderddrieduizend vijfhonderdvijftig.", "1 Kon 3:9": "Geef dan Uw knecht een verstandig hart om Uw volk te richten, en om onderscheid te kunnen maken tussen goed en kwaad; want wie zou dit zware volk van U kunnen richten?", "Jer 7:12": "Want ga nu naar Mijn plaats die te Silo was, waar Ik Mijn Naam in het begin had laten wonen; en zie wat Ik daaraan gedaan heb vanwege de slechtheid van Mijn volk Israël.", "Richt 21:2": "Zo kwam het volk naar het huis van God, en zij bleven daar tot de avond, voor het aangezicht van God; en zij hieven hun stem op en weenden met groot geween.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Richt 19:23": "En de man, de heer van het huis, ging naar hen toe naar buiten, en zei tegen hen: Nee, mijn broeders, doe toch zo'n kwaad niet; omdat deze man in mijn huis gekomen is, doe zo'n dwaasheid niet.", "Deut 18:5": "want de HEERE, uw God, heeft hem uit al uw stammen verkozen, dat hij staat om te dienen in de Naam van de HEERE, hij en zijn zonen, alle dagen.", "Jona 3:5-10": "En de mensen van Nineve geloofden God; en zij riepen een vasten uit, en bekleedden zich met zakken, van hun grootste tot hun kleinste toe. Want dit woord bereikte de koning van Nineve, en hij stond op van zijn troon, en deed zijn heerlijke overkleed van zich af; en hij bedekte zich met een zak, en zat neer in de as. En hij liet uitroepen, en men sprak te Nineve, op bevel van de koning en zijn groten: Laat mens noch dier, rund noch schaap, iets proeven, laat ze niet grazen, noch water drinken.", "Gen 49:8-10": "Juda! U bent het, u zullen uw broers loven; uw hand zal zijn op de nek van uw vijanden; voor u zullen de zonen van uw vader zich neerbuigen. Juda is een leeuwenwelp! U bent van de roof opgeklommen, mijn zoon! Hij kromt zich, hij legt zich neer als een leeuw, en als een oude leeuw; wie zal hem doen opstaan? De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Richt 21:13": "Toen zond de hele vergadering heen, en sprak tot de kinderen van Benjamin die in de rots Rimmon waren, en zij riepen hun vrede toe.", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Jer 7:14": "daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb.", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Pred 9:12": "Want ook de mens kent zijn tijd niet: zoals de vissen die gevangen worden met een kwaadaardig net, en zoals de vogels die gevangen worden met de strik, zo worden de mensenkinderen verstrikt, op een kwade tijd, wanneer die plotseling over hen valt.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "2 Sam 6:7-12": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God. En David werd toornig, omdat de HEERE een scheur gescheurd had aan Uza; en hij noemde die plaats Perez-uza, tot op deze dag. En David vreesde de HEERE die dag; en hij zei: Hoe zal de ark van de HEERE bij mij komen?", "1 Sam 23:9-11": "Toen David begreep dat Saul dit kwaad heimelijk tegen hem voorhad, zei hij tegen de priester Abjathar: Breng de efod hierheen. En David zei: HEERE, God van Israël! Uw dienaar heeft zeker gehoord dat Saul van plan is naar Kehila te komen, om de stad te vernietigen om mijnentwil. Zullen de burgers van Kehila mij ook in zijn hand overgeven? Zal Saul afkomen, zoals Uw dienaar gehoord heeft? O HEERE, God van Israël, vertel het toch aan Uw dienaar! En de HEERE zei: Hij zal afkomen.", "Deut 4:6": "Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk!", "2 Sam 5:19-24": "Toen vroeg David de HEERE: Zal ik optrekken tegen de Filistijnen? Zult U hen in mijn hand geven? En de HEERE zei tegen David: Trek op, want Ik zal de Filistijnen zeker in uw hand geven. Toen kwam David bij Baäl-Perazim; en David sloeg hen daar, en zei: De HEERE heeft mijn vijanden voor mijn aangezicht uiteengeslagen, zoals een doorbraak van water; daarom noemde hij die plaats Baäl-Perazim. En zij lieten hun afgoden daar achter; en David en zijn mannen namen ze mee.", "Job 20:5": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik?", "Joz 18:26": "En Mizpe, en Chefira, en Moza,", "1 Kron 21:5": "En Joab gaf aan David het aantal van het getelde volk; en heel Israël was elfhonderdduizend man, die het zwaard uittrokken, en Juda vierhonderdzeventigduizend man, die het zwaard uittrokken.", "Ezra 7:23": "Alles wat naar het bevel van de God van de hemel is, dat dat vlijtig gedaan wordt, voor het huis van de God van de hemel; want waartoe zou er grote toorn zijn over het koninkrijk van de koning en zijn kinderen?", "Rom 1:32": "die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.", "Richt 21:1": "De mannen van Israël hadden in Mizpa gezworen: Niemand van ons zal zijn dochter aan de Benjaminieten tot vrouw geven.", "Richt 3:15": "Toen riepen de kinderen van Israël tot de HEERE, en de HEERE verwekte hun een verlosser, Ehud, de zoon van Gera, een zoon van Jemini, een man die links was. En de kinderen van Israël zonden door zijn hand een geschenk aan Eglon, de koning van de Moabieten.", "Hoogl 3:6": "Wie is zij, die daar opkomt uit de woestijn, als rookpilaren, berookt met mirre en wierook, en met allerlei poeder van de kruidenier?", "Ps 31:4": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "1 Sam 15:4": "Dit verkondigde Saul aan het volk, en hij telde hen te Telaïm, tweehonderdduizend man van het voetvolk, en tienduizend man van Juda.", "Ezra 3:1": "Toen nu de zevende maand aankwam, en de kinderen van Israël in de steden waren, verzamelde het volk zich, als één man, te Jeruzalem.", "2 Kon 3:26": "Doch toen de koning van de Moabieten zag dat de strijd hem te sterk werd, nam hij zevenhonderd man met zich mee, die het zwaard trokken, om door te breken naar de koning van Edom toe; maar zij konden het niet.", "Ps 86:11": "Leer mij, HEERE! Uw weg; ik zal in Uw waarheid wandelen; verenig mijn hart tot de vreze van uw Naam.", "Joël 1:16": "Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God?", "Richt 19:25": "Maar de mannen wilden niet naar hem luisteren. Toen greep de man zijn bijvrouw, en bracht haar naar buiten naar hen toe; en zij bekenden haar, en waren de hele nacht tot aan de morgen met haar bezig, en lieten haar gaan toen de dageraad aanbrak.", "Gen 17:21": "Maar Mijn verbond zal Ik met Izak oprichten, die Sara u op deze vastgestelde tijd in het volgende jaar baren zal.", "Deut 13:13": "Er zijn mannen, kinderen van Belial, uit uw midden uitgegaan, en hebben de inwoners van hun stad aangedreven, en gezegd: Laat ons gaan, en andere goden dienen, die u niet gekend hebt;", "Joz 7:5": "En de mannen van Ai versloegen van hen ongeveer zesendertig man, en achtervolgden hen vanaf de poort tot Schebarim toe, en versloegen hen bij de afgang. Toen versmolt het hart van het volk, en het werd tot water.", "Ps 64:6": "Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?", "Hand 1:26": "En zij wierpen hun loten; en het lot viel op Matthias, en hij werd met algemene instemming bij de elf apostelen gerekend.", "1 Sam 11:8": "En hij telde hen in Bezek; en van de kinderen van Israël waren er driehonderdduizend, en van de mannen van Juda dertigduizend.", "Joz 8:18-22": "Toen sprak de HEERE tegen Jozua: Strek de speer uit die in uw hand is, naar Ai, want Ik zal hen in uw hand geven. Toen strekte Jozua de speer die in zijn hand was, naar de stad uit. Toen kwam de hinderlaag snel omhoog van haar plaats, en zij liepen erheen, zodra hij zijn hand had uitgestrekt, en kwamen bij de stad, en zij namen haar in, en zij haastten zich, en staken de stad in brand. Toen de mannen van Ai zich omkeerden, zagen zij, en zie, de rook van de stad steeg op naar de hemel; en zij hadden geen mogelijkheid om deze of gene kant op te vluchten; want het volk dat naar de woestijn vluchtte, keerde zich om tegen hen die hen achtervolgden.", "Hos 9:9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "Hos 10:9": "Sinds de dagen van Gibea hebt u gezondigd, o Israël; daar zijn zij blijven staan; de strijd te Gibea tegen de kinderen van de verkeerdheid zal hen niet inhalen.", "Matt 5:25": "Wees snel welgezind tegenover uw tegenpartij, terwijl u nog met hem onderweg bent, opdat de tegenpartij u misschien niet aan de rechter overlevert, en de rechter u aan de gerechtsdienaar overlevert, en u in de gevangenis geworpen wordt.", "Jak 1:5": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.", "Ps 139:24": "En zie, of er bij mij een schadelijke weg is; en leid mij op de eeuwige weg.", "1 Sam 7:5": "Verder zei Samuël: Verzamel heel Israël naar Mizpa, en ik zal de HEERE voor u bidden.", "Pred 11:10": "Doe dan de toorn wijken uit uw hart, en doe het kwade weg van uw lichaam, want de jeugd en de jonge jaren zijn vergankelijk.", "Joz 17:1": "De stam van Manasse had ook een lot, omdat hij de eerstgeborene van Jozef was: te weten Machir, de eerstgeborene van Manasse, de vader van Gilead; omdat hij een krijgsman was, had hij Gilead en Bazan.", "2 Kron 1:10": "Geef mij nu wijsheid en kennis, zodat ik voor het aangezicht van dit volk uitga en inga; want wie zou dit Uw grote volk kunnen richten?", "Luk 17:27": "Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf.", "Ps 119:125": "Ik ben Uw knecht, maak mij verstandig, en ik zal Uw getuigenissen kennen.", "Ps 119:33": "He. HEERE! leer mij de weg van Uw inzettingen, en ik zal hem houden tot het einde toe.", "1 Kon 8:36": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt.", "Richt 8:10": "Zebah nu en Tsalmuna waren in Karkor, en hun legers met hen, ongeveer vijftienduizend man, alles wat er over was van het hele leger van de mensen uit het oosten; en de gesneuvelden waren honderdtwintigduizend man, die het zwaard hanteerden.", "Gen 34:7": "En de zonen van Jakob kwamen van het veld toen zij dit hoorden; en het deed deze mannen verdriet, en zij ontstaken in grote woede, omdat hij dwaasheid in Israël gedaan had door bij Jakobs dochter te liggen, wat zo niet gedaan had mogen worden.", "Joz 6:12": "Daarna stond Jozua 's morgens vroeg op, en de priesters droegen de ark van de HEERE.", "Num 31:4": "Van elke stam onder alle stammen van Israël zult u duizend man ten strijde zenden.", "Pred 4:17": "Let op uw voet, als u naar het huis van God gaat, en wees liever bereid om te horen, dan om het offer van dwazen te geven; want zij weten niet dat zij kwaad doen.", "Kol 1:10": "opdat u mag wandelen op een manier die de Heere waardig is, tot alle behagelijkheid, terwijl u in alle goede werken vrucht draagt en meer wordt in de kennis van God;", "1 Sam 4:4": "Het volk zond dan naar Silo, en men bracht vandaar de ark van het verbond van de HEERE van de heerscharen, die tussen de cherubs† woont; en de twee zonen van Eli, Hofni en Pinehas, waren daar bij de ark van het verbond van God.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Richt 19:29": "Toen hij nu in zijn huis kwam, nam hij een mes, en greep zijn bijvrouw, en verdeelde haar met haar botten in twaalf stukken; en hij zond ze naar alle gebieden van Israël.", "Joël 1:14": "Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE.", "Num 26:51": "Dat zijn de getelden van de zonen van Israël: zeshonderdéénduizend zevenhonderddertig.", "Deut 10:8": "In die tijd zonderde de HEERE de stam Levi af, om de ark van het verbond van de HEERE te dragen, om voor het aangezicht van de HEERE te staan, om Hem te dienen, en om in Zijn Naam te zegenen, tot op deze dag.", "2 Kon 4:16": "En hij zei: Op deze vastgestelde tijd, omtrent deze tijd van het jaar, zult u een zoon omhelzen. En zij zei: Nee, mijn heer, u, man Gods, lieg niet tegen uw dienares.", "Ps 119:169": "Thau. O HEERE! laat mijn geschrei voor Uw aanschijn genaken, maak mij verstandig naar Uw woord.", "Joz 7:6": "Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd.", "1 Sam 11:7": "En hij nam een paar runderen en hakte ze in stukken, en stuurde die door de hand van de boden naar alle grensgebieden van Israël, en zei: Wie niet zelf uittrekt achter Saul en achter Samuël aan, met zijn runderen zal hetzelfde gedaan worden. Toen viel de vreze van de HEERE op het volk, en zij gingen uit als één man.", "Spr 4:19": "De weg van de goddelozen is als donkerheid; zij weten niet, waarover zij zullen struikelen.", "Ps 119:124": "Doe bij Uw knecht naar Uw goedertierenheid, en leer mij Uw inzettingen.", "Num 32:40": "Zo gaf Mozes Gilead aan Machir, de zoon van Manasse; en hij woonde daarin.", "1 Sam 14:42": "Toen zei Saul: Werp het lot tussen mij en mijn zoon Jonathan. Toen werd Jonathan aangewezen.", "Joz 9:23": "Nu dan, vervloekt bent u! en onder u zullen altijd knechten blijven, houthakkers en waterputters voor het huis van mijn God.", "Ps 55:15": "Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "2 Sam 24:9": "En Joab gaf de som van het getelde volk aan de koning; en in Israël waren achthonderdduizend strijdbare mannen die het zwaard trokken, en de mannen van Juda waren vijfhonderdduizend man.", "Est 4:3": "En in elk landschap en elke plaats, waar het woord van de koning en zijn wet aankwam, was er grote rouw onder de Joden, met vasten, geween en misbaar; velen lagen in zakken en as.", "Joz 24:33": "Ook stierf Eleazar, de zoon van Aäron; en zij begroeven hem op de heuvel van Pinehas, zijn zoon, die hem gegeven was op het gebergte van Efraïm.", "Ex 19:13": "Geen hand zal hem aanraken, maar hij zal zeker gestenigd worden, of zeker doorschoten worden; hetzij een dier, hetzij een man, hij zal niet blijven leven. Als de ramshoorn langzaam klinkt, zullen zij de berg beklimmen.", "Ps 119:144": "De gerechtigheid van Uw getuigenissen is in de eeuwigheid; doe mij ze verstaan, zo zal ik leven.", "Num 25:7-13": "Toen Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, dat zag, stond hij op uit het midden van de vergadering, en nam een spies in zijn hand; en hij ging de Israëlitische man achterna, de tent in, en doorstak hen beiden, de Israëlitische man en de vrouw, door hun buik. Toen hield de plaag over de kinderen van Israël op. Degenen nu die aan de plaag stierven, waren vierentwintigduizend.", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Luk 17:28": "Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "Joz 9:14": "Toen namen de mannen van hun reiskost; en zij vroegen het de mond van de HEERE niet.", "Ps 78:34-36": "Toen Hij hen doodde, zochten zij Hem, en keerden weer, en zochten God vroeg; En zij dachten eraan, dat God hun Rotssteen was, en God, de Allerhoogste, hun Verlosser. En zij vleiden Hem met hun mond, en logen tegen Hem met hun tong.", "Job 9:13": "God zal Zijn toorn niet afkeren; onder Hem worden de hoogmoedige helpers gebogen.", "Deut 23:9": "Wanneer het leger tegen uw vijanden uittrekt, dan zult u zich wachten voor elke kwade zaak.", "Gen 14:14": "Toen Abram hoorde dat zijn broeder gevangen was genomen, wapende hij zijn geoefende mannen, geboren in zijn eigen huis, driehonderd achttien, en hij achtervolgde hen tot Dan toe.", "2 Sam 3:10": "het koninkrijk overbrengen van het huis van Saul, en de troon van David oprichten over Israël en over Juda, van Dan tot Ber-seba toe.", "Num 32:1": "De nakomelingen van Ruben en de nakomelingen van Gad hadden veel vee, heel veel; en zij bekeken het land Jaezer en het land Gilead, en zie, deze plaats was een plaats geschikt voor vee.", "Ps 119:34": "Geef mij het verstand, en ik zal Uw wet houden; ja, ik zal ze onderhouden met heel mijn hart.", "Openb 18:4": "En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.", "Ezech 32:27": "Maar zij liggen niet met de helden die onder de onbesnedenen gevallen zijn; die naar het dodenrijk zijn neergedaald met hun oorlogswapens, en van wie de zwaarden gelegd zijn onder hun hoofden; hun ongerechtigheid is nochtans op hun beenderen, omdat de schrik van de helden in het land van de levenden geweest is.", "Ps 103:10": "Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "2 Kron 25:20": "Doch Amazia luisterde niet, want het was van God, opdat Hij hen in de hand van hun vijanden zou geven, omdat zij de goden van de Edomieten gezocht hadden.", "1 Sam 17:49": "En David stak zijn hand in de tas, en nam er een steen uit, en slingerde die, en trof de Filistijn in zijn voorhoofd, zodat de steen in zijn voorhoofd wegzonk, en hij viel voorover op de grond.", "Joz 8:15": "Jozua dan, en heel Israël, deed alsof zij voor hen verslagen werden; en zij vluchtten via de weg naar de woestijn.", "2 Kron 26:14": "En Uzzia bereidde voor hen, voor het gehele leger, schilden, en speren, en helmen, en pantsers, en bogen, zelfs tot de slingerstenen toe.", "Joz 7:6-15": "Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd. En Jozua zei: Ach, Heere HEERE! Waarom hebt U dit volk ooit de Jordaan laten oversteken, om ons te geven in de hand van de Amorieten, om ons te vernietigen? Was het toch maar zo dat wij tevreden waren geweest en gebleven waren aan de overkant van de Jordaan! Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd?", "1 Sam 30:7": "En David zei tegen de priester Abjathar, de zoon van Achimelech: Breng mij toch de efod hier. En Abjathar bracht de efod naar David.", "Deut 19:19": "dan zult u hem doen zoals hij van plan was zijn broeder te doen; zo zult u het kwaad uit uw midden wegdoen;", "Num 32:20-22": "Toen zei Mozes tegen hen: Als u deze zaak doen zult, als u zich voor het aangezicht van de HEERE toerust ten strijde, en ieder van u die toegerust is, over de Jordaan trekt voor het aangezicht van de HEERE, totdat Hij Zijn vijanden voor Zijn aangezicht uit de bezitting verdreven heeft, en het land voor het aangezicht van de HEERE onderworpen is, dan zult u daarna terugkeren en onschuldig zijn voor de HEERE en voor Israël, en dit land zal u ter bezitting zijn voor het aangezicht van de HEERE.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Joz 6:5": "En het zal gebeuren, als men langzaam op de ramshoorn blaast, als u het geluid van de bazuin hoort, dan zal heel het volk juichen met een groot gejuich; dan zal de stadsmuur onder zich vallen, en het volk zal daarin klimmen, ieder tegenover zich.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Deut 13:14": "dan zult u onderzoeken, en naspeuren, en goed navragen; en zie, als het de waarheid is, de zaak zeker vaststaat, zo'n gruwel in uw midden gedaan is;", "Gen 24:60": "En zij zegenden Rebekka, en zeiden tegen haar: O, onze zuster! Word u tot duizenden miljoenen, en laat uw nageslacht de poort van hun haters bezitten!", "Deut 22:21": "Dan zullen zij deze jonge dochter naar de deur van haar vaders huis brengen, en de mannen van haar stad zullen haar met stenen stenigen, zodat zij sterft, omdat zij een dwaasheid in Israël gedaan heeft door in haars vaders huis te hoereren; zo zult u het kwaad uit uw midden wegdoen.", "Joz 18:1": "En de hele gemeenschap van de kinderen van Israël verzamelde zich te Silo, en zij richtten daar de tent van de samenkomst op, nadat het land aan hen onderworpen was.", "Gen 49:27": "Benjamin zal als een wolf verscheuren; 's morgens zal hij roof eten, en 's avonds zal hij buit uitdelen.", "Joz 22:30-32": "Toen de priester Pinehas, en de leiders van de vergadering, en de hoofden van de duizenden van Israël, die met hem waren, de woorden hoorden, die de kinderen van Ruben, en de kinderen van Gad, en de kinderen van Manasse gesproken hadden, was het goed in hun ogen. En Pinehas, de zoon van de priester Eleazar, zei tegen de kinderen van Ruben, en tegen de kinderen van Gad, en tegen de kinderen van Manasse: Vandaag weten wij, dat de HEERE in het midden van ons is, omdat u deze overtreding tegen de HEERE niet begaan hebt; nu hebt u de kinderen van Israël verlost uit de hand van de HEERE. En Pinehas, de zoon van de priester Eleazar, keerde terug met de leiders van de kinderen van Ruben, en van de kinderen van Gad, uit het land Gilead, naar het land Kanaän, naar de kinderen van Israël; en zij brachten hun antwoord terug;", "Ps 25:4": "Daleth. HEERE! maak mij Uw wegen bekend, leer mij Uw paden.", "Rom 3:5": "Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.)", "Num 26:41": "Dat zijn de zonen van Benjamin, naar hun geslachten; en hun getelden waren vijfenveertigduizend zeshonderd.", "Richt 19:18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "1 Sam 17:40": "En hij nam zijn staf in zijn hand, en koos zich vijf gladde stenen uit de beek, en legde ze in de herderstas die hij had, namelijk in de zak, en zijn slinger was in zijn hand; zo naderde hij de Filistijn.", "1 Kron 21:2": "En David zei tegen Joab en tegen de leiders van het volk: Ga heen, tel Israël van Ber-seba tot Dan toe, en breng hen tot mij, dat ik hun aantal weet.", "Richt 19:26": "En deze vrouw kwam tegen het aanbreken van de morgenstond, en viel neer voor de deur van het huis van de man, waar haar heer was, totdat het licht werd.", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "Gen 19:4-8": "Eer zij zich te slapen legden, omsingelden de mannen van die stad, de mannen van Sodom, van de jongste tot de oudste toe, dat huis, het hele volk, van alle kanten. En zij riepen Lot toe, en zeiden tegen hem: Waar zijn die mannen die deze nacht bij u gekomen zijn? Breng hen naar buiten, naar ons toe, opdat wij met hen gemeenschap hebben. Toen ging Lot naar buiten naar hen toe, bij de deur, en hij sloot de deur achter zich toe;", "Ps 43:3": "Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Richt 20:29-41": "Toen stelde Israël hinderlagen op tegen Gibea rondom. En de kinderen van Israël trokken op, op de derde dag, tegen de kinderen van Benjamin; en zij schikten de strijd tegen Gibea, zoals de andere keren. Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.", "Deut 13:12-18": "Wanneer u van een van uw steden, die de HEERE, uw God, u geeft om daar te wonen, zult horen zeggen: Er zijn mannen, kinderen van Belial, uit uw midden uitgegaan, en hebben de inwoners van hun stad aangedreven, en gezegd: Laat ons gaan, en andere goden dienen, die u niet gekend hebt; dan zult u onderzoeken, en naspeuren, en goed navragen; en zie, als het de waarheid is, de zaak zeker vaststaat, zo'n gruwel in uw midden gedaan is;", "Spr 20:18": "Elke gedachte wordt door raad bevestigd, voer daarom oorlog met wijze raadslagen.", "Ezra 9:4": "Toen verzamelden zich bij mij allen die voor de woorden van de God van Israël beefden, om de overtreding van de weggevoerden; maar ik bleef verbaasd zitten tot aan het avondoffer.", "1 Sam 17:50": "Zo overweldigde David de Filistijn met een slinger en met een steen; en hij versloeg de Filistijn en doodde hem; doch David had geen zwaard in zijn hand.", "2 Kron 28:10": "Daartoe denkt u er nu aan om de kinderen van Juda en Jeruzalem u tot slaven en slavinnen te onderwerpen; bent u het zelf niet die schuldig staan? Bij u zijn schulden tegen de HEERE, uw God.", "Richt 21:19": "Toen zeiden zij: Zie, er is een feest van de HEERE te Silo, van jaar tot jaar, dat gehouden wordt ten noorden van het huis van God, ten oosten van de hoge weg die opgaat van het huis van God naar Sichem, en ten zuiden van Lebona.", "Richt 20:1-48": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa. En de leiders van heel het volk stelden zich op, alle stammen van Israël, in de vergadering van het volk van God, vierhonderdduizend man te voet, die het zwaard uittrokken. (De kinderen van Benjamin nu hoorden dat de kinderen van Israël opgetrokken waren naar Mizpa.) En de kinderen van Israël zeiden: Vertel ons, hoe is dit kwaad gebeurd?", "2 Kron 24:13": "Zo deden de verzorgers van het werk, dat de vooruitgang van het werk door hun hand toenam; en zij herstelden het huis van God naar zijn gestalte, en maakten het vast."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3318\">Toen</span> trokken <span class=\"wl\" data-l=\"L2\" data-code=\"H3605\">alle</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3478\">Israël</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3478\">uit</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H5712\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5712\">de</span> gemeenschap <span class=\"wl\" data-l=\"L6\" data-code=\"H6950\">verzamelde</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H6950\">zich</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H259\">als</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H259\">één</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H376\">man</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H376\">van</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H1835\">Dan</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5704\">af</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5704\">tot</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H884\">Ber</span>-<span class=\"wl\" data-l=\"L12\" data-code=\"H884\">seba</sp
