Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa.","2":"En de leiders van heel het volk stelden zich op, alle stammen van Israël, in de vergadering van het volk van God, vierhonderdduizend man te voet, die het zwaard uittrokken.","3":"(De kinderen van Benjamin nu hoorden dat de kinderen van Israël opgetrokken waren naar Mizpa.) En de kinderen van Israël zeiden: Vertel ons, hoe is dit kwaad gebeurd?","4":"Toen antwoordde de Levitische man, de man van de vrouw die gedood was, en zei: Ik kwam met mijn bijvrouw te Gibea, dat van Benjamin is, om te overnachten.","5":"En de burgers van Gibea maakten zich tegen mij op, en omringden het huis in de nacht om mij heen; zij waren van plan mij te doden, en mijn bijvrouw hebben zij verkracht, zodat zij gestorven is.","6":"Toen greep ik mijn bijvrouw, en deelde haar in stukken, en zond haar in het hele land van de erfenis van Israël, omdat zij een schandelijke daad en dwaasheid in Israël gedaan hadden.","7":"Zie, u bent allen kinderen van Israël, geef hier voor u woord en raad!","8":"Toen maakte heel het volk zich op, als één man, en zei: Wij zullen niet gaan, ieder naar zijn tent, en niet wijken, ieder naar zijn huis.","9":"Maar nu, dit is de zaak die wij tegen Gibea zullen doen: tegen haar bij het lot!","10":"En wij zullen tien mannen nemen van honderd, van alle stammen van Israël, en honderd van duizend, en duizend van tienduizend, om proviand te nemen voor het volk, zodat zij, wanneer zij komen te Gibea-van-Benjamin, met haar doen naar al de dwaasheid die zij in Israël gedaan heeft.","11":"Zo werden alle mannen van Israël verzameld bij deze stad, verbonden als één man.","12":"En de stammen van Israël zonden mannen door de hele stam van Benjamin, en zeiden: Wat voor een kwaad is dit, dat onder u gebeurd is?","13":"Geef nu dan die mannen, die kinderen van Belial, die te Gibea zijn, zodat wij hen doden en het kwaad uit Israël wegdoen. Doch de kinderen van Benjamin wilden niet luisteren naar de stem van hun broeders, de kinderen van Israël.","14":"Maar de kinderen van Benjamin verzamelden zich uit de steden naar Gibea, om uit te trekken ten strijde tegen de kinderen van Israël.","15":"En de kinderen van Benjamin werden op die dag geteld uit de steden, zesentwintigduizend man, die het zwaard uittrokken, behalve de inwoners van Gibea, die geteld werden, zevenhonderd uitgelezen mannen.","16":"Onder al dit volk waren zevenhonderd uitgelezen mannen, die linkshandig waren; deze allen slingerden met een steen op een haar nauwkeurig, zodat het hun niet miste.","17":"En de mannen van Israël werden geteld, behalve Benjamin, vierhonderdduizend man, die het zwaard uittrokken; deze allen waren mannen van oorlog.","18":"En de kinderen van Israël maakten zich op, en trokken op naar het huis van God, en vroegen God om raad, en zeiden: Wie zal onder ons als eerste optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zei: Juda als eerste.","19":"Zo maakten de kinderen van Israël zich in de morgen op, en legerden zich tegen Gibea.","20":"En de mannen van Israël trokken uit ten strijde tegen Benjamin; vervolgens schikten de mannen van Israël de strijd tegen hen bij Gibea.","21":"Toen trokken de kinderen van Benjamin uit Gibea, en zij velden op die dag van Israël tweeëntwintigduizend man neer ter aarde.","22":"Doch het volk versterkte zich, namelijk de mannen van Israël, en zij schikten de strijd opnieuw op de plaats waar zij die op de vorige dag geschikt hadden.","23":"En de kinderen van Israël trokken op, en weenden voor het aangezicht van de HEERE tot de avond, en vroegen de HEERE en zeiden: Zal ik weer naderen ten strijde tegen de kinderen van Benjamin, mijn broeder? En de HEERE zei: Trek tegen hem op.","24":"Zo naderden de kinderen van Israël tot de kinderen van Benjamin, op de tweede dag.","25":"En die van Benjamin trokken hun tegemoet, uit Gibea, op de tweede dag, en velden van de kinderen van Israël nog achttienduizend man neer ter aarde; die allen trokken het zwaard uit.","26":"Toen trokken alle kinderen van Israël en heel het volk op, en kwamen bij het huis van God, en weenden, en bleven daar voor het aangezicht van de HEERE, en vastten die dag tot de avond; en zij offerden brandoffers en dankoffers voor het aangezicht van de HEERE.","27":"En de kinderen van Israël vroegen de HEERE, want daar was de ark van het verbond van God in die dagen.","28":"En Pinehas, de zoon van Eleazar, de zoon van Aäron, stond voor Zijn aangezicht in die dagen, en zei: Zal ik nog meer uittrekken ten strijde tegen de kinderen van Benjamin, mijn broeder, of zal ik ophouden? En de HEERE zei: Trek op, want morgen zal Ik hem in uw hand geven.","29":"Toen stelde Israël hinderlagen op tegen Gibea rondom.","30":"En de kinderen van Israël trokken op, op de derde dag, tegen de kinderen van Benjamin; en zij schikten de strijd tegen Gibea, zoals de andere keren.","31":"Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.","32":"Toen zeiden de kinderen van Benjamin: Zij zijn voor ons aangezicht geslagen, zoals eerst; maar de kinderen van Israël zeiden: Laat ons vluchten, en hen van de stad aftrekken naar de wegen.","33":"Toen maakten alle mannen van Israël zich op uit hun plaatsen, en schikten de strijd te Baäl-thamar; ook brak Israëls hinderlaag op uit haar plaats, vanuit de open plek bij Gibea.","34":"En tienduizend uitgelezen mannen van heel Israël kwamen tegenover Gibea, en de strijd werd zwaar; doch zij wisten niet dat het kwaad hen treffen zou.","35":"Toen sloeg de HEERE Benjamin voor Israëls aangezicht; zodat de kinderen van Israël op die dag van Benjamin vijfentwintigduizend en honderd man velden; die allen trokken het zwaard uit.","36":"En de kinderen van Benjamin zagen dat zij geslagen waren; want de mannen van Israël gaven de Benjaminieten plaats, omdat zij vertrouwden op de hinderlaag die zij tegen Gibea gesteld hadden.","37":"En de hinderlaag haastte zich, en brak voorwaarts naar Gibea toe; ja, de hinderlaag trok recht door, en sloeg de hele stad met de scherpte van het zwaard.","38":"En de mannen van Israël hadden een afgesproken teken met de hinderlaag, dat zij een grote verheffing van rook uit de stad zouden laten opgaan.","39":"Zo keerden de mannen van Israël zich om in de strijd; en Benjamin had begonnen te slaan en te doorsteken van de mannen van Israël ongeveer dertig man; want zij zeiden: Zeker, hij is zeker voor ons aangezicht geslagen, zoals in de vorige strijd.","40":"Toen begon de verheffing op te gaan uit de stad, als een pilaar van rook; toen nu Benjamin achter zich omzag, ziet, zo ging de brand van de stad op naar de hemel.","41":"En de mannen van Israël keerden zich om; en de mannen van Benjamin werden verbaasd, want zij zagen dat het kwaad hen treffen zou.","42":"Zo wendden zij zich voor het aangezicht van de mannen van Israël naar de weg van de woestijn; maar de strijd haalde hen in, en die uit de steden vernielden hen in hun midden.","43":"Zij omringden Benjamin, zij vervolgden hem, zij vertrapten hem gemakkelijk, tot voor Gibea, tegen de opgang van de zon.","44":"En er vielen van Benjamin achttienduizend man; deze allen waren strijdbare mannen.","45":"Toen keerden zij zich om, en vluchtten naar de woestijn, tot de rots van Rimmon; maar zij deden een nalezing onder hen op de wegen, van vijfduizend man; verder kleefden zij hen achteraan tot aan Gideom, en sloegen van hen tweeduizend man.","46":"Zo waren allen die op die dag van Benjamin vielen, vijfentwintigduizend man, die het zwaard uittrokken; die allen waren strijdbare mannen.","47":"Doch zeshonderd man keerden zich om, en vluchtten naar de woestijn, tot de rots van Rimmon, en bleven bij de rots van Rimmon, vier maanden.","48":"En de mannen van Israël keerden terug tot de kinderen van Benjamin, en sloegen hen met de scherpte van het zwaard, van de hele stad tot de dieren toe, ja, al wat gevonden werd; ook staken zij alle steden die gevonden werden in brand."},"SV":{"1":"Toen togen alle kinderen Israëls uit, en de vergadering verzamelde zich, als een enig man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot den HEERE te Mizpa.","2":"En *uit* de hoeken des ganse volks stelden zich al de stammen van Israël in de vergadering van het volk Gods, vierhonderd duizend man te voet, die het zwaard uittrokken.","3":"(De kinderen Benjamins nu hoorden, dat de kinderen Israëls opgetogen naar Mizpa.) En de kinderen Israëls zeiden: Spreekt, hoe is dit kwaad geschied?","4":"Toen antwoordde de Levietische man, de man van de vrouw, die gedood was, en zeide: Ik kwam met mijn bijwijf te Gibea, dewelke Benjamins is, om te vernachten.","5":"En de burgers van Gibea maakten zich tegen mij op, en omringden tegen mij het huis bij nacht; zij dachten mij te doden, en mijn bijwijf hebben zij geschonden, dat zij gestorven is.","6":"Toen greep ik mijn bijwijf, en deelde haar, en zond haar in het ganse land der erfenis van Israël, omdat zij een schandelijke daad en dwaasheid in Israël gedaan hadden.","7":"Ziet, gij allen zijt kinderen Israëls, geeft hier voor ulieden woord en raad!","8":"Toen maakte zich al het volk op, als een enig man, zeggende: Wij zullen niet gaan, een ieder naar zijn tent, noch wijken, een ieder naar zijn huis.","9":"Maar nu, dit is de zaak, die wij aan Gibea zullen doen: tegen haar bij het lot!","10":"En wij zullen tien mannen nemen van honderd, van alle stammen Israëls, en honderd van duizend, en duizend van tienduizend, om teerkost te nemen voor het volk, opdat zij, komende te Gibea-benjamins, *haar* doen naar al de dwaasheid, die zij in Israël gedaan heeft.","11":"Alzo werden alle mannen van Israël verzameld tot deze stad, verbonden als een enig man.","12":"En de stammen van Israël zonden mannen door den ganse stam van Benjamin, zeggende: Wat voor een kwaad is dit, dat onder ulieden geschied is?","13":"Zo geeft nu die mannen, die kinderen Belials, die te Gibea zijn, dat wij hen doden, en het kwaad uit Israël wegdoen. Doch de *kinderen* van Benjamin wilden niet horen naar de stem van hun broederen, de kinderen Israëls.","14":"Maar de kinderen van Benjamin verzamelden zich uit de steden naar Gibea, om uit te trekken ten strijde tegen de kinderen Israëls.","15":"En de kinderen van Benjamin werden te dien dage geteld uit de steden, zes en twintig duizend mannen, die het zwaard uittrokken, behalve dat de inwoners van Gibea geteld werden, zevenhonderd uitgelezene mannen.","16":"Onder al dit volk waren zevenhonderd uitgelezene mannen, welke links waren; deze allen slingerden met een steen op een haar, dat het hun niet miste.","17":"En de mannen van Israël werden geteld, behalve Benjamin, vierhonderd duizend mannen, die het zwaard uittrokken; deze allen waren mannen van oorlog.","18":"En de kinderen Israëls maakten zich op, en togen opwaarts ten huize Gods, en vraagden God, en zeiden: Wie zal onder ons vooreerst optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zeide: Juda vooreerst.","19":"Alzo maakten zich de kinderen Israëls in den morgenstond op, en legerden zich tegen Gibea.","20":"En de mannen van Israël togen uit ten strijde tegen Benjamin; voorts schikten de mannen Israëls den strijd tegen hen bij Gibea.","21":"Toen togen de kinderen van Benjamin uit van Gibea, en zij vernielden ter aarde op dien dag van Israël twee en twintig duizend man.","22":"Doch het volk versterkte zich, *te* *weten* de mannen van Israël, en zij beschikten den strijd wederom ter plaatse, waar zij *dien* des vorigen daags geschikt hadden.","23":"En de kinderen Israëls togen op, en weenden voor het aangezicht des HEEREN tot op den avond, en vraagden den HEERE zeggende: Zal ik weder genaken ten strijde tegen de kinderen van Benjamin, mijn broeder? En de HEERE zeide: Trekt tegen hem op.","24":"Zo naderden de kinderen Israëls tot de kinderen van Benjamin, des anderen daags.","25":"En die van Benjamin trokken uit hun tegemoet, uit Gibea, op den tweeden dag, en velden van de kinderen Israëls nog achttien duizend man neder ter aarde; die allen trokken het zwaard uit.","26":"Toen togen alle kinderen Israëls en al het volk op, en kwamen ten huize Gods, en weenden, en bleven aldaar voor het aangezicht des HEEREN, en vastten dien dag tot op den avond; en zij offerden brandofferen en dankofferen voor het aangezicht des HEEREN.","27":"En de kinderen Israëls vraagden den HEERE, want aldaar was de ark des verbonds van God in die dagen.","28":"En Pinehas, de zoon van Eleazar, den zoon van Aäron, stond voor Zijn aangezicht, in die dagen, zeggende: Zal ik nog meer uittrekken ten strijde tegen de kinderen van Benjamin, mijn broeder, of zal ik ophouden? en de HEERE zeide: Trekt op, want morgen zal Ik hem in uw hand geven.","29":"Toen bestelde Israël achterlagen op Gibea rondom.","30":"En de kinderen Israëls togen op, aan den derden dag, tegen de kinderen van Benjamin; en zij schikten *den* *strijd* op Gibea, als op de andere malen.","31":"Toen togen de kinderen van Benjamin uit, het volk tegemoet, *en* werden van de stad afgetrokken; en zij begonnen te slaan van het volk, *en* te doorsteken, gelijk de andere malen, op de straten, waarvan de een opgaat naar het huis Gods, en de ander naar Gibea, in het veld, omtrent dertig man van Israël.","32":"Toen zeiden de kinderen van Benjamin: Zij zijn voor ons aangezicht geslagen, als te voren; maar de kinderen Israëls zeiden: Laat ons vlieden, en hen van de stad aftrekken naar de straten.","33":"Toen maakten zich alle mannen van Israël op uit hun plaatsen, en schikten *den* *strijd* te Baäl-thamar; ook brak Israëls achterlage op uit haar plaats, na de ontbloting van Gibea.","34":"En tien duizend uitgelezen mannen van gans Israël kwamen van tegenover Gibea, en de strijd werd zwaar; doch zij wisten niet, dat het kwaad hen treffen zou.","35":"Toen sloeg de HEERE Benjamin voor Israëls aangezicht; dat de kinderen Israëls op dien dag van Benjamin vernielden vijf en twintig duizend en honderd mannen; die allen trokken het zwaard uit.","36":"En de kinderen van Benjamin zagen, dat zij geslagen waren; want de mannen van Israël gaven den Benjaminieten plaats, omdat zij vertrouwden op de achterlage, die zij tegen Gibea gesteld hadden.","37":"En de achterlage haastte, en brak voorwaarts naar Gibea toe; ja, de achterlage trok recht door, en sloeg de ganse stad met de scherpte des zwaards.","38":"En de mannen van Israël hadden een bestemden tijd met de achterlage, wanneer zij een grote verheffing van rook van de stad zouden doen opgaan.","39":"Zo keerden zich de mannen van Israël om in den strijd; en Benjamin had begonnen te slaan *en* te doorsteken van de mannen van Israël omtrent dertig man; want zij zeiden: Immers is hij zekerlijk voor ons aangezicht geslagen, als in den vorigen strijd.","40":"Toen begon de verheffing op te gaan van de stad, *als* een pilaar van rook; als nu Benjamin achter zich omzag, ziet, zo ging de brand der stad op naar den hemel.","41":"En de mannen van Israël keerden zich om; en de mannen van Benjamin werden verbaasd, want zij zagen, dat het kwaad hen treffen zou.","42":"Zo wendden zij zich voor het aangezicht der mannen van Israël naar den weg der woestijn; maar de strijd kleefde hen aan, en die uit de steden vernielden ze in het midden van hen.","43":"Zij omringden Benjamin, zij vervolgden hem, zij vertraden hem gemakkelijk, tot voor Gibea, tegen den opgang der zon.","44":"En er vielen van Benjamin achttien duizend mannen; deze allen waren strijdbare mannen.","45":"Toen keerden zij zich, en vloden naar de woestijn, tot den rotssteen van Rimmon; maar zij deden een nalezing onder hen op de straten, van vijf duizend man; voorts kleefden zij hen achteraan tot aan Gideom, en sloegen van hen twee duizend man.","46":"Alzo waren allen, die op dien dag van Benjamin vielen, vijf en twintig duizend mannen, die het zwaard uittrokken; die allen waren strijdbare mannen.","47":"Doch zeshonderd mannen keerden zich, en vloden naar de woestijn, tot den rotssteen van Rimmon, en bleven in den rotssteen van Rimmon, vier maanden.","48":"En de mannen van Israël keerden weder tot de kinderen van Benjamin, en sloegen hen met de scherpte des zwaards, die van de gehele stad tot de beesten toe, ja, al wat gevonden werd; ook zetten zij alle steden, die gevonden werden, in het vuur."},"KJV":{"1":"Then all the children of Israel went out, and the congregation was gathered together as one man, from Dan even to Beersheba, with the land of Gilead, unto the LORD in Mizpeh.","2":"And the chief of all the people, *even* of all the tribes of Israel, presented themselves in the assembly of the people of God, four hundred thousand footmen that drew sword.","3":"(Now the children of Benjamin heard that the children of Israel were gone up to Mizpeh.) Then said the children of Israel, Tell *us*, how was this wickedness?","4":"And the Levite, the husband of the woman that was slain, answered and said, I came into Gibeah that *belongeth* to Benjamin, I and my concubine, to lodge.","5":"And the men of Gibeah rose against me, and beset the house round about upon me by night, *and* thought to have slain me: and my concubine have they forced, that she is dead.","6":"And I took my concubine, and cut her in pieces, and sent her throughout all the country of the inheritance of Israel: for they have committed lewdness and folly in Israel.","7":"Behold, ye *are* all children of Israel; give here your advice and counsel.","8":"And all the people arose as one man, saying, We will not any *of us* go to his tent, neither will we any *of us* turn into his house.","9":"But now this *shall be* the thing which we will do to Gibeah; *we will go up* by lot","10":"And we will take ten men of an hundred throughout all the tribes of Israel, and an hundred of a thousand, and a thousand out of ten thousand, to fetch victual for the people, that they may do, when they come to Gibeah of Benjamin, according to all the folly that they have wrought in Israel.","11":"So all the men of Israel were gathered against the city, knit together as one man.","12":"And the tribes of Israel sent men through all the tribe of Benjamin, saying, What wickedness *is* this that is done","13":"Now therefore deliver *us* the men, the children of Belial, which *are* in Gibeah, that we may put them to death, and put away evil from Israel. But the children of Benjamin would not hearken to the voice of their brethren the children of Israel:","14":"But the children of Benjamin gathered themselves together out of the cities unto Gibeah, to go out to battle against the children of Israel.","15":"And the children of Benjamin were numbered at that time out of the cities twenty and six thousand men that drew sword, beside the inhabitants of Gibeah, which were numbered seven hundred chosen men.","16":"Among all this people *there were* seven hundred chosen men lefthanded; every one could sling stones at an hair *breadth*, and not miss.","17":"And the men of Israel, beside Benjamin, were numbered four hundred thousand men that drew sword: all these *were* men of war.","18":"And the children of Israel arose, and went up to the house of God, and asked counsel of God, and said, Which of us shall go up first to the battle against the children of Benjamin? And the LORD said, Judah *shall go up* first.","19":"And the children of Israel rose up in the morning, and encamped against Gibeah.","20":"And the men of Israel went out to battle against Benjamin; and the men of Israel put themselves in array to fight against them at Gibeah.","21":"And the children of Benjamin came forth out of Gibeah, and destroyed down to the ground of the Israelites that day twenty and two thousand men.","22":"And the people the men of Israel encouraged themselves, and set their battle again in array in the place where they put themselves in array the first day.","23":"(And the children of Israel went up and wept before the LORD until even, and asked counsel of the LORD, saying, Shall I go up again to battle against the children of Benjamin my brother? And the LORD said, Go up","24":"And the children of Israel came near against the children of Benjamin the second day.","25":"And Benjamin went forth against them out of Gibeah the second day, and destroyed down to the ground of the children of Israel again eighteen thousand men; all these drew the sword.","26":"Then all the children of Israel, and all the people, went up, and came unto the house of God, and wept, and sat there before the LORD, and fasted that day until even, and offered burnt offerings and peace offerings before the LORD.","27":"And the children of Israel enquired of the LORD, (for the ark of the covenant of God *was* there in those days,","28":"And Phinehas, the son of Eleazar, the son of Aaron, stood before it in those days,) saying, Shall I yet again go out to battle against the children of Benjamin my brother, or shall I cease? And the LORD said, Go up; for to morrow I will deliver them into thine hand.","29":"And Israel set liers in wait round about Gibeah.","30":"And the children of Israel went up against the children of Benjamin on the third day, and put themselves in array against Gibeah, as at other times.","31":"And the children of Benjamin went out against the people, *and* were drawn away from the city; and they began to smite of the people, *and* kill, as at other times, in the highways, of which one goeth up to the house of God, and the other to Gibeah in the field, about thirty men of Israel.","32":"And the children of Benjamin said, They *are* smitten down before us, as at the first. But the children of Israel said, Let us flee, and draw them from the city unto the highways.","33":"And all the men of Israel rose up out of their place, and put themselves in array at Baaltamar: and the liers in wait of Israel came forth out of their places, *even* out of the meadows of Gibeah.","34":"And there came against Gibeah ten thousand chosen men out of all Israel, and the battle was sore: but they knew not that evil *was* near","35":"And the LORD smote Benjamin before Israel: and the children of Israel destroyed of the Benjamites that day twenty and five thousand and an hundred men: all these drew the sword.","36":"So the children of Benjamin saw that they were smitten: for the men of Israel gave place to the Benjamites, because they trusted unto the liers in wait which they had set beside Gibeah.","37":"And the liers in wait hasted, and rushed upon Gibeah; and the liers in wait drew *themselves* along, and smote all the city with the edge of the sword.","38":"Now there was an appointed sign between the men of Israel and the liers in wait, that they should make a great flame with smoke rise up out of the city.","39":"And when the men of Israel retired in the battle, Benjamin began to smite *and* kill of the men of Israel about thirty persons: for they said, Surely they are smitten down before us, as *in* the first battle.","40":"But when the flame began to arise up out of the city with a pillar of smoke, the Benjamites looked behind them, and, behold, the flame of the city ascended up to heaven.","41":"And when the men of Israel turned again, the men of Benjamin were amazed: for they saw that evil was come","42":"Therefore they turned *their backs* before the men of Israel unto the way of the wilderness; but the battle overtook them; and them which *came* out of the cities they destroyed in the midst","43":"*Thus* they inclosed the Benjamites round about, *and* chased them, *and* trode them down with ease over against Gibeah toward the sunrising.","44":"And there fell of Benjamin eighteen thousand men; all these *were* men of valour.","45":"And they turned and fled toward the wilderness unto the rock of Rimmon: and they gleaned of them in the highways five thousand men; and pursued hard after them unto Gidom, and slew two thousand men","46":"So that all which fell that day of Benjamin were twenty and five thousand men that drew the sword; all these *were* men of valour.","47":"But six hundred men turned and fled to the wilderness unto the rock Rimmon, and abode in the rock Rimmon four months.","48":"And the men of Israel turned again upon the children of Benjamin, and smote them with the edge of the sword, as well the men of *every* city, as the beast, and all that came to hand: also they set on fire all the cities that they came to."}},"tsk":{"1":[{"kopje":"Toen trokken alle","refs":["Richt 20:2","Richt 20:8","Richt 20:11","Richt 21:5","Deut 13:12-18","Joz 22:12"]},{"kopje":"als één man","refs":["1 Sam 11:7"," const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

let vertaling = 'SVnu';

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
