; en hij stak zowel de korenhopen als het staande koren in brand, zelfs tot de wijngaarden *en* olijfbomen toe.","6":"Toen zeiden de Filistijnen: Wie heeft dit gedaan? En men zei: Simson, de schoonzoon van de Thimniet, omdat hij zijn vrouw heeft weggenomen, en haar aan zijn metgezel heeft gegeven. Toen kwamen de Filistijnen op, en verbrandden haar en haar vader met vuur.","7":"Toen zei Simson tegen hen: Zouden jullie zoiets doen? Zeker, als ik mij op jullie gewroken heb, zal ik daarna ophouden.","8":"En hij sloeg hen, been en heup, met een grote slag; en hij ging naar beneden, en woonde op de top van de rots Etam.","9":"Toen trokken de Filistijnen op, en legerden zich tegen Juda, en breidden zich uit in Lechi.","10":"En de mannen van Juda zeiden: Waarom bent u tegen ons opgetrokken? En zij zeiden: Wij zijn opgetrokken om Simson te binden, om hem te doen zoals hij ons gedaan heeft.","11":"Toen kwamen drieduizend mannen uit Juda af naar het hol van de rots Etam, en zeiden tegen Simson: Weet u niet dat de Filistijnen over ons heersen? Waarom hebt u ons dan dit aangedaan? En hij zei tegen hen: Zoals zij mij gedaan hebben, zo heb ik hun gedaan.","12":"En zij zeiden tegen hem: Wij zijn afgekomen om u te binden, om u over te geven in de hand van de Filistijnen. Toen zei Simson tegen hen: Zweer mij dat u zelf mij niet zult aanvallen.","13":"En zij spraken tegen hem en zeiden: Nee, maar wij zullen u wel stevig binden, en u in hun hand overgeven; maar wij zullen u zeker niet doden. En zij bonden hem met twee nieuwe touwen, en voerden hem op van de rots.","14":"Toen hij bij Lechi kwam, juichten de Filistijnen hem tegemoet; maar de Geest van de HEERE werd vaardig over hem; en de touwen die aan zijn armen waren, werden als linnen draden die door het vuur verbrand zijn, en zijn banden versmolten van zijn handen.","15":"En hij vond een vochtig ezelskaakbeen, en hij stak zijn hand uit, en nam het, en sloeg daarmee duizend man.","16":"Toen zei Simson: Met een ezelskaakbeen, een hoop, twee hopen, met een ezelskaakbeen heb ik duizend man geslagen.","17":"En het gebeurde, toen hij klaar was met spreken, dat hij het kaakbeen uit zijn hand wierp; en hij noemde die plaats Ramath-lechi.","18":"Toen hij nu erge dorst had, riep hij tot de HEERE, en zei: U hebt door de hand van Uw knecht dit grote heil gegeven; zou ik dan nu van dorst sterven, en vallen in de hand van deze onbesnedenen?","19":"Toen kloofde God de holle plaats die in Lechi is, en er kwam water uit, en hij dronk. Toen kwam zijn geest weer terug, en hij werd levend. Daarom noemde hij haar naam: De bron van de aanroeper, die in Lechi is, tot op deze dag.","20":"En hij richtte Israël, in de dagen van de Filistijnen, twintig jaar."},"SV":{"1":"En het geschiedde na *sommige* dagen, in de dagen van den tarweoogst, dat Simson zijn huisvrouw bezocht met een geitenbokje, en hij zeide: Laat mij tot mijn huisvrouw ingaan in de kamer; maar haar vader liet hem niet toe in te gaan.","2":"want haar vader zeide: Ik sprak zeker, dat gij haar ganselijk haattet, zo heb ik haar aan uw metgezel gegeven. Is niet haar kleinste zuster schoner dan zij? Laat ze u toch zijn in de plaats van haar.","3":"Toen zeide Simson tot henlieden: Ik ben ditmaal onschuldig van de Filistijnen, wanneer ik aan hen kwaad doe.","4":"En Simson ging heen, en ving driehonderd vossen; en hij nam fakkelen, en keerde staart aan staart, en deed een fakkel tussen twee staarten in het midden.","5":"En hij stak de fakkelen aan met vuur, en liet ze lopen in het staande koren der Filistijnen; en hij stak in brand zowel de korenhopen als het staande koren, zelfs tot de wijngaarden *en* olijfbomen toe.","6":"Toen zeiden de Filistijnen: Wie heeft dit gedaan? En men zeide: Simson, de schoonzoon van den Thimniet, omdat hij zijn huisvrouw heeft genomen, en heeft haar aan zijn metgezel gegeven. Toen kwamen de Filistijnen op, en verbrandden haar en haar vader met vuur.","7":"Toen zeide Simson tot hen: Zoudt gij alzo doen? Zeker, als ik mij aan u gewroken heb, zo zal ik daarna ophouden.","8":"En hij sloeg hen, den schenkel en de heup, *met* een groten slag; en hij ging af, en woonde op de hoogte van de rots Etam.","9":"Toen togen de Filistijnen op, en legerden zich tegen Juda, en breidden zich uit in Lechi.","10":"En de mannen van Juda zeiden: Waarom zijt gijlieden tegen ons opgetogen? En zij zeiden: Wij zijn opgetogen om Simson te binden, om hem te doen, gelijk als hij ons gedaan heeft.","11":"Toen kwamen drie duizend mannen af uit Juda tot het hol der rots Etam, en zeiden tot Simson: Wist gij niet, dat de Filistijnen over ons heersen? Waarom hebt gij ons dan dit gedaan? En hij zeide tot hen: Gelijk als zij mij gedaan hebben, alzo heb ik hunlieden gedaan.","12":"En zij zeiden tot hem: Wij zijn afgekomen om u te binden, om u over te geven in de hand der Filistijnen. Toen zeide Simson tot hen: Zweert mij, dat gijlieden op mij niet zult aanvallen.","13":"En zij spraken tot hem, zeggende: Neen, maar wij zullen u wel binden, en u in hunlieder hand overgeven; doch wij zullen u geenszins doden. En zij bonden hem met twee nieuwe touwen, en voerden hem op van de rots.","14":"Als hij kwam tot Lechi, zo juichten de Filistijnen hem tegemoet; maar de Geest des HEEREN werd vaardig over hem; en de touwen, die aan zijn armen waren, werden als linnen draden, die van het vuur gebrand zijn, en zijn banden versmolten van zijn handen.","15":"En hij vond een vochtig ezelskinnebakken, en hij strekte zijn hand uit, en nam het, en sloeg daarmede duizend man.","16":"Toen zeide Simson: Met een ezelskinnebakken, een hoop, twee hopen, met een ezelskinnebakken heb ik duizend man geslagen.","17":"En het geschiedde, als hij geëindigd had te spreken, zo wierp hij het kinnebakken uit zijn hand, en hij noemde dezelve plaats Ramath-lechi.","18":"Als hem nu zeer dorstte, zo riep hij tot den HEERE, en zeide: Gij hebt door de hand van Uw knecht dit grote heil gegeven; zou ik dan nu van dorst sterven, en vallen in de hand dezer onbesnedenen?","19":"Toen kloofde God de holle plaats, die in Lechi is, en er ging water uit van dezelve, en hij dronk. Toen kwam zijn geest weder, en hij werd levend. Daarom noemde hij haar naam: De fontein des aanroepers, die in Lechi is, tot op dezen dag.","20":"En hij richtte Israël, in de dagen der Filistijnen, twintig jaren."},"KJV":{"1":"But it came to pass within a while after, in the time of wheat harvest, that Samson visited his wife with a kid; and he said, I will go in to my wife into the chamber. But her father would not suffer him to go in.","2":"And her father said, I verily thought that thou hadst utterly hated her; therefore I gave her to thy companion: *is* not her younger sister fairer","3":"And Samson said concerning them, Now shall I be more blameless than the Philistines, though I do them a displeasure.","4":"And Samson went and caught three hundred foxes, and took firebrands, and turned tail to tail, and put a firebrand in the midst between two tails.","5":"And when he had set the brands on fire, he let *them* go into the standing corn of the Philistines, and burnt up both the shocks, and also the standing corn, with the vineyards *and* olives.","6":"Then the Philistines said, Who hath done this? And they answered, Samson, the son in law of the Timnite, because he had taken his wife, and given her to his companion. And the Philistines came up, and burnt her and her father with fire.","7":"And Samson said unto them, Though ye have done this, yet will I be avenged of you, and after that I will cease.","8":"And he smote them hip and thigh with a great slaughter: and he went down and dwelt in the top of the rock Etam.","9":"Then the Philistines went up, and pitched in Judah, and spread themselves in Lehi.","10":"And the men of Judah said, Why are ye come up against us? And they answered, To bind Samson are we come up, to do to him as he hath done","11":"Then three thousand men of Judah went to the top of the rock Etam, and said to Samson, Knowest thou not that the Philistines *are* rulers over us? what *is* this *that* thou hast done unto us? And he said unto them, As they did unto me, so have I done","12":"And they said unto him, We are come down to bind thee, that we may deliver thee into the hand of the Philistines. And Samson said unto them, Swear unto me, that ye will not fall upon","13":"And they spake unto him, saying, No; but we will bind thee fast, and deliver thee into their hand: but surely we will not kill thee. And they bound him with two new cords, and brought him up from the rock.","14":"*And* when he came unto Lehi, the Philistines shouted against him: and the Spirit of the LORD came mightily upon him, and the cords that *were* upon his arms became as flax that was burnt with fire, and his bands loosed from off his hands.","15":"And he found a new jawbone of an ass, and put forth his hand, and took it, and slew a thousand men","16":"And Samson said, With the jawbone of an ass, heaps upon heaps, with the jaw of an ass have I slain a thousand men.","17":"And it came to pass, when he had made an end of speaking, that he cast away the jawbone out of his hand, and called that place Ramathlehi.","18":"And he was sore athirst, and called on the LORD, and said, Thou hast given this great deliverance into the hand of thy servant: and now shall I die for thirst, and fall into the hand of the uncircumcised?","19":"But God clave an hollow place that *was* in the jaw, and there came water thereout; and when he had drunk, his spirit came again, and he revived: wherefore he called the name thereof Enhakkore, which *is* in Lehi unto this day.","20":"And he judged Israel in the days of the Philistines twenty years."}},"tsk":{"1":[{"kopje":"een geitenbokje","refs":["Gen 38:17","Luk 15:29"]},{"kopje":"Laat mij ingaan","refs":["Gen 6:4","Gen 29:21"]}],"2":[{"kopje":"Ik dacht zeker","refs":["Richt 14:16","Richt 14:20","Hand 26:9"]},{"kopje":"heb ik haar gegeven","refs":["Richt 14:20","Gen 38:14"]}],"3":[{"kopje":"wanneer","refs":["Richt her <span class=\"wl wl-kjv\" data-code=\"H6996\">younger</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> fairer","3":"And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> concerning them, <span class=\"wl wl-kjv\" data-code=\"H6471\">Now</span> shall I be more <span class=\"wl wl-kjv\" data-code=\"H5352\">blameless</span> than the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> though I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them a displeasure.","4":"And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">caught</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H7776\">foxes,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H3940\">firebrands,</span> and <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H2180\">tail</span> to <span class=\"wl wl-kjv\" data-code=\"H2180\">tail,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H3940\">firebrand</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> between <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> tails.","5":"And when he had <span class=\"wl wl-kjv\" data-code=\"H1197\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H3940\">brands</span> on <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> he let them <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> into the standing <span class=\"wl wl-kjv\" data-code=\"H7054\">corn</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and burnt  the west side of the mountain of Judah as the maps do shew 1Ch 4:32 Etham is reckoned to the tribe of simeon yet Simeon&acirc;&euro;&trade;s inheritance was part among the tribe of Judah Jos 19:1.]"}],"9":[{"catchword":null,"tekst":"Then the Philistines went up and camped themselves against Judah and spread forth themselves in Lechi [called afterwards so by simson below verse 17 lying in the tribe of Dan.]"}],"10":[{"catchword":null,"tekst":"And the men of Judah said why are ye come up against us? And they said we are come up to bind Simson to do to him according as he hath done unto us."}],"11":[{"catchword":null,"tekst":"Then came three thousand men down from Judah to the cave often rock of Etam and said unto Simson knewest thou not to the Philistines have dominion over us? Wherefore then hast thou done this to us ? And he said unto them according as they have done unto me so have I done to them."}],"12":[{"catchword":null,"tekst":"And they said unto him we are come down to bind thee to deliver thee over into the hand of the Philistines then said Simson unto them swear unto me that ye will not fall upon me [viz. to kill me as this phrase is often taken in the holy scripture and the following verse explaineth.]"}],"13":[{"catchword":null,"tekst":"And they spake unto him saying no but we will bind thee well [Heb. binding bind] and deliver thee over into their hand but we will in no wise kill thee [Heb. killing we will not kill thee] and they bound him with two new cords an drought him up from the rock [northwards towards Lechi where the philistines were encamped verse 9.]"}],"14":[{"catchword":null,"tekst":"when he came to lechi when the Philistines shouted [for joy thinking they had now their enemy in their own hands ] to meet him but the spirit of the Lord was ready upon him an dteh cords that were on his arms became as linen threads that are burnt of the fire[he brake them as easily and quickly as if they had been finged threads or as flax is burnt with fire ] and his bonds melted off from his hands [they were so easily and quickly loosened as wax melted by the fire.]"}],"15":[{"catchword":null,"tekst":"And he found a moist [that is yet new fresh and firm not withered or dried the word is also taken from the pulrunent moisture Isa 1:6] jaw bone of an ass and he stretched forth his hands and tookit and slew therewithal thousand man."}],"17":[{"catchword":null,"tekst":"And it came to pass when he had made an end to speaking that he cast the jaw bone out of his hands an he called the same place ramath-Lechi [that is the height of the jaw bone others the casting away of the jaw bone this place is also called lechi only without any addition to it see above verse 9.]"}],"18":[{"catchword":null,"tekst":"Now when he was sore a thirst then he called on the Lord and said thou hast given this great salvation by the hand of thy servant should I then now die for thirst and fall into the hand of these uncircumsised ones ? [Hereby Simson declareth his faith and putteth God in mind of his gracious covenant see Heb 11:32 and compare Gen 34:14 1Sa 17:26,36 2Sa 1:20.]"}],"19":[{"catchword":null,"tekst":"Then God clave the hollow place the Hebrew word coming from beating stamping should properly signify a mortar and so forth hallowness or hollow place which in regard thereof may be compared to a deep and hallow mortar see the same Hebrew word proverbs 27.22 Zeph 1.11 some understand here a great back tooth of the ass jaw and the hollowness thereof but the Hebrew word is nowhere else found in this signification ] which is in Lechi and is there issued forth water out of it and he drank then his spirit came again [which by reason often thirst seemeth to gone from him for as much as he had fear to faint or die of thirst ] and he became alive[that is revived leaped lustly nimbled ]therefore he [to wit Simson in token of thankfulness to God and in memorial of victory given to Israel called the name thereof[viz. the name of the fountain ] the fountain of him that called upon [Heb. En-hakkore ] which is in Lechi unto this day."}],"20":[{"catchword":null,"tekst":"And he judged Israel in the days of the Philistines twenty years [that is he executed the Lords vengeance for Israel against the Philistines see concerning the use of this word in these histories above chapter 2 on verse 16.]"}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;

  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
