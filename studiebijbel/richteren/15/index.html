, "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "En het gebeurde na enige dagen, in de dagen van de tarweoogst, dat Simson zijn vrouw bezocht met een geitenbokje, en hij zei: Laat mij bij mijn vrouw ingaan, in de kamer; maar haar vader liet hem niet toe naar binnen te gaan.", "2": "Want haar vader zei: Ik dacht zeker, dat u haar helemaal haatte, dus heb ik haar aan uw metgezel gegeven. Is haar kleinste zuster niet mooier dan zij? Laat ze u toch tot vrouw zijn in haar plaats.", "3": "Toen zei Simson tegen hen: Ik ben deze keer onschuldig tegenover de Filistijnen, wanneer ik hun kwaad doe.", "4": "En Simson ging heen, en ving driehonderd vossen; en hij nam fakkels, en keerde staart aan staart, en deed één fakkel tussen twee staarten in het midden.", "5": "En hij stak de fakkels aan met vuur, en liet ze lopen in het staande koren van de Filistijnen; en hij stak zowel de korenhopen als het staande koren in brand, zelfs tot de wijngaarden *en* olijfbomen toe.", "6": "Toen zeiden de Filistijnen: Wie heeft dit gedaan? En men zei: Simson, de schoonzoon van de Thimniet, omdat hij zijn vrouw heeft weggenomen, en haar aan zijn metgezel heeft gegeven. Toen kwamen de Filistijnen op, en verbrandden haar en haar vader met vuur.", "7": "Toen zei Simson tegen hen: Zouden jullie zoiets doen? Zeker, als ik mij op jullie gewroken heb, zal ik daarna ophouden.", "8": "En hij sloeg hen, been en heup, met een grote slag; en hij ging naar beneden, en woonde op de top van de rots Etam.", "9": "Toen trokken de Filistijnen op, en legerden zich tegen Juda, en breidden zich uit in Lechi.", "10": "En de mannen van Juda zeiden: Waarom bent u tegen ons opgetrokken? En zij zeiden: Wij zijn opgetrokken om Simson te binden, om hem te doen zoals hij ons gedaan heeft.", "11": "Toen kwamen drieduizend mannen uit Juda af naar het hol van de rots Etam, en zeiden tegen Simson: Weet u niet dat de Filistijnen over ons heersen? Waarom hebt u ons dan dit aangedaan? En hij zei tegen hen: Zoals zij mij gedaan hebben, zo heb ik hun gedaan.", "12": "En zij zeiden tegen hem: Wij zijn afgekomen om u te binden, om u over te geven in de hand van de Filistijnen. Toen zei Simson tegen hen: Zweer mij dat u zelf mij niet zult aanvallen.", "13": "En zij spraken tegen hem en zeiden: Nee, maar wij zullen u wel stevig binden, en u in hun hand overgeven; maar wij zullen u zeker niet doden. En zij bonden hem met twee nieuwe touwen, en voerden hem op van de rots.", "14": "Toen hij bij Lechi kwam, juichten de Filistijnen hem tegemoet; maar de Geest van de HEERE werd vaardig over hem; en de touwen die aan zijn armen waren, werden als linnen draden die door het vuur verbrand zijn, en zijn banden versmolten van zijn handen.", "15": "En hij vond een vochtig ezelskaakbeen, en hij stak zijn hand uit, en nam het, en sloeg daarmee duizend man.", "16": "Toen zei Simson: Met een ezelskaakbeen, een hoop, twee hopen, met een ezelskaakbeen heb ik duizend man geslagen.", "17": "En het gebeurde, toen hij klaar was met spreken, dat hij het kaakbeen uit zijn hand wierp; en hij noemde die plaats Ramath-lechi.", "18": "Toen hij nu erge dorst had, riep hij tot de HEERE, en zei: U hebt door de hand van Uw knecht dit grote heil gegeven; zou ik dan nu van dorst sterven, en vallen in de hand van deze onbesnedenen?", "19": "Toen kloofde God de holle plaats die in Lechi is, en er kwam water uit, en hij dronk. Toen kwam zijn geest weer terug, en hij werd levend. Daarom noemde hij haar naam: De bron van de aanroeper, die in Lechi is, tot op deze dag.", "20": "En hij richtte Israël, in de dagen van de Filistijnen, twintig jaar."}, "SV": {"1": "En het geschiedde na *sommige* dagen, in de dagen van den tarweoogst, dat Simson zijn huisvrouw bezocht met een geitenbokje, en hij zeide: Laat mij tot mijn huisvrouw ingaan in de kamer; maar haar vader liet hem niet toe in te gaan.", "2": "want haar vader zeide: Ik sprak zeker, dat gij haar ganselijk haattet, zo heb ik haar aan uw metgezel gegeven. Is niet haar kleinste zuster schoner dan zij? Laat ze u toch zijn in de plaats van haar.", "3": "Toen zeide Simson tot henlieden: Ik ben ditmaal onschuldig van de Filistijnen, wanneer ik aan hen kwaad doe.", "4": "En Simson ging heen, en ving driehonderd vossen; en hij nam fakkelen, en keerde staart aan staart, en deed een fakkel tussen twee staarten in het midden.", "5": "En hij stak de fakkelen aan met vuur, en liet ze lopen in het staande koren der Filistijnen; en hij stak in brand zowel de korenhopen als het staande koren, zelfs tot de wijngaarden *en* olijfbomen toe.", "6": "Toen zeiden de Filistijnen: Wie heeft dit gedaan? En men zeide: Simson, de schoonzoon van den Thimniet, omdat hij zijn huisvrouw heeft genomen, en heeft haar aan zijn metgezel gegeven. Toen kwamen de Filistijnen op, en verbrandden haar en haar vader met vuur.", "7": "Toen zeide Simson tot hen: Zoudt gij alzo doen? Zeker, als ik mij aan u gewroken heb, zo zal ik daarna ophouden.", "8": "En hij sloeg hen, den schenkel en de heup, *met* een groten slag; en hij ging af, en woonde op de hoogte van de rots Etam.", "9": "Toen togen de Filistijnen op, en legerden zich tegen Juda, en breidden zich uit in Lechi.", "10": "En de mannen van Juda zeiden: Waarom zijt gijlieden tegen ons opgetogen? En zij zeiden: Wij zijn opgetogen om Simson te binden, om hem te doen, gelijk als hij ons gedaan heeft.", "11": "Toen kwamen drie duizend mannen af uit Juda tot het hol der rots Etam, en zeiden tot Simson: Wist gij niet, dat de Filistijnen over ons heersen? Waarom hebt gij ons dan dit gedaan? En hij zeide tot hen: Gelijk als zij mij gedaan hebben, alzo heb ik hunlieden gedaan.", "12": "En zij zeiden tot hem: Wij zijn afgekomen om u te binden, om u over te geven in de hand der Filistijnen. Toen zeide Simson tot hen: Zweert mij, dat gijlieden op mij niet zult aanvallen.", "13": "En zij spraken tot hem, zeggende: Neen, maar wij zullen u wel binden, en u in hunlieder hand overgeven; doch wij zullen u geenszins doden. En zij bonden hem met twee nieuwe touwen, en voerden hem op van de rots.", "14": "Als hij kwam tot Lechi, zo juichten de Filistijnen hem tegemoet; maar de Geest des HEEREN werd vaardig over hem; en de touwen, die aan zijn armen waren, werden als linnen draden, die van het vuur gebrand zijn, en zijn banden versmolten van zijn handen.", "15": "En hij vond een vochtig ezelskinnebakken, en hij strekte zijn hand uit, en nam het, en sloeg daarmede duizend man.", "16": "Toen zeide Simson: Met een ezelskinnebakken, een hoop, twee hopen, met een ezelskinnebakken heb ik duizend man geslagen.", "17": "En het geschiedde, als hij geëindigd had te spreken, zo wierp hij het kinnebakken uit zijn hand, en hij noemde dezelve plaats Ramath-lechi.", "18": "Als hem nu zeer dorstte, zo riep hij tot den HEERE, en zeide: Gij hebt door de hand van Uw knecht dit grote heil gegeven; zou ik dan nu van dorst sterven, en vallen in de hand dezer onbesnedenen?", "19": "Toen kloofde God de holle plaats, die in Lechi is, en er ging water uit van dezelve, en hij dronk. Toen kwam zijn geest weder, en hij werd levend. Daarom noemde hij haar naam: De fontein des aanroepers, die in Lechi is, tot op dezen dag.", "20": "En hij richtte Israël, in de dagen der Filistijnen, twintig jaren."}, "KJV": {"1": "But it came to pass within a while after, in the time of wheat harvest, that Samson visited his wife with a kid; and he said, I will go in to my wife into the chamber. But her father would not suffer him to go in.", "2": "And her father said, I verily thought that thou hadst utterly hated her; therefore I gave her to thy companion: *is* not her younger sister fairer", "3": "And Samson said concerning them, Now shall I be more blameless than the Philistines, though I do them a displeasure.", "4": "And Samson went and caught three hundred foxes, and took firebrands, and turned tail to tail, and put a firebrand in the midst between two tails.", "5": "And when he had set the brands on fire, he let *them* go into the standing corn of the Philistines, and burnt up both the shocks, and also the standing corn, with the vineyards *and* olives.", "6": "Then the Philistines said, Who hath done this? And they answered, Samson, the son in law of the Timnite, because he had taken his wife, and given her to his companion. And the Philistines came up, and burnt her and her father with fire.", "7": "And Samson said unto them, Though ye have done this, yet will I be avenged of you, and after that I will cease.", "8": "And he smote them hip and thigh with a great slaughter: and he went down and dwelt in the top of the rock Etam.", "9": "Then the Philistines went up, and pitched in Judah, and spread themselves in Lehi.", "10": "And the men of Judah said, Why are ye come up against us? And they answered, To bind Samson are we come up, to do to him as he hath done", "11": "Then three thousand men of Judah went to the top of the rock Etam, and said to Samson, Knowest thou not that the Philistines *are* rulers over us? what *is* this *that* thou hast done unto us? And he said unto them, As they did unto me, so have I done", "12": "And they said unto him, We are come down to bind thee, that we may deliver thee into the hand of the Philistines. And Samson said unto them, Swear unto me, that ye will not fall upon", "13": "And they spake unto him, saying, No; but we will bind thee fast, and deliver thee into their hand: but surely we will not kill thee. And they bound him with two new cords, and brought him up from the rock.", "14": "*And* when he came unto Lehi, the Philistines shouted against him: and the Spirit of the LORD came mightily upon him, and the cords that *were* upon his arms became as flax that was burnt with fire, and his bands loosed from off his hands.", "15": "And he found a new jawbone of an ass, and put forth his hand, and took it, and slew a thousand men", "16": "And Samson said, With the jawbone of an ass, heaps upon heaps, with the jaw of an ass have I slain a thousand men.", "17": "And it came to pass, when he had made an end of speaking, that he cast away the jawbone out of his hand, and called that place Ramathlehi.", "18": "And he was sore athirst, and called on the LORD, and said, Thou hast given this great deliverance into the hand of thy servant: and now shall I die for thirst, and fall into the hand of the uncircumcised?", "19": "But God clave an hollow place that *was* in the jaw, and there came water thereout; and when he had drunk, his spirit came again, and he revived: wherefore he called the name thereof Enhakkore, which *is* in Lehi unto this day.", "20": "And he judged Israel in the days of the Philistines twenty years."}}, "tsk": {"1": [{"kopje": "een geitenbokje", "refs": ["Gen 38:17", "Luk 15:29"]}, {"kopje": "Laat mij ingaan", "refs": ["Gen 6:4", "Gen 29:21"]}], "2": [{"kopje": "Ik dacht zeker", "refs": ["Richt 14:16", "Richt 14:20", "Hand 26:9"]}, {"kopje": "heb ik haar gegeven", "refs": ["Richt 14:20", "Gen 38:14"]}], "3": [{"kopje": "wanneer", "refs": ["Richt 14:15"]}], "4": [{"kopje": "ving driehonderd", "refs": ["1 Kon 20:10", "Jes 40:12", "Ezech 13:9", "Ruth 2:15", "Ruth 2:16", "Ps 63:11", "Hoogl 2:15", "Klaagl 5:18"]}], "5": [{"kopje": "liet ze lopen", "refs": ["Ex 22:6", "2 Sam 14:30"]}], "6": [{"kopje": "en verbrandden", "refs": ["Richt 12:1", "Richt 14:15", "Spr 22:8", "1 Tess 4:6"]}], "7": [{"kopje": "Zeker", "refs": ["Richt 14:4", "Richt 14:19", "Rom 12:19"]}], "9": [{"kopje": "Lechi", "refs": ["Richt 15:17", "Richt 15:19"]}], "11": [{"kopje": "de rots Etam", "refs": ["1 Kron 4:32"]}, {"kopje": "Filistijnen", "refs": ["Richt 13:1", "Richt 14:4", "Deut 28:13", "Deut 28:47", "Deut 28:48", "Ps 106:41"]}], "12": [{"kopje": "om u te binden", "refs": ["Matt 27:2", "Hand 7:25"]}, {"kopje": "aanvallen", "refs": ["Richt 8:21", "1 Kon 2:25", "1 Kon 2:34"]}], "14": [{"kopje": "de Filistijnen", "refs": ["Richt 5:30", "Richt 16:24", "Ex 14:3", "Ex 14:5", "1 Sam 4:5", "Job 20:5", "Micha 7:8"]}, {"kopje": "de Geest", "refs": ["Richt 3:10", "Richt 14:6", "Richt 14:19", "Zach 4:6"]}, {"kopje": "de touwen", "refs": ["Richt 16:9", "Richt 16:12", "1 Sam 17:35", "Ps 18:35", "Ps 118:11", "Fil 4:3"]}], "15": [{"kopje": "sloeg", "refs": ["Richt 3:31", "Richt 4:21", "Richt 7:16", "Lev 26:8", "Joz 23:10", "1 Sam 14:6", "1 Sam 14:14", "1 Sam 17:49", "1 Sam 17:50", "1 Kor 1:27", "1 Kor 1 ael", "kinderen": [{"label": "Under The Judges", "href": "../../nave/i/?hl=Judg.15.20#i9952", "refs": [], "kinderen": [{"label": "Led by Samson for twenty years", "href": "../../nave/i/?hl=Judg.15.20#i9971", "refs": [{"disp": "Richt 15:20", "href": "../../richteren/15/#v20", "ref": "Richt 15:20", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"1 Kron 4:32": "En hun dorpen waren Etam en Ain, Rimmon en Tochen, en Asan; vijf steden.", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "Hoogl 2:15": "Vang voor ons de vossen, de kleine vossen, die de wijngaarden verderven, want onze wijngaarden hebben jonge druifjes.", "Richt 15:3-8": "Toen zei Simson tegen hen: Ik ben deze keer onschuldig tegenover de Filistijnen, wanneer ik hun kwaad doe. En Simson ging heen, en ving driehonderd vossen; en hij nam fakkels, en keerde staart aan staart, en deed één fakkel tussen twee staarten in het midden. En hij stak de fakkels aan met vuur, en liet ze lopen in het staande koren van de Filistijnen; en hij stak zowel de korenhopen als het staande koren in brand, zelfs tot de wijngaarden en olijfbomen toe.", "Ps 22:16": "Mijn kracht is verdroogd als een potscherf, en mijn tong kleeft aan mijn gehemelte; en U legt mij in het stof van de dood.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Ex 14:5": "Toen de koning van Egypte nu bericht werd dat het volk gevlucht was, veranderde het hart van Farao en van zijn dienaren tegen het volk, en zij zeiden: Waarom hebben wij dit gedaan, dat wij Israël hebben laten trekken, zodat zij ons niet meer dienen?", "Richt 15:7-14": "Toen zei Simson tegen hen: Zouden jullie zoiets doen? Zeker, als ik mij op jullie gewroken heb, zal ik daarna ophouden. En hij sloeg hen, been en heup, met een grote slag; en hij ging naar beneden, en woonde op de top van de rots Etam. Toen trokken de Filistijnen op, en legerden zich tegen Juda, en breidden zich uit in Lechi.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Gen 22:14": "En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!", "Richt 14:15": "Daarna gebeurde het op de zevende dag, dat zij tegen de vrouw van Simson zeiden: Overreed uw man, dat hij ons dat raadsel verklaart, opdat wij niet misschien u en het huis van uw vader met vuur verbranden. Hebt u ons genodigd om ons van ons bezit te beroven? Is het zo niet?", "Gen 45:27": "Maar toen zij tot hem gesproken hadden al de woorden van Jozef, die hij tot hen gesproken had, en dat hij de wagens zag, die Jozef gezonden had om hem te vervoeren, toen werd de geest van Jakob, hun vader, levendig.", "Gen 28:19": "En hij noemde de naam van die plaats Beth-el; hoewel de naam van die stad vroeger Luz was.", "Gen 12:13": "Zeg toch: U bent mijn zuster; opdat het mij goed gaat om u, en ik in leven blijf om uwentwil.", "Richt 16:12": "Toen nam Delila nieuwe touwen, en bond hem daarmee, en zei tegen hem: De Filistijnen over u, Simson! (De hinderlaag zat namelijk in een kamer.) Toen verbrak hij ze van zijn armen als een draad.", "Richt 14:2": "Zo ging hij naar boven en vertelde het zijn vader en zijn moeder, en zei: Ik heb een vrouw gezien te Thimnath, uit de dochters van de Filistijnen; nu dan, neem die voor mij tot vrouw.", "Ps 34:7": "Zain. Deze ellendige riep, en de HEERE hoorde; en Hij verloste hem uit al zijn benauwdheden.", "Richt 15:13-17": "En zij spraken tegen hem en zeiden: Nee, maar wij zullen u wel stevig binden, en u in hun hand overgeven; maar wij zullen u zeker niet doden. En zij bonden hem met twee nieuwe touwen, en voerden hem op van de rots. Toen hij bij Lechi kwam, juichten de Filistijnen hem tegemoet; maar de Geest van de HEERE werd vaardig over hem; en de touwen die aan zijn armen waren, werden als linnen draden die door het vuur verbrand zijn, en zijn banden versmolten van zijn handen. En hij vond een vochtig ezelskaakbeen, en hij stak zijn hand uit, en nam het, en sloeg daarmee duizend man.", "2 Sam 1:20": "Verkondigt het niet in Gath, verkondigt het niet op de straten van Askelon; opdat de dochters van de Filistijnen zich niet verblijden, opdat de dochters van de onbesnedenen niet opspringen van vreugde.", "Gen 16:13": "En zij noemde de Naam van de HEERE, Die tot haar sprak: U bent de God van het aanzien! want zij zei: Heb ik ook hier gezien naar Hem, Die mij aanziet?", "Gen 38:14": "Toen legde zij de kleren van haar weduwschap af, en bedekte zich met een sluier, en wikkelde zich in, en ging bij de ingang van de twee bronnen zitten, die aan de weg naar Timna liggen; want zij had gezien dat Sela groot geworden was, en dat zij hem niet tot vrouw was gegeven.", "Ps 106:41": "En Hij gaf hen in de hand van de heidenen, en hun haters heersten over hen.", "Richt 8:21": "Toen zeiden Zebah en Tsalmuna: Sta zelf op en val ons aan, want zoals de man is, zo is zijn kracht. Toen stond Gideon op en doodde Zebah en Tsalmuna, en nam de maantjes die aan de halzen van hun kamelen zaten.", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Ex 17:15": "En Mozes bouwde een altaar; en hij noemde het: De HEERE is mijn Banier!", "1 Sam 17:35": "En ik ging hem achterna, en sloeg hem, en redde het uit zijn muil; toen hij tegen mij opstond, greep ik hem bij zijn baard, en sloeg hem, en doodde hem.", "Luk 15:29": "Maar hij antwoordde en zei tegen de vader: Zie, ik dien u nu al zoveel jaren, en heb nooit uw gebod overtreden, en u hebt mij nooit een bokje gegeven, zodat ik met mijn vrienden vrolijk kon zijn.", "Micha 7:8": "Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn.", "Gen 20:11": "En Abraham zei: Want ik dacht: er is beslist geen vreze van God in deze plaats, zodat zij mij zullen doden vanwege mijn vrouw.", "Spr 22:8": "Wie onrecht zaait, zal moeite maaien; en de roede van zijn woede zal een einde nemen.", "Ps 18:32-41": "Want wie is God, behalve de HEERE? En wie is een Rotssteen, dan alleen onze God? Het is God, die mij met kracht omgordt; en Hij heeft mijn weg volkomen gemaakt. Hij maakt mijn voeten gelijk als die van de hinden, en Hij stelt mij op mijn hoogten.", "Richt 15:3-5": "Toen zei Simson tegen hen: Ik ben deze keer onschuldig tegenover de Filistijnen, wanneer ik hun kwaad doe. En Simson ging heen, en ving driehonderd vossen; en hij nam fakkels, en keerde staart aan staart, en deed één fakkel tussen twee staarten in het midden. En hij stak de fakkels aan met vuur, en liet ze lopen in het staande koren van de Filistijnen; en hij stak zowel de korenhopen als het staande koren in brand, zelfs tot de wijngaarden en olijfbomen toe.", "Richt 16:9": "De hinderlaag zat bij haar in een kamer. Zo zei zij tegen hem: De Filistijnen over u, Simson! Toen verbrak hij de pezen, zoals een sliertje grof vlas verbroken wordt, als het vuur het raakt. Zo werd zijn kracht niet bekend.", "Ps 22:15": "Ik ben uitgestort als water, en al mijn beenderen hebben zich vaneen gescheiden; mijn hart is als was, het is gesmolten in het midden van mijn ingewand.", "1 Kon 20:10": "En Benhadad zond naar hem en zei: De goden doen mij zo, en doen zo daartoe, als het stof van Samaria genoeg zal zijn tot handvollen voor al het volk, dat mijn voetstappen volgt!", "Jes 40:26": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist.", "Richt 14:1": "En Simson ging af naar Thimnath, en zag daar een vrouw uit de dochters van de Filistijnen,", "Ps 63:11": "Men zal hen neervellen door het geweld van het zwaard; zij zullen het deel van de vossen worden.", "Gen 38:17": "En hij zei: Ik zal u een geitenbokje uit de kudde sturen. En zij zei: Zult u mij een onderpand geven, totdat u het stuurt?", "1 Kon 2:25": "En de koning Salomo stuurde Benaja, de zoon van Jojada; die viel op hem aan, zodat hij stierf.", "2 Kor 12:8": "Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken.", "Richt 3:31": "Na hem nu was Samgar, een zoon van Anath, die de Filistijnen sloeg, zeshonderd man, met een ossenstok; zo verloste ook hij Israël.", "2 Kor 4:8": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig;", "Ruth 2:16": "Ja, laat ook opzettelijk wat van de handvollen voor haar vallen, en laat het liggen, zodat zij het opleest, en berispt haar niet.", "Gen 30:30": "Want het weinige dat u voor mij had, is uitgebroken tot een menigte; en de HEERE heeft u gezegend bij mijn komst; nu dan, wanneer zal ik ook voor mijn eigen huis werken?", "Ezech 13:9": "En Mijn hand zal zijn tegen de profeten die nietigheid zien, en leugen voorzeggen; zij zullen niet in de vergadering van Mijn volk zijn, en in het geschrift van het huis van Israël niet geschreven worden, en in het land van Israël niet komen; en u zult weten dat Ik de Heere HEERE ben.", "Joz 23:10": "Eén man onder u zal er duizend opjagen; want het is de HEERE, uw God, Zelf, Die voor u strijdt, zoals Hij tot u gesproken heeft.", "Richt 14:20": "En de vrouw van Simson werd gegeven aan het metgezel van hem, die hem vergezeld had.", "Joh 19:28": "Hierna, omdat Jezus wist dat nu alles volbracht was, zei Hij, opdat de Schrift vervuld zou worden: Ik heb dorst.", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Richt 7:16": "En hij deelde de driehonderd man in drie groepen; en hij gaf ieder een bazuin in zijn hand, en lege kruiken, en fakkels in het midden van de kruiken.", "Ex 22:6": "Wanneer een vuur uitbreekt en doornen vat, zodat de korenschoven verteerd worden, of het staande koren, of het veld, dan moet hij die de brand heeft aangestoken, het volledig teruggeven.", "Fil 4:3": "En ik bid ook u, mijn oprechte metgezel, wees deze vrouwen behulpzaam, die met mij gestreden hebben in het Evangelie, ook met Clemens, en de andere medearbeiders van mij, van wie de namen in het boek van het leven staan.", "Richt 16:28-30": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken. En Simson greep de twee middelste pilaren, waarop het huis gevestigd was, en waarop het steunde, de ene met zijn rechterhand, en de andere met zijn linkerhand; En Simson zei: Laat mijn ziel sterven met de Filistijnen; en hij boog zich met kracht, en het huis viel op de vorsten, en op al het volk, dat daarin was. En de doden, die hij bij zijn sterven gedood heeft, waren meer dan die hij tijdens zijn leven had gedood.", "Gen 32:31": "En de zon ging voor hem op, toen hij door Pniël gegaan was; en hij hinkte op zijn heup.", "Jes 41:17": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten.", "Richt 14:4": "Zijn vader nu en zijn moeder wisten niet dat dit van de HEERE was, dat hij een gelegenheid zocht tegen de Filistijnen; want de Filistijnen heersten in die tijd over Israël.", "1 Sam 17:49": "En David stak zijn hand in de tas, en nam er een steen uit, en slingerde die, en trof de Filistijn in zijn voorhoofd, zodat de steen in zijn voorhoofd wegzonk, en hij viel voorover op de grond.", "Richt 15:9-19": "Toen trokken de Filistijnen op, en legerden zich tegen Juda, en breidden zich uit in Lechi. En de mannen van Juda zeiden: Waarom bent u tegen ons opgetrokken? En zij zeiden: Wij zijn opgetrokken om Simson te binden, om hem te doen zoals hij ons gedaan heeft. Toen kwamen drieduizend mannen uit Juda af naar het hol van de rots Etam, en zeiden tegen Simson: Weet u niet dat de Filistijnen over ons heersen? Waarom hebt u ons dan dit aangedaan? En hij zei tegen hen: Zoals zij mij gedaan hebben, zo heb ik hun gedaan.", "1 Sam 17:26": "Toen zei David tegen de mannen die bij hem stonden: Wat zal men de man doen die deze Filistijn verslaat en de smaad van Israël wegneemt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van de levende God zou honen?", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "1 Sam 27:1": "David zei in zijn hart: Nu zal ik op een dag door de hand van Saul omkomen. Ik kan niets beters doen dan snel ontkomen naar het land van de Filistijnen, opdat Saul de hoop op mij verliest en mij niet langer zoekt in heel het gebied van Israël; zo zal ik ontkomen uit zijn hand.", "Ps 3:9": "Het heil is van de HEERE; Uw zegen is over Uw volk. Sela.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "Klaagl 5:18": "Om de berg Sion, die verwoest is, waar de vossen op lopen.", "Richt 14:5": "Zo ging Simson, met zijn vader en zijn moeder, naar Thimnath. Toen zij nu kwamen tot aan de wijngaarden van Thimnath, zie, daar was een jonge leeuw, die hem brullend tegemoet kwam.", "Lev 26:8": "Vijf uit u zullen honderd vervolgen, en honderd uit u zullen tienduizend vervolgen; en uw vijanden zullen voor uw aangezicht door het zwaard vallen.", "2 Kor 1:8": "Want wij willen niet, broeders, dat u onwetend bent van onze verdrukking, die ons in Azië overkomen is: dat wij uitzonderlijk zwaar belast zijn geweest, boven ons vermogen, zodat wij zeer in twijfel waren, ook aan het leven.", "2 Sam 14:30": "Toen zei hij tegen zijn knechten: Kijk, het stuk akker van Joab ligt naast het mijne, en hij heeft daar gerst op staan; ga erheen, en steek het in brand. En de knechten van Absalom staken dat stuk akker in brand.", "Richt 3:10": "En de Geest van de HEERE kwam op hem, en hij richtte Israël, en trok uit ten strijde; en de HEERE gaf Cuschan-Rischataïm, de koning van Syrië, in zijn hand, zodat zijn hand sterk werd over Cuschan-Rischataïm.", "Hebr 11:32": "En wat zal ik nog meer zeggen? Want de tijd zou mij tekortschieten, als ik zou vertellen over Gideon, en Barak, en Simson, en Jefta, en David, en Samuël, en de profeten;", "Ps 118:11": "Zij hadden mij omringd, ja, zij hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "Jes 41:18": "Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen.", "Job 20:5": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik?", "1 Kor 1:28": "En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken;", "Richt 4:21": "Daarna nam Jaël, de vrouw van Heber, een tentpin, en greep een hamer in haar hand, en ging stilletjes naar hem toe, en dreef de pin in zijn slaap, zodat hij in de aarde vastzat; want hij was in diepe slaap en uitgeput, en stierf.", "Ps 120:1": "Een lied op Hammaäloth. Ik heb tot de HEERE geroepen in mijn benauwdheid, en Hij heeft mij verhoord.", "Gen 6:4": "In die dagen waren er reuzen op de aarde, en ook daarna, toen Gods zonen tot de dochters der mensen ingegaan waren, en zich kinderen verwekt hadden; deze zijn de geweldigen, die van ouds geweest zijn, mannen van naam.", "1 Sam 4:5": "En het gebeurde, toen de ark van het verbond van de HEERE in het leger kwam, dat heel Israël juichte met een groot gejuich, zodat de aarde dreunde.", "Richt 14:16": "En de vrouw van Simson weende voor hem en zei: U haat mij maar, en hebt mij niet lief; u hebt de kinderen van mijn volk een raadsel te raden gegeven, en hebt het mij niet verklaard. En hij zei tegen haar: Zie, ik heb het mijn vader en mijn moeder niet verklaard, zou ik het u dan verklaren?", "Richt 8:4": "Toen Gideon nu bij de Jordaan gekomen was, ging hij eroverheen, met de driehonderd mannen die bij hem waren, moe, maar toch nog vervolgend.", "Gen 12:12": "En het zal gebeuren, wanneer de Egyptenaren u zien, dat zij zullen zeggen: Dat is zijn vrouw; en zij zullen mij doden, en u in leven laten.", "Richt 5:30": "Zouden zij dan de buit niet vinden en delen? Een liefje, of twee liefjes, voor ieder man? Voor Sisera een buit van verscheidene verven, een buit van verscheidene verven, gestikt; van verscheiden verf aan beide zijden gestikt, voor de buithalzen?", "1 Kor 1:27": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen;", "Richt 15:11-13": "Toen kwamen drieduizend mannen uit Juda af naar het hol van de rots Etam, en zeiden tegen Simson: Weet u niet dat de Filistijnen over ons heersen? Waarom hebt u ons dan dit aangedaan? En hij zei tegen hen: Zoals zij mij gedaan hebben, zo heb ik hun gedaan. En zij zeiden tegen hem: Wij zijn afgekomen om u te binden, om u over te geven in de hand van de Filistijnen. Toen zei Simson tegen hen: Zweer mij dat u zelf mij niet zult aanvallen. En zij spraken tegen hem en zeiden: Nee, maar wij zullen u wel stevig binden, en u in hun hand overgeven; maar wij zullen u zeker niet doden. En zij bonden hem met twee nieuwe touwen, en voerden hem op van de rots.", "1 Kon 2:34": "En Benaja, de zoon van Jojada, ging omhoog, en viel op hem aan, en doodde hem; en hij werd begraven in zijn huis, in de woestijn.", "Richt 15:15-17": "En hij vond een vochtig ezelskaakbeen, en hij stak zijn hand uit, en nam het, en sloeg daarmee duizend man. Toen zei Simson: Met een ezelskaakbeen, een hoop, twee hopen, met een ezelskaakbeen heb ik duizend man geslagen. En het gebeurde, toen hij klaar was met spreken, dat hij het kaakbeen uit zijn hand wierp; en hij noemde die plaats Ramath-lechi.", "Hand 7:25": "En hij meende dat zijn broeders zouden begrijpen dat God door zijn hand hun verlossing geven zou; maar zij hebben het niet begrepen.", "2 Kor 4:9": "Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven;", "1 Sam 17:36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Jes 10:16": "Daarom zal de Heere Heere van de heerscharen onder zijn vetten een magerheid zenden; en onder zijn heerlijkheid zal Hij een brand doen branden, als de brand van het vuur.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Richt 12:1": "Toen werden de mannen van Efraïm bijeengeroepen, en zij trokken naar het noorden; en zij zeiden tegen Jeftha: Waarom bent u doorgetrokken om te strijden tegen de kinderen van Ammon, en hebt u ons niet geroepen om met u mee te gaan? Wij zullen uw huis boven u met vuur verbranden.", "Richt 13:1": "En de Israëlieten deden verder wat slecht was in de ogen van de HEERE; daarom gaf de HEERE hen in de hand van de Filistijnen, veertig jaar lang.", "1 Tess 4:6": "Dat niemand zijn broeder tekortdoet, of hem bedriegt in zijn zaken; want de Heere is een wreker over dit alles, zoals wij u ook van tevoren gezegd en betuigd hebben.", "Ex 14:3": "Farao dan zal zeggen van de kinderen van Israël: Zij zijn verward in het land; die woestijn heeft hen ingesloten.", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "Deut 28:47": "Omdat u de HEERE, uw God, niet gediend hebt met vreugde en blijdschap van hart, vanwege de overvloed van alles;", "Richt 16:24": "Toen het volk hem zag, loofden zij hun god, want zij zeiden: Onze god heeft onze vijand in onze hand gegeven, die ons land verwoestte, en die velen van ons doodde!", "1 Sam 30:12": "Zij gaven hem ook een stuk van een klomp vijgen, en twee stukken rozijnen; en hij at, en zijn geest kwam weer in hem terug; want hij had drie dagen en drie nachten geen brood gegeten, en geen water gedronken.", "Jes 10:17": "Want het Licht van Israël zal tot een vuur zijn, en zijn Heilige tot een vlam, die in brand zal steken en verteren zal zijn doornen en zijn distels, op één dag.", "1 Sam 14:14": "Deze eerste aanval, waarmee Jonathan en zijn wapendrager ongeveer twintig man versloegen, gebeurde op ongeveer de helft van een halve morgen land, zoveel als een span ossen kan omploegen.", "Deut 28:48": "Zo zult u uw vijanden, die de HEERE tegen u zenden zal, dienen, in honger en in dorst, en in naaktheid, en in gebrek aan alles; en Hij zal een ijzeren juk op uw hals leggen, totdat Hij u verdelgt.", "Ps 46:10": "Die de oorlogen doet ophouden tot aan het einde van de aarde, de boog verbreekt, en de speer in tweeën slaat, de wagens met vuur verbrandt.", "Gen 29:21": "Toen zei Jakob tegen Laban: Geef mij mijn vrouw, want mijn dagen zijn vervuld, zodat ik bij haar kan komen.", "Matt 27:2": "En nadat zij Hem gebonden hadden, leidden zij Hem weg en gaven Hem over aan Pontius Pilatus, de stadhouder.", "1 Sam 17:50": "Zo overweldigde David de Filistijn met een slinger en met een steen; en hij versloeg de Filistijn en doodde hem; doch David had geen zwaard in zijn hand.", "Ps 18:35": "Hij leert mijn handen ten strijde, zodat een stalen boog met mijn armen verbroken is.", "Richt 15:4-6": "En Simson ging heen, en ving driehonderd vossen; en hij nam fakkels, en keerde staart aan staart, en deed één fakkel tussen twee staarten in het midden. En hij stak de fakkels aan met vuur, en liet ze lopen in het staande koren van de Filistijnen; en hij stak zowel de korenhopen als het staande koren in brand, zelfs tot de wijngaarden en olijfbomen toe. Toen zeiden de Filistijnen: Wie heeft dit gedaan? En men zei: Simson, de schoonzoon van de Thimniet, omdat hij zijn vrouw heeft weggenomen, en haar aan zijn metgezel heeft gegeven. Toen kwamen de Filistijnen op, en verbrandden haar en haar vader met vuur.", "Hand 26:9": "Ik meende inderdaad bij mijzelf dat ik tegen de Naam van Jezus van Nazareth veel dingen moest doen die ertegen ingingen.", "Deut 28:13": "En de HEERE zal u tot een hoofd maken, en niet tot een staart, en u zult alleen boven zijn, en niet onder zijn; wanneer u luistert naar de geboden van de HEERE, uw God, die ik u heden gebied te houden en te doen;", "Ruth 2:15": "Toen zij opstond om op te lezen, gebood Boaz zijn knechten: Laat haar ook tussen de schoven oplezen, en beschaamt haar niet."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">het</span> gebeurde <span class=\"wl\" data-l=\"L2\" data-code=\"H4480\">na</span> enige <span class=\"wl\" data-l=\"L3\" data-code=\"H3117\">dagen</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H3117\">in</span> <span class=\"wl\" data-l=\"L3\" data- ata-l=\"L1\" data-code=\"H8199\">richtte</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3478\">Israël</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H3478\">in</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3117\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3117\">dagen</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3117\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6430\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6430\">Filistijnen</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H6242\">twintig</span> jaar."}, "koppeling_kjv": {"1": "But it came to pass within a while <span class=\"wl wl-kjv\" data-code=\"H3117\">after,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat</span> <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest,</span> that <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">visited</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> with a <span class=\"wl wl-kjv\" data-code=\"H1423\">kid;</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will go <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to my <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> into the <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber.</span> But her <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> would not <span class=\"wl wl-kjv\" data-code=\"H5414\">suffer</span> him to go in.", "2": "And her <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H559\">verily</span> <span class=\"wl wl-kjv\" data-code=\"H559\">thought</span> that thou hadst <span class=\"wl wl-kjv\" data-code=\"H8130\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> her; therefore I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> her to thy <span class=\"wl wl-kjv\" data-code=\"H4828\">companion:</span> is not her <span class=\"wl wl-kjv\" data-code=\"H6996\">younger</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> fairer", "3": "And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> concerning them, <span class=\"wl wl-kjv\" data-code=\"H6471\">Now</span> shall I be more <span class=\"wl wl-kjv\" data-code=\"H5352\">blameless</span> than the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> though I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> them a displeasure.", "4": "And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">caught</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H7776\">foxes,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H3940\">firebrands,</span> and <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> <span class=\"wl wl-kjv\" data-code=\"H2180\">tail</span> to <span class=\"wl wl-kjv\" data-code=\"H2180\">tail,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H3940\">firebrand</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> between <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> tails.", "5": "And when he had <span class=\"wl wl-kjv\" data-code=\"H1197\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H3940\">brands</span> on <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> he let them <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> into the standing <span class=\"wl wl-kjv\" data-code=\"H7054\">corn</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and burnt <span class=\"wl wl-kjv\" data-code=\"H1197\">up</span> both the <span class=\"wl wl-kjv\" data-code=\"H1430\">shocks,</span> and also the standing <span class=\"wl wl-kjv\" data-code=\"H7054\">corn,</span> with the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyards</span> and olives.", "6": "Then the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this? And they <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson,</span> the son in <span class=\"wl wl-kjv\" data-code=\"H2860\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H8554\">Timnite,</span> because he had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> her to his <span class=\"wl wl-kjv\" data-code=\"H4828\">companion.</span> And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> her and her <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> with fire.", "7": "And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H518\">Though</span> ye have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> <span class=\"wl wl-kjv\" data-code=\"H2063\">this,</span> yet will I be <span class=\"wl wl-kjv\" data-code=\"H5358\">avenged</span> of you, and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that I will cease.", "8": "And he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> them <span class=\"wl wl-kjv\" data-code=\"H7785\">hip</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">and</span> <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter:</span> and he went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H5585\">top</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> Etam.", "9": "Then the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5203\">spread</span> themselves in Lehi.", "10": "And the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Why are ye come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against us? And they <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> To <span class=\"wl wl-kjv\" data-code=\"H631\">bind</span> <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> are we come <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> to him as he hath done", "11": "Then <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">went</span> to the <span class=\"wl wl-kjv\" data-code=\"H5585\">top</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock</span> <span class=\"wl wl-kjv\" data-code=\"H5862\">Etam,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">Knowest</span> thou not that the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> are <span class=\"wl wl-kjv\" data-code=\"H4910\">rulers</span> over us? what is this that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto us? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, As they <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto me, so have I done", "12": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, We are come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H631\">bind</span> thee, that we may <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> thee into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span> And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H7650\">Swear</span> unto me, that ye will not fall upon", "13": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> No; but we will <span class=\"wl wl-kjv\" data-code=\"H631\">bind</span> thee <span class=\"wl wl-kjv\" data-code=\"H631\">fast,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> thee into their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> but <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> we will not <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> thee. And they <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> him with <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H5688\">cords,</span> and brought him <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from the rock.", "14": "And when he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto <span class=\"wl wl-kjv\" data-code=\"H3896\">Lehi,</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H7321\">shouted</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> him: and the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came <span class=\"wl wl-kjv\" data-code=\"H6743\">mightily</span> upon him, and the <span class=\"wl wl-kjv\" data-code=\"H5688\">cords</span> that were upon his <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> became as <span class=\"wl wl-kjv\" data-code=\"H6593\">flax</span> that was <span class=\"wl wl-kjv\" data-code=\"H1197\">burnt</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and his <span class=\"wl wl-kjv\" data-code=\"H612\">bands</span> <span class=\"wl wl-kjv\" data-code=\"H4549\">loosed</span> from off his hands.", "15": "And he <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> a <span class=\"wl wl-kjv\" data-code=\"H2961\">new</span> <span class=\"wl wl-kjv\" data-code=\"H3895\">jawbone</span> of an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> and put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> it, and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> men", "16": "And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> With the <span class=\"wl wl-kjv\" data-code=\"H3895\">jawbone</span> of an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> <span class=\"wl wl-kjv\" data-code=\"H2565\">heaps</span> upon <span class=\"wl wl-kjv\" data-code=\"H2565\">heaps,</span> with the <span class=\"wl wl-kjv\" data-code=\"H3895\">jaw</span> of an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass</span> have I <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> men.", "17": "And it came to pass, when he had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking,</span> that he cast <span class=\"wl wl-kjv\" data-code=\"H7993\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H3895\">jawbone</span> out of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> that <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> Ramathlehi.", "18": "And he was <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H6770\">athirst,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> on the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou hast <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8668\">deliverance</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant:</span> and now shall I <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> for <span class=\"wl wl-kjv\" data-code=\"H6772\">thirst,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the uncircumcised?", "19": "But <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1234\">clave</span> an hollow <span class=\"wl wl-kjv\" data-code=\"H4388\">place</span> that was in the <span class=\"wl wl-kjv\" data-code=\"H3895\">jaw,</span> and there <span class=\"wl wl-kjv\" data-code=\"H3318\">came</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> thereout; and when he had <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk,</span> his <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> came <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and he <span class=\"wl wl-kjv\" data-code=\"H2421\">revived:</span> wherefore he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> thereof <span class=\"wl wl-kjv\" data-code=\"H5875\">Enhakkore,</span> which is in <span class=\"wl wl-kjv\" data-code=\"H3896\">Lehi</span> unto this day.", "20": "And he <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> years."}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
