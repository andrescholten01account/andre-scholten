Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En Simson ging af naar Thimnath, en zag daar een vrouw uit de dochters van de Filistijnen,","2":"Zo ging hij naar boven en vertelde het zijn vader en zijn moeder, en zei: Ik heb een vrouw gezien te Thimnath, uit de dochters van de Filistijnen; nu dan, neem die voor mij tot vrouw.","3":"Maar zijn vader zei tot hem, alsook zijn moeder: Is er geen vrouw onder de dochters van uw broeders, en onder al mijn volk, dat u heengaat om een vrouw te nemen van de Filistijnen, die onbesnedenen? En Simson zei tegen zijn vader: Neem mij die, want zij is bevallig in mijn ogen.","4":"Zijn vader nu en zijn moeder wisten niet dat dit van de HEERE was, dat hij een gelegenheid zocht tegen de Filistijnen; want de Filistijnen heersten in die tijd over Israël.","5":"Zo ging Simson, met zijn vader en zijn moeder, naar Thimnath. Toen zij nu kwamen tot aan de wijngaarden van Thimnath, zie, daar was een jonge leeuw, die hem brullend tegemoet kwam.","6":"Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.","7":"En hij kwam af en sprak met de vrouw; en zij beviel Simson goed.","8":"En na enige dagen kwam hij terug om haar te nemen; toen week hij af om het kadaver van de leeuw te bekijken, en zie, er was een bijenzwerm in het lichaam van de leeuw, met honing.","9":"En hij nam die in zijn handen en ging verder, al gaande en etende; en hij ging naar zijn vader en naar zijn moeder, en gaf het hun, en zij aten; maar hij vertelde hun niet dat hij de honing uit het lichaam van de leeuw genomen had.","10":"Toen zijn vader afgekomen was naar die vrouw, maakte Simson daar een bruiloftsfeest, want zo plachten de jongemannen te doen.","11":"En het gebeurde, toen zij hem zagen, dat zij dertig metgezellen namen om bij hem te zijn.","12":"Simson dan zei tegen hen: Ik zal u nu een raadsel te raden geven; als u het mij in de zeven dagen van deze bruiloft goed kunt verklaren en uitvinden, dan zal ik u dertig stel linnen kleren geven, en dertig stellen (extra) kleren.","13":"En als u het mij niet zult kunnen verklaren, dan zult u mij dertig stel linnen kleren geven, en dertig stellen (extra) kleren. En zij zeiden tegen hem: Geef uw raadsel te raden, en laat het ons horen.","14":"En hij zei tegen hen: Er kwam voedsel uit de eter, en er kwam zoetigheid uit de sterke. En zij konden dat raadsel in drie dagen niet verklaren.","15":"Daarna gebeurde het op de zevende dag, dat zij tegen de vrouw van Simson zeiden: Overreed uw man, dat hij ons dat raadsel verklaart, opdat wij niet misschien u en het huis van uw vader met vuur verbranden. Hebt u ons genodigd om ons van ons bezit te beroven? Is het zo niet?","16":"En de vrouw van Simson weende voor hem en zei: U haat mij maar, en hebt mij niet lief; u hebt de kinderen van mijn volk een raadsel te raden gegeven, en hebt het mij niet verklaard. En hij zei tegen haar: Zie, ik heb het mijn vader en mijn moeder niet verklaard, zou ik het u dan verklaren?","17":"En zij weende voor hem, de zeven dagen dat zij deze bruiloft hadden; zo gebeurde het op de zevende dag, dat hij het haar verklaarde, want zij drong hem sterk aan; en zij verklaarde dat raadsel aan de kinderen van haar volk.","18":"Toen zeiden de mannen van de stad tegen hem, op de zevende dag, voordat de zon onderging: Wat is zoeter dan honing? En wat is sterker dan een leeuw? En hij zei tegen hen: Als u met mijn vaars niet had geploegd, had u mijn raadsel niet uitgevonden.","19":"Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.","20":"En de vrouw van Simson werd gegeven aan het metgezel van hem, die hem vergezeld had."},"SV":{"1":"En Simson ging af naar Thimnath, en gezien hebbende een vrouw te Thimnath, van de dochteren der Filistijnen,","2":"Zo ging hij opwaarts, en gaf het zijn vader en zijn moeder te kennen, en zeide: Ik heb een vrouw gezien te Thimnath, van de dochteren der Filistijnen; nu dan, neem mij die tot een vrouw.","3":"Maar zijn vader zeide tot hem, mitsgaders zijn moeder: Is er geen vrouw onder de dochteren uwer broeders, en onder al mijn volk, dat gij heengaat, om een vrouw te nemen van de Filistijnen, die onbesnedenen? En Simson zeide tot zijn vader: Neem mij die, want zij is bevallig in mijn ogen.","4":"Zijn vader nu en zijn moeder wisten niet, dat dit van den HEERE was, dat hij gelegenheid zocht van de Filistijnen; want de Filistijnen heersten te dier tijd over Israël.","5":"Alzo ging Simson, met zijn vader en zijn moeder, henen af naar Thimnath. Als zij nu kwamen tot aan de wijngaarden van Thimnath, ziet daar, een jonge leeuw, brullende hem tegemoet.","6":"Toen werd de Geest des HEEREN vaardig over hem, dat hij hem van een scheurde, gelijk men een bokje van een scheurt, en er was niets in zijn hand; doch hij gaf zijn vader en zijn moeder niet te kennen, wat hij gedaan had.","7":"En hij kwam af, en sprak tot de vrouw; en zij beviel in Simsons ogen.","8":"En na sommige dagen kwam hij weder, om haar te nemen; toen week hij af, om het aas van den leeuw te bezien, en ziet, een bijenzwerm was in het lichaam van den leeuw, met honig.","9":"En hij nam dien in zijn handen, en ging voort, al gaande en etende; en hij ging tot zijn vader en tot zijn moeder, en gaf hun *daarvan*, en zij aten; doch hij gaf hun niet te kennen, dat hij den honig uit het lichaam van den leeuw genomen had.","10":"Als nu zijn vader afgekomen was tot die vrouw, zo maakte Simson aldaar een bruiloft, want alzo plachten de jongelingen te doen.","11":"En het geschiedde, als zij hem zagen, zo namen zij dertig metgezellen, die bij hem zouden zijn.","12":"Simson dan zeide tot hen: Ik zal nu ulieden een raadsel te raden geven; indien gij mij dat in de zeven dagen dezer bruiloft wel zult verklaren en uitvinden, zo zal ik ulieden geven dertig fijne lijnwaadsklederen, en dertig wisselklederen.","13":"En indien gij het mij niet zult kunnen verklaren, zo zult gijlieden mij geven dertig fijne lijnwaadsklederen, en dertig wisselklederen. En zij zeiden tot hem: Geef uw raadsel te raden, en laat het ons horen.","14":"En hij zeide tot hen: Spijze ging uit van den eter, en zoetigheid ging uit van den sterke. En zij konden dat raadsel in drie dagen niet verklaren.","15":"Daarna geschiedde het op den zevenden dag, dat zij tot de huisvrouw van Simson zeiden: Overreed uw man, dat hij ons dat raadsel verklare, opdat wij niet misschien u, en het huis uws vaders, met vuur verbranden. Hebt gijlieden ons genodigd, om het onze te bezitten; is het zo niet?","16":"En Simsons huisvrouw weende voor hem en zeide: Gij haat mij maar, en hebt mij niet lief; gij hebt den kinderen mijns volks een raadsel te raden gegeven, en hebt het mij niet verklaard. En hij zeide tot haar: Zie, ik heb het mijn vader en mijn moeder niet verklaard, zou ik het u dan verklaren?","17":"En zij weende voor hem, op den zevenden der dagen in dewelke zij deze bruiloft hadden; zo geschiedde het op den zevenden dag, dat hij het haar verklaarde, want zij perste hem; en zij verklaarde dat raadsel den kinderen haars volks.","18":"Toen zeiden de mannen der stad tot hem, op den zevenden dag, eer de zon onderging: Wat is zoeter dan honig? en wat is sterker dan een leeuw? En hij zeide tot hen: Zo gij met mijn kalf niet hadt geploegd, gij zoudt mijn raadsel niet hebben uitgevonden.","19":"Toen werd de Geest des HEEREN vaardig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun gewaad, en gaf de wisselklederen aan degenen, die dat raadsel verklaard hadden. Doch zijn toorn ontstak, en hij ging op in zijns vaders huis.","20":"En de huisvrouw van Simson werd zijns metgezels, die hem vergezelschapt had."},"KJV":{"1":"And Samson went down to Timnath, and saw a woman in Timnath of the daughters of the Philistines.","2":"And he came up, and told his father and his mother, and said, I have seen a woman in Timnath of the daughters of the Philistines: now therefore get her for me to wife.","3":"Then his father and his mother said unto him, *Is there* never a woman among the daughters of thy brethren, or among all my people, that thou goest to take a wife of the uncircumcised Philistines? And Samson said unto his father, Get her for me; for she pleaseth me well.","4":"But his father and his mother knew not that it *was* of the LORD, that he sought an occasion against the Philistines: for at that time the Philistines had dominion over Israel.","5":"Then went Samson down, and his father and his mother, to Timnath, and came to the vineyards of Timnath: and, behold, a young lion roared against","6":"And the Spirit of the LORD came mightily upon him, and he rent him as he would have rent a kid, and *he had* nothing in his hand: but he told not his father or his mother what he had done.","7":"And he went down, and talked with the woman; and she pleased Samson well.","8":"And after a time he returned to take her, and he turned aside to see the carcase of the lion: and, behold, *there was* a swarm of bees and honey in the carcase of the lion.","9":"And he took thereof in his hands, and went on eating, and came to his father and mother, and he gave them, and they did eat: but he told not them that he had taken the honey out of the carcase of the lion.","10":"So his father went down unto the woman: and Samson made there a feast; for so used the young men to do.","11":"And it came to pass, when they saw him, that they brought thirty companions","12":"And Samson said unto them, I will now put forth a riddle unto you: if ye can certainly declare it me within the seven days of the feast, and find *it* out, then I will give you thirty sheets and thirty change of garments:","13":"But if ye cannot declare *it* me, then shall ye give me thirty sheets and thirty change of garments. And they said unto him, Put forth thy riddle, that we may hear","14":"And he said unto them, Out of the eater came forth meat, and out of the strong came forth sweetness. And they could not in three days expound the riddle.","15":"And it came to pass on the seventh day, that they said unto Samson's wife, Entice thy husband, that he may declare unto us the riddle, lest we burn thee and thy father's house with fire: have ye called us to take that we have?","16":"And Samson's wife wept before him, and said, Thou dost but hate me, and lovest me not: thou hast put forth a riddle unto the children of my people, and hast not told *it* me. And he said unto her, Behold, I have not told *it* my father nor my mother, and shall I tell","17":"And she wept before him the seven days, while their feast lasted: and it came to pass on the seventh day, that he told her, because she lay sore upon him: and she told the riddle to the children of her people.","18":"And the men of the city said unto him on the seventh day before the sun went down, What *is* sweeter than honey? and what *is* stronger than a lion? And he said unto them, If ye had not plowed with my heifer, ye had not found out my riddle.","19":"And the Spirit of the LORD came upon him, and he went down to Ashkelon, and slew thirty men of them, and took their spoil, and gave change of garments unto them which expounded the riddle. And his anger was kindled, and he went up to his father's house.","20":"But Samson's wife was *given* to his companion, whom he had used as his friend."}},"tsk":{"1":[{"kopje":"Thimnath","refs":["Gen 38:12","Gen 38:13","Joz 15:10","Joz 19:43","Gen 6:2","Gen 34:1","Gen 34:2","2 Sam 11:2","Job 31:1","Ps 119:37","1 Joh 2:16"]}],"2":[{"kopje":"neem die","refs":["Gen 21:21","Gen 24:2","Gen 24:3","Gen 34:4","Gen 38:6","2 Kon 14:9"]}],"3":[{"kopje":"uw broeders","refs":["Gen 13:8","Gen 21:3","Gen 21:4","Gen 21:27"]},{"kopje":"onbesnedenen","refs":["Richt 15:18","Gen 34:14","Ex 34:12-16","Deut 7:2","Deut 7:3","1 Sam 14:6","1 Sam 17:26","1 Sam 17:36","1 Sam 31:4","2 Sam 1:20"]}],"4":[{"kopje":"dit van de HEERE was","refs":["Joz 11:20","1 Kon 12:15","2 Kon 6:33","2 Kron 10:15","2 Kron 22:7","2 Kron 25:20","Ps 115:3"]},{"kopje":"heersten","refs":["Richt 13:1","Richt 15:11","Deut 28:48"]}],"5":[{"kopje":"tegemoet","refs":["Richt 14:5"]}],"6":[{"kopje":"de Geest","refs":["Richt 3:10","Richt 11:29","Richt 13:25","1 Sam 11:6"]},{"kopje":"scheurde hem","refs":["Richt 15:8","Richt 15:15","Richt 16:30","1 Sam 17:34-37","1 Sam 17:46","Zach 4:6","1 Joh 3:8"]},{"kopje":"hij vertelde","refs":["Jes 42:2","Matt 11:29"]}],"8":[{"kopje":"om haar te nemen","refs":["Gen 29:21","Matt 1:20"]}],"10":[{"kopje":"maakte daar","refs":["Gen 29:22","Est 1:7-22","Pred 10:19","Matt 22:2-4","Joh 2: 00\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H4658\">carcase</span> of the <span class=\"wl wl-kjv\" data-code=\"H738\">lion:</span> and, behold, there was a <span class=\"wl wl-kjv\" data-code=\"H5712\">swarm</span> of <span class=\"wl wl-kjv\" data-code=\"H1682\">bees</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> in the <span class=\"wl wl-kjv\" data-code=\"H1472\">carcase</span> of the lion.","9":"And he <span class=\"wl wl-kjv\" data-code=\"H7287\">took</span> thereof in his <span class=\"wl wl-kjv\" data-code=\"H3709\">hands,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3212\">on</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eating,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">came</span> to his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them, and they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat:</span> but he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> not them that he had <span class=\"wl wl-kjv\" data-code=\"H7287\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H1706\">honey</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1472\">carcase</span> of the lion.","10":"So his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto the <span class=\"wl wl-kjv\" data-code=\"H802\">woman:</span> and <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> there a <span class=\"wl wl-kjv\" data-code=\"H4960\">feast;</span> for so used the young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> to do.","11":"And it came to pass, when they <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him, that they <span class=\"wl wl-kjv\" data-code=\"H3947\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> companions","12":"And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, I will now put <span class=\"wl wl-kjv\" data-code=\"H2330\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H2420\">riddle</span> unto you: if ye can <span class=\"wl wl-kjv\" data-code=\"H5046\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> it me within the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the <span class=\"wl wl-kjv\" data-code=\"H4960\">feast,</span> and find it <span class=\"wl wl-kjv\" data-code=\"H4672\">out,</span> then I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H5466\">sheets</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H2487\">change</span> of garments:","13":"But if ye <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> it me, then shall ye <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H5466\">sheets</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H2487\">change</span> of <span class=\"wl wl-kjv\" data-code=\"H899\">garments.</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Put <span class=\"wl wl-kjv\" data-code=\"H2330\">forth</span> thy <span class=\"wl wl-kjv\" data-code=\"H2420\">riddle,</span> that we may hear","14":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Out of the <span class=\"wl wl-kjv\" data-code=\"H398\">eater</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H3978\">meat,</span> and out of the <span class=\"wl wl-kjv\" data-code=\"H5794\">strong</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H4966\">sweetness.</span> And they <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not in <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">expound</span> the riddle.","15":"And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> <span class=\"wl wl-kjv\" data-code=\"H6601\">Entice</span> thy <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> unto us the <span class=\"wl wl-kjv\" data-code=\"H2420\">riddle,</span> lest we <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> thee and thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire:</span> have ye <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> us to take that we have?","16":"And <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> before him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou dost but <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> me, and <span class=\"wl wl-kjv\" data-code=\"H157\">lovest</span> me not: thou hast put <span class=\"wl wl-kjv\" data-code=\"H2330\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H2420\">riddle</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and hast not <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> it me. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Behold, I have not <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> it my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> nor my <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and shall I tell","17":"And she <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> before him the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> while their <span class=\"wl wl-kjv\" data-code=\"H4960\">feast</span> <span class=\"wl wl-kjv\" data-code=\"H1961\">lasted:</span> and it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> her, because she lay <span class=\"wl wl-kjv\" data-code=\"H6693\">sore</span> upon him: and she <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H2420\">riddle</span> to the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of her people.","18":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> before the <span class=\"wl wl-kjv\" data-code=\"H2775\">sun</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">down,</span> What is <span class=\"wl wl-kjv\" data-code=\"H4966\">sweeter</span> than <span class=\"wl wl-kjv\" data-code=\"H1706\">honey?</span> and what is <span class=\"wl wl-kjv\" data-code=\"H5794\">stronger</span> than a <span class=\"wl wl-kjv\" data-code=\"H738\">lion?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H3884\">If</span> ye had not <span class=\"wl wl-kjv\" data-code=\"H2790\">plowed</span> with my <span class=\"wl wl-kjv\" data-code=\"H5697\">heifer,</span> ye had not found <span class=\"wl wl-kjv\" data-code=\"H4672\">out</span> my riddle.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6743\">came</span> upon him, and he went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H831\">Ashkelon,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of them, and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> their <span class=\"wl wl-kjv\" data-code=\"H2488\">spoil,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H2487\">change</span> of garments unto them which <span class=\"wl wl-kjv\" data-code=\"H5046\">expounded</span> the <span class=\"wl wl-kjv\" data-code=\"H2420\">riddle.</span> And his <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled,</span> and he went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> house.","20":"But <span class=\"wl wl-kjv\" data-code=\"H8123\">Samson's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> was given to his <span class=\"wl wl-kjv\" data-code=\"H4828\">companion,</span> whom he had used as his friend."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Thimnath,","tekst":"Liggende in het westen van Zora, niet ver van de Middellandse zee."}],"2":[{"catchword":"neem mij die tot een vrouw","tekst":"Zie van het recht der ouders in de huwelijken hunner kinderen, Gen 21:21, en Gen 24:3, en Gen 26:34."}],"3":[{"catchword":"broeders,","tekst":"Dat is, bloedverwanten, of landslieden. Zie Gen 13:8, en Gen 24:27."},{"catchword":"onbesnedenen?","tekst":"Zie Gen 34:14. Met deze heidense inwoners van Kanaän had God uitdrukkelijk verboden enig verbond of huwelijk te maken. Zie Exo 34:12, Exo 34:16, en elders. Waarom zij reden hadden om te letten op Gods geopenbaard bevel en Simson te bestraffen, als niet wetende van de heimelijke regering en het voornemen Gods [zie vs.4], die recht heeft om zijn schepselen wetten te stellen, maar zelf te doen naar zijn welbehagen, en iets tegenovergesteld extra- ordinairlijk te laten geschieden. Vergelijk Gen 22:2; Exo 3:22, enz."},{"catchword":"Neem mij die,","tekst":"Zie Gen 19:14."},{"catchword":"bevallig in mijn ogen","tekst":"Hebreeuws, recht."}],"4":[{"catchword":"HEERE was,","tekst":"Die hierdoor voorhad Simson de occasie of gelegenheid te geven tot volvoering van zijn roeping."},{"catchword":"Hij gelegenheid zocht","tekst":"Te weten, Simson. Want hoewel hij van God daartoe geroepen was, mocht hij evenwel, hetgeen zonder dat goed en recht was alzo zoeken te beginnen, dat de mensen hem met reden geen ongelijk konden geven."},{"catchword":"van de Filistijnen;","tekst":"Dat zij van hun zijde hem occasie mochten geven, om tegen henlieden te beginnen."},{"catchword":"heersten te dier tijd over Israël","tekst":"Zie boven, Jdg 13:1."}],"5":[{"catchword":"vader en zijn moeder,","tekst":"Zijnde nu veranderd, òf omdat zij uit alles, wat voor zijn ontvangenis en geboorte geschied was, tot nadenken waren gekomen, dat dit van God moest zijn; of omdat Simson hunlieden zijn voornemen en goddelijke aandrift ontdekt had."},{"catchword":"jonge leeuw,","tekst":"Hebreeuws, een jong der leeuwen, brullende in zijn ontmoeting. Het schijnt dat hij van zijn ouders door een anderen weg was afgegaan. Vergelijk onder, vs.8."}],"6":[{"catchword":"vaardig over hem,","tekst":"Of, viel, of kwam machtiglijk op hem, makende hem extra-ordinair moedig en sterk, om hem door deze proef tot uitvoering van zijn beroep te bereiden, en daarin te versterken; alsook om hem stof te geven tot het raadsel en hetgeen daarop gevolgd is."},{"catchword":"hem van een scheurde,","tekst":"Den leeuw."},{"catchword":"niets in zijn hand;","tekst":"Geen instrument of geweer; alleenlijk gebruikende zijn handen."}],"7":[{"catchword":"sprak tot de vrouw;","tekst":"Zo hijzelf, alsook zijn ouders."},{"catchword":"beviel in Simsons ogen","tekst":"Hebreeuws, zij was recht in Simsons ogen."}],"8":[{"catchword":"sommige dagen kwam hij weder,","tekst":"Hebreeuws, van, of na dagen. Zie Gen 4:3."},{"catchword":"nemen;","tekst":"Dat is, te trouwen."},{"catchword":"af,","tekst":"Te weten, van den gemenen weg naar de plaats, waar hij den doden en gescheurden leeuw geworpen had. Zie vs.5."}],"9":[{"catchword":"dien in zijn handen,","tekst":"Den honig."}],"10":[{"catchword":"een bruiloft,","tekst":"Het Hebreeuwse woord betekent in het algemeen een maaltijd, doch is hier te verstaan van een bruiloftsmaal."}],"11":[{"catchword":"zij hem zagen,","tekst":"Te weten, de Filistijnen van Thimnath, die wat bijzonders in Simson uit zijn gelaat en wezen gemerkt hebbende, achterdenken kregen, en derhalve onder schijn van eer door dit bijgevoegde gezelschap [dat zij door de bruidsvrienden met glimp konden beschikken] op hem deden letten."},{"catchword":"namen zij dertig metgezellen,","tekst":"Dat is, zij namen en brachten. Zie Gen 12:15."}],"12":[{"catchword":"raadsel te raden geven;","tekst":"Dat is, een kunstige, duistere en vreemde rede, of spreuk, onder welk iets verborgen is, dat de woorden niet geven, maar door nadenken moet worden uitgevonden, en alsdan klaar en bevallig is. Hebreeuws alsof men zeide: Een raadsel raadselen; alzo onder, vs.13, 16; Eze 17:2. Zie wijders 1Ki 10:1."},{"catchword":"wel zult verklaren en uitvinden,","tekst":"Hebreeuws, verklarende verklaren."},{"catchword":"fijne lijnwaadsklederen,","tekst":"Het Hebreeuwse woord wordt genomen voor fijn lijnwaad, en een laken, hemd, of iets anders daarvan gemaakt, om zich des nachts daarmede te dekken, of ook des daags om te slaan of aan te doen. Hetzelfde woord vindt men in het Nieuwe Testament gebruikt in de Griekse spraak, Mat 27:59; Mar 14:51-52, en Mar 15:46; Luk 23:53."},{"catchword":"en dertig","tekst":"Anders, te weten, dertig wisselklederen, van hetzelfde fijne lijnwaad gemaakt. Vergelijk onder, vs.19."},{"catchword":"wisselklederen","tekst":"Hebreeuws, verwisselingen van klederen."}],"14":[{"catchword":"Spijze ging uit","tekst":"Of, om de aardigheid van het raadsel en der Hebreeuwse spraak wat nader te komen, aldus: Eten [gelijk wij zeggen: breng het eten, dat is, de spijs, op de tafel] ging uit, of, kwam voort van den eter, en zoet kwam voort van den zuren, of, scherpen. Het Hebreeuwse woord betekent niet alleen sterk, maar ook hard, wreed, scherp, enzovoorts, zuur, gelijk wij van zeer zuren azijn zeggen dat hij zeer sterk is. En een zuur gelaat, gezicht, voor een zuur, wreed, sterk gelaat, of gezicht."},{"catchword":"eter,","tekst":"Van dengene, die geen spijs placht van zich te geven, maar zelf alles te verslinden, te weten de leeuw."},{"catchword":"zoetigheid ging uit van den sterke","tekst":"Te weten, honig."}],"15":[{"catchword":"zevenden dag,","tekst":"Na de eerste drie dagen bevindende dat zij met hun eigen verstand en arbeid niets waren gevorderd, schijnen zij de zaak van tijd tot tijd bij Simsons vrouw sterker aangebonden te hebben, totdat het op den zevenden dag, door hun dreigementen en de listigheid van zijn vrouw, gelukt is. Anders, zeven dagen, verstaande daardoor een deel van de zeven dagen."},{"catchword":"Overreed uw man,","tekst":"Leid, lok hem, met beweeglijke woorden en manieren van doen; dit betekent eigenlijk het Hebreeuwse woord."},{"catchword":"het onze te bezitten;","tekst":"Hebreeuws, om ons te erven, of erfelijk te bezitten. Ons, dat is, ons goed, omdat zij boven de schande de schade zouden hebben van het lijnwaad en de klederen."},{"catchword":"is het zo niet?","tekst":"Anders, of niet?"}],"16":[{"catchword":"Gij haat mij maar,","tekst":"Of, immers haat gij mij."},{"catchword":"kinderen mijns volks","tekst":"Simsons Filistijnse metgezellen; alzo in vs.17."}],"17":[{"catchword":"zevenden der dagen","tekst":"Hebreeuws, zeven, dat is hier, den zevende, gelijk 1Ch 9:25, en zo elders dikwijls."}],"18":[{"catchword":"mijn kalf niet hadt geploegd,","tekst":"Hij wil zeggen: Hadt gij niet door mijn vrouw van mijzelven de verklaring getrokken. Het is een verbloemde manier van spreken, genomen van het ploegen der landlieden, die door den dienst der beesten de aarde als opgraven en opwerpen, opdat ontdekt worde wat verborgen was. Alzo heeft hun Simson tegelijk de ontrouw zijner vrouw en hunlieder bedrog aardiglijk verweten."}],"19":[{"catchword":"vaardig over hem,","tekst":"Vergelijk boven, vs.6."},{"catchword":"Askelonieten,","tekst":"Hebreeuws, Askelon; dat is, die van Askelon, gelijk boven, Jdg 1:27, enz. gelegen aan de grenzen van Dan, over de beek Sorek, aan de Middellandse zee; toebehorende aan de stammen van Juda en Simeon, maar door de Filistijnen bewoond. Zie boven, Jdg 1:18."},{"catchword":"gewaad,","tekst":"Wat zij hadden aangehad, en hij hun afgetogen had."},{"catchword":"wisselklederen aan degenen,","tekst":"Zie boven, vs.12."},{"catchword":"vaders huis","tekst":"Verlatende voor een tijd zijn vrouw. Zie Jdg 15:1."}],"20":[{"catchword":"werd","tekst":"Hebreeuws, werd zijn metgezel; te weten, ter vrouw."},{"catchword":"zijns metgezels,","tekst":"Zie Jdg 15:2, Jdg 15:6."},{"catchword":"hem vergezelschapt had","tekst":"Zie boven, vs.11."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Simson went down to Thimnath: [lying in the west of Zora, not far from the mid-land sea] and having seen a woman at Thimnath, of the daughters of the Philistines;"}],"2":[{"catchword":null,"tekst":"Then he went up, and told it his father and his mother, and said, I have seen a woman at Thimnath, of the daughters of the Philistines: now then, take her for me to wife. [See concerning the right of parents in the marriages of their children, Genesis.21. and 24. On v.3. and 26. On v.34.]"}],"3":[{"catchword":null,"tekst":"But his father said unto him, together with his mother, is there never a woman among the daughters of thy brethren, [i.e. Kindred, or countrymen: see Genesis.13. on v.8. and 24. On v.27.] And among all the people, that thou goest thy ways to take a woman of the Philistines, those uncircumcised (one)? [See Genesis.34.14. with these heathenish inhabitants of Canaan had God forbidden to make any league or marriage: see Exodus.34.12,16. And elsewhere. Wherefore they had cause to heed the revealed command of God, and to reprove Simson, for as much as they were ignorant of the secret providence and purpose of God, (see the following verse) who hath not onely right and power to impose laws upon his creatures, but even to do according to his own good pleasures, but even to do according to his own good pleasure, and to permit something contratry exaordinarily to be done. Compare Genesis.22.2. Exodus.3.22, etc.] Take the same for me, [see Genesis.19. on v.14.] for she is pleasing [Hebrew. Right] in mine eyes."}],"4":[{"catchword":null,"tekst":"Now his father and his mother knew not that this was of the LORD: [Who hereby intended to give Simson the occasion and opportunity to fulfil his calling and function] that he [viz. Simson: for though he was called to it of God, yet might he so seek to that which without it was good and right, that men could not justly blame him for it] sought occasion of the Philistines: [that they of their side might give occasion to begin against them] for the Philistines at that time had dominion over Israel. [See above chap.13.4.]"}],"5":[{"catchword":null,"tekst":"So Simson went down with his father and his mother to Timnath [being now changed because they imagined and suspected by all that happened before his conception and birth that this must needs be of God and because Simson had covered unto them his purpose and the divine instigation ] when they came unto the vineyard of Thimnath behold there met him a young lion roaring [Heb. a young of lions roaring his meeting it seemeth that he was gone down some other way from his parents compare below verse 8.]"}],"6":[{"catchword":null,"tekst":"Then was the spirit of the Lord ready upon him [or fell or came mightily upon him making him extraordinary courageous and strong to fit and qualify him by this proof or experiment for the execution of his office and calling and therein to confirm and strengthen him and also to administer matter unto him for riddle and that which followed thereupon ] that he rent [viz. the lion ] in twain as he should rent a kid in twain and there was nothing [ no instrument or weapon only using his hands ] in his hands but he told no of his father and his mother he had done."}],"7":[{"catchword":null,"tekst":"And he came down and he spake unto the woman [both himself and his parents] and she was pleasing in Simsons eyes [Heb. she was right in Simsons eyes.]"}],"8":[{"catchword":null,"tekst":"After some days [Heb. from or after days see Genesis 4. On verse 3] came he again to take her [that is to marry her] then turned he aside [viz. from the common rod towards the place where he cast the slain and rent lion see on verse 5] to see the carcass of the lion and behold the swarm of bees was in the body was of the lion with honey."}],"9":[{"catchword":null,"tekst":"And he took the same [viz. the honey ] in his hands and went on going and eating and he went unto his father and unto his mother an gave them thereof and they did eat bathe told them not tha const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
