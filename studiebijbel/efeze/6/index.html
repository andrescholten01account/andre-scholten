l":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"U kinderen, wees uw ouders gehoorzaam in de Heere; want dat is recht.","2":"Eer uw vader en moeder (dat is het eerste gebod met een belofte),","3":"opdat het u goed gaat, en u lang leeft op de aarde.","4":"En u vaders, verwek uw kinderen niet tot toorn, maar voed hen op in de lering en vermaning van de Heere.","5":"U dienstknechten, wees gehoorzaam aan uw heren naar het vlees, met vrees en beven, in eenvoud van uw hart, zoals aan Christus;","6":"niet uit ogendienst, als mensenbehagers, maar als dienstknechten van Christus, terwijl u de wil van God doet van harte;","7":"terwijl u dient met goedwilligheid de Heere, en niet de mensen;","8":"wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.","9":"En u heren, doe hetzelfde bij hen, en laat het dreigen achterwege; als iemand die weet dat ook uw eigen Heere in de hemelen is, en dat er geen aanneming van het persoon bij Hem is.","10":"Vervolgens, mijn broeders, word krachtig in de Heere, en in de sterkte van Zijn macht.","11":"Doe de hele wapenrusting van God aan, opdat u kunt staan tegen de listige omleidingen van de duivel.","12":"Want wij hebben de strijd niet tegen vlees en bloed, maar tegen de overheden, tegen de machten, tegen de geweldhebbers van de wereld, van de duisternis van deze eeuw, tegen de geestelijke boosheden in de lucht.","13":"Daarom, neem de hele wapenrusting van God aan, opdat u kunt weerstaan in de boze dag, en na alles verricht te hebben, staande blijven.","14":"Sta dan, met uw lenden omgord met de waarheid, en aangedaan met het borstwapen van de gerechtigheid;","15":"en de voeten geschoeid met bereidheid van het Evangelie van de vrede;","16":"bovenal aangenomen hebbende het schild van het geloof, waarmee u al de vurige pijlen van de boze zult kunnen uitblussen.","17":"En neem de helm van de zaligheid, en het zwaard van de Geest, dat is het Woord van God.","18":"Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;","19":"en voor mij, opdat mij het Woord gegeven wordt bij het openen van mijn mond, met vrijmoedigheid, om de verborgenheid van het Evangelie bekend te maken;","20":"waarvoor ik een gezant ben in een keten, opdat ik daarin vrijmoedig mag spreken, zoals het mij past te spreken.","21":"En opdat ook u mag weten hoe het met mij gaat; en wat ik doe, dat alles zal Tychikus u bekendmaken, de geliefde broeder en trouwe dienaar in de Heere;","22":"die ik met datzelfde doel naar u toe gezonden heb, opdat u onze zaken zou weten, en hij uw hart zou vertroosten.","23":"Vrede zij de broeders, en liefde met geloof, van God de Vader, en de Heere Jezus Christus.","24":"De genade zij met allen die onze Heere Jezus Christus liefhebben in onvergankelijkheid. Amen. Vanuit Rome aan de Efeziërs geschreven, door bemiddeling van Tychikus."},"SV":{"1":"Gij kinderen, zijt uw ouderen gehoorzaam in den Heere; want dat is recht.","2":"Eert uw vader en moeder ( hetwelk het eerste gebod is met een belofte),","3":"Opdat het u welga, en *dat* gij lang leeft op de aarde.","4":"En gij vaders, verwekt uw kinderen niet tot toorn, maar voedt hen op in de lering en vermaning des Heeren.","5":"Gij dienstknechten, zijt gehoorzaam *uw* heren naar het vlees, met vreze en beven, in eenvoudigheid uws harten, gelijk als aan Christus;","6":"Niet naar ogendienst, als mensenbehagers, maar als dienstknechten van Christus, doende den wil van God van harte;","7":"Dienende met goedwilligheid den Heere, en niet de mensen;","8":"Wetende, dat zo wat goed een iegelijk gedaan zal hebben, hij datzelve van den Heere zal ontvangen, hetzij dienstknecht, hetzij vrije.","9":"En gij heren, doet hetzelfde bij hen, nalatende de dreiging; als die weet, dat ook uw eigen Heere in de hemelen is, en *dat* geen aanneming des persoons bij Hem is.","10":"Voorts, mijn broeders, wordt krachtig in den Heere, en in de sterkte Zijner macht.","11":"Doet aan de gehele wapenrusting Gods, opdat gij kunt staan tegen de listige omleidingen des duivels.","12":"Want wij hebben den strijd niet tegen vlees en bloed, maar tegen de overheden, tegen de machten, tegen de geweldhebbers der wereld, der duisternis dezer eeuw, tegen de geestelijke boosheden in de lucht.","13":"Daarom neemt aan de gehele wapenrusting Gods, opdat gij kunt wederstaan in den bozen dag, en alles verricht hebbende, staande blijven.","14":"Staat dan, uw lenden omgord hebbende met de waarheid, en aangedaan hebbende het borstwapen der gerechtigheid;","15":"En de voeten geschoeid hebbende met bereidheid van het Evangelie des vredes;","16":"Bovenal aangenomen hebbende het schild des geloofs, met hetwelk gij al de vurige pijlen des bozen zult kunnen uitblussen.","17":"En neemt den helm der zaligheid, en het zwaard des Geestes, hetwelk is Gods Woord.","18":"Met alle bidding en smeking, biddende te allen tijd in den Geest, en tot hetzelve wakende met alle gedurigheid en smeking voor al de heiligen;","19":"En voor mij, opdat mij het Woord gegeven worde in de opening mijns monds met vrijmoedigheid, om de verborgenheid van het Evangelie bekend te maken;","20":"Waarover ik een gezant ben in een keten, opdat ik in hetzelve vrijmoediglijk moge spreken, gelijk mij betaamt te spreken.","21":"En opdat ook gij moogt weten hetgeen mij aangaat; *en* wat ik doe, *dat* alles zal u Tychikus, de geliefde broeder en getrouwe dienaar in den Heere, bekend maken;","22":"Denwelken ik tot datzelfde einde tot u gezonden heb, opdat gij onze zaken zoudt weten, en hij uw harten zou vertroosten.","23":"Vrede zij den broederen, en liefde met geloof, van God den Vader, en den Heere Jezus Christus.","24":"De genade *zij* met al degenen, die onzen Heere Jezus Christus liefhebben in onverderfelijkheid. Amen. Vanuit Rome aan de Efeziers geschreven, door bemiddeling van Tychikus."},"KJV":{"1":"Children, obey your parents in the Lord: for this is right.","2":"Honour thy father and mother; (which is the first commandment with promise;)","3":"That it may be well with thee, and thou mayest live long on the earth.","4":"And, ye fathers, provoke not your children to wrath: but bring them up in the nurture and admonition of the Lord.","5":"Servants, be obedient to them that are *your* masters according to the flesh, with fear and trembling, in singleness of your heart, as unto Christ;","6":"Not with eyeservice, as menpleasers; but as the servants of Christ, doing the will of God from the heart;","7":"With good will doing service, as to the Lord, and not to men:","8":"Knowing that whatsoever good thing any man doeth, the same shall he receive of the Lord, whether *he be* bond or free.","9":"And, ye masters, do the same things unto them, forbearing threatening: knowing that your Master also is in heaven; neither is there respect of persons with him.","10":"Finally, my brethren, be strong in the Lord, and in the power of his might.","11":"Put on the whole armour of God, that ye may be able to stand against the wiles of the devil.","12":"For we wrestle not against flesh and blood, but against principalities, against powers, against the rulers of the darkness of this world, against spiritual wickedness in high","13":"Wherefore take unto you the whole armour of God, that ye may be able to withstand in the evil day, and having done all, to stand.","14":"Stand therefore, having your loins girt about with truth, and having on the breastplate of righteousness;","15":"And your feet shod with the preparation of the gospel of peace;","16":"Above all, taking the shield of faith, wherewith ye shall be able to quench all the fiery darts of the wicked.","17":"And take the helmet of salvation, and the sword of the Spirit, which is the word of God:","18":"Praying always with all prayer and supplication in the Spirit, and watching thereunto with all perseverance and supplication for all saints;","19":"And for me, that utterance may be given unto me, that I may open my mouth boldly, to make known the mystery of the gospel,","20":"For which I am an ambassador in bonds: that therein I may speak boldly, as I ought to speak.","21":"But that ye also may know my affairs, *and* how I do, Tychicus, a beloved brother and faithful minister in the Lord, shall make known to you all things:","22":"Whom I have sent unto you for the same purpose, that ye might know our affairs, and *that* he might comfort your hearts.","23":"Peace *be* to the brethren, and love with faith, from God the Father and the Lord Jesus Christ.","24":"Grace *be* with all them that love our Lord Jesus Christ in sincerity. Amen."}},"tsk":{"1":[{"kopje":"gehoorzaam","refs":["Gen 28:7","Gen 37:13","Lev 19:3","Deut 21:18","1 Sam 17:20","Est 2:20","Spr 1:8","Spr 6:20","Spr 23:22","Spr 30:11","Spr 30:17","Jer 35:14","Luk 2:51","Kol 3:20-25"]},{"kopje":"in","refs":["Ef 6:5","Ef 6:6","Rom 16:2","1 Kor 15:58","Kol 3:16","Kol 3:17","Kol 3:23","Kol 3:24","1 Petr 2:13"]},{"kopje":"want","refs":["Neh 9:13","Job 33:27","Ps 19:9","Ps 119:75","Ps 119:128","Hos 14:10","Rom 7:12","Rom 12:2","1 Tim 5:4"]}],"4":[{"kopje":"u","refs":["Gen 31:14","Gen 31:15","1 Sam 20:30-34","Kol 3:21"]},{"kopje":"maar","refs":["Gen 18:19","Ex 12:26","Ex 12:27","Ex 13 \"wl wl-kjv\" data-code=\"G80\">brother</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4103\">faithful</span> <span class=\"wl wl-kjv\" data-code=\"G1249\">minister</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord,</span> shall make <span class=\"wl wl-kjv\" data-code=\"G1107\">known</span> to <span class=\"wl wl-kjv\" data-code=\"G5213\">you</span> all things:","22":"<span class=\"wl wl-kjv\" data-code=\"G3739\">Whom</span> I have <span class=\"wl wl-kjv\" data-code=\"G3992\">sent</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">for</span> the <span class=\"wl wl-kjv\" data-code=\"G846\">same</span> <span class=\"wl wl-kjv\" data-code=\"G5124\">purpose,</span> <span class=\"wl wl-kjv\" data-code=\"G2443\">that</span> ye might <span class=\"wl wl-kjv\" data-code=\"G1097\">know</span> <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> <span class=\"wl wl-kjv\" data-code=\"G4012\">affairs,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> that he might <span class=\"wl wl-kjv\" data-code=\"G3870\">comfort</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">your</span> hearts.","23":"<span class=\"wl wl-kjv\" data-code=\"G1515\">Peace</span> be to the <span class=\"wl wl-kjv\" data-code=\"G80\">brethren,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G26\">love</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> <span class=\"wl wl-kjv\" data-code=\"G4102\">faith,</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> the <span class=\"wl wl-kjv\" data-code=\"G3962\">Father</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> Christ.","24":"<span class=\"wl wl-kjv\" data-code=\"G5485\">Grace</span> be <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> them that <span class=\"wl wl-kjv\" data-code=\"G25\">love</span> <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G861\">sincerity.</span> Amen."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in den Heere;","tekst":"Gelijk hfdst.5:21, in de vreze Gods, dat is, in alles dat tegen den Heere, of Zijn bevel en vrees niet strijdt; zie Luk 14:26."}],"2":[{"catchword":"met een belofte),","tekst":"Grieks, in belofte; dat is, met een bijzondere belofte van een lang leven en voorspoed. Want anders heeft het tweede gebod ook een algemene belofte van Gods barmhartigheid over vele duizenden."}],"3":[{"catchword":"op de aarde","tekst":"Hetgeen het vijfde gebod zegt: in het land, dat de Heere u zal geven, ziende op het land Kanaän, dat zegt Paulus in het algemeen op de aarde, omdat de Heere onder het Nieuwe Testament alle landen der ganse aarde nu heeft geheiligd, en Zijn zegen beloofd aan degenen, die Hem gehoorzamen, in welk land zij ook zijn. Want de godzaligheid heeft de beloften des tegenwoordigen en des toekomenden levens, 1Ti 4:8."}],"4":[{"catchword":"tot toorn,","tekst":"Dat is, door te grote hardheid tot zulk een toorn, waaruit mismoedigheid zou rijzen, of een weerzin der kinderen tegen de ouders; anders gebiedt God ook somwijlen behoorlijke strengheid te gebruiken tegen de grote gebreken der kinderen. Zie Pro 13:24, en Pro 19:18, en Pro 23:13, enz."},{"catchword":"de lering","tekst":"Of, tuchtiging, gelijk dit woord ook betekent. Zie Heb 12:7."},{"catchword":"vermaning","tekst":"Of, onderwijzing, die tot de vreze des Heeren kan leiden, of uit het woord des Heeren is aangenomen."}],"5":[{"catchword":"naar het vlees,","tekst":"Dat is, naar het lichaam, of naar den uiterlijken stand des mensen. Want over de conscientie en in het geestelijke is God alleen een Heere."},{"catchword":"met vreze","tekst":"Dat is, met eerbieding."},{"catchword":"en beven,","tekst":"Dat is, zorgvuldigheid van hen niet te vertoornen. Want een slaafse vrees, die alleen uit bedenking van een bereide straf voortkomt, prijst de apostel in de Christenen niet, gelijk de volgende woorden verklaren. Zie Rom 13:5."},{"catchword":"gelijk als","tekst":"Namelijk onzer aller Heere. Zie Eph 5:22."}],"6":[{"catchword":"naar ogendienst,","tekst":"Dat is, om in de tegenwoordigheid en voor de ogen der heren hen alleen wel te dienen, gelijk sommige dienstknechten plegen, die zij achter hun rug dikmaals bespotten en bestelen."},{"catchword":"den wil","tekst":"Namelijk van trouwelijk en oprechtelijk te dienen. Want dat is Gods wil aangaande de dienstknechten. Grieks, doende den wil Gods uit de ziel."}],"7":[{"catchword":"den Heere,","tekst":"Namelijk Christus Jezus, in dezen uwen dienst, als die dezen u in dit beroep opgelegd heeft. Zie Joh 14:14."},{"catchword":"niet de mensen;","tekst":"Namelijk alleen of voornamelijk."}],"8":[{"catchword":"datzelve van den Heere","tekst":"Dat is, het loon van datzelve. Hij spreekt hier van loon uit genade, gelijk Paulus daarom dit loon der dienstknechten, die God zal geven dengenen, die getrouwelijk zullen gediend hebben, noemt ene vergelding der erfenis; Col 3:24."},{"catchword":"zal ontvangen,","tekst":"Of, zal behalen, wegdragen; namelijk in het uiterste oordeel. Zie 2Co 5:10."}],"9":[{"catchword":"doet hetzelfde","tekst":"Namelijk dat goed is en van den Heere beloond wordt, gelijk hij in het voorgaande vs. van de dienstknechten heeft gesproken. Want hij gebiedt den heren niet hunnen dienstknechten te gehoorzamen of te dienen, maar hen in alle billijkheid en zachtmoedigheid te gebieden en regeren, gelijk de volgende woorden verklaren."},{"catchword":"aanneming","tekst":"Dat is, de Heere zal den uiterlijken staat des mensen niet aanzien in zijn oordeel, namelijk of iemand heer of knecht, edel of onedel, rijk of arm is, maar of hij Zijne geboden, elk in zijn beroep, heeft gehoorzaamd. Zie Rom 2:11."}],"10":[{"catchword":"wordt krachtig","tekst":"Dat is, weest dagelijks meer en meer, door de kracht des Heeren, tegen uwe vijanden versterkt. Waartoe de middelen van vs.13 voorts worden voorgesteld."}],"11":[{"catchword":"listige","tekst":"Dat is, bedriegelijke verleidingen. Zie Eph 4:14."}],"12":[{"catchword":"niet tegen","tekst":"Namelijk alleen, of voornamelijk. Want ook de wereld en ons eigen vlees leveren ons gedurigen strijd; maar onze voornaamste vijand, die ook de wereld en ons vlees daartoe gebruikt, is de Satan. Zie 1Pe 5:8."},{"catchword":"vlees en bloed,","tekst":"Dat is, zwakke mensen, gelijk wij ook zelf zijn. Zie Mat 16:17; Gal 1:16."},{"catchword":"overheden,","tekst":"De apostel geeft hier den Satan en zijnen engelen deze titels, niet omdat zij van God tot rechte oversten en regeerders der wereld gesteld zijn, gelijk God den dienst der goede engelen dikwijls gebruikt, Eph 1:21, en Eph 3:10, maar omdat zij hunne macht, die de goede engelen van God hebben, en dezen door hunnen val verloren hebben, nochtans als tyrannen met list en geweld over de verdorven en boze wereld nog gebruiken; en dat door een rechtvaardig oordeel Gods hun hetzelve, tot straf der kwaden en een oefening der goeden, voor enen tijd wordt toegelaten. Zie 2Co 4:4; 2Th 2:9-10. Zie ook de aantekeningen Eph 2:2."},{"catchword":"der duisternis","tekst":"Zo wordt het rijk des Satans genaamd, omdat hij door onkennis of onwetendheid van God en Zijn woord de mensen tot allerlei zonden en boosheden brengt. Zie Act 26:18; Col 1:13."},{"catchword":"de geestelijke boosheden","tekst":"Grieks, de geestelijke der boosheid; dat is, geesten, die tot alle boosheid zijn genegen, en de mensen daartoe ook zoeken te brengen."},{"catchword":"in de lucht","tekst":"Grieks, in de hemelse, of, overhemelse plaatsen; en wordt dit woord hier anders verstaan dan in de andere plaatsen van dezen brief, omdat de lucht somwijlen hemel wordt genaamd, Lev 26:19; Mat 6:26, en de apostel noemt hier voor, hfdst. 2:2, den Satan uitdrukkelijk den overste der macht van de lucht; want dat de Satan gene plaats noch macht meer heeft in den rechten hemel, blijkt uit 2Pe 2:4; Jud 1:6; Rev 12:8, enz."}],"13":[{"catchword":"de gehele","tekst":"Of, de gehele wapening; namelijk waarmede ons God in Zijn woord wapent tegen alle aanvallen des Satans."},{"catchword":"den bozen dag,","tekst":"Dat is, de tijd der verzoeking, gelijk Christus spreekt Luk 8:13; want hoewel wij altijd op onze hoede moeten zijn, zijn er nochtans enige tijden en gelegenheden, in welke ons de Satan allermeest zoekt te bestrijden, om ons tot den val te brengen."},{"catchword":"verricht hebbende,","tekst":"Of, uitgewrocht hebbende; namelijk hetgeen ons in dezen strijd te doen staat tot overwinning dezer vijanden, hetwelk daarna wordt beschreven."}],"14":[{"catchword":"Staat dan,","tekst":"Namelijk als goede krijgslieden, wakker, en elk in zijne orde, zonder in het minste toe te geven, of te wijken. Zie 1Pe 5:9."},{"catchword":"omgord hebbende","tekst":"De krijgsgordels waren eertijds breed en sterk, van sterke stof gemaakt, en met ijzeren of koperen plaatjes beslagen, waardoor de zwakste partijen des lichaams, dat is, de lenden en opperbuik werden gegord, gestijfd, en beschermd."},{"catchword":"de waarheid,","tekst":"Sommigen verstaan hierdoor oprechtheid gesteld tegen geveinsdheid; anderen, de waarheid der leer, gesteld tegen alle dwalingen en ketterijen. Zie 1Ti 1:18-19."},{"catchword":"der gerechtigheid;","tekst":"Dat is, godzaligheid des levens, en een goede conscientie, gelijk Paulus tot Timotheüs ook spreekt in de aangehaalde plaats."}],"15":[{"catchword":"de voeten geschoeid","tekst":"Waardoor ook de schenen, of benen tot de knieën toe worden verstaan, die de ouden in den krijg tezamen met laarsjes en scheendekselen wapenden, niet alleen tegen de ongemakken des weders, maar ook om een pijl of slag te wederstaan."},{"catchword":"bereidheid","tekst":"Dat is, met altijd bereid te zijn om het geloof te belijden en rekenschap te geven van de hope die in u is, Rom 10:10; 1Pe 3:15, want de schaamachtigen, of vreesachtigen in dit stuk, pleegt de satan lichtelijk tot zware zonden te brengen."},{"catchword":"des vredes;","tekst":"Dat is, waardoor ons de vrede met God wordt verkondigd; Rom 10:15."}],"16":[{"catchword":"het schild","tekst":"Dat is, van het ware vertrouwen op God door Christus. Want hierdoor worden al de onvolmaaktheden der voorgaande wapenen gedekt, en wij tegen alle aanvallen des satans beschermd; Psa 91:1, enz.; 1Pe 5:9, enz."},{"catchword":"de vurige","tekst":"Sommigen verstaan dit van venijnige pijlen, die door hun venijn het lichaam en de kwetsuur ontsteken als met een brand, gelijk er eertijds in den krijg vele plachten gebruikt te worden; andere van pijlen, die met de punten in het vuur gelegd werden, om te harder te zijn en meer te schaden; of ook om den brand ergens in te schieten. Dit alles komt met de natuur van de verzoekingen des satans overeen, die als een venijn en vuur de ziel kwetsen en doordringen, zo zij niet intijds gestuit en geblust worden."},{"catchword":"uitblussen","tekst":"Dat is, niet alleen af te weren, maar ook al hun venijnige kracht van beschadigen te benemen."}],"17":[{"catchword":"der zaligheid,","tekst":"Dat is, van de hoop der zaligheid, gelijk Paulus daarbij voegt, 1Th 5:8, waardoor wij bewogen worden om alle vergankelijke dingen te verachten; Rom 8:18, Rom 8:24."},{"catchword":"des Geestes,","tekst":"Dat is, des Heiligen Geestes, hetwelk Hij ons gelijk als in de hand geeft, om den Satan op alle voorgestelde verzoekingen te wederstaan. Zie Heb 4:12, en het exempel van Christus tegen den Satan; Mat 4:1, enz."}],"18":[{"catchword":"bidding","tekst":"Sommigen onderscheiden dit alzo, dat door het woord bidding verstaan wordt een afbidden van het kwaad, of der verzoeking; en door het woord smeking verstaan wordt een ernstig gebed om Gods hulp en genade, ten einde, zo het God immers belieft ons daarin te laten vallen, wij in de verzoeking kunnen bestaan, en een goede uitkomst mogen verkrijgen, 1Co 10:13. Zie van dit onderscheid ook 1Ti 2:1."},{"catchword":"in den Geest,","tekst":"Dat is, met ernst en van harte, gelijk Joh 4:24. Of, door den Geest, dat is, de Heilige Geest; Rom 8:26-27."},{"catchword":"voor al de heiligen;","tekst":"Dat is, gelovigen, die in deze wereld ook in dergelijken strijd zijn."}],"19":[{"catchword":"het Woord","tekst":"Dat is, de bekwaamheid om het Woord Gods te spreken met standvastigheid en vrijmoedigheid; een Hebreeuwse wijze van spreken, gelijk het volgende vs. verklaart."}],"20":[{"catchword":"een gezant ben","tekst":"Namelijk van Gods en Christus' wege. Zie 2Co 5:19, enz."},{"catchword":"in een keten,","tekst":"Van deze wijze van gevangenis, zie de aantekeningen op Act 28:16."}],"21":[{"catchword":"hetgeen mij","tekst":"Of, mijne zaken, dat is, hoe mijne zaken hier te Rome in mijne gevangenis staan, hetwelk Lukas, Hand. 28, in het kort verhaalt van Act 28:16 tot Act 28:31."},{"catchword":"Tychicus,","tekst":"Deze Tychicus heeft Paulus overal vergezelschapt in zijne reizen door Azië, gelijk te zien is Act 20:4, en heeft hem in zijne gevangenis te Rome niet verlaten, welken Paulus ook heeft gebruikt om naar Efeze en andere kerken in Azië te zenden, tot versterking derzelve. Zie van hem ook Col 4:7; Tit 3:12."}],"22":[{"catchword":"uw harten","tekst":"Namelijk niet alleen door andere redenen uit Gods Woord als een dienaar van Christus, maar ook door het bericht, dat hij u doen zal van de vrijheid, die mij in mijne banden van den keizer wordt gegeven."}],"23":[{"catchword":"Vrede zij den","tekst":"Hierdoor wordt, naar de wijze van spreken der Hebreën, allerlei gelukzaligheid naar ziel en lichaam verstaan."},{"catchword":"liefde met geloof,","tekst":"Dat is, toestemming of vermeerdering in de liefde met geloof. Want hij schrijft tot degenen, die alrede geloofden, Eph 1:1."}],"24":[{"catchword":"in onverderfelijkheid","tekst":"Dat is, tot verkrijging van de onverderfelijkheid en onverwelkelijke erve in den hemel, gelijk Petrus spreekt 1Pe 1:4. Anderen verstaan door dit woord onverderfelijkheid de oprechtheid der liefde, waarvan hij hier spreekt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Ye children be obedient to your parents in the Lord [as chapter 5.21 in the fear of God tat is all that is contrary to the Lord or his command and fear Luke see Luk 14:26] for that is just."}],"2":[{"catchword":null,"tekst":"Honor thy father and mother which is the first commandment with a special promise [Gr in promise that is with a special promise of long life prosperity for otherwise the second commandment hath also a general promised annexed of God mercy towards many thousands.]"}],"3":[{"catchword":null,"tekst":"That is may go well with thee and that thou mayest live long on the earth [where the fifth commandment saith in the land which the Lord shall give thee having respect the land in the Canaan there Paul saith in general on the earth because the Lord under the new testament hath now hallowed all the lands of the whole earth and promiseth his blessing to them that obey him in what land so ever they be for godliness hath the promise for both of the present life and of that to come 1 Timothy 4.8.]"}],"4":[{"catchword":null,"tekst":"and ye fathers stir not up your children to wrath [that is by too much harshness to such wrath as may cause diffidence and obstinacy in the children against their parents otherwise God also sometimes commands to use due severity against the great faults of children see Prov 13:24 and 19.18 and 23.13 /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
