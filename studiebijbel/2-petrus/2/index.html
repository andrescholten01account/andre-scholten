el","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen;","2":"En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden.","3":"En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.","4":"Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden;","5":"en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;","6":"en de steden Sodom en Gomorra tot as heeft laten verbranden en met een omkering veroordeeld heeft, en tot een voorbeeld gesteld heeft voor hen die goddeloos zouden leven;","7":"en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft;","8":"(want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden);","9":"dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;","10":"maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren;","11":"terwijl de engelen, die in sterkte en kracht groter zijn, geen lasterlijk oordeel tegen hen uitspreken voor de Heere.","12":"Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden;","13":"en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn;","14":"zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;","15":"zij hebben de rechte weg verlaten en zijn verdwaald, en volgen de weg van Bileam, de zoon van Bosor, die het loon van de onrechtvaardigheid heeft liefgehad;","16":"maar hij kreeg een terechtwijzing voor zijn onrechtvaardigheid; want het jukdragende, stomme dier sprak met mensenstem en verhinderde de dwaasheid van de profeet.","17":"Dezen zijn waterloze bronnen, wolken die door een storm worden voortgedreven; voor hen is de donkerheid van de duisternis voor eeuwig bewaard.","18":"Want zij spreken zeer opgeblazen, holle woorden, en verleiden door de begeerten van het vlees en door losbandigheid hen die net ontkomen waren aan degenen die in dwaling wandelen;","19":"zij beloven hun vrijheid, terwijl zijzelf slaven zijn van de verdorvenheid; want door wie iemand overwonnen is, daarvan is hij ook tot een slaaf gemaakt.","20":"Want als zij, nadat zij door de kennis van de Heere en Zaligmaker Jezus Christus aan de besmettingen van de wereld ontkomen zijn, daar opnieuw in verstrikt raken en erdoor overwonnen worden, dan is voor hen het laatste erger geworden dan het eerste.","21":"Want het zou beter voor hen geweest zijn de weg van de gerechtigheid niet gekend te hebben, dan die gekend te hebben en zich weer af te keren van het heilige gebod dat hun overgeleverd was.","22":"Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen."},"SV":{"1":"En er zijn ook valse profeten onder het volk geweest, gelijk ook onder u valse leraars zijn zullen, die verderfelijke ketterijen bedektelijk invoeren zullen, ook den Heere, Die hen gekocht heeft, verloochenende, *en* een haastig verderf over zichzelven brengende;","2":"En velen zullen hun verderfenissen navolgen, door welke de weg der waarheid zal gelasterd worden.","3":"En zij zullen door gierigheid, met gemaakte woorden, van u een koopmanschap maken; over welke het oordeel van over lang niet ledig is, en hun verderf sluimert niet.","4":"Want indien God de engelen, die gezondigd hebben, niet gespaard heeft, maar, die in de hel geworpen hebbende, overgegeven heeft aan de ketenen der duisternis, om tot het oordeel bewaard te worden;","5":"En de oude wereld niet heeft gespaard, maar Noach, den prediker der gerechtigheid, zijn achttal bewaard heeft, als Hij den zondvloed over de wereld der goddelozen heeft gebracht;","6":"En de steden van Sodoma en Gomorra tot as verbrandende met omkering veroordeeld heeft, en tot een voorbeeld gezet dengenen, die goddelooslijk zouden leven;","7":"En den rechtvaardigen Lot, die vermoeid was van den ontuchtigen wandel der gruwelijke mensen, *daaruit* verlost heeft;","8":"( Want deze rechtvaardige *man*, wonende onder hen, heeft dag op dag *zijn* rechtvaardige ziel gekweld, door het zien en horen van *hun* ongerechtige werken);","9":"Zo weet de Heere de godzaligen uit de verzoeking te verlossen, en de onrechtvaardigen te bewaren tot den dag des oordeels, om gestraft te worden;","10":"Maar allermeest degenen, die naar het vlees in onreine begeerlijkheid wandelen, en de heerschappij verachten; die stout zijn, zichzelven behagen, en die de heerlijkheden niet schromen te lasteren;","11":"Daar de engelen in sterkte en kracht meerder zijnde, geen lasterlijk oordeel tegen hen voor den Heere voortbrengen.","12":"Maar deze, als onredelijke dieren, die de natuur volgen, en voortgebracht zijn om gevangen en gedood te worden, dewijl zij lasteren, hetgeen zij niet verstaan, zullen in hun verdorvenheid verdorven worden;","13":"En zullen verkrijgen het loon der ongerechtigheid, als die de dagelijkse weelde *hun* vermaak achten, zijnde vlekken en smetten, en zijn weelderig in hun bedriegerijen, als zij in de maaltijden met u zijn;","14":"Hebbende de ogen vol overspel, en die niet ophouden van zondigen; verlokkende de onvaste zielen, hebbende het hart geoefend in gierigheid, kinderen der vervloeking;","15":"Die den rechten weg verlaten hebbende, zijn verdwaald, en volgen den weg van Balaäm, den *zoon* van Bosor, die het loon der ongerechtigheid liefgehad heeft;","16":"Maar hij heeft de bestraffing zijner ongerechtigheid gehad; *want* het jukdragende stomme *dier*, sprekende met mensenstem, heeft des profeten dwaasheid verhinderd.","17":"Deze zijn waterloze fonteinen, wolken van een draaiwind gedreven, denwelken de donkerheid der duisternis in der eeuwigheid bewaard wordt.","18":"Want zij, zeer opgeblazene ijdelheid sprekende, verlokken, door de begeerlijkheden des vleses *en* door ontuchtigheden, degenen, die waarlijk ontvloden waren van degenen, die in dwaling wandelen;","19":"Belovende hun vrijheid, daar zijzelven dienstknechten zijn der verdorvenheid; want van wien iemand overwonnen is, dien is hij ook tot een dienstknecht gemaakt.","20":"Want indien zij, nadat zij door de kennis van den Heere en Zaligmaker Jezus Christus, de besmettingen der wereld ontvloden zijn, en in dezelve wederom ingewikkeld zijnde, *van* *dezelve* overwonnen worden, zo is hun het laatste erger geworden dan het eerste.","21":"Want het ware hun beter, dat zij den weg der gerechtigheid niet gekend hadden, dan dat zij, *dien* gekend hebbende, *weder* afkeren van het heilige gebod, dat hun overgegeven was.","22":"Maar hun is overkomen, hetgeen met een waar spreekwoord *gezegd* *wordt*: De hond is wedergekeerd tot zijn eigen uitbraaksel; en de gewassen zeug tot de wenteling in het slijk."},"KJV":{"1":"But there were false prophets also among the people, even as there shall be false teachers among you, who privily shall bring in damnable heresies, even denying the Lord that bought them, and bring upon themselves swift destruction.","2":"And many shall follow their pernicious ways; by reason of whom the way of truth shall be evil spoken of.","3":"And through covetousness shall they with feigned words make merchandise of you: whose judgment now of a long time lingereth not, and their damnation slumbereth not.","4":"For if God spared not the angels that sinned, but cast them down to hell, and delivered them into chains of darkness, to be reserved unto judgment;","5":"And spared not the old world, but saved Noah the eighth person, a preacher of righteousness, bringing in the flood upon the world of the ungodly;","6":"And turning ➔ the cities of Sodom and Gomorrha into ashes condemned them with an overthrow, making them an ensample unto those that after should live ungodly;","7":"And delivered just Lot, vexed with the filthy conversation of the wicked:","8":"(For that righteous man dwelling among them, in seeing and hearing, vexed his righteous soul from day to day with their unlawful deeds;)","9":"The Lord knoweth how to deliver the godly out of temptations, and to reserve the unjust unto the day of judgment to be punished:","10":"But chiefly them that walk after the flesh in the lust of uncleanness, and despise government. Presumptuous are they, selfwilled, they are not afraid to speak evil of dignities.","11":"Whereas angels, which are greater in power and might, bring not railing accusation against them before the Lord.","12":"But these, as natural brute beasts, made to be taken and destroyed, speak evil of the things that they understand not; and shall utterly perish in their own corruption;","13":"And shall receive the reward of unrighteousness, as they that count it pleasure to riot in the day time. Spots they are and blemishes, sporting themselves with their own deceivings while they feast with you;","14":"Having eyes full of adultery, and that cannot cease from sin; beguiling unstable souls: an heart they have exercised with covetous practices; cursed children:","15":"Which have forsaken the right way, and are gone astray, following the way of Balaam the son of Bosor, who loved the wages of unrighteousness;","16":"But was rebuked for his iniquity: the dumb ass speaking with man's voice forbad the madness of the prophet.","17":"These are wells without water, clouds that are carried with a tempest; to whom the mist of darkness is reserved for ever.","18":"For when they speak great swelling words of vanity, they allure through the lusts of the flesh, through much wantonness, those that were clean escaped from them who live in error.","19":"While they promise them liberty, they themselves are the servants of corruption: for of whom a man is overcome, of the same is he brought in bondage.","20":"For if after they have escaped the pollutions of the world through the knowledge of the Lord and Saviour Jesus Christ, they are ➔ again entangled therein, and overcome, the latter end is worse with them than the beginning.","21":"For it had been better for them not to have known the way of righteousness, than, after they have known it, to turn from the holy commandment delivered unto them.","22":"But it is happened unto them according to the true proverb, The dog is turned ➔ to his own vomit again; and the sow that was washed to her wallowing in the mire."}},"tsk":{"1":[{"kopje":"zijn geweest","refs":["Deut 13:1-3","1 Kon 18:19-22","1 Kon 22:6","Neh 6:12-14","Jes 9:14","Jes 56:10","Jes 56:11","Jer 14:13-15","Jer 23:16","Jer 23:17","Jer 23:25-32","Jer 27:14","Jer 27:15","Jer 28:15-17","Jer 29:8","Jer 29:9","Jer 29:31","Jer 29:32","Jer 37:19","Klaagl 2:14","Ezech 13:3-18","Hos 9:8","Micha 2:11","Micha 3:5","Micha 3:11","Zach 13:3","Zach 13:4","Matt 7:15","Luk 6:26","Rom 16:18"]},{"kopje":"zelfs","refs":["Matt 24:5","Matt 24:11","Matt 24:24","Mark 13:22","Luk 21:8","Hand 20:29","Hand 20:30","1 Kor 11:19","2 Kor 11:13-15","Gal 4:17","Ef 4:14","Kol 2:8","Kol 2:18","2 Tess 2:3-12","1 Tim 4:1-3","2 Tim 3:1-9","2 Tim 4:3","Tit 1:11","1 Joh 2:18","1 Joh 2:19","1 Joh 2:26","1 Joh 4:1","Judas 1:18","Openb 2:9","Openb 13:14"]},{"kopje":"in het geheim","refs":["2 Petr 2:3","Gal 2:4"]},{"kopje":"verderfelijke","refs":["2 Petr 2:3","Gal 5:20","Tit 3:10"]},{"kopje":"verloochenen","refs":["Matt 10:33","Luk 12:9","Hand 3:13","Hand 3:14","2 Tim 2:12","2 Tim 2:13","Judas 1:4","Openb 2:13","Openb 3:8"]},{"kopje":"gekocht","refs":["Deut 32:6","Hand 20:28","1 Kor 6:20","1 Kor 7:23","Gal 3:13","Ef 1:7","Hebr 10:29","1 Petr 1:8","Openb 5:9"]},{"kopje":"brengen","refs":["2 Petr 2:3","Mal 3:5","Fil 3:19"]}],"2":[{"kopje":"velen","refs":["Matt 24:10-13","Matt 24:24","Mark 13:22","1 Joh 2:18","1 Joh 2:19","Openb 12:9","Openb 13:8","Openb 13:14"]},{"kopje":"verderfelijke wegen","refs":["Rom 2:24","1 Tim 5:14","Tit 2:5","Tit 2:8"]},{"kopje":"wegen","refs":["2 Petr 2:15","2 Petr 2:21","Ps 18:22","Jes 35:8","Jer 6:16","Matt 7:14","Matt 22:16","Mark 12:14","Joh 14:6","Hand 13:10","Hand 16:17","Hand 18:26","Hand 19:9","Hand 24:14"]},{"kopje":"verderfelijke","refs":["2 Petr 2:12","Hand 14:2","1 Petr 2:12","Judas 1:10","Judas 1:15"]}],"3":[{"kopje":"door","refs":["2 Pet re.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"er zijn ook","tekst":"Dat is, gelijk er onder Gods volk oprechte profeten zijn geweest, aan wier schriften wij ons moeten houden, 2Pe 1:19; zo zijn er ook valse geweest, die men mijden moest; Deu 13:1."},{"catchword":"het volk","tekst":"Namelijk Gods, of het Joodse volk."},{"catchword":"onder u","tekst":"Namelijk de christenen. Zodat de staat der gemeente dit aangaande niet gelukkiger zal zijn in het Nieuwe Testament dan ze geweest is in het Oude."},{"catchword":"verderfelijke","tekst":"Grieks ketterijen des verderfs, Heb-"},{"catchword":"ketterijen","tekst":"Van dit woord, zie de aantekeningen op Act 5:17. En uit het volgende blijkt, dat hij hier spreekt van ketterijen, die niet alleen het geloof, maar ook de leer des christelijken levens aangaan."},{"catchword":"bedekt","tekst":"Of van bezijden, of, daarenboven; namelijk boven en tegen de gezonde leer."},{"catchword":"invoeren zullen, ook","tekst":"Namelijk in de gemeente of onder de christenen."},{"catchword":"den Heere,","tekst":"Grieks despoten; van welk woord zie Act 4:24; Jud 1:4."},{"catchword":"Die hen gekocht heeft,","tekst":"Deze worden hier gezegd van den Heere gekocht te zijn, ten aanzien dat zijzich voor zodanigen uitgeven, en van anderen naar de liefde daarvoor gehouden zijn, zolang zij in de gemeenschap der Kerk waren. Zie dergelijke wijze van spreken Joh 15:2; Rev 22:19. Want Christus heeft door Zijn bloed waarlijk en inderdaad alleen Zijn gemeente gekocht; Act 20:28; Eph 5:25. Dat is, alleen de ware gelovigen, die altijd bij Christus blijven, en Hem niet verloochenen. Zie 1Jo 2:19; Rev 14:3-4."},{"catchword":"verloochenende,","tekst":"Namelijk metterdaad, en met hunne valse leer en kwaad leven, hoewel zij met den mond Hem zouden mogen belijden. Zie Tit 1:16; Jud 1:4."}],"2":[{"catchword":"hunne verderfenissen","tekst":"Grieks apoleiais; dat is, verderfelijke leerlingen en verleidingen. Anderen lezen aselgeiais, dat is, hun ontuchtigheden of dartelheden."},{"catchword":"de weg der waarheid","tekst":"Dat is, de ware christelijke leer en godsdienst, die den weg tot de eeuwige zaligheid aanwijst. Zie van deze benaming Act 9:2, en Act 19:9, en Act 22:4."},{"catchword":"gelasterd worden","tekst":"Namelijk zo van henzelf, met de waarheid tegen te spreken en beschuldigen; als door anderen, die uit hun kwade leer en ongoddelijk leven oorzaak zullen nemen, om de christelijke religie te lasteren."}],"3":[{"catchword":"zij zullen","tekst":"Namelijk de valse leraars."},{"catchword":"door gierigheid,","tekst":"Namelijk aangedreven zijnde; dat is, om vuil gewins wille, Tit 1:11."},{"catchword":"gemaakte woorden,","tekst":"Dat is, geveinsde, zoete en vleiende woorden; gelijk Rom 16:18."},{"catchword":"van u een koopmanschap","tekst":"Grieks u verkoop-manschappen ; dat is, daarmede u als verkopen om uit u gewin te trekken; zoekende niet uw zaligheid, maar uw goederen; Rev 18:13."},{"catchword":"het oordeel van","tekst":"Dat is, de straf, gelijk 1Co 11:29; namelijk tijdelijke en eeuwige; gelijk de volgende woorden verklaren."},{"catchword":"over lang niet ledig","tekst":"Dat is, van over lang over hen is besloten en zeker over hen komen zal."}],"4":[{"catchword":"Want indien God","tekst":"Deze vijf volgende verzen worden besloten op het vs.9."},{"catchword":"aan de ketenen der","tekst":"Namelijk gelijk gevangen misdadigers met ketenen bewaard worden in de duistere gevangenissen, totdat zij daaruit gehaald worden om gestraft te worden."},{"catchword":"tot het oordeel","tekst":"Namelijk tot het laatste oordeel; of tot de eeuwige straf."}],"5":[{"catchword":"de oude wereld niet","tekst":"Dat is, de mensen van de eerste wereld voor den zondvloed; zie Gen 6:7."}],"6":[{"catchword":"met omkering","tekst":"Dat is, met een ganse vernieling van mensen en van steden."},{"catchword":"veroordeeld heeft,","tekst":"Dat is, gestraft of verdoemd."},{"catchword":"tot een voorbeeld","tekst":"Namelijk van zijn rechtvaardigen to , John 15. 2. Revel. 22. 19. For Christ truly and really bought only his Church by his blood, Acts 20. 28. Ephes. 5. 25. i.e. only true believers, who always continue with Christ and deny him not. See 1 John 2, 19. Revel. 14. 3, 4.] (and) bringing upon themselves a speedy destruction."}],"2":[{"catchword":null,"tekst":"And many shall follow their destructions, [Gr. Apoleiais, i.e. their destructive doctrines and seducing. Others read, aselgeiais, i.e. their lusciousness to wantonness&acirc;&euro;&trade;s] by whom the way of truth [that is, the true Christian doctrine and Religion, which showeth the way to eternal salvation. See of this appellation, Acts 9. 2. And 19. 9. And 22. 4.] shall be reproached. [namely, as well by themselves, by speaking against and accusing the truth: as by others, who from their evil doctrine and ungodly life shall take occasion to reproach Christian Religion.]"}],"3":[{"catchword":null,"tekst":"And they [Namely the false Teachers] shall by covetousness [namely, being carried on, i.e. for filthy lucre&acirc;&euro;&trade;s sake, Tit. 1. 11.] with fained words [that is, fained, sweet, and flattering words: as Rom. 16. 18.] make merchandize of you, [Gr. Merchandise you, i.e. thereby as it were sell you, to draw gain from you: seeking not your salvation but your goods. See Rev. 18. 13.] upon whom of a long time [that is, decreed against them for a great while ago, and shall certainly come upon them] judgement [that is, punishment, as 1 Cor. 11. 29. Namely, temporal and eternal: as the following words declare] is not idle, and their destruction slumbreth not."}],"4":[{"catchword":null,"tekst":"For [These five following verses are concluded at the ninth ver.] if God spared not the Angels which sinned, but having cast them into hell, gave them up to the chains of darkness, [namely, even as imprisoned malefactors are kept with chains in the dark prisons until they are drawn forth of them to be punished] to be kept unto judgement, [Namely, unto the t walk according to the flesh, [Gr. After the flesh, i.e. fleshly impurities] in unclean lust, [Gr. In lust of defilement, pollution, whereby not only the soul, but also the body is defiled. See 1 Cor. 6. 18.] and despise dominion: [that is, those that are in authority] who are bold, please themselves, [or self-conceited. See of this word Tit. 1. 7.] and who tremble not to reproach dignities. [that is, dominion, which are placed in glory amongst men.]"}],"11":[{"catchword":null,"tekst":"Whereas the Angels [That is, the good Angels, among whom Michael is brought forth for an example, Jude vers. 9.] being greater [namely, then any men are] in strength and power, bring not forth a reviling judgement against them [that is, that which they have to say against them who are in authority, they set not forth with reviling words] before the Lord."}],"12":[{"catchword":null,"tekst":"But those [Namely, false Teachers] as unreasonable beasts, which follow nature, [Greek natural, i.e. following the instinct and the lusts of their nature: to whom the false Teachers are like, because they also follow the lusts of their corrupt nature] and are brought forth [Gr. Begotten, or born, i.e. as the unreasonable beasts have no thing else to expect, but to be taken and killed by men; even so also these false Teachers have nothing else to expect, but to be punished by God with eternal destruction, as is declared in that followeth] to be taken and killed, [Gr. For taking and destruction] seeing they reproach that which they understand not, shall be destroyed in their own corruption. [ That is, perish, or perish in their destruction.]"}],"13":[{"catchword":null,"tekst":"And shall obtain the reward of unrighteousness, [Namely, eternal death and damnation; which unrighteousness deserves according to God&acirc;&euro;&trade;s just judgement; as on the contrary eternal life is called a crown of righteousness which is given of grace, 2 Tim. 4. 8.] as who esteem daily voluptuousness [that is, living daintily, feasting and making good cheer, as the rich miser did, Luke 16. 19.] (their) delight; [Gr. Pleasure] being spots and blemishes [namely, of the Christian name, which they use, and defile by their evil life] and are luxuriant in their deceiving, [Gr. Apatais, i.e. deceitful seductions] while they are at feasts with you. [Or when they make good cheer with you, i.e. are invited to eat with you, or keep common feasts with you.]"}],"14":[{"catchword":null,"tekst":"Having eyes full of adultery, [That is, which clearly show forth their inclination to uncleanness, and which they cast upon other women to lust after them. See Matth. 5. 28.] and which cease not from sinning, [Gr. Incessant from sin, i.e. which continually by unchaste beholding and desiring of other women, move the heart to adultery, and commit the same also with their heart] alluring [namely, with fair speaking as with a bait] unstable souls, [namely, in the truth, or godliness] having the heart exercised in covetousness, children of cursing. [that is, cursed men, as John 17. 12. Ephes. 2. 2. Colos. 3. 6. 2 Thess. 2. 3. 1 Pet. 1. 14.]"}],"15":[{"catchword":null,"tekst":"Who having forsaken the right way, [Namely, of Salvation, or of godliness which leadeth to salvation] are gone astray, and follow the way of Balaam, [that is, his manner of doing. See 1 Cor. 4. 17. Jude ver. 11.] the (son) of Bosor, [he is called Beor, or Bechor, Num. 22. 5.] who loved [that is, out of covetousness to obtain the reward, contrary to God&acirc;&euro;&trade;s will and his own conscience] the reward of unrighteousness. [that is, which Balak had promised him to do an unrighteous thing, namely, to curse the people of God.]"}],"16":[{"catchword":null,"tekst":"But he had the reproof of his unrighteousness: [Or transgression] (for) the yoak-bearing dumb (beast) [that is, the she ass on which he rode] speaking [Gr. Giving-sound] with man&acirc;&euro;&trade;s voice, hindered the folly of the Prophet. [namely, of Balaam, who is called a Prophet, as also Josh. 13. 22. A foreteller or soothsayer, because he was accounted with the people of God, although he also by the inspiration of God prophesied the truth concerning the Messiah, Numb. 24. 17. See the like John 11. 14.]"}],"17":[{"catchword":null,"tekst":"These are waterless Fountains, [That is, seem indeed to be Fountains, but yield no water: by which similitude their seeming holiness and hypocrisy is described, as in the following their unsteadfastness] clouds driven a whirl-wind, to which [namely, false Teachers] the mist of darkness, Mat. 8. 12. And chap. 22. 13. And 25. 30. Whereby is signified Hell] is kept forever."}],"18":[{"catchword":null,"tekst":"For they speaking very great swelling vanity [Gr. Very great swelling things vanity, i.e. bodly propounding their false and vain doctrine with great puffing up] allure by [Gr. In, as also in that which followeth] the lusts of flesh, (and) by lasciviousness&acirc;&euro;&trade;s [or, wantonness&acirc;&euro;&trade;s, lustfulness&acirc;&euro;&trade;s] those that had truly escaped [that is, who now had indeed the knowledge of the right truth. Others for Ontos, i.e. truly, read oligon, i.e. a little] from them that walk in error:"}],"19":[{"catchword":null,"tekst":"Promising them liberty, [Namely, a carnal liberty, under pretext of the Gospel] whereas they themselves are servants of corruption. [namely, which is and reigneth in them, or of eternal destruction: For both are true in a diverse respect] For by whom any one is overcome, to him he is also made a servant."}],"20":[{"catchword":null,"tekst":"For if they, after that by knowledge of the Lord and Savior Jesus Christ, [Namely, which they have obtained by the preaching of the Gospel, which the unregenerate also oftentimes have indeed. See Matth. 13. 19. 20, & c.] they have escaped [namely, from these errors, sins, and idolatries, betaking themselves unto the Church of God, which the hypocrites and unregenerate also oftentimes do] the pollutions of the world, that is, the errors, idolatries, and gross sins, wherein they stuck before, and which are in the world] and being again entangled in the same are overcome (by them) [namely so, that they again fall thereunto, and remain therein, without turning from them, letting the same sins reign over them] the last [that is, this their first estate in which they were before they knew the truth. See Luk. 12. 7.]"}],"21":[{"catchword":null,"tekst":"For it were better for them, that they had not known the way of righteousness, [That is, the doctrine of the Gospel, which before is called the way of truth, v. 2.] than that they having known (it) should (again) turn away from the holy commandment [that is, the holy doctrine of the Gospel, which consists not only in promises, but also in precepts: and the Apostle speaketh thus, because the false teachers seduced men, not only from the truth, but also of all manner of ungodliness] that was delivered over unto them."}],"22":[{"catchword":null,"tekst":"But that is come upon them which (is spoken) by a true proverb, the Dog is returned to his own vomit: and the washed Sow to wallowing in the mire."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
