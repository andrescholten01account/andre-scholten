 maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.","10":"Maar de dag van de Heere zal komen als een dief in de nacht; op die dag zullen de hemelen met een enorm gedruis voorbijgaan, en de elementen zullen brandend vergaan, en de aarde en de werken die daarop zijn, zullen verbranden.","11":"Omdat al deze dingen dan zullen vergaan, wat voor mensen moet u dan wel zijn, in een heilige levenswandel en in godsvrucht!","12":"Verwacht en verhaast de komst van de dag van God, waarop de hemelen door vuur zullen vergaan, en de elementen brandend zullen versmelten.","13":"Maar wij verwachten, naar Zijn belofte, nieuwe hemelen en een nieuwe aarde, waarin gerechtigheid woont.","14":"Daarom, geliefden, terwijl u deze dingen verwacht, doe uw best om onbevlekt en onberispelijk door Hem bevonden te worden, in vrede;","15":"En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;","16":"Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.","17":"U dan, geliefden, omdat u dit van tevoren weet, wees op uw hoede, dat u niet mede weggesleept wordt door de dwaling van de verdorven mensen, en afvalt van uw eigen standvastigheid;","18":"Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen."},"SV":{"1":"Dezen tweeden zendbrief, geliefden, schrijf ik nu aan u, in welke *beide* ik door vermaning uw oprecht gemoed opwekke;","2":"Opdat gij gedachtig zijt aan de woorden, die van de heilige profeten te voren gesproken zijn, en aan ons gebod, die des Heeren en Zaligmakers apostelen zijn;","3":"Dit eerst wetende, dat in het laatste der dagen spotters komen zullen, die naar hun eigen begeerlijkheden zullen wandelen,","4":"En zeggen: Waar is de belofte Zijner toekomst? want van dien *dag*, dat de vaders ontslapen zijn, blijven alle dingen alzo *gelijk* van het begin der schepping.","5":"Want willens is dit hun onbekend, dat door het woord Gods de hemelen van over lang geweest zijn, en de aarde uit het water en in het water bestaande;","6":"Door welke de wereld, die toen was, met het water van den zondvloed bedekt zijnde, vergaan is.","7":"Maar de hemelen, die nu zijn, en de aarde, zijn door hetzelfde woord als een schat weggelegd, en worden ten vure bewaard tegen den dag des oordeels, en der verderving der goddeloze mensen.","8":"Doch deze ene zaak zij u niet onbekend, geliefden, dat een dag bij den Heere is als duizend jaren, en duizend jaren als een dag.","9":"De Heere vertraagt de belofte niet ( gelijk enigen *dat* traagheid achten), maar is lankmoedig over ons, niet willende, dat enigen verloren gaan, maar dat zij allen tot bekering komen.","10":"Maar de dag des Heeren zal komen als een dief in den nacht, in welken de hemelen met een gedruis zullen voorbijgaan, en de elementen branden zullen en vergaan, en de aarde en de werken, die daarin zijn, zullen verbranden.","11":"Dewijl dan deze dingen alle vergaan, hoedanigen behoort gij te zijn in heiligen wandel en godzaligheid!","12":"Verwachtende en haastende tot de toekomst van den dag Gods, in welken de hemelen, door vuur ontstoken zijnde, zullen vergaan, en de elementen brandende zullen versmelten.","13":"Maar wij verwachten, naar Zijn belofte, nieuwe hemelen en een nieuwe aarde, in dewelke gerechtigheid woont.","14":"Daarom, geliefden, verwachtende deze dingen, benaarstigt u, dat gij onbevlekt en onbestraffelijk van Hem bevonden moogt worden in vrede;","15":"En acht de lankmoedigheid onzes Heeren voor zaligheid; gelijkerwijs ook onze geliefde broeder Paulus, naar de wijsheid, die hem gegeven is, ulieden geschreven heeft;","16":"Gelijk ook in alle zendbrieven, daarin van deze dingen sprekende; in welke sommige dingen zwaar zijn om te verstaan, die de ongeleerde en onvaste *mensen* verdraaien, gelijk ook de andere Schriften, tot hun eigen verderf.","17":"Gij dan, geliefden, *zulks* te voren wetende, wacht u, dat gij niet door de verleiding der gruwelijke mensen mede afgerukt wordt, en uitvalt van uw vastigheid;","18":"Maar wast op in de genade en kennis van onzen Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, beide nu en in den dag der eeuwigheid. Amen."},"KJV":{"1":"This second epistle, beloved, I ➔ now write unto you; in both which I stir up your pure minds by way of remembrance:","2":"That ye may be mindful of the words which were spoken before by the holy prophets, and of the commandment of us the apostles of the Lord and Saviour:","3":"Knowing this first, that there shall come in the last days scoffers, walking after their own lusts,","4":"And saying, Where is the promise of his coming? for since the fathers fell asleep, all things continue as they were from the beginning of the creation.","5":"For this they willingly are ignorant of, that by the word of God the heavens were of old, and the earth standing out of the water and in the water:","6":"Whereby the world that then was, being overflowed with water, perished:","7":"But the heavens and the earth, which are now, by the same word are kept in store, reserved unto fire against the day of judgment and perdition of ungodly men.","8":"But, beloved, be ➔ not ignorant of this one thing, that one day is with the Lord as a thousand years, and a thousand years as one day.","9":"The Lord is ➔ not slack concerning his promise, as some men count slackness; but is longsuffering to us-ward, not willing that any should perish, but that all should come to repentance.","10":"But the day of the Lord will come as a thief in the night; in the which the heavens shall pass away with a great noise, and the elements shall melt with fervent heat, the earth also and the works that are therein shall be burned up.","11":"Seeing then that all these things shall be dissolved, what manner of persons ought ye to be in all holy conversation and godliness,","12":"Looking for and hasting unto the coming of the day of God, wherein the heavens being on fire shall be dissolved, and the elements shall melt with fervent heat?","13":"Nevertheless we, ➔ according to his promise, look for new heavens and a new earth, wherein dwelleth righteousness.","14":"Wherefore, beloved, seeing that ye look for such things, be diligent that ye may be found of him in peace, without spot, and blameless.","15":"And account that the longsuffering of our Lord is salvation; even as our beloved brother Paul also according to the wisdom given unto him hath written unto you;","16":"As also in all his epistles, speaking in them of these things; in which are some things hard to be understood, which they that are unlearned and unstable wrest, as they do also the other scriptures, unto their own destruction.","17":"Ye therefore, beloved, seeing ye know these things before, beware lest ye also, ➔ being led away with the error of the wicked, fall from your own stedfastness.","18":"But grow in grace, and in the knowledge of our Lord and Saviour Jesus Christ. To him be glory both now and for ever. Amen."}},"tsk":{"1":[{"kopje":"tweede brief","refs":["2 Kor 13:2","1 Petr 1:1","1 Petr 1:2"]},{"kopje":"wek ik op","refs":["2 Petr 1:13-15","2 Tim 1:6"]},{"kopje":"oprechte","refs":["Ps 24:4","Ps 73:1","Matt 5:8","1 Tim 5:22","1 Petr 1:22"]},{"kopje":"door herinnering","refs":["2 Petr 1:12"]}],"2":[{"kopje":"u de woorden gedenkt","refs":["2 Petr 1:19-21","Luk 1:70","Luk 24:27","Luk 24:44","Hand 3:18","Hand 3:24-26","Hand 10:43","Hand 28:23","1 Petr 1:10-12","Openb 19:10"]},{"kopje":"en het gebod","refs":["2 Petr 3:15","2 Petr 2:21","Ef 2:20","1 Joh 4:6","Judas 1:17"]}],"3":[{"kopje":"dat er","refs":["1 Tim 4:1","1 Tim 4:2","2 Tim 3:1","1 Joh 2:18","Judas 1:18"]},{"kopje":"spotters","refs":["Spr 1: a-code=\"G793\">unstable</span> <span class=\"wl wl-kjv\" data-code=\"G4761\">wrest,</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> they do <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> the <span class=\"wl wl-kjv\" data-code=\"G3062\">other</span> <span class=\"wl wl-kjv\" data-code=\"G1124\">scriptures,</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G2398\">own</span> <span class=\"wl wl-kjv\" data-code=\"G684\">destruction.</span>","17":"<span class=\"wl wl-kjv\" data-code=\"G5210\">Ye</span> <span class=\"wl wl-kjv\" data-code=\"G3767\">therefore,</span> <span class=\"wl wl-kjv\" data-code=\"G27\">beloved,</span> seeing ye know these things <span class=\"wl wl-kjv\" data-code=\"G4267\">before,</span> <span class=\"wl wl-kjv\" data-code=\"G5442\">beware</span> <span class=\"wl wl-kjv\" data-code=\"G3363\">lest</span> ye <span class=\"wl wl-kjv\" data-code=\"G1601\">also,</span> ➔ being led <span class=\"wl wl-kjv\" data-code=\"G4879\">away</span> with the <span class=\"wl wl-kjv\" data-code=\"G4106\">error</span> of the <span class=\"wl wl-kjv\" data-code=\"G113\">wicked,</span> fall <span class=\"wl wl-kjv\" data-code=\"G1601\">from</span> your <span class=\"wl wl-kjv\" data-code=\"G2398\">own</span> <span class=\"wl wl-kjv\" data-code=\"G4740\">stedfastness.</span>","18":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> <span class=\"wl wl-kjv\" data-code=\"G837\">grow</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G5485\">grace,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> in the <span class=\"wl wl-kjv\" data-code=\"G1108\">knowledge</span> of <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4990\">Saviour</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ.</span> To <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> be <span class=\"wl wl-kjv\" data-code=\"G1391\">glory</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">both</span> <span class=\"wl wl-kjv\" data-code=\"G3568\">now</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">for</span> <span class=\"wl wl-kjv\" data-code=\"G165\">ever.</span> <span class=\"wl wl-kjv\" data-code=\"G281\">Amen.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"beide ik","tekst":"Dit woord moet daarbij gedaan worden, omdat de apostel spreekt in het meervoud, van beide zijn zendbrieven."},{"catchword":"door vermaning","tekst":"Grieks in vermaning of indachtigmaking."},{"catchword":"oprecht","tekst":"Namelijk in de leer van het Evangelie."},{"catchword":"gemoed opwekke;","tekst":"Of verstand."}],"2":[{"catchword":"te voren gesproken zijn,","tekst":"Namelijk van den Messias èn den staat van Zijn rijk in het Nieuwe Testament."},{"catchword":"gebod, die des","tekst":"Dat is, aan onze leer, die wij u geleerd hebben, niet naar ons eigen goeddunken of gezag, maar als apostelen van onzen Heere Christus. Zie 2Pe 1:21. Beide deze worden zeer geschikt bijeengesteld, als zijnde tezamen de grond der christelijke leer. Zie dergelijke Eph 2:20."}],"3":[{"catchword":"eerst wetende,","tekst":"Dat is, vooral."},{"catchword":"in het laatste der","tekst":"Dat is, in de laatste dagen. Zie 2Ti 3:1."},{"catchword":"spotters komen zullen,","tekst":"Namelijk die spotten zullen zo met de voorzegging van God in Zijn Woord, vooral van het laatste oordeel en van het einde der wereld, als met degenen, die deze geloven, houdende hen voor slecht en al te licht gelovende lieden. Zie van deze Psa 1:1; Isa 22:13."},{"catchword":"naar hun eigene","tekst":"Dat is, volgende de kwade lusten van hun vlees, in alle ongebondenheid des levens. Gelijk de Nikolaïten en huns gelijke deden."}],"4":[{"catchword":"zeggen","tekst":"Waar Namelijk spottenderwijze."},{"catchword":"is de belofte","tekst":"Dat is, blijft de vervulling dezer belofte en voorzegging? Dit vragen is zoveel als ontkennen."},{"catchword":"Zijner toekomst?","tekst":"Namelijk om te oordelen de levenden en de doden en de wereld te vernieuwen."},{"catchword":"de vaders","tekst":"Dat is, de voorouders."},{"catchword":"ontslapen zijn,","tekst":"Dat is, gestorven. Zie Mat 9:24; 1Co 11:30; 1Th 4:13. Dit woord schijnen zijn ook spottenderwijze te gebruiken, alsof het wel tijd ware dat de vaders uit den slaap zouden opgewekt worden, zo er een opstanding der doden en een laatste oordeel zou zijn."},{"catchword":"alzo gelijk","tekst":"Of alzo gelijk het van het begin der schepping aan geweest is. Dit is hun rede, die zij stellen tegen de zekerheid der voorzeggingen van het laatste oordeel en voleinding der wereld, dewijl men ziet dat nu zo lange jaren, nadat de voorzeggingen geschied zijn, men geen vervulling derzelve verneemt; maar dat alles blijft gelijk het altijd geweest is, dat het dan niet gelofelijk is, dat deze immermeer zullen vervuld worden."}],"5":[{"catchword":"willens is dit","tekst":"Dat is, zij willen dit niet weten en aanmerken."},{"catchword":"door het woord","tekst":"Dat is, door zijn kracht en bevel; zie Gen 1:3; Psa 33:6, Psa 33:9; Heb 1:3. Daarmede beantwoordt en wederlegt Petrus het voorgeven van de spotters, en bewijst dat het bestaan en vergaan van hemel en aarde alleen staat aan den wil, het bevel en de kracht van God, waardoor, gelijk hij ze geschapen heeft zo onderhoudt hij ze ook zo lang het hem belieft, en kan ze ook teniet maken door hetzelfde woord, als het Hem belieft."},{"catchword":"uit het water en","tekst":"Namelijk uitstekende, waar ze eerst mede bedekt was; Gen 1:9."},{"catchword":"in het water bestaande;","tekst":"Grieks door. Hetwelk ook soms in betekent, gelijk 1Ti 2:15, zo ook hier, dewijl de wateren zijn als de vastigheid waarin de aarde is en vaststaat. Zie Psa 24:2."}],"6":[{"catchword":"Door welke","tekst":"Namelijk hemel en aarde. Want die hebben beide hunne wateren tot den zondvloed gebracht, gelijk uitdrukkelijk getuigd wordt Gen 7:11."},{"catchword":"de wereld,","tekst":"Dat is, de mensen en beesten, die toen in de wereld waren en leefden, uitgenomen die in de ark behouden werden."},{"catchword":"bedekt zijnde,","tekst":"Namelijk door het Woord en bevel van God. En de apostel wil daarmee bewijzen, dat gelijk God, als het Hem belieft heeft, door Zijn kracht de eerste wereld heeft doen vergaan met het water, dat Hij ook de tweede en tegenwoordige wereld met het vuur kan en zal doen vergaan, wanneer het Hem zal believen, gelijk in vs.7 verklaard wordt."}],"7":[{"catchword":"als een schat weggelegd,","tekst":"Dat is, bewaard, gelijk men een schat weglegt in de schatkamer, om te zijner tijd, als het ons belieft, uitgegeven en besteed te worden."},{"catchword":"ten vure bewaard","tekst":"Namelijk om daardoor verbrand te worden; zie Psa 50:3; 2Th 1:8."},{"catchword":"des oordeels,","tekst":"Dat is, van het laatste algemene oordeel; of der verdoemenis, gelijk de volgende woorden verklaren."}],"8":[{"catchword":"dat een dag bij den","tekst":"En dat derhalve wij ons niet moeten verwonderen, dat de Heere, naar onze mening, zo lang vertoeft met het volbrengen Zijner belofte, alzo Hij de tijden niet rekent kort of lang naar ons dunken, daar Hij eeuwig en aan de tijden niet gebonden is."}],"9":[{"catchword":"vertraagt de belofte","tekst":"Of vertraagt niet aangaande de belofte; dat is, stelt de volbrenging van de belofte niet uit boven den tijd, dien Hij daartoe bestemd heeft."},{"catchword":"traagheid achten),","tekst":"Dat is, uitstel, boven den bestemden tijd."},{"catchword":"over ons, niet willende,","tekst":"Namelijk die geroepen zijn tot de kennis van Christus en in Hem geloven; voor hoedanigen Hij naar het oordeel der liefde houdt al degenen aan wie Hij schrijft; zie 2Pe 1:1."},{"catchword":"enigen verloren gaan,","tekst":"Namelijk uit ons, die krachtig geroepen zijn en nog zullen worden. Want alzo God al wat Hij wil doen kan en ook doet, zo kan dit niet verstaan worden van ale en een ieder mens, dewijl de Schrift en de ervaring zelf getuigen, dat niet alle mensen zalig worden, maar velen verloren gaan."},{"catchword":"allen","tekst":"Namelijk uitverkorenen, van wie Hij hier spreekt; Rev 6:11."},{"catchword":"tot bekering komen","tekst":"Namelijk dat hun daartoe tijd gegeven worde."}],"10":[{"catchword":"de dag des Heeren","tekst":"Dat is, de jongste of laatste dag, als de Heere komen zal ten oordeel."},{"catchword":"als een dief","tekst":"Dat is, onvoorziens. Zie de aantekeningen 1Th 5:2."},{"catchword":"in welken de hemelen","tekst":"Namelijk dag des Heeren."},{"catchword":"met een gedruis","tekst":"Namelijk gelijk in een groot onweder of grote storting van water gehoord wordt."},{"catchword":"zullen voorbijgaan,","tekst":"Hoe dit voorbijgaan of vergaan van hemel en aarde geschieden zal, zijn er verschillende meningen, zo van oude als van nieuwe leraars. Sommigen menen, dat de substantie of het wezen zelf der wereld ten enenmale zal vergaan en vernietigd worden; anderen, dat alleen de hoedanigheden derzelve zullen vergaan en veranderd worden, en de substantie of wezen blijven. Welke mening wel de algemene en waarschijnlijkste is. Zie Psa 102:26-27; Rom 8:19."},{"catchword":"de elementen branden","tekst":"Namelijk waaruit alle lichamelijke schepselen bestaan, dat is, het vuur, de lucht, het water en de aarde."},{"catchword":"vergaan, en de aarde","tekst":"Grieks los gemaakt of ontbonden worden."},{"catchword":"de werken, die daarin zijn,","tekst":"Namelijk die de aarde uit zich voortbrengt of die de mensen op de aarde gemaakt en gebouwd hebben."},{"catchword":"verbranden","tekst":"Namelijk door het vuur, waarvan gesproken is vs.17."}],"11":[{"catchword":"vergaan,","tekst":"Dat is, vergaan zullen. Zie vs.10."},{"catchword":"hoedanigen behoort","tekst":"Dat is, hoe grote vlijt behoort gij dan aan te wenden, om zodanigen te zijn in ware godzaligheid, dat gij in dien verschrikkelijken dag moogt bestaan en plaats vinden in de toekomende wereld."}],"12":[{"catchword":"Verwachtende en","tekst":"Namelijk met lijdzaamheid."},{"catchword":"haastende tot de","tekst":"Namelijk met verlangen."},{"catchword":"Gods,","tekst":"Dat is, van den Heere Jezus Christus, gelijk Tit 2:13; of van God den Vader, die Zijn gericht houden zal door den Zoon; Act 17:31."},{"catchword":"in welken de hemelen,","tekst":"Of door welke, namelijk toekomst van den dag Gods."},{"catchword":"door vuur ontstoken","tekst":"Zie hiervan vs.7, 10."}],"13":[{"catchword":"nieuwe hemelen","tekst":"Namelijk of van ene nieuwe substantie en wezen, of met nieuwe hoedanigheden versierd, en daardoor als vernieuwd. Zie de aantekeningen vs.10."},{"catchword":"in dewelke","tekst":"Namelijk nieuwe hemelen en aarde. Want Hij spreekt in het meervoud."},{"catchword":"gerechtigheid","tekst":"Dat is, mensen die van de zonde gerechtvaardigd zijn, en anders niet dan gerechtigheid zullen plegen; daar deze aarde vol is van boze en ongerechtige mensen."},{"catchword":"woont","tekst":"Dat is, wonen zal; dat is, waar de rechtvaardige mensen een vaste plaats zullen hebben en altijd daarin blijven en gerechtigheid oefenen."}],"14":[{"catchword":"onbevlekt en onbestraffelijk","tekst":"Namelijk van de zonden en besmettingen der wereld. Want anderszins leeft niemand zonder enige vlek, 1Ki 8:46; Psa 19:13; Pro 20:9; Jam 3:2; 1Jo 1:8; maar den gelovigen wordt de onbevlektheid van Christus als hun eigene toegerekend, Eph 5:26-27; en zij wachten zich dat de zonden over hen niet heersen; Rom 6:12."},{"catchword":"van Hem","tekst":"Namelijk van den Heer Jezus Christus."},{"catchword":"bevonden moogt worden","tekst":"Namelijk als Hij zal komen om te oordelen. Want gelijk iemand dan zal worden gevonden, zo zal hij geoordeeld worden; Ecc 11:3; Mat 24:46."},{"catchword":"in vrede;","tekst":"Dat is, hebbende een gerust gemoed en een goed geweten voor God, en met de mensen in vrede levende."}],"15":[{"catchword":"de lankmoedigheid","tekst":"Namelijk die Hij gebruikt, Zijn komst ten oordeel uitstellende, om den mensen tijd te geven tot bekering."},{"catchword":"voor zaligheid;","tekst":"Dat is, voor een zaak, die zeer dienstig is tot bevordering uwer zaligheid."},{"catchword":"ulieden geschreven","tekst":"Namelijk gelovige Joden, hetwelk hij gedaan heeft door den zendbrief aan de Hebreën. Zie Heb 6:2, en Heb 10:36-37."}],"16":[{"catchword":"van deze dingen","tekst":"Namelijk van welke ik u nu onderwezen en vermaand heb, namelijk van de komst van Christus ten oordeel, van de voleinding der wereld, van de valse leraars en spotters, die opstaan zullen, enz."},{"catchword":"in welke dingen","tekst":"Of onder welke dingen."},{"catchword":"sommige zwaar zijn","tekst":"Namelijk dingen, of spreuken. Hij zegt dan niet dat al wat in de Schrift geleerd wordt zwaar zou zijn om te verstaan, maar alleen sommige dingen, vooral die van toekomende zaken of van den raad Gods over toekomende dingen spreken, welke, hoewel zij zwaar zijn om begrepen te worden, nochtans klaar genoeg voorgesteld worden, zo veel den gelovigen daarvan ter zaligheid nodig is te weten; gelijk ook alles wat ter zaligheid nodig is te weten, in de Heilige Schrift klaar genoeg geleerd en uitgedrukt wordt. Zie Deu 29:29, en Deu 30:11; Psa 19:8, en Psa 119:105; Pro 6:23; 2Co 4:3; 2Pe 1:19."},{"catchword":"de ongeleerde en","tekst":"Of onervaren; namelijk in Goddelijke dingen."},{"catchword":"onvaste mensen","tekst":"Of, onbevestigde, die in den rechten grond der christelijke leer niet zijn bevestigd."},{"catchword":"verdraaien, gelijk","tekst":"Namelijk met valse uitleggingen daarop te maken, en slechte gevolgtrekkingen daaruit te maken. Zie Rom 3:5, Rom 3:8, en Rom 9:19, en Rom 11:1."},{"catchword":"tot hun eigen verderf","tekst":"Waarmede aang // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
