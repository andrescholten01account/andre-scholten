onica gereisd; Krescens naar Galatië, Titus naar Dalmatië.","11":"Lukas is alleen bij mij. Neem Markus mee en breng hem met u; want hij is mij zeer nuttig voor de dienst.","12":"Maar Tychikus heb ik naar Efeze gezonden.","13":"Breng de mantel mee die ik in Troas bij Karpus heb achtergelaten, als u komt, en de boeken, vooral de perkamenten.","14":"Alexander, de kopersmid, heeft mij veel kwaad aangedaan; de Heere zal hem vergelden naar zijn werken.","15":"Wees ook u voor hem op uw hoede, want hij heeft onze woorden sterk tegengestaan.","16":"Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.","17":"Maar de Heere heeft mij bijgestaan en heeft mij kracht gegeven; opdat door mij de prediking ten volle bekend zou worden, en alle heidenen die zouden horen. En ik ben uit de muil van de leeuw verlost.","18":"En de Heere zal mij verlossen van alle slecht werk, en bewaren tot Zijn hemels Koninkrijk; aan Hem zij de heerlijkheid, tot in alle eeuwigheid. Amen.","19":"Groet Priska en Aquila, en het huis van Onesiforus.","20":"Erastus is in Korinthe gebleven; en Trofimus heb ik ziek achtergelaten in Milete.","21":"Doe uw best om voor de winter te komen. Eubulus groet u, en Pudens, en Linus, en Klaudia, en al de broeders.","22":"De Heere Jezus Christus zij met uw geest. De genade zij met u. Amen. *De* tweede *brief* aan Timotheüs, aangesteld als eerste opziener van de gemeente van Efeze, werd vanuit Rome geschreven, toen Paulus voor de tweede keer voorgeleid werd voor Nero."},"SV":{"1":"Ik betuig dan voor God en den Heere Jezus Christus, Die de levenden en doden oordelen zal in Zijn verschijning en *in* Zijn Koninkrijk:","2":"Predik het woord; houd aan tijdelijk, ontijdelijk; wederleg, bestraf, vermaan in alle lankmoedigheid en leer.","3":"Want er zal een tijd zijn, wanneer zij de gezonde leer niet zullen verdragen; maar kittelachtig zijnde van gehoor, zullen zij zichzelven leraars opgaderen, naar hun eigen begeerlijkheden;","4":"En zullen *hun* gehoor van de waarheid afwenden, en zullen zich keren tot fabelen.","5":"Maar gij, wees wakker in alles, lijd verdrukkingen; doe het werk van een evangelist, maak, dat men van uw dienst ten volle verzekerd zij.","6":"Want ik word nu tot een drankoffer geofferd, en de tijd mijner ontbinding is aanstaande.","7":"Ik heb den goeden strijd gestreden, ik heb den loop geëindigd, ik heb het geloof behouden;","8":"Voorts is mij weggelegd de kroon der rechtvaardigheid, welke mij de Heere, de rechtvaardige Rechter, in dien dag geven zal; en niet alleen mij, maar ook allen, die Zijn verschijning liefgehad hebben.","9":"Benaarstig u haastelijk tot mij te komen.","10":"Want Demas heeft mij verlaten, hebbende de tegenwoordige wereld liefgekregen, en is naar Thessalonica gereisd; Krescens naar Galatië, Titus naar Dalmatië.","11":"Lukas is alleen met mij. Neem Markus mede, en breng *hem* met u; want hij is mij zeer nut tot den dienst.","12":"Maar Tychikus heb ik naar Efeze gezonden.","13":"Breng den reismantel mede, dien ik te Troas bij Karpus gelaten heb, als gij komt, en de boeken, inzonderheid de perkamenten.","14":"Alexander, de kopersmid, heeft mij veel kwaads betoond; de Heere vergelde hem naar zijn werken.","15":"Van welken wacht gij u ook, want hij heeft onze woorden zeer tegengestaan.","16":"In mijn eerste verantwoording is niemand bij mij geweest, maar zij hebben mij allen verlaten. Het worde hun niet toegerekend.","17":"Maar de Heere heeft mij bijgestaan, en heeft mij bekrachtigd; opdat men door mij ten volle zou verzekerd zijn van de prediking, en alle heidenen *dezelve* zouden horen. En ik ben uit den muil des leeuws verlost.","18":"En de Heere zal mij verlossen van alle boos werk, en bewaren tot Zijn hemels Koninkrijk; Denwelken zij de heerlijkheid in alle eeuwigheid. Amen.","19":"Groet Priska en Aquila, en het huis van Onesiforus.","20":"Erastus is te Korinthe gebleven; en Trofimus heb ik te Milete krank gelaten.","21":"Benaarstig u, om voor den winter te komen. U groet Eubulus, en Pudens, en Linus, en Klaudia, en al de broeders.","22":"De Heere Jezus Christus zij met uw geest. De genade zij met ulieden. Amen. *De* tweede *brief* aan Timotheüs, aangesteld als eerste opziener van de Gemeente van Efeze, werd uit Rome geschreven, toen Paulus voor de tweede keer voorgeleid werd voor Nero."},"KJV":{"1":"I charge thee therefore before God, and the Lord Jesus Christ, who shall judge the quick and the dead at his appearing and his kingdom;","2":"Preach the word; be instant in season, out of season; reprove, rebuke, exhort with all longsuffering and doctrine.","3":"For the time will come when they will ➔ not endure sound doctrine; but after their own lusts shall they heap to themselves teachers, having itching ears;","4":"And they shall turn away their ears from the truth, and shall be turned unto fables.","5":"But watch thou in all things, endure afflictions, do the work of an evangelist, make full proof of thy ministry.","6":"For I am ➔ now ready to be offered, and the time of my departure is at hand.","7":"I have fought a good fight, I have finished my course, I have kept the faith:","8":"Henceforth there is laid up for me a crown of righteousness, which the Lord, the righteous judge, shall give me at that day: and not to me only, but unto all them also that love his appearing.","9":"Do thy diligence to come shortly unto me:","10":"For Demas hath forsaken me, having loved this present world, and is departed unto Thessalonica; Crescens to Galatia, Titus unto Dalmatia.","11":"Only Luke is with me. Take Mark, and bring him with thee: for he is profitable to me for the ministry.","12":"And Tychicus have I sent to Ephesus.","13":"The cloke that I left at Troas with Carpus, when thou comest, bring with thee, and the books, but especially the parchments.","14":"Alexander the coppersmith did me much evil: the Lord reward him according to his works:","15":"Of whom be ➔ thou ware also; for he hath ➔ greatly withstood our words.","16":"At my first answer no man stood with me, but all men forsook me: I pray God that it may ➔ not be laid to their charge.","17":"Notwithstanding the Lord stood with me, and strengthened me; that by me the preaching might be fully known, and that all the Gentiles might hear: and I was delivered out of the mouth of the lion.","18":"And the Lord shall deliver me from every evil work, and will preserve me unto his heavenly kingdom: to whom be glory for ever and ever. Amen.","19":"Salute Prisca and Aquila, and the household of Onesiphorus.","20":"Erastus abode at Corinth: but Trophimus have I left at Miletum sick.","21":"Do thy diligence to come before winter. Eubulus greeteth thee, and Pudens, and Linus, and Claudia, and all the brethren.","22":"The Lord Jesus Christ be with thy spirit. Grace be with you. Amen.[fn]"}},"tsk":{"1":[{"kopje":"roep u dus dringend op","refs":["2 Tim 2:14","1 Tim 5:21","1 Tim 6:13"]},{"kopje":"Die","refs":["Ps 50:6","Ps 96:13","Ps 98:9","Matt 16:27","Matt 25:31-46","Joh 5:22-27","Hand 10:42","Hand 17:31","Rom 2:16","Rom 14:9-11","1 Kor 4:4","1 Kor 4:5","2 Kor 5:9","2 Kor 5:10","2 Tess 1:7-10","1 Petr 4:5","Openb 20:11-15"]},{"kopje":"bij","refs":["2 Tim 4:8","Kol 3:4","1 Tess 4:15","1 Tess 4:16","1 Tim 6:14","Tit 2:13","Hebr 9:27","Hebr 9:28","1 Petr 1:7","1 Petr 5:4","1 Joh 2:28","Openb 1:7"]},{"kopje":"Zijn Koninkrijk","refs":["Luk 19:12","Luk 19:15","Luk 23:42","2 Petr 1:11","2 Petr 1:17"]}],"2":[{"kopje":"Predik","refs":["Ps 40:10","Jes 61:1-3","Jona 3:2","Luk 4:18","Luk 4:19","Luk 9:60","Rom 10:15","Kol 1:25","Kol 1:28"]},{"kopje":"blijf","refs":["Luk 7:4","Luk 7:23","Hand 13:5","Rom 12:12","1 Tim 4:15","1 Tim 4:16"]},{"kopje":"gelegen","refs":["Joh 4:6-10","Joh 4:32-34","Hand 16:13","Hand 16:31-33","Hand 20:7","Hand 20:18-21","Hand 28:16","Hand 28:30","Hand 28:31"]},{"kopje":"weerleg","refs":["Kol 1:28","Kol 1:29","1 Tess 2:11","1 Tess 2:12","1 Tess 5:14","1 Tess 5:20","Tit 1:13","Tit 2:15","Hebr 13:22","Ope an u om Gods wil, of ik bezweer u voor God, dat is, ik neem God tot getuige, dat ik u ernstig vermaan. Zie dergelijke 1Ti 5:21."},{"catchword":"de levenden en","tekst":"Dat is, die in het leven zullen bevonden worden als Christus zal komen ten oordeel. Zie 1Co 15:51; 1Th 4:16-17."},{"catchword":"doden","tekst":"Dat is, die tevoren zullen gestorven zijn en weder opgewekt; Joh 5:28-29; Rev 20:12."},{"catchword":"oordelen zal","tekst":"Hij stelt hem voor het laatste oordeel, opdat hij en wij allen, daardoor opgewekt mogen worden tot getrouwheid in onze bediening, als die daarvan dan rekenschap zullen moeten geven. Zie 2Co 5:10-11."},{"catchword":"in Zijn verschijning","tekst":"Namelijk in de wolken, met Zijne engelen en met de heerlijkheid Zijns Vaders om te oordelen."},{"catchword":"in Zijn Koninkrijk","tekst":"Namelijk der heerlijkheid."}],"2":[{"catchword":"Predik","tekst":"Dit woord betekent eigenlijk met luider stem, gelijk de uitroepers, iets verkondigen. Zie Isa 40:9."},{"catchword":"het woord;","tekst":"Namelijk des Evangelies."},{"catchword":"houd aan","tekst":"Grieks sta aan; namelijk met gedurig leren en vermanen."},{"catchword":"tijdelijk,","tekst":"Dat is, wanneer daartoe goede gelegenheid is, zonder die te verzuimen; Pro 25:11."},{"catchword":"ontijdelijk;","tekst":"Daarmede wil Paulus niet zeggen, dat Timotheüs en andere predikers onbeleefdheid zouden gebruiken, maar dat zij gedurig en ijverig moeten aanhouden, zonder enigen tijd of gelegenheid te verzuimen, hoewel het, òf hun zelf zo wel niet te pas komt, òf somtijds ook de toehoorders zouden menen, dat het hun niet wel gelegen is de vermaningen te horen."},{"catchword":"wederleg,","tekst":"Namelijk de dwalingen dergenen, die de waarheid nog niet weten of niet toestaan."},{"catchword":"bestraf,","tekst":"Namelijk degenen die kwaad en ongeregeld van leven zijn."},{"catchword":"vermaan","tekst":"Namelijk tot oefening van alle christelijke deugden. Of vertroost; namelijk alle zwakke en bedroefde mensen."},{"catchword":"in alle lankmoedigheid","tekst":"Dat is, zonder hevigheid of bitterheid, verdragende geduldig der mensen onverstand en onbescheidenheid. Zie Gal 6:1; 2Ti 2:24."},{"catchword":"leer","tekst":"Dat is, zo, dat de hoofdstukken der leer altijd klaar en duidelijk voorgedragen worden."}],"3":[{"catchword":"de gezonde leer niet","tekst":"Namelijk des heiligen Evangelies. Zie 2Ti 1:13."},{"catchword":"verdragen; maar","tekst":"Dat is, niet alleen niet aannemen, maar ook niet willen toestaan dat deze hun voorgedragen wordt."},{"catchword":"kittelachtig zijnde","tekst":"Dat is, hebbende een hart en oren, die jeuken naar wat nieuws en vreemds."},{"catchword":"opgaderen,","tekst":"Of ophopen; dat is, den een voor en de ander na opwerpen en verkiezen, die hun wat nieuws leren."},{"catchword":"naar hun eigen begeerlijkheden;","tekst":"Dat is, die ene leer voordragen met hunne kwade lusten overeenkomende."}],"4":[{"catchword":"hun gehoor","tekst":"Dat is, niet willen horen."},{"catchword":"van de waarheid afwenden,","tekst":"Dat is, van de zuivere en waarachtige leer des Evangelies."},{"catchword":"fabelen","tekst":"Zie van deze fabelen 1Ti 1:4, en 1Ti 4:7; Tit 1:14; 2Pe 1:16."}],"5":[{"catchword":"wakker in alles,","tekst":"Of, nuchter; namelijk niet alleen naar het lichaam, maar naar de ziel voornamelijk."},{"catchword":"lijd verdrukkingen;","tekst":"Grieks lijd het kwaad; gelijk 2Ti 2:3, 2Ti 2:9."},{"catchword":"van een evangelist,","tekst":"Dat is, van een getrouw leraar des heiligen Evangelies. Zie van het ambt van een evangelist Act 21:8; Eph 4:11."},{"catchword":"ten volle verzekerd zij","tekst":"Dat is, gedraag u in uwen dienst met zodanige naarstigheid en getrouwheid, dat een ieder mag zien en verzekerd zijn, dat gij een oprecht leraar zijt, die alle delen zijns ambts wel bedient en volvoert, en daardoor in de waarheid meer en meer versterkt worde; zie vs.17."}],"6":[{"catchword":"word nu","tekst":"Dat is, zal nu haast geofferd of gedood worden. Dit wist de apostel, òf uit een bijzondere openbaring, òf door aanmerking van de gelegenheid en omstandigheden zijner zaken. Zie dergelijke 2Pe 1:14."},{"catchword":"tot een drankoffer","tekst":"Zie hiervan de aantekeningen op Phi 2:17."},{"catchword":"ontbinding is aanstaande","tekst":"Of, loslating, verhuizing. Zo noemt hij zijnen dood, gelijk ook Phi 1:23. Zie de aantekeningen aldaar."}],"7":[{"catchword":"den goeden strijd gestreden,","tekst":"De apostel vergelijkt den loop van zijn dienst en leven bij een strijd of kamp, die eertijds ingesteld werd met lopen, worstelen en anderszins, om daardoor een prijs of kroon te behalen. Zie van deze gelijkenis 1Co 9:24-25; 2Ti 2:5."},{"catchword":"geëindigd","tekst":"Namelijk daar ik nu tot het uiterste en einde mijns levens gekomen ben."},{"catchword":"het geloof behouden;","tekst":"Daardoor wordt verstaan het zaligmakend geloof en de trouw, die hij Christus in het bedienen des apostelschaps beloofd had."}],"8":[{"catchword":"de kroon der rechtvaardigheid,","tekst":"Dat is, het eeuwige leven, waarmee de rechtvaardige, of gerechtvaardigde, gelijk als met een prijs, naar Gods genadige belofte, gekroond wordt; een gelijkenis, genomen van de strijders of kampvechters, die tot prijs een kroon ontvingen, als zij wettig gestreden hadden; zie 1Co 9:25; 2Ti 2:5; Jam 1:12; Rev 2:10, en Rev 3:11."},{"catchword":"in dien dag","tekst":"Namelijk mijner ontbinding, en ten volle in den dag des laatsten oordeels, gelijk 1Co 1:8; 2Co 1:14; 2Ti 1:12, 2Ti 1:18."},{"catchword":"geven zal; en niet","tekst":"Grieks wedergeven; namelijk tot een genadige vergelding."},{"catchword":"Zijn verschijning","tekst":"Zie vs.1."},{"catchword":"liefgehad hebben","tekst":"Dat is, die bewust zijnde van hun oprechtheid, naar deze verlangd hebben, met verzekering en vertrouwen, dat zij dan niet veroordeeld zullen worden, maar de kroon des levens zullen ontvangen."}],"9":[{"catchword":"haastelijk tot mij te komen","tekst":"Dat is, nog voor den winter, vs.21."}],"10":[{"catchword":"heeft mij verlaten,","tekst":"Dat is, van hier vertrokken, scheidende uit den dienst, dien hij hier met mij deed in het prediken. Zie Phm 1:24."},{"catchword":"wereld liefgekregen,","tekst":"Grieks eeuw; dat is, het gemak dezes levens zoekende, om arbeid en gevaar te ontgaan, of om zijn tijdelijke zaken te verzorgen; waaruit dan niet volgt, dat hij ganselijk van het geloof zou afgevallen zijn."},{"catchword":"Dalmátië","tekst":"Dit landschap is een deel van Illyricum, grenzende oostwaarts aan Macedonië, en west-en zuidwaarts aan de Adriatische zee."}],"11":[{"catchword":"Lukas is alleen met mij","tekst":"Zie van hem Col 4:14, en Phm 1:24."},{"catchword":"Markus mede,","tekst":"Deze was een neef van Barnabas, Col 4:10, genaamd Johannes en toegenaamd Markus, Act 12:12, Act 12:25, en Act 15:39. Zie ook van hem Phm 1:24; 1Pe 5:13."},{"catchword":"tot den dienst","tekst":"Namelijk des Evangelies, en niet zozeer om mij in het bijzonder te dienen."}],"12":[{"catchword":"Tychicus","tekst":"Zie van hem Act 20:4; Eph 6:21; Col 4:7; Tit 3:12."},{"catchword":"naar Efeze gezonden","tekst":"Namelijk om die kerk in uwe plaats te verzorgen."}],"13":[{"catchword":"Breng den reismantel","tekst":"Grieks phelonen. Lat. penulam; welke een mantel was, om in het reizen te gebruiken tegen regen en koude. Sommigen verstaan daardoor een koffertje, om boeken in te leggen."},{"catchword":"de boeken, inzonderheid","tekst":"Namelijk der heilige Schrift, of andere, handelende van Gods woord."},{"catchword":"de perkamenten","tekst":"Grieks membranas; een Latijns woord, betekenende enige dunne vellen van beesten, toebereid om op te schrijven, bij ons genoemd perkamenten, omdat zij eerst in de stad Pergamos zijn gevonden en bereid."}],"14":[{"catchword":"Alexander,","tekst":"Van dezen, zie 1Ti 1:20."},{"catchword":"de kopersmid, heeft mij","tekst":"Of, koperslager."},{"catchword":"veel kwaads betoond;","tekst":"Namelijk met lasteren en de gezonde leer tegen te staan, gelijk verklaard wordt vs.15."},{"catchword":"de Heere vergelde","tekst":"Dit is geen vervloeking uit een wraakgierig hart voortgekomen, tegen de leer van Christus, Mat 5:44, en ook van Paulus zelf, Rom 12:14, maar ook profetische dreiging uit een Goddelijken ijver tot Gods eer en ingeven des Heiligen Geestes, van de straf die hem genakende was, daar hij zich betoonde gans onbekeerlijk en verhard te zijn. Zie dergelijke Neh 4:4, enz.; Psa 5:11."}],"15":[{"catchword":"Van welken wacht gij","tekst":"Namelijk dat hij u ook dergelijk kwaad niet doe, of de gemeente geen schade doe."}],"16":[{"catchword":"eerste verantwoording","tekst":"Namelijk gedaan voor den Keizer Nero."},{"catchword":"niemand","tekst":"Namelijk van mijn medehelpers in den dienst des Woords, of die mij plachten te volgen en vergezellen. Het schijnt dat hij Lukas uitzondert, vs.11. Indien Petrus toen te Rome zou geweest zijn, gelijk voorgegeven wordt, zo zou dat een grote schande voor hem geweest zijn, hetwelk niet gelofelijk is."},{"catchword":"bij mij geweest,","tekst":"Namelijk om mij met raad, voorspraak, getuigenis, of anderszins te helpen."},{"catchword":"verlaten","tekst":"Dat is, alleen gelaten, niet vergezeld."},{"catchword":"Het worde hun niet toegerekend","tekst":"Dewijl zij dit uit zwakheid en vrees des gevaars gedaan hadden, zo bidt hij God voor hen, daar hij tevoren tegen den moedwilligen en verstokten Alexander gebeden heeft, vs.14; zie dergelijke Luk 23:34; Act 7:60."}],"17":[{"catchword":"bijgestaan, en","tekst":"Namelijk met de genade zijns Geestes, gelijk hij beloofd heeft, Luk 21:14-15. Of, heeft gestaan bij mij, gelijk Act 27:23, en mij vertroost en versterkt."},{"catchword":"heeft mij bekrachtigd;","tekst":"Namelijk met wijsheid, voorzichtigheid en kloekmoedigheid."},{"catchword":"opdat men door mij","tekst":"Of, opdat door mij de prediking vervuld zou worden. Zie vs.5."},{"catchword":"alle heidenen dezelve","tekst":"Dat is, opdat ik nog tijd en gelegenheid zou hebben om het Evangelie onder de heidenen, wier apostel ik ben, Rom 11:13, verder te verbreiden."},{"catchword":"uit de muil des leeuws verlost","tekst":"Dat is, uit een groot en tegenwoordig gevaar des doods, gelijk daarin zijn degenen, die reeds in den muil en de kaken van een wreden leeuw zijn geraakt, Psa 22:22, en Psa 58:7. Anderen verstaan door den leeuw den keizer Nero, die om zijn wreedheid zo wordt genoemd, gelijk doorgaans de tirannen en vijanden der Kerk, Psa 35:17, en Psa 91:13; Pro 28:15; Jer 2:15, en Jer 4:7. Zo noemt Christus den koning Herodes om zijn loosheid een vos; Luk 13:32."}],"18":[{"catchword":"zal mij verlossen","tekst":"Dat is, ik ben daarvan verzekerd uit Zijne beloften; Psa 34:20, en Psa 41:3, en Psa 55:23."},{"catchword":"van alle boos werk,","tekst":"Dat is, van verzaking of krenking der waarheid en vertwijfeling aan zijn hulp."},{"catchword":"tot Zijn hemels Koninkrijk;","tekst":"Dat is, totdat hij het eindelijk zal geven."},{"catchword":"in alle eeuwigheid","tekst":"Grieks in eeuwigheden der eeuwigheden."}],"19":[{"catchword":"Priska en Aquila,","tekst":"Zie van dezen, Act 18:2; Rom 16:3."},{"catchword":"Onesiforus","tekst":"Zie van dezen, 2Ti 1:16."}],"20":[{"catchword":"Erastus is te Korinthe","tekst":"Zie van hem, Act 19:22; Rom 16:23."},{"catchword":"Trófimus","tekst":"Zie van hem, Act 20:4, en Act 21:29."},{"catchword":"te Miléte","tekst":"Zie van deze stad, Act 20:15, Act 20:17."}],"22":[{"catchword":"met uwen geest","tekst":"Dat is, geve u zijne genade, voornamelijk naar de ziel."},{"catchword":"ulieden","tekst":"Dat is, niet alleen met u Timotheüs, maar ook met alle gelovigen te Efeze."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"I testify therefore before God [that is entreat exhort thee for God sake I adhere thee before God that is I take God to witness that I seriously exhort thee see the like 1Timothy 5.21 ]and the Lord Jesus Christ who shall judge ]he sets the last judgment before him that he and we all must be stirred up all to faithfulness in our administration as who must then give account of the same see 2 Corinthians 5.10,11 ] the quick[that is who shall found alive when Christ shall come to judgment see 1 Corinthians 1Co 15:51 1Thessalonians 4 verse 16,17]and dead [that is who shall be dead before and raised up again job 5verse 28,29 Revelations 20. 12 ] in his appearing [namely in the clouds with the angels and with the glory of his father to judgment ]and in his kingdom [namely of glory.]"}],"2":[{"catchword":null,"tekst":"Preach [this word signifies properly to publish anything with a loud voice as criers do see Isa 40:9] the word [namely of the gospel ] be instant [Gr stand on namely with continual teaching and exhorting ]in season [thereby Paul meanest not that Timothy and other preachers should use incivility but that they must hold on continuously and zealously without neglecting any time or opportunity although it be not so fit for themselves or sometimes also the hearers should think that it is not so convenient for them to hear exhortations ] confute[ namely the errors of those that yet know not or assent not to the truth ]reprove [namely those that are of evil or disorderly life] exhort[ namely to the practice of many Christians virtues or comfort namely weak and dejected persons ] in all long suffering [that is without harshness or bitterness enduring patiently the ignorance and indiscretion of men see Galatians 6.1, 2Timothy2.24] doctrine [that is so that the chief points of doctrine may always be clearly and expressly propounded ]"}],"3":[{"catchword":null,"tekst":"For they will be a time when they will endure [that is not only receive but they will not suffer the same to be propounded to them ]the sound doctrine [namely of the holy gospel see chapter 1.13 ]but being ticklish of hearing [that is having a heart and ears that itch after somewhat that is new and strange ]they shall gather up teachers to themselves or hear up that is set up or chose up one after another who may teach them somethi // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
