men en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;","10":"Doch nu geopenbaard is door de verschijning van onze Zaligmaker Jezus Christus, Die de dood tenietgedaan heeft, en het leven en de onvergankelijkheid aan het licht gebracht heeft door het Evangelie;","11":"Waartoe ik gesteld ben als prediker, en apostel, en leraar van de heidenen;","12":"Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij *Hem* weggelegd, te bewaren tot die dag.","13":"Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.","14":"Bewaar het goede pand, dat *u* toevertrouwd is, door de Heilige Geest, Die in ons woont.","15":"U weet dit, dat allen die in Azië zijn zich van mij afgewend hebben; onder hen zijn Fygellus en Hermogenes.","16":"De Heere geve het huis van Onesiforus barmhartigheid; want hij heeft mij dikwijls verkwikt, en heeft zich niet geschaamd voor mijn keten.","17":"Maar toen hij in Rome gekomen was, heeft hij mij zeer ijverig gezocht, en heeft *mij* gevonden.","18":"De Heere geve hem, dat hij barmhartigheid vindt bij de Heere, op die dag; en hoezeer hij *mij* in Efeze gediend heeft, weet u zeer goed."},"SV":{"1":"Paulus, een apostel van Jezus Christus, door den wil van God, naar de belofte des levens, dat in Christus Jezus is,","2":"Aan Timotheüs, *mijn* geliefden zoon: genade, barmhartigheid, vrede zij *u* van God den Vader, en Christus Jezus, onzen Heere.","3":"Ik dank God, Wien ik diene van *mijn* voorouderen aan in een rein geweten, gelijk ik zonder ophouden uwer gedachtig ben in mijn gebeden nacht en dag;","4":"Zeer begerig zijnde om u te zien, als ik gedenk aan uw tranen, opdat ik met blijdschap moge vervuld worden;","5":"Als ik mij in gedachtenis breng het ongeveinsd geloof, dat in u is, hetwelk eerst gewoond heeft in uw grootmoeder Lois, en in uw moeder Eunice; en ik ben verzekerd, dat het ook in u *woont*.","6":"Om welke oorzaak ik u indachtig maak, dat gij opwekt de gave Gods, die in u is, door de oplegging mijner handen.","7":"Want God heeft ons niet gegeven een geest der vreesachtigheid, maar der kracht, en der liefde, en der gematigdheid.","8":"Schaam u dan niet der getuigenis onzes Heeren, noch mijns die Zijn gevangene ben; maar lijd verdrukkingen met het Evangelie, naar de kracht Gods;","9":"Die ons heeft zalig gemaakt, en geroepen met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, voor de tijden der eeuwen;","10":"Doch nu geopenbaard is door de verschijning van onzen Zaligmaker Jezus Christus, Die den dood heeft te niet gedaan, en het leven en de onverderfelijkheid aan het licht gebracht door het Evangelie;","11":"Waartoe ik gesteld ben een prediker, en een apostel, en een leraar der heidenen;","12":"Om welke oorzaak ik ook deze dingen lijde, maar word niet beschaamd; want ik weet, Wien ik geloofd heb, en ik ben verzekerd, dat Hij machtig is, mijn pand, bij *Hem* weggelegd, te bewaren tot dien dag.","13":"Houd het voorbeeld der gezonde woorden, die gij van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.","14":"Bewaar het goede pand, dat *u* toebetrouwd is, door den Heiligen Geest, Die in ons woont.","15":"Gij weet dit, dat allen, die in Azië zijn, zich van mij afgewend hebben; onder dewelke is Fygellus en Hermogenes.","16":"De Heere geve den huize van Onesiforus barmhartigheid; want hij heeft mij dikmaals verkwikt, en heeft zich mijner keten niet geschaamd.","17":"Maar als hij te Rome gekomen was, heeft hij mij zeer naarstiglijk gezocht, en heeft *mij* gevonden.","18":"De Heere geve hem, dat hij barmhartigheid vinde bij den Heere, in dien dag; en hoeveel hij *mij* te Efeze gediend heeft, weet gij zeer wel."},"KJV":{"1":"Paul, an apostle of Jesus Christ by the will of God, according to the promise of life which is in Christ Jesus,","2":"To Timothy, my dearly beloved son: Grace, mercy, and peace, from God the Father and Christ Jesus our Lord.","3":"I thank God, whom I serve from my forefathers with pure conscience, that without ceasing I have remembrance of thee in my prayers night and day;","4":"Greatly desiring to see thee, being mindful of thy tears, that I may be filled with joy;","5":"When I call to remembrance the unfeigned faith that is in thee, which dwelt first in thy grandmother Lois, and thy mother Eunice; and I am persuaded that in thee also.","6":"Wherefore I put ➔ thee in remembrance that thou stir up the gift of God, which is in thee by the putting on of my hands.","7":"For God hath ➔ not given us the spirit of fear; but of power, and of love, and of a sound mind.","8":"Be ➔ not thou ➔ therefore ashamed of the testimony of our Lord, nor of me his prisoner: but be thou partaker of the afflictions of the gospel according to the power of God;","9":"Who hath saved us, and called us with an holy calling, not according to our works, but according to his own purpose and grace, which was given us in Christ Jesus before the world began,","10":"But is ➔ now made manifest by the appearing of our Saviour Jesus Christ, who hath abolished death, and hath brought ➔ life and immortality to light through the gospel:","11":"Whereunto I am appointed a preacher, and an apostle, and a teacher of the Gentiles.","12":"For the which cause I ➔ also suffer these things: nevertheless I am ➔ not ashamed: for I know whom I have believed, and am persuaded that he is able to keep that which I have committed unto him against that day.","13":"Hold fast the form of sound words, which thou hast heard of me, in faith and love which is in Christ Jesus.","14":"That good thing which was committed unto thee keep by the Holy Ghost which dwelleth in us.","15":"This thou knowest, that all they which are in Asia be turned away from me; of whom are Phygellus and Hermogenes.","16":"The Lord give mercy unto the house of Onesiphorus; for he ➔ oft refreshed me, and was ➔ not ashamed of my chain:","17":"But, when he was in Rome, he sought ➔ me out very diligently, and found me.","18":"The Lord grant unto him that he may find mercy of the Lord in that day: and in how many things he ministered unto me at Ephesus, thou knowest very well."}},"tsk":{"1":[{"kopje":"een","refs":["Rom 1:1","2 Kor 1:1"]},{"kopje":"de belofte","refs":["Joh 5:24","Joh 5:39","Joh 5:40","Joh 6:40","Joh 6:54","Joh 10:28","Joh 17:3","Rom 5:21","Rom 6:23","2 Kor 1:20","Ef 3:6","Tit 1:2","Hebr 9:15","2 Petr 1:3","2 Petr 1:4","1 Joh 2:25","1 Joh 5:11-13"]}],"2":[{"kopje":"Timotheüs","refs":["1 Tim 1:2","Rom 12:19","Fil 4:1"]},{"kopje":"genade","refs":["Rom 1:7"]}],"3":[{"kopje":"Ik dank","refs":["Rom 1:8","Ef 1:16"]},{"kopje":"Wie","refs":["2 Tim 1:5","2 Tim 3:15","Hand 22:3","Hand 24:14","Hand 26:4","Hand 27:23","Gal 1:14"]},{"kopje":"met","refs":["Hand 23:1","Hand 24:16","Rom 1:9","Rom 9:1","2 Kor 1:12","1 Tim 1:5","1 Tim 1:19","Hebr 13:8"]},{"kopje":"zoals","refs":["Rom 1:9","1 Tess 1:2","1 Tess 1:3","1 Tess 3:10"]},{"kopje":"nacht","refs":["Luk 2:37"]}],"4":[{"kopje":"Zeer begerig","refs":["2 Tim 4:9","2 Tim 4:21","Rom 1:11","Rom 15:30-32","Fil 1:8","Fil 2:26","1 Tess 2:17-20","1 Tess 3:1"]},{"kopje":"vervuld mag worden","refs":["Hand 20:19","Hand 20:31","Hand 20:37","Hand 20:38","Openb 7:17","Openb 21:4"]},{"kopje":"vervuld mag worden","refs":["Ps 126:5","Jes 61:3","Jer 31:13","Joh 16:22","Joh 16:24","1 Joh 1:4"]}],"5":[{"kopje":"Als ik mij in herinnering breng","refs":["Ps 77:7"]},{"kopje":"ongeveinsde","refs":["Ps 17:1","Ps 18:45","Ps 66:3","Ps 81:16","Jer 3:10","Joh 1:48","2 Kor 6:6","1 Tim 1:5","1 Tim 4:6","1 Petr 1:22"]},{"kopje":"uw moeder","refs":["Ps 22:11","Ps 86:16","Ps 116:16","Hand 16:1"]},{"kopje":"ik ben","refs":["2 Tim 1:12","Hand 26:26","Rom 4:21","Rom 8:38","Rom 14:5","Rom 14:14","Rom 15:14","Hebr 6:9","Hebr 11:13"]}],"6":[{"kopje":"herinner ik u eraan","refs":["2 Tim 2:14","Jes 43:26","1 Tim 4:6","2 \"G1096\">was</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G4516\">Rome,</span> he <span class=\"wl wl-kjv\" data-code=\"G2212\">sought</span> ➔ <span class=\"wl wl-kjv\" data-code=\"G3165\">me</span> <span class=\"wl wl-kjv\" data-code=\"G2212\">out</span> very <span class=\"wl wl-kjv\" data-code=\"G4706\">diligently,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2147\">found</span> me.","18":"The <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G1325\">grant</span> unto <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> that he may <span class=\"wl wl-kjv\" data-code=\"G2147\">find</span> <span class=\"wl wl-kjv\" data-code=\"G1656\">mercy</span> <span class=\"wl wl-kjv\" data-code=\"G3844\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G1565\">that</span> <span class=\"wl wl-kjv\" data-code=\"G2250\">day:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> in how many <span class=\"wl wl-kjv\" data-code=\"G3745\">things</span> he ministered unto <span class=\"wl wl-kjv\" data-code=\"G1247\">me</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">at</span> <span class=\"wl wl-kjv\" data-code=\"G2181\">Ephesus,</span> <span class=\"wl wl-kjv\" data-code=\"G4771\">thou</span> <span class=\"wl wl-kjv\" data-code=\"G1097\">knowest</span> very <span class=\"wl wl-kjv\" data-code=\"G957\">well.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"door den wil van God,","tekst":"Dat is, die van God zelf, naar Zijn believen, tot het apostelschap verkoren en beroepen ben. Zie Rom 1:1; Gal 1:1, Gal 1:15."},{"catchword":"naar de belofte des levens,","tekst":"Dat is, om te verkondigen het Evangelie, waarin voorgesteld wordt de belofte des eeuwigen levens, die God gedaan heeft aan al degenen diein Christus Jezus geloven. Zie Rom 1:2, Rom 1:16; Tit 1:1-3."}],"2":[{"catchword":"Aan Timótheüs,","tekst":"Van dezen zie Act 16:1; Rom 16:21; 1Co 4:17; 2Co 1:1; Phi 2:19; 1Ti 1:2, en doorgaans in de Handelingen der apostelen, en in de zendbrieven van Paulus."},{"catchword":"zoon","tekst":"genade, Grieks kind; zie 1Ti 1:2. Zo noemt hem de apostel, die nu een oud man was, Phm 1:9, omdat hij nog jong was, 1Ti 4:12, en omdat hij hem door het Evangelie had gebaard, en jegens hem vaderlijk gezind was, gelijk het woord geliefde ook te kennen geeft."}],"3":[{"catchword":"Ik dank God,","tekst":"Aldus kan dit ook overgezet worden uit vergelijking van deze plaats met Rom 1:8-10. Ik dank God voor u. En God is mijn getuige, dien ik diene, enz. hoe ik zonder ophouden uwer gedachtig ben, enz. Of deze woorden: ik dank God, kunnen gevoegd worden bij vs.5."},{"catchword":"van mijn voorouderen aan","tekst":"Dat is, naar het voorbeeld der heilige patriarchen, profeten en gelovige Joden in het Oude Testament, van wie ik afkomstig ben. Zie Act 22:3; 2Co 11:22; Phi 3:5."},{"catchword":"in een rein geweten,","tekst":"Dat is, gereinigd zijnde door den Heiligen Geest en het bloed van Jezus Christus; Heb 9:14, en Heb 10:22. Hetwelk moet verstaan worden van den tijd zijner bekering; hoewel hem enigszins een goed geweten kan toegeschreven worden voor zijne bekering, om de redenen verklaard; Act 23:1."}],"4":[{"catchword":"tranen, opdat ik","tekst":"Namelijk die gij om mijnentwil dikwijls gestort heb, horende van mijn verdrukkignen, en voornamelijk toen gij van mij scheiddet. Zie Act 20:37-38."},{"catchword":"met blijdschap","tekst":"Namelijk als ik u weder zal mogen zien."}],"5":[{"catchword":"Als ik mij in gedachtenis","tekst":"Grieks gedachtenis nemende van uw geloof."},{"catchword":"ongeveinsd geloof,","tekst":"Dit wist de apostel uit menigvuldige ervaring zijner oprechtheid."},{"catchword":"gewoond heeft in uw","tekst":"Dat is, altijd en gedurig in haar is geweest, en gelijk als een vaste woonstede in haar hart genomen had."},{"catchword":"grootmoeder Loïs,","tekst":"Namelijk vanwege uwe moeder. Want zijn vader was van Griekse of heidense afkomst en godsdienst. Zie Act 16:1."},{"catchword":"Eunice; en","tekst":"Die een gelovige Joodse vrouw wordt genoemd; Act 16:1."},{"catchword":"ik ben verzekerd,","tekst":"Namelijk door al de overvloedige betoningen van de oprechtheid uws geloofs, die niet toelaten enigszins daaraan te twijfelen."}],"6":[{"catchword":"opwekt","tekst":"Het Griekse woord anazopyrein, hetwelk de apostel hier gebruikt, betekent eigenlijk een klein vuur, dat bijna uitgegaan is, of onder de as geraakt, door blazen wederom levend en brandend maken; een zeer geschikte gelijkenis, waardoor aangewezen wordt, dat zo ook de gaven des Heiligen Geestes door bidden, aanhouden in het lezen en vlijtige bediening onzer roeping, vermeerderd en als brandende gemaakt worden."},{"catchword":"de gave Gods,","tekst":"Zie 1Ti 4:14."},{"catchword":"die in u is, door de oplegging","tekst":"Dat is, die ik met deze plechtigheid van de oplegging der handen te kennen heb gegeven, door de werking des Heiligen Geestes in u te zijn; en die, door de krachtige gebeden der gemeente bij deze ceremonie gevoegd, van God in u nog zullen vermeerderd worden."},{"catchword":"mijner handen","tekst":"In den eersten zendbrief, 1Ti 4:14, zegt de apostel des ouderlingschaps; hetwelk beide waar is, daar de apostel Paulus hem de handen heeft opgelegd in tegenwoordigheid en uit naam van de ganse vergadering der ouderlingen, als zijnde de voornaamsten onder dezen en bovendien een apostel."}],"7":[{"catchword":"een geest der vreesachtigheid,","tekst":"Dat is, ene beweging des harten en des gemoeds, die, als zij kwaad is, van den bozen, en als zij goed is, van den Heiligen Geest in de mensen gewrocht wordt, en daarom Geest genaamd wordt."},{"catchword":"der kracht, en der liefde,","tekst":"Dat is, der sterkte en kloekmoedigheid des harten in het bedienen van ons ambt, midden onder alle vijanden, gevaren en verdrukkingen."},{"catchword":"der gematigdheid","tekst":"Grieks sophronismou; waardoor eigenlijk verstaan wordt een gematigd of gezond verstand, hetwelk bij de kloekmoedigheid moet gevoegd worden, opdat deze niet in roekeloosheid, tieren, razen en onbescheidenheid verandere."}],"8":[{"catchword":"der getuigenis onzes Heeren,","tekst":"Dat is, de leer des Evangelies, waarin getuigd wordt wie onze Heere en Zaligmaker is, en hoe de Heere Zijne macht, wijsheid, rechtvaardigheid en barmhartigheid aan de mensen betoont. Zie Psa 19:8, en Psa 119:2; 1Co 1:6, en 1Co 2:1."},{"catchword":"Zijn gevangene ben; maar lijd","tekst":"Dat is, om Zijnentwil gevangen."},{"catchword":"verdrukkingen met het Evangelie,","tekst":"Dat is, die het Evangelie zelf, en om des Evangelies wil onderworpen zijn al degenen, die het prediken, aannemen en belijden; 2Ti 3:12."},{"catchword":"naar de kracht Gods;","tekst":"Dat is, naar dat u God sterkte verleent, om die verdrukkingen lijdzaam en standvastig te verdragen. Dit doet hij daarbij, opdat wij zulks niet aan onze eigene krachten toeschrijven; zie Phi 1:29; 1Ti 1:12."}],"9":[{"catchword":"zalig gemaakt, en","tekst":"Namelijk door Zijnen Zoon Jezus Christus."},{"catchword":"geroepen","tekst":"Namelijk uiterlijk door de prediking des Evangelies, en inwendig door de krachtige werking Zijns Geestes."},{"catchword":"met een heilige roeping;","tekst":"Dat is, die in zichzelf heilig is, en die ons roept tot heiligheid; Luk 1:75; Eph 1:4; Col 1:22."},{"catchword":"niet naar onze werken,","tekst":"Namelijk die als een voorgaande of voorgeziene oorzaak deze roeping zouden verdienen, of God daartoe zouden hebben bewogen; zie Rom 9:11; Eph 2:9; Tit 3:5."},{"catchword":"maar naar Zijn eigen voornemen en","tekst":"Dat is, naar dat het hem beliefd en behaagd heeft van eeuwigheid, bij zichzelf, over ons te besluiten; zie Rom 8:28, en Rom 9:11; Eph 1:11, en Eph 3:11."},{"catchword":"genade,","tekst":"Dat is, genadig voornemen, welks enige en eerste bewegende oorzaak is de onverdiende genade en barmhartigheid Gods; Rom 6:23, en Rom 11:5-6; Gal 1:15; Eph 1:6; Tit 3:7."},{"catchword":"die ons gegeven is","tekst":"Dat is, die God in Zijn raad voorgenomen en besloten heeft ons te geven. Zie dergelijke Joh 17:24; want deze genade is ons metterdaad niet van eeuwigheid, maar in der tijd gegeven, wanneer wij geroepen worden; maar wordt zo gezegd, omdat deze werkelijke schenking geschiedt, naar dat eeuwig voornemen Gods, hetwelk zo vast is alsof het reeds volbracht ware."},{"catchword":"in Christus Jezus,","tekst":"Dat is, om derzelver vruchten door Jezus Christus te verkrijgen. Zie verder Eph 1:4."},{"catchword":"voor de tijden der eeuwen;","tekst":"Dat is, van eeuwigheid, of, gelijk hij elders spreekt, voor de grondlegging der wereld; Eph 1:4."}],"10":[{"catchword":"de verschijning van","tekst":"Namelijk in het vlees, in Zijne eerste komst."},{"catchword":"den dood heeft","tekst":"Namelijk de eeuwige dood."},{"catchword":"te niet gedaan, en","tekst":"Namelijk door Zijn dood; Heb 2:14. Versta, ten aanzien van de gelovigen, die door Hem daarvan verlost en bevrijd zijn. Want op de ongelovigen blijft de toorn Gods; Joh 3:36."},{"catchword":"het leven en de onverderfelijkheid","tekst":"Namelijk het eeuwige leven, gelijk het volgende woord onverderfelijkheid, ter verklaring bijgevoegd, aantoont."},{"catchword":"aan het licht gebracht","tekst":"Dat is, teweeggebracht door zijn verdiensten, en tevoorschijn gebracht of bekend gemaakt door de prediking des Evangelies."}],"11":[{"catchword":"Waartoe ik","tekst":"Dat is, om dit Evangelie te prediken, voornamelijk onder de heidenen."},{"catchword":"gesteld ben een prediker,","tekst":"Namelijk van God, die mij daartoe afgezonderd, geroepen en verordineerd heeft. Zie Act 13:2; Rom 1:1; Gal 1:1."}],"12":[{"catchword":"deze dingen lijde,","tekst":"Dat is, deze verdrukkingen en banden."},{"catchword":"niet beschaamd; want","tekst":"Of, ik schaam mij des niet."},{"catchword":"Wien ik geloofd heb,","tekst":"Dat is, op wiens toezeggingen ik vertrouwd heb."},{"catchword":"machtig is,","tekst":"Dat is, dat hij niet alleen den wil heeft, hetwelk uit zijne toezeggingen blijkt, maar ook de macht om die te volbrengen."},{"catchword":"mijn pand, bij Hem","tekst":"Dat is, de eeuwige gelukzaligheid en heerlijkheid, die God zijnen kinderen en getrouwen dienaren beloofd heeft, en van Hem in den hemel als een toevertrouwd pand voor hen weggelegd is, en getrouw bewaard wordt."},{"catchword":"dien dag","tekst":"Namelijk der toekomst van Christus ten oordeel, wanneer hij het hun zal geven om werkelijk en eeuwig te bezitten."}],"13":[{"catchword":"Houd het voorbeeld","tekst":"Dat is, houd altijd in uwen zin een kort begrip der gezonde leer, waarin de voornaamste hoofdstukken daarvan in het kort gelijk als ontworpen en afgebeeld zijn, waarnaar gij uwe leringen moogt richten. Of, gelijk sommigen uitleggen, laat de gezonde woorden, dat is, de gezonde leer, die gij van mij gehoord hebt, en de manier, die ik in het leren houd, u een voorschrift zijn, hetwelk gij in het leren volgt."},{"catchword":"in geloof en liefde,","tekst":"Dit zijn twee hoofdstukken, waartoe al de artikelen of stukken der gezonde leer gebracht kunnen worden, en waarin deze begrepen zijn. Zie Tit 3:8."},{"catchword":"die in Christus Jezus is","tekst":"Dat is, welk geloof Christus Jezus tot een fondament heeft, en welke liefde om Christus' wil betoond moet worden. Zie 1Ti 1:14."}],"14":[{"catchword":"het goede pand,","tekst":"Namelijk der gezonde leer. Zie 1Ti 6:20."},{"catchword":"dat u toebetrouwd is,","tekst":"Namelijk van God, om wel te bewaren, en anderen zuiver en getrouw mede te delen."},{"catchword":"door den Heiligen Geest,","tekst":"Dit doet hij daarbij, opdat Timotheüs deze bewaring niet zichzelf, of aan zijne krachten zou toeschrijven, daar dit in ons een werk en gave des Heiligen Geestes is; Rom 15:13; 1Co 12:3."},{"catchword":"Die in ons woont","tekst":"Zie Rom 8:9, Rom 8:11; 1Co 3:16."}],"15":[{"catchword":"allen, die in Azië zijn,","tekst":"Dat is, meest alle dienaars des Evangelies, die òf van Azië zijn, òf nu in Azië, te Efeze en elders zich ophouden. Zie de aantekeningen op Act 20:4."},{"catchword":"afgewend hebben;","tekst":"Dat is, verlaten hebben, zonder mij in mijn dienst, of verantwoording bij te staan. Dergelijke klachten zie 2Ti 4:10, 2Ti 4:16."}],"16":[{"catchword":"den huize van Onesiforus","tekst":"Dat is, het ganse huisgezin, hetwelk des huisvaders goed voorbeeld, om Paulus te verkwikken, zonder twijfel nagevolgd heeft."},{"catchword":"barmhartigheid;","tekst":"Dat is, alles goeds naar lichaam en ziel, hetwelk zo genoemd wordt, omdat God de mensen het niet uit verdiensten, maar uit genadige ontferming verleent. Zie 1Ti 1:2."},{"catchword":"verkwikt, en heeft zich","tekst":"Het Griekse woord betekent eigenlijk, heeft mij verkoeling gedaan; ene gelijkenis van degenen, die, verhit zijnde, door de verkoeling verkwikt worden. Zie Psa 39:14, en Psa 66:12; Act 3:19."},{"catchword":"mijner keten niet geschaamd","tekst":"Dat is, mijn vernederden staat in mijn gevangenschap. Zie van deze keten de aantekeningen Act 28:16."}],"17":[{"catchword":"gezocht, en heeft mij gevonden","tekst":"Namelijk alzo Rome een zeer grote stad was en vol volks uit de gehele wereld."}],"18":[{"catchword":"dat hij barmhartigheid","tekst":"Zie vs.16."},{"catchword":"bij den Heere,","tekst":"Dat is, bij Hem, die onze Heere en Rechter is."},{"catchword":"in dien dag;","tekst":"Namelijk als deze Heere de levenden en doden zal oordelen, en de straffen en de beloningen zal uitdelen."},{"catchword":"te Efeze gediend heeft,","tekst":"Namelijk boven den dienst, dien Hij mij daarna hier te Rome heeft bewezen."},{"catchword":"zeer wel","tekst":"Grieks beter."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Paul an apostle of Jesus Christ by the will of God [that is who by God himself according to his pleasure am chosen and called to the apostleship see Rom 1:1 and Galatians 11,15]according to the promise of life which is in Christ Jesus[that is to preach the gospel that is propounded the promise of eternal life which God made to all them who believe in Jesus Christ see Romans 1.verse 2,16 Titus 1 verse 1,2,3]"}],"2":[{"catchword":null,"tekst":"To Timothy [of him see Act 16:1 Rom 16:21 1corinthians 4.17 2Co 1:1 Php 2:19 1Timothy 1.2 and every where in the Acts of the apostle in the epistle of Paul ][my beloved son Gr child see 1Timothy 1.2 so the apostle calls himself being now an old man Philemon verse 9 because he was yet young 1Timothy 4.12 and because he had begotten him by the gospel and had a fatherly affection towards as the word beloved imports ]grace mercy peace be to thee from God the father and Christ Jesus our Lord"}],"3":[{"catchword":null,"tekst":"I thank God [this may also be translated by comparing this place with Romans 1 verse 8,9,10 I thank God for thee and God is my witness whom I serve &c how without ceasing I am a mind full of thee 7c or these words I thank God may be joined to the verse 5 following] whom I serve from my forefathers [that is after the example of the holy Patriarchy ,prophets and believing Jews in old testament from whom I am descended see Act 22:23 2Co 11:21 Php 3:5] in a pure conscience [that is being purified by the holy ghost and the blood of Jesus Christ Heb 9:14 and 10.22 which must be understood of the time after his conversion although a good conscience may also be ascribed to him in some sense before conversion for the reasons declared Act 23:1]even as without ceasing I am mindful of thee in my prayers night and day"}],"4":[{"catchword":null,"tekst":"Being very desirous to see thee I remember thy tears [namely which thou hast often shed for my sake hearing of my tribulations ,especially when thou partedst from me see Act 20:37,38] that I am be filled with joy [that is when I may see thee again ]"}],"5":[{"catchword":null,"tekst":"When I call my remembrance [Gr taking remembrance of thy faith ]that is in thee [this the apostle knew by manifold experience of sincerity ]which dwelt first [that is was always and continually in her and had as it were taken a fixed habitation in her heart ]in thy grandmother Lois [namely by thy mother side for his father was of Greekish or gentile and religion see Act 16:1] and thy mother Eunice who is called a believing Jewestle Act 16:1] and I am assured [namely by all abundant evidences of faith which do not suffer me anywhere to doubt thereof ] that is dwelleth in thee also"}],"6":[{"catchword":null,"tekst":"for which cause I put in remembrance that thou stir up [the Greek word anazopyrein which the apostle here useth properly signifies by blowing to revive a little fire which is almost gone out or raked under the ashes and make it burn again a very fit similitude whereby is shewed that also the gifts of the holy ghosts by prayer continuing in reading and diligent administration of our calling are increased and made to burn as it were [the gift of God see 1Timothy 4.24]which is thee by laying on [that is which by this ceremony of imposition of hands I made known to be in thee by the operation of the holy ghost which is through the powerful prayers of the church joined with ceremony shall by God be still increased in thee ]of my hands [in the first epistle chapter 4.14the apostle saith of the eldership both which are true seeing the apostle Paul unposed hands in him in presence the name of the whole assemble of the elders as being the principal among them and besides that an apostle ]"}],"7":[{"catchword":null,"tekst":"For God not given us a spirit [that is a motion of the heart and of the mind which if it be evil is wrought in men by the wicked one and if it be good by the holy spirit and from thence is called spirit]of fearfulness but of power [that is of strength and courage of heart in the administration of our office in the midst of all enemies perils and tribulations ] and of // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

  const MAX_CW = 60;

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
