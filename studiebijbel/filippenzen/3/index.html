id die uit God is door het geloof;","10":"Opdat ik Hem ken, en de kracht van Zijn opstanding, en de gemeenschap met Zijn lijden, gelijkvormig wordend aan Zijn dood;","11":"Of ik op enige manier mag komen tot de opstanding van de doden.","12":"Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben.","13":"Broeders, ik acht niet dat ik het zelf al gegrepen heb.","14":"Maar één ding *doe ik*: ik vergeet wat achter is, en strek mij uit naar wat voor is, en jaag naar het doel, naar de prijs van de roeping van God van boven in Christus Jezus.","15":"Laten wij dan, zovelen als wij volmaakt zijn, dit gevoelen; en als u ergens anders over denkt, ook dat zal God u openbaren.","16":"Maar, tot waar wij gekomen zijn, laten wij daarin naar dezelfde regel wandelen, laten wij hetzelfde gevoelen.","17":"Weest samen mijn navolgers, broeders, en let op degenen die zo wandelen, zoals u ons tot een voorbeeld hebt.","18":"Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;","19":"Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.","20":"Maar onze wandel is in de hemelen, waaruit wij ook de Zaligmaker verwachten, *namelijk* de Heere Jezus Christus;","21":"Die ons vernederde lichaam veranderen zal, opdat het gelijkvormig wordt aan Zijn heerlijk lichaam, naar de werking waardoor Hij ook alle dingen aan Zichzelf kan onderwerpen."},"SV":{"1":"Voorts, mijn broeders, verblijdt u in den Heere. Dezelfde dingen aan u te schrijven, is mij niet verdrietig, en het is u zeker.","2":"Ziet op de honden, ziet op de kwade arbeiders, ziet op de versnijding.","3":"Want wij zijn de besnijding, wij, die God in den Geest dienen, en in Christus Jezus roemen, en niet in het vlees betrouwen.","4":"Hoewel ik heb, dat ik ook in het vlees betrouwen mocht; indien iemand anders meent te betrouwen in het vlees, ik nog meer.","5":"Besneden ten achtsten dage, uit het geslacht van Israël, van den stam van Benjamin, een Hebreër uit de Hebreën, naar de wet een Farizeër;","6":"Naar den ijver een vervolger der Gemeente; naar de rechtvaardigheid, die in de wet is, zijnde onberispelijk.","7":"Maar hetgeen mij gewin was, dat heb ik om Christus’ wil schade geacht.","8":"Ja, gewisselijk, ik acht ook alle dingen schade te zijn, om de uitnemendheid der kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen schade gerekend heb, en acht die drek te zijn, opdat ik Christus moge gewinnen.","9":"En in Hem gevonden worde, niet hebbende mijn rechtvaardigheid, die uit de wet is, maar die door het geloof van Christus is, *namelijk* de rechtvaardigheid, die uit God is door het geloof;","10":"Opdat ik Hem kenne, en de kracht Zijner opstanding, en de gemeenschap Zijns lijdens, Zijn dood gelijkvormig wordende;","11":"Of ik enigszins moge komen tot de wederopstanding der doden.","12":"Niet dat ik het alrede gekregen heb, of alrede volmaakt ben; maar ik jaag er naar, of ik het ook grijpen mocht, waartoe ik van Christus Jezus ook gegrepen ben.","13":"Broeders, ik acht niet, dat ik zelf het gegrepen heb.","14":"Maar een ding *doe* *ik*, vergetende, hetgeen achter is, en strekkende mij tot hetgeen voor is, jaag ik naar het wit, tot den prijs der roeping Gods, die van boven is in Christus Jezus.","15":"Zovelen dan als wij volmaakt zijn, laat ons dit gevoelen; en indien gij iets anderszins gevoelt, ook dat zal u God openbaren.","16":"Doch, daar wij toe gekomen zijn, laat ons *daarin* naar denzelfden regel wandelen, laat ons hetzelfde gevoelen.","17":"Weest mede mijn navolgers, broeders, en merkt op degenen, die alzo wandelen, gelijk gij ons tot een voorbeeld hebt.","18":"Want velen wandelen *anders*; van dewelken ik u dikmaals gezegd heb, en nu ook wenende zeg, dat zij vijanden des kruises van Christus zijn;","19":"Welker einde is het verderf, welker God is de buik, en *welker* heerlijkheid is in hun schande, dewelken aardse dingen bedenken.","20":"Maar onze wandel is in de hemelen, waaruit wij ook den Zaligmaker verwachten, *namelijk* den Heere Jezus Christus;","21":"Die ons vernederd lichaam veranderen zal, opdat hetzelve gelijkvormig worde aan Zijn heerlijk lichaam, naar de werking, waardoor Hij ook alle dingen Zichzelven kan onderwerpen."},"KJV":{"1":"Finally, my brethren, rejoice in the Lord. To write the same things to you, to me indeed *is* not grievous, but for you *it is* safe.","2":"Beware of dogs, beware of evil workers, beware of the concision.","3":"For we are the circumcision, which worship God in the spirit, and rejoice in Christ Jesus, and have no confidence in the flesh.","4":"Though I might also have confidence in the flesh. If any other man thinketh that he hath whereof he might trust in the flesh, I more:","5":"Circumcised the eighth day, of the stock of Israel, *of* the tribe of Benjamin, an Hebrew of the Hebrews; as touching the law, a Pharisee;","6":"Concerning zeal, persecuting the church; touching the righteousness which is in the law, blameless.","7":"But what things were gain to me, those I counted loss for Christ.","8":"Yea doubtless, and I count all things *but* loss for the excellency of the knowledge of Christ Jesus my Lord: for whom I have suffered the loss of all things, and do count them *but* dung, that I may win Christ,","9":"And be found in him, not having mine own righteousness, which is of the law, but that which is through the faith of Christ, the righteousness which is of God by faith:","10":"That I may know him, and the power of his resurrection, and the fellowship of his sufferings, being made conformable unto his death;","11":"If by any means I might attain unto the resurrection of the dead.","12":"Not as though I had already attained, either were already perfect: but I follow after, if that I may apprehend that for which also I am apprehended of Christ Jesus.","13":"Brethren, I count not myself to have apprehended: but *this* one thing *I do*, forgetting those things which are behind, and reaching forth unto those things which are before,","14":"I press toward the mark for the prize of the high calling of God in Christ Jesus.","15":"Let us therefore, as many as be perfect, be thus minded: and if in any thing ye be otherwise minded, God shall reveal even this unto you.","16":"Nevertheless, whereto we have already attained, let us walk by the same rule, let us mind the same thing.","17":"Brethren, be followers together of me, and mark them which walk so as ye have us for an ensample.","18":"(For many walk, of whom I have told you often, and now tell you even weeping, *that they are* the enemies of the cross of Christ:","19":"Whose end *is* destruction, whose God *is their* belly, and *whose* glory *is* in their shame, who mind earthly things.)","20":"For our conversation is in heaven; from whence also we look for the Saviour, the Lord Jesus Christ:","21":"Who shall change our vile body, that it may be fashioned like unto his glorious body, according to the working whereby he is able even to subdue all things unto himself."}},"tsk":{"1":[{"kopje":"Verder","refs":["Fil 4:8","2 Kor 13:11","Ef 6:10","1 Tess 4:1","1 Petr 3:8"]},{"kopje":"verblijd u","refs":["Fil 3:3","Fil 4:4","Deut 12:18","Deut 16:11","1 Sam 2:1","1 Kron 15:28","1 Kron 16:10","1 Kron 16:31-33","1 Kron 29:22","2 Kron 30:26","2 Kron 30:27","Neh 8:11","Job 22:26","Ps 5:12","Ps 32:11","Ps 33:1","Ps 37:4","Ps 42:5","Ps 97:1","Ps 100:1","Ps 100:2","Ps 149:2","Jes 12:2","Jes 12:3","Jes 41:16","Jes 61:10","Jes 65:14","Jes 66:11","Jes 66:12","Joël 2:23","Hab 3:17","Hab 3:18","Zef 3:14","Zef 3:17","Zach 10:7","Matt 5:12","Luk 1:47","Rom 5:2","Rom 5:3","Rom 5:11","1 Tess 5:16","Jak 1:2","1 Petr 1:6-8","1 Petr 4:13"]},{"kopje":"te schrijven","refs":["Fil 2:17","Fil 2:18","2 Petr 1:12-15","2 Petr 3:1"]}],"2":[{"kopje":"de honden","refs":["Spr 26:11","Jes 56:10","Jes 56:11","M am is, namelijk midden in de verdrukkingen."},{"catchword":"Dezelfde dingen","tekst":"Namelijk die ik u tevoren mondeling geleerd heb. Zie 2Th 2:15."},{"catchword":"is mij niet verdrietig,","tekst":"Of, is mij niet zwaar, moeilijk, vervelend."},{"catchword":"het is u zeker","tekst":"Dat is, het strekt en is dienstig tot uwe verzekering, om daardoor in de waarheid der Christelijke leer en in het geloof meer en meer bevestigd te worden."}],"2":[{"catchword":"Ziet op de honden,","tekst":"Dat is, let op de honden, en wacht u van de valse apostelen, die hij van dezen smadelijken naam van honden noemt, om hun aard uit te drukken, dat zij onbeschaamd de rechte leraars met hunne lasteringen aanblaffen en bijten."},{"catchword":"kwade arbeiders,","tekst":"Dat is, die wel veel arbeid en moeite aannemen, maar om een kwade en verderflijke leer den mensen in te planten."},{"catchword":"versnijding","tekst":"Dat is, die uit de besnijdenis zijn, daarop roemen, en leren dat de besnijdenis ter zaligheid nodig is. Hetwelk niet zozeer ene besnijding, als wel ene versnijding met recht mag genoemd worden. De apostel verandert hier zeer aardigljk het woord besnijding in versnijding, omdat deze valse leer dier apostelen de mensen die haar aannemen, van Christus afsnijdt, en hen ter verderve als in stukken versnijdt."}],"3":[{"catchword":"Want wij zijn","tekst":"Namelijk die onze gerechtigheid in Christus alleen zoeken en stellen, gelijk hierna verklaard wordt."},{"catchword":"de besnijding,","tekst":"Dat is, de rechte besnijding, die voor God geldt, welke is de inwendige besnijding des harten. Zie Rom 2:29."},{"catchword":"in den Geest dienen,","tekst":"Of, met den geest; dat is, inwendig met de ziel en het hart, Joh 4:24; Eph 6:18. Of, door de kracht des Heiligen Geestes."},{"catchword":"in Christus","tekst":"Namelijk dat wij in Hem en in Zijne gerechtigheid alleen onze zaligheid hebben; 1Co 1:30-31."},{"catchword":"het vlees betrouwen","tekst":"Dat is, op die uiterlijke ceremoniën der wet of uiterlijke besnijding des vleesches en onderhouding derzelve, om daardoor zalig te worden; en wordt gesteld tegen het woord, geest, tevoren gebruikt."}],"4":[{"catchword":"Hoewel ik heb,","tekst":"Grieks hoewel ik betrouwen heb ook in het vlees; dat is, hoewel ik ook stof heb aangaande die uiterlijke besnijding en andere ceremoniën der wet, mitsgaders de uiterlijke voordelen der Joden, om daarop te betrouwen, namelijk zo men zijn vertrouwen om zalig te worden daarop mocht stellen."},{"catchword":"iemand anders","tekst":"Namelijk van deze valse apostelen, die altijd op dat uiterlijke zeer roemden, en daarin hunne zaligheid zochten."},{"catchword":"ik nog meer","tekst":"Dat is, ik zou daarin nog meer stof hebben om te vertrouwen."}],"5":[{"catchword":"Besneden ten","tekst":"Grieks achtdaagse besnijdenis."},{"catchword":"naar de wet","tekst":"Dat is, ten aanzien van het verstand der wet; of, uit die drie secten, die onder het Joodse volk waren, Sadduceën, Esseën en Farizeën, was ik toegedaan de secte der Farizeën, die de allerbescheidenste wordt gehouden, Act 26:5."}],"6":[{"catchword":"Naar den ijver","tekst":"Namelijk voor de onderhouding van de ceremoniën der wet; waarin de valse apostelen ook zeer, doch verkeerdelijk, ijverden."},{"catchword":"der Gemeente;","tekst":"Namelijk der Christenen, die hunne zaligheid niet zochten in de werken der wet, maar in Christus alleen."},{"catchword":"die in de wet is,","tekst":"Dat is, die de wet uiterlijk van de mensen eist."},{"catchword":"zijnde onberispelijk","tekst":"Namelijk alzo dat de mensen mij niet konden bestraffen over enige moedwillige overtreding der wet, dewijl mijn uiterlijke werken aan de wet Gods gelijkvormig waren. Waardoor hij verklaart nochtans niet gerechtvaardigd te zijn."}],"7":[{"catchword":"mij gewin was,","tekst":"Grieks die mij winsten waren; dat is, dat ik in dien tijd mij nuttig en voordelig achtte te zijn ter zaligheid."},{"catchword":"schade geacht","tekst":"Dat is, daarentegen als schade aanbrengende verworpen."}],"8":[{"catchword":"ik acht ook","tekst":"Dat is, ik heb dat niet alleen zo geacht als ik eerst tot Christus bekeerd ben geweest, maar acht het als nog zo, en blijf bij dezelfde mening."},{"catchword":"alle dingen","tekst":"Namelijk door welke de mensen hunne zaligheid zoeken buiten Christus."},{"catchword":"der kennis","tekst":"Namelijk niet der blote kennis alleen, maar der zaligmakende kennis, die met vertrouwen en geloof vergezelschapt is, Joh 17:3; gelijk de woorden mijns Heeren ook te kennen geven."},{"catchword":"al die dingen","tekst":"Grieks alle dier dingen schade geleden hebben."},{"catchword":"drek te zijn,","tekst":"Het Griekse woord betekent eigenlijk dingen, die òf van de honden uitgeworpen, òf den honden voorgeworpen worden; dat is, vuile en verwerpelijke dingen."},{"catchword":"Christus moge gewinnen","tekst":"Dat is, de gerechtigheid van Christus deelachtig worden, hetwelk het grootste gewin is."}],"9":[{"catchword":"in Hem","tekst":"Dat is, in Zijne gemeenschap, Hem door het geloof ingelijfd en Zijne gerechtigheid deelachtig zijnde."},{"catchword":"gevonden worde,","tekst":"Namelijk in het gericht Gods."},{"catchword":"niet hebbende","tekst":"Dat is, mij niet verlatende op mijn eigen gerechtigheid."},{"catchword":"die uit de wet","tekst":"Dat is, die bestaat in volkomen onderhouding der wet, zo der zeden als der ceremoniën."},{"catchword":"die door het geloof","tekst":"Dat is, die men verkrijgt als men in Christus gelooft en Zijne gerechtigheid daardoor aanneemt, en die den gelovigen van God uit genade als hunne gerechtigheid wordt toegerekend."},{"catchword":"de rechtvaardigheid,","tekst":"Namelijk Christus."},{"catchword":"die uit God is","tekst":"Dat is, die God ons schenkt en genadiglijk toerekent; Rom 4:6."},{"catchword":"door het geloof;","tekst":"Grieks in; dat is, die wij verkrijgen en ons toeëigenen door het geloof, als door een geestelijk instrument, waardoor deze gerechtigheid aangenomen wordt."}],"10":[{"catchword":"Opdat ik","tekst":"Hiermede beschrijft hij het ware zaligmakende en rechtvaardigmakende geloof, waarin dat bestaat, waarop het ziet en wat het voorbrengt."},{"catchword":"Hem","tekst":"Namelijk Christus."},{"catchword":"kenne, en","tekst":"Zie vs.8."},{"catchword":"de kracht Zijner","tekst":"Dat is, de vruchten en weldaden, die Hij, door Zijnen dood ons verkregen hebbende, door Zijne opstanding krachtig toeëigent en toebrengt, namelijk onze rechtvaardigmaking voor God, en de kracht om uit den dood der zonden op te staan. Zie Rom 4:25, en Rom 6:3-4, enz., en Rom 8:11; 1Pe 4:1-2."},{"catchword":"de gemeenschap Zijns","tekst":"Dat is, opdat ik deel heb aan de vruchten van het lijden van Christus; namelijk dat ik daardoor van de straf der zonden verlost en tot een nieuw leven opgewekt worde, en om Zijnentwil gaarne verdrage alle lijden, kruis en verdrukking, die mij om Zijnentwil zou mogen overkomen."},{"catchword":"Zijn dood","tekst":"Namelijk de oude mens in mij gedood zijnde, Rom 6:5-6, en om Zijnentwil den gansen dag gedood wordende; Rom 8:36."}],"11":[{"catchword":"Of ik enigszins","tekst":"Deze woorden betekenen hier niet enige onzekerheid dezer zaak, maar de zwaarheid om die te verkrijgen, om daarmede den lust en vlijt op de scherpen. En de zin is: Daarna vlijtiglijk trachtende of ik enigszins, enz."},{"catchword":"tot de wederopstanding","tekst":"Namelijk de zalige opstanding der rechtvaardigen, en daardoor tot de eeuwige heerlijkheid en gelukzaligheid, Luk 14:14; Joh 6:39-40, Joh 6:44, Joh 6:54; waarom de gelovigen en rechtvaardigen alleen genaamd worden kinderen der opstanding, Luk 20:36. Niet dat de goddelozen ook niet zullen opstaan, Dan 12:2; Act 24:15; maar hunne opstanding zal zijn ter verdoemenis, Joh 5:29, en overzulks meer een val dan ene opstanding."}],"12":[{"catchword":"het alrede gekregen","tekst":"Namelijk de volmaaktheid der wedergeboorte in dit leven."},{"catchword":"volmaakt ben;","tekst":"Namelijk in wedergeboorte."},{"catchword":"ik jaag er naar,","tekst":"Grieks ik vervolg; namelijk met grote lust en vlijt."},{"catchword":"of ik het ook","tekst":"Daarmede wil hij niet zeggen, dat hij onzeker is of hij het verkrijgen zal, maar wijst de zwaarheid van de zaak aan en zijn ijver daarnaar, gelijk in het voorgaande vs."},{"catchword":"waartoe","tekst":"Dat is, om welke te verkrijgen."},{"catchword":"ik van Christus","tekst":"Dat is, van Christus, gelijk als gegrepen en gevangen, toen ik Zijne kerk vervolgende, en gelijk als in het verderf lopende, op den weg naar Damaskus van Hem aangegrepen en tot Hem bekeerd ben, Hand. 9. Zie dergelijke 1Co 13:12."}],"13":[{"catchword":"ik acht niet,","tekst":"Dat is ik laat mij dat niet voorstaan, gelijk sommigen zouden mogen denken, omdat ik zozeer roem van de gemeenschap van Christus en Zijne weldaden."}],"14":[{"catchword":"een ding doe ik,","tekst":"Namelijk als het voornaamste waarin ik mij met alle vlijt oefen, Psa 27:4; Luk 10:42."},{"catchword":"vergetende, hetgeen","tekst":"Dat is, niet tevreden zijnde met hetgeen van mij goeds zou mogen gedaan zijn voor dezen."},{"catchword":"achter is,","tekst":"Dat is, dat voorbij is, waarmede verstaan wordt hetgeen hij tot nog toe gedaan heeft, ook nu bekeerd zijnde tot Christus; ene gelijkenis, genomen van degenen, die in ene loopbaan afrede ver gelopen zijn, en de afgelopen plaats achter zich laten. Zie 1Co 9:24."},{"catchword":"strekkende mij","tekst":"Of, uitstrekkende, gelijk de lopers hun hoofd, hals, armen en lichaam voorwaarts uitstrekken, om te sterker te lopen; bij welke gelijkenis hij zijn grote en naarstige vlijt verklaart, die hij met alle kracht aanwendt om daartoe te geraken."},{"catchword":"tot hetgeen voor","tekst":"Dat is, dat nog afgelopen moet worden, om tot het einde of perk te komen. Of, tot de beloften des Evangelies, die ons zijn voorgesteld, om die te bekomen en te grijpen."},{"catchword":"jaag ik","tekst":"Grieks vervolg, gelijk vs.12."},{"catchword":"naar het wit,","tekst":"Dat is, naar het perk aan het einde der loopbaan gesteld, naar hetwelk de lopers met strijd lopen, om die eerst te grijpen, en alzo den prijs te gewinnen."},{"catchword":"tot den prijs","tekst":"Grieks brabeion: waardoor verstaan wordt ene kroon of andere verering, die gegeven werd aan dengene, die in de loopbaan gewonnen had. En de apostel verstaat daardoor de eeuwige zaligheid, die hij noemt ene kroon der gerechtigheid; 2Ti 4:8."},{"catchword":"der roeping Gods,","tekst":"Dat is, die gegeven zal worden dengenen, die God krachtig heeft geroepen tot de gemeenschap der zaligheid, en die deze roeping gehoorzaam zijn, en dienvolgens tot het einde toe deze loopbaan standvastig uitlopen."},{"catchword":"die van boven is","tekst":"Dat is, die ons van God uit den hemel gewordt, en ons tot de hemelse gelukzaligheid nodigt en brengt."},{"catchword":"in Christus Jezus","tekst":"Dat is, die door de verdiensten van Christus alleen te verkrijgen is, en die om dezelve, en door Hem ons gegeven wordt."}],"15":[{"catchword":"volmaakt zijn,","tekst":"Door dit woord verstaat de apostel niet degenen, die in de onderhouding der wet geheel volmaakt zouden zijn, want dat heeft hij tevoren van zichzelven ontkend, vs.12,13, maar degenen, die in de hoofdstukken van den Christelijken godsdienst wel en grondig verstaan, en daarin gelijk als tot volwassen ouderdom gekomen zijn, Eph 4:13, tegen welken gesteld worden degenen, die nog als kinderen zijn in kennis. Zie 1Co 2:6, en 1Co 3:1; Heb 5:13-14."},{"catchword":"dit gevoelen;","tekst":"Namelijk dat van mij hier tevoren geleerd is; namelijk van de rechtvaardigmaking des mensen voor God, vs.9, en van onze onvolmaaktheid in dit leven, vs.12, en dergelijke."},{"catchword":"iets anderszins","tekst":"Namelijk in zaken van minder gewicht."},{"catchword":"dat zal u God","tekst":"Namelijk doende u mettertijd in kennis toenemen en opwassen, mits dat gij u leerzaam aanstelt en de middelen daartoe naarstiglijk gebruikt. Dit zegt hij niet van heimelijke openbaringen buiten het woord Gods, maar van de gewone openbaringen of bekendmakingen, die hij doet door de predikatiën zijns woords, vergezelschapt met de verlichting Zijns Geestes. En dit wordt gezegd voornamelijk tot troost van de zwakken, die nog niet recht konden verstaan, dat de wet der ceremoniën geheel was afgedaan; dat namelijk God hun mettertijd dat ook zou te verstaan geven. Zie hiervan ook Rom 14."}],"16":[{"catchword":"daar wij toe","tekst":"Dat is, in die stukken der leer tot welker verstand wij door de genade Gods zijn volbracht."},{"catchword":"denzelfden regel","tekst":"Dat is, naar de kennis, die wij daarvan hebben uit Gods Woord, hetwelk als een regel of richtsnoer is, waarnaar wij ons geloof en wandel moeten richten."}],"17":[{"catchword":"mede","tekst":"Of, tezamen, tegelijk."},{"catchword":"mijn navolgers,","tekst":"Namelijk in gevoelen en in wandel. Zie 1Co 11:1."},{"catchword":"alzo wandelen,","tekst":"Namelijk gelijk ik wandel; gelijk in het volgende verklaard wordt."}],"18":[{"catchword":"velen wandelen","tekst":"Namelijk van de leraars, die het woord prediken en wandelen in hunne beroeping niet, gelijk wij doen."},{"catchword":"dikmaals gezegd","tekst":"Namelijk als ik bij u was, ulieden voor hen in mijne predikatiën waarschuwende."},{"catchword":"nu ook","tekst":"Namelijk door dit mijn schrijven."},{"catchword":"wenende zeg,","tekst":"Dat is, met droefheid des harten, ontstaande daaruit, dat deze lieden met hun valse leer en ongeregeld leven de gemeente verleiden en verstoren, en zichzelven het verderf over den hals halen."},{"catchword":"vijanden des","tekst":"Dat is, tonende dat zij vijanden zijn van de leer, waardoor geleerd wordt dat de mensen niet door de onderhouding van de wet, maar door de enige offerande van Christus aan het kruis geschied, zalig worden; 1Co 1:23-24, en 1Co 2:2."}],"19":[{"catchword":"Welker einde","tekst":"Dat is, die eindelijk van God met de eeuwige verdoemenis zullen gestraft worden, Rev 19:20-21. Zie ook Phi 1:28."},{"catchword":"God is de buik,","tekst":"Dat is, die in plaats van God te dienen en Zijne eer te verbreiden, anders niets zoeken dan een lekker en gemakkelijk leven te leiden, en hunnen buik, alsof die hun God was, te dienen."},{"catchword":"heerlijkheid","tekst":"Dat is, eer, die zij bij de mensen zoeken en waarop zij roemen."},{"catchword":"is in hun schande,","tekst":"Dat is, zoeken hunne eer in hetgeen hun schandelijk is, dat is zal hun gedijen tot tijdelijke en eeuwige schande. Of, tot hunne schande."},{"catchword":"aardse dingen","tekst":"Dat is, tijdelijke wellust en gemak."},{"catchword":"bedenken","tekst":"Of, bevroeden; dat is, met de zinnen en het verstand naar trachten."}],"20":[{"catchword":"onze wandel","tekst":"Of, burgerschap, dat is, burgerlijke verkering en wijze van leven der rechte Christenen. Zie Phi 1:27."},{"catchword":"is in de hemelen,","tekst":"Dat is, zodanig, dat zij altijd trachten niet naar aardse dingen, maar naar hemelse, en naar de heerlijkheid, die in de hemelen is weggelegd. Zie Col 3:1-2."},{"catchword":"waaruit wij","tekst":"Grieks uit welke; namelijk plaats der hemelen. Zie dergelijke Mat 2:9."},{"catchword":"verwachten,","tekst":"Namelijk om te komen oordelen de levenden en de doden; Act 1:11."}],"21":[{"catchword":"vernederd lichaam","tekst":"Grieks het lichaam onzer vernedering, of, ons lichaam der vernedering; dat is, dit ons sterflijk en verderflijk lichaam."},{"catchword":"veranderen zal,","tekst":"Het Griekse woord betekent in gedaante of hoedanigheid veranderen. Zie 1Co 15:52, enz."},{"catchword":"gelijkvormig worde","tekst":"Namelijk in onverderflijkheid, onsterflijkheid en andere geestelijke eigenschappen. Zie 1Co 15:48-49."},{"catchword":"Zijn heerlijk lichaam,","tekst":"Grieks het lichaam Zijner heerlijkheid, of Zijn lichaam der heerlijkheid, namelijk hetwelk Hij na Zijne opstanding, en nu nog in den hemel heeft."},{"catchword":"naar de werking,","tekst":"Dat is, naar Zijn goddelijke en alvermogende kracht, waardoor Hij alles vermag, en derhalve ook de opwekking en verandering onzer lichamen teweeg kan brengen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Furthermore my brethren rejoice ye in the lord. [That is, for the grace which the Lord had shewed us. Or, with a joy which is acceptable to the Lord, namely, in the midst of tribulations.] To write the same thing to you [namely, which I have taught you before by mouth. See Thes. 2.15.] is it not irksome to me, [or is it not grievous, troublesome, too much to me] and it is for you [that is, it tends and is serviceable for your assurance, thereby to more and more confirmed in the truth of Christian doctrine and in the faith.]"}],"2":[{"catchword":null,"tekst":"Beware of the dogs, [That is, observe the dogs, and take heed of the false Apostles, which he calls by this reproachful name of dogs to express their nature, that they impudently bark at and bite the sincere teachers with their slanders] beware of the evil labourers [that is, who indeed take much pains and labor, but to implant in men evil and corrupt doctrine.] Beware of the concision, [that is, who are of the circumcision, boast thereof, and teacheth that circumcision is necessary to salvation. Which may be justly be called not so much a circumcision, as indeed a concision ( cutting in pieces.) The Apostle here very elegantly changeth the word circumcision into concision, because the doctrine of these false Apostles, cuts off the men that embrace it from Christ, and as it were cuts them in pieces, unto destruction.]"}],"3":[{"catchword":null,"tekst":"For we [Namely, who seek place our righteousness only in Christ, as is declared hereafter.] are the circumcision, [that is, the true circumcision which avails before God, which is the inward circumcision of the heart. See Rom. 2.29.] we who serve God in the Spirit [or with the Spirit, i.e. inwardly with the soul and heart Job. 4.24. Ephes. 6.18. of by the power of the holy spirit.] and glory in Christ Jesus, [namely, that we have our salvation in him, and in his righteousness only. 1 Cor. 1.30,31.] and trust not in the flesh: [that is, in the outward ceremonies of the law, or outward circumcision of the flesh, and observation of the same, to be saved thereby, and is opposed to the word spirit used before.]"}],"4":[{"catchword":null,"tekst":"Although I have also what to trust to might in the flesh: [Gr. Although I also have confidence in the flesh, i.e. although I also have matter concerning that outward circumcision and other ceremonies of the law together with the outward advantages of the Jews, to put confidence in, namely, if a man might put his confidence to be saved therein] if any other man thinketh that he may put trust in the flesh, [namely, of these false Apostles, who always boasted much in those outward things, and sought therein] I yet more: [That is, I should find yet more wherein to put trust."}],"5":[{"catchword":null,"tekst":"Circumcised the eight day [Gr. Eight days circumcision] of the generation, an Hebrew of the Hebrews, according to the Law a Pharisee: [That is, in the respect of the sense of the law: Or of those three sects which were among the people of the Jews, Sedduces, Essences, and Pharisees, I was addicted to the sect of the Pharisees; which was accounted the discreetness of all, Act 26:5.]"}],"6":[{"catchword":null,"tekst":"According to zeal [Namely, for the observation of the ceremonies of the Law: wherein the false Apostles were also very zealous, but perversely] a persecutor of the church: [namely, of the Christians, who sought not their salvation in the works of the Law, but only in Christ] according to the righteousness which is in the Law, That is which the law outwardly requires of men] being unbearable. [Namely, so that men could not reprove me for any willful transgression of the Law, seeing mine external works were conformable to the Law of God. Whereby notwithstanding he declares that he was not justified. 1 Cor. 4.4.]"}],"7":[{"catchword":null,"tekst":"But that which was gain to me [Gr which were gains to me which I am that time esteemed to be profitable and advantageous to me and to salvation]that I esteemed loss for Christ [that is on the contrary rejected as bringing loss to me.]"}],"8":[{"catchword":null,"tekst":"Yeah surely I also account [that is I do not only esteem if so when I was first converted unto Christ but account it so still and continue in the same opinion ]all things [namely by which man seek their salvation without Christ ]to be damaged for Excellency of knowledge of Christ Jesus my Lord[namely not of the bare knowledge but of the saving knowledge which is accompanied with affiance and faith Joh 17:3 as the word my lord import ]for whose sake I have reckoned all these things damage [Gr have suffered loss of all those things ]and account to be dung [the Greek word properly signifies things which either are cast forth by dogs or cast before dogs that is forbid things and refuse ]that I may win Christ[ that is be made partaker of righteousness of Christ which is the greatest gain.]"}],"9":[{"catchword":null,"tekst":"And be found [namely in the judgment of God ]in him [that is in his communion engrafted by faith and being partaker of his righteousness ]not having my own righteousness [that is not relying on mine own righteousness] which is of the law [ that is which consist in perfect observation of the law as well moral as ceremonial ]but that which is by the faith of Christ [that is which men obtained when they believed in Christ and thereby embrace his righteousness and that which is imputed to believers by God of grace and their own righteousness ]namely the righteousness [namely of Christ ] which is of God [that is which God freely gives and graciously imputes to us Rom 4:6]by faith [Gr in that is which we obtain and apply to ourselves by faith as by a spiritual instrument whereby this righteousness is received.]"}],"10":[{"catchword":null,"tekst":"That [hereby he describes the true saving // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
