s, tot heerlijkheid van God de Vader.","12":"Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:","13":"Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.","14":"Doe alle dingen zonder murmureren en tegenspreken;","15":"Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;","16":"Doordat u vasthoudt aan het woord van het leven, mij tot een roem tegen de dag van Christus, dat ik niet tevergeefs gelopen heb, en ook niet tevergeefs gearbeid heb.","17":"Ja, ook al word ik tot een drankoffer geofferd over de offerande en bediening van uw geloof, dan verblijd ik mij, en verblijd ik mij met u allen.","18":"En om datzelfde verblijdt u zich ook, en verblijdt u zich ook met mij.","19":"En ik hoop in de Heere Jezus Timotheüs spoedig naar u te zenden, opdat ik ook welgemoed mag zijn, wanneer ik uw omstandigheden zal kennen.","20":"Want ik heb niemand die zo eender gezind is, die oprecht voor uw zaken zal zorgen.","21":"Want zij zoeken allen hun eigen belang, niet wat van Christus Jezus is.","22":"En u kent zijn beproefdheid, dat hij, zoals een kind zijn vader dient, met mij gediend heeft in het Evangelie.","23":"Ik hoop dan hem meteen te zenden, zodra ik zal hebben gezien hoe het met mij zal gaan;","24":"Maar ik vertrouw in de Heere, dat ik ook zelf spoedig tot u zal komen.","25":"Maar ik heb het nodig geacht Epafroditus naar u te zenden, mijn broeder, en medearbeider en medestrijder, en uw afgezondene, en bedienaar van mijn nood;","26":"Omdat hij zeer begerig was naar u allen, en zeer beangst was, omdat u had gehoord dat hij ziek was geweest.","27":"En hij is ook ziek geweest, dicht bij de dood; maar God heeft Zich over hem ontfermd; en niet alleen over hem, maar ook over mij, opdat ik niet droefheid op droefheid zou hebben.","28":"Daarom heb ik hem des te vlugger gezonden, opdat u, wanneer u hem ziet, weer verblijd zou zijn, en ik minder droevig zou zijn.","29":"Ontvang hem dan in de Heere, met alle blijdschap, en houd zulke mensen in waarde.","30":"Want om het werk van Christus is hij dicht bij de dood gekomen, terwijl hij zijn leven niet ontzag, opdat hij het gebrek van uw bediening aan mij zou aanvullen."},"SV":{"1":"Indien er dan enige vertroosting is in Christus, indien er enige troost is der liefde, indien er enige gemeenschap is des Geestes, indien er enige innerlijke bewegingen en ontfermingen zijn;","2":"Zo vervult mijn blijdschap, dat gij moogt eensgezind zijn, dezelfde liefde hebbende, van een gemoed *en* van een gevoelen zijnde.","3":"*Doet* geen ding door twisting of ijdele eer, maar door ootmoedigheid achte de een den ander uitnemender dan zichzelven.","4":"Een iegelijk zie niet op het zijne, maar een iegelijk *zie* ook op hetgeen der anderen is.","5":"Want dat gevoelen zij in u, hetwelk ook in Christus Jezus was;","6":"Die in de gestaltenis Gods zijnde, geen roof geacht heeft Gode even gelijk te zijn;","7":"Maar heeft Zichzelven vernietigd, de gestaltenis eens dienstknechts aangenomen hebbende, en is den mensen gelijk geworden;","8":"En in gedaante gevonden als een mens, heeft Hij Zichzelven vernederd, gehoorzaam geworden zijnde tot den dood, ja, den dood des kruises.","9":"Daarom heeft Hem ook God uitermate verhoogd, en heeft Hem een Naam gegeven, welke boven allen naam is;","10":"Opdat in den Naam van Jezus zich zou buigen alle knie dergenen, die in den hemel, en die op de aarde, en die onder de aarde zijn.","11":"En alle tong zou belijden, dat Jezus Christus de Heere zij, tot heerlijkheid Gods des Vaders.","12":"Alzo dan, mijn geliefden, gelijk gij te allen tijd gehoorzaam geweest zijt, niet als in mijn tegenwoordigheid alleen, maar veelmeer nu in mijn afwezen, werkt uws zelfs zaligheid met vreze en beven:","13":"Want het is God, Die in u werkt beide het willen en het werken, naar *Zijn* welbehagen.","14":"Doet alle dingen zonder murmureren en tegenspreken;","15":"Opdat gij moogt onberispelijk en oprecht zijn, kinderen Gods zijnde, onstraffelijk in het midden van een krom en verdraaid geslacht, onder welke gij schijnt als lichten in de wereld;","16":"Voorhoudende het woord des levens, mij tot een roem tegen den dag van Christus, dat ik niet tevergeefs heb gelopen, noch tevergeefs gearbeid.","17":"Ja, indien ik ook tot een drankoffer geofferd worde over de offerande en bediening uws geloofs, zo verblijde ik mij, en verblijde mij met u allen.","18":"En om datzelfde verblijdt gij u ook, en verblijdt ook ulieden met mij.","19":"En ik hoop in den Heere Jezus Timotheüs haast tot u te zenden, opdat ik ook welgemoed moge zijn, als ik uw zaken zal verstaan hebben.","20":"Want ik heb niemand, die even alzo gemoed is, dewelke oprechtelijk uw zaken zal bezorgen.","21":"Want zij zoeken allen het hunne, niet hetgeen van Christus Jezus is.","22":"En gij weet zijn beproeving, dat hij, als een kind *zijn* vader, met mij gediend heeft in het Evangelie.","23":"Ik hoop dan wel dezen van stonde aan te zenden, zo *haast* als ik in mijn zaken zal voorzien hebben;","24":"Doch ik vertrouw in den Heere, dat ik ook zelf haast *tot* *u* komen zal.","25":"Maar ik heb nodig geacht tot u te zenden Epafroditus, mijn broeder, en medearbeider en medestrijder, en uw afgezondene, en bedienaar mijner nooddruft;","26":"Dewijl hij zeer begerig was naar u allen, en zeer beangst was, omdat gij gehoord hadt, dat hij krank was.","27":"En hij is ook krank geweest tot nabij den dood; maar God heeft Zich zijner ontfermd; en niet alleen zijner, maar ook mijner, opdat ik niet droefheid op droefheid zou hebben.","28":"Zo heb ik dan hem te spoediger gezonden, opdat gij, hem ziende, wederom u zoudt verblijden, en ik te min zou droevig zijn.","29":"Ontvangt hem dan in den Heere, met alle blijdschap, en houdt dezulken in waarde.","30":"Want om het werk van Christus was hij tot nabij den dood gekomen, *zijn* leven niet achtende, opdat hij het gebrek uwer bediening aan mij vervullen zou."},"KJV":{"1":"If *there be* therefore any consolation in Christ, if any comfort of love, if any fellowship of the Spirit, if any bowels and mercies,","2":"Fulfil ye my joy, that ye be likeminded, having the same love, *being* of one accord, of one mind.","3":"*Let* nothing *be done* through strife or vainglory; but in lowliness of mind let each esteem other better than themselves.","4":"Look not every man on his own things, but every man also on the things of others.","5":"Let this mind be in you, which was also in Christ Jesus:","6":"Who, being in the form of God, thought it not robbery to be equal with God:","7":"But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of men:","8":"And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the cross.","9":"Wherefore God also hath highly exalted him, and given him a name which is above every name:","10":"That at the name of Jesus every knee should bow, of *things* in heaven, and *things* in earth, and *things* under the earth;","11":"And *that* every tongue should confess that Jesus Christ *is* Lord, to the glory of God the Father.","12":"Wherefore, my beloved, as ye have always obeyed, not as in my presence only, but now much more in my absence, work out your own salvation with fear and trembling.","13":"For it is God which worketh in you both to will and to do of *his* good pleasure.","14":"Do all things without murmurings and disputings:","15":"That ye may be blameless and harmless, the sons of God, without rebuke, in the midst of a crooked and perverse nation, among whom ye shine as lights in the world;","16":"Holding forth the word of life; that I may rejoice in the day of Christ, that I have not run in vain, neither laboured in vain.","17":"Yea, and if I be offered upon the sacrifice and service of your faith, I joy, and rejoice with you all.","18":"For the same cause also do ye joy, and rejoice with me.","19":"But I trust in the Lord Jesus to send Timotheus shortly unto you, that I also may be of good comfort, when I know your state.","20":"For I have no man likeminded, who will naturally care for your state.","21":"For all seek their own, not the things which are Jesus Christ's.","22":"But ye know the proof of him, that, as a son with the father, he hath served with me in the gospel.","23":"Him therefore I hope to send presently, so soon as I shall see how it will go with me.","24":"But I trust in the Lord that I also myself shall come shortly.","25":"Yet I supposed it necessary to send to you Epaphroditus, my brother, and companion in labour, and fellowsoldier, but your messenger, and he that ministered to my wants.","26":"For he longed after you all, and was full of heaviness, because that ye had heard that he had been sick.","27":"For indeed he was sick nigh unto death: but God had mercy on him; and not on him only, but on me also, lest I should have sorrow upon sorrow.","28":"I sent him therefore the more carefully, that, when ye see him again, ye may rejoice, and that I may be the less sorrowful.","29":"Receive him therefore in the Lord with all gladness; and hold such in reputation:","30":"Because for the work of Christ he was nigh unto death, not regarding his life, to supply your lack of service toward me."}},"tsk":{"1":[{"kopje":"enige vertroosting","refs":["Fil 3:3","Luk 2:10","Luk 2:11","Luk 2:25","Joh 14:18","Joh 14:27","Joh 15:11","Joh 16:22-24","Joh 17:13","Rom 5:1","Rom 5:2","Rom 15:12","Rom 15:13","1 Kor 15:31","2 Kor 1:5","2 Kor 1:6","2 Kor 2:14","2 Tess 2:16","2 Tess 2:17","Hebr 6:18","1 Petr 1:6-8"]},{"kopje":"enige troost","refs":["Ps 133:1","Joh 15:10-12","Hand 2:46","Hand 4:32","Gal 5:22","Ef 4:30-32","Kol 2:2","1 Joh 4:7","1 Joh 4:8","1 Joh 4:12","1 Joh 4:16"]},{"kopje":"enige gemeenschap","refs":["Rom 5:5","Rom 8: <span class=\"wl wl-kjv\" data-code=\"G2064\">I</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> <span class=\"wl wl-kjv\" data-code=\"G846\">myself</span> shall <span class=\"wl wl-kjv\" data-code=\"G2064\">come</span> shortly.","25":"<span class=\"wl wl-kjv\" data-code=\"G1161\">Yet</span> I <span class=\"wl wl-kjv\" data-code=\"G2233\">supposed</span> it <span class=\"wl wl-kjv\" data-code=\"G316\">necessary</span> to <span class=\"wl wl-kjv\" data-code=\"G3992\">send</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">to</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you</span> <span class=\"wl wl-kjv\" data-code=\"G1891\">Epaphroditus,</span> <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G80\">brother,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> companion in <span class=\"wl wl-kjv\" data-code=\"G4904\">labour,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4961\">fellowsoldier,</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">your</span> <span class=\"wl wl-kjv\" data-code=\"G652\">messenger,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> he that <span class=\"wl wl-kjv\" data-code=\"G3011\">ministered</span> to <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> wants.","26":"<span class=\"wl wl-kjv\" data-code=\"G1894\">For</span> <span class=\"wl wl-kjv\" data-code=\"G2258\">he</span> longed <span class=\"wl wl-kjv\" data-code=\"G1971\">after</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> was full of <span class=\"wl wl-kjv\" data-code=\"G85\">heaviness,</span> <span class=\"wl wl-kjv\" data-code=\"G1360\">because</span> that ye had <span class=\"wl wl-kjv\" data-code=\"G191\">heard</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> he had been sick.","27":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">indeed</span> he was <span class=\"wl wl-kjv\" data-code=\"G770\">sick</span> <span class=\"wl wl-kjv\" data-code=\"G3897\">nigh</span> unto <span class=\"wl wl-kjv\" data-code=\"G2288\">death:</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> had <span class=\"wl wl-kjv\" data-code=\"G1653\">mercy</span> on <span class=\"wl wl-kjv\" data-code=\"G846\">him;</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> on <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G3440\">only,</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> on <span class=\"wl wl-kjv\" data-code=\"G1691\">me</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also,</span> <span class=\"wl wl-kjv\" data-code=\"G3363\">lest</span> I should <span class=\"wl wl-kjv\" data-code=\"G2192\">have</span> <span class=\"wl wl-kjv\" data-code=\"G3077\">sorrow</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">upon</span> sorrow.","28":"I <span class=\"wl wl-kjv\" data-code=\"G3992\">sent</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G3767\">therefore</span> the more <span class=\"wl wl-kjv\" data-code=\"G4708\">carefully,</span> <span class=\"wl wl-kjv\" data-code=\"G2443\">that,</span> when ye <span class=\"wl wl-kjv\" data-code=\"G1492\">see</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G3825\">again,</span> ye may <span class=\"wl wl-kjv\" data-code=\"G5463\">rejoice,</span> and that <span class=\"wl wl-kjv\" data-code=\"G2504\">I</span> may <span class=\"wl wl-kjv\" data-code=\"G5600\">be</span> the less sorrowful.","29":"<span class=\"wl wl-kjv\" data-code=\"G4327\">Receive</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G3767\">therefore</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G5479\">gladness;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2192\">hold</span> <span class=\"wl wl-kjv\" data-code=\"G5108\">such</span> in reputation:","30":"<span class=\"wl wl-kjv\" data-code=\"G3754\">Because</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">for</span> the <span class=\"wl wl-kjv\" data-code=\"G2041\">work</span> of <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> he was <span class=\"wl wl-kjv\" data-code=\"G1448\">nigh</span> <span class=\"wl wl-kjv\" data-code=\"G3360\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G2288\">death,</span> not <span class=\"wl wl-kjv\" data-code=\"G3851\">regarding</span> his <span class=\"wl wl-kjv\" data-code=\"G5590\">life,</span> <span class=\"wl wl-kjv\" data-code=\"G2443\">to</span> <span class=\"wl wl-kjv\" data-code=\"G378\">supply</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">your</span> <span class=\"wl wl-kjv\" data-code=\"G5303\">lack</span> of <span class=\"wl wl-kjv\" data-code=\"G3009\">service</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">toward</span> me."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"vertroosting","tekst":"Of, vermaning. Want het Griekse woord betekent liefde."},{"catchword":"is","tekst":"Of, plaats heeft bij ulieden; of bij u gelden mag."},{"catchword":"in Christus,","tekst":"Dat is, in Christus' naam, of om Christus' wil."},{"catchword":"troost is","tekst":"Dat is, troostelijke aanspraak."},{"catchword":"der liefde,","tekst":"Dat is, uit oprechte liefde gedaan."},{"catchword":"gemeenschap is","tekst":"Dat is, zo gij ook de genade der wedergeboorte toont in het betrachten van deze vermaning. Of zo gij door éénen geest aan elkander verbonden zijt."},{"catchword":"innerlijke bewegingen","tekst":"Grieks ingewanden. Zie Phi 1:8."},{"catchword":"ontfermingen zijn","tekst":"Dat is, medelijden, namelijk met mijne banden en verdrukkingen. Zie Col 3:12; Heb 10:28."}],"2":[{"catchword":"vervult mijn","tekst":"Dat is, vermeerdert die hoe langer hoe meer met uwen Christelijken wandel."},{"catchword":"eensgezind zijn,","tekst":"Door deze enigheid van zinnen wordt verstaan, niet alleen enerlei gevoelen in het verstand, aangaande hoofdstukken der Christelijke leer, maar ook enigheid in wil, genegenheden en liefde, gelijk hetzelve hier ook uitgedrukt wordt. Zie Act 4:32."},{"catchword":"van een gemoed","tekst":"Grieks van ééne ziel; of, de zielen tezamengevoegd hebbende."}],"3":[{"catchword":"uitnemender","tekst":"Namelijk van gaven, of van diensten."}],"4":[{"catchword":"zie niet op","tekst":"Namelijk voornamelijk, of, alleen. Want anderszins moet ook een Christen zijne huisgenoten verzorgen, 1Ti 5:8. De apostel gebruikt hier een woord, hetwelk eigenlijk betekent te zien op iets als op een doelwit waar men naar schiet."},{"catchword":"het zijne, maar","tekst":"Dat is, zijn voordeel, eer, of gemak."},{"catchword":"der anderen is","tekst":"Dat is, dat tot zijns naasten voordeel, eer, dienst en stichting strekt."}],"5":[{"catchword":"dat gevoelen","tekst":"Grieks hetzelve worde gevoeld; dat is, dat dan in u dezelfde gezindheid en genegenheid zij tot nederigheid."}],"6":[{"catchword":"gestaltenis Gods","tekst":"Grieks morphe; dat is, gedaante, of, gestaltenis, met welk woord hetzelve hier overgezet is, omdat daardoor hier betekend wordt, niet alleen een goddelijke majesteit en heerlijkheid, maar ook het goddelijke wezen zelf, overmits zonder hetzelve geen ware goddelijke majesteit en heerlijkheid kan wezen, en deze ook bij niemand kunnen zijn dan bij den waarachtigen God, Isa 42:8. En uit het volgende blijkt dat door dit woord hier ook het wezen Gods betekend wordt, gelijk in dit vs. gezegd wordt, dat hij Gode evengelijk was, en vs.7, dat hij de gestaltenis van een dienstknecht heeft aangenomen; dat is, niet alleen een dienstbare en knechtelijke hoedanigheid, maar ook een ware menselijke natuur zelve met zodanige hoedanigheid bekleed. Zodat de woorden gestaltenis Gods te verstaan zijn van zijn wezen en staat, in welke hij geweest is van alle eeuwigheid, eer hij de menselijke natuur heeft aangenomen. Zie Joh 1:1, Joh 1:14, en Joh 17:5."},{"catchword":"geen roof","tekst":"Dat is, geen zaak die ongeoorloofd, of onrechtvaardig was, die Hem met recht niet toebehoorde, alsof Hij ze geroofd had."},{"catchword":"Gode even","tekst":"Dat is, Gode Zijnen Vader naar Zijn goddelijk wezen, en dienvolgens ook in majesteit en heerlijkheid volkomen gelijk te zijn en te blijven, als zijnde één met den Vader. Zie Joh 5:18, Joh 5:26, en Joh 10:20, en Joh 16:15; Heb 1:3."}],"7":[{"catchword":"Zichzelven","tekst":"Namelijk gans vrijwillig."},{"catchword":"vernietigd,","tekst":"Grieks verijdeld; of ledig gemaakt; dat is, heeft het gebruik Zijner goddelijke heerlijkheid voor een tijd, om het werk onzer verlossing in den staat der nederigheid te volbrengen, gelijk als afgelegd, en Zich daarvan gelijk als ledig gemaakt, en in Zijn menselijke natuur verborgen gehouden, alleen enige klein straten derzelve door zijne wonderwerken en anderszins, altemet latende schijnden, Joh 1:14, en Joh 2:11. In het volgende vs.8 wordt het verklaard met het woord vernederd."},{"catchword":"de gestaltenis","tekst":"Dit wordt verklaard met de volgende woorden, namelijk dat Hij een ware menselijke natuur heeft aangenomen, en met dezelve een gans nederigen en verachten staat, als van een slaaf of dienstknecht, om alzo voor onze zonden te voldoen, en tot onze verlossing Zijn Vader te dienen. Zie Isa 53:11."},{"catchword":"en is den mensen","tekst":"Grieks in gelijkmaking der mensen geworden zijnde; dat is, den mensen gelijk gemaakt zijnde, namelijk niet alleen naar de menselijke natuur door Hem aangenomen, maar ook naar alle zwakheden derzelve, zonder zonde. Zie Heb 2:17, en Heb 4:15. Of, als een slecht en veracht mens. Zie Jdg 16:7, Jdg 16:11, Psa 82:7."}],"8":[{"catchword":"in gedaante","tekst":"Daardoor wordt verstaan hetzelfde dat tevoren genoemd is gestaltenis en gelijkmaking; gevoegd met den uitwendigen wandel onder de mensen."},{"catchword":"gevonden","tekst":"Dat is, bevonden te zijn."},{"catchword":"als een mens,","tekst":"Dat is, als een waar en ook als een slecht en veracht mens. Zie vs.7."},{"catchword":"Zichzelven","tekst":"Zie het voorgaande 7e vs.."},{"catchword":"gehoorzaam geworden","tekst":"Namelijk Zich aan den wil Zijns Vaders in alles gewillig onderwerpende."},{"catchword":"tot den dood,","tekst":"Dat is, niet alleen in allerlei bevelen, maar ook in de zwaarste, om den dood te sterven; dien Hij anderszins niet onderworpen was, noch naar Zijn goddelijke natuur, die onsterflijk is, 1Ti 1:17; noch naar Zijn menselijke, overmits in dezelve gene zonde was, 1Jo 3:5, en daarom de bezolding derzelve niet verdiend had, Rom 6:23."},{"catchword":"den dood des kruises","tekst":"Dat is, den allerbittersten en allersmadelijksten dood, die ook van God vervloekt was, Deu 21:23. Onder deze uiterste trap van vernedering begrijpt de apostel alle andere, die dezelve voorgegaan zijn naar lichaam en naar ziel, en drukt deze uit om te beter de uiterste vernedering van Christus voor ogen te stellen, en de gelovigen daarmede tot nederigheid te vermanen."}],"9":[{"catchword":"Daarom heeft","tekst":"Met dit woord daarom wordt niet aangewezen dat Christus met deze vernedering de volgende heerlijkheid voor Zichzelven zou verdiend hebben; want al wat Christus verdiend heeft, dat heeft Hij voor ons verdiend, Joh 17:19; maar wijst alleen aan wat hierop gevolgd is, of betamelijk was te volgen. Zie dergelijke Act 20:26; Heb 3:7; 2Pe 1:10."},{"catchword":"God","tekst":"Namelijk de Vader."},{"catchword":"uitermate verhoogd,","tekst":"Namelijk nadat Hij van de doden opgestaan en ten hemel opgevaren zijnde, ter rechterhand Gods gezet is in de hoogste heerlijkheid, Eph 1:20; Heb 1:3, welke Hij wel naar Zijn goddelijke natuur van eeuwigheid heeft gehad, Joh 17:5; maar alzo hij het gebruik van die in den staat Zijner nederigheid gelijk als afgelegd had, zo heeft Hij hetzelve na Zijne hemelvaart wederom aangenomen en heerlijk vertoond, en Zijn menselijke natuur is naar lichaam en naar ziel met zo hoge heerlijkheid en gelukzaligheid versierd, als een schepsel ontvangen kan, verre tebovengaande alle heerlijkheid van engelen en andere mensen."},{"catchword":"een Naam","tekst":"Daardoor wordt verstaan niet de blote naam, waardoor hij van andere mensen onderscheiden is; want dien heeft Hij ook in den staat Zijner nederheid gehad; noch ook alleen de vermaardheid van Zijnen persoon, maar de majesteit en heerlijkheid deszelven. Zie Eph 1:21."},{"catchword":"gegeven,","tekst":"Of, geschonken. Zie Phi 1:29. Waarmede te kennen gegeven wordt dat deze verhoging geschied is naar des Vaders wil en believen."},{"catchword":"boven allen naam is;","tekst":"Dat is, de allergrootste en hoogste heerlijkheid."}],"10":[{"catchword":"Opdat","tekst":"Of, zodat."},{"catchword":"in de Naam","tekst":"Dat is, deze Jezus Christus aldus verheerlijkt zijnde, en vanwege deze Zijne heerlijkheid."},{"catchword":"buigen alle knie","tekst":"Dat is, alle redegebruikende schepselen zich onderwerpen, zelfs ook Zijne vijanden tegen hunnen dank. De apostel ziet hier op hetgeen God zegt, Isa 45:23, en past datzelfde Jezus Christus hier toe, gelijk ook Rom 14:11. Deze woorden moeten dan niet eigenlijk verstaan worden, te weten, dat als de naam Jezus genoemd wordt, men de knieën zou moeten buigen, gelijk sommigen uit misverstand van deze plaats, niet zonder bijgeloof doen, want de engelen en boze geesten, van welke hier ook gesproken wordt, eigenlijk geen knieën hebben; maar bij gelijkenis van den uiterlijken eerbied, dien men koningen of prinsen daarmede betoont, onder welke men staat, wordt hier verstaan de onderwerping aller schepselen onder Christus, als den Heere der heren, en Koning der koningen, Rev 19:16, den overste der koningen der aarde, Rev 1:5, en den Heere overal, Act 10:36."},{"catchword":"die in den hemel,","tekst":"Namelijk de heilige engelen en zalige zielen, Rev 5:13."},{"catchword":"die op de aarde,","tekst":"Dat is, alle mensen op de aarde levende."},{"catchword":"die onder de aarde zijn","tekst":"Dat is, alle mensen, die gestorven en in de graven zijn, of, ook alle boze geesten en verdoemde mensen, die in de hel zijn, dat is, alle redegebruikende schepselen in welke plaats der geschapen wereld zij ook zouden mogen zijn. Want hoewel de duivelen en de goddeloze en verdoemde mensen Christus de behoorlijke onderdanigheid en eer niet tonen, zo moeten zij nochtans, ook tegen hunnen dank, Hem, als den Heere en Rechter over allen, onderworpen zijn. Zie Psa 22:30, en Psa 72:9."}],"11":[{"catchword":"alle tong zou belijden,","tekst":"Namelijk van alle natiën en volken, en ook van alle redegebruikende schepselen, niet alleen der goeden maar ook der kwaden, dewelke, hoe zeer zij zich tegen Christus stellen, evenwel Hem, tegen hun dank, dikwijls hebben moeten belijden, Mar 5:7; Act 16:17; en zullen in het laatste oordeel Hem moeten erkennen voor den Rechter der levenden en der doden, en voor den Heere, Mat 7:22."},{"catchword":"dat Jezus Christus","tekst":"Of, dat de Heere Jezus zij Christus, dat is, de Gezalfde."},{"catchword":"tot heerlijkheid","tekst":"Dat is, welke belijdenis strekt tot uitbreiding van de heerlijkheid des Vaders, die uit enkel barmhartigheid en genade jegens ons, dezen Zijnen Zoon Jezus tot een Heere en Zaligmaker gesteld en gegeven heeft."}],"12":[{"catchword":"gehoorzaam geweest zijt,","tekst":"Namelijk het Evangelie, hetzelve met een waar geloof aannemende, en met een godzaligen wandel belevende."},{"catchword":"werkt uws zelfs","tekst":"Dat is, benaarstigt, bearbeidt, gebruikende de middelen die God tot bevordering derzelve heeft verordineerd."},{"catchword":"met vreze en beven","tekst":"Dat is, met een nederig gevoelen van uzelven en met grote en kinderlijke zorgvuldigheid, vrezende dat gij iets zoudt mogen doen of nalaten, waarmede gij God zoudt mogen vertoornen, of dat ter zaligheid hinderlijk zou mogen zijn. Zie van deze wijze van spreken Psa 2:11; 1Co 2:3; 2Co 7:15; Eph 6:5; Heb 12:28; 1Pe 1:17."}],"13":[{"catchword":"Die in u werkt","tekst":"Dit wordt daarbij gedaan opdat men uit deze voorgaande vermaning niet zou denken of besluiten, dat de mens uit zichzelven en door zijn eigen krachten de zaligheid zou kunnen werken. Zie Phi 1:6; 2Co 3:5; Jam 1:17."},{"catchword":"het willen","tekst":"Dat is, niet alleen het kunnen willen, maar ook het willen zelf; den wil krachtiglijk neigende en buigende om het goede te verkiezen, en alzo van onwilligen gewilligen makende, door de kracht des Heiligen Geestes; Joh 3:5, en Joh 6:44; Rom 9:16; 1Pe 1:3."},{"catchword":"het werken,","tekst":"Of, het uitwerken; dat is, het doen en volbrengen van het goede dat men wil."},{"catchword":"naar Zijn welbehagen","tekst":"Dat is, niet naar enige voorgaande goede schikking of voorbereiding, die Hij in den mens zou vinden, maar naar Zijn believen, uit loutere genade. Zie Eph 1:5, Eph 1:9, Eph 1:11, en Eph 2:8; 2Ti 1:9."}],"14":[{"catchword":"alle dingen","tekst":"Namelijk die u de Heere beveelt, hoe zwaar die ook het vlees zouden mogen zijn."},{"catchword":"zonder murmureren","tekst":"Dat is, gewillig en geduldig."},{"catchword":"tegenspreken","tekst":"Of, twistingen, overleggingen; namelijk, of gij hetgeen God gebiedt zult doen of niet. Want het Griekse woord betekent òf in zijn gemoed, òf met woorden, over en weder disputeren of knibbelen."}],"15":[{"catchword":"onberispelijk","tekst":"Dat is, alzo dat de mensen uwen wandel met recht niet mogen berispten. Zie Luk 1:6; Eph 5:26-27."},{"catchword":"oprecht zijn,","tekst":"Of, eenvoudig, zonder bedrog. Zie Mat 10:16."},{"catchword":"een krom","tekst":"Dat is, ongelovige en onwedergeboren mensen. Zie Act 2:40."},{"catchword":"welke","tekst":"Namelijk mensen."},{"catchword":"gij schijnt als","tekst":"Dat is, voortaan ook moet schijnen en voorlichten."},{"catchword":"lichten in de wereld","tekst":"Of, voorlichters, gesternten. Zie Pro 4:18; Mat 5:14."}],"16":[{"catchword":"Voorhoudende","tekst":"Dat is, de gezonde leer des Evangelies standvastig behoudende, belijdende en betrachtende, of voordragende."},{"catchword":"levens,","tekst":"Dat is, in hetwelk ons het eeuwige leven, en de weg om daartoe te komen, aangewezen wordt, en hetwelk ons daartoe leidt. Zie Joh 6:68."},{"catchword":"den dag van","tekst":"Namelijk als Hij zal komen om alle mensen te oordelen, of mij uit dit leven te verlossen."},{"catchword":"gelopen","tekst":"Namelijk in de loopbaan van mijn dienst aan u bediend door de predikatie van dit woord."}],"17":[{"catchword":"ik ook","tekst":"Namelijk mijn bloed vergietende om des Evangelies wil."},{"catchword":"tot een drankoffer","tekst":"Het Griekse woord betekent zo geofferd te worden, gelijk in het Oude Testament, benevens het offer van meel, ook wijn tot drankoffer opgeofferd werd. De apostel ziet hier op het storten zijns bloeds; want het bloed der martelaren is den Heere een aangename offerande; Psa 116:15."},{"catchword":"over de offerande","tekst":"Dat is, omdat ik u door de predikatie des Evangelies Gods gelijk als opgeofferd en toegeheiligd heb, en daarmede u gediend heb, om tot het geloof te brengen, waarin gij door mijnen dood zult bevestigd worden."},{"catchword":"bediening","tekst":"Grieks Leitourgia. Zie van dit woord Rom 15:16; 2Co 9:12; Heb 8:2, Heb 8:6."}],"18":[{"catchword":"verblijdt gij","tekst":"Dit kan verstaan worden of vermanender wijze, dat zij zich dan zullen verblijden; of, verhalenderwijze, dat zij zulks deden."}],"19":[{"catchword":"in den Heere","tekst":"Dat is, met hulp en door de genade des Heeren, zo het Hem zal believen. Zie Act 18:21; 1Th 3:2."}],"20":[{"catchword":"even alzo gemoed","tekst":"Grieks gelijkzielig; dat is, die u even zo goed hart toedraagt als ik en als hij."},{"catchword":"oprechtelijk","tekst":"Het Griekse woord betekent eigenlijk zo oprecht, als het van de natuur zelve komt, gelijk de ouders voor hunne kinderen zorgen, die van hen geboren zijn."},{"catchword":"uw zaken zal","tekst":"Namelijk die aangaan de stichting van uwe gemeente en uwe zaligheid."}],"21":[{"catchword":"allen","tekst":"Dat is, bijna allen, of meest allen, gelijk Mat 10:22; Mar 1:5; Joh 10:8."},{"catchword":"het hunne,","tekst":"Dat is, hun eigen gemak, nut, of eer."},{"catchword":"hetgeen van Christus","tekst":"Dat is, hetgeen tot bevordering van Christus' rijk, eer en leer behoort."}],"22":[{"catchword":"zijn beproeving,","tekst":"Dat is, de proefstukken van zijne oprechtheid en getrouwheid, die hij voor dezen dikwijls heeft getoond. Of, hoe dat hij altijd oprecht en getrouw bevonden is geweest."},{"catchword":"als een kind","tekst":"Dat is, niet als een knecht uit bedwang, maar met een onderdanige en bereidwillige genegenheid. Zie 1Co 4:17; 2Ti 2:1."},{"catchword":"met mij gediend","tekst":"Dat is, mij geholpen heeft in het verkondigen, verbreiden en verdedigen van de leer des Evangelies."}],"23":[{"catchword":"dezen","tekst":"Namelijk Timotheüs, zulk een treffelijk jonge man en getrouw leraar, die mij zo dienstig en behulpzaam is geweest."},{"catchword":"van stonden","tekst":"Dit kan, òf tot het woord zenden, òf tot het woord voorzien, gevoegd worden."},{"catchword":"mijn zaken","tekst":"Namelijk die aangaan de bediening van mijn ambt."}],"24":[{"catchword":"vertrouw","tekst":"Dat is, ik hoop vastelijk en twijfel weinig daaraan; want dit betekent hier niet een vaste zekerheid des harten, maar een grote en sterke hoop. Zie Phi 1:25."}],"25":[{"catchword":"tot u te","tekst":"Namelijk nu terstond met dezen zendbriEf."},{"catchword":"Epafroditus,","tekst":"Zie van hem ook Phi 4:18. Sommige menen, dat hij dezelfde zou zijn die Epafras genaamd wordt, Col 1:7, en Col 4:12; Phm 1:23, maar dat is onzeker."},{"catchword":"mijn broeder,","tekst":"Dat is, mijn medebroeder en een leraar des Heiligen Evangelies."},{"catchword":"medearbeider","tekst":"Namelijk in het werk van de verkondiging des Evangelies."},{"catchword":"medestrijder,","tekst":"Namelijk in den geestelijken strijd tegen de vijanden des Evangelies, met grote moeite en gevaar zijns levens."},{"catchword":"afgezondene,","tekst":"Grieks Apostolon; welk woord in het bijzonder betekent enen die van Christus zelf geroepen en uitgezonden is, om het Evangelie te prediken door de gehele wereld, Gal 1:1; Eph 4:11; maar hier wordt het breder genomen in het algemeen, voor een die van iemand afgezonden is, om uit zijnen naam of voor zich iets uit te brengen hetgeen zij tot zijn onderhoud toegevoegd hadden. Of ook, uwen leraar; want alzo wordt dit woord ook somtijds genomen voor allerlei leraars. Zie Rom 16:7; 2Co 8:23."},{"catchword":"bedienaar","tekst":"Waarom de apostel hem zo noemt, wordt breder verklaard Phi 4:23."}],"26":[{"catchword":"naar u allen,","tekst":"Dat is, om u allen weder te zien en bij u te zijn."},{"catchword":"beangst was,","tekst":"Het Griekse woord betekent een zeer bekommerlijke verwachting van enig kwaad of leed, met grote benauwdheid des harten. Zie Mat 26:37; Mar 14:33."},{"catchword":"gij gehoord hadt,","tekst":"Namelijk wist dat gij, die Hem zo lief en waard hebt, daarover ten uiterste zoudt bedroefd zijn."}],"27":[{"catchword":"tot nabij den","tekst":"Dat is, alzo dat hij in groot gevaar is geweest, dat hij aan die ziekte zou gestorven zijn."},{"catchword":"zijner ontfermd;","tekst":"Dat is, heeft hem uit genade bij het leven behouden en tot gezondheid wedergebracht."},{"catchword":"ook mijner,","tekst":"Namelijk alzo ik houd de genade, die hem geschied is, alsof zij mijzelven gedaan ware, om de hulp die ik van hem heb."},{"catchword":"droefheid op","tekst":"Namelijk om den dood van zo een treffelijk leraar en dienstig werktuig in de kerk Gods."},{"catchword":"droefheid zou hebben","tekst":"Namelijk die mij in deze banden van de vijanden des Evangelies dagelijks aangedaan wordt."}],"28":[{"catchword":"te spoediger gezonden,","tekst":"Namelijk zo haast hij weder gezond is geworden. Of, te vlijtiger, te naarstiger."},{"catchword":"te min zou","tekst":"Namelijk gelijk ik ben geweest als gij uwen getrouwen leraar zo lang hebt moeten ontberen."}],"29":[{"catchword":"in den Heere,","tekst":"Dat is, om des Heeren wil, wiens dienaar hij is; of, onthaalt niet met een wereldse vreugde, maar gelijk den Heere aangenaam is."},{"catchword":"dezulken","tekst":"Dat is, die dienaars zijn des Evangelies, en voornamelijk die zo getrouw zijn als hij en Timotheüs."},{"catchword":"in waarde","tekst":"Of, in eer; of, dierbaar."}],"30":[{"catchword":"om het werk","tekst":"Dat is, om het werk waartoe Christus hem beroepen had; of, hetwelk hij tot verbreiding van het rijk van Christus en tot Zijne eer aangenomen had. Waardoor verstaan wordt, òf in het algemeen de dienst des Woords met al wat daaraan kleeft, òf in het bijzonder de dienst, dien hij den apostel gedaan had, in het overbrengen van hetgeen de Filippensen hem gezonden hadden, en die hij nog deed in hem te dienen in zijne banden; hetwelk alles ook strekte tot verbreiding en dienst van het rijk van Christus."},{"catchword":"tot nabij den","tekst":"Dat is, is in groot gevaar zijns levens geweest, namelijk òf op die gevaarlijke reis, òf hier te Rome, omdat hij mij helpt en dient in het Evangelie te verbreiden."},{"catchword":"zijn leven","tekst":"Grieks zijne ziel."},{"catchword":"niet achtende,","tekst":"Het Griekse woord betekent raad nemen zonder op zijn ziel of leven te achten of te letten; dat is, dat hij, overlegd hebbende wat hij behoorde te doen, zijn leven in gevaar te stellen, of zijn dienst na te laten, besloten en raad genomen heeft zijn leven liever te wagen."},{"catchword":"het gebrek","tekst":"Dat is, opdat, dewijl gij zelf hier niet tegenwoordig kunt zijn om mij te dienen in mijne banden, hij in uwer aller plaats hetzelfdezou mogen doen. Grieks uw gebrek der bediening aan mij."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"IF therefore there be [Or hath place with you: or may avail with you] any consolation: for the Greek word signifies both [in Christ, [that is, in Christ&rsquo;s name or for Christ&acirc;&euro;&trade;s sake.] if there be any comfort [that is, made out of sincere love] if there be any fellowship of the spirit, [that is, if ye also shew the grace of regeneration in the following of this exhortation or if ye are bound one to another by one Spirit,] if there be any inward moving [Gr. Bowels, See chap. 1.8.] and compassions: [namely, of my bonds and afflictions. See Act 3:12. Heb. 10.28.]"}],"2":[{"catchword":null,"tekst":"Then fulfill ye my joy, [That is, increase at still more and more, by your Christian walking ] that ye may be of one accord, by this oneness of mind is understood not only one kind of opinion in one understanding, concerning the chief Articles of Christian doctrine, but also unity in will, affections, and love, as the same is also expressed. See Act 4:32.] having the same love, being of one mind, [Gr. Of one soul, or having the soul joined together] and of one judgment."}],"3":[{"catchword":"Doe","tekst":"nothing through strife, or vain glory, but through humility, let one esteem another more excellent then himself.[namely, in gifts, or in ministries.]"}],"4":[{"catchword":null,"tekst":"Let every one not look upon [Namely, principally, or only. For otherwise Christians must also take care of those of his own house, 1 Tim. 5.8. The Apostle here useth a word which properly signifieth to look as arming at a mark] is own [that is, his own profit, honor or ease] but let ever one [look] also on that which (belongs to) others. [That is, which tends to his neighbors profit, honor, service, and edification.]"}],"5":[{"catchword":null,"tekst":"For let that mind be in you, [Gr. Let the same be judged, i.e. let then be the same disposition and inclination be in you in humility] which also was in Jesus Christ:"}],"6":[{"catchword":null,"tekst":"Who being in the form of God [Gr. Morphe. i.e. fashion or form, by which word it is here translated because thereby is signified here, not only a divine essence itself, forasmuch as without the same there can be no true divine Majesty and glory, and this also can be with none but with the true God. Isa. 42. 8. And it appears by what follows, that by this word the essence of God is signified here also, as is said ver. 6. that he was equal to God, and ver. 7. that he took upon him the form of a servant, that is, not only the quality of a bondman or servant, but also a true human nature itself, endued with such qualities. So that the words, the form of God, are to be understood of his essence and State in which he was from all eternity, before he took the human nature upon him. See Joh. 1. 1. 14. and Chap. 17. 5.] esteemed it no robbery [that is, nothing that was unlawful or unjust, which did not of right belong unto him, as if he had got it by robbery] to be equal God: [that is, to be and remain perfectly like to God his Father according to his divine essence, and consequently also in majesty and glory, as being one with the Father. See Joh. 5. ver. 18, 26. and Chap. 10. 30. and chap. 16. 15. Heb. 1. 3.]"}],"7":[{"catchword":null,"tekst":"But made himself [Namely, altogether willingly] of no account, [Gr. Made vain or empty, i.e. as it were laid aside the use of his divine glory for a time, to accomplish the work of our redemption in the state of humiliation, and as it were emptied himself thereof, and kept it hidden in his human nature only letting some small rays of the same sometimes shine forth by his miracles and otherwise, Joh. 1. 14. and chap. 2. ver. 11. In the 8. ver. Following, it is expounded by the word humbled] having taken on the form of a servant [this is expounded by the following words, namely that he took on him a true human nature, and with the same a very low and contemptible estate as of slave or servant, that so he might satisfy for our sins, and serve his father for our redemption. See Isa. 53. 11.] and become like unto men] Gr. Being made in men&acirc;&euro;&trade;s likeness, i.e. being made like unto men. Namely, not only according to the human nature assumed by him; but also according to all the infirmities of the same, without sin. See Heb. 2. 17. and 4. 15. Or as a mean and despised man. See Jud. 16. 7, 11. Ps. 82. 7.]"}],"8":[{"catchword":null,"tekst":"And found [That is, found to be] in fashion [thereby is understood the same that before was named form and likeness, joined with outward conversing amongst men.] as a man, [that is, as a true and also as a mean and despised man. See ver. 7.] he humbled himself, [See the 7. verse foregoing] being become obedient [namely willingly subjecting himself in all things to the will of his father] unto the death, [that is, not only in all manner of commands, but also in the most grievous, to die the death: to which otherwise he was not subject, neither according to his divine nature which is immortal, 1 Tim. 1. 17. nor according to his human, forasmuch as there was no sin in the same, 1 Joh. 3. 5. and therefore had not deserved the wages thereof, Rom. 6. 23.] yea to the death of the cross: [that is, to the most bitter, and most shameful death, which was also cursed of God Deut. 21. 23. Under this lowest degree of humiliation the Apostle comprehends all others which went before the same both in body and soul, and expresseth this, the better to set before our eyes the utmost humiliation of Christ, and thereby to exhort believers to humility.]"}],"9":[{"catchword":null,"tekst":"Therefore [By this word therefore is not shewed that by this humiliation Christ merited the following glory for himself: for all that Christ merited, that he merited for us. Joh. 17. 19. But sheweth only what followed hereupon, or was fit to follow. See the like Act. 20. 26. Heb. 3. 7. 2. Pet. 1. 10.] God [namely the father] hath also above measure exalted him, [namely, after that he being risen from the dead and ascended up to heaven, sat on the right hand of God in the highest glory. Eph. 1. 20. Heb. 1. 3. which according to his divine nature he had indeed from eternity. Joh. 17. 5. But seeing he had as it were laid aside the use thereof in the state of his humiliation; he took the same upon him again after his ascension, and shewed it gloriously: and his human nature both in soul and body was adorned with as high glory and blessedness, as a creature can receive, far surpassing all glory of Angels and other men] and hath given him [or freely gives. See chap. 1. ver. 29. whereby is meant that his exaltation came to pass according to the fathers will and pleasure] a name [thereby is understood not the bare name whereby he was distinguished from other men: for that he had also in the state of his humiliation, nor yet only the renown of his person, but the majesty and glory of the same. See Eph. 1. ver. 21.] which is above every name: [that is greatest and highest glory.]"}],"10":[{"catchword":null,"tekst":"That [Or so that] in the name of Jesus [that is, this Jesus Christ being thus glorified, and by reason of this glory] every knee should bow itself [that is, all reasonable creatures subject themselves, even his very enemies against their will. The Apostle here alludes to that which God saith, Isa. 45. 23. and applies the same here to Jesus Christ, as also Rom. 14. 11. These words then must not be understood properly, to wit, that when the name Jesus is named, men must bow their knees; as some through mis-understanding of this place, not without superstition, doe: for the Angels and wicked spirits, of whom here also i vation, [that is, give diligence, take pains, using the means which God hath ordained for the furthering of the same] with fear and trembling. [That is, with a lowly opinion of your selves, and with great and childlike carefulness, fearing left ye may do or omit anything , whereby you may provoke God to anger, or that may be an hindrance to your salvation. See of this phrase, Psal. 2. 11. 1 Cor. 2. 3. 2 Cor. 7. 15. Ephes. 6. 5. Heb. 12. 28. 1 Pet. 1. 17.]"}],"13":[{"catchword":null,"tekst":"For it is God who worketh in you [this is added here, that from this forgoing exhortation men should not think or conclude, that a man of himself and by his abilities, could work out salvation: See chap. 1.6. 2 Cor. 3.5. Jam. 1.17.] both the will [that is, not only the power to will, but also the will it self; powerfully inclining and bending the will to chuse the good, and so of unwilling making it willing by the power of the Holy Ghost. Joh 3:5. and 6.44. Rom. 9.16. 1 Pet. 1.3.] and the work [Or, good that men will] according to [his] good pleasure. [That is, not according to any foregoing good disposition or preparation, which he should fined in man, but according to his pleasure of pure grace. See Ephes. 1.5,9,11. and 2.8. 2 Tim. 1.9.]"}],"14":[{"catchword":null,"tekst":"do all things [Namely, which the Lord commands you, how difficult so ever it to be flesh] without murmuring [that is, willingly, and patiently] and gainsaying: [Or, contentious, ponderings, namely, whether ye shall do that which God commands or not. For the Greek word signifies, either in ones mind or with words, or dispute or argue to and again.]"}],"15":[{"catchword":null,"tekst":"That ye may be unblameable [That is, so that men may not justly blame your conversation. See Luk. 1.6. Ephes. 5.26,27.] and upright, [or simple, without guile. See Mat. 10.16.] children of God, being unreprovable in the midst of a crooked and perverse generation: [that is, unbelieving and unregenerate men. See Act 2:40.] amongst w // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
